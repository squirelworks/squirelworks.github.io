]}, {"id": "P2120", "text": ["8.  Set the PC1 DC Power switch to ON.", "8. Set the PC1 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2115"]}, {"id": "P2130", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ts."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["The microprocessor setup is complete.  Let's inject a fault into the system and see if we can find where this fault is affecting the  system.", "The microprocessor setup is complete. Let's inject a fault into the system and see if we can find where this fault is affecting the system."], "jumps": ["P2130"]}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P360", "text": [], "jumps": []}, {"id": "P400", "text": ["Would you throw away your computer if it was malfunctioning? No, you would probably get it repaired or try to repair it yourself. Most people would not throw away an expensive piece of equipment but rather give it to a technician to repair."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The technician would take the faulty equipment and find the problem.  Once the technician finds the fault, the equipment can be fixed.  Troubleshooting is a methodical approach to finding a fault and fixing it.", "The technician would take the faulty equipment and find the problem. Once the technician finds the fault, the equipment can be fixed. Troubleshooting is a methodical approach to finding a fault and fixing it."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The steps and approach to take while troubleshooting a microprocessor will be explained.  Understanding the troubleshooting techniques allows you to apply them to any troubleshooting needs.", "The steps and approach to take while troubleshooting a microprocessor will be explained. Understanding the troubleshooting techniques allows you to apply them to any troubleshooting needs..."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": [], "jumps": []}, {"id": "P2270", "text": ["14.  Press Enter and 3.    This will rerun the serial port test.  As               you can see, if you hadn't checked the serial portion of the             circuit you may have never noticed an error in the system               operation.", "14. Press Enter and 3. This will rerun the serial port test. As you can see, if you hadn't checked the serial portion of the circuit you may have never noticed an error in the system operation. ation."], "jumps": ["P2280", "P2260"]}, {"id": "P13065", "text": ["Let's begin the experiment on troubleshooting the 8086 microprocessor."], "jumps": ["P13070", "P13040"]}, {"id": "P13085", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions."], "jumps": ["P13090", "P13080"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["In order to troubleshoot, a technician must have an adequate understanding of both the equipment under test and the test         equipment being used.  However, this alone does not make a good technician.", "In order to troubleshoot, a technician must have an adequate understanding of both the equipment under test and the test equipment being used. However, this alone does not make a good technician."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["It is equally important for a technician to be methodical when troubleshooting.  The technician must always keep sight of the      overall troubleshooting task and yet, at the same time, be          attentive to details.", "It is equally important for a technician to be methodical when troubleshooting. The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to details."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Much time can be wasted if the technician jumps to conclusions without sufficient evidence.  In most cases, you will be given        equipment to troubleshoot with little information on the history     of that particular piece of equipment.", "Much time can be wasted if the technician jumps to conclusions without sufficient evidence. In most cases, you will be given equipment to troubleshoot with little information on the history of that particular piece of equipment."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Even if the user does supply a description of the fault symptoms, they may be vague or completely off base.  You must acquire and analyze the symptons for yourself before probing into the microprocessor for the cause.", "Even if the user does supply a description of the fault symptoms, they may be vague or completely off base. You must acquire and analyze the symptons for yourself before probing into the microprocessor for the cause."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["Occasionally, the fault may allow most of the microprocessor functions to work properly.  The symptons may be specific enough to assure the experienced technician that the essential functions are working correctly while allowing the technician to deduce which area is causing the problem.", "Occasionally, the fault may allow most of the microprocessor functions to work properly. The symptons may be specific enough to assure the experienced technician that the essential functions are working correctly while allowing the technician to deduce which area is causing the problem."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["In this case, the technician may choose to begin investigating the suspect area without going through a more detailed check of the essential system functions.  However, as a novice technician, you should be as thorough as possible in your observation of the essential functions.", "In this case, the technician may choose to begin investigating the suspect area without going through a more detailed check of the essential system functions. However, as a novice technician, you should be as thorough as possible in your observation of the essential functions."], "jumps": ["P1110", "P1040"]}, {"id": "P1110", "text": ["A fault in an essential function may be minor enough not to affect the basic system operations, yet be responsible for a less noticeable fault."], "jumps": ["P1120", "P1040"]}, {"id": "P1120", "text": ["Before you begin troubleshooting, think about the sections of the microprocessor and what role they play in the system             operation and consider these questions:", "Before you begin troubleshooting, think about the sections of the microprocessor and what role they play in the system operation and consider these questions:", "1. Which components are not necessary for the successful execution of and interaction with the monitor program? Disconnecting all nonessential assemblies may make the machine operational again. If this was the case, you can deduce that the fault was in one of the disconnected devices of the interfacing signals. 2. How can you check and determine that the system is starting correctly when power is applied? Which components are essential in starting the system? 3. How can you test and determine that the keyboard and display are working properly? 4. How can you test and determine that other peripheral devices are working correctly????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????"], "jumps": ["P1130", "P1040"]}, {"id": "P1130", "text": ["Once you are sure you understand all of the sections of the equipment you are going to be working on, then, and only then, should you begin to troubleshoot the piece of equipment.", "Once you are sure you understand all of the sections of the equipment you are going to be working on, then, and only then, should you begin to troubleshoot the piece of equipment. ould you begin troubleshooting."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["There are many troubleshooting techniques that you may use to locate faults in a microprocessor system.  The technique presented here is a simple four step process.", "There are many troubleshooting techniques that you may use to locate faults in a microprocessor system. The technique presented here is a simple four step process."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["Whether you use this method or another, the most important point is that you follow a logical sequence when troubleshooting.  This four step technique will help you become an observant, methodical technician.", "Whether you use this method or another, the most important point is that you follow a logical sequence when troubleshooting. This four step technique will help you become an observant, methodical technician."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Step 1. Analyze the System Compare the operation of a system to how it should operate. In other words, verify the symptoms. Do not rely on what someone else has told you is wrong. Duplicate the problem. This way, you can see for yourself what the equipment is or is not doing...-hand observations. Duplicate the problem. This way you can see with a trained eye what the equipment is doing or not doing."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["The important point in this step is that you ARE NOT trying to fix the fault, only determining the symptoms.  Once you have listed all the symptoms, go to Step 2.", "The important point in this step is that you ARE NOT trying to fix the fault, only determining the symptoms. Once you have listed all the symptoms, go to Step 2."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["Step 2. Recheck the Setup\nEnsure that you have set up the system and test equipment correctly.  Also, if you performed calculations in Step 1, verify the calculations are correct.", "Step 2. Recheck the Setup Ensure that you have set up the system and test equipment correctly. Also, if you performed calculations in Step 1, verify the calculations are correct. be performed in Step 1, make sure that you did the calculations correctly. Look for any obvious mistakes.", "Did you plug the system into a power source?", "Are you operating the system correctly????e?", "Is there power to the wall outlet?er source?", "Are you using the test equipment correctly??"], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["To sum up, this step is used to verify that the symptoms observed in Step 1 are the result of real faults, and not caused by incorrect system operation or misuse of test equipment."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["If the setup was not correct, make corrections and return to Step 1.  Also, watch for software problems that might appear to be hardware faults.  There could be nothing wrong with the hardware, just the software not properly instructing the hardware.", "If the setup was not correct, make corrections and return to Step 1. Also, watch for software problems that might appear to be hardware faults. There could be nothing wrong with the hardware, just the software not properly instructing the hardware."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Step 3. Measure and Test the System This is the step where you actually try to find the fault. Use the symptoms found in Step 1 to guide you to the area that could be causing the problem. Then use test equipment to measure and test the circuits. Once you think you have found the fault, go to Step 4."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Step 4. Double Check your Results After determining the possible fault, double check your work. Assuming you have found the correct fault, analyze the circuit with the suspected fault to determine if the fault could cause the symptoms you observed in Step 1."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["If the fault would definitely cause the symptom(s), or part of the symptoms (you could have more than one fault), you can be assured that you have correctly identified the problem.  Replace or repair the fault and repeat Step 1 to verify the equipment is 100% operational.", "If the fault would definitely cause the symptom(s), or part of the symptoms (you could have more than one fault), you can be assured that you have correctly identified the problem. Replace or repair the fault and repeat Step 1 to verify the equipment is 100% operational. bad components and repeat Step 1 to ensure the equipment is 100% operational."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["If the fault could not cause the symptoms, go back to Step 1 to ensure that you observed the correct symptoms and then go to Step 3 for more measurements and tests."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["Now that we have discussed the four step process of troubleshooting, let's discuss the proper handling of components found in a microprocessor system."], "jumps": ["P1260", "P1190"]}, {"id": "P1260", "text": ["When troubleshooting a microprocessor system, it is important to understand the sensitivity of the devices that you are handling.  Be extremely careful to avoid introducing additional faults that would further complicate your task.", "When troubleshooting a microprocessor system, it is important to understand the sensitivity of the devices that you are handling. Be extremely careful to avoid introducing additional faults that would further complicate your task."], "jumps": ["P1270", "P1190"]}, {"id": "P1270", "text": ["There are certain environmental limitations which govern the proper use and storage of a microprocessor system.", "There are certain environmental limitations which govern the proper use and storage of a microprocessor system. be stored and operated:", "1. The system should not be stored in a dusty environment. 2. The system should only be operated within the manufacturer's specified temperature limitations. 3. The system should always be plugged into a grounded outlet. 4. The system must not be operated near an unshielded power supply of other equipment. Strong emissions from power supplies can force crystals to vibrate at the wrong frequency. 5. The system should always be turned off before connecting or disconnecting hardware to the system........................"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Operating the system within the proper environmental limitations will help to prevent time consuming repairs in the future.", "Different precautions must be taken when handling various components of microprocessor circuits."], "jumps": ["P1290", "P1270", "P1300"]}, {"id": "P1300", "text": ["For example, a resistor may be hand carried, dropped, soldered onto a board using plenty of heat, and then have coffee spilled onto it, yet it still operates correctly in the circuit providing the coffee has dried!"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["However, you cannot handle CMOS ICs in the same way.   Incorrect handling of CMOS ICs can destroy them by exposing them to electrostatic discharges from the body.", "However, you cannot handle CMOS ICs in the same way. Incorrect handling of CMOS ICs can destroy them by exposing them to electrostatic discharges from the body."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["There are two types of ICs used in the 8086 microprocessor system:  CMOS and TTL.  CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic.", "There are two types of ICs used in the 8086 microprocessor system: CMOS and TTL. CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic. iconductors Technologiessssssssssssssssssssss"], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["These are two of the most common technologies used in the construction of ICs.  TTL chips can work at a higher speed but have high power consumption.  The CMOS is slower but uses less power than TTL.  CMOS is very susceptible to damage from static electricity.", "These are two of the most common technologies used in the construction of ICs. TTL chips can work at a higher speed but have high power consumption. The CMOS is slower but uses less power than TTL. CMOS is very susceptible to damage from static electricity."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock?  That electric shock you received was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock? That electric shock you received was 50,000 or more volts!"], "jumps": ["P1100", "P1320"]}, {"id": "P1341", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock?  That electric shock you received was 50,000 or  you received was 50,000 or more volts!"], "jumps": ["P1340"]}, {"id": "P1346", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock?  That electric shock you received was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock? That electric shock you received was 50,000 or more volts!"], "jumps": ["P1340"]}, {"id": "P1347", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock?  That electric shock you received was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock? That electric shock you received was 50,000 or more volts!"], "jumps": ["P1340"]}, {"id": "P1348", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock?  That electric shock you received was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and received an electric shock? That electric shock you received was 50,000 or more volts!"], "jumps": ["P1350", "P1340"]}, {"id": "P1350", "text": ["The reason that you don't get seriously injured from this shock is because there is very little current associated with it.  Current    kills, not voltage.  However, static voltages as small as 250 volts  can destroy or damage a CMOS chip.", "CAUTION! OBSERVE PRECAUTIONS FOR HANDLING ELECTROSTATIC SENSITIVE DEVICES............", "The reason that you don't get seriously injured from this shock is because there is very little current associated with it. Current kills, not voltage. However, static voltages as small as 250 volts can destroy or damage a CMOS chip."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Some options to use that helps prevent damage to CMOS devices:", "Some options to use that helps prevent damage to CMOS devices:::fhefor the preventing damage to CMOS chips are:", "* Raise the humidity of the room by using a humidifier, plants, or an aquarium. * Use antistatic carpeting and floor coverings. * Wear a grounded strap when handling CMOS devices. * Do not touch any more chips than you have to. * Do not touch the pins when handling the device. Try to hold the chip by the body only."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The following is a short summary of other component maintenance tips and precautions:", "CAPACITORS: Ceramics, mica, and tantalum capacitors are not polarized, however, electrolytic capacitors are. If a capacitor is cracked, replace it. Be sure to observe polarity when installing electrolytic capacitors. CRYSTALS: Crystal cases should be grounded. Crystals may be upset by strong emissions from the power supplies of other instruments and may vibrate at a different frequency because of this. DIODES: Polarity must be observed when installing these devices. FUSES: Don't rely only on a visual check; check fuses with an ohmmeter........................................................................."], "jumps": ["P1371", "P1360"]}, {"id": "P1371", "text": ["HEADERS: Check that the header pins are straight before plugging a cable into them. These are the large rectangular connectors that are used to connect different sections of the 8086 microprocessor system together. LEDs: LEDs are easily damaged by excessive soldering heat or by too much applied voltage or current. RESISTORS: Value and tolerance can be determined from their color bands or markings. Replace cracked or discolored resistors. While they are very rugged components, exceeding their designed power limitation can destroy them. Resistors have a power rating in watts. Typical resistors used in Nida circuits are 1/4 watt..............................................................................................."], "jumps": ["P1372", "P1370"]}, {"id": "P1372", "text": ["SOCKETS: Check that ICs are properly seated in their sockets and not tilted. When soldering sockets in place, first ensure that the socket is positioned flat against the circuit board and then solder the diagonally opposed socket corner pins in place. Now the remaining pins can easily be soldered in place. SWITCHES: Only clean with fluids approved for cleaning electronic devices. Do not use a pencil point to change rocker switch positions as contamination introduced between the switch contacts will impair its operation."], "jumps": ["P1380", "P1370"]}, {"id": "P1380", "text": ["Microprocessor systems use many integrated circuits.  These ICs look similar except for the number of pins and the labeling on the cases.  Pin number identification and proper IC placement are extremely important.", "Microprocessor systems use many integrated circuits. These ICs look similar except for the number of pins and the labeling on the cases. Pin number identification and proper IC placement are extremely important."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["IC identification codes vary depending on the manufacturer. Manufacturer recognition is important when replacing chips and researching IC data.  The following list describes some             identifying marks by which you can recognize the IC manufacturer.", "IC identification codes vary depending on the manufacturer. Manufacturer recognition is important when replacing chips and researching IC data. The following list describes some identifying marks by which you can recognize the IC manufacturer. APHICS TEXT) Motorola Letter M in a circle National Semiconductor Two parallel wavy lines Texas Instruments Outline of the state of Texas Other manufacturers may put their names on the ICs, like NEC or Toshiba.....", "Motorola Letter M in a circle National Semiconductor Two parallel wavy lines Texas Instruments Outline of the state of Texas turers may put their names on the ICs, like NEC or Toshiba..ases should be grounded. Crystals may be upset by strong emissions from the power supply of other instruments and may vibrate at a different frequency because of this. DIODES: Diodes must be put in the circuit with the correct polarity. FUSES: Don't rely on only visual check. Check fuses with an ohmmeter.", "Other manufacturers may put their names on the ICs, like NEC or Toshiba.."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Chip specifications can be looked up in the manufacturer's data books.  This information is very important when replacing an IC with one from a different manufacturer.", "Chip specifications can be looked up in the manufacturer's data books. This information is very important when replacing an IC with one from a different manufacturer."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The only way you can be sure a replacement IC is 100% compatible with the fit, form, and function of the original is to refer to the manufacturer's data books and compare the specifications for both chips.", "The only way you can be sure a replacement IC is 100% compatible with the fit, form, and function of the original is to refer to the manufacturer's data books and compare the specifications for both chips. ny data books provide a cross-reference for direct replacement of an IC built by a different manufacturer. urer. a different manufacturer. a different manufacturer."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Identification codes usually consist of three parts: a prefix number, a device number, and a suffix.  While each manufacturer uses a different type of code, in most cases the structure is similar to this.", "Identification codes usually consist of three parts: a prefix number, a device number, and a suffix. While each manufacturer uses a different type of code, in most cases the structure is similar to this. The only sure method to determine the type of IC is to use the manufacture's data books. , is similar to this."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["Many manufacturers include a date mark on the chip.  This date usually indicates the month and year the chip was made.  The date helps identify the chip, especially if the manufacturer changes the method used to identify the chip.", "Many manufacturers include a date mark on the chip. This date usually indicates the month and year the chip was made. The date helps identify the chip, especially if the manufacturer changes the method used to identify the chip. d to identify the chip. the manufacturer changes the method used to identify the chip. RAPHICS TEXT) Other types of marking may include: * Manufacturer's part number * Inspection Markings * Source of Supply * Manufacturing location", "Other types of marking may include: * Manufacturer's part number * Inspection markings * Source of supply * Manufacturing location Outline of the state of Texas turers may put their names on the ICs, like NEC or Toshiba..ases should be grounded. Crystals may be upset by strong emissions from the power supply of other instruments and may vibrate at a different frequency because of this. DIODES: Diodes must be put in the circuit with the correct polarity. FUSES: Don't rely on only visual check. Check fuses with an ohmmeter."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["Installing ICs requires special attention and sometimes special equipment.  Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are.", "Installing ICs requires special attention and sometimes special equipment. Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are....."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Because of this, most ICs are now placed in sockets with the sockets soldered to the PC board before the IC is inserted.  This way, IC chips can avoid heat related damage.", "Because of this, most ICs are now placed in sockets with the sockets soldered to the PC board before the IC is inserted. This way, IC chips can avoid heat related damage.way, IC chips can avoid heat-related damage."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Before trying to insert an IC, check that its legs are straight and evenly spaced.  ICs have a dimple, dot or notch used for orientation.  The pins are numbered starting at 1 and go counter clockwise from the orientation mark.", "Before trying to insert an IC, check that its legs are straight and evenly spaced. ICs have a dimple, dot or notch used for orientation. The pins are numbered starting at 1 and go counter clockwise from the orientation mark."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["Pin 1 of the IC should be inserted as shown below.  Remember, inserting a chip backwards can destroy the chip when power is    applied.", "Pin 1 of the IC should be inserted as shown below. Remember, inserting a chip backwards can destroy the chip when power is applied."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["To insert the IC, line up all its legs with the socket connectors then press it down gently.  Ensure all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of the way.", "To insert the IC, line up all its legs with the socket connectors then press it down gently. Ensure all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of the way."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["To remove an IC, lift up, being careful not to bend any pins.  This will require a rocking motion.  Ensure that one end of the IC is not completely removed before the other end because this will bend pins.", "To remove an IC, lift up, being careful not to bend any pins. This will require a rocking motion. Ensure that one end of the IC is not completely removed before the other end because this will bend pins."], "jumps": ["P1500", "P1440"]}, {"id": "P1500", "text": ["Most technicians, with practice, can insert and remove an IC by hand or with a screwdriver.  However, IC insertion and removal tools are available and should be used whenever possible.  These tools make insertion and removal simple, and greatly reduce the risk of damaging an IC.", "Most technicians, with practice, can insert and remove an IC by hand or with a screwdriver. However, IC insertion and removal tools are available and should be used whenever possible. These tools make insertion and removal simple, and greatly reduce the risk of damaging an IC."], "jumps": ["P1510", "P1440"]}, {"id": "P1510", "text": ["Integrated Circuits (ICs) should be _______", "Integrated Circuits (ICs) should be _______................", "always soldered directly to the PC board.", "have the pins bent in all different directions."], "jumps": ["P1500"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["Some ICs cannot be directly soldered to a PC board.  The heat from the soldering iron may be too intense and cause damage to the internal or external structure.  Also, chip sockets are used to allow quick and easy removal of a bad IC with a good one.", "Some ICs cannot be directly soldered to a PC board. The heat from the soldering iron may be too intense and cause damage to the internal or external structure. Also, chip sockets are used to allow quick and easy removal of a bad IC with a good one.........."], "jumps": []}, {"id": "P1513", "text": ["The pins of an IC should be moved AS LITTLE as possible.  It is easy to break one of the pins off of an IC.  Once a pin is broken, the IC is useless (unless that signal is not needed).", "The pins of an IC should be moved AS LITTLE as possible. It is easy to break one of the pins off of an IC. Once a pin is broken, the IC is useless (unless that signal is not needed)......."], "jumps": []}, {"id": "P1520", "text": ["Even though, troubleshooting is part of a technician's job, the frequency of equipment failures can be dramatically reduced by eliminating potential problems before they begin.  This is accomplished by a process called Preventive Maintenance.", "Even though, troubleshooting is part of a technician's job, the frequency of equipment failures can be dramatically reduced by eliminating potential problems before they begin. This is accomplished by a process called Preventive Maintenance."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["As the name implies, this maintenance is accomplished before the system has a chance to fail.  For example, suppose that your  microprocessor is operating correctly and there are no signs of    system failure.", "As the name implies, this maintenance is accomplished before the system has a chance to fail. For example, suppose that your microprocessor is operating correctly and there are no signs of system failure."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["However, you decide to measure the output voltages of the power supply. The measurements show that the power supply is outputting +8 volts to each chip instead of the normal +5 volts. Even though the system operates correctly, the output voltage may eventually damage some of the chips in the microprocessor system."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["So, at a convenient time, you readjust the power supply.  The action you performed was called preventive maintenance; you eliminated a problem which may have caused a system failure in the future.", "So, at a convenient time, you readjust the power supply. The action you performed was called preventive maintenance; you eliminated a problem which may have caused a system failure in the future."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["Another preventive maintenance action is routine cleaning.  Dust tends to stick to printed circuit boards.  When a printed circuit      board gets coated by a layer of dust, the dust becomes a thermal insulator and holds in the heat.  This heat build-up can cause components to fail prematurely.", "Another preventive maintenance action is routine cleaning. Dust tends to stick to printed circuit boards. When a printed circuit board gets coated by a layer of dust, the dust becomes a thermal insulator and holds in the heat. This heat build-up can cause components to fail prematurely."], "jumps": ["P1570", "P1520"]}, {"id": "P1570", "text": ["Dust, dirt, and other containments can also act as conductors which can cause arcing, shorts, and ultimately system failures."], "jumps": ["P1580", "P1520"]}, {"id": "P1580", "text": ["Troubleshooting Tools\nA computer repair technician must select tools which are appropriate to the troubleshooting task.  Often you will choose tools that you are familiar with.", "Troubleshooting Tools A computer repair technician must select tools which are appropriate to the troubleshooting task. Often you will choose tools that you are familiar with."], "jumps": ["P1590", "P1520"]}, {"id": "P1590", "text": ["However, it is just as important to know how to use other tools which can speed up the troubleshooting process. This section of the lesson will introduce you to other commonly used troubleshooting tools which you may not be familiar with. Detailed operating instructions, however, are beyond the scope of this lesson."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["In the experiment you will have the opportunity to use some of the troubleshooting tools discussed."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["Test Instruments\nIn your studies of electronics, you have learned that multimeters and oscilloscopes are invaluable in determining correct circuit operation and for troubleshooting faulted circuits.", "Test Instruments In your studies of electronics, you have learned that multimeters and oscilloscopes are invaluable in determining correct circuit operation and for troubleshooting faulted circuits."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["In each area of electronics, different types of test equipment provide the best means for circuit measurements.  Digital electronics is no exception.", "In each area of electronics, different types of test equipment provide the best means for circuit measurements. Digital electronics is no exception."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current and resistance.  In AC circuits,    the oscilloscope is invaluable for determining the characteristics  of waveforms.", "In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current and resistance. In AC circuits, the oscilloscope is invaluable for determining the characteristics of waveforms."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["In digital electronics, the oscilloscope and multimeter are used, along with several other types of test instruments."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["So far in this course, you may have already used a multimeter, oscilloscope, or a logic probe.  While these are very useful troubleshooting tools, it is important to be aware of other equally useful tools and their capabilities.", "So far in this course, you may have already used a multimeter, oscilloscope, or a logic probe. While these are very useful troubleshooting tools, it is important to be aware of other equally useful tools and their capabilities.gic probe depending on the equipment that you used in the experiments. However, you should know what other types of test equipment are available to you."], "jumps": ["P1660", "P1610"]}, {"id": "P1660", "text": ["The testing of digital circuitry differs from testing analog circuitry in several ways.", "* Digital circuits use low DC voltages. 0, 1.3, 3, 5, and 12 VDC are the most common voltages encountered. * Digital circuits normally do not have AC voltages present. * Digital circuits normally do not require resistance checks due to the self- contained nature of ICs. * Digital circuits often rely on timing; that is, the time relationship between two or more signals is critical for proper circuit operation. * Digital circuits use ICs. Since ICs cannot be repaired, measuring input and output signals is the trouble shooting method used..........................................................................."], "jumps": ["P1670", "P1610"]}, {"id": "P1670", "text": ["Because of these differences, several special types of digital test instruments have been developed.  Let's begin our discussion of digital circuit test equipment with a brief review of the multimeter, oscilloscope, and the logic probe.", "Because of these differences, several special types of digital test instruments have been developed. Let's begin our discussion of digital circuit test equipment with a brief review of the multimeter, oscilloscope, and the logic probe."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["Multimeter\nThe multimeter is the most commonly used test instrument in DC and AC circuits.  However, it is not the most commonly used test instrument in digital circuits.", "Multimeter The multimeter is the most commonly used test instrument in DC and AC circuits. However, it is not the most commonly used test instrument in digital circuits."], "jumps": ["P1690", "P1660"]}, {"id": "P1690", "text": ["Multimeters measure DC and AC voltages, DC and AC current and resistances.  Some even test transistors, diodes, and capacitors.", "Multimeters measure DC and AC voltages, DC and AC current and resistances. Some even test transistors, diodes, and capacitors."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["In digital electronics, multimeters are primarily used to measure operating power voltage (Vcc) and to check for open or shorted solder runs on printed circuit cards.  Vcc is normally a DC voltage between 1 and 12 volts.", "In digital electronics, multimeters are primarily used to measure operating power voltage (Vcc) and to check for open or shorted solder runs on printed circuit cards. Vcc is normally a DC voltage between 1 and 12 volts."], "jumps": ["P1710", "P1680"]}, {"id": "P1710", "text": ["PC card solder runs are checked by measuring circuit continuity between different points on the card.  Continuity indicates a  complete circuit; no continuity indicates an open solder run or connection.", "PC card solder runs are checked by measuring circuit continuity between different points on the card. Continuity indicates a complete circuit; no continuity indicates an open solder run or connection.......end in digital electronics is to use the lowest Vcc values that the chips can be made to run on. This helps reduce heat problems. Many circuits in development today are designed to run all the way down below 1 volt to represent a high condition."], "jumps": ["P1720", "P1680"]}, {"id": "P1720", "text": ["The trend in digital electronics is to use the lowest Vcc values that the chips can be made to operate with.  This help reduce heat problems.  Many circuits in development today are designed to operate below 1 volt, which represents a HIGH condition.", "The trend in digital electronics is to use the lowest Vcc values that the chips can be made to operate with. This help reduce heat problems. Many circuits in development today are designed to operate below 1 volt, which represents a HIGH condition."], "jumps": ["P1730", "P1680"]}, {"id": "P1730", "text": ["Logic highs and lows may also be measured using a multimeter. A high is normally between 2 and 12 VDC, while a low is between 0 and 2 VDC.  Remember, you must be aware of the IC family you are working with, CMOS or TTL for example.", "Logic highs and lows may also be measured using a multimeter. A high is normally between 2 and 12 VDC, while a low is between 0 and 2 VDC. Remember, you must be aware of the IC family you are working with, CMOS or TTL for example."], "jumps": ["P1740", "P1680"]}, {"id": "P1740", "text": ["Many ICs have a different range of values that represent a HIGH and LOW condition.  As long as the logic levels are constant, a multimeter will give an accurate reading of a HIGH or LOW.", "Many ICs have a different range of values that represent a HIGH and LOW condition. As long as the logic levels are constant, a multimeter will give an accurate reading of a HIGH or LOW. will give an accurate reading of HIGH or LOW. G"], "jumps": ["P1750", "P1680"]}, {"id": "P1750", "text": ["But, if the levels are changing, or are pulsed inputs or outputs, the multimeter is of little use.  Since there are more efficient ways to measure operating voltages and logic levels, the multimeter is normally reserved for checking circuit continuity and constant voltage levels, such as Vcc.", "But, if the levels are changing, or are pulsed inputs or outputs, the multimeter is of little use. Since there are more efficient ways to measure operating voltages and logic levels, the multimeter is normally reserved for checking circuit continuity and constant voltage levels, such as Vcc."], "jumps": ["P1760", "P1680"]}, {"id": "P1760", "text": ["Oscilloscopes \nThe oscilloscope is considerably more expensive than the multimeter, however, there are very few repair facilities that do not have at least one.", "Oscilloscopes The oscilloscope is considerably more expensive than the multimeter, however, there are very few repair facilities that do not have at least one."], "jumps": ["P1770", "P1680"]}, {"id": "P1770", "text": ["The oscilloscope displays a visual representation of an applied waveform and can be used to measure the characteristics of that waveform such as amplitude, period, and phase."], "jumps": ["P1780", "P1760"]}, {"id": "P1780", "text": ["The oscilloscope is a very versatile test instrument, particularly well suited for troubleshooting digital circuits.  The oscilloscope can detect abnormalities in waveforms that other instruments cannot.", "The oscilloscope is a very versatile test instrument, particularly well suited for troubleshooting digital circuits. The oscilloscope can detect abnormalities in waveforms that other instruments cannot."], "jumps": ["P1790", "P1760"]}, {"id": "P1790", "text": ["Characteristics such as amplitude, rise and fall times, pulse width, period, and frequency can be quickly determined with the aid of an oscilloscope."], "jumps": ["P1800", "P1760"]}, {"id": "P1800", "text": ["An oscilloscope can also be used to measure logic highs and lows as well as analyze the associated waveforms.  In addition, pulse waveforms and square waves can be measured.", "An oscilloscope can also be used to measure logic highs and lows as well as analyze the associated waveforms. In addition, pulse waveforms and square waves can be measured."], "jumps": ["P1810", "P1760"]}, {"id": "P1810", "text": ["A big advantage of using an oscilloscope with a dual trace function is that two waveforms can be measured at the same time.  Used in this way, the relationship of the two waveforms can be determined and analyzed.", "A big advantage of using an oscilloscope with a dual trace function is that two waveforms can be measured at the same time. Used in this way, the relationship of the two waveforms can be determined and analyzed.determined and analyzed. nalyzed. nd analyzed."], "jumps": ["P1820", "P1760"]}, {"id": "P1820", "text": ["However, oscilloscopes have one disadvantage when used with microprocessor systems.  Only one or two waveforms can usually be displayed at one time.  This disadvantage is overcome by using an oscilloscope multiplexer.", "Shown below is an oscilloscope which incorporates a 16 channel multiplexer.  The multiplexer allows up to 16 signals to be viewed on the oscilloscope simultaneously.  This is a great advantage when analyzing complex microprocessor functions such as the reading or writing of data.", "However, oscilloscopes have one disadvantage when used with microprocessor systems. Only one or two waveforms can usually be displayed at one time. This disadvantage is overcome by using an oscilloscope multiplexer.", "Shown below is an oscilloscope which incorporates a 16 channel multiplexer. The multiplexer allows up to 16 signals to be viewed on the oscilloscope simultaneously. This is a great advantage when analyzing complex microprocessor functions such as the reading or writing of data."], "jumps": ["P1830", "P1760", "P1840"]}, {"id": "P1840", "text": ["Also, signals viewed by the oscilloscope must be periodic.  In other words, in order for the oscilloscope to properly display the waveform(s), they must repeat themselves in the same pattern over and over.", "Also, signals viewed by the oscilloscope must be periodic. In other words, in order for the oscilloscope to properly display the waveform(s), they must repeat themselves in the same pattern over and over."], "jumps": ["P1850", "P1830"]}, {"id": "P1850", "text": ["Logic Probe\nThe logic probe is the least expensive of all digital test            instruments.  It was specifically designed for analyzing and troubleshooting digital circuits.  It should be noted that logic probes only measure logic levels, not actual DC values.", "Logic Probe The logic probe is the least expensive of all digital test instruments. It was specifically designed for analyzing and troubleshooting digital circuits. It should be noted that logic probes only measure logic levels, not actual DC values............................................................................................................................................................."], "jumps": ["P1860", "P1830"]}, {"id": "P1860", "text": ["The logic probe provides a simple means of determining the state of a logic signal: high, low, or pulsing.  The probe is nothing more than one or more LEDs that illuminate for certain types of signal inputs.", "The logic probe provides a simple means of determining the state of a logic signal: high, low, or pulsing. The probe is nothing more than one or more LEDs that illuminate for certain types of signal inputs."], "jumps": ["P1870", "P1850"]}, {"id": "P1870", "text": ["A logic probe can indicate a high signal, a low signal, single pulse, multiple pulses or an open or bad level. Even though the logic probe is very useful for detecting faults quickly, it normally must be used with other types of digital test instruments to locate problems that are more than just a missing or incorrect input."], "jumps": ["P1880", "P1850"]}, {"id": "P1880", "text": ["Logic Pulser/Current Tracer\nThe logic pulser and current tracer are test instruments that inject and trace a pulsing current in a circuit under test.  Their    appearance is very similar to the logic probe, and they are often    used in conjunction with the logic probe.", "Logic Pulser/Current Tracer The logic pulser and current tracer are test instruments that inject and trace a pulsing current in a circuit under test. Their appearance is very similar to the logic probe, and they are often used in conjunction with the logic probe.", "Logic Pulser/Current Tracerrrrrrrrrrrrrrrr"], "jumps": ["P1890", "P1850"]}, {"id": "P1890", "text": ["The logic pulser and current tracer are used to find points in a digital circuit that are stuck, that is, the point remains a logic 1 or 0 all the time.  It is particularly difficult to isolate a bad IC when several are connected together.  The logic pulser and current tracer make the job easier.", "The logic pulser and current tracer are used to find points in a digital circuit that are stuck, that is, the point remains a logic 1 or 0 all the time. It is particularly difficult to isolate a bad IC when several are connected together. The logic pulser and current tracer make the job easier."], "jumps": ["P3000", "P1880"]}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING.", "This completes the information on TROUBLESHOOTING.E........"], "jumps": ["P1001", "P3210"]}, {"id": "P1920", "text": ["1. The four step troubleshooting process is:", "1. The four step troubleshooting process is:d line here...."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Preventive maintenance is scheduled and unscheduled                  servicing of equipment in an effort to reduce future                            equipment failures.", "2. Preventive maintenance is scheduled and unscheduled servicing of equipment in an effort to reduce future equipment failures."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Troubleshooting tools fall under two categories: Test                        Instruments and Non-Test Instruments.", "3. Troubleshooting tools fall under two categories: Test Instruments and Non-Test Instruments."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Test instruments used in troubleshooting are: the Multimeter,         the Oscilloscope, Logic Probes, Logic Analyzers, Signature          Analyzers, Logic Pulser/Current Tracer, and Logic Clips.", "4. Test instruments used in troubleshooting are: the Multimeter, the Oscilloscope, Logic Probes, Logic Analyzers, Signature Analyzers, Logic Pulser/Current Tracer, and Logic Clips."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Non-Test instruments used in troubleshooting are: Visual              Inspections and Diagnostic Routines.", "5. Non-Test instruments used in troubleshooting are: Visual Inspections and Diagnostic Routines."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": ["In this experiment, you will troubleshoot a microprocessor system.", ". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson.  In each   case, you will check the system to see if anything isn't working.", "You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson. In each case, you will check the system to see if anything isn't working."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["If a fault is discovered, certain steps must be performed to isolate the fault to a particular region of the microprocessor system."], "jumps": ["P2065", "P2040"]}, {"id": "P2065", "text": ["Let's begin the experiment on troubleshooting the 8086 microprocessor."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1.  Set the test console controls to their initial control setting.", "1. Set the test console controls to their initial control setting........."], "jumps": ["P2040"]}, {"id": "P2090", "text": ["4. Connect the 4 experiment cards with the ribbon cables as follows: a. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. b. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. c. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P2085"]}, {"id": "P13070", "text": ["1.  Set the test console controls to their initial control setting.", "1. Set the test console controls to their initial control setting........."], "jumps": ["P13040"]}, {"id": "P13190", "text": ["10.  On the keyboard of the 8086 microprocessor system, enter 0         and then 1.", "5.  Set the Positive DC Power Supply to 5 Volts.", "10. On the keyboard of the 8086 microprocessor system, enter 0 and then 1.", "5. Set the Positive DC Power Supply to 5 Volts.30A - Set the PC1 DC Switch to ON...."], "jumps": ["P13200"]}, {"id": "P2110", "text": ["6.  Set the PC3 DC Power switch to ON.", "6. Set the PC3 DC Power switch to ON.to ON.. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2115", "text": ["7.  Set the PC2 DC Power switch to ON.", "7. Set the PC2 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2110"]}, {"id": "P2120", "text": ["8.  Set the PC1 DC Power switch to ON.", "8. Set the PC1 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2115"]}, {"id": "P2130", "text": ["9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ts."], "jumps": ["P2140", "P2120"]}, {"id": "P2250", "text": ["In this case there is an open transmit line.  Let's fix the fault and see if the problem is removed.", "In this case there is an open transmit line. Let's fix the fault and see if the problem is removed. o ON........................................."], "jumps": ["P2240", "P2260"]}, {"id": "P2190", "text": ["10.  On the keyboard of the 8086 microprocessor system, enter\n        0 and then 1.", "10. On the keyboard of the 8086 microprocessor system, enter 0 and then 1............"], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["At this point you should see a status bar on the LCD display.  The microprocessor is checking all memory locations.  So far, it seems as though the keyboard and display are working properly.", "At this point you should see a status bar on the LCD display. The microprocessor is checking all memory locations. So far, it seems as though the keyboard and display are working properly."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Wait until the memory scanning utility has stopped.  No errors in memory should be indicated.  This program is a diagnostic routine written for a quick easy method for testing the system RAM.  Imagine testing all 64 thousand locations by hand!", "Wait until the memory scanning utility has stopped. No errors in memory should be indicated. This program is a diagnostic routine written for a quick easy method for testing the system RAM. Imagine testing all 64 thousand locations by hand!"], "jumps": ["P2220", "P2200"]}, {"id": "P2230", "text": ["11. Press the Reset button on the PC130-410 card. On the keypad, press 0 and then 3. Connect a jumper between pins 3 and 4 (J6 - serial port connector) as indicated by the display......................"], "jumps": ["P2235", "P2220"]}, {"id": "P2235", "text": ["12.  Press Enter.  The display indicates that the serial port test              failed.  If  a fault was not present the display would have                  indicated \"TEST PASS\".", "12. Press Enter. The display indicates that the serial port test failed. If a fault was not present the display would have indicated \"TEST PASS\"."], "jumps": ["P2240", "P2230"]}, {"id": "P2240", "text": ["The serial port test checks the transmit and receive functions throughout the system.  There could be many reasons why the serial port test failed: bad cabling between the cards, defective parts, parts failure, shorts between pins or solder runs or simply an IC not being fully seated.", "The serial port test checks the transmit and receive functions throughout the system. There could be many reasons why the serial port test failed: bad cabling between the cards, defective parts, parts failure, shorts between pins or solder runs or simply an IC not being fully seated."], "jumps": ["P2250", "P2235"]}, {"id": "P2260", "text": ["13. The computer will now remove the fault. removed. o ON........................................."], "jumps": ["P2250"]}, {"id": "P13230", "text": ["11. Press the Reset button on the PC130-410 card. On the keypad, press 0 and then 3. Connect a jumper between pins 3 and 4 (J6 - serial port connector) as indicated by the display....."], "jumps": ["P13235", "P13220"]}, {"id": "P2290", "text": ["Now that you have seen how a fault can potentially go undetected, let's see one that definitely cannot.  The computer will now inject a fault.", "Now that you have seen how a fault can potentially go undetected, let's see one that definitely cannot. The computer will now inject a fault."], "jumps": ["P2280"]}, {"id": "P2280", "text": ["Errors like this may go undetected for some time if that function of the microprocessor isn't utilized.  With most possible faults, you would go through the list one by one, performing the easiest checks first before proceeding to the harder ones.", "Errors like this may go undetected for some time if that function of the microprocessor isn't utilized. With most possible faults, you would go through the list one by one, performing the easiest checks first before proceeding to the harder ones."], "jumps": ["P2290", "P2270"]}, {"id": "P2300", "text": ["12.  Press RESET on the 8086 Microprocessor system.", "12.  Press RESET on the 8086 Microprocessor system.", "12. Press RESET on the 8086 Microprocessor system.PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2290", "P2310"]}, {"id": "P2310", "text": ["13.  Press 0 and 1 on the 8086 Keyboard.", "13. Press 0 and 1 on the 8086 Keyboard...................."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["The display should be displaying data, however, it is incoherent.  Basically, something is causing the system to display incorrect data.", "The display should be displaying data, however, it is incoherent. Basically, something is causing the system to display incorrect data. be displayed on the screen of the system."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["In this situation, the A1 line from the microprocessor has an open just before it reaches the display circuitry.  This causes the address values sent to the display circuitry to be incorrect.", "In this situation, the A1 line from the microprocessor has an open just before it reaches the display circuitry. This causes the address values sent to the display circuitry to be incorrect."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Let's manually bypass this problem and see if it fixes the problem.", "Let's manually bypass this problem and see if it fixes the problem. fixes the problem."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["14.  Connect a jumper from the A1 test point (TPB4) on the                      PC130-410 card to the A1 test point (located to the right of               the display) on the PC130-404 card.", "14. Connect a jumper from the A1 test point (TPB4) on the PC130-410 card to the A1 test point (located to the right of the display) on the PC130-404 card. keyboard unit."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["15.  Press reset, 0, and 1.  REMOVE the wire while the progress             line is changing.", "15. Press reset, 0, and 1. REMOVE the wire while the progress line is changing."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["The display should stop working.  We have essentially simulated an intermittent fault, possibly caused by a small break in a circuit card solder run.  Frequently, an intermittent of this type will only show itself when the circuit is either hot or cold, due to the thermal expansion and contraction of the circuit materials.", "The display should stop working. We have essentially simulated an intermittent fault, possibly caused by a small break in a circuit card solder run. Frequently, an intermittent of this type will only show itself when the circuit is either hot or cold, due to the thermal expansion and contraction of the circuit materials. contraction of metal due to temperature changes."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["In some cases, in order to identify a fault or to ensure reliability, it may be necessary to leave the system on for an extended period of time.  If the system does contain an itermittent fault, it will usually show up during this time.  This is usually referred to as a burn-in.", "In some cases, in order to identify a fault or to ensure reliability, it may be necessary to leave the system on for an extended period of time. If the system does contain an itermittent fault, it will usually show up during this time. This is usually referred to as a burn-in. burn-in, to make sure some faults don't occur after the system has been on for long periods of time."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["What you have seen in this experiment are examples of typical faults you may encounter while working with microprocessor systems.  You were able to see how they can be detected and what type of symptoms they exhibit.", "What you have seen in this experiment are examples of typical faults you may encounter while working with microprocessor systems. You were able to see how they can be detected and what type of symptoms they exhibit..."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["As you gain experience in troubleshooting microprocessor systems, certain faults will become easy to detect."], "jumps": ["P2480", "P2390"]}, {"id": "P2480", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2400"]}, {"id": "P2490", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2480"]}, {"id": "P2500", "text": ["3.  Return all test equipment to their designated storage area.", "3. Return all test equipment to their designated storage area.."], "jumps": ["P2910", "P2490"]}, {"id": "P2910", "text": ["This completes the experiment on TROUBLESHOOTING THE 8086 MICROPROCESSOR."], "jumps": ["P2001", "P2500"]}, {"id": "P3000", "text": ["The logic pulser is used to inject a pulsating signal, (square wave), into the circuit if normal signal levels are constant.  The current tracer is used to trace the current paths through the circuit.", "The logic pulser is used to inject a pulsating signal, (square wave), into the circuit if normal signal levels are constant. The current tracer is used to trace the current paths through the circuit."], "jumps": ["P3010", "P1880"]}, {"id": "P3010", "text": ["An LED on the current tracer illuminates when the signal at a particular point is pulsing.  No LED illumination indicates a         fault and, by signal tracing, the bad component can be located.", "Logic Analyzer\nThe logic analyzer is basically a special type of multichannel        oscilloscope used for displaying and analyzing complex logic signals and pulse trains.  The analyzer can display these signals in several different formats.", "Logic analyzers, because of their expense, are generally only used to analyze complex digital circuits, where their expense can be justified.", "An LED on the current tracer illuminates when the signal at a particular point is pulsing. No LED illumination indicates a fault and, by signal tracing, the bad component can be located.", "Logic Analyzer The logic analyzer is basically a special type of multichannel oscilloscope used for displaying and analyzing complex logic signals and pulse trains. The analyzer can display these signals in several different formats.Logic analyzers, because of their expense, are generally only used to analyze complex digital circuits, where their expense can be justified.", "Logic analyzers, because of their expense, are generally only used to analyze complex digital circuits, where their expense can be justified. nd pulse trains. The analyzer can display these signals in several different formats. Logic analyzers, because of their expense, are generally only used to analyze complex digital circuits, where their expense can be justified."], "jumps": ["P3020", "P1880", "P3025", "P3030"]}, {"id": "P3030", "text": ["One type of format is the TIMING DIAGRAM.  Several pulse waveforms are displayed in the correct time relationship.  Dual channel oscilloscopes, can only display two waveforms.  Logic analyzers can display many, depending on the make and model.", "One type of format is the TIMING DIAGRAM. Several pulse waveforms are displayed in the correct time relationship. Dual channel oscilloscopes, can only display two waveforms. Logic analyzers can display many, depending on the make and model."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The second type of format is the BIT or BIT PATTERN.  A sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors.  Oscilloscopes and logic probes cannot do this.", "The second type of format is the BIT or BIT PATTERN. A sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors. Oscilloscopes and logic probes cannot do this."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["Another type of format that may be included on some logic analyzers is the CODED format.  The coded format changes ones and zeros to either octal or hexadecimal code.", "Another type of format that may be included on some logic analyzers is the CODED format. The coded format changes ones and zeros to either octal or hexadecimal code."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["The code for a particular point in a circuit can then be compared to a given code in a technical manual or to code present in a          functional circuit.  Any difference between the measured code and the reference code indicates a fault.", "The code for a particular point in a circuit can then be compared to a given code in a technical manual or to code present in a functional circuit. Any difference between the measured code and the reference code indicates a fault."], "jumps": ["P3020"]}, {"id": "P3070", "text": ["Signature Analyzer\nThe signature analyzer is somewhat like the logic analyzer without the waveform display.  It uses the coded format by measuring pulse trains of highs and lows.", "Signature Analyzer The signature analyzer is somewhat like the logic analyzer without the waveform display. It uses the coded format by measuring pulse trains of highs and lows."], "jumps": ["P3020"]}, {"id": "P3080", "text": ["Signature analyzers are used to locate faults to the component level in microprocessor based systems."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["The instrument converts a series of ones and zeros at a given test point to hexadecimal code.  The code is called the signature for that particular test point.  Then, by comparing the signature to the known signature, you can identify faults.", "The instrument converts a series of ones and zeros at a given test point to hexadecimal code. The code is called the signature for that particular test point. Then, by comparing the signature to the known signature, you can identify faults."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["Again, the signature analyzer is only used in very complex circuits where the cost of the instrument can be justified."], "jumps": ["P3070"]}, {"id": "P3110", "text": ["Logic Clip The logic clip is a simple tool used to determine logic levels on an IC. The clip is attached to an IC where it makes contact with each pin. On the logic clip are LEDs or lamps, one for each pin connection of the IC."], "jumps": ["P3070"]}, {"id": "P3120", "text": ["The LED or lamp illuminates when a high is present and is off for a low. A pulse is identified by a dimly illuminated LED or lamp, depending on the frequency of the pulse. Logic clips are of limited value today because many digital circuits change states so rapidly, they appear to be constantly on when in fact they are turning on and off.ay are changing states so rapidly, the lights appear to be constantly ON, even though they are actually turning ON and OFF rapidly."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["Non-Test Instruments\nWhile test instruments provide vital information concerning the operation of  the microprocessor and associated circuits, there are other tools technicians can use to make their jobs easier.", "Non-Test Instruments While test instruments provide vital information concerning the operation of the microprocessor and associated circuits, there are other tools technicians can use to make their jobs easier."], "jumps": ["P3110"]}, {"id": "P3140", "text": ["Visual Inspection\nVisual inspections must be performed carefully before, during, and after troubleshooting.  A thorough visual inspection can identify electrical, mechanical, or heat related problems as well as problems resulting from misuse.", "Visual Inspection Visual inspections must be performed carefully before, during, and after troubleshooting. A thorough visual inspection can identify electrical, mechanical, or heat related problems as well as problems resulting from misuse."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Before you begin measuring circuit values with test instruments, look for damaged components.  A burned resistor is a strong evidence of a power supply or transistor problem, or some other failed active component.", "Before you begin measuring circuit values with test instruments, look for damaged components. A burned resistor is a strong evidence of a power supply or transistor problem, or some other failed active component."], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["After troubleshooting and repair, do another visual inspection to ensure that the repair process did not cause any damage to the    system, such as lifted solder runs, ICs or transistors not seated in their sockets properly, or drops of solder that might cause a short.", "After troubleshooting and repair, do another visual inspection to ensure that the repair process did not cause any damage to the system, such as lifted solder runs, ICs or transistors not seated in their sockets properly, or drops of solder that might cause a short."], "jumps": ["P3170", "P3130"]}, {"id": "P3170", "text": ["Diagnostic Routines\nDiagnostic routines are programs used in the microprocessor to test  the system.  These programs are normally supplied by the system manufacturer.  If not, and you know how to program a microprocessor, your own diagnostic routines can be written.", "Diagnostic Routines Diagnostic routines are programs used in the microprocessor to test the system. These programs are normally supplied by the system manufacturer. If not, and you know how to program a microprocessor, your own diagnostic routines can be written."], "jumps": ["P3180", "P3130"]}, {"id": "P3180", "text": ["The only disadvantage of diagnostic programs is that the microprocessor system must operate well enough to load or execute a program.  The advantage of diagnostic routines is time saving.", "The only disadvantage of diagnostic programs is that the microprocessor system must operate well enough to load or execute a program. The advantage of diagnostic routines is time saving."], "jumps": ["P3190", "P3130"]}, {"id": "P3190", "text": ["Most diagnostic programs will, at a minimum, identify what section is faulted.  Some diagnostic routines even identify which components are faulted.  No troubleshooting required!", "Most diagnostic programs will, at a minimum, identify what section is faulted. Some diagnostic routines even identify which components are faulted. No troubleshooting required!"], "jumps": ["P3195", "P3130"]}, {"id": "P3195", "text": ["Still, diagnostic routines should not be assumed to be 100% accurate.  The technician should always verify the results of any software based diagnostics before replacing components.  This is not necessary for board level replacement work.", "Still, diagnostic routines should not be assumed to be 100% accurate. The technician should always verify the results of any software based diagnostics before replacing components. This is not necessary for board level replacement work..."], "jumps": ["P3200", "P3130"]}, {"id": "P3200", "text": ["Now that you have been introduced to the concepts and tools of troubleshooting, let's begin the experiment on troubleshooting the 8086 microprocessor."], "jumps": ["P3210", "P3130"]}, {"id": "P3210", "text": ["A program in the computer which checks to see that all the memory locations of RAM are working is known as a _______"], "jumps": ["P3130"]}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3212", "text": ["A visual inspection is where you inspect parts for physical damage.  This program looks inside where you cannot see to see if it is operating properly.", "A visual inspection is where you inspect parts for physical damage. This program looks inside where you cannot see to see if it is operating properly........."], "jumps": []}, {"id": "P3213", "text": ["When started most computer systems use a program to test memory.  Memory doesn't go bad that often, but when it does, it can totally destroy data being accessed.  To avoid this, the computer scans the memory before you even get a chance to use it.", "When started most computer systems use a program to test memory. Memory doesn't go bad that often, but when it does, it can totally destroy data being accessed. To avoid this, the computer scans the memory before you even get a chance to use it..............."], "jumps": []}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P5002", "text": [], "jumps": []}, {"id": "P5003", "text": [], "jumps": []}, {"id": "P5004", "text": [], "jumps": []}, {"id": "P5005", "text": [], "jumps": []}, {"id": "P6000", "text": [], "jumps": []}, {"id": "P6001", "text": [], "jumps": []}, {"id": "P6002", "text": [], "jumps": []}, {"id": "P6003", "text": [], "jumps": []}, {"id": "P6004", "text": [], "jumps": []}, {"id": "P6005", "text": [], "jumps": []}, {"id": "P6006", "text": [], "jumps": []}, {"id": "P6007", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["When troubleshooting, which of these four steps should be performed first?"], "jumps": []}, {"id": "P10211", "text": ["Which of the following is considered as part of rechecking the setup?"], "jumps": []}, {"id": "P10212", "text": ["Which of the following would not be good in a troubleshooting environment?"], "jumps": []}, {"id": "P10213", "text": ["Which components are known to be static sensitive?"], "jumps": []}, {"id": "P10214", "text": ["Which procedure would not be considered Preventive Maintenance?", "Periodically hitting device to make sure components aren't loose.", "Removing dust from inside and outside of device. A", "Checking certain voltage levels within the system.", "Visually inspecting device for failed or defective components."], "jumps": []}, {"id": "P10215", "text": ["Which would be the most economical device to use to measure the supply voltage of a system?"], "jumps": []}, {"id": "P10216", "text": ["Which device will provide a visual display of time versus voltage of one or more signals?"], "jumps": []}, {"id": "P10217", "text": ["What device connects to an IC and contains an LED or lamp representing each pin of the IC?each pin it represents from the IC that it is attached to?"], "jumps": []}, {"id": "P10218", "text": ["Which device is inexpensive and indicates a high, low, or pulsing condition of a logic level, but does not indicate actual voltage levels?"], "jumps": []}, {"id": "P10219", "text": ["A short portion of the code built into a system that is used to help determine if something is working properly is called a _______"], "jumps": []}, {"id": "P10220", "text": ["Which pieceof test equipment is used to detect waveform abnormalties? on?"], "jumps": []}, {"id": "P10221", "text": ["When checking Integrated Circuits, which visual problem may
