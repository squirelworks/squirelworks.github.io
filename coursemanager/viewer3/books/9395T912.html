const book = {"title": "9395T912", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: SSB ANALYSISdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Analyze the SSB transmitter and receiver schematic.", "w Examine the SSB transmitter and receiver circuits."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 453 XXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["10. Nida Model 410 Multifunction Counter", "12. Nida Model 488 or Equivalent XXXXXXXXXnt"], "jumps": []}, {"id": "P302", "text": ["14. BNC to Alligator Clip Cable e (2)", "15. Alligator to Alligator 18\" Cable (2)"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P333", "text": [], "jumps": []}, {"id": "P334", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P400", "text": ["As with any electronic equipment, an analysis of the circuitry is necessary for full understanding of how the system operates."], "jumps": ["P410", "P302"]}, {"id": "P410", "text": ["For a technician, this is important.  It's nearly impossible to effectively troubleshoot any equipment if you don't know how it works.", "For a technician, this is important. It's nearly impossible to effectively troubleshoot any equipment if you don't know how it works."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["SSB communication systems are no different than any other piece of  equipment when troubleshooting.  Many of the components and circuit functions of SSB systems are identical to AM Broadcast formats but there are major differences that must be explored and understood.", "SSB communication systems are no different than any other piece of equipment when troubleshooting. Many of the components and circuit functions of SSB systems are identical to AM Broadcast formats but there are major differences that must be explored and understood."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on SSB ANALYSIS...................................."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Transmitter Operations: The first thing you may have noticed about the NIDA SSB Communication System is that it contains 6 individual PC130 cards."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Unlike AM and FM broadcast signals, and even CB, SSB signals are not an abundant RF component of our airspace.  Because of this, you have been given cards that generate SSB signals, either with voice or signal generator.", "Unlike AM and FM broadcast signals, and even CB, SSB signals are not an abundant RF component of our airspace. Because of this, you have been given cards that generate SSB signals, either with voice or signal generator."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["You may also have noticed that there is no channel selector or other tuning device.  Located on the PC130-450 card are a microphone and several switches.", "You may also have noticed that there is no channel selector or other tuning device. Located on the PC130-450 card are a microphone and several switches."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The condenser microphone is your input device for voice generated audio and the switches provide a choice for external generator or internal 400 or 1 kHz audio tones from an on-board signal generator.", "Looking first at the schematic for the PC130-450 card, we'll begin with X1, the condenser microphone."], "jumps": ["P1060", "P1040", "P1070"]}, {"id": "P1070", "text": ["Sound enters the microphone and is converted to AF.  The signal then enters the audio amplifier, U1, at Pin 3.  The sensitivity of the amplifier is adjustable at the variable resistor, R10.", "Sound enters the microphone and is converted to AF. The signal then enters the audio amplifier, U1, at Pin 3. The sensitivity of the amplifier is adjustable at the variable resistor, R10."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Having been amplified, the signal leaves U1 at Pin 6 and is sent to S2.  This switch allows you to select between the signal generator and the microphone.  With the switch in the microphone position, the signal then is routed to S3.", "Having been amplified, the signal leaves U1 at Pin 6 and is sent to S2. This switch allows you to select between the signal generator and the microphone. With the switch in the microphone position, the signal then is routed to S3."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["S3 is marked as Ext./Int.  When the switch is in the internal position the signal produced by either the microphone or the\non-board signal generator is allowed to pass on to Pin T.", "S3 is marked as Ext./Int. When the switch is in the internal position the signal produced by either the microphone or the on-board signal generator is allowed to pass on to Pin T."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["Pin T is the output of the card and feeds to Pin E, PC130-451 card.  When S3 is in the \"EXT\" position, an external generator can be used, providing a source of greater flexibility than the options from the on-board generator.", "Pin T is the output of the card and feeds to Pin E, PC130-451 card. When S3 is in the \"EXT\" position, an external generator can be used, providing a source of greater flexibility than the options from the on-board generator."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["Before moving on to the PC130-451 card, a quick overview of the signal generator circuitry is desirable.  U2 is the heart of the generator and, by itself, is nothing more than a differential amplifier.", "Before moving on to the PC130-451 card, a quick overview of the signal generator circuitry is desirable. U2 is the heart of the generator and, by itself, is nothing more than a differential amplifier."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["U2, Pin 7, is the input for the positive voltage and is configured in a feedback loop from the output.  When switch S1 is in the up (400 Hz) position, resistors R5 and R7 are selected.  These resistors, in conjunction with C7 and C10, develop a 400 Hz signal.", "U2, Pin 7, is the input for the positive voltage and is configured in a feedback loop from the output. When switch S1 is in the up (400 Hz) position, resistors R5 and R7 are selected. These resistors, in conjunction with C7 and C10, develop a 400 Hz signal."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["When S1 is in the down (1 kHz) position, resistors R6 and R8 are connected to the circuit and with C10 and C7, produce a 1 kHz signal."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Were it not for D1, D2, and R9, both the 400 Hz and 1 kHz signals would be square waves.  However, with the presence of those components, the square wave is converted to a sine wave.", "Were it not for D1, D2, and R9, both the 400 Hz and 1 kHz signals would be square waves. However, with the presence of those components, the square wave is converted to a sine wave."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["When the signal leaves the PC130-450 card, it enters the \nPC130-451card at Pin E.  At this point in the generation process, the signal isn't quite strong enough and must be amplified.", "When the signal leaves the PC130-450 card, it enters the PC130-451card at Pin E. At this point in the generation process, the signal isn't quite strong enough and must be amplified."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["This job is performed by U1.  The audio enters U1 at Pin 3.  U1 can be trimmed by adjusting the variable resistor R1.  After amplification, the audio (modulating signal) is now ready to be mixed with the control signal.", "This job is performed by U1. The audio enters U1 at Pin 3. U1 can be trimmed by adjusting the variable resistor R1. After amplification, the audio (modulating signal) is now ready to be mixed with the control signal."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The control signal (sometimes referred to as a sub-carrier) is accomplished by Y1 and U2.  Y1 is a 1.8432 MHz crystal oscillator tied to the on-board oscillator amp within U2, a 14 bit binary ripple counter.", "The control signal (sometimes referred to as a sub-carrier) is accomplished by Y1 and U2. Y1 is a 1.8432 MHz crystal oscillator tied to the on-board oscillator amp within U2, a 14 bit binary ripple counter."], "jumps": ["P1180", "P1150", "Phase"]}, {"id": "P1180", "text": ["The frequency output of the counter at U2, Pin 6 has been divided down to 14.4 kHz and can be measured at TP3."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["In order for the mixer operation to take place, four different phases must be developed.  This task is performed by the two \nD Flip/Flops, U3a and U3b.", "In order for the mixer operation to take place, four different phases must be developed. This task is performed by the two D Flip/Flops, U3a and U3b."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Through the use of feedback and the Q's and Q's, four separate phases are created, each a 90\u00b0 shift apart.  That is, 0, 90, 180, and 270 degrees.", "Through the use of feedback and the Q's and Q's, four separate phases are created, each a 90", "shift apart. That is, 0, 90, 180, and 270 degrees.."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["These signals can be measured and viewed on an oscilloscope at test points 4, 5, 6, and 7."], "jumps": ["P1215", "P1190"]}, {"id": "P1215", "text": ["The 90 degree shifted signals should appear similar to the waveforms shown in the timing diagram below.", "From the two D F/F's, the signal (having been split into four separate phases) enters two mixers.  While there is mixing action taking place, the primary purpose of this circuit is to ensure a 90 degree phase shift in the signal between TP9 and TP8.", "From the two D F/F's, the signal (having been split into four separate phases) enters two mixers. While there is mixing action taking place, the primary purpose of this circuit is to ensure a 90 degree phase shift in the signal between TP9 and TP8."], "jumps": ["P1220", "P1190", "P1230", "P1215"]}, {"id": "P1230", "text": ["Each mixer is made up of four analog switches and a transformer.  This first mixer consists of U4a through U4d and T1, the second, U5a through U5d and T2.", "Each mixer is made up of four analog switches and a transformer. This first mixer consists of U4a through U4d and T1, the second, U5a through U5d and T2."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Each switch uses a control line to allow the switch to pass the signal.  When the control line is high, the switch closes and the signal passes.  Conversely, when the control line is low, the switch opens and there is not output.", "Each switch uses a control line to allow the switch to pass the signal. When the control line is high, the switch closes and the signal passes. Conversely, when the control line is low, the switch opens and there is not output."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["When the switch is closed, the control signal is also passed; mixing with the audio signal.  The result of the digital control signal and the analog input is shown below.", "When the switch is closed, the control signal is also passed; mixing with the audio signal. The result of the digital control signal and the analog input is shown below."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["Upon leaving the PC130-451 card, the two signals (shifted by 90 degrees) enter the PC130-452 card at Pins E and D.  All circuitry between Pin E and TP1 make up an active low-pass filter.", "Upon leaving the PC130-451 card, the two signals (shifted by 90 degrees) enter the PC130-452 card at Pins E and D. All circuitry between Pin E and TP1 make up an active low-pass filter."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Identical circuitry can be seen between Pin D and TP4. The purpose of the filters is to smooth out the signal coming from the previous stage."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The filtering effect can easily be viewed by placing one scope probe on Pin E of PC130-452 and a second probe on TP1."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The 90 degree phase shift remains, but the decidedly digital appearance of the signal, before the filter, is converted to a more analogous waveform once passing through it.  After being \"smoothed\", the signals are prepared for mixing with the carrier.", "The 90 degree phase shift remains, but the decidedly digital appearance of the signal, before the filter, is converted to a more analogous waveform once passing through it. After being \"smoothed\", the signals are prepared for mixing with the carrier."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["IC2 is the 40 MHz carrier oscillator.  From its output at Pin 4, the signal is used as a clock for the D F/F divider circuit.", "IC2 is the 40 MHz carrier oscillator. From its output at Pin 4, the signal is used as a clock for the D F/F divider circuit."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["This circuit is used in the same way that the divider on \nPC130-451 is used to develop four phases of the same signal, \n90 degrees apart.  In the process, however, the frequency is divided down to 10 MHz.", "This circuit is used in the same way that the divider on PC130-451 is used to develop four phases of the same signal, 90 degrees apart. In the process, however, the frequency is divided down to 10 MHz."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The separate phases can be measured at TP2, TP3, U6a Pin 5 and U6b Pin 8.  The 180 and 270 degree shifted signals are not used, only the 0 and 90 degree signals are fed to the mixers.", "Unlike the analog switches used earlier on PC130-451, U3 and U4 are conventional mixers identical to the mixers used by the AM, FM and CB radios already covered in the Communications module.", "The separate phases can be measured at TP2, TP3, U6a Pin 5 and U6b Pin 8. The 180 and 270 degree shifted signals are not used, only the 0 and 90 degree signals are fed to the mixers."], "jumps": ["P1330", "P1300", "P1340"]}, {"id": "P1340", "text": ["The 10 MHz carrier signal is fed into the Oscillator 1 (OSC1) input of both mixers (Pin 6).  The only difference between the two is the 90 degree shift.  This means that the dual audio and carrier signals are 90 degrees out of phase.", "The 10 MHz carrier signal is fed into the Oscillator 1 (OSC1) input of both mixers (Pin 6). The only difference between the two is the 90 degree shift. This means that the dual audio and carrier signals are 90 degrees out of phase."], "jumps": ["P1350", "P1330", "Pin"]}, {"id": "P1350", "text": ["The audio enters the mixers at Pin 1 (the INA inputs) and mixes with the carrier. The resultant signal can be seen at Pins 4 and 5 of both mixers, TP's 5, 6, and 7."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["Notice switch S1 on the output of U4. This switch allows the user to select which sideband to transmit.  By placing the switch in the up position you select the USB and in the down position, the lower sideband.", "Notice switch S1 on the output of U4. This switch allows the user to select which sideband to transmit. By placing the switch in the up position you select the USB and in the down position, the lower sideband."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["The signal path from U4  is dependent on the switch position of S1.  Regardless of which sideband is selected, the signal must pass through a variable resistor.", "The signal path from U4 is dependent on the switch position of S1. Regardless of which sideband is selected, the signal must pass through a variable resistor."], "jumps": ["P1380", "P1330"]}, {"id": "P1380", "text": ["R9 is for the LSB adjustment, while R10 adjusts the signal for the USB.  Whichever sideband is selected, the opposite will be cancelled out in the summing amplifier, U5.", "R9 is for the LSB adjustment, while R10 adjusts the signal for the USB. Whichever sideband is selected, the opposite will be cancelled out in the summing amplifier, U5."], "jumps": ["P1390", "P1330"]}, {"id": "P1390", "text": ["After leaving the summing amplifier at Pin 7, the signal passes through a tunable bandpass filter consisting of L1 and C20; C19 is a coupling capacitor.  This filter is adjusted for 10 MHz.", "After leaving the summing amplifier at Pin 7, the signal passes through a tunable bandpass filter consisting of L1 and C20; C19 is a coupling capacitor. This filter is adjusted for 10 MHz."], "jumps": ["P1400", "P1330"]}, {"id": "P1400", "text": ["On PC130-452, the two D Flip/Flops provide _______", "On PC130-452, the two D Flip/Flops provide _______........."], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["The Flip/Flops provide no filtering action.", "The Flip/Flops provide no filtering action................."], "jumps": []}, {"id": "P1403", "text": ["IC2 provides the 40 MHz signal.", "IC2 provides the 40 MHz signal............................."], "jumps": []}, {"id": "P1404", "text": ["Mixing action takes place in U3 and U4.", "Mixing action takes place in U3 and U4....................."], "jumps": []}, {"id": "P1410", "text": ["On PC130-450, the purpose of D1 and D2 is to _______", "convert signals from square to sine wave.", "On PC130-450, the purpose of D1 and D2 is to _______......."], "jumps": ["P1400"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["Audio detection takes place in the receiver.", "Audio detection takes place in the receiver................"], "jumps": []}, {"id": "P1413", "text": ["The diodes do not perform that function.", "The diodes do not perform that function...................."], "jumps": []}, {"id": "P1414", "text": ["Microphones perform that function.", "Microphones perform that function.........................."], "jumps": []}, {"id": "P1420", "text": ["Receiver Operations: The dissection of a single sideband receiver reveals an almost mirror image of the transmitter.  The components are nearly identical, just in a reverse order.", "Receiver Operations: The dissection of a single sideband receiver reveals an almost mirror image of the transmitter. The components are nearly identical, just in a reverse order."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["One of the unique aspects of the SSB Receiver is that the carrier signal must be recreated in the receiver in order for the intelligence to be detected."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Unlike AM broadcast signals where the carrier is transmitted in tact, SSB has no carrier in that sense.  The carrier is only present when a modulating signal is present.", "Unlike AM broadcast signals where the carrier is transmitted in tact, SSB has no carrier in that sense. The carrier is only present when a modulating signal is present."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["As a consequence, the SSB receiver will have no reference unless the carrier is reinserted into the signal upon its arrival in the receiver.", "The transmitted SSB signal enters the receiver at TP1 of the PC130-453 card and is immediately met by another tunable filter made up of L1 and C2 identical to the filter it passed through just prior to transmission.", "To U3 Pin 2 LPF Low Pass Filter and AMP"], "jumps": ["P1460", "P1420", "P1470"]}, {"id": "P1470", "text": ["After the filter, the signal splits to a parallel path and enters two mixer/amplifiers, U1 and U2 at Pin 1."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["IC1, U5a and U5b make up the RF generator (oscillator) that inserts the carrier back into the intelligence.  IC1 (the actual oscillator) outputs a 40 MHz signal at Pin 4.", "IC1, U5a and U5b make up the RF generator (oscillator) that inserts the carrier back into the intelligence. IC1 (the actual oscillator) outputs a 40 MHz signal at Pin 4."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["This signal is fed to two D F/F's for use as the clock signal.  Here, the frequency is divided out to 10 MHz.  Like the D F/F network in the transmitter, the output takes the carrier and delivers it in       four phases, 90 degrees apart.", "This signal is fed to two D F/F's for use as the clock signal. Here, the frequency is divided out to 10 MHz. Like the D F/F network in the transmitter, the output takes the carrier and delivers it in four phases, 90 degrees apart."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["In this instance, only the 0 and 90 degrees shifted signals are used.  Test points 4 and 5 may be used to view these signals. Upon leaving the F/F's, the 0\u00b0 phase signal is fed to Pin 6 (OSC 1) on the mixer U1, and the 90\u00b0 phase is fed to Pin 6 (OSC 1) on mixer U2.", "In this instance, only the 0 and 90 degrees shifted signals are used. Test points 4 and 5 may be used to view these signals. Upon leaving the F/F's, the 0", "phase signal is fed to Pin 6 (OSC 1) on the mixer U1, and the 90", "phase is fed to Pin 6 (OSC 1) on mixer U2."], "jumps": ["P1510", "P1460"]}, {"id": "P1510", "text": ["The outputs of the mixers are the demodulated intelligence \n90 degrees out of phase.  The first mixer, (U1) passes the signal from the output at Pin 5 directly to Pin 2, U3, an active low-pass        filter/amplifier.", "The outputs of the mixers are the demodulated intelligence 90 degrees out of phase. The first mixer, (U1) passes the signal from the output at Pin 5 directly to Pin 2, U3, an active low-pass filter/amplifier."], "jumps": ["P1520", "P1460"]}, {"id": "P1520", "text": ["The second mixer (U2) outputs on Pins 4 and 5 which are connected to S1.  The switch accommodates the selection of either the USB or LSB.  Obviously, if the LSB was, in fact, the transmitted signal, this switch must be adjusted to select the lower sideband.", "The second mixer (U2) outputs on Pins 4 and 5 which are connected to S1. The switch accommodates the selection of either the USB or LSB. Obviously, if the LSB was, in fact, the transmitted signal, this switch must be adjusted to select the lower sideband."], "jumps": ["P1530", "P1460"]}, {"id": "P1530", "text": ["The two 90 degree phase shifted signals leave PC130-453 at Pins T and U and enter the PC130-454 card at Pins E and D.  Upon arrival at Pins E and D, the signals are routed through low-pass filters consisting of R1, C1 and R3, C2.", "2. The low-pass filter/amplifiers boost the signa)", "After leaving the switch S1, the signal goes to an active low-pass filter/amplifier U4, Pin 2. The signal from U1, Pin 5 goes to another low-pass filter/amplifier U3, Pin 2. The low-pass filter/amplifiers boost the signals to approximately 0.85 VAC.", "The two 90 degree phase shifted signals leave PC130-453 at Pins T and U and enter the PC130-454 card at Pins E and D. Upon arrival at Pins E and D, the signals are routed through low-pass filters consisting of R1, C1 and R3, C2."], "jumps": ["P1540", "P1460", "P1550", "P1530"]}, {"id": "P1550", "text": ["From here, the signals pass into two active low-pass filters/amplifiers, U1 and U2.  These filters are set to pass the 1MHz signals and, at the same time, increase the gain.  C20 and C21 are coupling capacitors for the mixers.", "From here, the signals pass into two active low-pass filters/amplifiers, U1 and U2. These filters are set to pass the 1MHz signals and, at the same time, increase the gain. C20 and C21 are coupling capacitors for the mixers."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["A sub-carrier is needed to re-create the four phases 90 degrees apart, just as it was during the transmission process.  Y1, U7 and U6a and U6b perform this task.", "A sub-carrier is needed to re-create the four phases 90 degrees apart, just as it was during the transmission process. Y1, U7 and U6a and U6b perform this task."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["The signal Y1, a 1.8432 MHz crystal enters U7, Pin11, a divide by N counter.  Only output Q7 at U7, Pin6 is used to provide a clock signal for D F/F's U6A and U6B.", "The signal Y1, a 1.8432 MHz crystal enters U7, Pin11, a divide by N counter. Only output Q7 at U7, Pin6 is used to provide a clock signal for D F/F's U6A and U6B.put at Pin 6 is used as a clock signal for a pair of D F/F's."], "jumps": ["P1580", "P1540"]}, {"id": "P1580", "text": ["to four 3.6 kHz signals of 0, 90, 180, and 270 degree phase, measured at7", "Feedback from Q , output of U6b Pin 8, ensures the14.4 kHz signal is divided into four 3.6 kHz signals of 0, 90, 180, and 270 degree phase, measured at test points 4, 5, 6, and 7.nd 7..."], "jumps": ["P1590", "P1540"]}, {"id": "P1590", "text": ["While the frequency at the four test points is the same, the phase of the signal at the test points has been shifted by 90 degrees. The 90 degree shift in the signals may be seen by using the dual trace function of the oscilloscope."], "jumps": ["P1600", "P1540"]}, {"id": "P1600", "text": ["Where a four channel oscilloscope is available, all four test points may be viewed simultaneously.  Each phase of the signal feeds to a different pair of analog switches which make up the two mixers.", "At this point the four 3.6 kHz 90 degree shifted audio signals and sub-carrier are filtered and enter two mixer's U3 and U4.", "Where a four channel oscilloscope is available, all four test points may be viewed simultaneously. Each phase of the signal feeds to a different pair of analog switches which make up the two mixers.", "At this point the four 3.6 kHz 90 degree shifted audio signals and sub-carrier are filtered and enter two mixer's U3 and U4.and U4b."], "jumps": ["P1610", "P1540", "P1620"]}, {"id": "P1620", "text": ["The phased sub-carrier enters the mixers as a control signal and mixes with the audio, ultimately producing two completely reconstructed SSB signals 90 degrees apart.  These signals can be seen at TP8 and 9.", "The phased sub-carrier enters the mixers as a control signal and mixes with the audio, ultimately producing two completely reconstructed SSB signals 90 degrees apart. These signals can be seen at TP8 and 9."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["Following the transformers, a summing amplifier (U5), combines the two signals, favoring the selected sideband of the transmitter and receiver (USB or LSB).  The signal leaves U5, Pin 6 at PC 130-454 at Pin T and enters PC 130-455 at Pin E.", "Following the transformers, a summing amplifier (U5), combines the two signals, favoring the selected sideband of the transmitter and receiver (USB or LSB). The signal leaves U5, Pin 6 at PC 130-454 at Pin T and enters PC 130-455 at Pin E."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["The PC130-455 card contains a low-pass filter and an audio power amplifier.  The low-pass filter is tunable by adjusting R3, a 10 kW variable resistor.   Volume at the speaker is adjusted by R4.", "The PC130-455 card contains a low-pass filter and an audio power amplifier. The low-pass filter is tunable by adjusting R3, a 10 kW variable resistor. Volume at the speaker is adjusted by R4."], "jumps": ["P1910", "P1610"]}, {"id": "P1910", "text": ["This completes the information on SSB SCHEMATIC ANALYSIS.", "1.  The NIDA SSB Communications System permits modulation         and transmission of either voice or signal intelligence.                      Signals may be developed by either the on-board generator           (PC130-450) or an external generator.", "This completes the information on SSB SCHEMATIC ANALYSIS...", "1. The NIDA SSB Communications System permits modulation and transmission of either voice or signal intelligence. Signals may be developed by either the on-board generator (PC130-450) or an external generator."], "jumps": ["P1001", "P1640", "P1930", "PC130"]}, {"id": "P1930", "text": ["2.  On the PC130-451 card, the control signal (sometimes referred       to as a sub-carrier) is accomplished by Y1, U2.", "2. On the PC130-451 card, the control signal (sometimes referred to as a sub-carrier) is accomplished by Y1, U2."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Phase development of the control signal is performed by U3a        and U3b.", "3. Phase development of the control signal is performed by U3a and U3b."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The four phases of the control signal are separated by \n      90 degrees:  0, 90, 180, and 270 degrees.", "5.  The primary purpose of the mixers is to mix the intelligence             with the control signal and ensure a 90 degree phase shift              between the two outputs at TP8 and TP9.", "4. The four phases of the control signal are separated by 90 degrees: 0, 90, 180, and 270 degrees.", "5. The primary purpose of the mixers is to mix the intelligence with the control signal and ensure a 90 degree phase shift between the two outputs at TP8 and TP9."], "jumps": ["P1960", "P1940", "P1970"]}, {"id": "P1970", "text": ["6.  Each mixer is made up of four analog switches and a                        transformer.", "6. Each mixer is made up of four analog switches and a transformer."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The PC130-452 card produces the carrier signal which is at \n     10 MHz.", "7. The PC130-452 card produces the carrier signal which is at 10 MHz.."], "jumps": ["P1985", "P1960"]}, {"id": "P1985", "text": ["8.  The single sideband receiver is nearly identical to the                        transmitter except that the components are in reverse order.", "8. The single sideband receiver is nearly identical to the transmitter except that the components are in reverse order."], "jumps": ["P1990", "P1980"]}, {"id": "P1990", "text": ["9.  One unique aspect of the SSB receiver is that it must recreate        the carrier in order for the intelligence to be detected.", "9. One unique aspect of the SSB receiver is that it must recreate the carrier in order for the intelligence to be detected."], "jumps": ["P1995", "P1985"]}, {"id": "P1995", "text": ["10.  The carrier is only present when a modulating (intelligence)            signal is present.", "10. The carrier is only present when a modulating (intelligence) signal is present."], "jumps": ["P1999", "P1990"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In the following experiment, you will be analyzing the SSB signal in all of its stages during creation in the transmitter through the final power amplifier in the receiver."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Some signals may not be viewed easily (or at all) without the availability of a high frequency oscilloscope.  Further, some counters may not be able to accurately read certain signals depending on the counter's rated input impedance.", "Some signals may not be viewed easily (or at all) without the availability of a high frequency oscilloscope. Further, some counters may not be able to accurately read certain signals depending on the counter's rated input impedance."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Preparation\n1.  Apply power to the oscilloscope, frequency counter and                 multimeter.  Test equipment should be allowed to warm up             prior to use.  This ensures accurate measurements.", "Preparation 1. Apply power to the oscilloscope, frequency counter and multimeter. Test equipment should be allowed to warm up prior to use. This ensures accurate measurements."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["2.  Adjust the oscilloscope as follows:", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "2. Adjust the oscilloscope as follows:....................", "CH 1............................ - 50 mV perdivision, AC Time/Div..................... - 1 mS Oscilloscope Probe - X100000"], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["This experiment requires two Test Consoles.  Test Console 1 will function as the \"Transmitter\" and Test Console 2 as the \"Receiver.\"", "This experiment requires two Test Consoles. Test Console 1 will function as the \"Transmitter\" and Test Console 2 as the \"Receiver.\""], "jumps": ["P2062", "P2050"]}, {"id": "P2062", "text": ["1.  Setup the Transmitter an Receiver Test Consoles for dual               interface.", "1. Setup the Transmitter an Receiver Test Consoles for dual interface. Console to 2."], "jumps": ["P2060"]}, {"id": "P2070", "text": ["2.  Separate the PC130-450, 451 and 452 cards from the rest of             the SSB card set.  These cards make up the transmitter.", "2. Separate the PC130-450, 451 and 452 cards from the rest of the SSB card set. These cards make up the transmitter."], "jumps": ["P2080", "P2062"]}, {"id": "P2080", "text": ["3.  Insert the PC cards into the following positions: \n     Transmitter Console               Receiver Console\n     PC130-450 PC1 position        PC130-453 PC1 position                        PC130-451 PC2 position        PC130-454 PC2 position                        PC130-452 PC3 position        PC130-455 PC3 position", "3. Insert the PC cards into the following positions: Transmitter Console Receiver Console PC130-450 PC1 position PC130-453 PC1 position PC130-451 PC2 position PC130-454 PC2 position PC130-452 PC3 position PC130-455 PC3 position"], "jumps": ["P2110", "P2070"]}, {"id": "P2110", "text": ["4.  Set the Positive and Negative Supply Control to 12.  The                  Voltmeter on the Transmitter should indicate 12 Volts.\n5.  Set the Positive and Negative Supply Control to 12.  The                  Voltmeter on the Receiver should indicate 12 Volts.", "4. Set the Positive and Negative Supply Control to 12. The Voltmeter on the Transmitter should indicate 12 Volts. 5. Set the Positive and Negative Supply Control to 12. The Voltmeter on the Receiver should indicate 12 Volts."], "jumps": ["P2080"]}, {"id": "P2120", "text": ["6.  Attach one alligator-to-alligator cable to TP8 (RF out) on the           PC130-452 card.  This cable will act as the transmitter's                    antenna.", "6. Attach one alligator-to-alligator cable to TP8 (RF out) on the PC130-452 card. This cable will act as the transmitter's antenna. !"], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["7.  On the PC130-450 card, set the switches as follows:", "7. On the PC130-450 card, set the switches as follows:::..", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "S1 - either 400 or 1 kHz S2 - Sinewave S3 - Int...z S2 - Sinewave S3 - Int. Sinewave S3 - Int.e Probe - X10 - X10100000"], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["8.  On the PC130-452 card, set switch S1 to either USB or LSB.", "8. On the PC130-452 card, set switch S1 to either USB or LSB..."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["9.  Attach one alligator-to-alligator cable to TP1 (RF input) on the        PC130-453 card.  This cable will act as the receiver's                         antenna.", "9. Attach one alligator-to-alligator cable to TP1 (RF input) on the PC130-453 card. This cable will act as the receiver's antenna.", "{iRI, -5NXmllhuodhh^Zbbbbb^Z^hcZ^ZhbhbcaZaZZbhb", "ie|etiL -<Oe{zh{h{{z^ciWR-:%:;NZmhhhuybbh^^ZZZZbbbbZ^ZbhbhbbbbbbbcbbZ"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["10.  On the PC130-453 card, set switch S1 to the same sideband            that was selected on PC130-452.", "10. On the PC130-453 card, set switch S1 to the same sideband that was selected on PC130-452."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["11.  Set the Transmitter Test Console PC1, PC2 and PC3 DC                   power to ON. \n12.  Set the Receiver Test Console PC1, PC2 and PC3 DC power           to ON.", "11. Set the Transmitter Test Console PC1, PC2 and PC3 DC power to ON. 12. Set the Receiver Test Console PC1, PC2 and PC3 DC power to ON."], "jumps": ["P2150"]}, {"id": "P2180", "text": ["13.  Set the Receiver Test Console Speaker power to ON.  Adjust          the volume control knob on PC130-455 for a comfortable                 listening level.  The NIDA SSB Transmitter and Receiver                  should now be ready for operation.", "13. Set the Receiver Test Console Speaker power to ON. Adjust the volume control knob on PC130-455 for a comfortable listening level. The NIDA SSB Transmitter and Receiver should now be ready for operation."], "jumps": ["P2170"]}, {"id": "P2190", "text": ["Procedure\nDuring the following experiment, you will examine signals associated with the NIDA SSB Transmitter and Receiver.  For ease and simplicity, audio input to the transmitter will be taken from the on-board generator on PC130-450.", "Procedure During the following experiment, you will examine signals associated with the NIDA SSB Transmitter and Receiver. For ease and simplicity, audio input to the transmitter will be taken from the on-board generator on PC130-450."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Like commercial SSB radios, the NIDA SSB trainer utilizes high frequencies.  But unlike commercial systems that heavily shield oscillators and other components prone to RF emanation; by design, the NIDA trainer must allow student access to all circuits.", "Like commercial SSB radios, the NIDA SSB trainer utilizes high frequencies. But unlike commercial systems that heavily shield oscillators and other components prone to RF emanation; by design, the NIDA trainer must allow student access to all circuits."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["Consequently, noise is a definite concern.  Oscilloscope probes should be equipped with ground straps and the oscilloscope and trainer must be grounded, preferably to one another or separately to a common ground.", "Consequently, noise is a definite concern. Oscilloscope probes should be equipped with ground straps and the oscilloscope and trainer must be grounded, preferably to one another or separately to a common ground."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["A direct connection from a circuit card ground TP to the ground post on the panel of the oscilloscope will eliminate most, if  not all, noise problems.  Separating the trainers by several feet  will also assist in reducing noise.", "A direct connection from a circuit card ground TP to the ground post on the panel of the oscilloscope will eliminate most, if not all, noise problems. Separating the trainers by several feet will also assist in reducing noise."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Transmitter\n1.  Place the scope probe to TP4 of PC130-450.  This is the                   output TP of the signal generator.  You should observe a                 clean sine wave at either 400 or 1 kHz.", "Transmitter 1. Place the scope probe to TP4 of PC130-450. This is the output TP of the signal generator. You should observe a clean sine wave at either 400 or 1 kHz."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["Exercise switch S1 and notice the change in frequency.  If the waveform appears distorted in any way, adjust R9 for a symmetrical waveform at maximum voltage.  Place S1 to the \n1 kHz setting.", "Exercise switch S1 and notice the change in frequency. If the waveform appears distorted in any way, adjust R9 for a symmetrical waveform at maximum voltage. Place S1 to the 1 kHz setting."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["2.  Move the scope probe to TP5 and place S2 to the MIC                      position.  Notice that the output of the generator was                        removed.", "2. Move the scope probe to TP5 and place S2 to the MIC position. Notice that the output of the generator was removed."], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["Speak or tap on the condensor microphone and observe the fluctuations corresponding to the audio changes on the oscilloscope.  Place the Internal Source switch S2 back to Sine.  Place the Input Select switch S3 to External (Ext).", "Speak or tap on the condensor microphone and observe the fluctuations corresponding to the audio changes on the oscilloscope. Place the Internal Source switch S2 back to Sine. Place the Input Select switch S3 to External (Ext)."], "jumps": ["P2270", "P2230"]}, {"id": "P2270", "text": ["3. Use a BNC to alligator cable and connect a 1 kHz unmodulated, medium output signal to the Ext. Input TP1 of PC 130-450. Move oscilloscope probe CH1 to the output of the Buffer/Amplifier at PC 130-451, TP2. Adjust the input level potentiometer R1 for a maximum undistorted signal at TP2, approximately 1.5 vpp sinewave..."], "jumps": ["P2280", "P2230"]}, {"id": "P2280", "text": ["Ensure the Funciton Generator is produced exactly 1000 Hz.  Use a Counter and measure the 1 kHz frequency at PC 130-450 TP5 and the Audio Frequency (AF IN) at PC 130-451 TP1.", "Ensure the Funciton Generator is produced exactly 1000 Hz. Use a Counter and measure the 1 kHz frequency at PC 130-450 TP5 and the Audio Frequency (AF IN) at PC 130-451 TP1.nal. Once this is done, adjust R10 one more time to reduce the signal to approximately 1.5 vpp."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["4.  TP3 is the output of the oscillator.  Using a BNC to Alligator             cable, connect TP3 to the Counter.  A 14.4 kHz square wave           should be seen.", "4. TP3 is the output of the oscillator. Using a BNC to Alligator cable, connect TP3 to the Counter. A 14.4 kHz square wave should be seen."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["If your counter  can detect high frequencies, use a chip pin extender and measure the crystal oscillator frequency for Y1, 1.8432 MHz at U2, Pin 11.", "If your counter can detect high frequencies, use a chip pin extender and measure the crystal oscillator frequency for Y1, 1.8432 MHz at U2, Pin 11. sured at Pin 11 of U2."], "jumps": ["P2310", "P2270"]}, {"id": "P2310", "text": ["The four phases used by the mixers are developed by the two       D Flip/Flops (U3a and U3b).  In addition to the phasing                      function, U3a and U3b further divide the 14.4 kHz signal down       to 3.6 kHz.", "The four phases used by the mixers are developed by the two D Flip/Flops (U3a and U3b). In addition to the phasing function, U3a and U3b further divide the 14.4 kHz signal down to 3.6 kHz."], "jumps": ["P2320", "P2270"]}, {"id": "P2320", "text": ["5.  Set the oscilloscope for dual trace; place the CH1 probe on \n     PC 130-451 TP6 and use the CH2 probe to observe the signals \n     and phase shifts at TP4, TP5, and TP7.  Measure the \n     frequency and notice the phase shift at each test point.", "5. Set the oscilloscope for dual trace; place the CH1 probe on PC 130-451 TP6 and use the CH2 probe to observe the signals and phase shifts at TP4, TP5, and TP7. Measure the frequency and notice the phase shift at each test point.r. This should make the 90 degree phase shift plain to see."], "jumps": ["P2330", "P2270"]}, {"id": "P2330", "text": ["6.  The PC 130-451 analog switches U4 and U5 combined with T1 \n     and T2 make up Mixers 1 and 2.  The control signals are mixed \n     with the audio input to produce two signals with a 90 degree \n     phase shift at TP8 and TP9.", "6. The PC 130-451 analog switches U4 and U5 combined with T1 and T2 make up Mixers 1 and 2. The control signals are mixed with the audio input to produce two signals with a 90 degree phase shift at TP8 and TP9. 8 and TP9 are the outputs of the mixers. Measure the frequency at TP8 and TP9."], "jumps": ["P2340", "P2270"]}, {"id": "P2340", "text": ["What is the frequency at PC130-451 test points 4, 5, 6, and 7?", "What is the frequency at PC130-451 test points 4, 5, 6, and 7?? 56, 789)....................."], "jumps": ["P2310", "P2342"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["Check your setup.", "Check your setup.in page..................................."], "jumps": []}, {"id": "P2343", "text": ["The frequency at TP8 and TP9 should measure 3.6 kHz.", "The frequency at TP8 and TP9 should measure 3.6 kHz.sured 5.0mA."], "jumps": ["P2350", "P2340"]}, {"id": "P2350", "text": ["What is the phase shift at PC130-451 TP8 and TP9?", "What is the phase shift at PC130-451 TP8 and TP9?ies...................) in a variable.able.le."], "jumps": ["P2340", "P2800"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2353", "text": ["Your answer was incorrect.  You should have answered \n90 degrees.", "Your answer was incorrect. You should have answered 90 degrees.A."], "jumps": ["P2360", "P2350"]}, {"id": "P2360", "text": ["7.   Leaving the mixers, the two signals enter PC130-452 at Pins E       and D and are amplified and filtered by U1 and U2. \n      Place the x10 oscilloscope probes to CH1 on PC 130-452 U1  \n      Pin 2 and CH2 on U2 Pin 2.", "7. Leaving the mixers, the two signals enter PC130-452 at Pins E and D and are amplified and filtered by U1 and U2. Place the x10 oscilloscope probes to CH1 on PC 130-452 U1 Pin 2 and CH2 on U2 Pin 2...."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["What is the voltage measurement at U1 Pin 2 and U2 Pin 2?", "What is the voltage measurement at U1 Pin 2 and U2 Pin 2?..............) in a variable.able.le."], "jumps": ["P2372"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["Check your setup.", "Check your setup.in page..................................."], "jumps": []}, {"id": "P2373", "text": ["The voltage at U1 and U2 Pin 2 should measure approximately 10 mVpp.", "The voltage at U1 and U2 Pin 2 should measure approximately 10 mVpp..."], "jumps": ["P2380", "P2370"]}, {"id": "P2380", "text": ["8.  Now move the probe to TP1 and again measure the voltage.", "8. Now move the probe to TP1 and again measure the voltage."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["What is the voltage at TP1?", "What is the voltage at TP1?ric question with 3 tries...................) in a variable.able.le."], "jumps": ["P2380", "P2392"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["Check your setup.", "Check your setup.in page..................................."], "jumps": []}, {"id": "P2393", "text": ["The voltage at TP1 should measure approximately 200 mVpp.", "The voltage at TP1 should measure approximately 200 mVpp. 5.0mA."], "jumps": ["P2400", "P2390"]}, {"id": "P2400", "text": ["What is the amplifier's gain as a voltage ratio?  Express your answer 10:1, 20:1, 30:1 etc. \nHint: Voltage gain is calculated by: Av = Eout/Ein", "What is the amplifier's gain as a voltage ratio? Express your answer 10:1, 20:1, 30:1 etc. Hint: Voltage gain is calculated by: Av = Eout/Ein"], "jumps": ["P2390", "P2800"]}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P2403", "text": ["Your answer was incorrect.  You should have answered 20:1.", "Your answer was incorrect. You should have answered 20:1. 5.0mA."], "jumps": ["P2410", "P2400"]}, {"id": "P2410", "text": ["If you look at the signal at Pin E, it is significantly larger than the actual input to U1.  R1 and C1 are acting as a passive filter and together with R2, the signal is reduced.  The exact same process is performed for the signal that enters at Pin D.", "If you look at the signal at Pin E, it is significantly larger than the actual input to U1. R1 and C1 are acting as a passive filter and together with R2, the signal is reduced. The exact same process is performed for the signal that enters at Pin D."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The RF carrier is generated by IC2, a 40 MHz oscillator.  Like PC130-451, a pair of D Flip/Flops (U6) follow the oscillator and       divide out the frequency.  At the outputs of the Flip/Flops is a \n10 MHz signal represented by four different phases 90 degrees\napart.", "The RF carrier is generated by IC2, a 40 MHz oscillator. Like PC130-451, a pair of D Flip/Flops (U6) follow the oscillator and divide out the frequency. At the outputs of the Flip/Flops is a 10 MHz signal represented by four different phases 90 degrees apart."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["9.  Place the probe connected to CH1 of the oscilloscope to Pin         6 of U3.\n10.  Place the probe connected to CH2 to Pin 6 of U4.  Observe             both traces on the oscilloscope.", "9. Place the probe connected to CH1 of the oscilloscope to Pin 6 of U3. 10. Place the probe connected to CH2 to Pin 6 of U4. Observe both traces on the oscilloscope."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["What is the difference between the two signals?", "What is the difference between the two signals?tries...................) in a variable.able.le."], "jumps": ["P2410", "P2800"]}, {"id": "P2441", "text": [], "jumps": []}, {"id": "P2443", "text": ["Your answer was incorrect.  You should have answered 90\u00b0.", "Your answer was incorrect. You should have answered 90"], "jumps": ["P2450", "P2440"]}, {"id": "P2450", "text": ["The audio intelligence enters the mixers at Pin 1 of both U3            and U4.  \n11.  Place the CH1 probe on TP1.  Observe the audio signal.", "The audio intelligence enters the mixers at Pin 1 of both U3 and U4. 11. Place the CH1 probe on TP1. Observe the audio signal. signal. l. signal."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["12.  Adjust the Time/Div knob of the oscilloscope to .2 ms and set          the CH2 V/Div to 50 mV. \n13.  Place the CH 2 probe on TP2.  This is the 10 MHz carrier                  signal that feeds into Pin 6 of the mixer.", "12. Adjust the Time/Div knob of the oscilloscope to .2 ms and set the CH2 V/Div to 50 mV. 13. Place the CH 2 probe on TP2. This is the 10 MHz carrier signal that feeds into Pin 6 of the mixer."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["In order to have a clear view of both signals it will probably be necessary to alternately rotate the Time/Div knob between the \n.2 ms setting for the carrier and approximately 2 mS for the audio.", "In order to have a clear view of both signals it will probably be necessary to alternately rotate the Time/Div knob between the .2 ms setting for the carrier and approximately 2 mS for the audio."], "jumps": ["P2480", "P2450"]}, {"id": "P2480", "text": ["The signals observed in Step 9 are duplicated at U4.  The                same carrier and data mixed in U3 are also mixed in U4.", "The signals observed in Step 9 are duplicated at U4. The same carrier and data mixed in U3 are also mixed in U4."], "jumps": ["P2490", "P2450"]}, {"id": "P2490", "text": ["The only difference is the 90 degree phase shift in the intelligence signal and the 90 degree phase shift between the carrier signal applied to the inputs at Pin 6 of both mixers."], "jumps": ["P2500", "P2450"]}, {"id": "P2500", "text": ["The outputs of the mixers are on Pin 5 of U3 and Pins 4 and 5        of U4.  U4 utilizes both output pins to accommodate switch            S1, the sideband selector.", "The outputs of the mixers are on Pin 5 of U3 and Pins 4 and 5 of U4. U4 utilizes both output pins to accommodate switch S1, the sideband selector."], "jumps": ["P2510", "P2450"]}, {"id": "P2510", "text": ["14.  Using the counter, place the probe on PC130-452 TP8 and \n       place S1 in the USB position.  With a small screwdriver,   \n       adjust R10, (USB) to 10.001 MHz (\u00b1 2 kHz).  Now place S1 to  \n       the LSB position.   Adjust R9 to 9.999 MHz (\u00b1 2 kHz).", "14. Using the counter, place the probe on PC130-452 TP8 and place S1 in the USB position. With a small screwdriver, adjust R10, (USB) to 10.001 MHz (", "2 kHz). Now place S1 to the LSB position. Adjust R9 to 9.999 MHz ("], "jumps": ["P2520", "P2450"]}, {"id": "P2520", "text": ["The signals from the two mixers are brought together in the           summing amplifier.\n 15.  Place the CH probe on TP8 (the transmitter output) and                   adjust L1 for maximum signal strength.", "The signals from the two mixers are brought together in the summing amplifier. 15. Place the CH probe on TP8 (the transmitter output) and adjust L1 for maximum signal strength."], "jumps": ["P2530", "P2450"]}, {"id": "P2530", "text": ["Receiver \nThis portion of the experiment deals with the SSB receiver.  Reiterating from previous discussion, the SSB receiver is basically an SSB transmitter in reverse.", "Receiver This portion of the experiment deals with the SSB receiver. Reiterating from previous discussion, the SSB receiver is basically an SSB transmitter in reverse."], "jumps": ["P2540", "P2450"]}, {"id": "P2540", "text": ["The signals you observed and measured in the transmitter are recreated in the receiver and so not as much time will be spent in that pursuit.  However, you will be able to observe the signal         reconstruction.", "The signals you observed and measured in the transmitter are recreated in the receiver and so not as much time will be spent in that pursuit. However, you will be able to observe the signal reconstruction."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["Following TP1 on PC130-453, the receiver's antenna input, is a tunable circuit consisting of C1 and L1.  As with the tunable circuit at the transmitter's antenna, this should be tuned for maximum signal.", "Following TP1 on PC130-453, the receiver's antenna input, is a tunable circuit consisting of C1 and L1. As with the tunable circuit at the transmitter's antenna, this should be tuned for maximum signal.", "{iRI, -5NXmllhuodhh^Zbbbbb^Z^hcZ^ZhbhbcaZaZZbhb", "ie|etiL -<Oe{zh{h{{z^ciWR-:%:;NZmhhhuybbh^^ZZZZbbbbZ^ZbhbhbbbbbbbcbbZ"], "jumps": ["P2560", "P2530"]}, {"id": "P2560", "text": ["This can be accomplished using TP1 as your signal viewing source, but there is a great deal of noise present at the antenna. It is best to use TP3 (USB/LSB amplifier/filter) for this endeavor."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["1.  Connect the CH1 probe to TP3.  Ensure that both the receiver       and the transmitter are set to USB and adjust L1 for                           maximum signal strength.  Change the transmitter and                     receiver to LSB and repeat the same process.", "1. Connect the CH1 probe to TP3. Ensure that both the receiver and the transmitter are set to USB and adjust L1 for maximum signal strength. Change the transmitter and receiver to LSB and repeat the same process."], "jumps": ["P2580", "P2550"]}, {"id": "P2580", "text": ["The 40 MHz oscillator and subsequent Flip/Flop divider are            identical to the circuitry used in the transmitter and performs        exactly the same function --- creation of the 10 MHz carrier              frequency at four different phases, 90 degrees apart.", "The 40 MHz oscillator and subsequent Flip/Flop divider are identical to the circuitry used in the transmitter and performs exactly the same function --- creation of the 10 MHz carrier frequency at four different phases, 90 degrees apart."], "jumps": ["P2590", "P2550"]}, {"id": "P2590", "text": ["TP4 (90 degrees) and TP5 (0 degrees) can be used to view the signals. 2. Set the oscilloscope to Dual Trace at .2 ms and .2 V/Div. Place the CH1 probe on TP4 and the CH2 probe on TP5. TP5. TP5."], "jumps": ["P2600", "P2550"]}, {"id": "P2600", "text": ["3.  Compare the signals and note the 90 degree phase shift.", "3. Compare the signals and note the 90 degree phase shift."], "jumps": ["P2610", "P2550"]}, {"id": "P2610", "text": ["The 10 MHz signals mix with the audio in U1 and U2 and are           then filtered and amplified in U3 and U4 while maintaining the        90 degree phase shift.", "The 10 MHz signals mix with the audio in U1 and U2 and are then filtered and amplified in U3 and U4 while maintaining the 90 degree phase shift."], "jumps": ["P2620", "P2550"]}, {"id": "P2620", "text": ["The outputs of the active filters (TP2 and 3) show the carrier           now modulated by the audio.\n4.  Place the oscilloscope probes on the TP2 and TP3 and                    observe the signals.", "The outputs of the active filters (TP2 and 3) show the carrier now modulated by the audio. 4. Place the oscilloscope probes on the TP2 and TP3 and observe the signals."], "jumps": ["P2630", "P2550"]}, {"id": "P2630", "text": ["5.  After leaving PC130-453 the signals enter the AM Detector,             passing through yet another pair of active filters/amplifiers.            Using the same oscilloscope settings used on the previous           card, place the scope probes on TP1 and TP2.  Observe the           signals.", "5. After leaving PC130-453 the signals enter the AM Detector, passing through yet another pair of active filters/amplifiers. Using the same oscilloscope settings used on the previous card, place the scope probes on TP1 and TP2. Observe the signals."], "jumps": ["P2640", "P2550"]}, {"id": "P2640", "text": ["Y1, U7, U6a and U6b make up the oscillator/divider circuitry             that provide a control signal in four phases, 90 degrees apart,        used to enable the analog switches that make up the two                mixers.", "Y1, U7, U6a and U6b make up the oscillator/divider circuitry that provide a control signal in four phases, 90 degrees apart, used to enable the analog switches that make up the two mixers."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["6.  Place the CH1 probe on any of the four test points:\n     TP4, 5, 6, or 7.  Measure the frequency at the test point.", "6. Place the CH1 probe on any of the four test points: TP4, 5, 6, or 7. Measure the frequency at the test point. v"], "jumps": ["P2660", "P2630"]}, {"id": "P2660", "text": ["What was the measured frequency?", "What was the measured frequency?uestion with 3 tries...................) in a variable.able.le."], "jumps": ["P2630", "P2800"]}, {"id": "P2661", "text": [], "jumps": []}, {"id": "P2663", "text": ["Your answer was incorrect.  You should have answered 3.6 kHz.", "Your answer was incorrect. You should have answered 3.6 kHz..0mA."], "jumps": ["P2670", "P2660"]}, {"id": "P2670", "text": ["Leaving the mixers, two phases of the intelligence are added         together in the Summing Amplifier, U5.  It is in the summing            amplifier that \"detection\" occurs.  The carrier is eliminated and      the two 90 degree shifted intelligence signals are added to              recreate the original audio.", "Leaving the mixers, two phases of the intelligence are added together in the Summing Amplifier, U5. It is in the summing amplifier that \"detection\" occurs. The carrier is eliminated and the two 90 degree shifted intelligence signals are added to recreate the original audio."], "jumps": ["P2680", "P2660"]}, {"id": "P2680", "text": ["This amplifier is the final \"reconstruction\" circuit that                        restores  the original audio.\n7.   Place the CH1 probe on TP10 and observe the signal.", "This amplifier is the final \"reconstruction\" circuit that restores the original audio. 7. Place the CH1 probe on TP10 and observe the signal."], "jumps": ["P2690", "P2670"]}, {"id": "P2690", "text": ["The detected audio now enters PC130-455.  For the signal to          be usable by the receiver it must be amplified.  Before that,             however, it is filtered one last time prior to entering the audio         power amplifier used to drive the speaker.", "The detected audio now enters PC130-455. For the signal to be usable by the receiver it must be amplified. Before that, however, it is filtered one last time prior to entering the audio power amplifier used to drive the speaker."], "jumps": ["P2700", "P2670"]}, {"id": "P2700", "text": ["8.  Place the CH1 oscilloscope probe on TP3 and observe the             detected audio.", "8. Place the CH1 oscilloscope probe on TP3 and observe the detected audio.."], "jumps": ["P2710", "P2690"]}, {"id": "P2710", "text": ["Probably the most unique aspect of the SSB system is the             fact  that without a modulating signal (intelligence - normally          audio) there is no carrier.", "Probably the most unique aspect of the SSB system is the fact that without a modulating signal (intelligence - normally audio) there is no carrier."], "jumps": ["P2720", "P2690"]}, {"id": "P2720", "text": ["To prove this, place the CH1 probe on TP2 of PC130-453.  This is the output of the active filter/amplifier AFTER the reinsertion of the carrier.", "To prove this, place the CH1 probe on TP2 of PC130-453. This is the output of the active filter/amplifier AFTER the reinsertion of the carrier.", "{iRI, -5NXmllhuodhh^Zbbbbb^Z^hcZ^ZhbhbcaZaZZbhb", "ie|etiL -<Oe{zh{h{{z^ciWR-:%:;NZmhhhuybbh^^ZZZZbbbbZ^ZbhbhbbbbbbbcbbZ"], "jumps": ["P2730", "P2710"]}, {"id": "P2730", "text": ["9.  Place the CH2 probe on TP4 of PC130-450.  TP4 is the output        test point for the on-board generator.", "9. Place the CH2 probe on TP4 of PC130-450. TP4 is the output test point for the on-board generator."], "jumps": ["P2740", "P2720"]}, {"id": "P2740", "text": ["Both signals should be seen on the oscilloscope at this time.         Remember, SSB tranceivers require a modulated input to  \n        produce and output.\n10.   Remove the 1 kHz signal and notice the sound and the  \n        carrier disappear.", "Both signals should be seen on the oscilloscope at this time. Remember, SSB tranceivers require a modulated input to produce and output. 10. Remove the 1 kHz signal and notice the sound and the carrier disappear. counterclockwise. This will remove the audio input of the transmitter."], "jumps": ["P2750", "P2730"]}, {"id": "P2750", "text": ["Note that the entire signal being measured at TP2 of PC130-453 is eliminated.  Removal of the modulating signal also removed the carrier!", "Note that the entire signal being measured at TP2 of PC130-453 is eliminated. Removal of the modulating signal also removed the carrier!"], "jumps": ["P2760", "P2730"]}, {"id": "P2760", "text": ["1.  Return the Transmitter and Receiver Test Consoles to their            initial control settings.", "1. Return the Transmitter and Receiver Test Consoles to their initial control settings."], "jumps": ["P2730"]}, {"id": "P2770", "text": ["2.  Set the Transmitter and Receiver Test Consoles Power to OFF.", "2. Set the Transmitter and Receiver Test Consoles Power to OFF."], "jumps": ["P2760"]}, {"id": "P2780", "text": ["3.  Disconnect and return all test equipment to its proper storage       area.", "3. Disconnect and return all test equipment to its proper storage area."], "jumps": ["P2910", "P2770"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on SSB ANALYSIS.", "This completes the experiment on SSB ANALYSIS.TITLE........"], "jumps": ["P2001", "P2780", "P"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")", "= addObjectiveToPoolex(1, \"110,111,113,114,115,116,117,118,119\", 8)"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")", "= addObjectiveToPoolex(1, \"110,111,113,114,115,116,117,118,119\", 8)"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")", "= addObjectiveToPoolex(1, \"110,111,113,114,115,116,117,118,119\", 8)"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "= addObjectiveToPoolex(1, \"110,111,113,114,115,116,117,118,119\", 8)"], "jumps": []}, {"id": "P10210", "text": ["The Control Signal is sometimes called a(n) _______"], "jumps": []}, {"id": "P10211", "text": ["The four separate phases of the Control Signal are _______ and developed by _______."], "jumps": []}, {"id": "P10212", "text": ["establish an impedance match for the two transformers. e", "provide summing action for the mixer outputs.", "mix the control signal and intelligence and provide a 90", "phase shift between the outputs of the two mixers.", "On PC130-451, the purpose of U3a - U3d is to _______"], "jumps": []}, {"id": "P10213", "text": ["Each mixer consists of _______ and _______"], "jumps": []}, {"id": "P10214", "text": ["On PC130-452, the _______ oscillator is stepped _______ to _______ for use as the carrier. ."], "jumps": []}, {"id": "P10215", "text": ["SSB receivers require that the _______ be recreated in order for the intelligence to be detected."], "jumps": []}, {"id": "P10216", "text": ["In SSB Communication Systems, the _______ is only present when there is a _______ signal."], "jumps": []}, {"id": "P10217", "text": ["When operating the Nida SSB transmitter/receiver, the test consoles should not be closer than _______ apart."], "jumps": []}, {"id": "P10218", "text": ["On PC130-454, the sub-carrier is generated and divided out by the D Flip/Flops to _______"], "jumps": []}, {"id": "P10219", "text": ["On PC130-450, with switch S3 in the \"EXT\" position, what position should switch S2 be in?"], "jumps": []}, {"id": "P10220", "text": ["On PC130-452, S1 should _______ be in the same position as S1 on PC130-453."], "jumps": []}, {"id": "P10221", "text": ["The purpose of R3 on PC130-455 is _______"], "jumps": []}, {"id": "P10222", "text": ["On PC130-450, S1 provides a means of selecting _______"], "jumps": []}, {"id": "P10223", "text": ["irrelevant based on other circuit parameters", "important based on other circuit parameters", "On PC130-450, S2 is _______ when S3 is in EXT."], "jumps": []}, {"id": "P10224", "text": [], "jumps": []}, {"id": "P10225", "text": ["On PC130-452, the signal applied to U3, Pin 6 is the _______ phase of the 10 MHz carrier."], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 10%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13020", "text": ["In the following experiment, you will be analyzing the SSB signal in all of its stages during creation in the transmitter through the final power amplifier in the receiver."], "jumps": ["P13030", "P2001"]}, {"id": "P13030", "text": ["Some signals may not be viewed easily (or at all) without the availability of a high frequency oscilloscope.  Further, some counters may not be able to accurately read certain signals depending on the counter's rated input impedance.", "Some signals may not be viewed easily (or at all) without the availability of a high frequency oscilloscope. Further, some counters may not be able to accurately read certain signals depending on the counter's rated input impedance."], "jumps": ["P13040", "P13020", "PP", "P"]}, {"id": "P13040", "text": ["Preparation\n1.  Apply power to the oscilloscope, frequency counter and                 multimeter.  Test equipment should be allowed to warm up             prior to use.  This ensures accurate measurements.", "Preparation 1. Apply power to the oscilloscope, frequency counter and multimeter. Test equipment should be allowed to warm up prior to use. This ensures accurate measurements."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["2.  Adjust the oscilloscope as follows:", "2. Adjust the oscilloscope as follows:....................", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "CH1............................. - 50 mV perdivision, AC Time/Div..................... - 1 mS Oscilloscope Probe - X100000"], "jumps": ["P13058", "P13030"]}, {"id": "P13058", "text": ["This experiment requires two Test Consoles.  Test Console 1 will function as the \"Transmitter\" and Test Console 2 as the \"Receiver.\"", "This experiment requires two Test Consoles. Test Console 1 will function as the \"Transmitter\" and Test Console 2 as the \"Receiver.\""], "jumps": ["P13060", "P13050"]}, {"id": "P13060", "text": ["1.  Setup the Transmitter an Receiver Test Consoles for dual               interface.", "1. Setup the Transmitter an Receiver Test Consoles for dual interface. and press enter to designate as the Transmitter Test Console; b) type address, press the enter key, type 2 and press enter to designate as the Receiver Test Console."], "jumps": ["P13058"]}, {"id": "P13070", "text": ["2.  Separate the PC130-450, 451 and 452 cards from the rest of            the SSB card set.  These cards make up the transmitter.", "2. Separate the PC130-450, 451 and 452 cards from the rest of the SSB card set. These cards make up the transmitter."], "jumps": ["P13080"]}, {"id": "P13080", "text": ["3.  Insert the PC cards into the following positions: \n     Transmitter Console               Receiver Console  \n     PC130-450 PC1 position        PC130-453 PC1 position                        PC130-451 PC2 position        PC130-454 PC2 position                        PC130-452 PC3 position        PC130-455 PC3 position", "3. Insert the PC cards into the following positions: Transmitter Console Receiver Console PC130-450 PC1 position PC130-453 PC1 position PC130-451 PC2 position PC130-454 PC2 position PC130-452 PC3 position PC130-455 PC3 position"], "jumps": ["P13100", "P13070"]}, {"id": "P13100", "text": ["4.  Press enter to set:  Transmitter Positive Supply Voltage  - 12                                               Transmitter Negative Supply Voltage - 12  5.  Press enter to set:  Receiver Positive Supply Voltage       - 12                                               Receiver Negative Supply Voltage      - 12", "4. Press enter to set: Transmitter Positive Supply Voltage - 12 Transmitter Negative Supply Voltage - 12 5. Press enter to set: Receiver Positive Supply Voltage - 12 Receiver Negative Supply Voltage - 12"], "jumps": ["P13080"]}, {"id": "P13110", "text": ["6.  Attach one alligator-to-alligator cable to TP8 (RF out) on the           PC130-452 card.  This cable will act as the transmitter's                    antenna.", "6. Attach one alligator-to-alligator cable to TP8 (RF out) on the PC130-452 card. This cable will act as the transmitter's antenna. #"], "jumps": ["P13120"]}, {"id": "P13120", "text": ["7.  On the PC130-450 card, set the switches as follows:", "7. On the PC130-450 card, set the switches as follows:::..", "Channel 1 - 50 mV per division, AC Time/Division - 1 mS Scope Probe - X10", "S1 - either 400 or 1 kHz S2 - Sinewave S3 - Int...z S2 - Sinewave S3 - Int. Sinewave S3 - Int.e Probe - X10 - X10100000"], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["8.  On the PC130-452 card, set switch S1 to either USB or LSB.", "8. On the PC130-452 card, set switch S1 to either USB or LSB..."], "jumps": ["P13140", "P13120"]}, {"id": "P13140", "text": ["9.  Attach one alligator-to-alligator cable to TP1 (RF input) on the        PC130-453 card.  This cable will act as the receivers's                       antenna.", "9. Attach one alligator-to-alligator cable to TP1 (RF input) on the PC130-453 card. This cable will act as the receivers's antenna.", "{iRI, -5NXmllhuodhh^Zbbbbb^Z^hcZ^ZhbhbcaZaZZbhb", "ie|etiL -<Oe{zh{h{{z^ciWR-:%:;NZmhhhuybbh^^ZZZZbbbbZ^ZbhbhbbbbbbbcbbZ"], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["10.  On the PC130-453 card, set switch S1 to the same sideband            that was selected on PC130-452.", "10. On the PC130-453 card, set switch S1 to the same sideband that was selected on PC130-452."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["11.  Press enter to set:\n       Transmitter Console                    Receiver Console\n       PC1 DC Power Switch - ON       PC1 DC Power Switch - ON\n       PC2 DC Power Switch - ON       PC2 DC Power Switch - ON\n       PC3 DC Power Switch - ON       PC3 DC Power Switch - ON", "11. Press enter to set: Transmitter Console Receiver Console PC1 DC Power Switch - ON PC1 DC Power Switch - ON PC2 DC Power Switch - ON PC2 DC Power Switch - ON PC3 DC Power Switch - ON PC3 DC Power Switch - ON"], "jumps": ["P13140"]}, {"id": "P13180", "text": ["12.  Press enter to set:  Receiver Speaker Power Switch - ON", "12. Press enter to set: Receiver Speaker Power Switch - ONN.............."], "jumps": []}, {"id": "P13185", "text": ["13.  Adjust the volume control knob on PC130-455 for a                           comfortable listening level.  The Nida SSB transmitter and               receiver should now be ready for operation.", "13. Adjust the volume control knob on PC130-455 for a comfortable listening level. The Nida SSB transmitter and receiver should now be ready for operation."], "jumps": ["P13190"]}, {"id": "P13190", "text": ["Procedure\nDuring the following experiment, you will examine signals associated with the NIDA SSB Transmitter and Receiver.  For ease and simplicity, audio input to the transmitter will be taken from the on-board generator on PC130-450.", "Procedure During the following experiment, you will examine signals associated with the NIDA SSB Transmitter and Receiver. For ease and simplicity, audio input to the transmitter will be taken from the on-board generator on PC130-450."], "jumps": ["P13200", "P13185"]}, {"id": "P13200", "text": ["Like commercial SSB radios, the NIDA SSB trainer utilizes high frequencies.  But unlike commercial systems that heavily shield oscillators and other components prone to RF emanation; by design, the NIDA trainer must allow student access to all circuits.", "Like commercial SSB radios, the NIDA SSB trainer utilizes high frequencies. But unlike commercial systems that heavily shield oscillators and other components prone to RF emanation; by design, the NIDA trainer must allow student access to all circuits."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["Consequently, noise is a definite concern.  Oscilloscope probes should be equipped with ground straps and the oscilloscope and trainer must be grounded, preferably to one another or separately to a common ground.", "Consequently, noise is a definite concern. Oscilloscope probes should be equipped with ground straps and the oscilloscope and trainer must be grounded, preferably to one another or separately to a common ground."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["A direct connection from a circuit card ground TP to the ground post on the  panel of the oscilloscope will eliminate most, if not all, noise problems.  Separating the trainers by several feet  will also assist in reducing noise.", "A direct connection from a circuit card ground TP to the ground post on the panel of the oscilloscope will eliminate most, if not all, noise problems. Separating the trainers by several feet will also assist in reducing noise."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["Transmitter\n1.  Place the oscilloscope probe to TP4 of PC130-450.  This is the      output TP of the signal generator.  You should observe a                 clean sine wave at either 400 or 1 kHz.", "Transmitter 1. Place the oscilloscope probe to TP4 of PC130-450. This is the output TP of the signal generator. You should observe a clean sine wave at either 400 or 1 kHz."], "jumps": ["P13240", "P13210"]}, {"id": "P13240", "text": ["Exercise switch S1 and notice the change in frequency.  If the waveform appears distorted in any way, adjust R9 for a symmetrical waveform at maximum voltage.  Place S1 to the\n1 kHz setting.", "Exercise switch S1 and notice the change in frequency. If the waveform appears distorted in any way, adjust R9 for a symmetrical waveform at maximum voltage. Place S1 to the 1 kHz setting."], "jumps": ["P13250", "P13230"]}, {"id": "P13250", "text": ["2.  Move the oscilloscope probe to TP5 and place S2 to the MIC          position.  Notice that the output of the generator was                        removed.", "2. Move the oscilloscope probe to TP5 and place S2 to the MIC position. Notice that the output of the generator was removed."], "jumps": ["P13260", "P13230"]}, {"id": "P13260", "text": ["Speak or tap on the condensor microphone and observe the fluctuations corresponding to the audio changes on the oscilloscope.  Place the Internal Source switch S2 back to Sine.  Place the Input Select switch S3 to External (Ext).", "Speak or tap on the condensor microphone and observe the fluctuations corresponding to the audio changes on the oscilloscope. Place the Internal Source switch S2 back to Sine. Place the Input Select switch S3 to External (Ext)."], "jumps": ["P13270", "P13230"]}, {"id": "P13270", "text": ["3. Use a BNC to alligator cable and connect a 1 kHz unmodulated, medium output signal to the Ext. Input TP1 of PC 130-450. Move oscilloscope probe CH1
