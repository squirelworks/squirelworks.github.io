 to the output of the Buffer/Amplifier at PC 130-451, TP2. Adjust the input level potentiometer R1 for a maximum undistorted signal at TP1 approximately 1.2 vpp sinewave..."], "jumps": ["P13280", "P13230"]}, {"id": "P13280", "text": ["Ensure the Function Generator is producing exactly 1000 Hz.  Use a Counter and measure the 1 kHz frequency at PC 130-450 TP5 and the Audio Frequency (AF IN) at PC 130-451 TP1.", "Ensure the Function Generator is producing exactly 1000 Hz. Use a Counter and measure the 1 kHz frequency at PC 130-450 TP5 and the Audio Frequency (AF IN) at PC 130-451 TP1.al. Once this is done, adjust R10 one more time to reduce the signal to approximately 1.5 vpp."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["4.  TP3 is the output of the oscillator.  Using a BNC to Alligator             cable, connect TP3 to the Counter.  A 14.4 kHz square wave           should be seen.", "4. TP3 is the output of the oscillator. Using a BNC to Alligator cable, connect TP3 to the Counter. A 14.4 kHz square wave should be seen."], "jumps": ["P13300", "P13270"]}, {"id": "P13300", "text": ["If your counter  can detect high frequencies, use a chip pin extender and measure the crystal oscillator frequency for Y1, 1.8432 MHz at U2, Pin 11.", "If your counter can detect high frequencies, use a chip pin extender and measure the crystal oscillator frequency for Y1, 1.8432 MHz at U2, Pin 11. can be measured at Pin 11 of U2."], "jumps": ["P13310", "P13270"]}, {"id": "P13310", "text": ["The four phases used by the mixers are developed by the two       D Flip/Flops (U3a and U3b).  In addition to the phasing                      function, U3a and U3b further divide the 14.4 kHz signal down       to 3.6 kHz.", "The four phases used by the mixers are developed by the two D Flip/Flops (U3a and U3b). In addition to the phasing function, U3a and U3b further divide the 14.4 kHz signal down to 3.6 kHz."], "jumps": ["P13320", "P13270"]}, {"id": "P13320", "text": ["5.  Set the oscilloscope for dual trace; place the CH1 probe on \n     PC 130-451 TP6 and use the probe to observe the signals and \n     phase shifts at TP4, TP5, and TP7.  Measure the frequency \n     and notice the phase shift at each test point.", "5. Set the oscilloscope for dual trace; place the CH1 probe on PC 130-451 TP6 and use the probe to observe the signals and phase shifts at TP4, TP5, and TP7. Measure the frequency and notice the phase shift at each test point.other. This should make the 90 degree phase shift plain to see."], "jumps": ["P13330", "P13270"]}, {"id": "P13330", "text": ["6.  The PC 130-451 analog switches U4 and U5 combined with T1 \n     and T2 make up Mixers 1 and 2.  The control signals are mixed \n     with the audio input to produce two signals with a 90 degree \n     phase shift at TP8 and TP9.", "6. The PC 130-451 analog switches U4 and U5 combined with T1 and T2 make up Mixers 1 and 2. The control signals are mixed with the audio input to produce two signals with a 90 degree phase shift at TP8 and TP9. 8 and TP9 are the outputs of the mixers. Measure the frequency at TP8 and TP9."], "jumps": ["P13340", "P13270"]}, {"id": "P13340", "text": ["What is the frequency at PC 130-451 test points 4, 5, 6, 7?", "What is the frequency at PC 130-451 test points 4, 5, 6, 7? 34, 56, 789)....................."], "jumps": ["P13270", "P13342"]}, {"id": "P13341", "text": [], "jumps": []}, {"id": "P13342", "text": ["Check your setup.", "Check your setup.in page..................................."], "jumps": []}, {"id": "P13343", "text": ["The frequency at TP8 and TP9 should measure 3.6 kHz.", "The frequency at TP8 and TP9 should measure 3.6 kHz.sured 5.0mA."], "jumps": ["P13350", "P13340"]}, {"id": "P13350", "text": ["What is the difference between the two signals?", "What is the difference between the two signals?tries...................) in a variable.able.le."], "jumps": ["P13340", "P2800"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13353", "text": [" ["What is the amplifier's gain as a voltage ratio?  Express your answer 10:1, 20:1, 30:1 etc. \nHint: Voltage gain is calculated by: Av = Eout/Ein", "What is the amplifier's gain as a voltage ratio? Express your answer 10:1, 20:1, 30:1 etc. Hint: Voltage gain is calculated by: Av = Eout/Ein"], "jumps": ["P13390", "P2800"]}, {"id": "P13401", "text": [], "jumps": []}, {"id": "P13403", "text": ["Your answer was incorrect.  You should have answered 20:1.", "Your answer was incorrect. You should have answered 20:1. 5.0mA."], "jumps": ["P13410", "P13400"]}, {"id": "P13410", "text": ["If you look at the signal at Pin E, it is significantly larger than the actual input to U1.  R1 and C1 are acting as a passive filter and together with R2, the signal is reduced.  The exact same process is performed for the signal that enters at Pin D.", "If you look at the signal at Pin E, it is significantly larger than the actual input to U1. R1 and C1 are acting as a passive filter and together with R2, the signal is reduced. The exact same process is performed for the signal that enters at Pin D."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["The RF carrier is generated by IC2, a 40 MHz oscillator.  Like          PC130-451, a pair of D Flip/Flops (U6) follow the oscillator and       divide out the frequency.  At the outputs of the Flip/Flop is a \n10 MHz signal represented by four different phases 90 degrees apart.", "The RF carrier is generated by IC2, a 40 MHz oscillator. Like PC130-451, a pair of D Flip/Flops (U6) follow the oscillator and divide out the frequency. At the outputs of the Flip/Flop is a 10 MHz signal represented by four different phases 90 degrees apart."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["9.  Place the probe connected to CH1 of the oscilloscope to the  \n       right side of C12 to view PIN 6 of U3.\n10.  Place the probe connected to CH2 of the oscilloscope to the \n       right side of C14 to view PIN6 of U4.  Observe both traces on   \n       the oscilloscope.", "9. Place the probe connected to CH1 of the oscilloscope to the right side of C12 to view PIN 6 of U3. 10. Place the probe connected to CH2 of the oscilloscope to the right side of C14 to view PIN6 of U4. Observe both traces on the oscilloscope.", "dddd ! ldddddd d dd d! d d d %", "Oldd d ddddd dd dd dd!dd ddd!d!ddd!dddddddddd !dd", "%%%%%%%%%% NN%NyypN%%%%% %%%%%%NN%%%%%%%% % %%%%%% N[e/2a>"], "jumps": ["P13440", "P13410"]}, {"id": "P13440", "text": ["What is the difference between the two signals?", "What is the difference between the two signals?tries...................) in a variable.able.le."], "jumps": ["P13410", "P2800"]}, {"id": "P13441", "text": [], "jumps": []}, {"id": "P13443", "text": ["Your answer was incorrect.  You should have answered 90\u00b0.", "Your answer was incorrect. You should have answered 90"], "jumps": ["P13450", "P13440"]}, {"id": "P13450", "text": ["The audio intelligence enters the mixers at Pin 1 of both U3            and U4. \n11.  Place the CH1 probe on TP1.  Observe the audio signal.", "The audio intelligence enters the mixers at Pin 1 of both U3 and U4. 11. Place the CH1 probe on TP1. Observe the audio signal. signal. l. signal."], "jumps": ["P13460", "P13440"]}, {"id": "P13460", "text": ["12.  Adjust the Time/Div knob of the oscilloscope to .2 ms and set          the CH1 V/Div to 50 mV x10 probe.  \n13.  Place the CH2 probe on TP2.  This is the 10 MHz carrier                    signal that feeds into Pin 6 of the mixer.", "12. Adjust the Time/Div knob of the oscilloscope to .2 ms and set the CH1 V/Div to 50 mV x10 probe. 13. Place the CH2 probe on TP2. This is the 10 MHz carrier signal that feeds into Pin 6 of the mixer."], "jumps": ["P13470", "P13450"]}, {"id": "P13470", "text": ["In order to have a clear view of both signals it will probably be necessary to alternately rotate the Time/Div knob between the \n.2 ms setting for the carrier and approximately 2 mS for the audio.", "In order to have a clear view of both signals it will probably be necessary to alternately rotate the Time/Div knob between the .2 ms setting for the carrier and approximately 2 mS for the audio."], "jumps": ["P13480", "P13450"]}, {"id": "P13480", "text": ["The signals observed in Step 9 are duplicated at U4.  The                same carrier and data mixed in U3 are also mixed in U4.", "The signals observed in Step 9 are duplicated at U4. The same carrier and data mixed in U3 are also mixed in U4."], "jumps": ["P13490", "P13450"]}, {"id": "P13490", "text": ["The only difference is the 90 degree phase shift in the intelligence signal and the 90 degree phase shift between the carrier signal applied to the inputs at Pin 6 of both mixers."], "jumps": ["P13500", "P13450"]}, {"id": "P13500", "text": ["The outputs of the mixers are on Pin 5 of U3 and Pins 4 and 5        of U4.  U4 utilizes both output pins to accommodate switch            S1, the sideband selector.", "The outputs of the mixers are on Pin 5 of U3 and Pins 4 and 5 of U4. U4 utilizes both output pins to accommodate switch S1, the sideband selector."], "jumps": ["P13510", "P13450"]}, {"id": "P13510", "text": ["14.  Using the counter, place the probe on PC 130-452 TP8 and \n        place S1 in the USB position.  With a small screwdriver,  \n        adjust R10, (USB) to 10.001 MHz (\u00b1 2 kHz).  Now place S1 to \n        the LSB position.  Adjust R9 to 9.999 MHz  (\u00b1 2 kHz).", "14. Using the counter, place the probe on PC 130-452 TP8 and place S1 in the USB position. With a small screwdriver, adjust R10, (USB) to 10.001 MHz (", "2 kHz). Now place S1 to the LSB position. Adjust R9 to 9.999 MHz ("], "jumps": ["P13520", "P13450"]}, {"id": "P13520", "text": ["The signals from the two mixers are brought together in the           summing amplifier.\n 15.  Place the CH1 probe on TP8 (the transmitter output) and                 adjust L1 for maximum signal strength.", "The signals from the two mixers are brought together in the summing amplifier. 15. Place the CH1 probe on TP8 (the transmitter output) and adjust L1 for maximum signal strength."], "jumps": ["P13530", "P13450"]}, {"id": "P13530", "text": ["Receiver\nThis portion of the experiment deals with the SSB receiver. Reiterating from previous discussion, the SSB receiver is basically an SSB transmitter in reverse.", "Receiver This portion of the experiment deals with the SSB receiver. Reiterating from previous discussion, the SSB receiver is basically an SSB transmitter in reverse."], "jumps": ["P13540", "P13450"]}, {"id": "P13540", "text": ["The signals you observed and measured in the transmitter are recreated in the receiver and so not as much time will be spent in that pursuit.  However, you will be able to observe the signal         reconstruction.", "The signals you observed and measured in the transmitter are recreated in the receiver and so not as much time will be spent in that pursuit. However, you will be able to observe the signal reconstruction."], "jumps": ["P13550", "P13530"]}, {"id": "P13550", "text": ["Following TP1 on PC130-453, the receiver's antenna input, is a tunable circuit consisting of C1 and L1.  As with the tunable circuit at the transmitter's antenna, this should be tuned for maximum signal.", "Following TP1 on PC130-453, the receiver's antenna input, is a tunable circuit consisting of C1 and L1. As with the tunable circuit at the transmitter's antenna, this should be tuned for maximum signal.", "{iRI, -5NXmllhuodhh^Zbbbbb^Z^hcZ^ZhbhbcaZaZZbhb", "ie|etiL -<Oe{zh{h{{z^ciWR-:%:;NZmhhhuybbh^^ZZZZbbbbZ^ZbhbhbbbbbbbcbbZ"], "jumps": ["P13560", "P13530"]}, {"id": "P13560", "text": ["This can be accomplished using TP1 as your signal viewing source, but there is a great deal of noise present at the antenna. It is best to use TP3 (USB/LSB amplifier/filter) for this endeavor."], "jumps": ["P13570", "P13550"]}, {"id": "P13570", "text": ["1.  Connect the CH1 probe to TP3.  Ensure that both the receiver       and the transmitter are set to USB and adjust L1 for maximum       signal strength.  Change the transmitter and receiver to LSB          and repeat the same process.", "1. Connect the CH1 probe to TP3. Ensure that both the receiver and the transmitter are set to USB and adjust L1 for maximum signal strength. Change the transmitter and receiver to LSB and repeat the same process."], "jumps": ["P13580", "P13550"]}, {"id": "P13580", "text": ["The 40 MHz oscillator and subsequent Flip/Flop divider are             identical to the circuitry used in the transmitter and performs         exactly the same function --- creation of the 10 MHz carrier              frequency at four different phases, 90 degrees apart.", "The 40 MHz oscillator and subsequent Flip/Flop divider are identical to the circuitry used in the transmitter and performs exactly the same function --- creation of the 10 MHz carrier frequency at four different phases, 90 degrees apart."], "jumps": ["P13590", "P13550"]}, {"id": "P13590", "text": ["TP4 (90 degrees) and TP5 (0 degrees) can be used to view the signals. 2. Set the oscilloscope to Dual Trace at .2 ms and .2 V/Div. Place the CH1 probe on TP4 and the CH 2 probe on TP5. P5. TP5."], "jumps": ["P13600", "P13550"]}, {"id": "P13600", "text": ["3.  Compare the signals and note the 90 degree phase shift.", "3. Compare the signals and note the 90 degree phase shift."], "jumps": ["P13610", "P13550"]}, {"id": "P13610", "text": ["The 10 MHz signals mix with the audio in U1 and U2 and are           then filtered and amplified in U3 and U4 while maintaining the        90 degree phase shift.", "The 10 MHz signals mix with the audio in U1 and U2 and are then filtered and amplified in U3 and U4 while maintaining the 90 degree phase shift."], "jumps": ["P13620", "P13550"]}, {"id": "P13620", "text": ["The outputs of the active filters (TP2 and 3) show the carrier           now modulated by the audio.\n4.  Place the oscilloscope probes on the TP2 and TP3 and                    observe the signals.", "The outputs of the active filters (TP2 and 3) show the carrier now modulated by the audio. 4. Place the oscilloscope probes on the TP2 and TP3 and observe the signals."], "jumps": ["P13630", "P13550"]}, {"id": "P13630", "text": ["5.  After leaving PC130-453 the signals enter the AM Detector,             passing through yet another pair of active filters/amplifiers.            Using the same oscilloscope settings used on the previous           card,  place the scope probes on TP1 and TP2.  Observe the          signals.", "5. After leaving PC130-453 the signals enter the AM Detector, passing through yet another pair of active filters/amplifiers. Using the same oscilloscope settings used on the previous card, place the scope probes on TP1 and TP2. Observe the signals."], "jumps": ["P13640", "P13550"]}, {"id": "P13640", "text": ["Y1, U7, U6a and U6b make up the oscillator/divider circuitry             that provide a control signal in four phases, 90 degrees apart,        used to enable the analog switches that make up the two                mixers.", "Y1, U7, U6a and U6b make up the oscillator/divider circuitry that provide a control signal in four phases, 90 degrees apart, used to enable the analog switches that make up the two mixers."], "jumps": ["P13650", "P13630"]}, {"id": "P13650", "text": ["6.  Place the CH1 probe on any of the four test points: \n     TP4, 5, 6, or 7.  Measure the frequency at the test point.", "6. Place the CH1 probe on any of the four test points: TP4, 5, 6, or 7. Measure the frequency at the test point."], "jumps": ["P13660", "P13630"]}, {"id": "P13660", "text": ["What was the measured frequency?", "What was the measured frequency?uestion with 3 tries...................) in a variable.able.le."], "jumps": ["P13630", "P2800"]}, {"id": "P13661", "text": [], "jumps": []}, {"id": "P13663", "text": ["Your answer was incorrect.  You should have answered 3.6 kHz.", "Your answer was incorrect. You should have answered 3.6 kHz..0 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
