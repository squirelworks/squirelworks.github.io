const book = {"title": "9395B402", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TIME DIVISION MULTIPLEXING CIRCUIT OPERATIONsadf"], "jumps": []}, {"id": "P10", "text": ["TIME DIVISION MULTIPLEXING CIRCUIT OPERATION"], "jumps": []}, {"id": "P100", "text": ["1. Time Division Multiplexing TDM Transmitter Circuits", "2. Time Division Multiplexing TDM Receiver Circuits", "w Observe the operation of a typical TDM multiplexer. w Measure signals in a typical TDM multiplexer.", "w Observe the operation of a typical TDM demultiplexer. w Measure signals in a typical TDM demultiplexer........................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["To gain an understanding of Time Division Multiplexing (TDM) circuits, you will observe the operation of a typical TDM Multiplexer or Transmitter and a TDM Demultiplexer or Receiver circuits."], "jumps": ["P410", "P301"]}, {"id": "P410", "text": ["First the multiplexer circuit is set up and analyzed to produce a TDM signal."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The TDM Demultiplexer circuit is analyzed using the TDM signal from the multiplexer."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The circuits use four information channels and one SYNC pulse channel."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["The MC14051 chip is used as the multiplexer and demultiplexer."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["The other circuits use standard digital counters, op-amps, and logic gates."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["Other types of chips may be used for multiplexing and demultiplexing.  The chips used in this lesson are typical and give you a basic understanding of TDM system operation and maintenance techniques.", "Other types of chips may be used for multiplexing and demultiplexing. The chips used in this lesson are typical and give you a basic understanding of TDM system operation and maintenance techniques."], "jumps": ["P470", "P400"]}, {"id": "P470", "text": ["Let's begin the lesson on TDM CIRCUIT OPERATION..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1030", "text": ["In this experiment, you will observe the operation and measure signals in a typical TDM transmitter circuit.", "The transmitter circuit is contained on PC130-305 and consists of the components necessary to support the multiplexer chip (IC2)."], "jumps": ["P1040", "P1001", "P1050", "P1030"]}, {"id": "P1050", "text": ["Four information signals are applied through individual operational amplifiers in IC1."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The gain of each information input is independently set by R22 through R25."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The output of the amplifiers are applied through a bias network to the multiplexer inputs X1 through X4."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Biasing of each information signal places them at a positive level."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The SYNC pulse input is X0 and is ground.  This will make the SYNC pulse different from a positive information signal on X1 through X4.", "The SYNC pulse input is X0 and is ground. This will make the SYNC pulse different from a positive information signal on X1 through X4."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["Inputs X5 through X7 are not used and are grounded.  The inhibit input is also grounded to allow the chip to operate.", "Inputs X5 through X7 are not used and are grounded. The inhibit input is also grounded to allow the chip to operate."], "jumps": ["P1110", "P1040"]}, {"id": "P1110", "text": ["The TDM output is taken from pin 3, through a bias network and level control.  This places the SYNC pulse to a negative level.", "The control circuit is a MC14040B counter.", "The TDM output is taken from pin 3, through a bias network and level control. This places the SYNC pulse to a negative level.", "The control circuit is a MC14040B counter.................."], "jumps": ["P1120", "P1040", "P1130"]}, {"id": "P1130", "text": ["The Q1 through Q3 outputs of the counter are used as the A, B and C inputs to the multiplexer."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The counter also uses the Q1 and Q3 outputs as a reset signal."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["When the count is 101, the fifth count, the IC4c LOW output is inverted to a HIGH in IC4d.  The HIGH resets the counter.", "When the count is 101, the fifth count, the IC4c LOW output is inverted to a HIGH in IC4d. The HIGH resets the counter."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Remember, only five inputs are used, X0 is the SYNC pulse and X1 through X4 are the information inputs."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["The counter counts from 000 to 101 to select one of the five inputs and then starts over."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["The clock circuit is formed by IC4a and IC4b, a schmitt trigger."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["The sample rate is set by R15.", "Now, pick up the PC130-305 card and compare to the schematic."], "jumps": ["P1200", "P1120", "P1210"]}, {"id": "P1210", "text": ["R22 through R25 are the four information input signal adjustments."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["R15 is the clock or sample rate adjustment."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["R17 is the TDM output level adjustment."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["Match up the other components on the card to the schematic.  Let's start the experiment.", "Match up the other components on the card to the schematic. Let's start the experiment."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1200"]}, {"id": "P1270", "text": ["2.  Set the Positive Supply Voltage to 15.\n3.  Set the Negative Supply Voltage to 15.  The Test Console's            voltage meter should indicate 15 volts.", "2. Set the Positive Supply Voltage to 15. 3. Set the Negative Supply Voltage to 15. The Test Console's voltage meter should indicate 15 volts."], "jumps": ["P1250"]}, {"id": "P1290", "text": ["4.  Carefully plug PC130-322 into the Test Console PC1 position.", "4. Carefully plug PC130-322 into the Test Console PC1 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1270", "P1300"]}, {"id": "P1300", "text": ["5.  On PC130-322, set all controls to mid position.", "5. On PC130-322, set all controls to mid position.PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "MEASUREMENT SETUP - Set all controls to the mid position."], "jumps": ["P1290", "P1310", "P1305"]}, {"id": "P1310", "text": ["6.  Carefully plug PC130-305 into the Test Console PC2 position.", "6. Carefully plug PC130-305 into the Test Console PC2 position."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["7.  On PC130-305, set all controls to mid position.", "7. On PC130-305, set all controls to mid position.........", "MEASUREMENT SETUP - Set all controls to mid position."], "jumps": ["P1310", "P1325"]}, {"id": "P1330", "text": ["8.  Turn PC1 DC Power switch to ON.  The first PC card to set up        is the quad tone generator, the information sources.", "8. Turn PC1 DC Power switch to ON. The first PC card to set up is the quad tone generator, the information sources."], "jumps": ["P1320"]}, {"id": "P1340", "text": ["1.  Using the oscilloscope, measure the 500 Hz TP on PC130-322       and adjust the controls as follows:", "1. Using the oscilloscope, measure the 500 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 500 Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1350", "P1330", "P1345"]}, {"id": "P1350", "text": ["2.  Using the oscilloscope, measure the 1000 Hz TP on \n      PC130- 322 and adjust the controls as follows:", "2. Using the oscilloscope, measure the 1000 Hz TP on PC130- 322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 1000Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1360", "P1340", "P1355"]}, {"id": "P1360", "text": ["3.  Using the oscilloscope, measure the 1500 Hz TP on PC130-            322 and adjust the controls as follows:", "3. Using the oscilloscope, measure the 1500 Hz TP on PC130- 322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 1500Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1370", "P1350", "P1365"]}, {"id": "P1370", "text": ["4.  Using the oscilloscope, measure the 2000 Hz TP on PC130-            322 and adjust the controls as follows:", "4. Using the oscilloscope, measure the 2000 Hz TP on PC130- 322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 2000Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P1380", "P1360", "P1375"]}, {"id": "P1380", "text": ["5.  Using an alligator to alligator jumper, connect the 2000 Hz TP        on PC130-322 to TP4 on PC130-305.  This connects the CH4          output of the generator card to the CH4 input of the                           multiplexer.  The Test Console supplies the connections for           CH1, CH2 and CH3.", "5. Using an alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305. This connects the CH4 output of the generator card to the CH4 input of the multiplexer. The Test Console supplies the connections for CH1, CH2 and CH3.", "MEASUREMENT SETUP - Using alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305."], "jumps": ["P1390", "P1370", "P1385"]}, {"id": "P1390", "text": ["6.  Using the oscilloscope, measure the signals on PC130-305            TP1, TP2, TP3 and TP4.  Do you have 500, 1000, 1500 and               2000 Hz signals at 0.5 Vpp on TP1, TP2, TP3 and TP4                        respectfully?", "6. Using the oscilloscope, measure the signals on PC130-305 TP1, TP2, TP3 and TP4. Do you have 500, 1000, 1500 and 2000 Hz signals at 0.5 Vpp on TP1, TP2, TP3 and TP4 respectfully?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The quad tone generator card is not set up correctly or there is a problem with the connection between the two cards.  Make sure you have a jumper between PC130-322 2000 Hz TP and PC130-305 TP4.  Do not continue until you have the correct signals on PC130-305.", "The quad tone generator card is not set up correctly or there is a problem with the connection between the two cards. Make sure you have a jumper between PC130-322 2000 Hz TP and PC130-305 TP4. Do not continue until you have the correct signals on PC130-305."], "jumps": []}, {"id": "P1400", "text": ["The quad tone generator card is set up and operating correctly.  It is supplying four analog signals to be multiplexed.  Let's align the TDM multiplexer circuit now.", "The quad tone generator card is set up and operating correctly. It is supplying four analog signals to be multiplexed. Let's align the TDM multiplexer circuit now."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["1.  Turn PC2 DC Power switch to ON.  This energizes the TDM            multiplexer.", "1. Turn PC2 DC Power switch to ON. This energizes the TDM multiplexer....."], "jumps": ["P1400"]}, {"id": "P1420", "text": ["2.  Using the oscilloscope, measure and adjust the following for          a 3 Vpp signal on PC130-305:", "2. Using the oscilloscope, measure and adjust the following for a 3 Vpp signal on PC130-305:", "a. TP5 adjust R22 b. TP6 adjust R23 c. TP7 adjust R24 d. TP8 adjust R25p signal................", "MEASUREMENT SETUP - Measure & adjust for a 3 Vpp signal."], "jumps": ["P1430", "P1410", "P1425"]}, {"id": "P1430", "text": ["The level of the four information signals have been set for use in the multiplexer circuit.  Now, let's calculate the sample rate.", "The level of the four information signals have been set for use in the multiplexer circuit. Now, let's calculate the sample rate."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The multiplexing circuit is designed for voice signals, 40 Hz to 4 kHz and 5 information sources (1 SYNC pulse and 4 information). Calculate and type in the bandwidth of the system?", "The multiplexing circuit is designed for voice signals, 40 Hz to 4 kHz and 5 information sources (1 SYNC pulse and 4 information). Calculate and type in the bandwidth of the system??"], "jumps": ["P1430", "P1442", "P1445"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["Remember, there are five sources and the highest bandwidth is 4 kHz."], "jumps": []}, {"id": "P1445", "text": ["BW(TDM) = BW(information) x nve output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "BW(TDM) - The bandwidth of a TDM system is the highest bandwidth of the information times the number of input sources, including the SYNC pulse."], "jumps": []}, {"id": "P1447", "text": ["You still have not calculated the TDM bandwidth.  You should have calculated 20 kHz or 4 kHz times 5.", "You still have not calculated the TDM bandwidth. You should have calculated 20 kHz or 4 kHz times 5.", "BW(TDM) = BW(information) x nve output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal.............."], "jumps": ["P1450", "P1440"]}, {"id": "P1450", "text": ["With a BW(TDM) of 20 kHz, calculate and type in the minimum sample rate.", "With a BW(TDM) of 20 kHz, calculate and type in the minimum sample rate..) in a variable.able.le."], "jumps": ["P1440", "P1455", "P1452"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["Remember, the minimum sample rate is equal to the Nyquist rate."], "jumps": []}, {"id": "P1455", "text": ["SAMPLE RATE = 2 x BW(TDM)ion) x nutput at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MINIMUM SAMPLE RATE - The minimum sample rate that can be used is the Nyquist rate. The Nyquist rate is twice the bandwidth of the system."], "jumps": []}, {"id": "P1457", "text": ["You should have calculated 40 kHz or twice the bandwidth of the TDM system, 20 kHz."], "jumps": ["P1460", "P1450"]}, {"id": "P1460", "text": ["Now that you know the minimum sample rate is 40 kHz, you must set the frequency of the clock so that the counter produces the correct frequency of Q outputs.  In this case, since there are five sources, you must multiply the sample rate by 5.  The frequency for the clock is 200 kHz.", "Now that you know the minimum sample rate is 40 kHz, you must set the frequency of the clock so that the counter produces the correct frequency of Q outputs. In this case, since there are five sources, you must multiply the sample rate by 5. The frequency for the clock is 200 kHz."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["3.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust              R15 for a 200 kHz +5 kHz signal on TP12 of PC130-305.", "3. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust R15 for a 200 kHz +5 kHz signal on TP12 of PC130-305.", "MEASUREMENT SETUP - Adjust R15 for a 200 kHz +5 kHz signal on TP12."], "jumps": ["P1480", "P1460", "P1475"]}, {"id": "P1480", "text": ["The TDM multiplexer is now aligned and multiplexing four information signals and one SYNC pulse."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["1.  Set the oscilloscope controls as follows:", "1. Set the oscilloscope controls as follows:..............", "Volt/Div - .1V (use a X10 probe) Time/Div - 5 ms Triggering - CH1, AC, Negative Coupling - DCC"], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["2.  Place the AC/GND/DC switch to GND and position the CH1             trace in the center of the screen.\n3.  Place the AC/GND/DC switch to DC.", "2. Place the AC/GND/DC switch to GND and position the CH1 trace in the center of the screen. 3. Place the AC/GND/DC switch to DC."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["4. Connect the CH1 probe to PC130-305 TP9. 5. Adjust the Time/Div variable setting to allow only two complete frames to be shown. Adjust PC130-305 R17 until the basic shape of the waveform looks like the waveform shown below. The Gain and Dist potentiometers should be adjusted until the signals in T2, T3, T4 and T5 are 1V. (1 div.) , T4 and T5 are 1V."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["The oscilloscope is displaying the TDM signal.  Notice that there are five time sections and two frames.  The SYNC pulse and four information signals.", "The oscilloscope is displaying the TDM signal. Notice that there are five time sections and two frames. The SYNC pulse and four information signals."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Using the signal on the oscilloscope and the signal shown, which time period is the SYNC pulse transmitted?"], "jumps": ["P1510"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["During T2, the channel one information signal is transmitted."], "jumps": []}, {"id": "P1533", "text": ["During T3, the channel two information signal is transmitted."], "jumps": []}, {"id": "P1534", "text": ["During T4, the channel three information signal is transmitted."], "jumps": []}, {"id": "P1535", "text": ["During T5, the channel four information signal is transmitted."], "jumps": []}, {"id": "P1540", "text": ["As you can see, the SYNC pulse is a negative pulse that is different from the information signals.  This will be important in the demultiplexer circuit.", "As you can see, the SYNC pulse is a negative pulse that is different from the information signals. This will be important in the demultiplexer circuit."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["6.  Adjust the gain controls on PC130-322 for each channel one          at time and observe the results in the TDM signal.", "6. Adjust the gain controls on PC130-322 for each channel one at time and observe the results in the TDM signal."], "jumps": ["P1560", "P1540", "P1555"]}, {"id": "P1552", "text": ["6.  Adjust the gain controls on PC130-322 for each channel, one         at time and observe the results in the TDM signal.", "6. Adjust the gain controls on PC130-322 for each channel, one at time and observe the results in the TDM signal.", "MEASUREMENT SETUP - Adjust the gain controls for each channel, one at a time and observe the results."], "jumps": ["P1560", "P1540", "P1555"]}, {"id": "P1560", "text": ["Notice that when adjusting CH1, the T2 signal is effected and when CH2 is adjusted the T3 signal is effected.  Each information signal is transmitted one at a time after the SYNC pulse.", "Notice that when adjusting CH1, the T2 signal is effected and when CH2 is adjusted the T3 signal is effected. Each information signal is transmitted one at a time after the SYNC pulse."], "jumps": ["P1570", "P1552"]}, {"id": "P1570", "text": ["7.  Return the GAIN controls on PC130-322 for a 1 Vpp signal for        each channel (using a X10 probe, that is .1 Vpp or one block          on the oscilloscope screen).", "7. Return the GAIN controls on PC130-322 for a 1 Vpp signal for each channel (using a X10 probe, that is .1 Vpp or one block on the oscilloscope screen)."], "jumps": ["P1580", "P1552"]}, {"id": "P1580", "text": ["8.  Move the CH1 trace to the top of the screen.\n9.  Using the CH2 probe of the oscilloscope, measure the                     remaining test points on PC130-305.", "8. Move the CH1 trace to the top of the screen. 9. Using the CH2 probe of the oscilloscope, measure the remaining test points on PC130-305."], "jumps": ["P1590", "P1552"]}, {"id": "P1590", "text": ["You have aligned and measured signals in the TDM multiplexer circuit.  The type of signals on the test points will be important when troubleshooting.", "You have aligned and measured signals in the TDM multiplexer circuit. The type of signals on the test points will be important when troubleshooting."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["1.  Disconnect all test equipment from the circuit.\n2.  Return the Test Console to the initial control settings.", "1. Disconnect all test equipment from the circuit. 2. Return the Test Console to the initial control settings."], "jumps": ["P1590"]}, {"id": "P1610", "text": ["3.  Place Console Power to OFF.", "3. Place Console Power to OFF.h to OFF...................."], "jumps": ["P1600", "P"]}, {"id": "P1620", "text": ["4.  Remove PC130-322 and PC130-305 from the Test Console.\n5.  Return all equipment to the designated storage areas.", "4. Remove PC130-322 and PC130-305 from the Test Console. 5. Return all equipment to the designated storage areas."], "jumps": ["P1910", "P1610"]}, {"id": "P1910", "text": ["This completes the experiment on TDM TRANSMITTERS.", "This completes the experiment on TDM TRANSMITTERS.E........"], "jumps": ["P1620"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment the operation and measurement of signals in a typical TDM receiver circuit will be observed.", "The receiver circuit is contained on PC130-306 and consists of the components necessary to support the demultiplexer."], "jumps": ["P2040", "P2001", "P2050", "P2020"]}, {"id": "P2050", "text": ["The TDM signal is sent through a bias network and SYNC detector Q1, to a level control R1 then, to the demultiplexer IC4."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The demultiplexer uses the X1 through X4 as the outputs.  X0 is not used because it is the SYNC pulse and not information.", "The demultiplexer uses the X1 through X4 as the outputs. X0 is not used because it is the SYNC pulse and not information."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Each output of the demultiplexer is applied to individual operational amplifiers through a bias network."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["R26 through R29 control the gains of each amplifier independently."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["The clock circuit is formed by IC2b and IC2c and set by R10.", "The control circuit is a MC14040B counter.", "The control circuit is a MC14040B counter.................."], "jumps": ["P2100", "P2040", "P2110"]}, {"id": "P2110", "text": ["Note that the outputs of Q3 through Q6 are used."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The Q3 output drives the inhibit input of the demultiplexer.  It is used to set up guard times.", "The Q3 output drives the inhibit input of the demultiplexer. It is used to set up guard times."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The Q4, Q5 and Q6 outputs control the A, B and C inputs to the demultiplexer."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["When the count is 0000, the demultiplexer is not inhibited and selects the X0 output, SYNC pulse."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["When the count becomes 1000, the demultiplexer is inhibited and the operation of the chip is disabled."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["When the count becomes 0100, the demultiplexer is not inhibited and selects the X1 output."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["When the count becomes 1100, the demultiplexer is inhibited and disables the X1 output."], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["When the count becomes 0010, the demultiplexer is not inhibited and selects the X2 output."], "jumps": ["P2190", "P2100"]}, {"id": "P2190", "text": ["When the count becomes 1010, the demultiplexer is inhibited and disables the X2 output."], "jumps": ["P2200", "P2100"]}, {"id": "P2200", "text": ["Remember, when Q3 is HIGH, the demultiplexer is disabled.", "The SYNC detector consists of Q1, IC2a and IC2d.", "The SYNC detector consists of Q1, IC2a and IC2d............"], "jumps": ["P2210", "P2100", "P2220"]}, {"id": "P2220", "text": ["When the TDM input is a positive level, meaning that information is being received, Q1 turns ON producing a LOW to IC2a."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The LOW on IC2a produces a LOW signal out of the schmitt trigger of IC2a and IC2d, IC3 is not reset."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["When the TDM input is a negative level, meaning that a SYNC pulse is being received, Q1 turns OFF producing a HIGH to IC2a."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["The HIGH on IC2a produces a HIGH signal out of the schmitt trigger of IC2a and IC2d, IC3 is reset."], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["The counter circuit gets reset whenever a SYNC pulse is received.", "Compare the PC130-306 card to the schematic.", "Compare the PC130-306 card to the schematic................"], "jumps": ["P2270", "P2210", "P2280"]}, {"id": "P2280", "text": ["R1 is the TDM input level control."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["R7 controls the SYNC detector circuit and R10 controls the clock."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["R26 through R29 set the output amplitude of the four information signals."], "jumps": ["P2270"]}, {"id": "P2310", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The TDM Transmitter circuit cards must be aligned as per the TDM Transmitter experiment before entering the TDM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select TDM Transmitters and align the circuit cards.", "NOTE TDM Transmitter circuit cards must be aligned as per the TDM Transmitter experiment before entering the TDM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select TDM Transmitters and align the circuit cards."], "jumps": ["P2320", "P2270"]}, {"id": "P2320", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2310"]}, {"id": "P2330", "text": ["2.  Set the Positive Supply Voltage to 15.\n3.  Set the Negative Supply Voltage to 15.  The Test Console's            voltage meter should indicate 15 volts.", "2. Set the Positive Supply Voltage to 15. 3. Set the Negative Supply Voltage to 15. The Test Console's voltage meter should indicate 15 volts."], "jumps": ["P2320"]}, {"id": "P2350", "text": ["4.  Carefully plug PC130-306 into the Test Console PC3 position.", "4. Carefully plug PC130-306 into the Test Console PC3 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2330", "P2360"]}, {"id": "P2360", "text": ["5.  Set all potentiometers on PC130-306 to mid position.", "5. Set all potentiometers on PC130-306 to mid position....", "MEASUREMENT SETUP - Set all controls to mid position."], "jumps": ["P2370", "P2350", "P2365"]}, {"id": "P2370", "text": ["6.  Turn PC1, PC2 and PC3 DC Power switches to ON.", "6. Turn PC1, PC2 and PC3 DC Power switches to ON.A - Set the PC1 DC Switch to ON...."], "jumps": ["P2360"]}, {"id": "P2380", "text": ["7.  Set up the oscilloscope as follows:", "8.  Connect the oscilloscope probe to PC130-306 TP1.  Verify that       the TDM signal is present on the input to the demultiplexer.", "7. Set up the oscilloscope as follows:ault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "Volt/Div - 0.1 (use a X10 probe) Time/Div - 5 ms Triggering - CH1, AC, Negative Coupling - DCCC", "8. Connect the oscilloscope probe to PC130-306 TP1. Verify that the TDM signal is present on the input to the demultiplexer."], "jumps": ["P2370", "P2400", "P2380", "P"]}, {"id": "P2400", "text": ["The transmitted TDM signal is being received by the demultiplexer.  Now, let's align the demultiplexer circuit.", "The transmitted TDM signal is being received by the demultiplexer. Now, let's align the demultiplexer circuit."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["1.  Change the display mode on the oscilloscope to dual and set        the CH2 Volt/Div to 2.\n2.  Maintain the CH1 X10 probe on PC130-306 TP1.", "1. Change the display mode on the oscilloscope to dual and set the CH2 Volt/Div to 2. 2. Maintain the CH1 X10 probe on PC130-306 TP1."], "jumps": ["P2420", "P2390"]}, {"id": "P2420", "text": ["3.  Connect a X10 probe to PC130-306 TP3.  This is the SYNC              detector output.", "3. Connect a X10 probe to PC130-306 TP3. This is the SYNC detector output."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["4.  Adjust PC130-306 R7 so that the reset pulse occurs on the             leading edge of the SYNC pulse as shown.  Look closely, the         sync pulse is very small.", "4. Adjust PC130-306 R7 so that the reset pulse occurs on the leading edge of the SYNC pulse as shown. Look closely, the sync pulse is very small."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["You have adjusted the SYNC detector circuit.  The SYNC pulse must be set up correctly.  Remember, the SYNC pulse sets the timing for the counter that controls the demultiplexing.  Let's set up the clock now.", "You have adjusted the SYNC detector circuit. The SYNC pulse must be set up correctly. Remember, the SYNC pulse sets the timing for the counter that controls the demultiplexing. Let's set up the clock now."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["1.  Using the internal frequency counter in the function                          generator.  Adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal        as measured on TP5.", "1.5 MHz is used as the clock frequency because the counter uses the outputs of Q3 through Q6.  The frequency must be higher to match the 200 kHz clock in the multiplexer.  The demultiplexer is now aligned.  Let's look at the outputs.", "1. Using the internal frequency counter in the function generator. Adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal as measured on TP5.", "MEASUREMENT SETUP - Adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal as measured on TP5.", "1.5 MHz is used as the clock frequency because the counter uses the outputs of Q3 through Q6. The frequency must be higher to match the 200 kHz clock in the multiplexer. The demultiplexer is now aligned. Let's look at the outputs..."], "jumps": ["P2460", "P2410", "P2455"]}, {"id": "P2470", "text": ["1. Disconnect the oscilloscope and frequency counter from the circuits. 2. Connect the CH1 probe to PC130-305 TP1. Set the Time/Div as necessary to view one cycle. Remember a X10 probe is used. TP1 on PC130-305 is the CH1 information input signal to the multiplexer.", "MEASUREMENT SETUP - Connect CH1 oscilloscope probe to PC130-305 TP1."], "jumps": ["P2480", "P2460", "P2475"]}, {"id": "P2480", "text": ["3.  Connect the CH2 probe to PC130-306 TP10.\n4.  Adjust PC130-306 R26 as necessary.  This is the CH1 output          of  the demultiplexer, notice that it is inverted and noisy.", "3. Connect the CH2 probe to PC130-306 TP10. 4. Adjust PC130-306 R26 as necessary. This is the CH1 output of the demultiplexer, notice that it is inverted and noisy.", "MEASUREMENT SETUP - Connect the CH2 oscilloscope probe to PC130-306 TP10. Adjust R26 as necessary."], "jumps": ["P2490", "P2470", "P2485"]}, {"id": "P2490", "text": ["What frequency is the signal on CH2 of the oscilloscope?", "What frequency is the signal on CH2 of the oscilloscope?..."], "jumps": ["P2480"]}, {"id": "P2491", "text": [], "jumps": []}, {"id": "P2492", "text": ["The 1000 Hz signal is the channel two input to the TDM system.  It should not be the CH1 output of the demultiplexer.", "The 1000 Hz signal is the channel two input to the TDM system. It should not be the CH1 output of the demultiplexer."], "jumps": []}, {"id": "P2493", "text": ["The 1500 Hz signal is the channel four input to the TDM system. It should not be the CH1 output of the demultiplexer.", "The 1500 Hz signal is the channel four input to the TDM system. It should not be the CH1 output of the demultiplexer.."], "jumps": []}, {"id": "P2494", "text": ["The 2000 Hz signal is the channel two input to the TDM system.  It should not be the CH1 output of the demultiplexer.", "The 2000 Hz signal is the channel two input to the TDM system. It should not be the CH1 output of the demultiplexer."], "jumps": []}, {"id": "P2500", "text": ["5.  Move the CH1 probe to PC130-305 TP2 and the CH2 probe to        PC130-306 TP11.", "5. Move the CH1 probe to PC130-305 TP2 and the CH2 probe to PC130-306 TP11.", "MEASUREMENT SETUP - Connect CH1 oscilloscope probe to PC130-305 TP2.", "MEASUREMENT SETUP - Connect the CH2 oscilloscope probe to PC130-306 TP11. Adjust R27 as necessary."], "jumps": ["P2510", "P2490", "P2505", "P2506", "P2500"]}, {"id": "P2510", "text": ["What frequency is the signal on CH2 of the oscilloscope?", "What frequency is the signal on CH2 of the oscilloscope?..."], "jumps": ["P2500"]}, {"id": "P2511", "text": [], "jumps": []}, {"id": "P2512", "text": ["The 500 Hz signal is the CH1 input to the TDM system.  It should not be the CH2 output of the demultiplexer.", "The 500 Hz signal is the CH1 input to the TDM system. It should not be the CH2 output of the demultiplexer."], "jumps": []}, {"id": "P2513", "text": ["The 1500 Hz signal is the CH1 input to the TDM system.  It should not be the CH2 output of the demultiplexer.", "The 1500 Hz signal is the CH1 input to the TDM system. It should not be the CH2 output of the demultiplexer."], "jumps": []}, {"id": "P2514", "text": ["The 2000 Hz signal is the CH1 input to the TDM system.  It should not be the CH2 output of the demultiplexer.", "The 2000 Hz signal is the CH1 input to the TDM system. It should not be the CH2 output of the demultiplexer."], "jumps": []}, {"id": "P2520", "text": ["6.  Move the CH1 probe to PC130-305 TP3 and the CH2 probe to        PC130-306 TP12.", "You are viewing the input to CH3 and the TDM system output.", "6. Move the CH1 probe to PC130-305 TP3 and the CH2 probe to PC130-306 TP12.", "MEASUREMENT SETUP - Connect CH1 oscilloscope probe to PC130-305 TP3.", "MEASUREMENT SETUP - Connect the CH2 oscilloscope probe to PC130-306 TP12. Adjust R28 as necessary."], "jumps": ["P2530", "P2510", "P2525", "P2526", "P2520"]}, {"id": "P2540", "text": ["7.  Move the CH1 probe to PC130-305 TP4 and the CH2 probe to        PC130-306 TP13.\n8.  Adjust PC130-306 R29 as necessary.", "7. Move the CH1 probe to PC130-305 TP4 and the CH2 probe to PC130-306 TP13. 8. Adjust PC130-306 R29 as necessary.", "MEASUREMENT SETUP - Connect CH1 oscilloscope probe to PC130-305 TP4.", "MEASUREMENT SETUP - Connect the CH2 oscilloscope probe to PC130-306 TP13. Adjust R29 as necessary."], "jumps": ["P2550", "P2530", "P2545", "P2546", "P2540"]}, {"id": "P2550", "text": ["You are viewing the CH3 input and output of the TDM system."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["The TDM demultiplexer is operating correctly, taking the one TDM signal and separating it into four different outputs that match the four different inputs of the multiplexer.  Now let's measure the other test points in the demultiplexer.", "The TDM demultiplexer is operating correctly, taking the one TDM signal and separating it into four different outputs that match the four different inputs of the multiplexer. Now let's measure the other test points in the demultiplexer."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["1.  Connect the oscilloscope CH1 probe to PC130-306 TP1.\n2.  Set the oscilloscope controls to view the TDM signal and                place the signal on the top of the screen.", "1. Connect the oscilloscope CH1 probe to PC130-306 TP1. 2. Set the oscilloscope controls to view the TDM signal and place the signal on the top of the screen.", "MEASUREMENT SETUP - Connect CH1 oscilloscope probe to PC130-306 TP1."], "jumps": ["P2580", "P2560", "P2575"]}, {"id": "P2580", "text": ["3.  Using the CH2 probe, measure the remaining test points on           PC130-306.", "3. Using the CH2 probe, measure the remaining test points on PC130-306."], "jumps": ["P2590", "P2570", "P2585"]}, {"id": "P2582", "text": ["3.  Using the CH2 probe, measure the remaining test points on           PC130-306.", "3. Using the CH2 probe, measure the remaining test points on PC130-306.", "MEASUREMENT SETUP - Using the CH2 probe, measure the remaining test points on PC130-306."], "jumps": ["P2590", "P2570", "P2585"]}, {"id": "P2590", "text": ["You have aligned and measured signals in the TDM demultiplexer circuit.  The circuit takes a TDM signal and produces the original information signals.  The type of signals present at the test points will be important when troubleshooting.", "You have aligned and measured signals in the TDM demultiplexer circuit. The circuit takes a TDM signal and produces the original information signals. The type of signals present at the test points will be important when troubleshooting."], "jumps": ["P2600", "P2582"]}, {"id": "P2600", "text": ["1.  Disconnect all test equipment from the circuit.\n2.  Return the Test Console to the initial control settings.", "1. Disconnect all test equipment from the circuit. 2. Return the Test Console to the initial control settings."], "jumps": ["P2590"]}, {"id": "P2610", "text": ["3.  Place console Power to OFF.", "3. Place console Power to OFF.h to OFF...................."], "jumps": ["P2600"]}, {"id": "P2620", "text": ["4.  Remove all the PC cards from the Test Console.\n5.  Return all equipment to the designated storage areas.", "4. Remove all the PC cards from the Test Console. 5. Return all equipment to the designated storage areas."], "jumps": ["P2910", "P2610"]}, {"id": "P2910", "text": ["This completes the experiment on TDM RECEIVERS.", "This completes the experiment on TDM RECEIVERS.ITLE........"], "jumps": ["P2620"]}, {"id": "P13030", "text": ["In this experiment, you will observe the operation and measure signals in a typical TDM transmitter circuit.", "The transmitter circuit is contained on PC130-305 and consists of the components necessary to support the multiplexer chip (IC2)."], "jumps": ["P13040", "P1001", "P13050", "P13030", "PpP", "P"]}, {"id": "P13050", "text": ["Four information signals are applied through individual operational amplifiers in IC1."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["The gain of each information input is independently set by R22 through R25."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["The output of the amplifiers are applied through a bias network to the multiplexer inputs X1 through X4."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["Biasing of each information signal places them at a positive level."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["The SYNC pulse input is X0 and is ground.  This will make the SYNC pulse different from a positive information signal on X1 through X4.", "The SYNC pulse input is X0 and is ground. This will make the SYNC pulse different from a positive information signal on X1 through X4."], "jumps": ["P13100", "P13040"]}, {"id": "P13100", "text": ["Inputs X5 through X7 are not used and are grounded.  The inhibit input is also grounded to allow the chip to operate.", "Inputs X5 through X7 are not used and are grounded. The inhibit input is also grounded to allow the chip to operate."], "jumps": ["P13110", "P13040"]}, {"id": "P13110", "text": ["The TDM output is taken from pin 3, through a bias network and level control.  This places the SYNC pulse to a negative level.", "The control circuit is a MC14040B counter.", "The TDM output is taken from pin 3, through a bias network and level control. This places the SYNC pulse to a negative level.", "The control circuit is a MC14040B counter.................."], "jumps": ["P13120", "P13040", "P13130", "PpP", "P"]}, {"id": "P13130", "text": ["The Q1 through Q3 outputs of the counter are used as the A, B and C inputs to the multiplexer."], "jumps": ["P13140", "P13120"]}, {"id": "P13140", "text": ["The counter also uses the Q1 and Q3 outputs as a reset signal."], "jumps": ["P13150", "P13120"]}, {"id": "P13150", "text": ["When the count is 101, the fifth count, the IC4c LOW output is inverted to a HIGH in IC4d.  The HIGH resets the counter.", "When the count is 101, the fifth count, the IC4c LOW output is inverted to a HIGH in IC4d. The HIGH resets the counter."], "jumps": ["P13160", "P13120"]}, {"id": "P13160", "text": ["Remember, only five inputs are used, X0 is the SYNC pulse and X1 through X4 are the information inputs."], "jumps": ["P13170", "P13120"]}, {"id": "P13170", "text": ["The counter counts from 000 to 101 to select one of the five inputs and then starts over."], "jumps": ["P13180", "P13120"]}, {"id": "P13180", "text": ["The clock circuit is formed by IC4a and IC4b, a schmitt trigger."], "jumps": ["P13190", "P13120"]}, {"id": "P13190", "text": ["The sample rate is set by R15.", "Now, pick up the PC130-305 card and compare to the schematic."], "jumps": ["P13200", "P13120", "P13210", "PpP", "P"]}, {"id": "P13210", "text": ["R22 through R25 are the four information input signal adjustments."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["R15 is the clock or sample rate adjustment."], "jumps": ["P13230", "P13200"]}, {"id": "P13230", "text": ["R17 is the TDM output level adjustment."], "jumps": ["P13240", "P13200"]}, {"id": "P13240", "text": ["Match up the other components on the card to the schematic.  Let's start the experiment.", "Match up the other components on the card to the schematic. Let's start the experiment."], "jumps": ["P13250", "P13200"]}, {"id": "P13250", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13200"]}, {"id": "P13270", "text": ["2.  Press Enter to set: Positive Supply Voltage - 15\n                                         Negative Supply Voltage - 15", "2. Press Enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 15"], "jumps": []}, {"id": "P13290", "text": ["3.  Carefully plug PC130-322 into the Test Console PC1 position.", "3. Carefully plug PC130-322 into the Test Console PC1 position."], "jumps": ["P13300"]}, {"id": "P13300", "text": ["4.  On PC130-322, set all controls to mid position.", "4. On PC130-322, set all controls to mid position.........", "MEASUREMENT SETUP - Set all controls to the mid position."], "jumps": ["P13310", "P13290", "P13305"]}, {"id": "P13310", "text": ["5.  Carefully plug PC130-305 into the Test Console PC2 position.", "5. Carefully plug PC130-305 into the Test Console PC2 position."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["6.  On PC130-305, set all controls to mid position.", "6. On PC130-305, set all controls to mid position.........", "MEASUREMENT SETUP - Set all controls to mid position."], "jumps": ["P13330", "P13310", "P13325"]}, {"id": "P13330", "text": ["7.  Press Enter to set: PC1 DC Power Switch - ON\n     The first PC card to set up is the quad tone generator, the               information sources.", "7. Press Enter to set: PC1 DC Power Switch - ON The first PC card to set up is the quad tone generator, the information sources."], "jumps": ["P13320"]}, {"id": "P13340", "text": ["1.  Using the oscilloscope, measure the 500 Hz TP on PC130-322       and adjust the controls as follows:", "1. Using the oscilloscope, measure the 500 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 500 Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P13350", "P13345"]}, {"id": "P13350", "text": ["2.  Using the oscilloscope, measure the 1000 Hz TP on\n     PC130-322 and adjust the controls as follows:", "2. Using the oscilloscope, measure the 1000 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 1000Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P13360", "P13340", "P13355"]}, {"id": "P13360", "text": ["3.  Using the oscilloscope, measure the 1500 Hz TP on\n     PC130-322 and adjust the controls as follows:", "3. Using the oscilloscope, measure the 1500 Hz TP on PC130-322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 1500Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P13370", "P13350", "P13365"]}, {"id": "P13370", "text": ["4.  Using the oscilloscope, measure the 2000 Hz TP on \n     PC130- 322 and adjust the controls as follows:", "4. Using the oscilloscope, measure the 2000 Hz TP on PC130- 322 and adjust the controls as follows:", "a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MEASUREMENT SETUP - Measure the 2000Hz TP and adjust the Dist. for a 2 Vpp sine wave output and the Gain for 0.5 Vpp signal."], "jumps": ["P13380", "P13360", "P13375"]}, {"id": "P13380", "text": ["5.  Using an alligator to alligator jumper, connect the 2000 Hz TP        on PC130-322 to TP4 on PC130-305.  This connects the CH4          output of the generator card to the CH4 input of the                           multiplexer.  The Test Console supplies the connections for           CH1, CH2 and CH3.", "5. Using an alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305. This connects the CH4 output of the generator card to the CH4 input of the multiplexer. The Test Console supplies the connections for CH1, CH2 and CH3.", "MEASUREMENT SETUP - Using alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to TP4 on PC130-305."], "jumps": ["P13390", "P13370", "P13385"]}, {"id": "P13390", "text": ["6.  Using the oscilloscope, measure the signals on PC130-305            TP1, TP2, TP3 and TP4.  Do you have 500, 1000, 1500 and               2000 Hz signals at 0.5 Vpp on TP1, TP2, TP3 and TP4                        respectfully?", "6. Using the oscilloscope, measure the signals on PC130-305 TP1, TP2, TP3 and TP4. Do you have 500, 1000, 1500 and 2000 Hz signals at 0.5 Vpp on TP1, TP2, TP3 and TP4 respectfully?"], "jumps": ["P13380"]}, {"id": "P13391", "text": [], "jumps": []}, {"id": "P13392", "text": ["The quad tone generator card is not set up correctly or there is a problem with the connection between the two cards.  Make sure you have a jumper between PC130-322 2000 Hz TP and \nPC130-305 TP4.  Do not continue until you have the correct signals on PC130-305.", "The quad tone generator card is not set up correctly or there is a problem with the connection between the two cards. Make sure you have a jumper between PC130-322 2000 Hz TP and PC130-305 TP4. Do not continue until you have the correct signals on PC130-305."], "jumps": []}, {"id": "P13400", "text": ["The quad tone generator card is set up and operating correctly.  It is supplying four analog signals to be multiplexed.  Let's align the TDM multiplexer circuit now.", "The quad tone generator card is set up and operating correctly. It is supplying four analog signals to be multiplexed. Let's align the TDM multiplexer circuit now."], "jumps": ["P13410", "P13390"]}, {"id": "P13410", "text": ["1.  Press Enter to set: PC2 DC Power Switch - ON\n     This energizes the TDM multiplexer.", "1. Press Enter to set: PC2 DC Power Switch - ON This energizes the TDM multiplexer."], "jumps": ["P13400"]}, {"id": "P13420", "text": ["2.  Using the oscilloscope, measure and adjust the following for         a 3 Vpp signal on PC130-305:", "2. Using the oscilloscope, measure and adjust the following for a 3 Vpp signal on PC130-305:", "a. TP5 adjust R22 b. TP6 adjust R23 c. TP7 adjust R24 d. TP8 adjust R25p signal................", "MEASUREMENT SETUP - Measure & adjust for a 3 Vpp signal."], "jumps": ["P13430", "P13425"]}, {"id": "P13430", "text": ["The level of the four information signals have been set for use in the multiplexer circuit.  Now, let's calculate the sample rate.", "The level of the four information signals have been set for use in the multiplexer circuit. Now, let's calculate the sample rate."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["The multiplexing circuit is designed for voice signals, 40 Hz to \n4 kHz and 5 information sources (1 SYNC pulse and \n4 information). Calculate and type in the bandwidth of the system?", "The multiplexing circuit is designed for voice signals, 40 Hz to 4 kHz and 5 information sources (1 SYNC pulse and 4 information). Calculate and type in the bandwidth of the system???"], "jumps": ["P13430", "P13445", "P13442"]}, {"id": "P13441", "text": [], "jumps": []}, {"id": "P13442", "text": ["Remember, there are five sources and the highest bandwidth is \n4 kHz.", "Remember, there are five sources and the highest bandwidth is 4 kHz."], "jumps": []}, {"id": "P13445", "text": ["BW(TDM) = BW(information) x nve output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "BW(TDM) - The bandwidth of a TDM system is the highest bandwidth of the information times the number of input sources, including the SYNC pulse."], "jumps": []}, {"id": "P13447", "text": ["You still have not calculated the TDM bandwidth.  You should have calculated 20 kHz or 4 kHz times 5.", "You still have not calculated the TDM bandwidth. You should have calculated 20 kHz or 4 kHz times 5.", "BW(TDM) = BW(information) x nve output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal.............."], "jumps": ["P13450", "P13440"]}, {"id": "P13450", "text": ["With a BW(TDM) of 20 kHz, calculate and type in the minimum sample rate.", "With a BW(TDM) of 20 kHz, calculate and type in the minimum sample rate..) in a variable.able.le."], "jumps": ["P13440", "P13455", "P13452"]}, {"id": "P13451", "text": [], "jumps": []}, {"id": "P13452", "text": ["Remember, the minimum sample rate is equal to the Nyquist rate."], "jumps": []}, {"id": "P13455", "text": ["SAMPLE RATE = 2 x BW(TDM)ion) x nutput at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal..............", "MINIMUM SAMPLE RATE - The minimum sample rate that can be used is the Nyquist rate. The Nyquist rate is twice the bandwidth of the system."], "jumps": []}, {"id": "P13457", "text": ["You should have calculated 40 kHz or twice the bandwidth of the TDM system, 20 kHz."], "jumps": ["P13460", "P13450"]}, {"id": "P13460", "text": ["Now that you know the minimum sample rate is 40 kHz, you must set the frequency of the clock so that the counter produces the correct frequency of Q outputs.  In this case, since there are five sources,  you must multiply the sample rate by 5.  The frequency for the clock is 200 kHz.", "Now that you know the minimum sample rate is 40 kHz, you must set the frequency of the clock so that the counter produces the correct frequency of Q outputs. In this case, since there are five sources, you must multiply the sample rate by 5. The frequency for the clock is 200 kHz."], "jumps": ["P13470", "P13450"]}, {"id": "P13470", "text": ["3.  Using the internal frequency counter of the function generator      or a separate frequency counter if available (an oscilloscope          can be used if a frequency counter is not available), adjust              R15 for a 200 kHz \u00b15 kHz signal on TP12 of PC130-305.", "3. Using the internal frequency counter of the function generator or a separate frequency counter if available (an oscilloscope can be used if a frequency counter is not available), adjust R15 for a 200 kHz", "MEASUREMENT SETUP - Adjust R15 for a 200 kHz"], "jumps": ["P13480", "P13460", "P13475"]}, {"id": "P13480", "text": ["The TDM multiplexer is now aligned and multiplexing four information signals and one SYNC pulse."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["1.  Set the oscilloscope controls as follows:", "1. Set the oscilloscope controls as follows:..............", "Volt/Div - .1V (use a X10 probe) Time/Div - 5 ms Triggering - CH1, AC, Negative Coupling - DCC"], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["2.  Place the AC/GND/DC switch to GND and position the CH1             trace in the center of the screen.\n3.  Place the AC/GND/DC switch to DC.", "2. Place the AC/GND/DC switch to GND and position the CH1 trace in the center of the screen. 3. Place the AC/GND/DC switch to DC."], "jumps": ["P13510", "P13490"]}, {"id": "P13510", "text": ["4. Connect the CH1 probe to PC130-305 TP9. 5. Adjust the Time/Div variable setting to allow only two complete frames to be shown. Adjust PC130-305 R17 until the basic shape of the waveform looks like the waveform shown below. The Gain and Dist potentiometers should be adjusted until the signals in T2, T3, T4 and T5 are 1V. (1 div.)"], "jumps": ["P13520", "P13500"]}, {"id": "P13520", "text": ["The oscilloscope is displaying the TDM signal.  Notice that there are five time sections and two frames.  The SYNC pulse and four information signals.", "The oscilloscope is displaying the TDM signal. Notice that there are five time sections and two frames. The SYNC pulse and four information signals."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["Using the signal on the oscilloscope and the signal shown, which time period is the SYNC pulse transmitted?"], "jumps": ["P13510"]}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13532", "text": ["During T2, the channel one information signal is transmitted."], "jumps": []}, {"id": "P13533", "text": ["During T3, the channel two information signal is transmitted."], "jumps": []}, {"id": "P13534", "text": ["During T4, the channel three information signal is transmitted."], "jumps": []}, {"id": "P13535", "text": ["During T5, the channel four information signal is transmitted."], "jumps": []}, {"id": "P13540", "text": ["As you can see, the SYNC pulse is a negative pulse that is different from the information signals.  This will be important in the demultiplexer circuit.", "As you can see, the SYNC pulse is a negative pulse that is different from the information signals. This will be important in the demultiplexer circuit."], "jumps": ["P13550", "P13530"]}, {"id": "P13550", "text": ["6.  Adjust the gain controls on PC130-322 for each channel one          at time and observe the results in the TDM signal.", "6. Adjust the gain controls on PC130-322 for each channel one at time and observe the results in the TDM signal."], "jumps": ["P13560", "P13540", "P13555"]}, {"id": "P13552", "text": ["6.  Adjust the gain controls on PC130-322 for each channel, one         at time and observe the results in the TDM signal.", "6. Adjust the gain controls on PC130-322 for each channel, one at time and observe the results in the TDM signal.", "MEASUREMENT SETUP - Adjust the gain controls for each channel, one at a time and observe the results."], "jumps": ["P13560", "P13540", "P13555"]}, {"id": "P13560", "text": ["Notice that when adjusting CH1, the T2 signal is effected and when CH2 is adjusted the T3 signal is effected.  Each information signal is transmitted one at a time after the SYNC pulse.", "Notice that when adjusting CH1, the T2 signal is effected and when CH2 is adjusted the T3 signal is effected. Each information signal is transmitted one at a time after the SYNC pulse."], "jumps": ["P13570", "P13552"]}, {"id": "P13570", "text": ["7.  Return the GAIN controls on PC130-322 for a 1 Vpp signal for        each channel (using a X10 probe, that is .1 Vpp or one block          on the oscilloscope screen).", "7. Return the GAIN controls on PC130-322 for a 1 Vpp signal for each channel (using a X10 probe, that is .1 Vpp or one block on the oscilloscope screen)."], "jumps": ["P13580", "P13552"]}, {"id": "P13580", "text": ["8.  Move the CH1 trace to the top of the screen.\n9.  Using the CH2 probe of the oscilloscope, measure the                     remaining test points on PC130-305.", "8. Move the CH1 trace to the top of the screen. 9. Using the CH2 probe of the oscilloscope, measure the remaining test points on PC130-305."], "jumps": ["P13590", "P13552"]}, {"id": "P13590", "text": ["You have aligned and measured signals in the TDM multiplexer circuit.  The type of signals on the test points will be important when troubleshooting.", "You have aligned and measured signals in the TDM multiplexer circuit. The type of signals on the test points will be important when troubleshooting."], "jumps": ["P13600", "P13580"]}, {"id": "P13600", "text": ["1.  Disconnect all test equipment from the circuit.", "1. Disconnect all test equipment from the circuit.ings...................."], "jumps": ["P13590"]}, {"id": "P13610", "text": ["2.  Place Console Power to OFF.", "2. Place Console Power to OFF.h to OFF.FF................................."], "jumps": []}, {"id": "P13620", "text": ["3.  Remove PC130-322 and PC130-305 from the Test Console.\n4.  Return all equipment to the designated storage areas.", "3. Remove PC130-322 and PC130-305 from the Test Console. 4. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13610"]}, {"id": "P13910", "text": ["This completes the experiment on TDM TRANSMITTERS.", "This completes the experiment on TDM TRANSMITTERS.E........"], "jumps": ["P13620"]}, {"id": "P14020", "text": ["In this experiment the operation and measurement of signals in a typical TDM receiver circuit will be observed.", "The receiver circuit is contained on PC130-306 and consists of the components necessary to support the demultiplexer."], "jumps": ["P14040", "P2001", "P14050", "P14020", "P"]}, {"id": "P14050", "text": ["The TDM signal is sent through a bias network and SYNC detector Q1, to a level control R1 then, to the demultiplexer IC4."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["The demultiplexer uses the X1 through X4 as the outputs.  X0 is not used because it is the SYNC pulse and not information.", "The demultiplexer uses the X1 through X4 as the outputs. X0 is not used because it is the SYNC pulse and not information."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["Each output of the demultiplexer is applied to individual operational amplifiers through a bias network."], "jumps": ["P14080", "P14040"]}, {"id": "P14080", "text": ["R26 through R29 control the gains of each amplifier independently."], "jumps": ["P14090", "P14040"]}, {"id": "P14090", "text": ["The clock circuit is formed by IC2b and IC2c and set by R10.", "The control circuit is a MC14040B counter.", "The control circuit is a MC14040B counter.................."], "jumps": ["P14100", "P14040", "P14110"]}, {"id": "P14110", "text": ["Note that the outputs of Q3 through Q6 are used."], "jumps": ["P14120", "P14100"]}, {"id": "P14120", "text": ["The Q3 output drives the inhibit input of the demultiplexer.  It is used to set up guard times.", "The Q3 output drives the inhibit input of the demultiplexer. It is used to set up guard times."], "jumps": ["P14130", "P14100"]}, {"id": "P14130", "text": ["The Q4, Q5 and Q6 outputs control the A, B and C inputs to the demultiplexer."], "jumps": ["P14140", "P14100"]}, {"id": "P14140", "text": ["When the count is 0000, the demultiplexer is not inhibited and selects the X0 output, SYNC pulse."], "jumps": ["P14150", "P14100"]}, {"id": "P14150", "text": ["When the count becomes 1000, the demultiplexer is inhibited and the operation of the chip is disabled."], "jumps": ["P14160", "P14100"]}, {"id": "P14160", "text": ["When the count becomes 0100, the demultiplexer is not inhibited and selects the X1 output."], "jumps": ["P14170", "P14100"]}, {"id": "P14170", "text": ["When the count becomes 1100, the demultiplexer is inhibited and disables the X1 output."], "jumps": ["P14180", "P14100"]}, {"id": "P14180", "text": ["When the count becomes 0010, the demultiplexer is not inhibited and selects the X2 output."], "jumps": ["P14190", "P14100"]}, {"id": "P14190", "text": ["When the count becomes 1010, the demultiplexer is inhibited and disables the X2 output."], "jumps": ["P14200", "P14100"]}, {"id": "P14200", "text": ["Remember, when Q3 is HIGH, the demultiplexer is disabled.", "The SYNC detector consists of Q1, IC2a and IC2d.", "The SYNC detector consists of Q1, IC2a and IC2d............"], "jumps": ["P14210", "P14100", "P14220"]}, {"id": "P14220", "text": ["When the TDM input is a positive level, meaning that information is being received, Q1 turns ON producing a LOW to IC2a."], "jumps": ["P14230", "P14210"]}, {"id": "P14230", "text": ["The LOW on IC2a produces a LOW signal out of the schmitt trigger of  IC2a and IC2d, IC3 is not reset.", "The LOW on IC2a produces a LOW signal out of the schmitt trigger of IC2a and IC2d, IC3 is not reset."], "jumps": ["P14240", "P14210"]}, {"id": "P14240", "text": ["When the TDM input is a negative level, meaning that a SYNC pulse is being received, Q1 turns OFF producing a HIGH to IC2a."], "jumps": ["P14250", "P14210"]}, {"id": "P14250", "text": ["The HIGH on IC2a produces a HIGH signal out of the schmitt trigger of IC2a and IC2d, IC3 is reset."], "jumps": ["P14260", "P14210"]}, {"id": "P14260", "text": ["The counter circuit gets reset whenever a SYNC pulse is received.", "Compare the PC130-306 card to the schematic.", "Compare the PC130-306 card to the schematic................"], "jumps": ["P14270", "P14210", "P14280"]}, {"id": "P14280", "text": ["R1 is the TDM input level control."], "jumps": ["P14290", "P14270"]}, {"id": "P14290", "text": ["R7 controls the SYNC detector circuit and R10 controls the clock."], "jumps": ["P14300", "P14270"]}, {"id": "P14300", "text": ["R26 through R29 set the output amplitude of the four information signals."], "jumps": ["P14310", "P14270"]}, {"id": "P14310", "text": ["Let's start the experiment.", "Let's start the experiment.e...............................", "The TDM Transmitter circuit cards must be aligned as per the TDM Transmitter experiment before entering the TDM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select TDM Transmitters and align the circuit cards.", "NOTE TDM Transmitter circuit cards must be aligned as per the TDM Transmitter experiment before entering the TDM Receiver Experiment. If you have not aligned these circuit cards or are unsure whether they are aligned return to the Lesson Menu, select TDM Transmitters and align the circuit cards."], "jumps": ["P14320", "P14270"]}, {"id": "P14320", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14310"]}, {"id": "P14330", "text": ["2.  Press Enter to set: Positive Supply Voltage - 15\n                                         Negative Supply Voltage - 15", "2. Press Enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 15"], "jumps": []}, {"id": "P14350", "text": ["3.  Carefully plug PC130-306 into the Test Console PC3 position.", "3. Carefully plug PC130-306 into the Test Console PC3 position."], "jumps": ["P14360"]}, {"id": "P14360", "text": ["4.  Set all potentiometers on PC130-306 to mid position.", "4. Set all potentiometers on PC130-306 to mid position....", "MEASUREMENT SETUP - Set all controls to mid position."], "jumps": ["P14370", "P14350", "P14365"]}, {"id": "P14370", "text": ["5.  Press Enter to set: PC1 DC Power Switch - ON \n                                         PC2 DC Power Switch - ON\n                                         PC3 DC Power Switch - ON", "5. Press Enter to set: PC1 DC Power Switch - ON PC2 DC Power Switch - ON PC3 DC Power Switch - ON"], "jumps": ["P14360"]}, {"id": "P14380", "text": ["6.  Set up the oscilloscope as follows:", "7.  Connect the oscilloscope probe to PC130-306 TP1.  Verify that       the TDM signal is present on the input to the demultiplexer.", "6. Set up the oscilloscope as follows:....................", "Volt/Div - 0.1 (use a X10 probe) Time/Div - 5 ms Triggering - CH1, AC, Negative Coupling - DCCC", "7. Connect the oscilloscope probe to PC130-306 TP1. Verify that the TDM signal is present on the input to the demultiplexer."], "jumps": ["P14390", "P14400", "P14380", "P"]}, {"id": "P14400", "text": ["The transmitted TDM signal is being received by the demultiplexer.  Now, let's align the demultiplexer circuit.", "The transmitted TDM signal is being received by the demultiplexer. Now, let's align the demultiplexer circuit."], "jumps": ["P14410", "P14390"]}, {"id": "P14410", "text": ["1.  Change the display mode on the oscilloscope to dual and set         the CH2 Volt/Div to 2.  Maintain the CH1 X10 probe on                       PC130-306 TP1.", "1. Change the display mode on the oscilloscope to dual and set the CH2 Volt/Div to 2. Maintain the CH1 X10 probe on PC130-306 TP1."], "jumps": ["P14420", "P14390"]}, {"id": "P14420", "text": ["3.  Connect a X10 probe to PC130-306 TP3.  This is the SYNC              detector output.", "3. Connect a X10 probe to PC130-306 TP3. This is the SYNC detector output."], "jumps": ["P14430", "P14410"]}, {"id": "P14430", "text": ["4.  Adjust PC130-306 R7 so that the reset pulse occurs on the             leading edge of the SYNC pulse as shown.  Look closely, the         sync pulse is very small.", "4. Adjust PC130-306 R7 so that the reset pulse occurs on the leading edge of the SYNC pulse as shown. Look closely, the sync pulse is very small."], "jumps": ["P14440", "P14410"]}, {"id": "P14440", "text": ["You have adjusted the SYNC detector circuit.  The SYNC pulse must be set up correctly.  Remember, the SYNC pulse sets the timing for the counter that controls the demultiplexing.  Let's set up the clock now.", "You have adjusted the SYNC detector circuit. The SYNC pulse must be set up correctly. Remember, the SYNC pulse sets the timing for the counter that controls the demultiplexing. Let's set up the clock now."], "jumps": ["P14450", "P14410"]}, {"id": "P14450", "text": ["1.  Using the internal frequency counter in the function                          generator.   Adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal       as measured on TP5.", "1.5 MHz is used as the clock frequency because the counter uses the outputs of Q3 through Q6.  The frequency must be higher to match the 200 kHz clock in the multiplexer.  The demultiplexer is now aligned.   Let's look at the outputs.", "1. Using the internal frequency counter in the function generator. Adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal as measured on TP5.", "MEASUREMENT SETUP - Adjust PC130-306 R10 for a 1.5 MHz +5 kHz signal as measured on TP5.", "1.5 MHz is used as the clock frequency because the counter uses the outputs of Q3 through Q6. The frequency must be higher to match the 200 kHz clock in the multiplexer. The demultiplexer is now aligned. Let's look at the outputs."], "jumps": ["P14460", "P14410", "P14455", "P14470", "P14450"]}, {"id": "P14470", "text": ["1. Disconnect the oscilloscope and frequency counter from the circuits. 2. Connect the CH1 probe to PC130-305 TP1. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
