const book = {"title": "93954604", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: DOWN COUNTERdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Predict outputs of a down counter. w Probe the outputs of a down counter. w Recognize normal operation of a down counter....", "w Identify the purpose of down counter. w Describe a basic down counter circuit. w Recognize free run and single step circuits of a down counter.", "w Identify the purpose of a down counter. w Describe a basic down counter circuit. w Recognize free run and single step circuits of a down counter."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 2100 Logic Probe or Equivalent"], "jumps": []}, {"id": "P400", "text": ["Counters not only count up, they count down.", "Counters not only count up, they count down., they count down.."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The down counter is designed to count down in either free run or single step modes."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Let's begin the lesson on DOWN COUNTER...................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["A down counter is designed specifically to count down."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["This counter starts at a count of 1111.   As input pulses are applied, the counter will count down.", "This counter starts at a count of 1111. As input pulses are applied, the counter will count down."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Applying three input pulses causes the count to decrease by three.  The count changes from 1111 to 1100.", "Applying three input pulses causes the count to decrease by three. The count changes from 1111 to 1100."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["A fourth pulse decrements the counter to 1011.", "A fourth pulse decrements the counter to 1011.. counter to 1011......."], "jumps": ["P1060", "P1020"]}, {"id": "P1055", "text": ["DECREMENT - Decrement is the act of decreasing or becoming less. When something is subtracted or lost it is decremented. For example: If the number 5 is decremented by 1, the remaining number is 4. If the binary number 0011 is decremented by 1, the remaining number is 0010."], "jumps": ["P1057"]}, {"id": "P1057", "text": ["A fourth pulse decrements the counter to 1011.", "A fourth pulse decrements the counter to 1011.ecounter to 1011."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["What is the binary count when the counter decrements 2 counts?"], "jumps": ["P1057"]}, {"id": "P1061", "text": [], "jumps": []}, {"id": "P1062", "text": ["Remember, \"decrement\" means to subtract.  1101 indicates that the counter incremented by 2 counts.", "Remember, \"decrement\" means to subtract. 1101 indicates that the counter incremented by 2 counts."], "jumps": []}, {"id": "P1063", "text": ["The answer 1010 only decrements the counter by 1 count.  The count must be decreased by 2 counts.", "The answer 1010 only decrements the counter by 1 count. The count must be decreased by 2 counts."], "jumps": []}, {"id": "P1070", "text": ["Down counters count in one of two modes of operation: Free Run or Single Step."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["In free run mode, the counter counts from the maximum count to zero and then starts the count over."], "jumps": ["P1090", "P1070", "P1085"]}, {"id": "P1085", "text": ["FREE RUN - Example: A MOD 8 counter has a maximum count of 7. A down counter will count down from 0111 to 0000, then reset to 0111 and start the count again."], "jumps": ["P1086", "P1088"]}, {"id": "P1086", "text": ["A MOD10 counter has a maximum count of 9.  A down counter will count down from 1001 to 0000, then reset to1001 and start the count over.", "A MOD10 counter has a maximum count of 9. A down counter will count down from 1001 to 0000, then reset to1001 and start the count over.."], "jumps": ["P1088", "P1085"]}, {"id": "P1088", "text": ["In free run mode, the counter counts from the maximum count to zero and then starts the count over."], "jumps": ["P1090", "P1070", "P1085"]}, {"id": "P1090", "text": ["Each input pulse is counted and subtracted from the current count.  The count continues down to 0000.", "Each input pulse is counted and subtracted from the current count. The count continues down to 0000."], "jumps": ["P1100", "P1088"]}, {"id": "P1100", "text": ["At count 0000, the next input pulse sets the counter to the maximum count and the counting starts over."], "jumps": ["P1110", "P1088"]}, {"id": "P1110", "text": ["In single step mode, the counter counts from the maximum count to zero and stops."], "jumps": ["P1120", "P1088"]}, {"id": "P1120", "text": ["Each input pulse is counted and subtracted from the current count.  The count continues down to 0000.", "Each input pulse is counted and subtracted from the current count. The count continues down to 0000."], "jumps": ["P1130", "P1088"]}, {"id": "P1130", "text": ["At count 0000, the input pulses are disabled inside the counter. The counter stops counting."], "jumps": ["P1140", "P1088"]}, {"id": "P1140", "text": ["This counter stops when the count is 000.  What mode of operation is used?", "This counter stops when the count is 000. What mode of operation is used?"], "jumps": ["P1088"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["In the free run mode, the counter decrements from its maximum count to zero and starts the count again.  The counter does not stop.", "In the free run mode, the counter decrements from its maximum count to zero and starts the count again. The counter does not stop."], "jumps": []}, {"id": "P1143", "text": ["This is a MOD 8 counter, but the mode is either free run or single step."], "jumps": []}, {"id": "P1150", "text": ["This counter counts from the maximum count to 0000 and starts over.  What mode of operation is used?", "This counter counts from the maximum count to 0000 and starts over. What mode of operation is used?"], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["In the single step mode, the counter decrements from its maximum count to zero and stops."], "jumps": []}, {"id": "P1153", "text": ["This is a MOD 10 counter, but the mode is either free run or single step."], "jumps": []}, {"id": "P1160", "text": ["This down counter requires seven inputs and four outputs to perform free run or single step operations."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Input pulses are applied to the clock input.  As the pulses enter the counter they are counted.", "Input pulses are applied to the clock input. As the pulses enter the counter they are counted."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1172", "text": ["Input pulses are applied to the clock input.  As the pulses enter the counter they are counted.", "Input pulses are applied to the clock input. As the pulses enter the counter they are counted."], "jumps": ["P1180", "P1160", "P1175"]}, {"id": "P1175", "text": ["CLOCK INPUT - Down counters use a basic synchronous input pulse circuit."], "jumps": ["P1176", "P1172"]}, {"id": "P1176", "text": ["Synchronous means that the flip-flops are connected to a common input such that each flip-flop will be triggered at the same time."], "jumps": ["P1172", "P1175"]}, {"id": "P1180", "text": ["The Enable input, when low, allows the counter to function.  A high disables the counter.", "The Enable input, when low, allows the counter to function. A high disables the counter."], "jumps": ["P1190", "P1172", "P1185"]}, {"id": "P1185", "text": ["ENABLE INPUT - A low enable input is inverted and applied to the J and K inputs of each flip-flop. This places the flip-flops in the toggle mode of operation."], "jumps": ["P1186", "P1189"]}, {"id": "P1186", "text": ["A high enable input applies a 0 on the J and K inputs.  This disables the flip-flops.  The counter will not count.", "A high enable input applies a 0 on the J and K inputs. This disables the flip-flops. The counter will not count.............."], "jumps": ["P1189", "P1185"]}, {"id": "P1189", "text": ["The Enable input, when low, allows the counter to function. A high disables the counter."], "jumps": ["P1190", "P1172", "P1185"]}, {"id": "P1190", "text": ["The Load input determines what number will start the counter.  A low starts the counting again.", "The Load input determines what number will start the counter. A low starts the counting again."], "jumps": ["P1200", "P1189"]}, {"id": "P1200", "text": ["When the Load input goes low, the counter sets to the binary number on inputs A through D."], "jumps": ["P1210", "P1189", "P1205"]}, {"id": "P1202", "text": ["When the Load input goes low, the counter sets to the binary number on inputs A through D."], "jumps": ["P1210", "P1189", "P1205"]}, {"id": "P1205", "text": ["LOAD INPUT - Recall that a low is required on PRE and CLR inputs to override the clock input."], "jumps": ["P1206", "P1202"]}, {"id": "P1206", "text": ["When the load input is low, a high is applied to both AND gates.", "When the load input is low, a high is applied to both AND gates............................................................"], "jumps": ["P1207", "P1205"]}, {"id": "P1207", "text": ["If input A is a 1, a low is applied to the PRE input and the flip-flop sets.  A high is applied to the CLR input.", "If input A is a 1, a low is applied to the PRE input and the flip-flop sets. A high is applied to the CLR input..............."], "jumps": ["P1208", "P1205"]}, {"id": "P1208", "text": ["If input A is a 0, a low is applied to the CLR input and the flip-flop resets.  A high is applied to the PRE input.", "If input A is a 0, a low is applied to the CLR input and the flip-flop resets. A high is applied to the PRE input............."], "jumps": ["P1202", "P1205"]}, {"id": "P1210", "text": ["QA through QD or QA through QD are outputs.  These outputs are sent to a logic gate that determines when the Load input will set the counter.", "QA through QD or QA through QD are outputs. These outputs are sent to a logic gate that determines when the Load input will set the counter."], "jumps": ["P1220", "P1202", "P1215"]}, {"id": "P1215", "text": ["CIRCUIT OUTPUTS - In this example, the Q outputs are connected to a NAND gate. When the count is 1111, the output is low."], "jumps": ["P1216"]}, {"id": "P1216", "text": ["The low output of the NAND gate triggers the load input.  The counter sets to the number from inputs A through D.", "The low output of the NAND gate triggers the load input. The counter sets to the number from inputs A through D..............."], "jumps": ["P1217", "P1215"]}, {"id": "P1217", "text": ["QA through QD or QA through QD are outputs. These outputs are sent to a logic gate that determines when the Load input will set the counter."], "jumps": ["P1220", "P1202", "P1215"]}, {"id": "P1220", "text": ["Select the input that allows the counter to count.", "Select the input that allows the counter to count.........."], "jumps": ["P1217"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1224", "text": [], "jumps": []}, {"id": "P1230", "text": ["Select the input that enables the counter to reset.", "Select the input that enables the counter to reset........."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1240", "text": ["This counter circuit counts up or down in free run or single step modes and is capable of producing various MODs."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["As an up counter the Up/Down input must be grounded.  The logic gate used is an AND gate.", "As an up counter the Up/Down input must be grounded. The logic gate used is an AND gate."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["As a down counter the Up/Down input  requires 5 volts.  The logic gate used is a NOR gate.", "As a down counter the Up/Down input requires 5 volts. The logic gate used is a NOR gate."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["On any count other than 0000, a low is applied to the Enable input.  This allows the counter to count.", "On any count other than 0000, a low is applied to the Enable input. This allows the counter to count."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["The low applied to the flip-flop places a high on the Load input. The data in the register is prevented from loading."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["The counter counts down to 0000. This places a high on the Enable input and the counter stops counting."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["The high from the NOR gate sets the flip-flop producing a low output to the Load input."], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["The low on the Load input allows the contents of the register to be loaded  into the counter.  This sets the MOD.", "The low on the Load input allows the contents of the register to be loaded into the counter. This sets the MOD."], "jumps": ["P1320", "P1240"]}, {"id": "P1320", "text": ["With 1111 in the counter, the counting starts again.", "With 1111 in the counter, the counting starts again. starts again."], "jumps": ["P1330", "P1240"]}, {"id": "P1330", "text": ["In the single step mode, the flip-flop is disabled.  The counting stops until S1 is pressed to load the counter.", "In the single step mode, the flip-flop is disabled. The counting stops until S1 is pressed to load the counter."], "jumps": ["P1340", "P1240"]}, {"id": "P1340", "text": ["What is the count after the next input pulse?", "What is the count after the next input pulse?.............."], "jumps": ["P1240"]}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1342", "text": ["Note, the output of the NOR gate will not load the register with 1111.  This counter is operating in single step mode.", "Note, the output of the NOR gate will not load the register with 1111. This counter is operating in single step mode."], "jumps": []}, {"id": "P1344", "text": ["Your answer incremented the counter by one. The counter must stop at 0000 or reset to 1111."], "jumps": []}, {"id": "P1350", "text": ["What is the count after the next input pulse?", "What is the count after the next input pulse?.............."], "jumps": ["P1340", "P"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Note, the output of the NOR gate loads the register with 1010. This counter is operating in the free run mode."], "jumps": []}, {"id": "P1353", "text": ["The down counter sets to the MOD contained in the input register.  In this example the register contains 1010.", "The down counter sets to the MOD contained in the input register. In this example the register contains 1010."], "jumps": []}, {"id": "P1360", "text": ["What is the count after the next input pulse?", "What is the count after the next input pulse?.............."], "jumps": ["P1350"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["Remember, a down counter decrements by one for each input pulse.  Simply subtract 1 from the binary count.", "Remember, a down counter decrements by one for each input pulse. Simply subtract 1 from the binary count."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on DOWN COUNTER.", "This completes the information on DOWN COUNTER.OWN COUNTER."], "jumps": ["P1001", "P1360"]}, {"id": "P1920", "text": ["1. Down counters are designed to count input pulses in binary.", "1. Down counters are designed to count input pulses in binary.y."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The clock input is used as the pulse input to the counter.", "2. The clock input is used as the pulse input to the counter.unter."], "jumps": ["P1932", "P1920"]}, {"id": "P1932", "text": ["3. The enable input allows the counter to count.", "3. The enable input allows the counter to count.counter to count."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4. The load and A, B, C and D inputs are used together for                    different MODs of operation.", "4. The load and A, B, C and D inputs are used together for different MODs of operation."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["5. Outputs QA through QD display the counter's contents and            are inputs to a logic gate which controls the counter.", "5. Outputs QA through QD display the counter's contents and are inputs to a logic gate which controls the counter."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["6. Down counters operate in different modes of operation: Free         Run or Single Step.", "6. Down counters operate in different modes of operation: Free Run or Single Step."], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu....................the Objective Menu."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of a down counter. You will enter input pulses, probe the inputs and observe the outputs of the counter to verify correct operation in various configurations.", "Pick up the PC130-132 card.  The purpose of this card is to demonstrate the down counter using different MODs in free run and single step modes.", "Pick up the PC130-132 card. The purpose of this card is to demonstrate the down counter using different MODs in free run and single step modes."], "jumps": ["P2040", "P2001", "P2050", "P2020"]}, {"id": "P2050", "text": ["IC3 is the counter.  Switches S1 through S4 control the modulus of the counter.", "IC3 is the counter. Switches S1 through S4 control the modulus of the counter."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["IC1 is a gate used to control the ENABLE and LOAD inputs.  IC2 is a flip-flop.", "IC1 is a gate used to control the ENABLE and LOAD inputs. IC2 is a flip-flop."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The counter's A through D inputs are controlled by switches S1 through S4.  S1 is used to set the LSD (QA), S4 sets the MSD (QD), S2 sets QB and S3 sets QC.  Let's start the experiment.", "The counter's A through D inputs are controlled by switches S1 through S4. S1 is used to set the LSD (QA), S4 sets the MSD (QD), S2 sets QB and S3 sets QC. Let's start the experiment."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.gs......."], "jumps": ["P2040"]}, {"id": "P2090", "text": ["2. Set the Voltmeter Switch to Positive. \n3. Set the Positive Supply Voltage to 5. The Test Console's                  Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["4. Carefully plug PC130-111 into the Test Console PC1 position.   5. Carefully plug PC130-132 into the Test Console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-132 into the Test Console PC2 position.er switch to ON........................................."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6. Set S2 to PULSER on PC130-111. \n7. Set S1 through S4 to 1 and S5 to FR on PC130-132. \n8. Connect the logic probe to PC130-111.", "6. Set S2 to PULSER on PC130-111. 7. Set S1 through S4 to 1 and S5 to FR on PC130-132. 8. Connect the logic probe to PC130-111.......................... PC130-111.", "EXPERIMENT CARD PC130-111 - Set S2 to PULSER EXPERIMENT CARD PC130-132 - Set S1 through S4 to 1 Set S5 to FR"], "jumps": ["P2120", "P2100", "P2115"]}, {"id": "P2120", "text": ["9. Turn the PC1 and PC2 DC Power switches ON.", "9. Turn the PC1 and PC2 DC Power switches ON.wer switches ON. PC1 DC Switch to ON...."], "jumps": ["P2110"]}, {"id": "P2130", "text": ["10. Set S2 to CLOCK on PC130-111.  The counter should                        continuously count down from 1111 to 0000.", "10. Set S2 to CLOCK on PC130-111. The counter should continuously count down from 1111 to 0000.."], "jumps": ["P2140", "P2120", "P2135"]}, {"id": "P2135", "text": ["MEASUREMENT SETUP - If the counter does not count from 1111 to 0000 and repeat itself, check the setup or request help from your instructor.", "- PC130-111 in PC1, PC130-132 in PC2. - S2 set to CLOCK on PC130-111. - S1 through S4 set to 1 on PC130-132. - S5 set to FR on PC130-132."], "jumps": []}, {"id": "P2140", "text": ["The expe e the ENABLE TP.  \n    Is the level indicated high or low?", "5. Set S5 to SS on PC130-132. 6. Probe the ENABLE TP. Is the level indicated high or low??"], "jumps": ["P13180", "P13192", "P13195"]}, {"id": "P13191", "text": [], "jumps": []}, {"id": "P13192", "text": ["The counter is set for single step.  The ENABLE input only goes high when the count equals 0000.  A low is required to enable the counting.", "The counter is set for single step. The ENABLE input only goes high when the count equals 0000. A low is required to enable the counting.", "EXPERIMENT CARD PC130-132 - Set S5 to SS Probe the ENABLE TP"], "jumps": ["P13135", "P"]}, {"id": "P13197", "text": ["Your answer is still incorrect.  You should have entered LOW as your answer.", "Your answer is still incorrect. You should have entered LOW as your answer."], "jumps": ["P13200", "P13190"]}, {"id": "P13200", "text": ["7. Set S2 to CLOCK on PC130-111. \n8. Once the counter has stopped counting, probe the ENABLE TP.      Is the level indicated high or low?", "7. Set S2 to CLOCK on PC130-111. 8. Once the counter has stopped counting, probe the ENABLE TP. Is the level indicated high or low?"], "jumps": ["P13190", "P13202", "P13205"]}, {"id": "P13201", "text": [], "jumps": []}, {"id": "P13202", "text": ["To stop the counter, the ENABLE input must be high.", "To stop the counter, the ENABLE input must be high.ive sign..............", "EXPERIMENT CARD PC130-111 - Set S2 to Clock EXPERIMENT CARD PC130-132 - Probe the ENABLE TP"], "jumps": []}, {"id": "P13207", "text": ["Your answer is still incorrect.  You should have entered HIGH as your answer.", "Your answer is still incorrect. You should have entered HIGH as your answer."], "jumps": ["P13210", "P13200"]}, {"id": "P13210", "text": ["9. Probe the D TP (input to flip-flop).  Notice that it is low even            though the output of the gate IC is high.  S5 in the SS position       places a ground on the flip-flop.  This prevents the LOAD input\n    from becoming low and setting the counter.", "9. Probe the D TP (input to flip-flop). Notice that it is low even though the output of the gate IC is high. S5 in the SS position places a ground on the flip-flop. This prevents the LOAD input from becoming low and setting the counter.ter.", "EXPERIMENT CARD PC130-132 - Probe the D TP"], "jumps": ["P13220", "P13200", "P13215"]}, {"id": "P13220", "text": ["10. Probe the ENABLE TP. 11. While observing the logic probe, press and HOLD the START switch, S6 on PC130-132. Notice that the level changed to low but, the counter is not counting. 12. Release the START switch. Notice that the counter started counting down.."], "jumps": ["P13230", "P13210", "P13225"]}, {"id": "P13225", "text": ["MEASUREMENT SETUP - As long as the start switch is grounding the LOAD input, while holding S5 in, the counter will continually load all 1's in the counter."], "jumps": []}, {"id": "P13230", "text": ["Now let's setup different MODs. \nWhich sequence represents a MOD 8 counter?", "Now let's setup different MODs. Which sequence represents a MOD 8 counter?"], "jumps": ["P13220"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["This setting will set the counter for MOD 9.", "This setting will set the counter for MOD 9................", "MSD LSD S4 S3 S2 S1 1 0 0 0"], "jumps": []}, {"id": "P13233", "text": ["This setting will set the counter for MOD 15.", "This setting will set the counter for MOD 15...............", "MSD LSD S4 S3 S2 S1 1 1 1 00"], "jumps": []}, {"id": "P13240", "text": ["1. With the counter in SS and the clock running, set switches S1        through S4 for MOD 8.\n2. Press and release S6 on PC130-132.", "1. With the counter in SS and the clock running, set switches S1 through S4 for MOD 8. 2. Press and release S6 on PC130-132.", "EXPERIMENT CARD PC130-132 - Set S1 through S4 to MOD 8 Press and release S6"], "jumps": ["P13250", "P13230", "P13245"]}, {"id": "P13250", "text": ["What binary number did the counting start from?  Enter your answer from MSD to LSD.", "What binary number did the counting start from? Enter your answer from MSD to LSD.iable.able.le."], "jumps": ["P13240", "P13252"]}, {"id": "P13251", "text": [], "jumps": []}, {"id": "P13252", "text": ["Ensure the MOD is set to 8 and the counter is in single step.", "Ensure the MOD is set to 8 and the counter is in single step............."], "jumps": []}, {"id": "P13257", "text": ["Your answer is still incorrect.  You should have entered 0111 or 111 as your answer.", "Your answer is still incorrect. You should have entered 0111 or 111 as your answer."], "jumps": ["P13260", "P13250"]}, {"id": "P13260", "text": ["3. Set the MOD to 12.  \n4. Press and release the start switch. \n\n    What binary number did the counting start from?  Enter your\n    answer from MSD to LSD.", "3. Set the MOD to 12. 4. Press and release the start switch. What binary number did the counting start from? Enter your answer from MSD to LSD........"], "jumps": ["P13250", "P13262", "P13265"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["Ensure the MOD is set to 12 and the counter is in single step.", "Ensure the MOD is set to 12 and the counter is in single step............", "The counter should count from 1011 to 0000. Place switches S1, S2 and S4 to 1. Place switch S3 to 0."], "jumps": []}, {"id": "P13265", "text": ["MOD 12 - The counter should count from a decimal 11 to a decimal 0 or 12 counts."], "jumps": []}, {"id": "P13267", "text": ["Your answer is still incorrect.  You should have entered 1011 as your answer.", "Your answer is still incorrect. You should have entered 1011 as your answer."], "jumps": ["P13270", "P13260"]}, {"id": "P13270", "text": ["Now that you have seen the operation from a good counter, let's look at one that is not operating properly."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["The computer will now insert a fault.  Predict and observe the outputs to identify that a fault exists.", "The computer will now insert a fault. Predict and observe the outputs to identify that a fault exists."], "jumps": ["P13270"]}, {"id": "P13290", "text": ["1. Set S2 to PULSER on PC130-111. \n2. Set the counter to MOD 16 in the free run mode.", "1. Set S2 to PULSER on PC130-111. 2. Set the counter to MOD 16 in the free run mode.", "EXPERIMENT CARD PC130-111 - Set S2 to PULSER EXPERIMENT CARD PC130-132 - Set S5 to FR"], "jumps": ["P13300", "P13295"]}, {"id": "P13300", "text": ["3. Set S2 to CLOCK on PC130-111. \n     Is the counter counting correctly?", "3. Set S2 to CLOCK on PC130-111. Is the counter counting correctly?"], "jumps": ["P13290"]}, {"id": "P13301", "text": [], "jumps": []}, {"id": "P13302", "text": ["Check your setup.  The counter should not be counting at all.", "Check your setup. The counter should not be counting at all."], "jumps": []}, {"id": "P13310", "text": ["Since the counter is not counting at all, check the inputs and          outputs.  \n4. Probe the CLOCK TP. \n5. Probe the ENABLE TP.  \n6. Probe the LOAD TP.", "Since the counter is not counting at all, check the inputs and outputs. 4. Probe the CLOCK TP. 5. Probe the ENABLE TP. 6. Probe the LOAD TP."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["Which sequence of these indications did you observe?", "Which sequence of these indications did you observe?......."], "jumps": ["P13310"]}, {"id": "P13321", "text": [], "jumps": []}, {"id": "P13322", "text": ["Check that S2 on PC130-111 is set to CLOCK.  The fault in the counter will not effect the clock input.", "Check that S2 on PC130-111 is set to CLOCK. The fault in the counter will not effect the clock input.", "CLOCK ENABLE LOAD Low High High"], "jumps": []}, {"id": "P13323", "text": ["These levels are the expected levels if the counter was operating correctly."], "jumps": []}, {"id": "P13330", "text": ["Which of the probed inputs is correct for free run mode?", "Which of the probed inputs is correct for free run mode?..."], "jumps": ["P13320"]}, {"id": "P13331", "text": [], "jumps": []}, {"id": "P13332", "text": ["The LOAD input is high and it should be low for the counter to count."], "jumps": []}, {"id": "P13333", "text": ["The ENABLE input is high and it should be low for the counter to count.  This could be the fault, however, in this circuit the actual fault causes this input to be high.", "The ENABLE input is high and it should be low for the counter to count. This could be the fault, however, in this circuit the actual fault causes this input to be high."], "jumps": []}, {"id": "P13334", "text": ["Probe the D TP. \nWhat is the level indicated?", "Probe the D TP. What is the level indicated?, alphanumeric answer (25k).................ble.le."], "jumps": ["P13330", "P13336"]}, {"id": "P13335", "text": [], "jumps": []}, {"id": "P13336", "text": ["The TP should read high.  Check that you are probing the D TP and check your logic probe.", "The TP should read high. Check that you are probing the D TP and check your logic probe."], "jumps": []}, {"id": "P13337", "text": ["The high input should set the flip-flop.  This places a low on the load input.  However, in this case the load input probed high.", "The high input should set the flip-flop. This places a low on the load input. However, in this case the load input probed high."], "jumps": ["P13338", "P13334"]}, {"id": "P13338", "text": ["With a high load input, the counter can not set the MOD to 1111. Since the output of the counter is 0000, the enable input is high."], "jumps": ["P13340", "P13337"]}, {"id": "P13340", "text": ["The high to the LOAD input causes the counter not to set to the MOD.  This is acceptable for single step but not free run.", "The high to the LOAD input causes the counter not to set to the MOD. This is acceptable for single step but not free run."], "jumps": ["P13350", "P13338"]}, {"id": "P13342", "text": ["Your answer is still incorrect.  You should have entered HIGH as your answer.", "Your answer is still incor let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
