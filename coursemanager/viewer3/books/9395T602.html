const book = {"title": "9395T602", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TELEPHONE SYSTEMSf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe the long distance telephone network. w Describe a typical long distance hierarchy telephone system............", "w Define the construction of a basic telephone system. w Describe the local area telephone network. w Describe local area telephone calling. w Describe the local loop."], "jumps": []}, {"id": "P300", "text": ["The telephone system used in the United States, and almost throughout the world, has developed over the last hundred years."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The telephone system basically operates the same today as it did then, with two exceptions."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["One, modern electronic circuits and switching devices have replaced older circuits and manual switching devices."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Two, the number of users has drastically increased.  There are estimated to be over 750 million telephones in use globally,        probably many more.", "Two, the number of users has drastically increased. There are estimated to be over 750 million telephones in use globally, probably many more."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["These two exceptions have forced the development of a standardized telephone system that can easily connect your phone to any of 500 million phones around the globe."], "jumps": ["P460", "P400"]}, {"id": "P460", "text": ["Let's begin the lesson on TELEPHONE SYSTEMS..............................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["You probably use the telephone set, called a TELSET for short, every day.  Do you ever wonder how the telephone connects to and rings a friend's phone, why some calls are considered long distance, and how does the telephone connect overseas?", "The telset is just one small part of a complete system that must be able to connect any telset to another telset.", "Basically, there are three methods that can be used to connect telsets: direct connection, switching, and hierarchy.  Only one method is practical when considering the number of telsets in use today.", "The direct connection method means that each telset is directly connected. The example below shows six telsets directly connected.", "You probably use the telephone set, called a TELSET for short, every day. Do you ever wonder how the telephone connects to and rings a friend's phone, why some calls are considered long distance, and how does the telephone connect overseas?", "Basically, there are three methods that can be used to connect telsets: direct connection, switching, and hierarchy. Only one method is practical when considering the number of telsets in use today.", "Telset Switching Station Wiring Connectionsssssssssssss"], "jumps": ["P1025", "P1001", "P1030", "P1020", "P1040", "P1050"]}, {"id": "P1050", "text": ["This method is the simplest but, not very practical today.  Each telset is connected to another using two wires per connection.  If  you were connecting 500 million telsets to yours, you would have 1 billion wires running into your house, not very practical.", "Using the switching method telsets are connected through one station.", "This method is the simplest but, not very practical today. Each telset is connected to another using two wires per connection. If you were connecting 500 million telsets to yours, you would have 1 billion wires running into your house, not very practical."], "jumps": ["P1060", "P1030", "P1070"]}, {"id": "P1070", "text": ["This method was developed as more and more telsets were used."], "jumps": ["P1080", "P1030"]}, {"id": "P1080", "text": ["However, one switching station for 500 million telsets is still impractical.", "The hierarchy system is formed by combining direct connection and centralized switching.  The illustration below shows how six telsets are connected using this method.", "The hierarchy system is formed by combining direct connection and centralized switching. The illustration below shows how six telsets are connected using this method."], "jumps": ["P1090", "P1030", "P1110"]}, {"id": "P1110", "text": ["It is this method that the telephone system is based on."], "jumps": ["P1120", "P1030"]}, {"id": "P1120", "text": ["What method is presently used to connect telephones?", "What method is presently used to connect telephones?......."], "jumps": ["P1030"]}, {"id": "P1121", "text": ["It would be almost impossible to directly connect all the telephones in use today.", "Switching is used however, it is not used alone.", "Now, let's see how the hierarchy system of telset connection works for local calls (a local area network).", "Switching is used however, it is not used alone..............", "Telset Switching Station Wiring Connectionsssssssssssss"], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The local area telephone network starts with individual telsets and an end office."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["End offices are connected directly, by two wires, to each telset it services.  The end office sends a small amount of current over these wires for telset operation.", "End offices are connected directly, by two wires, to each telset it services. The end office sends a small amount of current over these wires for telset operation."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Because wires have some resistance to current and the current provided by the end office to the telset is very small, short cable   runs connecting small localized areas are used.", "Because wires have some resistance to current and the current provided by the end office to the telset is very small, short cable runs connecting small localized areas are used."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["The connection between the end office and a telset is called the local loop."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["There can be 10,000 local loops for each end office -- numbers 0000 to 9999, the last four digits of telephone numbers.", "When an end office runs out of numbers or when a new distant area must be serviced, additional end offices are added to the system."], "jumps": ["P1190", "P1140", "P1200"]}, {"id": "P1200", "text": ["End offices are identified by using different prefixes, the first three numbers in a telephone number not including the area code."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["This allows 1,000 end offices in one local area -- numbers 000 to 999 (10,000 telsets per office for 1,000 offices equals 10 million    telsets in one local area!).", "End offices are connected by wires, fiber optic cables, or in some instances microwaves. The connections are called interoffice trunks.", "When the number of end offices becomes to large, direct connection to each office becomes impractical.", "This allows 1,000 end offices in one local area -- numbers 000 to 999 (10,000 telsets per office for 1,000 offices equals 10 million telsets in one local area!).", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1220", "P1190", "P1230", "P1240"]}, {"id": "P1240", "text": ["To reduce the number of interoffice trunks and to add flexibility to the network, a tandem (or centralize) switch is added.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The connection to the tandem switch is made using tandem trunks that can be wire cables, fiberoptic cables, or microwave links.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Note that interoffice trunks are still used to connect nearby end offices.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["In fact, in some networks, two or more end offices are actually located in the same building and direct connection is the best method.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1280", "P1230"]}, {"id": "P1280", "text": ["Also, by using interoffice and tandem trunks, alternate paths exist between end offices that allow switching around equipment failures.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1290", "P1230"]}, {"id": "P1290", "text": ["As you have seen, the local area telephone network, hierarchy system, is flexible and can range from one end office to many end offices.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1300", "P1230"]}, {"id": "P1300", "text": ["What is the telset directly connected to?", "What is the telset directly connected to?.................."], "jumps": ["P1230"]}, {"id": "P1301", "text": ["Tandem switches are centralize switches that connect end offices. They do not connect directly to telsets.", "Interoffice trunks directly connect end offices. They do not directly connect telsets.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": []}, {"id": "P1310", "text": ["What is the connection between a telset and an end office called?"], "jumps": ["P1300"]}, {"id": "P1311", "text": ["Interoffice trunks connect end offices, not telsets.", "Tandem trunks connect end offices to a tandem switch, not telsets.", "Interoffice trunks connect end offices, not telsets..........", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": []}, {"id": "P1320", "text": ["Touch the group of digits that are used to identify an individual telset?"], "jumps": ["P1310"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["The area code is used for long distance identification and is not used to identify telsets in a local area."], "jumps": []}, {"id": "P1323", "text": ["You selected the group of numbers used to identify the end office.", "Now that you know about your local area network, lets see how a local call is made and some additional functions of an end office.", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Your telset is directly connected to an end office using a pair of wires from telephone poles or underground cables."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["When you pick up your telset, you make a series circuit that is recognized by the end office as a request for service."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["When the user lifts the handset the end office sends the user a dial tone.  In the United States the dial tone is continuous tones of 340 and 440 Hz.", "When the user lifts the handset the end office sends the user a dial tone. In the United States the dial tone is continuous tones of 340 and 440 Hz."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["The tone informs you that you can \"dial in\" or \"push in\" another telsets number."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["After you have dialed in or pushed in the number, the end office stores the number and makes the appropriate connection to the called party's local loop."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["If the line to the called party is in use or busy, the end office generates a busy signal.  In the United States you'll hear a 480 and 620 Hz tone for 0.5 seconds repeated each 0.5 seconds.", "If the line to the called party is in use or busy, the end office generates a busy signal. In the United States you'll hear a 480 and 620 Hz tone for 0.5 seconds repeated each 0.5 seconds."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["If the line is not in use, the end office sends the ring signal to the called party; it varies between countries.  The US standard is a 20/30 Hz AC signal at 50/80 volts.", "If the line is not in use, the end office sends the ring signal to the called party; it varies between countries. The US standard is a 20/30 Hz AC signal at 50/80 volts.."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["A ring signal is also sent back to you.  This lets you know that the party's line is being rung.  In the US the return ring is a 2 second tone at  440 and 480 Hz repeating every 4 seconds.", "A ring signal is also sent back to you. This lets you know that the party's line is being rung. In the US the return ring is a 2 second tone at 440 and 480 Hz repeating every 4 seconds."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["If the called party answers by picking up the telset, another series circuit is made allowing the end office to recognize that the called party answered."], "jumps": ["P1430", "P1380"]}, {"id": "P1430", "text": ["At this time, the connection between the two telsets is made and you can carry on a conversation."], "jumps": ["P1440", "P1380"]}, {"id": "P1440", "text": ["If the called party does not answer, the ring tone will continue until you hang up, breaking your series circuit."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["Once your series circuit is broken (no answer or your call is finished) the end office recognizes it and ends the service."], "jumps": ["P1460", "P1380"]}, {"id": "P1460", "text": ["End offices also: send recorded messages, handle different types of services, and determine which path is used when making connections.", "End offices also: send recorded messages, handle different types of services, and determine which path is used when making connections. Tandem Interoffice es are busy at this time, please try again.\" s are busy at this time, please try again.\" nes are busy at this time, please try again.\" sy at this time, please try again.\" please try again.\"", "\"Your call cannot be completed as dialed.\" \"The number you are calling is no longer in service.\" \"The number 727-2266 has been changed to 727-2265.\" \"All lines are busy at this time, please try again.\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"W", "Direct Tandem Interoffice ialed.\" \"The number you are calling is no longer in service.\" \"The number 727-2266 has been changed to 727-2265.\" \"All lines are busy at this time, please try again.\"", "Call Waiting Three-Way Calling Call Return Speed Calling Call Forwarding Call Tracing Call Blocking Ring Services Caller IDD are busy at this time, please try again.\"\"\"\"\"\"\"\"\"\"\"\"\"\"\"\""], "jumps": ["P1490", "P1380"]}, {"id": "P1490", "text": ["In direct connections, the telsets are directly connected through the same end office."], "jumps": ["P1500", "P1460"]}, {"id": "P1500", "text": ["In this case, no signal processing (modulation/multiplexing) is used on either end."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["Interoffice connections are made when the telsets are directly connected to different end offices and the end offices are connected by interoffice trunks."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["In this case, signal processing may be used between end offices but is not used between telsets and end offices."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["In tandem switching connections, the telsets are directly connected to different end offices and the end offices are connected by tandem trunks."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["In this case, signal processing may be used between end offices and the tandem switch but, is not used between telsets and end offices."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["When you pick up a phone, what type of tone indicates that a number can be dialed?"], "jumps": ["P1530"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["The busy tone tells you that the party you are trying to call is already using their phone.  This happens after you have dialed the number.", "The busy tone tells you that the party you are trying to call is already using their phone. This happens after you have dialed the number."], "jumps": []}, {"id": "P1553", "text": ["The ring back tone tells you that the called party you are trying to call is not busy and that their phone is ringing.  This happens after the number has been dialed.", "The ring back tone tells you that the called party you are trying to call is not busy and that their phone is ringing. This happens after the number has been dialed.."], "jumps": []}, {"id": "P1560", "text": ["Which type of connection does not use signal processing?", "Which type of connection does not use signal processing?..."], "jumps": ["P1550"]}, {"id": "P1561", "text": [], "jumps": []}, {"id": "P1562", "text": ["Interoffice connection may use signal processing between end offices."], "jumps": []}, {"id": "P1563", "text": ["Tandem switch connection may use signal processing between the end offices."], "jumps": []}, {"id": "P1570", "text": ["Let's now take a closer look at the local loop.", "Let's now take a closer look at the local loop............."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["The end office circuit consists of a center tapped transformer and a talk battery."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["In US networks, the talk battery is not a battery but a power supply of either -24 or - 48 volts. Voltages will vary dependent upon the country or local system used."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["The secondary side of the transformer forms a balanced circuit that is a two wire loop with both wires being above ground or hot."], "jumps": ["P1610", "P1570"]}, {"id": "P1610", "text": ["When the two wire loop is actuated, DC current flow is not passed to the primary.  This is for isolation purposes.", "When the two wire loop is actuated, DC current flow is not passed to the primary. This is for isolation purposes."], "jumps": ["P1620", "P1570"]}, {"id": "P1620", "text": ["Only AC or pulsating DC signals pass from the secondary to the primary or from the primary to secondary."], "jumps": ["P1630", "P1570"]}, {"id": "P1630", "text": ["Signals that pass from the primary to secondary are the dial tone, busy signal, ring back signal, and incoming voice or recorded message signals."], "jumps": ["P1640", "P1570"]}, {"id": "P1640", "text": ["Signals that pass from the secondary to the primary are out going voice signals and dial signals."], "jumps": ["P1650", "P1570"]}, {"id": "P1650", "text": ["The connection to the telset from the end office is on two wires, tip (green wire) and ring (red wire)."], "jumps": ["P1660", "P1570"]}, {"id": "P1660", "text": ["The terms TIP and RING are from the early method of connection using a phone plug."], "jumps": ["P1670", "P1570"]}, {"id": "P1670", "text": ["The green wire connects to the tip terminal of the plug and the red wire connects to the ring terminal."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["A third wire may by used to connect the sleeve to a common ground connection."], "jumps": ["P1690", "P1660"]}, {"id": "P1690", "text": ["Today most phone connections use four wires: green, red, yellow, and black."], "jumps": ["P1700", "P1660"]}, {"id": "P1700", "text": ["This allows two separate phone numbers to be used at one location.  Special services can also be connected on these extra wires.", "This allows two separate phone numbers to be used at one location. Special services can also be connected on these extra wires."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["In the series circuit, the hook switch, part of the telset, is used to make or break the circuit."], "jumps": ["P1720", "P1690"]}, {"id": "P1720", "text": ["Again, the term \"hook switch\" is an old term describing how the switch operated on old wall mounted phones that had to be hand cranked."], "jumps": ["P1730", "P1710"]}, {"id": "P1730", "text": ["When the telset is not in use (phone on the hook) the hook switch is open and the series circuit is broken.  There is no current flow through the loop.", "When the telset is not in use (phone on the hook) the hook switch is open and the series circuit is broken. There is no current flow through the loop."], "jumps": ["P1740", "P1710"]}, {"id": "P1740", "text": ["When the telset is being used (phone off the hook) the hook switch is closed, completing the series circuit and current flows from the end office through the telset back to the end office."], "jumps": ["P1750", "P1710"]}, {"id": "P1750", "text": ["This is the DC current provided by the end office to operate the telset."], "jumps": ["P1760", "P1710"]}, {"id": "P1760", "text": ["The telset also consists of a: dial network, ringer, and voice network."], "jumps": ["P1770", "P1710"]}, {"id": "P1770", "text": ["The ringer circuit is what makes your phone ring and is located before the hook switch."], "jumps": ["P1780", "P1760"]}, {"id": "P1780", "text": ["The signal is AC (20/30 Hz, 50 - 80 volts) and applied to the primary of the transformer.  The capacitor blocks DC current.", "The signal is AC (20/30 Hz, 50 - 80 volts) and applied to the primary of the transformer. The capacitor blocks DC current."], "jumps": ["P1790", "P1760"]}, {"id": "P1790", "text": ["The dial network is of two types, mechanical (the wheel with holes for each number) and electronic (push button)."], "jumps": ["P1800", "P1760"]}, {"id": "P1800", "text": ["The mechanical dialer operates by breaking the circuit path a number of times for each number dialed."], "jumps": ["P1810", "P1760"]}, {"id": "P1810", "text": ["The end office has circuits that count the number of breaks to determine the number dialed."], "jumps": ["P1820", "P1760"]}, {"id": "P1820", "text": ["The electronic dialer operates by pressing buttons that generate different tones."], "jumps": ["P1830", "P1760"]}, {"id": "P1830", "text": ["The end office has circuits that decode the tones to determine the number."], "jumps": ["P1840", "P1760"]}, {"id": "P1840", "text": ["The voice network separates the out going voice signals from the incoming voice signals."], "jumps": ["P1850", "P1760"]}, {"id": "P1850", "text": ["Received voice signals are routed to the output transducer, the speaker."], "jumps": ["P1860", "P1840"]}, {"id": "P1860", "text": ["Transmitted voice signals are routed from the input transducer, microphone, to the loop."], "jumps": ["P1870", "P1840"]}, {"id": "P1870", "text": ["Is the hook switch closed or open when you are using the telset?"], "jumps": ["P1840"]}, {"id": "P1871", "text": [], "jumps": []}, {"id": "P1872", "text": ["When the hook switch is open, no current flows through loop and you can not use the telset."], "jumps": []}, {"id": "P1880", "text": ["Which network directs incoming voice signals to the speaker and outgoing voice signals to the loop?"], "jumps": ["P1870"]}, {"id": "P1881", "text": [], "jumps": []}, {"id": "P1882", "text": ["The ringer circuit rings your telset when someone is calling."], "jumps": []}, {"id": "P1883", "text": ["The dialer network is used to identify the person you are calling."], "jumps": []}, {"id": "P1890", "text": ["What does the talk battery supply power to?", "What does the talk battery supply power to?................"], "jumps": ["P1880"]}, {"id": "P1891", "text": [], "jumps": []}, {"id": "P1892", "text": ["The ringer circuit receives AC power through the transformer."], "jumps": []}, {"id": "P1893", "text": ["The end office recognizes when DC current flows, request for service, but the DC power is not the power that the runs the end   office.", "The end office recognizes when DC current flows, request for service, but the DC power is not the power that the runs the end office..."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on LOCAL AREA TELEPHONE NETWORK.", "1.  The hierarchy system is used in the United States to connect         telsets by direct connection and centralized switching.", "1. The hierarchy system is used in the United States to connect telsets by direct connection and centralized switching.", "Telset Switching Station Wiring Connectionsssssssssssss"], "jumps": ["P1001", "P1890", "P1930"]}, {"id": "P1930", "text": ["2.  Each telset is connected by a local loop to an end office and is      identified by the last four digits of a telephone number.", "3.  End offices are connected by interoffice trunks and are                   identified by the first three numbers, not including the area             code, of telephone numbers.", "4.  In large area networks, a tandem switch is used.", "2. Each telset is connected by a local loop to an end office and is identified by the last four digits of a telephone number.", "3. End offices are connected by interoffice trunks and are identified by the first three numbers, not including the area code, of telephone numbers.", "4. In large area networks, a tandem switch is used........", "Interoffice Trunk Tandem Trunk Local Loopnectionstionss"], "jumps": ["P1940", "P1920", "P1950", "P1930", "P1960"]}, {"id": "P1960", "text": ["5.  A call is made by you picking up the telset and making a                  series circuit giving you a dial tone.", "5. A call is made by you picking up the telset and making a series circuit giving you a dial tone."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The end office then stores the dialed number and makes the           proper connection.", "6. The end office then stores the dialed number and makes the proper connection."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Busy, ring, ring back, recorded messages, and other services       are performed by the end office.", "7. Busy, ring, ring back, recorded messages, and other services are performed by the end office."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  The local loop consists of a center tapped transformer, talk             battery, two wire loop, and the telset.", "8. The local loop consists of a center tapped transformer, talk battery, two wire loop, and the telset."], "jumps": ["P1993", "P1970"]}, {"id": "P1993", "text": ["9.  The telset consists of a ringer circuit, hook switch, dialer                  network, and voice network.", "9. The telset consists of a ringer circuit, hook switch, dialer network, and voice network."], "jumps": ["P1999", "P1990"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The local area network is only part of a telephone system.", "The local area network is only part of a telephone system.."], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["To complete a telephone system, long distance calling must be made available."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["You should know that by dialing a 1 before a 7 digit telephone number, you can make long distance calls in your general area.    \n\n                                                 1 - 123 - 4567", "You should know that by dialing a 1 before a 7 digit telephone number, you can make long distance calls in your general area. 1 - 123 - 4567777"], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Or by dialing a 1 before a 10 digit telephone number (3 digit area code plus 7 digit number), you can make long distance calls to      almost anywhere in the world.\n\n                                             1 - 999 - 123 - 4567", "Or by dialing a 1 before a 10 digit telephone number (3 digit area code plus 7 digit number), you can make long distance calls to almost anywhere in the world. 1 - 999 - 123 - 4567777"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["A typical system that allows long distance calls uses additional offices."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Your telset, local loop, and end office network remains the same."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Recall that even though you can choose different telephone companies, you do not have to change telsets or add more wires to your house."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Your local loop always remains the same."], "jumps": ["P2090", "P2050"]}, {"id": "P2090", "text": ["The difference is that when you dial a \"1\", the end office routes your call to a toll office - long distance costs you additional money!"], "jumps": ["P2100", "P2050"]}, {"id": "P2100", "text": ["The toll office is where the switching to other offices is determined and the billing information is stored."], "jumps": ["P2110", "P2050"]}, {"id": "P2110", "text": ["From the toll office, your call is routed to various intermediate switching offices."], "jumps": ["P2120", "P2050"]}, {"id": "P2120", "text": ["The number, location, and name of the intermediate switching offices depends on where your long distance call is going."], "jumps": ["P2130", "P2050"]}, {"id": "P2130", "text": ["Then, your call is routed back to a toll office in the area you are calling."], "jumps": ["P2140", "P2050"]}, {"id": "P2140", "text": ["And finally to the called party's end office and telset."], "jumps": ["P2150", "P2050"]}, {"id": "P2150", "text": ["What happens when you dial a \"1\" before dialing a telephone number?"], "jumps": ["P2050"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["You normally reach an operator by dialing \"0\", not \"1\".", "You normally reach an operator by dialing \"0\", not \"1\"....."], "jumps": []}, {"id": "P2153", "text": ["You may charge a call to a third party but, this normally requires an operator. Dialing \"1\" is not the method."], "jumps": []}, {"id": "P2160", "text": ["Which office stores long distance billing information?", "Which office stores long distance billing information?....."], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["The end office switches your call to a toll office for long distance calling. The end office does not store billing information."], "jumps": []}, {"id": "P2163", "text": ["Intermediate switching offices route your call to various offices ending with the called party's end office. They do not store billing information.", "Intermediate switching offices route your call to various offices ending with the called party's end office. They do not store billing information..."], "jumps": []}, {"id": "P2170", "text": ["What connecting trunks are the same no matter which telephone company you use to make long distance calls?"], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["The trunks from the toll office to intermediate switching offices are not standardized, they vary from one company to another."], "jumps": []}, {"id": "P2173", "text": ["The trunks from the end office to toll offices are not standardized, they vary from one company to another."], "jumps": []}, {"id": "P2180", "text": ["The signal processing methods used in a long distance telephone network vary."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Remember, between the telset and end office, no signal processing methods are used."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["But, signal processing may be used, and is normally used, between the other offices."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["The most common methods of signal processing used by end offices, toll offices, and intermediate switching offices is modulation and multiplexing."], "jumps": ["P2220", "P2180"]}, {"id": "P2220", "text": ["Modulation is used when the connection between the offices use microwaves or fiberoptic cable as the transmission medium."], "jumps": ["P2230", "P2180"]}, {"id": "P2230", "text": ["Multiplexing is almost always used to reduce the number of microwave channels or fiber optical cables necessary to handle all calls."], "jumps": ["P2240", "P2180"]}, {"id": "P2240", "text": ["Note that if a call is modulated for transmitting through the air, it can still be multiplexed."], "jumps": ["P2250", "P2180"]}, {"id": "P2250", "text": ["And, if a call is modulated/multiplexed on the sending side, it must be demodulated/demultiplexed on the receiving side."], "jumps": ["P2260", "P2180"]}, {"id": "P2260", "text": ["In a long distance telephone network, where is signal processing not used?"], "jumps": ["P2180"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Connections from end offices to toll offices normally use at least one method of signal processing."], "jumps": []}, {"id": "P2263", "text": ["Connections from toll offices to end offices normally use at least one method of signal processing."], "jumps": []}, {"id": "P2270", "text": ["Which method of signal processing reduces the number of fiberoptic cables needed to route calls?"], "jumps": ["P2260"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["Amplification is normally used throughout a long distance network to compensate for attenuation.  Amplification does not reduce the hardware required to transmit calls.", "Amplification is normally used throughout a long distance network to compensate for attenuation. Amplification does not reduce the hardware required to transmit calls......"], "jumps": []}, {"id": "P2273", "text": ["Modulation is a method that allows signals to be sent through the air.  Modulation does not reduce the hardware required to transmit calls.", "Modulation is a method that allows signals to be sent through the air. Modulation does not reduce the hardware required to transmit calls."], "jumps": []}, {"id": "P2280", "text": ["This network is generic and is used to illustrate a long distance telephone network."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["The network has five levels of hierarchy.", "The network has five levels of hierarchy..................."], "jumps": ["P2310", "P2280"]}, {"id": "P2310", "text": ["Class 5 is the local area telephone network."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Class 5 has the most end offices."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["The second level of hierarchy is class 4 which are toll offices. There are less toll offices than local area networks."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["Classes 3, 2, and 1 make up the intermediate switching offices. Class 3 offices are called primary offices."], "jumps": ["P2360", "P2300"]}, {"id": "P2360", "text": ["Note that there are less class 3 offices than class 4 and, how the offices are cross connected."], "jumps": ["P2370", "P2300"]}, {"id": "P2370", "text": ["Class 2 offices are called sectional offices."], "jumps": ["P2380", "P2300"]}, {"id": "P2380", "text": ["Again, note that there are less class 2 offices and how cross connections are used."], "jumps": ["P2390", "P2300"]}, {"id": "P2390", "text": ["Class 1 offices are called regional offices."], "jumps": ["P2400", "P2300"]}, {"id": "P2400", "text": ["Again notice that class 1 has less offices than class 2 and cross connection is used."], "jumps": ["P2410", "P2300"]}, {"id": "P2410", "text": ["The advantage of cross connection is that calls can be routed around failed equipment and busy circuits."], "jumps": ["P2420", "P2300"]}, {"id": "P2420", "text": ["The advantage of using less offices is that calls do not have to go through the entire system."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["A long distance call may only use class 5 and 4 offices."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["Or, only class 5, 4, and 3 offices. It all depends on the distance of the call."], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["What class is your local area telephone network considered?"], "jumps": ["P2410"]}, {"id": "P2451", "text": [], "jumps": []}, {"id": "P2452", "text": ["Class 1 offices are regional offices.", "Class 1 offices are regional offices......................."], "jumps": []}, {"id": "P2453", "text": ["Class 3 offices are primary offices.", "Class 3 offices are primary offices........................"], "jumps": []}, {"id": "P2460", "text": ["What is the top hierarchy office called.", "What is the top hierarchy office called...................."], "jumps": ["P2450"]}, {"id": "P2461", "text": [], "jumps": []}, {"id": "P2462", "text": ["Primary offices are class 3.", "Primary offices are class 3................................"], "jumps": []}, {"id": "P2463", "text": ["Toll offices are class 4.", "Toll offices are class 4..................................."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on LONG DISTANCE TELEPHONE NETWORK."], "jumps": ["P2001", "P2460"]}, {"id": "P2920", "text": ["1. Long distance telephone networks add toll offices and                    intermediate switching offices.", "1. Long distance telephone networks add toll offices and intermediate switching offices."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The telsets and end offices do not change."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. Toll offices are connected when you dial a \"1\" and store billing     information.", "3. Toll offices are connected when you dial a \"1\" and store billing information."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4. Intermediate switching offices route calls to the proper areas."], "jumps": ["P2960", "P2920"]}, {"id": "P2960", "text": ["5. Signal processing only takes place between end offices.", "5. Signal processing only takes place between end offices...."], "jumps": ["P2970", "P2920"]}, {"id": "P2970", "text": ["6. Modulation is used to allow sending calls over the air or over          fiberoptic cables.\n7. Multiplexing allows reducing the number of wires, channels,          and cables.", "6. Modulation is used to allow sending calls over the air or over fiberoptic cables. 7. Multiplexing allows reducing the number of wires, channels, and cables."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["8. Calls can be both modulated and multiplexed. If used, calls            must be demodulated/demultiplexed at the other end.", "8. Calls can be both modulated and multiplexed. If used, calls must be demodulated/demultiplexed at the other end."], "jumps": ["P2990", "P2960"]}, {"id": "P2990", "text": ["9. A typical system used in the United States uses five classes of      offices.", "9. A typical system used in the United States uses five classes of offices."], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What method is used to connect any telset to another telset?"], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10212", "text": ["What is the connection between an end office and a telset called?"], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10214", "text": [], "jumps": []}, {"id": "P10215", "text": ["Which signal tells you that you can dial a number?"], "jumps": []}, {"id": "P10216", "text": ["How do you know that the called party's phone is ringing?"], "jumps": []}, {"id": "P10217", "text": ["What type of signal does the end office recognize as a request for service?"], "jumps": []}, {"id": "P10218", "text": ["What carries incoming and outgoing voice signals in the local loop?"], "jumps": []}, {"id": "P10219", "text": ["Where does the power come from to operate a telset?"], "jumps": []}, {"id": "P10220", "text": ["How is a call identified as long distance?"], "jumps": []}, {"id": "P10221", "text": ["When calling long distance, what type of office connects to the end office?"], "jumps": []}, {"id": "P10222", "text": ["Which office stores billing information?"], "jumps": []}, {"id": "P10223", "text": ["Which of the following is not an intermediate office?"], "jumps": []}, {"id": "P10224", "text": ["Which connection DOES NOT USE signal processing?"], "jumps": []}, {"id": "P10225", "text": ["What type of signal processing allows transmission through the air or over fiberoptic cables?"], "jumps": []}, {"id": "P10226", "text": ["What type of signal processing reduces the hardware used in a long distance telephone network?"], "jumps": []}, {"id": "P10227", "text": ["If multiplexing is used on the transmitting end, what type of signal processing must be used on the receiving end?"], "jumps": []}, {"id": "P10228", "text": [], "jumps": []}, {"id": "P10229", "text": ["What class is the bottom of the hierarchy system for long distance calls?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 100%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 12-10-99 Converted from storyboard to toolbook. frieda 12-10-99 Text and Branching first objective. frieda 12-13-99 Finished Text and Branching. ben 12-16-99 Completed graphics. ben 01-14-99 Changes as per Steve (P1020,P1030,P1460,P1690 - smicolon to colon, P10227 - d. change to demultiplexing) - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 10-09-00 Main Window Viewer, disabled scroll bar. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Checked for conversion errors. John Ayala 04-30-02 Review - lisa 01-21-04 P1360, 1390, 1400, 1410 and 1590 changed text to refer US standards. frieda"], "jumps": ["P1020"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
