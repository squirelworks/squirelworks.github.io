rsion cleanup steps 10 thru 17 - lisa 07-14-00 Converted to ToolBook 7.1 format. jay 10-27-00 Add Monitor Pro code to quiz pages. jay 11-10-00 P10228 changed schematic (transformer coupled) to match the schematic on page P1430. P1970 changed schematic to match the schematic on page P1430. -Penny 11-28-00 Added HelpPage information and new random gen. script. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 08-01-01 P10211, changed distractors a, b and d to plural. -GLK & Penny 01-14-02 Converted to Phase II format. jay 02-13-02 Phase II Review - lisa 09-23-02 Added second sentence on p1430 from \"In transformer coupling, coupling capacitors are not used between stages.\" to \"In transformer coupling, coupling capacitors are not used between stages. A transformer is used instead.\" Changed text box on p1440 from \"Bypass capacitors are used to prevent the AC signal from interfering with the DC bias voltages.\" to \"In High Frequency amplifiers, a capacitor is added in parallel with the transformer windings. This enhances the amount of signal that is coupled from stage to stage.\" Changed answers \"C\" and \"D\" from \"transformer\" and \"direct\" to \"direct and \"indirect\". frieda 04-03-03 P1470, change \"The bypass capacitor...\" to \"The capacitor...\" - Dean 07-08-03 P1020, added ground symbols to both circuits - Dean"], "jumps": []}, {"id": "P1030", "text": ["In other words, it is a circuit configuration."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["When several amplifiers are connected together, each individual amplifier is called a STAGE."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Each stage consists of the transistor and associated components required for normal operation."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["For example, this cascade amplifier consists of three stages."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Q1 and its biasing circuit form stage 1."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Q2 and its biasing circuit form stage 2."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Q3 and its biasing circuit form stage 3."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["Together, Q1, Q2 and Q3 make up a cascade amplifier with three stages.", "How many stages does this cascade amplifier have?", "How many stages does this cascade amplifier have?.........."], "jumps": ["P1110", "P1060"]}, {"id": "P1111", "text": ["Remember, the number of stages in a cascade amplifier equals the number of individual transistor amplifier circuits."], "jumps": ["P1120", "P1110"]}, {"id": "P1120", "text": ["The purpose of cascade amplifiers is to increase gain.", "The purpose of cascade amplifiers is to increase gain......"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["You have learned that the voltage gain (Av) of an individual amplifier is as high as 300."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["In reality, obtaining gains of that magnitude is not easy.  Stability and predictability are lost.", "In reality, obtaining gains of that magnitude is not easy. Stability and predictability are lost."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["By using an amplifier with a low gain, the circuit is stable and predictable."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["However, low gain amplifiers do not amplify the input signal enough to be of practical use."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["Using cascade amplifiers, high gain is achieved without losing stability and predictability.", "Using cascade amplifiers, high gain is achieved without losing stability and predictability.7"], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["The overall gain of a cascade amplifier is equal to the product of the individual gains.  \n                                 Av (total) = Av1 x Av2 x Av3", "The overall gain of a cascade amplifier is equal to the product of the individual gains. Av (total) = Av1 x Av2 x Av3"], "jumps": ["P1185", "P1170"]}, {"id": "P1185", "text": ["For example, the total gain of this cascade amplifier is 1000.  \n                                Av (total) = 10 x 10 x 10 = 1000", "For example, the total gain of this cascade amplifier is 1000. Av (total) = 10 x 10 x 10 = 1000"], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Normally, individual amplifier stages are designed to have a voltage gain of 10."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Each stage acts as a power 10."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["For example, if a phonograph amplifier needs to amplify the 5 mV output from the record to 5 V to drive a speaker, six stages are needed.", "Av = 10 Av = 10 Av = 10 Av = 10 Av = 10 Av = 10"], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["What is the total gain of this cascade amplifier?", "What is the total gain of this cascade amplifier?.........."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Ten is the voltage gain of the first stage amplifier.  Cascade amplifiers have a higher gain than one stage.", "Ten is the voltage gain of the first stage amplifier. Cascade amplifiers have a higher gain than one stage."], "jumps": []}, {"id": "P1613", "text": ["RL (resistor - inductor) is not a type of coupling used in cascade amplifiers.", "You added the individual voltage gains.  Remember, the individual voltage gains are multiplied in cascade amplifiers.", "You added the individual voltage gains. Remember, the individual voltage gains are multiplied in cascade amplifiers."], "jumps": []}, {"id": "P1230", "text": ["In cascade amplifiers, the output of one amplifier is connected to the input of another amplifier."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["There are four methods used to couple one amplifier to another:  RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling.", "There are four methods used to couple one amplifier to another: RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["Let's discuss RC coupled cascade amplifiers first.  RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling.", "Let's discuss RC coupled cascade amplifiers first. RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["Resistance - Capacitance (RC) coupling is the most common method of coupling one stage to the next and uses inexpensive components."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["The output signal is developed across collector load resistor (Rc1) and is coupled across the coupling capacitor (Cc2) into the base of the next stage."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The coupling capacitor passes AC signals and blocks DC signals."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["In this way, the DC bias levels of one stage do not affect the bias levels of other stages."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["The disadvantage of RC coupled amplifiers is the low frequency response."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["At low frequencies, the reactance of the coupling capacitor becomes too large, reducing the input and output signals."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["RC coupling is used in almost all types of cascade amplifiers except low frequency amplifiers."], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["In LC coupled amplifiers, the collector load resistor is replaced with an inductor. Inductor - capacitor.  RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling.", "In LC coupled amplifiers, the collector load resistor is replaced with an inductor. Inductor - capacitor. RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling."], "jumps": ["P1340", "P1260"]}, {"id": "P1340", "text": ["The coupling capacitors pass AC signals and block DC signals as in RC coupled amplifiers."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["However, the inductor acts differently than a collector load resistor."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["L1 and L2 have very low resistances to DC.  Vcc is applied almost directly to Q1 and Q2 collectors.", "L1 and L2 have very low resistances to DC. Vcc is applied almost directly to Q1 and Q2 collectors."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["L1 and L2 AC resistance depends on the frequency."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["At higher frequencies, the reactance is very high, appearing as an open to AC."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["The advantage of high AC resistance is that very little AC power is wasted in the inductor.  All the AC power is coupled to the next stage.", "The advantage of high AC resistance is that very little AC power is wasted in the inductor. All the AC power is coupled to the next stage."], "jumps": ["P1400", "P1340"]}, {"id": "P1400", "text": ["The disadvantage is the inductors are more expensive than resistors and their reactance drops off at lower frequencies."], "jumps": ["P1410", "P1340"]}, {"id": "P1410", "text": ["Generally, LC coupling is used with radio frequencies (RF).  When used in this way, the inductors are called Rf chokes.", "Generally, LC coupling is used with radio frequencies (RF). When used in this way, the inductors are called Rf chokes."], "jumps": ["P1420", "P1340"]}, {"id": "P1420", "text": ["Transformer coupling also uses the characteristics of inductance.  RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling.", "Transformer coupling also uses the characteristics of inductance. RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling."], "jumps": ["P1430", "P1340"]}, {"id": "P1593", "text": ["Transformer coupled amplifiers use a transformer and no coupling capacitors.  Notice the coupling components in this amplifier circuit.", "Transformer coupled amplifiers use a transformer and no coupling capacitors. Notice the coupling components in this amplifier circuit."], "jumps": []}, {"id": "P1612", "text": ["RC coupling uses a resistor on the collector load.  The resistor will affect the AC signal on the collector.", "RC coupling uses a resistor on the collector load. The resistor will affect the AC signal on the collector."], "jumps": []}, {"id": "P1440", "text": ["to prevent the AC signal from interfering with the DC bias voltages.", "In High Frequency amplifiers, a capacitor is added in parallel with the transformer windings. This enhances the amount of signal that is coupled from stage to stage.\""], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The output of each stage is connected to the primary windings of T1 and T2."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["The inputs to the next stage are taken from the secondary windings of T1 and T2."], "jumps": ["P1470", "P1430"]}, {"id": "P1470", "text": ["The capacitor across the primary of each transformer makes a resonant circuit.", "The capacitor across the primary of each transformer makes a resonant circuit..rcuit."], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["This makes the transformers tuned circuits that pass only one frequency."], "jumps": ["P1490", "P1430"]}, {"id": "P1490", "text": ["Transformer coupling is used in radios and TVs.  It is the principle behind tuning in a radio station or TV channel.", "Transformer coupling is used in radios and TVs. It is the principle behind tuning in a radio station or TV channel."], "jumps": ["P1500", "P1430"]}, {"id": "P1500", "text": ["The disadvantage in using transformer coupling is the size of the transformer at low frequencies."], "jumps": ["P1510", "P1430"]}, {"id": "P1510", "text": ["Transformer coupling is normally used at RF frequencies for radio and TV."], "jumps": ["P1520", "P1430"]}, {"id": "P1520", "text": ["To eliminate the effect that low frequency has on RC, LC and transformer coupling, direct coupling is used.  RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling.", "To eliminate the effect that low frequency has on RC, LC and transformer coupling, direct coupling is used. RC Coupling, LC Coupling, Transformer Coupling and Direct Coupling."], "jumps": ["P1530", "P1430"]}, {"id": "P1530", "text": ["In this typical direct coupled cascade amplifier, base biasing resistors are not used.  Q1's collector bias is the base bias for Q2.", "In this typical direct coupled cascade amplifier, base biasing resistors are not used. Q1's collector bias is the base bias for Q2."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["With no capacitors or inductors used, the amplifiers amplify any signal applied, AC or DC."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["The main disadvantage of direct coupling is that transistor characteristics change with temperature and there are no compensating components."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["Also, any variation in Vcc, input signal, and emitter to collector current are passed on to the next stage."], "jumps": ["P1570", "P1530"]}, {"id": "P1570", "text": ["Direct coupled amplifiers are used for low frequency applications or when the input frequency extends over a large range of frequencies."], "jumps": ["P1580", "P1530"]}, {"id": "P1580", "text": ["What type of coupling is used in this cascade amplifier circuit?"], "jumps": ["P1530"]}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1582", "text": ["RC coupled amplifiers use a collector load resistor and a coupling capacitor.  Notice the coupling components in this amplifier circuit.", "RC coupled amplifiers use a collector load resistor and a coupling capacitor. Notice the coupling components in this amplifier circuit."], "jumps": []}, {"id": "P1583", "text": ["Transformer coupled amplifiers use a transformer and no coupling capacitors.  Notice the coupling components in this amplifier circuit.", "Transformer coupled amplifiers use a transformer and no coupling capacitors. Notice the coupling components in this amplifier circuit."], "jumps": []}, {"id": "P1584", "text": ["Direct coupled amplifiers do not use any reactive components, that is, no capacitors or inductors."], "jumps": []}, {"id": "P1590", "text": ["What type of coupling is used in this cascade amplifier circuit?"], "jumps": ["P1580"]}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592", "text": ["LC coupled amplifiers use a collector load inductor and a coupling capacitor.  Notice the coupling components in this amplifier circuit.", "LC coupled amplifiers use a collector load inductor and a coupling capacitor. Notice the coupling components in this amplifier circuit."], "jumps": []}, {"id": "P1020", "text": ["The term \"cascade\" refers to how the output of one amplifier is applied to the input of another."], "jumps": ["P1030", "P1001"]}, {"id": "P1594", "text": ["Direct coupled amplifiers do not use any reactive components, that is, no capacitors or inductors.  Notice the coupling components in this amplifier.", "Direct coupled amplifiers do not use any reactive components, that is, no capacitors or inductors. Notice the coupling components in this amplifier."], "jumps": []}, {"id": "P1600", "text": ["What type of coupling is used if the input frequency is 3 Hz?"], "jumps": ["P1590"]}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1602", "text": ["Any type of coupling that uses reactive components is not well suited for low frequency signals."], "jumps": []}, {"id": "P1610", "text": ["What type of coupling has the least effect on the collector AC signal for high frequency inputs?"], "jumps": ["P1600"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["RC coupling uses a resistor on the collector load.  The resistor will affect the AC signal on the collector.", "RC coupling uses a resistor on the collector load. The resistor will affect the AC signal on the collector."], "jumps": []}, {"id": "P1613", "text": ["RL (resistor - inductor) is not a type of coupling used in cascade amplifiers."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on MULTISTAGE TRANSISTOR AMPS."], "jumps": ["P1001", "P1610"]}, {"id": "P1920", "text": ["1.  Cascaded amplifiers have the output of one amplifier                        connected to the input of the next amplifier.", "1. Cascaded amplifiers have the output of one amplifier connected to the input of the next amplifier.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Each individual amplifier is called a stage.", "2. Each individual amplifier is called a stage............"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The total voltage gain of a multistage amplifier equals the                product of the individual gains.  \n                              Av (total) = Av1 x Av2 x Av3 x ...", "3. The total voltage gain of a multistage amplifier equals the product of the individual gains. Av (total) = Av1 x Av2 x Av3 x ..."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  RC Coupling - Advantage - Least expensive components.               Disadvantage - Response to low frequency is poor.", "4. RC Coupling - Advantage - Least expensive components. Disadvantage - Response to low frequency is poor."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  LC Coupling - Advantage - Inductor does not affect the                    collector AC signal. Disadvantage - Inductor expensive, poor         low frequency response.", "5. LC Coupling - Advantage - Inductor does not affect the collector AC signal. Disadvantage - Inductor expensive, poor low frequency response."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Transformer Coupling - Advantage - Forms a tuned circuit to let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
