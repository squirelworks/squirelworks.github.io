]}, {"id": "P10217", "text": ["Which of the following e-mail components allows you to attach a file to your e-mail to send with the e-mail?"], "jumps": []}, {"id": "P10216", "text": ["Which of the following e-mail components allows you to attach a predefined message to the end of your e-mails?"], "jumps": []}, {"id": "P10215", "text": ["Which of the following e-mail components allows you to send copies of your currently written e-mail to more than one user?"], "jumps": []}, {"id": "P10214", "text": ["The middle item in an e-mail address is?"], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10211", "text": [], "jumps": []}, {"id": "P10210", "text": [], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P1330", "text": ["For example, in your address book the keyword rick may be associated with rick@sun.up.edu. The keyword office may be associated with jay@office.com, mike@office.com and kelly@office.com..."], "jumps": ["P1340", "P1310"]}, {"id": "P1370", "text": ["We have looked at sending e-mail, now let's look at reading e-mail. Some services will allow you to download all of your e-mail to your computer for offline reading.", "From: Sally@office.com Subject: Hey there!! Data: Fri, 11 Oct 2000 05:11:01 Hey John, this is just a test! -Sally , Sally"], "jumps": ["P1380", "P1310"]}, {"id": "P2940", "text": ["3. IRC has channels which contain people talking about common interests. There are hundreds of channels on IRC.", "Chat Room 2: boblyn4: How are you? sally13345: hi, room! johndoe: Good Bob aba23: anyone from florida Seabab77: a/s/l? sally13345: i said HI ROOM johndoe: hi sally. its john! Seabab77: a/s/l? johndoe: lunch? sally13345: sure!"], "jumps": ["P2999", "P2930"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")", "1. Internet Relay Chat, or IRC, is used for real time communication, unlike e-mail which is delayed.", "This completes the information on INTERNET RELAY CHAT......", "IRC stands for Internet Relay Chat........................."], "jumps": ["P2930", "P2001", "P2270"]}, {"id": "P2270", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on INTERNET RELAY CHAT......"], "jumps": ["P2001", "P2270"]}, {"id": "P2260", "text": ["Some servers frown on the use of bots and have severe penalties for using them. Make sure you have permission if you want to use one."], "jumps": ["P2270", "P2250"]}, {"id": "P2271", "text": ["Remember, IRC is used for real time communications........."], "jumps": []}, {"id": "P2930", "text": ["2. IRC, like most Internet applications, requires both servers and clients."], "jumps": ["P2940", "P2920"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P1220", "text": ["Some e-mail programs allow you to put in a Reply To address. This allows you to receive replies to your e-mail at a different address then where you sent it from.", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Hi, How are you? Dear Friends, How are you all? -john e with me? Utterly Lonely, John Sincerely, John"], "jumps": ["P1230", "P1210"]}, {"id": "P2250", "text": ["The last thing we are going to talk about is bots or robots. These are automated reply programs that actually act like real people.", "IRC allows you to communicate in?.........................."], "jumps": ["P2260", "P2240"]}, {"id": "P2230", "text": ["Depending on your IRC client, there may be many options which allow you to: search the channel lists, see if someone is connected, or other options.", "As people come and go, the user list window will change accordingly. This is a very handy feature."], "jumps": ["P2240", "P2200"]}, {"id": "P2210", "text": ["When you type in the typing window, nothing is sent until you press return. After you press return your message is sent."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["As people come and go, the user list window will change accordingly. This is a very handy feature."], "jumps": ["P2230", "P2200"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2190", "text": ["After you have connected, a channel list may appear. This shows a subset of IRC channels that you can connect to. As you learn of new channels you can add them to the list.", "Chat Room 1 Chat Room 2 Chat Room 3 Chat Room 4 Chat Room 5 Chat Room 6 Chat Room 7 Chat Room 8 Chat Room 9 Chat Room 10 Chat Room 11"], "jumps": ["P2200", "P2150"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2240", "text": ["IRC allows you to communicate in?.........................."], "jumps": ["P2200"]}, {"id": "P2270", "text": ["IRC stands for? question is typed.........................."], "jumps": ["P2250"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2940"]}, {"id": "P2130", "text": ["There are hundreds of different channels that you can connect to. Depending on your IRC client, there are different ways to list the available channels.", "Chat Room 1 Chat Room 2 Chat Room 3 Chat Room 4 Chat Room 5 Chat Room 6 Chat Room 7 Chat Room 8 Chat Room 9 Chat Room 10 Chat Room 11"], "jumps": ["P2140", "P2120"]}, {"id": "P2170", "text": ["Not all servers will have all channels. The purpose for so many servers is that each has its limits on the number of users."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["If you cannot connect to the server you selected, in some clients you will need to pick another server, in most, however, the next one in the list will be tried."], "jumps": ["P2190", "P2150"]}, {"id": "P2110", "text": ["In simple Internet accounts you may have to specify the server you would like to connect to. Your provider can tell you where to connect.", "You are the client, and the software you use will contact a server. In larger providers this is not necessary because they have their servers pre-programmed with the software you use."], "jumps": ["P2120", "P2090"]}, {"id": "P2140", "text": ["Be aware, however, that if you list all channels you may be waiting quite a while until the screen has stopped listing them.", "Chat Room 1 Chat Room 2 Chat Room 3 Chat Room 4 Chat Room 5 Chat Room 6 Chat Room 7 Chat Room 8 Chat Room 9 Chat Room 10 Chat Room 11"], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["When you start an IRC client, like mIRC32 for Windows 95, you will be asked for your real name, e-mail address, and a nickname."], "jumps": ["P2160", "P2130"]}, {"id": "P2050", "text": ["There are many different ways to use IRC, and the way you use it will depend on your Internet provider.", "Chat Room 2: boblyn4: How are you? sally13345: hi, room! johndoe: Good Bob aba23: anyone from florida Seabab77: a/s/l? sally13345: i said HI ROOM johndoe: hi sally. its john! Seabab77: a/s/l? johndoe: lunch? sally13345: sure!", "Chat Room 1 Chat Room 2 Chat Room 3 Chat Room 4 Chat Room 5 Chat Room 6 Chat Room 7 Chat Room 8 Chat Room 9 Chat Room 10 Chat Room 11", "Chat Room 2: johndoe: hi sally. its john! Seabab77: a/s/l? johndoe: lunch? sally13345: sure! NidaGrl: This chat room is fun! johndoe: hi sally. its john! Seabab77: a/s/l? johndoe: lunch? sally13345: sure! NidaGrl: This chat room is fun!"], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Many providers, like America Online or CompuServe, provide a graphical interface to IRC. It is important to note that IRC in a large service provider may not be referred to as IRC.", "Johndoe: Hey Sally, How are you? Sally13345: Good John, how are you? Johndoe: I'm alright Sally13345: Will you meet me for lunch? Johndoe: OK, where do you want to go?", "Arial Roman Comic San Book Shelf Handwrite"], "jumps": ["P2080", "P2050"]}, {"id": "P2090", "text": ["IRC works off of an IRC server. Basically this is a computer on the net that hosts the connections of people to the IRC network."], "jumps": ["P2100", "P2050"]}, {"id": "P2160", "text": ["Also, there is a list of IRC Servers. After you have entered this information you can select one of the servers and select connect."], "jumps": ["P2170", "P2150"]}, {"id": "P1940", "text": ["3. E-mail applications allow for the reading, writing and manipulations of e-mail messages. E-mail application features vary greatly.", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Hi, How are you? Dear Friends, Sally just rejected me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John"], "jumps": ["P1950", "P1930"]}, {"id": "P2080", "text": ["In this section of the lesson we are going to look at the fundamentals of IRC, along with a simplistic approach to the terminology used."], "jumps": ["P2090", "P2050"]}, {"id": "P1920", "text": ["1. E-mail messages contain the following information fields: To:, From:, Cc:, Subject: and text area.", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Hi, How are you? Dear Friends, Sally just rejected me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John"], "jumps": ["P1930", "P1001"]}, {"id": "P2120", "text": ["Once you have been connected, you will be placed in a default channel. A channel, also known as a forum or room, is where people collect to discuss issues.", "Chat Room 2: boblyn4: How are you? sally13345: hi, room! johndoe: Good Bob aba23: anyone from florida Seabab77: a/s/l? sally13345: i said HI ROOM johndoe: hi sally. its john! Seabab77: a/s/l? johndoe: lunch? sally13345: sure!"], "jumps": ["P2130", "P2110"]}, {"id": "P2200", "text": ["After selecting a channel an additional window will appear. This window will contain three areas, message window, typing window and a user list window.", "Chat Room 2: boblyn4: How are you? sally13345: hi, room! johndoe: Good Bob aba23: anyone from florida Seabab77: a/s/l? sally13345: i said HI ROOM johndoe: hi sally. its john! Seabab77: a/s/l? johndoe: lunch? sally13345: sure!"], "jumps": ["P2210", "P2190"]}, {"id": "P2241", "text": ["What you have seen is basic knowledge for effectively using e-mail on the Internet. You will find that e-mail is fast, effective and costs less than physical mail.", "From: Sally@office.com Subject: Hey there!! Data: Fri, 11 Oct 2000 05:11:01 Hey John, this is just a test! -Sally , Sally"], "jumps": ["P1910", "P1590"]}, {"id": "P1910", "text": ["This completes the information on ELECTRONIC MAIL.E........"], "jumps": ["P1001", "P1600"]}, {"id": "P2100", "text": ["You are the client, and the software you use will contact a server. In larger providers this is not necessary because they have their servers pre-programmed with the software you use.", "The Save to Disk option allows you to save the current e-mail that you are viewing to a file so that you don't have to keep it in your mailbox.", "Dear Friends, Sally just rejected me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John ed me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John"], "jumps": ["P2110", "P2090"]}, {"id": "P1590", "text": ["Which of the following e-mail applications will send a copy of an e-mail that someone sent to you, to someone else?"], "jumps": ["P1550"]}, {"id": "P1570", "text": ["If the domain can be found, the e-mail is sent to that domain. If the specified user is not within that domain, the domain server will e-mail you telling you of this.", "If the domain cannot be found, normally the server that handles the e-mail for your domain, will return the e-mail saying that the domain cannot be contacted.", "It is important to note that e-mail is not always fast, some servers don't send mail all the time, maybe every hour or day. When you e-mail to a user, your mail is sent to the domain."], "jumps": ["P1580", "P1550", "P1560", "P1450"]}, {"id": "P1560", "text": ["If the domain cannot be found, normally the server that handles the e-mail for your domain, will return the e-mail saying that the domain cannot be contacted."], "jumps": ["P1570", "P1550"]}, {"id": "P1530", "text": ["After your e-mail is received by the server, the requested information will be sent to you or, possibly, an error e-mail sent back if something in your message wasn't correct.", "To request certain data, the company or organization will provide instructions on obtaining the data. In most cases, there is a keyword you supply in the subject or text."], "jumps": ["P1540", "P1450"]}, {"id": "P1510", "text": ["Mail back services provide a means of requesting data to be sent to you, very much like the fax back services that many companies offer.", "Mailing lists are very useful when you need to know about breaking news or product updates. They are also beneficial to discussion groups where people can e-mail in questions and see responses..."], "jumps": ["P1520", "P1450"]}, {"id": "P1490", "text": ["2. People who use the mailing list, e-mail to the server which distributes the message to people on the server's mailing list.", "There are two ways a mailing list works. 1. Only the company e-mails out to people who have subscribed to the mailing list."], "jumps": ["P1500", "P1450"]}, {"id": "P1470", "text": ["Normally, to subscribe to a mailing list you will be given instructions on how to mail to the list server. An example would be to e-mail majordomo@nida.com with subscribe (your e-mail address) in the subject..."], "jumps": ["P1480", "P1450"]}, {"id": "P440", "text": ["Let's begin the lesson on E-MAIL AND INTERNET RELAY CHAT (IRC).............."], "jumps": ["P410"]}, {"id": "P1450", "text": ["The last item we are going to talk about is services provided through e-mail. These are mailing lists, mail back services and problem messages. iling Lists Mail Back Services Problem Messages", "These are just the basic features of e-mail applications. There may be more advanced features which would be detailed by documentation provided with the application."], "jumps": ["P1460", "P1390"]}, {"id": "P1430", "text": ["The \"Save to disk\" function allows you to save the e-mail message to a file, other than in your mailbox. And the \"Print\" function allows you to send the file to your printer for a hardcopy of the message...", "Selecting \"Reply\" allows you to send a message back to that user without having to type anything into the To or Subject fields. This information is generated for you based on the selected e-mail..."], "jumps": ["P1440", "P1390"]}, {"id": "P1415", "text": ["Selecting \"Delete\" will delete the highlighted message on the list or the current message you are viewing."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["Selecting \"Reply\" allows you to send a message back to that user without having to type anything into the To or Subject fields. This information is generated for you based on the selected e-mail..."], "jumps": ["P1430", "P1390"]}, {"id": "P1440", "text": ["These are just the basic features of e-mail applications. There may be more advanced features which would be detailed by documentation provided with the application."], "jumps": ["P1450", "P1390"]}, {"id": "P1390", "text": ["Usually an e-mail application arranges new messages in an index, listed in the order they were received. Some example functions of this Index are: \"Read\", \"Reply\", \"Print\", \"Save to disk\", \"Delete\", and \"Forward\"...", "Dear Friends, Sally just rejected me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John ed me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John", "The Print option allows you to print the e-mail message on a printer, in other words, generate a hard copy.", "Some popular e-mail tools are: Eudora, Pine, Windows 95 Inbox and Netscape Navigator. Let's discuss the basic features of these applications."], "jumps": ["P1400", "P1370"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P1580", "text": ["Sometimes, e-mail systems get backed up or are down. In some cases, servers will tell you that your e-mail cannot be delivered for a certain number of days but that you do not need to resend."], "jumps": ["P1590", "P1550"]}, {"id": "P1950", "text": ["4. E-mail services like mailing lists and mail back services provide helpful useful information for a variety of topics.", "Sally Bob John Patty Larry", "Sally@office.com Bob@netmail.net Johndoe@Nida.com Pattysmith@usbid.com"], "jumps": ["P1999", "P1940"]}, {"id": "P900", "text": [". In larger providers this is not necessary because they have their servers pre-programmed with the software you use."], "jumps": []}, {"id": "P1282", "text": ["The To field is used to specify where the original e-mail is going to get sent to.", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Hi, How are you? Dear Friends, Sally just rejected me, Anyone else wanna go out on a date with me? Utterly Lonely, John Sincerely, John"], "jumps": []}, {"id": "P1300", "text": ["Some popular e-mail tools are: Eudora, Pine, Windows 95 Inbox and Netscape Navigator. Let's discuss the basic features of these applications."], "jumps": ["P1310", "P1290"]}, {"id": "P1270", "text": ["This other information is not necessary to know, and is only used by the programs which distributes the e-mail to the appropriate locations.", "These are just the basic sets of information fields that most e-mail will contain. It is important to note that there is information sent with your e-mail that you don't control."], "jumps": ["P1280", "P1210"]}, {"id": "P1250", "text": ["A signature is a few lines of text that you want added to every e-mail you send. This could be a small advertisement, information or just some neat saying that you've written."], "jumps": ["P1260", "P1210"]}, {"id": "P1230", "text": ["An attachment is a file that you would like to send with the e-mail. This could be any type of file: zip, program, or text file, just to name a few..", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Hi, How are you? Dear Friends, how are you all? -john John"], "jumps": ["P1240", "P1210"]}, {"id": "P1460", "text": ["A mailing list is like an e-mail distribution center. Mailing lists may be from companies providing latest information, an interest group, fan club or discussion group. il Back Services Problem Messages"], "jumps": ["P1470", "P1450"]}, {"id": "P1480", "text": ["There are two ways a mailing list works. 1. Only the company e-mails out to people who have subscribed to the mailing list."], "jumps": ["P1490", "P1450"]}, {"id": "P1500", "text": ["Mailing lists are very useful when you need to know about breaking news or product updates. They are also beneficial to discussion groups where people can e-mail in questions and see responses..."], "jumps": ["P1510", "P1450"]}, {"id": "P1520", "text": ["To request certain data, the company or organization will provide instructions on obtaining the data. In most cases, there is a keyword you supply in the subject or text."], "jumps": ["P1530", "P1450"]}, {"id": "P1540", "text": ["The last thing we are going to talk about is problem messages. Problem messages are e-mails sent to you concerning e-mail that you have sent."], "jumps": ["P1550", "P1450"]}, {"id": "P1210", "text": ["The text area is where you type your message that you are sending.", "To: Sally@office.com From: JohnDoe@Nida.com CC: Subject: File is Sent Dear Sally, I Sent the NIDA file that you have asked for. Sincerely, Johnterly Lonely, John Sincerely, John erely, John"], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": [], "jumps": ["P1230", "P1210"]}, {"id": "P2930", "text": ["2. IRC, like most Internet applications, requires both servers and clients."], "jumps": ["P2940", "P2920"]}, {"id": "PINFO", "text": ["12-08-00 Converted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics.Alexis 12-19-00 Review - lisa 07-19-01 Converted to ToolBook 8.1 format. jay", "12-08-00 Converted from SAM to toolbook. frieda 12-08-00 Text and Branching. frieda 12-12-00 Graphics.Alexis 12-19-00 Review - lisa 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-13-02 Review of Conversion. Alexis", "We have already discussed the information that needs to be specified for an e-mail. What we haven't addressed is the concept of address books.", "Sally Bob John Patty Larry", "Sally@office.com Bob@netmail.net Johndoe@Nida.com Pattysmith@usbid.com"], "jumps": []}, {"id": "P1320", "text": ["An address book is a tool to manage frequently used e-mail addresses. In an address book you can specify a keyword for an address or list of addresses."], "jumps": ["P1330", "P1310"]}, {"id": "P1180", "text": ["The Cc (carbon copies) field is used when you want to send copies of e-mail to other people. Normally multiple e-mail addresses can be entered with a comma and a space between each entry...", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Dear Friends I have to tell you about the Lesson i just recieved from Nida Co., It's great!!!! Sincerely, John John"], "jumps": ["P1190", "P1160", "P1180"]}, {"id": "P1190", "text": ["The Subject field contains a brief description of what your message is about. This just provides a short summary to the reader.", "To: Sally@office.com From: JohnDoe@Nida.com CC: Larry354@travel.net, Pattysmith@usbid.com Subject: Hi, How are you? Dear Friends, How are you all?"], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["Most e-mail programs use an index made with the From and Subject field along with the date.", "In: JohnDoe@Nida.com 12:00pm 9-01 Call Me PattySmith@usbid.com 11:36pm 9-02 Send it to me Alexis894559@house.net 3:45pm 9-05 Send the file Out: JohnDoe@Nida.com 12:30pm 9-01 No I will not PattySmith@usbid.com 11:40pm 9-02 FW:Read This"], "jumps": ["P1210", "P1160"]}, {"id": "P1240", "text": ["When the other person receives the e-mail they can save it to their computer. This is very useful for sending small database files or word processor documents."], "jumps": ["P1250", "P1210"]}, {"id": "P1280", "text": ["Which of the following fields are used to send copies of an e-mail to other users?"], "jumps": ["P1210"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1160", "text": ["The To field of an e-mail is the address of the person or place that you are sending the e-mail (message) to. In this case, you are sending e-mail to \"sally@office.com\" or Sally at the office.", "To: Sally@office.com From: CC: Subject: Dear Sally, I hope I wrote your domain name and user-id correctly. ohn ely, John"], "jumps": ["P1170", "P1150"]}, {"id": "P1260", "text": ["These are just the basic sets of information fields that most e-mail will contain. It is important to note that there is information sent with your e-mail that you don't control."], "jumps": ["P1270", "P1210"]}, {"id": "P1290", "text": ["The next step is to talk about e-mail applications. These are tools which are used to read and write e-mail messages."], "jumps": ["P1300", "P1280"]}, {"id": "P1040", "text": ["Electronic mail, or e-mail for short, is a method of corresponding to people over the Internet rather than actual mail. Internet Slow Fast"], "jumps": ["P1050", "P1001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["12-08-00 Converted from SAM to toolbook. frieda 12-08-00 Text and Branching. fr let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
