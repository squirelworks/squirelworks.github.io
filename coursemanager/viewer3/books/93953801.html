requency and power amplifiers."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Op-amps contain three circuits:", "Op-amps contain three circuits:............................"], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO OPERATIONAL AMPLIFIERS............"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Operational amplifiers use two inputs to determine the output."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The inputs are labeled with positive (+) and negative (-) signs."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The positive (+) labeled input is called the NON-INVERTING input."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The input with the negative (-) sign is the INVERTING input."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Touch the inverting input on this op-amp.", "Touch the inverting input on this op-amp..................."], "jumps": ["P1020"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["You touched the non-inverting input. The non-inverting input uses the \"+\" sign."], "jumps": []}, {"id": "P1073", "text": ["You touched the output. Op-amp inputs are labeled with positive (+) and negative (-) signs."], "jumps": []}, {"id": "P1074", "text": ["You did not touch an input. Op-amp inputs are labeled with positive (+) and negative (-) signs."], "jumps": []}, {"id": "P1080", "text": ["Touch the output on this op-amp.", "Touch the output on this op-amp.d.........................."], "jumps": ["P1070"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["You touched the non-inverting input. Inputs to op-amps are labeled with positive (+) and negative (-) signs. The output is not labeled."], "jumps": []}, {"id": "P1083", "text": ["You touched the inverting input. Inputs to op-amps are labeled with positive (+) and negative (-) signs. Outputs are not labeled."], "jumps": []}, {"id": "P1084", "text": ["You did not touch the output. Remember, inputs are labeled with positive (+) and negative (-) signs. Outputs are not labeled."], "jumps": []}, {"id": "P1090", "text": ["The two inputs give op-amps versatility.", "The two inputs give op-amps versatility...................."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Grounding the inverting (-) input produces a non-inverting amplifier. The input and output signals are in phase."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Grounding the non-inverting (+) input produces an inverting amplifier. The input and output signals are out of phase."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["Using both inputs produces a differential amplifier. The output is the difference between the inputs."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["Connecting several signals to the inverting (-) input produces a summing amplifier. The output is the algebraic inverted sum of the inputs."], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["What type of amplifier is this op-amp?", "What type of amplifier is this op-amp?....................."], "jumps": ["P1090"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["An inverting amplifier has the non-inverting input (+) grounded."], "jumps": []}, {"id": "P1143", "text": ["A non-inverting amplifier has the inverting input (-) grounded."], "jumps": []}, {"id": "P1150", "text": ["What type of amplifier is this op-amp?", "What type of amplifier is this op-amp?....................."], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1153", "text": ["A differential amplifier uses both the inverting (-) and  non-inverting (+) inputs. A ground on an input indicates that the input is not used.", "A differential amplifier uses both the inverting (-) and non-inverting (+) inputs. A ground on an input indicates that the input is not used."], "jumps": []}, {"id": "P1160", "text": ["Op-amps use three circuits to perform many different functions."], "jumps": ["P1150", "P1170"]}, {"id": "P1170", "text": ["The differential amplifier receives the inputs."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The output of the differential amplifier is applied to the common collector amplifier. This output is the difference between the + and - inputs."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["If the negative (-) input is grounded, the output is equal to the positive (+) input minus zero (ground). This does not invert the output."], "jumps": ["P1195", "P1160"]}, {"id": "P1195", "text": ["If the positive (+) input is grounded, the output is equal to the negative (-) input minus zero (ground). The output signal will be inverted."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["The common collector amplifier is used to isolate the differential amplifier from the push-pull amplifier."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["Recall that common collector amplifiers have high input impedance.  This ensures that the differential amplifier is not loaded down by the push-pull amplifier.", "Recall that common collector amplifiers have high input impedance. This ensures that the differential amplifier is not loaded down by the push-pull amplifier."], "jumps": ["P1220", "P1160"]}, {"id": "P1220", "text": ["The output of the common collector amplifier is applied to the push-pull amplifier."], "jumps": ["P1230", "P1160"]}, {"id": "P1230", "text": ["Most of the amplification takes place in the push-pull amplifier.  Its power gain is high.", "Most of the amplification takes place in the push-pull amplifier. Its power gain is high."], "jumps": ["P1240", "P1160"]}, {"id": "P1240", "text": ["The output of the push-pull amplifier is the output of the op-amp."], "jumps": ["P1250", "P1160"]}, {"id": "P1250", "text": ["Which circuit is used for power amplification in an op-amp?"], "jumps": ["P1160"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["The differential amplifier is used to develop a difference signal."], "jumps": []}, {"id": "P1253", "text": ["The common collector amplifier is used to isolate the differential amplifier from the push-pull amplifier."], "jumps": []}, {"id": "P1260", "text": ["Combining the three circuits into one operational amplifier using individual components is not practical."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Op-amps are not normally constructed from individual components,  they are packaged in integrated circuits (IC).", "Op-amps are not normally constructed from individual components, they are packaged in integrated circuits (IC)."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["Op-amp ICs are made from P and N type material, just like diodes and transistors."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Op-amp ICs are very useful and inexpensive."], "jumps": ["P1910", "P1290"]}, {"id": "P1910", "text": ["This completes the information on OPERATIONAL AMPLIFIERS.", "This completes the information on OPERATIONAL AMPLIFIERS..."], "jumps": ["P1001", "P1290"]}, {"id": "P1920", "text": ["1.  Operational amplifiers have two inputs and one output.", "1. Operational amplifiers have two inputs and one output.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The inputs are labeled non-inverting (+) and inverting (-)."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Operational amplifiers are used as:", "3. Operational amplifiers are used as:...................."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Operational amplifiers contain three circuits: differential amp,         common collector amp, and push-pull amp.", "4. Operational amplifiers contain three circuits: differential amp, common collector amp, and push-pull amp...."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Operational amplifiers are packaged in integrated circuits (IC).", "5. Operational amplifiers are packaged in integrated circuits (IC)."], "jumps": ["P1999", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The differential amplifier is the key to the op-amp's versatility."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["It is a simple amplifier circuit using two transistors."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The non-inverting input is applied to the base of Q1. The inverting input is applied to the base of Q2."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The emitters of both transistors are connected to one emitter resistor which is connected to a negative voltage."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The output is taken from the collector of Q2."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["Depending on the inputs, Q1 is either a common collector or common base amplifier."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["Q2 is either a common base or common emitter amplifier depending on the inputs. Let's see how this is done."], "jumps": ["P2090", "P2020"]}, {"id": "P2090", "text": ["The inverting input is grounded when the differential amplifier is used as a non-inverting amplifier."], "jumps": ["P2100", "P2020"]}, {"id": "P2100", "text": ["Redrawing the circuit shows that Q1 drives Q2.", "Redrawing the circuit shows that Q1 drives Q2.............."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Q1 has the non-inverting input applied to its base. The emitter provides the output making Q1 a common collector amplifier."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Remember, common collector amplifiers do not invert the input signal and have a voltage gain of 1."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The output of Q1 is applied to the emitter of Q2. Q2's output is from the collector making Q2 a common base amplifier."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["Remember, common base amplifiers do not invert the input signal and have high voltage gains."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The non-inverting input is amplified and not inverted with the inverting input grounded."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["The non-inverting input is grounded when the differential amplifier is used as an inverting amplifier."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["Redrawing the circuit shows that Q2 drives Q1.", "Redrawing the circuit shows that Q2 drives Q1.............."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The inverting input is applied to the base of Q2. The collector is the output making Q2 a common emitter amplifier."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Q1 is a common base amplifier and adds to the voltage gain output of Q2.and inverted."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["With the non-inverting input grounded, the inverting input is amplified and inverted."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["When both inputs to the differential amplifier are used, the output is the difference between the inputs."], "jumps": ["P2215", "P2170"]}, {"id": "P2215", "text": ["The differential amplifier can operate in one of two modes: Difference Mode or Common Mode"], "jumps": ["P2220", "P2210"]}, {"id": "P2220", "text": ["First, let's look at the difference mode of operation. The differential amplifier operates in this mode when the inputs are 180\u00ba out of phase.", "First, let's look at the difference mode of operation. The differential amplifier operates in this mode when the inputs are 180"], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Consider the operation of the + input only. The positive signal on the + input produces a positive output.  Just like the non-inverting amplifier.", "Consider the operation of the + input only. The positive signal on the + input produces a positive output. Just like the non-inverting amplifier."], "jumps": ["P2240", "P2210", "P2235"]}, {"id": "P2232", "text": ["Consider the operation of the + input only. The positive signal on the + input produces a positive output. Just like the non-inverting amplifier."], "jumps": ["P2240", "P2210", "P2235"]}, {"id": "P2235", "text": [], "jumps": []}, {"id": "P2240", "text": ["Consider the operation of the - input only. The negative signal on the - input also produces a positive output. Just like the inverting amplifier."], "jumps": ["P2250", "P2210", "P2245"]}, {"id": "P2242", "text": ["Consider the operation of the - input only. The negative signal on the - input also produces a positive output. Just like the inverting amplifier."], "jumps": ["P2250", "P2210", "P2245"]}, {"id": "P2245", "text": [], "jumps": []}, {"id": "P2250", "text": ["The two output signals on the collector of Q2 combine. Since they are in phase, the output is larger."], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["The output signal is the difference between the input signals. If they are equal, the output is twice the gain of a single input."], "jumps": ["P2270", "P2210"]}, {"id": "P2270", "text": ["Now, let's look at the common mode of operation. The differential amplifier operates in this mode when the inputs are in phase."], "jumps": ["P2280", "P2210"]}, {"id": "P2280", "text": ["Consider the operation of the + input only. The positive signal on the + input produces a positive output. Just like the non-inverting amplifier."], "jumps": ["P2290", "P2270", "P2235"]}, {"id": "P2282", "text": ["Consider the operation of the + input only. The positive signal on the + input produces a positive output. Just like the non-inverting amplifier."], "jumps": ["P2290", "P2270", "P2235"]}, {"id": "P2290", "text": ["Consider the operation of the - input only. The positive signal on the - input produces a negative output. Just like the inverting amplifier."], "jumps": ["P2300", "P2270", "P2245"]}, {"id": "P2292", "text": ["Consider the operation of the - input only. The positive signal on the - input produces a negative output. Just like the inverting amplifier."], "jumps": ["P2300", "P2270", "P2245"]}, {"id": "P2300", "text": ["The two output signals on the collector of Q2 combine. Since they are out of phase, the output is smaller."], "jumps": ["P2310", "P2270"]}, {"id": "P2310", "text": ["The output signal is the difference between the input signals. If the inputs are equal, the output is zero."], "jumps": ["P2320", "P2270"]}, {"id": "P2320", "text": ["When the differential amplifier is used as a summing amplifier, all the inputs are applied to the inverting input."], "jumps": ["P2330", "P2270"]}, {"id": "P2330", "text": ["The output is the inverted sum of the inputs."], "jumps": ["P2380", "P2320"]}, {"id": "P2380", "text": ["What type of differential amplifier is this circuit?", "What type of differential amplifier is this circuit?......."], "jumps": ["P2320"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["Note that the - input is grounded. Q1 and Q2 do not change the phase of the input signal."], "jumps": []}, {"id": "P2390", "text": ["What type of differential amplifier is this circuit?", "What type of differential amplifier is this circuit?......."], "jumps": ["P2380"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["Notice that the + input is grounded. Q2 inverts the phase of the input signal."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on DIFFERENTIAL AMPLIFIERS.", "This completes the information on DIFFERENTIAL AMPLIFIERS.."], "jumps": ["P2001", "P2390"]}, {"id": "P2920", "text": ["1.  Differential amplifie let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
