d Acknowledge were both low because nothing was trying to take control of the system busses.", "Pin Name Conditionnnnnnnnnnnnn", "40 VDD HighhhhhhhhhhhhHHHH", "20 GND Lowwwwwwwwwwwwn", "22 READY Highhhhhhhhhhhhtion", "21 RESET Lowwwwwwwwwwwwhhhh", "31 HLDRQ Lowwwwwwwwwwwwwtion", "30 HLDAK Low ion"], "jumps": ["P13260", "P13230"]}, {"id": "P13260", "text": ["11.  Next, lets look at the clock signals. Using the oscilloscope,             measure the frequency at the clock input of (CLK) pin 19.                To see the 8086 Microprocessor schematic press Ctrl+S.", "11. Next, lets look at the clock signals. Using the oscilloscope, measure the frequency at the clock input of (CLK) pin 19. To see the 8086 Microprocessor schematic press Ctrl+S.key."], "jumps": ["P13240", "P13262"]}, {"id": "P13261", "text": [], "jumps": []}, {"id": "P13262", "text": ["Ensure you have your oscilloscope lead on the correct test point.", "Ensure you have your oscilloscope lead on the correct test point........."], "jumps": []}, {"id": "P13267", "text": ["The correct answer should of been 2.4 MHz.", "The correct answer should of been 2.4 MHz.d have measured 5.0mA."], "jumps": ["P13270", "P13260"]}, {"id": "P13270", "text": ["12. Now let's see what happens when the RESET button is pressed on the PC130-410 experiment card. Using your logic probe, measure the RESET pin of the 8086 microprocessor according to the following chart and fill in your answers (HIGH, LOW): To see the 8086 Microprocessor schematic press Ctrl+S.key."], "jumps": ["P13260", "PIN"]}, {"id": "P13273", "text": ["Your answers are still incorrect. They should have been LOW, HIGH, LOW."], "jumps": ["P13280", "P13270"]}, {"id": "P13280", "text": ["Remember, when the RESET signal is applied to the microprocessor, it instructs the internal instruction pointer to start back at the beginning.   It then receives a jump command that leads the instruction pointer to the Nida monitor program.", "Remember, when the RESET signal is applied to the microprocessor, it instructs the internal instruction pointer to start back at the beginning. It then receives a jump command that leads the instruction pointer to the Nida monitor program."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["Next we will examine the HLDRQ input, or Hold Request. First we need to have a program running that will allow us to observe the effects of this signal."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["13. Press RESET on the PC130-410 Card. Next, press 0 for the internal program menu on the PC130-404 Keyboard and Display Unit. Use the down arrow (v) on the keyboard to select the second screen of options. You should see \"4- Demo 1\". Select this program by pressing 4 on the keyboard.."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["14.  A Nida demo and LEDs on the I/O card should be changing.          Now connect the oscilloscope to the HLDAK pin of the 8086          microprocessor.  Using the Alligator to Alligator jumper,                   connect the +5V test point to the HLDRQ pin.  Remove and             reconnect the jumper to observe the effects.", "14. A Nida demo and LEDs on the I/O card should be changing. Now connect the oscilloscope to the HLDAK pin of the 8086 microprocessor. Using the Alligator to Alligator jumper, connect the +5V test point to the HLDRQ pin. Remove and reconnect the jumper to observe the effects."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["Notice that when the signal is applied, the HLDAK pin supplies a 5 Volts \"1\" to indicate it acknowledges the request and is allowing some other device to use the bus."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["You can see that the processor stopped from the display of the Nida Demo program.  Once you remove the request, the acknowledge goes away and the program begins right where it left off.", "You can see that the processor stopped from the display of the Nida Demo program. Once you remove the request, the acknowledge goes away and the program begins right where it left off."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["In other words, you requested control of the busses.  The computer acknowledged and gave control to you.  The microprocessor address, control and data lines went to high impedance effectively removing them from the external busses.", "In other words, you requested control of the busses. The computer acknowledged and gave control to you. The microprocessor address, control and data lines went to high impedance effectively removing them from the external busses."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["Now that we have looked at some of the signals on the 8086 microprocessor, let's look at the operation of the ALU."], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["In this portion of the experiment, you will use the microprocessor to add two numbers as an illustration of the arithmetic capabilities of the 8086 microprocessor."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["15.   Press the RESET button on the PC130-410 card.  You will be         entering a program into memory for execution by the                        microprocessor.", "15. Press the RESET button on the PC130-410 card. You will be entering a program into memory for execution by the microprocessor."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["Entering programs into memory of the 8086 uses the EDIT function of the Monitor Program.  Once you have pressed EDIT, you will be asked to enter an address.", "Entering programs into memory of the 8086 uses the EDIT function of the Monitor Program. Once you have pressed EDIT, you will be asked to enter an address."], "jumps": ["P13390", "P13370"]}, {"id": "P13390", "text": ["There are two ways to enter an address, just a segment or a segment with an offset.   For example, 2000: and 2000:0 or 2000:0000 are all the same location.   In this experiment we will start our program at segment 2000, with an offset of zero.", "There are two ways to enter an address, just a segment or a segment with an offset. For example, 2000: and 2000:0 or 2000:0000 are all the same location. In this experiment we will start our program at segment 2000, with an offset of zero."], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["After you enter a value like \"2000:\", the code editor program will begin.  The top part of the screen will show the segment you are in.  The bottom part of the screen will show the current offset and the 8 bit value stored at that offset.", "After you enter a value like \"2000:\", the code editor program will begin. The top part of the screen will show the segment you are in. The bottom part of the screen will show the current offset and the 8 bit value stored at that offset."], "jumps": ["P13410", "P13390"]}, {"id": "P13410", "text": ["There are three things you can do at any offset and any segment. Enter a new value and press enter, press the down arrow to move to the next offset, or use the up arrow to move to the previous offset."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["Every time you enter a value and press enter, you will automatically move to the next offset.  If, at anytime, you press enter without entering data, zeros will be loaded at that memory location.", "Every time you enter a value and press enter, you will automatically move to the next offset. If, at anytime, you press enter without entering data, zeros will be loaded at that memory location."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["Remember to use the up and down arrows for movement through your code.  When a program is shown to you, you will be given an address, opcodes, mnemonic and a description.", "Remember to use the up and down arrows for movement through your code. When a program is shown to you, you will be given an address, opcodes, mnemonic and a description."], "jumps": ["P13440", "P13420"]}, {"id": "P13440", "text": ["You start at the first address given and enter each opcode consecutively into memory until you are finished entering the        program.  The mnemonic is what an assembler program would use to generate the opcodes for a program.", "You start at the first address given and enter each opcode consecutively into memory until you are finished entering the program. The mnemonic is what an assembler program would use to generate the opcodes for a program."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["Once you are finished entering your program, press STOP.  To verify that your program is loaded, press the DISPLAY R.M. key and enter the starting address of the program.", "Once you are finished entering your program, press STOP. To verify that your program is loaded, press the DISPLAY R.M. key and enter the starting address of the program."], "jumps": ["P13460", "P13440"]}, {"id": "P13460", "text": ["After you press ENTER, all the opcodes for the location and the next 17 locations will be shown.  Again, use the up and down arrows to move through memory.", "After you press ENTER, all the opcodes for the location and the next 17 locations will be shown. Again, use the up and down arrows to move through memory. TEXT) NOTE Segments start every 16 kbytes of memory, and an offset can be up to 64 kbytes of memory. This means that segments overlap one another. For this reasons, an offset of zero in segment 2000 \"2000:0\" is the same location as offset 2000 in segment 0 \"0:2000\". Certain routines in the Nida monitor program will determine the smallest segment and then the offset.", "Segments start every 16 kbytes of memory, and an offset can be up to 64 kbytes of memory. This means that segments overlap one another. For this reasons, an offset of zero in segment 2000 \"2000:0\" is the same location as offset 2000 in segment 0 \"0:2000\". Certain routines in the Nida monitor program will determine the smallest segment and then the offset. you must reenter the program and then run the program before proceeding with your measurements...nts."], "jumps": ["P13470", "P13450"]}, {"id": "P13470", "text": ["16. Enter the following program into memory starting at \"2000:0\" using the following procedure: EDIT, 2000:0 ENTER, enter opcode values with an ENTER after each, and then press stop. Remember, everytime you enter an opcode value and press ENTER, you will automatically move to the next offset.....", "MOV AX, 0Ah MOV BX, 05h ADD AX,BX INT 1Ch", "Moves the value 0Ah into the AX register Moves the value 05h into the BX register Adds the value of AX and BX and stores in the AX register. Calls a monitor program routine which displays the internal register value."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["17.  Run the program you just entered.  This is done by pressing          the RUN key and entering the starting address of the                        program: 2000:, 2000:0 or 2000:0000.   Remember, all of                  these are equivalent locations.", "17. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program: 2000:, 2000:0 or 2000:0000. Remember, all of these are equivalent locations."], "jumps": ["P13490", "P13470"]}, {"id": "P13490", "text": ["What are the values of the following registers?", "What are the values of the following registers?ric answers (1a, 2a, 3a, 4a).....).)........"], "jumps": ["P13480"]}, {"id": "P13493", "text": ["Your answers are still incorrect.  You should have answered 000F and 0005.", "Your answers are still incorrect. You should have answered 000F and 0005."], "jumps": ["P13500", "P13490"]}, {"id": "P13500", "text": ["Remember, the values of 000A and 0005 were placed into AX and BX. Then, the microprocessor added them together and stored the result in AX.  This replaced any previously value stored there.", "Remember, the values of 000A and 0005 were placed into AX and BX. Then, the microprocessor added them together and stored the result in AX. This replaced any previously value stored there."], "jumps": ["P13510", "P13490"]}, {"id": "P13510", "text": ["That is why the result of 000A+0005=000F is stored in AX and one of the original values, 0005, remained in the BX register. Notice that the first byte is the lower byte and the second is the higher byte."], "jumps": ["P13520", "P13500"]}, {"id": "P13520", "text": ["In other words, BL is shown first and then BH.  When determining values from the registers, especially 16 bit, you must remember which is the most significant byte when converting.", "In other words, BL is shown first and then BH. When determining values from the registers, especially 16 bit, you must remember which is the most significant byte when converting."], "jumps": ["P13530", "P13510"]}, {"id": "P13530", "text": ["In the next lesson we will look at the circuits external to the 8086 microprocessor.  You will observe the control and status signals of the 8086 since they dictate the operation of the external circuits.", "In the next lesson we will look at the circuits external to the 8086 microprocessor. You will observe the control and status signals of the 8086 since they dictate the operation of the external circuits."], "jumps": ["P13540", "P13520"]}, {"id": "P13540", "text": ["1.  Disconnect the oscilloscope and logic probe from the                      experiment cards.", "1. Disconnect the oscilloscope and logic probe from the experiment cards..."], "jumps": ["P13530"]}, {"id": "P13560", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF..F................................."], "jumps": []}, {"id": "P13570", "text": ["3.  Disconnect the equipment and return to the designated area.", "3. Disconnect the equipment and return to the designated area."], "jumps": ["P13910", "P13560"]}, {"id": "P13600", "text": ["7.  Press enter to set: PC2 DC Power Switch - ON", "7. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13610", "text": ["8.  Press enter to set: PC1 DC Power Switch - ON", "8. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on 8086 MICROPROCESSOR CIRCUIT."], "jumps": ["P2001", "P13570"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-06-99 Converted to Toolbook. frieda 08-09-99 Completed Text and Branching. frieda 08-11-99 Completed inserting Graphics. patrick 08-17-99 Test and review. debbie 08-17-99 Completed comments from debbie. patrick 08-23-99 Reviewed and changed 404 card. debbie 11-16-99 Changed comments from steve. debbie 11-18-99 Changed comments from steve. ben 06-02-00 Question format. -Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Changed Book scripted for Ctrl S to view schematic. - lisa 10-27-00 Add Monitor Pro code to quiz pages. jay 12-04-00 Added HelpPage information and new random gen. script. -Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 Checked forconvertion errors. John Ayala 06-19-02 Review - lisa 07-09-04 P2910, P13910 added eox script - patty 03-15-05 Changed Press F5 to Press Ctrl+S throughout lesson in exp. friedaaaaaaaa", "07-29-99 Converted to new question format. jay 08-06-99 Converted to Toolbook. frieda 08-09-99 Completed Text and Branching. frieda 08-11-99 Completed inserting Graphics. patrick 08-17-99 Test and review. debbie 08-17-99 Completed comments from debbie. patrick 08-23-99 Reviewed and changed 404 card. debbie 11-16-99 Changed comments from steve. debbie 11-18-99 Changed comments from steve. ben 06-02-00 Question format. -Penny 07-14-00 Converted to ToolBook 7.1 format. jay 07-21-00 Changed Book scripted for Ctrl S to view schematic. - lisa 10-27-00 Add Monitor Pro code to quiz pages. jay"], "jumps": []}, {"id": "PQINFO", "text": ["Page # let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
