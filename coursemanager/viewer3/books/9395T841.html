8<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe the internal structure of the 8086 microprocessor. w Understand the various internal components. w Understand the external connections to the 8086.", "w Demonstrate the ability to examine signal conditions of the 8086. w Demonstrate the ability to enter a program into the 8086......................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 411 XXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. Nida Model 2100 Logic Probe XXXXXXXXXXnt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": []}, {"id": "P360", "text": [], "jumps": []}, {"id": "P400", "text": ["In the previous lessons on microprocessors, you learned about basic microprocessor operation and the three basic elements found in microprocessors, the registers, the ALU, and the control section."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["In this lesson, you will study the 8086 microprocessor in detail. You will learn about the internal structure of the 8086               microprocessor, including the registers, ALU, and the control        sections.", "In this lesson, you will study the 8086 microprocessor in detail. You will learn about the internal structure of the 8086 microprocessor, including the registers, ALU, and the control sections."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["You will also learn about the input/output signals present at each pin of the 8086 IC package.  These signals are used to control the external microprocessor system elements and to transfer data between the microprocessor and the rest of the system.", "You will also learn about the input/output signals present at each pin of the 8086 IC package. These signals are used to control the external microprocessor system elements and to transfer data between the microprocessor and the rest of the system."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["After completing this lesson, you will be able to describe the structure and unique features of the 8086."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on 8086 MICROPROCESSOR CIRCUIT....................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["The 8086 is a 16 bit microprocessor. The internal registers and data buses are 16 bits wide. The external data bus of the 8086 microprocessor is also 16 bits wide."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["The 8086 has a 20 bit address bus and thus the 8086 can address up to 2    or 1M (1,048,576) bytes of memory.   However, the internal address registers of the 8086 are only 16 bits.", "The 8086 has a 20 bit address bus and thus the 8086 can address up to 2 or 1M (1,048,576) bytes of memory. However, the internal address registers of the 8086 are only 16 bits."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["For this reason, special registers known as segment registers are used. These will be covered in more detail later in this lesson."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The 8086 can also address up to 65,000 16 bit I/O ports.  Parallel ports, serial ports, keyboards, and LCDs are just a few of the        devices that can be attached to these I/O ports.", "The 8086 can also address up to 65,000 16 bit I/O ports. Parallel ports, serial ports, keyboards, and LCDs are just a few of the devices that can be attached to these I/O ports."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Sometimes more than one port address is required for a device. This is why there are so many to use."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["Basically, the 8086 is compatible with the 8088, 80286, 80386, 80486 and Pentium Processors.  All of these processors do have similarities.  The farther up the list you go, the more additions to    the basic design.", "Basically, the 8086 is compatible with the 8088, 80286, 80386, 80486 and Pentium Processors. All of these processors do have similarities. The farther up the list you go, the more additions to the basic design."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["Understanding the operation of the 8086 will allow you to understand the operation of the more complex models of this family.  Let's look at an internal block diagram of the 8086.", "Understanding the operation of the 8086 will allow you to understand the operation of the more complex models of this family. Let's look at an internal block diagram of the 8086."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The functional diagram of the 8086 is shown below.", "The functional diagram of the 8086 is shown below.........."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["You can see from the diagram that the sections of the 8086 microprocessors are connected by internal busses.   All               communications within the microprocessor are performed by the combined effort of the data and control bus.", "You can see from the diagram that the sections of the 8086 microprocessors are connected by internal busses. All communications within the microprocessor are performed by the combined effort of the data and control bus."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The address bus is primarily for addressing locations or devices external to the internal system.  The data bus of the 8086 is 16 bits wide.  This is why the 8086 is known as a 16 bit processor.", "The address bus is primarily for addressing locations or devices external to the internal system. The data bus of the 8086 is 16 bits wide. This is why the 8086 is known as a 16 bit processor."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["What is the size maximum amount of memory that can be addressed with the 8086?"], "jumps": ["P1110"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Remember that the 8086 has 20 address lines and 220 = 1 million. Each unique address can access 1 byte of RAM.  Therefore 1 million x 1 bytes = 1 Million bytes or 1 Mbyte.", "Remember that the 8086 has 20 address lines and 220 = 1 million. Each unique address can access 1 byte of RAM. Therefore 1 million x 1 bytes = 1 Million bytes or 1 Mbyte................"], "jumps": []}, {"id": "P1150", "text": ["Before we examine the sections of the 8086 in detail, let's look at a simple microprocessor instruction. The instruction is:"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["This instruction adds the 16 bit value in register BX to the 16 bit value in the accumulator (register AX) and places the result in the accumulator."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["This one operation causes many things to happen within the microprocessor. The first set of internal instructions perform a fetch of the instruction.", "This one operation causes many things to happen within the microprocessor. The first set of internal instructions perform a fetch of the instruction. phic Text)1. Fetch the instruction. a. Place the value of the Instruction Pointer register into the address buffers. b. Drive the Address Latch Enable signal high and low. c. The I/O Memory signal goes low to indicate a memory location. The buffer Enable signal goes high and the Buffer Read/Write signal goes low to indicate a read. d. Sets the Read signal low to read the first byte of the instruction. e. Increments the Instruction Pointer.", "1. Fetch the instruction. a. Place the value of the Instruction Pointer register into the address buffers. b. Drive the Address Latch Enable signal high and low. c. The I/O Memory signal goes low to indicate a memory location. The buffer Enable signal goes high and the Buffer Read/Write signal goes low to indicate a read. d. Sets the Read signal low to read the first byte of the instruction. e. Increments the Instruction Pointer."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["After the instruction has been fetched, the microprocessor has to decode the instruction to see what it is telling it to do.", "After the instruction has been fetched, the microprocessor has to decode the instruction to see what it is telling it to do. raphic Text) 2. Decode instruction. a. Moves the first byte of the instruction to the Instruction Register. b. Decode the instruction. c. Generate timing signals for the registers and the ALU...", "2. Decode instruction. a. Moves the first byte of the instruction to the Instruction Register. b. Decode the instruction. c. Generate timing signals for the registers and the ALU."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Finally, the instruction command is performed and the microprocessor performs all actions which that instruction uses.", "Finally, the instruction command is performed and the microprocessor performs all actions which that instruction uses. raphic Text) 3. Perform the addition. a. Moves the 16 bit value of the accumulator to the ALU. b. Moves the 16 bit value of the BX register to the ALU. c. Causes the ALU to add the accumulator to the BX register. d. Moves the result back to the Accumulator...", "3. Perform the addition. a. Moves the 16 bit value of the accumulator to the ALU. b. Moves the 16 bit value of the BX register to the ALU. c. Causes the ALU to add the accumulator to the BX register. d. Moves the result back to the Accumulator."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["From the example, you can see that the registers, buffers, control sections, ALU, and the internal data bus are all used to add these two numbers.  The number of internal steps depends on the instruction.  This causes the time required for fetch/execute cycles to vary from one instruction to another.", "From the example, you can see that the registers, buffers, control sections, ALU, and the internal data bus are all used to add these two numbers. The number of internal steps depends on the instruction. This causes the time required for fetch/execute cycles to vary from one instruction to another. raphic Text) Fetch the instruction. 2. Decode instruction. 3. Perform the addition.", "1. Fetch the instruction. 2. Decode instruction. 3. Perform the addition. LU. b. Moves the 16 bit value of the BX register to the ALU. c. Causes the ALU to add the accumulator to the BX register. d. Moves the result back to the Accumulator."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The operation of these elements must be coordinated by the control sections of the microprocessor. The microprocessor performs many operations for each instruction that is executed."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["In addition to the actions that were listed for the addition instruction, the microprocessor must also check the status of the interrupts, hold, reset and ready signals while executing the    instruction.", "In addition to the actions that were listed for the addition instruction, the microprocessor must also check the status of the interrupts, hold, reset and ready signals while executing the instruction."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["Now that you have an idea of what steps the microprocessor must perform for a basic instruction, let's look at the sections of the 8086 microprocessor in detail.  It is here that you will see a       breakdown of each element and how they interface with one          another.", "Now that you have an idea of what steps the microprocessor must perform for a basic instruction, let's look at the sections of the 8086 microprocessor in detail. It is here that you will see a breakdown of each element and how they interface with one another."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["Registers are where data and addresses are temporarily stored within the microprocessor.  The data in the registers can be accessed and changed much faster than data in external memory IC's.   Let's look at a brief summary of each register.", "Registers are where data and addresses are temporarily stored within the microprocessor. The data in the registers can be accessed and changed much faster than data in external memory IC's. Let's look at a brief summary of each register."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["The accumulator (AX register) is used for arithmetic, logic, load and store operations.  The accumulator can be accessed as a 16 bit register by using AX, or as two 8 bit registers as AL and AH.", "The accumulator (AX register) is used for arithmetic, logic, load and store operations. The accumulator can be accessed as a 16 bit register by using AX, or as two 8 bit registers as AL and AH."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The L and H stand for Low and High. You cannot add an 8 bit value to a 16 bit value, only 8 to 8 and 16 to 16.  If you are trying to add a  8 bit value to a 16 bit value, you must set the other 8 bits to zero and then do a 16 bit add.", "The L and H stand for Low and High. You cannot add an 8 bit value to a 16 bit value, only 8 to 8 and 16 to 16. If you are trying to add a 8 bit value to a 16 bit value, you must set the other 8 bits to zero and then do a 16 bit add."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The BX (base), CX (counter), and DX (data) registers are general purpose registers that can be used for anything.  The names given to these are normally used as a convention.", "The BX (base), CX (counter), and DX (data) registers are general purpose registers that can be used for anything. The names given to these are normally used as a convention."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["If you had a counter in a program, using the CX register for the counter data would make your code more readable, however, any of the registers can be used.   Just as with the accumulator, these registers can be read as 16 bit BX, CX, DX or 8 bit, BL, BH, CL, CH, DL and DH.", "If you had a counter in a program, using the CX register for the counter data would make your code more readable, however, any of the registers can be used. Just as with the accumulator, these registers can be read as 16 bit BX, CX, DX or 8 bit, BL, BH, CL, CH, DL and DH."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["The stack pointer (SP) is a special address register that always points to the location in memory of the top of the stack.   A stack is a block of memory where data is stored like a stack of papers. You must take papers off the stack to see what is below them.", "The stack pointer (SP) is a special address register that always points to the location in memory of the top of the stack. A stack is a block of memory where data is stored like a stack of papers. You must take papers off the stack to see what is below them."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["The base pointer (BP), source index (SI) and destination index (DI) are also address registers used for specific purposes.   The base pointer normally points to the beginning of data in memory, where the index address registers are used in manipulating strings in memory.", "The base pointer (BP), source index (SI) and destination index (DI) are also address registers used for specific purposes. The base pointer normally points to the beginning of data in memory, where the index address registers are used in manipulating strings in memory."], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["The instruction pointer always points to the memory location of the next instruction to be executed. The registers always contain a 16 bit address.   This 16 bit address is used with the segment registers to actually denote the location in external memory.", "The instruction pointer always points to the memory location of the next instruction to be executed. The registers always contain a 16 bit address. This 16 bit address is used with the segment registers to actually denote the location in external memory."], "jumps": ["P1320", "P1240"]}, {"id": "P1320", "text": ["The flag register contains 9 bits which indicate certain conditions within the system."], "jumps": ["P1330", "P1240"]}, {"id": "P1330", "text": ["The segment registers are used to indicate segments of memory. Even though the 8086 can use up to 1 Megabyte of memory, it is separated into 64 Kilobyte segments."], "jumps": ["P1340", "P1240"]}, {"id": "P1340", "text": ["This means that address registers within the 8086 can only indicate a location within 64 kilobytes.   For this reason, the segment registers contain a 16 bit value indicating the segment.", "This means that address registers within the 8086 can only indicate a location within 64 kilobytes. For this reason, the segment registers contain a 16 bit value indicating the segment."], "jumps": ["P1350", "P1240"]}, {"id": "P1350", "text": ["When the actual address is determined, the first four bits of the segment value are always zero, and the other 16 are the 16 bits in the segment register."], "jumps": ["P1360", "P1240"]}, {"id": "P1360", "text": ["Then the offset address from an address register is added to it. Address registers are the pointer, index registers and the           instruction pointer.  This results in a 20 bit address.", "Then the offset address from an address register is added to it. Address registers are the pointer, index registers and the instruction pointer. This results in a 20 bit address."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Also, not shown, are internal buffers which are used to temporarily hold data or addresses that are exchanged with the address and data buses."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["Data is transferred between registers or between a register and another section of the microprocessor on the internal data bus. The timing and control block regulates the flow of data within the microprocessor."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Which of the following is general purpose data register?", "Which of the following is general purpose data register?..."], "jumps": ["P1370"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The SP is the Stack Pointer and the IP is the instruction pointer. Both of these contain addresses and not data. They actually point to data or instructions.", "The SP is the Stack Pointer and the IP is the instruction pointer. Both of these contain addresses and not data. They actually point to data or instructions..."], "jumps": []}, {"id": "P1400", "text": ["The arithmetic/logic unit (ALU) of the 8086 microprocessor performs all arithmetic and logic operations for the system. The ALU can add, subtract, increment, decrement, AND, OR, XOR, compare, rotate and complement."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Depending on the conditions of the results, certain flags will be set in the FLAG register. These can indicate problems within an    operation.   An example would be a carry in addition.", "Depending on the conditions of the results, certain flags will be set in the FLAG register. These can indicate problems within an operation. An example would be a carry in addition."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["If the values you add result in a number larger than 16 bits can show, a carry flag is generated.  This indicates that the number     actually has an additional bit in the 17th slot.", "If the values you add result in a number larger than 16 bits can show, a carry flag is generated. This indicates that the number actually has an additional bit in the 17th slot."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["When using a 16 bit addition to add 32 bits, the second addition of the upper two words has to know about the carry."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["Other arithmetic commands are created from these basic operations.   Even multiplication and division can be done with these simple arithmetic and logic functions.", "Other arithmetic commands are created from these basic operations. Even multiplication and division can be done with these simple arithmetic and logic functions."], "jumps": ["P1450", "P1400"]}, {"id": "P1450", "text": ["The graphic below illustrates an example of an addition within the accumulator. The instruction decoder has told the ALU (via the control section) that the pending operation is an addition."], "jumps": ["P1460", "P1400"]}, {"id": "P1460", "text": ["When all of the data has been moved into place, the control register instructs the ALU to perform the operation.  The result is then placed in a location dictated by the instruction and the control section.  The FLAGS of the FLAG register are adjusted according to the result.", "When all of the data has been moved into place, the control register instructs the ALU to perform the operation. The result is then placed in a location dictated by the instruction and the control section. The FLAGS of the FLAG register are adjusted according to the result."], "jumps": ["P1470", "P1400"]}, {"id": "P1470", "text": ["The timing and control block includes the circuitry to apply the internal clock signals, process the READY, HOLD and RESET       signals, and generate the memory I/O control signals.   Each of     these signals will be examined in greater detail later in this       lesson.", "The timing and control block includes the circuitry to apply the internal clock signals, process the READY, HOLD and RESET signals, and generate the memory I/O control signals. Each of these signals will be examined in greater detail later in this lesson."], "jumps": ["P1480", "P1400"]}, {"id": "P1480", "text": ["The HLDAK and HLDRQ signals are used for something known as Direct Memory Access (DMA). This is where a device other than the microprocssor takes control of the data and address bus."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["This is for situations where high speed data transfer is needed. The other device could even be a second microprocessor in your system."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The READY signal is typically generated by slow memory and I/O devices to tell the microprocessor that the device is ready to send or receive data.   If the memory cannot supply data in the required number of clock signals, it holds the READY line LOW until the data is on the data bus.", "The READY signal is typically generated by slow memory and I/O devices to tell the microprocessor that the device is ready to send or receive data. If the memory cannot supply data in the required number of clock signals, it holds the READY line LOW until the data is on the data bus."], "jumps": ["P1510", "P1470"]}, {"id": "P1510", "text": ["This slows down overall operation of the system because the microprocessor is usually idle while the READY line is low.  This   type of memory access is known as asynchronous.", "This slows down overall operation of the system because the microprocessor is usually idle while the READY line is low. This type of memory access is known as asynchronous."], "jumps": ["P1520", "P1470"]}, {"id": "P1520", "text": ["Asynchronous means that the microprocessor is unsure how long the memory will take to be ready.  In a synchronous system, the memory is always faster than the microprocessor so the READY signal is not needed.", "Asynchronous means that the microprocessor is unsure how long the memory will take to be ready. In a synchronous system, the memory is always faster than the microprocessor so the READY signal is not needed."], "jumps": ["P1530", "P1470"]}, {"id": "P1530", "text": ["The status control signals are used to tell external circuitry what the microprocessor is doing. This section is always used in           conjunction with the control section when managing the operation of external circuits.", "The status control signals are used to tell external circuitry what the microprocessor is doing. This section is always used in conjunction with the control section when managing the operation of external circuits."], "jumps": ["P1540", "P1470"]}, {"id": "P1540", "text": ["In the next lesson you will see the importance of these signals to the proper movement of information from external devices to the  microprocessor and vice versa.", "In the next lesson you will see the importance of these signals to the proper movement of information from external devices to the microprocessor and vice versa."], "jumps": ["P1550", "P1470"]}, {"id": "P1550", "text": ["If the timing is incorrect, devices may begin conflicting with one another, generating erroneous results.   Now let's look at the         interrupt control section.", "If the timing is incorrect, devices may begin conflicting with one another, generating erroneous results. Now let's look at the interrupt control section."], "jumps": ["P1560", "P1470"]}, {"id": "P1560", "text": ["This block allows the microprocessor to stop what it is doing and service an external device, such as a keyboard."], "jumps": ["P1570", "P1470"]}, {"id": "P1570", "text": ["Without interrupts, the currently executing program would have to repeatedly check or poll each external device to ensure readiness for data transfer."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["For example, when you press a key on the keyboard of personal computer, an interrupt is generated. The computer stops executing the current program and stores the keystroke in a buffer."], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["The computer then continues execution of the program. The NIDA 8086 microprocessor card set does not use an interrupt for the keyboard.  Rather, the keyboard circuits are continually polled to see if a key has been pressed.   There are advantages and disadvantages to both methods.", "The computer then continues execution of the program. The NIDA 8086 microprocessor card set does not use an interrupt for the keyboard. Rather, the keyboard circuits are continually polled to see if a key has been pressed. There are advantages and disadvantages to both methods."], "jumps": ["P1600", "P1560"]}, {"id": "P1600", "text": ["When the microprocessor receives an interrupt, the current operation is halted.   It then executes another program to specifically deal with that interrupt.  After processing the interrupt, the microprocessor returns to the program it was executing when the interrupt occurred.", "When the microprocessor receives an interrupt, the current operation is halted. It then executes another program to specifically deal with that interrupt. After processing the interrupt, the microprocessor returns to the program it was executing when the interrupt occurred."], "jumps": ["P1610", "P1560"]}, {"id": "P1610", "text": ["When the microprocessor receives an interrupt request, the device generating the interrupt must place a value on the data bus.  This value indicates the type of interrupt requested.  There are 255 different interrupts that the 8086 can handle.", "When the microprocessor receives an interrupt request, the device generating the interrupt must place a value on the data bus. This value indicates the type of interrupt requested. There are 255 different interrupts that the 8086 can handle."], "jumps": ["P1620", "P1560"]}, {"id": "P1620", "text": ["All of these interrupts can be ignored by certain settings in the 8086.  The non-maskable interrupt (NMI) is the only one that cannot be prevented from occurring.  NMI interrupts are normally reserved for extremely important processor external conditions.", "All of these interrupts can be ignored by certain settings in the 8086. The non-maskable interrupt (NMI) is the only one that cannot be prevented from occurring. NMI interrupts are normally reserved for extremely important processor external conditions."], "jumps": ["P1630", "P1560"]}, {"id": "P1630", "text": ["When an interrupt is called, the interrupt program must do several things so the original program register settings are correct when program execution resumes. The list below indicates the minimum number of steps that must be performed by the interrupt program: Graphic Text) 1. Save the contents of any general purpose register that will be changed during the interrupt routine. 2. Service the cause of the interrupt. 3. Restore the contents of the registers. 4. Issue a RETURN instruction.w", "1. Save the contents of any general purpose register that will be changed during the interrupt routine. 2. Service the cause of the interrupt. 3. Restore the contents of the registers. 4. Issue a RETURN instruction..er. d. Moves the result back to the Accumulator."], "jumps": ["P1640", "P1560"]}, {"id": "P1640", "text": ["These steps provide for correct interrupt recovery.  If you modified registers and didn't restore them to their proper values, errors would likely exist in the main program data after you begin running it again.", "These steps provide for correct interrupt recovery. If you modified registers and didn't restore them to their proper values, errors would likely exist in the main program data after you begin running it again."], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["Now that we have looked at the internal sections, let's look at the pin-out of the 8086 microprocessor.", "The pin configuration of the 8086 is shown below. Note that address pins 0 through 15 are also the data pins.  Special circuitry will take the correct information from these pins at the proper time during operation.  Having two signals on one line is known as multiplexing.", "Now that we have looked at the internal sections, let's look at the pin-out of the 8086 microprocessor. from these pins at the proper time during operation. Having two signals on one line is known as multiplexing.", "The pin configuration of the 8086 is shown below. Note that address pins 0 through 15 are also the data pins. Special circuitry will take the correct information from these pins at the proper time during operation. Having two signals on one line is known as multiplexing.", "The signal names assigned to the pins may differ from one manufacturer to another. The functions, however, remain identical. The pin-out is representative of the NEC V30 chip used by the Nida PC130-410. *Parenthesized signal names are for the V30 in large scale applications."], "jumps": ["P1660", "P1630", "P1670", "P1650"]}, {"id": "P1670", "text": ["Pin 1 is used  for tests conducted at the factory. This pin should be held at ground potential for normal opertions.  Pin 20 is the IC's system ground.", "Pin 1 is used for tests conducted at the factory. This pin should be held at ground potential for normal opertions. Pin 20 is the IC's system ground."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["Pins 2-16 & 39 (AD0 - AD15) are the multiplexed Address/Data Bus.   In a machine cycle this bus is the address bus first, then it becomes the data bus for the remainder of the cycle.", "Pins 2-16 & 39 (AD0 - AD15) are the multiplexed Address/Data Bus. In a machine cycle this bus is the address bus first, then it becomes the data bus for the remainder of the cycle."], "jumps": ["P1690", "P1660"]}, {"id": "P1690", "text": ["Pin 17 (NMI) is the Non-Maskable Interrupt.  This input is for an interrupt which cannot be ignored by the microprocessor.  The other interrupt types can be \"masked\" out.", "Pin 17 (NMI) is the Non-Maskable Interrupt. This input is for an interrupt which cannot be ignored by the microprocessor. The other interrupt types can be \"masked\" out."], "jumps": ["P1700", "P1660"]}, {"id": "P1700", "text": ["Pin 18 (INT) is the Interrupt Request. This is a general purpose interrupt that the microprocessor can choose to ignore."], "jumps": ["P1710", "P1660"]}, {"id": "P1710", "text": ["Pin 19 (CLK) is the Clock. This pin is connected to a clock signal generating device which is set to a frequency which the               microprocessor can operate at.   In most cases, the 8284 Clock     generator is used to provide the clock signal.", "Pin 19 (CLK) is the Clock. This pin is connected to a clock signal generating device which is set to a frequency which the microprocessor can operate at. In most cases, the 8284 Clock generator is used to provide the clock signal."], "jumps": ["P1720", "P1660"]}, {"id": "P1720", "text": ["Pin 21 (RESET) is the Reset input.   When this signal is set high, the microprocessor is reset and the instruction pointer is set to zero. The RESET signal can also be provided by the 8284 Clock generator.", "Pin 21 (RESET) is the Reset input. When this signal is set high, the microprocessor is reset and the instruction pointer is set to zero. The RESET signal can also be provided by the 8284 Clock generator."], "jumps": ["P1730", "P1660"]}, {"id": "P1730", "text": ["Pin 22 (READY) is the Ready input.  If ready is high during a read or write cycle, it indicates that the memory or peripheral is ready to send or receive data, low indicates it's not ready.  This signal is also supplied by the 8284 Clock Generator.", "Pin 22 (READY) is the Ready input. If ready is high during a read or write cycle, it indicates that the memory or peripheral is ready to send or receive data, low indicates it's not ready. This signal is also supplied by the 8284 Clock Generator."], "jumps": ["P1740", "P1660"]}, {"id": "P1740", "text": ["Pin 23 is the POLL pin which is used in external synchronization with the microprocessor.", "Pin 24 (INTAK) This output is the Interrupt Acknowledge. The INTAK signal is used instead of the RD signal during the instruction cycle after an interrupt request is accepted. It indicates to the requesting device that the interrupt has been acknowledged."], "jumps": ["P1750", "P1660", "P1760"]}, {"id": "P1760", "text": ["Pin 25 (ASTB) is the Address Strobe. The address latch consists of a bank of flip-flops used to store the last input value.  The address latch stores the address from the multiplexed lines so it will be available for the rest of the cycle.  The address strobe tells the address latch it can take the information on the A/D pins.", "Pin 25 (ASTB) is the Address Strobe. The address latch consists of a bank of flip-flops used to store the last input value. The address latch stores the address from the multiplexed lines so it will be available for the rest of the cycle. The address strobe tells the address latch it can take the information on the A/D pins."], "jumps": ["P1770", "P1750"]}, {"id": "P1770", "text": ["Pin 26 (BUFEN) is the Output Buffer Enable.  A buffer is used to add power to data from the data bus to other locations in a system. The 8086 data bus does not have enough power to push the data out to external devices.  A buffer amplifies the data signals. This pin enables that buffer.", "Pin 26 (BUFEN) is the Output Buffer Enable. A buffer is used to add power to data from the data bus to other locations in a system. The 8086 data bus does not have enough power to push the data out to external devices. A buffer amplifies the data signals. This pin enables that buffer."], "jumps": ["P1780", "P1750"]}, {"id": "P1780", "text": ["Pin 27 (BUFR/W) is the Output Buffer Read/Write. Buffers can only amplify in one direction, unless a bi-directional buffer is used, also known as a transceiver. This means the direction of data flow through the buffer has to be specified by an external signal to the buffer. This signal from the microprocessor provides that signal to the buffer."], "jumps": ["P1790", "P1750"]}, {"id": "P1790", "text": ["Pin 28 (IO/M) is the Input/Output or Memory Selector.  It indicates to external devices that the microprocessor is trying to access      memory or an external I/O device.", "Pin 28 (IO/M) is the Input/Output or Memory Selector. It indicates to external devices that the microprocessor is trying to access memory or an external I/O device."], "jumps": ["P1800", "P1750"]}, {"id": "P1800", "text": ["Pin 29 (WR) is the Write Strobe.  A low level indicates the data on the data bus is to be written to the selected memory address or I/O location.", "Pin 29 (WR) is the Write Strobe. A low level indicates the data on the data bus is to be written to the selected memory address or I/O location."], "jumps": ["P1810", "P1750"]}, {"id": "P1810", "text": ["Pin 30 (HLDAK) is the Hold Acknowledge. This indicates that the microprocessor has received a hold request and will relinquish the bus in the next clock cycle."], "jumps": ["P1820", "P1750"]}, {"id": "P1820", "text": ["Pin 32 (RD) is the Read Strobe.  A low level indicates the selected memory or I/O device is to be read and that the data bus is           available for data transfer.", "Pin 31 (HLDRQ) is the Hold Request. This indicates that another device is requesting the use of the address and data buses. The address, data, RD, WR, and IO/M line are set to high impedance. This means they are theoretically not connected to the microprocessor. This allows the other device to put its signals on those lines.", "Pin 32 (RD) is the Read Strobe. A low level indicates the selected memory or I/O device is to be read and that the data bus is available for data transfer."], "jumps": ["P1830", "P1750", "P1840"]}, {"id": "P1840", "text": ["Pin 33 (S/LG) is the Minimum or Maximum Mode, also known as small and large mode.  This indicates whether an external bus control device is being used.  If so, then the bus control pins have a different purpose on the 8086 microprocessor.", "Pin 33 (S/LG) is the Minimum or Maximum Mode, also known as small and large mode. This indicates whether an external bus control device is being used. If so, then the bus control pins have a different purpose on the 8086 microprocessor."], "jumps": ["P1850", "P1830"]}, {"id": "P1850", "text": ["All pins described in this lesson are for small mode which means the internal bus controller is being used.  The 8086 has numerous functions, just not enough pins for all of them.", "All pins described in this lesson are for small mode which means the internal bus controller is being used. The 8086 has numerous functions, just not enough pins for all of them."], "jumps": ["P1860", "P1830"]}, {"id": "P1860", "text": ["Pin 34 (UBE) is the Upper Bus Enable otherwise known as the High Bus Enable."], "jumps": ["P1870", "P1830"]}, {"id": "P1870", "text": ["Pins 35-39 (A16-A20) are also for the Address Bus. The most significant 4 bits are the memory or I/O address.  If the             microprocessor was used in large mode, these pins also provide multiplexed status signals to the bus controller.  The Nida 8086     Microprocessor is not used in this way.", "Pins 35-39 (A16-A20) are also for the Address Bus. The most significant 4 bits are the memory or I/O address. If the microprocessor was used in large mode, these pins also provide multiplexed status signals to the bus controller. The Nida 8086 Microprocessor is not used in this way."], "jumps": ["P1880", "P1830"]}, {"id": "P1880", "text": ["Pin 40 (Vdd) is for Power.  The power used by the 8086 microprocessor is provided by a +5 volt supply.", "Pin 40 (Vdd) is for Power. The power used by the 8086 microprocessor is provided by a +5 volt supply."], "jumps": ["P1890", "P1830"]}, {"id": "P1890", "text": ["As you begin to learn more about the interface between the microprocessor and external circuitry, the purpose for these signals will become more apparent."], "jumps": ["P1895", "P1830"]}, {"id": "P1895", "text": ["In the experiment, you will be able to look at any of these signals and compare them with other signals in the system."], "jumps": ["P1910", "P1830"]}, {"id": "P1910", "text": ["This completes the information on 8086 OPERATION.", "This completes the information on 8086 OPERATION.LE........"], "jumps": ["P1001", "P1830"]}, {"id": "P1920", "text": ["1. The features of the 8086 microprocessor include:", "1. The features of the 8086 microprocessor include: (GRAPHIC )20 bit address length (1M memory). Multiplexed address and data lines. 16 bit data bus. RESET, READY and HLDRQ inputs. Interrupt Handling. Many arithmetic and logic instructions. Single +5V power supply.", "20 bit address length (1M memory) Multiplexed address and data lines 16 bit data bus. RESET, READY and HLDRQ inputs Interrupt Handling Many arithmetic and logic instructions Single +5V power supply."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The actions that the microprocessor performs must be                    executed at specific times to ensure proper operation of the           microprocessor.", "2. The actions that the microprocessor performs must be executed at specific times to ensure proper operation of the microprocessor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Instructions are decoded by the 8086 microprocessor into              one or more machine cycles that are executed sequentially.", "3. Instructions are decoded by the 8086 microprocessor into one or more machine cycles that are executed sequentially."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["In this lesson so far, you have learned about the 8086 microprocessor, its internal functions, and connections available outside the microprocessor.", "Using the Nida 8086 Card set, you will be able to observe some of the signals which are used externally to the microprocessor. The main Nida PC card of interest is the PC130-410 8086 Microprocessor Card.", "The PC130-410 card contains an 8086 microprocessor, address latches, data buffers, and a clock generator chip. The rest of the components are resistors, capacitors, a switch, and a crystal.", "The PC130-410 card contains an 8086 microprocessor, address latches, data buffers, and a clock generator chip. The rest of the components are resistors, capacitors, a switch, and a crystal. raphic Text) 410. 8086 Microprocessor. NIDA Corp..."], "jumps": ["P2050", "P2001", "P2060", "P2040", "P2070"]}, {"id": "P2070", "text": ["There are also a multitude of test points for testing the signals in the system.  The 50 pin connector is used to apply signals to the  other devices of the system.", "There are also a multitude of test points for testing the signals in the system. The 50 pin connector is used to apply signals to the other devices of the system."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Note that the INTR test point is connected to ground by a 10k resistor. This means this input is normally grounded, but a HIGH signal can be sent to the microprocessor by connecting the test point to +5V.", "Since the keyboard is required for the basic operation of the 8086 microprocessor system, let's look at how the keyboard works.", "Note that the INTR test point is connected to ground by a 10k resistor. This means this input is normally grounded, but a HIGH signal can be sent to the microprocessor by connecting the test point to +5V. (Graphic Text) To view the 8086 Microprocessor schematic throughout experiment press F2.", "To view the 8086 Microprocessor schematic throughout experiment press Ctrl S."], "jumps": ["P2090", "P2060", "P2100", "P2080"]}, {"id": "P2100", "text": ["The keyboard contains 32 keys.  Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function.  The keys that will be used in the experiment are described below.", "The keyboard contains 32 keys. Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function. The keys that will be used in the experiment are described below.", "0 - F Edit Run Enter Stop ^ < Display R.M.", "These keys are used for entering hexadecimal numbers. Data and addressed are entered using these keys. This key is used to edit data in RAM. When you press this key, the LCD will show \"EDIT ADD:_\" the system is now waiting for you to enter a segment and offset. An example would be \"553:53\". The segment is 0553 and the offset is 0053. This key is used to run a program in RAM or ROM. When you press this key, the LCD will show \"RUN ADD:_ \". The system is now waiting for you to enter a segment:offset to the program. This key is used to inform a current program that you have finished entering information for a particular task. This key is used when you finish entering data into RAM or want to exit a program. After pressing stop, the display will return to the \"Nida Corporation Intel 8086 Vx.x\" message. Used in the editing to move backwards through the memory. Used in the editing to move forwards through the memory. Used to erase the last character entered. When pressed once, this key will display locations in memory. When pressed a second time, it displays the current register values stored within the microprocessor........"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The purpose of this experiment is to examine various microprocessor signals on the PC130-410 experiment card."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["By looking at these signals, you can begin to understand the importance of timing and the purpose of each signal."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["u have the schematic for the PC130-410 8086 Microprocessor available during measurements by pressing Ctrl.", "Remember, you have the schematic for the PC130-410 8086 Microprocessor available during measurements by pressing Ctrl+S."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["1. Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings..........."], "jumps": ["P2140"]}, {"id": "P2160", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P2150"]}, {"id": "P2170", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.  Note            that the PC130-404 card has its own chassis.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions. Note that the PC130-404 card has its own chassis. i"], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["4. Connect the four experiment cards with the flat ribbon cables as follows: A. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. B. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. C. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1. connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["5.  Set the Positive Supply Control to 5.  The Voltmeter on the              130A should indicate 5 Volts.", "5. Set the Positive Supply Control to 5. The Voltmeter on the 130A should indicate 5 Volts."], "jumps": ["P2180"]}, {"id": "P2200", "text": ["6.  Set the PC3 DC Switch to ON.", "6. Set the PC3 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2190"]}, {"id": "P2210", "text": ["First, you will measure some of the basic signals present at the pins of the 8086 microprocessor and observe the operation of the RESET and HOLD functions.", "9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements.ts.", "First, you will measure some of the basic signals present at the pins of the 8086 microprocessor and observe the operation of the RESET and HOLD functions. phic Text) NOTE Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points.", "Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points. e experiment, you short some of the IC pins together while observing the signals, press the rest button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements...nts."], "jumps": ["P2220", "P2610", "P2230", "P2210"]}, {"id": "P2230", "text": ["10.  Press the reset button.  Using the oscilloscope, measure the         voltage levels present at the following pins and enter them in         the provided spaces (HIGH, LOW):\n       To see the 8086 Microprocessor schematic press Ctrl+S.", "10. Press the reset button. Using the oscilloscope, measure the voltage levels present at the following pins and enter them in the provided spaces (HIGH, LOW): To see the 8086 Microprocessor schematic press Ctrl+S.key...", "Pin Name Conditionnn", "40 VDDme Condition", "20 GNDme Condition", "22 READYe Condition", "21 RESETe Condition", "31 HLDRQe Condition", "30 HLDAKK Condition"], "jumps": ["P2220"]}, {"id": "P2233", "text": ["Your answers are still incorrect.  You should have answered HIGH, LOW, HIGH, LOW, LOW, LOW.", "Your answers are still incorrect. You should have answered HIGH, LOW, HIGH, LOW, LOW, LOW."], "jumps": ["P2240", "P2230"]}, {"id": "P2240", "text": ["The Vdd pin was high; the GND pin, low.   A high on the ready line indicates that all asynchronous devices are not busy.   Hold Request and Hold Acknowledge were both low because nothing was trying to take control of the system busses.", "The Vdd pin was high; the GND pin, low. A high on the ready line indicates that all asynchronous devices are not busy. Hold Request and Hold Acknowledge were both low because nothing was trying to take control of the system busses.", "Pin Name Conditionnnnnnnnnnnnn", "40 VDD HighhhhhhhhhhhhHHHH", "20 GND Lowwwwwwwwwwwwn", "22 READY Highhhhhhhhhhhhtion", "21 RESET Lowwwwwwwwwwwwhhhh", "31 HLDRQ Lowwwwwwwwwwwwwtion", "30 HLDAK Low ion"], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["11.  Next, lets look at the clock signals. Using the oscilloscope,             measure the frequency at the clock input of (CLK) pin 19.                To see the 8086 Microprocessor schematic press Ctrl+S.", "11. Next, lets look at the clock signals. Using the oscilloscope, measure the frequency at the clock input of (CLK) pin 19. To see the 8086 Microprocessor schematic press Ctrl+S.key."], "jumps": ["P2240", "P2262"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Ensure you have your oscilloscope lead on the correct test point.", "Ensure you have your oscilloscope lead on the correct test point........."], "jumps": []}, {"id": "P2267", "text": ["The correct answer should of been 2.4 MHz.", "The correct answer should of been 2.4 MHz.d have measured 5.0mA."], "jumps": ["P2270", "P2260"]}, {"id": "P2270", "text": ["12. Now let's see what happens when the RESET button is pressed on the PC130-410 experiment card. Using your logic probe, measure the RESET pin of the 8086 microprocessor according to the following chart and fill in your answers (HIGH, LOW): To see the 8086 Microprocessor schematic press Ctrl+S.key."], "jumps": ["P2260", "PIN"]}, {"id": "P2273", "text": ["Your answers are still incorrect.  Your answers should have been LOW, HIGH, and LOW.", "Your answers are still incorrect. Your answers should have been LOW, HIGH, and LOW."], "jumps": ["P2280", "P2270"]}, {"id": "P2280", "text": ["Remember, when the RESET signal is applied to the microprocessor, it instructs the internal instruction pointer to start back at the beginning.   It then receives a jump command that leads the instruction pointer to the Nida monitor program.", "Remember, when the RESET signal is applied to the microprocessor, it instructs the internal instruction pointer to start back at the beginning. It then receives a jump command that leads the instruction pointer to the Nida monitor program."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["Next we will examine the HLDRQ input, or Hold Request.   First we need to have a program running that will allow us to observe the effects of this signal.", "Next we will examine the HLDRQ input, or Hold Request. First we need to have a program running that will allow us to observe the effects of this signal."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["13. Press RESET on the PC130-410 Card. Next, press 0 for the internal program menu on the PC130-404 Keyboard and Display Unit. Use the down arrow (v) on the keyboard to select the second screen of options. You should see \"4- Demo 1\". Select this program by pressing 4 on the keyboard."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["14.  A Nida demo and LEDs on the I/O card should be changing.          Now connect the oscilloscope to the HLDAK pin of the 8086          microprocessor.  Using the Alligator to Alligator jumper,                   connect the +5V test point to the HLDRQ pin.  Remove and             reconnect the jumper to observe the effects.", "14. A Nida demo and LEDs on the I/O card should be changing. Now connect the oscilloscope to the HLDAK pin of the 8086 microprocessor. Using the Alligator to Alligator jumper, connect the +5V test point to the HLDRQ pin. Remove and reconnect the jumper to observe the effects."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Notice that when the signal is applied, the HLDAK pin supplies a 5 Volts \"1\" to indicate it acknowledges the request and is allowing some other device to use the bus."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["You can see that the processor stopped from the display of the Nida Demo program.  Once you remove the request, the acknowledge goes away and the program begins right where it left off.", "You can see that the processor stopped from the display of the Nida Demo program. Once you remove the request, the acknowledge goes away and the program begins right where it left off."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["In other words, you requested control of the busses.  The computer acknowledged and gave control to you. The microprocessor address, control and data lines went to high impedance effectively removing them from the external busses.", "In other words, you requested control of the busses. The computer acknowledged and gave control to you. The microprocessor address, control and data lines went to high impedance effectively removing them from the external busses."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["Now that we have looked at some of the signals on the 8086 microprocessor, let's look at the operation of the ALU."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["In this portion of the experiment, you will use the microprocessor to add two numbers as an illustration of the arithmetic capabilities of the 8086 microprocessor."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["15.   Press the RESET button on the PC130-410 card.  You will be         entering a program into memory for execution by the                        microprocessor.", "15. Press the RESET button on the PC130-410 card. You will be entering a program into memory for execution by the microprocessor."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["Entering programs into memory of the 8086 uses the EDIT function of the Monitor Program.  Once you have pressed EDIT, you will be asked to enter an address.", "Entering programs into memory of the 8086 uses the EDIT function of the Monitor Program. Once you have pressed EDIT, you will be asked to enter an address."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["There are two ways to enter an address, just a segment or a segment with an offset.   For example, 2000: and 2000:0 or 2000:0000 are all the same location.   In this experiment we will start our program at segment 2000, with an offset of zero.", "There are two ways to enter an address, just a segment or a segment with an offset. For example, 2000: and 2000:0 or 2000:0000 are all the same location. In this experiment we will start our program at segment 2000, with an offset of zero."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["After you enter a value like \"2000:\", the code editor program will begin.  The top part of the screen will show the segment you are in.  The bottom part of the screen will show the current offset and the 8 bit value stored at that offset.", "After you enter a value like \"2000:\", the code editor program will begin. The top part of the screen will show the segment you are in. The bottom part of the screen will show the current offset and the 8 bit value stored at that offset."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["There are three things you can do at any offset and any segment. Enter a new value and press enter, press the down arrow to move to the next offset, or use the up arrow to move to the previous offset."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["Every time you enter a value and press enter, you will automatically move to the next offset. If, at anytime, you press enter without entering data, zeros will be loaded at that memory location."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["Remember to use the up and down arrows for movement through your code.  When a program is shown to you, you will be given an address, opcodes, mnemonic and a description.", "Remember to use the up and down arrows for movement through your code. When a program is shown to you, you will be given an address, opcodes, mnemonic and a description."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["You start at the first address given and enter each opcode consecutively into memory until you are finished entering the        program.  The mnemonic is what an assembler program would use to generate the opcodes for a program.", "You start at the first address given and enter each opcode consecutively into memory until you are finished entering the program. The mnemonic is what an assembler program would use to generate the opcodes for a program."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["Once you are finished entering your program, press STOP.  To verify that your program is loaded, press the DISPLAY R.M. key and enter the starting address of the program.", "Once you are finished entering your program, press STOP. To verify that your program is loaded, press the DISPLAY R.M. key and enter the starting address of the program."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["After you press ENTER, all the opcodes for the location and the next 17 locations will be shown.  Again, use the up and down arrows to move through memory.", "After you press ENTER, all the opcodes for the location and the next 17 locations will be shown. Again, use the up and down arrows to move through memory. TEXT) NOTE Segments start every 16 kbytes of memory, and an offset can be up to 64 kbytes of memory. This means that segments overlap one another. For this reasons, an offset of zero in segment 2000 \"2000:0\" is the same location as offset 2000 in segment 0 \"0:2000\". Certain routines in the Nida monitor program will determine the smallest segment and then the offset.", "Segments start every 16 kbytes of memory, and an offset can be up to 64 kbytes of memory. This means that segments overlap one another. For this reasons, an offset of zero in segment 2000 \"2000:0\" is the same location as offset 2000 in segment 0 \"0:2000\". Certain routines in the Nida monitor program will determine the smallest segment and then the offset. you must reenter the program and then run the program before proceeding with your measurements...nts."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["MOV AX, 0Ah MOV BX, 05h ADD AX,BX INT 1Ch", "Moves the value 0Ah into the AX register Moves the value 05h into the BX register Adds the value of AX and BX and stores in the AX register. Calls a monitor program routine which displays the internal register value.", "16. Enter the following program into memory starting at \"2000:0\" using the following procedure: EDIT, 2000:0 ENTER, enter opcode values with an ENTER after each, and then press stop. Remember, everytime you enter an opcode value and press ENTER, you will automatically move to the next offset....."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["17.  Run the program you just entered.  This is done by pressing          the RUN key and entering the starting address of the                        program: 2000:, 2000:0 or 2000:0000.   Remember, all of                  these are equivalent locations.", "17. Run the program you just entered. This is done by pressing the RUN key and entering the starting address of the program: 2000:, 2000:0 or 2000:0000. Remember, all of these are equivalent locations."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["What are the values of the following registers?", "What are the values of the following registers?ric answers (1a, 2a, 3a, 4a).....).)........"], "jumps": ["P2480"]}, {"id": "P2493", "text": ["Your answers are still incorrect.  You should have answered 000F and 0005.", "Your answers are still incorrect. You should have answered 000F and 0005."], "jumps": ["PutVar"]}, {"id": "P2500", "text": ["Remember, the values of 000A and 0005 were placed into AX and BX. Then, the microprocessor added them together and stored the result in AX. This replaced any previously value stored there."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["That is why the result of 000A + 0005 = 000F is stored in AX and one of the original values, 0005, remained in the BX register. Notice that the first byte is the lower byte and the second is the higher byte."], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["In other words, BL is shown first and then BH. When determining values from the registers, especially 16 bit, you must remember which is the most significant byte when converting."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["In the next lesson we will look at the circuits external to the 8086 microprocessor.  You will observe the control and status signals of the 8086 since they dictate the operation of the external circuits.", "In the next lesson we will look at the circuits external to the 8086 microprocessor. You will observe the control and status signals of the 8086 since they dictate the operation of the external circuits."], "jumps": ["P2540", "P2520"]}, {"id": "P2540", "text": ["1.  Disconnect the oscilloscope and logic probe from the                      experiment cards.", "1. Disconnect the oscilloscope and logic probe from the experiment cards...."], "jumps": ["P2550", "P2530"]}, {"id": "P2550", "text": ["2.  Return the Test Console to the initial control settings.", "2. Return the Test Console to the initial control settings................"], "jumps": ["P2540"]}, {"id": "P2560", "text": ["3.  Set the Console Power Switch to OFF.", "3. Set the Console Power Switch to OFF...................."], "jumps": ["P2550"]}, {"id": "P2570", "text": ["4.  Disconnect the equipment and return to the designated area.", "4. Disconnect the equipment and return to the designated area.."], "jumps": ["P2910", "P2560"]}, {"id": "P2600", "text": ["7.  Set the PC2 DC Switch to ON.", "7. Set the PC2 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2200"]}, {"id": "P2610", "text": ["8.  Set the PC1 DC Switch to ON.", "8. Set the PC1 DC Switch to ON.ntrol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2600"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2801", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on 8086 MICROPROCESSOR CIRCUIT."], "jumps": ["P2001", "P2570"]}, {"id": "P5000", "text": [], "jumps": []}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P5002", "text": [], "jumps": []}, {"id": "P5003", "text": [], "jumps": []}, {"id": "P5004", "text": [], "jumps": []}, {"id": "P5005", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What are the four basic sections of the 8086 microprocessor?", "Register Control, ALU, Timing and Interrupt Register", "ALU, Timing and Control, Internal Registers and Interrupt Control"], "jumps": []}, {"id": "P10211", "text": ["Which of the following would be a function of the ALU?"], "jumps": []}, {"id": "P10212", "text": [], "jumps": []}, {"id": "P10213", "text": [], "jumps": []}, {"id": "P10214", "text": ["HOLDAK and HOLDREQ can be used _______ __"], "jumps": []}, {"id": "P10215", "text": ["What is the purpose of the RESET function?", "To temporarily interrupt the microprocessor. y", "To temporarily interrupt the currently running program."], "jumps": []}, {"id": "P10216", "text": [], "jumps": []}, {"id": "P10217", "text": ["What is the purpose of the HOLD function?", "To allow the bus to be controlled by another device.", "To interrupt the currently running program."], "jumps": []}, {"id": "P10218", "text": ["What voltage is required to power the 8086 Microprocessor?"], "jumps": []}, {"id": "P10219", "text": ["To allow the bus to be controlled by another device. x", "To interrupt the currently running program."], "jumps": []}, {"id": "P10220", "text": ["generated from outside the microprocessor."], "jumps": []}, {"id": "P10221", "text": ["is an interrupt that appears hidden but is processed.", "is one interrupt that was supposed to really be another.", "is one that will be ignored by the microprocessor. A"], "jumps": []}, {"id": "P10222", "text": ["The instruction pointer (IP) contains the _______", "number of keys that have been pressed. d.", "number of programs that have been executed. d.", "address of the next instruction to be executed. d."], "jumps": []}, {"id": "P10223", "text": ["The 8086 contains _______ he following _______"], "jumps": []}, {"id": "P10224", "text": ["Data is transferred between registers via the _______"], "jumps": []}, {"id": "P10225", "text": ["The signals ALE, WR, RD are generated by the _______"], "jumps": []}, {"id": "P10226", "text": [], "jumps": []}, {"id": "P10227", "text": ["Conditions about the Microprocessors operation are stored in the _______"], "jumps": []}, {"id": "P10228", "text": ["a term used to identify the internal registers."], "jumps": []}, {"id": "P10229", "text": [], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 40%. Do you want to _________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13040", "text": ["In this lesson so far, you have learned about the 8086 microprocessor, its internal functions, and connections available outside the microprocessor.", "Using the Nida 8086 Card set, you will be able to observe some of the signals which are used externally to the microprocessor. The main Nida PC card of interest is the PC130-410 8086 Microprocessor Card.", "The PC130-410 card contains an 8086 microprocessor, address latches, data buffers, and a clock generator chip. The rest of the components are resistors, capacitors, a switch, and a crystal."], "jumps": ["P13050", "P2001", "P13060", "P13040", "P13070"]}, {"id": "P13070", "text": ["There are also a multitude of test points for testing the signals in the system.  The 50 pin connector is used to apply signals to the  other devices of the system.", "There are also a multitude of test points for testing the signals in the system. The 50 pin connector is used to apply signals to the other devices of the system."], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["Note that the INTR test point is connected to ground by a 10k resistor. This means this input is normally grounded, but a HIGH  signal can be sent to the microprocessor by connecting the test   point to +5V.", "Since the keyboard is required for the basic operation of the 8086 microprocessor system, let's look at how the keyboard works.", "Note that the INTR test point is connected to ground by a 10k resistor. This means this input is normally grounded, but a HIGH signal can be sent to the microprocessor by connecting the test point to +5V. ..(GraphicText)To view the 8086 Microprocessor schematic throughout experiment press F2.", "To view the 8086 Microprocessor schematic throughout experiment press Ctrl S."], "jumps": ["P13090", "P13060", "P13100", "P13080"]}, {"id": "P13100", "text": ["The keyboard contains 32 keys. Each of the keys has its function(s) screened on the key surface.   Some keys are used for more than one function.  The keys that will be used in the experiment are described below.", "The keyboard contains 32 keys. Each of the keys has its function(s) screened on the key surface. Some keys are used for more than one function. The keys that will be used in the experiment are described below.", "0 - F Edit Run Enter Stop ^ < Display R.M.", "These keys are used for entering hexadecimal numbers. Data and addressed are entered using these keys. This key is used to edit data in RAM. When you press this key, the LCD will show \"EDIT ADD:_\" the system is now waiting for you to enter a segment and offset. An example would be \"553:53\". The segment is 0553 and the offset is 0053. This key is used to run a program in RAM or ROM. When you press this key, the LCD will show \"RUN ADD:_ \". The system is now waiting for you to enter a segment:offset to the program. This key is used to inform a current program that you have finished entering information for a particular task. This key is used when you finish entering data into RAM or want to exit a program. After pressing stop, the display will return to the \"Nida Corporation Intel 8086 Vx.x\" message. Used in the editing to move backwards through the memory. Used in the editing to move forwards through the memory. Used to erase the last character entered. When pressed once, this key will display locations in memory. When pressed a second time, it displays the current register values stored within the microprocessor........"], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["The purpose of this experiment is to examine various microprocessor signals on the PC130-410 experiment card."], "jumps": ["P13120", "P13100"]}, {"id": "P13120", "text": ["By looking at these signals, you can begin to understand the importance of timing and the purpose of each signal."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["Remember, you have the schematic for the PC130-410 8086 Microprocessor available during measurements by pressing \nCt.", "Remember, you have the schematic for the PC130-410 8086 Microprocessor available during measurements by pressing Ct.", "Remember, you have the schematic for the PC130-410 8086 Microprocessor available during measurements by pressing Ctrl+S."], "jumps": ["P13140", "P13110"]}, {"id": "P13140", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P13150", "P13110"]}, {"id": "P13150", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13140"]}, {"id": "P13160", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-410 8086 Microprocessor card in the PC1 position. b. Insert PC130-411 8086 Decoder/Memory card in the PC2 position. c. Insert PC130-401 I/O card in the PC3 position."], "jumps": ["P13170"]}, {"id": "P13170", "text": ["3.  Place the PC130-404 Keyboard and Display card in front of            the test console between the PC2 and PC3 positions.  Note            that the PC130-404 card has its own chassis.", "3. Place the PC130-404 Keyboard and Display card in front of the test console between the PC2 and PC3 positions. Note that the PC130-404 card has its own chassis. i"], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["4. Connect the four experiment cards with the flat ribbon cables as follows: A. Using the 50 pin ribbon cable, connect PC130-410 J1 to PC130-411 J1. B. Using the short 20 pin ribbon cable, connect PC130-411 J2 to PC130-401 J1. C. Using the long 20 pin ribbon cable, connect PC130-401 J2 to PC130-404 J1. connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2.", "The Ribbon Cables must be installed in the proper orientation. Note that each cable has a red stripe on one side. This stripe indicates pin 1. On the Experiment Cards, the numeral 1 or 2 indicates the end of the connector with the 1 pin. Attach the cables to the connectors such that the red stripe is at the end of the connector with the numeral 1 or 2..", "CAUTION -400 card has its own chassis."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["5.  Press enter to set: Positive Supply Voltage -  5", "5. Press enter to set: Positive Supply Voltage - 5......................."], "jumps": ["P13180"]}, {"id": "P13200", "text": ["6.  Press enter to set: PC3 DC Power Switch - ON", "6. Press enter to set: PC3 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13210", "text": ["First, you will measure some of the basic signals present at the pins of the 8086 microprocessor and observe the operation of the RESET and HOLD functions.", "9. The microprocessor system is now assembled and operating. You should see the message \"NIDA Corporation Intel 8086 Vx.x NIDA:\" in the LCD display on the PC130-404 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R1 on the PC130-404 card using a small screwdriver. If you still cannot see the message, see your instructor for assistance.", "The \"Vx.x\" in the display of the LCD indicates the version of the monitor program you are using. This experiment is written for all versions of the monitor program. If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements..", "First, you will measure some of the basic signals present at the pins of the 8086 microprocessor and observe the operation of the RESET and HOLD functions. phic Text) NOTE Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points.", "Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. Almost all of the pins have test points. e experiment, you short some of the IC pins together while observing the signals, press the rest button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run the program before proceeding with your measurements...nts."], "jumps": ["P13220", "P13210", "P13230"]}, {"id": "P13230", "text": ["10.  Press the reset button.  Using the oscilloscope, measure the         voltage levels present at the following pins and enter them in         the provided spaces (HIGH, LOW):\n       To see the 8086 Microprocessor schematic press Ctrl+S.", "Pin Name Conditionnn", "40 VDDme Condition", "20 GNDme Condition", "22 READYe Condition", "21 RESETe Condition", "31 HLDRQe Condition", "30 HLDAKK Condition", "10. Press the reset button. Using the oscilloscope, measure the voltage levels present at the following pins and enter them in the provided spaces (HIGH, LOW): To see the 8086 Microprocessor schematic press Ctrl+S.key..."], "jumps": ["P13220"]}, {"id": "P13233", "text": ["Your answers are still incorrect.  You should have answered HIGH, LOW, HIGH, LOW, LOW, LOW.", "Your answers are still incorrect. You should have answered HIGH, LOW, HIGH, LOW, LOW, LOW."], "jumps": ["P13240", "P13230"]}, {"id": "P13240", "text": ["The Vdd pin was high; the GND pin, low.   A high on the ready line indicates that all asynchronous devices are not busy.   Hold Request and Hold Acknowledge were both low because nothing was trying to take control of the system busses.", "The Vdd pin was high; the GND pin, low. A high on the ready line indicates that all asynchronous devices are not busy. Hold Request and Hol
