LLEY HEATERS, GALLEY LTS, NAV COMP, GPS, COMPASS, COM SYS, RADIOS - Off"], "jumps": []}, {"id": "P3584", "text": ["Move all switches on the experiment cards to the ON position. Move all switches on the experiment cards to the Off position. e Off position. $Back: P3290", "On PC130-742 the ON position is to the right.", "NOTEEEC130-742 the ON position is to the right."], "jumps": []}, {"id": "P3590", "text": ["Did your Operational Check show that the #1 Start System is faulty?"], "jumps": ["P3582"]}, {"id": "P3591", "text": [], "jumps": []}, {"id": "P3592", "text": ["The pilot stated that the #1 Eng Start, #1 Engine Start and Fuel Pump was faulty. That appears to be true. Contact your instructor if those LED's are still lit.", "Now that you have verified the fault, you need to isolate it. Compare the circuit operation to the block diagram."], "jumps": ["P3610", "P3590"]}, {"id": "P3610", "text": ["Isolate the Engine Start systems on the diagram."], "jumps": ["P3600", "P3620"]}, {"id": "P3620", "text": ["Notice that the #2 Engine is still operating. Since both start systems receive input from the Start Bus, we can conclude that the Start Bus is operating correctly."], "jumps": ["P3600", "P3630"]}, {"id": "P3630", "text": ["The #1 Starter and Fuel Pump are both inoperative. They require input from the #1 ENG START system.........."], "jumps": ["P3600", "P3640"]}, {"id": "P3640", "text": ["We have isolated the fault to the #1 ENG START system."], "jumps": ["P3600", "P3650"]}, {"id": "P3650", "text": ["Once isolated, we must now fix the fault. Press Enter to reset the system to proper operating condition."], "jumps": ["P3600", "P"]}, {"id": "P3660", "text": ["Verify the repair by completing an Operational Check."], "jumps": ["P3670"]}, {"id": "P3670", "text": ["Switch the #1 GEN and #2 GEN switches to OFF. Press Enter to remove AC Power from the PC cards."], "jumps": ["P3650"]}, {"id": "P3680", "text": ["Clear the fault by completing the proper paperwork. in this case, press the enter key..ow. 130E and TD2000 inital control setting script is on the next button of this page.........."], "jumps": []}, {"id": "P3690", "text": ["1. Return test console to initial control settings.tings.................."], "jumps": []}, {"id": "P3700", "text": ["2. Disconnect test equipment from circuit cards. 3. Remove the circuit cards from the test console. 4. Test Console Power Off. 19. Remove the red and black test leads from the circuit and turn off test equipment."], "jumps": []}, {"id": "P3710", "text": ["5. Return test equipment to designated storage area. C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3700"]}, {"id": "P3720", "text": ["That really is all there is to troubleshooting! With a little practice, you will be troubleshooting like a pro. Next, you will practice some additional scenarios by going to the Experiment menu and selecting the Exercise. Good Luck!ct the Exercise. Good Luck!!"], "jumps": ["P3910", "P3710"]}, {"id": "P3910", "text": ["This completes the experiment on PRACTICAL FAULT FINDING..."], "jumps": ["P3720", "P3001"]}, {"id": "P4020", "text": ["This fault isolation practice is designed to challenge your knowledge of the troubleshooting process and help you develop a logical approach to fault isolation."], "jumps": ["P3001"]}, {"id": "P4030", "text": ["Use the Troubleshooting Flow Chart, Operational Check sheet, and Block diagram tools to logically isolate the fault. The troubleshooting tools can be accessed by clicking on the appropriate button..."], "jumps": ["P4020"]}, {"id": "P4040", "text": ["1. Set the Test Console to the initial control settings..................."], "jumps": ["P4030"]}, {"id": "P4050", "text": ["2. Carefully plug PC130-740 in PC1, PC130-741 in PC2 and PC130-742 in PC3 positions of the test console. Speaker switch to ON........................................."], "jumps": ["P4040"]}, {"id": "P4060", "text": ["3. Press Enter to set: PC1 AC Power - ON AC Power - ON"], "jumps": ["P4050"]}, {"id": "P4070", "text": ["Perform an Operational Check to ensure the Systems are functioning properly.functioning properly.ning properly."], "jumps": []}, {"id": "P4080", "text": ["Was the Operational Check successful?......................"], "jumps": ["P4070"]}, {"id": "P4081", "text": [], "jumps": []}, {"id": "P4082", "text": ["Contact your instructor for assistance....................."], "jumps": []}, {"id": "P4090", "text": ["You are now ready to begin the isolation fault practice...."], "jumps": ["P4080", "P"]}, {"id": "P4092", "text": ["Remember to set all the switches on the circuit cards to ON (right) when checking the circuits."], "jumps": ["P4090"]}, {"id": "P4130", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4131", "text": [], "jumps": []}, {"id": "P4132", "text": ["The #1 ESS BUS, NON ESS BUS, #1 ESS BUS systems are all working properly. The #1 MAIN BUS cannot be the problem.."], "jumps": []}, {"id": "P4133", "text": ["The START BUS does not affect the EMERG BAT BUS. The EMERG BAT BUS receives its inputs from the #1 and #2 MAIN BUS systems.8"], "jumps": []}, {"id": "P4134", "text": ["Although both main bus failures would cause the EMERG BAT BUS system to operate, both the #1 and #2 MAIN BUS systems are operating correctly. This is verified by the #1 and #2 ESS BUS and the NON ESS BUS systems operating normally."], "jumps": []}, {"id": "P4135", "text": ["CONGRATULATIONS!! You have successfully checked this circuit and determined the cause of the fault."], "jumps": []}, {"id": "P4140", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4141", "text": [], "jumps": []}, {"id": "P4142", "text": ["The #1 ESS BUS is not faulty. The #1 ESS BUS also provides input to the interior lights and #1 inverter. Both of these systems and their subsystems are operating."], "jumps": []}, {"id": "P4143", "text": ["The EXT LTS switch is not faulty. It also provides input to the LANDING LTS system, which is still operating."], "jumps": []}, {"id": "P4144", "text": ["The LIGHTING System is part of the interior lighting circuit which is functioning correctly.:"], "jumps": []}, {"id": "P4145", "text": ["CONGRATULATIONS!! You have successfully checked this circuit and determined the cause of the fault."], "jumps": []}, {"id": "P4150", "text": ["L. CABIN LTS and R. CABIN LTS systems failure", "What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4151", "text": [], "jumps": []}, {"id": "P4152", "text": ["The EXT LTS and #1 INV systems are receiving an input from the #1 ESS BUS and are working properly. The #1 ESS BUS cannot be the problem."], "jumps": []}, {"id": "P4153", "text": ["The L. CABIN LTS and R. CABIN LTS receive their input from the COCKPIT LTS which is also not working. Continue to work back through the block diagram to see where the COCKPIT LTS receives its input."], "jumps": []}, {"id": "P4154", "text": ["Look at your block diagram closely. The NON ESS BUS system is does not provide input to the INT LTS system."], "jumps": []}, {"id": "P4155", "text": ["CONGRATULATIONS!! You have successfully checked this circuit and determined the cause of the fault."], "jumps": []}, {"id": "P4160", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4161", "text": [], "jumps": []}, {"id": "P4162", "text": ["The #2 ESS BUS system is working properly as evident by the #2 INV and COMMS systems operating."], "jumps": []}, {"id": "P4163", "text": ["The COMPASS and GPS systems are not working, however, check the block diagram to determine where they get their input. As you can see, that system is not correctly providing inputs to the COMPASS and GPS systems."], "jumps": []}, {"id": "P4164", "text": ["If either the COMPASS system or GPS system was receiving an input signal, they both should be working. Check where they get their inputs."], "jumps": []}, {"id": "P4165", "text": ["CONGRATULATIONS!! You have successfully checked this circuit and determined the cause of the fault."], "jumps": []}, {"id": "P4170", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4171", "text": [], "jumps": []}, {"id": "P4172", "text": ["Switch the #1 INV off and observe the FLT INST LTS extinguish. Since the FLT INST LTS will operate if either inverter is functioning, the # 2 INV must not be working. Switch the #1 INV back on and observe the FLT INST LTS operate."], "jumps": []}, {"id": "P4173", "text": ["Even though the #2 ESS BUS does provide input to the #2 INV, it is operating correctly because the NAVIGATION and COMMS systems are functioning."], "jumps": []}, {"id": "P4174", "text": ["If the J1 Connector had failed, the NAVIGATION and COMMS systems would also be inoperative. Since both of those systems are working, we can conclude that the J1 connector is good."], "jumps": []}, {"id": "P4175", "text": ["CONGRATULATIONS!! You have successfully checked this circuit and determined the cause of the fault."], "jumps": []}, {"id": "P4180", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4181", "text": [], "jumps": []}, {"id": "P4182", "text": ["The #2 MAIN BUS is working. Notice that the NON ESS BUS is active."], "jumps": []}, {"id": "P4183", "text": ["The NON ESS BUS is working since the galley and entertainment systems are working...nce it depends on an input that it is not getting, replacing this system would not clear the fault. Check further."], "jumps": []}, {"id": "P4184", "text": ["The #2 INVERTER is not working, however, replacing it would not fix the problem. Check the block diagram for the #2 INVERTER's input.BUS."], "jumps": []}, {"id": "P4185", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4190", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4191", "text": [], "jumps": []}, {"id": "P4192", "text": ["The NON ESS BUS cannot be faulty because the ENTERTAINMENT SYSTEM POWER system is operating and it receives input from the NON ESS BUS..."], "jumps": []}, {"id": "P4193", "text": ["The GALLEY HEATERS system is not working, however, if you replace it the problem would not be fixed. Look at the block diagram and determine if the source of the heater's input is functional."], "jumps": []}, {"id": "P4194", "text": ["The GALLEY LTS system is not functioning, however if you replace it the problem would not be fixed. Look at the block diagram and determine if the source of the light's input is functional."], "jumps": []}, {"id": "P4195", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4200", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4201", "text": [], "jumps": []}, {"id": "P4202", "text": ["The NON ESS BUS cannot be faulty because the GALLEY POWER system is operating and it receives input from the NON ESS BUS..."], "jumps": []}, {"id": "P4203", "text": ["Recheck your block diagram. The #1 ESS BUS does not contribute inputs to the NON ESS BUS or the ENTERTAINMENT SYSTEM POWER system....."], "jumps": []}, {"id": "P4204", "text": ["Recheck your block diagram. The GALLEY POWER system does not provide an input to the ENTERTAINMENT SYSTEM POWER system."], "jumps": []}, {"id": "P4205", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4210", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4211", "text": [], "jumps": []}, {"id": "P4212", "text": ["The #1 GEN is working. Even with the #1 GEN switch off, the #1 GEN light is functional."], "jumps": []}, {"id": "P4213", "text": ["Since the #1 MAIN BUS and all of its subsystems are operational, we can conclude that the #1 GEN switch is good. Turn the switch off and on to verify correct #1 MAIN BUS operation."], "jumps": []}, {"id": "P4214", "text": ["Recheck your block diagram. The #1 MAIN BUS gets its input directly from the #1 GEN switch, which is working correctly."], "jumps": []}, {"id": "P4215", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4220", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4221", "text": [], "jumps": []}, {"id": "P4222", "text": ["The NON ESS BUS is not working, however it is designed to drop all non essential loads in the event of a MAIN BUS system or generator failure. Repairing this system would not fix the fault. Recheck your block diagram.."], "jumps": []}, {"id": "P4223", "text": ["The #1 GEN is working properly because the #1 GEN CONNECTED system is working and it gets an input from the #1 GEN through the #1 GEN switch."], "jumps": []}, {"id": "P4224", "text": ["The #1 GEN switch is working properly because the #1 GEN CONNECTED system is working and it gets its input from the #1 GEN switch. Place the #1 GEN switch in the off position to verify the #1 GEN CONNECTED operation."], "jumps": []}, {"id": "P4225", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4230", "text": ["What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4231", "text": [], "jumps": []}, {"id": "P4232", "text": ["The NON ESS BUS is not working, however it is designed to drop all non essential loads in the event of a MAIN BUS system or generator failure. Repairing this system would not fix the fault. Recheck your block diagram.."], "jumps": []}, {"id": "P4233", "text": ["Recheck your block diagram. The #2 ESS BUS is not working, however, repairing this system would not fix the problem. The #2 ESS BUS receives its input from the #2 MAIN BUS System."], "jumps": []}, {"id": "P4234", "text": ["The #2 GEN switch is working properly because the #2 GEN CONNECTED system is working and it gets its input from the #2 GEN switch. Place the #2 GEN switch in the off position to verify the #2 GEN CONNECTED operation."], "jumps": []}, {"id": "P4235", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4240", "text": ["Both ENTERTAINMENT SYSTEM POWER and GALLEY POWER systems failuree", "What is the most probable cause after you have isolated the fault?"], "jumps": []}, {"id": "P4241", "text": [], "jumps": []}, {"id": "P4242", "text": ["These symptoms would certainly look like a NON ESS BUS failure, however, the NON ESS BUS is operating correctly. You may be looking at a rare multiple system failure. Check your block diagram.."], "jumps": []}, {"id": "P4243", "text": ["You have partially identified the problem, however according to our block diagram, repairing the ENTERTAINMENT SYSTEM POWER would not clear the GALLEY POWER problems."], "jumps": []}, {"id": "P4244", "text": ["You have partially identified the problem, however according to our block diagram, repairing the GALLEY POWER system would not clear the ENTERTAINMENT SYSTEM POWER system problems."], "jumps": []}, {"id": "P4245", "text": ["CONGRATULATIONS!! You have successfully isolated the fault and determined the cause of the fault."], "jumps": []}, {"id": "P4700", "text": ["Would you like to try another fault?......................."], "jumps": []}, {"id": "P4710", "text": ["You have completed the fault isolation practice for this lesson. If you would like to try the practice once again, Press F4, to go to the Lesson Menu and select Exercise from the Objective Menu."], "jumps": []}, {" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
