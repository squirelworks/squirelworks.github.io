<script>
const book = {"title": "9395Z823", "pages": [{"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1420 10211 1 111 1430 10212 1 112 1070 10213 1 113 1075 10214 1 114 1120 10215 1 115 1090 10216 1 116 1140 10217 1 117 1160 10218 1 118 1170 10219 1 119 1330 10220 1 120 1340 10221 1 121 1390 10222 1 122 1530 10223 1 123 1550 10224 1 124 1365 10225 1 125 1365 10226 2 126 2210 10227 2 127 2085 10228 2 128 2090 10229 2 129 2090 10230 2 130 2230 10231 2 131 2300 10232 2 132 2110 10233 2 133 2110 10234 2 134 2160", "Page # Test# Question# HelpPage # 10210 1 110 1420 10211 1 111 1430 10212 1 112 1070 10213 1 113 1075 10214 1 114 1120 10215 1 115 1090 10216 1 116 1140 10217 1 117 1160 10218 1 118 1170 10219 1 119 1330 10220 1 120 1340 10221 1 121 1390 10222 1 122 1530 10223 1 123 1550 10224 1 124 1365 10225 1 125 1365 10226 2 126 2210 10227 2 127 2085 10228 2 128 2090 10229 2 129 2090 10230 2 130 2230 10231 2 131 2300 10232 2 132 2110 10233 2 133 2110 10234 2 134 2160 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249"], "jumps": []}, {"id": "PINFO", "text": ["08-19-04 Converted from storyboard - patty 08-28-04 Inserted", "08-19-04 Converted from storyboard - patty 11-05-04 Inserted graphics and illustrator drawings throughout lesson- patty 11-09-04 Reviewed branching. frieda 11-10-04 P1183 Deleted this page it was duplicate of P1182. frieda 11-16-04 Final graphic text and graphic changes per ray. frieda & patty"], "jumps": []}, {"id": "P10410", "text": ["2. AC Generation System Operation and Maintenance"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 40%. Do you want to __________"], "jumps": []}, {"id": "P10302", "text": ["end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10234", "text": ["physically disconnecting the AC generator from the engine/gearbox?", "If the GCU detects an abnormal voltage condition that it cannot correct, the GCU disables the AC generator by _______", "physically disconnecting the CSD from the engine/gearbox?", "generating a control voltage that opens the line contactor, which disconnects the generator from the bus?", "generating a control voltage to the PMG that shuts the generator down?"], "jumps": []}, {"id": "P10233", "text": ["The GCU regulates the output of an AC brushless generator by _______", "increasing or decreasing the signal to the exciter stationary coils.", "rectifying the PMG signal to the voltage regulator.", "increasing or decreasing the resistance of the main output stationary coils."], "jumps": []}, {"id": "P10232", "text": ["A signal from the generator's exciter diode unit is sent to the voltage regulator.", "How does a brushless generator induce an exciter field voltage?", "A signal is sent through the commutator to the rotating field.", "A signal from the generator's permanent magnet is regulated and sent to the exciter coil of the generator.", "Brushless generators do not require an exciter field."], "jumps": []}, {"id": "P10231", "text": ["What does a discolored autotransformer indicate?"], "jumps": []}, {"id": "P10230", "text": ["Repair the coils of the autotransformer.", "What is the typical maintenance process, when an autotransformer fails?", "Flash the field to reintroduce the magnetic poles.", "Remove and replace the autotransformer with a new unit.", "Remove, disassemble, overhaul, and replace the autotransformer."], "jumps": []}, {"id": "P10229", "text": ["Automatically, when the temperature returns to a normal range.", "During flight, the Integrated Drive Generator (IDG) is disconnected due to an over temperature condition. How is the IDG re-connected?", "The IDG can only be reconnected by maintenance personnel on the ground."], "jumps": []}, {"id": "P10228", "text": ["How is an Integrated Drive Generator (IDG) disconnected during flight?"], "jumps": []}, {"id": "P10227", "text": ["How is Integrated Drive Generators (IDG) cooling accomplished?"], "jumps": []}, {"id": "P10226", "text": ["What is the purpose of an instrument autotransformer?", "Charge the aircraft batteries in flight."], "jumps": []}, {"id": "P10225", "text": ["A Constant Speed Drive (CSD) unit drives the AC generator through the use of _______", "an infinitely variable mechanical gearing system."], "jumps": []}, {"id": "P10224", "text": ["Maintains a constant generator shaft speed under various Loads to ensure a constant generator frequency output.", "What is the purpose of a Constant Speed Drive (CSD)?", "Maintains a constant generator shaft speed under various Loads to ensure a constant generator voltage output.", "Maintains a constant generator shaft speed under various Loads to ensure a constant current output.", "Connects the engine or gearbox to the generator control unit."], "jumps": []}, {"id": "P10223", "text": ["Which component in the AC generation system provides cockpit load meter indications?"], "jumps": []}, {"id": "P10222", "text": ["Current transformers are used in the AC generation system to _______", "detect feeder faults, detect incorrect phase rotation, and monitor current loads."], "jumps": []}, {"id": "P10221", "text": ["A shorted condition within an AC generator's windings is known as a _______"], "jumps": []}, {"id": "P10220", "text": ["Which function of the GCU protects the AC generator during system shutdown?"], "jumps": []}, {"id": "P10219", "text": ["When a helicopter is in flight, which GCU protection function is disabled?"], "jumps": []}, {"id": "P10218", "text": ["A Boeing 777 3-phase AC generator has a phase voltage of 115 VAC. What is the available Line voltage?"], "jumps": []}, {"id": "P10217", "text": ["Line voltage is _______ times phase voltage."], "jumps": []}, {"id": "P10216", "text": ["What two types of voltages are produced at the output of a three-phase AC generator?"], "jumps": []}, {"id": "P10215", "text": ["In a three-phase AC system, how many degrees separate each phase?"], "jumps": []}, {"id": "P10214", "text": ["How many phases does a large aircraft typically get from its AC generation system?"], "jumps": []}, {"id": "P10213", "text": ["What is the frequency of large aircraft AC generation systems?"], "jumps": []}, {"id": "P10212", "text": ["The frequency of an AC generator is dependent on _______"], "jumps": []}, {"id": "P10211", "text": ["The rotary inverter combines two components to generate AC. They are:"], "jumps": []}, {"id": "P10210", "text": ["What are the two types of inverters used in aircraft?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P3910", "text": ["This completes the AC GENERATION TROUBLESHOOTING.LE........"], "jumps": ["P3001", "P3290"]}, {"id": "P3290", "text": ["For more information about troubleshooting AC generation systems, refer to the maintenance manual or computer documentation for the specific aircraft you are maintaining or check out the FAA Advisory Circular AC65-9A, General Handbook..."], "jumps": []}, {"id": "P3280", "text": ["As you have learned, troubleshooting the AC generation system is easy as long as you stick to a systematic approach. Since there are so few moving parts in the AC generation system to wear out, the system tends to provide a long service life..."], "jumps": []}, {"id": "P3270", "text": ["Excellent! You found that the line contactor was operating since it had a control voltage at TP3, however, the phase B contact was open as evident by the 0 volts at TP8. Notice that TP7 and TP9 measured correctly..."], "jumps": []}, {"id": "P3263", "text": ["The GCU is functioning normally since it does not indicate a Generator Failure light and it continues to provide a control voltage to the line contactor."], "jumps": []}, {"id": "P3262", "text": ["The Phase B output at TP5 is correct and the GCU has not sensed a fault condition from the generator since it is still providing a control voltage to the line contactor."], "jumps": []}, {"id": "P3261", "text": [], "jumps": []}, {"id": "P3260", "text": ["Following a No. 1 engine change, the mechanic noted that the No. 1 AC generator, phase B output indicated 0 volts and less than 350 Hz during the engine run up. Which component would you suspect as the most likely cause???"], "jumps": ["P3240"]}, {"id": "P3240", "text": ["That last troubleshooting problem was a bit tricky because all of the TP measurements were correct. How about an easier problem? llowing a No. 1 engine change, the mechanic noted that the No. 1 AC generator, phase B output indicated 0 volts and less than 350 Hz during the engine run up..."], "jumps": []}, {"id": "P3230", "text": ["Very good! Your inspection of the wire from the autotransformer to 26 VAC Bus revealed that the connection at the bus bar was broken causing an open in the system."], "jumps": ["P3220"]}, {"id": "P3223", "text": ["The likelihood of all instruments failing at the same time is remote. Try another approach to troubleshooting this problem."], "jumps": []}, {"id": "P3222", "text": ["We verified that the autotransformer was working correctly when we checked the inputs and outputs and found the correct readings. Replacing the autotransformer would not fix the fault."], "jumps": []}, {"id": "P3221", "text": [], "jumps": []}, {"id": "P3220", "text": ["Check the wire between the autotransformer and the 26 VAC Bus for damage or loose connections.", "Remove and replace the autotransformer. P3222", "Remove and replace the affected instruments and see if that fixes the problem. P3223", "The autotransformer is producing 26 Vac. What would you do next to determine the fault?ine the fault?"], "jumps": ["P3210"]}, {"id": "P3213", "text": ["Removing and replacing the autotransformer at this point may be premature. You can check the autotransformer's inputs and outputs to verify its operation without replacing it."], "jumps": []}, {"id": "P3212", "text": ["This would be a very expensive troubleshooting step. The likelihood that several instruments would fail at the same time is very small. Try another troubleshooting approach."], "jumps": []}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3210", "text": ["What would be your next step in verifying the autotransformer is at fault?", "Remove and replace the affected instruments and see if that fixes the problem. P3212", "Remove and replace the autotransformer.. P3213", "Check for 115 VAC at the primary and 26 VAC at the secondary output of the autotransformer."], "jumps": ["P3200"]}, {"id": "P3203", "text": ["Since the discrepancy was reported in flight with the engines are running, we can assume that the generators, not the inverter, were indirectly powering the 26 VAC Bus. A quick check to verify Inverter operation can be made by checking the inverter input and output voltages...."], "jumps": []}, {"id": "P3202", "text": ["Check TP16. Power at this terminal point indicates that the essential bus is operating correctly."], "jumps": []}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3200", "text": ["Let's try another one. Twenty minutes into the flight, the pilot reports that several cockpit instruments either froze or went to zero and the 26 VAC Bus Fail light illuminated. Which component would you suspect as the most likely culprit???"], "jumps": ["P3180"]}, {"id": "P3180", "text": ["Check the signal at TP2. As you can see, the output from the GCU to the exciter field windings is faulty. At this point you would replace the GCU."], "jumps": []}, {"id": "P3173", "text": ["You could remove and replace the AC generator, however, the maintenance hours needed to make the change is very high. Your best solution is to swap out GCU's, which can often be done without removing the existing GCU..."], "jumps": []}, {"id": "P3172", "text": ["This might be the only viable option left if you cannot measure the exciter stator coil input from the GCU. Usually, if you disconnect the GCU connector to check for exciter voltage, you disconnect the PMG and generator monitoring inputs as well. For this exercise, we will check TP2 for an exciter signal..."], "jumps": []}, {"id": "P3171", "text": [], "jumps": []}, {"id": "P3170", "text": ["The PMG Stator Coil output is correct according to the maintenance manual. What can we do next to determine the faulty component?", "Remove and replace the generator. P3173", "Check the Exciter Stator Coil output signal at TP2."], "jumps": ["P3160"]}, {"id": "P3163", "text": ["Since we already eliminated the line contactor as a faulty component, if the generator had an output, it should power the main bus."], "jumps": []}, {"id": "P3162", "text": ["You could remove and replace the GCU, and under certain circumstances this might be the quickest way to fault isolate, however, if the AC generator is faulty, you run the risk of damaging a second GCU..."], "jumps": []}, {"id": "P3161", "text": [], "jumps": []}, {"id": "P3160", "text": ["Since the line contactor does not have power at TP3, we have eliminated the Line Contactor as a primary suspect. What would you do next to further isolate the fault?", "Check the input to the main bus at TP7, TP8 and TP9. P3163", "Check the PMG Stator Coil output at TP1 of the generator."], "jumps": ["P3150"]}, {"id": "P3153", "text": ["Checking the PMG stator coil output would assist in troubleshooting the generator, however, it would not accurately eliminate the line contactor as a suspect component."], "jumps": []}, {"id": "P3152", "text": ["Removing and replacing the GCU would determine if the GCU was at fault, however, it would not eliminate the line contactor as a suspect if the fault persisted after replacement."], "jumps": []}, {"id": "P3151", "text": [], "jumps": []}, {"id": "P3150", "text": ["Good job, you've isolated it down to three components. How would you determine if the Line Contactor is faulty?", "Check the PMG Stator Coil output at TP1.P3153", "Check for the correct generator output voltages at the input and output of the line contactor. Check for the correct line contactor control voltage at TP3."], "jumps": ["P3140"]}, {"id": "P3143", "text": ["An Inverter fault would not cause the AC generator to drop off the line. If the Main/Inv switch loses power or the coil of the Inverter Relay is open, the Inverter relay would automatically switch to the main bus. These components are not suspect..."], "jumps": []}, {"id": "P3142", "text": ["Even though these systems show no output, the Auto Transformer, Essential Bus and 26 VAC Bus would not be suspect since the cockpit indications show 0 volts and that information is provided by the GCU..."], "jumps": []}, {"id": "P3141", "text": [], "jumps": []}, {"id": "P3140", "text": ["Auto Transformer, Essential Bus, and 26 VAC Bus. 3142", "Inverter, Loss of 28 VDC to Main / Inv switch, open coil of Inverter Relay.. P3143", "Okay; now you try one! With engines running and the gearbox turning, the pilot reports that the AC generator dropped off the line. Cockpit indications show 0 volts and no load. Use your pointer to check signals at terminal points and identify which components are suspect?????????????????????????????????????????????????????????"], "jumps": ["P3120"]}, {"id": "P3120", "text": ["We have power to the Inverter. Keep in mind, that in an aircraft, the Inverter could be physically turning, however, the inverter's internal control unit might sense an output power fault and disable the Inverter's AC output. The Inverter fail light (INV Fail) should have been illuminated..."], "jumps": []}, {"id": "P3115", "text": ["With the Inverter output showing zero volts, we must now determine if the Inverter is faulty or the input to the inverter is faulty. Check for 28 VDC at TP10."], "jumps": []}, {"id": "P3110", "text": ["Since we have power at the relay, we can deduce that the Main/Inv Switch is good. Next, check the output of the Inverter at TP11, TP12, and TP13."], "jumps": []}, {"id": "P3100", "text": ["The coil of the Inverter relay should have been energized thus connecting the Inverter to the Essential bus. Check the Main / Inv Relay input power by moving the pointer to TP15."], "jumps": []}, {"id": "P3090", "text": ["Since we know that the engines had not been started, the generators could not have been providing power. The fault write up said that the Main / Inv switch was placed in the \"Inv\" position."], "jumps": []}, {"id": "P3080", "text": ["Next, run through an operational check on paper. What would have to be operating in order to power up the Essential and Instrument busses. By the schematic, either the main bus (AC generator) or Inverter must be running..."], "jumps": []}, {"id": "P3070", "text": ["The first step in our troubleshooting process is to gain any additional information by the operator before they leave for the day. The pilot said that the Instruments did not energize either, so they aborted the start and secured the aircraft..."], "jumps": []}, {"id": "P3060", "text": ["Here is a fault that was written up on an aircraft. \"With the engines secured and the Main/Inverter switch in the \"INV\" position, the essential bus does not have power\"."], "jumps": []}, {"id": "P3050", "text": ["Let's go through an AC troubleshooting scenario. We will be using this schematic for our AC generation system paper troubleshooting exercise. Feel free to print the schematic so you can mark it up as necessary.."], "jumps": []}, {"id": "P3040", "text": ["The AC power generation system of a large, multi-engine aircraft is pretty simple to troubleshoot when you break it down to its individual AC systems. Each AC system is typically configured the same as the others. The power distribution system will give you an idea of what went wrong in the generation system by how it is configured...d."], "jumps": []}, {"id": "P3030", "text": ["So far, we have looked at a single generator AC generation system. Typical large aircraft have 2, 3 or 4 redundant systems. If a single generator fails, the other generators will automatically provide the necessary power to the failed generator's busses and systems..."], "jumps": []}, {"id": "P3020", "text": ["As an Aviation Maintenance Technician you will be expected to troubleshoot aircraft AC generation system faults. Servicing, troubleshooting, and repair of any aircraft system should always be conducted in accordance with the appropriate aircraft and component publications..."], "jumps": ["P3030", "P3001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2980"]}, {"id": "P2980", "text": ["7. Since the AC generator is brushless and static inverters have no moving parts, maintenance on most AC generation systems is limited to inspection, troubleshooting, remove and replace. Inspect the system in accordance with manufacturers specifications, maintenance manuals and government regulations........................"], "jumps": []}, {"id": "P2970", "text": ["6. The autotransformer provides 26 VAC to select avionics and instrument components. The autotransformer receives 115 VAC from the primary side of its coil and induces a 26 VAC signal into the secondary side of its coil. coil........."], "jumps": []}, {"id": "P2960", "text": ["5. If the generator control unit senses that the AC output is correct, it energizes the contactor relay coil thus applying 115 VAC to the main bus....."], "jumps": []}, {"id": "P2950", "text": ["4. The modified signal is sent to the exciter stator coils, which induces a signal into the exciter rotor. The signal from the rotor is rectified and sent to the rotating field coils, which produces the magnetic field for the output stator coils."], "jumps": []}, {"id": "P2940", "text": ["3. The operation of the AC generator begins when the engine/gearbox begins turning the generator shaft. The permanent magnet generator on the end of the shaft induces a signal in the PMG stator coils. The PMG stator coil signal is rectified to DC and is increased or decreased based on the voltage regulator requirements."], "jumps": []}, {"id": "P2930", "text": ["2. The Inverter is used to provide 115 VAC to the essential, or secondary bus until the main generators are operational. The Inverter receives a 24-28 VDC input and changes it into AC."], "jumps": []}, {"id": "P2920", "text": ["1. The AC Generation System provides power to the various main, essential, and instrument AC busses. The AC generators produce 115 VAC, 3-phase, 400 Hz power."], "jumps": ["P2001"]}, {"id": "P2910", "text": ["This completes the information on AC GENERATION OPERATION AND MAINTENANCE."], "jumps": ["P2001", "P2330"]}, {"id": "P2332", "text": ["Inspections should always be conducted in accordance with the applicable publications and regulations."], "jumps": []}, {"id": "P2331", "text": [], "jumps": []}, {"id": "P2330", "text": ["How is an AC generation system inspected?..................", "In accordance with the proper maintenance publications and regulations.", "Begin at the generator and work towards the bus bars..", "Begin at the bus bars and work towards the generator."], "jumps": ["P2320"]}, {"id": "P2320", "text": ["For 3 phase AC generation systems, care should be taken to ensure the wires are connected in the proper phase order. Wires should be marked to indicate the correct phase they are associated with in the system..."], "jumps": []}, {"id": "P2310", "text": ["Check the cooling ducts for tears, security, signs of chafing, and ensure they are clear of obstructions. Inspect the components for discoloration, blackening of the vent areas, and distortion of the covers, which are all signs of overheating. Check the IDG for cooling oil leaks..."], "jumps": []}, {"id": "P2300", "text": ["Typically, AC generation system components are inspected for signs of overheating, security of installation hardware, and proper connections. Visually inspect all connections for cleanliness, broken or frayed wires, broken terminal lugs, clean solder joints and proper torque..."], "jumps": []}, {"id": "P2290", "text": ["Inspection of the AC generation system should be conducted in accordance with the proper technical manuals, manufacturer specifications, and government regulations."], "jumps": []}, {"id": "P2280", "text": ["AC Generation System maintenance is for the most part, remove and replace. There are no brushes or slip rings in the generators and static inverters have no moving parts, so maintenance of these items is limited to inspection, operational test, remove, and replace..."], "jumps": []}, {"id": "P2270", "text": ["The basic configuration of each AC system is identical. As long as each AC generator is functioning, the systems function as independent systems. If an AC generator fails, however, the power distribution system controls the routing of AC power to ensure all essential systems are powered. e will learn the details of power management in the power distribution system lesson....."], "jumps": []}, {"id": "P2260", "text": ["On large aircraft utilizing AC generation systems as their primary power systems, the main AC bus is typically divided into separate electrical channels. AC generator #1 powers the #1 AC system, AC generator #2 powers the # 2 system, and so on..."], "jumps": []}, {"id": "P2253", "text": ["The autotransformer does not produce DC voltage............"], "jumps": []}, {"id": "P2252", "text": ["The AC generator powers the main AC bus with 115 VAC......."], "jumps": []}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2250", "text": ["What is purpose of the autotransformer?...................."], "jumps": ["P2240"]}, {"id": "P2240", "text": ["Since the autotransformer has no moving parts, there is very little maintenance required on the unit. Usually when an autotransformer fails, it must be replaced."], "jumps": []}, {"id": "P2230", "text": ["The secondary side of the autotransformer coil produces 26 VAC and is connected to the Instrument bus."], "jumps": []}, {"id": "P2220", "text": ["The autotransformer steps the 115 VAC down to 26 VAC. 115 VAC from the essential AC bus is applied to the primary side of the autotransformer coil. The current flow induces current flow in the secondary side of the coil. Since the secondary side has fewer turns than the primary, the voltage is reduced.."], "jumps": []}, {"id": "P2210", "text": ["Whether an AC generator or Inverter is connected to the essential AC bus, some avionics and instrument systems require less voltage to operate than the 115 VAC bus power. To support these systems, an autotransformer is utilized..."], "jumps": []}, {"id": "P2200", "text": ["When the GCU removes the generator output from the main AC bus, it shuts down the faulted generator and turns on the \"Gen. Fail\" light in the cockpit to inform the crew of the AC generator failure."], "jumps": []}, {"id": "P2193", "text": ["The main bus is electrically down stream from the line contactor and is not monitored by the GCU."], "jumps": []}, {"id": "P2192", "text": ["Although the generator would be removed from the bus, a contactor coil fault is not sensed through the current transformers."], "jumps": []}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2190", "text": ["What signal from the current transformers would cause the GCU to remove the generator from the main bus?"], "jumps": ["P2180"]}, {"id": "P2183", "text": ["The IDG will not automatically reconnect..................."], "jumps": []}, {"id": "P2182", "text": ["The IDG disconnect switch cannot reconnect the IDG in flight."], "jumps": []}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2180", "text": ["If the IDG is disconnected in flight, how is it reconnected?", "Can be reconnected in flight by moving the IDG switch position to \"IDG On\".- P2182", "The IDG automatically reconnects when the cause of the failure is removed. P2183"], "jumps": ["P2170"]}, {"id": "P2170", "text": ["If the feeder fault persists after a time delay and the GCU cannot correct it, the GCU removes the control voltage from the line contactor coil and the generator will be removed from the main bus..."], "jumps": []}, {"id": "P2160", "text": ["Remember from our component section, we said the main output wires from the generator are routed through current transformers. The current transformers send the loading information to the GCU. If a feeder fault is sensed by the GCU through the current transformers, it will attempt to correct the fault through the voltage regulator..."], "jumps": []}, {"id": "P2150", "text": ["The GCU maintains the AC generator output at a constant 115 VAC. It also monitors the output for the proper phase, frequency, voltage, and current. If the GCU is satisfied that the output is correct, it sends 28 volts DC to the coil of the line contactor, which connects the generator to the main AC distribution bus..."], "jumps": []}, {"id": "P2140", "text": ["The rotating field coil induces AC into the output stator coils which then sends the 115 VAC signal to the power distribution system line contactor. The AC generator is now operating normally, but it hasn't made it to the power distribution busses yet..."], "jumps": []}, {"id": "P2130", "text": ["The exciter stator coil induces an AC signal into the exciter rotor coils, which rectifies the signal to DC and applies it to the rotating field coils. Remember, if the generator is producing less than 115 VAC at the output, the GCU will increase the exciter signal, which increases the rotating field strength..."], "jumps": []}, {"id": "P2120", "text": ["The PMG stator coils send the AC signal to the GCU, which rectifies it to DC and sends, it to the Exciter stator coils. If the GCU senses that the PMG signal is too low, it increases the signal to the exciter coil. If the GCU senses that the PMG signal is too high, it decreases the signal to the exciter coils..."], "jumps": []}, {"id": "P2110", "text": ["The engine / gearbox turns the IDG generator shaft with the permanent magnet mounted on the end. This rotation induces an AC signal into the PMG stator coils."], "jumps": []}, {"id": "P2100", "text": ["The IDG can be disconnected from the engine/gearbox in flight by an IDG disconnect switch located in the cockpit, however, maintenance personnel on the ground can only reconnect it."], "jumps": []}, {"id": "P2095", "text": ["INTEGRATED DRIVE GENERATOR - Incorporates a generator, a constant speed drive, and the drive oil system in a single unit. The IDG is cooled by porting the IDG oil through a fuel/oil heat exchanger..."], "jumps": []}, {"id": "P2090", "text": ["To get our main AC system started we will need to have the engines or gearboxes rotating at normal operating speed. Most commercial jet aircraft use an Integrated Drive Generator (IDG) to power a corresponding AC bus..."], "jumps": []}, {"id": "P2083", "text": ["The Inverter changes DC power into AC power. Transformer-rectifiers change AC to DC power."], "jumps": []}, {"id": "P2082", "text": ["The Inverter is not normally used when the AC generators are connected to the main bus."], "jumps": []}, {"id": "P2081", "text": [], "jumps": []}, {"id": "P2080", "text": ["When is the Inverter system utilized?......................", "During normal generator operation. P2072", "During AC to DC converting sequences. P2073", "During start and main bus failure conditions."], "jumps": []}, {"id": "P2070", "text": ["Once the generators are connected, the Main/Inv switch automatically disconnects the Inverter and switches to the main AC bus."], "jumps": []}, {"id": "P2060", "text": ["The inverter switch is placed in the ON position and the Main / Inv switch is placed in the Inv position. Typically the Main / Inv switch is magnetically held on and will trip off if an Inverter fault is detected by the inverter control unit."], "jumps": []}, {"id": "P2050", "text": ["The Inverter will provide the same 115 VAC, 3-phase, 400 Hz AC power that the AC generator provides. The inverter's control unit is integral to the inverter assembly. To power the essential AC bus with the inverter, 24 - 28 VDC from the battery or external source is applied to the inverter..."], "jumps": []}, {"id": "P2040", "text": ["Before the engines are started and the generators are connected to the AC bus, an inverter can be used to power up the necessary AC systems. The Inverter is connected to the AC system in such a way to only power essential equipment..."], "jumps": []}, {"id": "P2030", "text": ["Below is a simple schematic diagram that we will use as a guide as we go through the operation of the AC generation system. Notice that the schematic includes all of the components we have covered in this lesson..."], "jumps": []}, {"id": "P2020", "text": ["Now that we have looked at the various AC generation system components and have an understanding of their function, let's put the AC generation system together."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": ["AC GENERATION OPERATION AND MAINTENANCEENANCE"], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P1980", "text": ["7. Autotransformers reduce 115 VAC bus voltage to 26-28 VAC for flight instruments. The autotransformer uses one winding tapped to reduce the voltage.."], "jumps": ["P1999"]}, {"id": "P1970", "text": ["6. An Inverter changes DC power to AC power. There are two types of inverters, rotary and static inverters. Rotary inverters are essentially a DC motor driving an AC generator. A static inverter uses solid-state circuitry to change DC to AC."], "jumps": []}, {"id": "P1960", "text": ["5. The Generator Control Unit (GCU) regulates the AC generator output by increasing or decreasing the exciter voltage. The GCU also monitors for improper frequencies, feeder faults, over-voltage, and under-voltage conditions. The GCU removes the generator if one of those conditions exists..."], "jumps": []}, {"id": "P1950", "text": ["4. AC generators can produce two voltages; phase voltage and line voltage. Phase voltage, 115 VAC, is taken from each phase to neutral. Line voltage, 200 VAC, is taken across two phases. Line voltage equals 1.73 x a single-phase voltage.."], "jumps": []}, {"id": "P1940", "text": ["3. The PMG uses a permanent magnet to induce voltage into the Generator Control Unit (GCU), which in turn, induces a control voltage in the exciter windings in the rotor. The exciter windings set up the magnetic field, which produces the AC output from the stators."], "jumps": []}, {"id": "P1930", "text": ["2. Brushless AC generators, commonly called Permanent Magnet Generators (PMG's) eliminate slip rings, brushes, and the maintenance associated with them. The PMG is essentially three generators in one; a permanent magnet generator, exciter generator, and main generator.rrrrrrrrrrrrrr"], "jumps": ["PMG"]}, {"id": "P1920", "text": ["1. AC generating systems are typically found in large, multi- engine aircraft. The AC generators produce 115 volt, 400 Hz, 3-phase alternating current. Aircraft DC power requirements are met by utilizing a transformer-rectifier that steps the 115 VAC down to 28 VAC and then rectifies it to 28 VDC power......"], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on AC GENERATION AND CONTROL DEVICES."], "jumps": ["P1001", "P1640"]}, {"id": "P1643", "text": ["An autotransformer does not convert DC to AC or AC to DC. It steps up or steps down the voltage."], "jumps": []}, {"id": "P1642", "text": ["The autotransformer is actually lighter and costs less than the standard transformer."], "jumps": []}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1640", "text": ["The autotransformer is unique from a standard transformer because it has ______?", "a much higher weight and cost factor? P1642", "the ability to change DC to AC power?- P1643", "a single winding common to both the primary and secondary side of the transformer?"], "jumps": ["P1630"]}, {"id": "P1633", "text": ["The converter (DC generation system) changes 115 VAC to 28 VDC."], "jumps": []}, {"id": "P1632", "text": ["The autotransformer changes 115 VAC to 26 VAC.............."], "jumps": []}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1630", "text": ["What is the typical input and output of a static inverter?.", "Input = 115 VAC, Output = 26 VAC - P1632", "Input = 115 VAC, Output = 28 VDC - P1633"], "jumps": ["P1620"]}, {"id": "P1620", "text": ["Utilizing the AC power monitoring system in the cockpit will assist you in troubleshooting AC generation system discrepancies. The indications will allow you to visually see what each system is producing and determine any variations from the required outputs..."], "jumps": []}, {"id": "P1610", "text": ["Either a digital readout or a graphical representation of the frequency, amp, and voltage meters will display the AC generation system current operating parameters."], "jumps": []}, {"id": "P1600", "text": ["On aircraft equipped with a glass cockpit, the AC generation system can be monitored by selecting the AC power page. The glass cockpit display shows a block diagram of the AC generating system and will color the blocks to indicate the system component status..."], "jumps": []}, {"id": "P1590", "text": ["Similar to a DC generation system, the AC generation system uses an ammeter to monitor the systems current demands. Also called an AC Load Meter, the ammeter gives a continuous indication of the percent of rated current flow from its respective generator..."], "jumps": []}, {"id": "P1580", "text": ["The meters display the AC generation system frequency and voltage for each generator output. Selector switches allow the crew to view individual generators and phases."], "jumps": []}, {"id": "P1570", "text": ["Most aircraft provide the pilot with indications of the status of the AC generation system. Older and smaller aircraft incorporate frequency and voltage meters on the instrument panel or overhead console..."], "jumps": []}, {"id": "P1560", "text": ["In large aircraft that utilize AC generation systems as their primary power source, DC power is provided through transformer-rectifiers (TR). The TR steps down the 115 VAC system power to 28 VAC and then rectifies it to 28 VDC for the DC power distribution system and charging of the batteries..."], "jumps": []}, {"id": "P1550", "text": ["The main leads induce current into each current transformer which, in turn, sends a signal to the Generator Control Unit (GCU) for monitoring and control of the circuit protection circuitry. The current transformers also provide a signal to the load meters in the cockpit..."], "jumps": []}, {"id": "P1540", "text": ["The main power leads carrying the 3-phase AC current from each generator is routed through the current transformer coils. Each main lead goes through an individual coil."], "jumps": []}, {"id": "P1530", "text": ["Another type of transformer used in an aircraft AC generation system is the Current Transformer. Current transformers consist of inductive pick-up coils that sense the amount of current in a wire. If you have ever used an amp clamp to check the amperage in a circuit, you are familiar with the current transformer operation...."], "jumps": []}, {"id": "P1520", "text": ["The single winding construction of an autotransformer reduces the size and cost over standard transformers."], "jumps": []}, {"id": "P1510", "text": ["An auto transformer is similar to a standard transformer except that it has one winding common to both the primary and secondary windings of the transformer. The winding is tapped to ground in a position that will step down the 115 VAC input to a 26 VAC output..."], "jumps": []}, {"id": "P1500", "text": ["AC generators and inverters typically have an output of 115 VAC. Many cockpit instruments, however, require 26 - 28 VAC to function properly. To meet the needs of these instruments, autotransformers are used to step down the AC generation system power..."], "jumps": []}, {"id": "P1490", "text": ["Since static inverters use solid-state components, they are considerably smaller and lighter than rotary inverters. With no moving parts, static inverters are quiet, enjoy a long life, and have practically no maintenance requirements....."], "jumps": []}, {"id": "P1480", "text": ["Static inverters use stationary electronic circuits to change DC into AC. An oscillator circuit converts 28 VDC into 115 volt, 400 Hz, three-phase, AC power. A filter system in the inverter is used to create the proper waveform and voltage level. A control circuit ensures the inverter responds immediately to load changes..."], "jumps": []}, {"id": "P1470", "text": ["Rotary inverters can support large load currents, however, they are quite large and very noisy. In many applications, such as avionics and instruments where the loading is small, static inverters are utilized..."], "jumps": ["P1460"]}, {"id": "P1463", "text": ["The rotary inverter does not use DC pulses................."], "jumps": []}, {"id": "P1462", "text": ["A static inverter electronically changes DC to AC.........."], "jumps": []}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1460", "text": ["How does a rotary inverter change DC to AC?................", "Uses a DC motor to drive an AC generator."], "jumps": ["P1450"]}, {"id": "P1453", "text": ["A transformer rectifier steps down AC and converts it to DC."], "jumps": []}, {"id": "P1452", "text": ["A converter changes AC to DC..............................."], "jumps": []}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1450", "text": ["What is the purpose of an inverter?........................"], "jumps": ["P1440"]}, {"id": "P1440", "text": ["The inverter accepts 24 - 28 VDC to drive the DC motor, which, in turn, drives the AC generator field rotor. Inverter outputs range from 115 VAC single-phase to full 3-phase systems. A control unit, integral to the inverter, regulates the AC output..."], "jumps": []}, {"id": "P1430", "text": ["Rotary inverters come in many shapes and sizes but their function is always the same; turn DC power into AC power. A rotary inverter is basically a DC motor driving an AC generator. The rotor of the motor is mounted on the same shaft as the rotor of the alternator.r"], "jumps": []}, {"id": "P1420", "text": ["Inverters can provide an emergency source of AC power or the AC power for instruments and avionics necessary to get the aircraft engines started. There are two types of inverters; Rotary Inverters and Static Inverters..."], "jumps": []}, {"id": "P1410", "text": ["Before the aircraft engines are started, the AC generation system is typically not operational. There are, however, some instrument and avionics systems that are critical to pre-engine start operation that require AC power to operate. The Inverter is designed to convert DC power into AC power until the AC generators are on line....."], "jumps": ["P1400"]}, {"id": "P1403", "text": ["The PMG and generator output do not detect feeder faults..."], "jumps": []}, {"id": "P1402", "text": ["The generator output and field control regulate the AC generator output voltage."], "jumps": []}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1400", "text": ["Which section of the Generator Control Unit (GCU) protects the bus from feeder faults?", "Generator Output and Field Control P1402", "Generator Current, Bus Current, and Line Contactor Control Voltage...."], "jumps": ["P1390"]}, {"id": "P1390", "text": ["Finally, the GCU monitors for shorts within the generator windings. This condition, known as a Feeder Fault, is sensed by the GCU as excessive current when compared to the bus current requirements. If a feeder fault is detected, the GCU will disconnect the generator from the bus through the line contactor..."], "jumps": []}, {"id": "P1380", "text": ["In addition to monitoring the frequency of the AC generator, the GCU ensures that three phase generators maintain the correct phase relationship. Any variation in the phase rotation will be sensed by the GCU and cause it to disconnect the generator from the bus..."], "jumps": []}, {"id": "P1370", "text": ["On helicopters, it is typical for the GCU to disable the under-frequency protection circuits once the helicopter is airborne. Helicopter AC generators are usually mounted on the main gearbox which often experiences slow rotor speed in flight. Disabling the under-frequency protection allows the generator to remain on-line during slow gearbox operation....."], "jumps": ["P1360"]}, {"id": "P1365", "text": ["CONSTANT SPEED DRIVE UNIT - is a hydro-mechanical device used to control the shaft speed of the engine/gearbox driven AC generator to a level that will ensure a constant output frequency.."], "jumps": []}, {"id": "P1360", "text": ["Frequency is dependent on the rotational speed or RPM of the generator. Many AC generation systems incorporate a Constant Speed Drive unit to ensure that the generator speed always remains consistent with the desired generator frequency output..."], "jumps": ["P1370"]}, {"id": "P1350", "text": ["The GCU also monitors the generator output for the proper frequency; usually 400 Hz on aircraft. If the output signal is too high or too low, the GCU will disconnect the generator from the bus through the line contactor..."], "jumps": []}, {"id": "P1340", "text": ["In the event of failure or during generator shutdown, current can flow back into the generator causing severe damage to the internal components. The GCU protects the generator by sensing the generators current and bus current. It disconnects the generator if the current fault transformers detect a reverse in current....."], "jumps": []}, {"id": "P1330", "text": ["If the GCU senses an over-voltage or under-voltage condition that it cannot correct through the field control, it generates a control voltage to the line contactor that disconnects the generator from the bus..."], "jumps": []}, {"id": "P1320", "text": ["If the output of the generator decreases, the GCU increases the generator exciter field, thus, increasing the output voltage. If the output of the generator increases above the desired generator output, the GCU decreases the generator exciter field, which decreases the generator output..."], "jumps": []}, {"id": "P1310", "text": ["The GCU provides voltage regulation by maintaining a constant generator voltage under various loads. An electronic circuit in the GCU senses the generator output and controls the strength of the generator exciter field through the field control output..."], "jumps": []}, {"id": "P1300", "text": ["Some GCU's incorporate all of the control and monitoring functions in one unit, while other GCU systems separate the voltage regulator from the fault monitoring system. Our example will show all GCU functions in one unit..."], "jumps": []}, {"id": "P1290", "text": ["The Generator Control Unit (GCU) is designed to keep the AC generator operating within specific parameters. The GCU controls voltage regulation and current limiting conditions. It also monitors and corrects frequency, phase differences, feeder faults, and other output irregularities..."], "jumps": []}, {"id": "P1280", "text": ["Like the DC alternator, the AC generator must be capable of maintaining a constant AC output under all conditions of engine/gearbox speed or system loads."], "jumps": ["P1270"]}, {"id": "P1273", "text": ["Brushless generators do perform better at higher altitudes since there is no possibility of brush arcing."], "jumps": []}, {"id": "P1272", "text": ["Maintenance costs are lower for a brushless generator since there is not brush wear inspections or brush replacement maintenance required."], "jumps": []}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1270", "text": ["Which is NOT an advantage of an AC brushless generator?....", "Increased performance at high altitudes. P1273", "Weighs less than conventional generators."], "jumps": ["P1260"]}, {"id": "P1263", "text": ["The main generator provides final AC generator output......"], "jumps": []}, {"id": "P1262", "text": ["The PMG provides current to the generator control unit....."], "jumps": []}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1260", "text": ["Which section of a brushless generator provides the current to the field windings?"], "jumps": ["P1250"]}, {"id": "P1250", "text": ["Brushless generators have several advantages over generators that utilize slip rings and brushes. The advantages are:", "Increased performance at high altitudes due to brush arcing elimination. High stability and consistency of output. Lower maintenance requirements....."], "jumps": []}, {"id": "P1240", "text": ["The current from the rotating exciter rotor is then rectified and applied to the rotating field winding to induce an AC current into the stators. The output of the stators is three-phase, 400 Hz, AC voltage..."], "jumps": []}, {"id": "P1230", "text": ["The GCU rectifies the AC into a DC voltage and applies it to the stationary exciter field. This field induces a magnetic field in the exciter field coil. The exciter field coil, in turn, induces current flow in the rotating three-phase exciter field rotor..."], "jumps": []}, {"id": "P1220", "text": ["As the generator shaft rotates, the permanent magnet turns on the shaft and induces a single-phase AC voltage to the PMG stator windings that serve the generator control unit (GCU)."], "jumps": []}, {"id": "P1210", "text": ["The PMG is actually three generators in one; a permanent magnet generator, an exciter generator, and a main generator."], "jumps": []}, {"id": "P1200", "text": ["Brushless generators, or permanent magnet generators (PMG's) as they are often called, use a permanent magnet to initiate the production of the flux field and electromagnetic induction to transfer current from the stationary components to the rotating components of the generator. ..."], "jumps": ["PMG"]}, {"id": "P1190", "text": ["Similar to DC alternators, AC generator slip rings and brushes tend to wear down and require replacement at periodic intervals. Brushless, high-output AC generators were developed to eliminate the problems associated with slip rings and brushes..."], "jumps": ["P1200", "P1180"]}, {"id": "P1182", "text": ["Line voltage is equal to 1.73 x Phase Voltage.............."], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1180", "text": ["If an AC generator has a phase voltage of 220 volts, what is its line voltage?"], "jumps": ["P1160"]}, {"id": "P1170", "text": ["In a typical 3-phase AC generation system, 200 VAC line voltage is produced across two phases, while 115 VAC phase voltage is produced across a single phase and neutral."], "jumps": []}, {"id": "P1160", "text": ["Total voltage or line voltage is produced when the AC generation system is connected across any two of the three phases. Each line voltage is 1.73 times the phase voltage. Our 115 VAC phase voltage generator can produce a line voltage of 200 VAC..."], "jumps": []}, {"id": "P1150", "text": ["Phase voltage is produced by connecting any one of the phases to neutral. With the generation system connected in this manner, we actually have 3 single-phase systems. Typical AC generators produce 115 VAC at each phase..."], "jumps": []}, {"id": "P1140", "text": ["Three phase AC generators are capable of producing two types of voltage; phase voltage and line voltage, depending on how the generation system is connected."], "jumps": []}, {"id": "P1130", "text": ["Using the aircraft structure as a ground eliminates the need to run neutral wires all around the aircraft. This significantly reduces the weight and cost of aircraft wiring."], "jumps": []}, {"id": "P1120", "text": ["The neutral connection is used whenever a single phase of AC is needed from a 3-phase system. Each phase; A, B, and C, can produce a single phase of AC. The neutral is connected from the common point of the three phases to the aircraft metallic structure or frame (ground)..."], "jumps": []}, {"id": "P1110", "text": ["In a single phase AC generator, we had two wires connecting the stator. A 3-phase AC generator connects each phase to a neutral wire, thus eliminating two wires. This stator windings configuration is called a \"Wye\" connection..."], "jumps": []}, {"id": "P1100", "text": ["Voltage is induced in each phase and is sent to the output 120 degrees from the other two phases. The reference phase always starts at zero volts and is called Phase A. Phase B crosses zero and moves positive 120 degrees after phase A and phase C crosses zero volts and moves positive 240 degrees after phase A.."], "jumps": []}, {"id": "P1090", "text": ["So far, our AC generator has been producing a single sine wave in a specific period of time. Most aircraft AC generators produce 3-phase AC; which means, there are three cycles in the same time period. Three-phased generators have three single phase windings spaced 120 degrees apart..."], "jumps": ["P1080"]}, {"id": "P1082", "text": ["Frequency in hertz equals the number of cycles (or turns) per second."], "jumps": []}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1080", "text": ["An AC generator's rotor turns 60 times per second. What is its frequency in hertz?"], "jumps": ["P1075"]}, {"id": "P1075", "text": ["Large aircraft AC generators typically produce 115 volt, 3 phase AC at a frequency of 400 Hz."], "jumps": []}, {"id": "P1070", "text": ["The resulting output is a sine wave, or alternating current. As the rotor turns faster, more sine waves are produced in each unit of time. Frequency is the number of times the rotor turns in one unit of time. Hertz (Hz) is equal to the frequency per second and is dependent on RPM....."], "jumps": []}, {"id": "P1060", "text": ["As the rotor turns, the lines of magnetic flux, generated by the DC input, cut across the stator poles and induce a voltage in the stator windings. The induced voltage will reverse polarity every half revolution..."], "jumps": []}, {"id": "P1050", "text": ["The rotor consists of either a permanent magnet or an electromagnet that rotates on a shaft driven by the engine or gearbox. Typically, AC generators use an electromagnetic field set up by a DC exciter field input. The DC can be varied to regulate the AC output of the stators..."], "jumps": []}, {"id": "P1040", "text": ["AC generators have a stator and rotor similar to the DC alternator. The stator is a stationary armature that generates the AC sine wave as the rotating field passes over the stator.."], "jumps": ["P1050", "P1030"]}, {"id": "P1030", "text": ["An AC generator, often referred to in some aircraft manuals as an AC alternator, is very similar in construction to a DC alternator; however, it does not rectify the AC output. In other words, it does not change the natural AC output to DC..."], "jumps": []}, {"id": "P1020", "text": ["As we learned in DC generation systems the DC generator/ alternator is actually a single phase AC generator with its AC output rectified into DC by a commutator or electronic circuit.."], "jumps": ["P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": ["2. AC Generation Operation and Maintenanceeenance"], "jumps": []}, {"id": "P440", "text": ["Let's begin our lesson on AIRCRAFT AC GENERATION SYSTEMS...................."], "jumps": ["P430"]}, {"id": "P430", "text": ["When you have completed the lesson you should be able to identify AC generation components and describe their function, understand an AC generation system operation, and identify simple system faults on an AC generation schematic.ents and describe their function, understand an AC generation system operation, and identify simple system faults on an AC generation schematic....."], "jumps": []}, {"id": "P420", "text": ["As an aircraft maintenance technician, you will be responsible for installing, troubleshooting, repairing, and maintaining the AC Generation system. A good working knowledge of the system and its components is critical for maintaining a safe and reliable source of AC power needed for large aircraft systems..."], "jumps": ["P410"]}, {"id": "P410", "text": ["Almost all large, multi-engine aircraft are designed with an alternating current (AC) generation system to power their many electronics systems. Where DC power is required, these large aircraft convert their AC power to DC using transformer rectifiers..."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["This lesson introduces you to the theory, components, maintenance practices and troubleshooting techniques of the aircraft AC Generation System. you have completed the lesson you should be able to identify AC generation components and describe their function, understand an AC generation system operation, and identify simple system faults on an AC generation schematic....."], "jumps": ["P410", "P400"]}, {"id": "P300", "text": [], "jumps": []}, { let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
