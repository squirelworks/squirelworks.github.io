 while allowing something else to pass."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": [". . . but electronic filters block frequencies and currents instead of dirt and dust.st."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Electronic filters are found in almost every type of electronic device."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["For example, an AM radio uses many filters.", "For example, an AM radio uses many filters................."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["The first filter eliminates all forms of reception but AM.  CB, FM, and TV signals, to name a few, are blocked.", "The first filter eliminates all forms of reception but AM. CB, FM, and TV signals, to name a few, are blocked."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["The second filter picks out the one station you choose to listen to.  This is what you do when you tune a radio, you tune a filter.", "The second filter picks out the one station you choose to listen to. This is what you do when you tune a radio, you tune a filter."], "jumps": ["P470", "P440"]}, {"id": "P470", "text": ["Let's begin the lesson on RL FILTERS.LE..................................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": ["P470"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["A RL filter is a circuit constructed from inductors and resistors that will block certain frequencies and passes others."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["The operation is based on how the inductor reacts to different frequencies, in other words, the inductor's reactance."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["As you should recall, as frequency increases, inductive reactance increases."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["You should also recall that the resistance of a resistor does not change when the input frequency changes."], "jumps": ["P1050", "P1015"]}, {"id": "P1050", "text": ["Using these two concepts, filter circuits are very easy to understand, there is no new theory. You just put to use what you have already learned!"], "jumps": ["P1060", "P1015"]}, {"id": "P1060", "text": ["What does a RL filter circuit block or pass?", "What does a RL filter circuit block or pass?..............."], "jumps": ["P1015"]}, {"id": "P1061", "text": [], "jumps": ["P1060"]}, {"id": "P1062", "text": ["The definition of a RL Filter does not include blocking or passing voltage."], "jumps": ["P1060"]}, {"id": "P1063", "text": ["The definition of a RL Filter does not include blocking or passing phases."], "jumps": ["P1060"]}, {"id": "P1070", "text": ["RL Filters come in two different configurations.", "RL Filters come in two different configurations............"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["One configuration, called a low pass filter, passes low frequencies while blocking high frequencies."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The other configuration is called a high pass filter.  It passes high frequencies while blocking low frequencies.", "The other configuration is called a high pass filter. It passes high frequencies while blocking low frequencies."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["Let's discuss the low pass RL filter first."], "jumps": ["P1110", "P1070"]}, {"id": "P1110", "text": ["A RL low pass filter consists of an inductor and a resistor."], "jumps": ["P1120", "P1070"]}, {"id": "P1120", "text": ["The input is applied in series with the inductor.  This is important for identifying a RL low pass filter.", "The input is applied in series with the inductor. This is important for identifying a RL low pass filter."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The output is taken from across the resistor.  This is also important for identifying a RL low pass filter.", "The output is taken from across the resistor. This is also important for identifying a RL low pass filter."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The basic operation is that at low frequencies, L1 has a small inductive reactance."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The small XL does not drop very much voltage, most of the input signal reaches the resistor where the output is taken."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["At high frequencies, L1 has a large inductive reactance."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["Most of the input signal is dropped across the inductor and does not reach the output (the voltage across the resistor)."], "jumps": ["P1180", "P1110"]}, {"id": "P1180", "text": ["Let's see an example.  In this RL circuit, L1 equals 10 mH and R1 equals 3 kW.  The input signal is 12 Vpp at 0.1 kHz.", "Let's see an example. In this RL circuit, L1 equals 10 mH and R1 equals 3 kW. The input signal is 12 Vpp at 0.1 kHz."], "jumps": ["P1190", "P1110"]}, {"id": "P1190", "text": ["Calculating circuit values produces:", "Calculating circuit values produces: Xl = .006 k", "I = 4 mA Er1 = 12 Vpp El1 = .024 Vpp", "XL = .006 kW Z = 3 kW I = 4 mA Er1 = 12 Vpp EL1 = 0.024 Vpp"], "jumps": ["P1200", "P1180"]}, {"id": "P1192", "text": ["Calculating circuit values produces:", "Calculating circuit values produces: Xl = .006 k", "I = 4 mA Er1 = 12 Vpp El1 = .024 Vpp", "XL = 0.006 kW Z = 3 kW I = 4 mA Er1 = 12 Vpp EL1 = 0.024 Vpp"], "jumps": ["P1200", "P1180"]}, {"id": "P1195", "text": ["Er1 = IR = 4 mA x 3 kW = 12 Vpp EL1 = I x 1 = 4 mA x .006 kW = 0.024 Vpp I = Ea/Z = 12 Vpp/3 kW = 4 mA", "L = 6.28(10 mH)(0.1 kHz) = 6.28 W or 0.006 kW Z = R2 + XL2 = 3 k2 + 0.006 k2 = 9 M + 0.000036 M = 3.0000059 or 3 kW"], "jumps": []}, {"id": "P1200", "text": ["Notice that the output voltage is 12 Vpp (voltage across R1) and L1 drops very little voltage.  The entire input signal is on the output.", "Notice that the output voltage is 12 Vpp (voltage across R1) and L1 drops very little voltage. The entire inpu  to calculate Er for different frequencies and graphing."], "jumps": ["P1410", "P1392"]}, {"id": "P1410", "text": ["If a low pass filter contains a 4 kW resistor and a 5 mH inductor, what is fco?"], "jumps": ["P1392"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["You did not use the formula correctly.  Remember:", "You did not use the formula correctly. Remember: fco =", "R fco = 2pL pp 1 MHz = 0.57p 1 MHz = 0.57 MHz = 0.571 MHz = 0.57"], "jumps": ["P1410"]}, {"id": "P1420", "text": ["The high pass filter is discussed next.", "The high pass filter is discussed next....................."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["A RL high pass filter consists of an inductor and a resistor just like the low pass filter."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The difference is that the input is applied in series with the resistor.  This is important for identifying a RL high pass filter.", "The difference is that the input is applied in series with the resistor. This is important for identifying a RL high pass filter."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The output is taken from across the inductor. This is also important for identifying a RL high pass filter."], "jumps": ["P1460", "P1430"]}, {"id": "P1460", "text": ["The basic operation is that at low frequencies, L1 has a small inductive reactance."], "jumps": ["P1470", "P1430"]}, {"id": "P1470", "text": ["Most of the input signal is shunted to ground by the low reactance and not passed to the output."], "jumps": ["P1480", "P1430"]}, {"id": "P1480", "text": ["At high frequencies, L1 has a large inductive reactance."], "jumps": ["P1490", "P1430"]}, {"id": "P1490", "text": ["Most of the input signal is developed across the inductor and is passed to the output."], "jumps": ["P1500", "P1430"]}, {"id": "P1500", "text": ["Using the same values as in the low pass filter circuit produces these voltages across the inductor, output voltage.", "Us e same.", "Also, since the circuit is the same as a low pass filter, only the components location was changed, the formula for fco is the same. R fco =", "R fco = 2pL R El1 = I x 1 IR El1 = I x 1= I x 11111162.9 kWWWWr 62.9 kWW9 kWWW 9M + 3943.84 M = 62.871615 or 62.9 kW"], "jumps": ["P1570", "P1520"]}, {"id": "P1570", "text": ["What type of RL filter is this circuit?", "What type of RL filter is this circuit?...................."], "jumps": ["P1560"]}, {"id": "P1571", "text": [], "jumps": []}, {"id": "P1572", "text": ["Where the output is taken will determine if the circuit is a low or high pass filter."], "jumps": []}, {"id": "P1580", "text": ["What type of RL filter is this circuit?", "What type of RL filter is this circuit?...................."], "jumps": ["P1570"]}, {"id": "P1581", "text": [], "jumps": []}, {"id": "P1582", "text": ["Where the output is taken will determine if the circuit is a low or high pass filter."], "jumps": []}, {"id": "P1590", "text": ["If a high pass filter uses a 10 kW resistor and a 25 mH inductor, what is the cutoff frequency of the circuit?"], "jumps": ["P1580"]}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592", "text": ["Remember the formula for cutoff frequency.", "Remember the formula for cutoff frequency. R fco =", "R fco = 2pL R El1 = I x 1 IR El1 = I x 1= I x 11111162.9 kWWWWr 62.9 kWW9 kWWW 9M + 3943.84 M = 62.871615 or 62.9 kW"], "jumps": []}, {"id": "P1600", "text": ["What frequencies are attenuated in a high pass filter?", "What frequencies are attenuated in a high pass filter?....."], "jumps": ["P1590"]}, {"id": "P1601", "text": [], "jumps": ["P1600"]}, {"id": "P1602", "text": ["A high pass filter pass the high frequencies, it does not attenuate them."], "jumps": ["P1600"]}, {"id": "P1610", "text": ["The last point about RL filter circuit is troubleshooting.", "The last point about RL filter circuit is troubleshooting.."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["Troubleshooting RL filters is the same as troubleshooting any RL circuit."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["You have had plenty of practice troubleshooting RL circuits."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["But note, you can use the fco value to quickly check out the circuit.  There is no need to calculate XL, Z, I, Er, and EL.", "But note, you can use the fco value to quickly check out the circuit. There is no need to calculate XL, Z, I, Er, and EL."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["Calculating fco and then comparing to the measured fco will tell you if the circuit is operating or not. You will do this in the experiment."], "jumps": ["P1910", "P1610"]}, {"id": "P1910", "text": ["This completes the information on RL FILTER DESCRIPTION.", "This completes the information on RL FILTER DESCRIPTION...."], "jumps": ["P1001", "P1610"]}, {"id": "P1920", "text": ["1.  A RL filter circuit blocks certain frequencies and passes                  others.    \n2.  RL filter circuits consists of a resistor and inductor.", "1. A RL filter circuit blocks certain frequencies and passes others. 2. RL filter circuits consists of a resistor and inductor."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["3.  A low pass RL filter takes the output across the resistor.", "3. A low pass RL filter takes the output across the resistor."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["4.  The inductive reactance causes the low frequencies to pass           to the output while blocking high frequencies.", "4. The inductive reactance causes the low frequencies to pass to the output while blocking high frequencies.... .1 kHz = 12 Vpp Er 1 kHz = 12 Vpp Output 10 kHz = 11.73 Vpp Vpp 100 kHz = 5.17 Vpp 1 MHz = 0.57 Vpp", "0.1 kHz = 12 Vpp 1 kHz = 12 Vpp 10 kHz = 11.73 Vpp 100 kHz = 5.17 Vpp 1 MHz = 0.57 Vppppp El1El1El1El1El1"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["5.  A high pass RL Filter takes the output across the inductor.", "5. A high pass RL Filter takes the output across the inductor."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["6.  The inductive reactance causes the high frequencies to pass         to the output while grounding the low frequencies.", "6. The inductive reactance causes the high frequencies to pass to the output while grounding the low frequencies. = .03 Vpp El 1 kHz = .25 Vpp Output 10 kHz = 2.46 Vpp Vpp 100 kHz = 10.83 Vpp 1 MHz = 11.93 Vpp", "0.1 kHz = 0.03 Vpp 1 kHz = 0.25 Vpp 10 kHz = 2.46 Vpp 100 kHz = 10.83 Vpp 1 MHz = 11.93 VpppppEl1El1El1El1"], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["7.  The cutoff frequency is the point where the output power of            the circuit is half of the maximum value. \n8.  The cutoff  frequency is equal to:", "7. The cutoff frequency is the point where the output power of the circuit is half of the maximum value. 8. The cutoff frequency is equal to: uency is equal to: R fco =", "R fco = 2pL R El1 = I x 1 IR El1 = I x 1= I x 11111162.9 kWWWWr 62.9 kWW9 kWWW 9M + 3943.84 M = 62.871615 or 62.9 kW"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["9.  The cutoff frequency only depends on circuit components,             not if the circuit is low or high pass.", "9. The cutoff frequency only depends on circuit components, not if the circuit is low or high pass. R fco =", "R fco = 2pL R El1 = I x 1 IR El1 = I x 1= I x 11111162.9 kWWWWr 62.9 kWW9 kWWW 9M + 3943.84 M = 62.871615 or 62.9 kW"], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["This experiment demonstrates the operation of RL Filter circuits.  You will measure the output voltage of a low and high pass RL Filter at various frequencies.", "This experiment demonstrates the operation of RL Filter circuits. You will measure the output voltage of a low and high pass RL Filter at various frequencies."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The purpose of this card is to demonstrate normal operation and troubleshooting of RL circuits."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["In this lesson, you will use the card to see normal operation of RL filters."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["There are four circuits on the card labeled A, B, C, and D."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["Switches S1 through S4 apply the input signal to the circuits."], "jumps": ["P2070", "P2030"]}, {"id": "P2070", "text": ["The signal input is applied through Pin E to TP10."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["The output of the circuits are taken from various test points.  Circuit A, TP3; Circuit B, TP5; Circuit C, TP7; and Circuit D, TP9.", "The output of the circuits are taken from various test points. Circuit A, TP3; Circuit B, TP5; Circuit C, TP7; and Circuit D, TP9."], "jumps": ["P2090", "P2030"]}, {"id": "P2090", "text": ["Looking at each circuit configuration, which circuits are a low pass RL filter?"], "jumps": ["P2030"]}, {"id": "P2091", "text": [], "jumps": ["P2090"]}, {"id": "P2092", "text": ["Look at Circuit C, the output is taken across the inductor. This is not a low pass filter."], "jumps": ["P2090"]}, {"id": "P2093", "text": ["Look at Circuit C and D. The outputs are taken across the inductor, they are not low pass filters."], "jumps": ["P2090"]}, {"id": "P2100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2090"]}, {"id": "P2110", "text": ["2.  Carefully insert PC130-16B into the Test Console PC1                      position.", "2. Carefully insert PC130-16B into the Test Console PC1 position..."], "jumps": ["P2100"]}, {"id": "P2115", "text": ["EXPERIMENT CARD PLACEMENT - PC130-16B shown in PC1 position."], "jumps": ["P2110"]}, {"id": "P2120", "text": ["3.  Open S1, S2, S3, and S4, move to the left.", "3. Open S1, S2, S3, and S4, move to the left.............."], "jumps": ["P2110"]}, {"id": "P2125", "text": ["SWITCH POSITIONS - Open S1, S2, S3, and S4, move to the left."], "jumps": ["P2120"]}, {"id": "P2130", "text": ["4.  Connect the output of the function generator to the INPUT               BNC connector.", "4. Connect the output of the function generator to the INPUT BNC connector."], "jumps": ["P2140", "P2120"]}, {"id": "P2135", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": ["P2130"]}, {"id": "P2140", "text": ["The circuit has been set up as shown. The function generator supplies a signal to the four RL filter circuits."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Let's start out by measuring the output voltages of the low pass filter in Circuit B."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["1.   Turn the function generator on and set to 10 kHz. \n2.   Set the output amplitude of the function generator to 5 Vpp as       measured with the oscilloscope on PC130-16B TP10.", "1. Turn the function generator on and set to 10 kHz. 2. Set the output amplitude of the function generator to 5 Vpp as measured with the oscilloscope on PC130-16B TP10.............-16B TP10."], "jumps": ["P2170", "P2140"]}, {"id": "P2165", "text": ["FUNCTION GENERATOR - Adjust the output of the function generator for a 10 kHz sine wave."], "jumps": ["P2160"]}, {"id": "P2170", "text": ["3.  Close switch S2 on PC130-16B, move the switch to the right. \n4.  Connect the oscilloscope to PC130-16B TP5, output of RL low       pass filter circuit B.                  \n5.  Measure the voltage, peak to peak.", "3. Close switch S2 on PC130-16 ": ["Looking at each circuit configuration, which circuits are a low pass RL filter?"], "jumps": ["P13030"]}, {"id": "P13091", "text": [], "jumps": ["P13090"]}, {"id": "P13092", "text": ["Look at Circuit C, the output is taken across the inductor. This is not a low pass filter."], "jumps": ["P13090"]}, {"id": "P13093", "text": ["Look at Circuit C and D. The outputs are taken across the inductor, they are not low pass filters."], "jumps": ["P13090"]}, {"id": "P13100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13090"]}, {"id": "P13110", "text": ["2.  Carefully insert PC130-16B into the Test Console PC1                       position.", "2. Carefully insert PC130-16B into the Test Console PC1 position.n."], "jumps": ["P13120"]}, {"id": "P13115", "text": ["EXPERIMENT CARD PLACEMENT - PC130-16B shown in PC1 position."], "jumps": ["P13110"]}, {"id": "P13120", "text": ["3.  Open S1, S2, S3, and S4, move to the left.", "3. Open S1, S2, S3, and S4, move to the left.............."], "jumps": ["P13130", "P13110"]}, {"id": "P13125", "text": ["SWITCH POSITIONS - Open S1, S2, S3, and S4, move to the left."], "jumps": ["P13120"]}, {"id": "P13130", "text": ["4.  Connect the output of the function generator to the INPUT               BNC connector.", "4. Connect the output of the function generator to the INPUT BNC connector."], "jumps": ["P13140", "P13120"]}, {"id": "P13135", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input Signal BNC."], "jumps": ["P13130", "Pr", "P7"]}, {"id": "P13140", "text": ["The circuit has been set up as shown. The function generator supplies a signal to the four RL filter circuits."], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["Let's start out by measuring the output voltages of the low pass filter in Circuit B."], "jumps": ["P13160", "P13140"]}, {"id": "P1316 ts"], "jumps": ["P13180"]}, {"id": "P13190", "text": ["In the next step you will measure the output voltage of the RL low pass filter circuit at various frequencies.  Ensure that you measure the voltage on TP5 and that TP10 measures 5 Vpp after each setting of the function generator.", "In the next step you will measure the output voltage of the RL low pass filter circuit at various frequencies. Ensure that you measure the voltage on TP5 and that TP10 measures 5 Vpp after each setting of the function generator.."], "jumps": ["P13200", "P13180"]}, {"id": "P13200", "text": ["6.  Measure the output voltage at each setting of the function              generator and type in your measurement to the nearest tenth         of a volt.", "6. Measure the output voltage at each setting of the function generator and type in your measurement to the nearest tenth of a volt."], "jumps": ["P13190"]}, {"id": "P13201", "text": [], "jumps": ["P13210", "P13200"]}, {"id": "P13202", "text": ["Ensure that you are measuring circuit B, TP5, and that the function generator is set to the correct frequency.  Also ensure that S2 is closed, to the right.", "Ensure that you are measuring circuit B, TP5, and that the function generator is set to the correct frequency. Also ensure that S2 is closed, to the right.-"], "jumps": ["P13200"]}, {"id": "P13207", "text": ["You still have not entered the correct voltage readings. You should have measured approximately:", "You still have not entered the correct voltage readings. You should have measured approximately: 40 kHz, Eout = 4.5 70 kHz, Eout = 3.8 100 kHz, Eout = 3.2 130 kHz, Eout = 2.7 160 kHz, Eout = 2.4", "40 kHz, Eout = 4.5 70 kHz, Eout = 3.8 100 kHz, Eout = 3.2 130 kHz, Eout = 2.7 160 kHz, Eout = 2.444"], "jumps": ["P13200"]}, {"id": "P13210", "text": ["Here is a list of your measured output voltages for Circuit B.", "Here is a list of your measured output voltages for Circuit B. requency Output Voltage 10 kHz @%25Vpp 40 kHz @%26Vpp 70 kHz @%27Vpp let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
