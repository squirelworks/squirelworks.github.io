const book = {"title": "9395B102", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: AMPLITUDE MODULATIONsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Amplitude Modulation. w Describe the characteristics of Amplitude Modulation.", "w Generate Amplitude Modulation signals using a function generator. w Observe and measure the characteristics of an Amplitude Modulated signal.Modulated signal.lated signal."], "jumps": []}, {"id": "P300", "text": ["2. Nida 440/4040 Function Generator or equiv.", "3. Nida Model 470 Oscilloscope or equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you are taught the concept of amplitude modulation and will observe amplitude modulated signals."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Amplitude Modulation, AM, is the simplest form of signal processing, it has been used since the first days of radio."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["AM systems have several limitations that other methods of modulation overcome."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["AM is used in many types of communication systems because of simple circuits, proven reliability, and low cost."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on AMPLITUDE MODULATION............................"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1010", "text": ["Amplitude Modulation, AM, is used to convey information from a source to a destination through a transmission medium."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Amplitude modulation is a signal processing technique that modifies a carrier signal by the information signal."], "jumps": ["P1030", "P1010"]}, {"id": "P1030", "text": ["The modification allows the information signal to be sent over long distances, where the information signal itself could not be sent."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The name amplitude modulation is derived from how the carrier signal is modified, in amplitude."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["In transmitter signal processing, a constant amplitude carrier signal is developed by an oscillator."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The carrier signal is then fed to an AM modulator circuit."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The second input to the modulator circuit is the information signal."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The modulator circuit causes the amplitude of the carrier signal to change according to the amplitude of the information signal."], "jumps": ["P1085", "P1050"]}, {"id": "P1085", "text": ["Notice the positive and negative alternation of the AM signal. The information signal modulates a positive wave and negative wave."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The resultant AM signal is then transmitted through the transmission medium (most commonly air but, could be; cables, microwaves or fiber optic cables)."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["In the receiver signal processing, the transmitted AM signal is picked up through a tuning process and the information signal  is recovered.", "In the receiver signal processing, the transmitted AM signal is picked up through a tuning process and the information signal is recovered."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["There are many AM signals available.  The tuning circuits allow you to select which AM signal to process.", "There are many AM signals available. The tuning circuits allow you to select which AM signal to process."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The detector circuits separate the carrier signal from the information signal."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The information signal is then sent to amplifiers for further processing."], "jumps": ["P1140", "P1100"]}, {"id": "P1140", "text": ["What characteristic of the carrier signal is changed for AM signal processing?"], "jumps": ["P1100"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["AM stands for Amplitude Modulation.  The carrier's frequency is not changed.", "AM stands for Amplitude Modulation. The carrier's frequency is not changed."], "jumps": []}, {"id": "P1143", "text": ["AM stands for Amplitude Modulation.  The carrier's phase is not changed.", "AM stands for Amplitude Modulation. The carrier's phase is not changed."], "jumps": []}, {"id": "P1150", "text": ["Touch the carrier signal.", "Touch the carrier signal.is typed.........................."], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["You touched the information signal.  Notice that it varies in amplitude and does not contain a carrier signal.", "You {"id": "P1210", "text": ["As a rule of thumb, the carrier frequency must be at least 50 times greater than the highest information frequency for proper operation of communication electronic circuits."], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["Look at an AM radio, the carrier frequencies range from 540 kHz to 1600 kHz."], "jumps": ["P1230", "P1180"]}, {"id": "P1230", "text": ["Even at a lower frequency of 540 kHz, the carrier frequency is over 50 times higher than your highest voice frequency (approximately 5 kHz)."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["A simple formula expresses the relationship between the information signal and carrier signal frequencies.", "max - highest information signal frequency"], "jumps": ["P1250", "P1220", "P1245"]}, {"id": "P1245", "text": ["max - highest information signal frequency", "INFORMATION AND CARRIER SIGNALS - The carrier frequency is greater than or equal to 50 times the highest frequency of the information signal."], "jumps": []}, {"id": "P1250", "text": ["What is the minimum carrier frequency which can be amplitude modulated by an information signal that varies between 2 kHz and 15 kHz?"], "jumps": ["P1240", "P1255"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["15 kHz is the maximum information signal frequency.  The carrier signal must be 50 times larger than 15 kHz.", "15 kHz is the maximum information signal frequency. The carrier signal must be 50 times larger than 15 kHz."], "jumps": []}, {"id": "P1253", "text": ["100 kHz is fifty times the minimum information signal frequency. The carrier signal must be at least 50 times greater than the maximum information signal frequency.", "100 kHz is fifty times the minimum information signal frequency. The carrier signal must be at least 50 times greater than the maximum information signal frequency......"], "jumps": []}, {"id": "P1255", "text": ["c = 50 x 15 kHzhighest information signal frequency", "MINIMUM CARRIER FRE ifferent frequencies."], "jumps": []}, {"id": "P1306", "text": ["But, for high quality music transmissions (frequencies up to approximately 20 kHz), the bandwidth is insufficient and fidelity is lost."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["An important point about bandwidth is that the higher the carrier frequency, the wider the bandwidth or, the more information that  can be processed.", "An important point about bandwidth is that the higher the carrier frequency, the wider the bandwidth or, the more information that can be processed."], "jumps": ["P1320", "P1306"]}, {"id": "P1320", "text": ["What is the maximum bandwidth of a microwave AM carrier signal of 10.5 GHz?"], "jumps": ["P1306", "P1325"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["2.1 MHz is the carrier frequency divided by 5,000.  To find the BW, divide the carrier frequency by 50.", "2.1 MHz is the carrier frequency divided by 5,000. To find the BW, divide the carrier frequency by 50."], "jumps": []}, {"id": "P1323", "text": ["210 kHz is the carrier frequency divided by 50,000.  To find the BW, divide the carrier frequency by 50.", "210 kHz is the carrier frequency divided by 50,000. To find the BW, divide the carrier frequency by 50."], "jumps": []}, {"id": "P1325", "text": ["BANDWIDTH - The formula for bandwidth is:  BW =", "BANDWIDTH - The formula for bandwidth is: BW ="], "jumps": []}, {"id": "P1330", "text": ["ter frequency. In our case a sideband is a frequency above or below a carrier frequency.", "SIDEBAND Sideband is the frequency above and below a center frequency. In our case a sideband is a frequency above or below a carrier frequency."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The sidebands around a carrier frequency are produced by the modulating signal or information signal.   Let's see why.", "The sidebands around a carrier frequency are produced by the modulating signal or information signal. Let's see why."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Up to this point you may be thinking that an AM signal is composed of two completely different signals - the carrier and modulating  signal.", "Up to this point you may be thinking that an AM signal is composed of two completely different signals - the carrier and modulating signal."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["Actually, the AM signal is one signal produced by the carrier and modulating signal.   It is a complex waveform.", "Actually, the AM signal is one signal produced by the carrier and modulating signal. It is a complex waveform."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["If you used a spectrum analyzer to find the frequencies that make up the AM signal, you would find the carrier signal and the sidebands, not the carrier signal and modulating signals!"], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["For example, if a 600 kHz carrier signal is amplitude modulated with a 10 kHz information signal, the frequencies that make up the AM waveform are 590 kHz, 600 kHz and 610 kHz.  They are not 600 kHz and 10 kHz.", "For example, if a 600 kHz carrier signal is amplitude modulated with a 10 kHz information signal, the frequencies that make up the AM waveform are 590 kHz, 600 kHz and 610 kHz. They are not 600 kHz and 10 kHz."], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["The frequencies are the carrier signal, \u0083c, at 600 kHz and the sideband frequencies of 590 and 610 kHz.", "c, at 600 kHz and the sideband frequencies of 590 and 610 kHz."], "jumps": ["P1400", "P1350"]}, {"id": "P1400", "text": ["The 590 kHz sideband is called the Lower Sideband because it is below the carrier frequency."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The 610 kHz sideband is called the Upper Sideband because it is above the carrier frequency."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["The sideband frequencies are calculated by:", "The sideband frequencies are calculated by:................", "max = Highest Modulation Frequency or Bandwidth"], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["Sideband frequencies are very important in AM communication systems, they determine the spacing between different AM stations or channels."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The AM radio band uses 10 kHz spacing between stations.   If the full bandwidth of a 600 kHz carrier signal is used, the sidebands would interfere with stations at 590 and 610 kHz.", "The AM radio band uses 10 kHz spacing between stations. If the full bandwidth of a 600 kHz carrier signal is used, the sidebands would interfere with stations at 590 and 610 kHz.", "50 12 kHz or Bandwidth", "max 600 kHz - 12 kHz 588 kHz", "max 600 kHz + 12 kHz 612 kHz"], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["This is why AM stations are limited to bandwidths of 5 kHz.  This produces sidebands of 595 and 605 kHz for a 600 kHz carrier        frequency - no interference of adjacent channels.", "This is why AM stations are limited to bandwidths of 5 kHz. This produces sidebands of 595 and 605 kHz for a 600 kHz carrier frequency - no interference of adjacent channels.", "max = 600 - 5 = 595 kHzzzzz kHz", "max = 600 kHz + 5 kHz = 605 kHz-"], "jumps": ["P1600", "P1440"]}, {"id": "P1460", "text": ["What are the sideband frequencies for a 1000 kHz carrier signal modulated with a 15 kHz information signal?"], "jumps": ["P1600", "P1465"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["985 kHz is the lower sideband frequency.   Sidebands have two frequencies, upper and lower.", "985 kHz is the lower sideband frequency. Sidebands have two frequencies, upper and lower."], "jumps": []}, {"id": "P1463", "text": ["1015 is the upper sideband frequency.   Sidebands have two frequencies, upper and lower.", "1015 is the upper sideband frequency. Sidebands have two frequencies, upper and lower....."], "jumps": []}, {"id": "P1465", "text": ["max y or Bandwidth", "SIDEBAND FREQUENCIES - Use the formulas to calculate the upper and lower sideband frequencies."], "jumps": []}, {"id": "P1470", "text": ["PERCENT MODULATION\nPercent modulation is the amount the carrier signal is modulated and is expressed as a percent.", "PERCENT MODULATION Percent modulation is the amount the carrier signal is modulated and is expressed as a percent."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Percent Modulation is an expression of the amount of power in the information signal."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Modulation levels normally range from 0% to 100%.   Where 0% is no modulation and 100% is full modulation.", "Modulation levels normally range from 0% to 100%. Where 0% is no modulation and 100% is full modulation."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The higher the percent modulation or level, the more power in the information signal."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["Modulation over 100% does not increase power and causes distortion in the information signal."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Percent modulation is calculated by the following formula: \n\n\n% Modulation =                                x 100", "Percent modulation is calculated by the following formula: % Modulation = x 100"], "jumps": ["P1525", "P1510"]}, {"id": "P1525", "text": ["Where Emax is the maximum peak to peak voltage.   Emin is the minimum peak to peak voltage.", "Where Emax is the maximum peak to peak voltage. Emin is the minimum peak to peak voltage."], "jumps": ["P1530", "P1520"]}, {"id": "P1530", "text": ["For example, the percent modulation of this AM waveform is 33.3%. \n\n% Modulation =                                x 100", "For example, the percent modulation of this AM waveform is 33.3%. % Modulation = x 100", "33.3 % = x 100"], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["What is the percent modulation for this AM waveform?", "What is the percent modulation for this AM waveform?......."], "jumps": ["P1520", "P1545"]}, {"id": "P1541", "text": [], "jumps": []}, {"id": "P1542", "text": ["20% modulation is calculated if you use half of the Emax value, remember, Emax is peak to peak voltage."], "jumps": []}, {"id": "P1543", "text": ["71.4% modulation is calculated if you use half of the Emin value, remember, Emin is peak to peak voltage."], "jumps": []}, {"id": "P1545", "text": ["% Modulation = x 100", "MODULATION INDEX - Use the following formula to calculate the percent modulation."], "jumps": []}, {"id": "P1550", "text": ["NOISE Noise is a limiting factor in a communications system."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["Noise is variations in voltage or current no matter if produced by atmospheric conditions or by thermal noise."], "jumps": ["P1570", "P1550"]}, {"id": "P1562", "text": ["Noise is variations in voltage or current no matter if produced by atmospheric conditions or by thermal noise."], "jumps": ["P1570", "P1550"]}, {"id": "P1565", "text": ["THERMAL NOISE - Thermal noise is caused by temperature variations in electronic components. At any temperature above absolute zero, electrons exhibit random motion. The random motion results in the generation of voltages or currents which cause noise."], "jumps": []}, {"id": "P1570", "text": ["These variations in voltage and current are amplitude variations. Of course any amplitude variation in an AM signal is processed as information."], "jumps": ["P1580", "P1562"]}, {"id": "P1580", "text": ["Consequently, noise in an AM signal can not be eliminated. Circuits may be designed to reduce noise but, can not eliminate noise altogether."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["You probably have noticed that AM stations are noisier than FM stations.   If you get a chance, compare an AM station to an FM station.", "You probably have noticed that AM stations are noisier than FM stations. If you get a chance, compare an AM station to an FM station."], "jumps": ["P1910", "P1570"]}, {"id": "P1595", "text": ["FM - FM stands for frequency modulation. The information signal is contained in frequency variations. Since noise affects signal amplitude, it has practically no effect on FM signals."], "jumps": []}, {"id": "P1600", "text": ["The sideband frequencies also produce a bandwidth for the AM signal."], "jumps": ["P1610", "P1450"]}, {"id": "P1610", "text": ["As shown, a 10 kHz modulating signal produces sideband frequencies of 590 and 610 kHz, a bandwidth of 20 kHz."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["This sideband bandwidth (20kHz) is twice the bandwidth of the modulating signal (10kHz)."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["The bandwidth of the AM signal must be considered when designing AM communication systems."], "jumps": ["P1460", "P1600"]}, {"id": "P1910", "text": ["This completes the information on AMPLITUDE MODULATION.", "This completes the information on AMPLITUDE MODULATION....."], "jumps": ["P1001", "P1590"]}, {"id": "P1920", "text": ["1.   Amplitude modulation is a signal processing technique that           modifies a carrier signal by an information signal.", "1. Amplitude modulation is a signal processing technique that modifies a carrier signal by an information signal."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The transmitter signal processing changes the amplitude of a       constant level carrier signal according to the amplitude of               an information signal.", "2. The transmitter signal processing changes the amplitude of a constant level carrier signal according to the amplitude of an information signal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The receiver signal processing circuits pick up the AM signal         through a tuning process and the information signal is                     recovered.", "3. The receiver signal proce let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
