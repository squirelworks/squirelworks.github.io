;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe a typical closed loop feedback controlled motor system. w Discuss closed loop systems (simple block diagrams)."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will be introduced to feedback control of DC motors."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["You will learn how feedback controls are used and why."], "jumps": ["P400", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on FEEDBACK CONTROL OF DC MOTORS....................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Most motors are required to deliver a constant output RPM, regardless of shaft load."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["A loaded DC motor exhibits a reduced output of RPM."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["A loaded motor produces more torque and less CEMF.........."], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["To maintain a steady output RPM, the loaded DC motor must have an increased input voltage."], "jumps": ["P1040", "P1052"]}, {"id": "P1052", "text": ["If the load decreases, the input voltage must be reduced to keep the RPM constant."], "jumps": ["P1050", "P1054"]}, {"id": "P1054", "text": ["In other words, a changing load on a DC motor requires a changing input voltage to keep RPM constant."], "jumps": ["P1050", "P1060"]}, {"id": "P1060", "text": ["How is a changing input voltage sent to the motor?........."], "jumps": ["P1050", "P1070"]}, {"id": "P1070", "text": ["One method is to use a time control circuit................"], "jumps": ["P1060", "P1080"]}, {"id": "P1080", "text": ["This requires you to adjust the circuit as the load changes."], "jumps": ["P1070", "P1082"]}, {"id": "P1082", "text": ["The process is simple for human control and is called a feedback system."], "jumps": ["P1070", "P1090"]}, {"id": "P1090", "text": ["The block diagram shows a typical human feedback system...."], "jumps": ["P1082", "P1100"]}, {"id": "P1100", "text": ["A tachometer might be used to display motor RPM. nsor (Tachometer)"], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["You could then decide if the motor RPM is correct, too slow, or too fast."], "jumps": ["P1090", "P1120"]}, {"id": "P1120", "text": ["If the motor's RPM is too slow or too fast, adjustments to the speed control circuit are made."], "jumps": ["P1090", "P1130"]}, {"id": "P1130", "text": ["The changed voltage output of the speed control circuit causes the motors RPM to change."], "jumps": ["P1090", "P1132"]}, {"id": "P1132", "text": ["Consequently, the sensor indicates a different RPM and you observe the results and make additional adjustments if necessary."], "jumps": ["P1090", "P1134"]}, {"id": "P1134", "text": ["The process continues until the motor is turned off."], "jumps": ["P1090", "P1136"]}, {"id": "P1136", "text": ["The system is a feedback system since the output from the motor has an effect on its input."], "jumps": ["P1090", "P1140"]}, {"id": "P1140", "text": ["This system is inefficient since a person is needed to make the feedback system work."], "jumps": ["P1090", "P1150"]}, {"id": "P1150", "text": ["A complete electronic feedback control circuit is much more desirable."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["In the \"human operator\" feedback circuit, the operator receives direct input from _______"], "jumps": ["P1140"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The motor's output signal is received by the operator indirectly."], "jumps": []}, {"id": "P1163", "text": ["The speed control circuitry receives an input from the operator."], "jumps": []}, {"id": "P1170", "text": ["An electronic feedback system eliminates the human, but still operates the same."], "jumps": ["P1160", "P1180"]}, {"id": "P1180", "text": ["An electronic comparator is used in place of a human operator."], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["The comparator \"compares\" the feedback signal from the motor to some predetermined base motor speed."], "jumps": ["P1170", "P1200"]}, {"id": "P1200", "text": ["If the feedback signal is larger than the base speed signal, the comparator sends a negative signal to the motor drive circuit."], "jumps": ["P1170", "P1210"]}, {"id": "P1210", "text": ["This negative signal tells the motor drive circuit to reduce the input signal to the motor, slowing the motor down."], "jumps": ["P1200", "P1220"]}, {"id": "P1220", "text": ["If the feedback signal is smaller than the base speed signal, the comparator sends a positive signal to the motor drive circuit."], "jumps": ["P1210", "P1230"]}, {"id": "P1230", "text": ["This positive signal tells the motor drive circuit to increase the input signal to the motor, speeding the motor up."], "jumps": ["P1220", "P1233"]}, {"id": "P1233", "text": ["1. 500 RPM 2. 400 RPM 3. 600 RPM 500 RPM", "The speed of the motor is held constant without human intervention. DC Motor Sensor 1. No Charge 1. 0 (Tachometer) 1. 500 RPM 2. Increase 2. + 2. 400 RPM 3. Decrease 3. - 3. 600 RPM Motor Drive Comparator 500 RPM Circuit"], "jumps": ["P1235", "P1230"]}, {"id": "P1235", "text": ["In the next lesson, you will learn the circuits associated with a feedback system."], "jumps": ["P1233", "P1240"]}, {"id": "P1240", "text": ["Which component in the electronic feedback system replaces the human operator in the human controlled feedback system?"], "jumps": ["P1233"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The DC motor is common to both types of controllers........"], "jumps": []}, {"id": "P1243", "text": ["The motor drive circuit is the same as the speed control circuitry."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THEORY OF OPERATION......"], "jumps": ["P1240", "P1001"]}, {"id": "P1920", "text": ["1. Feedback circuits are designed to maintain a constant DC motor RPM regardless of motor shaft load."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. Feedback circuits utilize the motors output to determine the input voltage to the motor."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. A human controlled feedback system utilizes a person making decisions."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. An electronic feedback system incorporates an electronic comparator in place of a human operator."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. The comparator \"compares\" the motor's feedback signal to a predetermined base motor speed."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. The comparator sends a \"weighted\" signal to the motor drive circuit."], "jumps": ["P1950", "P1980"]}, {"id": "P1980", "text": ["7. The motor drive circuit controls the input signal to the DC motor."], "jumps": ["P1950", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["In a \"human o let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
