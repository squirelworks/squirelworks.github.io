and additional...\" P1250, chg'd text from \"Special packaging materials are required to ensure ESDs, whether individual device, card module or electronic box assembly are protected during storage and transportation.\" to \"During storage and transportation safeguarding ESDs are accomplished using special packaging materials wether they are individual devices, card modules or electronic box assemblies.\" P10218, chg'd \"?\" to \"!\" - Dean", "of Conversion. alexis 01-10-03 P10212 deleted the word \"are\" from answer C. frieda 04-03-03 P1090, changed \"...distribute more easily...\" to \"...distribute more easily...\". P1230 and P1970, changed in ATTENTION graphics box \"Ovserve\" to \"Observe\" -Dean 06-09-03 P1370, HL'd \" 2. ...anti-static nylon garments...\" in yellow - Dean", "Nida Corporation - Electrostatic Sensitive Devices"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ELECTROSTATIC SENSITIVE DEVICESfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Define an electrostatic sensitive device. w Describe the sources of electrostatic discharge and list its hazards to electronic components. w Identify the static producing materials in the work area. w Explain the principles of static control and methods employed in developing static control facilities. w Describe the special handling, identification, packaging and protection requirements for electrostatic sensitive devices."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P1173", "text": ["Digital electronics has enabled the computer to become an essential part of nearly every person's daily life. There seems to be no limit to the potential benefits derived from semiconductor devices.", "Speed of seperation has a direct relationship on the degree of static charge between materials.The following is a list of materials that influence a degree of static charge.", "Digital electronics has enabled the computer to become an essential part of nearly every person's daily life. There seems to be no limit to the potential benefits derived from semiconductor devices.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Thin film technology has developed faster integrated circuit chips containing thousands of components that operate at very low voltage and current levels.", "Today's integrated circuit chips operating at very low current levels are susceptible to electrostatic SHOCK."], "jumps": ["P430", "P410", "P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on ELECTROSTATIC SENSITIVE DEVICES..................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Microelectronic devices (ICs) require very small levels of voltage and current. It is, therefore, necessary to observe strict precautions to avoid damage or destruction when carrying out testing and troubleshooting procedures.", "Microelectronic devices (ICs) require very small levels of voltage and current. It is, therefore, necessary to observe strict precautions to avoid damage or destruction when carrying out testing and troubleshooting procedures.."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["Electrostatic Sensitive Devices are components whose circuits can, by the nature of their construction, be damaged or destroyed by static electricity discharges resulting simply by improper handling procedures.", "Electrostatic Sensitive Devices are components whose circuits can, by the nature of their construction, be damaged or destroyed by static electricity discharges resulting simply by improper handling procedures..."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["Each Electrostatic Sensitive Device (ESD), has a different sensitivity to static electricity rating, as depicted in the following table.", "Sensitivities to Static Electricity Electrostatic discharge range where damage can occur Device Volts Complementary metal oxide silicon (CMOS) 250 - 2k Field effect transistor (MOSFET) 100 - 200 (JFET) 140 - 10k Schottky diode, TTL 300 - 2.5k Bipolar transistor 380 - 7k Precision thin-film resistor 150 - 11k Emitter coupled logic (ECL) 50000000000000"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Static electricity is electricity at rest and is a phenomenon which everyone has experienced at one time. The effect occurs under certain conditions when the body becomes positively or negatively charged.", "Static electricity is electricity at rest and is a phenomenon which everyone has experienced at one time. The effect occurs under certain conditions when the body becomes positively or negatively charged..."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The body remains charged until it comes in contact with a substance of the opposite polarity. The effect of the discharge is greater if just the tip of the fingernail slowly touches the substance.", "The body remains charged until it comes in contact with a substance of the opposite polarity. The effect of the discharge is greater if just the tip of the fingernail slowly touches the substance..."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["If the potential difference between the substance is great enough, the electrons jumping from the negative charge to the positive charge produce a sudden surge of current (electric shock) across the gap.", "The effect is similar to that of a capacitor, the substance and the body are the plates and the air is the dielectric. As a charge discharges into a conductor, the peak voltage and current occur extremely fast; picoseconds or nanoseconds.", "If the potential difference between the substance is great enough, the electrons jumping from the negative charge to the positive charge produce a sudden surge of current (electric shock) across the gap...", "The effect is similar to that of a capacitor, the substance and the body are the plates and the air is the dielectric. As a charge discharges into a conductor, the peak voltage and current occur extremely fast; picoseconds or nanoseconds...", "Finger - Negative Charge"], "jumps": ["P1070", "P1040", "P1080"]}, {"id": "P1080", "text": ["The study of the formation of a static charge is called \"Triboelectricity\" and is derived from the Greek word tribo meaning the action of rubbing. Triboelectricity is electricity generated through rubbing.", "The study of the formation of a static charge is called \"Triboelectricity\" and is derived from the Greek word tribo meaning the action of rubbing. Triboelectricity is electricity generated through rubbing..."], "jumps": ["P1090", "P1070"]}, {"id": "PINFO", "text": ["07-29-99 Converted to new question format. jay 08-05-99 Trainer code N/A. debbie 08-12-99 Test and cleanup. debbie 08-16-99 Steps 1 - 9. debbie 01-19-00 Changed P10229 incorrect answer plus information was not covered in lesson. debbie 07-14-00 Converted to ToolBook 7.1 format. jay 09-20-00 P10224 - changed punctuation on answers b and c. lydia 10-27-00 Add Monitor Pro code to quiz pages. jay 11-30-00 Added HelpPage information and new random gen. script. -Penny 03-20-01 P10225, changed question from \"ESD devices must be repacked in their containers exactly as previously packed prior to transportation.\" to \"Individual devices and card modules should be packaged in a quasi- conductive material.\" HelpPage changed to P1260. - Penny 04-26-01 P10217, changed punctuation of question stem. \"?\" to \".\" -GLK & Penny 07-19-01 Converted to ToolBook 8.1 format. jay 09-20-01 P10212, changed \"they are normally operate at very low current and voltage levels.\" to \"they normally operate at very low current and voltage levels.\" P10221, changed \"Tools work surfaces and floors must be grounded.\" to \"Tools, work surfaces, and floors must be grounded.\" -Penny 01-14-02 Converted to Phase II format. jay 02-14-02 Review of Conversion. alexis 01-10-03 P10212 deleted the word \"are\" from answer C. frieda 04-03-03 P1090, changed \"...distribute more easily...\" to \"...distribute more easily...\". P1230 and P1970, changed in ATTENTION graphics box \"Ovserve\" to \"Observe\" -Dean 06-09-03 P1370, HL'd \" 2. ...anti-static nylon garments...\" in yellow - Dean 08-25-03 P410, chg'd text from \"persons\" to \"person's\" P1190, chg'd text from \"...on its own, however, static\" to \"...on its own. however, static...\" P1200, chg'd text from \"...into the devices, however, this...\" to \"...into the devices. However, this...\" P1240, chg'd text from \"...and maintenance and additional...\" to \"...and maintenance, and additional...\" P1250, chg'd text from \"Special packaging materials are required to ensure ESDs, whether individual device, card module or electronic box assembly are protected during storage and transportation.\" to \"During storage and transportation safeguarding ESDs are accomplished using special packaging materials wether they are individual devices, card modules or electronic box assemblies.\" P10218, chg'd \"?\" to \"!\" - Dean 09-02-03 P1170, changed scripting for \"Speed of Seperation\" taking it to new page P1173, Text says \"Speed of seperation has a direct relationship on the degree of static charge between materials.\" - Dean", "07-29-99 Converted to new question format. jay 08-05-99 Trainer code N/A. debbie 08-12-99 Test and cleanup. debbie 08-16-99 Steps 1 - 9. debbie 01-19-00 Changed P10229 incorrect answer plus information was not covered in lesson. debbie 07-14-00 Converted to ToolBook 7.1 format. jay 09-20-00 P10224 - changed punctuation on answers b and c. lydia 10-27-00 Add Monitor Pro code to quiz pages. jay 11-30-00 Added HelpPage information and new random gen. script. -Penny 03-20-01 P10225, changed question from \"ESD devices must be repacked in their containers exactly as previously packed prior to transportation.\" to \"Individual devices and card modules should be packaged in a quasi- conductive material.\" HelpPage changed to P1260. - Penny 04-26-01 P10217, changed punctuation of question stem. \"?\" to \".\" -GLK & Penny 07-19-01 Converted to ToolBook 8.1 format. jay 09-20-01 P10212, changed \"they are normally operate at very low current and voltage levels.\" to \"they normally operate at very low current and voltage levels.\" P10221, changed \"Tools work surfaces and floors must be grounded.\" to \"Tools, work surfaces, and floors must be grounded.\" -Penny 01-14-02 Converted to Phase II format. jay 02-14-02 Review of Conversion. alexis 01-10-03 P10212 deleted the word \"are\" from answer C. frieda 04-03-03 P1090, changed \"...distribute more easily...\" to \"...distribute more easily...\". P1230 and P1970, changed in ATTENTION graphics box \"Ovserve\" to \"Observe\" -Dean 06-09-03 P1370, HL'd \" 2. ...anti-static nylon garments...\" in yellow - Dean 08-25-03 P410, chg'd text from \"persons\" to \"person's\" P1190, chg'd text from \"...on its own, however, static\" to \"...on its own. however, static...\" P1200, chg'd text from \"...into the devices, however, this...\" to \"...into the devices. However, this...\" P1240, chg'd text from \"...and maintenance and additional...\" to \"...and maintenance, and additional...\" P1250, chg'd text from \"Special packaging materials are required to ensure ESDs, whether individual device, card module or electronic box assembly are protected during storage and transportation.\" to \"During storage and transportation safeguarding ESDs are accomplished using special packaging materials wether they are individual devices, card modules or electronic box assemblies.\" P10218, chg'd \"?\" to \"!\" - Dean"], "jumps": []}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1220", "text": ["Proper precautions and procedures should be followed at all stages of manufacture, storage, transportation, testing, installation, and removal to prevent ESD damage."], "jumps": ["P1230", "P1210"]}, {"id": "P1110", "text": ["Static electricity is generated by two unlike materials rubbed together and then separated. The conductivity of the material determines if the potential equalizes before the separation is complete.", "Static electricity is generated by two unlike materials rubbed together and then separated. The conductivity of the material determines if the potential equalizes before the separation is complete..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The good conductors (metal) allow the electrons to return to the atom during separation, while in poor conductors (humans, cloth, shoes), the electrons are trapped in the material causing a static charge to remain.", "The good conductors (metal) allow the electrons to return to the atom during separation, while in poor conductors (humans, cloth, shoes), the electrons are trapped in the material causing a static charge to remain..."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Characteristics of the material, speed of separation, area of contact and relative humidity have an affect on the magnitude of the static charge. Walking across a carpet in 10 percent humidity could build a charge of over 30,000 volts.", "Characteristics of the material, speed of separation, area of contact and relative humidity have an affect on the magnitude of the static charge. Walking across a carpet in 10 percent humidity could build a charge of over 30,000 volts..."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["A static charge of 30,000 volts would surely damage every component listed in our table.", "Sensitivities to Static Electricity Electrostatic discharge range where damage can occur Device Volts Complementary metal oxide silicon (CMOS) 250 - 2k Field effect transistor (MOSFET) 100 - 200 (JFET) 140 - 10k Schottky diode, TTL 300 - 2.5k Bipolar transistor 380 - 7k Precision thin-film resistor 150 - 11k Emitter coupled logic (ECL) 50000000000000"], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The following table depicts the amount of charge that can build up on the human body under certain conditions. Humidity and skin resistance will vary these figures dramatically.", "Typical Static Voltages Relative humidity of air Low 10 - 20% High 65 - 90% Situation Volts Volts Walking over vinyl floor 12,000 250 Walking across a carpet 35,000 1,500 Technician at a bench 6,000 100 Vinyl envelopes containing work instructions 7,000 60000"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The following, is a list of materials that produce an electrostatic charge when rubbed together, arranged in an order that a material closer to the top will have a more positive charge than the material below it. For example: Asbestos and Polyethylene rubbed together would generate the greatest static charge.", "The following, is a list of materials that produce an electrostatic charge when rubbed together, arranged in an order that a material closer to the top will have a more positive charge than the material below it. For example: Asbestos and Polyethylene rubbed together would generate the greatest static charge...", "1. Asbestos 2. Glass 3. Human Hair 4. Nylon 5. Lead 6. Silk 7. Cotton 8. Steel 9. Acetate Rayon 10. Acrylic Fibre 11. Vinylidene Chloride Film 12. Polyethylene"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Which of the following will not influence the degree of static charge?"], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1950", "text": ["5.  Listed are materials that produce an electrostatic charge when\n     rubbed together. Materials closer to the top of the list have a\n     more positive charge than a material listed below it. For\n     example: Asbestos and Polyethylene rubbed together would\n     generate the greatest static charge.", "5. Listed are materials that produce an electrostatic charge when rubbed together. Materials closer to the top of the list have a more positive charge than a material listed below it. For example: Asbestos and Polyethylene rubbed together would generate the greatest static charge..", "1. Asbestos 2. Glass 3. Human Hair 4. Nylon 5. Lead 6. Silk 7. Cotton 8. Steel 9. Acetate Rayon 10. Acrylic Fiber 11. Vinylidene Chloride Film 12. Polyethylene"], "jumps": ["P1960", "P1940"]}, {"id": "P1180", "text": ["Which material will allow the built up static charge to equalize before separation?"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["Good conductors of electricity allow the static potential to equalize before separation."], "jumps": []}, {"id": "P1190", "text": ["Static electricity will eventually equalize on its own. However, static is an ever present hazard to be guarded against whenever handling microelectronic devices.", "Static electricity will eventually equalize on its own. However, static is an ever present hazard to be guarded against whenever handling microelectronic devices.."], "jumps": ["P1200", "P1180"]}, {"id": "P1930", "text": ["3.  The two basic charged components of an atom are the\n     electron and the proton. The positive proton is a permanent\n     part of the atom in solid matter and will move the matter. The\n     negative electron is free to move from one atom to another as\n     long as some energy is expended to move it.", "3. The two basic charged components of an atom are the electron and the proton. The positive proton is a permanent part of the atom in solid matter and will move the matter. The negative electron is free to move from one atom to another as long as some energy is expended to move it."], "jumps": ["P1940", "P1925"]}, {"id": "P1210", "text": ["Enclosures are removed during troubleshooting, testing, and maintenance procedures making the ESDs susceptible to static discharge unless proper precautions and procedures are followed.", "Enclosures are removed during troubleshooting, testing, and maintenance procedures making the ESDs susceptible to static discharge unless proper precautions and procedures are followed..."], "jumps": ["P1220", "P1190"]}, {"id": "P1230", "text": ["Standard identification decals are used to mark components, printed circuit cards, modules, equipment enclosures and packaging which may utilize ESDs in the circuitry.", "ATTENTION Observe precautions for handling electrostatic sensitive devicess", "Do not open or handle device except in static safe environment. Contact signee for instructions prior to opening protective bag or container.", "CAUTION This assembly contains electrostatic sensitive devicesve deviceses", "CAUTION Contents subject to damage by static electricity. DO NOT OPEN Except at approved static free work station.", "CAUTION Do not ship or store near strong electrostatic, electromagnetic, magnetic, or radioactive fields."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Connectors and receptacles should be covered during storage, transportation and maintenance, and additional decals should be affixed near the connector as a warning not to touch the connector pins.", "Connectors and receptacles should be covered during storage, transportation and maintenance, and additional decals should be affixed near the connector as a warning not to touch the connector pins.."], "jumps": ["P1250", "P1230"]}, {"id": "P1292", "text": ["Conductive materials can develop a static potential but it is equalized prior to separation."], "jumps": []}, {"id": "P1250", "text": ["During storage and transportation safeguarding ESDs are accomplished using special packaging materials wether they are individual devices, card modules or electronic box assemblies."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Individual devices and card modules should be packaged in a quasi-conductive material. The material resistivity should be too high to conduct normal electrical current flow, but low enough to bleed off electrostatic charges.", "Individual devices and card modules should be packaged in a quasi-conductive material. The material resistivity should be too high to conduct normal electrical current flow, but low enough to bleed off electrostatic charges. Typical Materials 1. Polyolefin film impregnated carbon. 2. Polyethylene resin impregnate with an anti-static substance (\"pink poly\").3. Aluminum layer sandwiched by an outer layer of anti-static treated spin-bonded polyolefin and an inner layer of \"pink poly\".4. Cushion-pack bags made from \"pink poly\" foam material...", "1. Polyolefin film impregnated carbon. 2. Polyethylene resin impregnate with an anti-static substance (\"pink poly\"). 3. Aluminum layer sandwiched by an outer layer of anti-static treated spin-bonded polyolefin and an inner layer of \"pink poly\". 4. Cushion-pack bags made from \"pink poly\" foam material.", "Typical Materials impregnated carbon. 2. Polyethylene resin impregnate with an anti-static substance (\"pink poly\"). 3. Aluminum layer sandwiched by an outer layer of anti-static treated spin-bonded polyolefin and an inner layer of \"pink poly\". 4. Cushion-pack bags made from \"pink poly\" foam material."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Printed circuit boards (PCB) and card modules with edge connectors used specially formed strips called \"shunts\" to keep all the pins at the same potential and protect them against physical damage.", "Printed circuit boards (PCB) and card modules with edge connectors used specially formed strips called \"shunts\" to keep all the pins at the same potential and protect them against physical damage..."], "jumps": ["P1260", "PCB"]}, {"id": "P1280", "text": ["Complete electronic box assemblies use covers and caps made from a conductive material to protect receptacles. Some non-conductive covers sprayed with anti-static conductive film are also used.", "Complete electronic box assemblies use covers and caps made from a conductive material to protect receptacles. Some non-conductive covers sprayed with anti-static conductive film are also used..."], "jumps": ["P1290", "P1270"]}, {"id": "P1350", "text": ["Adhesive tape should not be used for sealing a bag as the removal of the tape will generate static electricity."], "jumps": ["P1360", "P1340"]}, {"id": "P1300", "text": ["Static-free packing is of little use if the protected contents are not removed into a static-free environment. Static-free work stations within special handling areas are required for certain ESDs.", "CAUTION Contents subject to damage by static electricity. DO NOT OPEN Except at approved static free work station."], "jumps": ["P1310", "P1290"]}, {"id": "P1290", "text": ["Why are quasi-conductive materials used to package ESDs?", "Why are quasi-conductive materials used to package ESDs?...", "Conductive materials prevent a static charge from forming", "Conductive materials allow the static potential to equalize before separation"], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1293", "text": ["The strength of the material doesn't eliminate the static potential developed on its surface."], "jumps": []}, {"id": "P400", "text": ["This lesson introduces you to the sources of damaging electrostatic discharge, special handling, identification, packaging and principle static control methods used to prevent the damage of electrostatic sensitive devices.", "This lesson introduces you to the sources of damaging electrostatic discharge, special handling, identification, packaging and principle static control methods used to prevent the damage of electrostatic sensitive devices..."], "jumps": ["P410", "P300"]}, {"id": "P1310", "text": ["A static-free work station consists of conductive work surfaces connected to a grounded conductive floor surface and a stool with a conductive seat cover. The operator wears grounded strap around his/her bare wrist when handling ESDs.", "A static-free work station consists of conductive work surfaces connected to a grounded conductive floor surface and a stool with a conductive seat cover. The operator wears grounded strap around his/her bare wrist when handling ESDs..."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The work station is also equipped with an ionizer to generate positive and negative ions to neutralize any random charges on devices or assemblies. Test specification and assembly direction sheets are contained in anti-static envelopes.", "The work station is also equipped with an ionizer to generate positive and negative ions to neutralize any random charges on devices or assemblies. Test specification and assembly direction sheets are contained in anti-static envelopes..."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["Technicians performing maintenance on equipment containing ESDs outside of special handling areas should follow appropriate precautions and procedures."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Electrical power sources should be isolated and a grounded wrist strap should be worn by the technician prior to removing card modules containing ESDs. Card modules should be immediately placed in an appropriate bag, and identified by a decal.", "Electrical power sources should be isolated and a grounded wrist strap should be worn by the technician prior to removing card modules containing ESDs. Card modules should be immediately placed in an appropriate bag, and identified by a decal..."], "jumps": ["P1350", "P1330"]}, {"id": "P1360", "text": ["Technicians removing complete electronic box assemblies do not require grounded wrist straps, however, care should be taken when removing or replacing anti-static connector covers and caps.", "Technicians removing complete electronic box assemblies do not require grounded wrist straps, however, care should be taken when removing or replacing anti-static connector covers and caps..."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The following maintenance practices should be followed to protect ESDs.", "The following maintenance practices should be followed to protect ESDs. 1. All repairs should be performed in a dust-free area. 2. Wear anti-static nylon garments when repairing or handling ESDs.3. Ensure personnel and tools are grounded before handling ESDs.4. Use conductive containers with conductive covers during transportation of ESDs.5. After removal from containers, place devices on grounded conductive surfaces.6. Handle devices only when necessary, first grasping the ceramic body or metal can before touching individual leads.", "1. All repairs should be performed in a dust-free area. 2. Wear anti-static nylon garments when repairing or handling ESDs. 3. Ensure personnel and tools are grounded before handling ESDs. 4. Use conductive containers with conductive covers during transportation of ESDs. 5. After removal from containers, place devices on grounded conductive surfaces. 6. Handle devices only when necessary, first grasping the ceramic body or metal can before touching individual leads."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Continuity checks should be routinely performed on wrist straps, conductive surfaces, tools, and floor surfaces to ensure continuous static draining."], "jumps": ["P1390", "P1370"]}, {"id": "P1910", "text": ["This completes the information on ELECTROSTATIC SENSITIVE DEVICES."], "jumps": ["P1001", "P1390"]}, {"id": "P1390", "text": ["How can a technician identify a component containing an ESD device?", "Experienced technicians know which components contain ESDs", "ESDs can only be identified by referring to the maintenance manuals", "Identification decals are placed on containers, assemblies, and modules containing ESDs"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["Experienced technicians check maintenance manuals, and look for proper identification decals."], "jumps": []}, {"id": "P1393", "text": ["Maintenance manuals aren't the only source of ESD identification."], "jumps": []}, {"id": "P1172", "text": ["The following is a list of materials that influence a degree of static charge.", "1. Asbestos 2. Glass 3. Human Hair 4. Nylon 5. Lead 6. Silk 7. Cotton 8. Steel 9. Acetate Rayon 10. Acrylic Fibre 11. Vinylidene Chloride Film 12. Polyethylene"], "jumps": []}, {"id": "P1920", "text": ["1.  Microelectronic devices (ICs) require very small amounts of\n     voltage and current. Therefore, it is necessary to observe\n     strict precautions to avoid damage or destruction when\n     carrying out testing and troubleshooting procedures.", "1. Microelectronic devices (ICs) require very small amounts of voltage and current. Therefore, it is necessary to observe strict precautions to avoid damage or destruction when carrying out testing and troubleshooting procedures.."], "jumps": ["P1925", "P1001"]}, {"id": "P1925", "text": ["2.  Each Electrostatic Sensitive Device (ESD), has a different\n     sensitivity to static electricity rating, as depicted in the\n     following table.", "2. Each Electrostatic Sensitive Device (ESD), has a different sensitivity to static electricity rating, as depicted in the following table..", "Sensitivities to Static Electricity Electrostatic discharge range where damage can occur Device Volts Complementary metal oxide silicon (CMOS) 250 - 2k Field effect transistor (MOSFET) 100 - 200 (JFET) 140 - 10k Schottky diode, TTL 300 - 2.5k Bipolar transistor 380 - 7k Precision thin-film resistor 150 - 11k Emitter coupled logic (ECL) 50000000000000"], "jumps": ["P1920"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P1090", "text": ["The action of shoes rubbing against a newly laid carpet or a body sliding out of a vinyl car seat creates a charge which is coupled to the body. As humidity decreases, dry ambient air inhibitsharges distribute more easily and potentials tend to increase.", "The action of shoes rubbing against a newly laid carpet or a body sliding out of a vinyl car seat creates a charge which is coupled to the body. As humidity decreases, charges distribute less easily and potentials tend to increase......................................."], "jumps": ["P1100", "P1080"]}, {"id": "P1940", "text": ["4.  The following table depicts the amount of charge that can\n     build up on the human body under certain conditions.\n     Humidity and skin resistance will vary these figures\n     dramatically.", "4. The following table depicts the amount of charge that can build up on the human body under certain conditions. Humidity and skin resistance will vary these figures dramatically..", "Typical Static Voltages Relative humidity of air Low 10 - 20% High 65 - 90% Situation Volts Volts Walking over vinyl floor 12,000 250 Walking across a carpet 35,000 1,500 Technician at a bench 6,000 100 Vinyl envelopes containing work instructions 7,000 60000"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["5.  Listed are materials that produce an electrostatic charge when\n     rubbed together. Materials closer to the top of the list have a\n     more positive charge than a material listed below it. For\n     example: Asbestos and Polyethylene rubbed together would\n     generate the greatest static charge.", "5. Listed are materials that produce an electrostatic charge when rubbed together. Materials closer to the top of the list have a more positive charge than a material listed below it. For example: Asbestos and Polyethylene rubbed together would generate the greatest static charge..", "1. Asbestos 2. Glass 3. Human Hair 4. Nylon 5. Lead 6. Silk 7. Cotton 8. Steel 9. Acetate Rayon 10. Acrylic Fibre 11. Vinylidene Chloride Film 12. Polyethylene"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["6.  Static electricity will eventually equalize on its own; however,\n     static is an ever present hazard to be guarded against\n     whenever handling microelectronic devices.", "6. Static electricity will eventually equalize on its own; however, static is an ever present hazard to be guarded against whenever handling microelectronic devices.."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["7.  Standard identification decals are used to mark components,\n     printed circuit cards, modules, equipment enclosures and\n     packaging which may utilize ESDs in the circuitry.", "7. Standard identification decals are used to mark components, printed circuit cards, modules, equipment enclosures and packaging which may utilize ESDs in the circuitry.", "ATTENTION Observe precautions for handling electrostatic sensitive devices", "Do not open or handle device except in static safe environment. Contact signee for instructions prior to opening protective bag or container.", "CAUTION This assembly contains electrostatic sensitive devicesve deviceses", "CAUTION Contents subject to damage by static electricity. DO NOT OPEN Except at approved static free work station.", "CAUTION Do not ship or store near strong electrostatic, electromagnetic, magnetic, or radioactive fields."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["8.  Individual devices and card modules should be packaged in a\n     quasi-conductive material. The material resistivity should be\n     too high to conduct normal electrical current flow, but low\n     enough to bleed off electrostatic charges.", "8. Individual devices and card modules should be packaged in a quasi-conductive material. The material resistivity should be too high to conduct normal electrical current flow, but low enough to bleed off electrostatic charges....", "1. Polyolefin film impregnated carbon. 2. Polyethylene resin impregnated with an anti-static substance (\"pink poly\"). 3. Aluminum layer sandwiched by an outer layer of anti-static treated spin-bonded polyolefin and an inner layer of \"pink poly\". 4. Cushion-pack bags made from \"pink poly\" foam material.....", "Typical Materials impregnated carbon. 2. Polyethylene resin impregnate with an anti-static substance (\"pink poly\"). 3. Aluminum layer sandwiched by an outer layer of anti-static treated spin-bonded polyolefin and an inner layer of \"pink poly\". 4. Cushion-pack bags made from \"pink poly\" foam material."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["9.  The following maintenance practices should be followed to\n     protect ESDs.", "9. The following maintenance practices should be followed to protect ESDs...", "1. All repairs should be performed in a dust-free area. 2. Wear anti-static nylon garments when repairing or handling ESDs. 3. Ensure personnel and tools are grounded before handling ESDs. 4. Use conductive containers with conductive covers during transportation of ESDs. 5. After removal from containers, place devices on grounded conductive surfaces. 6. Handle devices only when necessary, first grasping the ceramic body or metal can before touching individual leads."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.nu."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")", "Nida Corporation - Electrostatic Sensitive Devices"], "jumps": ["Post"]}, {"id": "P10210", "text": ["What does ESD stand for?fox land in when the brown dog chased him over the fence? X XXXX", "Electronic Servicing Deviced it is 10 point arial. This is the second line of text for the distractor. This is the thir let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
