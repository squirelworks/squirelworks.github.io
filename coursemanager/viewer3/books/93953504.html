d": "P420", "text": ["Overall operation of an RC Phase Shift oscillator is similar to the Hartley and Colpitts oscillators."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The feedback circuit, however, is completely different."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on RC PHASE SHIFT OSCILLATOR OPERATION..............."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P13130", "text": ["What is the calculated frequency using C1A?\nRound to two decimal places.", "What is the calculated frequency using C1A? Round to two decimal places.) in a variable.able.le."], "jumps": ["P13120", "P13132"]}, {"id": "P13131", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical RC Phase Shift oscillator.", "This is a typical RC Phase Shift oscillator................"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["It is identified as an RC Phase Shift oscillator by the components in the feedback circuit."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Notice the feedback circuit does not contain a tank circuit like the LC oscillator.  It is an RC oscillator.", "Notice the feedback circuit does not contain a tank circuit like the LC oscillator. It is an RC oscillator."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["To analyze circuit operation, divide the oscillator into its two circuits."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The amplifier circuit consists of two amplifiers: Q1 and Q2 and their associated components."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Q1 is the oscillator amplifier and Q2 is a buffer amplifier."], "jumps": ["P1080", "P1050"]}, {"id": "P1072", "text": ["Q1 is the oscillator amplifier and Q2 is a buffer amplifier."], "jumps": ["P1080", "P1050"]}, {"id": "P1075", "text": ["BUFFER AMPLIFIER - A buffer amplifier is placed between one stage of a circuit and another to isolate the first stage from the second."], "jumps": []}, {"id": "P1080", "text": ["Q1 and its associated components form a common emitter amplifier.  R3 and R4 develop fixed bias on the base of Q1.", "Q1 and its associated components form a common emitter amplifier. R3 and R4 develop fixed bias on the base of Q1."], "jumps": ["P1090", "P1072"]}, {"id": "P1090", "text": ["R5 along with Q2's input circuit form the collector load resistance."], "jumps": ["P1100", "P1072"]}, {"id": "P1100", "text": ["R6 and C4 provide self biasing.  Q1 is a class A amplifier.", "R6 and C4 provide self biasing. Q1 is a class A amplifier."], "jumps": ["P1110", "P1072"]}, {"id": "P1110", "text": ["Q2 and its associated components form a common collector (emitter follower) amplifier."], "jumps": ["P1120", "P1072"]}, {"id": "P1120", "text": ["This buffer amplifier increases the current,  not voltage, output from Q1's collector.  This prevents the load from affecting Q1's operation.", "This buffer amplifier increases the current, not voltage, output from Q1's collector. This prevents the load from affecting Q1's operation."], "jumps": ["P1130", "P1072"]}, {"id": "P1130", "text": ["Emitter followers have a voltage gain of 1 and no phase inversion.  The output waveform is identical to the input.", "Emitter followers have a voltage gain of 1 and no phase inversion. The output waveform is identical to the input."], "jumps": ["P1140", "P1072"]}, {"id": "P1140", "text": ["C5 is a coupling capacitor. Q2 is also a class A amplifier."], "jumps": ["P1150", "P1072"]}, {"id": "P1150", "text": ["Q1 output is routed through the feedback circuit to the base of Q1.   This produces oscillations at one particular frequency.", "Q1 output is routed through the feedback circuit to the base of Q1. This produces oscillations at one particular frequency."], "jumps": ["P1160", "P1072"]}, {"id": "P1160", "text": ["The feedback circuit consists of C1, R1, C2, R2, C3 and R3."], "jumps": ["P1170", "P1072"]}, {"id": "P1170", "text": ["These components determine the orks equal, what is the total phase shift of the collector signal after the second RC network?"], "jumps": ["P2302"]}, {"id": "P2391", "text": [], "jumps": []}, {"id": "P2392", "text": ["The collector signal is shifted a total of 60\u00ba after the first RC network.", "The collector signal is shifted a total of 60"], "jumps": []}, {"id": "P2393", "text": ["The collector signal is shifted a total of 180\u00ba after the third RC network.", "The collector signal is shifted a total of 180"], "jumps": []}, {"id": "P2400", "text": ["Remember, the normal operation of an RC Phase Shift oscillator is easily checked. Compare the calculated frequency to the measured frequency."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["Now that we have verified normal operation and observed the AC signals in the circuit, let's calculate and measure the DC operating voltages."], "jumps": []}, {"id": "P2420", "text": ["The DC operating voltages of Q1 are easily determined.  Let's calculate base voltage. \n\n                              Eb = ??      Ee = ??      Ec = ??", "The DC operating voltages of Q1 are easily determined. Let's calculate base voltage. Eb = ?? Ee = ?? Ec = ??"], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["R4 and R3 form a voltage divider.  Er3 is the base voltage of Q1. \n  \n                                          R3                    10k\n                             Eb =                x Vcc =           x 12 = 1 V\n                                      R3 + R4               110 k", "R4 and R3 form a voltage divider. Er3 is the base voltage of Q1. R3 10k Eb = x Vcc = x 12 = 1 V R3 + R4 110 k"], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["Let's calculate emitter voltage.  \n\n                               Eb = 1V       Ee = ??      Ec = ??", "Let's calculate emitter voltage. Eb = 1V Ee = ?? Ec = ??"], "jumps": ["P2450", "P2410"]}, {"id": "P2450", "text": ["The emitter base junction of Q1 drops about .6 volts. This leaves .4 volts on the emitter.\n\n                           Ee = Eb - .6 V          Ee = 1V - .6 V = .4 V", "The emitter base junction of Q1 drops about .6 volts. This leaves .4 volts on the emitter. Ee = Eb - .6 V Ee = 1V - .6 V = .4 V"], "jumps": ["P2460", "P2410"]}, {"id": "P2460", "text": ["Let's calculate collector voltage.\n\n                                Eb = 1 V       Ee = .4 V       Ec = ??", "Let's calculate collector voltage. Eb = 1 V Ee = .4 V Ec = ??"], "jumps": ["P2470", "P2410"]}, {"id": "P2470", "text": [".4 V on the emitter causes .4 mA of emitter current through R6.\n\n                                                      Ee    .4\n                                              Ie =       =       = .4 mA\n                                                      Re   1k", ".4 V on the emitter causes .4 mA of emitter current through R6. Ee .4 Ie = = = .4 mA Re 1k"], "jumps": ["P2480", "P2410"]}, {"id": "P2480", "text": ["Since emitter and collector current are practically equal, .4 mA is also the current through R5."], "jumps": ["P2490", "P2410"]}, {"id": "P2490", "text": ["The voltage across R5 is the collector current times the resistance of R5.  \n\n                           Ec = Ic x Rc = .4 mA x 9.1 k = 3.6 V", "The voltage across R5 is the collector current times the resistance of R5. Ec = Ic x Rc = .4 mA x 9.1 k = 3.6 V"], "jumps": ["P2500", "P2410"]}, {"id": "P2500", "text": ["Since R5 drops 3.6 V, 8.4 volts of Vcc is applied to the collector.  \n\n                               Ec = Vcc - ERc = 12 - 3.6 = 8.4 V  \n                           Eb = 1 V        Ee = .4 V         Ec = 8.4 V", "Since R5 drops 3.6 V, 8.4 volts of Vcc is applied to the collector. Ec = Vcc - ERc = 12 - 3.6 = 8.4 V Eb = 1 V Ee = .4 V Ec = 8.4 V"], "jumps": ["P2510", "P2410"]}, {"id": "P2510", "text": ["The input impedance to amplifier Q2 effects the collector voltage of Q1 to a small extent. The result is negligible."], "jumps": ["P2520", "P2410"]}, {"id": "P2520", "text": ["Let's ve let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
