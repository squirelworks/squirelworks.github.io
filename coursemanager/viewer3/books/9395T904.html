rams may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AM RECEIVER TROUBLESHOOTING fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Practice troubleshooting AM receivers."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 470 Oscilloscope rXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. 2 BNC to Alligator Cables bles (2)", "13. 2 Oscilloscope Probes Cables (2)"], "jumps": []}, {"id": "P330", "text": [], "jumps": ["Pr", "Po"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P333", "text": [], "jumps": ["P"]}, {"id": "P334", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P337", "text": [], "jumps": []}, {"id": "P338", "text": [], "jumps": []}, {"id": "P400", "text": ["Troubleshooting is a diverse and intricate process that involves theoretical knowledge, test equipment competency, and an            understanding of the equipment operation, all blended together with a little bit of intuition.", "Troubleshooting is a diverse and intricate process that involves theoretical knowledge, test equipment competency, and an understanding of the equipment operation, all blended together with a little bit of intuition."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Because electronics is based on mathematics, using the logical side of the brain for troubleshooting is imperative.  At the same time, a particular symptom may be caused by any number of reasons, many of which will not seem logical at all.", "Because electronics is based on mathematics, using the logical side of the brain for troubleshooting is imperative. At the same time, a particular symptom may be caused by any number of reasons, many of which will not seem logical at all."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["It is for this reason that the creative side of the brain must also be heavily engaged.  The best troubleshooters are those that are able to exercise both modes of thought.", "It is for this reason that the creative side of the brain must also be heavily engaged. The best troubleshooters are those that are able to exercise both modes of thought."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The seasoned troubleshooter knows these factors come into play when trying to solve a problem.  It will not come as a shock to him or her that a suspect component is not the culprit at all.", "The seasoned troubleshooter knows these factors come into play when trying to solve a problem. It will not come as a shock to him or her that a suspect component is not the culprit at all."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["There is no comprehensive recipe for troubleshooting, only guidelines that will be configured to your way of thinking, through time and practice.", "Whether it's industry or the military or the small Ma & Pa repair shop, maintenance is fundamentally conducted in the same fashion.  As with any service related work, customer satisfaction is the goal.  Quality work and quick equipment servicing turn-around time are the keys to that goal.", "Whether it's industry or the military or the small Ma & Pa repair shop, maintenance is fundamentally conducted in the same fashion. As with any service related work, customer satisfaction is the goal. Quality work and quick equipment servicing turn-around time are the keys to that goal."], "jumps": ["P450", "P400", "P460"]}, {"id": "P460", "text": ["If a customer has to wait too long, or return a piece of equipment because the repair work was poorly done, it's unlikely that the       servicing agent will enjoy that customer's business for very long.", "If a customer has to wait too long, or return a piece of equipment because the repair work was poorly done, it's unlikely that the servicing agent will enjoy that customer's business for very long."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["Let's begin the lesson on AM RECEIVER TROUBLESHOOTING....................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment you will be troubleshooting an AM receiver. The first fault will be simulated, the following five problems will be actual faults inserted into the receiver by the computer that you will troubleshoot with test equipment.", "The information you acquired during the previous lessons will help you navigate through a series of malfunctions.", "NOTE The schematic diagrams of the Nida AM Receiver Trainer will be provided throughout the experiment. Select F2 to see Microprocessor & PLL; RF Amp, Mixer, IF Amp; and AM Detector, AF AMP.", "y schematic diagrams of the Nida AM Receiver Trainer will be provided. Schematics are available in a wide range of media formats, but paper is considered the most practical. Use Control S, T, and U to acces?", "In this experiment you will be troubleshooting an AM receiver. The first fault will be simulated, the following five problems will be actual faults inserted into the receiver by the computer that you will troubleshoot with test equipment. The schematic diagrams of the Nida AM Receiver Trainer will be provided throughout the experiment. Select F2 to see", "The hard copy schematic diagrams of the Nida AM Receiver Trainer will be provided. Schematics are available in a wide range of media formats, but paper is considered the most practical. Use CTRL-S, to access soft copy schematics..s..ematics."], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["Bare in mind that, other than the clock frequency and the IF, the frequencies elsewhere will be based upon whatever the receiver is tuned to --- be that a broadcast station or a signal generator.", "Clock - 3 MHz IF - 455 kHzzzReceiver Trainer will be provided throughout the experiment. Select F2 to see Microprocessor & PLL; RF Amp, Mixer, IF Amp; and AM Detector, AF AMP.", "Clock - 4 MHz IF....... - 455 kHzzzzzzzzzzzzver Trainer will be provided throughout the experiment. Select F2 to see Microprocessor & PLL; RF Amp, Mixer, IF Amp; and AM Detector, AF AMP."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["For example, at TP5 on PC130-439 (the output of the VCO) the frequency will be 455 kHz larger than the actual tuned frequency."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Suppose the receiver is tuned to a broadcast station at 1560 kHz. The output at TP5 will be 2015 kHz.  Subtracting the 455 kHz from the frequency at TP5 will give the exact frequency that the receiver is tuned to.  This verifies that the VCO is working properly.", "Suppose the receiver is tuned to a broadcast station at 1560 kHz. The output at TP5 will be 2015 kHz. Subtracting the 455 kHz from the frequency at TP5 will give the exact frequency that the receiver is tuned to. This verifies that the VCO is working properly."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["You may recall in the Communications Troubleshooting lesson that the initial assessment phase of troubleshooting is vital.  The more symptoms you discover, the more focused you can make your troubleshooting efforts.", "You may recall in the Communications Troubleshooting lesson that the initial assessment phase of troubleshooting is vital. The more symptoms you discover, the more focused you can make your troubleshooting efforts."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The check list will assist you in making your initial assessment of the Nida AM Receiver."], "jumps": ["P1090", "P1070"]}, {"id": "P1085", "text": ["he frequencies go up and down accordingly?", "1. Apply power. If the frequency display illuminates and/or any other light indicators, the power supply is probably good. 2. Place the tuning select switch on the PC130-439 card to the PLL (phase- lock loop) position. 3. Depress and hold the scan-up and scan-down buttons on the frequency display. Did the frequencies go up and down accordingly? 4. Momentarily depress the seek button. The frequency display should begin incrementing itself by 10 kHz steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-440 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? 7. With the receiver still tuned to a station, open the AGC switch (S2). Did the quality of your audio signal decrease? If yes, the AGC is probably operating correctly."], "jumps": []}, {"id": "P1090", "text": ["The Nida AM Receiver Trainer is purposely designed to be simplified, yet one that provides most circuits found in nearly any commercial receiver.  This expedites the learning process of not only  troubleshooting receivers but also their theory of operation.", "The Nida AM Receiver Trainer is purposely designed to be simplified, yet one that provides most circuits found in nearly any commercial receiver. This expedites the learning process of not only troubleshooting receivers but also their theory of operation."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Before you actually begin troubleshooting a fault it will be advantageous to first troubleshoot the receiver using a \"simulated fault\".   You will be given indications and asked to assess the situation.", "Before you actually begin troubleshooting a fault it will be advantageous to first troubleshoot the receiver using a \"simulated fault\". You will be given indications and asked to assess the situation."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Using the equipment assessment check just described, these are the symptoms you have found:", "Using the equipment assessment check just described, these are the symptoms you have found: Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from", "1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from the speaker. 4. Opening or closing the AGC switch had no effect on the receiver. steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-440 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? 7. With the receiver still tuned to a station, open the AGC switch (S2). Did the quality of your audio signal decrease? If yes, the AGC is probably operating correctly."], "jumps": ["P1090", "P1085", "P1120"]}, {"id": "P1120", "text": ["Based upon the results, you can determine with reasonable certainty that the RF section, PLL, and IF section are working. This is indicated by the illuminated station detector LED. Assuming this is true, the bug must be on the PC130-440 card."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["During the assessment we had noise from the speaker.  This tells us that the AF stage is working.", "Referring to the schematic of the PC130-440 card we can see that there is very little circuitry that hasn't been ruled out.             Specifically, the components between TP1 and TP6 in the signal path are all that remain suspect.", "During the assessment we had noise from the speaker. This tells us that the AF stage is working. 1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from", "1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from the speaker. 4. Opening or closing the AGC switch had no effect on the receiver. steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-440 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? 7. With the receiver still tuned to a station, open the AGC switch (S2). Did the quality of your audio signal decrease? If yes, the AGC is probably operating correctly.", "Referring to the schematic of the PC130-440 card we can see that there is very little circuitry that hasn't been ruled out. Specifically, the components between TP1 and TP6 in the signal path are all that remain suspect."], "jumps": ["P1140", "P1120", "P1150", "P1130"]}, {"id": "P1150", "text": ["So far, we have localized the problem to the AM detector circuitry by being observant and applying a little deductive reasoning.  We know the IF signal is good.  Still, it's best to verify that with an oscilloscope.", "So far, we have localized the problem to the AM detector circuitry by being observant and applying a little deductive reasoning. We know the IF signal is good. Still, it's best to verify that with an oscilloscope."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["THE FOLLOWING PROCEDURE IS THEORETICAL - TEST EQUIPMENT SHOULD NOT  BE POWERED UP!                                  Set either CH1 or CH2 on your oscilloscope to 20 mV per/div (for X10 probes) or .2 volts (for X1 probes).  Set the Time/div control to 1 or 2 milliseconds per/div.", "Adjust your Function Generator to a 1 MHz AM modulated signal which should be injected at the antenna input.  With the oscilloscope probe, verify the IF signal at TP1 on PC130-440.", "THE FOLLOWING PROCEDURE IS THEORETICAL - TEST EQUIPMENT SHOULD NOT BE POWERED UP! Set either CH1 or CH2 on your oscilloscope to 20 mV per/div (for X10 probes) or .2 volts (for X1 probes). Set the Time/div control to 1 or 2 milliseconds per/div.", "Adjust your Function Generator to a 1 MHz AM modulated signal which should be injected at the antenna input. With the oscilloscope probe, verify the IF signal at TP1 on PC130-440."], "jumps": ["P1170", "P1140", "P1160", "P1180"]}, {"id": "P1180", "text": ["Now move the probe to TP2, the cathode of the rectifier D1. Because D1 only conducts during the positive portion of the IF signal, at TP2 only the upper sideband (which contains the intelligence) will be seen."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Now, check the audio signal at TP3.  The oscilloscope will indicate that there is no audio signal present.  Since the signal is good at TP2 but bad at TP3, we can ascertain that the problem must be one of the six components between the two test points.", "Now, check the audio signal at TP3. The oscilloscope will indicate that there is no audio signal present. Since the signal is good at TP2 but bad at TP3, we can ascertain that the problem must be one of the six components between the two test points."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Checking either side of R10 will prove that the signal is not present there.  This leaves C1 and C2.  If C2 were short, there would be no signal at TP2.  If C2 were open, there would still be a signal at C1.  Checking C1 will show that there is a signal on one side of C1 but not on the other.", "Checking either side of R10 will prove that the signal is not present there. This leaves C1 and C2. If C2 were short, there would be no signal at TP2. If C2 were open, there would still be a signal at C1. Checking C1 will show that there is a signal on one side of C1 but not on the other."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["While not all problems will be as easy to localize and isolate, many will be.  The important lesson here is to understand the total procedure and the importance of your initial assessment.", "While not all problems will be as easy to localize and isolate, many will be. The important lesson here is to understand the total procedure and the importance of your initial assessment."], "jumps": ["P1220", "P1170", "P1085"]}, {"id": "P1220", "text": ["Whether you are working on a receiver or some other electronic equipment, performing a complete function check will normally     disclose a great deal of information.  As your familiarity with         specific equipment increases, so too, will the speed with which you are able to accurately troubleshoot and repair the fault.", "Whether you are working on a receiver or some other electronic equipment, performing a complete function check will normally disclose a great deal of information. As your familiarity with specific equipment increases, s ]}, {"id": "P5600", "text": ["Checking the IF section requires removal of Q1 on the PC130-439 card and injection of a 455 kHz 50% 1.2 Vpp modulated signal at TP5 on the PC130-439 card. Ensure Q1 has been removed from the PC130-439 card. PC Card Settings: PC130-439 - Set S1 to PLL and S2 to OFF (AGC). 1. Turn off PC2 DC POWER - To remove Q1 on the PC130-439 card. 2. Turn on PC2 DC Power. 3. Insert maximum attenuation and adjust the output level of the function generator fully CCW. 4. Connect a 455 kHz, 50% 1.2 Vpp modulated signal injected at TP5 of the PC130-439 card while being viewed at TP7. Insert or remove attenuation adjusting the output level to prevent saturation. 5. Check the signal at TP1 on the PC130-440 card. This is the signal from the IF and before the AM Detector section. If the steps above can be accomplished the IF section is working. . F and before the AM Detector section. If the steps above can be accomplished the IF section is working", "atic diagrams of the Nida AM Receiver Trainer will be provided. Schematics are available in a wide range of media formats, but paper is considered the most practical. Use CTRL-S, to access soft copy schematics..s..ematics."], "jumps": []}, {"id": "P5800", "text": ["Checking the AM Detector section - requires removal of Q1 on the PC130-439 card and performing the IF checklist. An injection of a 455 kHz 50% 1.2 Vpp modulated signal at TP5 on the PC130-439 card is required. Ensure Q1 has been removed from the PC130-439 card. PC Card Settings: PC130-439 - Set S1 to PLL and S2 to OFF (AGC). If you have completed the IF section checklist go to step 6. 1. Turn off PC2 DC POWER To remove Q1 on the PC130-439 card. 2. Turn on PC2 DC Power. 3. Insert maximum attenuation and adjust the output level of the function generator fully CCW. 4. Connect a 455 kHz, 50% 1.2 Vpp modulated signal injected at TP5 of the PC130-439 card while being viewed at TP7. Insert or remove attenuation adjusting the output level to prevent saturation. 5. Check the signal at TP1 on the PC130-440 card this is the signal from the IF and before the AM Detector. 6. Place CH1 probe to TP1 and CH2 probe to TP2 on the PC130-440 card. Adjust the volts per division settings to view both signals. 7. Vary the frequency of function generator. Does the detected intelligence increase and decrease? 8. Vary the modulation control on the function generator. Does the waveforms amplitude change proportionally with modulation? 9. Do you hear audio from the speaker? If the steps above can be accomplished the AM Detector section is working. . If the steps above can be accomplished the AM Detector section is working.", "tic diagrams of the Nida AM Receiver Trainer will be provided. Schematics are available in a wide range of media formats, but paper is considered the most practical. Use CTRL-S, to access soft copy schematics..s..ematics."], "jumps": []}, {"id": "P5900", "text": ["Checking the AF section - requires removal of Q1 on the PC130-439 card and performing the IF checklist and verifying the AM Detector and AGC sections are working. An injection of a 455 kHz 50% 1.2 Vpp modulated signal at TP5 on the PC130-439 card is required. Ensure Q1 has been removed from the PC130-439 card. PC Card Settings: PC130-439 - Set S1 to PLL and S2 to OFF (AGC). If you have completed the IF, AM detector and AGC checklists go to step 6. 1. Turn off PC2 DC POWER - To remove Q1 on the PC130-439 card. 2. Turn on PC2 DC Power. 3. Insert maximum attenuation and adjust the output level of the function generator fully CCW. 4. Connect a 455 kHz, 50% 1.2 Vpp modulated signal injected at TP5 of the PC130-439 card while being viewed at TP7. Insert or remove attenuation adjusting the output level to prevent saturation. 5. Check the signal at TP1 on the PC130-440 card this is the signal from the IF and before the AM Detector. 6. Do you hear audio from the speaker? 7. Vary the Volume control, does the volume increase and decrease? 8. Place CH1 probe to TP3 and CH2 probe to TP4 on the PC130-440 card. Adjust the volts per division to view both signals. 9. Vary the Volume control, do both signals increase and decrease? If the steps above can be accomplished the AF section is working. . ls increase and decrease. If the steps above can be accomplished the AF section is working.", "diagrams of the Nida AM Receiver Trainer will be provided. Schematics are available in a wide range of media formats, but paper is considered the most practical. Use CTRL-S, to access soft copy schematics..s..ematics."], "jumps": []}, {"id": "P9060", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.DC Switch to ON...."], "jumps": ["P1230"]}, {"id": "P9070", "text": ["3.  Carefully place PC130-438 in PC1 position, PC130-439 in PC2        position and PC130-440 in PC3 position.", "3. Carefully place PC130-438 in PC1 position, PC130-439 in PC2 position and PC130-440 in PC3 position. ch to ON........................................."], "jumps": ["P1240"]}, {"id": "P9080", "text": ["4.  Set the Positive Supply Voltage to 12 volts DC.", "4. Set the Positive Supply Voltage to 12 volts DC. - Set the PC1 DC Switch to ON...."], "jumps": ["P9070"]}, {"id": "P9090", "text": ["5.  Turn DC POWER PC1, PC2, PC3 and SPEAKER switches\n      to ON.", "5. Turn DC POWER PC1, PC2, PC3 and SPEAKER switches to ON..........ch to ON...."], "jumps": ["P9080"]}, {"id": "P9930", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P1550"]}, {"id": "P9940", "text": ["2.  Place CONSOLE POWER to OFF.", "2. Place CONSOLE POWER to OFF.h to OFF...................."], "jumps": ["P9930"]}, {"id": "P9950", "text": ["3.  Remove all cards and return all equipment to its proper                   storage location.", "3. Remove all cards and return all equipment to its proper storage location."], "jumps": ["P1910", "P9940"]}, {"id": "P13020", "text": ["In this experiment you will be troubleshooting an AM receiver. The first failure will be simulated, the following five problems will be actual faults inserted into the receiver by the computer that you will troubleshoot with test equipment.", "NOTE The schematic diagrams of the Nida AM Receiver Trainer will be provided throughout the experiment. Select F2 to see Microprocessor & PLL; RF Amp, Mixer, IF Amp; and AM Detector, AF AMP.", "In this experiment you will be troubleshooting an AM receiver. The first failure will be simulated, the following five problems will be actual faults inserted into the receiver by the computer that you will troubleshoot with test equipment. s Text) NOTE The schematic diagrams of the Nida AM Receiver Trainer will be provided throughout the experiment. Select F2 to see", "y schematic diagrams of the Nida AM Receiver Trainer will be provided. Schematics may be available in various media formats, but paper is considered the most practical. Soft copy schematics are available u", "The hard copy schematic diagrams of the Nida AM Receiver Trainer will be provided. Schematics may be available in various media formats, but paper is considered the most practical. Soft copy schematics are available using Control S."], "jumps": ["P13030", "P1001"]}, {"id": "P13030", "text": ["The information you acquired in the previous lessons will help you navigate through a series of real malfunctions.  Take notes as you go.", "The information you acquired in the previous lessons will help you navigate through a series of real malfunctions. Take notes as you go."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["Bare in mind that, other than the clock frequency and the IF, the frequencies elsewhere will be based upon whatever the receiver is tuned to --- be that a broadcast station or a signal generator.", "Clock - 3 MHz IF........ - 455 kHzzzzzzzzzer Trainer will be provided throughout the experiment. Select F2 to see Microprocessor & PLL; RF Amp, Mixer, IF Amp; and AM Detector, AF AMP."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["For example, at TP5 on PC130-439 (the output of the VCO) the frequency will be 455 kHz larger than the actual tuned frequency."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Suppose the receiver is tuned to a broadcast station at 1560 kHz. The output at TP5 will be 2015 kHz.  Subtracting the 455 kHz from the frequency at TP5 will give the exact frequency that the receiver is tuned to.  This verifies that the VCO is working properly.", "Suppose the receiver is tuned to a broadcast station at 1560 kHz. The output at TP5 will be 2015 kHz. Subtracting the 455 kHz from the frequency at TP5 will give the exact frequency that the receiver is tuned to. This verifies that the VCO is working properly."], "jumps": ["P13070", "P13050"]}, {"id": "P13070", "text": ["You may recall in the Communications Troubleshooting lesson that the initial assessment phase of troubleshooting is vital.  The more symptoms you discover, the more focused you can make your troubleshooting efforts.", "You may recall in the Communications Troubleshooting lesson that the initial assessment phase of troubleshooting is vital. The more symptoms you discover, the more focused you can make your troubleshooting efforts."], "jumps": ["P13080", "P13050"]}, {"id": "P13080", "text": ["The check list will assist you in making your initial assessment of the Nida AM Receiver."], "jumps": ["P13090", "P13070"]}, {"id": "P13085", "text": ["1. Apply power. If the frequency display illuminates and/or any other light indicators, the power supply is probably good. 2. Place the tuning select switch on the PC130-439 card to the PLL (phase- lock loop) position. 3. Depress and hold the scan-up and scan-down buttons on the frequency display. Did the frequencies go up and down accordingly? 4. Momentarily depress the seek button. The frequency display should begin incrementing itself by 10 kHz steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-440 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? 7. With the receiver still tuned to a station, open the AGC switch (S2). Did the quality of your audio signal decrease? If yes, the AGC is probably operating correctly.", "y display. Did the frequencies go up and down accordingly?"], "jumps": []}, {"id": "P13090", "text": ["The Nida AM Receiver Trainer is purposely designed to be simplified, yet one that provides most circuits found in nearly any commercial receiver.  This expedites the learning process of not only  troubleshooting receivers but also their theory of operation.", "The Nida AM Receiver Trainer is purposely designed to be simplified, yet one that provides most circuits found in nearly any commercial receiver. This expedites the learning process of not only troubleshooting receivers but also their theory of operation."], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["Before you actually begin troubleshooting a real fault ,  it will be advantageous to first troubleshoot the receiver using a \"simulated fault\".   In the  simulation, you will be given indications and asked to assess the situation.", "Before you actually begin troubleshooting a real fault , it will be advantageous to first troubleshoot the receiver using a \"simulated fault\". In the simulation, you will be given indications and asked to assess the situation.r or any test equipment."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["Using the equipment assessment check just described, these are the symptoms you have found:", "Using the equipment assessment check just described, these are the symptoms you have found: 1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from", "1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from the speaker. 4. Opening or closing the AGC switch had no effect on the receiver. steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-440 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? 7. With the receiver still tuned to a station, open the AGC switch (S2). Did the quality of your audio signal decrease? If yes, the AGC is probably operating correctly."], "jumps": ["P13120", "P13090", "P13085"]}, {"id": "P13120", "text": ["Based upon the results, you can determine with reasonable certainty that the RF section, PLL, and IF section are working. This is indicated by the illuminated station detector LED. Assuming this is true, the bug must be on the PC130-440 card."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["During the assessment we had noise from the speaker. This tells us that the AF stage is working.", "Referring to the schematic of the PC130-440 card we can see that there is very little circuitry that hasn't been ruled out.             Specifically, the components between TP1 and TP6 in the signal path are all that remain suspect.", "During the assessment we had noise from the speaker. This tells us that the AF stage is working. 1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from", "1. Upon power up, the frequency display illuminated. 2. A known broadcast station frequency was tuned in manually and synthetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from the speaker. 4. Opening or closing the AGC switch had no effect on the receiver. steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-440 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? 7. With the receiver still tuned to a station, open the AGC switch (S2). Did the quality of your audio signal decrease? If yes, the AGC is probably operating correctly.", "Referring to the schematic of the PC130-440 card we can see that there is very little circuitry that hasn't been ruled out. Specifically, the components between TP1 and TP6 in the signal path are all that remain suspect."], "jumps": ["P13140", "P13120", "P13150", "P13130"]}, {"id": "P13150", "text": ["So far, we have localized the problem to the AM detector circuitry by being observant and applying a little deductive reasoning.  We know the IF signal is good.  Still, it's best to verify that with an oscilloscope.", "So far, we have localized the problem to the AM detector circuitry by being observant and applying a little deductive reasoning. We know the IF signal is good. Still, it's best to verify that with an oscilloscope."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["THE FOLLOWING PROCEDURE IS THEORETICAL - TEST EQUIPMENT SHOULD NOT BE POWERED UP!                                   Set either CH1 or CH2 on your oscilloscope to 20 mV per/div (for X10 probes) or .2 volts (for X1 probes).  Set the Time/div control to 1 or 2 milliseconds per/div.", "Adjust your Function Generator to a 1 MHz AM modulated signal which should be injected at the antenna input.  With the oscilloscope probe, verify the IF signal at TP1 on PC130-440.", "THE FOLLOWING PROCEDURE IS THEORETICAL - TEST EQUIPMENT SHOULD NOT BE POWERED UP! Set either CH1 or CH2 on your oscilloscope to 20 mV per/div (for X10 probes) or .2 volts (for X1 probes). Set the Time/div control to 1 or 2 milliseconds per/div.", "Adjust your Function Generator to a 1 MHz AM modulated signal which should be injected at the antenna input. With the oscilloscope probe, verify the IF signal at TP1 on PC130-440."], "jumps": ["P13170", "P13140", "P13180", "P13160"]}, {"id": "P13180", "text": ["Now move the probe to TP2, the cathode of the rectifier D1. Because D1 only conducts during the positive portion of the IF signal, at TP2 only the upper sideband (which contains the intelligence) will  be seen.", "Now move the probe to TP2, the cathode of the rectifier D1. Because D1 only conducts during the positive portion of the IF signal, at TP2 only the upper sideband (which contains the intelligence) will be seen."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["Now, check the audio signal at TP3.  The oscilloscope will indicate that there is no audio signal present.  Since the signal is good at TP2 but bad at TP3, we can ascertain that the problem must be one of the six components between the two test points.", "Now, check the audio signal at TP3. The oscilloscope will indicate that there is no audio signal present. Since the signal is good at TP2 but bad at TP3, we can ascertain that the problem must be one of the six components between the two test points."], "jumps": ["P13200", "P13170"]}, {"id": "P13200", "text": ["Checking either side of R2 will prove that the signal is not present there.  This leaves C1 and C2.  If C2 were short, there would be no signal at TP2.  If C2 were open, there would still be a signal at C1.  Checking C1 will show that there is a signal on one side of C1 but not on the other.", "Checking either side of R2 will prove that the signal is not present there. This leaves C1 and C2. If C2 were short, there would be no signal at TP2. If C2 were open, there would still be a signal at C1. Checking C1 will show that there is a signal on one side of C1 but not on the other."], "jumps": ["P13210", "P13170"]}, {"id": "P13210", "text": ["While not all problems will be as easy to localize and isolate, many will be.  The important lesson here is to understand the total procedure and the importance of your initial assessment.", "While not all problems will be as easy to localize and isolate, many will be. The important lesson here is to understand the total procedure and the importance of your initial assessment."], "jumps": ["P13220", "P13170", "P13085"]}, {"id": "P13220", "text": ["Whether you are working on a receiver or some other electronic equipment, performing a complete function check will normally     disclose a great deal of information.  As your familiarity with         specific equipment increases, so too, will the speed with which you are able to accurately troubleshoot and repair the fault.", "Whether you are working on a receiver or some other electronic equipment, performing a complete function check will normally disclose a great deal of information. As your familiarity with specific equipment increases, so too, will the speed with which you are able to accurately troubleshoot and repair t let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
