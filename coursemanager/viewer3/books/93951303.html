ircuit. * trial and error or * logical procedure. This is an overlay page."], "jumps": ["P430"]}, {"id": "P425", "text": ["TRIAL AND ERROR - Using the trial and error method, you replace each part in the circuit until you find the bad part. .............................."], "jumps": []}, {"id": "P426", "text": ["LOGICAL PROCEDURE - Using a logical process you do Step 1, then Step 2, and so on, until you know what part is bad. ................................"], "jumps": []}, {"id": "P427", "text": ["There are two methods to troubleshoot a circuit. * trial and error or * logical procedure. ..............................."], "jumps": ["P430"]}, {"id": "P430", "text": ["When electronic circuits were very simple and contained only a few components, trial and error was an effective troubleshooting technique. ..............................."], "jumps": ["P435"]}, {"id": "P435", "text": ["As circuits became more complex, the trial and error method of troubleshooting required too much time. ..............................."], "jumps": []}, {"id": "P440", "text": ["With the complex circuits in use today, logical troubleshooting procedures must be followed. ........................"], "jumps": ["P435"]}, {"id": "P445", "text": ["Logical troubleshooting takes less time and the results are more predictable. ........................"], "jumps": ["P450", "P435"]}, {"id": "P450", "text": ["The series circuit is used to teach troubleshooting because you know how a series circuit operates. ..............................."], "jumps": ["P435"]}, {"id": "P455", "text": ["Your knowledge of how a good circuit operates will help you identify a circuit that is not operating properly. ........................"], "jumps": ["P450"]}, {"id": "P460", "text": ["Learning to troubleshoot is important to become a good technician. A technician knows how a circuit works and knows how to fix the circuit when it does not work. ..............................."], "jumps": ["P450"]}, {"id": "P470", "text": ["Let's begin the lesson on SERIES CIRCUIT TROUBLESHOOTING THEORY. ........"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": ["P1920"]}, {"id": "P1040", "text": ["The main reason why a technician is asked to look at a circuit is to fix it when it is not operating properly. ..............................."], "jumps": []}, {"id": "P1050", "text": ["To find the problem, the technician must follow a procedure. The procedure should be: Logical Systematical ........................"], "jumps": []}, {"id": "P1052", "text": ["To find the problem, the technician must follow a procedure. The procedure should be: Logical Systematical ..............................."], "jumps": []}, {"id": "P1055", "text": ["LOGICAL - If a procedure is logical, the procedure shows consistency of reasoning. In other words the procedure makes good common sense. ................................"], "jumps": []}, {"id": "P1056", "text": ["SYSTEMATICAL - If a procedure is systematical, certain steps must be followed. For example, do Step 1, then Step 2, then Step 3, etc. Following the necessary steps insures that you will not overlook anything and you will obtain the best results from your troubleshooting. bleshooting. ................................"], "jumps": []}, {"id": "P1060", "text": ["The following steps should be followed when troubleshooting any circuit. ...............................", "1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the resultsssssssss"], "jumps": []}, {"id": "P1064", "text": ["Troubleshooting is like putting the pieces of a puzzle together. The more pieces you have, the easier the puzzle is to identify. ..............................."], "jumps": []}, {"id": "P1070", "text": ["1. Analyze the circuit First, see if the circuit operates correctly. An example is; a television should produce a picture and sound when turned on. ........................."], "jumps": []}, {"id": "P1080", "text": ["1. Analyze the Circuit If the circuit operates correctly, there is no need to troubleshoot and this would be the last step. If the circuit does NOT operate correctly, then you must go to the next step."], "jumps": []}, {"id": "P1090", "text": ["2. Check the setup If the circuit is not operating properly, check to see if you overlooked something simple. ........................"], "jumps": []}, {"id": "P1100", "text": ["2. Check the Setup Example; if the television does not work, check the: * wall plug * channel selector * antenna * volume control ........................", "* wall plug * channel selector * antenna * volume control"], "jumps": []}, {"id": "P1110", "text": ["2. Check the Setup If you checked the setup and the setup is good, but the circuit still does not operate properly, go on to Step 3. ......"], "jumps": []}, {"id": "P1120", "text": ["3. Calculate & measure circuit values First, calculate to determine the values that should be present in a circuit that is working properly. ........................"], "jumps": []}, {"id": "P1130", "text": ["3. Calculate & measure circuit values Make voltage, current, or resistance measurements. Make the measurement that is most useful, and easiest to make."], "jumps": ["P1140"]}, {"id": "P1140", "text": ["3. Calculate & measure circuit values In most cases, voltage measurements are made first. Voltage measurements provide useful information about the circuit and are made without breaking the circuit."], "jumps": ["P1150"]}, {"id": "P1143", "text": ["3. Calculate & measure circuit values In most cases, voltage measurements are made first. Voltage measurements provide useful information about the circuit and are made without breaking the circuit."], "jumps": ["P1150"]}, {"id": "P1145", "text": ["BREAKING THE CIRCUIT - The term breaking the circuit means to interrupt or open the current path between the positive and negative terminal of the power source. Breaking the circuit usually requires unsoldering a component or cutting a wire. ................................"], "jumps": ["P1143"]}, {"id": "P1150", "text": ["3. Calculate & measure circuit values If more information is needed, make current or resistance measurements. Remember, a circuit must be broken to make these measurements."], "jumps": ["P1143"]}, {"id": "P1155", "text": ["BREAKING THE CIRCUIT - Breaking electrical circuits to make measurements usually requires you to desolder components or cut wires. Perform these measurements only when necessary."], "jumps": ["P1156"]}, {"id": "P1156", "text": ["3. Calculate & measure circuit values If more information is needed, make current or resistance measurements. Remember, a circuit must be broken to make these measurements. ..............................."], "jumps": ["P1143"]}, {"id": "P1160", "text": ["3. Calculate & measure circuit values Example: - Calculate the TV voltages. - Measure the TV voltages. - Compare the calculated values to the measured values and determine the possible fault. ........."], "jumps": ["P1156"]}, {"id": "P1170", "text": ["3. Calculate & measure circuit values Make as many measurements as needed. As the pieces of the puzzle begin to fall into place, identifying the fault becomes easier."], "jumps": []}, {"id": "P1180", "text": ["4. Check the results Compare the calculated to measured values. You should have enough information to identify the fault."], "jumps": []}, {"id": "P1190", "text": ["4. Check the results Replace the faulted component and perform step 1 again. If the circuit operates properly, the circuit is fixed."], "jumps": []}, {"id": "P1200", "text": ["4. Check the results Example: If the picture tube in the TV is faulted, replace the tube and perform step 1 again. If the television operates properly, you are finished. ................................."], "jumps": []}, {"id": "P1210", "text": ["Remember the four troubleshooting steps and apply them to all future troubleshooting problems. nalyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results .................................", "1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the resultsssssssss"], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING PROCEDURES. .................."], "jumps": []}, {"id": "P1920", "text": ["1. The primary reason to troubleshoot is to find and fix faults in a circuit. 2. Use a logical, systematic approach to troubleshooting. Use a logical, systematic approach to troubleshooting."], "jumps": []}, {"id": "P1930", "text": ["3. Follow the 4 troubleshooting steps: ...............................", "1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the resultsssssssssssss"], "jumps": ["P1920"]}, {"id": "P1940", "text": ["4. Collect as many pieces to the puzzle as you can. ..............................."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": ["P2920"]}, {"id": "P2040", "text": ["Three faults are common in a series circuit. They are: ............................."], "jumps": ["P2050"]}, {"id": "P2050", "text": ["An \"OPEN\" occurs when a component provides no path for current flow. ...............................", "An \"OPEN\" occurs when a component provides no path for current. ..............................."], "jumps": []}, {"id": "P2060", "text": ["An open component causes the entire applied voltage to drop across the open component. .........................."], "jumps": ["P2050"]}, {"id": "P2070", "text": ["A good component has a resistance value equal to the ohmic value indicated by the resistor color code. .................................", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO OPEN resistance increasesssssssssssssssssss", "OPEN maximum resistance sss"], "jumps": ["P2050"]}, {"id": "P2072", "text": ["As a component starts to open, resistance increases. ........................"], "jumps": []}, {"id": "P2073", "text": ["When the component opens completely, resistance increases to maximum resistance or infinity ( )."], "jumps": ["P2080"]}, {"id": "P2080", "text": ["When a component opens completely, the resistance is so high that current flow stops.....................................................", "When a component opens completely, the resistance is so high that current stops.tops....................................................."], "jumps": []}, {"id": "P2090", "text": ["To determine if the circuit has an open component, make voltage measurements. Measure the voltage drop of each component in the circuit. ................................."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2092", "text": ["To determine if the circuit has an open component, make voltage measurements. Measure the voltage drop of each component in the circuit. ................................."], "jumps": ["P2095"]}, {"id": "P2095", "text": ["VOLTAGE DROP MEASUREMENT - To measure the voltage in the circuit place the multimeter leads as shown. 99999999999999999999999999999999999999999..............................."], "jumps": []}, {"id": "P2100", "text": ["If you measure a component that has a voltage drop equal to the applied voltage, you have identified the open component. ................................."], "jumps": ["P2092"]}, {"id": "P2101", "text": ["If you measure a component that has a voltage drop equal to the applied voltage, you have identified the open component. ................................."], "jumps": ["P2092"]}, {"id": "P2110", "text": ["The next fault we will look at is the short: ...............................", "1. Open 2. Short 3. Changed valuessssssssssssssssssssssssssssssk the resultshe resultseck the resultssssss"], "jumps": ["P2120", "P2092"]}, {"id": "P2120", "text": ["A \"SHORT\" occurs when a component provides no resistance to current flow in a series circuit. .................................", "A \"SHORT\" occurs when a component provides no resistance to current in a series circuit. ................................."], "jumps": []}, {"id": "P2130", "text": ["In a series circuit with a shorted component, there is NO voltage dropped across the shorted component. ........................"], "jumps": ["P2120"]}, {"id": "P2140", "text": ["A good component has a resistance value equal to the ohmic value indicated by the resistor's color code. .................................", "GOOD COMPONENT resistance = ohmic valueeeeeeeeeeee", "STARTING TO SHORT resistance decreasessssssssssssssssss", "SHORTED minimum resistance sss"], "jumps": ["P2120"]}, {"id": "P2142", "text": ["As a component starts to short, resistance starts to decrease. ........................"], "jumps": []}, {"id": "P2144", "text": ["Once the component shorts completely, there is no resistance to current flow. This is like replacing the resistor with a piece of wire. .........................."], "jumps": ["P2150"]}, {"id": "P2150", "text": ["When a component is shorted, there is no resistance to current and current flow is maximum through the component. .", "When a component is shorted, there is no resistance to current and current is maximum through the component. ."], "jumps": []}, {"id": "P2160", "text": ["Make voltage measurements to determine if the circuit has a shorted component. Measure the voltage drop of each component in the circuit. 9999999999999999999999999999999999........................."], "jumps": ["P2150", "P2165"]}, {"id": "P2162", "text": ["Make voltage measurements to determine if the circuit has a shorted component. Measure the voltage drop of each component in the circuit. ................................."], "jumps": ["P2165"]}, {"id": "P2165", "text": ["VOLTAGE DROP MEASUREMENT - To measure the voltage in the circuit place the multimeter leads as shown. 9..............................."], "jumps": ["P2162"]}, {"id": "P2170", "text" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
