const book = {"title": "9395T606", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Title: HISTORY OF TELECOMMUNICATIONSasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. History of Telecommunicationsective 1 line item 2 here. item 2 here.e.e.", "w Identify innovators in the telecommunications industry. w Describe a brief history of telecommunications."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The art of communication has been practiced since prehistoric times when mankind first used words to share information. However, it has only been within the past two centuries that the most amazing advances in communication have occurred.d.."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Let's start by creating a time line of communications......", ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>A>A>A>>A>>>>>A>AAAAAAAAAAAAAAAAAABBABABBBBBBBBBHBBHBHBBBHDHHHBDDHDhHhhDhD ]", "3y3}y31}q3@yyyy }}}q3+y@y@y3y@1@y@@&@@@@@", "y 1}y3y1&@&@1@1@@@@@@@@@1@@@333@3@@1@@@1@@@@@", "ym nyn}ymyyyyn}}1}ynyym1yy yyy1y3&y1&y@1&@@@&@1@@@j@@@j@1@j3"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The history that starts us on the road to telecommunications really begins in approximately 3,300 BC, with the invention of writing.This gives us a communication timeline spanning 32,000 years. e are most concerned with the modern telecommunication age", "1837 AD Needle Telegraph line first tested Invented", "Invention of Writing approx. 3,300 BCEBCEE", "1958 AD Invention of the integrated circ. and the modemmmraph to Baltimore, MD)", "Greeks used Carrier Pigeons approx. 3,000 BCE", "1838 AD US patent issued for the telegraph", "1844 AD 1st long dist. telegraph mess. (Wash., DC to Baltimore, MD) )", "1855 AD Patent issued for the compensation (duplex) telegraph to Baltimore, MD)", "1858 AD First successful transatlantic cableduplex) telegraph to Baltimore, MD)"], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Although the technology of the written word changed over time, it wasn't until 1838 that a fundamentally new technology arose which actually started us on the path to telecommunications..in the second millennium CE, or the period 1838 to present CE.millennium CE, or the period 1838 to present CE."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["We can think of the period from 1858 to 1958 as a kind of \"Golden Age\" of telecom. All of the basic technology needed to meet telecom industry requirements was invented in this 100-year time frame.........................ted in this 100-year time frame."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The \"Golden Age\" was heralded by the first successful transatlantic cable, which was laid in 1858. 100 years later, in 1958, the modem (modulator/demodulator) and the integrated circuit (IC) were invented. the integrated circuit (IC)."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["We'll begin our discussion on telecom history with the 20 years prior to the start of the golden age. The most significant events of this era were the the development and improvement of the electric telegraph.ic telegraph.."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Samuel Morse started working on the telegraph as early as 1832 while employed at New York University. He received a patent in 1838 for the device. One has to wonder what the patent clerk and others thought of the strange device...."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["In 1838, communications was performed with signal flags and signs, like the semaphore. In 1840, the US Congress was going to fund a semaphore system between New York and New Orleans. Hundreds of stations and operators would be required..."], "jumps": ["P1110", "P1090"]}, {"id": "P1105", "text": ["SEMAPHORE - a mechanical signaling system used in the US and Europe until the 1860s as a method of relaying information from place to place. The railroad and motor vehicle traffic signals employed semaphore until recent times. Naval semaphore utilizes flags instead of mechanical arms...hanical arms.", "Semaphore pole in the foreground and microwave tower in the background. A study of contrasts in the development of telecommunications, the semaphore tower predates the microwave by 100 years, but both methods were still in use when this photograph was taken."], "jumps": ["PPQ", "P1", "P"]}, {"id": "P1110", "text": ["Samuel Morse heard of the pending congressional action and advised them to wait because he was almost ready to field his electric telegraph. During this time, another device was being developed in England, the needle telegraph..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Two Englishmen, Wheatstone (the electrical scientist) and Cooke (the entrepreneur) formed a partnership to develop the needle telegraph. The first line was tested in 1837, before Morse's patent, over a distance of 2.4 kilometers (1.5 miles)..."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The needle telegraph converted electrical current into needle movement and was so simple to operate that children were often used to demonstrate the device. This proven system was used in England for nearly 100 years..."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Back in the US, Morse and his partner Alfred Vail were getting the first telegraph line set up for a long distance demonstration. On May 24, 1844 Morse in Washington DC sent a message in code to Vail in Baltimore, Maryland. In Baltimore, the message translated to \"What hath God wrought\"..."], "jumps": ["P1150", "P1130", "P"]}, {"id": "P1150", "text": ["Vail resent the message back in Morse, character for character. The transmission was simplex. Telegraph lines started being setup around the east coast of the US. In 1847, Morse took his telegraph to Europe to try it on the market. The Kingdom of Hannover was his first customer."], "jumps": ["P1160", "P1140"]}, {"id": "P1152", "text": ["Vail resent the message back in Morse, character for character. The transmission was simplex. Telegraph lines started being setup around the east coast of the US. In 1847, Morse took his telegraph to Europe to try it on the market. The Kingdom of Hannover was his first customer.ought\"..."], "jumps": ["P1160", "P1140"]}, {"id": "P1155", "text": ["SIMPLEX - a system which only allows a single message to be sent at a time. Another message or a return message cannot be sent until the original message is completed. traffic signals employed semaphore until recent times. Naval semaphore utilizes flags instead of mechanical arms.s...hanical arms."], "jumps": []}, {"id": "P1160", "text": ["Back in those days, telegraph wires were mounted on poles or from building to building. Technophobia (fear of technology) was common among the people. Farmers in Kentucky cut down the wires because they thought their crops and cattle would be harmed by the mysterious electric current...."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["As the telegraph expanded, so did the telegraph business. By 1851, 51 telegraph companies were in operation worldwide. Innovators started working with the new technology and improvements started being introduced..."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Friedrich Gerke refined and improved Morse's original code by adding punctuation and numbering. Gerke's version would become known as \"International Morse Code\"."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Other developments of the period included the plan to run a cable across the Atlantic Ocean. The magnitude of such a technological feat is still impressive today."], "jumps": ["P1200", "P1180", "PP"]}, {"id": "P1200", "text": ["Alexander Bain invented the concept of electrical facsimile; what we call a FAX today. The electrical part of the telecom equation was established, if the distance (tele) problem could be resolved, the golden age could begin..."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Between 1853 and 1855, a telegraph that could send and receive simultaneously (a process called DUPLEX communications) was invented by Julius Gintl of Austria. A patent for the device, called a \"compensation telegraph\", was issued in 1855. Gintl invented the \"information exchange\" part of the telecom equation...elecom equation.on.on."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Cyrus Field formed the New York, Newfoundland & London Telegraph Company in 1855. His main service was to be a submarine cable running from New York, USA to St. Johns, Canada, to London, England. Hiram Sibley founded the Western Union Telegraph Company in Rochester, New York in 1856.."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Field's submarine cable venture was nearing the test phase after 3 years of hard work. His first success occurred on August 7, 1858 when the completed \"link\" was tested. It only lasted for 4 weeks. The insulation proved to be the main weakness in the design..."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The American Civil War (1861 - 1865) caused problems for Field, especially since his network linked the USA and UK; the UK was sympathetic to the forces that opposed the USA. In spite of this, the North American transcontinental telegraph line was completed in 1861.d in 1861.ted in 1861......."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["As soon as the war ended, Field was ready to lay another cable. Using the Great Eastern, a large side-wheel clipper ship, Field succeeded officially in 1867, but the golden age of telecom had already started.."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Who invented 2-way telegraph communications?..............."], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["Bain invented electric FAX................................."], "jumps": []}, {"id": "P1263", "text": ["Morse invented 1-way telegraph communications.............."], "jumps": []}, {"id": "P1264", "text": ["Field laid the first transatlantic cable..................."], "jumps": []}, {"id": "P1280", "text": ["The great American inventor Thomas Edison had also been experimenting with electric systems before the golden age. In 1870, He invented multiplex (combined signals on a single line), which would become a necessity in all telecom systems of the future..."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Western Union started to acquire a number of smaller companies. They bought Gray & Barton, a telegraph equipment manufacturing company, in 1872. The era of the common carrier was ready to begin; all they needed was a telephone. all they need is a telephone........."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["A Scotsman and American immigrant named Alexander Bell invented the telephone in 1876 (the centennial year of the USA). Bell offered his patent to Western Union for $100,000 USD. Western Union declined the offer. Bell bought a controlling interest in Western Union in 1882."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Western Union bought telephone sets and started the first phone service line in 1877. The first telephone directory was published in New Haven, Connecticut, USA in 1878. It had 21 listings."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["In 1881, the female telephone operator became a demographic standard. Women made excellent candidates because they tended not to use profanity.."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The first long distance telephone call was made in 1884 between Boston and New York City. The first coast-to-coast long distance call would not be made until 1935."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["American Telephone & Telegraph (AT&T) Company was started up by Bell Telephone Co. in 1885. In 1899, AT&T became the parent company for Bell Telephone. In 1907, AT&T was purchased by financier J.P. Morgan, who appointed Theodore Vail as president."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["As the 1880s were ending, three hugely important things were invented. Herman Hollerith invented the punch card, the first automated media. Connelly & McTighe invented the automated central office switch. The third invention was the radio by Guglielmo Marconi in 1894.."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Before the turn of the century, punch cards were supporting databases, central office switches were replacing human operators, and long distance lines were linking the world. The first broadcasting company was started in 1893 using a telephone network..."], "jumps": ["P1370", "P1350", "P"]}, {"id": "P1370", "text": ["The 19th Century gave rise to electrical communications as a science and a business. The 20th Century would see the birth of electronics, outer space exploration, computers, and the peak of the telecommunications industry as a business.siness......as a business..."], "jumps": ["P1380", "P1360", "P84"]}, {"id": "P1380", "text": ["By the year 1900, the 42nd year of the golden age, over 20,000 telephone companies and nearly 1,000,000 telephones were in service worldwide. Loading coils were being installed on phone lines to increase signal strength and clarity..."], "jumps": ["P1390", "P1370", "P"]}, {"id": "P1385", "text": ["LOADING COIL - A coil may be wired into a transmission line to add inductance, which improves line efficiency by adding induced voltage."], "jumps": []}, {"id": "P1390", "text": ["Lee DeForest started the electronic revolution in 1906 with the invention of his vacuum tube, the first electronic component. Electricity could now be manipulated into forms that were discrete in nature other than just a source of power..."], "jumps": ["P1400", "P1380", "P", "P6"]}, {"id": "P1400", "text": ["In what year was the first long distance phone call made?.."], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["The radio was invented in 1894. --........................."], "jumps": []}, {"id": "P1403", "text": ["DeForest invented the vacuum tube in 1906.................."], "jumps": ["P", "P6"]}, {"id": "P1410", "text": ["AT&T created the concept of end-to-end service in 1907. This idea meant that the common carrier company provided the customer with everything needed including a telset, transmission lines, and central office switching services..."], "jumps": ["P1420", "P1400"]}, {"id": "P1415", "text": ["TELSET - telecom industry jargon for \"telephone handset\".d inductance, which improves line efficiency by adding induced voltage.ltage."], "jumps": []}, {"id": "P1420", "text": ["The telecom industry was becoming enormous, so much so that local governments started regulating it. In 1907, the US established regulations to prevent overpricing. The term \"common carrier\" was applied to telecom. Up to that time, the common carriers were railroads, stagecoaches, and other public transportation services......"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["Transmission technology was improved constantly during the early 1900s. In 1910, Peter DeBye took a radical turn in transmission line theory by proposing optical waveguides. This would eventually lead to the science of fiber optics..."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The second half of the golden age of telecom was underway in 1910. It would be 47 years until the next big development in the age. Other technologies began to build up in concert with telecom during this period..."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The electronics industry started supplying new components to the telecom services. Vacuum tube amplifiers were used to boost long distance signals. In 1915, Bell repeated his famous experiment over an amplified phone line. When Europe went to war, Telecom technology benefited, especially wireless.."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["By 1925, there were 12 million telephones in service in the US, but only 1.5 million had dialing capabilities. As central office automation improved, dialing options would become more prevalent. Television technology began during the 1920s..."], "jumps": ["P1470", "P1450", "P", "PPYWH", "PP"]}, {"id": "P1470", "text": ["The stock market crashed in 1929, thus ending the \"roaring 20s\" in the US. The 1930's were economically depressed, but eventually recovery measures took effect. Europe went to war again, and the rest of the world joined in. Telecom technology benefited from the war again..."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["The postwar years started with the theory that man-made artificial satellites could be used to relay communications, and computer science had become an industry. In 1957, the Soviet Union launched the Sputnik, the first man-made object to orbit the Earth..."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["The satellite was the last link in the telecom chain. However, the golden age extended into 1958, because in that year, the transistorized computer, integrated circuit (IC), and direct connection modems were introduced..."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["After 1958, the basic technology was improved, mostly with the help of computers. In 1960, AT&T installed the first electronic switching office in Morris, Illinois, USA. The commercial use of outer space was approved in 1962 paving the way for satellite communications as a business venture...", "In 1970, the modular telephone cord and jack was introduced. Domestic satellite networks were setup in 1974. Packet switching and advanced modulation technologies enabled data communications worldwide. The Internet was conceived in 1974..."], "jumps": ["P1510", "P1490", "P1520"]}, {"id": "P1520", "text": ["In the 1980s, telephone lines were used to transmit voice and data. AT&T broke up in 1984 as ordered by the US Supreme Court, after 99 years of empire building. This divestiture and other industry initiatives led to the Telecommunications Act of 1996, which defines the telecom business today..."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Computer technology operating in close partnership with telecom resulted in the creation of the World Wide Web (www) in 1992. Internet connectivity places a significant demand on the telecom industry..."], "jumps": ["P1540", "P1510"]}, {"id": "P1540", "text": ["The golden age saw the invention of the primary technologies; wired and wireless telecom networks. Wireless technology started with the invention of the radio in 1894 and has a history of its own..."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["What period is the so-called \"Golden Age\" of Telecommunications?"], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["This period starts with the first telegraph message and runs to the present day."], "jumps": []}, {"id": "P1553", "text": ["This period defines the transition from semaphore to telegraph.", "Semaphore pole in the foreground and microwave tower in the background. A study of contrasts in the development of telecommunications, the semaphore tower predates the microwave by 100 years, but both methods were still in use when this photograph was taken."], "jumps": ["PPQ", "P1", "P"]}, {"id": "P1910", "text": ["This completes the lesson on the HISTORY OF TELECOMMUNICATIONS."], "jumps": ["P1001", "P1550"]}, {"id": "P1920", "text": ["1. The Golden Age of Telecommunications is defined as the 100 years starting in 1858 and ending in 1958. The key events were the laying of the transatlantic cable (1858) and the invention of the modem and integrated circuit (1958)."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Samuel Morse and Alexander Bell were the two principle inventors in telecom. Morse invented the first successful electric communications system. Bell invented the first 2-way electrical voice communications device."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Electronics and computer technology propelled the telecom industry after the golden age. The Telecommunications Act of 1996 defines the telecom industry in the US today.", ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>A>A>A>>A>>>>>A>AAAAAAAAAAAAAAAAAABBABABBBBBBB let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
