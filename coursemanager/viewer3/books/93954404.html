P420", "P400"]}, {"id": "P420", "text": ["The D-Type flip-flop has one input that is used for both the S and R inputs."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on D-Type FLIP-FLOP................................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["The D-Type flip-flop is designed to store the last input condition until the next input condition is gated through."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["D-Type flip-flops have two inputs and two outputs."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["A high applied to the DATA or D input sets the output state to a high Q when the clock input is high."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["A low applied to the D input sets the output state to a low Q when the clock input is high.", "A low applied to the D input sets the output state to a low Q when the clock input is high.."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["When the clock input is low, the D input is disabled and the flip-flop stays in its current state."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The D-Type flip-flop is a good replacement for a set of mechanical switches that are used to indicate binary numbers."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The binary number 101 closes switches S1 and S3 applying a high to lights 1 and 3."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The D flip-flop can replace the mechanical switches, producing the same results."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["Which flip-flop will produce a high Q?", "Which flip-flop will produce a high Q?....................."], "jumps": ["P1090"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["A low on D and a high on C would produce a high Q.", "A low on D and a high on C would produce a high Q.........."], "jumps": []}, {"id": "P1123", "text": ["A low on C disables the D input.  The flip-flop would not change states.", "A low on C disables the D input. The flip-flop would not change states."], "jumps": []}, {"id": "P1130", "text": ["This D-Type flip-flop is constructed from four NAND gates and an inverter.  D-Type flip-flops may also be constructed from NOR gates and an inverter.", "This D-Type flip-flop is constructed from four NAND gates and an inverter. D-Type flip-flops may also be constructed from NOR gates and an inverter."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Note that gates A, B, C and D form a NAND gate Clocked RS flip-flop."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Adding a single input that is applied directly to gate A and inverted and applied to gate B, makes a D flip-flop."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["A high D input places a high on gate A and a low on gate B.  This condition causes a low output from  gate A when the clock is high.", "A high D input places a high on gate A and a low on gate B. This condition causes a low output from gate A when the clock is high."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The low output from gate A is inverted by gate C setting Q high.  Remember, any low input to a NAND gate will produce a high output.", "The low output from gate A is inverted by gate C setting Q high. Remember, any low input to a NAND gate will produce a high output."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["A low D input places a low on gate A and a high on gate B.  This condition causes a low output from gate B when the clock is high.", "A low D input places a low on gate A and a high on gate B. This condition causes a low output from gate B when the clock is high."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["The low output from gate B is inverted by gate D setting Q high."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
