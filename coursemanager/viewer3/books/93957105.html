const book = {"title": "93957105", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: HEAT TRANSDUCERSdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello Student, this lesson is about: about:"], "jumps": []}, {"id": "P100", "text": ["w Describe I R heat generators. w Describe thermal resistance. w Describe heat dissipation.", "w Describe mechanical heat sensors. w Describe thermo-couplers. w Describe thermistors. w Describe resistance temperature detectors. w Describe solid state sensors."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about thermo-electronic devices, heat transducers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["These devices, when combined with common electronic circuits, produce heat circuits that have many uses."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["For example, large computer systems use heat sensors to determine the operating temperature."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["If the equipment becomes too hot, the sensors turn on fans or\nair-conditioning units to lower the temperature.", "Other electronic systems may use heat generators and heat sensors to heat up the equipment.", "If the equipment becomes too hot, the sensors turn on fans or air-conditioning units to lower the temperature.."], "jumps": ["P440", "P420", "P450"]}, {"id": "P450", "text": ["High power radio transmitters normally operate at temperatures above room temperature.  They need heaters to warm them before use.", "High power radio transmitters normally operate at temperatures above room temperature. They need heaters to warm them before use."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's begin the lesson on HEAT TRANSDUCERS................................"], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P10211", "text": ["What type of device is a I R heat generator?"], "jumps": []}, {"id": "P1015", "text": ["Heat generators are either I2R, friction, or chemical.", "Heat generators are either I2R, friction, or chemical...."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["In electronics, I2R heat generators are used.", "In electronics, I2R heat generators are used...."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["These heat generators are resistive.  That is as an electrical current flows through the device, heat is given off.", "These heat generators are resistive. That is as an electrical current flows through the device, heat is given off."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["All resistive components release heat."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Semiconductors have resistance in their PN junctions.", "Semiconductors have resistance in their PN junctions......."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["Any time a current flow is resisted, the electrons give up energy in the form of heat."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["This is known as I  R, which is one formula of electrical power.  In this case, the power is heat.", "This is known as I R, which is one formula of electrical power. In this case, the power is heat."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Carbon and wire wound resistors are normally used and are similar in appearance to the power resistor."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["Remember though, resistors used to change circuit parameters release unwanted heat."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Resistors used as heat sources produce wanted heat."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["What type of heat generator is used in electronics?", "What type of heat generator is used in electronics?........"], "jumps": ["P1080"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["Friction heat generators produce heat by rubbing two materials together.  They are not used in electronic circuits.", "Friction heat generators produce heat by rubbing two materials together. They are not used in electronic circuits."], "jumps": []}, {"id": "P1113", "text": ["Chemical heat generators produce heat by the action of two substances combining.  They are not used in electronic circuits.", "Chemical heat generators produce heat by the action of two substances combining. They are not used in electronic circuits."], "jumps": []}, {"id": "P1120", "text": ["All electronic resistive devices generate heat.", "All electronic resistive devices generate heat............."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["All electronic resistive devices do give off heat, even semi-conductors."], "jumps": []}, {"id": "P1130", "text": ["As stated, all electronic components with resistance will heat up as current flows through the circuit."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["A measure of how much heat is generated is a component's thermal resistance, qR."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["qR equates electrical watts to the temperature within the core of the device and is rated as degrees C per electrical watt."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["qR is given by the manufacturer and is used to determine how hot the core of a component will get depending on the amount of power applied."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["This formula is used to calculate the temperature of the core temperature of a component when qR is known."], "jumps": ["P1180", "P1130", "PD"]}, {"id": "P1180", "text": ["T   is the core temperature of the component, T  is the ambient temperature, and P  is the electrical power used in the device.", "T is the core temperature of the component, T is the ambient temperature, and P is the electrical power used in the device."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["For example, if a resistor is rated at 20 degrees C/watt (qR), has a resistance of 10 ohms with 10 volts applied, and the ambient temperature is 20 degrees C, T   is 220 degrees C.", "For example, if a resistor is rated at 20 degrees C/watt (qR), has a resistance of 10 ohms with 10 volts applied, and the ambient temperature is 20 degrees C, T is 220 degrees C...."], "jumps": ["P1200", "P1170", "P1195"]}, {"id": "P1192", "text": ["For example, if a resistor is rated at 20 degrees C/watt qR, has a resistance of 10 ohms with 10 volts applied, and the ambient temperature is 20 degrees C, T   is 220 degrees C.", "For example, if a resistor is rated at 20 degrees C/watt qR, has a resistance of 10 ohms with 10 volts applied, and the ambient temperature is 20 degrees C, T is 220 degrees C."], "jumps": ["P1200", "P1170", "P1195", "PD"]}, {"id": "P1195", "text": ["C 10W W = 20", "C W = 20", "CALCULATING T - To solve for the temperature of the resistor, you place the values given into the formula."], "jumps": ["P"]}, {"id": "P1200", "text": ["In other words, for each watt of electrical power, a device rated for a qR of 20 degrees C/W will raise the ambient temperature \n20 degrees C.", "In other words, for each watt of electrical power, a device rated for a qR of 20 degrees C/W will raise the ambient temperature 20 degrees C."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["What is the temperature of a resistor rated at 15 degrees C/Watt that uses 20 watts of power in a room at 25 degrees C?"], "jumps": ["P1170", "P1215"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["You did not add the ambient temperature to the calculations."], "jumps": ["P", "PD"]}, {"id": "P1213", "text": ["You reversed the ambient temperature with watts used in the device.", "Tj - Core Temperature T - Ambient Temperature"], "jumps": ["P", "PD"]}, {"id": "P1215", "text": ["CALCULATING Tj - To find the temperature of a device, you add the ambient temperature to the product of qR and power.", "Tj - Core Temperature T - Ambient Temperature"], "jumps": ["PD"]}, {"id": "P1220", "text": ["Another important use of qR is to find the maximum power that a component can handle without being damaged."], "jumps": ["P1230", "P1210", "P", "PD"]}, {"id": "P1230", "text": ["You are probably well aware that if you apply too much voltage to a resistive component, the component may fail or burn up."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["By rearranging the Tj formula, and by knowing the maximum temperature a component can withstand, you can determine the maximum power that can be applied.", "By rearranging the Tj formula, and by knowing the maximum temperature a component can withstand, you can determine the maximum power that can be applied..."], "jumps": ["P1250", "P1230", "P1245", "P"]}, {"id": "P1245", "text": [], "jumps": ["P"]}, {"id": "P1250", "text": ["Manufacturers normally give the maximum Tj  a component can withstand, along with the qR rating.", "Manufacturers normally give the maximum Tj a component can withstand, along with the qR rating.", "C qR = 20"], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["For example, with the given information, the maximum power that can be applied is 14 watts with an ambient temperature of 20 degrees C."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["An important observation to make is that the lower the ambient temperature, the more power a device can use."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["This is why electronic equipment is cooled or air-conditioned."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Given the following data for a wire wound resistor, what is the maximum power that can be applied?"], "jumps": ["P1270", "P1295"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["You did not use the ambient temperature in your calculations."], "jumps": []}, {"id": "P1293", "text": ["You added the ambient temperature to the maximum temperature that the resistor can withstand."], "jumps": []}, {"id": "P1295", "text": ["Tj - Core Temperature T - Ambient Temperature", "MAXIMUM POWER - To find the maximum amount of power a device can handle, you subtract the ambient temperature from the maximum allowable temperature and divide by the thermal resistance."], "jumps": []}, {"id": "P1300", "text": ["Finally, most manufacturers give a graph for each resistive device."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The graph eliminates calculations."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["For example, a specific device at an ambient temperature of 20 degrees C can withstand up to about 7 watts of power."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["When components heat up the heat must be dissipated before damage occurs."], "jumps": ["P1350", "P1300"]}, {"id": "P1350", "text": ["This process, called dissipation, is accomplished using a heat sink, a material in contact with the heat source."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["Heat sinks lower the core temperature of the heat source and facilitate heat transfer to the surrounding air."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["When a heating device uses a heat sink, qR is replaced with qja. qja is the total thermal resistance from the core of the component to air."], "jumps": ["P1380", "P1350", "P"]}, {"id": "P1380", "text": ["qja is lower than qR, this reduces the heating devices core temperature.  This reduction raises the amount of power that can be applied.", "qja is lower than qR, this reduces the heating devices core temperature. This reduction raises the amount of power that can be applied."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["The value of qja depends on the type of component, case and heat sink used.", "qja - Total Thermal Resistance qjc - Component Core to Case qsc - Component Case to Heat Sink qsa - Heat Sink to Airrr"], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["The total thermal resistance is equal to the sum of the individual thermal resistances."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Where qjc is the thermal resistance of the component's core to case."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["qsc is the thermal resistance of the case to heat sink."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["qsa is the thermal resistance of the heat sink to air."], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["These values can be found in reference books for different types of heat sources and heat sinks."], "jumps": ["P1450", "P1390"]}, {"id": "P1450", "text": ["Once qja is calculated, the core temperature (Tj ) of the device can be found."], "jumps": ["P1460", "P1390", "P"]}, {"id": "P1460", "text": ["Given the following data, what is the total thermal resistance of the device using a heat sink?"], "jumps": ["P1450", "P1465"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["You multiplied the various values to arrive at qja.  You should have added.", "You multiplied the various values to arrive at qja. You should have added."], "jumps": []}, {"id": "P1463", "text": ["You subtracted qjc and qcs from qsa.  You should have added the values to arrive at qja.", "You subtracted qjc and qcs from qsa. You should have added the values to arrive at qja."], "jumps": []}, {"id": "P1465", "text": ["qja - Total Thermal Resistance qjc - Component Core to Case qsc - Component Case to Heat Sink qsa - Heat Sink to Airrr", "qja - To find qja, you add the values of thermal resistance."], "jumps": []}, {"id": "P1470", "text": ["Given the following data, what is the difference in the core temperature between not using a heat sink and using a heat sink?"], "jumps": ["P1460", "P1475"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["220 degrees C is the core temperature of the device without using a heat sink.  The question asks for the temperature difference between using and not using a heat sink.", "220 degrees C is the core temperature of the device without using a heat sink. The question asks for the temperature difference between using and not using a heat sink."], "jumps": []}, {"id": "P1473", "text": ["To arrive at 115 degrees C, you subtracted the two temperatures but, you did not calculate Tj using a heat sink correctly.  You forgot to add the ambient temperature.", "To arrive at 115 degrees C, you subtracted the two temperatures but, you did not calculate Tj using a heat sink correctly. You forgot to add the ambient temperature."], "jumps": []}, {"id": "P1475", "text": ["Tj = T + (qR x P ) Tj = T + (qja x P ))))", "HEAT SINK FORMULAS - To find the temperature difference, you must first calculate core temperature of the device using a heat sink and not using a heat sink. Then, you find the difference by subtracting Tj with a heat sink from Tj without a heat sink."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on GENERATORS.", "This completes the information on GENERATORS. TITLE........"], "jumps": ["P1470"]}, {"id": "P1920", "text": ["1.  Heat generators are either I2R, friction, or chemical.", "1. Heat generators are either I2R, friction, or chemical.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Electronic heat generators are normally I2R......"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  I 2R heat generators produce heat by the action of current                flowing through a resistance.", "3. I 2R heat generators produce heat by the action of current flowing through a resistance...."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  Thermal Resistance, qR, is a measure of how much heat is             produced.", "4. Thermal Resistance, qR, is a measure of how much heat is produced.."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The core temperature of a device is found by using qR.", "5. The core temperature of a device is found by using qR.."], "jumps": ["P1970", "P1950", "P"]}, {"id": "P1970", "text": ["6.  Dissipation transfers the core heat of a device to the                         surrounding air.  A heat sink is usually used.", "6. Dissipation transfers the core heat of a device to the surrounding air. A heat sink is usually used."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  qja is the total thermal resistance for a component using a              heat sink.", "7. qja is the total thermal resistance for a component using a heat sink.."], "jumps": ["P1990", "P1970", "P"]}, {"id": "P1990", "text": ["8.  qja is the sum of the thermal resistance between core and               case, between case and heat sink, and heat sink and the air.", "8. qja is the sum of the thermal resistance between core and case, between case and heat sink, and heat sink and the air."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Heat sensors are either resistive, current, or voltage devices."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["These types of sensors are electrical in nature and produce outputs that are calibrated to indicate temperature in Fahrenheit (F), Celsius (C), or Kelvin (K)."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["Before looking at electrical sensors, let's see how the more familiar mechanical heat sensors operate.", "Before looking at electrical sensors, let's see how the more familiar mechanical heat sensors operate.."], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["The thermometer is a common device used to sense heat.", "The thermometer is a common device used to sense heat......"], "jumps": ["P2050", "P2015"]}, {"id": "P2050", "text": ["Liquid mercury fills a reservoir and expands or contracts at a rate of about .01% per degree F."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["As temperature increases, the mercury is pushed up the hollow stem due to expansion.  When temperature decreases, the mercury falls down the stem due to contraction.", "As temperature increases, the mercury is pushed up the hollow stem due to expansion. When temperature decreases, the mercury falls down the stem due to contraction.."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The scale on the hollow stem is marked in F, C, or K."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["A Filled System Thermometer, a Bourdon Tube, uses a liquid or gas in a spiral tube."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["As the liquid gas heats up or cools off, the spiral expands or contracts causing the pointer to move."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The scale used is marked in F, C, or K."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["The Bi-metallic thermometers bend two dissimilar metals into a spiral.  They are normally used in home thermometers.", "The Bi-metallic thermometers bend two dissimilar metals into a spiral. They are normally used in home thermometers.."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["The two metals expand and contract at different rates according to the temperature, thus moving the pointer."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Again, the scale is marked in F, C, or K."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["The Filled System and the Bi-metallic thermometers can have the pointer connected to a potentiometer for use in electrical circuits."], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["What principle do mechanical heat sensors operate on?", "What principle do mechanical heat sensors operate on?......"], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["Voltage and current are electrical properties.  Mechanical sensors do not operate using electrical properties.", "Voltage and current are electrical properties. Mechanical sensors do not operate using electrical properties."], "jumps": []}, {"id": "P2153", "text": ["Hot and cold are human terms used to describe temperature.  All heat sensors sense hot and cold but in terms of temperature.", "Hot and cold are human terms used to describe temperature. All heat sensors sense hot and cold but in terms of temperature."], "jumps": []}, {"id": "P2160", "text": ["Now, let's look at four electrical heat sensors.", "Now, let's look at four electrical heat sensors............", "Thermo-couplers Thermistors Solid State Sensors ResistanceTemperatureeeeeeee"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The thermo-couple, TC, is a voltage heat sensor.", "Thermo-couplers Thermistors Solid State Sensors ResistanceTemperatureeeeeeee"], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["It is the simplest of the electrical sensors and was discovered in 1812."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The thermo-couple is nothing more than two dissimilar metal wires intertwined at one end."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["When heat is applied to the twisted end, electrons in one of the metals tend to move away from the heat, to the free end."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["This produces a negative charge on the free end of the metal pieces."], "jumps": ["P2220", "P2180"]}, {"id": "P2220", "text": ["At the same time, electrons in the other metal tend to move toward the heat, to the twisted end."], "jumps": ["P2230", "P2180"]}, {"id": "P2230", "text": ["This produces a positive charge on the free end of the other metal piece."], "jumps": ["P2240", "P2180"]}, {"id": "P2240", "text": ["The result is a small difference in potential across the two open ends depending on the amount of heat, this is a variable voltage source."], "jumps": ["P2250", "P2180"]}, {"id": "P2250", "text": ["Thermo-couplers are rated in mV/F and depending on the types of metals used have various ranges.", "0 1k 2k 3k 4k 5k"], "jumps": ["P2260", "P2180"]}, {"id": "P2260", "text": ["Notice that at 5000\u00ba Fahrenheit the output signal is only 50 mV.", "Fahrenheit the output signal is only 50 mV."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Since TC's have very small output voltages op-amps are normally used to boost the signal."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["A thermistor (TH) is a heat sensitive resistor.  This is a resistive heat sensor.", "A thermistor (TH) is a heat sensitive resistor. This is a resistive heat sensor..", "Thermo-couplers Thermistors ResistanceTemperature Detectors Solid State Sensors"], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["Thermistors are made of oxides consisting of nickel, manganese, cobalt, and copper."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["TH's have negative temperature coefficients.  This means as temperature increases, resistance decreases and when temperature decreases, resistance increases.", "TH's have negative temperature coefficients. This means as temperature increases, resistance decreases and when temperature decreases, resistance increases."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Comparing a thermistor to a thermo-couple, you can see that output, R, is not linear and the range of temperature are less than the TC.", "Comparing a thermistor to a thermo-couple, you can see that output, R, is not linear and the range of temperature are less than the TC. TC.", "-100 0 +100 +200 +300 +400 +500"], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["Because of the non-linear output, most thermistors use a scale similar to VOM ohmmeter scales."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Thermistors are used in circuits that sense temperatures between -150\u00ba  F to 600\u00ba  F.  They are very sensitive to temperature changes.", "Thermistors are used in circuits that sense temperatures between -150", "F. They are very sensitive to temperature changes..", ") -150 to +150 +150 to +300 +300 to +600", "Ohmic Values Available at Ambient (25", "C) 100 k to 2 K 2 K to 75 K 75 K to 500 K"], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["Circuits that use thermistors use the resistance of the device to control current flow."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["By scaling an ammeter, you can get direct readouts of temperature in F, C, or K."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["The resistance temperature detector (RTD) is very similar to the thermistor (TH).  It also is a resistive heat sensor.", "The resistance temperature detector (RTD) is very similar to the thermistor (TH). It also is a resistive heat sensor.", "Thermo-couplers Thermistors ResistanceTemperature Detectors Solid State Sensors"], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["RTDs are made of pure metals such as platinum, copper, and nickel."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["The difference is that RTDs have a positive temperature coefficient.  This means as temperature increases, resistance increases and when temperature decreases, resistance decreases.", "The difference is that RTDs have a positive temperature coefficient. This means as temperature increases, resistance increases and when temperature decreases, resistance decreases.."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["RTDs have a more linear output and are more sensitive to temperature changes than THs.", "Sensitivity TH - 5% per degree RTD - 0.3% per degree"], "jumps": ["P2400", "P2370"]}, {"id": "P2400", "text": ["The temperature range is only from approximately -100 degrees F to 400 degrees F."], "jumps": ["P2410", "P2370"]}, {"id": "P2410", "text": ["Circuits that use RTDs are similar to TH circuits, only a more complex design is needed due to the 0.3% sensitivity."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["The final heat sensor is the solid state sensor, TD.  They are current heat sensor devices.", "The final heat sensor is the solid state sensor, TD. They are current heat sensor devices..", "Thermo-couplers Thermistors ResistanceTemperature Detectors Solid State Sensors"], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["The solid state heat sensor is nothing more than a diode.", "The solid state heat sensor is nothing more than a diode..."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["TDs operate by using the reverse bias leakage current."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["All reverse biased PN junctions exhibit leakage current.  The leakage current is proportional to temperature.", "All reverse biased PN junctions exhibit leakage current. The leakage current is proportional to temperature."], "jumps": ["P2470", "P2430"]}, {"id": "P2470", "text": ["By using this property, a diode is easily used as a heat sensor."], "jumps": ["P2480", "P2430"]}, {"id": "P2480", "text": ["Silicon diodes double the leakage current for each 6 degrees C of temperature change.", "Silicon Diode Germanium Diode"], "jumps": ["P2490", "P2430"]}, {"id": "P2490", "text": ["While Germanium diodes double leakage current for every 10 degrees C of temperature change.", "Silicon Diode Germanium Diodee"], "jumps": ["P2500", "P2430"]}, {"id": "P2500", "text": ["Circuits that use diodes as temperature sensors normally use an amplifier due to the small values of leakage current."], "jumps": ["P2510", "P2430"]}, {"id": "P2510", "text": ["An ammeter can be used to indicate temperature.  Remember, heat sensors are current diodes.", "An ammeter can be used to indicate temperature. Remember, heat sensors are current diodes."], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["What type of heat sensor is the thermo-couple?", "What type of heat sensor is the thermo-couple?............."], "jumps": ["P2500"]}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2522", "text": ["Resistive heat sensors are the TH and RTD.", "Resistive heat sensors are the TH and RTD.................."], "jumps": []}, {"id": "P2523", "text": ["Current heat sensors are diodes or solid state devices.", "Current heat sensors are diodes or solid state devices....."], "jumps": []}, {"id": "P2530", "text": ["Which of the below is not a resistive heat sensor?", "Which of the below is not a resistive heat sensor?........."], "jumps": ["P2520"]}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2532", "text": ["The TH is a thermistor.  It is a resistor that changes resistance according to the temperature (negative coefficient).", "The TH is a thermistor. It is a resistor that changes resistance according to the temperature (negative coefficient)."], "jumps": []}, {"id": " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
