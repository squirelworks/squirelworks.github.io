"P335", "text": [], "jumps": []}, {"id": "P400", "text": ["Registers are devices that temporarily store and transfer data."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["They are manufactured as ICs and commonly have capacities of 4, 5, 8 or 16 bits."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Inputs and outputs can be serial, parallel or both. The serial or parallel outputs inputs are synchronously clocked .", "Inputs and outputs can be serial, parallel or both. The serial or parallel outputs inputs are synchronously clocked .chronous ."], "jumps": ["P425", "P440", "P410"]}, {"id": "P425", "text": ["SYNCHRONOUS - Having a fixed time relationship. The output of a device changes state only at a specified point on a triggering input, such as the clock input to a flip-flop."], "jumps": []}, {"id": "P440", "text": ["Some registers use inputs such as preset and clear that do not require clock pulses.  These inputs and outputs are asynchronous.", "Some registers use inputs such as preset and clear that do not require clock pulses. These inputs and outputs are asynchronous."], "jumps": ["P450", "P420", "P445"]}, {"id": "P441", "text": ["Some registers use inputs such as preset and clear that do not require clock pulses.  These inputs and outputs are asynchronous.", "Some registers use inputs such as preset and clear that do not require clock pulses. These inputs and outputs are asynchronous."], "jumps": ["P445", "P450", "P420"]}, {"id": "P445", "text": ["ASYNCHRONOUS - Having no fixed time relationship. The input/output does not need a timing input. For example, the clear and preset inputs to a flip-flop are asynchronous."], "jumps": []}, {"id": "P450", "text": ["Let's begin the lesson on 8 BIT SHIFT REGISTER............................"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": ["P450"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["An 8 bit shift register is designed to transfer eight bits of binary data from one circuit to another."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Other registers shift 4, 5 and 16 or more bits.  For example, three 4 bit registers can shift 12 bits of data if connected.", "Other registers shift 4, 5 and 16 or more bits. For example, three 4 bit registers can shift 12 bits of data if connected."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["You learned that some registers shift serial data. Touch next and observe serial data input.", "You learned that some registers shift serial data. Touch next and observe serial data input.g", "A clock pulse is required to input and output one bit of data...", "NOTE ock pulse is required to input and output one bit of data..."], "jumps": ["P1020"]}, {"id": "P1060", "text": ["You learned that some registers shift serial data.   Touch next and observe serial data output.", "You learned that some registers shift serial data. Touch next and observe serial data output..", "A clock pulse is required to input and output one bit of data...", "NOTE ock pulse is required to input and output one bit of data..."], "jumps": ["P1050"]}, {"id": "P1080", "text": ["You learned that some registers shift parallel data. Touch next and observe parallel data input and output.", "One clock pulse is needed to input all eight bits of data.ata...", "NOTE ock pulse is required to input and output one bit of data..."], "jumps": ["P1091", "P1050"]}, {"id": "P1091", "text": ["You learned that some registers shift parallel data. Touch next to continue.", "You learned that some registers shift parallel data. Touch next to continue.parallel data input and output.", "One clock pulse is needed to input all eight bits of data.ata...", "NOTE ock pulse is required to input and output one bit of data..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Registers shift data on manual commands.  For example, numbers entered into a hand held calculator.", "Registers shift data on manual commands. For example, numbers entered into a hand held calculator."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Data shifted manually is called asynchronous . The next input occurs at any time."], "jumps": ["P1120", "P1100", "P1115"]}, {"id": "P1112", "text": ["Data shifted manually is called asynchronous . The next input occurs at any time.", "Data shifted manually is called asynchronous . The next input occurs at any time.."], "jumps": ["P1115", "P1120", "P1100"]}, {"id": "P1115", "text": ["ASYNCHRONOUS - Having no fixed time relationship. The output of a device changes state whenever the input is active, such as the clear and preset inputs to a flip-flop."], "jumps": []}, {"id": "P1120", "text": ["Registers also shift data automatically.  A computer executing a program uses automatic data shifting.", "Registers also shift data automatically. A computer executing a program uses automatic data shifting."], "jumps": ["P1130", "P1112"]}, {"id": "P1130", "text": ["Data shifted automatically is called synchronous . A specific time between inputs is controlled by a clock pulse."], "jumps": ["P1140", "P1120", "P1135"]}, {"id": "P1132", "text": ["Data shifted automatically is called synchronous . A specific time between inputs is controlled by a clock pulse.", "Data shifted automatically is called synchronous . A specific time between inputs is controlled by a clock pulse.."], "jumps": ["P1135", "P1140", "P1120"]}, {"id": "P1135", "text": ["SYNCHRONOUS - Having a fixed time relationship. The output of a device changes state only at a specified point on a triggering input, such as the clock input to a flip-flop."], "jumps": []}, {"id": "P1140", "text": ["Which term describes data shifted automatically?", "Which term describes data shifted automatically?..........."], "jumps": ["P1132"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Asynchronous data is shifted manually.  For example, any keyboard input that waits for the next manual input is asynchronous.", "Asynchronous data is shifted manually. For example, any keyboard input that waits for the next manual input is asynchronous."], "jumps": []}, {"id": "P1143", "text": ["Right shift describes the direction data is shifted inside the register."], "jumps": []}, {"id": "P1150", "text": ["Which term describes data shifted manually?", "Which term describes data shifted manually?................"], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Synchronous data is shifted automatically.  For example, operations that occur at specific times are synchronized by clock inputs.", "Synchronous data is shifted automatically. For example, operations that occur at specific times are synchronized by clock inputs."], "jumps": []}, {"id": "P1153", "text": ["Left shift describes the direction data is shifted inside the register.", "This register uses both synchronous and asynchronous inputs and outputs."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Serial inputs are synchronous and controlled by the clock input."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Each clock pulse shifts data one flip-flop to the right.  Serial synchronous data is available at the output.", "Each clock pulse shifts data one flip-flop to the right. Serial synchronous data is available at the output."], "jumps": ["P1185", "P1160"]}, {"id": "P1185", "text": ["Notice that synchronous parallel output data is available on each clock pulse at QA through QH."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Parallel inputs are asynchronous and controlled by a high applied to the Preset enable."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["Parallel inputs PA through PH manually provide data inputs to the register."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["Enabling the clear input resets the register.  The register's content is 00000000.", "Enabling the clear input resets the register. The register's content is 00000000."], "jumps": ["P1220", "P1160"]}, {"id": "P1220", "text": ["When the preset input is high, a high on any P input shifts a 1 into the register.  The clock is not used.", "When the preset input is high, a high on any P input shifts a 1 into the register. The clock is not used."], "jumps": ["P1230", "P1160"]}, {"id": "P1230", "text": ["How is serial data shifted into a register?", "How is serial data shifted into a register?................"], "jumps": ["P1160"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["Serial data shifts into the register one bit at a time.  A clock or synchronous signal is required.", "Serial data shifts into the register one bit at a time. A clock or synchronous signal is required."], "jumps": []}, {"id": "P1233", "text": ["The preset input to a flip-flop is not dependent on a clock pulse so it is asynchronous.  Serial data shifts into the register one bit at a time.  A clock or synchronous signal is required.", "The preset input to a flip-flop is not dependent on a clock pulse so it is asynchronous. Serial data shifts into the register one bit at a time. A clock or synchronous signal is required."], "jumps": []}, {"id": "P1240", "text": ["How is manual parallel data shifted into a register?", "How is manual parallel data shifted into a register?......."], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["Manual parallel data is not clock dependent.  Synchronous inputs require a clock.", "Manual parallel data is not clock dependent. Synchronous inputs require a clock."], "jumps": []}, {"id": "P1243", "text": ["The D input requires a clock pulse to set or reset the flip-flop.  Manual inputs do not require clock.", "The D input requires a clock pulse to set or reset the flip-flop. Manual inputs do not require clock."], "jumps": []}, {"id": "P1250", "text": ["Now let's look at a typical circuit in a hand held calculator and see how different registers can be used.", "A D D E RRRRRRRR"], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Pressing a number key on the calculator shifts a binary number into register A."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The input is manual asynchronous.  Parallel data is shifted in.", "The input is manual asynchronous. Parallel data is shifted in."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The parallel output of the register is sent to the display."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["Pressing the + key shifts synchronous serial data from register A to register B."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["The second number is then entered into register A by asynchronous parallel input."], "jumps": ["P1310", "P1250"]}, {"id": "P1310", "text": ["Pressing the = key, synchronous serial data shifts from register A to register C."], "jumps": ["P1350", "P1220"]}, {"id": "P1320", "text": ["The stored contents of registers B and C are serially shifted to the adder and summed."], "jumps": ["P1330", "P1250"]}, {"id": "P1330", "text": ["The sum is serially shifted back to register A and then sent in parallel to the display."], "jumps": ["P1340", "P1250"]}, {"id": "P1340", "text": ["This circuit used registers with asynchronous parallel inputs."], "jumps": ["P1350", "P1250"]}, {"id": "P1350", "text": ["This circuit used registers with a asynchronous parallel outputs."], "jumps": ["P1360", "P1250"]}, {"id": "P1360", "text": ["This circuit used registers with synchronous serial inputs."], "jumps": ["P1370", "P1250"]}, {"id": "P1370", "text": ["This circuit used registers with synchronous serial outputs."], "jumps": ["P1910", "P1250"]}, {"id": "P1910", "text": ["This completes the information on SHIFT REGISTER.", "1.  8 bit shift registers are designed to transfer eight bits of binary      data from one circuit to another.", "This completes the information on SHIFT REGISTER.LE........", "1. 8 bit shift registers are designed to transfer eight bits of rallel data inputs."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["IC1 and IC2 are 5 bit shift registers connected to make an 8 bit register.  The last flip-flop in each IC is not used.  Let's start the experiment.", "IC1 and IC2 are 5 bit shift registers connected to make an 8 bit register. The last flip-flop in each IC is not used. Let's start the experiment."], "jumps": []}, {"id": "P2070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2040"]}, {"id": "P2080", "text": ["2.  Set the Voltmeter Switch to Positive.  \n3.  Set the Positive Supply Voltage to 5. The Test Console's                  Voltage Meter should indicate 5 volts.", "2. Set the Voltmeter Switch to Positive. 3. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts. SCAN FCC 0 External program = SCAN PWR 0 12"], "jumps": ["P2070"]}, {"id": "P2090", "text": ["4.  Carefully plug PC130-111 into the Test Console PC1 position.  5.  Carefully plug PC130-127 into the Test Console PC2 position.", "4. Carefully plug PC130-111 into the Test Console PC1 position. 5. Carefully plug PC130-127 into the Test Console PC2 position. External program = SCAN FTR 0 C1 00 External program = SCAN FTR 0 F1 14"], "jumps": ["P2080"]}, {"id": "P2100", "text": ["6.  Set S2 to PULSER and S3 to 0 on PC130-111.  \n7.  Set S10 to LOAD on PC130-127.\n8.  Connect the logic probe to PC130-111.", "6. Set S2 to PULSER and S3 to 0 on PC130-111. 7. Set S10 to LOAD on PC130-127. 8. Connect the logic probe to PC130-111..."], "jumps": ["P2110", "P2090", "P2105"]}, {"id": "P2105", "text": ["EXPERIMENT CARD PC130-111 - Set S2 to Pulser and set S3 to 0 EXPERIMENT CARD PC130-127 - Set S10 to LOAD"], "jumps": []}, {"id": "P2110", "text": ["9.  Set PC1 and PC2 DC switches to ON.", "9. Set PC1 and PC2 DC switches to ON. to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps er data and probe the outputs of the register to verify correct operation.", "This experiment demonstrates the operation of a 8 bit shift register. You will enter data and probe the outputs of the register to verify correct operation."], "jumps": ["P13040", "P2001"]}, {"id": "P13040", "text": ["Pick up the PC130-127 card.  This card demonstrates synchronous and asynchronous data inputs and outputs.", "Pick up the PC130-127 card. This card demonstrates synchronous and asynchronous data inputs and outputs."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["S1 through S8 on PC130-127 are the asynchronous parallel data inputs."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["IC1 and IC2 are 5 bit shift registers connected to make an 8 bit register.  The last flip-flop in each IC is not used.  Let's start the experiment.", "IC1 and IC2 are 5 bit shift registers connected to make an 8 bit register. The last flip-flop in each IC is not used. Let's start the experiment."], "jumps": ["P13070", "P13050"]}, {"id": "P13070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13040"]}, {"id": "P13080", "text": ["2.  Press Enter to set: Positive Supply Voltage - 5", "2. Press Enter to set: Positive Supply Voltage - 5........................"], "jumps": []}, {"id": "P13090", "text": ["3.  Carefully plug PC130-111 into the Test Console PC1 position.  4.  Carefully plug PC130-127 into the Test Console PC2 position.", "3. Carefully plug PC130-111 into the Test Console PC1 position. 4. Carefully plug PC130-127 into the Test Console PC2 position."], "jumps": ["P13100"]}, {"id": "P13100", "text": ["5.  Set S2 to PULSER and S3 to 0 on PC130-111.  \n6.  Set S10 to LOAD on PC130-127. \n7.  Connect the logic probe to PC130-111.", "5. Set S2 to PULSER and S3 to 0 on PC130-111. 6. Set S10 to LOAD on PC130-127. 7. Connect the logic probe to PC130-111.." let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
