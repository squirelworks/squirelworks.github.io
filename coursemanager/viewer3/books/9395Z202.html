const book = {"title": "9395Z202", "pages": [{"id": "PINFO", "text": ["07-14-00 Converted to ToolBook 7.1 format. jay 08-02-00 Text and Branching. frieda 09-13-00 Graphics added. Richard S. 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs 05-28-04 P2150 & 13150 changed text \"AC to DC converters\" to \"DC to AC static inverters. P2400 & 13400 added to script E105 and E107 on next button and P13410 back button reset faults. frieda 02-21-05 reviewed by patty 04-12-05 P10228, changed \"alternator\" to \"auxillary\". -Pennyestion page, Q1240. - Penny 07-14-00 Converted to ToolBook 7.1 format. jay"], "jumps": []}, {"id": "P13910", "text": ["This completes the experiment on SPLIT-BUS POWER DISTRIBUTION."], "jumps": ["P2001", "P13470"]}, {"id": "P13470", "text": ["2.  Remove all test equipment connections. \n3.  Remove the PC130-735 and PC130-736 cards.\n4.  Return all equipment to the designated storage areas.", "2. Remove all test equipment connections. 3. Remove the PC130-735 and PC130-736 cards. 4. Return all equipment to the designated storage areas."], "jumps": ["P13910", "P13460"]}, {"id": "P13460", "text": ["1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": []}, {"id": "P13440", "text": ["Remember, this experiment has introduced you to the idea of a Split- Bus system.  Most aircraft will have very intricate systems that run off of these same principles.", "Remember, this experiment has introduced you to the idea of a Split- Bus system. Most aircraft will have very intricate systems that run off of these same principles."], "jumps": ["P13410"]}, {"id": "P13430", "text": ["We have seen how a power distribution system can be designed to control the flow of power effectively between sources and loads."], "jumps": ["P13440", "P13410"]}, {"id": "P13420", "text": ["Power can be limited when a generator failure(s) occur.  This means only necessary loads receive power to extend the amount of time backup power can be used.", "Power can be limited when a generator failure(s) occur. This means only necessary loads receive power to extend the amount of time backup power can be used."], "jumps": ["P13430", "P13410"]}, {"id": "P13410", "text": ["Now the system is working properly.  It is important to remember that these switches you have set manually would be controlled by a computer located in an aircraft.", "Now the system is working properly. It is important to remember that these switches you have set manually would be controlled by a computer located in an aircraft."], "jumps": ["P13420"]}, {"id": "P13400", "text": ["Both of the generators should have become active again. The       system is now being powered by the generators and the                 battery can be charged.   \n6.  Set S2 to On, S3 to OFF and S1 to C.", "Both of the generators should have become active again. The system is now being powered by the generators and the battery can be charged. 6. Set S2 to On, S3 to OFF and S1 to C."], "jumps": ["P13390"]}, {"id": "P13390", "text": ["For this reason, the generator bus can power the essential loads, but the emergency power can't power the generator bus.  This allows the emergency bus to be powered by multiple sources independently.", "For this reason, the generator bus can power the essential loads, but the emergency power can't power the generator bus. This allows the emergency bus to be powered by multiple sources independently."], "jumps": ["P13400", "P13380"]}, {"id": "P13380", "text": ["It is also important to note the diode connected from the generator bus to the essential load.  A diode only allows power to flow in one direction.", "It is also important to note the diode connected from the generator bus to the essential load. A diode only allows power to flow in one direction."], "jumps": ["P13390", "P13370"]}, {"id": "P13370", "text": ["Now power is being applied to the emergency bus from the battery bus instead of through the generator bus.  This is important for emergency situations where the generator bus can't be used.", "Now power is being applied to the emergency bus from the battery bus instead of through the generator bus. This is important for emergency situations where the generator bus can't be used."], "jumps": ["P13380", "P13360"]}, {"id": "P13360", "text": ["5.  Set S3 to ON, and set S2 to OFF.", "5. Set S3 to ON, and set S2 to OFF........................"], "jumps": ["P13370", "P13350"]}, {"id": "P13352", "text": ["By looking at the indicators on the card you can see that only the battery light is illuminated.  This indicates that the battery is the   only source supplying the bus.", "By looking at the indicators on the card you can see that only the battery light is illuminated. This indicates that the battery is the only source supplying the bus."], "jumps": []}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13350", "text": ["Which source is supplying power to the bus?", "Which source is supplying power to the bus?................"], "jumps": []}, {"id": "P13340", "text": ["All power being used is from generator 2.  Now let's see what happens if both generators fail.", "All power being used is from generator 2. Now let's see what happens if both generators fail."], "jumps": []}, {"id": "P13330", "text": ["At this point power is being applied from the second                         generator to all busses.  Since power is limited non-essential         loads should be removed from the bus. \n4.  Set S1 to the left (not connected) position.", "At this point power is being applied from the second generator to all busses. Since power is limited non-essential loads should be removed from the bus. 4. Set S1 to the left (not connected) position."], "jumps": ["P13310"]}, {"id": "P13320", "text": ["Notice that everything connected to the first bus has turned           off.  To apply power to this bus we need to connect the bus            tie. \n3.  Set S4 to the UP (connected) position.", "Notice that everything connected to the first bus has turned off. To apply power to this bus we need to connect the bus tie. 3. Set S4 to the UP (connected) position."], "jumps": ["P13330"]}, {"id": "P13310", "text": ["As you can see from the lights, all systems are being powered and there are no visible faults in the system.  Let's fault one of the generators and observe the operation.", "As you can see from the lights, all systems are being powered and there are no visible faults in the system. Let's fault one of the generators and observe the operation."], "jumps": ["P13300"]}, {"id": "P13300", "text": ["2.  Set S1 and S2 of PC130-735 to the ON (up) position.  The                 engines have now started and generator power is applied to          all buses.  At this time an actual aircraft battery would be                 charged with power from the generator.", "2. Set S1 and S2 of PC130-735 to the ON (up) position. The engines have now started and generator power is applied to all buses. At this time an actual aircraft battery would be charged with power from the generator."], "jumps": ["P13310", "P13290"]}, {"id": "P13290", "text": ["1.  Set S2 on PC130-736 to the ON (right) position.  This applies          voltage from the battery to the essential circuits of the                      aircraft.  Remember, we need to start the engines first before          generator power can be used.", "1. Set S2 on PC130-736 to the ON (right) position. This applies voltage from the battery to the essential circuits of the aircraft. Remember, we need to start the engines first before generator power can be used."], "jumps": ["P13300", "P13280"]}, {"id": "P13280", "text": ["The AC to DC generator card is now setup properly.  Let's look at the operation of the Split-Bus system.", "The AC to DC generator card is now setup properly. Let's look at the operation of the Split-Bus system."], "jumps": ["P13290", "P13270"]}, {"id": "P13270", "text": ["Disconnect the ground lead from TP4 and connect it to ground. This voltage represents both voltages at their current level. 3. Adjust R3 for a 12 volt signal on the multimeter. Both voltages are now at 12 volts."], "jumps": ["P13280", "P13260"]}, {"id": "P13260", "text": ["2.  Adjust R4 until the multimeter indicates zero volts.  This                  indicates that the voltages are identical.", "2. Adjust R4 until the multimeter indicates zero volts. This indicates that the voltages are identical. (Graphics Text) NOTE The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable.", "The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable."], "jumps": ["P13270", "P13250"]}, {"id": "P13255", "text": ["MEASUREMENT SETUP - Set the multimeter to DC voltage and connect it between TP2 and TP4."], "jumps": []}, {"id": "P13250", "text": ["1.  Set the multimeter to measure DC voltage and connect it from        TP2 to TP4.  The voltage represented on the multimeter                    indicates the difference in voltage between the two                            generators.", "1. Set the multimeter to measure DC voltage and connect it from TP2 to TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P13260", "P13240", "P13255"]}, {"id": "P13240", "text": ["The next step is to set up the voltages from the AC to DC generator card.  This is important for proper operation.  This step will require a multimeter.", "The next step is to set up the voltages from the AC to DC generator card. This is important for proper operation. This step will require a multimeter."], "jumps": ["P13250"]}, {"id": "P13230", "text": ["7.  Press Enter to Set: PC1 AC Power Switch - ON \n                                          PC2 DC Power Switch - ON", "7. Press Enter to Set: PC1 AC Power Switch - ON PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P13220", "text": ["6.  Press Enter to Set: Positive Supply Voltage - 12", "6. Press Enter to Set: Positive Supply Voltage - 12......................."], "jumps": ["P13210"]}, {"id": "P13210", "text": ["4.  Insert PC130-736 into the PC2 position. \n5.  Set S1 - C (right)     S2 - OFF (left) \n     S3 - OFF (left)           S4 - NC (down)", "4. Insert PC130-736 into the PC2 position. 5. Set S1 - C (right) S2 - OFF (left) S3 - OFF (left) S4 - NC (down)"], "jumps": ["P13220", "P13200"]}, {"id": "P13200", "text": ["2.  Insert PC130-735 into the PC1 position. \n3.  Set S1 - OFF (down)      S2 - OFF (down)\n     R3 - Fully CCW                R4 - Fully CCW", "2. Insert PC130-735 into the PC1 position. 3. Set S1 - OFF (down) S2 - OFF (down) R3 - Fully CCW R4 - Fully CCW"], "jumps": ["P13210"]}, {"id": "P13180", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13060"]}, {"id": "P13170", "text": [], "jumps": ["P13180", "P13060"]}, {"id": "P13160", "text": ["Remember, all of the components on these cards are representations of aircraft relays and breakers which would be controlled in flight by a flight computer."], "jumps": ["P13170", "P13060"]}, {"id": "P13150", "text": ["Also seen on the card are representations of DC to AC static inverters.  Some loads on aircraft require AC power and these devices convert the DC to AC from the generator bus.", "Also seen on the card are representations of DC to AC static inverters. Some loads on aircraft require AC power and these devices convert the DC to AC from the generator bus."], "jumps": ["P13160", "P13060"]}, {"id": "P13140", "text": ["The emergency bus connects directly to the essential busses. This bus can be powered by the generator bus or directly from the battery through S3.  If a generator bus becomes damaged, this is an alternate route for power.", "The emergency bus connects directly to the essential busses. This bus can be powered by the generator bus or directly from the battery through S3. If a generator bus becomes damaged, this is an alternate route for power."], "jumps": ["P13150", "P13060"]}, {"id": "P13130", "text": ["The second bus connects to the essential and emergency busses.  This is the most important bus of the Split-Bus Distribution system.  The battery switch connects or disconnects battery power to this bus.", "The second bus connects to the essential and emergency busses. This is the most important bus of the Split-Bus Distribution system. The battery switch connects or disconnects battery power to this bus."], "jumps": ["P13140", "P13060"]}, {"id": "P13120", "text": ["Switch S1 is a non-essential disconnect switch.  This removes all power from the non-essential loads.  This is important when power is limited.  Remember, the non-essential bus applies power to loads that are not necessary for safe flight.", "Switch S1 is a non-essential disconnect switch. This removes all power from the non-essential loads. This is important when power is limited. Remember, the non-essential bus applies power to loads that are not necessary for safe flight."], "jumps": ["P13130", "P13060"]}, {"id": "P13110", "text": ["The only time the busses would need to be connected is if one of the generators became faulty and were disconnected from the system."], "jumps": ["P13120", "P13060"]}, {"id": "P13100", "text": ["In normal operation this switch should be in the NC (not connected) position.  This in effect separates the two busses from each other.", "In normal operation this switch should be in the NC (not connected) position. This in effect separates the two busses from each other."], "jumps": ["P13110", "P13060"]}, {"id": "P13090", "text": ["The next two busses, bus 1 and bus 2, are the generator busses. The input to these busses is the output from the generators. Notice that there is a switch between the two busses."], "jumps": ["P13100", "P13060"]}, {"id": "P13080", "text": ["S2 and S3 are the switches used to distribute the power from the battery.  Remember, the battery should only be used to start the   aircraft or when the aircraft generators fail.", "S2 and S3 are the switches used to distribute the power from the battery. Remember, the battery should only be used to start the aircraft or when the aircraft generators fail."], "jumps": ["P13090", "P13060"]}, {"id": "P13070", "text": ["There are seven different busses represented on this card.  The bus to the far left is the battery bus.  This bus connects the battery output to the generator 2 and emergency busses.", "There are seven different busses represented on this card. The bus to the far left is the battery bus. This bus connects the battery output to the generator 2 and emergency busses."], "jumps": ["P13080", "P13060"]}, {"id": "P13060", "text": ["The PC130-736 card is the Split-Bus Distribution system.  Pick it up and examine it.", "The PC130-736 card is the Split-Bus Distribution system. Pick it up and examine it."], "jumps": ["P13070", "P13040"]}, {"id": "P13050", "text": ["Switches S1 and S2 are used to turn on and off the output of the generators.  The output we will be using is two 12 volt DC sources.", "Switches S1 and S2 are used to turn on and off the output of the generators. The output we will be using is two 12 volt DC sources."], "jumps": ["P13060", "P13040"]}, {"id": "P13040", "text": ["Pick up and examine the PC130-735 card. This card is the AC to DC generator system which provides two balanced DC voltages. We will be using both voltage sources for this experiment.", "Pick up and examine the PC130-735 card. This card is the AC to DC generator system which provides two balanced DC voltages. We will be using both voltage sources for this experiment..."], "jumps": []}, {"id": "P13030", "text": ["The circuits are mounted on two circuit cards.  The controls, components and indicators represent different sections of an       aircraft Split-Bus system.", "The circuits are mounted on two circuit cards. The controls, components and indicators represent different sections of an aircraft Split-Bus system."], "jumps": ["P13040", "P13020"]}, {"id": "P13020", "text": ["In this experiment, you will look at the basic operation of a Split- Bus Distribution system.  By understanding this operation,            troubleshooting of a faulty system can be quick and effective.", "In this experiment, you will look at the basic operation of a Split- Bus Distribution system. By understanding this operation, troubleshooting of a faulty system can be quick and effective."], "jumps": ["P13030", "P2001"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["Can individual loads be attached to the generator busses?"], "jumps": []}, {"id": "P10228", "text": ["In normal operation, auxillary busses should be?"], "jumps": []}, {"id": "P10227", "text": ["allow power to flow in only one direction."], "jumps": []}, {"id": "P10226", "text": ["loads would be considered a non-essential load?", "Which of the following loads would be considered a non-essential load?"], "jumps": []}, {"id": "P10225", "text": ["All busses in a Split-Bus Power Distribution system use DC power only, no AC is used?"], "jumps": []}, {"id": "P10224", "text": ["Which of the following loads would be considered a non-essential load?"], "jumps": []}, {"id": "P10223", "text": ["Which bus can be used when all generator power is lost and the main busses may be damaged?"], "jumps": []}, {"id": "P10222", "text": ["us Power Distribution system is under normal operation, can non-essential loads receive power?", "When a Split-Bus Power Distribution system is under normal operation, can non-essential loads receive power?"], "jumps": []}, {"id": "P10221", "text": ["A Split-Bus System providing from a main generator and an auxiliary generator is in what type of operation?"], "jumps": []}, {"id": "P10220", "text": ["If a generator fails in a 2 generator Split-Bus system, non-essential loads will be removed from the system."], "jumps": []}, {"id": "P10219", "text": ["The external power cannot be applied incorrectly because?"], "jumps": []}, {"id": "P10218", "text": ["When applying external power, power is also applied to the auxiliary generator."], "jumps": []}, {"id": "P10217", "text": [], "jumps": []}, {"id": "P10216", "text": ["When a generator fails, what type of loads are disconnected from the system?"], "jumps": []}, {"id": "P10215", "text": ["Loads in a Split-Bus Power Distribution system are all?", "Loads in a Split-Bus Power Distribution system are all _______", "attached only to the external power connectors."], "jumps": []}, {"id": "P10214", "text": ["What device connects and disconnects different sections of the system?"], "jumps": []}, {"id": "P10213", "text": ["An auxiliary generator is provided for _______"], "jumps": []}, {"id": "P10212", "text": ["Split-Bus Power Distribution systems have _______"], "jumps": []}, {"id": "P10211", "text": ["A Split-Bus Power Distribution system should work under _______"], "jumps": []}, {"id": "P10210", "text": ["The Split-Bus Power Distribution system is the only configuration used on aircraft?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2 s instead of through the generator bus.  This is important for emergency situations where the generator bus can't be used.", "Now power is being applied to the emergency bus from the battery bus instead of through the generator bus. This is important for emergency situations where the generator bus can't be used.."], "jumps": []}, {"id": "P2360", "text": ["5.  Set S3 to ON, and set S2 to OFF.", "5. Set S3 to ON, and set S2 to OFF........................"], "jumps": ["P2370", "P2350"]}, {"id": "P2352", "text": ["By looking at the indicators on the card you can see that only the battery light is illuminated.  This indicates that the battery is the   only source supplying the bus.", "By looking at the indicators on the card you can see that only the battery light is illuminated. This indicates that the battery is the only source supplying the bus."], "jumps": []}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2350", "text": ["Which source is supplying power to the bus?", "Which source is supplying power to the bus?................"], "jumps": ["P2340"]}, {"id": "P2340", "text": ["All power being used is from generator 2.  Now let's see what happens if both generators fail.", "All power being used is from generator 2. Now let's see what happens if both generators fail. o ON........................................."], "jumps": ["P2310"]}, {"id": "P2330", "text": ["At this point power is being applied from the second                         generator to all busses.  Since power is limited non-essential         loads should be removed from the bus. \n4.  Set S1 to the left (not connected) position.", "At this point power is being applied from the second generator to all busses. Since power is limited non-essential loads should be removed from the bus. 4. Set S1 to the left (not connected) position."], "jumps": ["P2310"]}, {"id": "P2320", "text": ["Notice that everything connected to the first bus has turned           off.  To apply power to this bus we need to connect the bus            tie. \n3.  Set S4 to the UP (connected) position.", "Notice that everything connected to the first bus has turned off. To apply power to this bus we need to connect the bus tie. 3. Set S4 to the UP (connected) position."], "jumps": ["P2330", "P2310"]}, {"id": "P2310", "text": ["As you can see from the lights, all systems are being powered and there are no visible faults in the system.  Let's fault one of the generators and observe the operation.", "As you can see from the lights, all systems are being powered and there are no visible faults in the system. Let's fault one of the generators and observe the operation."], "jumps": ["P2300"]}, {"id": "P2300", "text": ["2.  Set S1 and S2 of PC130-735 to the ON (up) position.  The                 engines have now started and generator power is applied to          all buses.  At this time an actual aircraft battery would be                 charged with power from the generator.", "2. Set S1 and S2 of PC130-735 to the ON (up) position. The engines have now started and generator power is applied to all buses. At this time an actual aircraft battery would be charged with power from the generator."], "jumps": ["P2310", "P2290"]}, {"id": "P2290", "text": ["1.  Set S2 on PC130-736 to the ON (right) position.  This applies          voltage from the battery to the essential circuits of the aircraft.       Remember, we need to start the engines first before generator      power can be used.", "1. Set S2 on PC130-736 to the ON (right) position. This applies voltage from the battery to the essential circuits of the aircraft. Remember, we need to start the engines first before generator power can be used."], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["The AC to DC generator card is now setup properly.  Let's look at the operation of the Split-Bus system.", "The AC to DC generator card is now setup properly. Let's look at the operation of the Split-Bus system."], "jumps": ["P2290", "P2270"]}, {"id": "P2270", "text": ["Disconnect the ground lead from TP4 and connect it to                    ground.  This voltage represents both voltages at their                     current level. \n 3.  Adjust R3 for a 12 volt signal on the multimeter.  Both                        voltages are now at 12 volts.", "Disconnect the ground lead from TP4 and connect it to ground. This voltage represents both voltages at their current level. 3. Adjust R3 for a 12 volt signal on the multimeter. Both voltages are now at 12 volts."], "jumps": ["P2280", "P2260"]}, {"id": "P2260", "text": ["2.  Adjust R4 until the multimeter indicates zero volts.  This                  indicates that the voltages are identical.", "2. Adjust R4 until the multimeter indicates zero volts. This indicates that the voltages are identical. (Graphics Text) NOTE The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable.", "The voltage will not be exactly zero, the lowest millivolt value obtained is acceptable."], "jumps": ["P2270", "P2250"]}, {"id": "P2255", "text": ["MEASUREMENT SETUP - Set the multimeter to DC voltage and connect it between TP2 and TP4."], "jumps": []}, {"id": "P2250", "text": ["1.  Set the multimeter to measure DC voltage and connect it from       TP2 to TP4.  The voltage represented on the multimeter                    indicates the difference in voltage between the two                            generators.", "1. Set the multimeter to measure DC voltage and connect it from TP2 to TP4. The voltage represented on the multimeter indicates the difference in voltage between the two generators."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2240", "text": ["The next step is to set up the voltages from the AC to DC generator card.  This is important for proper operation.  This step will require a multimeter.", "The next step is to set up the voltages from the AC to DC generator card. This is important for proper operation. This step will require a multimeter."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["7.  Press the FILAMENT power switch to ON. \n8.  Press PC1 AC Power switch to ON. \n9.  Press PC2 DC Power switch to ON.", "7. Press the FILAMENT power switch to ON. 8. Press PC1 AC Power switch to ON. 9. Press PC2 DC Power switch to ON."], "jumps": ["P2220"]}, {"id": "P2220", "text": ["6.  Set the Positive Supply Control to 11.  The Test Console's              voltage meter should indicate 11 volts.", "6. Set the Positive Supply Control to 11. The Test Console's voltage meter should indicate 11 volts."], "jumps": ["P2210"]}, {"id": "P2210", "text": ["4.  Insert PC130-736 into the PC2 position. \n5.  Set S1 - C (right)    S2 - OFF (left)     \n     S3 - OFF (left)          S4 - NC (down)", "4. Insert PC130-736 into the PC2 position. 5. Set S1 - C (right) S2 - OFF (left) S3 - OFF (left) S4 - NC (down)"], "jumps": ["P2200"]}, {"id": "P2200", "text": ["2.  Insert PC130-735 into the PC1 position. \n3.  Set S1 - OFF (down)    S2 - OFF (down) \n     R3 - Fully CCW              R4 - Fully CCW", "2. Insert PC130-735 into the PC1 position. 3. Set S1 - OFF (down) S2 - OFF (down) R3 - Fully CCW R4 - Fully CCW"], "jumps": ["P2180"]}, {"id": "P2180", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2060"]}, {"id": "P2170", "text": [], "jumps": ["P2180", "P2060"]}, {"id": "P2160", "text": ["Remember, all of the components on these cards are representations of aircraft relays and breakers which would be controlled in flight by a flight computer."], "jumps": ["P2170", "P2060"]}, {"id": "P2150", "text": ["Also seen on the card are representations of DC to AC static inverters.  Some loads on aircraft require AC power and these devices convert the DC to AC from the generator bus.", "Also seen on the card are representations of DC to AC static inverters. Some loads on aircraft require AC power and these devices convert the DC to AC from the generator bus."], "jumps": ["P2160", "P2060"]}, {"id": "P2140", "text": ["The emergency bus connects directly to the essential busses. This bus can be powered by the generator bus or directly from the battery through S3.  If a generator bus becomes damaged, this is an alternate route for power.", "The emergency bus connects directly to the essential busses. This bus can be powered by the generator bus or directly from the battery through S3. If a generator bus becomes damaged, this is an alternate route for power."], "jumps": ["P2150", "P2060"]}, {"id": "P2130", "text": ["The second bus connects to the essential and emergency busses.  This is the most important bus of the Split-Bus Distribution system.  The battery switch connects or disconnects battery power to this bus.", "The second bus connects to the essential and emergency busses. This is the most important bus of the Split-Bus Distribution system. The battery switch connects or disconnects battery power to this bus."], "jumps": ["P2140", "P2060"]}, {"id": "P2120", "text": ["Switch S1 is a non-essential disconnect switch.  This removes all power from the non-essential loads.  This is important when power is limited.  Remember, the non-essential bus applies power to loads that are not necessary for safe flight.", "Switch S1 is a non-essential disconnect switch. This removes all power from the non-essential loads. This is important when power is limited. Remember, the non-essential bus applies power to loads that are not necessary for safe flight."], "jumps": ["P2130", "P2060"]}, {"id": "P2110", "text": ["The only time the busses would need to be connected is if one of the generators became faulty and were disconnected from the system."], "jumps": ["P2120", "P2060"]}, {"id": "P2100", "text": ["In normal operation this switch should be in the NC (not connected) position.  This in effect separates the two busses from each other.", "In normal operation this switch should be in the NC (not connected) position. This in effect separates the two busses from each other."], "jumps": ["P2110", "P2060"]}, {"id": "P2090", "text": ["The next two busses, bus 1 and bus 2, are the generator busses. The input to these busses is the output from the generators. Notice that there is a switch between the two busses."], "jumps": ["P2100", "P2060"]}, {"id": "P2080", "text": ["S2 and S3 are the switches used to distribute the power from the battery.  Remember, the battery should only be used to start the   aircraft or when the aircraft generators fail.", "S2 and S3 are the switches used to distribute the power from the battery. Remember, the battery should only be used to start the aircraft or when the aircraft generators fail."], "jumps": ["P2090", "P2060"]}, {"id": "P2070", "text": ["There are seven different busses represented on this card.  The bus to the far left is the battery bus.  This bus connects the battery output to the generator 2 and emergency busses.", "There are seven different busses represented on this card. The bus to the far left is the battery bus. This bus connects the battery output to the generator 2 and emergency busses."], "jumps": ["P2080", "P2060"]}, {"id": "P2060", "text": ["The PC130-736 card is the Split-Bus Distribution system.  Pick it up and examine it.", "The PC130-736 card is the Split-Bus Distribution system. Pick it up and examine it."], "jumps": ["P2070", "P2040"]}, {"id": "P2050", "text": ["Switches S1 and S2 are used to turn on and off the output of the generators.  The output we will be using is two 12 volt DC sources.", "Switches S1 and S2 are used to turn on and off the output of the generators. The output we will be using is two 12 volt DC sources."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["Pick up and examine the PC130-735 card.  This card is the AC to DC generator system which provides two balanced DC voltages. We will be using both voltage sources for this experiment.", "Pick up and examine the PC130-735 card. This card is the AC to DC generator system which provides two balanced DC voltages. We will be using both voltage sources for this experiment."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["The circuits are mounted on two circuit cards.  The controls, components and indicators represent different sections of an       aircraft Split-Bus system.", "The circuits are mounted on two circuit cards. The controls, components and indicators represent different sections of an aircraft Split-Bus system."], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["In this experiment, you will look at the basic operation of a Split- Bus Distribution system.  By understanding this operation,            troubleshooting of a faulty system can be quick and effective.", "In this experiment, you will look at the basic operation of a Split- Bus Distribution system. By understanding this operation, troubleshooting of a faulty system can be quick and effective."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1920"]}, {"id": "P1930", "text": ["2.  It is important to know that in most Split-Bus systems when a        generator fails, all non-essential loads are automatically                   disconnected from the system.  This prevents overloading the      remaining generator.", "2. It is important to know that in most Split-Bus systems when a generator fails, all non-essential loads are automatically disconnected from the system. This prevents overloading the remaining generator."], "jumps": ["P1999", "P1920"]}, {"id": "P1920", "text": ["1.  The Split-Bus Power Distribution system differs from other             systems, in that it is two or more independent systems.  Each        generator powers its own bus, meaning the various loads are        \"Split\" up.", "1. The Split-Bus Power Distribution system differs from other systems, in that it is two or more independent systems. Each generator powers its own bus, meaning the various loads are \"Split\" up.", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on SPLIT-BUS POWER DISTRIBUTION."], "jumps": ["P1001", "P1200"]}, {"id": "P1200", "text": ["As you can see there are many advantages to using the Split-Bus Power Distribution system.  The diagrams below illustrate some other common power distribution configurations.", "As you can see there are many advantages to using the Split-Bus Power Distribution system. The diagrams below illustrate some other common power distribution configurations."], "jumps": ["P1910", "P1170"]}, {"id": "P1190", "text": ["Most aircraft have special socketed plugs that prevent power from being connected to the aircraft incorrectly.  The external power switching unit provides extra protection against incorrect power connection.", "Most aircraft have special socketed plugs that prevent power from being connected to the aircraft incorrectly. The external power switching unit provides extra protection against incorrect power connection.", "Relay Unit Prevents Incorrect Power Flower"], "jumps": ["P1200", "P1170"]}, {"id": "P1180", "text": ["Both bus tie switching units are connected so power flows from the external power source to all loads on the system.  If external power is connected incorrectly, a relay unit prevents it from being connected to the buses.", "Relay Unit Prevents Incorrect Power Flower", "Both bus tie switching units are connected so power flows from the external power source to all loads on the system. If external power is connected incorrectly, a relay unit prevents it from being connected to the buses."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["When an aircraft is on the ground and engines are off, external power is required.  External power is applied to the same line as the auxiliary generator.  The generator switching units are not connected so power doesn't flow to the generator.", "When an aircraft is on the ground and engines are off, external power is required. External power is applied to the same line as the auxiliary generator. The generator switching units are not connected so power doesn't flow to the generator.", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": ["P1180", "P1160"]}, {"id": "P1162", "text": ["By looking at the diagram you can see that the switching unit for generator 1 has been disconnected and the auxiliary generator has been connected to the 1st generator's bus.  This indicates that generator 1 may be faulty.", "By looking at the diagram you can see that the switching unit for generator 1 has been disconnected and the auxiliary generator has been connected to the 1st generator's bus. This indicates that generator 1 may be faulty.............", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": []}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1160", "text": ["By looking at the diagram below, and analyzing the status of the switching units, which generator do you think is faulty?", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": ["P1100"]}, {"id": "P1150", "text": ["Changing the position of the switching system applies the power from the auxiliary generator to the second transfer bus.  Now each bus is again independent.  On certain systems non-essential loads can be reattached to the system.", "Changing the position of the switching system applies the power from the auxiliary generator to the second transfer bus. Now each bus is again independent. On certain systems non-essential loads can be reattached to the system."], "jumps": ["P1160", "P1100"]}, {"id": "P1140", "text": ["By connecting the 2nd bus tie switching unit, power is supplied to the bus of generator two.  Since the switching system is still      connected to the 1st generator's bus, power from the auxiliary      generator is not connected to the 2nd transfer bus yet.", "By connecting the 2nd bus tie switching unit, power is supplied to the bus of generator two. Since the switching system is still connected to the 1st generator's bus, power from the auxiliary generator is not connected to the 2nd transfer bus yet."], "jumps": ["P1150", "P1100"]}, {"id": "P1130", "text": ["The auxiliary generator will be started.  The auxiliary power switching unit is now connected, but power is still not applied to  the bus.  We need to apply power from the auxiliary generator to the 2nd generator's bus.", "The auxiliary generator will be started. The auxiliary power switching unit is now connected, but power is still not applied to the bus. We need to apply power from the auxiliary generator to the 2nd generator's bus."], "jumps": ["P1140", "P1100"]}, {"id": "P1120", "text": ["It is important to know that in most Split-Bus systems when a generator fails, all non-essential loads are automatically          disconnected from the system.  This prevents overloading the      remaining generator.", "It is important to know that in most Split-Bus systems when a generator fails, all non-essential loads are automatically disconnected from the system. This prevents overloading the remaining generator."], "jumps": ["P1130", "P1100"]}, {"id": "P1110", "text": ["To get power from generator 1 to the loads that generator 2 supplies power to; the Bus Switching System of generator 2 is used.  The switching unit of generator 2 (G2) is disconnected and the Bus Switching System is changed connecting \ngenerator 2's loads to generator 1's output.", "To get power from generator 1 to the loads that generator 2 supplies power to; the Bus Switching System of generator 2 is used. The switching unit of generator 2 (G2) is disconnected and the Bus Switching System is changed connecting generator 2's loads to generator 1's output."], "jumps": ["P1120", "P1100"]}, {"id": "P1100", "text": ["Now let's say that generator 2 becomes faulty and we haven't started the auxiliary generator.  We need to disconnect \ngenerator 2 from the bus and some how connect power to the loads of generator 2.", "Now let's say that generator 2 becomes faulty and we haven't started the auxiliary generator. We need to disconnect generator 2 from the bus and some how connect power to the loads of generator 2.", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": ["P1110", "P1090"]}, {"id": "P1092", "text": ["Remember, the Split-Bus Power Distribution system is actually two or more independent systems.", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": []}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1090", "text": ["All generators in the Split-Bus Distribution system are all connected to the same bus."], "jumps": ["P1020"]}, {"id": "P1080", "text": ["The operation of Generator 2 is identical to Generator 1.  The Bus tie switching units are used when auxiliary power is needed.  The Auxiliary generator switching unit is not connected, which means the Auxiliary generator is not connected to the bus.", "The operation of Generator 2 is identical to Generator 1. The Bus tie switching units are used when auxiliary power is needed. The Auxiliary generator switching unit is not connected, which means the Auxiliary generator is not connected to the bus."], "jumps": ["P1090", "P1020"]}, {"id": "P1070", "text": ["Power then flows from the generator bus, through another switching system, to the load attached to the transfer bus.  The Bus Switching system is used to transfer power between generators in case one generator fails.", "Power then flows from the generator bus, through another switching system, to the load attached to the transfer bus. The Bus Switching system is used to transfer power between generators in case one generator fails."], "jumps": ["P1080", "P1020"]}, {"id": "P1060", "text": ["Let's analyze the operation of our generalized Split-Bus system. Both main generators are supplying power and their associated   switching unit is connected.  From generator one, power is applied to the generator bus, but not through the bus tie switching unit.", "Let's analyze the operation of our generalized Split-Bus system. Both main generators are supplying power and their associated switching unit is connected. From generator one, power is applied to the generator bus, but not through the bus tie switching unit."], "jumps": ["P1070", "P1020"]}, {"id": "P1050", "text": ["These different switching units include bus tie breakers, generator breakers, and bus switching systems.  In this lesson they will be referred to as switching units to simplify the operation of the Split-Bus system.", "These different switching units include bus tie breakers, generator breakers, and bus switching systems. In this lesson they will be referred to as switching units to simplify the operation of the Split-Bus system."], "jumps": ["P1060", "P1020"]}, {"id": "P1040", "text": ["The picture below illustrates a generalized Split-Bus Power Distribution system.  As you can see there are two main generators, and an auxiliary generator.  There are also many switching units that connect and disconnect different sections of the bus.", "The picture below illustrates a generalized Split-Bus Power Distribution system. As you can see there are two main generators, and an auxiliary generator. There are also many switching units that connect and disconnect different sections of the bus."], "jumps": ["P1050", "P1020"]}, {"id": "P1030", "text": ["Most Split-Bus Power Distribution systems contain an auxiliary generator for emergency situations.  This generator does not        generate power until it has been started either automatically or manually.", "Most Split-Bus Power Distribution systems contain an auxiliary generator for emergency situations. This generator does not generate power until it has been started either automatically or manually."], "jumps": ["P1040", "P1020"]}, {"id": "P1020", "text": ["The Split-Bus Power Distribution system differs from other systems, in that it is two or more independent systems.  Each generator powers its own bus, meaning the various loads are \"Split\" up.", "The Split-Bus Power Distribution system differs from other systems, in that it is two or more independent systems. Each generator powers its own bus, meaning the various loads are \"Split\" up.", "Independent Systems Generalized Split-BUS Power Distribution"], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on SPLIT-BUS POWER DISTRIBUTION...................."], "jumps": ["P420"]}, {"id": "P420", "text": ["Understanding how the Split-Bus system works will help in the effective troubleshooting of a faulty system."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["You will see how the Split-Bus system works in both normal and emergency situations.  Remember, power distribution systems must be able to compensate for power loss to allow proper flight of an aircraft.", "You will see how the Split-Bus system works in both normal and emergency situations. Remember, power distribution systems must be able to compensate for power loss to allow proper flight of an aircraft."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["While there are many different configurations for power distribution systems, we will be looking at the Split-Bus Power Distribution system.  This system is normally used on large aircraft.", "While there are many different configurations for power distribution systems, we will be looking at the Split-Bus Power Distribution system. This system is normally used on large aircraft."], "jumps": ["P410", "P300"]}, {"i let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
