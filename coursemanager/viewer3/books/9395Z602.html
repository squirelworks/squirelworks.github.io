const book = {"title": "9395Z602", "pages": [{"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1080 10211 1 111 1110 10212 1 112 1130 10213 1 113 1110 10214 1 114 1170 10215 1 115 1060 10216 1 116 1170 10217 1 117 1220 10218 1 118 1190 10219 1 119 1260 10220 2 120 2030 10221 2 121 2050 10222 2 122 2170 10223 2 123 2130 10224 2 124 2070 10225 2 125 2400 10226 2 126 2500 10227 2 127 2160 10228 2 128 2240 10229 2 129 1040 10230 3 130 30000 10231 3 131 30000 10232 3 132 30000 10233 3 133 30000 10234 3 134 30000 10235 3 135 30000 10236 3 136 30000 10237 3 137 30000 10238 3 138 30000 10239 3 139 30000 10240 10241 10242 10243 10244 10245 10246 10247 10248 10249", "Page # Test# Question# HelpPage # 10210 1 110 1080 10211 1 111 1110 10212 1 112 1130 10213 1 113 1110 10214 1 114 1170 10215 1 115 1060 10216 1 116 1170 10217 1 117 1220 10218 1 118 1190 10219 1 119 1260 10220 2 120 2030 10221 2 121 2050 10222 2 122 2170 10223 2 123 2130 10224 2 124 2070 10225 2 125 2400 10226 2 126 2500 10227 2 127 2160 10228 2 128 2240 10229 2 129 1040"], "jumps": []}, {"id": "PINFO", "text": ["11-26-01 Converted from sty to tbk. frieda 11-26-01 Text and Branching. frieda 12-07-01 Graphics. Alexis 02-12-02 review - rs 09-17-04 P400, P410, P420", "11-26-01 Converted from sty to tbk. frieda 11-26-01 Text and Branching. frieda 12-07-01 Graphics. Alexis 02-12-02 review - rs 09-17-04 P400, P410, P420, removed existing grapihcs and replaced them with new graphics. -Penny"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["Which part of an aircraft houses passengers and cargo?"], "jumps": []}, {"id": "P10228", "text": ["Which of the following is used to aid the movement of the primary flight controls?"], "jumps": []}, {"id": "P10227", "text": ["Which flight control below would be used along with the throttle to increase altitude?"], "jumps": []}, {"id": "P10226", "text": ["Which flight control is primarily used to slow a plane down for landing?"], "jumps": []}, {"id": "P10225", "text": ["Which flight control is used to increase lift, but at the same time increase drag?"], "jumps": []}, {"id": "P10224", "text": ["What primary control changes a plane's position in the roll axis?"], "jumps": []}, {"id": "P10223", "text": ["What primary control changes a plane's position in the pitch axis?"], "jumps": []}, {"id": "P10222", "text": ["What primary control changes a plane's position in the yaw axis?"], "jumps": []}, {"id": "P10221", "text": ["What flight control below is NOT in the auxiliary group?"], "jumps": []}, {"id": "P10220", "text": ["What flight control below is NOT in the primary group?"], "jumps": []}, {"id": "P10219", "text": ["How many axis of rotation does an aircraft experience in flight?"], "jumps": []}, {"id": "P10218", "text": ["A rocket blasting off demonstrates what law or principle?"], "jumps": []}, {"id": "P10217", "text": ["Velocity decreases and pressure decreases.", "Bernoulli's Principle says that if fluid flowing in a tube encounters a restriction...?", "Velocity increases and pressure increases.", "Velocity decreases and pressure increases.", "Velocity increases and pressure decreases."], "jumps": []}, {"id": "P10216", "text": ["Which force is overcome in flight by lift?"], "jumps": []}, {"id": "P10215", "text": ["What types of empennage configurations are common in aircraft?"], "jumps": []}, {"id": "P10214", "text": [], "jumps": []}, {"id": "P10213", "text": ["Fuselage stations and wing stations are measured in?"], "jumps": []}, {"id": "P10212", "text": ["From To find a fuel probe located on the left wing, what reference line do you use?"], "jumps": []}, {"id": "P10211", "text": ["To locate a component that is 154 inches behind the nose, what reference line do you use?"], "jumps": []}, {"id": "P10210", "text": ["Emergency beacon and cockpit voice recorder", "What equipment is normally found in the nose cone of a multi-engine aircraft?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2920"]}, {"id": "P2940", "text": ["3. Auxiliary Flight Controls: These controls consist of the speed brakes or spoilers, slats, flaps and slots. These auxiliary flight controls can be separated into two groups: lift increasers and lift decreasers. Lift increasers are the flaps, slots and slats. Lift decreasers are speed brakes or spoilers.."], "jumps": ["P2999", "P2920"]}, {"id": "P2930", "text": ["2. Secondary Flight Controls: These flight controls consist of trim tabs and spring tabs. The trim tabs are used to allow the pilot to adjust out any unbalanced conditions during flight, while the spring tabs are used to aid the pilot in moving the primary flight controls."], "jumps": ["P2940", "P2920"]}, {"id": "P2920", "text": ["1. Primary Flight Controls: These flight controls consist of the ailerons, elevators or stabilators and the rudder. They are used to safely maneuver an aircraft about its three axes."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on MANUAL FLIGHT CONTROLS..."], "jumps": ["P2001", "P2520"]}, {"id": "P2520", "text": ["As you can see, the manual flight controls are important to the proper operation of an airplane. Some planes may not use all the flight controls discussed and some controls may look slightly different but the operation and purpose is basically the same.."], "jumps": ["P2910", "P2510"]}, {"id": "P2513", "text": ["The slot is a fixed control that is used to smooth air flow over the wing. It does not move downward."], "jumps": []}, {"id": "P2512", "text": ["Remember, the slat is normally located on the leading edge of a wing, not the trailing edge."], "jumps": []}, {"id": "P2511", "text": [], "jumps": []}, {"id": "P2510", "text": ["What is the name of the auxiliary flight control, located on the trailing edge of a wing, that by moving downward increases the lift on a plane, while at the same time it decreases drag?"], "jumps": ["P2492"]}, {"id": "P2500", "text": ["When these plates are used to slow the plane down and decrease the lift they are known as speed brakes. There is a separate control in the cockpit for using these plates as speed brakes. In this mode of operation all plates are deflected upward..."], "jumps": ["P2510", "P2490"]}, {"id": "P2495", "text": ["BANK - Banking is a term used to describe the movement of a plane in the roll (longitudinal) axis."], "jumps": ["Pilots"]}, {"id": "P2492", "text": ["When these plates are used with ailerons to bank the aircraft they are called spoilers. The movement of the spoiler is normally automatic and dependent on the position of the ailerons."], "jumps": ["P2500", "P2480"]}, {"id": "P2490", "text": ["When these plates are used with ailerons to bank the aircraft they are called spoilers. The movement of the spoiler is normally automatic and dependent on the position of the ailerons."], "jumps": ["P2500", "P2480"]}, {"id": "P2480", "text": ["Speed brakes, also known as spoilers, are located on the upper surface of the wing. They move upward to disturb the flow of air across the wing, increasing drag and decreasing lift."], "jumps": ["P2490", "P2450"]}, {"id": "P2470", "text": ["Slats also change the camber of the wing. This is helpful for take off and landing of the plane. Now that we have looked at the lift increasers, let's look at a lift decreaser called speed brakes."], "jumps": ["P2480", "P2450"]}, {"id": "P2460", "text": ["Slats help to decrease the stall speed of the plane. One functional difference between the slot and slat is that the slat is adjustable and the plain slot is normally fixed."], "jumps": ["P2470", "P2450"]}, {"id": "P2450", "text": ["Slats are movable surfaces which are connected to the front or leading edge of a wing. When the slat is closed it forms the leading edge of the wing, when open it creates a slot in the leading edge of the wing..."], "jumps": ["P2460", "P2440"]}, {"id": "P2440", "text": ["At high angles of attack the air flow starts to become rough and air burbles or eddys over the wing. This causes the nose of the aircraft to drop and the aircraft stalls. Slots help reduce the aircraft's stall speed and allow slower cruising speeds."], "jumps": ["P2450", "P2430"]}, {"id": "P2430", "text": ["Slots are placed on the leading edge of the wing. Slots allow smooth air flow across the wing."], "jumps": ["P2440", "P2420"]}, {"id": "P2420", "text": ["Below are some examples of common flaps. Notice that one of the flaps is slotted. Slots allow a smooth flow of air between different sections of the wing, which increases the effectiveness of the wing.", "Flap Type Retracted Extended Plain Fowler Slotted Split"], "jumps": ["P2430", "P2390"]}, {"id": "P2410", "text": ["When landing, flaps reduce the landing speed shortening the length of landing rollout. This makes landing in small or obstructed areas possible because it allows the glide angle to increase without greatly increasing approach speed.."], "jumps": ["P2420", "P2390"]}, {"id": "P2400", "text": ["Flaps only deploy downward, not upward. By changing the position of the flap, lift and drag are affected; both lift and drag increase as the flaps are lowered, and both then decrease as the flaps are retracted. During take off and climbing, the flaps are positioned for maximum lift..."], "jumps": ["P2410", "P2390"]}, {"id": "P2390", "text": ["First let's look at the types of increasers. Flaps are located on the inner side of each wing next to the aileron. The flaps purpose is to change the camber of the wing. The camber of a wing is the curve of the wing from the leading edge to the trailing edge."], "jumps": ["P2400", "P2380"]}, {"id": "P2380", "text": ["These auxiliary flight controls can be separated into two groups: lift increasers and lift decreasers. There are three different types of lift increasers and two different types of lift decreasers.", "Lift Decreasers Speed Brakes Spoilers sssss"], "jumps": ["P2390", "P2370"]}, {"id": "P2370", "text": ["Auxiliary flight controls consist of the speed brakes or spoilers, slats, flaps and slots."], "jumps": ["P2380", "P2360"]}, {"id": "P2363", "text": ["Some types of aircraft use servo tabs as secondary flight controls, but they are not used to aid the pilot in moving the primary flight controls."], "jumps": []}, {"id": "P2362", "text": ["The pilot uses trim tabs to maintain balanced flight conditions. A different kind of control is used to help the pilot move the primary flight controls."], "jumps": []}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2360", "text": ["Which tab type is used to aid the pilot in moving primary flight controls?"], "jumps": ["P2350"]}, {"id": "P2350", "text": ["Some types of aircraft use servo tabs and balance tabs but, trim tabs are the most widely used secondary flight controls."], "jumps": ["P2360", "P2320"]}, {"id": "P2340", "text": ["When the aileron moves upward, the push-rod moves, which causes the spring to move. The force applied to the spring then moves the spring tab. The distance the spring tab moves depends on the distance that the aileron is moved."], "jumps": ["P2350", "P2320"]}, {"id": "P2330", "text": ["Most spring controls are adjusted automatically when the associated primary control is adjusted. For example, on some ailerons a spring and push-rod assembly are attached to the aileron and a spring tab.."], "jumps": ["P2340", "P2320"]}, {"id": "P2320", "text": ["The last type of secondary flight control that we will talk about is the spring tab. Remember, spring tabs are used to aid the pilot in moving the primary flight controls."], "jumps": ["P2330", "P2310"]}, {"id": "P2310", "text": ["A rudder trim tab is normally located on the bottom edge of the rudder. This trim tab can be adjusted by a wheel or crank when the aircraft is either on the ground or in the air. The purpose of the rudder trim tab is to relieve pressure on the cockpit rudder pedals."], "jumps": ["P2320", "P2290"]}, {"id": "P2300", "text": ["Anti-servo tabs automatically change position when the stabilator is adjusted, there is no separate control for the tabs. Notice how the positions of the anti-servo tabs change in respect to the stabilator position..."], "jumps": ["P2310", "P2290"]}, {"id": "P2290", "text": ["Anti-servo tabs are located on the back edge of a stabilator. These tabs cause extra drag when the pilot moves the stabilator. Because stabilators can be moved by small control movements, over-adjustments would be unavoidable without anti-servo tabs. The purpose of this extra drag is to keep the pilot from over- adjusting the stabilator....."], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["Elevator trim tabs are normally located on the inner edge of the tail stabilizers. Just as with the aileron trim tabs, these tabs relieve pressure on the elevators. These trim tabs can be adjusted while the aircraft is either on the ground or in the air, by use of a crank or wheel adjustment depending on the type of plane..."], "jumps": ["P2290", "P2260"]}, {"id": "P2270", "text": ["During maneuvers pressure is placed on the aileron. The aileron trim tab moves in the opposite direction of the aileron itself, thereby relieving pressure. In effect, the trim tab provides fine tuning of the force and pressure applied to the aileron."], "jumps": ["P2280", "P2260"]}, {"id": "P2260", "text": ["Aileron trim tabs are normally located on the inner edge of the aileron. On low power planes, they normally are adjustable only on the ground. On higher powered, aircraft a crank or wheel is provided in the cockpit for adjustment."], "jumps": ["P2270", "P2240"]}, {"id": "P2250", "text": ["Trim tabs can be located on the; ailerons, elevators, stabilators, and rudder. In most aircraft, the trim tabs can be set with either a wheel or a crank. Let's look at some of the different types of trim tabs."], "jumps": ["P2260", "P2230"]}, {"id": "P2240", "text": ["Recall that the secondary flight controls consist of trim tabs and spring tabs. The pilot uses trim tabs to maintain balanced flight conditions. Spring tabs are used to help the pilot move the primary flight controls."], "jumps": ["P2250", "P2230"]}, {"id": "P2233", "text": ["The rudder is used to adjust the yaw, not to adjust the pitch of the aircraft."], "jumps": []}, {"id": "P2232", "text": ["The ailerons are used to adjust the roll of the aircraft, not to adjust the pitch of the aircraft."], "jumps": []}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2230", "text": ["Which primary control is used to adjust the pitch of the aircraft?"], "jumps": ["P2210"]}, {"id": "P2220", "text": ["The ruddervator's advantage is less drag and weight. Drag is the amount of resistance caused by the aircraft moving through the air."], "jumps": ["P2230", "P2210"]}, {"id": "P2210", "text": ["There is also another type of tail assembly known as a ruddervator. This system replaces the rudder, elevator and stabilator three surface design with a two surface design in the shape of a V..."], "jumps": ["P2220", "P2180"]}, {"id": "P2200", "text": ["The rudder is mainly used with the ailerons to assist in making turns during flight. Like the other primary controls, the rudder also uses pulleys, cables and bellcranks to achieve desired movement.."], "jumps": ["P2210", "P2180"]}, {"id": "P2190", "text": ["Depressing the right pedal causes; the rudder to move right, the nose to move right and the tail to move left."], "jumps": ["P2200", "P2180"]}, {"id": "P2180", "text": ["When the left pedal is depressed the rudder moves left. This causes the plane to yaw to the left, so the nose of the plane moves left and the tail moves right."], "jumps": ["P2190", "P2170"]}, {"id": "P2170", "text": ["The rudder is located at the tail end of the plane and is attached to a vertical stabilizer, also known as a fin. The rudder is used to maneuver the plane on the yaw axis. The rudder is controlled by two foot pedals in the cockpit."], "jumps": ["P2180", "P2160"]}, {"id": "P2160", "text": ["By adjusting the elevators or stabilators and the throttle, climbs and descents can be accomplished. The throttle is a control used to adjust the engine speed."], "jumps": ["P2170", "P2150"]}, {"id": "P2150", "text": ["Like the ailerons, these controls also use a series of cables, pulleys and bellcranks for adjustment. The main function of the elevators and stabilators is to control the pitch of the wings."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["Both of these horizontal tail surfaces are controlled by the yoke inside the cockpit. When the yoke is pushed forward the elevators and stabilators move down. When the yoke is pulled back the elevators and stabilators move up."], "jumps": ["P2150", "P2130"]}, {"id": "P2130", "text": ["A stabilator is a small wing located at the tail end of the plane that moves up and down to change the pitch of the plane. The entire stabilator moves up and down, not just a portion of it like the elevators..."], "jumps": ["P2140", "P2120"]}, {"id": "P2120", "text": ["Elevators are mounted on a stabilizer. A stabilizer is a small stationary wing located at the tail end of the plane. The stabilizer is stationary while the elevators move to change the pitch of the plane. When the yoke is pulled back the elevators move up. When the yoke is pushed forward the elevators are moved down."], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": ["Elevators and stabilators are located at the tail end of the plane. Elevators and stabilators are just two types of many different mechanical systems used for maneuvering the aircraft pitch axis."], "jumps": ["P2120", "P2102"]}, {"id": "P2105", "text": ["YOKE MOVEMENT - By turning the yoke right the right aileron moves up and the left aileron moves down."], "jumps": []}, {"id": "P2102", "text": ["In the same respect, turning the yoke right causes the left wing to have more lift and the right wing to have less lift rotating the plane in the opposite direction. Note that a plane will continue to roll until the controls have been adjusted to a neutral position..", "Generalized Aileron Movement with Yoke Turned Left"], "jumps": ["P2110", "P2090", "P2105"]}, {"id": "P2100", "text": ["In the same respect, turning the yoke right causes the left wing to have more lift and the right wing to have less lift rotating the plane in the opposite direction. Note that a plane will continue to roll until the controls have been adjusted to a neutral position..", "Generalized Aileron Movement with Yoke Turned Left"], "jumps": ["P2110", "P2090", "P2105"]}, {"id": "P2090", "text": ["This aileron movement causes the right wing to have more lift and the left wing to have less lift, rotating the plane to the left.", "Generalized Aileron Movement with Yoke Turned Left"], "jumps": ["P2100", "P2080"]}, {"id": "P2080", "text": ["By turning the yoke left the left aileron moves up and the right aileron moves down."], "jumps": ["P2090", "P2070"]}, {"id": "P2075", "text": ["BELLCRANKS - A bellcrank is a lever used to change the direction, speed and strength of force. The example below shows the change of direction in the force of a cable."], "jumps": []}, {"id": "P2070", "text": ["Ailerons are located on the far rear of each wing. They are used to rotate the aircraft around the roll axis. Both ailerons are controlled at the same time with the use of the yoke and associated pulleys, cables and bellcranks..."], "jumps": ["P2090", "P2020"]}, {"id": "P2060", "text": ["From inside the cockpit, the yoke (steering device) controls the ailerons and the elevators or stabilators. Foot pedals are used to control the rudder. Let's look at each of these controls, how they are used and what they are used for."], "jumps": ["P2080", "P2020"]}, {"id": "P2050", "text": ["Finally, the auxiliary controls are used to aid the primary controls in maneuvering and stabilizing the aircraft. These controls include; speed brakes or spoilers, slats, flaps and slots."], "jumps": ["P2070", "P2020"]}, {"id": "P2040", "text": ["The secondary controls improve performance, stability and relieve excess forces, on the primary controls. Secondary controls include trim tabs and spring tabs."], "jumps": ["P2050", "P2020"]}, {"id": "P2030", "text": ["Flight controls classified as primary are used to safely maneuver an aircraft about its three axes. These controls include ailerons, elevators or stabilators and the rudder."], "jumps": ["P2040", "P2020"]}, {"id": "P2020", "text": ["There are three different types of flight controls in an aircraft: primary, secondary and auxiliary. These systems are used together to maneuver and stabilize an aircraft while in flight."], "jumps": ["P2030", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P1970", "text": ["6. Aircraft rotate around three axes; longitudinal, lateral, and vertical. Roll rotates around the longitudinal axis, pitch rotates around the lateral axis, and yaw rotates around the vertical axis...."], "jumps": ["P1999", "P1960"]}, {"id": "P1960", "text": ["5. Sir Isaac Newton stated that for every action there is an opposite and equal reaction. Thrust utilizes Newton's law to overcome drag.."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["4. Bernoulli's Principle states that flowing fluids and gases decrease in pressure when increased in velocity. Wing lift is based on this principle..."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["3. In order for an aircraft to fly it must overcome two forces, drag and gravity. Lift opposes gravity and thrust opposes drag...."], "jumps": ["P1930"]}, {"id": "P1930", "text": ["2. Manufacturers and maintenance technicians use reference lines or stations to locate components or structural parts. The references are fuselage station, waterline, butt line, and wing station.....", "1. The major sections of most fixed-wing aircraft are the fuselage, empennage, cockpit, and wing sections.."], "jumps": ["P1940", "P1920", "P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on AIRCRAFT FUNDAMENTALS...."], "jumps": ["P1001", "P1350"]}, {"id": "P1353", "text": ["The pitch is the rotation around an imaginary line that extends from wing tip to wing tip called the lateral axis."], "jumps": []}, {"id": "P1352", "text": ["The yaw is the rotation around an imaginary line that passes vertically through the aircraft's center of gravity called the vertical axis..."], "jumps": []}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1350", "text": ["What movement is made around the longitudinal axis?........"], "jumps": ["P1340"]}, {"id": "P1342", "text": ["The Wright Brothers used Newton's Laws of Motion and Bernoulli's Principles, the same physics taught in high school."], "jumps": []}, {"id": "P1341", "text": [], "jumps": []}, {"id": "P1340", "text": ["The Wright Brothers used physics to solve the problems encountered with flying."], "jumps": ["P1310"]}, {"id": "P1330", "text": ["The only axis left to conquer was roll. Wilbur and Orville designed a system of wires and pulleys to warp one or the other main wings to create lift on one side or the other. Not bad, because the warping of the wings worked in controlling the roll axis of their flyer. Once they got the hang of combining the three controls, they were really flying, literally....."], "jumps": ["P1340", "P1310"]}, {"id": "P1320", "text": ["Next, they had to get the flyer to turn, or yaw. Turning was easy, boats had been doing it for years and rudders were not new. The brothers added rudders to the back of the flyer."], "jumps": ["P1330", "P1310"]}, {"id": "P1310", "text": ["Now that Wilbur and Orville had a handle on lift, they tried using Bernoulli's principle to control their flyer. First they hinged the wing up front so that it would pivot up and down to create or lose lift in the nose of the flyer. This would make the flyer climb or dive..."], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["Up until the Wright brothers, most pioneers of aviation tried using their shifting body weight to control their inventions along these three axes. Good thing their methods didn't work well, because can you imagine everyone on a 747 running from side to side and up and down the aisles to control the jumbo jet in flight?????"], "jumps": ["P1310", "P1260"]}, {"id": "P1290", "text": ["Yaw is the rotation around an imaginary line that passes vertically through the aircrafts center of gravity. This axis is called the Vertical Axis."], "jumps": ["P1300", "P1260"]}, {"id": "P1280", "text": ["Pitch is the rotation around an imaginary line that extends from wing tip to wing tip. This axis is called the Lateral Axis."], "jumps": ["P1290", "P1260"]}, {"id": "P1270", "text": ["Roll is the rotation around an imaginary line that extends lengthwise through the fuselage from nose to tail. This axis is called the Longitudinal Axis."], "jumps": ["P1280", "P1260"]}, {"id": "P1260", "text": ["Ground-based vehicles only deal with one axis of motion. Aircraft must deal with 3 axis of motion; roll, pitch, and yaw. Whenever an aircraft changes direction, it will rotate around one or more of these three axes..."], "jumps": ["P1270", "P1230"]}, {"id": "P1250", "text": ["Unfortunately, lift and thrust are not much fun without control. The next problem the Wright brothers needed to overcome was how to control that contraption once the thrust overcame the drag and the lift overcame the gravity..."], "jumps": ["P1260", "P1230"]}, {"id": "P1240", "text": ["By combining what they learned about thrust overcoming drag and lift overcoming gravity, the Wright Brothers were on their way to making history."], "jumps": ["P1250", "P1230"]}, {"id": "P1231", "text": ["Since the curved top of their airfoil required the air around it to flow faster than the air on the flat bottom, a low pressure area developed on the upper surface. Presto, instant lift..ome drag."], "jumps": []}, {"id": "P1230", "text": ["The Wright brothers, using their wind tunnel as a test chamber, were able to use Bernoulli's principle to solve their lift problem. They designed and tested hundreds of different shaped airfoils and found that the ones curved on top and flat on the bottom created the most lift. ince the curved top of their airfoil required the air around it to flow faster than the air on the flat bottom, a low pressure area developed on the upper surface. Presto, instant lift....."], "jumps": ["P1231", "P1210"]}, {"id": "P1221", "text": ["For example, if air flowing though a tube reaches a constriction, the velocity of the air moving through the constriction increases while the pressure decreases.action they needed to overcome drag."], "jumps": []}, {"id": "P1220", "text": ["The brothers still needed to produce lift in order to overcome gravity. Bernoulli's Principle says that the relationship between pressure and velocity of moving liquids or gases is inversely proportional. As the velocity of a fluid or gas increases, the pressure exerted by the fluid or gas decreases. r example, if air flowing though a tube reaches a constriction, the velocity of the air moving through the constriction increases while the pressure decreases."], "jumps": ["P1221", "P1211"]}, {"id": "P1211", "text": ["By Newton's third law, the reaction is to push the aircraft forward at the same force. Wilbur and Orville used the force from large propellers to achieve the reaction they needed to overcome drag."], "jumps": []}, {"id": "P1210", "text": ["When an aircraft is flying at a constant speed, thrust equals drag and everything is balanced. A change in either force will cause the aircraft to accelerate or slow down. Adding power to a jet engine creates a force to the rear of the aircraft. Newton's third law, the reaction is to push the aircraft forward at the same force. Wilbur and Orville used the force from large propellers to achieve the reaction they needed to overcome drag....."], "jumps": ["P1211", "P1180"]}, {"id": "P1190", "text": ["Newton formulated several laws of motion. Newton's Third Law of Motion is the law of action and reaction. He said that for every action (force) there is an opposite and equal reaction. In other words, any object that exerts a force on another object is acted upon by an equal reaction force in the opposite direction..."], "jumps": ["P1210", "P1180"]}, {"id": "P1180", "text": ["The Wright brothers learned that to produce thrust and lift, they needed to understand two principles: one discovered by Sir Isaac Newton in the 17th Century, and the other by Bernoulli in the 18th century. And you thought you could forget all of that stuff you learned in physics class..."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["There are two forces that must be overcome to get an aircraft to successfully fly; gravity and drag. Wilbur and Orville did not discover these forces but they did do a pretty good job of overcoming them. To overcome gravity, an aircraft needs to produce lift and to overcome drag, an aircraft needs to produce thrust....."], "jumps": ["P1180", "P1160"]}, {"id": "P1160", "text": ["Now that we have a basic understanding of the main aircraft sections and reference lines, let's join the Wright brothers in their quest for understanding aerodynamics."], "jumps": ["P1170", "P1140"]}, {"id": "P1153", "text": ["Fuselage stations are reference points along the length of the fuselage, not vertically on the fuselage."], "jumps": []}, {"id": "P1152", "text": ["The butt line is used to locate points to the sides of the centerline, not vertically on the fusilage."], "jumps": []}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1150", "text": ["Which reference is used to locate a vertical point on an aircraft?"], "jumps": ["P1140"]}, {"id": "P1143", "text": ["The Empennage is the tail section. It doesn't have anything to do with equipment in the nose of the aircraft...."], "jumps": []}, {"id": "P1142", "text": ["Wing stations don't have anything to do with positions forward or aft."], "jumps": []}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1140", "text": ["Which reference is used to locate equipment aft of the nose?"], "jumps": ["P1130"]}, {"id": "P1130", "text": ["The wing stations are similar to fuselage stations. Wing station zero is located at the center of the aircraft. All wing stations are measured outboard of the centerline to the wing tip in inches."], "jumps": ["P1140", "P1110"]}, {"id": "P1120", "text": ["The waterline is a horizontal reference that starts at the ground and references vertical measurements. The butt line is an imaginary reference line that runs down the aircraft centerline, it references points on the fuselage to the left and right of the center."], "jumps": ["P1130", "P1110"]}, {"id": "P1110", "text": ["Fuselage \"stations\" locate various points on the fuselage. These numbers start at station zero, also know as reference datum, at or near the nose of the aircraft. The stations move aft to the tail and are measured in inches or millimeters depending on manufacturer..."], "jumps": ["P1120", "P1090"]}, {"id": "P1100", "text": ["There are four types of reference lines; fuselage stations, waterline, buttock (butt) lines, and wing stations."], "jumps": ["P1110", "P1090"]}, {"id": "P1090", "text": ["All aircraft are divided by reference lines that provide a reference point for the installation of structures and components during manufacturing and to help maintenance technicians locate parts and assemblies..."], "jumps": ["P1100", "P1030"]}, {"id": "P1080", "text": ["Other parts of the aircraft include the nose cone, which houses the radar and other electronic equipment, the flight controls, and the various systems that help keep the aircraft operating safely. We will learn about these components in detail later...", "The wings of the aircraft are airfoils used to obtain lift."], "jumps": ["P1090", "P1030", "P1080"]}, {"id": "P1060", "text": ["The empennage is the tail section of the aircraft. It can be configured in many different ways.", "The cockpit, also called a flight deck on larger aircraft, is the section that houses the flight crew."], "jumps": ["P1030", "P1070", "P1060"]}, {"id": "P1040", "text": ["The fuselage is the main body of the aircraft that houses the passengers and cargo.", "All fixed wing aircraft are made up of a fuselage, cockpit, empennage, and wings."], "jumps": ["P1050", "P1020", "P1040"]}, {"id": "P1020", "text": ["Before we discuss the physics of flight, let's take a look at how an aircraft is constructed."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on GENERAL AIRCRAFT PRINCIPLES....................."], "jumps": ["P420"]}, {"id": "P420", "text": ["This lesson is about the physics of flight and aircraft flight controls. After completing this lesson, you will have a better understanding of how an aircraft moves through the air and how we control that movement...", "The Wright Brothers spent many years studying aerodynamics and quickly realized that flying was more than just overcoming gravity, it was about controlling the craft once it was airborne."], "jumps": ["P430", "P410", "P420", "P400"]}, {"id": "P400", "text": ["The study of the behavior of air moving and the forces it produces is referred to as aerodynamics, meaning literally, \"air in motion\"."], "jumps": ["P410", "P300"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the major sections of a typical aircraft. w Define and describe the physics principles that affect thrust, drag, lift, and gravity. w Define and describe the three axes of flight....", "w Define and describe the primary flight controls of an aircraft. w Define and describe the secondary flight controls of an aircraft. w Define and describe the auxiliary flight controls of an aircraft."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: GENERAL AIRCRAFT PRINCIPLES fasfd asdf asdf sadf"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Nida Corporation - General Aircraft Principles", "\"You have successfully passed the assessment", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "<<*)('&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&&$ ;", "' #", ";! :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::", ";!! :"], "jumps": ["PW", "P"]}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
