o determine if the circuit is operating normally."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Last, you investigate circuit values in a normally operating circuit."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on COMMON EMITTER AMPLIFIER EXPERIMENT..............."], "jumps": ["P400"]}, {"id": "P900", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P440"]}, {"id": "P1020", "text": ["Pick up the PC130-30A card. This card demonstrates the operation of  a common emitter amplifier circuit.", "Pick up the PC130-30A card. This card demonstrates the operation of a common emitter amplifier circuit."], "jumps": ["P1030"]}, {"id": "P1030", "text": ["Compare the components on PC130-30A to the schematic shown."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Notice that the input is applied to C1 through R1, R2 and R3."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["This voltage divider is used to control the amplitude of the input signal."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The emitter biasing circuit is formed by R7, R8 and C2."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["R8 and C2 form a self biasing network and any AC developed by R8 is bypassed to ground by C2."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["R7, a swamping resistor, reduces distortion caused by \nnon-linear changes in emitter current.  Note, C2 does not bypass AC developed by R7.", "R7, a swamping resistor, reduces distortion caused by non-linear changes in emitter current. Note, C2 does not bypass AC developed by R7."], "jumps": ["P1100", "P1020"]}, {"id": "P1082", "text": ["R7, a swamping resistor, reduces distortion caused by\nnon-linear changes in emitter current.  Note, C2 does not bypass AC developed by R7.", "R7, a swamping resistor, reduces distortion caused by non-linear changes in emitter current. Note, C2 does not bypass AC developed b ...................."], "jumps": ["P1910", "P1500"]}, {"id": "P1910", "text": ["This completes the experiment on the COMMON EMITTER AMPLIFIER.", ". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P13020", "text": ["Pick up the PC130-30A card.  This card demonstrates the operation of a common emitter amplifier circuit.", "Pick up the PC130-30A card. This card demonstrates the operation of a common emitter amplifier circuit."], "jumps": ["P13030"]}, {"id": "P13030", "text": ["Compare the components on PC130-30A to the schematic shown.", "Compare the components on PC130-30A to the schematic shown..."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["Notice that the input is applied to C1 through R1, R2 and R3."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["This voltage divider is used to control the amplitude of the input signal."], "jumps": ["P13060", "P13020"]}, {"id": "P13060", "text": ["The emitter biasing circuit is formed by R7, R8 and C2."], "jumps": ["P13070", "P13020"]}, {"id": "P13070", "text": ["R8 and C2 form a self biasing network and any AC developed by R8 is bypassed to ground by C2."], "jumps": ["P13080", "P13020"]}, {"id": "P13080", "text": ["R7, a swamping resistor, reduces distortion caused by\nnon-linear changes in emitter current.  Note, C2 does not bypass AC developed by R7.", "R7, a swamping resistor, reduces distortion caused by non-linear changes in emitter current. Note, C2 does not bypass AC developed by R7.."], "jumps": ["P13100", "P13020"]}, {"id": "P13082", "text": ["R7, a swamping resistor, reduces distortion caused by\nnon-linear changes in emitter current.  Note, C2 does not bypass AC developed by R7.", "R7, a swamping resistor, reduces distortion caused by non-linear changes in emitter current. Note, C2 does not bypass AC developed by R7.."], "jumps": ["P13100", "P13020"]}, {"id": "P13085", "text": ["NON-LINEAR CHANGES IN EMITTER CURRENT -", "Change in base E Difference E Increased I .9 to 1.0 .1 .1 mA 1.0 to 1.1 .1 .1 mAAAAA", "NON-LINEAR CHANGES IN EMITTER CURRENT - Normally, a change in emitter current, due to a change in the base voltage, is assumed to be linear. Meaning, a change in base voltage from .9 V to 1.0 V will cause the same emitter current increase as changing the base voltage from 1.0 V to 1.1 V."], "jumps": []}, {"id": "P13086", "text": ["Change in base E Difference E I Swamping R .9 to 1.0 .1 .1 mA .09 mA 1.0 to 1.1 .1 .11 mA .09 mAAAAAAAAAAAAA", "NON-LINEAR CHANGES IN EMITTER CURRENT - A change in base voltage from .9 V to 1.0 V may change emitter current by .1 mA while a change from 1.0 V to 1.1 V may change current by .11 mA. This is a non-linear change in emitter current that is compensated for by the swamping resistor."], "jumps": ["P13082", "P13085"]}, {"id": "P13100", "text": ["AC developed by R7 reduces voltage gain and is considered in the Av  formula:                                                               \n                                  Av =", "AC developed by R7 reduces voltage gain and is considered in the Av formula: Av = Rswamping + .025 IeIee"], "jumps": ["P13120", "P13082"]}, {"id": "P13120", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13082"]}, {"id": "P13130", "text": ["2.  Carefully plug PC130-30A into the Test Console PC2 position.", "2. Carefully plug PC130-30A into the Test Console PC2 position."], "jumps": ["P13140"]}, {"id": "P13140", "text": ["3.   Adjust R2 on PC130-30A fully CCW.", "3. Adjust R2 on PC130-30A fully CCW......................", "MEASUREMENT SETUP - Adjust R2 fully CCW."], "jumps": ["P13150", "P13130", "P13145", "P13140"]}, {"id": "P13150", "text": ["4.  Press Enter to set: Positive Supply Voltage - 12", "4. Press Enter to set: Positive Supply Voltage - 12......................."], "jumps": ["P13140"]}, {"id": "P13160", "text": [ crease to 0V very slowly. This is due to the high impedance of the oscilloscope causing a long time constant.", "The DC level is gone. Coupling capacitor C3 blocked the DC bias on the collector. You will see the DC level of the signal decrease to 0V very slowly. This is due to the high impedance of the oscilloscope causing a long time constant............"], "jumps": ["P13460", "P13420", "P13455"]}, {"id": "P13455", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Connect CH1 probe to TP8."], "jumps": ["P13457", "P13450"]}, {"id": "P13457", "text": ["OSCILLOSCOPE MEASUREMENT - Time/Div - 50 msec CH1 Volt/Div - 5 V", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P13450", "P13455"]}, {"id": "P13460", "text": ["The signals you have measured are normal for an operating common emitter amplifier. Values may vary for different circuits but knowing what type of signals to expect aids in troubleshooting.", "The signals you have measured are normal for an operating common emitter amplifier. Values may vary for different circuits but knowing what type of signals to expect aids in troubleshooting..."], "jumps": ["P13450"]}, {"id": "P13500", "text": ["1.  Set the test console's Power to OFF.", "1. Set the test console's Power to OFF.FF................................."], "jumps": []}, {"id": "P13510", "text": ["2.  Disconnect all test equipment. \n3.  Carefully remove PC130-30A. \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-30A. 4. Return all equipment to its proper storage area.............................."], "jumps": ["P1910", "P13500"]}, {"id": "P14020", "text": ["Pick up the PC130-30A card. This card demonstrates the operation of a common emitter amplifier circuit."], "jumps": ["P14030"]}, {"id": "P14030", "text": ["Compare the components on PC130-30A to the schematic shown.", "Compare the components on PC130-30A to the schematic shown..."], "jumps": ["P14040", "P14020"]}, {"id": "P14040", "text": ["Notice that the input is applied to C1 through R1, R2 and R3."], "jumps": ["P14050", "P14020"]}, {"id": "P14050", "text": ["This voltage divider is used to control the amplitude of the input signal."], "jumps": ["P14060", "P14020"]}, {"id": "P14060", "text": ["The emitter biasing circuit is formed by R7, R8 and C2."], "jumps": ["P14070", "P14020"]}, {"id": "P14070", "text": ["R8 and C2 form a self biasing network and any AC developed by R8 is bypassed to ground by C2."], "jumps": ["P14080", "P14020"]}, {"id": "P14080", "text": ["R7, a swamping resistor, reduces distortion caused by\nnon-linear changes in emitter current.  Note, C2 does not bypass AC developed by R7.", "R7, a swamping resistor, reduces distortion caused by non-linear changes in emitter current. Note, C2 does not bypass AC developed by R7.."], "jumps": ["P14100", "P14020"]}, {"id": "P14082", "text": ["R7, a swamping resistor, reduces distortion caused by\nnon-linear changes in emitter current.  Note, C2 does not bypass AC developed by R7.", "R7, a swamping resistor, reduces distortion caused by non-linear changes in emitter current. Note, C2 does not bypass AC developed by R7.."], "jumps": ["P14100", "P14020"]}, {"id": "P14085", "text": ["NON-LINEAR CHANGES IN EMITTER CURRENT -", "Change in base E Difference E Increased I .9 to 1.0 .1 .1 mA 1.0 to 1.1 .1 .1 mAAAAA", "NON-LINEAR CHANGES IN EMITTER CURRENT - Normally, a change in emitter current, due to a change in the base voltage, is assumed to be linear. Meaning, a change in base voltage from .9 V to 1.0 V will cause the same emitter current increase as changing the base voltage from 1.0 V to 1.1 V."], "jumps": ["P14086", "P14082"]}, {"id": "P14086", "text": ["Change in base E Difference E I Swamping R .9 to 1.0 .1 .1 mA .09 mA 1.0 to 1.1 .1 .11 mA .09 mAAAAAAAAAAAAA", "NON-LINEAR CHANGES IN EMITTER CURRENT - A change in base voltage from .9 V to 1.0 V may change emitter current by .1 mA while a change from 1.0 V to 1.1 V may change current by .11 mA. This is a non-linear change in emitter current that is compensated for by the swamping resistor."], "jumps": ["P14082", "P14085"]}, {"id": "P14100", "text": ["AC developed by R7 reduces voltage gain and is considered in the Av  formula:                                                               \n                                  Av =", "AC developed by R7 reduces voltage gain and is considered in the Av formula: Av = Rswamping + .025 IeIee"], "jumps": ["P14120", "P14082"]}, {"id": "P14120", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14082"]}, {"id": "P14130", "text": ["2.  Carefully plug PC130-30A into the Test Console position.", "2. Carefully plug PC130-30A into the Test Console position..on."], "jumps": ["P14140"]}, {"id": "P14140", "text": ["3.  Adjust R2 on PC130-30A fully CCW.", "3. Adjust R2 on PC130-30A fully CCW.... let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
