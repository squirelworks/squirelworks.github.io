<script>
const book = {"title": "9395T608", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: TELECOMMUNICATIONS TERMINOLOGYsfd asdf asdf sadf", "Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Recognize terms, jargon and acronyms associated with the telecommunications industry. w Define telecommunications terms using the appropriate jargon and acronyms. w Identify symbols/flowcharts related to the telecommunications industry......", "1. Telecommunications Terminologyctive 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["In the following tables, terms are listed with the appropriate acronyms and descriptions. Clicking on the term will bring up additional information."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["You have not reviewed all of the information for each term. Do you want to continue?", "Percentage of people \"clicking on\" a web site.", "A rating of telecom system performance. Expressed as a percentage.", "A ratio of signal strength to background noise.", "Expression of frequency spectrum usage. Expressed in bits per hertz or kHz per channel.", "Number of received bits in error compared to total bits received.", "Bandwidth times transmission distance. Used to assess fiber optic links. (BW X distance)", "Bandwidthhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh Basic operationss", "Width of the telecommunications channel. The capability to exchange information.", "Backwards Compatiblehhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh Basic operationss", "Upgraded hardware or software that can still be used with existing systems.", "Term Acronym Basic Description"], "jumps": ["P1050", "P1020"]}, {"id": "P1031", "text": ["BACKWARDS COMPATIBLE - Service providers want to offer upgrades as options, not total reinstallations. This makes backwards compatible systems highly desirable. Frame Relay is an excellent example of this concept. Frame Relay is a network service that can be implemented using existing links..."], "jumps": []}, {"id": "P1032", "text": ["Broadband: Greater than 45 Mbps. ating jobs) arketing * Engineering * Installation * Operation & Maintenance * Administration * Educationnn", "Wideband: Digital telecom up to 45 Mbps (T - 3) or 34 Mbps (E - 3) ing * Installation * Operation & Maintenance * Administration * Educationnn", "Narrowband: Digital telecom up to 1.544 Mbps (T - 1) or 2.048 Mbps (E - 1) Installation * Operation & Maintenance * Administration * Educationnn", "Baseband: Analog audio (0 - 20 kHz) and video (0 - 4.2 MHz) ngineering * Installation * Operation & Maintenance * Administration * Educationnn", "BANDWIDTH - Defined by capacity: Baseband: Analog audio (0 - 20 kHz) and video (0 - 4.2 MHz) * Narrowband: Digital telecom up to 1.544 Mbps (T-1) or 2.048 Mbps (E-1) * Wideband: Digital telecom up to 45 Mbps (T-3) or 34 Mbps (E-3) * Broadband: Greater than 45 Mbps."], "jumps": []}, {"id": "P1033", "text": ["BANDWIDTH DISTANCE PRODUCT - Used by fiber optic network designers exclusively to determine the type of cable needed to make a link. If the link is analog, like plain old telephone service (POTS), the bandwidth is in hertz. For example, 16 kHz bandwidth X 30 miles equals 480 kHz miles. In digital, bits per second are used. 1.544 Mbps X 20 miles equals 20.88 Mbps miles. Fiber products are often listed in Mbps kilometers, so mile to km conversion is required."], "jumps": ["POTS"]}, {"id": "P1034", "text": ["BIT ERROR RATE (BER) - Expressed in powers of 10, a BER of 10 means that 1 bit in 1 billion has to be retransmitted or is lost. BER is measured by special instruments and/or built-in test equipment. The BER requirement is dependent on the type of service provided by a telecom circuit.."], "jumps": []}, {"id": "P1035", "text": ["BIT RATE - If you divide the bit rate by 10, this is the approximate amount of overhead bits that is transmitted with the data characters. For example, if you need 10 Mbps of data over a link, ask for at least 11 to 12 Mbps. Overhead is a function of addressing and routing in digital systems. Another factor is retransmission, which also knocks down overall bit rate."], "jumps": []}, {"id": "P1036", "text": ["CLICKTHROUGH RATE - Applies to e-commerce (electronic commerce). Clickthrough is a measure of Internet advertising. If your web page, website, banner, or address has a clickthrough rate of 50%, it means half of the web surfers that access the domain click on your virtual address..."], "jumps": []}, {"id": "P1037", "text": ["LATENCY - The amount of time it takes to get information through a telecom network. For example, plain old telephone service has a latency of 400 milliseconds. Latency is caused by propagation delay, transmission delay, processing delay, and/or rotation delay..."], "jumps": []}, {"id": "P1038", "text": ["* Class 1: Digital telephone lines * Class 2: Multimedia * Class 3: Data networks * Class 4: Internetbps (T-1) or 2.048 Mbps (E-1) * Wideband: Digital telecom up to 45 Mbps (T-3) or 34 Mbps (E-3) * Broadband: Greater than 45 Mbps.......", "QUALITY OF SERVICE (QoS) - Subjective quality measurement scale. In Asynchronous Transfer Mode (ATM), QoS is somewhat standardized. The objective is 100% QoS; 99.999% (five 9s) is often acceptable. There are 4 classes of ATM service based on QoS: * Class 1: Digital telephone lines * Class 2: Multimedia * Class 3: Data networks * Class 4: Internettt"], "jumps": []}, {"id": "P1039", "text": ["SIGNAL-TO-NOISE RATIO - One of the oldest quality benchmarks. SNR is the usable signal divided by the background noise. The higher the SNR number, the stronger the usable signal. A negative SNR indicates the signal is not discernable in the background noise."], "jumps": []}, {"id": "P1040", "text": ["SPECTRUM EFFICIENCY - Microwave radio quality standard. For digital systems, the efficiency rating is expressed in bits per hertz. For example, a 30 GHz microwave link can move 40 Mbps over a 100 MHz spectrum (29.9 to 30.1 GHz). The spectrum efficiency would be 40/100 = 0.4. If the link were analog, the efficiency is expressed in kHz per channel..."], "jumps": []}, {"id": "P1050", "text": ["Which of these quality indicators is used exclusively for fiber optics??"], "jumps": ["P1030"]}, {"id": "P1051", "text": [], "jumps": []}, {"id": "P1052", "text": ["Clickthrough Rate is exclusive to the Internet, regardless of the telecom method being used."], "jumps": []}, {"id": "P1053", "text": ["Latency may apply to fiber optics, but it is not exclusive."], "jumps": []}, {"id": "P1054", "text": ["Spectrum Efficiency is exclusive to microwave radio........"], "jumps": []}, {"id": "P1060", "text": ["You have not reviewed all of the information for each term. Do you want to continue?", "A company that furnishes communications services to the public.", "Companies that compete for local area telecom services.", "Digital service lines provided by local exchange carriers or common carriers.", "Personal Communications Service", "High frequency alternative to conventional cellular telephone.", "Fiber optic high-speed transmission technique.", "T means \"trunk\". T1 is a telecom network standard and bit rate (1.544 Mbps).", "Asynchronous Transfer Modeeeeeeeeeeeeeeeeee", "High speed, high bandwidth, multiplexing technique..", "Let's look at some terms used to distinguish the various telecom networks and service providers:", "Term Acronym Basic Description"], "jumps": ["P1080", "P1050"]}, {"id": "P1061", "text": ["ASYNCHRONOUS TRANSFER MODE (ATM) - Conventional networks carry information in a synchronous manner; empty and full segments are continuously transmitted. ATM is asynchronous (not synchronous) because there are no fixed time slots and empty segments are not transmitted. ATM operates one of 3 bit rates: 25.6 Mbps, 155.52 Mbps, or 622.08 Mbps...."], "jumps": []}, {"id": "P1062", "text": ["CABLE - An overall encompassing term for service brought to the consumer on other than twisted pair wire. Common configuration is single conductor with shield (coax). Cable television and digital subscriber services are the most readily recognized services..."], "jumps": []}, {"id": "P1063", "text": ["COMMON CARRIERS - Companies required to provide communications services by law (e.g. AT&T). Common Carriers are licensed by the FCC or other regulatory body if outside the US. Other Common Carriers (OCC) provide long distance services at lower cost..."], "jumps": []}, {"id": "P1064", "text": ["CLEC - Often pronounced see-leck, these companies came on the scene after the Telecom Act of 1996. CLECs operate their own local loops or lease the lines from the ILECs (Incumbent Local Exchange Carriers). Cellular/wireless providers are the most recognizable CLECs..."], "jumps": []}, {"id": "P1065", "text": ["ed pair technology. There are about 20 different types of DSL. DSL bit rates are advertised upwards of 8 Mbps.", "DSL (Digital Subscriber Line) - Digital information on wired twisted pair technology. There are about 20 different types of DSL. DSL bit rates are advertised upwards of 8 Mbps."], "jumps": []}, {"id": "P1066", "text": ["FRAME RELAY - Virtual networking process offered by telecom service providers. Frame Relay works well in wide area networks (WAN) that use a variety of transmission formats. Compatibility with widely different technologies is Frame Relay's most popular feature.ture."], "jumps": []}, {"id": "P1067", "text": ["ISDN - Telephone line high-speed data transfer service. Originated in 1979, ISDN is still popular because a single phone line can be used to connect to the Internet, fax, and voice at the same time. An ISDN BRI (Basic Rate Interface) line carries voice and data..."], "jumps": []}, {"id": "P1068", "text": ["PCS (Personal Communications Service) - 1900 MHz range digital wireless telephone service. Conventional cellular telephone operates in the 800 to 900 MHz range. PCS sound quality is known to be better than cellular phone..."], "jumps": ["Personal"]}, {"id": "P1069", "text": ["SONET - Fiber optic cables carry enormous volumes of data because of SONET technology. SONET is strictly a broadband transport system. CLECs use SONET for network construction almost exclusively. SONET may eventually replace twisted pair copper..."], "jumps": []}, {"id": "P1070", "text": ["T CARRIER - A four-wire system, one pair transmits and one pair receives. A T1 line carries 24 telephone lines. T2 is 4 times T1 (96 phone lines). T3 is 28 T1s. T1 has become a standard for digital data also. If a customer wants a T1, 1.544 Mbps is the desired data rate..."], "jumps": []}, {"id": "P1080", "text": ["Which of the following transmission methods uses 2-wire twisted pair?"], "jumps": ["P1060"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["T carrier requires 2 pairs of wires........................"], "jumps": []}, {"id": "P1083", "text": ["SONET is fiber optic.age..................................."], "jumps": []}, {"id": "P1084", "text": ["Cable is coaxial.in page..................................."], "jumps": []}, {"id": "P1090", "text": ["You have not reviewed all of the information for each term. Do you want to continue?", "Membership is over 130 nations with 30 observer nations. Founded in 1995..", "Consolidated in 1997 from other organizations. Affiliated with EIA.", "Telecommunications Industry Associationions Union", "Telecom standards body. Based in Geneva, Switzerland.", "International Telecom Unionnnnnnnnnnnnnnnnnnnnnnnn", "ISO is the official name. International organization for quality standards.", "Institute of Electrical and Electronics Engineers", "Technical professional society founded originally in 1884. Over 300,000 members.", "FCC - Universal Service Order Codess", "Pronounced \"U-Sock\". Standardized method for providing products and service.", "Counterpart of ANSI. Founded in 1988. Based in Sophia Antipolis, France.."], "jumps": ["P1110", "P1080", "P"]}, {"id": "P1091", "text": ["ANSI - A number of telecom and computer industry standards that are used including the ANSI character set (also known as ASCII, American Standard Code for Information Interchange) which is an 8 bit 256 character system. ANSI standards are designated by an alpha numeric index, e.g., ANSI T1.Q1 - Telecom network performance standards. AT+V is the ANSI Voice Modem standard.", "ANSI - A number of telecom and computer industry standards that are used incl. the ANSI character set (also known as ASCII, American Standard Code for Information Exchange) which is an 8 bit 256 character system. ANSI standards are designated by a alpha numeric index, e.g., ANSI T1.Q1 - Telecom network performance standards. AT+V is the ANSI Voice Modem standard."], "jumps": []}, {"id": "P1092", "text": ["ATM FORUM - Co-founded by Network Equipment Technologies (NET) and other companies. The group has been very successful at publishing ATM standards."], "jumps": []}, {"id": "P1093", "text": ["EIA - Organized into several industrial divisions, one of which is the telecom division (TIA). One of the most important standards to be issued by the organization is EIA/TIA 568 - Commercial Building Wiring Standard for Telecom..."], "jumps": []}, {"id": "P1094", "text": ["ETSI - A standards body with over 900 members from 54 countries. The organization is customer oriented and provides excellent support via their website."], "jumps": []}, {"id": "P1095", "text": ["FCC USOC - Software development language and the basis of all telephone service in the US. New companies use the USOC, although it may be called something else. All telephone records, customer service agreements, and technical information is in USOC format. USOC has been in use since around 1984..."], "jumps": []}, {"id": "P1096", "text": ["IEEE - One of the world's largest trade organizations. IEEE 802 is recognized as the local area network standard. A relatively new product standard is IEEE 1394, popularly called FireWire."], "jumps": []}, {"id": "P1097", "text": ["ISO - The world's leading quality organization. ISO 9000 is a series of standards that outlines a quality program for organizations, included are research & development procedures, manufacturing & installation, and testing & final inspection. Although not telecom specific, ISO certification is essential for telecom companies from a business perspective..."], "jumps": []}, {"id": "P1098", "text": ["ITU - The most influential organization in the telecom industry. ITU standards cover every aspect of telecom. The organization originated in 1865 as Union Telegraphique. By 1947, the ITU had evolved into the current organizational structure. P.139 is the standard for USB (Universal Serial Bus) when used as a link. X.400 is the standard for e-mail (electronic mail) exchange."], "jumps": []}, {"id": "P1099", "text": ["TIA - The telecom arm of the EIA. TIA standards include: TIA 607 - Grounding and bonding standards TIA PN-2416 - Backbone cabling for residential and commercial buildings...s"], "jumps": []}, {"id": "P1100", "text": ["WTO - Resolves trade disputes between member countries. Common carrier to common carrier conflicts are frequent. International telecom is a reality because of the WTO."], "jumps": []}, {"id": "P1110", "text": ["What is the significance of IEEE 802?......................"], "jumps": ["P1090"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["FireWire is IEEE 1394.ge..................................."], "jumps": []}, {"id": "P1113", "text": ["ATM technology is the domain of the ATM Forum.............."], "jumps": []}, {"id": "P1120", "text": ["@ Commercial at or Attathorpe. Used to separate name and server in e-mail addresses, e.g., abc@mail.com. Ligature mark for \"at\" or \"each\". Clouds are representative of networks. The type is usually indicated, e.g., ATM. Antennas, regardless of type, are shown with this symbol. Insects usually have antennae. \"Antennas\" is the telecom plural form of the word.s the telecom plural form of the word.", "Ampersand, ligature mark that means and. Asterisk, ligature mark that means multiply, no, wild card, or see note. Also called a \"splat\" or \"Nathan Hale\". Commercial at or Attathorpe. Used to separate name and server in e-mail addresses, e.g., abc@mail.com. Ligature mark for \"at\" or \"each\". Clouds are representative of networks. The type is usually indicated, e.g., ATM. Antennas, regardless of type, are shown with this symbol. Insects usually have antennae. \"Antennas\" is the telecom plural form of the word. Object or node. A circle is used in basic telecom network layouts. Cell or Cell Site in a cellular network. Fiber Ring for developing SONET. The ring has backup capabilities including redundant fiberlines running between nodes..", "& @ Commercial at or Attathorpe. Used to separate name and server in e-mail addresses, e.g., abc@mail.com. Ligature mark for \"at\" or \"each\". Clouds are representative of networks. The type is usually indicated, e.g., ATM. Antennas, regardless of type, are shown with this symbol. Insects usually have antennae. \"Antennas\" is the telecom plural form of the word.s the telecom plural form of the word.", "The telecom industry has a few special symbols and block diagram shapes. Most of the symbols and diagrams that exist in the electronics and computer industries also apply to the telecom industry..."], "jumps": ["P1110", "P1130"]}, {"id": "P1130", "text": ["How many Encapsulating Bridges does it hold Daddy?", "Jargon is learned through exposure to a language. Experienced professionals use jargon in everyday conversations. Even their family members understand some of the jargon terms because much of it is used around the kitchen table...", "We should have the new Distribution Rack design ready for production today.", "That's nice Dear. I hope the new Garage Band radios fit."], "jumps": ["P1140", "P1120"]}, {"id": "P1131", "text": ["DISTRIBUTION RACK - A device used to mount telecommunications equipment and cables. Occasionally called furniture."], "jumps": []}, {"id": "P1132", "text": ["ENCAPSULATING BRIDGE - A device that connects 2 networks together using data packet encapsulation. For example, an ethernet packet is transported into an ATM network through encapsulation. The original ethernet packet is placed in an ATM envelope so the receiving network can use the data in the packet..."], "jumps": []}, {"id": "P1133", "text": ["GARAGE BAND - Unlicensed frequency bands or ISM (Industrial, Scientific, Medical) as identified by the FCC. Traditionally garage band radios were used for in-building applications like wireless LANs, bar code readers, and surveillance systems. Since the frequencies are unlicensed, mutual interference can result....."], "jumps": []}, {"id": "P1140", "text": ["Jargon may be added to the regular telecommunications model. The sender is using jargon and receivers may or may not use the same jargon as the sender. Let's look at some examples."], "jumps": ["P1150", "P1130", "P"]}, {"id": "P1150", "text": ["The sender is a field engineer. The jargon he uses is completely appropriate because the intended receiver is a telecom engineer. The financial specialist is a casual listener who has overheard the sender's message.......", "Our field guys must think we're made of money! What breed is a cable dog? Moreover, what year of Ford Thunderbird does he want?", "He needs another worker and the T1 test set. I wonder what's going on?", "I need a cable dog to run a link. Have him bring a T-berd along too."], "jumps": ["P1160", "P1140"]}, {"id": "P1152", "text": ["Jargon may be added to the regular telecommunications model. The sender is using jargon and receivers may or may not use the same jargon as the sender. Let's look at some examples.", "Our field guys must think we're made of money! What breed is a cable dog? Moreover, what year of Ford Thunderbird does he want?", "He needs another worker and the T1 test set. I wonder what's going on?", "I need a cable dog to run a link. Have him bring a T-berd along too."], "jumps": ["P1160", "P1140", "P"]}, {"id": "P1155", "text": ["CABLE DOG - An underground cable installer.. Start second line here."], "jumps": []}, {"id": "P1156", "text": ["T-BERD - T carrier detector analyzer. Portable test equipment device. Start second line here."], "jumps": []}, {"id": "P1160", "text": ["I have to talk to the Installation Manager about having our people working on the floors. I didn't hire any tile installers. Yagi? Is that some type of tile?", "Wow! That's about 2000 phone lines and that Yagi short wave antenna is on the roof?", "The sender is the installation manager. The intended receiver is a subordinate technician. The human resources person also hears the message on the technician's 2-way radio.", "Bob, I need you to punchdown all five floors and make sure the Yagi is still in place...."], "jumps": ["P1170", "P1152", "P"]}, {"id": "P1165", "text": ["PUNCHDOWN - A special connection block commonly used to interconnect inside telephone lines. A special tool is used to jam the wire into a conductive recess area. To Punchdown is to make the connections per the installation plan..."], "jumps": []}, {"id": "P1166", "text": ["YAGI - A short wave directional antenna invented by Professors Yagi and Uda in the 1920s. The proper name is Yagi-Uda antenna."], "jumps": []}, {"id": "P1170", "text": ["Joe, I think we will need another gooey in the WAP version 2.1. The queue is hung too, it's a bad hop.hop..ad hop.", "For the final example, the sender and the intended receiver are software engineers. The third party is a casual observer.", "Wasn't there enough graphic user interfaces in the current version. I'll check out the network problem from the NOC. I'll get back to you after I talk to the Alpha Geek.............ek.", "I think they're talking about a new splicing technique"], "jumps": ["P1180", "P1160", "P"]}, {"id": "P1171", "text": ["GOOEY (GUI) - Graphic User Interface. A software routine that presents the operator with a graphic object instead of a command line."], "jumps": []}, {"id": "P1172", "text": ["WAP (Wireless Application Protocol) - Software that supports a wireless network.t second line here."], "jumps": []}, {"id": "P1173", "text": ["QUEUE (Q) - A stream of tasks waiting to be executed. Start second line here."], "jumps": []}, {"id": "P1174", "text": ["HUNG - Software term for a halted and/or corrupted operation. Start second line here."], "jumps": []}, {"id": "P1175", "text": ["HOP - A short trip that information makes from device to device in a network..art second line here."], "jumps": []}, {"id": "P1176", "text": ["NOC (Network Operations Center) - A facility where a telecom network is controlled and monitored.e."], "jumps": []}, {"id": "P1177", "text": ["ALPHA GEEK - This dubious title is awarded to the most knowledgeable and experienced person in a particular profession or workgroup. In this case, the Chief Engineer of the company..."], "jumps": []}, {"id": "P1180", "text": ["You have not reviewed all of the information for each term. Do you want to continue?", "Code name for a specification to standardize handheld devices with a wireless protocol.", "Generic term for the latest wireless technology.", "Switching device for telephone circuits.", "Cable used to connect, bypass, or otherwise modify a circuit.", "Affectionate name given to AT&T and the original Bell System..", "Internationally accepted framework for network design.", "International Telecom Satellite Organization", "Standard for cellular service in Japan, Europe, Australia, and 85 other countries.", "A short length of fiber optic cable permanently fixed to a component.", "Twisted pair line without a power source.", "Term Acronym Basic Description"], "jumps": ["P1200", "P1170"]}, {"id": "P1181", "text": ["3G - Visionary concept involving the upgrade of wireless networks (see GSM). 4G is even more advanced achieving 100 Mbps in a mobile environment. 5G also exists as a concept. The telecom Shangri-La (ideal world) is wireless, portable, and above all, upgradeable..."], "jumps": []}, {"id": "P1182", "text": ["BLUETOOTH - Complicated radio frequency operation as well as a network protocol. Radios designed to the Bluetooth specification will operate in 2.4 GHz band. The data channel is asynchronous and symmetrical handling up to 721 kbps maximum data rate..."], "jumps": []}, {"id": "P1183", "text": ["DRY TWISTED PAIR WIRE - Same as twisted pair except the 48 volts used for (telephone) or any other voltage is not applied. Also called dry copper, applications include DSL, security systems, and other CLEC provided services..."], "jumps": []}, {"id": "P1184", "text": ["FIBER PIGTAILS - Used on the source package. Light Emitting Diode (LED) fiber optic sources may be ordered in pigtailed or unpigtailed configuration. Pigtails couple the light from the source to the medium. This technique resolves inherent alignment problems. --"], "jumps": []}, {"id": "P1185", "text": ["GSM - Often misinterpreted as Global System for Mobile, when it actually means Special Mobile Group (in English). GSM is an ETSI standard. GSM is a world-renowned mobile communications system. The standard is highly adaptable for cellular phone Internet connectivity (Web Phone)..."], "jumps": []}, {"id": "P1186", "text": ["INTELSAT - Consortium owned by a number of governments. INTELSAT is often misinterpreted. The first connotation is usually intelligence satellite. In fact, INTELSAT owns more than 20 of its own satellites. Public services include international, regional, and local telephone. Business services like teleconferencing and data transmission are also offered."], "jumps": []}, {"id": "P1187", "text": ["JUMPERS - Wires installed in make or break circuits. Another form of the jumper is the loopback. Loopbacks are plugs designed to interconnect circuits. A common loopback type is used in T carrier lines where the Tx pair and Rx pair are connected together..."], "jumps": []}, {"id": "P1188", "text": ["MA BELL - Some people still refer to common carriers in the US as Ma Bell. Pa Bell was never used. The term Ma Bell will live as long as there are people who remember the old Bell System. The original Bell organization was dismantled with the divesture of AT&T in 1984..."], "jumps": []}, {"id": "P1189", "text": ["OPEN SYSTEMS INTERCONNECTION MODEL - The OSI model is the standard for network protocol design. The concept of interconnect layers is used to establish a paradigm and common language...", "PBX - P is for private, which means the PBX is switchgear that you can own. A PBX is like a central office where the owner controls trunk lines, dialing, and system architecture. If a business has telecom needs, the PBX is one of the solutions. Recently, the PBX is being adapted to meet Voice over Internet Protocol (Voice over IP) services."], "jumps": []}, {"id": "P1191", "text": ["The PBX has been around for over 100 years.e. Start second line here."], "jumps": []}, {"id": "P1200", "text": ["You have not reviewed all of the information for each term. Do you want to continue?", "Packet-switching network standard from the ITU. Data is transferred in \"packets\".", "X.25 Networkkkkkkk Interconnection Model", "Something that pretends to be something that it is not. Something that exists in software only.", "186,280 miles per sec., 299,792 kilometers per sec., or 1 meter traveled in a period of 0.000000003335640952 sec.52 sec.........", "ITU standards for modems (V.90 is 56 kbps)", "Frequencies set aside for experimentation by the regulatory body.", "Copper wire pairs insulated from each other. A common transmission method.", "Most common modular plug in the world. Designed RJ-XX (XX is a type number).", "A new product not yet available for distribution. Also called vaporware.", "Attenuation caused by absorption due to rain.", "Quadrature Amplitude Modulation"], "jumps": ["P1220", "P1180"]}, {"id": "P1201", "text": ["QUADRATURE AMPLITUDE MODULATION (QAM) - Used in high capacity microwave links. Quadrature is synonymous with phase, or 90", "component of a wave. QAM (pronounced qualm) is modified to indicate compression by adding a number, e.g., 16 QAM, 32 QAM, 64 QAM, etc. 64 QAM is 4 times as compressed as 16 QAM. universally accepted. Technically, a standard telephone jack is an RJ-14."], "jumps": []}, {"id": "P1202", "text": ["RAIN FADE - Rain is the enemy of microwave. The perfect world for microwave is a vacuum with no rain. Satellite is also subject to rain fade. The water droplets absorb RF energy and attenuate the transmitted signal. This effect is usually negated by increasing output power..."], "jumps": []}, {"id": "P1203", "text": ["SMOKEWARE - Also called vaporware, is developed by highly motivated business people. Since Smokeware is only a dream or at best a prototype, it is usually not ready for issue on the date promised. Without Smokeware, telecom technology would stagnate..."], "jumps": []}, {"id": "P1204", "text": ["MODULAR PHONE JACKS - Called RJ (Registered Jack), these items are available in a number of configurations. RJ-45, 8 pins with 8 wires, is used for data comm. RJ-11, 6 pins with 4 wires, is the most common telephone jack in the world. There are several other configurations, but the terms RJ-45 and RJ-11 are universally accepted. Technically, a standard telephone jack is an RJ-14.", "MODULAR PHONE JACKS - Called RJ (Registered Jack), these items are avail. in a number of configurations. RJ-45, 8 pins with 8 wires, is used for data comm. RJ-11, 6 pins with 4 wires, is the most common telephone jack in the world. There are several other configurations, but the terms RJ-45 and RJ-11 are universally accepted. Technically, a standard telephone jack is an RJ-14."], "jumps": []}, {"id": "P1205", "text": ["UTP - An interface technology and protocol. By twisting 2 wires together, crosstalk from adjacent wires is minimum and signal strength can be maximum to cover a greater distance. The pairs of wires are also stronger because there is more copper metal and plastic insulation material. UTP is categorized by the rate of twist; the higher the data rate, the more twists. Cat. 5 has the highest data rate and is the most commonly used for telecom installations."], "jumps": []}, {"id": "P1206", "text": ["UNLICENSED BANDS - Called experimental bands or Garage Bands. As long as FCC rules are not violated, a radio may operate without a license in this band of frequencies. Many telecom service providers exploit this spectrum to provide services. There is even unlicensed PCS (1.920 to 1.930 GHz). Get a PBX, and you can own your own wireless telephone system, without license fees. That's not to say there are no restrictions.", "CENSED BANDS - Called experimental bands or Garage Bands. As long as FCC rules are not violated, a radio may operate without a license in this band of frequencies. Many telecom service providers exploit this spectrum to provide services. There is even unlicensed PCS (1.920 to 1.930 GHz). Get a PBX, and you can own your own wireless telephone system, without license fees. That's not to say there are no restrictions. ations."], "jumps": []}, {"id": "P1207", "text": ["V DOT - Jargon for the ITU modem standards. The V dots started being issued when modems first hit the market. V.21 fax is the 300 bits per second facsimile standard."], "jumps": []}, {"id": "P1208", "text": ["VELOCITY OF LIGHT - Common constant used in telecomm engineering. We tend to round up or down, depending on the scale of measure. 186,000 miles per second, 300,000,000 meters per second, or over 985 million feet per second. Theoretically, a photon (light particle) can move faster than an electron, therefore wireless and fiber optics are inherently faster than copper."], "jumps": []}, {"id": "P1209", "text": ["VIRTUAL - Something that exists in cyber space. Cyber space is a place that exists in a computer simulation."], "jumps": []}, {"id": "P1210", "text": ["X.25 - Recognized standard for packetized data communication. Packet structure, assembly & disassembly, and error correction are the hallmarks of X.25. Packet switching was invented at Rand Corporation in the early 1960s; X.25 was published in 1976..."], "jumps": []}, {"id": "P1220", "text": ["3G (third generation) wireless is an upgrade to what existing system?"], "jumps": ["P1200"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["3G is not designed to change the OSI network standard......"], "jumps": []}, {"id": "P1223", "text": ["Bluetooth is new technology and would not be upgraded by 3G."], "jumps": []}, {"id": "P1224", "text": ["ATM is not impacted directly by 3G........................."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TELECOMMUNICATIONS TERMINOLOGY."], "jumps": ["P1220", "P1001"]}, let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
