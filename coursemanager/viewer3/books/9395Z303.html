essed, the test relay (K4) becomes the dividing point. TP4 is now on the negative side of the circuit and measures 5 volts."], "jumps": ["P3340", "P3320"]}, {"id": "P3250", "text": ["10. Momentarily set S8 to the up position and notice that the buzzer sounds. Return S8 to the down position. 11. Set S1 and S2 to the Norm position and measure the voltage at TP1 and +5V TP.", "Notice that the voltage is 5 volts. When the circuit is activated by the spot detectors (S1, S2, S4, or S5), the relay is energized."], "jumps": ["P3260", "P3240"]}, {"id": "P3350", "text": ["19. Press the Buzzer Cutout button. The buzzer will silence while the LEDs remain flashing.", "9. Connect a multimeter set to DC voltage to the +5V TP and TP1."], "jumps": ["P3360", "P3340"]}, {"id": "P3222", "text": ["If they are not flashing, check your setup. If the problem is still not corrected, contact your instructor."], "jumps": []}, {"id": "P3220", "text": ["Are the Engine 1 Fire Alarm and Fire Warning System LEDs flashing?"], "jumps": ["P3200"]}, {"id": "P3221", "text": ["7. Turn PC1 DC Power switch to ON........................................."], "jumps": []}, {"id": "P3180", "text": ["5. Set the Positive Supply Control to 5. The Voltmeter on the 130A should indicate 5 volts. 6. Set the Negative Supply Control to 5. The Voltmeter on the 130A should indicate 5 volts..."], "jumps": ["P3170"]}, {"id": "P3290", "text": ["14. Measure the voltage at TP3 and the ground TP. 15. Measure the voltage at TP4 and the ground TP.", "2. Carefully plug PC130-738 into the Test Console PC1 position."], "jumps": ["P3300", "P3280"]}, {"id": "P3150", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P3140"]}, {"id": "P3270", "text": ["12. Measure the voltage at TP1 and the ground TP. 13. Measure the voltage at TP2 and the ground TP.....", "When the alarm circuit is de-energized, the buzzer relay switch returns to the buzzer position."], "jumps": ["P3280", "P3240"]}, {"id": "P3120", "text": ["Once the buzzer cut-off button (S7) is released, the relay remains energized and is part of the main alarm circuit until the alarming condition clears.", "The buzzer relay (K5) is the relay used to isolate the buzzer section of the circuit. When the buzzer cut-off button (S7) is pressed, the buzzer relay shifts the relay switch to the coil side (K5) of the circuit..."], "jumps": ["P3020"]}, {"id": "P3100", "text": ["The engine fire display, Fire Warning indicator, and buzzer should be activated while the test button is pressed.", "The Test push buttons (S3 and S6) are used to energize the test relays (K2 for Engine 1 and K4 for Engine 2). The test relays act as the spot detector while the Test push buttons are pressed and energize the alarm relays..."], "jumps": ["P3020"]}, {"id": "P3080", "text": ["Current flowing through the relay's coil generates a magnetic field. The magnetic field attracts the relay switches, shifting them to the ground contact. When the alarm relays are de-energized, the relay's switches return to the open circuit position..."], "jumps": ["P3020"]}, {"id": "P3070", "text": ["When energized, the alarm relays (K1 or K2) complete the circuit to ground for the local engine fire alarm, the main fire warning indicator, and buzzer.", "Completion of the circuit energizes the engine fire warning alarm relay for engine 1 or 2 (K1 or K2). S1, S2 and K1 are for Engine 1 and S4, S5, and K2 are used for Engine 2."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["When these switches are placed in the fire position, they provide a path to ground to complete the circuit.", "S1, S2, S4, and S5 are used to simulate the operation of a thermal switch or a graviner fire wire (resistive type) in an engine spot detector circuit."], "jumps": ["P3020"]}, {"id": "P3030", "text": ["The Nida PC130-738 card is used to display an operational fire warning circuit. The controls and indicators on this card represent the typical control panel components found on most aircraft..."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["S1, S2, S4, and S5 are used to simulate the operation of a thermal switch or a graviner fire wire (resistive type) in an engine spot detector circuit."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["Completion of the circuit energizes the engine fire warning alarm relay for engine 1 or 2 (K1 or K2). S1, S2 and K1 are for Engine 1 and S4, S5, and K2 are used for Engine 2."], "jumps": ["P3020"]}, {"id": "P3080", "text": ["Current flowing through the relay's coil generates a magnetic field. The magnetic field attracts the relay switches, shifting them to the ground contact. When the alarm relays are de-energized, the relay's switches return to the open circuit position..."], "jumps": ["P3020"]}, {"id": "P3090", "text": ["The Test push buttons (S3 and S6) are used to energize the test relays (K2 for Engine 1 and K4 for Engine 2). The test relays act as the spot detector while the Test push buttons are pressed and energize the alarm relays..."], "jumps": ["P3020"]}, {"id": "P3110", "text": ["The buzzer relay (K5) is the relay used to isolate the buzzer section of the circuit. When the buzzer cut-off button (S7) is pressed, the buzzer relay shifts the relay switch to the coil side (K5) of the circuit..."], "jumps": ["P3020"]}, {"id": "P3130", "text": ["When the alarm circuit is de-energized, the buzzer relay switch returns to the buzzer position."], "jumps": ["P3020"]}, {"id": "P3200", "text": ["7. Turn PC1 DC Power switch to ON........................................."], "jumps": ["P3180"]}, {"id": "P3230", "text": ["9. Connect a multimeter set to DC voltage to the +5V TP and TP1."], "jumps": ["P3240", "P3220"]}, {"id": "P3310", "text": ["16. Connect the multimeter between the +5V TP and TP4. 17. Press the test button (S6) and note the voltage reading. Engine 2 Fire Alarm and Fire Warning System LEDs should be blinking."], "jumps": ["P3320", "P3300"]}, {"id": "P3390", "text": ["21. Set S8 to the down position and both Engine 2 Spot Detectors (S4 and S5) to the Norm position."], "jumps": ["P3400", "P3360"]}, {"id": "P3400", "text": ["You have just observed the normal operation of the fire warning system. Let's see how a faulty system would operate.he PC3 Speaker switch to ON........................................."], "jumps": ["P3390"]}, {"id": "P3420", "text": ["1. Connect the multimeter between the +5V TP and TP2. A voltage reading at this point indicates that the detector part of the circuit is grounded and completing the circuit for the alarm relay (K3)."], "jumps": ["P3430", "P3410"]}, {"id": "P3440", "text": ["During normal operation, when would 5 volts be indicated at TP4 and +5V TP?", "When 5 volts is constantly present at TP4.", "Both when the Push Test button is pressed and 5 volts is constantly present at TP4.."], "jumps": ["P3410"]}, {"id": "P3470", "text": ["The measurement of 0 ohms verifies that the ground is in the test circuit. The cause could be a faulty relay, test push button or a broken connection..................................."], "jumps": ["P3460"]}, {"id": "P3475", "text": ["Now that you have determined the fault, let's try another fault. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3470"]}, {"id": "P3500", "text": ["The voltage reading goes from 0 to 5 volts when S3 is pressed. This indicates that the test relay circuit is operating correctly."], "jumps": ["P3510", "P3490"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FIRE WARNING AND EXTINGUISHING SYSTEMf asdf sadf"], "jumps": []}, {"id": "P2960", "text": ["5. Portable Water Extinguishers are most effective with Class A fires and are not normally used with the other classes of fires.", "4. Three types of extinguishers are used to put out fires.", "Water - Cooling Dry Powder - Oxygen Removal Inert Gas - Oxygen Removal"], "jumps": ["P2970", "P2950", "P2960", "P2940"]}, {"id": "P2940", "text": ["3. Class C fires involve energized electrical equipment and are most commonly found in the equipment spaces or panels."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. Three types of extinguishers are used to put out fires.", "Water - Cooling Dry Powder - Oxygen Removal Inert Gas - Oxygen Removal"], "jumps": ["P2960", "P2940"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P2001", "P2970"]}, {"id": "P2920", "text": ["1. Class A fires are those that have combustible material that and leave ash when burned such as paper, cloth, or wood. The cabin or the cargo bay would normally have this type of fire..", "This completes the information on FIRE EXTINGUISHING SYSTEMS."], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on FIRE EXTINGUISHING SYSTEMS."], "jumps": ["P2001", "P2350"]}, {"id": "P2390", "text": ["When the \"T\" handle switch is activated, the toggle switch must be turned on to activate the SQUIB. This toggle switch prevents accidental triggering of the SQUIB."], "jumps": ["P2400", "P2350"]}, {"id": "P2370", "text": ["A pressure switch notifies the crew when the pressure falls below 250 pounds per square inch (PSI) in the bottle. The indicator reports that the bottle is discharged."], "jumps": ["P2380", "P2350", "PSI"]}, {"id": "P2380", "text": ["If a fire is encountered while on the ground, a \"T\" handle and a switch is provided at the right wheel well."], "jumps": ["P2390", "P2350"]}, {"id": "P2400", "text": ["The two switches must be repositioned to discharge the system. This prevents accidental discharge of the system during maintenance."], "jumps": ["P2410", "P2350"]}, {"id": "P2910", "text": ["This completes the information on FIRE EXTINGUISHING SYSTEMS."], "jumps": ["P2001", "P2350"]}, {"id": "P2930", "text": ["2. Class B fires are those that have flammable liquids for a fuel. This would be in the area of the aircraft's fuel system or the engine compartment."], "jumps": ["P2940", "P2920"]}, {"id": "P2340", "text": ["The system has two indicators visible from outside the aircraft. These indicate when the system is activated or overpressurized."], "jumps": ["P2350", "P2320"]}, {"id": "P2320", "text": ["The system has two or more spherical stainless steel bottles. They are 5 inches in diameter and hold approximately 78 cubic inches of extinguishing agent."], "jumps": ["P2330", "P2310"]}, {"id": "P2360", "text": ["The current to the SQUIB is greater than 125 amps. The SQUIB heats up and detonates, opening the bottle. Once opened, the system cannot be stopped from discharging the agent.", "Older systems used CO to displace large amounts of oxygen, smothering the fire. This made the environment dangerous for humans. Halon 1301 does not displace nearly as much oxygen, making it safer for humans."], "jumps": ["P2370", "P2350"]}, {"id": "P3240", "text": ["Notice that the voltage is 5 volts. When the circuit is activated by the spot detectors (S1, S2, S4, or S5), the relay is energized."], "jumps": ["P3250", "P3230"]}, {"id": "P2310", "text": ["Minimally, a 35% concentration of CO is required to displace enough oxygen to extinguish a fire. Halon can achieve this end with only a 5% concentration.", "Both the dry powder and inert type extinguisher place a blanket of CO over the fire and separate the fire from the oxygen.."], "jumps": ["P2320", "P2290"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2260", "text": ["Which extinguisher removes the heat and cools the fire?...."], "jumps": ["P2250"]}, {"id": "P3210", "text": ["8. Check the circuit for operation by placing S1 or S2 to the fire position."], "jumps": ["P3220", "P3200"]}, {"id": "P2330", "text": ["The system is charged with 1.5 pounds of halon 1301 and pressurized with nitrogen."], "jumps": ["P2340", "P2320"]}, {"id": "P2252", "text": ["The control panel contains delicate electrical equipment. A fire here is normally class 3. Using water may electrocute the person extinguishing the fire. The use of powder may damage the electrical equipment."], "jumps": []}, {"id": "P2243", "text": ["Class B fires are those that have flammable liquids for a fuel."], "jumps": []}, {"id": "P2400", "text": ["The two switches must be repositioned to discharge the system. This prevents accidental discharge of the system during maintenance."], "jumps": ["P2410", "P2350"]}, {"id": "P2242", "text": ["Class A fires are those that have combustible material and leave ash when burned such as: paper, cloth, and wood."], "jumps": []}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Both the dry powder and inert type extinguisher place a blanket of CO over the fire and separate the fire from the oxygen.."], "jumps": []}, {"id": "P2410", "text": ["The test switch allows the current to the SQUIB and an indicator to test continuity of the circuit. Because of resistors, the current is at 80 amps, which is 45 amps below the required current levels for detonation of the SQUIB..."], "jumps": ["P2910", "P2350"]}, {"id": "P3170", "text": ["3. Set S1, S2, S4 and S5 to the Norm position. 4. Set S8 to down position."], "jumps": ["P3180", "P3160"]}, {"id": "P2210", "text": ["This wire and lead seal is made so that the operator is not hindered in extinguishing the fire. The seal is not intended to prevent operation, only indicate usage."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["All portable extinguishers should be checked at least once a month. The pressure gauges of extinguishers should always indicate fully charged."], "jumps": ["P2230", "P2200"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2270", "text": ["All multi-engine aircraft are required to have an installed fire extinguishing system. The system may use one of two inert extinguishing agents..."], "jumps": ["P2280", "P2260"]}, {"id": "P2190", "text": ["Just like the dry powder, a gauge is used to indicate the charge of the cylinder."], "jumps": ["P2200", "P2180"]}, {"id": "P2150", "text": ["Just like the water extinguisher, the dry powder is pressured with CO . The pressure forces out the bicarbonate of soda."], "jumps": ["P2160", "P2130"]}, {"id": "P2130", "text": ["Portable dry powder extinguishers are used on all classes of fires and are usually placed near the cabin and cargo bay."], "jumps": ["P2140", "P2090"]}, {"id": "P2110", "text": ["Small containers of water fitted with a carbon dioxide (CO ) cartridge are installed where Class A fires are most likely to occur."], "jumps": ["P2120", "P2090"]}, {"id": "P2090", "text": ["Portable Water Extinguishers are the most effective device used against class A fires."], "jumps": ["P2100", "P2080"]}, {"id": "P2070", "text": ["Fuel removal is not normally a practical method of extinguishing a fire. Removing either the heat or oxygen is normally the best method."], "jumps": ["P2080", "P2060"]}, {"id": "P2120", "text": ["When the handle is twisted about 90 degrees, the CO cartridge is punctured. This pressurizes the cylinder and forces the water out of the extinguisher.", "Water is not always effective or safe when battling a class B or C fire. Fuel usually floats on water, and water can spread fuel fires. Water also conducts electricity and could electrocute the person extinguishing an electrical fire...."], "jumps": ["P2130", "P2090"]}, {"id": "P2050", "text": ["Class C fires involve energized electrical equipment and are most commonly found in the equipment spaces or panels."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["In order to extinguish a fire, one of three elements must be removed."], "jumps": ["P2070", "P2050"]}, {"id": "P2170", "text": ["The amount of pressure remaining in the cylinder is indicated by a pressure gauge. The low pressure zone is marked with the term \"RECHARGE\" in white letters on a red background."], "jumps": ["P2180", "P2130"]}, {"id": "P2250", "text": ["What type of extinguisher should be used to extinguish a fire in the cockpit control panel? K"], "jumps": ["P2240"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2080", "text": ["There are three types of extinguishing agents used to extinguish fires on board today's modern aircraft.", "Water - Cooling Dry Powder - Oxygen Removal Inert Gas - Oxygen Removal"], "jumps": ["P2090", "P2060"]}, {"id": "P1980", "text": ["7. Thermocouples use two dissimilar metals to detect temperature differences."], "jumps": ["P1990", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1990"]}, {"id": "P1960", "text": ["5. Infrared Flame Detectors - system consists of a forward and aft engine compartment photocell-type flame detector.", "4. Smoke Detectors are classified by one of three methods of operation.", "Type I - Measurement of Carbon Monoxide Gas Type II - Measurement of Light Transmissibility Type III - Visual Detection of Air Sample"], "jumps": ["P1970", "P1950", "P1960", "P1940"]}, {"id": "P1940", "text": ["3. Flame and heat detectors are used in locations of normally high operating temperatures, places where the heat or flames would be produced first with little or no smoke.", "Engine Compartments Landing Gear Housing"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Smoke Detectors are classified by one of three methods of operation.", "Type I - Measurement of Carbon Monoxide Gas Type II - Measurement of Light Transmissibility Type III - Visual Detection of Air Sample"], "jumps": ["P1960", "P1940"]}, {"id": "P1970", "text": ["6. Thermal Switches use a bi-metal strip to indicate a rise in temperature."], "jumps": ["P1980", "P1960"]}, {"id": "P1990", "text": ["8. Graviner Fire wires are used like resistors or capacitors. The fire wire is a stainless steel capillary tube, which contains an electrode surrounded by a temperature sensitive salt compound..."], "jumps": ["P1999", "P1980"]}, {"id": "P2040", "text": ["Class B fires involve flammable liquids such as fuel. These types of fires are usually in the aircraft's fuel system or engine compartment."], "jumps": ["P2050", "P2030"]}, {"id": "P2100", "text": ["Water is not always effective or safe when battling a class B or C fire. Fuel usually floats on water, and water can spread fuel fires. Water also conducts electricity and could electrocute the person extinguishing an electrical fire...."], "jumps": ["P2110", "P2090"]}, {"id": "P1523", "text": ["Graviner Fire Wire (Resistive) provides a path to ground and does not hold a charge."], "jumps": []}, {"id": "P1522", "text": [], "jumps": []}, {"id": "P1930", "text": ["2. Smoke detectors are best used in the cargo bay, cabin of the aircraft, and the equipment space. The flammable materials located in these areas have a tendency to smolder and produce more smoke at first..."], "jumps": ["P1940", "P1920"]}, {"id": "P2290", "text": ["Halon 1301 is much more effective in combating engine fires. Halon chemically prevents the oxygen from mixing with the fuel of the fire."], "jumps": ["P2300", "P2280"]}, {"id": "P2140", "text": ["Dry powder is not recommended for use on delicate electrical equipment. The powder may have a corrosive effect and equipment failure could occur. If there is no other means for fire extinguishing, this should be used..."], "jumps": ["P2150", "P2130"]}, {"id": "P2160", "text": ["When the powder is heated, it gives off a CO gas and blankets the fire. This separates the fire from the oxygen."], "jumps": ["P2170", "P2130"]}, {"id": "P2180", "text": ["The portable inert gas extinguisher or carbon dioxide fire extinguisher looks similar to the dry powder extinguisher. CO is an inert gas which separates the fire from the oxygen."], "jumps": ["P2190", "P2130"]}, {"id": "P2200", "text": ["All portable extinguishers use a thin copper wire with a lead seal to indicate if the extinguisher has been discharged since last inspection."], "jumps": ["P2210", "P2180"]}, {"id": "P2230", "text": ["The dry powder extinguisher should have the powder agitated to prevent packing and hardening. This can be accomplished by turning the extinguisher upside down and shaking it once a month..."], "jumps": ["P2240", "P2200"]}, {"id": "P2240", "text": ["What is an electrical fire classified as?.................."], "jumps": ["P2200"]}, {"id": "P3260", "text": ["With the path to ground removed (S1 and S2 to Norm position), the voltage is zero."], "jumps": ["P3270", "P3240"]}, {"id": "P1513", "text": ["Graviner Fire Wire (Resistive) uses a stainless steel capillary tube, which contains a central wire electrode separated from the tube by a salt compound that is temperature sensitive."], "jumps": []}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1510", "text": ["Which type of detector operates with the principle of two dissimilar metals connected at two points and heated at one end to produce a small electrical charge?"], "jumps": ["P1440"]}, {"id": "P1524", "text": ["The thermocouple operates on a principle of two dissimilar metals connected at two points and when heated at one end produces a small electrical charge."], "jumps": []}, {"id": "P1920", "text": ["1. There are three methods of remote detection for a potential fire hazard or condition.", "Smoke Detectors Infrared Flame Detectors Heat Detectors"], "jumps": ["P1930", "P1001"]}, {"id": "P1490", "text": ["The current is interrupted while the fire wire is charging for the next discharge to the SCR. A capacitor (C2) discharges to the alarming relay while the fire wire electrically charges."], "jumps": ["P1500", "P1440"]}, {"id": "P1500", "text": ["This keeps the alarm activated and prevents cycling of the alarm indicators."], "jumps": ["P1510", "P1440"]}, {"id": "P1512", "text": ["A rise in temperature causes a metal strip in the thermal switch to bend and make contact with the sensor body.", "The Graviner Fire Wire (capacitance) also uses a fire wire. The fire wire used acts like a capacitor, storing and releasing electrical energy."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["When the wire is heated by the fire, the electrical storage capacity increases. At a certain temperature, the fire wire discharges and triggers a silicon control rectifier which activates the alarm relay..."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Since the fire wire charges and discharges on a continuing basis, a charging capacitor (C1) is used to counter the fire wire. This prevents the SCR from being triggered at low temperatures."], "jumps": ["P1470", "P1440"]}, {"id": "P1420", "text": ["AC current is sent to the relay box coil, allowing the current to shift the relays. When the heat from the engine compartment increases, the resistance lowers in the wire and provides a path to ground...", "The fire wire is located around the outside of the engine. A short section is placed in the breather outlet."], "jumps": ["P1430", "P1380"]}, {"id": "P1432", "text": ["A test relay, when activated, provides a path to ground and activates the circuit. The complete circuit is tested and the fire wire is tested for continuity only."], "jumps": ["P1440", "P1420"]}, {"id": "P1370", "text": ["The Graviner Fire Wire (resistive) uses a heat detecting component called a fire wire."], "jumps": ["P1380", "P1320"]}, {"id": "P1350", "text": ["The slave relay then completes the circuit for the alarm, and the alarm system is activated."], "jumps": ["P1360", "P1320"]}, {"id": "P1380", "text": ["A fire wire is a stainless steel capillary tube, which contains a central wire electrode separated from the tube by a salt compound that is temperature sensitive."], "jumps": ["P1390", "P1370"]}, {"id": "P1410", "text": ["The fire wire is located around the outside of the engine. A short section is placed in the breather outlet."], "jumps": ["P1420", "P1380"]}, {"id": "P1470", "text": ["C, causing the fire wire to increase the electrical charge, the charge is more than the charging capacitor (C1) can manage. The remaining electrical charge triggers the SCR.iggers the SCR..."], "jumps": ["P1480", "P1440"]}, {"id": "P1330", "text": ["If the temperature rises at both ends of the metals, zero charge is produced. This means a slow overheating would not be detected."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["When the thermocouple produces a charge, the sensitive relay is energized when current is greater than 4 milliampere. The circuit for the slave relay is then energized."], "jumps": ["P1350", "P1320"]}, {"id": "P1360", "text": ["The test switch activates a heater to produce heat at one end of a thermocouple, producing a large temperature difference and creating a voltage. Again, the circuit is tested and not the thermocouples..."], "jumps": ["P1370", "P1320"]}, {"id": "P1400", "text": ["At or below normal operating temperatures, the salt compound has a high resistance and prevents a path to ground.", "The test switch activates a heater to produce heat at one end of a thermocouple, producing a large temperature difference and creating a voltage. Again, the circuit is tested and not the thermocouples..."], "jumps": ["P1410", "P1380"]}, {"id": "P1280", "text": ["This provides a path to ground and completes the circuit..."], "jumps": ["P1290", "P1260"]}, {"id": "P1320", "text": ["Unlike the thermal switch, the thermocouple operates on a temperature difference. When two dissimilar metals such as chromel and constantan are connected at two points and heated at one end, a small electrical charge is produced..."], "jumps": ["P1330", "P1280"]}, {"id": "P2300", "text": ["Older systems used CO to displace large amounts of oxygen, smothering the fire. This made the environment dangerous for humans. Halon 1301 does not displace nearly as much oxygen, making it safer for humans."], "jumps": ["P2310", "P2290"]}, {"id": "P1240", "text": ["The Bi-Metallic switch uses a metal strip constructed of two separate metals bonded together. When the strip is heated, the metals expand at different rates, causing the strip to bend and make contact with the sensor's body..."], "jumps": ["P1250", "P1230"]}, {"id": "P1300", "text": ["When the path to ground is provided, the light is illuminated and the alarm is sounded."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["A test relay, when energized, provides a path to ground, illuminates the light, and sounds the alarm. This does not test the thermal switches, only the circuit to the switches."], "jumps": ["P1320", "P1280"]}, {"id": "P1212", "text": ["Type I detectors measure carbon monoxide gas..............."], "jumps": []}, {"id": "P1210", "text": ["What type of smoke detector measures the amount of light refracted?", "Smoke and flame detectors are two of the methods. Infrared is the same as a flame detector.", "Nida Corporation - Fire Warning and Extinguishing System", "tion - Fire Warning and Extinguishing System"], "jumps": ["P1200"]}, {"id": "P1430", "text": ["The warning relay is then provided with a path to ground. The warning relay is energized and shifts the switch to apply power from the DC bus to the alarm circuit."], "jumps": ["P1432", "P1420"]}, {"id": "P1480", "text": ["Current from the main coil enters through the SCR to the alarm relay. The return path is from the alarm relay through R2 to the main coil."], "jumps": ["P1490", "P1440"]}, {"id": "P1500", "text": ["This keeps the alarm activated and prevents cycling of the alarm indicators."], "jumps": ["P1510", "P1440"]}, {"id": "P1510", "text": ["Which type of detector operates with the principle of two dissimilar metals connected at two points and heated at one end to produce a small electrical charge?"], "jumps": ["P1440"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1390", "text": ["As the heat increases, the resistance of the salt compound decreases, allowing the current path from the wire electrode to the capillary tube (ground) to increase."], "jumps": ["P1400", "P1380"]}, {"id": "P1430", "text": ["The warning relay is then provided with a path to ground. The warning relay is energized and shifts the switch to apply power from the DC bus to the alarm circuit.", "When the path to ground is provided, the light is illuminated and the alarm is sounded."], "jumps": ["P1432", "P1420"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["Type I, II, and III classify smoke detector operation......"], "jumps": []}, {"id": "P1150", "text": ["When smoke is drawn into the indicator, the light illuminates the smoke. This makes the observation window illuminate, and the smoke is visible to the crew."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Since the light is not visible when smoke is not present, a green light is used to indicate that the detector is operating."], "jumps": ["P1170", "P1120"]}, {"id": "P1140", "text": ["A light beam shines across the air passage which is seen through the observation window."], "jumps": ["P1145", "P1120"]}, {"id": "P1080", "text": ["Air is drawn into a glass tube filled with a yellow silica gel, impregnated with complex silico-molybdate compound. CO in the air turns the gel green. The higher the concentration of CO, the darker green the gel turns, indicating a possible fire..."], "jumps": ["P1090", "P1060"]}, {"id": "P1075", "text": ["If suspicion of a possible fire arises, this type of detector is carried to the area of concern and the air is tested for CO."], "jumps": ["P1080", "P1060"]}, {"id": "P1110", "text": ["The smoke detector's amplifier circuit activates the warning circuits, illuminating warning lights and sounding alarms."], "jumps": ["P1120", "P1090"]}, {"id": "P1050", "text": ["Smoke detectors are classified by operation. There are three different types of operation.", "Type I - Measurement of Carbon Monoxide Gas Type II - Measurement of Light Transmissibility Type III - Visual Detection of Air Sample"], "jumps": ["P1060", "P1040"]}, {"id": "P1120", "text": ["Type II detectors allow pilots to visually inspect air samples."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["These detectors consist of an optical indicator on the flight engineer's panel through which a sampling of air from the compartments continually passes."], "jumps": ["P1140", "P1120"]}, {"id": "P1260", "text": ["The differential expansion (Fenwal) switch uses two metal strips located in a brass tube. At a low temperature, the metal strips are bowed from each other, keeping the contacts separated."], "jumps": ["P1270", "P1240"]}, {"id": "P1060", "text": ["A Type I detector is normally portable and detects the presence of carbon monoxide, known as CO.", "A permanently installed system is used instead of portable fire extinguishing equipment. It would be very hard to extinguish an engine fire traveling at 600 miles per hour and 10,000 feet in the air..."], "jumps": ["P1070", "P1050"]}, {"id": "P1270", "text": ["As the temperature rises, the brass tube expands, causing the two metal strips to be stretched and make contact with each other."], "jumps": ["P1280", "P1260"]}, {"id": "P1290", "text": ["Both types of thermal switches return to their original position when the temperatures lower, disconnecting the path from ground."], "jumps": ["P1300", "P1280"]}, {"id": "P1100", "text": ["When the air drawn into the trap and chamber contains about 10% smoke, the light beam is refracted to the photocell. The photocell then conducts current and sends a signal to the detector's amplifier..."], "jumps": ["P1110", "P1090"]}, {"id": "P1145", "text": ["When there is no smoke, the light is not visible to the crew."], "jumps": ["P1150", "P1120"]}, {"id": "P3160", "text": ["2. Carefully plug PC130-738 into the Test Console PC1 position."], "jumps": ["P3170", "P3150"]}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P440", "text": ["Let's begin the lesson on FIRE WARNING AND EXTINGUISHING SYSTEM.............", "Nida Corporation - Fire Warning and Extinguishing System"], "jumps": ["P430"]}, {"id": "P430", "text": ["This lesson discusses the many different methods of detection and extinguishing aircraft fires. You will understand the operation for each class of fire encountered on an aircraft."], "jumps": ["P440", "P400"]}, {"id": "P1070", "text": ["CO is a by-product of incomplete combustion. It is found in all smoke and fumes from burning carbon substances."], "jumps": ["P1075", "P1060"]}, {"id": "P1090", "text": ["The Type II detector is activated by light. Light is reflected towards a photocell or light trap.", "Nida Corporation - Fire Warning and Extinguishing System", "You have successfully passed the assessment test!"], "jumps": ["P1100", "P1060"]}, {"id": "P1020", "text": ["There are three methods of remote detection for a potential fire hazard or condition.", "Smoke Detectors Infrared Flame Detectors Heat Detectors"], "jumps": ["P1030", "P1001"]}, {"id": "P1170", "text": ["Infrared flame detectors consist of a forward and aft engine compartment photocell."], "jumps": ["P1180", "P1120"]}, {"id": "P1200", "text": ["What are the three methods of remote detection for a potential fire hazard or condition?"], "jumps": ["P1170"]}, {"id": "P1220", "text": ["There are four major types of heat detecting systems used on aircraft today.", "Thermal switches Thermocouple Graviner Fire Wire (Resistive) Graviner Fire Wire (Capacitance)"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["There are two types of thermal switches used for heat detection.", "Bi-Metallic Switch Differential expansion (Fenwal)"], "jumps": ["P1240", "P1220"]}, {"id": "P1250", "text": ["When the metal strip makes contact with the sensor's body, the circuit has a path to ground which completes the circuit."], "jumps": ["P1260", "P1240"]}, {"id": "P3140", "text": ["Now that you have an understanding of the circuit, let's begin the experiment."], "jumps": ["P3150", "P3020"]}, {"id": "P1180", "text": ["When a fire occurs, the forward or aft flame detector photocell activates and sends an electrical signal to the control amplifier, which in turn, sends 28 VDC to the warning lights."], "jumps": ["P1200", "P1170"]}, {"id": "P1213", "text": ["Type III detectors give pilots a visual indication of smoke."], "jumps": []}, {"id": "P1030", "text": ["Smoke detectors are best used in the cargo bay, aircraft cabin, and equipment space. The flammable materials located in these areas have a tendency to smolder and produce more smoke before a flame ignites..."], "jumps": ["P1040", "P1020"]}, {"id": "P1480", "text": ["Current from the main coil enters through the SCR to the alarm relay. The return path is from the alarm relay through R2 to the main coil."], "jumps": ["P1490", "P1440"]}, {"id": "P2020", "text": ["A fire can be extinguished quickly if you know the class of fire."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Class A fires are those that have combustible material and leave ash when burned. Some of these materials are paper, cloth and wood. The cabin or the cargo bay would normally have this type of fire..", ";! :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::", ";!! :"], "jumps": ["P2040", "P2020"]}, {"id": "P1203", "text": ["Smoke and flame detectors are two of the methods. Infrared is the same as a flame detector."], "jumps": []}, {"id": "P10", "text": ["\"You have successfully passed the assessment"], "jumps": []}, {"id": "P1140", "text": ["A light beam shines across the air passage which is seen through the observation window."], "jumps": ["P1145", "P1120"]}, {"id": "P330", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify different types of fire warning systems. w Explain the basic operation of each type of system. w Explain the distinct fire protection requirement for each area of the aircraft.", "w Describe the different types of fire extinguishing agents. w Explain the basic operation of the fire extinguishing system.", "w Identify a normal operating fire warning system. w Identify a faulty operating fire warning system.", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!", "# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
