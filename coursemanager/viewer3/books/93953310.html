ntact your instructor.", "Ensure the two jumpers are placed vertically between the middle and bottom jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, contact your instructor.......................................", "Jumpers that have not been installed correctly on the PC130-23 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": ["P13050", "P13030"]}, {"id": "P301", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P336", "text": [], "jumps": []}, {"id": "P336", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting voltage regulator circuits and you will troubleshoot a faulted voltage regulator circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Voltage regulators maintain a constant Vout under changing input and output conditions."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring the output voltage with a multimeter or oscilloscope will determine if the circuit is operating normally."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["An incorrect voltage output indicates that the circuit is faulted."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Let's begin the lesson on VOLTAGE REGULATOR TROUBLESHOOTING EXPERIMENT......"], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The most common faults in voltage regulators are defective semiconductor devices (transistors or zener diodes)."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["However, the resistors in the circuit cannot be ignored."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["For the circuit to operate, all components must be functioning correctly."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Let's look at the faults There is no output voltage.es 0 V."], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": [], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["The same indications are present if R1 opens.  Resistance measurements determine the fault.", "The same indications are present if R1 opens. Resistance measurements determine the fault."], "jumps": ["P1160", "P1060"]}, {"id": "P1160", "text": ["Faults in Q1 also change the output voltage.", "Faults in Q1 also change the output voltage................"], "jumps": ["P1170", "P1060"]}, {"id": "P1170", "text": ["A short between the collector and emitter places Ee at 12 V."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["An open between the collector and base prevents collector current flow. There is still an output of 7.4 V, due to the action of the zener diode, but load current is severly reduced and there is very little voltage regulation.n...n."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["A short between the base and emitter places Ee at the base voltage, .6 V higher than normal."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["An open between the base and emitter prevents current flow.  Vout is  0 V.", "An open between the base and emitter prevents current flow. Vout is 0 V."], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["Troubleshooting zener diode voltage regulator circuits is the same as troubleshooting common base transistor circuits."], "jumps": ["P1220", "P1160"]}, {"id": "P1220", "text": ["What are the probable faults in this zener diode voltage regulator circuit?"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["Remember, a shorted component measures 0 V and an open component measures the applied voltage."], "jumps": []}, {"id": "P1223", "text": ["An open in the transistor would not affect the base voltage.  Notice that Eb is 0 V.", "An open in the transistor would not affect the base voltage. Notice that Eb is 0 V."], "jum  measures 0 V.  Notice that Q2 measures \n2 V.", "A shorted component measures 0 V. Notice that Q2 measures 2 V.", "Q1 Ec = 12 V Eb = 4 V Ee = 12 VVV"], "jumps": []}, {"id": "P1460", "text": ["As you have seen, opens and shorts cause changes in the output voltage in voltage regulators."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Measuring the output voltage quickly determines if the circuit is operating normally."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["If the output voltage is incorrect, voltage measurements in the regulator's (Q1) base circuit will determine the fault."], "jumps": ["P1910", "P1460"]}, {"id": "P1910", "text": ["This completes the information on VOLTAGE REGULATOR FAULTS.", "This completes the information on VOLTAGE REGULATOR FAULTS..."], "jumps": ["P1001", "P1460"]}, {"id": "P1920", "text": ["1.  Faults in voltage regulator circuits change the output voltage.", "1. Faults in voltage regulator circuits change the output voltage."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Measuring the output voltage quickly determines if a circuit is        faulted.", "2. Measuring the output voltage quickly determines if a circuit is faulted."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  A short is indicated by a 0 V measurement across the shorted       component.", "3. A short is indicated by a 0 V measurement across the shorted component.", "Q1 Ec = 12 V Eb = 2 V Ee = 1.4 VV"], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  An open is indicated by the applied voltage being measured          across the open component.", "4. An open is indicated by the applied voltage being measured across the open component.", "Q1 Ec = 12 V Eb = 0 V Ee = 0 V VV"], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  When the base circuit of the regulator only has two                           components, an open R1 or a shorted D1 is determined by             resistance measurement.", "5. When umps": ["P2050", "P2040"]}, {"id": "P2050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown.  This card is used as the rectifier and is placed in the PC1 position.", "Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P2060", "P2045"]}, {"id": "P2060", "text": ["Pick up the PC130-25 card.  This card is used to troubleshoot a zener diode voltage regulator circuit and is placed in the PC2 position.", "Pick up the PC130-25 card. This card is used to troubleshoot a zener diode voltage regulator circuit and is placed in the PC2 position."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Compare the card with the schematic shown."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Notice that D1 is an 8.2 V zener diode.  The output voltage for this regulator is approximately 7.6 V.", "Notice that D1 is an 8.2 V zener diode. The output voltage for this regulator is approximately 7.6 V."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["For this experiment, the regulator circuit remains unloaded, S1 to the OUT position.  Let's start the experiment.", "For this experiment, the regulator circuit remains unloaded, S1 to the OUT position. Let's start the experiment."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2060"]}, {"id": "P2110", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.  3.  Carefully plug PC130-25 into the Test Console PC2 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. 3. Carefully plug PC130-25 into the Test Console PC2 position.ker switch to ON........................................."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["4.  On PC130-23:  Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6               OUT.  This sets up the rectifier for full wave and allows the              output to be connected to the PC130-25 card.", "4. On PC130-23: Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6 OUT. This sets up the rectifier for full wave and allows the output to be connected to the PC130-25 card. 1 14"], "jumps": ["P2110", "P2125"]}, {"id": "P2125", "text": ["MEASUREMENT SETUP - Carefully place S1 and S2 to IN. Carefully place S3 to the right. Carefully place S4, S5 and S6 to OUT."], "jumps": ["P2120"]}, {"id": "P2130", "text": ["5.  On PC130-25 place S1, S2 and S3 to OUT.  S1 OUT                            disconnects the load from the emitter of Q1.", "5. On PC130-25 place S1, S2 and S3 to OUT. S1 OUT disconnects the load from the emitter of Q1.."], "jumps": ["P2150", "P2120", "P2135"]}, {"id": "P2135", "text": ["MEASUREMENT SETUP - Carefully place S1, S2 and S3 to the OUT position."], "jumps": []}, {"id": "P2150", "text": ["6.  Set the PC1 AC Power switch to ON.", "6. Set the PC1 AC Power switch to ON......................................"], "jumps": ["P2130"]}, {"id": "P2160", "text": ["7.  Using a multimeter, measure the DC voltage at PC130-25 TP4        with respect to ground (input to regulator card from the                   rectifier card).  \n     What is the measured voltage?", "7. Using a multimeter, measure the DC voltage at PC130-25 TP4 with respect to ground (input to regulator card from the rectifier card). What is the measured voltage?"], "jumps": ["P2150", "P2162", "P2165"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["Your voltage measurement is incorrect.  Ensure that you are using the multimeter correctly and that you are measuring TP4 on PC130-25.  Also, check that on PC130-23 switches S1 and S2 are IN, S3 is to the right, and S4, S5 and S6 are OUT.", "Your voltage measurement is incorrect. Ensure that you are using the multimeter correctly and that you are measuring TP4 on PC130-25. Also, check that on PC130-23 switches S1 and S2 are IN, S3 is to the right, and S4, S5 and S6 are OUT..."], "jumps": []}, {"id": "P2165", "text": ["MEASUREMENT SETUP - Carefully connect the multimeter to TP4."], "jumps": []}, {"id": "P2167", "text": ["Your measurement is still incorrect.  You should have measured about 20 VDC.  Make sure your set up is correct and you are measuring PC130-25 TP4.", "Your measurement is still incorrect. You should have measured about 20 VDC. Make sure your set up is correct and you are measuring PC130-25 TP4."], "jumps": ["PutVar"]}, {"id": "P2170", "text": ["The experiment is now set up.  Let's verify normal voltages on Q1 before inserting a fault.", "The experiment is now set up. Let's verify normal voltages on Q1 before inserting a fault."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["8.  Using a multimeter, measure the voltages on Q1 at:", "8. Using a multimeter, measure the voltages on Q1 at:.....", "Ec (TP4 to TP1), Input voltage Eb (TP5 to TP1), Zener voltage Ee (TP7 to TP1), Output voltage"], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": ["PC130-25 MEASUREMENT SETUP - Carefully measure the voltages at Q1 with the multimeter."], "jumps": []}, {"id": "P2190", "text": ["You should have measured approximate values of:\nEc = 20V     Eb = 8.2V      Ee = 7.6V", "You should have measured approximate values of: Ec = 20V Eb = 8.2V Ee = 7.6VVVVVVVVVVVVV"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["The circuit is operating correctly.  Now, the computer will insert a fault.", "The circuit is operating correctly. Now, the computer will insert a fault. External program = SCAN FTR 0 F2 08 Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2180"]}, {"id": "P2210", "text": ["1.  Using a multimeter, measure the DC output voltage of the               regulator from TP7 to TP1. \n     What is the measured voltage?", "1. Using a multimeter, measure the DC output voltage of the regulator from TP7 to TP1. What is the measured voltage??"], "jumps": ["P2200", "P2212", "P2215"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["Your voltage measurement is incorrect.  Ensure you are measuring between TP7 and TP1 on PC130-25 and the multimeter is set up for DC voltage.", "Your voltage measurement is incorrect. Ensure you are measuring between TP7 and TP1 on PC130-25 and the multimeter is set up for DC voltage."], "jumps": []}, {"id": "P2215", "text": ["MEASUREMENT SETUP - Carefully measure the DC output voltage from TP7 to TP1 on PC130-25."], "jumps": []}, {"id": "P2217", "text": ["Your voltage measurement is still incorrect.  You should have measured 0 V.  Ensure your set up is correct.", "Your voltage measurement is still incorrect. You should have measured 0 V. Ensure your set up is correct."], "jumps": ["PutVar"]}, {"id": "P2220", "text": ["An output voltage of 0 V indicates a problem.  Vout should have been approximately 7.6 V.", "An output voltage of 0 V indicates a problem. Vout should have been approximately 7.6 V."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["2.  Using a multimeter, measure the other voltages on the                     elements of Q1.", "2. Using a multimeter, measure the other voltages on the elements of Q1. Eb: TP5 - TP1 = 0 V"], "jumps": ["P2232", "P2220", "P2235"]}, {"id": "P2232", "text": ["You should have measured:\nEc = 20 V\nEb = 0 V", "You should have measured: Ec = 20 V Eb = 0 V"], "jumps": ["P2240", "P2230"]}, {"id": "P2235", "text": ["MEASUREMENT SETUP Carefully measure the voltages Ec - TP4 to TP1. Carefully measure the voltages Eb - TP5 to TP1."], "jumps": []}, {"id": "P2240", "text": ["Q1 will not conduct.  This causes Ee to be 0 V.  Let's find out why.", "Q1 will not conduct. This causes Ee to be 0 V. Let's find out why."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["3.  Using a multimeter, measure the voltages across R1 (TP4 to          TP3) and D1 (TP3 to TP1).  \n     ER1 = 20 V    \n     ED1 = 0 V", "3. Using a multimeter, measure the voltages across R1 (TP4 to TP3) and D1 (TP3 to TP1). ER1 = 20 V ED1 = 0 V"], "jumps": ["P2252", "P2230", "P2255"]}, {"id": "P2252", "text": ["You should have measured:\nER1; 20 V\nED1; 0V", "You should have measured: ER1; 20 V ED1; 0V 1: 0 V"], "jumps": ["P2260", "P2250"]}, {"id": "P2255", "text": ["PC130-25 MEASUREMENT SETUP Carefully measure the voltage across R1 - TP4 to TP3. Carefully measure the voltage across D1 - TP3 to TP1."], "jumps": []}, {"id": "P2260", "text": ["These readings indicate that R1 is open or that D1 is shorted.  Since there are no switches to isolate the component, the computer will isolate R1 and D1.", "These readings indicate that R1 is open or that D1 is shorted. Since there are no switches to isolate the component, the computer will isolate R1 and D1. External program = SCAN FTR 0 C1 00 External program = SCAN FTR 0 C2 00"], "jumps": ["P2250"]}, {"id": "P2270", "text": ["4.  Using a multimeter, measure the resistances of R1 and D1.             Which component is faulted?", "4. Using a multimeter, measure the resistances of R1 and D1. Which component is faulted??"], "jumps": ["P2250"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["You should have measured 1 kW across R1 and 0 W across D1.  D1 should have measured some value of resistance.  This indicates that R1 is good and D1 is shorted.", "You should have measured 1 kW across R1 and 0 W across D1. D1 should have measured some value of resistance. This indicates that R1 is good and D1 is shorted."], "jumps": []}, {"id": "P2280", "text": ["D1 is shorted and places 0 V on the base of Q1 which causes a\n0 V output.  The computer will now replace D1 and return the circuit to normal.", "D1 is shorted and places 0 V on the base of Q1 which causes a 0 V output. The computer will now replace D1 and return the circuit to normal. ternal program = SCAN FTR 0 C12 00 External program = SCAN FTR 0 F1 14"], "jumps": ["P2270"]}, {"id": "P2290", "text": ["5.  Using a multimeter, measure the output voltage between TP7        and TP1.  Notice that the circuit is now operating normally;             Vout is 7.6 V.", "5. Using a multimeter, measure the output voltage between TP7 and TP1. Notice that the circuit is now operating normally; Vout is 7.6 V."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Remember, always check for normal operation after repairing a faulted circuit."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2300"]}, {"id": "P2320", "text": ["2.  Set the Test Console Power OFF.", "2. Set the Test Console Power OFF. OFF...................."], "jumps": ["P2310"]}, {"id": "P2330", "text": ["3.  Disconnect all test equipment.  \n4.  Carefully remove PC130-23 and PC130-25. \n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-23 and PC130-25. 5. Return all equipment to its proper storage area..................."], "jumps": ["P2910", "P2320"]}, {"id": "P13080", "text": ["Notice that D1 is an 8.2 V zener diode.  The output voltage for this regulator is approximately 7.6 V.", "Notice that D1 is an 8.2 V zener diode. The output voltage for this regulator is approximately 7.6 V."], "jumps": ["P13090", "P13060"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["The purpose of this experiment is to demonstrate troubleshooting variable regulator circuits."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "5. Nida Model 480 or 488 Multimeter XXXXXnt"], "jumps": ["P3040", "P3020"]}, {"id": "P3040", "text": ["In this experiment, you will use two PC cards.  One is a rectifier and  "jumps": ["P3060"]}, {"id": "P3090", "text": ["For this experiment, the regulator circuit remains unloaded, S1 and S2 to the OUT position.  Let's start the experiment.", "For this experiment, the regulator circuit remains unloaded, S1 and S2 to the OUT position. Let's start the experiment."], "jumps": ["P3060"]}, {"id": "P3100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P3060"]}, {"id": "P3110", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.  3.  Carefully plug PC130-26 into the Test Console PC2 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. 3. Carefully plug PC130-26 into the Test Console PC2 position.ker switch to ON........................................."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["4.  On PC130-23:  Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6               OUT  This sets up the rectifier for full wave and allows the               output to be connected to the PC130-26 card.", "4. On PC130-23: Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6 OUT This sets up the rectifier for full wave and allows the output to be connected to the PC130-26 card. F1 14", "MEASUREMENT SETUP - Carefully place S1 and S2 to IN. Carefully place S3 to the right. Carefully place S4, S5 and S6 to OUT."], "jumps": ["P3110", "P3125"]}, {"id": "P3130", "text": ["5.  On PC130-26 place S1 and S2 to OUT.  This disconnects the           load from the emitter of Q1.", "5. On PC130-26 place S1 and S2 to OUT. This disconnects the load from the emitter of Q1."], "jumps": ["P3120", "P3135"]}, {"id": "P3135", "text": ["MEASUREMENT SETUP - Carefully place S1 and S2 to the OUT position."], "jumps": []}, {"id": "P3150", "text": ["6.  Set the PC1 AC Power switch to ON.", "6. Set the PC1 AC Power switch to ON......................................"], "jumps": ["P3130"]}, {"id": "P3160", "text": ["7.  Using a multimeter, measure the DC voltage at PC130-26 TP2        with respect to ground (input to regulator card from the                   rectifier card). \n     What is the measured voltage?", "7. Using a multimeter, measure the DC voltage at PC130-26 TP2 with respect to ground (input to regulator card from the rectifier card). What is the measured voltage???"], "jumps": ["P3150", "P3162", "P3165"]}, {"id": "P3161", "text": [], "jumps": []}, {"id": "P3162", "text": ["Your voltage measurement is incorrect.  Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26.  Also, check that switches S1 and S2 are IN, S3 is to the RIGHT, and S4, S5 and S6 are OUT on PC130-23.", "Your voltage measurement is incorrect. Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26. Also, check that switches S1 and S2 are IN, S3 is to the RIGHT, and S4, S5 and S6 are OUT on PC130-23..."], "jumps": []}, {"id": "P3165", "text": ["MEASUREMENT SETUP - Carefully measure the DC voltage at TP2 with respect to the ground."], "jumps": []}, {"id": "P3167", "text": ["Your measurement is still incorrect.  You should have measured approximately 20 VDC.  Make sure your set up is correct and you are measuring PC130-26 TP2.", "Your measurement is still incorrect. You should have measured approximately 20 VDC. Make sure your set up is correct and you are measuring PC130-26 TP2."], "jumps": ["PutVar"]}, {"id": "P3168", "text": ["8.  Adjust PC130-26 R4 for a voltage reading of 8.6 V measured           on the  base of Q1 (TP3 to TP1).", "8. Adjust PC130-26 R4 for a voltage reading of 8.6 V measured on the base of Q1 (TP3 to TP1)."], "jumps": ["P3170", "P3160", "P3169"]}, {"id": "P3169", "text": ["MEASUREMENT SETUP - Adjust R4 for a voltage reading of 8.6 V at TP3 and TP1."], "jumps": []}, {"id": "P3170", "text": ["The experiment is now set up. Let's verify normal voltages on Q1 before inserting a fault."], "jumps": ["P3180", "P3168"]}, {"id": "P3180", "text": ["9.  Using a multimeter, measure the voltages on Q1 at:", "9. Using a multimeter, measure the voltages on Q1 at:.....", "Ec (TP2 to TP1), Input voltage Eb (TP3 to TP1), Zener voltage Ee (TP6 to TP1), Output voltage"], "jumps": ["P3190", "P3170", "P3185"]}, {"id": "P3185", "text": ["MEASUREMENT SETUP Carefully measure the voltage at Ec (TP2 to TP1). Carefully measure the voltage at Eb (TP3 to TP1). Carefully measure the voltage at Ee (TP6 to TP1)."], "jumps": []}, {"id": "P3190", "text": ["You should have measured approximate values of:\nEc = 20 V                    Eb = 8.6 V                    Ee = 8 V", "You should have measured approximate values of: Ec = 20 V Eb = 8.6 V Ee = 8 V"], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["The circuit is operating correctly.  Now, the computer will insert a fault.", "The circuit is operating correctly. Now, the computer will insert a fault. External program = SCAN FTR 0 F2 05 Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3180"]}, {"id": "P3210", "text": ["1.  Using a multimeter, measure the DC output voltage of the               regulator from TP6 to TP1.  \n     What is the measured voltage?", "1. Using a multimeter, measure the DC output voltage of the regulator from TP6 to TP1. What is the measured voltage?"], "jumps": ["P3200", "P3212", "P3215"]}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3212", "text": ["Your voltage measurement is incorrect.  Ensure you are measuring between TP6 and TP1 and the multimeter is set up for DC voltage.", "Your voltage measurement is incorrect. Ensure you are measuring between TP6 and TP1 and the multimeter is set up for DC voltage."], "jumps": []}, {"id": "P3215", "text": ["MEASUREMENT SETUP - Carefully measure the DC output voltage from TP6 to TP1."], "jumps": []}, {"id": "P3217", "text": ["Your voltage measurement is still incorrect.  You should have measured 20 V.  Ensure your set up is correct.", "Your voltage measurement is still incorrect. You should have measured 20 V. Ensure your set up is correct."], "jumps": ["PutVar"]}, {"id": "P3220", "text": ["An output voltage of 20 V indicates a problem.  Vout should have been approximately 8.0 V.", "An output voltage of 20 V indicates a problem. Vout should have been approximately 8.0 V.."], "jumps": ["P3230", "P3210"]}, {"id": "P3230", "text": ["2.  Using a multimeter, measure the voltages on the elements of          Q1.   \n                                           Ec - (TP2 to TP1)   \n                                           Eb - (TP3 to TP1)", "2. Using a multimeter, measure the voltages on the elements of Q1. Ec - (TP2 to TP1) Eb - (TP3 to TP1)"], "jumps": ["P3232", "P3220", "P3235"]}, {"id": "P3232", "text": ["You should have measured:   \n                                                       Ec = 19.4 V   \n                                                       Eb = 20 V", "You should have measured: Ec = 19.4 V Eb = 20 VVV"], "jumps": ["P3240", "P3230"]}, {"id": "P3235", "text": ["MEASUREMENT SETUP - Carefully measure the voltages on the elements of Q1 with the multimeter."], "jumps": []}, {"id": "P3240", "text": ["With 20 V on the base of Q1, Q1 is in saturation.  This causes Ee to be the base voltage less .6 V.  Let's find out why.", "With 20 V on the base of Q1, Q1 is in saturation. This causes Ee to be the base voltage less .6 V. Let's find out why..."], "jumps": ["P3250", "P3230"]}, {"id": "P3250", "text": ["3.  Using a multimeter, measure the voltages across R1 (TP2 to          TP3), Q2 (TP3 to TP5), and D1 (TP5 to TP1).", "3. Using a multimeter, measure the voltages across R1 (TP2 to TP3), Q2 (TP3 to TP5), and D1 (TP5 to TP1)."], "jumps": ["P3252", "P3230", "P3255"]}, {"id": "P3252", "text": ["You should have measured:   \n                                                 ER1 = 0V    \n                                                 EQ2 = 15.3V   \n                                                 ED1 = 4.7V", "You should have measured: ER1 = 0V EQ2 = 15.3V ED1 = 4.7V"], "jumps": ["P3260", "P3250"]}, {"id": "P3255", "text": ["MEASUREMENT SETUP Carefully measure the voltage across R1 (TP2 to TP3). Carefully measure the voltage across Q2 (TP3 to TP5). Carefully measure the voltage across D1 (TP5 to TP1)."], "jumps": []}, {"id": "P3260", "text": ["At first glance, these readings indicate that R1 is shorted.  The applied voltage is dropped across Q2 and D1.", "At first glance, these readings indicate that R1 is shorted. The applied voltage is dropped across Q2 and D1."], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["However, there is another possibility.  Look at the path from the output voltage (20 V) through R2 to the cathode of D1.", "However, there is another possibility. Look at the path from the output voltage (20 V) through R2 to the cathode of D1."], "jumps": ["P3280", "P3250"]}, {"id": "P3280", "text": ["R2 allows current flow to D1.  D1 reacts by dropping 4.7 V, normal operation of a zener diode.", "R2 allows current flow to D1. D1 reacts by dropping 4.7 V, normal operation of a zener diode."], "jumps": ["P3290", "P3250"]}, {"id": "P3290", "text": ["Now, if Q2 were open, you would expect to measure the applied voltage across it with 0 V's across R1 and D1."], "jumps": ["P3300", "P3250"]}, {"id": "P3300", "text": ["If Q2 were open, its voltage drops would equal:    \nQ2 = 15.3V  \nD1 = 4.7V  \nR1 = 0 V", "If Q2 were open, its voltage drops would equal: Q2 = 15.3V D1 = 4.7V R1 = 0 V"], "jumps": ["P3310", "P3250"]}, {"id": "P3310", "text": ["These are the measurements that were made.  The possible faults are R1 shorted or Q2 open.", "These are the measurements that were made. The possible faults are R1 shorted or Q2 open."], "jumps": ["P3320", "P3250"]}, {"id": "P3320", "text": ["There are no switches to isolate the components for resistance.  The computer will isolate R1, Q2 and D1 for you.", "There are no switches to isolate the components for resi imeter, measure the resistances of R1 and D1.             Which component is faulted?", "5. Using a multimeter, measure the resistances of R1 and D1. Which component is faulted?"], "jumps": ["P13250"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["You should have measured 1 kW across R1 and 0 W across D1.  D1 should have measured some value of resistance.  This indicates that R1 is good and D1 is shorted.", "You should have measured 1 kW across R1 and 0 W across D1. D1 should have measured some value of resistance. This indicates that R1 is good and D1 is shorted."], "jumps": []}, {"id": "P13280", "text": ["D1 is shorted and places 0 V on the base of Q1 which causes        a 0 V output.  The computer will now replace D1 and return the      circuit to normal.\n6.  Press Enter to set:  PC1 AC Power Switch - ON", "D1 is shorted and places 0 V on the base of Q1 which causes a 0 V output. The computer will now replace D1 and return the circuit to normal. 6. Press Enter to set: PC1 AC Power Switch - ON"], "jumps": ["P13270"]}, {"id": "P13290", "text": ["7.  Using a multimeter, measure the output voltage between TP7        and TP1.  Notice that the circuit is now operating normally.             Vout is 7.6 V.", "7. Using a multimeter, measure the output voltage between TP7 and TP1. Notice that the circuit is now operating normally. Vout is 7.6 V."], "jumps": ["P13300"]}, {"id": "P13300", "text": ["Remember, always check for normal operation after repairing a faulted circuit."], "jumps": ["P13290"]}, {"id": "P13320", "text": ["1.  Set the Test Console Power OFF.", "1. Set the Test Console Power OFF. OFF.FF................................."], "jumps": []}, {"id": "P13330", "text": ["2.  Disconnect all test equipment.  \n3.  Carefully remove PC130-23 and PC130-25. \n4.  Return all equipment to its proper storage area.", "2. Disconnect all test equipment. 3. Carefully remove PC130-23 and PC130-25. 4. Return all equipment to its proper storage area..... ition."], "jumps": ["P14070", "P14050"]}, {"id": "P14070", "text": ["Compare the card with the schematic shown."], "jumps": ["P14080", "P14060"]}, {"id": "P14080", "text": ["Notice that D1 is a 4.7 V zener diode.  The output voltage for this regulator is approximately 7.6 V.", "Notice that D1 is a 4.7 V zener diode. The output voltage for this regulator is approximately 7.6 V."], "jumps": ["P14090", "P14060"]}, {"id": "P14090", "text": ["For this experiment, the regulator circuit remains unloaded, S1 and S2 to the OUT position.  Let's start the experiment.", "For this experiment, the regulator circuit remains unloaded, S1 and S2 to the OUT position. Let's start the experiment."], "jumps": ["P14100", "P14060"]}, {"id": "P14100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14060"]}, {"id": "P14110", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.  3.  Carefully plug PC130-26 into the Test Console PC2 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. 3. Carefully plug PC130-26 into the Test Console PC2 position."], "jumps": ["P14120"]}, {"id": "P14120", "text": ["4.  On PC130-23: Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6 OUT       This sets up the rectifier for full wave and allows the output to       be connected to the PC130-26 card.", "4.  On PC130-23: Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6 OUT       This sets up the rectifier for full wave and allows the output to       be connected to the PC130-26 card.", "4. On PC130-23: Set S1 and S2 IN, S3 RIGHT, S4, S5 and S6 OUT This sets up the rectifier for full wave and allows the output to be connected to the PC130-26 card.", "MEASUREMENT SETUP - Carefully place S1 and S2 to IN. Carefully place S3 to the right. Carefully place S4, S5 and S6 to OUT."], "jumps": ["P14130", "P14110", "P14125"]}, {"id": "P14150", "text": ["6.  Press Enter to set: PC1 AC Power Switch - ON", "6. Press Enter to set: PC1 AC Power Switch - ON..........................."], "jumps": ["P14130"]}, {"id": "P14135", "text": ["MEASUREMENT SETUP - Carefully place S1 and S2 to the OUT position."], "jumps": []}, {"id": "P10210", "text": ["Which component of the following is usually faulty in a voltage regulator circuit? X XXXX", "base bias resistorss d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "load resistorsice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "zener diodeshoice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P14168", "text": ["8.  Adjust PC130-26 R4 for a voltage reading of 8.6 V measured           on the base of Q1 (TP3 to TP1).", "8. Adjust PC130-26 R4 for a voltage reading of 8.6 V measured on the base of Q1 (TP3 to TP1)."], "jumps": ["P14170", "P14160", "P14169"]}, {"id": "P14180", "text": ["9.  Using a multimeter, measure the voltages on Q1 at:", "Your voltage measurement is incorrect.  Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26.  Also, check that switches S1 and S2 are IN, S3 is to the RIGHT, and S4, S5 and S6 are OUT on PC130-23.", "9. Using a multimeter, measure the voltages on Q1 at:.....", "Ec (TP2 to TP1), Input voltage Eb (TP3 to TP1), Zener voltage Ee (TP6 to TP1), Output voltage", "Your voltage measurement is incorrect. Ensure that you are using the multimeter correctly and that you are measuring TP2 on PC130-26. Also, check that switches S1 and S2 are IN, S3 is to the RIGHT, and S4, S5 and S6 are OUT on PC130-23..."], "jumps": ["P14190", "P14170", "P14185"]}, {"id": "P14165", "text": ["MEASUREMENT SETUP - Carefully measure the DC voltage at TP2 with respect to the ground."], "jumps": []}, {"id": "P14167", "text": ["Your measurement is still incorrect.  You should have measured approximately 20 VDC.  Make sure your set up is correct and you are measuring PC130-26 TP2.", "Your measurement is still incorrect. You should have measured approximately 20 VDC. Make sure your set up is correct and you are measuring PC130-26 TP2."], "jumps": ["PutVar"]}, {"id": "P14190", "text": ["You should have measured approximate values of:  \nEc = 20 V \nEb = 8.6 V   \nEe = 8 V", "You should have measured approximate values of: Ec = 20 V Eb = 8.6 V Ee = 8 V"], "jumps": ["P14200", "P14180"]}, {"id": "P14169", "text": ["MEASUREMENT SETUP - Adjust R4 for a voltage reading of 8.6 V at TP3 and TP1."], "jumps": []}, {"id": "P14910", "text": ["This completes the experiment on VARIABLE REGULATOR TROUBLESHOOTING."], "jumps": ["P3001", "P14390"]}, {"id": "P14185", "text": ["MEASUREMENT SETUP Carefully measure the voltage at Ec (TP2 to TP1). Carefully measure the voltage at Eb (TP3 to TP1). Carefully measure the voltage at Ee (TP6 to TP1)."], "jumps": []}, {"id": "P14211", "text": [], "jumps": []}, {"id": "P14200", "text": ["The circuit is operating correctly.  Now, the computer will insert a fault.", "The circuit is operating correctly. Now, the computer will insert a fault..."], "jumps": ["P14180"]}, {"id": "P14210", "text": ["1.  Using a multimeter, measure the DC output voltage of the               regulator from TP6 to TP1. \n     What is the measured voltage?", "1. Using a multimeter, measure the DC output voltage of the regulator from TP6 to TP1. What is the measured voltage?"], "jumps": ["P14200", "P14215", "P14212"]}, {"id": "P14211", "text": [], "jumps": []}, {"id": "P14212", "text": ["Your voltage measurement is incorrect.  Ensure you are measuring between TP6 and TP1 and the multimeter is set up for DC voltage.", "Your voltage measurement is incorrect. Ensure you are measuring between TP6 and TP1 and the multimeter is set up for DC voltage."], "jumps": []}, {"id": "P14215", "text": ["MEASUREMENT SETUP - Carefully measure the DC output voltage from TP6 to TP1."], "jumps": []}, {"id": "P14217", "text": ["Your voltage measurement is still incorrect.  You should have measured 20 V.  Ensure your set up is correct.", "Your voltage measurement is still incorrect. You should have measured 20 V. Ensure your set up is correct."], "jumps": ["PutVar"]}, {"id": "P14220", "text": ["An output voltage of 20 V indicates a problem.   Vout should have been approximately 8.0 V.", "An output voltage of 20 V indicates a problem. Vout should have been approximately 8.0 V."], "jumps": ["P14230", "P14210"]}, {"id": "P14230", "text": ["2.  Using a multimeter, measure the voltages on the elements of         Q1.  \n     Ec - (TP2 to TP1)  \n     Eb - (TP3 to TP1)", "2. Using a multimeter, measure the voltages on the elements of Q1. Ec - (TP2 to TP1) Eb - (TP3 to TP1)"], "jumps": ["P14232", "P14220", "P14235"]}, {"id": "P14232", "text": ["You should have measured:   \nEc = 19.4 V   \nEb = 20 V", "You should have measured: Ec = 19.4 V Eb = 20 VVV"], "jumps": ["P14240", "P14230"]}, {"id": "P14235", "text": ["MEASUREMENT SETUP - Carefully measure the voltages on the elements of Q1 with the multimeter."], "jumps": []}, {"id": "P14240", "text": ["With 20 V on the base of Q1, Q1 is in saturation.  This causes Ee to be the base voltage less .6 V.  Let's find out why.", "With 20 V on the base of Q1, Q1 is in saturation. This causes Ee to be the base voltage less .6 V. Let's find out why..."], "jumps": ["P14250", "P14230"]}, {"id": "P14250", "text": ["3.  Using a multimeter, measure the voltages across R1 (TP2 to          TP3), Q2 (TP3 to TP5), and D1 (TP5 to TP1).", "3. Using a multimeter, measure the voltages across R1 (TP2 to TP3), Q2 (TP3 to TP5), and D1 (TP5 to TP1)."], "jumps": ["P14252", "P14230", "P14255"]}, {"id": "P14252", "text": ["You should have measured:   \nER1 = 0 V  \nEQ2 = 15.3 V    \nED1 = 4.7 V", "You should have measured: ER1 = 0 V EQ2 = 15.3 V ED1 = 4.7 V"], "jumps": ["P14260", "P14250"]}, {"id": "P14255", "text": ["MEASUREMENT SETUP Carefully measure the voltage across R1 (TP2 to TP3). Carefully measure the voltage across Q2 (TP3 to TP5). Carefully measure the voltage across D1 (TP5 to TP1)."], "jumps": []}, {"id": "P14260", "text": ["At first glance, these readings indicate that R1 is shorted.  The applied voltage is dropped across Q2 and D1.", "At first glance, these readings indicate that R1 is shorted. The applied voltage is dropped across Q2 and D1."], "jumps": ["P14270", "P14250"]}, {"id": "P14270", "text": ["However, there is another possibility.  Look at the path from the output voltage (20 V) through R2 to the cathode of D1.", "However, there is another possibility. Look at the path from the output voltage (20 V) through R2 to the cathode of D1.."], "jumps": ["P14280", "P14250"]}, {"id": "P14280", "text": ["R2 allows current flow to D1.  D1 reacts by dropping 4.7 V, normal operation of a zener diode.", "R2 allows current flow to D1. D1 reacts by dropping 4.7 V, normal operation of a zener diode."], "jumps": ["P14290", "P14250"]}, {"id": "P14290", "text": ["Now, if Q2 were open, you would expect to measure the applied voltage across it with 0 V's across R1 and D1."], "jumps": ["P14300", "P14250"]}, {"id": "P14300", "text": ["If Q2 were open, its voltage drops would equal:  \nQ2 = 15.3 V    \nD1 = 4.7 V    \nR1 = 0 V", "If Q2 were open, its voltage drops would equal: Q2 = 15.3 V D1 = 4.7 V R1 = 0 VVV"], "jumps": ["P14310", "P14250"]}, {"id": "P14310", "text": ["These are the measurements that were made.  The possible faults are R1 shorted or Q2 open.", "These are the measurements that were made. The possible faults are R1 shorted or Q2 open."], "jumps": ["P14320", "P14250"]}, {"id": "P14320", "text": ["There are no switches to isolate the components for                         resistance.  The computer will isolate R1, Q2 and D1 for you.\n4.  Press Enter to set:  PC1 AC Power Switch - OFF", "There are no switches to isolate the components for resistance. The computer will isolate R1, Q2 and D1 for you. 4. Press Enter to set: PC1 AC Power Switch - OFF"], "jumps": ["P14250"]}, {"id": "P14330", "text": ["5.  Using a multimeter, measure the resistance of R1.  Which                component is faulted?", "5. Using a multimeter, measure the resistance of R1. Which component is faulted?"], "jumps": []}, {"id": "P14331", "text": [], "jumps": []}, {"id": "P14332", "text": ["You should have measured 2 kW across R1.  This indicates that R1 is not shorted, so Q2 must be open.", "You should have measured 2 kW across R1. This indicates that R1 is not shorted, so Q2 must be open."], "jumps": []}, {"id": "P14340", "text": ["The computer will now replace Q2 and return the circuit to              normal. \n6.  Press Enter to set:  PC1 AC Power Switch - ON", "The computer will now replace Q2 and return the circuit to normal. 6. Press Enter to set: PC1 AC Power Switch - ON"], "jumps": ["P14330"]}, {"id": "P14350", "text": ["7.  Using a multimeter, measure the output voltage between TP6        and TP1.  Notice that the circuit is now operating normally.             Vout is approximately 8.0 V.", "7. Using a multimeter, measure the output voltage between TP6 and TP1. Notice that the circuit is now operating normally. Vout is approximately 8.0 V."], "jumps": ["P14360"]}, {"id": "P14360", "text": ["Remember, always check for normal operation after repairing a faulted circuit."], "jumps": ["P14350"]}, {"id": "P14380", "text": ["1.  Set the Test Console Power OFF.", "1. Set the Test Console Power OFF. OFF.FF................................."], "jumps": []}, {"id": "P14390", "text": ["2.  Disconnect all test equipment.  \n3.  Carefully remove PC130-23 and PC130-26. \n4.  Return all equipment to its proper storage let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
