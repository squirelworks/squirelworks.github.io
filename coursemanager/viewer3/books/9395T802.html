."], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2920"]}, {"id": "P2950", "text": ["4.  The Clock and Reset Circuits are important to the                               microprocessor operation.  The clock provides a reference             signal for all system operations.  The reset circuit is used to           completely restart the system.", "2.  The data bus of the 68000 has 16 pins and is bi-directional.              Data is formatted in three sizes: 8 bit (byte), 16 bit (word) and         32 bit (longword).  When accessing a 32 bit longword, the               microprocessor must read twice through the 16 bit data bus.", "1.  The address bus of the 68000 has 23 pins, is unidirectional            and can access 16 million locations.  The address bus is used       in accessing I/O and memory locations and for used vectored        interrupt processing.", "4. The Clock and Reset Circuits are important to the microprocessor operation. The clock provides a reference signal for all system operations. The reset circuit is used to completely restart the system.", "3. The control bus pins include: Address Strobe, Read/Write, Upper and Lower Memory Strobes, Data Transfer Acknowledge, Bus Request, Bus Grant, Bus Grant Acknowledge, Interrupt Control, Bus Error, Reset, Halt, Enable, Valid Peripheral Address, Valid Memory Address, Processor Function Codes, Clock and Power.", "2. The data bus of the 68000 has 16 pins and is bi-directional. Data is formatted in three sizes: 8 bit (byte), 16 bit (word) and 32 bit (longword). When accessing a 32 bit longword, the microprocessor must read twice through the 16 bit data bus.", "1. The address bus of the 68000 has 23 pins, is unidirectional and can access 16 million locations. The address bus is used in accessing I/O and memory locations and for used vectored interrupt processing."], "jumps": ["P2999", "P2920", "P2950", "P2940", "P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on 68000 THEORY OF OPERATION.", "This completes the information on 68000 THEORY OF OPERATION.."], "jumps": ["P2410"]}, {"id": "P2413", "text": ["The Data Transfer Acknowledge (DTACK) tells the processor that either the data on the bus has been read or that it has been written.", "The Data Transfer Acknowledge (DTACK) tells the processor that either the data on the bus has been read or that it has been written.r that it has been written."], "jumps": []}, {"id": "P2412", "text": ["The address strobe (AS) signal is used to inform other devices that the information on the address bus is valid.", "The address strobe (AS) signal is used to inform other devices that the information on the address bus is valid.n the address bus is valid."], "jumps": []}, {"id": "P2411", "text": [], "jumps": []}, {"id": "P2410", "text": ["On which control bus pin would there be an uninterrupted TTL square wave at or below the frequency printed on the microprocessor?"], "jumps": ["P2400"]}, {"id": "P2403", "text": ["Your answers are incorrect.  You should have answered:", "Your answers are incorrect. You should have answered:red 5.0mA."], "jumps": ["P2410", "P2400"]}, {"id": "P2400", "text": ["To cause the CPU to stop what it's doing, perform a different function, and then return to the previous operation, what function(s) in the control bus is (are) used?"], "jumps": []}, {"id": "P2390", "text": ["The numerous and broad functioned nature of the 68000's control pins make it a versatile and powerful processor.  In the next portion of  this lesson you will be conducting an experiment for a closer and hands-on look at how the 68000 operates.", "The numerous and broad functioned nature of the 68000's control pins make it a versatile and powerful processor. In the next portion of this lesson you will be conducting an experiment for a closer and hands-on look at how the 68000 operates."], "jumps": ["P2400", "P2360"]}, {"id": "P2380", "text": ["Ground (GND): There are four ground connectors that require power source ground.  As with the Vcc connections, many ground connections are needed to provide ground throughout the CPU.", "Ground (GND): There are four ground connectors that require power source ground. As with the Vcc connections, many ground connections are needed to provide ground throughout the CPU."], "jumps": ["P2390", "P2360"]}, {"id": "P2370", "text": ["Power Source (Vcc): There are two power source connectors that require a constant +5 volt source. Since there is so much internal circuitry within the microprocessor, multiple power inputs are required.", "Clock (C): The clock signal is an input to the CPU which is used to synchronize all operations within the microprocessor.  This input must be an uninterrupted TTL square wave at a frequency equal to or below the one indicated on the microprocessor.", "Clock (C): The clock signal is an input to the CPU which is used to synchronize all operations within the microprocessor. This input must be an uninterrupted TTL square wave at a frequency equal to or below the one indicated on the microprocessor."], "jumps": ["P2380", "P2360", "P2370", "P2350"]}, {"id": "P2350", "text": ["The table below illustrates the Processor Function Code meanings for each output condition.", "00 1 0 0 0 0 00 00 1 0 1 0 1 1 0 1", "FC2 FC0 UT C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "FUNCTION CODE N LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "FC1 FC0 UT C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "FC0 FC0 UT C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16"], "jumps": ["P2360", "P2290"]}, {"id": "P2340", "text": ["Processor Function Code (FC0, FC1, FC2): These signals are outputs that indicate the mode and addressing space currently being used.  These codes are valid when the address strobe signal is active (low).", "Processor Function Code (FC0, FC1, FC2): These signals are outputs that indicate the mode and addressing space currently being used. These codes are valid when the address strobe signal is active (low)."], "jumps": ["P2350", "P2290"]}, {"id": "P2330", "text": ["Valid Peripheral Address (VPA): The VPA signal is an input to the microprocessor from devices using the enable signal.  This signal tells the microprocessor that the address is valid for some given device.  The VPA signal is also used with the interrupt signals for different types of interrupts.", "Valid Peripheral Address (VPA): The VPA signal is an input to the microprocessor from devices using the enable signal. This signal tells the microprocessor that the address is valid for some given device. The VPA signal is also used with the interrupt signals for different types of interrupts."], "jumps": ["P2340", "P2290"]}, {"id": "P2320", "text": ["Enable (E): The enable signal is used as a clocking signal for certain peripheral devices specifically designed to be used with the 68000.  This signal is active high.", "Enable (E): The enable signal is used as a clocking signal for certain peripheral devices specifically designed to be used with the 68000. This signal is active high."], "jumps": ["P2330", "P2290"]}, {"id": "P2310", "text": ["Halt (HALT): The halt signal causes all operations within the microprocessor to stop after the current cycle, set all tri-state devices to high impedance output (no connection to bus) and set all control signals to inactive.  This signal is bi-directional, active low, and used with the reset signal to restart the system.", "Halt (HALT): The halt signal causes all operations within the microprocessor to stop after the current cycle, set all tri-state devices to high impedance output (no connection to bus) and set all control signals to inactive. This signal is bi-directional, active low, and used with the reset signal to restart the system."], "jumps": ["P2320", "P2290"]}, {"id": "P2300", "text": ["A hardware reset requires a low input to this pin.  A software reset will output a low to this pin which can be sent to other devices to reset them as well.  This signal is active low.", "Reset (RESET): The reset signal is used in conjunction with the halt signal to reset the entire microprocessor system.  Used by itself, this signal can reset certain sections of the processor.  The reset signal is bi-directional; you can reset the system with hardware or software.", "A hardware reset requires a low input to this pin. A software reset will output a low to this pin which can be sent to other devices to reset them as well. This signal is active low.", "Reset (RESET): The reset signal is used in conjunction with the halt signal to reset the entire microprocessor system. Used by itself, this signal can reset certain sections of the processor. The reset signal is bi-directional; you can reset the system with hardware or software."], "jumps": ["P2310", "P2290", "P2300", "P2270"]}, {"id": "P2280", "text": ["The actual error conditions sent to the microprocessor will be system specific.  Additional hardware and software could be used to differentiate between error conditions.  This signal is active low.", "Bus Error (BERR): The bus error signal is used to allow other devices to inform the CPU that an error has occurred externally from the CPU.  These types of errors could be:\n1.  Device not responding or\n2.  Illegal instruction call to devices.", "The actual error conditions sent to the microprocessor will be system specific. Additional hardware and software could be used to differentiate between error conditions. This signal is active low.", "Bus Error (BERR): The bus error signal is used to allow other devices to inform the CPU that an error has occurred externally from the CPU. These types of errors could be: 1. Device not responding or 2. Illegal instruction call to devices."], "jumps": ["P2290", "P2270", "P2280", "P2260"]}, {"id": "P2260", "text": ["The encoder truth table shows X's where the input can either be a one or zero and the same condition will occur.  If line 4 and line 1 were both sending an interrupt signal to the encoder, line 4 would be encoded first because it has a higher priority.", "The encoder truth table shows X's where the input can either be a one or zero and the same condition will occur. If line 4 and line 1 were both sending an interrupt signal to the encoder, line 4 would be encoded first because it has a higher priority. INT is the interrupt being requested X means either 1 or 0...", "A B C D E F G IPL2 IPL1 IPL0 INT 1 0 1 0 1 1 0 1", "INTERRUPT REQUEST INPUT C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "ENCODED INPUT N LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "INT is the interrupt being requested. X means either 1 or 0."], "jumps": ["P2270", "P2230"]}, {"id": "P2250", "text": ["Encoders are normally designed with a priority scheme so that if  more than one interrupt request is made at a time, the encoder knows which interrupt to process first.", "Encoders are normally designed with a priority scheme so that if more than one interrupt request is made at a time, the encoder knows which interrupt to process first."], "jumps": ["P2260", "P2230"]}, {"id": "P2240", "text": ["All ones input to the encoder outputs a binary seven (111).  If any of the seven interrupt lines goes low, it causes one of the following outputs to be sent to the interrupt control lines: 110, 101, 100, 011, 010, 001, or 000.  Each of these values represent a different interrupt.", "All ones input to the encoder outputs a binary seven (111). If any of the seven interrupt lines goes low, it causes one of the following outputs to be sent to the interrupt control lines: 110, 101, 100, 011, 010, 001, or 000. Each of these values represent a different interrupt."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["The three interrupt control lines allow seven separate interrupts and one condition indicating no interrupts.  An eight to three line encoder is used to generate each of the interrupt inputs.  The        encoder's output has three lines, but eight possible output conditions: 000 to 111.", "The three interrupt control lines allow seven separate interrupts and one condition indicating no interrupts. An eight to three line encoder is used to generate each of the interrupt inputs. The encoder's output has three lines, but eight possible output conditions: 000 to 111."], "jumps": ["P2240", "P2210"]}, {"id": "P2220", "text": ["Suppose you are running a program on a computer and you move the mouse.  An interrupt request is generated and sent to the processor.  The processor identifies the new position of the mouse, and then returns to the program you are using.", "Interrupt Control (IPL0), IPL1, IPL2): Interrupts are signals that tell a processor to stop one program, execute another and then return to where it left off in the original program.  An example of a device using an interrupt is a mouse.", "Suppose you are running a program on a computer and you move the mouse. An interrupt request is generated and sent to the processor. The processor identifies the new position of the mouse, and then returns to the program you are using.", "Interrupt Control (IPL0), IPL1, IPL2): Interrupts are signals that tell a processor to stop one program, execute another and then return to where it left off in the original program. An example of a device using an interrupt is a mouse."], "jumps": ["P2230", "P2210", "P2220", "P2170"]}, {"id": "P2200", "text": ["Bus Grant Acknowledge (BGACK): This signal from the requesting device informs the microprocessor that it has taken control of the system.  The processor will now prevent other devices from taking over the system.  This signal is active low.", "Bus Grant Acknowledge (BGACK): This signal from the requesting device informs the microprocessor that it has taken control of the system. The processor will now prevent other devices from taking over the system. This signal is active low."], "jumps": ["P2210", "P2170"]}, {"id": "P2190", "text": ["Bus Grant (BG): The bus grant signal is generated by the processor in response to the bus request signal.  It informs the requesting device that it can take control of the system at the end of the processors current cycle.  This signal is active low.", "Bus Grant (BG): The bus grant signal is generated by the processor in response to the bus request signal. It informs the requesting device that it can take control of the system at the end of the processors current cycle. This signal is active low."], "jumps": ["P2200", "P2170"]}, {"id": "P2180", "text": ["Bus Request (BR): The bus request signal is used to allow other devices to take control of the address, data, and control buses.  This signal asks the microprocessor for permission to take over the system.  This signal is active low.", "Bus Request (BR): The bus request signal is used to allow other devices to take control of the address, data, and control buses. This signal asks the microprocessor for permission to take over the system. This signal is active low.", "Data Transfer Acknowledge (DTACK): This input to the processor is from devices attached to the data bus. The signal tells the processor that either the data on the bus has been read or that it has been written. This prevents incorrect data from being transferred to or from the processor. This signal is active low."], "jumps": ["P2190", "P2170", "P2180", "P2160"]}, {"id": "P2160", "text": ["The UDS is for D8-D15 while the LDS is for lines D0-D7. Remember,  these signals are active low.  A low on both lines would indicate reading or writing all 16 bits.  The table below illustrates which pin settings produce what type of valid data.", "The UDS is for D8-D15 while the LDS is for lines D0-D7. Remember, these signals are active low. A low on both lines would indicate reading or writing all 16 bits. The table below illustrates which pin settings produce what type of valid data.", "1 1 1 - - 1 1 0 - - 1 0 1 - READ D0-D7 1 0 0 - WRITE D0-D7 0 1 1 READ D8-D15 - 0 1 0 WRITE D8-D15 - 0 0 1 READ D0-D15 0 0 0 WRITE D0-D15", "UDS NTIFICATION LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "LDS NTIFICATION LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "R / W IFICATION LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "D8-D15 FICATION LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16", "D0-D7 IFICATION LABELS C68000P8 MC68000R8 MC68000C8 MC68000FN10 MC68000L10 MC68000P10 MC68000R10 MC68000C10 MC68000FN12 MC68000L12 MC68000P12 MC68000R12 MC68000C12 MC68000FN16 MC68000L16 MC68000P16 MC68000R16 MC68000C16"], "jumps": ["P2170", "P2110"]}, {"id": "P2150", "text": ["Upper and Lower Data Strobes (UDS, LDS): These strobes are used with the read/write signal when a data transfer is being performed.  The 16 data lines from the processor are split into two groups of eight and sent to different memory chips.  The upper and lower data strobes indicate which bits are being read.", "Upper and Lower Data Strobes (UDS, LDS): These strobes are used with the read/write signal when a data transfer is being performed. The 16 data lines from the processor are split into two groups of eight and sent to different memory chips. The upper and lower data strobes indicate which bits are being read."], "jumps": ["P2160", "P2110"]}, {"id": "P2140", "text": ["Read/Write (R/W): The read/write signal indicates to devices the type of data transfer being performed in the current cycle.  A high level on this pin means the device is reading data, while a low       indicates a write operation.", "Read/Write (R/W): The read/write signal indicates to devices the type of data transfer being performed in the current cycle. A high level on this pin means the device is reading data, while a low indicates a write operation."], "jumps": ["P2150", "P2110"]}, {"id": "P2130", "text": ["This signal is tri-stated.  The line above the \"AS\" indicates that the condition is true if the signal is low.  A high signal on this line indicates an invalid address.  This low condition is referred to as an active low pin.  Active low pins are common in any microprocessor.", "This signal is tri-stated. The line above the \"AS\" indicates that the condition is true if the signal is low. A high signal on this line indicates an invalid address. This low condition is referred to as an active low pin. Active low pins are common in any microprocessor."], "jumps": ["P2140", "P2110"]}, {"id": "P2120", "text": ["Address Strobe (AS): The address strobe signal is used to inform other devices that the information on the address bus is valid.  This ensures that devices don't attempt to read an address before the CPU has installed a complete address on the bus.", "The control bus consists of 20 pins (27 if you include power, ground and the system clock) used to regulate when things occur in the CPU.  Let's examine each pin and its function.  NOTE: Pin 18 and 31 have no connection and so are not                               included in the control bus.", "Address Strobe (AS): The address strobe signal is used to inform other devices that the information on the address bus is valid. This ensures that devices don't attempt to read an address before the CPU has installed a complete address on the bus.", "The control bus consists of 20 pins (27 if you include power, ground and the system clock) used to regulate when things occur in the CPU. Let's examine each pin and its function. NOTE: Pin 18 and 31 have no connection and so are not included in the control bus."], "jumps": ["P2130", "P2110", "P2120", "P2070"]}, {"id": "P2100", "text": ["The 68000's longword capability essentially makes it a 32-bit processor.  Data transfer is regulated by signals from the control bus and is asynchronous.  This means that the communicating device does not operate on the same clock signal that the CPU is operating on.", "The 68000's longword capability essentially makes it a 32-bit processor. Data transfer is regulated by signals from the control bus and is asynchronous. This means that the communicating device does not operate on the same clock signal that the CPU is operating on."], "jumps": ["P2110", "P2070"]}, {"id": "P2090", "text": ["The data bus works in conjunction with the address bus to send or receive data to memory or I/O.  If byte size data (8 bits) is accessed, it will be read from either D0-D7 or D8-D15, not both.  If word data (16 bits) is accessed, data will be read from D0-D15.   Longwords require two reads of D0-D15.", "The data bus works in conjunction with the address bus to send or receive data to memory or I/O. If byte size data (8 bits) is accessed, it will be read from either D0-D7 or D8-D15, not both. If word data (16 bits) is accessed, data will be read from D0-D15. Longwords require two reads of D0-D15."], "jumps": ["P2100", "P2070"]}, {"id": "P2080", "text": ["A clear way to visualize the difference between the two buses is that you can take information (read) from the address bus, but you cannot send information (write) to it.  The data bus, conversely, allows information to be written to and read from it.", "The data bus in the 68000 occupies pins 58 through 68 and 1 through 5.  They are assigned as D0 through D15.  While the address bus is uni-directional, the data bus is bi-directional.  This allows the data bus to simultaneously carry a composite signal from ROM, RAM, the keyboard and other I/O devices.", "A clear way to visualize the difference between the two buses is that you can take information (read) from the address bus, but you cannot send information (write) to it. The data bus, conversely, allows information to be written to and read from it.", "The data bus in the 68000 occupies pins 58 through 68 and 1 through 5. They are assigned as D0 through D15. While the address bus is uni-directional, the data bus is bi-directional. This allows the data bus to simultaneously carry a composite signal from ROM, RAM, the keyboard and other I/O devices."], "jumps": ["P2090", "P2070", "P2080", "P2020"]}, {"id": "P2060", "text": ["The address lines allow the 68000 to connect up to 16 megabytes of memory to the system.  In applications where more memory is needed, other techniques and additional IC's can be used to increase this amount.", "The address lines allow the 68000 to connect up to 16 megabytes of memory to the system. In applications where more memory is needed, other techniques and additional IC's can be used to increase this amount."], "jumps": ["P2070", "P2020"]}, {"id": "P2050", "text": ["The address bus is also tri-stated so, if needed, the 68000 can remove its signals from the bus and allow another processor to control the system signals.  Tri-state devices use the third logic    state (high impedance) to allow multiple devices to use the same line.", "The address bus is also tri-stated so, if needed, the 68000 can remove its signals from the bus and allow another processor to control the system signals. Tri-state devices use the third logic state (high impedance) to allow multiple devices to use the same line."], "jumps": ["P2060", "P2020"]}, {"id": "P2040", "text": ["Address line A0 is used internally and determines the output of certain control bus pins.  You may recall that address buses are unidirectional and that all addresses generate from the CPU and go to other devices.", "Aside from the power and ground pins of the microprocessor, all the other pins can be grouped into address, data, and control buses.  The buses and the pins assigned to them are at least partially sequential.  For example, the address bus uses pins 32 through 55 (A1-A23).  This makes troubleshooting a little easier.", "Here is the IC's pin configuration for the data bus.", "Here is the IC's pin configuration for the control bus.", "Here is the IC's pin configuration for the address bus.", "Address line A0 is used internally and determines the output of certain control bus pins. You may recall that address buses are unidirectional and that all addresses generate from the CPU and go to other devices.", "Aside from the power and ground pins of the microprocessor, all the other pins can be grouped into address, data, and control buses. The buses and the pins assigned to them are at least partially sequential. For example, the address bus uses pins 32 through 55 (A1-A23). This makes troubleshooting a little easier."], "jumps": ["P2050", "P2020", "P2040"]}, {"id": "P2020", "text": [" cs.", "IC identification is extremely important; without it, repairs and ordering replacement parts would be nearly impossible. It would be like a resistor without a color code, or troubleshooting a completely unknown piece of equipment without schematics."], "jumps": ["P1030", "P1001"]}, {"id": "P1001", "text": ["68000 MICROPROCESSOR PACKAGINGGGGGGGGGGG"], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P430", "text": ["Some applications are so environmentally demanding that using an inappropriate IC may very well destroy it.  In others, it may not work at all.  With this in mind it is easy to understand the          necessity of type identification.", "Let's begin the lesson on THE 68000 MICROPROCESSOR........................", "Some applications are so environmentally demanding that using an inappropriate IC may very well destroy it. In others, it may not work at all. With this in mind it is easy to understand the necessity of type identification."], "jumps": ["P420", "P430"]}, {"id": "P410", "text": ["However, it is important to be able to recognize the 68000 in all the various forms that you may encounter.  These different types often dictate the application that the microprocessor is best suited for.", "This lesson will provide you with an in-depth examination of the 68000 CPU operations, including the bus network and control signals.", "This lesson will provide you with an in-depth examination of the 68000 CPU operations, including the bus network and control signals.", "However, it is important to be able to recognize the 68000 in all the various forms that you may encounter. These different types often dictate the application that the microprocessor is best suited for."], "jumps": ["P420", "P400", "P410", "P300", "P"]}, {"id": "P343", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P300", "text" let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
