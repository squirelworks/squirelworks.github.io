const book = {"title": "93953505", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CRYSTAL CONTROLLED OSCILLATOR OPERATIONasdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Measure the input and output waveforms of a crystal oscillator. w Recognize normal operation of a crystal oscillator.....................", "w Describe characteristics of a quartz crystal. w Identify and describe crystal oscillator circuits. w Identify the purpose of individual components in a crystal oscillator."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the crystal oscillator."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Crystal oscillators change the DC operating voltage to a sinewave AC output."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Like the LC and RC oscillators, crystal oscillators use an amplifier with a feedback circuit."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The crystal oscillator uses a  new component called a crystal to determine frequency.", "The crystal oscillator uses a new component called a crystal to determine frequency."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on CRYSTAL CONTROLLED OSCILLATOR OPERATION..........."], "jumps": ["P400"]}, {"id": "P13110", "text": ["5.  Press Enter to set: PC2 DC Power Switch - ON\n     The experiment is now set up.  Let's check this crystal                     oscillator for normal operation.", "5. Press Enter to set: PC2 DC Power Switch - ON The experiment is now set up. Let's check this crystal oscillator for normal operation.."], "jumps": []}, {"id": "P13180", "text": ["Compare the oscilloscope measurement with the frequency counter measurement.", "Enter the measured value. \nRound your answer to one decimal place.", "Compare the oscilloscope measurement with the frequency counter measurement......", "Oscilloscope Value Is the oscillator functioning correctly?", "Enter the measured value. Round your answer to one decimal place.wer (5) in a variable.able.le."], "jumps": ["P13190", "P13170"]}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Crystal oscillators use a component called a crystal (XTAL)."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The crystals of certain materials, such as quartz, have natural oscillation frequencies."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A rectangular slab of crystal is cut and placed between two metal plates to form a crystal oscillator."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Crystals are useful because they exhibit the piezoelectric effect. That is, they vibrate when voltage is applied and they produce AC voltage at the output.", "Crystals are useful because they exhibit the piezoelectric effect. That is, they vibrate when voltage is applied and they produce AC voltage at the output.."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["The frequency of the vibrations is equal to the frequency of the AC voltage.  For our discussion, this is the resonant frequency.", "The frequency of the vibrations is equal to the frequency of the AC voltage. For our discussion, this is the resonant frequency."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["the cut of crystal (k) and the thickness (t) of crystal slab.", "The resonant frequency of a crystal oscillator is determined by the cut of crystal (k) and the thickness (t) of crystal slab."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["The constant, K, depends on different piezoelectric properties of the crystal."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Fortunately, you do not have to calculate the resonant frequency of crystals.  It is printed on the component housing.", "Fortunately, you do not have to calculate the resonant frequency of crystals. It is printed on the component housing.t."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The value stamped on the crystal is very accurate, with little tolerance."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["You may have noticed the similarity in construction of the crystal and a capacitor."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The crystal does have a very small amount of capacitance known as mounting capacitance (Cm)."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["With this in mind, let's look at a common crystal oscillator circuit."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["There are many different types of crystal oscillators.  This is a variation of a MOSFET Pierce Crystal Oscillator.", "There are many different types of crystal oscillators. This is a variation of a MOSFET Pierce Crystal Oscillator."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["It is identified as a crystal oscillator by the crystal in the feedback circuit."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Notice the reference designator  \"Y\" for a crystal.", "Notice the reference designator \"Y\" for a crystal."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Q1 is the amplifier. It is a dual gate, N channel, depletion type field effect transistor (MOSFET)."], "jumps": ["P1185", "P1150"]}, {"id": "P1185", "text": ["FETs are commonly used in crystal oscillators because they offer simplistic design requirements."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["The number of biasing components is reduced.  R1 is the gate return resistor.  It supplies the ground or zero volt reference for the gate.", "The number of biasing components is reduced. R1 is the gate return resistor. It supplies the ground or zero volt reference for the gate."], "jumps": ["P1200", "P1150"]}, {"id": "P1200", "text": ["An AC signal on the gate will increase and decrease drain current."], "jumps": ["P1205", "P1150"]}, {"id": "P1205", "text": ["Self bias is developed across the source resistor R2.  The FET operates as a class A amplifier.", "Self bias is developed across the source resistor R2. The FET operates as a class A amplifier."], "jumps": ["P1210", "P1150"]}, {"id": "P1210", "text": ["L1 is an RF choke that appears as a open to AC, isolating the supply from the circuit while functioning as a drain load resistor for VDD."], "jumps": ["P1220", "P1150"]}, {"id": "P1220", "text": ["C2 is a coupling capacitor, isolating the DC operating voltage from the output."], "jumps": ["P1230", "P1150"]}, {"id": "P1230", "text": ["R3 is the output load resistor, providing variable amplitude for the output signal."], "jumps": ["P1240", "P1150"]}, {"id": "P1240", "text": ["As soon as VDD is applied to the circuit, the crystal begins to vibrate.  The piezoelectric effect causes Y1 to produce a small AC voltage.", "As soon as VDD is applied to the circuit, the crystal begins to vibrate. The piezoelectric effect causes Y1 to produce a small AC voltage."], "jumps": ["P1250", "P1150"]}, {"id": "P1250", "text": ["The frequency of the AC is the natural frequency of the crystal. The signal is applied to both gates of the amplifier."], "jumps": ["P1260", "P1150"]}, {"id": "P1260", "text": ["The amplified signal on the drain is inverted.  This provides 180 degrees of phase shift.", "The amplified signal on the drain is inverted. This provides 180 degrees of phase shift."], "jumps": ["P1270", "P1150"]}, {"id": "P1270", "text": ["The amplified, inverted signal is applied to the other side of the crystal."], "jumps": ["P1280", "P1150"]}, {"id": "P1280", "text": ["This signal keeps the crystal vibrating and sustains oscillations. The AC produced by the crystal is inverted.  This is regenerative feedback.", "This signal keeps the crystal vibrating and sustains oscillations. The AC produced by the crystal is inverted. This is regenerative feedback."], "jumps": ["P1290", "P1150"]}, {"id": "P1290", "text": ["The mounting capacitance of the crystal (Cm) and C1 form a voltage divider to limit the amount of feedback."], "jumps": ["P1300", "P1150"]}, {"id": "P1300", "text": ["Correct operation is determined by comparing the value of the crystal with the actual measured frequency."], "jumps": ["P1310", "P1150"]}, {"id": "P1310", "text": ["Select the frequency determining component in this oscillator."], "jumps": ["P1150"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1314", "text": ["L1 isolates AC from the circuit and the power supply.", "L1 isolates AC from the circuit and the power supply......."], "jumps": []}, {"id": "P1316", "text": ["C2 is a coupling capacitor.  It blocks DC from reaching the output.", "C2 is a coupling capacitor. It blocks DC from reaching the output."], "jumps": []}, {"id": "P1318", "text": ["Q1 is the amplifier for the oscillator.  It amplifies and inverts the signal.", "Q1 is the amplifier for the oscillator. It amplifies and inverts the signal."], "jumps": []}, {"id": "P1320", "text": ["R3 is the output load resistor.  It varies the output amplitude.", "R3 is the output load resistor. It varies the output amplitude."], "jumps": []}, {"id": "P1322", "text": ["C1, along with the Cm of Y1, forms an AC voltage divider to limit feedback."], "jumps": []}, {"id": "P1324", "text": ["R1 is the gate return resistor that provides the zero reference for Q1."], "jumps": []}, {"id": "P1326", "text": ["R2 is the source resistor.  It develops self bias for amplifier Q1.", "R2 is the source resistor. It develops self bias for amplifier Q1."], "jumps": []}, {"id": "P1330", "text": ["Is this crystal oscillator operating normally?", "Is this crystal oscillator operating normally?............."], "jumps": ["P1310", "P1335"]}, {"id": "P1331", "text": [], "jumps": []}, {"id": "P1332", "text": ["Compare the crystal's frequency with the measured frequency. Since they are the same, the circuit is operating normally."], "jumps": []}, {"id": "P1335", "text": ["NORMAL OPERATION OF A CRYSTAL OSCILLATOR - Determine the normal operating frequency of a crystal oscillator by observing the value printed on the crystal housing. Compare this frequency with the measured frequency."], "jumps": []}, {"id": "P1340", "text": ["The resonant frequency of crystal oscillators is very accurate. The frequency does not drift as it does in LC and RC oscillators."], "jumps": ["P1350", "P1330"]}, {"id": "P1345", "text": ["DRIFT - Drift is an unwanted condition in oscillators that causes the frequency to change. It is present to some extent in all oscillators but is very small in crystal oscillators. Some clocks using crystal oscillators take 300 years to gain or lose 1 second."], "jumps": []}, {"id": "P1350", "text": ["Drift is caused by temperature changes, aging, and other factors. Oscillators with small drift are said to have good stability."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Many electronic timing devices use crystal oscillators because of their excellent stability."], "jumps": ["P1910", "P1340"]}, {"id": "P1910", "text": ["This completes the information on CRYSTAL OSCILLATOR.", "This completes the information on CRYSTAL OSCILLATOR......."], "jumps": ["P1001", "P1360"]}, {"id": "P1920", "text": ["1.  Crystals have a natural frequency at which they vibrate.  This        determines the frequency of the oscillator.", "1. Crystals have a natural frequency at which they vibrate. This determines the frequency of the oscillator.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Crystal oscillators use a quartz crystal mounted between                metal plates to determine frequency.", "2. Crystal oscillators use a quartz crystal mounted between metal plates to determine frequency."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The output of the amplifier vibrates the crystal producing AC         voltage at the resonant frequency.", "3. The output of the amplifier vibrates the crystal producing AC voltage at the resonant frequency."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The amplifier and the crystal have a 180\u00ba phase shift, which            produces regenerative feedback.", "4. The amplifier and the crystal have a 180", "phase shift, which produces regenerative feedback."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, you will measure AC waveforms throughout a crystal controlled oscillator.  Correct operation is verified by comparing the crystal's resonant frequency to measured frequency.", "In this experiment, you will measure AC waveforms throughout a crystal controlled oscillator. Correct operation is verified by comparing the crystal's resonant frequency to measured frequency."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-50 card.  The purpose of this card is to demonstrate the operation of crystal oscillators.", "Pick up the PC130-50 card. The purpose of this card is to demonstrate the operation of crystal oscillators."], "jumps": ["P2045", "P2020"]}, {"id": "P2045", "text": ["Compare the components on PC130-50  to the schematic shown.", "Compare the components on PC130-50 to the schematic shown."], "jumps": ["P2050", "P2040"]}, {"id": "P2050", "text": ["Notice the small number of components required for crystal oscillators."], "jumps": ["P2055", "P2040"]}, {"id": "P2055", "text": ["Locate Y1 on the circuit card. Notice the frequency stamped on the case, 1.000 MHz.  This is the resonant frequency of the crystal.", "Locate Y1 on the circuit card. Notice the frequency stamped on the case, 1.000 MHz. This is the resonant frequency of the crystal. ."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["R3 is a variable resistor that is used to vary the amplitude of the output signal."], "jumps": ["P2065", "P2040"]}, {"id": "P2065", "text": ["Notice the four leads of Q1.  The two gates of the FET are connected together.  Let's start the experiment.", "Notice the four leads of Q1. The two gates of the FET are connected together. Let's start the experiment."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1.  Set the test console controls to their initial control settings.", "1. Set the test console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id": "P2080", "text": ["2.  Carefully plug PC130-50 into the test console PC2 position.", "2. Carefully plug PC130-50 into the test console PC2 position.h to : ["P2140", "P2120"]}, {"id": "P2140", "text": ["Enter the measured value. \nRound your answer to one decimal place.", "Enter the measured value. Round your answer to one decimal place.wer (5) in a variable.able.le."], "jumps": ["P2130", "P2142", "P2145"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["Your measurement is incorrect.  Make you're measurement at TP6 and ensure you are reading the oscilloscope display correctly.", "Your measurement is incorrect. Make you're measurement at TP6 and ensure you are reading the oscilloscope display correctly. ............................................................"], "jumps": []}, {"id": "P2143", "text": ["Your answer is still incorrect.  You should have measured approximately 1000 kHz (1 MHz).  Check with your instructor if you are still having difficulty.", "Your answer is still incorrect. You should have measured approximately 1000 kHz (1 MHz). Check with your instructor if you are still having difficulty."], "jumps": ["P2140"]}, {"id": "P2145", "text": ["OSCILLOSCOPE MEASUREMENT - The MOSFET is a high impedance device. The oscilloscope probe may tend to load the circuit and cause distortion of the waveforms. High impedance or low capacitance probes should be utilized if available."], "jumps": []}, {"id": "P2150", "text": ["Compare the crystal's resonant frequency with your measured frequency.", "Crystal Frequency Measured 1.000 MHz Is the oscillator functioning correctly???"], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["Compare the crystal's resonant frequency with your measured frequency.  They agree within \u00b110%.", "Compare the crystal's resonant frequency with your measured frequency. They agree within", "Crystal Frequency Measured 1.000 MHz Is the oscillator functioning correctly?"], "jumps": []}, {"id": "P2160", "text": ["In a normal operating oscillator, your measured value will be within \u00b110% of the crystal's value.  The crystal itself actually has a much smaller tolerance, but frequency measurements with oscilloscopes are not extremely precise.", "In a normal operating oscillator, your measured value will be within", "10% of the crystal's value. The crystal itself actually has a much smaller tolerance, but frequency measurements with oscilloscopes are not extremely precise..", "Crystal Frequency Measured 1.000 MHz Is the oscillator functioning correctly?"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["If a frequency counter is available, disconnect the oscilloscope probe and connect the counter to PC130-50 TP6 and measure the frequency.  This will give a more accurate reading than you can measure with your oscilloscope.", "If a frequency counter is available, disconnect the oscilloscope probe and connect the counter to PC130-50 TP6 and measure the frequency. This will give a more accurate reading than you can measure with your oscilloscope.."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Compare the oscilloscope measurement with the frequency counter measurement.", "Compare the oscilloscope measurement with the frequency counter measurement......", "Oscilloscope Value Is the oscillator functioning correctly?"], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Now that you know the circuit is operating normally, let's measure waveforms in the circuit."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["With the oscilloscope CH1 input set to AC, only the AC component of the signal will be observed."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["1.  Connect CH1 probe to PC130-50 TP4. \n2.  Set the Volts/Div for 1 volt.", "1. Connect CH1 probe to PC130-50 TP4. 2. Set the Volts/Div for 1 volt. NOTE MOSFET is a high impedance device. The oscilloscope probe may tend to load the circuit and cause distortion of the waveforms. High impedance or low capacitance probes should be utilized if available.", "The MOSFET is a high impedance device. The oscillosco let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
