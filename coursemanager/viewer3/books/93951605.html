cting a problem you should _______."], "jumps": []}, {"id": "P10216", "text": ["Calculating and measuring circuit values is done _______. __. and measure circuit values?", "sectionalize, localize and finally isolate a problem"], "jumps": []}, {"id": "P10215", "text": ["When you check to see if the equipment is plugged in you are _______."], "jumps": []}, {"id": "P10214", "text": ["Analyzing the circuit refers to _______. dure do you analyze the circuit?"], "jumps": []}, {"id": "P10213", "text": ["Which of the following troubleshooting steps should be performed last?"], "jumps": []}, {"id": "P10212", "text": ["Which of the following troubleshooting steps should be performed third?"], "jumps": []}, {"id": "P10211", "text": ["Which of the following troubleshooting steps should be performed second?"], "jumps": []}, {"id": "P10210", "text": ["Which of the following troubleshooting steps should be performed first?"], "jumps": []}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "4.  Continuity checks are used to check shielded and unshielded      cables.", "3.  Connectors are labeled by manufacturers.  Matching male and      female connectors are mirror images of each other.", "You have completed the Summary. You are about to return to the Objective Menu.", "4. Continuity checks are used to check shielded and unshielded cables.", "3. Connectors are labeled by manufacturers. Matching male and female connectors are mirror images of each other."], "jumps": ["P3001", "P3950", "P3999", "P3940", "P3930"]}, {"id": "P3930", "text": ["2.  Some problems can be found by adding a visual inspection            when checking the circuit setup.", "2. Some problems can be found by adding a visual inspection when checking the circuit setup. EXT) 1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "1. Analyze the circuit. 2. Check the setup. 3. Calculate & measure values. 4. Check the results."], "jumps": ["P3940", "P3920"]}, {"id": "P3920", "text": ["1.  Problems in a circuit or cable can be intermittent or constant.", "1. Problems in a circuit or cable can be intermittent or constant.", "PROBLEMS Open Components Shorted Components Changed Values Loose Connections Cold Solder Joints Thermal Expansion Thermal Contraction Voltage Spikes"], "jumps": ["P3930", "P3001"]}, {"id": "P3910", "text": ["This completes the information on TECHNIQUES AND TIPS.", "This completes the information on TECHNIQUES AND TIPS......"], "jumps": ["P3001", "P3400"]}, {"id": "P3400", "text": ["The troubleshooting technique you use will depend on the equipment you maintain but, remembering the basics will help you be a successful troubleshooter."], "jumps": ["P3910", "P3390"]}, {"id": "P3392", "text": ["There is more than one method used to complete the circuit path for continuity checks."], "jumps": []}, {"id": "P3391", "text": [], "jumps": []}, {"id": "P3390", "text": ["Which method below describes how to complete your circuit path for continuity checks?"], "jumps": ["P3320"]}, {"id": "P3340", "text": ["However, this makes a convenient circuit path to help you troubleshoot."], "jumps": ["P3390", "P3320"]}, {"id": "P3330", "text": ["Most large machines will have either a metal frame, a metal chassis within the frame or grounding straps that connect all the  electronics in drawers, panels or other sections.  This is a safety  feature to prevent electrical shocks.", "Most large machines will have either a metal frame, a metal chassis within the frame or grounding straps that connect all the electronics in drawers, panels or other sections. This is a safety feature to prevent electrical shocks."], "jumps": ["P3340", "P3320"]}, {"id": "P3320", "text": ["The same method can be used to troubleshoot wiring on large machines."], "jumps": ["P3330", "P3290"]}, {"id": "P3310", "text": ["If you have continuity, either one of these wires can be used to provide the circuit path.  If you do not have continuity, keep going to the next available pin until you do, and select one of those wires as your circuit path to check the others.", "If you have continuity, either one of these wires can be used to provide the circuit path. If you do not have continuity, keep going to the next available pin until you do, and select one of those wires as your circuit path to check the others."], "jumps": ["P3320", "P3290"]}, {"id": "P3300", "text": ["Person #2 will jumper from pin 1 to pin 2.", "If the cable is not shielded, you could still use the same method of troubleshooting.  Before checking the pin to socket connections you must find pins that provide a circuit path. Person #1 connects one lead to pin 1 and the other lead pin 2.", "If the cable is not shielded, you could still use the same method of troubleshooting. Before checking the pin to socket connections you must find pins that provide a circuit path. Person #1 connects one lead to pin 1 and the other lead pin 2."], "jumps": ["P3310", "P3290", "P3300", "P3230"]}, {"id": "P3280", "text": ["The process is repeated for the remaining pins."], "jumps": ["P3290", "P3230"]}, {"id": "P3270", "text": ["Person #1 moves the lead from pin 1 to pin 2 and tells person #2, to move to pin 2.  The measured value should indicate continuity.", "Person #1 moves the lead from pin 1 to pin 2 and tells person #2, to move to pin 2. The measured value should indicate continuity."], "jumps": ["P3280", "P3230"]}, {"id": "P3260", "text": ["The shielding is providing the continuity path through the cable, jumper wire, and the multimeter.  The measured value should indicate continuity.", "The shielding is providing the continuity path through the cable, jumper wire, and the multimeter. The measured value should indicate continuity..."], "jumps": ["P3270", "P3230"]}, {"id": "P3250", "text": ["Person #2 will place a jumper wire from the case to pin 1.", "Person #2 will place a jumper wire from the case to pin 1.m"], "jumps": ["P3260", "P3230"]}, {"id": "P3240", "text": ["Person #1 will connect one test lead to the case and the other to pin 1.", "Troubleshooting the pin to socket continuity of a lengthy shielded cable requires; 2 people, 1 multimeter, a jumper wire and telephones or a set of two way radios.  In our example, person #1 will be using the meter and person #2 will be using the jumper wire.", "Troubleshooting the pin to socket continuity of a lengthy shielded cable requires; 2 people, 1 multimeter, a jumper wire and telephones or a set of two way radios. In our example, person #1 will be using the meter and person #2 will be using the jumper wire."], "jumps": ["P3250", "P3230", "P3240", "P3225"]}, {"id": "P3226", "text": ["Troubleshooting over distance can complicate the process but there is a method."], "jumps": ["P3230", "P3225"]}, {"id": "P3225", "text": ["When checking cables disconnecting them from the circuit is always desirable, however, this may not be possible.  Long distance cables may require you to troubleshoot through a wiring distribution frame or patch panel.", "When checking cables disconnecting them from the circuit is always desirable, however, this may not be possible. Long distance cables may require you to troubleshoot through a wiring distribution frame or patch panel."], "jumps": ["P3226", "P3211"]}, {"id": "P3221", "text": ["Now, ensure that none of the pins are shorted together.  Place one lead on a pin and the other lead on each individual pin.        Repeat this process for each pin.", "Now, ensure that none of the pins are shorted together. Place one lead on a pin and the other lead on each individual pin. Repeat this process for each pin."], "jumps": ["P3225", "P3211"]}, {"id": "P3220", "text": ["Now, ensure that the pins have continuity to the corresponding socket.  Place one lead on a pin and the other lead on the socket with the same number or letter.", "Now, ensure that the pins have continuity to the corresponding socket. Place one lead on a pin and the other lead on the socket with the same number or letter."], "jumps": ["P3221", "P3211"]}, {"id": "P3212", "text": ["Next, ensure that none of the pins are shorted to the connector case.  Do this by placing one meter lead on the case and the other lead on each individual pin to ensure that there is no continuity (open).", "Next, ensure that none of the pins are shorted to the connector case. Do this by placing one meter lead on the case and the other lead on each individual pin to ensure that there is no continuity (open)."], "jumps": ["P3220", "P3211"]}, {"id": "P3211", "text": ["First, if the cable is shielded, ensure that the connector cases are shorted together.  The continuity measured here will prove that the cable shield is good.", "First, if the cable is shielded, ensure that the connector cases are shorted together. The continuity measured here will prove that the cable shield is good."], "jumps": ["P3212", "P3210"]}, {"id": "P3210", "text": ["Now that you have seen the normal continuity relationships of a cable let's discuss a method for checking the cable.", "Now that you have seen the normal continuity relationships of a cable let's discuss a method for checking the cable. - - No continuity between pinsket - No continuity between pinscket - No continuity between pinsnst - No continuity between pinsss"], "jumps": ["P3211", "P3180"]}, {"id": "P3200", "text": ["Wires inside the cable connect the pins at one end of the cable to the corresponding socket at the other end of the cable.  Good wires will measure continuity between the pin and its corresponding socket.  Pins should not have continuity between each other.", "Wires inside the cable connect the pins at one end of the cable to the corresponding socket at the other end of the cable. Good wires will measure continuity between the pin and its corresponding socket. Pins should not have continuity between each other."], "jumps": ["P3210", "P3180"]}, {"id": "P3193", "text": ["There may be an exception where one or more pins are tied to ground.  If so, wiring diagrams, AS-built drawings, or schematics will identify which pins are grounded.", "There may be an exception where one or more pins are tied to ground. If so, wiring diagrams, AS-built drawings, or schematics will identify which pins are grounded."], "jumps": ["P3200", "P3180"]}, {"id": "P3192", "text": ["Wires inside the cable are isolated from the shielding.  A good wire does not have continuity between the shielding (wire braiding or foil) and itself.", "Wires inside the cable are isolated from the shielding. A good wire does not have continuity between the shielding (wire braiding or foil) and itself."], "jumps": ["P3193", "P3180"]}, {"id": "P3191", "text": ["If the cable is not shielded, the cases of the connectors at each end of the cable DO NOT measure continuity."], "jumps": ["P3192", "P3180"]}, {"id": "P3180", "text": ["If the cable is shielded, the case of the connector has continuity from one end of the cable to the other."], "jumps": ["P3191", "P3170"]}, {"id": "P3170", "text": ["Now let's look at normal continuity readings and a method for checking cables."], "jumps": ["P3180", "P3160"]}, {"id": "P3160", "text": ["Another type of connector, a 9-pin D-sub, could be labeled like this:"], "jumps": ["P3170", "P3150"]}, {"id": "P3150", "text": ["Some cables and connectors are labeled with letters.", "Some cables and connectors are labeled with letters..etters.rs."], "jumps": ["P3160", "P3140"]}, {"id": "P3140", "text": ["The labeling could also start from the center and spiral its way outward."], "jumps": ["P3150", "P3120"]}, {"id": "P3130", "text": ["Notice that the male and female are mirror images of each other. If you have a cable that you can disconnect confusing the two pin assignments is very easy, especially if you are the only person troubleshooting.", "Let's look at a generic connector.  Manufacturers label pins differently but, if you look at the inside of a connector the pins are labeled.", "Let's look at a generic connector. Manufacturers label pins differently but, if you look at the inside of a connector the pins are labeled."], "jumps": ["P3120", "P3110", "P"]}, {"id": "P3110", "text": ["The female connector, can be plugged onto the male pin without having to worry about your multimeter probe slipping off and        shorting pins together.", "The female connector, can be plugged onto the male pin without having to worry about your multimeter probe slipping off and shorting pins together."], "jumps": ["P3100"]}, {"id": "P3100", "text": ["For example, with extra pins you can solder a wire to the pin and solder a small alligator clip to the other side.  This comes in        handy when troubleshooting the male pins of a connector.", "For example, with extra pins you can solder a wire to the pin and solder a small alligator clip to the other side. This comes in handy when troubleshooting the male pins of a connector."], "jumps": ["P3090"]}, {"id": "P3090", "text": ["Whenever possible keep all documentation when receiving new equipment, including technical manuals for test equipment, down to the instructions on how to build a connector assembly. Especially keep any extra pins that may come with a connector. These can be used to help you troubleshoot identical or similar equipment."], "jumps": ["P3080"]}, {"id": "P3080", "text": ["The tips we have seen will help you when troubleshooting but remember that experienced troubleshooters have learned troubleshooting from others and through trial and error."], "jumps": ["P3070"]}, {"id": "P3070", "text": ["If you cannot determine the fault, turn off the power to the system and disconnect all interconnecting wiring.  Visually inspect all plugs and jacks.  Look for the following:", "If you cannot determine the fault, turn off the power to the system and disconnect all interconnecting wiring. Visually inspect all plugs and jacks. Look for the following: GRAPHICS TEXT) - pins that are recessed making only partial contact. - scorch (black) marks that may indicate a short, remember you may be able to smell burned wiring. - wire coating or shrink tubing may be shriveled due", "- pins that are recessed making only partial contact. - scorch (black) marks that may indicate a short, you may smell burned wiring. - shriveled wire coating or shrink tubing, caused from excessive current. - wiring that feels hot, it may be hot from excessive current. - cracked insulation on plugs and jacks. - dryrot on wiring (insulation becomes brittle and flakes off). - loose wires going to individual pins and sockets. - a film of liquid on the jacks or plugs, it may be providing a current path. - excessively hard wiring that goes directly to the pins or sockets. - solder balls or solder hairs that may have fallen into the wiring connectors. - corrosion on the plugs or connectors (rusty or green color). - exposed wiring going into solder connections. - loose screws and crimp connections to lugs that go to terminal blocks. - cold solder joints or lifted runs. lifted runs. ifted runs."], "jumps": ["P3061"]}, {"id": "P3061", "text": ["To find an intermittent problem you can: wiggle power cords, plugs, jacks and interconnecting cabling while power is applied.  If these have bad connections or jacks the symptom will re-occur or disappear.", "To find an intermittent problem you can: wiggle power cords, plugs, jacks and interconnecting cabling while power is applied. If these have bad connections or jacks the symptom will re-occur or disappear. (GRAPHICS TEXT) Always use caution when wiggling power cords. Keep one hand behind your back and have your troubleshooting partner near the circuit", "Always use caution when wiggling power cords. Keep one hand behind your back and have your troubleshooting partner near the circuit breaker. rmal Contraction Voltage Spikes"], "jumps": ["P3060"]}, {"id": "P3060", "text": ["You should ALWAYS use caution, follow safety procedures and know the equipment and it's power requirements before performing any of the following techniques. When troubleshooting circuits or equipment that use high voltage or current make sure that you have a troubleshooting partner with you."], "jumps": ["P3059"]}, {"id": "P3059", "text": ["Your troubleshooting technique will depend on the type of problem encountered.", "PROBLEMS Open Components Shorted Components Changed Values Loose Connections Cold Solder Joints Thermal Expansion Thermal Contraction Voltage Spikes"], "jumps": ["P3053"]}, {"id": "P3053", "text": ["An intermittent problem changes.  A symptom appears then disappears.  It can be very difficult to find a problem when a piece of equipment does not have any symptoms to diagnose.", "An intermittent problem changes. A symptom appears then disappears. It can be very difficult to find a problem when a piece of equipment does not have any symptoms to diagnose."], "jumps": ["P3059", "P3051", "P"]}, {"id": "P3051", "text": ["The symptoms of a constant problem do not go away until the problem has been repaired."], "jumps": ["P3053", "P3050"]}, {"id": "P3050", "text": ["Problems are constant or intermittent.", "Problems are constant or intermittent.GRAPHICS TEXT) PROBLEMS Open Components INTERMITTENT Shorted Components Changed Values Loose Connections Cold Solder Joints", "PROBLEMS Open Components Shorted Components Changed Values Loose Connections Cold Solder Joints Thermal Expansion Thermal Contraction Voltage Spikes"], "jumps": ["P3040"]}, {"id": "P3040", "text": ["There are several techniques used to find an open, short or changed value in a circuit, cable and connector.  Let's discuss some common techniques used by technicians.", "There are several techniques used to find an open, short or changed value in a circuit, cable and connector. Let's discuss some common techniques used by technicians. 1. Opens 2. Shorts 3. Changed Valuesssss", "1. Opens 2. Shorts 3. Changed Valuessssss"], "jumps": ["P3001"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2950"]}, {"id": "P2950", "text": ["4.  Changed Value - ohmic value increases or decreases.", "4. Changed Value - ohmic value increases or decreases....."], "jumps": ["P2999", "P2940"]}, {"id": "P2940", "text": ["3.  Short - provides no resistance to current flow.", "3. Short - provides no resistance to current flow........."], "jumps": ["P2950", "P2930"]}, {"id": "P2930", "text": ["2.  Open - provides no path for current flow.", "2. Open - provides no path for current flow..............."], "jumps": ["P2940", "P2920"]}, {"id": "P2920", "text": ["1.  There are three faults in a circuit or cable:", "1. There are three faults in a circuit or cable: Open * Short * Changed value"], "jumps": ["P2930", "P2001"]}, {"id": "P2910", "text": ["This completes the information on FAULT IDENTIFICATION.", "This completes the information on FAULT IDENTIFICATION....."], "jumps": ["P2001", "P2560"]}, {"id": "P2560", "text": ["Opens, shorts and changed values are not usually visible.  Make calculations and measurements to identify the faulted component.", "Opens, shorts and changed values are not usually visible. Make calculations and measurements to identify the faulted component. en A break in the circuit stopping current. Short An extra path or bad component providing a new or non-resistant path for current.....", "Open A break in the circuit stopping current. Short An extra path or bad component providing a new or non-resistant path for current. Changed Value A path for current that has more or less resistance to current."], "jumps": ["P2910", "P2550"]}, {"id": "P2550", "text": ["Remember, the three faults in a series circuit are:", "Remember, the three faults in a series circuit are: Open * Short * Changed value"], "jumps": ["P2560", "P2540"]}, {"id": "P2543", "text": ["A changed value component can cause an increase or decrease in resistance but current flow will not stop."], "jumps": []}, {"id": "P2542", "text": ["A short causes no resistance to current flow.", "A short causes no resistance to current flow..............."], "jumps": []}, {"id": "P2541", "text": [], "jumps": []}, {"id": "P2540", "text": ["What fault causes current flow to stop?", "What fault causes current flow to stop?...................."], "jumps": ["P2530"]}, {"id": "P2533", "text": ["A short causes no resistance to current flow.", "A short causes no resistance to current flow..............."], "jumps": []}, {"id": "P2532", "text": ["An open causes maximum resistance. When a circuit is open, current flow will stop."], "jumps": []}, {"id": "P2531", "text": [], "jumps": []}, {"id": "P2530", "text": ["What fault causes resistance to increase or decrease slightly?"], "jumps": ["P2520"]}, {"id": "P2523", "text": ["A changed value component can cause a reduction in resistance, but some resistance to current flow will still be present."], "jumps": []}, {"id": "P2522", "text": ["An open provides maximum resistance.  When a circuit is open no current will flow.", "An open provides maximum resistance. When a circuit is open no current will flow."], "jumps": []}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2520", "text": ["What fault provides no resistance to current flow?", "What fault provides no resistance to current flow?........."], "jumps": ["P2510"]}, {"id": "P2510", "text": ["Making the measurements necessary to identify the faulted component, is the first step to becoming a good troubleshooter."], "jumps": ["P2520", "P2480"]}, {"id": "P2500", "text": ["Compare the calculated values to the measured values.  This will let you identify the component that has changed value.", "Compare the calculated values to the measured values. This will let you identify the component that has changed value."], "jumps": ["P2510", "P2480"]}, {"id": "P2492", "text": ["Corrosion between pins can also cause values of resistance to be measured."], "jumps": ["P2500", "P2480"]}, {"id": "P2491", "text": ["A reading of 0 W  between pins is a good indication that there is a short, either caused by crossed wires or corrosion.", "A reading of 0 W between pins is a good indication that there is a short, either caused by crossed wires or corrosion."], "jumps": ["P2492", "P2480"]}, {"id": "P2490", "text": ["Remember that, normally, infinite resistance is the normal reading when checking a cable pin-to-pin.", "Shorted wires and corrosion in cables can cause changed values in measurements.  If the expected voltage, resistance or signal is not present on the pin of a cable you should isolate the cable and make pin-to-pin resistance measurements.", "Shorted wires and corrosion in cables can cause changed values in measurements. If the expected voltage, resistance or signal is not present on the pin of a cable you should isolate the cable and make pin-to-pin resistance measurements."], "jumps": ["P2491", "P2480", "P2490", "P2470"]}, {"id": "P2474", "text": ["If a component's ohmic value increases, current flow in the circuit decreases.  The larger the change in value, the larger the effect on current flow.", "If a component's ohmic value increases, current flow in the circuit decreases. The larger the change in value, the larger the effect on current flow."], "jumps": ["P2480", "P2470"]}, {"id": "P2472", "text": ["A component's ohmic value can increase or decrease.  If a component's ohmic value decreases, current will increase.", "A component's ohmic value can increase or decrease. If a component's ohmic value decreases, current will increase."], "jumps": ["P2474", "P2470"]}, {"id": "P2470", "text": ["A good component has a resistance value equal to the ohmic value indicated by the resistor color code.", "GOOD COMPONENT resistance = ohmic valuee", "DECREASED RESISTANCE current increasesses", "INCREASED RESISTANCE current decreasesses"], "jumps": ["P2472", "P2440"]}, {"id": "P2460", "text": ["A changing component value affects current flow in a series circuit.  The change in value causes the measured values to be different than the calculated values.", "A changing component value affects current flow in a series circuit. The change in value causes the measured values to be different than the calculated values."], "jumps": ["P2470", "P2440"]}, {"id": "P2450", "text": ["In a series circuit, with a component that has changed value, the measured voltage drop across that component is larger or smaller than the calculated value."], "jumps": ["P2460", "P2440"]}, {"id": "P2440", "text": ["A \"CHANGED VALUE\" occurs when a component's ohmic value increases or decreases."], "jumps": ["P2450", "P2430"]}, {"id": "P2430", "text": ["The next type of fault we will look at is the changed value:", "The next type of fault we will look at is the changed value: Open 2. Short 3. Changed value"], "jumps": ["P2440", "P2420"]}, {"id": "P2422", "text": ["A short does not provide resistance to current.", "A short does not provide resistance to current............."], "jumps": []}, {"id": "P2421", "text": [], "jumps": []}, {"id": "P2420", "text": ["An shorted component or wire will measure _______", "An shorted component or wire will measure _______.........."], "jumps": ["P2390"]}, {"id": "P2410", "text": ["Infinite resistance should also be measured when checking the cable pins to the cable shield (ground).  Minimum resistance means there is  a short to ground and the cable needs repaired.", "Infinite resistance should also be measured when checking the cable pins to the cable shield (ground). Minimum resistance means there is a short to ground and the cable needs repaired."], "jumps": ["P2420", "P2390"]}, {"id": "P2400", "text": ["Normally, an open (infinite resistance) is the desired result when checking a cable pin-to-pin.  Minimum resistance indicates that the wires connected to the pins being measured are shorted together.", "Normally, an open (infinite resistance) is the desired result when checking a cable pin-to-pin. Minimum resistance indicates that the wires connected to the pins being measured are shorted together."], "jumps": ["P2410", "P2390"]}, {"id": "P2390", "text": ["As with opens, continuity checks can also detect shorted wires in cables.  Remember that cables should be disconnected from equipment  before making continuity checks.  This isolates the cable from other connectors, cables, and circuits.", "As with opens, continuity checks can also detect shorted wires in cables. Remember that cables should be disconnected from equipment before making continuity checks. This isolates the cable from other connectors, cables, and circuits."], "jumps": ["P2400", "P2380"]}, {"id": "P2380", "text": ["Closed switches, good fuses, wires and wire connections should measure minimum resistance.", "Closed switches, good fuses, wires and wire connections should measure minimum resistance. Closed Switch Fuse Wire Wire Connections"], "jumps": ["P2390", "P2350"]}, {"id": "P2370", "text": ["Once the component shorts completely, there is no resistance to current flow.  This is like replacing the resistor with a piece of wire.", "Once the component shorts completely, there is no resistance to current flow. This is like replacing the resistor with a piece of wire."], "jumps": ["P2380", "P2350"]}, {"id": "P2360", "text": ["As a component starts to short, resistance starts to decrease."], "jumps": ["P2370", "P2350"]}, {"id": "P2350", "text": ["For example, a good resistor has a resistance value equal to the ohmic value indicated by the resistor's color code.", "GOOD COMPONENT resistance = ohmic valuee"], "jumps": ["P2360", "P2320"]}, {"id": "P2340", "text": ["When connecting the meter across a shorted component, minimum resistance is measured.  A good component should have a measurable resistance value.", "When connecting the meter across a shorted component, minimum resistance is measured. A good component should have a measurable resistance value."], "jumps": ["P2350", "P2320"]}, {"id": "P2330", "text": ["Remember, ALWAYS remove or disconnect power from the circuit before connecting a multimeter set to measure resistance."], "jumps": ["P2340", "P2320"]}, {"id": "P2320", "text": ["Continuity (resistance) checks can also be used to find an short in a circuit."], "jumps": ["P2330", "P2310"]}, {"id": "P2312", "text": ["There is no voltage drop measured across a shorted component or a component that has a short around it."], "jumps": []}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2310", "text": ["If you measure a component that has no voltage drop, then you have identified the _______"], "jumps": ["P2302"]}, {"id": "P2305", "text": ["VOLTAGE DROP MEASUREMENT - To measure the voltage drops of the components in this circuit, place the multimeter leads as shown."], "jumps": []}, {"id": "P2302", "text": ["To isolate a shorted component, verify each components voltage drop by making voltage measurements.  The component without a voltage drop is the shorted component.", "To isolate a shorted component, verify each components voltage drop by making voltage measurements. The component without a voltage drop is the shorted component."], "jumps": ["P2310", "P2280", "P2305"]}, {"id": "P2300", "text": ["To isolate a shorted component, verify each components voltage drop by making voltage measurements.  The component without a voltage drop is the shorted component.", "To isolate a shorted component, verify each components voltage drop by making voltage measurements. The component without a voltage drop is the shorted component."], "jumps": ["P2310", "P2280", "P2305"]}, {"id": "P2290", "text": ["A good component or one without a short around it, will provide resistance to current and have a measurable voltage drop.  A shorted component in a series circuit, has is NO voltage drop. Current will take the path of least resistance.", "A good component or one without a short around it, will provide resistance to current and have a measurable voltage drop. A shorted component in a series circuit, has is NO voltage drop. Current will take the path of least resistance."], "jumps": ["P2300", "P2280"]}, {"id": "P2280", "text": ["A \"SHORT\" occurs when there is no resistance to current flow. Voltage and resistance measurements are the most common checks used to help isolate a short."], "jumps": ["P2290", "P2270"]}, {"id": "P2270", "text": ["The next fault we will look at is the short:", "The next fault we will look at is the short: Open 2. Short 3. Changed value"], "jumps": ["P2280", "P2260"]}, {"id": "P2262", "text": ["An open breaks the path for current to flow.", "An open breaks the path for current to flow................"], "jumps": []}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2260", "text": ["Current is measured in an open circuit when the meter leads are placed _______"], "jumps": ["P2230"]}, {"id": "P2250", "text": ["Placing both leads in the circuit before or after the open will indicate the absence of current."], "jumps": ["P2260", "P2230"]}, {"id": "P2240", "text": ["When the multimeter leads are placed across the open, the meter will measure current.  This is because the meter is providing a path for current to flow through.", "When the multimeter leads are placed across the open, the meter will measure current. This is because the meter is providing a path for current to flow through."], "jumps": ["P2250", "P2230"]}, {"id": "P2230", "text": ["Current measurements can also be useful in finding an open in a circuit."], "jumps": ["P2240", "P2220"]}, {"id": "P2222", "text": ["An open breaks the circuit and increases resistance.", "An open breaks the circuit and increases resistance........"], "jumps": []}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2220", "text": ["An open component or wire will measure _______", "An open component or wire will measure _______............."], "jumps": ["P2190"]}, {"id": "P2210", "text": ["Infinite resistance should also be measured when checking the cable pins to the cable shield (ground)."], "jumps": ["P2220", "P2190"]}, {"id": "P2200", "text": ["Normally, an open (infinite resistance) is the desired result when checking a cable pin-to-pin."], "jumps": ["P2210", "P2190"]}, {"id": "P2190", "text": ["Continuity measurements can be used to find open wires in cables.  Cables should be disconnected from all equipment before making continuity checks.  This isolates the cable from other connectors, cables, and circuits.", "Continuity measurements can be used to find open wires in cables. Cables should be disconnected from all equipment before making continuity checks. This isolates the cable from other connectors, cables, and circuits."], "jumps": ["P2200", "P2170"]}, {"id": "P2180", "text": ["An open wire, like an open component, will measure infinite resistance."], "jumps": ["P2190", "P2170"]}, {"id": "P2170", "text": ["Open wiring can also be located by making continuity checks."], "jumps": ["P2180", "P2140"]}, {"id": "P2160", "text": ["When the component opens completely, resistance increases to maximum resistance or infinity ( i )."], "jumps": ["P2170", "P2140"]}, {"id": "P2150", "text": ["As a component starts to open, resistance increases."], "jumps": ["P2160", "P2140"]}, {"id": "P2140", "text": ["A good resistor, for example, has a resistance value equal to the ohmic value indicated by the resistor color code.", "GOOD COMPONENT resistance = ohmic valuee"], "jumps": ["P2150", "P2110"]}, {"id": "P2130", "text": ["When connecting the meter across an open component, maximum resistance is measured.  A good component should have a measurable resistance value (capacitors are an exception).", "When connecting the meter across an open component, maximum resistance is measured. A good component should have a measurable resistance value (capacitors are an exception)."], "jumps": ["P2140", "P2110"]}, {"id": "P2120", "text": ["You should ALWAYS remove or disconnect power from the circuit before connecting a multimeter set to measure resistance."], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": ["Continuity (resistance) checks can also be used to find an open in a circuit."], "jumps": ["P2120", "P2100"]}, {"id": "P2102", "text": ["The applied voltage can be measured across an open component or an open wire."], "jumps": []}, {"id": "P2101", "text": [], "jumps": []}, {"id": "P2100", "text": ["If you measure a component that has a voltage drop equal to the applied voltage, you have identified the _______"], "jumps": ["P2092"]}, {"id": "P2095", "text": ["VOLTAGE DROP MEASUREMENT - To measure the voltage in the circuit place the multimeter leads as shown."], "jumps": []}, {"id": "P2092", "text": ["To determine if the circuit has an open component, measure the voltage drop of each component in the circuit."], "jumps": ["P2100", "P2050", "P2095"]}, {"id": "P2090", "text": ["To determine if the circuit has an open component, measure the voltage drop of each component in the circuit."], "jumps": ["P2100", "P2050", "P2095"]}, {"id": "P2080", "text": ["An open component causes the entire applied voltage to be dropped across itself.  Measuring across the open component measures the applied voltage.", "An open component causes the entire applied voltage to be dropped across itself. Measuring across the open component measures the applied voltage."], "jumps": ["P2090", "P2050"]}, {"id": "P2070", "text": ["Making voltage measurements before or after the open wire will indicate the absence of voltage."], "jumps": ["P2080", "P2050"]}, {"id": "P2060", "text": ["When a wire is open, voltage is measured across the open. Voltage is not measured across a good wire."], "jumps": ["P2070", "P2050"]}, {"id": "P2050", "text": ["An \"OPEN\" occurs when a component or wire does not provide a path for current flow.  Voltage, resistance and current measurements can be used to isolate an open.", "An \"OPEN\" occurs when a component or wire does not provide a path for current flow. Voltage, resistance and current measurements can be used to isolate an open."], "jumps": ["P2060", "P2040"]}, {"id": "P2040", "text": ["There are three types of faults that are commonly found in circuits.", "There are three types of faults that are commonly found in circuits. 1. Opens 2. Shorts 3. Changed Values", "1. Opens 2. Shorts 3. Changed Valuessssss"], "jumps": ["P2050", "P2001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P1940", "text": ["4.  Collect as many pieces to the puzzle as you can.", "4. Collect as many pieces to the puzzle as you can........"], "jumps": ["P1999", "P1930"]}, {"id": "P1930", "text": ["3.  Follow the 4 troubleshooting steps:", "3. Follow the 4 troubleshooting steps: Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "1. Analyze the circuit. 2. Check the setup. 3. Calculate & measure values. 4. Check the results."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["1.  The primary reason for learning to troubleshoot is to find and         fix faults in a circuit.    \n2.  Use a logical, systematic approach to troubleshooting.", "1. The primary reason for learning to troubleshoot is to find and fix faults in a circuit. 2. Use a logical, systematic approach to troubleshooting."], "jumps": ["P1930", "P1001"]}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING PROCEDURES."], "jumps": ["P1001", "P1220"]}, {"id": "P1223", "text": ["You would check the setup looking for obvious problems like; power switch ON, equipment plugged into power, cables and connectors plugged in and attached to the correct outputs and inputs etc.", "You would check the setup looking for obvious problems like; power switch ON, equipment plugged into power, cables and connectors plugged in and attached to the correct outputs and inputs etc. 1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "1. Analyze the circuit. 2. Check the setup. 3. Calculate & measure values. 4. Check the results."], "jumps": []}, {"id": "P1222", "text": ["You would analyze the circuit as an initial check to see if it is operating correctly.  If the circuit is operating, no repairs are      required.  If it is not, then you would proceed to the next step.", "You would analyze the circuit as an initial check to see if it is operating correctly. If the circuit is operating, no repairs are required. If it is not, then you would proceed to the next step. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "1. Analyze the circuit. 2. Check the setup. 3. Calculate & measure values. 4. Check the results."], "jumps": []}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1220", "text": ["What troubleshooting step is used to localize a problem?", "What troubleshooting step is used to localize a problem?..."], "jumps": ["P1210"]}, {"id": "P1210", "text": ["Remember the four troubleshooting steps and apply them to all future troubleshooting problems.", "Remember the four troubleshooting steps and apply them to all future troubleshooting problems. 1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "1. Analyze the circuit. 2. Check the setup. 3. Calculate & measure values. 4. Check the results."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["4.  Check the results\n     Example: If the picture tube in the TV is faulted, replace the             tube and perform step 1 again.  If the television operates                  properly, you are finished.", "4. Check the results Example: If the picture tube in the TV is faulted, replace the tube and perform step 1 again. If the television operates properly, you are finished."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["4.  Check the results \n     Make repairs to the circuit and analyze the circuit (step 1).  If           the circuit operates properly, the circuit is fixed.", "4. Check the results Make repairs to the circuit and analyze the circuit (step 1). If the circuit operates properly, the circuit is fixed."], "jumps": ["P1200", "P1172"]}, {"id": "P1180", "text": ["s of the puzzle begin to fall into place, identifying the fault becomes easier.", "3. Calculate & measure circuit values Comparing the calculated to measured values should give you enough information to isolate the fault. As the pieces of the puzzle begin to fall into place, identifying the fault becomes easier."], "jumps": ["P1190", "P1172"]}, {"id": "P1174", "text": ["3. Calculate & measure circuit values After determining which section has problem, the fault can be localized."], "jumps": ["P1180", "P1172"]}, {"id": "P1173", "text": ["3.  Calculate & measure circuit values \nChecking the middle of the circuit can help you sectionalize the fault to either the front or back half of the circuit.", "3. Calculate & measure circuit values Checking the middle of the circuit can help you sectionalize the fault to either the front or back half of the circuit."], "jumps": ["P1174", "P1172"]}, {"id": "P1172", "text": ["3.  Calculate & measure circuit values \n     For example, by measuring the input you are ensuring that             there is sufficient power or input signal to drive the circuit.", "3. Calculate & measure circuit values For example, by measuring the input you are ensuring that there is sufficient power or input signal to drive the circuit."], "jumps": ["P1173", "P1160"]}, {"id": "P1170", "text": ["3.  Calculate & measure circuit values \nMake as many measurements as needed.  You should make measurements in  a logical order to help you sectionalize, localize and finally isolate the problem.", "3. Calculate & measure circuit values Make as many measurements as needed. You should make measurements in a logical order to help you sectionalize, localize and finally isolate the problem."], "jumps": ["P1172", "P1160"]}, {"id": "P1160", "text": ["3.  Calculate & measure circuit values \n     Example: - Calculate the TV voltages.  \n                        - Measure the TV voltages. \n                        - Compare the calculated values to the measured                                 values and determine the possible fault.", "3. Calculate & measure circuit values Example: - Calculate the TV voltages. - Measure the TV voltages. - Compare the calculated values to the measured values and determine the possible fault."], "jumps": ["P1170", "P1156"]}, {"id": "P1156", "text": ["3.  Calculate & measure circuit values \n      If more information is needed, make current or resistance                measurements.  Remember, a circuit must be broken to make        these measurements.", "3. Calculate & measure circuit values If more information is needed, make current or resistance measurements. Remember, a circuit must be broken to make these measurements."], "jumps": ["P1160", "P1140", "P1155"]}, {"id": "P1155", "text": ["BREAKING THE CIRCUIT - To interrupt or open the current path between the positive and negative terminal of the power source. Breaking the circuit is usually done by; opening switches, disconnecting cables and wires, or desoldering components. You should desolder and cut wires ONLY when necessary."], "jumps": []}, {"id": "P1150", "text": ["ircuit must be broken to make these measurements.", "3. Calculate & measure circuit values If more information is needed, make current or resistance measurements. Remember, a circuit must be broken to make these measurements."], "jumps": ["P1160", "P1140", "P1155"]}, {"id": "P1145", "text": ["BREAKING THE CIRCUIT - To interrupt or open the current path between the positive and negative terminal of the power source. Breaking the circuit is usually done by; opening switches, disconnecting cables and wires, or desoldering components. You should desolder and cut wires ONLY when necessary."], "jumps": []}, {"id": "P1140", "text": ["3.  Calculate & measure circuit values \n      In most cases, voltage measurements are made first.  Voltage        measurements provide useful information about the circuit             and are made without breaking the circuit .", "3. Calculate & measure circuit values In most cases, voltage measurements are made first. Voltage measurements provide useful information about the circuit and are made without breaking the circuit ."], "jumps": ["P1150", "P1070"]}, {"id": "P1130", "text": ["3. Calculate & measure circuit values Make voltage, current, or resistance measurements. Make the measurement that is most useful, and easiest to make."], "jumps": ["P1140", "P1070"]}, {"id": "P1120", "text": ["3.  Calculate & measure circuit values \n     First, calculate to determine the values that should be present       in a circuit that is working properly.", "3. Calculate & measure circuit values First, calculate to determine the values that should be present in a circuit that is working properly."], "jumps": ["P1130", "P1070"]}, {"id": "P1110", "text": ["2.  Check the setup\nIf you checked the setup and the setup is good, but the circuit still does not operate properly, go on to Step 3.", "2. Check the setup If you checked the setup and the setup is good, but the circuit still does not operate properly, go on to Step 3."], "jumps": ["P1120", "P1070"]}, {"id": "P1100", "text": ["2. Check the setup Example; if the television does not work, check the: * wall plug * channel selector * antenna * volume control * vertical control * horizontal control"], "jumps": ["P1110", "P1070"]}, {"id": "P1090", "text": ["2.  Check the setup\n      If the circuit is not operating properly, check to see if you                overlooked something simple.", "2. Check the setup If the circuit is not operating properly, check to see if you overlooked something simple."], "jumps": ["P1100", "P1070"]}, {"id": "P1080", "text": ["1.  Analyze the circuit \nIf the circuit operates correctly, there is no need to troubleshoot and this would be the last step.  If the circuit does NOT operate correctly, then you must go to the next step.", "1. Analyze the circuit If the circuit operates correctly, there is no need to troubleshoot and this would be the last step. If the circuit does NOT operate correctly, then you must go to the next step."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["1.  Analyze the circuit \n     First, see if the circuit operates correctly.  An example is; a              television should produce a picture and sound when turned          on.", "1. Analyze the circuit First, see if the circuit operates correctly. An example is; a television should produce a picture and sound when turned on."], "jumps": ["P1080", "P1064"]}, {"id": "P1064", "text": ["Troubleshooting is like putting the pieces of a puzzle together. The more pieces you have, the easier the puzzle is to identify."], "jumps": ["P1070", "P1060"]}, {"id": "P1060", "text": ["The following steps should be followed when troubleshooting any circuit.", "The following steps should be followed when troubleshooting any circuit. 1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results", "1. Analyze the circuit 2. Check the setup 3. Calculate & measure values 4. Check the results"], "jumps": ["P1064", "P1052"]}, {"id": "P1056", "text": ["SYSTEMATICAL - If a procedure is systematical, certain steps must be followed. For example, do Step 1, then Step 2, then Step 3, etc. Following the necessary steps insures that you will not overlook anything and you will obtain the best results from your troubleshooting."], "jumps": []}, {"id": "P1055", "text": ["LOGICAL - If a procedure is logical, the procedure shows consistency of reasoning. In other words the procedure makes good common sense."], "jumps": []}, {"id": "P1052", "text": ["To find the problem, the technician must follow a procedure.  The procedure should be logical and systematical.", "To find the problem, the technician must follow a procedure. The procedure should be logical and systematical. Logical Systematical"], "jumps": ["P1060", "P1040"]}, {"id": "P1050", "text": ["To find the problem, the technician must follow a procedure.  The procedure should be logical and systematical.", "To find the problem, the technician must follow a procedure. The procedure should be logical and systematical."], "jumps": ["P1060", "P1040"]}, {"id": "P1040", "text": ["The main reason why a technician is asked to look at a circuit is to fix it when it is not operating properly."], "jumps": ["P1050", "P1001"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P470", "text": ["Let's begin the lesson on BASIC WIRING & CONNECTOR TROUBLESHOOTING THEORY."], "jumps": ["P460"]}, {"id": "P460", "text": ["Learning to troubleshoot is important to become a good technician.  A technician knows how a circuit works and knows how to fix the circuit when it does not work.", "Learning to troubleshoot is important to become a good technician. A technician knows how a circuit works and knows how to fix the circuit when it does not work."], "jumps": ["P470", "P435"]}, {"id": "P450", "text": ["Your knowledge of how a good circuit operates will help you identify a circuit that is not operating properly."], "jumps": ["P460", "P435"]}, {"id": "P445", "text": ["Logical troubleshooting takes less time and the results are more predictable."], "jumps": ["P450", "P435"]}, {"id": "P440", "text": ["With the complex circuits in use today, logical troubleshooting procedures must be followed.", "As circuits became more complex and were connected over long distances, the trial and error method of troubleshooting required too much time."], "jumps": ["P445", "P435", "P440", "P430"]}, {"id": "P430", "text": ["When electronic circuits were very simple and contained only a few components, trial and error was an effective troubleshooting technique."], "jumps": ["P435", "P427"]}, {"id": "P427", "text": ["There are two methods to troubleshoot a circuit;\n trial and error or logical procedure.", "There are two methods to troubleshoot a circuit; trial and error or logical procedure."], "jumps": ["P430", "P400"]}, {"id": "P426", "text": ["LOGICAL PROCEDURE - Using a logical process you do Step 1, then Step 2, and so on, until you know what part is bad."], "jumps": []}, {"id": "P425", "text": ["TRIAL AND ERROR - Using the trial and error method, you replace each part in the circuit until you find the bad part."], "jumps": []}, {"id": "P420", "text": ["There are two methods to troubleshoot a circuit;\n trial and error or logical procedure.", "There are two methods to troubleshoot a circuit; trial and error or logical procedure."], "jumps": ["P430", "P400"]}, {"id": "P410", "text": ["You need to learn how to troubleshoot so you can fix circuits that do not operate properly."], "jumps": ["P420", "P400"]}, {"id": "P400", "text": ["Troubleshooting circuits sounds complicated but troubleshooting is nothing more than finding a problem."], "jumps": ["P410", let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
