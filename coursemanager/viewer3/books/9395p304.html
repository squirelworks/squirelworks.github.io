const book = {"title": "9395p304", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: THE MOTHERBOARDsdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose and function of the CPU. w Describe the purpose and function of the Chipset. w Describe the purpose and function of the ROM BIOS. w Describe the purpose and function of the Memory. w Describe the purpose and function of the Input/Output Ports. w Describe Buses.....uses.uses.................", "w Define Form Factor. w Describe Legacy Form Factors. w Describe Contemporary Form Factors."], "jumps": []}, {"id": "P300", "text": ["In this lesson you will learn about the computer's motherboard and the major components that are associated with it.", "The motherboard is sometimes called the heart of the computer because all the components which are needed for the computer to function are either located on the motherboard or are attached to it in some way..."], "jumps": ["P410", "P300", "P420", "P400"]}, {"id": "P420", "text": ["We'll be discussing some of the major components that are located on it, and we'll also discuss some of the different styles of motherboards that have been used and the ones most commonly in use today..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on THE MOTHERBOARD................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["A motherboard is a Printed Circuit Board (PCB) with an array of components attached.", "The motherboard has either a socket or a slot into which the CPU (Central Processing Unit) is inserted. If the motherboard is the heart of the PC, then the CPU is the brain. It is the single most important chip in the computer.puter.."], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["Modern processors contain millions of transistors, which are etched onto a tiny square of silicon called a die."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The CPU performs the system's calculating and processing. Older systems included a separate chip (called a coprocessor) to handle certain specialized tasks, but modern CPUs incorporate those functions into the main processor...", "The chipset set is a set of chips which provide the interface between the CPU and the rest of the machine. There are two different types of chipset architecture: the North/South Bridge type and the Hub type. Hub type."], "jumps": ["P1060", "P1020", "P1070"]}, {"id": "P1070", "text": ["The North Bridge is the connection (or bridge) between the main processor bus and the relatively slower AGP and PCI buses, as well as to the system RAM, the South Bridge and the rest of the I/O......."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The South bridge is the connection between the PCI bus and the even-slower ISA bus. It also contains the IDE and USB controllers, as well as the link to the built-in I/O, such as serial and parallel ports, floppy disk controller, and keyboard and mouse interfaces..", "Memory Controller Hub (MCH) - This hub takes the place of the North Bridge in providing connection between the processor and memory."], "jumps": ["P1090", "P1060", "P1100"]}, {"id": "P1100", "text": ["I/O Controller Hub - This hub takes the place of the South Bridge in providing connection to the I/O."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["The biggest difference between Bridge and Hub is that the hub architecture uses a dedicated chip as a hub interface instead of using the PCI bus, the way that the Bridge architecture does.", "This makes a huge difference in all around performance, because the hub is significantly faster in its performance and it doesn't use any of the PCI bus bandwidth, so that all PCI activity is effectively speeded up.", "ROM BIOS - The BIOS (Basic Input/Output System) is a set of instructions which tell the CPU how to access the devices that let it communicate with the outside world. It consists of both hardware (ROM chips) and software (device drivers, sometimes called drivers).ers).)."], "jumps": ["P1120", "P1060", "P1130", "P1140"]}, {"id": "P1140", "text": ["The ROM contains instructions that are hard-wired, i.e. they don't go away when the power is turned off, so they're there and available to be used as soon as power is applied to the machine. These instructions are then used to start up, or boot the machine..."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Once these instructions are loaded, the machine knows, among other things, how to talk to its peripherals."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Once it knows that, it can go out, find the operating system software, and load it along with the drivers, which are the software component of the BIOS. Then it's ready to load the application programs..", "RAM - Random Access Memory is the computer's working memory. This is where the operating system, application software, and data are kept while the machine is running.", "The motherboard contains the sockets or slots where the memory plugs in.", "In very old systems, the memory consisted of individual chips which plugged into rows of sockets directly on the motherboard. Most modern systems use memory modules (actually small printed circuit boards with several chips on them) which plug into memory slots....", "The old individual chips were called DIPs (Dual In-line Package). They were replaced by SIMMs (Single In-line Memory Module), which have since been superceded by DIMMs (Dual In-line Memory Modules)..."], "jumps": ["P1170", "P1130", "P1180", "P1190", "P1200", "P1210"]}, {"id": "P1210", "text": ["DRAM (Dynamic RAM) is the kind used for the computers main memory. It is very high in density ( a lot of data can fit in a physically small space), but also relatively low speed....", "There are two different kinds of RAM found on the motherboard: DRAM and SRAM.", "SRAM (Static RAM) is relatively low in density but is very high in speed.ed."], "jumps": ["P1190"]}, {"id": "P1220", "text": ["Cache - The CPU runs many times faster than even the fastest DRAM, so in order to allow the CPU to run efficiently, faster SRAM is used to store (or cache) frequently-used instructions and data. Cache is special area of memory reserved to hold data and instructions recently accessed from another location."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Most systems these days use two levels of cache: Level 1 (L1) and Level 2 (L2)."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["L1 cache is part of the same die as the main processor itself. Since it's on the same die, the access time is very small, and since it's very fast RAM to begin with, it enables the CPU to function at full speed..."], "jumps": ["P1250", "P1210"]}, {"id": "P1250", "text": ["This is especially important these days, with CPU speeds on the rough order of a thousand times as high as they were in the first personal computers."], "jumps": ["P1260", "P1210"]}, {"id": "P1260", "text": ["L2 cache originally resided on the motherboard, immediately adjacent to the main processor socket. It was a larger cache than the L1, but it was slower since it could only send its data out at motherboard speeds...", "These days it is usually located in the chip with the main processor and the L1 cache, which enables systems to run even faster."], "jumps": ["P1250", "P1271", "P1260"]}, {"id": "P1271", "text": ["Which type of RAM does the computer use for MAIN memory?..."], "jumps": ["P1260"]}, {"id": "P1272", "text": [], "jumps": []}, {"id": "P1273", "text": ["DRAM (Dynamic RAM) is the kind used for the computers main memory. It is very high in density (a lot of data can fit in a physically small space), but also relatively low speed......", "Static RAM is used for Cache Memory, not Main Memory.......", "SRAM (Static RAM) is relatively low in density but is very high in speed..ed.", "Read-Only Memory can't be used for Main Memory because the computer has to be able to write to Main Memory."], "jumps": []}, {"id": "P1275", "text": ["Which type of RAM does the computer use for CACHE memory?.."], "jumps": ["P1271"]}, {"id": "P1276", "text": ["Non-volatile RAM is only used to hold hardware configuration settings."], "jumps": []}, {"id": "P1278", "text": ["Dynamic RAM is used for Main Memory. It is too slow to use for Cache Memory.", "DRAM (Dynamic RAM) is the kind used for the computers main memory. It is very high in density (a lot of data can fit in a physically small space), but also relatively low speed......", "SRAM (Static RAM) is relatively low in density but is very high in speed..ed.", "I/O Ports - There are several I/O (input/output) ports which are an essential part of an operating computer. These are the connections between the computer and the rest of the world."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Serial port - the serial port is used primarily for communication with other computers, but it can also be used for connection to certain printers and plotters, instrumentation, and various types of control devices."], "jumps": ["P1280", "P1300"]}, {"id": "P1300", "text": ["Parallel port - The parallel port was originally the exclusive purpose of sending data to the printer, but contemporary versions have been enhanced to allow it to perform additional functions, such as connection to certain types of LANs, disks, cameras, and so on.ameras, and so on."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Keyboard - older systems used a 5-pin DIN socket, but most newer systems use either the 6-pin mini-DIN socket (usually called a PS/2 port) or a USB connector. Some systems use an infrared port, called an IrDA (for Infrared Data).."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["PS/2 - the PS/2 port uses a 6-pin mini-DIN socket. It was originally developed for the IBM PS/2 system, but is used on newer systems for keyboards, mice, and other input and pointing devices."], "jumps": ["P1321", "P1310"]}, {"id": "P1321", "text": ["Which type of connector might be used by a modern computer as a keyboard connector?"], "jumps": ["P1310"]}, {"id": "P1322", "text": [], "jumps": []}, {"id": "P1323", "text": ["DIN5 connectors were used by older systems, but are not used by newer ones."], "jumps": []}, {"id": "P1324", "text": ["A DB-25 Male connector on the back of a computer would be an older serial port, not a keyboard port."], "jumps": []}, {"id": "P1330", "text": ["Buses - A bus is a common electrical pathway across which data can travel within a computer. All of the various components on the motherboard communicate across buses of one sort or another. The buses themselves are controlled by the chipset.."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["Processor Bus - this is the highest speed bus in the computer. It is the bus that is used to pass data back and forth between the processor and the cache memory, and between the processor and the North Bridge of the chipset.."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Local Bus - The local bus directly connects to the processor and shares its full speed and data transfer width (that is, a 64-bit processor will have a 64-bit local bus instead of a 32- or 16-bit bus). Most commonly it is used to support cache RAM and high speed graphics....."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The chipset then passes the data to and from the main system memory, to other buses, or to the South Bridge."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["PCI Bus - this bus is generated by the North Bridge and is used to communicate with the I/O cards in the PCI slots and with the South Bridge."], "jumps": ["P1380", "P1340"]}, {"id": "P1380", "text": ["The AGP bus is the specialized bus is used to carry data for the Accelerated Graphics Port. It is based on PCI but includes some additional signals and doesn't support any other components; it is completely independent of the PCI bus."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["The Memory bus is used exclusively to transfer data between the RAM and the CPU. It is attached to the chipset North Bridge or the Memory Control Hub, depending on the type of architecture used on the motherboard.rboard.."], "jumps": ["P1400", "P1340"]}, {"id": "P1400", "text": ["The ISA bus is the oldest of the major types of I/O buses. ISA stands for Industry Standard Architecture, and although the bus and adapter cards have been far surpassed by newer buses and cards, there are still some in use today.ay.."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Although they lack the speed of more modern components, they are still capable of providing useful I/O, especially in situations where very high speeds aren't really necessary."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The MCA bus was developed by IBM as a replacement for the ISA bus, the Micro Channel Architecture Bus was faster and more powerful than ISA and far easier to set up and use: there are no switches or jumpers involved whatsoever."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The only reason that MCA didn't take the industry by storm was that IBM decided that they wanted to receive royalties for its use, so they kept it as a proprietary system."], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["The licensing agreements included retroactive royalties for the ISA bus as well. This did not go over well; industry ignored the new bus rather than pay the licensing fees."], "jumps": ["P1450", "P1400"]}, {"id": "P1450", "text": ["The EISA Bus (Extended Industry Standard Architecture) was developed in response to IBM's introduction of the MCA bus. Originally developed by Compaq, it was released as an open standard in order to ensure that vendors would support it.."], "jumps": ["P1460", "P1400"]}, {"id": "P1460", "text": ["Unfortunately, it just never caught on and few adapter cards were ever developed. Most of the cards that were produced were disk array and server network cards, so there was a niche market, but that was all..."], "jumps": ["P1470", "P1400"]}, {"id": "P1470", "text": ["One of the most important features of the new bus was the ability of the slot to accommodate either the older ISA cards or the newer EISA cards, and most EISA slots ended up being used with older ISA cards..."], "jumps": ["P1480", "P1400"]}, {"id": "P1480", "text": ["The USB (Universal Serial Bus) is becoming the most popular expansion bus ever invented. USB version 1.x offers speeds of up to 12 Mbits/second, and version 2.x can go as high as 480 Mbits/second..", "USB offers a long list of improvements over existing expansion buses. For instance, the bus can include up to 127 different devices simultaneously, although this bandwidth is shared among all the peripherals connected..."], "jumps": ["P1490", "P1400", "P1500", "P1480"]}, {"id": "P1500", "text": ["For another thing, it acts to consolidate all I/O devices, so many different kinds of devices can be connected, such as disk drives, mice and other pointing devices, keyboards, scanners, printers, and so on..."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The peripherals are hot-swappable, meaning they can be connected or disconnected while the system and the peripheral are both powered on, without any need to restart. They are automatically recognized and configured as soon as they are physically connected.onnected..", "They all share the same set of system resources; under any previous bus architecture they would each require a separate share of the system's resources. They also don't require separate slots on the motherboard. In fact, some act as hubs, providing connection points for other peripherals..."], "jumps": ["P1520", "P1490", "P1530"]}, {"id": "P1530", "text": ["IEEE-1394 - this bus, known as either FireWire or i.Link, was originally developed by Apple Computer and was turned over to the Institute of Electrical and Electronic Engineers in late 1995."], "jumps": ["P1540", "P1490"]}, {"id": "P1540", "text": ["The original version offered connectivity of 100, 200, or 400 Mbits per second. It is expected that second-generation standards will reach the gigabit range. Because of the enormously fast transfer rates, it has gained popularity for use with digital video and multimedia..."], "jumps": ["P1530"]}, {"id": "P1550", "text": ["The PCMCIA (PC-Card) bus standard is maintained by the Personal Computer Memory Card International Association and is primarily aimed at the portable computing arena.na."], "jumps": ["P1530", "P1560", "PC"]}, {"id": "P1560", "text": ["PC cards are about the size of a credit card and are intended to fit into a small slot on a laptop or notebook computer in order to add expansion capabilities to computers which, by design, have no extra room inside for expansion..."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["They can be used to expand memory, to add fax/modem capability, network interface adapters, disk drive adapters, or whatever is needed.", "The last motherboard component to mention is the battery. The battery provides the power to maintain the system configuration settings which are kept in non-volatile memory, known as NVRAM, and to maintain the system clock, called the Real Time Clock.ime Clock.."], "jumps": ["P1580", "P1550", "P1590"]}, {"id": "P1590", "text": ["The NVRAM keeps track of such things as the size and type of hard disk and Plug-and-Play information necessary for the system to start up, but that can't be efficiently stored in the ROM BIOS because of the need to occasionally change the information..y change the information."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["The NVRAM is frequently referred to as the CMOS, which stands for Complimentary Metal Oxide Semiconductor. It is named for the material used in the construction of the chip itself.nd the battery is often referred to as the CMOS battery."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["The battery is often referred to as the CMOS battery. Lithium batteries are generally used because of their long life.w power-consumption situation..n situation."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["Some systems use a chip that has the battery built in. The chip is socketed so that it can be replaced in the event of failure, but the normal life expectancy of the batteries used in these chips is at least ten years or more - longer than the life expectancy of the computer itself.."], "jumps": ["P1910", "P1620"]}, {"id": "P1910", "text": ["This completes the information on COMPONENTS. TITLE........", "1. The CPU is the chip that performs all of the system's calculations and processing..", "2. The chipset controls the buses and acts as the interface between the processor and the rest of the system.", "3. The BIOS (Basic Input/Output System) is the set of instructions which tells the CPU how to access the devices that let it communicate with the outside world."], "jumps": ["P1001", "P1580", "P1930", "P1940", "P1920", "P1950"]}, {"id": "P1950", "text": ["4. The ROM contains instructions that are hard-wired, i.e. they don't go away when the power is turned off, so they're there and available to be used as soon as power is applied to the machine...", "5. Random Access Memory (RAM) is the computer's working memory."], "jumps": ["P1960", "P1920", "P1970"]}, {"id": "P1970", "text": ["6. A bus is a common electrical pathway across which data can travel within a computer.", "7. The Universal Serial Bus can include up to 127 different devices simultaneously. 8. USB peripherals can be connected or disconnected while the system and the peripheral are both powered on, without any need to restart.", "9. The battery provides the power to maintain the system configuration settings which are kept in Non-Volatile memory, known as NVRAM, and to maintain the system clock, called the Real Time Clock."], "jumps": ["P1980", "P1960", "P1990", "P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": ["The motherboard is the main printed circuit board in an electronic device, particularly a computer. It's called a motherboard because it contains sockets (called slots) that accept additional circuit boards, known as daughter-boards."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The reason that the motherboard is sometimes referred to as the heart of the personal computer is because all of the basic circuitry and components required for a PC to function are either contained on the motherboard or attached to it in some way..."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The motherboard typically contains the CPU, the buses, memory slots, expansion slots, I/O ports, and peripheral controllers."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The motherboard may also be referred to as the main board, system board, or logic board. Regardless of what you call it, it is the central component that ties together everything in the PC.PC.."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["A number of factors go into determining which motherboard is used:", "CPU - type and speed ROM BIOS Chipset Bus types and sizes Secondary cache type I/O Ports Expansion slots - number and types Case and Power Supply RAM - type, number of slots, and maximum amount Riser card or backplane Proprietary video, memory, or peripheral device controllersssdevice controllers", "The motherboard's general size, layout, and component placement make up what is known as the form factor. The example shown is an ATX board, which is the most common form factor, but there are several other standard dimensions available..."], "jumps": ["P2070", "P2020", "P2080", "P2060"]}, {"id": "P2080", "text": ["AT Baby AT ATX Mini-ATX Micro-ATX FlexATX LPX Mini LPX NLX", "Advances in computer technology are reflected in advances in motherboard design. Let's compare some of the various motherboard configurations and their effects on system compatibility and capabilities...", "12\" 8.5\" 12\" 11.2\" 9.6\" 9.0\" 9.0\" 8 - 9\" 8 - 9\"X NLXNLXNLX", "11 - 13\" 10 - 13\" 9.6\" 8.2\" 9.6\" 7.5\" 11 - 13\" 10 - 11\" 10 - 13.6\"", "Very old PCs Older PCs Newer PCs Newer PCs Specialty PCs Specialty PCs Older PCs Older PCs Newer PCs", "Full AT, Full Tower All but Slimline, ATX ATX ATX Slimline Custom Design Slimline Slimline Slimlineser PCser PCser PCs", "Style Width Depth Where Found Case & Power Supplyyy"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["PC/XT- The XT motherboard form factor is long since obsolete. The original IBM PC used the XT form factor."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["PC/AT- The AT form factor is the oldest and physically the largest form factor still in use. It was popular until the Baby AT was released, which was around the time of the 80386 processor (386)...", "Designed for the IBM AT - only fits into size AT or tower cases.", "Can be difficult to install, service, and upgrade.r tower cases.", "Keyboard connector: Din5 ( larger 5-pin connector)", "Two Power Connectors in a single row providing + 5V, + 12V, and ground"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Baby AT- The baby AT was the standard in the PC industry from roughly 1993 to 1997. There are still some in use today, mainly in older Pentium class computers.", "Similar to the XT form factor (modified mounting screw holes to fit AT style cases).", "Specific placement of the keyboard and the I/O slots", "Keyboard connector: Din5 (AT) or Mini Din6 (PS/2)", "Two Power Connectors in a single row providing + 5V, + 12V, and ground will not fit into a slimline case."], "jumps": ["P2120", "P2100", "PS"]}, {"id": "P2120", "text": ["Some issues exist with the AT and Baby AT design. The CPU socket is often placed where it interferes with longer expansion cards. Some versions place memory modules in likewise inappropriate positions..."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["This can limit the use of the expansion slots by limiting the selection of expansion cards that can fit into those particular slots."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Additionally, the I/O ports are separate, being mounted on the case and connected with ribbon cables to pins on the motherboard. These are frequently located near the floppy drive and hard drive connectors, which can result in a jumble of ribbon cables..."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["LPX - The LPX was developed by Western Digital, but was adopted by many manufacturers. Used mostly by OEM manufacturers in slimline cases, it is being replaced by the NLX.", "Two Power Connectors in a single row providing + 5V, + 12V, and ground...ll not fit into a slimline case.", "Expansion slots located on a \"riser card\"..nting screw holes to fit AT style cases).", "Keyboard connector: Mini Din6 (PS/2).ni Din6 (PS/2)", "Changed locations of video, parallel, serial and PS/2 connections."], "jumps": ["P2160", "P2140", "PS"]}, {"id": "P2160", "text": ["The official ATX specifications were released by Intel in 1995 and were revised to version 2.01 in February 1997........", "Floppy /IDE connectors close to peripheral bayss"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The ATX form factor corrects some design flaws of the AT form factor, such as conflicts in component location, and makes allowances for upgrades to incorporate newer technologies."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The ATX form factor was designed to address four areas of improvement:", "Enhanced ease of use Better support for current and future processor technology Better support for current and future I/O Reduced total system cost", "The ATX motherboard requires a specific case and power supply design. It is similar to a Baby AT rotated 90 degrees, with a new mounting configuration and connector for the power supply."], "jumps": ["P2190", "P2160", "P2200", "P2180"]}, {"id": "P2200", "text": ["The processor is relocated away from the expansion slots, allowing them to hold full-length add-in cards (adapters, expansion cards, etc.). With the longer side of the board facing the rear panel, the layout allows for more expansion slots..."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The original ATX power supply pulled air into of the chassis and pushed it throughout the chassis and across the processor, rather than exhausteing air out of the chassis.."], "jumps": ["P2220", "P2190"]}, {"id": "P2220", "text": ["This design innovation didn't work out as planned, because the air flow was already warmed by its trip through the power supply before it ever got near the main processor. Newer power supplies have gone back to the older technique of exhausting the air instead of pulling it in..n.", "The ATX standard also specifies a single power supply connector for the motherboard. The connector is keyed and shrouded to prevent accidental reversal or misalignment..", "This is a relief for the average end user, who previously had to worry about interchanging the power supply connectors and subsequently damaging the motherboard."], "jumps": ["P2230", "P2210", "P2240", "P2250"]}, {"id": "P2250", "text": ["One Power Connector providing + 3V, + 5V + 12V, and ground. ground....ll not fit into a slimline case.", "The connector also has pins for supplying +3.3 V to the motherboard, which means that ATX motherboards don't require built-in voltage regulators, eliminating one possible source of component failure...", "Keyboard connector: Mini Din6 (PS/2)ini Din6 (PS/2)"], "jumps": ["P2260", "P2240", "PS"]}, {"id": "P2260", "text": ["Mini ATX - The Mini ATX is basically the same as the ATX, but in a slightly smaller size (11.2\" wide x 8.2\" deep instead of 12\" x 9.6\")."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The MicroATX developed as a natural evolution of the ATX form factor to address new market trends and technologies, the microATX supports:::", "Current processor technologies. The transition to newer processor technologies. AGP high performance graphics. Smaller motherboard size (with fewer expansion slots available). A smaller power supply.."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["The FlexATX is derived from the microATX design. It offers the opportunity for system developers to be creative with new PC designs..designs.", "Supports current socketed processor technologies (no Slot 1, Slot A, ect.). Keeps designs small. Smaller motherboard size. Same mounting holes as microATX. ATX 2.03 I/O panel.vailable) Smaller power supplye) Smaller power supply"], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["FlexATX was designed to allow flexibility for customized case and board designs to be manufactured, such as all-in-one computing devices, LCD-personal computers or standard desktop systems..."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["The NLX form factor is a new low-profile motherboard standard, introduced by Intel in 1999 to replace the LPX. It is similar to the LPX, but includes several improvements."], "jumps": ["P2310", "P2280", "P"]}, {"id": "P2310", "text": ["It supports motherboard dimensions of 8.0\" - 9.0\" x 10.0\"- 13.6\" and segregates taller components on the left, allowing expansion slots (which are located on a riser card at the right edge of the motherboard) to hold full-length add-in cards."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["It was designed for the Pentium II CPU as well as future (socketed) processors, and it supports AGP high performance graphics, Universal Serial Bus, and tall memory technologies (DIMMs)..."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["It allows easier access to internal components, with improved thermal and clearance issues regarding CPU. Also, the I/O connectors are stacked single and double high at the back of the motherboard to support more connectors...", "A new, convenient feature is the Tool-less architecture, which allows removal without the use of tools. In this unique set-up, the riser card (normally a daughter card) is fastened to the chassis, while the motherboard slides into a slot at the bottom of the riser...", "With the covers off, the motherboard slides out the side of the chassis while the riser card and the expansion cards stay put.."], "jumps": ["P2340", "P2300", "P2350"]}, {"id": "P2350", "text": ["NLX is an open specification, intended for widespread use in many types of systems, and several major PC vendors have worked jointly to define it and to incorporate flexibility to accommodate the best designs for current and future PCs..."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["High-capacity power supplies (up to 850 W). Easy access to memory and expansion slots. Flex Slot I/O cards (double-wide PCI cards) - allows normal I/O to be moved further from the main processor, chipset, and RAM to help minimize EMI (electromagnetic interference).", "The last new form factor that we'll examine is the WTX board. It was developed primarily for mid-range workstations, not for lower-end stand-alone personal computers..ters.", "Up to 14\" wide by up to 16.75\" long (no mimimums specified).", "Designed to support future processor, graphics, and memory technologies, (32-and 64-bit).", "Tower chassis or rackmount capabilities.."], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["Unlike other standards, WTX doesn't physically define the size and shape of the board. Instead, it specifies that the motherboard interfaces with the chassis via a standardized mounting adapter, which must be supplied with the motherboard."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["The WTX standard also defines some required features of the chassis itself, such as swing-out doors and slide-out drawers for access to internal components."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["What is the purpose of the slots on the motherboard?......."], "jumps": ["P2360"]}, {"id": "P2391", "text": ["The Chipset does not need a slot. It is normally soldered directly to the motherboard.", "A slot on a motherboard is not a ventilation hole, and the CPU is cooled by a fan."], "jumps": []}, {"id": "P2400", "text": ["What feature of the ATX power connector is an improvement over the older style power connector?", "It's soldered to the board, so it can't accidentally come loose.", "It uses larger pins which can carry more current.", "It's keyed and shrouded, so it can't be plugged in backwards."], "jumps": ["P2390"]}, {"id": "P2401", "text": ["Power supply connectors are never soldered to the board....", "The ATX Power connector pins are no larger than other power connector pins."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on FORM FACTORS.ITLE........"], "jumps": ["P2001", "P2400"]}, {"id": "P2920", "text": ["1. The motherboard contains sockets that accept additional circuit boards (known as daughter-boards), and all of the basic circuitry and components required for a PC to function are either contained on it or attached to it in some way.", "1. The motherboard contains sockets that accept additional circuit boards (known as daughter-boards), and all of the basic circuitry and components required for a PC to function are either contained on it or attached to it in some way...", "Floppy /IDE connectors close to peripheral bayss"], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The motherboard typically contains the CPU, the buses, memory slots, expansion slots, I/O ports, and peripheral controllers.", "Floppy /IDE connectors close to peripheral bayss"], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. The form factor comprises the motherboard's general size, layout, and component placement. 4. The ATX board is the most common form factor............"], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["Enhanced ease of use. Better support for current and future processor technology. Better support for current and future I/O. Reduced total system cost.", "5. The ATX form factor corrects some design flaws of the AT form factor such as conflicts in component location, and addresses four areas of improvement:::", "6. The ATX is similar to a Baby AT rotated 90 degrees, with a new mounting configuration and connector for the power supply."], "jumps": ["P2960", "P2920", "P2970", "P2950"]}, {"id": "P2970", "text": ["7. The processor in an ATX motherboard is relocated away from the expansion slots, allowing them to hold full-length add-in cards. 8. With the longer side of the board facing the rear panel, the layout of an ATX allows for more expansion slots.", "9. ATX motherboards don't require built-in voltage regulators because the connector has pins to supply +3.3 V directly to the motherboard.", "10. NLX is an open specification, similar to the LPX but supporting larger motherboards. 11. Taller components are segregated on the left; with a riser card at the right edge, this allows expansion slots to hold full-length cards........."], "jumps": ["P2980", "P2960", "P2990", "P2999", "P"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["It performs the system's calculating and processing.", "It provides a place to connect the keyboard."], "jumps": []}, {"id": "P10211", "text": ["It provides the interface between the CPU and the rest of the system.", "It contains the instructions that tell the CPU how to access the peripherals."], "jumps": []}, {"id": "P10212", "text": ["Short for BIOSphere, the artificial intelligence program that runs the computer.", "The chip which contains the virus checker and similar software.", "The chip that contains the clock generator.", "The set of instructions that tells the CPU how to access the devices that let it communicate with the rest of the world."], "jumps": []}, {"id": "P10213", "text": ["The set of instructions that are hardwired so that they don't go away when the machine is turned off."], "jumps": []}, {"id": "P10214", "text": ["The set of instructions that the computer uses to start up.", "The installation procedure for a disk drive.", "The set of instructions that tells the CPU where the software is located."], "jumps": []}, {"id": "P10215", "text": ["What is the purpose of a bus on a motherboard?", "The bus is not found on the motherboard. It is contained in an external case.", "Provides a common electrical pathway across which data can travel within a computer.", "To connects the motherboard to the power supply.", "It determines the type of socket used for the chipset."], "jumps": []}, {"id": "P10216", "text": ["Only 1, each device requires its own individual bus.", "How many devices can be connected to a Universal Serial Bus?"], "jumps": []}, {"id": "P10217", "text": ["How many Universal Serial Bus components can be added before restarting the system?", "There is no need to restart the system after adding USB components.", "The system must be shut down prior to adding USB components, so the system just starts up with the new component in place already.", "One, the system must be restarted after each component is added."], "jumps": []}, {"id": "P10218", "text": ["Provides power to the NVRAM to maintain configuration settings during shutdown.", "What is the purpose of the battery on the motherboard?"], "jumps": []}, {"id": "P10219", "text": ["Which is not a component that might be connected to a Universal Serial Bus?"], "jumps": []}, {"id": "P10220", "text": ["Where would a daughter card be installed on a computer system?"], "jumps": []}, {"id": "P10221", "text": ["Which group of items would normally be found on a motherboard?"], "jumps": []}, {"id": "P10222", "text": ["The motherboard's form factor includes ________", "CPU speed, amount of RAM, and component placement.", "general size, amount of RAM, and component placement.", "general size, layout, and component placement."], "jumps": []}, {"id": "P10223", "text": ["Which is the most common form factor presently in use?"], "jumps": []}, {"id": "P10224", "text": ["What kind of design flaw of the AT form factor does the ATX form factor correct?", "The AT corrects flaws in the ATX, not the other way around."], "jumps": []}, {"id": "P10225", "text": ["single integrated power connector which includes pins for +3.3 V.", "One major improvement in the ATX form factor over the Baby AT is _______"], "jumps": []}, {"id": "P10226", "text": ["On the Baby AT motherboard, the CPU interfered with the installation of a full-sized expansion card.", "Why was the location of the CPU changed on the ATX motherboard?", "To keep it closer to the memory bus for faster operations.", "Not enough room in the original location for larger CPUs."], "jumps": []}, {"id": "P10227", "text": ["To keep the processor away from the power supply due to heat build-up.", "It isn't. The ATX is identical in placement to the Baby AT.", "More space available for expansion slots."], "jumps": []}, {"id": "P10228", "text": ["Why is there no +3.3 V regulator on the ATX motherboard?", "In an ATX system, the power connector has separate pins for +3.3 V directly from the power supply."], "jumps": []}, {"id": "P10229", "text": ["What form factor is the current standard for low-profile (slim-line) cases?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 50%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "PINFO", "text": ["06-21-01 Converted from sty to tbk. frieda 06-21-01 Text and Branching. frieda 06-28-01 Graphics. Alexis 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-13-02 Review of Conversion. Alexis 04-16-02 Review - lisa 05-01-02 Made changes to pages 2280, 2300 per Ira. frieda"], "jumps": []}, {"id": "PQINFO", "text": ["Page # Test# Question# HelpPage # 10210 1 110 1050 10211 1 111 1060 10212 1 112 1130 10213 1 113 1140 10214 1 114 1170 10215 1 115 1330 10216 1 116 1490 10217 1 117 1510 10218 1 118 1580 10219 1 119 1500 10220 2 120 2020 10221 2 121 2040 10222 2 122 2070 10223 2 123 2070 10224 2 124 2170 10225 2 125 2250 10226 2 126 2200 10227 2 127 2200 10228 2 128 2250 10229 2 129 2300", "Page # Test# Question# HelpPage # 10210 1 110 1050 10211 1 111 1060 10212 1 112 1130 10213 1 113 1140 10214 1 114 1170 10215 1 115 1330 10216 1 116 1490 10217 1 117 1510 10218 1 118 1580 10219 1 119 1500 10220 2 120 2020 10221 2 121 2040 10222 2 122 2070 10223 2 123 2070 10224 2 124 2170 10225 2 125 2250 10226 2 126 22 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
