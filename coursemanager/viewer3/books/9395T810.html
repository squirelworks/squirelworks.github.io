urn the equipment to its proper                  storage location.", "2. Remove all cards and return the equipment to its proper storage location."], "jumps": ["P13910", "P13820"]}, {"id": "P2730", "text": ["Let's correct this error and see if the correct answer is generated.", "1.  Set the Console Power Switch to OFF.", "1. Set the Console Power Switch to OFF.FF................................."], "jumps": ["P2740", "P2710"]}, {"id": "P2260", "text": ["This program demonstrates the different types of programming errors and the debugging processes used to correct them.", "This program demonstrates the different types of programming errors and the debugging processes used to correct them. TSelect table to ses Program 1."], "jumps": ["P2270", "P2250"]}, {"id": "P13807", "text": ["People definitely have the need for breakpoints.  They are useful in determining error in code.", "People definitely have the need for breakpoints. They are useful in determining error in code."], "jumps": []}, {"id": "P2050", "text": ["You will first use a step-by-step procedure in which different debugging techniques will be applied.  Following the debugging exercise, you will create a program based on three tasks the program must perform.", "You will first use a step-by-step procedure in which different debugging techniques will be applied. Following the debugging exercise, you will create a program based on three tasks the program must perform."], "jumps": ["P2060", "P2040"]}, {"id": "P13805", "text": ["Are breakpoints a useful tool in programming?", "Are breakpoints a useful tool in programming?..............", "No, most people don't use it because they have no need for them.I", "Yes, because breakpoints save stack values in them."], "jumps": ["P13800"]}, {"id": "P2550", "text": ["You should see the \"divide-by-zero\" error again.  This indicates that the first division is the instruction causing the fault.", "You should see the \"divide-by-zero\" error again. This indicates that the fir               130A should indicate 5 Volts.", "6. Set the Positive Supply Control to 5. The Voltmeter on the 130A should indicate 5 Volts."], "jumps": ["P2070"]}, {"id": "P2073", "text": ["5.  Using the 20-pin long cable, connect PC3 J2 and PC130-404          J1 together.  Be sure to connect pin 1 of the cable with pin 1 of      the circuit cards by aligning them with the red wire on the               cable.", "5. Using the 20-pin long cable, connect PC3 J2 and PC130-404 J1 together. Be sure to connect pin 1 of the cable with pin 1 of the circuit cards by aligning them with the red wire on the cable."], "jumps": ["P2080", "P2070"]}, {"id": "P2072", "text": ["4.  Using the 20-pin short cable, connect PC2 J2 and PC3 J1                together.  Be sure to connect pin 1 of the cable with pin 1 of           the circuit cards by aligning them with the red wire on the               cable.", "4. Using the 20-pin short cable, connect PC2 J2 and PC3 J1 together. Be sure to connect pin 1 of the cable with pin 1 of the circuit cards by aligning them with the red wire on the cable."], "jumps": ["P2073", "P2070"]}, {"id": "P2071", "text": ["3.  Using the 50-pin short cable, connect PC1 J1 and PC2 J2                together.  Be sure to connect pin 1 of the cable with pin 1 of           the circuit cards by aligning them with the red wire on the               cable.", "2.  Carefully plug the PC130-468 card into the PC1 position, the           PC130-403 in the PC2 position, the PC130-401 in the PC3                position, and the PC130-404 unit in front of the PC3 card                 position.", "3. Using the 50-pin short cable, connect PC1 J1 and PC2 J2 together. Be sure to connect pin 1 of the cable with pin 1 of the circuit cards by aligning them with the red wire on the cable.", "2. Carefully plug the PC130-468 card into the PC1 position, the PC130-403 in the PC2 position, the PC130-401 in the PC3 position, and the PC130-404 unit in front of the PC3 card position."], "jumps": ["P2072", "P2070", "P2071", "P2060"]}, {"id": "P2770", "text": ["Check your code carefully; people don't like to find bugs in software they have purchased.", "1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2780", "P2760"]}, {"id": "P2050", "text": ["You will first use a step-by-step procedure in which different debugging techniques will be applied.  Following the debugging exercise, you will create a program based on three tasks the program must perform.", "This experiment provides you with the opportunity to debug code as well as write a short program on your own.", "You will first use a step-by-step procedure in which different debugging techniques will be applied. Following the debugging exercise, you will create a program based on three tasks the program must perform."], "jumps": ["P2060", "P2040", "P2050", "P2001"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P1990", "text": ["9.  Programs written for the 68000 microprocessor can be run on       any other processor in the family.  Remember, however, that          for the code to run, external connections must be the same.", "9. Programs written for the 68000 microprocessor can be run on any other processor in the family. Remember, however, that for the code to run, external connections must be the same."], "jumps": ["P1999", "P1980"]}, {"id": "P1980", "text": ["8.  The 68040 increases the data an instruction caches to 4                  kilobytes.  The floating point co-processor has been built into        the processor.  This microprocessor is comparable to the Intel      486 microprocessor.", "8. The 68040 increases the data an instruction caches to 4 kilobytes. The floating point co-processor has been built into the processor. This microprocessor is comparable to the Intel 486 microprocessor."], "jumps": ["P1990", "P1970"]}, {"id": "P1970", "text": ["7.  The 68030 adds a built-in memory management unit, a 256              byte data cache and the ability to interface with a floating point      co-processor.", "7. The 68030 adds a built-in memory management unit, a 256 byte data cache and the ability to interface with a floating point co-processor."], "jumps": ["P1980", "P1960"]}, {"id": "P1960", "text": ["6.  The 68020 goes to true 32-bit, higher processor speeds, more       memory addressing ability, three 32-bit ALUs, internal 256               bytes instruction cache and additional address and data                 registers.", "6. The 68020 goes to true 32-bit, higher processor speeds, more memory addressing ability, three 32-bit ALUs, internal 256 bytes instruction cache and additional address and data registers."], "jumps": ["P1970", "P1950"]}, {"id": "P1950", "text": ["5.  The 68010 adds the virtual memory feature to the basic                    microprocessor design.", "5. The 68010 adds the virtual memory feature to the basic microprocessor design.."], "jumps": ["P1960", "P1940"]}, {"id": "P1940", "text": ["4.  The 68008 is used in already existing systems, or new                      systems that are designed to use an 8-bit microprocessor.", "4. The 68008 is used in already existing systems, or new systems that are designed to use an 8-bit microprocessor."], "jumps": ["P1950", "P1930"]}, {"id": "P1930", "text": ["3.  An essential tool of the 68000 microprocessor trainer is the            breakpoint feature.  This is a very handy debugging tool when      verifying code.", "3. An essential tool of the 68000 microprocessor trainer is the breakpoint feature. This is a very handy debugging tool when verifying code."], "jumps": ["P1940", "P1920"]}, {"id": "P1920", "text": ["2.  There are three different types of programming errors:                     Compile-time errors, Run-time errors and Logical errors.                  Writing in machine code eliminates the first type of error but           promotes the other two.", "2. There are three different types of programming errors: Compile-time errors, Run-time errors and Logical errors. Writing in machine code eliminates the first type of error but promotes the other two.", "Compile Time Run Time Logicale Subroutine Verificationrificationerification", "ERRORS e Time Run Time Logicale Subroutine Verificationrificationerification"], "jumps": ["P1930", "P1915"]}, {"id": "P1915", "text": ["1.  Code programming practice includes: writing code in                      modules, using visual indicators, performing discrete                       subroutine verification and taking steps to avoid high error            programming practices.", "1. Code programming practice includes: writing code in modules, using visual indicators, performing discrete subroutine verification and taking steps to avoid high error programming practices.", "Writing code in modules Visual indications Discrete Subroutine Verification"], "jumps": ["P1920", "P1001"]}, {"id": "P13050", "text": ["You will first use a step-by-step procedure in which different debugging techniques will be applied.  Following the debugging exercise, you will create a program based on three tasks the program must perform.", "You will first use a step-by-step procedure in which different debugging techniques will be applied. Following the debugging exercise, you will create a program based on three tasks the program must perform."], "jumps": ["P13060", "P13040"]}, {"id": "P1752", "text": ["The processor you selected only had small differences compared to the other existing models at the time."], "jumps": []}, {"id": "P13410", "text": ["Be very careful entering this code; to avoid any unintentional errors."], "jumps": ["P13420", "P13390"]}, {"id": "P1750", "text": ["Which of the following processors made the largest leap of  technology from the previously highest available model?", "Which of the following processors made the largest leap of technology from the previously highest available model?"], "jumps": ["P1720"]}, {"id": "P13260", "text": ["This program demonstrates the different types of programming errors and the debugging processes used to correct them.", "This program demonstrates the different types of programming errors and the debugging processes used to correct them. TSelect table to ses Program 1."], "jumps": ["P13270", "P13250"]}, {"id": "P1730", "text": ["While you may not realize it, you practically know all there is to know about the 68000 microprocessor.  With the information you have learned, you can effectively evaluate the operation of any system.", "While you may not realize it, you practically know all there is to know about the 68000 microprocessor. With the information you have learned, you can effectively evaluate the operation of any system."], "jumps": ["P1740", "P1720"]}, {"id": "P1740", "text": ["In the experiment, you are going to type in a segment of code which has been purposely injected with errors.  A step by step procedure will lead you through the evaluation process of determining the errors.", "In the experiment, you are going to type in a segment of code which has been purposely injected with errors. A step by step procedure will lead you through the evaluation process of determining the errors."], "jumps": ["P1750", "P1720"]}, {"id": "P1910", "text": ["This completes the information on DEBUGGING AND COMPATIBILITY."], "jumps": ["P1750"]}, {"id": "P13060", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13040"]}, {"id": "P1710", "text": ["As you can see, there are many variations of the 68000 microprocessor.  All of these chips are still widely used in many applications.", "As you can see, there are many variations of the 68000 microprocessor. All of these chips are still widely used in many applications."], "jumps": ["P1720", "P1690"]}, {"id": "P1720", "text": ["Motorola just produced a newer version of the 68000 called the MC68EC00.  Its primary advantage is its minimized power consumption.", "Motorola just produced a newer version of the 68000 called the MC68EC00. Its primary advantage is its minimized power consumption."], "jumps": ["P1730", "P1690"]}, {"id": "P1680", "text": ["The 68030 includes a 256 byte data cache and can perform some operations in parallel.  This means that the processor is able to perform two operations at the same time.", "The 68030 includes a 256 byte data cache and can perform some operations in parallel. This means that the processor is able to perform two operations at the same time."], "jumps": ["P1690", "P1660"]}, {"id": "P13570", "text": ["Let's correct the machine code and see what happens.", "Let's correct the machine code and see what happens. Select table to see Program 1."], "jumps": ["P13580", "P13560"]}, {"id": "P1660", "text": ["The 68030, as with the other processors, provides all the functions of the 68020 with additional features."], "jumps": ["P1670", "P1600"]}, {"id": "P1751", "text": [], "jumps": []}, {"id": "P1640", "text": ["Cache is memory located within the microprocessor that is very fast.  This memory is used as a scratch pad where the processor can store and retrieve information quickly.", "Cache is memory located within the microprocessor that is very fast. This memory is used as a scratch pad where the processor can store and retrieve information quickly."], "jumps": ["P1650", "P1600"]}, {"id": "P1650", "text": ["This cache is used only for instructions and not for data.  Other features include: 11 data and 11 address registers; 3 stack pointers, and the CAAR and CACR 32-bit registers.  These registers are used to deal with the internal cache.", nd 33 MHz."], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["While the 68000 has one 16-bit ALU, the 68020 has three 32-bit ALU's! Further, the address lines are increased and designated as A0 to A31.  This provides 4 gigabytes of memory that can be addressed.", "While the 68000 has one 16-bit ALU, the 68020 has three 32-bit ALU's! Further, the address lines are increased and designated as A0 to A31. This provides 4 gigabytes of memory that can be addressed."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["Also, the limitation of even addresses only has been removed on this processor.  The 68020 is a true 32-bit processor with D0-D32 data lines.  The processor also has 256 bytes of instruction cache.", "Also, the limitation of even addresses only has been removed on this processor. The 68020 is a true 32-bit processor with D0-D32 data lines. The processor also has 256 bytes of instruction cache."], "jumps": ["P1640", "P1600"]}, {"id": "P1550", "text": ["Motorola developed the 68008 microprocessor for this reason. The 68008 is almost identical to the 68000.  The main differences are the data bus size, no upper and lower data strobe signals, and the removal of several other signal pins.", "Many people wanted to increase the speed and capabilities of their systems, but didn't want to totally redesign the system.", "Motorola developed the 68008 microprocessor for this reason. The 68008 is almost identical to the 68000. The main differences are the data bus size, no upper and lower data strobe signals, and the removal of several other signal pins."], "jumps": ["P1560", "P1530", "P1550"]}, {"id": "P1530", "text": ["The 68008 was designed for pre-existing systems. Most early microprocessor systems were based on 8-bit data buses."], "jumps": ["P1540", "P1470"]}, {"id": "P1540", "text": ["Many people wanted to increase the speed and capabilities of their systems, but didn't want to totally redesign the system.", "This is one of the things that has made IBM d work because dividing by another number is a proper instruction action; however, it should have been dividing by four."], "jumps": ["P1420", "P1400"]}, {"id": "P1380", "text": ["For this, a company generates a small program that only repairs the one faulted line.  This is called a program patch.", "For this, a company generates a small program that only repairs the one faulted line. This is called a program patch."], "jumps": ["P1390", "P1340"]}, {"id": "P1390", "text": ["Out of all the different types of errors you can have, logical errors are the most difficult to detect.", "Commercial software packages provide a telephone number and/or Internet location users can submit bugs and get updates for that particular program."], "jumps": ["P1400", "P1340"]}, {"id": "P1350", "text": ["Most popular software producers check their programs as much as possible and then market their software for the public to continue checking."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Commercial software packages provide a telephone number and/or Internet location users can submit bugs and get updates for that particular program."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["An update could be in the form of a program patch.  It wouldn't be feasible to send a 10 Megabyte file to someone if only one line of code was bad.", "An update could be in the form of a program patch. It wouldn't be feasible to send a 10 Megabyte file to someone if only one line of code was bad."], "jumps": ["P1380", "P1340"]}, {"id": "P1330", "text": ["Run-Time Errors are errors that occur when you run a program.  Examples include divide-by-zero, illegal address, etc.  These errors are usually caused by untested conditions.", "Run-Time Errors are errors that occur when you run a program. Examples include divide-by-zero, illegal address, etc. These errors are usually caused by untested conditions."], "jumps": ["P1340", "P1270"]}, {"id": "P1430", "text": ["Spelling errors in strings are also considered part of this category."], "jumps": ["P1440", "P1400"]}, {"id": "P1310", "text": ["If you wanted to use MULU and you put MULS, no error would be generated.  The worst part about this error is that sometimes the results will be correct and sometimes they will be incorrect.", "If you wanted to use MULU and you put MULS, no error would be generated. The worst part about this error is that sometimes the results will be correct and sometimes they will be incorrect."], "jumps": ["P1320", "P1270"]}, {"id": "P1320", "text": ["This is similar to spell checking a document where, in the text, you typed \"he\" instead of \"the.\"  A spelling checker will not recognize an error.", "There is no instruction of this form, so the compiler (or assembler) would return an error indicating that this instruction cannot be found.", "This is similar to spell checking a document where, in the text, you typed \"he\" instead of \"the.\" A spelling checker will not recognize an error."], "jumps": ["P1330", "P1270", "P1300"]}, {"id": "P1280", "text": ["An example of a Compile-Time Error is if you wanted to use the MOV command in an assembly language program and accidentally typed NOV instead."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["There is no instruction of this form, so the compiler (or assembler) would return an error indicating that this instruction cannot be found."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["These compile-time errors are easy to detect, however, not if the mis-entered instruction is of another type with the same parameters."], "jumps": ["P1310", "P1270"]}, {"id": "P13760", "text": ["Observe the contents of D4.  Now the value of the average is correct.  It is amazing how many logical errors can remain undetected in a program when it is distributed to a world wide market.", "Observe the contents of D4. Now the value of the average is correct. It is amazing how many logical errors can remain undetected in a program when it is dis let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
