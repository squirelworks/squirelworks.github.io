", "Whether you are working on a receiver or some other electronic equipment, performing a complete function check will normally     disclose a great deal of information.", "Whether you are working on a receiver or some other electronic equipment, performing a complete function check will normally disclose a great deal of information."], "jumps": ["P1350", "P1330", "P1340", "P1320"]}, {"id": "P1320", "text": ["While not all problems will be as easy to localize and isolate, many will be.  The important lesson here is to understand the total procedure and the importance of your initial assessment.", "While not all problems will be as easy to localize and isolate, many will be. The important lesson here is to understand the total procedure and the importance of your initial assessment.", "1. Apply Power. If the frequency display illuminates and/or any other light indicators, the power supply is probably good. 2. Place the tuning select switch on the PC130-442 card to the PLL (Phase-Lock Loop) position. 3. Depress and hold the scan-up and scan-down buttons on the frequency display. Did the frequencies go up and down accordingly? 4. Momentarily depress the seek button. The frequency display should begin incrementing itself by 200 kHz steps until a strong frequency is detected. At that time, the seek function should halt and the lock and station detector LED's should illuminate. If the lock light came on, the PLL is working. Is there audio? If yes, adjust the volume control on the PC130-443 card. Does it regulate the sound level? 5. Place the tuning select switch in the MAN (manual) position. 6. Tune in a station manually. Does the station detector light illuminate? Is there audio? e? Is there audio? udio? roadcast station is clearly audible. and station detector LED's should illuminate. If the lock light comes on, the PLL is working. Is there audio? If yes, adjust the volume control on PC130-443. Does it regulate the sound level? 6. Place the tuning select switch in the manual position. Rotate the manual tuning control knob until a broadcast station is clearly audible."], "jumps": ["P1330", "P1310", "Phase"]}, {"id": "P1310", "text": ["This tells us that the problem is in U1 in either the Muting or Quadrature Detector circuits.  Replacing U1 will fix the problem.", "This tells us that the problem is in U1 in either the Muting or Quadrature Detector circuits. Replacing U1 will fix the problem."], "jumps": ["P1320", "P1300"]}, {"id": "P1300", "text": ["If we remove power to the PC130-443 card and remove U1, a continuity check between pin 6 and TP2 reveals a reading of approximately 100 kW, the value of R9."], "jumps": ["P1310", "P1260"]}, {"id": "P1290", "text": ["We've already determined that R9 is good, therefore, the problem must be either the run between R9 and pin 6, or, the Muting Network or Quadrature detector."], "jumps": ["P1300", "P1260"]}, {"id": "P1280", "text": ["Since pin 7 is not used by the PC130-443 card, the signal must leave U1 through the Muting Network at pin 6.  When we look for the signal at TP2, it is not present.", "Since pin 7 is not used by the PC130-443 card, the signal must leave U1 through the Muting Network at pin 6. When we look for the signal at TP2, it is not present."], "jumps": ["P1290", "P1260"]}, {"id": "P1270", "text": ["The presence of the signal at TP1 tells us that the limiter is working.  Looking at the schematic of U1, the Limiter also outputs to the Quadrature Detector which outputs at pin 7 and internally to the Muting Network.", "The presence of the signal at TP1 tells us that the limiter is working. Looking at the schematic of U1, the Limiter also outputs to the Quadrature Detector which outputs at pin 7 and internally to the Muting Network."], "jumps": ["P1280", "P1260"]}, {"id": "P1260", "text": ["The Limiter outputs at pin 9 and also internally to the Quadrature Detector (discriminator).  Using the oscilloscope, check for the      signal at TP1.", "The Limiter outputs at pin 9 and also internally to the Quadrature Detector (discriminator). Using the oscilloscope, check for the signal at TP1."], "jumps": ["P1270", "P1220"]}, {"id": "P1250", "text": ["The problem must therefore reside somewhere between TP2 and U1.  We know that the signal is entering U1 and being processed as far as the Signal Strength Driver, which outputs to pin 5 and internally to the limiter.", "The problem must therefore reside somewhere between TP2 and U1. We know that the signal is entering U1 and being processed as far as the Signal Strength Driver, which outputs to pin 5 and internally to the limiter."], "jumps": ["P1260", "P1220"]}, {"id": "P1240", "text": ["Further injection of the tone on either leg of R9 indicates that the resistor is also working.  The 1 kHz tone is clearly heard through  the trainer's speaker.  This tells you that the circuit is fine from    TP2 to the speaker.", "Further injection of the tone on either leg of R9 indicates that the resistor is also working. The 1 kHz tone is clearly heard through the trainer's speaker. This tells you that the circuit is fine from TP2 to the speaker."], "jumps": ["P1250", "P1220"]}, {"id": "P1230", "text": ["With noise coming from the speaker when the volume is turned up, it is unlikely that the Audio Amplifier section is bad.  Still, to      eliminate any doubts, use the function generator to inject a 1 kHz tone into the amplifier at TP2 and verify that the section is working.", "With noise coming from the speaker when the volume is turned up, it is unlikely that the Audio Amplifier section is bad. Still, to eliminate any doubts, use the function generator to inject a 1 kHz tone into the amplifier at TP2 and verify that the section is working."], "jumps": ["P1240", "P1220"]}, {"id": "P1220", "text": ["With the oscilloscope probe, verify the signal at TP4 on \nPC130-443.  If the FM signal is present, you have verified the Station Detector check you performed by watching the light when you detuned the receiver.", "With the oscilloscope probe, verify the signal at TP4 on PC130-443. If the FM signal is present, you have verified the Station Detector check you performed by watching the light when you detuned the receiver."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["Set CH1 on your oscilloscope to 5 mV per/div (X10 probes) or \n.2 V (X1 probes).  Set the time/div control to .2 ms per/div.  Re-tune to a known local station, or set the Function Generator to a 1 MHz FM signal injected at the antenna input.", "The test equipment settings and procedures are purely instructional and not actually to be performed during the paper bug exercise.........y; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from the speaker. the speaker.", "NOTEEEtest equipment settings and procedures are purely instructional and not actually to be performed during the paper bug exercise.hetically; lock and station detect LED's illuminated, but the station could not be heard. 3. Rotating the volume control fully clockwise produced noise from the speaker.", "Set CH1 on your oscilloscope to 5 mV per/div (X10 probes) or .2 V (X1 probes). Set the time/div control to .2 ms per/div. Re-tune to a known local station, or set the Function Generator to a 1 MHz FM signal injected at the antenna input. (Graphics Text) NOTE The test equipment settings and procedures are purely instructional"], "jumps": ["P1220", "P1201"]}, {"id": "P1204", "text": ["In either case the IC will need to be replaced.  Because this is a training exercise, troubleshooting different sections of an IC is a   reasonable and even desirable endeavor.", "In either case the IC will need to be replaced. Because this is a training exercise, troubleshooting different sections of an IC is a reasonable and even desirable endeavor."], "jumps": ["P1210", "P1201"]}, {"id": "P1203", "text": ["If the signal is entering an IC but there is no output, either the output line is pulled to ground or the IC is bad.  Further, if an      output line is pulled to ground, odds are the IC fried in the         process.", "If the signal is entering an IC but there is no output, either the output line is pulled to ground or the IC is bad. Further, if an output line is pulled to ground, odds are the IC fried in the process."], "jumps": ["P1204", "P1201"]}, {"id": "P1202", "text": ["In most instances, troubleshooting IC's require nothing more than comparing outputs against inputs."], "jumps": ["P1203", "P1201"]}, {"id": "P1201", "text": ["In real world practical applications, troubleshooting pins associated with different sections within a single IC may or may not be time and/or money justifiable."], "jumps": ["P1202", "P1200"]}, {"id": "P1200", "text": ["If it did, U3a, associated circuitry and U1 (only through the Signal Strength Driver) is working.  Still, it is best to verify that with an oscilloscope.", "If it did, U3a, associated circuitry and U1 (only through the Signal Strength Driver) is working. Still, it is best to verify that with an oscilloscope."], "jumps": ["P1201", "P1180"]}, {"id": "P1190", "text": ["We know that a portion of the IF signal is good since the Station Detector is working. First de-tune the receiver from the known       station.  Did the Station Detector light extinguish?", "We know that a portion of the IF signal is good since the Station Detector is working. First de-tune the receiver from the known station. Did the Station Detector light extinguish?"], "jumps": ["P1200", "P1180"]}, {"id": "P1180", "text": ["At this point, we have localized the problem to PC130-443 circuitry by doing nothing more than be observant and apply a little deductive reasoning."], "jumps": ["P1190", "P1170"]}, {"id": "P1170", "text": ["Referring to the schematic of the PC130-443 card we can see that there is very little circuitry remaining that hasn't already been ruled out.  Specifically, the components between U1 and TP3 in the let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
