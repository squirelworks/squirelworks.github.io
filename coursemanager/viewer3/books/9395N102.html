const book = {"title": "9395N102", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: PLC HARDWAREdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the functions of I/O modules. w Identify the different types of I/O modules. w Know the basic operation of both discrete and analog I/O modules.", "w Know the function of the processor module's microprocessor (CPU). w Describe a memory map and the different memory functions. w Know the purpose of the communications circuitry. w Understand the scan cycle.and the scan cycle............................."], "jumps": []}, {"id": "P101", "text": ["w Use an analog I/O module for analog input and output devices. w Use an analog I/O module for an analog input device with a relay I/O module for an LED output. w Observe the processor module's operation using the scan cycle...."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": ["P", "P61"]}, {"id": "P400", "text": ["A PLC has two basic sections: 1. Input/Output Sections 2. Central Processing Unit Input Central Output Section Processing Section Unit"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["A programming device is added when the ladder logic program requires program modifications. Programming Device"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["A more detailed understanding of the PLC's hardware is required in order to select units that will meet specific needs and expectations."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on PLC HARDWARE...................................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["The I/O modules route all external signals into the CPU and direct signals from the CPU to the outside circuitry. Input Output CPU 24V S1"], "jumps": ["P1035", "P1001"]}, {"id": "P1035", "text": ["I/O modules also protect the CPU from electrical noise and current or voltage spikes. 24V"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A typical I/O module has connection terminals and status lights for each input or output. I/O Module I/O Module Front View Side View Status Status Lights Lights Power Supply", "Power Supply and Input/Output Connections", "Side View of I/O Circuit Boardd"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The inputs and outputs are powered through the power supply connections. The I/O and power supply connections may be shielded by a removable cover or door.", "Power Supply and Input/Output Connections"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Each I/O module may be manufactured to contain strictly inputs, strictly outputs, or both inputs and outputs."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["There are two basic types of I/O modules available: * Discrete * Analogg"], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Let's take a closer look at discrete I/O modules."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Discrete I/O modules are also called digital I/O modules and include the relay and TTL types. Relay I/O modules require 12 to 24 volts for operation while TTL units operate on 5 volts."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Discrete I/O modules are used with on/off or open/closed types of input and output devices such as push button switches, relays, and indicator lights."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The basic circuitry is similar for both AC and DC units, but AC units often contain additional components for signal rectification."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["The signal enters a detector and rectifier block within the input module's circuit. Detector & Rectifier"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The signal is converted in the detector & rectifier block in order to drive a transmitter in the opto-isolator block. The opto-isolator block electrically isolates the processor from the input signals."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The signal passes from the opto-isolator block to the digital logic block where it is converted into a digital form that is acceptable to the CPU.", "A discrete output module's circuit operates in a reverse fashion by taking the signal from the CPU, sending it to an opto-isolator, and converting it to an appropriate output signal."], "jumps": ["P1150", "P1110", "P1160"]}, {"id": "P1160", "text": ["Each I/O module contains _______d.........................."], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["I/O modules may contain strictly inputs, strictly outputs or both inputs and outputs."], "jumps": []}, {"id": "P1170", "text": ["The function of the opto-isolator block in a discrete I/O module is to _______", "electrically isolate the CPU from input/output signals."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The function of the opto-isolator block is not to detect input/output signals."], "jumps": []}, {"id": "P1180", "text": ["Now let's look at analog I/O modules......................."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Analog I/O modules are used with analog input and output devices such as temperature or light sensors, position transducers, and variable speed motors."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The A to D converter converts the analog input signal to a digital signal that is accepted by the CPU."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The A to D converter may also contain the circuitry needed to protect the CPU from electrical noise and voltage or current spikes."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Most analog I/O modules use 12 bit or 16 bit converters for each input."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["An analog output module's circuit operates in a reverse fashion using a 12 bit or 16 bit converter for each output."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["Analog to digital converters are used in _______..........."], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["Discrete I/O modules do not require analog to digital converters since they are not used with analog devices."], "jumps": []}, {"id": "P1243", "text": ["Relay type I/O modules are discrete I/O modules............"], "jumps": []}, {"id": "P1250", "text": ["The individual I/O modules plug into a rack which is connected to the processor module."], "jumps": ["P1260", "P1240", "P"]}, {"id": "P1260", "text": ["Try to identify the processor module and the three I/O modules on the Nida Model 5050 PLC Trainer."], "jumps": ["P1270", "P1250", "P1265"]}, {"id": "P1265", "text": ["NIDA MODEL 5050 PLC TRAINER - The processor module is located on the left side of the PLC trainer's panel and the three I/O modules are on the right."], "jumps": []}, {"id": "P1270", "text": ["Notice that the relay and analog I/O modules contain both the inputs and outputs while the TTL module contains only inputs."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Each I/O module is issued a unique address. The CPU uses this address to identify the location of the I/O module for proper ladder logic operation."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["All addressing schemes contain these four basic elements. Any additional required information may vary.", "BASIC ADDRESSING ELEMENTS TYPE The type determines if an input or an output is used. SLOT The slot number is the physical location of the I/O module. This may be a combination of the rack number and the slot number when using expansion racks. WORD & BIT The word and bit are used to identify the actual connection in a particular I/O module. Discrete modules usually have only one word and each connection corresponds to a different bit. In analog modules, the bit address is usually not used."], "jumps": ["P1910", "P1260"]}, {"id": "P1910", "text": ["This completes the information on I/O MODULES.TITLE........", "1. I/O modules route all signals to and from the CPU and protect the CPU from electrical noise and current or voltage spikes."], "jumps": ["P1001", "P1290", "P1930"]}, {"id": "P1930", "text": ["2. Each I/O module may be manufactured to contain strictly inputs, strictly outputs, or both inputs and outputs."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. There are two basic types of I/O modules available. * Discrete * Analog"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Discrete I/O modules are also called digital I/O modules and include relay and TTL types of modules."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5. Discrete I/O modules are used with on/off or open/closed type of input and output devices such as push button switches, relays and indicator lights."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. Analog I/O modules are used with analog input and output devices such as temperature or light sensors, position transducers, and variable speed motors."], "jumps": ["P1980", "P1950"]}, {"id": "P1980", "text": ["7. Each I/O module is issued a unique address. The CPU uses this address to identify the location of the I/O module for proper ladder logic operation.", "BASIC ADDRESSING ELEMENTS TYPE The type determines if an input or an output is used. SLOT The slot number is the physical location of the I/O module. This may be a combination of the rack number and the slot number when using expansion racks. WORD & BIT The word and bit are used to identify the actual connection in a particular I/O module. Discrete modules usually have only one word and each connection corresponds to a different bit. In analog modules, the bit address is usually not used."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": ["Different processor module models may vary in size and appearance."], "jumps": ["P2030", "P2001", "P"]}, {"id": "P2030", "text": ["Most processor modules contain three important parts."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The CPU in the Nida Model 5050 PLC Trainer is located behind a removable protective panel. Microprocessor", "NIDA MODEL 5050 PLC TRAINER - The CPU is located within the processor module."], "jumps": ["P2050", "P2020", "P2060", "P2055"]}, {"id": "P2060", "text": ["The CPU is the brain of the PLC and it executes the user's ladder logic program."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Different microprocessors with different capabilities are available in order to meet the demands of the user."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["The best microprocessor is chosen by determining anticipated needs such as amount of memory, number of I/O channels, and speed of operation.", "Let's take a look at the memory in a PLC processor module.."], "jumps": ["P2090", "P2050", "P2100", "P"]}, {"id": "P2100", "text": ["The processor module's memory contains all programs and data necessary for PLC operation. Some portions are installed during manufacturing while others are accessible to the user.", "Read Only Memory - Cannot be changed oce programmed", "Random Access Memory - Easily changed, but contents lost with power loss", "Electrically Erasable Programmable Read Only Memory", "PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["A memory map diagram illustrates the organization of the memory information within the processor module."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The memory map can be divided into a fixed section and a variable section with different memory types used for each."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The fixed section includes programs that do not change during normal operation such as the main program and the user's ladder logic program."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["ROM, PROM, EPROM, EAROM, or EEPROM are the best memory types for the fixed memory section."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The variable section includes data that changes during normal operation such as I/O image tables and instructional data."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["Only RAM or EEPROM memory types are used for the variable section."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["The I/O image tables reserve a portion of memory for each input and each output from the I/O modules."], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["The amount of memory used for the I/O image tables depends on the inputs and outputs. Digital inputs/outputs may only require a single memory bit while analog inputs/outputs require an entire word (16 bits)...", "Finally, let's talk about the processing module's communications circuitry."], "jumps": ["P2190", "P2100", "P2200", "P"]}, {"id": "P2200", "text": ["The processor module contains the circuitry needed to communicate with the programming device computers or other PLC's."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["The external device communicates with the PLC through a cable that is connected to a terminal located on the processing module."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Which part of the PLC processing module executes the ladder logic program?"], "jumps": ["P2200"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["The memory section of the processing module stores the ladder logic program but does not execute the program.", "PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Read Only Memory - Cannot be changed oce programmed", "Random Access Memory - Easily changed, but contents lost with power loss", "Electrically Erasable Programmable Read Only Memory"], "jumps": []}, {"id": "P2223", "text": ["The communications circuitry allows the PLC to communicate with other PLC's, computers, or the programming device. The programming device is used to install the ladder logic program into the processing module but the communications circuitry does not execute the ladder logic program..."], "jumps": []}, {"id": "P2230", "text": ["The fixed section of a memory map includes _______........."], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["The I/O image tables are part of the variable section of the memory map since they change during normal operation.", "PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Read Only Memory - Cannot be changed oce programmed", "Random Access Memory - Easily changed, but contents lost with power loss", "Electrically Erasable Programmable Read Only Memory"], "jumps": []}, {"id": "P2233", "text": ["Timers and counters are part of the variable section of the memory map since they change during normal operation.", "PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Read Only Memory - Cannot be changed oce programmed", "Random Access Memory - Easily changed, but contents lost with power loss", "Electrically Erasable Programmable Read Only Memory"], "jumps": []}, {"id": "P2240", "text": ["The processor module operates in a cyclic pattern referred to as a scan cycle which includes an I/O scan and a program scan."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The processor starts by scanning all of the input connections and records their status in the input image table."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Next, the processor systematically evaluates each rung of the ladder logic program. The output image table and internal data bits are set accordingly."], "jumps": ["P2270", "P2240"]}, {"id": "P2270", "text": ["Finally, the processor scans the output image table and energizes all of the proper outputs."], "jumps": ["P2280", "P2240"]}, {"id": "P2280", "text": ["The processor repeats the scan cycle continually as long as the PLC is on or in the run mode."], "jumps": ["P2290", "P2240"]}, {"id": "P2290", "text": ["The amount of time required to complete the scan cycle is called scan time."], "jumps": ["P2300", "P2240"]}, {"id": "P2300", "text": ["Scan time is an important consideration when selecting or troubleshooting a PLC since the PLC loses control of the processes if the inputs change faster than the scan time."], "jumps": ["P2310", "P2240"]}, {"id": "P2310", "text": ["Which part of the scan cycle energizes the outputs?........"], "jumps": ["P2240"]}, {"id": "P2311", "text": [], "jumps": []}, {"id": "P2312", "text": ["The input scan involves scanning all the input connections and recording their status in the input image table but does not energize the outputs."], "jumps": []}, {"id": "P2313", "text": ["The program scan involves systematically evaluating each rung of the ladder logic program. The output image table and internal data bits are set accordingly but the outputs are not energized."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on PROCESSOR MODULES........", "1. Most processor modules contain three important parts..", "2. The CPU is the brain of the PLC and it executes the user's ladder logic program. Microprocessor"], "jumps": ["P2001", "P2310", "P2930", "P2940", "P2920"]}, {"id": "P2940", "text": ["3. The processor module's memory contains all the programs and data necessary for PLC operation.", "PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Read Only Memory - Cannot be changed oce programmed", "Random Access Memory - Easily changed, but contents lost with power loss", "Electrically Erasable Programmable Read Only Memory"], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4. A memory map diagram illustrates the organization of the memory information within the processor module."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5. The processor module's communication circuitry is needed to communicate with the programming device, computers, or other PLC's."], "jumps": ["P2970", "P2940"]}, {"id": "P2970", "text": ["6. The processor module operates in a cyclic pattern referred to as a scan cycle."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7. The amount of time required to complete the scan cycle is called scan time."], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2970"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment you will learn about the conversion capabilities of I/O modules and how a PLC operates using scan cycles."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["Locate the potentiometer on the PC5050-1 card and the analog I/O module on the PLC trainer. The potentiometer provides the input signal to the analog I/O module. LC"], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The A to D converter in the analog I/O module changes the analog signal to a digital signal and sends it to the processor module."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["The processor module assigns the proper output signal and sends them to both the analog I/O module and the relay I/O module."], "jumps": ["P3030"]}, {"id": "P3060", "text": ["The D to A converter in the analog I/O module changes the digital signal to an analog signal and sends the signal to the PLC trainer's motor."], "jumps": ["P3030"]}, {"id": "P3072", "text": ["The processor module sends the digital output signals to the relay I/O module. Locate the relay I/O module and the LED's on the PLC trainer. PLC"], "jumps": ["P3030"]}, {"id": "P3080", "text": ["The relay I/O module releases the signals needed to illuminate the corresponding binary number on the LED's."], "jumps": ["P3072"]}, {"id": "P3090", "text": ["The amount of voltage released by the PC card's potentiometer controls the speed of the PLC trainer's motor and the binary number displayed by the LED's."], "jumps": ["P3072"]}, {"id": "P3100", "text": ["The motor spins faster and the binary number increases as the voltage increases. Let's start the experiment."], "jumps": ["P3072"]}, {"id": "P3110", "text": ["1. Place the PC5050-1 card in the PC1 position............"], "jumps": ["P3072", "P3115"]}, {"id": "P3115", "text": ["PC CARD PLACEMENT - Align the connectors on the PC5050-1 card with the pins for the PC1 position on the Nida Model 5050 PLC trainer. Gently push down on the PC5050-1 card."], "jumps": ["P3110"]} let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
