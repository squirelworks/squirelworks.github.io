tely the frequency counter must be set up correctly."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In this lesson, you will correctly set up a frequency counter to       measure an AC sine wave.", "In this lesson, you will correctly set up a frequency counter to measure an AC sine wave."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The Nida Model 410 Multifunction Counter is used in this lesson."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["If you are using a different model, the procedures are still valid.   Most frequency counters are identical in operation, but the location and names of the controls may be different.", "If you are using a different model, the procedures are still valid. Most frequency counters are identical in operation, but the location and names of the controls may be different."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on FREQUENCY COUNTER USE. ........................"], "jumps": ["P400"]}, {"id": "P900", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P400"]}, {"id": "P1020", "text": ["This experiment demonstrates the operation of frequency counters.  You will correctly set up a frequency counter and perform the check function, measure period, frequency, and total pulses using a function generator and experiment card\nPC130-10.", "This experiment demonstrates the operation of frequency counters. You will correctly set up a frequency counter and perform the check function, measure period, frequency, and total pulses using a function generator and experiment card PC130-10."], "jumps": ["P1030"]}, {"id": "P1030", "text": ["Pick up the PC130-10 card. This card contains a series resistance circuit used to measure signals. The card uses both DC and AC inputs."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The function generator is used to produce an AC signal applied to pin E."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["This signal is directly connected to TP2 on the experiment card."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["S1 selects between positive or negative DC voltage.  It will not be used in this experiment.", "S1 selects between positive or negative DC voltage. It will not be used in this experiment."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["Before setting up the frequency counter, let's set up the test          console, experiment card, and function generator. \n1.  Set the Test Console controls to their initial control settings.", "Before setting up the frequency counter, let's set up the test console, experiment card, and function generator. 1. Set the Test Console controls to their initial control settings."], "jumps": ["P1030"]}, {"id": "P1090", "text": ["2.  Carefully plug PC130-10 into the Test Console PC1 position.", "2. Carefully plug PC130-10 into the Test Console PC1 position."], "jumps": ["P1070"]}, {"id": "P1095", "text": ["EXPERIMENT CARD PLACEMENT - PC130-10 shown in PC1 position."], "jumps": ["P1090"]}, {"id": "P1100", "text": ["3.  Set the Function Generator up as follows, ensure the display          indicates 2.00.", "3. Set the Function Generator up as follows, ensure the display indicates 2.00.", "Frequency Dial - 2 Gate Select - .1 sec Function - Sine Wave Attenuation - Out Range - 1 k Modulation - Outt"], "jumps": ["P1090"]}, {"id": "P1105", "text": ["MEASUREMENT SET UP Frequency - 2 Attenuation - Out Gate - .1 sec Range - 1 k Function - sine wave Modulation - Out"], "jumps": ["P1100"]}, {"id": "P1110", "text": ["4.  Connect the function generator output to the input BNC on             the Test Console.", "4. Connect the function generator output to the input BNC on the Test Console."], "jumps": ["P1120"]}, {"id": "P1115", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": ["P1110"]}, {"id": "P1120", "text": ["5.  Set the oscilloscope ndicates that the unit is not functioning correctly. Check with your instructor as the oscillator may need to be calibrated."], "jumps": []}, {"id": "P1207", "text": ["The frequency for the internal oscillator should be approximately 10000 kHz."], "jumps": ["P1200"]}, {"id": "P1210", "text": ["Check the operator's manual that corresponds to the frequency   counter you are using. Find the specifications section and locate the Internal Oscillator Frequency. Type in the frequency below.", "Check the operator's manual that corresponds to the frequency counter you are using. Find the specifications section and locate the Internal Oscillator Frequency. Type in the frequency below.............."], "jumps": ["P1190", "P1212"]}, {"id": "P1211", "text": [], "jumps": ["P1220", "P1210"]}, {"id": "P1212", "text": ["The answer you entered is not a valid internal oscillator frequency. Make sure you are entering the value in kHz."], "jumps": []}, {"id": "P1217", "text": ["The frequency for the internal oscillator should be approximately 10000 kHz."], "jumps": ["P1220", "P1210"]}, {"id": "P1220", "text": ["What frequency is indicated on the display?", "What frequency is indicated on the display?h 3 tries...................) in a variable.able.le."], "jumps": ["P1210", "P1222"]}, {"id": "P1221", "text": [], "jumps": ["P1240", "P1220"]}, {"id": "P1222", "text": ["The display should indicate                              \noperator's manual. Your answer of                           \nthe unit is not functioning correctly. Check with your instructor as the oscillator may need to be calibrated.", "The display should indicate operator's manual. Your answer of the unit is not functioning correctly. Check with your instructor as the oscillator may need to be calibrated."], "jumps": []}, {"id": "P1227", "text": ["The frequency for the internal oscillator should be approximately 10000 kHz."], "jumps": ["P1240", "P1220"]}, {"id": "P1230", "text": ["Compare the frequency indicated on the display with the internal oscillator frequency indicated in the operator's manual. The check function allows you to verify proper overall operation of the unit.", "Display Internal Oscillator (check mode) (check mode) 10000 kHz"], "jumps": ["P1250", "P1200"]}, {"id": "P1240", "text": ["Compare the frequency indicated on the display with the internal oscillator frequency indicated in the operator's manual. The check function allows you to verify proper overall operation of the unit.", "Display Internal Oscillator (check mode) (check mode) 00 kHz"], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["Now that the check function has been performed and correct operation established, let's measure the period of the signal on PC130-10 TP2."], "jumps": ["P1260", "P1190"]}, {"id": "P1260", "text": ["1.  Press the A.PERI function switch on the Model 410. This sets        the A input to measure the period of a signal.        \n2.  Disconnect the Oscilloscope Leads.", "1. Press the A.PERI function switch on the Model 410. This sets the A input to measure the period of a signal. 2. Disconnect the Oscilloscope Leads."], "jumps": ["P1270", "P1250"]}, {"id": "P1265", "text": ["MULTIFUNCTION COUNTER SETUP - Set Frequency Counter controls as shown: Function - A.PERI"], "jumps": ["P1260"]}, {"id": "P1270", "text": ["3.  Connect a BNC to alligator cable to the A input BNC                          connector.  An oscilloscope probe with x1 attenuation may            also be used.", "3. Connect a BNC to alligator cable to the A input BNC connector. An oscilloscope probe with x1 attenuation may also be used.", "A different type of cable may be specified or supplied with your frequency counter. Use the one that fits the application..."], "jumps": ["P1280", "P1260"]}, {"id": "P1275", "text": ["MULTIFUNCTION COUNTER SETUP - Connect a BNC to alligator probe to the A INPUT on the Model 410 Multifunction Counter."], "jumps": ["P1270"]}, {"id": "P1280", "text": ["4.  Place the red alligator clip or NTER SETUP - Set the function switch on Frequency Counter to Totalize."], "jumps": ["P1440"]}, {"id": "P1450", "text": ["4.  Set the range switch on the function generator to 10.   \n5.  Vary the frequency dial on the function generator. Notice the         rate at which the display increments is greater for higher                 frequencies.", "4. Set the range switch on the function generator to 10. 5. Vary the frequency dial on the function generator. Notice the rate at which the display increments is greater for higher frequencies.", "Do not rotate the dial to the fully clockwise position. This produces input pulses to the counter... fits the application...M"], "jumps": ["P1460", "P1440"]}, {"id": "P1455", "text": ["MEASUREMENT SETUP - Set the Range to 10 and vary the Frequency Dial."], "jumps": ["P1450"]}, {"id": "P1460", "text": ["6.  Set the frequency dial to 5 on the function generator.                        How many times does the display increment every second?", "6. Set the frequency dial to 5 on the function generator. How many times does the display increment every second??"], "jumps": ["P1450", "P1462"]}, {"id": "P1461", "text": [], "jumps": ["P1470", "P1460"]}, {"id": "P1462", "text": ["You do not have to actually see how many times the display      increments. With a function generator range of 10 and the frequency dial set to 5, the frequency counter receives 50 cycles per second.", "You do not have to actually see how many times the display increments. With a function generator range of 10 and the frequency dial set to 5, the frequency counter receives 50 cycles per second."], "jumps": ["P1460"]}, {"id": "P1463", "text": ["Your answer is still incorrect. The function generator is producing a 50 Hz signal. The frequency counter receives 50 cycles in one second and the display increments each time."], "jumps": ["P1470", "P1460"]}, {"id": "P1465", "text": ["FUNCTION GENERATOR SETUP - Set Range to 10 and turn Frequency Dial to 5."], "jumps": ["P1460"]}, {"id": "P1470", "text": ["7.  Press the RESET switch on the frequency counter and hold it       in. Notice the display is blank. As soon as you release this              switch, it will begin incrementing from zero.                                    8.  Release the RESET switch and observe the process.", "7. Press the RESET switch on the frequency counter and hold it in. Notice the display is blank. As soon as you release this switch, it will begin incrementing from zero. 8. Release the RESET switch and observe the process."], "jumps": ["P1480", "P1460"]}, {"id": "P1475", "text": ["MULTIFUNCTION COUNTER SETUP -  Set the Frequency Counter to Reset.", "MULTIFUNCTION COUNTER SETUP - Set the Frequency Counter to Reset."], "jumps": ["P1470"]}, {"id": "P1480", "text": ["9.  Press the HOLD switch on the frequency counter. Notice the         display is held at the number of cycles received up until the            time you pressed HOLD. However, only the display is                       stopped. The circuits inside the frequency counter are still              counting cycles.", "9. Press the HOLD switch on the frequency counter. Notice the display is held at the number of cycles received up until the time you pressed HOLD. However, only the display is stopped. The circuits inside the frequency counter are still counting cycles."], "jumps": ["P1490", "P1470"]}, {"id": "P1485", "text": ["MULTIFUNCTION COUNTER SETUP - Set the Frequency Counter Display to Hold."], "jumps": []}, {"id": "P1490", "text": ["10.  Press the HOLD switch again. Notice the display immediately         resumes at the actual number of pulses received since the             last time the RESET switch was pressed. The counting                    process does not stop when the HOLD button is pressed.", "10. Press the HOLD switch again. Notice the display immediately resumes at the actual number of pulses received since the last time the RESET switch was pressed. The counting process does not stop when the HOLD button is pressed."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["11.  Press the RESET switch in and hold it in.    \n12.  Press the 1 M range switch on the function generator.               13.  Ensure that the frequency dial on the function generator is             set  to 5.", "11. Press the RESET switch in and hold it in. 12. Press the 1 M range switch on the function generator. 13. Ensure that the frequency dial on the function generator is set to 5."], "jumps": ["P1510", "P1490"]}, {"id": "P1505", "text": ["MULTIFUNCTION COUNTER SETUP - Set the Frequency Counter Display to Reset."], "jumps": ["P1507", "P1500"]}, {"id": "P1507", "text": ["MEASUREMENT SETUP - Change Function Generator Range to 1 M and turn Frequency Dial to 5."], "jumps": ["P1500", "P1505"]}, {"id": "P1510", "text": ["The function generator is producing a 5 MHz signal. When you release the RESET switch, the frequency counter display will begin  incrementing at a rate of 5 million times per second.", "The function generator is producing a 5 MHz signal. When you release the RESET switch, the frequency counter display will begin incrementing at a rate of 5 million times per second. i"], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["With a 5 MHz signal applied, the display will reach its limit of 99,999,999 in about 20 seconds. When the count exceeds this, the OF (overflow) indicator will come on. 14. Release the RESET switch and observe the process."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["Now that you have seen all of the functions that a frequency counter performs, you will be able to apply this knowledge when  troubleshooting circuits.", "Now that you have seen all of the functions that a frequency counter performs, you will be able to apply this knowledge when troubleshooting circuits. i"], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial c let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
