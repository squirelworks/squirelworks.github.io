Gain - High    Current Gain - Low      Power Gain - Medium Input Resistance - Low    Output Resistance - High", "The common base amplifier is normally used to match a low input resistance source to a high output resistance load. Voltage Gain - High Current Gain - Low Power Gain - Medium Input Resistance - Low Output Resistance - Highhhhhhh"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on COMMON BASE AMPLIFIER..........................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical common base amplifier circuit.", "This is a typical common base amplifier circuit............"], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["For this discussion an NPN transistor is used. Note that Vcc is positive."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["The amplifier's output is controlled by a small input signal."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The output signal is a large replica of the input signal."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The amplifier has two basic circuits: \n1. Input  - Emitter to Base \n2. Output - Base to Collector", "The amplifier has two basic circuits: 1. Input - Emitter to Base 2. Output - Base to Collector"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["Note, the base is common to both circuits.\n1. Input  - Emitter to Base \n2. Output - Base to Collector", "Note, the base is common to both circuits. 1. Input - Emitter to Base 2. Output - Base to Collector"], "jumps": ["P1075", "P1060"]}, {"id": "P1075", "text": ["This means that a change in one circuit effects the other circuit."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A changing input signal changes the bias voltage on the emitter of the transistor."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["When the input signal increases, the emitter voltage increases,  decreasing the forward bias on the base to emitter PN junction.", "When the input signal increases, the emitter voltage increases, decreasing the forward bias on the base to emitter PN junction."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["A decreased forward bias decreases emitter to collector current.", "A decreased forward bias decreases collector to emitter current.", "A decreased forward bias decreases emitter to collector current.A decreased forward bias decreases emitter to collector current."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["When the input signal decreases, the voltage on the emitter decreases, increasing forward bias on the base to emitter PN junction."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["An increased forward bias increases emitter to collector current.", "An increased forward bias increases collector to emitter current."], "jumps": ["P1130", "P1060"]}, {"id": "P1130", "text": ["The effects of a changing input signal are seen in a changing output signal."], "jumps": ["P1140", "P1060"]}, {"id": "P1140", "text": ["Note, an increasing input signal produces an increasing output signal."], "jumps": ["P1150", "P1060"]}, {"id": "P1150", "text": ["A decreasing input signal produces a decreasing output signal."], "jumps": ["P1160", "P1060"]}, {"id": "P1160", "text": ["A small input signal controlled a large output signal."], "jumps": ["P1170", "P1060"]}, {"id": "P1170", "text": ["In a common base amplifier, when the emitter voltage increases the emitter to base forward bias _______"], "jumps": ["P1060"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["When the emitter voltage increases, the voltage difference between the base and emitter decreases. This will not increase forward bias."], "jumps": []}, {"id": "P1173", "text": ["When the emitter voltage increases, the voltage difference between the base and emitter decreases. Forward bias does not stay the same."], "jumps": []}, {"id": "P1180", "text": ["In a common base amplifier, when emitter voltage increases, emitter current _______"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1182", "text": ["When the emitter voltage increases, the base to emitter forward bias decreases. Emitter current will not increase."], "jumps": []}, {"id": "P1183", "text": ["When the emitter voltage increases, the base to emitter forward bias decreases. Emitter current will not stay the same."], "jumps": []}, {"id": "P1190", "text": ["Transistor bias is determined by R1, R2, R3, R4 and C1.", "Transistor bias is determined by R1, R2, R3, R4 and C1....."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["R1 and R2 develop the base bias of Q1 and establish the operating point.", "R1 and R2 develop the base bias of Q1 and establish the operating point..rating point."], "jumps": ["P1205", "P1190"]}, {"id": "P1205", "text": ["R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1."], "jumps": ["P1210", "P1190"]}, {"id": "P1206", "text": ["VOLTAGE DIVIDER - A voltage divider reduces the applied voltage. The voltage at the top of R1 is Vcc. R1 reduces Vcc so the voltage at the bottom of R1 is less than Vcc. R2 drops the rest of the voltage."], "jumps": ["P1208"]}, {"id": "P1208", "text": ["R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1.", "R1 and R2 form a voltage divider that is operated by +Vcc. A fixed bias is always present on the base of Q1..."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["C1 grounds any AC voltage that develops on the base."], "jumps": ["P1220", "P1208"]}, {"id": "P1220", "text": ["Resistor R4 establishes emitter bias. Any change in emitter voltage produces a predictable change at the output."], "jumps": ["P1230", "P1208"]}, {"id": "P1230", "text": ["The output signal is determined by collector load resistor R3."], "jumps": ["P1240", "P1208"]}, {"id": "P1240", "text": ["An increasing input signal decreases the emitter to collector current. Less voltage drops across R3 and the output signal increases."], "jumps": ["P1250", "P1208"]}, {"id": "P1250", "text": ["A decreasing input signal increases current.  More voltage drops across R3 and the output signal decreases.", "A decreasing input signal increases current. More voltage drops across R3 and the output signal decreases."], "jumps": ["P1260", "P1208"]}, {"id": "P1260", "text": ["The result is an output signal that is an amplified replica of the input signal."], "jumps": ["P1270", "P1208"]}, {"id": "P1270", "text": ["Now let's add two important components to the amplifier circuit, C2 and C3."], "jumps": ["P1280", "P1208"]}, {"id": "P1280", "text": ["C2 is an input coupling capacitor that prevents DC voltage from reaching the emitter of the transistor."], "jumps": ["P1290", "P1208"]}, {"id": "P1290", "text": ["C3 is an output coupling capacitor and prevents the DC bias on the collector from reaching the output."], "jumps": ["P1300", "P1208"]}, {"id": "P1300", "text": ["The coupling capacitors do not effect the DC bias voltages on Q1.", "The coupling capacitors do not effect the DC bias voltages on Q1..."], "jumps": ["P1310", "P1208"]}, {"id": "P1310", "text": ["Touch the component(s) that establish the base bias for Q1?", "Touch the component(s) that establish the base bias for Q1??"], "jumps": ["P1208"]}, {"id": "P1311", "text": [], "jumps": []}, {"id": "P1312", "text": ["C2 is the input coupling capacitor.  C2 prevents DC voltages from the input signal reaching the transistor emitter.", "C2 is the input coupling capacitor. C2 prevents DC voltages from the input signal reaching the transistor emitter.r emitter."], "jumps": []}, {"id": "P1313", "text": ["R3 is the collector load resistor.  It develops the output signal and reverse biases the collector to base PN junction.", "R3 is the collector load resistor. It develops the output signal and reverse bias let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
