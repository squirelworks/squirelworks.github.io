<script>
const book = {"title": "93951604", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: BASIC WIRE WRAPPING TECHNIQUESsfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Recognize the characteristics of good wire wrap. w Understand the procedure for making good wire wrap connections. w Recognize common wire wrapping faults.....", "w Understand wire wrapping terminology. w Identify common types of wire wraps. w Identify common wire wrap tools."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Wire wrapping is a quick, reliable, solderless method of making electrical connections between points in an electrical circuit when applied by a trained technician."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The connections are made by wrapping connecting wires around strong metal pins.  The tight wire forms a gas-tight, low-resistance electrical connection when the wrap is properly made.", "Wire wrapping is very good for making prototype circuit boards due to its quickness, and its ability to be used even for high density circuit boards.", "The connections are made by wrapping connecting wires around strong metal pins. The tight wire forms a gas-tight, low-resistance electrical connection when the wrap is properly made."], "jumps": ["P420", "P400", "P430", "P410"]}, {"id": "P430", "text": ["Technicians who perform wire wrap connections must be familiar with the associated techniques and possible problems of the method."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["The art of making good wire wrap connections is achieved solely by practice.  There are several conditions which make wire wraps unacceptable.", "The art of making good wire wrap connections is achieved solely by practice. There are several conditions which make wire wraps unacceptable. ese will be discussed later in this lesson."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["In this lesson we will introduce the proper procedure for making good wire wrap connections and discuss the common problems with wire wrapping."], "jumps": ["P460", "P430"]}, {"id": "P460", "text": ["Let's begin the lesson on BASIC WIRE WRAPPING TECHNIQUES...................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Wire wrap connections are made by wrapping wire around strong metal pins.  If the wire wraps are wrapped tightly a good electrical connection is made between the wire and the metal pin.", "Wire wrap connections are made by wrapping wire around strong metal pins. If the wire wraps are wrapped tightly a good electrical connection is made between the wire and the metal pin."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Wire wrap connections are frequently used in the assembly of prototype circuit boards, low volume circuit board production runs, or as a means to hardware (jumper select) circuit board options and/or configurations."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["While technicians in the service and repair sector of the industry are unlikely to wire wrap prototype circuits they are almost           certainly required to use wire wrapping techniques to select circuit board configurations with wire wrapped jumpers.", "This type of circuit board configuration is typical on computer mother boards or back planes and on many computer peripheral circuit boards, particularly if they are high density boards.", "While technicians in the service and repair sector of the industry are unlikely to wire wrap prototype circuits they are almost certainly required to use wire wrapping techniques to select circuit board configurations with wire wrapped jumpers.", "This type of circuit board configuration is typical on computer mother boards or back planes and on many computer peripheral circuit boards, particularly if they are high density boards. (GRAPHICS TEXT) Rear view of a motherboard showing wire wrap pins and several wire wrapsssss", "Rear view of a motherboard showing wire wrap pins and several wire wraps"], "jumps": ["P1050", "P1030", "P1060", "P9P"]}, {"id": "P1055", "text": ["MOTHER BOARD - In computer systems, this is the main circuit board which typically includes connectors for plugging in peripheral circuit boards.", "Top View - Motherboard rd showing wire wrap pins and several wire wraps"], "jumps": []}, {"id": "P1056", "text": ["BACK PLANE - In multi-circuit card applications, this is a circuit board in which all other cards plug into. The back plane circuit board provides all of the circuit card inter-connections.", "Back Plane -Top View Showing Connectorsss"], "jumps": []}, {"id": "P1060", "text": ["It is therefore essential that technicians know how to properly remove and install good wire wrap connections."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Wire wrapping is a method of producing easily removable solderless electrical connections."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["A wire wrap connection consists of a helix of continuous, solid, uninsulated round wire tightly wrapped around a suitable square or rectangular cross-section terminal known as a wire wrap post producing a mechanically stable and electrically reliable connection."], "jumps": ["P1090", "P1060"]}, {"id": "P1085", "text": ["WIRE WRAP POST - A square or rectangular terminal around which wire is wrapped to form an electrical connection."], "jumps": []}, {"id": "P1090", "text": ["To make suitable wire wrap connections to circuit board components, these components must have a wire wrap post termination."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Since most, if not all electronic components are not manufactured with wire wrap post terminations, manufacturers have produced various types of sockets and pins which accept standard component terminations on one end and provide wire wrap posts on the other.", "Wire Wrap Post for Discrete Components"], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The most common type of wire wrap socket is the IC wire wrap socket.  This device allows the IC to be placed into the socket and wire wrap connections to be made at its pins.", "The most common type of wire wrap socket is the IC wire wrap socket. This device allows the IC to be placed into the socket and wire wrap connections to be made at its pins."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Circuit board mountable wire wrap pins are available for components such as resistors that do not fit in IC or similar sockets.  In such cases the component is soldered to one end of the pin and the wire wrap connection is made to the other.", "Circuit board mountable wire wrap pins are available for components such as resistors that do not fit in IC or similar sockets. In such cases the component is soldered to one end of the pin and the wire wrap connection is made to the other."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["In all cases, the wire wrap post must be a sharp cornered, four sided post to produce high pressure points resulting in indentations of the wire and consequent gas tight connections  between the wire and the post.", "In all cases, the wire wrap post must be a sharp cornered, four sided post to produce high pressure points resulting in indentations of the wire and consequent gas tight connections between the wire and the post."], "jumps": ["P1132", "P1120"]}, {"id": "P1132", "text": ["A wire wrapping post is _______.", "A wire wrapping post is _______........ce _______..........", "square ."], "jumps": []}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1133", "text": ["A wire wrap post is a square or rectangular terminal around which wire is wrapped to form an electrical connection.", "A wire wrap post is a square or rectangular terminal around which wire is wrapped to form an electrical connection........."], "jumps": []}, {"id": "P1135", "text": ["GAS TIGHT CONNECTION - The area between the wrap post corner and the wire which prevents air or gas fumes from corroding these points of electrical contact."], "jumps": []}, {"id": "P1140", "text": ["There are two basic types of wire wraps; Conventional Wrap and Modified Wrap.  The modified wrap is standard for most military equipment.", "There are two basic types of wire wraps; Conventional Wrap and Modified Wrap. The modified wrap is standard for most military equipment."], "jumps": ["P1150", "P1132"]}, {"id": "P1150", "text": ["A conventional wrap, also known as a Class B Wrap, is a connection having no insulated turns, only the required turns of bare wire.", "Conventional Wrap or Class B Wrappppppppp"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Conventional wraps may result in possible shorting caused by bare wires touching one another.  For this reason conventional wraps are not acceptable on products produced for the military, although they may be permitted in commercial products.", "Conventional wraps may result in possible shorting caused by bare wires touching one another. For this reason conventional wraps are not acceptable on products produced for the military, although they may be permitted in commercial products."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["A modified wrap, also known as a Class A Wrap, is a connection having a minimum of one-half turn of insulated wire wrapped around the terminal in addition to the required number of uninsulated turns.", "Modified Wrap or Class A Wrap"], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Modified wraps prevent possible shorts caused by bare wires touching one another.  Modified wraps are the only acceptable wrap permitted on products produced for the military.", "Modified wraps prevent possible shorts caused by bare wires touching one another. Modified wraps are the only acceptable wrap permitted on products produced for the military."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["Since modified wraps are the preferred type of wire wrap connection we will confine all further discussions to modified wrap."], "jumps": ["P1192", "P1170"]}, {"id": "P1192", "text": ["Which type of wrap does not have insulated turns?", "Which type of wrap does not have insulated turns?..........", "standard ."], "jumps": []}, {"id": "P1193", "text": ["A modified wrap is a connection that has a minimum of one-half turn of insulated wire wrapped around the terminal in addition to the required number of uninsulated turns.", "Modified Wrap or Class A Wrap"], "jumps": []}, {"id": "P1194", "text": ["Standard is not a basic wrap method.  The two common methods of wraps are conventional and modified.", "Standard is not a basic wrap method. The two common methods of wraps are conventional and modified. nsulated turns.", "Modified Wrap or Class A Wrap"], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1200", "text": ["A wire wrap connection consists of a number of turns of wire around a wire wrap post.  The required number of turns varies depending upon the wire gauge used to make the wrap.", "A wire wrap connection consists of a number of turns of wire around a wire wrap post. The required number of turns varies depending upon the wire gauge used to make the wrap.", "Wire Insulation Wrap Bare Wire Wrap Gauge Min. Max Min. Max"], "jumps": ["P1210", "P1192"]}, {"id": "P1210", "text": ["For 30 AWG wire, the most commonly used wire gauge, 7 turns minimum to 10 turns maximum of bare wire must be wrapped around the wrap post."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The table below shows the number of insulated and bare wire turns required for modified wire wrap connections for the standard wire gauges typically used in wire wrap connections."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["One turn of wire consists of a complete 360 degree wrap around the post.  The number of times the wrapped wire intercepts the wrap post reference edge after the first interception of bare wire  determines the number of turns making up the connection.", "One turn of wire consists of a complete 360 degree wrap around the post. The number of times the wrapped wire intercepts the wrap post reference edge after the first interception of bare wire determines the number of turns making up the connection."], "jumps": ["P1240", "P1200"]}, {"id": "P1235", "text": ["REFERENCE EDGE - The first corner of the wrap post that the uninsulated wire passes and intercepts is the reference edge. It is used as the starting point for counting turns."], "jumps": []}, {"id": "P1240", "text": ["Each connection must have from 1/2 to 2 turns of insulated wire around the wrap post before the start of the bare wire.  To meet the half-turn requirement, the insulation must intercept and make firm contact on at least three corners of the post.", "Each connection must have from 1/2 to 2 turns of insulated wire around the wrap post before the start of the bare wire. To meet the half-turn requirement, the insulation must intercept and make firm contact on at least three corners of the post."], "jumps": ["P1243", "P1230"]}, {"id": "P1242", "text": ["Each connection must have from 1/2 to 2 turns of insulated wire around the wrap post before the start of the bare wire. To meet the half-turn requirement, the insulation must intercept and make firm contact on at least three corners of the post."], "jumps": ["P1243", "P1230"]}, {"id": "P1245", "text": ["Full Turn of Wire - The insulated wire makes contact with all four corners of the wrap post..", "Half Turn of Wire - The insulated wire makes contact with only three corners of the wrap post.", "HALF-TURN - A 180 degree wrap in which the insulated wire must be in contact with three corners of the wrap post."], "jumps": []}, {"id": "P1243", "text": ["One turn of wire consists of a _______ degree wrap around the post.", "One turn of wire consists of a _______ degree wrap around the post.st.", "360 ."], "jumps": []}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1244", "text": ["270 degrees is not a complete wire turn.  The wire must touch all four corners of the wire wrap post to form one complete wire turn.", "270 degrees is not a complete wire turn. The wire must touch all four corners of the wire wrap post to form one complete wire turn.he number of turns making up the connection.", "Full Turn of Wire - The insulated wire makes contact with all four corners of the wrap post.."], "jumps": []}, {"id": "P1246", "text": ["180 degrees is only half a turn of wire.  The wire must touch all four sides of the wire wrap post to be complete.", "180 degrees is only half a turn of wire. The wire must touch all four sides of the wire wrap post to be complete. .es. determines the number of turns making up the connection.", "Full Turn of Wire - The insulated wire makes contact with all four corners of the wrap post..", "Half Turn of Wire - The insulated wire makes contact with only three corners of the wrap post."], "jumps": []}, {"id": "P1250", "text": ["Wire wrap connections require three basic components.", "Wire wrap connections require three basic components......."], "jumps": ["P1260", "P1243"]}, {"id": "P1260", "text": ["The wrap post is the connection point for all wiring.", "The wrap post is the connection point for all wiring..."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The  wire used is typically No. 30 AWG, single stranded and insulated.", "The wire used is typically No. 30 AWG, single stranded and insulated......"], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["The wire wrap tool  may be manual, battery powered, or                    pneumatic.  Pneumatic and battery powered units are                       commonly used for military construction, while hand and                battery operated tools are common for field repairs.", "The wire wrap tool may be manual, battery powered, or pneumatic. Pneumatic and battery powered units are commonly used for military construction, while hand and battery operated tools are common for field repairs."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["The manual tool that we will be discussing is the OK Industries type as illustrated below."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["This device is really a combination tool because it contains a wrap bit, a wire stripper (for 30 gauge wire only), and an unwrap bit all in one."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["The battery power tool that we will be discussing is similar to most major brand models.  This is a self contained unit consisting of a gun, a bit and sleeve combination and a battery   pack.", "The battery power tool that we will be discussing is similar to most major brand models. This is a self contained unit consisting of a gun, a bit and sleeve combination and a battery pack. elow."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["A different size wire wrap bit is normally required for each wire size wrapped.  With small AWG wires, two adjacent wire sizes may be used in one bit size.  Bits are available for wrapping solid wire from 19 AWG through 30 AWG.", "A different size wire wrap bit is normally required for each wire size wrapped. With small AWG wires, two adjacent wire sizes may be used in one bit size. Bits are available for wrapping solid wire from 19 AWG through 30 AWG."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The type of bit selected determines if the resultant wrap is modified or conventional."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Modified wraps are produced by a bit that has additional machining at the point where the wire enters the bit which accepts approximately 1/8\" of insulated wire in addition to the bare wire.", "Modified Wrap or Class A Wrap"], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["In the case of wire wrap hand tool the wire wrap bit is an integral part of the tool.  To change bit sizes you must select another hand tool machined for the required wire gauge.", "In the case of wire wrap hand tool the wire wrap bit is an integral part of the tool. To change bit sizes you must select another hand tool machined for the required wire gauge."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The automatic (wire wrap gun) wire wrap tools accept different sized wire wrap bits which may be exchanged as required."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Each bit used in automatic wire wrap tools is used in combination with a sleeve.  The bit rotates inside the stationary sleeve to form a wrap.", "Each bit used in automatic wire wrap tools is used in combination with a sleeve. The bit rotates inside the stationary sleeve to form a wrap."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["If automatic wire wrap tools start to produce poor quality wraps, both the wire wrap bit and sleeve should be replaced."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["In addition to the wire wrapping tool the technician requires an unwrapping tool."], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["An unwrap tool is used for removing an unwanted or poor quality wrap from its wrap post.  The use of the tool allows the wrap to be unwound from the wrap post without leaving wire scraps in the chassis.", "An unwrap tool is used for removing an unwanted or poor quality wrap from its wrap post. The use of the tool allows the wrap to be unwound from the wrap post without leaving wire scraps in the chassis."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Unwrap tools are turned counter-clock wise, by hand, and initially picks up the top wrap, loosening the other turns as it moves down the post."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["Finally, the wire wrap technician requires a suitable wire stripper."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["Hand wire strippers are used on 10 AWG or smaller wires when automatic machine stripped or pre-stripped wires are unavailable."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["Hand wire strippers have fixed die-type blades which cut the insulation when the jaws close and strip the insulation as the wire is pulled through the jaws."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["Wire strippers can wear out.  Do not use strippers that produce excessively frayed edges or that split the insulation.  When fraying occurs, the wire stripper or its blade (if removable) must be replaced.", "Wire strippers can wear out. Do not use strippers that produce excessively frayed edges or that split the insulation. When fraying occurs, the wire stripper or its blade (if removable) must be replaced."], "jumps": ["P1460", "P1420"]}, {"id": "P1460", "text": ["When the technician must hand strip twisted wire pair, trio, or quad wires, the wire must be untwisted enough so that the stripper jaws will only strip a single wire at a time."], "jumps": ["P1910", "P1420"]}, {"id": "P1465", "text": ["TWISTED WIRE PAIR - Two solid conductor wires twisted together. These wires are used where electrical interference could be a problem."], "jumps": []}, {"id": "P1699", "text": ["The following ten (10) questions provide you with a review of the material covered on the Introduction to Wire Wrapping."], "jumps": ["P1700", "P1001"]}, {"id": "P1700", "text": ["1.  Modified wrap is the standard for military equipment because\n     it _______.", "1. Modified wrap is the standard for military equipment because it _______........", "prevents electrical shorts between adjacent pins..s."], "jumps": ["P1699"]}, {"id": "P1710", "text": ["2.  Conventional wrap differs from modified wrap in that it \n     _______.", "2. Conventional wrap differs from modified wrap in that it _______..", "does not have turns of insulated wire.......re."], "jumps": ["P1700"]}, {"id": "P1720", "text": ["3.  Which wire wrap connection is a modified wrap?", "3. Which wire wrap connection is a modified wrap?........."], "jumps": ["P1710"]}, {"id": "P1730", "text": ["4.  A full wire wrap turn requires that the insulated wire make\n     contact with _______.", "4. A full wire wrap turn requires that the insulated wire make contact with _______.", "three corners of the wrap postthe wrap post post.", "two corners of the wrap postthe wrap post post.", "four corners of the wrap postthe wrap post post."], "jumps": ["P1720"]}, {"id": "P1740", "text": ["5.  For modified wrap, 24 AWG wire requires a minimum of                    _______ and a maximum of _______ turns of insulated wire            and _______ to _______ turns of bare wire.", "5. For modified wrap, 24 AWG wire requires a minimum of _______ and a maximum of _______ turns of insulated wire and _______ to _______ turns of bare wire..", "Wire Insulation Wrap Bare Wire Wrap Gauge Min. Max Min. Max"], "jumps": ["P1730"]}, {"id": "P1743", "text": ["Your answers are still incorrect.  A modified wrap of 24 AWG wire requires a minimum of 1/2 and a maximum of 2 turns of insulated wire and 5 to 6 turns of bare wire.", "Your answers are still incorrect. A modified wrap of 24 AWG wire requires a minimum of 1/2 and a maximum of 2 turns of insulated wire and 5 to 6 turns of bare wire..............", "Wire Insulation Wrap Bare Wire Wrap Gauge Min. Max Min. Max", "24 1/2 2 5 6 6", "24 1/2 2 5 6"], "jumps": ["P1750", "P1740"]}, {"id": "P1750", "text": ["6.  Modified wrap is also known as _______.", "6. Modified wrap is also known as _______................."], "jumps": ["P1740"]}, {"id": "P1760", "text": ["7.  The reference edge of the wire wrap connection shown below       is _______.", "7. The reference edge of the wire wrap connection shown below is _______."], "jumps": ["P1750"]}, {"id": "P1770", "text": ["8.  When wire strippers start to produce frayed edges on the                stripped wire the wire _______.", "8. When wire strippers start to produce frayed edges on the stripped wire the wire _______.", "stripper blade must be sharpened.harpened.", "gauge is too small for the tool.the tool.", "stripper or its blade must be replaced.replaced."], "jumps": ["P1760"]}, {"id": "P1780", "text": ["9.  When stripping twisted wire pair the wire _______.", "9. When stripping twisted wire pair the wire _______......", "must be untwisted enough so that the stripper jaws will strip both wires at the same time.", "tips must be tinned with solder after the insulation has been removed.", "must be untwisted enough so that the stripper jaws will strip a single wire at a time."], "jumps": ["P1770"]}, {"id": "P1790", "text": ["10.  An unwrap tool is used for removing an unwanted or poor             quality wrap from the wrap post because it _______.", "10. An unwrap tool is used for removing an unwanted or poor quality wrap from the wrap post because it _______.", "allows the re-use of the wrapped wire.re.", "allows the wrap to be unwound without leaving wire scraps in the chassis.is."], "jumps": ["P1780"]}, {"id": "P1799", "text": ["You have completed the Exercise.\nYou are about to return to the Objective Menu.", "You have completed the Exercise. You are about to return to the Objective Menu......."], "jumps": ["P1001", "P1790"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on INTRODUCTION TO WIRE WRAPPING."], "jumps": ["P1001", "P1460"]}, {"id": "P1920", "text": ["1.  Wire wrapping is a quick, reliable, solderless method of                    making electrical connections between points in an electrical        circuit when proper wire wrapping techniques are applied.", "1. Wire wrapping is a quick, reliable, solderless method of making electrical connections between points in an electrical circuit when proper wire wrapping techniques are applied."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Wire wrap connections are made by wrapping wire around              strong metal pins.  If the wire wraps are wrapped tightly a                good electrical connection is made between the wire and the         metal pin.", "2. Wire wrap connections are made by wrapping wire around strong metal pins. If the wire wraps are wrapped tightly a good electrical connection is made between the wire and the metal pin."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  There are two basic types of wire wraps; Conventional Wrap          and Modified Wrap.  The modified wrap is standard for most           military equipment.", "3. There are two basic types of wire wraps; Conventional Wrap and Modified Wrap. The modified wrap is standard for most military equipment."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  A conventional wrap, also known as a Class B Wrap, is a                connection having no insulated turns, only the required turns       of bare wire.", "4. A conventional wrap, also known as a Class B Wrap, is a connection having no insulated turns, only the required turns of bare wire."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  A modified wrap, also known as a Class A Wrap, is a                         connection having a minimum of one-half turn of insulated             wire wrapped around the terminal in addition to the required          number of uninsulated turns.", "5. A modified wrap, also known as a Class A Wrap, is a connection having a minimum of one-half turn of insulated wire wrapped around the terminal in addition to the required number of uninsulated turns."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  A wire wrap connection consists of a number of turns of wire        around a wire wrap post.  The required number of turns varies      depending upon the wire gauge used to make the wrap.", "6. A wire wrap connection consists of a number of turns of wire around a wire wrap post. The required number of turns varies depending upon the wire gauge used to make the wrap.", "Wire Insulation Wrap Bare Wire Wrap Gauge Min. Max Min. Max"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Wire wrap connections require three basic components; a              wrap post, wire, and a wire wrap tool.", "7. Wire wrap connections require three basic components; a wrap post, wire, and a wire wrap tool."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The wrap post is the connection point for all wiring.  The post is normally square or rectangular with sharp corners.", "The wrap post is the connection point for all wiring. The post is normally square or rectangular with sharp corners."], "jumps": ["P2022", "P2001"]}, {"id": "P2022", "text": ["There are three common faults in wire wrapping, the open wrap, the spiral wrap, and the overwrap."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["The open wrap is unacceptable because the spacing between the turns destroys the gas tight area around the wrap."], "jumps": ["P2040", "P2022"]}, {"id": "P2040", "text": ["The spiral wrap is similar to the open wrap but has all turns spaced and makes for both a non-gas tight connection and a loose electrical connection."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["The over wrap has turns overlapped on top of one another which reduces strength and reliability."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["When two wraps are made on the same wrap post the wraps must not overlap.  There must be a minimum space of 1/32\" to 1/16\" between wraps and the upper wrap's insulated turns must be in full contact with the wrap post for a half turn.", "When two wraps are made on the same wrap post the wraps must not overlap. There must be a minimum space of 1/32\" to 1/16\" between wraps and the upper wrap's insulated turns must be in full contact with the wrap post for a half turn.", "Insulation wrap in contact with 3 corners of wrap post", "Insulation wrap not contacting 3 corners of wrap postttttt"], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["The end of the last turn of a wrapped connection, called an end tail or pig tail must not extend away from the outside diameter of the bare wire on the wrap post by more than the diameter of the stripped wire."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The end tail may extend onto the apex of the wrap post if 1/2 or more of the diameter is below the taper portion of the post.", "Maximum height that wrap may terminate on pin"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["A rejectable end tail must not be reworked in any way; it must be completely removed and replaced with a new wrap.  Reworking is likely  to produce mechanical disturbance and therefore is not allowed.", "A rejectable end tail must not be reworked in any way; it must be completely removed and replaced with a new wrap. Reworking is likely to produce mechanical disturbance and therefore is not allowed."], "jumps": ["P2092", "P2080"]}, {"id": "P2092", "text": ["When two wraps are made on the same wrap post the wraps must have a minimum space of _______ between wraps.", "When two wraps are made on the same wrap post the wraps must have a minimum space of _______ between wraps......etween wraps.and the upper wrap's insulated turns must be in full contact with the wrap post for a half turn.", "1/16\" to 1/8\" ."], "jumps": []}, {"id": "P2091", "text": [], "jumps": []}, {"id": "P2093", "text": ["There must be a minimum space of 1/32\" to 1/16\" between wraps and the upper wrap's insulated turns must be in full contact with the wrap post for a half turn.", "There must be a minimum space of 1/32\" to 1/16\" between wraps and the upper wrap's insulated turns must be in full contact with the wrap post for a half turn. act with the wrap post for a half turn.", "Insulation wrap in contact with 3 corners of wrap post", "Insulation wrap not contacting 3 corners of wrap postttttt"], "jumps": []}, {"id": "P2100", "text": ["The first step in making a handwrapped wire wrap connection is the wire preparation.  Prepare the wire by stripping the insulation to a length which is determined by the wire gauge and pin size.", "The first step in making a handwrapped wire wrap connection is the wire preparation. Prepare the wire by stripping the insulation to a length which is determined by the wire gauge and pin size.", "Pin Size Strip Lengths : Inches + 1/16", "30GA 28GA 26GA 24GA 22GA 20GA 18GAA", "1-3/4 1-3/4 1-1/2 1-1/4 1-1/2 1-5/16 1-7/16666", "1-3/4 1-13/16 1-7/16 1-5/16 1-9/16 1-3/16 1-1/26666666`"], "jumps": ["P2110", "P2092"]}, {"id": "P2110", "text": ["The number of turns obtained will be determined by the amount of insulation that has been removed."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["Next insert the stripped wire end into the wire slot of the wrapping bit.  Some of the insulation will be inserted into the bit to produce the required insulated turns.", "Next insert the stripped wire end into the wire slot of the wrapping bit. Some of the insulation will be inserted into the bit to produce the required insulated turns..."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["Now position the wire in the notch of the wrapping sleeve.  Then position trailing wire so that it points in the direction from which   it is being routed or the direction it will be routed.", "Now position the wire in the notch of the wrapping sleeve. Then position trailing wire so that it points in the direction from which it is being routed or the direction it will be routed."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Then position the tool with the terminal hole of the wrapping bit over the terminal to be wrapped, hold the tool perpendicular to the base plate and rotate the tool clockwise using minimal downward pressure.  The tool should \"float up\" on its own.", "Then position the tool with the terminal hole of the wrapping bit over the terminal to be wrapped, hold the tool perpendicular to the base plate and rotate the tool clockwise using minimal downward pressure. The tool should \"float up\" on its own."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Finally, remove the tool and inspect the wrap.  Check for open, spiral, overwraps, overlaps, and end tails.", "Finally, remove the tool and inspect the wrap. Check for open, spiral, overwraps, overlaps, and end tails."], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["Before using a wire wrap gun the tool must first be properly \nset-up.", "Before using a wire wrap gun the tool must first be properly set-up.."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The first step in setting up a wire wrap gun is the selection and insertion of the wire wrap bit into the gun.  Insert the tang of the bit into the gun with the flat pointing towards the handle. Then rotate the bit 180 degrees to align the tang with the drive spindle and finish inserting until the bit bottoms out.", "The first step in setting up a wire wrap gun is the selection and insertion of the wire wrap bit into the gun. Insert the tang of the bit into the gun with the flat pointing towards the handle. Then rotate the bit 180 degrees to align the tang with the drive spindle and finish inserting until the bit bottoms out."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["Next insert the sleeve into the gun with the key slot pointing towards the handle."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["With the sleeve bottomed out in the gun, rotate the bit.  If the sleeve is over-bottomed, the bit will not rotate freely.  The         increased tension between the bit and the sleeve can cause poor quality wraps.", "With the sleeve bottomed out in the gun, rotate the bit. If the sleeve is over-bottomed, the bit will not rotate freely. The increased tension between the bit and the sleeve can cause poor quality wraps."], "jumps": ["P2220", "P2160"]}, {"id": "P2220", "text": ["Tighten the locking nut hand tight and test the bit rotation again. If the bit does not rotate freely repeat the previous step."], "jumps": ["P2230", "P2160"]}, {"id": "P2230", "text": ["You are now ready to begin making wire wrap connections."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["As with the manual tool, the wire must first be stripped by about \n1/2\" before being inserted in the bit of the wire wrap gun.", "As with the manual tool, the wire must first be stripped by about 1/2\" before being inserted in the bit of the wire wrap gun."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["Insert the stripped wire into the offset hole of the bit.  A small amount of insulation must be inserted into the bit to make a          modified wrap.", "Insert the stripped wire into the offset hole of the bit. A small amount of insulation must be inserted into the bit to make a modified wrap."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Next insert the wrap pin into the center hole and squeeze the trigger to complete the wrap."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["It may take a few attempts to get the \"feel\" of the gun, so try wraps until you are comfortable with the gun and the wraps turn out well."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["As with the manual wrapping tool, you should not use excessive downward or upward pressure on the gun while the wrap is being made.  A neutral pressure is most effective.", "As with the manual wrapping tool, you should not use excessive downward or upward pressure on the gun while the wrap is being made. A neutral pressure is most effective."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["To remove a wire use the other end of the manual wire wrap tool or an unwrapping tool.  Place the unwrap tool over the terminal and rotate it counterclockwise to remove the wrap.", "To remove a wire use the other end of the manual wire wrap tool or an unwrapping tool. Place the unwrap tool over the terminal and rotate it counterclockwise to remove the wrap."], "jumps": ["P2300", "P2250"]}, {"id": "P2300", "text": ["Do not try another wrap with the previously wrapped wire, cut it off and discard it."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Again, once you have made the wrap, inspect it for the correct number of turns and to ensure that none of the faults mentioned  earlier in the lesson are present.", "Again, once you have made the wrap, inspect it for the correct number of turns and to ensure that none of the faults mentioned earlier in the lesson are present."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["The main points to keep in mind are:", "The main points to keep in mind are: RAPHICS TEXT) correct number of turns no open, spiral, or overwraps keep pigtails or end tails to a minimum", "correct number of turns no open, spiral, or over wraps keep pigtails or end tails to a minimum"], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["The final point to check for an acceptable wire wrap connection is the condition of the wire plating after wrapping.  The plating on the wire may be burnished (polished), nicked or gouged exposing copper.", "The final point to check for an acceptable wire wrap connection is the condition of the wire plating after wrapping. The plating on the wire may be burnished (polished), nicked or gouged exposing copper."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Copper exposure is allowable on the end tail back to the second intercept point corner.  This represents approximately 30% of the last turn of wire.", "Copper exposure is allowable on the end tail back to the second intercept point corner. This represents approximately 30% of the last turn of wire."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["While minor burnishing may be acceptable, it is not a desirable condition and the technician should consider replacing such wraps and adjusting wrapping techniques."], "jumps": ["P2360", "P2330"]}, {"id": "P2360", "text": ["Severe burnishing which exposes the underlying copper is normally caused by allowing the bit to continue to spin, with pressure applied against the top wrap, after all of the wrap has been withdrawn from the bit."], "jumps": ["P2370", "P2330"]}, {"id": "P2370", "text": ["The presence of exposed copper on the wrap might lead to corrosion over a long period of time and should therefore be avoided."], "jumps": ["P2380", "P2330"]}, {"id": "P2380", "text": ["Once acceptable wire wrap skills have been acquired wire routing and positioning must be considered."], "jumps": ["P2390", "P2330"]}, {"id": "P2390", "text": ["The wire wrap post is commonly long enough to allow for two or three wrap levels on the same post.  Note that in point to point wiring, the same level should be used for each end of the wire.", "The wire wrap post is commonly long enough to allow for two or three wrap levels on the same post. Note that in point to point wiring, the same level should be used for each end of the wire."], "jumps": ["P2400", "P2380"]}, {"id": "P2392", "text": ["The wire wrap post is commonly long enough to allow for two or three wrap levels on the same post.  Note that in point to point wiring, the same level should be used for each end of the wire.", "The wire wrap post is commonly long enough to allow for two or three wrap levels on the same post. Note that in point to point wiring, the same level should be used for each end of the wire."], "jumps": ["P2400", "P2380"]}, {"id": "P2395", "text": ["WRAP LEVEL - A wrap level is the zone on the wrap post designated for that wrap. Level 1 is the zone closest to the base, level 2 the next higher zone, etc. A small space of 1/32\" to a maximum of 1/16\" should be present between wrap levels."], "jumps": []}, {"id": "P2400", "text": ["Before wrapping, position the wire so that tension on the routed wire will not unwrap the connection.  When the wire wrap tool is held so the wire positioned in the slot of the sleeve is pointed toward its destination or its origin, the maximum amount of insulation wrap will be achieved.", "Before wrapping, position the wire so that tension on the routed wire will not unwrap the connection. When the wire wrap tool is held so the wire positioned in the slot of the sleeve is pointed toward its destination or its origin, the maximum amount of insulation wrap will be achieved.", "(Routing causes unwrapping of the insulation wrap)"], "jumps": ["P2410", "P2380"]}, {"id": "P2410", "text": ["Wire tension of a routed wire should be as close to zero as possible.  The wires should neither be loose as to cause undue    congestion nor so tight as to cause bad electrical contact or the   cutting of insulation.", "In cases where conductor runs are in excess of 6 inches conductor runs should be interlaced to assist in holding the wire runs in place.", "6.   When routing the wire from wrap post to wrap post use the             shortest route possible while maintaining 90 degree turning           points and avoiding basket weaving.", "Wire tension of a routed wire should be as close to zero as possible. The wires should neither be loose as to cause undue congestion nor so tight as to cause bad electrical contact or the cutting of insulation.", "BASKET WEAVING - The positioning of wire in a manner other than in a specific route so that it weaves around one or more adjacent wrap posts.", "Acceptable Routing Rejectable Routing", "6. When routing the wire from wrap post to wrap post use the shortest route possible while maintaining 90 degree turning points and avoiding basket weaving.", "INTERLACING - The weaving of a wire in the vertical plane over and under existing wires. This is done intentionally to prevent pop-up when hand-wrapping wires are over 6 inches in length. In some situations, interlacing is not desirable because of noise coupling."], "jumps": ["P2420", "P2400", "P2910", "P2980", "P2960"]}, {"id": "P2699", "text": ["The following ten (10) questions provide you with a review of the material covered on Wire Wrapping Techniques."], "jumps": ["P2700", "P2001"]}, {"id": "P2700", "text": ["1.  The open wrap is unacceptable because _______.", "1. The open wrap is unacceptable because _______..........", "wrap connections do not make electrical contact with the wrap post.", "the wrap connection is sensitive to noise coupling.", "the spacing between the turns destroys the gas tight area around the wrap."], "jumps": ["P2699"]}, {"id": "P2710", "text": ["2.  The spiral wrap is unacceptable because _______.", "2. The spiral wrap is unacceptable because _______........", "wrap connections make poor electrical contact with the wrap post.", "the spacing between the turns destroys the gas tight area around the wrap."], "jumps": ["P2700"]}, {"id": "P2720", "text": ["3.  The Over Wrap connection has turns overlapped on top of \n     one another which reduces _______.", "3. The Over Wrap connection has turns overlapped on top of one another which reduces _______."], "jumps": ["P2710"]}, {"id": "P2730", "text": ["4.  The common fault(s) in wire wrapping is/are _______.", "4. The common fault(s) in wire wrapping is/are _______...."], "jumps": ["P2720"]}, {"id": "P2740", "text": ["5.  The end tail of the last turn of a wrapped connection must not        extend away from the outside diameter of the bare wire on the       wrap post by more than _______.", "5. The end tail of the last turn of a wrapped connection must not extend away from the outside diameter of the bare wire on the wrap post by more than _______.", "the diameter of the wrap post.wrap post.", "1/2 the diameter of the wrap post.wrap post.", "the diameter of the stripped wire.pped wire."], "jumps": ["P2730"]}, {"id": "P2750", "text": ["6. The length of insulation stripped for a wire wrap connection is      determined by the _______.", "6. The length of insulation stripped for a wire wrap connection is determined by the _______."], "jumps": ["P2740"]}, {"id": "P2760", "text": ["7.  A previously wrapped wire _______.", "7. A previously wrapped wire _______......................", "may be re-used only if it is unwrapped with a proper unwrapping tool.", "may be re-used if the wire is removed without visible damage."], "jumps": ["P2750"]}, {"id": "P2770", "text": ["8.  Severe burnishing is normally caused by _______.", "8. Severe burnishing is normally caused by _______........", "allowing the bit to spin with pressure after all the wrap has been withdrawn from the bit."], "jumps": ["P2760"]}, {"id": "P2780", "text": ["9.  The wire tension on a routed wire _______.", "9. The wire tension on a routed wire _______.............."], "jumps": ["P2770"]}, {"id": "P2790", "text": ["10.  Interlaced wire routing should be _______.", "10. Interlaced wire routing should be _______.............", "employed on wire runs which are less than 6 inches.", "employed on wire runs in excess of 6 inches.", "employed on wire runs in excess of 8 inches."], "jumps": ["P2780"]}, {"id": "P2799", "text": ["This completes the exercise for WIRE WRAPPING TECHNIQUES.", "This completes the exercise for WIRE WRAPPING TECHNIQUES. to the Objective Menu......."], "jumps": ["P2001", "P2790"]}, {"id": "P2800", "text": [], "jumps": []}, {"id": "P2801", "text": [], "jumps": []}, {"id": "P2910", "text": ["This completes the information on WIRE WRAPPING TECHNIQUES."], "jumps": ["P2001", "P2430"]}, {"id": "P2920", "text": ["1.  The wrap post is the connection point for all wiring.  The post         is normally square or rectangular with sharp corners.", "1. The wrap post is the connection point for all wiring. The post is normally square or rectangular with sharp corners."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  There are three common faults in wire wrapping, the open               wrap, the spiral wrap, and the over wrap.", "2. There are three common faults in wire wrapping, the open wrap, the spiral wrap, and the over wrap."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  When two wraps are made on the same wrap post the wraps          must not overlap.  There must be a minimum space of 1/32\" to       1/16\" between wraps and the upper wrap's insulated turns             must be in full contact with the wrap post for a half turn.", "3. When two wraps are made on the same wrap post the wraps must not overlap. There must be a minimum space of 1/32\" to 1/16\" between wraps and the upper wrap's insulated turns must be in full contact with the wrap post for a half turn.", "Insulation wrap in contact with 3 corners of wrap post", "Insulation wrap not contacting 3 corners of wrap postttttt"], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  The end of the last turn of a wrapped connection, called an            end tail or pig tail must not extend away from the outside                 diameter of the bare wire on the wrap post by more than the           diameter of the stripped wire.", "4. The end of the last turn of a wrapped connection, called an end tail or pig tail must not extend away from the outside diameter of the bare wire on the wrap post by more than the diameter of the stripped wire."], "jumps": ["P2960", "P2940"]}, {"id": "P2960", "text": ["5.  Do not try another wrap with the previously wrapped wire, cut       it off and discard it.", "5. Do not try another wrap with the previously wrapped wire, cut it off and discard it."], "jumps": ["P2970", "P2950"]}, {"id": "PINFO", "text": ["6.   When routing the wire from wrap post to wrap post use the             shortest route possible while maintaining 90 degree turning           points and avoiding basket weaving.", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 02-21-00 Changed copyright date on page Q0 to 1999-2000. Penny 03-09-00 Changed the red mat on the main window viewer to blue. Changed the high yellow word in text field of definition page to blue, Q1055. Added a 4 distractor touch area question page, Q1240. - Penny 05-01-00 Converted from SAM to toolbook. frieda 05-01-00 Text and Branching. frieda 05-10-00 Graphics by Chris 05-22-00 Redone graphics Chris & Damion 06-29-00 Review and release. -Penny 07-14-00 Converted to ToolBook 7.1 format. jay 10-10-00 1743 lock txt field. 1750 correct to Class A, 1150 G-label to class B or conventional wrap, 1940,1170,1193,1340,10212 G-label. lydia 10-27-00 Add Monitor Pro code to quiz pages. jay 11-21-00 Added HelpPage information let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
