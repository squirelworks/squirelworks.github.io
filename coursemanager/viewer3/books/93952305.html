eter indicates that R1 has decreased to 1 kW. The fault is a changed value resistor."], "jumps": ["P1140", "P1067"]}, {"id": "P1140", "text": ["If the meter indicates that R1 has not changed value, then the fault is L1, a changed value inductor."], "jumps": ["P1150", "P1067"]}, {"id": "P1150", "text": ["Calculating the circuit values when R1 equals 1 kW verifies the measured voltage drops.", "Calculating the circuit values when R1 equals 1 kW verifies the measured voltage drops. Calculated Values at 1 k", "4.8 V 1.2 V Er = 1.2 V El = 4.8 V", "Calculated Values at 1 kW Er = 1.2 V El = 4.8 V"], "jumps": ["P1160", "P1067"]}, {"id": "P1152", "text": ["Calculating the circuit values when R1 equals 1 kW verifies the measured voltage drops.", "Calculating the circuit values when R1 equals 1 kW verifies the measured voltage drops. Calculated Values at 1 k", "4.8 V 1.2 V Er = 1.2 V El = 4.8 V", "Calculated Values at 1 kW Er = 1.2 V El = 4.8 V"], "jumps": ["P1160", "P1067"]}, {"id": "P1155", "text": ["L = 6.28 x 20 kHz x 31.8 mH XL = 3994.1 = 4000 or 4 kW Rt = 1 kW Zt = XL2 + Rt2 = 4.1 kW Ea 5 It = = = 1.2 mA Zt 4.1kW El = XL x It Er = R x It = 4k x 1.2m = 1k x 1.2m = 4.8V = 1.2V"], "jumps": ["P1152"]}, {"id": "P1160", "text": ["Remember, a changed value component changes Zt and It which causes the voltage drops to change."], "jumps": ["P1067", "P1152"]}, {"id": "P1170", "text": ["A circuit with an open resistor does not allow current flow."], "jumps": ["P1180", "P1067"]}, {"id": "P1180", "text": ["Measuring the voltage drops quickly shows that there is a problem in the circuit."], "jumps": ["P1190", "P1067"]}, {"id": "P1190", "text": ["However, voltage measurements can not determine if R1 is open or if L1 is shorted."], "jumps": ["P1200", "P1067"]}, {"id": "P1200", "text": ["If R1 is open, current does not flow and the applied voltage is measured across the open resistor."], "jumps": ["P1210", "P1067"]}, {"id": "P1210", "text": ["If L1 is shorted, all the applied voltage is ates the inductor is shorted."], "jumps": ["P1520", "P1067"]}, {"id": "P1520", "text": ["Remember, a shorted inductor does not have a voltage drop and the applied voltage is measured across the resistor."], "jumps": ["P1067"]}, {"id": "P1570", "text": ["What is the probable fault in this circuit?", "What is the probable fault in this circuit?................"], "jumps": ["P1067"]}, {"id": "P1571", "text": [], "jumps": ["P1570"]}, {"id": "P1572", "text": ["If a component changes value, there is a voltage drop across the component. The voltage drop is incorrect, but  there is not a 0 voltage drop.", "If a component changes value, there is a voltage drop across the component. The voltage drop is incorrect, but there is not a 0 voltage drop."], "jumps": ["P1570"]}, {"id": "P1574", "text": ["If the resistor is open, no current flows and the applied voltage is measured across the resistor."], "jumps": ["P1570"]}, {"id": "P1580", "text": ["What is the probable fault in this circuit?", "What is the probable fault in this circuit?................"], "jumps": ["P1570"]}, {"id": "P1581", "text": [], "jumps": ["P1580"]}, {"id": "P1582", "text": ["If a component changes value, there is a voltage drop across the component. The voltage drop is incorrect, but there is not a 0 voltage drop."], "jumps": ["P1580"]}, {"id": "P1584", "text": ["If the inductor is shorted, all the voltage is dropped across the resistor."], "jumps": ["P1580"]}, {"id": "P1590", "text": ["What is the probable fault in this circuit?", "What is the probable fault in this circuit?................"], "jumps": ["P1580"]}, {"id": "P1591", "text": [], "jumps": ["P1590"]}, {"id": "P1592", "text": ["If the inductor is open, the applied voltage is measured across it."], "jumps": ["P1590"]}, {"id": "P1594", "text": ["If the inductor is shorted, all the voltage is dropped across the resistor."], "jumps": ["P1590"]}, {"id": "P1600", "text": ["Remember, use voltage measurements to determine if the circuit is working correctly. Use resistance measurements to determine which component is bad."], "jumps": ["P1910", "P1590"]}, {"id": "P1910", "text": ["This completes the information on RL SERIES CIRCUIT FAULTS."], "jumps": ["P1001", "P1600"]}, {"id": "P1920", "text": ["1.  The three most common faults in an RL series circuit are        \n      open, short, and changed value.", "1. The three most common faults in an RL series circuit are open, short, and changed value..."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A changed value component changes Zt and It. Voltage drops       are not as calculated.", "2. A changed value component changes Zt and It. Voltage drops are not as calculated."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  An open breaks the circuit and no current flows. The applied         voltage is dropped across the open component.", "3. An open breaks the circuit and no current flows. The applied voltage is dropped across the open component.."], "jumps": ["P1950", "P1930"]}, {"id": "P1941", "text": ["3.  An open breaks the circuit and no current flows. The applied         voltage is dropped across the open component.", "3. An open breaks the circuit and no current flows. The applied voltage is dropped across the open component.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  A short eliminates the component from the circuit. No voltage        is dropped across a shorted component.", "4. A short eliminates the component from the circuit. No voltage is dropped across a shorted component."], "jumps": ["P1999", "P1930"]}, {"id": "P1950", "text": ["4.  A short eliminates the component from the circuit. No voltage       is dropped across a shorted component.", "4. A short eliminates the component from the circuit. No voltage is dropped across a shorted component.."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Su let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
