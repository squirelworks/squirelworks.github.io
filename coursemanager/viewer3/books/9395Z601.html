<script>
const book = {"title": "9395Z601", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO AVIATION TECHNOLOGYsdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Identify the types of careers that support the aviation industry.....", "w Describe a brief history of Aviation Maintenance. Maintenance Technician. w Describe the certification process of the Avionics Technician.....", "w Describe the certification process of the Aviation Maintenance Technician. w Describe the certification process of the Avionics Technician..."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about the careers, history and professional certifications associated with aircraft maintenance."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The definition of an aircraft includes any form of craft designed for flight through or navigation in the air; as airplanes, blimps, balloons, helicopters and gliders.ers."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Keeping those aircraft in flight-ready condition is the job of the Aviation Maintenance Technician and the Avionics Technician."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["These technicians work on sophisticated aircraft systems, components, and equipment to ensure that every flight begins and ends successfully. Unlike many other careers, in aviation maintenance, there is no room for error. There is no \"second chance\" to get the job right..."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["But, at the same time, an aviation maintenance career can be very rewarding. Getting a multi-million dollar, state-of-the-art aircraft in the air after it has come to you with a malfunction is an art form in itself."], "jumps": ["P445", "P410"]}, {"id": "P445", "text": ["If you choose aviation maintenance as a career, you will be joining the ranks of professionals around the globe who also share the dream and excitement of aviation..ou with a discrepancy is an art form in itself. If you choose aviation maintenance as a career, you will be joining the ranks of professionals around the globe who also share the dream and excitement of aviation....."], "jumps": ["P450", "P410"]}, {"id": "P450", "text": ["Let's begin the lesson on INTRODUCTION TO AVIATION TECHNOLOGY..............."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Today's aircraft use the most sophisticated and technologically advanced systems available to provide the public with efficient, reliable, and safe transportation services."], "jumps": ["P1030", "P1001", "P"]}, {"id": "P1030", "text": ["The aviation industry offers numerous satisfying career choices for personnel with administrative, artistic, manipulative, mechanical, technological, scientific and verbal aptitudes. Click on the pictures below to learn about career details."], "jumps": ["P1040", "P1020"]}, {"id": "P1031", "text": ["Pilot Duties- Determines aircraft airworthiness, prepares aircraft for flight, manages crew and ensures safe and efficient operation of the aircraft. Environment The aircraft itself"], "jumps": []}, {"id": "P1032", "text": ["Avionics Technician Duties- Use test equipment to adjust, repair, troubleshoot, maintain, and remove and replace aircraft communication systems, navigation systems, radar system, and electrical components. Environment- Technicians work on flight lines, in manufacturing, and in electronics shops."], "jumps": ["Pb"]}, {"id": "P1033", "text": ["Aviation Maintenance Technician Duties Adjust, repair, service, build, overhaul, & test aircraft, airframes, engines, propellers, systems, electronic equipment and aircraft instruments. Environment- Technicians work on flight lines, in overhaul facilities, for small aircraft repair shops, for airlines, manufacturing, and third party overhaul facilities."], "jumps": ["P"]}, {"id": "P1034", "text": ["Air Traffic Controller Duties- Monitor, advise and direct aircraft pilots on the ground & in the air to ensure adequate aircraft separation to prevent collision and crashes. Environment- Air Traffic Controllers work in airport towers, approach and departure centers, and flight control centers."], "jumps": []}, {"id": "P1035", "text": ["Flight Attendant Duties- Monitor airline equipment, execute emergency procedures, safety procedures, administer first aid, direct passengers, & provide in flight service to passengers. Environment- Flight Attendants support domestic, commuter, and international flights."], "jumps": []}, {"id": "P1036", "text": ["Technical Writer Duties- Research, organize, & write materials clearly & accurately about various aspects of aviation to establish communication between the developer & user of the info. Environment- Varies from offices to manufacturing facilities to hangars"], "jumps": ["P"]}, {"id": "P1037", "text": ["Meteorologist Duties- Observe, evaluate and disseminate present and forecast weather information to pilots and air traffic controllers. Environment- Weather stations, military installations"], "jumps": []}, {"id": "P1040", "text": ["Each career field needs motivated and well educated people to maintain the high standards of safety and service."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Name three career fields in the aviation industry.ers (1.2, 34, 56, 789)....................."], "jumps": ["P1030", "P1050"]}, {"id": "P1060", "text": ["Did you think of these? est Pilot Flight Instructor Radar Technician Airframe Mechanic Powerplant Mechanicant Mechanicrame Mechanic Powerplant Mechanic"], "jumps": ["P1910", "P1050"]}, {"id": "P1061", "text": ["Powerplant Mechanic Duties- Adjust, repair, service, overhaul, & test aircraft engines and propellers. Environment- Powerplant Mechanics work on flight lines, in overhaul facilities, for small aircraft repair shops, for airlines, manufacturing, and third party overhaul facilities."], "jumps": []}, {"id": "P1062", "text": ["Airframe Mechanic Duties- Use test equipment to adjust, repair, maintain, and remove and replace aircraft structural, hydraulic, pneumatic, and electrical systems components. Environment- Airframe Mechanics work on flight lines, in overhaul facilities, for small aircraft repair shops, for airlines, manufacturing, and third party overhaul facilities.", "H---H--dH]-d-)ppp)+p,pggp+,+p+p)))p(+GN C |"], "jumps": ["P"]}, {"id": "P1063", "text": ["Flight Instructor Duties- Determines aircraft airworthiness, prepares aircraft for flight, monitors the student's safe and efficient operation of the aircraft. Environment Instructor Pilots work for flight schools, ground schools, airlines, and simulator training facilities."], "jumps": []}, {"id": "P1064", "text": ["Test Pilot Duties- Determines aircraft airworthiness, prepares aircraft for flight, new aircraft systems and equipment designs to ensure safe and efficient operation of the aircraft or equipment. Additionally, test flies aircraft being returned to service after extensive overhaul or repair. Environment- Airlines, aircraft test facilities, overhaul facilities, and manufacturing facilities."], "jumps": ["P", "PdqKq"]}, {"id": "P1065", "text": ["Radar Technician Duties- Use test equipment to adjust, repair, maintain, and remove and replace aircraft, airport, and air traffic control center radar systems. Environment- Radar technicians work on flight lines, in overhaul facilities, for small aircraft repair shops, for airlines, manufacturing, and third party overhaul facilities."], "jumps": ["PZ"]}, {"id": "P1910", "text": ["This completes the information on AVIATION CAREERS........."], "jumps": ["P1001", "P1060"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Every school child knows how aviation began. Two brothers from Ohio lugged a 600 pound craft across the sands of Kitty Hawk, North Carolina and became the first humans to accomplish controlled, sustained flight in a heavier-than-air craft from level ground...", "H33333333@3333333333333T2T333333333332W5% B"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["If the Wright Brothers were renowned as the world's first pilots, then Charles Taylor must be considered the world's first Aviation Maintenance Technician. He worked for the Wrights in their Dayton bicycle shop as a mechanic. When the brothers could not find a light weight engine to purchase for their flyer, they turned to Taylor to build one..."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Charles Taylor went to work and built a four-cylinder, gasoline powered engine that was lightweight and powerful enough to turn two large propellers. He actually hand-tooled the engine's crankshaft on the bicycle shop lathe...", "atsitibib_maS]ln_i`_ii_biuu````_``__bb__`___```___bbbbbb_bbb__bb______`iujji`iii______``____bbvbyl]]n_`vmyrrymmyyrnnnhhnlhhhlafvjtjujuiiu_jps[ 7", ",'&DZlZGCOOOUTT1&TV@GU7C@Y2T.CC 2GD@YO7LTG22THVSUUHSZU'"], "jumps": ["P2050", "P2030", "PR", "PI"]}, {"id": "P2050", "text": ["Taylor's engine was quite crude by today's standards. It did not have a carburetor; instead, it dumped raw gas into the cylinders. Its oil system was just a pan of oil that was splashed up onto the rotating parts. In Charles Taylor's own words, \"It weren't much of an engine\".", "atsitibib_maS]ln_i`_ii_biuu````_``__bb__`___```___bbbbbb_bbb__bb______`iujji`iii______``____bbvbyl]]n_`vmyrrymmyyrnnnhhnlhhhlafvjtjujuiiu_jps[ 7", ",'&DZlZGCOOOUTT1&TV@GU7C@Y2T.CC 2GD@YO7LTG22THVSUUHSZU'"], "jumps": ["P2060", "P2040", "PR", "PI"]}, {"id": "P2060", "text": ["Charles Taylor's simple engine had a power to weight ratio that was better than any other engine of its day. It lifted the Wright Flyer into the air and into history.", "H33333333@3333333333333T2T333333333332W5% B"], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["World War I was the first war to see aerial battles. Planes were made out of wood and fabric, so some of the best military aircraft mechanics were wood craftsman.", "Sopwith Camel Airplane Robin Airplaneer Bomber"], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["Following WWI, the government sold surplus aircraft to ex-military aviators. These pilots became the barnstormers of the early 1920's who introduced flying to America. At that time, there were no government regulations on flying or maintaining aircraft, so, for the most part, barnstormers repaired their own planes.", "@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["By the mid 1920s, more and more people were taking to the sky. The Federal government began to control the skies by certifying airplanes and airman. WWI aircraft were disappearing and manufacturers began to emerge that built only aircraft."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["One such manufacturer was Ryan Airlines, Inc. in San Diego. Ryan had been building the M-1 and M-2 high-wing monoplanes for the mail service for many years.", "Ryan M-2 Airplaneplane Robin Airplaneer Bomber"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["In 1927, Ryan Airlines received an interesting request from a St. Louis based mail pilot. Could Ryan build him an aircraft that could fly from New York to Paris... And construct it in 3 months? We all know the answer to that question!!!"], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On May 20, 1927, Charles Lindbergh took off in his Ryan-built \"Spirit of St. Louis\" from Roosevelt field on Long Island for the first successful non-stop trans-Atlantic flight."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["So, why was this event significant to Aviation Maintenance History? The Spirit of St. Louis was a significantly modified Ryan M-2. The mechanic that fabricated and installed these modifications was none other than Douglas Corrigan, better known as \"Wrong-Way Corrigan\"....."], "jumps": ["P2140", "P2120", "P"]}, {"id": "P2140", "text": ["Douglas Corrigan was a young but talented mechanic at Ryan Airlines, Inc. He was key to making the modifications that allowed the Spirit of St. Louis to fly for over 36 hours non-stop."], "jumps": []}, {"id": "P2150", "text": ["Unfortunately, Douglas Corrigan is better known for his disregard of aviation regulations than for constructing a record breaking aircraft. Corrigan was so inspired by Lindbergh's trans-Atlantic flight the he wanted to be the first to fly from New York to Dublin, Ireland. He learned to fly, purchased a Curtiss Robin airplane for $325, and began his planning....", "Curtiss Robin Airplane Robin Airplaneer Bomber"], "jumps": ["P2130", "P2160"]}, {"id": "P2160", "text": ["The U.S. Government, still in shock after the disappearance of Amelia Earhart, refused to license his old plane or give him clearance to cross the Atlantic. Douglas Corrigan did not give up. ive up. 938, after making modifications to his old plane and getting government permission to fly his plane non-stop to California only, Corrigan took off from Brooklyn and turned the wrong way.."], "jumps": ["P2170", "P2140"]}, {"id": "P2165", "text": ["AMELIA EARHART - (1897-1937) The first female pilot to complete a flight across the Atlantic Ocean in 1932. In 1937, she furthermore attempted to fly around the world, which resulted in her disappearance........"], "jumps": ["P2160"]}, {"id": "P2170", "text": ["On July 17, 1938, after making modifications to his old plane and getting government permission to fly his plane non-stop to California only, Corrigan took off from Brooklyn and turned the wrong way.. 938, after making modifications to his old plane and getting government permission to fly his plane non-stop to California only, Corrigan took off from Brooklyn and turned the wrong way.."], "jumps": ["P2140"]}, {"id": "P2180", "text": ["When people think of the contributions women have made to aviation maintenance, they usually think of the aircraft manufacturing effort of World War II and Rosie the Riveter..."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["By 1945, 25% of aeronautical manufacturing workers were women."], "jumps": ["P2200"]}, {"id": "P2200", "text": ["Before WWII however, women were already making their mark in Aviation Maintenance History. One such woman was Phoebe Fairgrave Omlie."], "jumps": ["P2210", "P2190", "P"]}, {"id": "P2210", "text": ["Phoebe Omlie began her aviation career as a barnstormer, flying circus performer/owner, and silent motion picture stunt women. Soon she learned to fly the aircraft she bought for her circus."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Since aircraft mechanics were a rare find at the remote fields her circus performed at, in 1927, Phoebe became the first female to earn a aircraft mechanic license. she bought for her circus."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Soon Phoebe was setting records for cross country flights and earned her transport pilot's certificate.on picture stunt women. Soon she learned to fly the aircraft she bought for her circus."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["By maintaining her own aircraft, she didn't need to carry a mechanic on any of her long distance flights. This action squashed rumors that male mechanics actually flew the record setting flights for women aviators.."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Following WWII, there were tremendous advances in aviation. In 1943, Germany developed a jet fighter which could reach speeds of 500 MPH in level flight. This brought to aviation a new breed of maintenance technicians, the \"jet mechanics\"...", "p\"#r9C6Y+<:C9Bb,f8*PK#/+_4%l43T($KL0uL;c :I*BU&V8#Y", "D65Z:Ze$4Z)>_,(l&F-8:2COU#X HL.h60R4.s, l"], "jumps": ["P2260", "P2240", "P", "PC"]}, {"id": "P2260", "text": ["Today, the Space Shuttle can circumnavigate the earth in 90 minutes; over 30 hours less than it took Lindbergh to fly from New York to Paris. The technicians that keep these aircraft flying are trained in advance systems, engines, and airframe techniques."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The future of public transportation is already taking shape with the development of aerospace vehicles. These vehicles will be using low-earth orbit technology to reach any destination around the globe in less than an hour. These very sophisticated aircraft with very sophisticated systems will be maintained by well trained technicians. Technicians like you!!!!!"], "jumps": ["P2910", "P2260"]}, {"id": "P2910", "text": ["This completes the information on AVIATION MAINTENANCE HISTORY."], "jumps": ["P2001", "P2270"]}, {"id": "P2920", "text": ["1. Charles Taylor, a mechanic who worked in the Wright brothers' bicycle shop, built the engine that powered the Wright Flyer at Kitty Hawk.", "atsitibib_maS]ln_i`_ii_biuu````_``__bb__`___```___bbbbbb_bbb__bb______`iujji`iii______``____bbvbyl]]n_`vmyrrymmyyrnnnhhnlhhhlafvjtjujuiiu_jps[ 7", ",'&DZlZGCOOOUTT1&TV@GU7C@Y2T.CC 2GD@YO7LTG22THVSUUHSZU'"], "jumps": ["P2930", "P2001", "PR", "PI"]}, {"id": "P2930", "text": ["2. Barnstormers, who had been military pilots during World War I, performed their own maintenance; they often employed wood craftsman to repair a broken aircraft structural part...", "@ @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ @"], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3. The structural mechanic who performed most of the modifications on the Spirit of St. Louis before Lindbergh's transatlantic flight was Douglas Corrigan, better known as \"Wrong Way Corrigan\" for his intentionally misdirected trans-Atlantic flight to Dublin, Ireland........"], "jumps": ["P2950", "P2930", "P"]}, {"id": "P2950", "text": ["4. Aviation Maintenance Technicians of today must keep up with the advancement of aircraft and systems."], "jumps": ["P2999", "P2940"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2950"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["The Federal Aviation Administration, under the United States Department of Transportation, provides regulatory control over the aviation industry through the Federal Aviation Regulations or FAR's."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["The FAR's are designed to provide guidance and rules to ensure that aircraft and airspace are safe for all of us."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["As an Aviation Maintenance Technician, you will be regulated under several parts of the FAR's. FAR Parts 65, 145, and 147 each describe and mandate regulations in the certification process of aircraft technicians..."], "jumps": ["P3030", "PQ5", "PQf", "P5", "P", "PP", "Pfg", "PR"]}, {"id": "P3050", "text": ["FAR Part 145 states that any U.S. company requesting a repair station certification must provide adequate personnel who are certified as either a mechanic or repairman under FAR Part 65. Basically, all airport FBO's, airline repair facilities, manufacturing, or overhaul facilities must have certified mechanics working for them in order to operate....."], "jumps": ["P3040", "P3060"]}, {"id": "P3060", "text": ["The FAA requires certain technicians to be certified in the aircraft industry to maintain high standards and safety consciousness. The guidelines and regulations for aircraft maintenance technician certifications are found in the FAR Part 65."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["Currently, there are two mechanic ratings: Airframe and Powerplant. To be eligible for a mechanic certificate, a person must be at least 18 years of age, have passed all of the prescribed written, oral, and practical tests within a 24 month period, and satisfy the requirements for the applicable rating."], "jumps": ["P3060"]}, {"id": "P3080", "text": ["The Airframe rating certifies the mechanic to work on aircraft structures, systems, and components. The Powerplant rating certifies the mechanic to work on engines and propellers. It is typical for technicians to hold both ratings as an A&P Mechanic."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["To be eligible to take the exams, an applicant must provide documentary evidence of eligibility in one of three ways. The first way is with an appropriate graduation certificate or certificate of completion from an FAA certified aviation maintenance technician school. Rules and regulations for certifying aviation maintenance schools are found in FAR Part 147...."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["If the applicant has not been to a formal aviation school, they must provide documentary evidence of at least 18 months of practical experience with the procedures, practices, materials, tools, and equipment used in constructing, maintaining, or altering airframes, or powerplants appropriate to the rating sought."], "jumps": ["P3090"]}, {"id": "P3105", "text": ["Or at least 30 months of practical experience concurrently performing the duties appropriate to both the airframe and powerplant ratings.."], "jumps": ["P3100"]}, {"id": "P3110", "text": ["Regardless of where the applicant gained experience in aircraft maintenance, a school or hands-on, each applicant must pass the written, oral, and practical tests with a minimum of 70%. The practical tests consist of projects and tasks covered by the written and oral tests."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["One advantage of attending a certified aviation maintenance school is that FAR Part 65 allows students to take the oral and practical tests as part of their normal curriculum before passing the FAA written exam. This is very convenient since most certified schools have examiners on campus."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["Avionics Technicians usually work in one of three areas: flight line maintenance, installation and manufacturing, or the electronics shop. None of these positions require certification. Avionics technicians only need Federal Communications Commission (FCC) certifications are if they work on transmitters above a certain power or on radar systems."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["Once you get an FAA certification as an Aviation Maintenance Technician or an FCC certification as an Avionics Technician, the certificates are good indefinitely unless revoked. There are minimum requirements for working on types of aircraft; however, once certified, it stays with you forever."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Another method of certification through the FAA is the Repairman Certificate. The certificate is designed to assist large maintenance operations, manufacturing plants, and overhaul facilities in certifying their workers. Instead of being certified in the many skills required by an A&P technician, the Repairman is certified in specific skills on specific aircraft.aircraft.. aircraft."], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["To get certified as a Repairman, you must have been on the job at the company for a minimum of 18 months actually performing the tasks that are being certified. If you leave the company, or change job skills, your certification is no longer valid."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["Many companies use the Repairman certificate to manage their manufacturing and line maintenance Avionics needs as well as certifying mechanics to specific areas."], "jumps": ["P3910", "P3160"]}, {"id": "P3910", "text": ["This completes the information on CERTIFICATION.TLE........"], "jumps": ["P3001", "P3170"]}, {"id": "P3920", "text": ["1. The Federal Aviation Administration sets up rules and regulation for the aviation industry as Federal Aviation Regulations, or FAR's. rt 65 - Certification: Airmen other than flight crew members; Part 145 - Repair Stations Part 147 - Aviation Maintenance Technician Schools"], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2. Three FARs that are particularly of interest to the aviation maintenance technician candidate are:", "* Part 65 - Certification: Airmen other than flight crew members * Part 145 - Repair Stations * Part 147 - Aviation Maintenance Technician Schools"], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3. FAR Part 65 describes the certification requirements for aviation mechanics and repairmen. Mechanics are rated as Airframe, Powerplant, or both."], "jumps": ["P3950", "P3930"]}, {"id": "P3950", "text": ["4. Certification for mechanics requires written, oral, and practical testing, a minimum age of 18 years, a minimum of 18 months experience in each rating, or at least 30 months experience in both types concurrently.."], "jumps": ["P3960", "P3940"]}, {"id": "P3960", "text": ["5. The Avionics Technician is not required to hold a certification when working unless working on transmitters above a certain power or radar systems."], "jumps": ["P3970", "P3950"]}, {"id": "P3970", "text": ["6. A Repairman Certificate is used to certify technicians on specific skills at specific companies. Once the Repairman changes jobs or skills, the certificate is no longer valid."], "jumps": ["P3980", "P3960"]}, {"id": "P3980", "text": ["7. Many companies in the line maintenance or manufacturing industry use the Repairman Certificate to manage their Avionics technicians."], "jumps": ["P3999", "P3970"]}, {"id": "P3999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What are the responsibilities of let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
