ber to only compare resistors that are the same type. his is an overlay page."], "jumps": []}, {"id": "P3170", "text": ["Wire Wound Wire wound resistors are even less likely to be damaged by heat.", "R1 R2 R3 R4 R5 R6 R7 R8 R9 R100000000000000", "Look at R7, it is a 5 watt wire wound resistor. The power rating is identified by the markings PW or CW. The letters used to identify the power rating can vary from one manufacturer to another.", "R11 R12 R13 R14 R15 R16 R17 R18 R19 R20"], "jumps": []}, {"id": "P3190", "text": ["R11 R12 R13 R14 R15 R16 R17 R18 R19 R20", "R12 is a 3 watt wire wound resistor. It is smaller than R11 but its power rating is higher because it is wire wound. This is an overlay page."], "jumps": []}, {"id": "P3200", "text": ["1 Watt 1 Watt rbon Composition Wire Wound", "Remember, the physical size and the type of resistor determines how much heat can be given off. Enter the discussion text here.", "Carbon Composition Wire Wound t Carbon Composition Wire Wound"], "jumps": []}, {"id": "P3210", "text": ["* Power Rating Short 3. Changed Valueeeeee", "* Toleranceeeettttt 2. Short 3. Changed Valueeeeee", "The next characteristic is tolerance. Enter the discussion text here.", "* Ohmic Valueeeeeeeeeeeeeeeet 3. Changed Valueeeeee"], "jumps": []}, {"id": "P3220", "text": ["Tolerance is the amount of difference that is acceptable between the measured ohmic value and the indicated value. This is also known as the percent of error."], "jumps": []}, {"id": "P3230", "text": ["Tolerance is usually described in percent, such as 1%, 5%, 10%, etc. This is an overlay page."], "jumps": []}, {"id": "P3240", "text": ["2000 x 10% = 200 2000 - 200 = 1800 2000 + 200 = 2200000000000000000000000000000000000000000", "For example, if a 2000 ohm resistor has tolerance of 10%, its actual value could be anywhere between 1800 and 2200 ohms. Enter the discussion text here."], "jumps": []}, {"id": "P3250", "text": ["2000 x 1% = 20 2000 - 20 = 1980 2000 + 20 = 2020000000000000000000 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
