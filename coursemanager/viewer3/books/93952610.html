": "P13250", "text": ["4.  Measure the resistance of L1 (TP4 to TP1). \n     Is L1 shorted?", "4. Measure the resistance of L1 (TP4 to TP1). Is L1 shorted???"], "jumps": ["P13240"]}, {"id": "P13251", "text": [], "jumps": []}, {"id": "P13252", "text": ["You should have measured 0 W across the inductor. A good inductor would measure about 30 ohms. L1 is shorted."], "jumps": []}, {"id": "P13260", "text": ["5.  Remove the multimeter and place S1 to the right on PC130-            18B. The computer will now replace L1.", "5. Remove the multimeter and place S1 to the right on PC130- 18B. The computer will now replace L1."], "jumps": ["P13250", "P13265"]}, {"id": "P13265", "text": ["MEASUREMENT SETUP - Place S1 to the right (closed)."], "jumps": []}, {"id": "P13270", "text": ["6.  Check for normal operation of circuit A. Calculated \u0083o is 38.8          kHz. \n      Is circuit A operating normally?", "6. Check for normal operation of circuit A. Calculated", "o is 38.8 kHz. Is circuit A operating normally?"], "jumps": ["P13260"]}, {"id": "P13271", "text": [], "jumps": []}, {"id": "P13272", "text": ["Ensure you are measuring the voltage drop across Er1. At 38.8 kHz, the voltage drop is maximum. Check that S1 is to the right."], "jumps": []}, {"id": "P13280", "text": ["Congratulations, you have correctly determined and verified the fault."], "jumps": ["P13270"]}, {"id": "P13310", "text": ["1. Check for normal operation of series resonant circuits A, B, C,      and D.\n                               A\u0083o = 38.8 kHz     B\u0083o = 67.3 kHz                     \n                               C\u0083o = 50.4 kHz     D\u0083o = 79.6 kHz                     \n    Are all the circuits operating normally?", "1. Check for normal operation of series resonant circuits A, B, C, and D. A", "o = 67.3 kHz C", "o = 79.6 kHz Are all the circuits operating normally?"], "jumps": ["P13315"]}, {"id": "P13311", "text": [], "jumps": []}, {"id": "P13312", "text": ["There is a fault in one or 352", "text": ["You should have measured approximately 1 kW across R2. This indicates that R2 is good."], "jumps": ["P13355"]}, {"id": "P13355", "text": ["FAULT - Since R2 is good, the fault is therefore an open in the wiring between TP5 and TP6."], "jumps": []}, {"id": "P13360", "text": ["5.  Remove the multimeter and place S2 to the right on PC130-            18B. The computer will now repair the wiring.", "5. Remove the multimeter and place S2 to the right on PC130- 18B. The computer will now repair the wiring."], "jumps": ["P13350", "P13365"]}, {"id": "P13365", "text": ["MEASUREMENT SETUP - Place S2 to the right (closed)."], "jumps": []}, {"id": "P13370", "text": ["6.  Check for normal operation of circuit B. Calculated \u0083o is 67.3          kHz. \n      Is circuit B operating normally?", "6. Check for normal operation of circuit B. Calculated", "o is 67.3 kHz. Is circuit B operating normally?"], "jumps": ["P13360"]}, {"id": "P13371", "text": [], "jumps": []}, {"id": "P13372", "text": ["Ensure you are measuring the voltage drop across Er2. At 67.3 kHz,  the voltage drop is maximum. Check that S2 is to the right.", "Ensure you are measuring the voltage drop across Er2. At 67.3 kHz, the voltage drop is maximum. Check that S2 is to the right."], "jumps": []}, {"id": "P13380", "text": ["Congratulations, you have correctly determined and verified the fault."], "jumps": ["P13370"]}, {"id": "P13410", "text": ["1.  Check for normal operation of series resonant circuits A, B, C,       and D.\n                               A\u0083o = 38.8 kHz     B\u0083o = 67.3 kHz                     \n                               C\u0083o = 50.4 kHz     D\u0083o = 79.6 kHz                     \n      Are all the circuits operating normally?", "1. Check for normal operation of series resonant circuits A, B, C, and D. A", "o = 67.3 kHz C", "o = 79.6 kHz Are all the circuits operating normally?"], "jumps": ["P13415"]}, {"id": "P13411", "text": [], "jumps": []}, {"id": "P13412", "tex s C2 shorted???"], "jumps": ["P13440"]}, {"id": "P13451", "text": [], "jumps": []}, {"id": "P13452", "text": ["You should have measured 0 ohms across C2. This indicates that C2 is shorted."], "jumps": []}, {"id": "P13460", "text": ["5.  Remove the multimeter and place S2 to the right on PC130-            18B. The computer will now replace C2.", "5. Remove the multimeter and place S2 to the right on PC130- 18B. The computer will now replace C2."], "jumps": ["P13450", "P13465"]}, {"id": "P13465", "text": ["MEASUREMENT SETUP - Place S2 to the right (closed)."], "jumps": []}, {"id": "P13470", "text": ["6.  Check for normal operation of circuit B. Calculated \u0083o is 67.3          kHz. \n      Is circuit B operating normally?", "6. Check for normal operation of circuit B. Calculated", "o is 67.3 kHz. Is circuit B operating normally?"], "jumps": ["P13460"]}, {"id": "P13471", "text": [], "jumps": []}, {"id": "P13472", "text": ["Ensure you are measuring the voltage drop across Er2. At 67.3 kHz, the voltage drop is maximum. Check that S2 is to the right."], "jumps": []}, {"id": "P13480", "text": ["Congratulations, you have correctly determined and verified the fault."], "jumps": ["P13470"]}, {"id": "P13510", "text": ["1.  Check for normal operation of series resonant circuits A, B, C,      and D.\n                                A\u0083o = 38.8 kHz     B\u0083o = 67.3 kHz                     \n                                C\u0083o = 50.4 kHz     D\u0083o = 79.6 kHz                     \n      Are all the circuits operating normally?", "1. Check for normal operation of series resonant circuits A, B, C, and D. A", "o = 67.3 kHz C", "o = 79.6 kHz Are all the circuits operating normally?"], "jumps": ["P13515"]}, {"id": "P13511", "text": [], "jumps": []}, {"id": "P13512", "text": ["There is a fault in one or more of the series circuits. Check the voltage drop across R in each circuit above, below, and at resonance again."], "jumps": []}, {"id": "P13515", "text": ["VOLTAGE DROPS Circuit A - CH1 TP2, CH2 TP3 Circuit B - CH1 TP5, CH2 TP6 Circuit C - CH1 TP8, CH2 TP9 Circuit D - CH1 TP11, CH2 TP12"], "jumps": []}, {"id": "P13520", "text": ["Which circuit is faulted?", "Which circuit is faulted?is typed.........................."], "jumps": ["P13510"]}, {"id": "P13521", "text": [], "jumps": []}, {"id": "P13522", "text": ["Ensure that you are using the oscilloscope correctly and that you are checking that at resonance, Er is maximum."], "jumps": []}, {"id": "P13530", "text": ["2.  Make additional voltage measurements across the inductor           and capacitor. \n     From these voltage measurements, what is the probable fault?", "2. Make additional voltage measurements across the inductor and capacitor. From these voltage measurements, what is the probable fault?"], "jumps": ["P13520", "P13535"]}, {"id": "P13531", "text": [], "jumps": []}, {"id": "P13532", "text": ["An open C4 would measure approximately the applied voltage. Notice that C4 measures about .3 V."], "jumps": []}, {"id": "P13533", "text": ["A shorted R4 would measure 0 V. However, C4 would not measure approximately 0 V."], "jumps": []}, {"id": "P13535", "text": ["VOLTAGE ACROSS L AND C L4 - CH1 TP13, CH2 TP1 C4 - CH1 TP12, CH2 TP13"], "jumps": []}, {"id": "P13540", "text": ["Let's verify that L4 is open. \n3.  Place S4 to the left on PC130-18B.", "Let's verify that L4 is open. 3. Place S4 to the left on PC130-18B."], "jumps": ["P13550", "P13530", "P13545"]}, {"id": "P13545", "text": ["MEASUREMENT SETUP - Place S4 to the left (open)."], "jumps": []}, {"id": "P13550", "text": ["4.  Measure the resistance of L4 (TP13 to TP1). \n     Is L4 open?", "4. Measure the resistance of L4 (TP13 to TP1). Is L4 open???"], "jumps": ["P13540"]}, {"id": "P13551", "text": [], "jumps": []}, {"id": "P13552", "text": ["You should have measured infinity ohms across L4. This indicates that L4 is open."], "jumps": []}, {"id": "P13560", "text": ["5.   Remove the multimeter and place S4 to the right on P Circuit B - CH1 TP5, CH2 TP6 Circuit C - CH1 TP8, CH2 TP9 Circuit D - CH1 TP11, CH2 TP12"], "jumps": []}, {"id": "P13620", "text": ["Congratulations, you have correctly determined that there are no faults."], "jumps": ["P13610"]}, {"id": "P14020", "text": ["The purpose of this experiment is to give you practice in determining if a parallel resonant circuit is operating normally and if not, to determine the faulted component."], "jumps": ["P14030"]}, {"id": "P14030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480 or 488 Multimeter XXXXXXnt"], "jumps": []}, {"id": "P14040", "text": ["Pick up the PC130-20B card. This card is used to practice troubleshooting parallel resonant circuits."], "jumps": ["P14050", "P14030"]}, {"id": "P14050", "text": ["Compare the card with the schematic shown."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["Notice that there are four LCR parallel circuits on the card. Also note the position of Ers."], "jumps": ["P14070", "P14040"]}, {"id": "P14070", "text": ["Switches S1 through S4 when positioned to the right connect an LCR circuit to the input. Let's start the troubleshooting practice."], "jumps": ["P14080", "P14040"]}, {"id": "P14080", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P14040"]}, {"id": "P14090", "text": ["2.  Carefully plug PC130-20B into the Test Console PC1 position. 3.  Place S1 through S4 on PC130-20B to the right.", "2. Carefully plug PC130-20B into the Test Console PC1 position. 3. Place S1 through S4 on PC130-20B to the right."], "jumps": ["P14100", "P14097"]}, {"id": "P14097", "text": ["MEASUREMENT SETUP - Set S1 through S4 to the right (closed)."], "jumps": []}, {"id": "P14100", "text": ["4.  Set up the oscilloscope to measure voltage drops across               components. \n5.  Zero trace.", "4. Set up the oscilloscope to me let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
