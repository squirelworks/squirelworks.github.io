h the flip-flop."], "jumps": ["P1060", "P1040"]}, {"id": "P1051", "text": ["The clock is used to synchronously transfer data through the flip-flop."], "jumps": ["P1060", "P1040"]}, {"id": "P1055", "text": ["SYNCHRONOUS - Having a fixed time relationship. The output of a device changes state only at a specified point on a triggering input, such as a clock signal."], "jumps": ["P1051"]}, {"id": "P1060", "text": ["A high applied to the DATA or D input sets the output state to a high Q when the clock input is high."], "jumps": ["P1070", "P1051"]}, {"id": "P1070", "text": ["A low applied to the D input sets the output state to a high Q when the clock input is high."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["When the clock input is low, the D input is disabled and the flip-flop stays in its current state."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["The Type D flip-flop is a good replacement for a set of mechanical switches that are used to indicate binary numbers."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The binary number 101 closes switches S1 and S3 applying a high to lights 1 and 3."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The D flip-flop can replace the mechanical switches, producing the same results."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["Which flip-flop will produce a high Q?....................."], "jumps": ["P1090"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["A low on D and a high on C would produce a high Q.........."], "jumps": []}, {"id": "P1123", "text": ["A low on C disables the D input. The flip-flop would not change states."], "jumps": []}, {"id": "P1130", "text": ["This Type D flip-flop is constructed from four NAND gates and an inverter. Type D flip-flops are also constructed from NOR gates and an inverter."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Note, gates A, B, C and D form a NAND gate Clocked RS flip-flop."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Adding a single input that is applied directly to gate A and inverted and applied to gate B, makes a D flip-flop."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["A high D input places a high on gate A and a low on gate B. This condition causes a low output from gate A when the clock is high."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["The low output from gate A is inverted by gate C setting Q high. Remember, any low input to a NAND gate will produce a high output."], "jumps": ["P1180", "P1130"]}, {"id": "P1180", "text": ["A low D input places a low on gate A and a high on gate B. This condition causes a low output from gate B when clock is high."], "jumps": ["P1190", "P1130"]}, {"id": "P1190", "text": ["The low output from gate B is inverted by gate D setting Q high."], "jumps": ["P1200", "P1130"]}, {"id": "P1200", "text": ["What is the output state of this Type D flip-flop?........."], "jumps": ["P1130"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["Trace the low applied to D and the high applied to C. The low applied to the inverter causes a high to be applied to gate B."], "jumps": []}, {"id": "P1210", "text": ["What is the output state of this Type D flip-flop if the Q output is HIGH before the input is applied?"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The CLOCK signal is low. The flip-flop will not change states."], "jumps": []}, {"id": "P1215", "text": ["When a D flip-flop is edge triggered instead of being level triggered it is referred to as a clocked flip-flop and not a D-Latch."], "jumps": ["P1220", "P1210"]}, {"id": "P1220", "text": ["The positive edge triggered flip-flop synchronously transfers data to the output only on a positive going transition (PGT) of the clock input."], "jumps": ["P1230", "P1215", "PGT"]}, {"id": "P1230", "text": ["Note from the timing diagram below that the output ONLY changes on the positive going transition and not during the high state of the clock signal."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["This operation can be represented using the truth table below:"], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["The D flip-flop can also have an active low clock. In this case the output will only change on a negative going transition (NGT) of the clock input."], "jumps": ["P1260", "P1220"]}, {"id": "P1260", "text": ["The truth table for the active low edge triggered D flip-flop would be as follows:"], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["In addition to the synchronous inputs the D flip-flop may also have 1 or 2 asynchronous inputs."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["These inputs cause the output to change regardless of the state of the clock or other synchronous inputs. When in their active state the asynchronous inputs cause the output to SET or RESET."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The operation of the asynchronous inputs can be expressed in a truth table.", "Normal FF operation Q = 1 Q =0 Ambiguous (not used)"], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["While the asynchronous inputs have no standard designation these are several common designations given below:", "DC SET PRESET (PRE) SET SD (direct set)", "DC CLEAR CLEAR (CLR) RESET CD (direct clear)"], "jumps": ["P1310", "P1280", "PRE"]}, {"id": "P1310", "text": ["Let's look at the operation of the D flip-flop using the synchronous and asynchronous inputs.", "C D SET RESET QQ"], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["What is the correct Q output for the circuit below?.........", "Q Choice 3333", "D Choice 11", "SET Choice 22", "RESET Choice 3333", "C Choice 1 1"], "jumps": []}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Remember a circle beside an input means that it is active low."], "jumps": []}, {"id": "P1323", "text": ["Remember the asynchronous inputs override all synchronous inputs."], "jumps": []}, {"id": "P1330", "text": ["The D flip-flop can be drawn using either the standard digital symbology already covered in this lesson or using the IEEE/ANSI symbology."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Note the triangles on the asynchronous inputs and the clock, indicating that the asynchronous inputs are active low and the clock is negative edge triggered (NGT)."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["When looking at the IEEE symbol for an integrated circuit containing more than one D flip-flop it should be noted that the clock signal and master reset is common to all flip-flops on the IC."], "jumps": ["P1910", "P1330"]}, {"id": "P1910", "text": ["This completes the information on TYPE D FLIP-FLOP........."], "jumps": ["P1350"]}, {"id": "P1920", "text": ["1. The Type D Flip-Flop is designed to store the last input condition until the next input condition is clocked or gated through."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. A high applied to the D and C inputs sets Q high."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. A low applied to the D input and a high applied to the C input set Q high."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4. The Type D flip-flop is constructed from NAND or NOR gates that use feedback to produce memory."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5. The active high edge triggered D flip-flop will transfer data to its outputs only when the clock input goes from a low to a high state or a positive going transition (PGT)."], "jumps": ["P1970", "P1950", "PGT"]}, {"id": "P1970", "text": ["6. The active low edge triggered D flip-flop will transfer data to its outputs only when the clock input goes from a high to a low state or a negative going transition (NGT)."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1970"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Store the last input condition until the next clock pulse is applied.", "What is the purpose of a Type D flip-flop?", "Store the next input condition until the last input is fed back.", "Continually change between SET and RESET."], "jumps": []}, {"id": "P10211", "text": ["What are the inputs to a Type D flip-flop?"], "jumps": []}, {"id": "P10212", "text": ["What are the outputs of a Type D flip-flop?"], "jumps": []}, {"id": "P10213", "text": ["A high applied to the D input of a Type D flip-flop"], "jumps": []}, {"id": "P10214", "text": ["A low applied to the D input of a Type D flip-flop"], "jumps": []}, {"id": "P10215", "text": ["What is the output of this Type D flip-flop?"], "jumps": []}, {"id": "P10216", "text": ["What is the output of this Type D flip-flop?"], "jumps": []}, {"id": "P10217", "text": ["What is the output of this set Type D flip-flop?"], "jumps": []}, {"id": "P10218", "text": ["What is the correct output for the circuit configuration below?", "D Choice 11", "SET Choice 22", "RESET Choice 3333", "C Choice 1 1"], "jumps": []}, {"id": "P10219", "text": ["Q Choice 3333333", "Q ice 22222222", "What is the correct output for the circ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
