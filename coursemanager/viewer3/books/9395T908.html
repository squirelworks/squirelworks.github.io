const book = {"title": "9395T908", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: AM/CB TRANSCEIVERS asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Understand a transmitter block diagram. w Identify high level modulation. w Understand amplitude modulation and its power requirements. w Understand VSWR and SWR. w Understand a receiver block diagram. w Describe a CB radio."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["With all the raving enthusiasm that surrounds the Internet, Multimedia, Computer Communications, and Cellular Telephones; we sometimes forget that much of our world still depends on radio communications as a primary source of news, entertainment and emergency services.", "Radio, in one form or another, is destined to remain a permanent fixture in our technological landscape.", "Previous lessons have dealt comprehensively with the AM signal and AM receivers.  This, of course, has referred to the AM Broadcast frequency band.  This lesson also refers to AM, but in a different radio spectrum venue known as Citizen Band or CB.", "Previous lessons have dealt comprehensively with the AM signal and AM receivers. This, of course, has referred to the AM Broadcast frequency band. This lesson also refers to AM, but in a different radio spectrum venue known as Citizen Band or CB."], "jumps": ["P410", "P300", "P420", "P400", "P430"]}, {"id": "P430", "text": ["While the hayday for citizen band radio was in the 60's, 70's and 80's, CB radio is still popular and widely used by truckers,          motorists, police, emergency service vehicles, taxi's, buses and   just about anyone who desires inexpensive mobile communications.", "While the hayday for citizen band radio was in the 60's, 70's and 80's, CB radio is still popular and widely used by truckers, motorists, police, emergency service vehicles, taxi's, buses and just about anyone who desires inexpensive mobile communications."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Citizen Band Radio is often referred to as AM Communication Radio because while AM Broadcast Radio is designed chiefly for news and entertainment, CB radio provides a way for people to communicate with one another."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["The frequency range for AM Broadcast radio is 550 kHz to\n1600 kHz, while the Citizen Band range is from 26.965 to\n27.405 MHz, yet they are both amplitude modulated systems.", "The frequency range for AM Broadcast radio is 550 kHz to 1600 kHz, while the Citizen Band range is from 26.965 to 27.405 MHz, yet they are both amplitude modulated systems."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["CB radio is often wrongly referred to as \"amateur\" radio. Amateur or Ham radio is normally a fixed station in a home or office and is primarily used for long distance world-wide communications.", "Whereas, CB radio is normally mobile and is used for short range, local communications."], "jumps": ["P470", "P450", "P480", "P460"]}, {"id": "P480", "text": ["Further, CB has a single, small frequency band in the HF range, Amateur radio enthusiasts enjoy 15 separate bands spanning MF, HF, VHF and UHF ranges.", "It should be remembered, though, that CB radio may be used as a fixed station and Ham radio may be mobile.  While there may be some comparative references and applicability to Amateur radio in this lesson, its primary focus is CB.", "It should be remembered, though, that CB radio may be used as a fixed station and Ham radio may be mobile. While there may be some comparative references and applicability to Amateur radio in this lesson, its primary focus is CB."], "jumps": ["P490", "P470", "P500"]}, {"id": "P500", "text": ["Let's begin the lesson on AM/CB TRANSCEIVERS.............................."], "jumps": ["P490"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The transmitter used in CB communications is similar to that discussed in the AM lessons.  The transmitter section was not covered in depth at that time because of the focus on receivers. This lesson will apply to the subject.", "As mentioned, amplitude modulation is used in CB communications.  The transmitters at broadcast stations are more complex and far more powerful.", "CB is limited to 5 watts of power, whereas, AM broadcast stations regularly transmit at power levels greater than\n1000 watts.", "Frequency Multiplier or Frequency Translator", "The transmitter used in CB communications is similar to that discussed in the AM lessons. The transmitter section was not covered in depth at that time because of the focus on receivers. This lesson will apply to the subject.", "As mentioned, amplitude modulation is used in CB communications. The transmitters at broadcast stations are more complex and far more powerful.", "CB is limited to 5 watts of power, whereas, AM broadcast stations regularly transmit at power levels greater than 1000 watts."], "jumps": ["P1030", "P1001", "P1040", "P1020", "P1050"]}, {"id": "P1050", "text": ["The carrier signal is generated by a crystal oscillator at a low frequency, then stepped up to the desired frequency by frequency multipliers or frequency translators.", "Frequency Multiplier or Frequency Translator"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["It is then fed through a low power driver to the final RF output stage where modulation takes place."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["High level modulation is generally used although it is common practice, especially in the Citizen Band application, to apply       collector modulation to both the RF output stage and the driver    stage.", "High level modulation is generally used although it is common practice, especially in the Citizen Band application, to apply collector modulation to both the RF output stage and the driver stage."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["High and low level modulation schemes are commonly used to differentiate between one kind of transmitter and another."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["For the most part AM transmitters are identical in basic configuration.  It is just a matter of where the intelligence is        injected that determines whether a transmitter is high or low level modulated.", "For the most part AM transmitters are identical in basic configuration. It is just a matter of where the intelligence is injected that determines whether a transmitter is high or low level modulated."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["Both methods are better suited for certain applications than the other.  This is generally based upon the power output requirements of the transmitter.", "Both methods are better suited for certain applications than the other. This is generally based upon the power output requirements of the transmitter."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["High Level Modulation occurs when the intelligence is injected into the last possible stage prior to the antenna, ie., the final RF     power amplifier.", "High Level Modulation occurs when the intelligence is injected into the last possible stage prior to the antenna, ie., the final RF power amplifier."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["When the intelligence is applied to any other point in the circuit, it is considered low level modulation."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The audio voltage amplifier in a standard AM transmitter commonly employs some form of frequency response filter which limits the range of frequencies from 300 Hz to 3 kHz.", "Frequency Multiplier or Frequency Translator"], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["This is the range of frequencies normally attributed to the human voice and is all that is necessary for communications."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The power amplifier is almost always a Class-B push-pull stage transformer coupled to the collector of the RF amplifier.  No attempt is made to provide high fidelity performance because distortion levels as high as 10% are tolerated before the signal becomes unintelligible.", "Frequency Multiplier or Frequency Translator", "The power amplifier is almost always a Class-B push-pull stage transformer coupled to the collector of the RF amplifier. No attempt is made to provide high fidelity performance because distortion levels as high as 10% are tolerated before the signal becomes unintelligible."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["When the audio signal from the power amplifier is coupled to the collector of the RF output, it causes the amplitude of the carrier    to fluctuate at the audio rate.", "When the audio signal from the power amplifier is coupled to the collector of the RF output, it causes the amplitude of the carrier to fluctuate at the audio rate."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["As you learned in earlier lessons, this process of modulation is also called heterodyning.  The process is called modulation when one of the two signals is audio.", "As you learned in earlier lessons, this process of modulation is also called heterodyning. The process is called modulation when one of the two signals is audio."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["During modulation, the carrier signal and the audio signal are mixed together in the RF output transistor."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["As a result of the mixing, four distinct output signals are generated: (1) the original carrier (2) the original audio (3) the    sum of the two (the upper sideband) and (4) the difference of the  two (the lower sideband).", "As a result of the mixing, four distinct output signals are generated: (1) the original carrier (2) the original audio (3) the sum of the two (the upper sideband) and (4) the difference of the two (the lower sideband).", "Original Carrier Original Audio Upper Sideband Lower Sideband of RF and LO signals. O signals. LO signals."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["If we looked at each of the four signals with an oscilloscope through a highly selective filter we would see the waveforms shown below:"], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Notice that each of the signals is a constant amplitude sine wave.  As long as the audio amplitude remains constant, each of the four signals will remain constant.", "Notice that each of the signals is a constant amplitude sine wave. As long as the audio amplitude remains constant, each of the four signals will remain constant."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["If the amplitude of the audio signal varies, then the amplitude of the USB and the LSB will also vary in accordance with the audio. The carrier wave, however, will remain constant."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["If we now remove the selective filter from the oscilloscope, we will see the USB, LSB and carrier signal as a composite AM envelope shown below."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["This signal is commonly called the modulation envelope and is produced by the varying phase of each sideband with respect to the carrier."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["If we view this signal while varying the audio amplitude, we see the effect shown below.", "Ea = EcccccccccF signal. 2. The original LO signal. 3. The sum of the RF and LO signals. 4. The difference of RF and LO signals.", "= Ec RF signal. 2. The original LO signal. 3. The sum of the RF and LO signals. 4. The difference of RF and LO signals."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["In figure a, the amplitude of the audio is about one-fourth that of the carrier; in figure b, the audio amplitude is about half that of    the carrier; and in figure c, the audio amplitude is equal to the      carrier.", "In figure a, the amplitude of the audio is about one-fourth that of the carrier; in figure b, the audio amplitude is about half that of the carrier; and in figure c, the audio amplitude is equal to the carrier."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The ratio of the audio amplitude to the carrier amplitude, (Ea/Ec) is known as the modulation factor and when multiplied by 100, its known as the modulation percentage.", "= Modulation Factor Modulation Ratio x 100 = % of Modulationnnnnnand LO signals. 4. The difference of RF and LO signals."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["For example: If a 100 Vpp carrier signal is amplitude modulated by a 40 Vpp audio signal, the modulation factor is 0.4 or 40% modulation.", "= Modulation Factor .4 x 100 = 40% modulation % of ModulationO signals. 4. The difference of RF and LO signals."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["A high modulation percentage is desirable since the strength of the sidebands depend on the percent of modulation.  Most AM transmitters are designed to produce 100% modulation, where the audio and carrier amplitudes are equal.", "A high modulation percentage is desirable since the strength of the sidebands depend on the percent of modulation. Most AM transmitters are designed to produce 100% modulation, where the audio and carrier amplitudes are equal."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["It is possible to produce modulation in excess of 100%, but this is undesirable and forbidden by law since it creates distortion and interference with other transmitters."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["All of the audio power used to modulate a carrier signal is converted to sideband power; the carrier power doesn't vary. The amount of audio power required to modulate a carrier may be found using the equation:", "PAF = Where \"M\" is the modulation factor. PAF: Power applied to audio frequency M2 : Modulation squared Pc: Carrier powerr"], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Using this equation, it can be shown that 500 watts of audio power is required to produce 100% modulation of a 1 kW carrier frequency.", "PAF = M2 = 1 (1.02) Pc = 1000 (1 kW)"], "jumps": ["P1325", "P1310"]}, {"id": "P1325", "text": ["If all the audio power is converted to the sidebands, there will be 250 watts of power in each sideband.  Together with the carrier     power, the total average power in the signal is then 1500 watts.", "If all the audio power is converted to the sidebands, there will be 250 watts of power in each sideband. Together with the carrier power, the total average power in the signal is then 1500 watts."], "jumps": ["P1330", "P1320"]}, {"id": "P1330", "text": ["It can be shown from communication studies that all of the intelligence in a transmitted signal is contained in the          sidebands - nothing of value is contained in the carrier.", "It can be shown from communication studies that all of the intelligence in a transmitted signal is contained in the sidebands - nothing of value is contained in the carrier."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Therefore, 66% of the transmitted AM signal (1000 watts) is wasted power.  Furthermore, the bandwidth of the transmitted signal is the range of frequencies between the two sidebands, which is equal to twice the highest audio modulating frequency.", "Therefore, 66% of the transmitted AM signal (1000 watts) is wasted power. Furthermore, the bandwidth of the transmitted signal is the range of frequencies between the two sidebands, which is equal to twice the highest audio modulating frequency.........V"], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["If we could suppress the carrier and one sideband, we could transmit the same intelligence using half the bandwidth and\none-sixth of the power!  This is clearly why there's so much popularity for single-sideband communications.", "If we could suppress the carrier and one sideband, we could transmit the same intelligence using half the bandwidth and one-sixth of the power! This is clearly why there's so much popularity for single-sideband communications."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["During the modulation process harmonics are created.  These harmonics cause interference if allowed to reach the antenna.", "During the modulation process harmonics are created. These harmonics cause interference if allowed to reach the antenna."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["Consequently, low-pass filters and resonant \"traps\" are placed between the RF output stage and the antenna in order to suppress them.  The illustration below shows a typical RF output stage and suppression filter.", "Consequently, low-pass filters and resonant \"traps\" are placed between the RF output stage and the antenna in order to suppress them. The illustration below shows a typical RF output stage and suppression filter."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["The low-pass filters are usually designed to suppress the high frequency harmonics of the carrier and to provide an impedance match between the output stage and the antenna.  The filter components are made variable to facilitate transmitter tuning.", "The low-pass filters are usually designed to suppress the high frequency harmonics of the carrier and to provide an impedance match between the output stage and the antenna. The filter components are made variable to facilitate transmitter tuning."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Standing Waves \nThe purpose of any transmitting system is to deliver all of the signal power created in the transmitter to the antenna where it is radiated into space.", "Standing Waves The purpose of any transmitting system is to deliver all of the signal power created in the transmitter to the antenna where it is radiated into space."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["In order to accomplish this, two power transfers are necessary. The transmitter must transfer its power to the transmission line, and then the transmission line must transfer the power to the antenna."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["There is a basic principle of physics which, when applied to electronics, states that maximum transfer of power from a source to a load will occur only when the impedance of the source is equal to the impedance of the load.", "Max Power Transfer: Z XMTR = Z Transmission = Z Antennaa"], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["In a transmitting system, this means that the output impedance of the transmitter must be equal to the input impedance of the       transmission line.", "Z XMTR = Z Transmission = Z Antenna", "In a transmitting system, this means that the output impedance of the transmitter must be equal to the input impedance of the transmission line."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["Then, for maximum power to be transferred from the transmission line to the antenna, the output impedance from the transmission line must equal the input impedance of the antenna.  We will consider only the transmission line/antenna impedance match in this discussion.", "Then, for maximum power to be transferred from the transmission line to the antenna, the output impedance from the transmission line must equal the input impedance of the antenna. We will consider only the transmission line/antenna impedance match in this discussion."], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["When signal power is injected into a transmission line, the resulting voltage and current travels towards the antenna in waves.  These waves are called incident traveling waves.", "Voltage and Current Incident Traveling Waves", "All Incident Power is Absorbed and Radiated", "Conditions Existing with matched Transmission Line and Antenna", "When signal power is injected into a transmission line, the resulting voltage and current travels towards the antenna in waves. These waves are called incident traveling waves."], "jumps": ["P1450", "P1390"]}, {"id": "P1450", "text": ["Upon reaching the antenna these waves will be completely absorbed and radiated, IF and ONLY IF the antenna and transmission line have the same impedance.", "All Incident Power is Absorbed and Radiated"], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["This transmission line/antenna impedance match is imperative for proper wave radiation.  It is worth noting that when this matched condition exists, the length of the transmission line is irrelevant.", "All Incident Power is Absorbed and Radiated", "This transmission line/antenna impedance match is imperative for proper wave radiation. It is worth noting that when this matched condition exists, the length of the transmission line is irrelevant."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["Sometimes, the input impedance to an antenna will change; due, perhaps, to nearby reflective objects such as telephone lines,      aluminum siding, or a car body.", "Sometimes, the input impedance to an antenna will change; due, perhaps, to nearby reflective objects such as telephone lines, aluminum siding, or a car body."], "jumps": ["P1440", "P1480"]}, {"id": "P1480", "text": ["When this happens there will no longer be a matched impedance condition between the transmission line and the antenna.  This     results in only a portion of the incident power being absorbed by the antenna.", "Standing Voltage Wave caused by Reflection at the Antenna", "\"Standing Wave\" of Voltage, as Measured by RF Voltmeter Moving Along Line.", "When this happens there will no longer be a matched impedance condition between the transmission line and the antenna. This results in only a portion of the incident power being absorbed by the antenna."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["What happens to the power that is not absorbed?  It is reflected from the antenna and travels back down the transmission line towards the transmitter.  These reflected traveling waves meet the incident traveling waves and create what are called standing waves.", "What happens to the power that is not absorbed? It is reflected from the antenna and travels back down the transmission line towards the transmitter. These reflected traveling waves meet the incident traveling waves and create what are called standing waves."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["The term \"standing wave\" derives from the fact that when an RF voltmeter is moved along the transmission line, it will indicate      high and low voltage points 1/4 wavelength apart in fixed physical positions along the line --- the voltage wave is standing.", "The term \"standing wave\" derives from the fact that when an RF voltmeter is moved along the transmission line, it will indicate high and low voltage points 1/4 wavelength apart in fixed physical positions along the line --- the voltage wave is standing."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["The voltage standing wave Ratio (VSWR or SWR) is the ratio of the high voltage to the low voltage on the line, or:", "VSWR = (VSWR = Voltage Standing Wave Ratio))))n x 100 = % of Modulationnnnnand LO signals. 4. The difference of RF and LO signals."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["With the use of mathematics it can be shown that:", "With the use of mathematics it can be shown that: WR = and, VSWR = eflected ected", "VSWR = and, VSWR = (VSWR = Voltage Standin", "E incident + E reflected Z antenna", "E incident - E reflected Z line"], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["The last equation is most useful since it relates SWR and the antenna/transmission line impedance mismatch."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["The effect of having standing waves is usually, but not always, bad.  Standing waves on the line cause the line impedance to vary with length.  Hence, line length becomes critical.", "The effect of having standing waves is usually, but not always, bad. Standing waves on the line cause the line impedance to vary with length. Hence, line length becomes critical."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["Standing waves can cause the transmitter to produce less output power and cause the transmission line to radiate some of the signal, thus becoming part of the antenna."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["There are circumstances, though, particularly in UHF communications, where standing waves on the line are desirable."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["Measuring VSWR\nVSWR is usually measured with an SWR meter, which is normally a directional RF voltmeter.  Such devices range from simple meters costing under $30.00 to highly precise instruments costing several thousand dollars.", "Measuring VSWR VSWR is usually measured with an SWR meter, which is normally a directional RF voltmeter. Such devices range from simple meters costing under $30.00 to highly precise instruments costing several thousand dollars. R METERRRRRRRRRRRRRRRRRR"], "jumps": []}, {"id": "P1580", "text": ["For most communication applications, relatively inexpensive SWR meters offer sufficient accuracy."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["On a practical transmission line, the standing wave ratio will be lower at the transmitter end than at the antenna end.  This is         logical when you consider that the standing waves are caused by a mismatch at the antenna.", "On a practical transmission line, the standing wave ratio will be lower at the transmitter end than at the antenna end. This is logical when you consider that the standing waves are caused by a mismatch at the antenna."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["In many cases, however, it is impractical to put the SWR meter at the antenna, so it is often placed at the transmitter."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["In actual practice, the SWR meter is inserted in the line and the antenna is adjusted for minimum reflected signal.  When the antenna and transmission line are matched, the reflected signal will be zero and the SWR will be 1:1.", "In actual practice, the SWR meter is inserted in the line and the antenna is adjusted for minimum reflected signal. When the antenna and transmission line are matched, the reflected signal will be zero and the SWR will be 1:1."], "jumps": ["P1620", "P1590"]}, {"id": "P1620", "text": ["Greater mismatches will cause a higher SWR and an open or short will cause the SWR to be infinite.  An SWR of 2:1 or less is usually not  worth trying to improve upon since the resulting increase in radiated power is not detectable in the receiver by the human ear.", "Greater mismatches will cause a higher SWR and an open or short will cause the SWR to be infinite. An SWR of 2:1 or less is usually not worth trying to improve upon since the resulting increase in radiated power is not detectable in the receiver by the human ear."], "jumps": ["P1630", "P1590"]}, {"id": "P1630", "text": ["High level modulation occurs when _______", "AM is used in frequencies exceeding 26 MHz.", "the audio is injected at the last possible stage prior to the antenna.", "High level modulation occurs when _______.................."], "jumps": ["P1620"]}, {"id": "P1631", "text": [], "jumps": []}, {"id": "P1632", "text": ["The modulation index refers only to the degree a signal is modulated.", "The modulation index refers only to the degree a signal is modulated..ee a signal is modulated."], "jumps": []}, {"id": "P1633", "text": ["In transmissions, this would indicate that all power reaching the antenna would be radiated."], "jumps": []}, {"id": "P1634", "text": ["High level modulation has nothing to do with frequency.", "High level modulation has nothing to do with frequency....."], "jumps": []}, {"id": "P1640", "text": ["When signal power is injected into a transmission line, the resulting voltage and current moves towards the antenna in waves that are called _______"], "jumps": ["P1630"]}, {"id": "P1641", "text": [], "jumps": []}, {"id": "P1642", "text": ["Standing waves are traveling waves that reflected from the antenna."], "jumps": []}, {"id": "P1643", "text": ["Traveling standing waves does not exist.", "Traveling standing waves does not exist...................."], "jumps": []}, {"id": "P1650", "text": ["Receiver \nA close comparison of the block diagrams below reveals the marked similarities between AM Broadcast and AM Communication receivers.", "Receiver A close comparison of the block diagrams below reveals the marked similarities between AM Broadcast and AM Communication receivers."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["In fact, the communication receiver is a broadcast receiver to which certain supplemental circuits have been included to accommodate the use of much higher frequencies and narrower bandwidths."], "jumps": ["P1670", "P1650"]}, {"id": "P1670", "text": ["Note the two mixer/oscillator combinations.  The 1st mixer/oscillator converts the tuned RF to an IF of 1600 kHz, which is then further down converted in the 2nd mixer/oscillator to the more familiar 455 kHz IF.", "Note the two mixer/oscillator combinations. The 1st mixer/oscillator converts the tuned RF to an IF of 1600 kHz, which is then further down converted in the 2nd mixer/oscillator to the more familiar 455 kHz IF."], "jumps": ["P1680", "P1650"]}, {"id": "P1680", "text": ["This process is called double conversion and is commonplace in communication receivers."], "jumps": ["P1690", "P1650"]}, {"id": "P1690", "text": ["Recall that a relatively high IF provides good image rejection while low IF provides good adjacent frequency rejection.  A double conversion receiver provides both.", "Recall that a relatively high IF provides good image rejection while low IF provides good adjacent frequency rejection. A double conversion receiver provides both."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["Another characteristic of the communications receiver is the addition of a separate RF amplifier."], "jumps": ["P1710", "P1680"]}, {"id": "P1710", "text": ["Most AM broadcast receivers do not include one due to the cost and noise problems."], "jumps": ["P1720", "P1680"]}, {"id": "P1720", "text": ["RF amplifiers are used for the sole purpose of improving the signal to noise ratio in a receiver, making weaker signals easier to detect."], "jumps": ["P1730", "P1710"]}, {"id": "P1730", "text": ["In the broadcast band there is so much atmospheric noise that a separate RF amplifier is of little value.  The amplification in the    tuner section is sufficient.", "In the broadcast band there is so much atmospheric noise that a separate RF amplifier is of little value. The amplification in the tuner section is sufficient."], "jumps": ["P1740", "P1710"]}, {"id": "P1740", "text": ["In communication bands there is less atmospheric noise, making an RF amplifier feasible.  It's important an RF amplifier add little noise of its own, making the amplifier's configuration critical.  In most cases, class C operation is preferred.", "In communication bands there is less atmospheric noise, making an RF amplifier feasible. It's important an RF amplifier add little noise of its own, making the amplifier's configuration critical. In most cases, class C operation is preferred."], "jumps": ["P1750", "P1710"]}, {"id": "P1750", "text": ["The tuned circuits in the RF section are not intended to tune in different frequencies.  That job is performed by the oscillator.  The tuned circuits are used to help reject image frequency signals.  Nearly all communications receivers employ RF amplifiers; some, two or three.", "The tuned circuits in the RF section are not intended to tune in different frequencies. That job is performed by the oscillator. The tuned circuits are used to help reject image frequency signals. Nearly all communications receivers employ RF amplifiers; some, two or three."], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["The communication receiver also includes an AGC circuit similar to that used in broadcast receivers, but is more sophisticated and controls the gain of the RF amplifier.  The AGC used in communication receivers at the RF Amp is called delayed AGC.", "The communication receiver also includes an AGC circuit similar to that used in broadcast receivers, but is more sophisticated and controls the gain of the RF amplifier. The AGC used in communication receivers at the RF Amp is called delayed AGC."], "jumps": ["P1770", "P1740"]}, {"id": "P1770", "text": ["If we examine the AGC characteristic comparison graph below, it's clear that simple AGC is far preferable to no AGC at all, which  shows the receiver gain reduced for stronger signals.", "If we examine the AGC characteristic comparison graph below, it's clear that simple AGC is far preferable to no AGC at all, which shows the receiver gain reduced for stronger signals."], "jumps": ["P1780", "P1740"]}, {"id": "P1780", "text": ["Also apparent is that both \"without AGC\" and \"simple AGC\" reduce even the weaker signals."], "jumps": ["P1790", "P1770"]}, {"id": "P1790", "text": ["Looking at the \"ideal AGC\", the graph demonstrates that AGC is not applied until the signal strength is judged sufficient.  At that    point, a consistent output is obtained regardless of any increase in signal strength.", "Looking at the \"ideal AGC\", the graph demonstrates that AGC is not applied until the signal strength is judged sufficient. At that point, a consistent output is obtained regardless of any increase in signal strength."], "jumps": ["P1800", "P1770"]}, {"id": "P1800", "text": ["Like most \"ideal\" or \"perfect\" models, the total endeavor is never fully realized.  The best we can hope for is some close                approximation.", "Like most \"ideal\" or \"perfect\" models, the total endeavor is never fully realized. The best we can hope for is some close approximation."], "jumps": ["P1810", "P1770"]}, {"id": "P1810", "text": ["Delayed AGC resides in that domain.  The curve shows that AGC is not applied until the signal rises to an acceptable level.  Once that level is achieved, AGC is introduced but more heavily than normal AGC.", "Delayed AGC resides in that domain. The curve shows that AGC is not applied until the signal rises to an acceptable level. Once that level is achieved, AGC is introduced but more heavily than normal AGC."], "jumps": ["P1820", "P1770"]}, {"id": "P1820", "text": ["This results in a negligible rise in output when the signal strength increases, but also eliminates the problem of reducing the gain when the receiver is tuned to a weaker signal.", "Following the detector, a noise limiter is used to reduce the affects of atmospheric and circuit noise."], "jumps": ["P1830", "P1770", "P1840"]}, {"id": "P1840", "text": ["It works by clipping the upper spikes of the audio signal that is passing through it.  Since noise rides on a signal in the form of     large amplitude voltage spikes, clipping the audio signal at the      peak also clips the noise spike.", "It works by clipping the upper spikes of the audio signal that is passing through it. Since noise rides on a signal in the form of large amplitude voltage spikes, clipping the audio signal at the peak also clips the noise spike."], "jumps": ["P1850", "P1830"]}, {"id": "P1850", "text": ["In practice, the clipping level is adjusted for maximum noise reduction with minimum distortion of the audio signal."], "jumps": ["P1860", "P1830"]}, {"id": "P1860", "text": ["Nearly all communication receivers have what is termed as a \"squelch\" circuit.  It is used to quiet the receiver whenever a      signal is not present.", "Nearly all communication receivers have what is termed as a \"squelch\" circuit. It is used to quiet the receiver whenever a signal is not present."], "jumps": ["P1870", "P1830"]}, {"id": "P1870", "text": ["This is similar to the muting network in FM receivers.  Any noise present, in an absence of signal, is harsh and bothersome to the  operator.  The squelch control eliminates the noise by shutting off the audio amplifiers.", "This is similar to the muting network in FM receivers. Any noise present, in an absence of signal, is harsh and bothersome to the operator. The squelch control eliminates the noise by shutting off the audio amplifiers."], "jumps": ["P1880", "P1860"]}, {"id": "P1880", "text": ["Of course, an incoming signal must now be strong enough to overcome the squelch circuit and turn on the audio amplifiers."], "jumps": ["P1890", "P1860"]}, {"id": "P1890", "text": ["This operation sacrifices the reception of weaker signals, but most users consider the trade-off worthwhile."], "jumps": ["P2000", "P1860"]}, {"id": "P2000", "text": ["One other modification to the broadcast receiver, not obvious, is the bandwidth of the IF amplifiers."], "jumps": ["P2010", "P1860"]}, {"id": "P2010", "text": ["In broadcast receivers, a 10 - 15 kHz bandwidth is required due to the much higher frequency range of musical notes compared to the human voice."], "jumps": ["P2020", "P2000"]}, {"id": "P2020", "text": ["Since communication receivers are designed to accommodate the voice frequency range, the IF bandwidth is reduced to 5 or \n6 kHz.", "Since communication receivers are designed to accommodate the voice frequency range, the IF bandwidth is reduced to 5 or 6 kHz."], "jumps": ["P2030", "P2000"]}, {"id": "P2030", "text": ["This allows the use of sharp cut-off crystals or ceramic filters in the IF section, thereby increasing the rejection of strong adjacent channel signals."], "jumps": ["P2040", "P2000"]}, {"id": "P2040", "text": ["In lieu of the additions and/or modifications mentioned above, it may be assessed that communication and broadcast receivers are fundamentally identical.", "In lieu of the additions and/or modifications mentioned above, it may be assessed that communication and broadcast receivers are fundamentally identical........"], "jumps": ["P2050", "P2000"]}, {"id": "P2050", "text": ["That is, they are both superheterodyne receivers operating in the same manner.  The primary difference is better performance and higher sophistication found in the communication receiver.", "CB Transceiver \nWe have examined the CB transmitter and receiver as separate entities.  However, most CB radios incorporate the receiver and transmitter into a single unit, known as a Transceiver.", "That is, they are both superheterodyne receivers operating in the same manner. The primary difference is better performance and higher sophistication found in the communication receiver.", "CB Transceiver We have examined the CB transmitter and receiver as separate entities. However, most CB radios incorporate the receiver and transmitter into a single unit, known as a Transceiver."], "jumps": ["P2060", "P2040", "P2070"]}, {"id": "P2070", "text": ["The driving force behind this is reduced size and reduced costs. If you have ever shopped for a quality home stereo system, you know that sound systems are available in many configurations; the least expensive are normally packaged into a single unit.", "For example, a system with a separate power amp and pre-amp is normally more expensive than an Integrated amp which puts both amps in one housing."], "jumps": ["P2080", "P2060", "P2090", "P2070"]}, {"id": "P2090", "text": ["A stereo \"receiver\" consists of the power amp, pre-amp and tuner housed together, which is less costly than purchasing the three units physically independent of each other.  While the price and size benefits may be considerable, they are not without cost.", "Combined units are normally of lesser quality, both in performance and components.  They are more susceptible to heat related problems and internal noise.  The same is true for transceivers.", "A stereo \"receiver\" consists of the power amp, pre-amp and tuner housed together, which is less costly than purchasing the three units physically independent of each other. While the price and size benefits may be considerable, they are not without cost...........", "Combined units are normally of lesser quality, both in performance and components. They are more susceptible to heat related problems and internal noise. The same is true for transceivers."], "jumps": ["P2100", "P2080", "P2110"]}, {"id": "P2110", "text": ["This is not to say that high quality CB transceivers are not available --- they're just not inexpensive.", "From another perspective, separate components are wasteful and inefficient.  A transceiver uses one power supply that switches from receiver to transmitter because they are not operating simultaneously.", "From another perspective, separate components are wasteful and inefficient. A transceiver uses one power supply that switches from receiver to transmitter because they are not operating simultaneously."], "jumps": ["P2120", "P2100", "P2130"]}, {"id": "P2130", "text": ["Separate receivers and transmitters are not afforded that luxury. The same argument holds true for the audio amplifier and antenna.  Additionally, most modern designs also switch the oscillator between the receiver and the transmitter.", "Separate receivers and transmitters are not afforded that luxury. The same argument holds true for the audio amplifier and antenna. Additionally, most modern designs also switch the oscillator between the receiver and the transmitter."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["This sharing of components reduces circuitry and power consumption.  The majority of modern communication systems are of the transceiver variety.", "This sharing of components reduces circuitry and power consumption. The majority of modern communication systems are of the transceiver variety."], "jumps": ["P2150", "P2120"]}, {"id": "P2150", "text": ["The switching may be accomplished either with relays or diodes. The transceiver shown below electro-mechanically switches from the receiver side to the transmitter through the use of two relays."], "jumps": ["P2160", "P2120"]}, {"id": "P2160", "text": ["One small, fast relay is slaved for switching the antenna.  A larger 4PDT relay switches the rest of the circuitry.  Some transceiver     designs incorporate the antenna switching in the larger relay. The relay is energized when the push-to-talk button on the microphone is depressed.", "One small, fast relay is slaved for switching the antenna. A larger 4PDT relay switches the rest of the circuitry. Some transceiver designs incorporate the antenna switching in the larger relay. The relay is energized when the push-to-talk button on the microphone is depressed."], "jumps": ["P2170", "P2120"]}, {"id": "P2170", "text": ["Diode switching, sometimes called electronic switching, is accomplished by forward or reverse biasing various diodes to control the signal flow path."], "jumps": ["P2180", "P2120"]}, {"id": "P2180", "text": ["Diode switching is faster and less expensive.  The circuit below is an example of diode switching.", "Diode switching is faster and less expensive. The circuit below is an example of diode switching."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["CR1 is reverse biased when the transceiver is in the receiver mode.  Simultaneously, CR2 is forward biased, which allows the signal from the antenna to pass through to C2, to the RF amplifier in the receiver.", "CR1 is reverse biased when the transceiver is in the receiver mode. Simultaneously, CR2 is forward biased, which allows the signal from the antenna to pass through to C2, to the RF amplifier in the receiver."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["During the transmit mode, CR1 is forward biased and CR2 is reverse biased, connecting the antenna to the transmitter's final output stage and disconnecting the input to the receiver's RF amplifiers.  The coils act as an open circuit to the RF signal and a short circuit to the DC control voltage.", "During the transmit mode, CR1 is forward biased and CR2 is reverse biased, connecting the antenna to the transmitter's final output stage and disconnecting the input to the receiver's RF amplifiers. The coils act as an open circuit to the RF signal and a short circuit to the DC control voltage."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["Citizen Band Tuning \nDuring the lessons for AM and FM, manual and synthesized tuning was discussed.  Other than the operating frequency and component designators there was little, if any, difference between the two.", "Citizen Band Tuning During the lessons for AM and FM, manual and synthesized tuning was discussed. Other than the operating frequency and component designators there was little, if any, difference between the two."], "jumps": ["P2220", "P2170"]}, {"id": "P2220", "text": ["CB radios also utilize both types of tuning, although, with some variation on them.  The Nida CB card set provides channel selection through synthesized, preset channels only.  No manual tuning option is available.", "CB radios also utilize both types of tuning, although, with some variation on them. The Nida CB card set provides channel selection through synthesized, preset channels only. No manual tuning option is available."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["Nearly all CB tuners have preset channel selection, be it manual or synthesized.  That is to say that when the operator changes channels, the frequency changes from one channel to the next without dead space in between.", "Nearly all CB tuners have preset channel selection, be it manual or synthesized. That is to say that when the operator changes channels, the frequency changes from one channel to the next without dead space in between."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Manual (mechanical, like those on early model television sets) tuners have detent positions that \"lock\" the tuning knob into       position for a specific channel.", "Manual (mechanical, like those on early model television sets) tuners have detent positions that \"lock\" the tuning knob into position for a specific channel."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Synthesized tuning also has preset channels which are selected by pushing a button rather than turning a knob."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["Mechanical Tuners\nThe illustration below shows an example of a mechanical rotary switch commonly used for channel selection.", "Mechanical Tuners The illustration below shows an example of a mechanical rotary switch commonly used for channel selection."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["The tuning selection is achieved by mounting several \"wafers\" on the tuning knob shaft.  Each wafer has a series of contacts.  A different set of contacts is mated with each position of the tuning knob.", "The tuning selection is achieved by mounting several \"wafers\" on the tuning knob shaft. Each wafer has a series of contacts. A different set of contacts is mated with each position of the tuning knob."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["In some radios, the contacts are connected to crystals (one for each channel) that are tuned to a particular frequency.  This form of tuning is very common in CB transceivers used by the military and other government functionaries.", "In some radios, the contacts are connected to crystals (one for each channel) that are tuned to a particular frequency. This form of tuning is very common in CB transceivers used by the military and other government functionaries."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["In other radios, the switch contacts are mated to \"trimmer\" capacitors which, along with a coil, are turned to specific channels."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["Most quality radios that utilize mechanical tuning as described above, also have a fine tuning knob that permits the operator to    fine adjust the tuning of the coils and capacitors selected for a     particular channel.", "Most quality radios that utilize mechanical tuning as described above, also have a fine tuning knob that permits the operator to fine adjust the tuning of the coils and capacitors selected for a particular channel."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["As a general rule (during the earlier days of electronic tuning) mechanical tuning required less circuitry and was cheaper."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["The disadvantage for this type of tuning is that after the contacts on the switch have been used for some time, they become worn and/or dirty."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["This problem is conducive to poor transmission and reception. Sometimes, a thorough cleaning will correct the problem."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Transceivers are more efficient because _______", "they have smaller bandwidths.....................", "the receiver and transmitter share components.", "Transceivers are more efficient because _______............"], "jumps": ["P2320"]}, {"id": "P2341", "text": ["Transceivers are more efficient because they use one power supply that switches from receiver to transmitter since they do not operate simultaneously.", "Transceivers are more efficient because they use one power supply that switches from receiver to transmitter since they do not operate simultaneously..."], "jumps": []}, {"id": "P2350", "text": ["Transceiver switching is normally accomplished by _______", "Transceiver switching is normally accomplished by _______.."], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["Transceiver switching may be an electro-mechanical switch or an electronic switch.", "Synthesized Tuning \nA receiver's ability to faithfully reproduce a desired signal is based predominantly by it's sensitivity and selectivity of the incoming RF signal.", "Synthesized Tuning A receiver's ability to faithfully reproduce a desired signal is based predominantly by it's sensitivity and selectivity of the incoming RF signal."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["The quality of those two characteristics may be affected by any number of reasons both internal and external of the receiver.         Station drift, atmospheric interference, and internally generated    noise are a few of the reasons for poor reception.", "The quality of those two characteristics may be affected by any number of reasons both internal and external of the receiver. Station drift, atmospheric interference, and internally generated noise are a few of the reasons for poor reception."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["The use of Synthesized Tuning Loop helps eliminate or at least reduce these problems to an acceptable level."], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["Synthesized Tuning or Frequency Synthesis is a tuning technique that has become popular in recent years, not just in radio, but in television, radar and many other applications.  Some of the benefits include:", "Synthesized Tuning or Frequency Synthesis is a tuning technique that has become popular in recent years, not just in radio, but in television, radar and many other applications. Some of the benefits include: Graphics Text) 1. Greater frequency stability. 2. Frequency may be changed electronically, which allows for control by microprocessors.", "1. Greater frequency stability. 2. Frequency may be changed electronically, which allows for control by microprocessors. 3. Reduced costs through the elimination of more expensive electromagnetic and mechanical devices. 4. Much smaller size."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["There are several different methods of synthesized tuning, but they can be broken down into two groups:", "There are several different methods of synthesized tuning, but they can be broken down into two groups: rect Synthesis, which uses filtering, mixing and multiplication to derive a specific frequency. Indirect Synthesis, which incorporates Phase-Lock Loops (PLL) and voltage controlled oscillators (VCO) to acquire the desired frequency.", "Direct Synthesis, which uses filtering, mixing and multiplication to derive a specific frequency. Indirect Synthesis, which incorporates Phase-Lock Loops (PLL) and voltage controlled oscillators (VCO) to acquire the desired frequency."], "jumps": ["P2410", "P2390", "PLL"]}, {"id": "P2410", "text": ["The term \"synthesis\" refers to any process whereby separate elements are combined to create or form a coherent whole. This is exactly what frequency synthesis does. It generates a large number of stable frequencies (in some pre-established range) while actually using only a few oscillators and, in most cases, only one."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["Simply stated, a Phase-Lock Loop system compares the output of a voltage controlled oscillator (VCO) with some reference frequency."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["If the output is in error, a DC controlling voltage is produced to steer the VCO to its correct output."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["Unlike normal crystal oscillators which operate at a set frequency, the frequency of the oscillator in a VCO is variable based on the voltage applied to its tuning capacitor (the previously mentioned varactor) at the input of the VCO."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["Phase Detectors may be categorized into two broad groups; sequential circuits and multiplier circuits."], "jumps": ["P2460", "P2420"]}, {"id": "P2460", "text": ["Multipliers provide a DC error output as the product of the reference frequency times the input frequency.  A well designed   multiplier is capable of phase lock on signals residing in noisy     environments.", "Multipliers provide a DC error output as the product of the reference frequency times the input frequency. A well designed multiplier is capable of phase lock on signals residing in noisy environments."], "jumps": ["P2470", "P2420"]}, {"id": "P2470", "text": ["Sequential phase detectors are normally designed using digital circuits and, in effect, have memory.  This is not true with         multipliers, which are zero-memory devices.", "Sequential phase detectors are normally designed using digital circuits and, in effect, have memory. This is not true with multipliers, which are zero-memory devices."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["With the memory capability of sequential detectors, they are capable of providing phase detection characteristics that are not normally obtainable when multiplier circuits are used."], "jumps": ["P2490", "P2470"]}, {"id": "P2490", "text": ["The Phase Detector used on the PC130-444 circuit card is a tri-state, sequential device.  Its job is to compare the reference     frequency against the incoming frequency of the VCO.", "When the frequency and phase of the two signals are equal, PD out, located at pin 5, is in a high impedance state.  When the VCO's output (fv) is greater than reference frequency (fr) the phase detector outputs negative pulses.  When (fv) is smaller than (fr), the phase detector outputs positive pulses.", "The Phase Detector used on the PC130-444 circuit card is a tri-state, sequential device. Its job is to compare the reference frequency against the incoming frequency of the VCO.", "When the frequency and phase of the two signals are equal, PD out, located at pin 5, is in a high impedance state. When the VCO's output (fv) is greater than reference frequency (fr) the phase detector outputs negative pulses. When (fv) is smaller than (fr), the phase detector outputs positive pulses."], "jumps": ["P2500", "P2470", "P2510", "P2490"]}, {"id": "P2510", "text": ["Programmable Counters/Dividers are commonly used in a phase-lock loop because they are easily controlled by microprocessors and because they may be programmed to operate in different frequency ranges.  Most counters, however, are best suited for operation in the 100 MHz range or lower.", "Programmable Counters/Dividers are commonly used in a phase-lock loop because they are easily controlled by microprocessors and because they may be programmed to operate in different frequency ranges. Most counters, however, are best suited for operation in the 100 MHz range or lower."], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["The last major component of the phase-lock loop is the loop filter.  It is usually a simple low-pass filter but is very important to the overall operation of the PLL.", "The last major component of the phase-lock loop is the loop filter. It is usually a simple low-pass filter but is very important to the overall operation of the PLL."], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["The filter's primary goal is to remove any harmonic components of the reference frequency as well as any noise elements that may be, and normally are, present."], "jumps": ["P2540", "P2510"]}, {"id": "P2540", "text": ["Much of the phase-lock loop components shown below are contained in the IC chip, U4 on the PC130-444 circuit card."], "jumps": ["P2550", "P2510"]}, {"id": "P2550", "text": ["U4 is a nearly self-contained Phase-Lock Loop that is directly governed by the microprocessor U1.  In a sense, it is also controlled by the VCO which is U2 on the PC130-445 circuit card.", "U4 is a nearly self-contained Phase-Lock Loop that is directly governed by the microprocessor U1. In a sense, it is also controlled by the VCO which is U2 on the PC130-445 circuit card."], "jumps": ["P2910", "P2510"]}, {"id": "P2910", "text": ["This completes the information on AM TRANSCEIVERS. THEORY.."], "jumps": ["P1001", "P2510"]}, {"id": "P2920", "text": ["1. The frequency range for CB radio is 26.965 to 27.405 MHz."], "jumps": ["P2930", "P1001"]}, {"id": "P2930", "text": ["2. High-level modulation occurs when the intelligence is injected into the last possible stage prior to the antenna."], "jumps": ["P2935", "P2920"]}, {"id": "P2935", "text": ["3. Communications radio usually maintains a bandwidth not larger than the normal frequency range of the human voice."], "jumps": ["P2940", "P2930"]}, {"id": "P2940", "text": ["4. The amount of audio power required to modulate a carrier frequency is calculated by the equation:", "PAF = Where \"M\" is the modulation factor.lation x 100 = % of Modulationnnnnand LO signals. 4. The difference of RF and LO signals."], "jumps": ["P2945", "P2935"]}, {"id": "P2945", "text": ["5. Standing waves are created when traveling incident waves reflect back into the transmission line (because of impedance mismatch and collide) with traveling incident waves in route to the antenna. Standing Voltage Wave caused by Reflection at the Antenna", "Standing Voltage Wave caused by Reflection at the Antenna", "\"Standing Wave\" of Voltage, as Measured by RF Voltmeter Moving Along Line."], "jumps": ["P2950", "P2940"]}, {"id": "P2950", "text": ["6. Double conversion reduces the carrier frequency to two separate intermediate frequencies prior to audio detection."], "jumps": ["P2955", "P2945"]}, {"id": "P2955", "text": ["7. Delayed AGC is used in communication receivers to provide the receiver with AGC without the loss of weaker signals."], "jumps": ["P2960", "P2950"]}, {"id": "P2960", "text": ["8. The squelch circuitry is used to quiet the receiver when a signal is not present.", "9. Transceivers are combination receiver/transmitters housed in one chassis."], "jumps": ["P2965", "P2955", "P2970", "P2960"]}, {"id": "P2970", "text": ["10. CB radios almost always use tuning sections that have preset channels."], "jumps": [ let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
