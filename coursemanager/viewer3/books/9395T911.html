const book = {"title": "9395T911", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SINGLE SIDEBAND TRANSMITTERS/RECEIVERS asdf sadf"], "jumps": []}, {"id": "P10", "text": ["# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Define and describe SSB Communications. w Understand SSB Generation (Transmitters). w Understand SSB Receivers."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Previous lessons in this communications module have explored the conceptual and practical application of AM Broadcast Receivers, FM Broadcast Receivers and AM Communication Transceivers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["It would appear that there would not be any need for additional radio formats, but the very existence of advancing technology dictates the continuous pursuit of better, more efficient systems."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["As early as 1914, the feasibility and advantages of single sideband transmissions were realized, but only in a mathematical representation.", "ebal mod = m sin wmt sin wct = m/2 cos(wc - wm)t - m/2 cos (wc + wm)tt"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["It was understood by radio developers of the time that AM transmissions were highly wasteful, at best.", "(2/3) Carrier = 264 W (1/6) USB = 68 W (1/6) LSB = 68 WW"], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["This realization became apparent when analysis of the AM convention showed that the space used by an AM signal within the RF spectrum is consumed by the carrier and the two sidebands."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Since only one of the sidebands is actually used by a receiver, the carrier and the other sideband are elements of the AM signal that use the majority of the allocated space, yet provide nothing.", "Furthermore, this same factor of inefficiency can be stated when addressing the transmission power of AM signals."], "jumps": ["P460", "P430", "P470"]}, {"id": "P470", "text": ["Regardless of the frequency, a 100% modulated AM signal is actually losing about 75% of the total power to the carrier and the unused sideband.", "(2/3) Carrier = 264 W (1/6) USB = 68 W (1/6) LSB = 68 WW"], "jumps": ["P480", "P460"]}, {"id": "P480", "text": ["The illustration below depicts SSB and Conventional AM waveforms:"], "jumps": ["P490", "P470"]}, {"id": "P490", "text": ["By 1923, the first SSB system was granted a patent. Due to the advantages of SSB over conventional AM; in 1977, the FCC required most transmissions in the 2 to 30 MHz range to operate under SSB system."], "jumps": ["P500", "P480"]}, {"id": "P500", "text": ["Let's begin the lesson on SINGLE SIDEBAND TRANSMITTERS/RECEIVERS............"], "jumps": ["P480"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["SSB Advantages\nOf single sideband advantages, the most significant benefit lies in its efficient use of the RF spectrum, which, while vast, is finite.", "SSB Advantages Of single sideband advantages, the most significant benefit lies in its efficient use of the RF spectrum, which, while vast, is finite."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Two single sideband transmissions take up as much space as just one conventional AM Broadcast signal.  Further, communication systems are relegated to narrow bands within the total spectrum, which intensifies an already over-crowded condition.", "Two single sideband transmissions take up as much space as just one conventional AM Broadcast signal. Further, communication systems are relegated to narrow bands within the total spectrum, which intensifies an already over-crowded condition."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["By implementing SSB transmissions in communication systems, usage of the allocated space has been reduced by 50%.  As a result, in 1977, the FCC required most AM communication transmissions to use an SSB format.", "AM Broadcast stations have not been subjected to this requirement because very few home radios are designed to receive an SSB transmission.  In such an event, home and car radios would become worthless.", "Next in value is the advantage of power savings associated with SSB transmissions.", "By implementing SSB transmissions in communication systems, usage of the allocated space has been reduced by 50%. As a result, in 1977, the FCC required most AM communication transmissions to use an SSB format.", "AM Broadcast stations have not been subjected to this requirement because very few home radios are designed to receive an SSB transmission. In such an event, home and car radios would become worthless."], "jumps": ["P1050", "P1020", "P1060", "P1070"]}, {"id": "P1070", "text": ["In conventional DSBFC (double sideband full carrier) transmissions, all of the transmitted power is located in the carrier and two sidebands.  At least 2/3 of the power is in the carrier, leaving the two sidebands dividing the remainder equally.", "In conventional DSBFC (double sideband full carrier) transmissions, all of the transmitted power is located in the carrier and two sidebands. At least 2/3 of the power is in the carrier, leaving the two sidebands dividing the remainder equally.", "(2/3) Carrier = 264 W (1/6) USB = 68 W (1/6) LSB = 68 WW"], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Since only one of the sidebands is actually used, the power in the signal's remaining components is wasted.  In a SSB transmission, all of the transmitted power is located in the one sideband.", "Since only one of the sidebands is actually used, the power in the signal's remaining components is wasted. In a SSB transmission, all of the transmitted power is located in the one sideband.", "Signal from above after demodulation and filtering, still at 400 WW"], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["This means that a 600 W AM Broadcast signal modulated at 100% will have the same signal strength that the receiving end as a 100 W SSB signal modulated at 100% --- a power savings of 500 W!"], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["What's more, in SSB transmissions, in the absence of a modulating signal (the intelligence: voice, data, etc.), there is no power projected to the antenna even if the transmitter is keyed!"], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["Another advantage of SSB transmissions is its inherent ability to limit the effects of selective fading."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Conventional AM signals have two sidebands that are phase dependent.  That is, they must remain 180 degrees out of phase with each other.", "Conventional AM signals have two sidebands that are phase dependent. That is, they must remain 180 degrees out of phase with each other."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["When AM transmissions bounce off the ionosphere, there is a risk that the phase of one or both of the sidebands will be reflected back to earth at a different phase angle from the carrier or other sideband.  This is called selected fading.", "When AM transmissions bounce off the ionosphere, there is a risk that the phase of one or both of the sidebands will be reflected back to earth at a different phase angle from the carrier or other sideband. This is called selected fading."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["When this occurs, distortion is introduced into the signal.  SSB, having one sideband and no carrier, is not phase dependent, hence, not subject to the problem described above.", "When this occurs, distortion is introduced into the signal. SSB, having one sideband and no carrier, is not phase dependent, hence, not subject to the problem described above."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["The last of the advantages is in the form of noise reduction.  The bandwidth of SSB is half of conventional AM transmissions.  This limits the range in which noise can reside within the signal.", "The last of the advantages is in the form of noise reduction. The bandwidth of SSB is half of conventional AM transmissions. This limits the range in which noise can reside within the signal."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Types of SSB\nSSB, as a transmission format, is available in several variations, normally dictated by application.  These variations are often restricted to FCC allocated frequency bands.", "Types of SSB SSB, as a transmission format, is available in several variations, normally dictated by application. These variations are often restricted to FCC allocated frequency bands.", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["1.  Standard SSB (the main focus of this lesson) is identified by          the elimination of the carrier and one of the sidebands.  Its              hallmark is long transmission range with minimum power               consumption.  This SSB type is most frequently used by                 amateur radio operators.", "1. Standard SSB (the main focus of this lesson) is identified by the elimination of the carrier and one of the sidebands. Its hallmark is long transmission range with minimum power consumption. This SSB type is most frequently used by amateur radio operators.", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["2.  The Pilot Carrier System (Single Sideband Reduced Carrier)          distinguishes itself by having one sideband and a carrier that        has been sharply attenuated at the transmitter.", "2. The Pilot Carrier System (Single Sideband Reduced Carrier) distinguishes itself by having one sideband and a carrier that has been sharply attenuated at the transmitter.", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["The carrier is then used at the receiver as a reference for AFC, AGC, synchronization of the local oscillator and occasionally for demodulation of the sideband.  The attenuated carrier also aids in the receiver's tuning process.", "The carrier is then used at the receiver as a reference for AFC, AGC, synchronization of the local oscillator and occasionally for demodulation of the sideband. The attenuated carrier also aids in the receiver's tuning process."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["3.  Another form of single sideband is ISB (Independent                        Sideband) which is probably a misnomer because ISB                     transmissions contain two sidebands.  Still, the carrier is                 suppressed which directs all the power to the sidebands.", "3. Another form of single sideband is ISB (Independent Sideband) which is probably a misnomer because ISB transmissions contain two sidebands. Still, the carrier is suppressed which directs all the power to the sidebands.", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1210", "P1160"]}, {"id": "P1210", "text": ["The major benefit of ISB is that the two sidebands can contain completely different intelligence from one another.  This is a very popular system with the military who commonly use HF point-to-point radio telephony which requires more than one channel.", "The major benefit of ISB is that the two sidebands can contain completely different intelligence from one another. This is a very popular system with the military who commonly use HF point-to-point radio telephony which requires more than one channel."], "jumps": ["P1220", "P1160"]}, {"id": "P1220", "text": ["4.  Television video transmissions use a form of SSB called                 Vestigal Sideband.  In this system, only a trace of the                        unwanted sideband remains, but normally with a full carrier.           The primary benefit here is conserving bandwidth.", "4. Television video transmissions use a form of SSB called Vestigal Sideband. In this system, only a trace of the unwanted sideband remains, but normally with a full carrier. The primary benefit here is conserving bandwidth. o", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1230", "P1160"]}, {"id": "P1230", "text": ["5.  The last system of the SSB genus is a more recent                            development known as Lincompex which is a hybrid term for        Linked Compression and Expansion.  This system is also               known as ACSSB (amplitude compandored single sideband).", "5. The last system of the SSB genus is a more recent development known as Lincompex which is a hybrid term for Linked Compression and Expansion. This system is also known as ACSSB (amplitude compandored single sideband).", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1240", "P1160"]}, {"id": "P1240", "text": ["Simplified, the audio intelligence is compressed at the transmitter and expanded at the receiver.  A control tone is generated at the transmitter compressor.  This tone is frequency modulated and is a derivative of the audio signal and a signal from the compressor.", "Simplified, the audio intelligence is compressed at the transmitter and expanded at the receiver. A control tone is generated at the transmitter compressor. This tone is frequency modulated and is a derivative of the audio signal and a signal from the compressor."], "jumps": ["P1250", "P1160"]}, {"id": "P1250", "text": ["Once the transmitted intelligence is received and demodulated, the control tone is used in the expander to ensure the audio is reproduced exactly as it was prior to being transmitted."], "jumps": ["P1260", "P1160"]}, {"id": "P1260", "text": ["SSB Generation (Transmitters)\nThe heart of all methods of SSB generation is the balanced modulator.  The process of balanced modulation applies the intelligence to a carrier but produces only the sidebands; the carrier is suppressed or eliminated.", "SSB Generation (Transmitters) The heart of all methods of SSB generation is the balanced modulator. The process of balanced modulation applies the intelligence to a carrier but produces only the sidebands; the carrier is suppressed or eliminated."], "jumps": ["P1270", "P1160"]}, {"id": "P1270", "text": ["While the balanced modulator can be thought of as a \"Mixer\" it produces only the sum and difference of the input signals."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Conventional AM mixers produce the two original signals plus their sum and difference.  Effective suppression of the carrier \n(40 -50 dB attenuation and greater) requires highly matched components.", "Conventional AM mixers produce the two original signals plus their sum and difference. Effective suppression of the carrier (40 -50 dB attenuation and greater) requires highly matched components."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Integrated circuit technology inherently establishes specifications of that exactness.  This, due to having all the components fabricated from the same piece of silicon.  Several balanced modulators in IC format are commercially available.", "Integrated circuit technology inherently establishes specifications of that exactness. This, due to having all the components fabricated from the same piece of silicon. Several balanced modulators in IC format are commercially available."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["There are three methods for the generation of SSB transmissions:", "1. The Filter Method 2. The Phase Method 3. The \"Third\" Method a.k.a. The Weaver Method"], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Having eliminated or reduced the carrier through the balanced modulation process, it is necessary to remove the unwanted sideband."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["The methods, all relying on the balanced modulation process to remove the carrier, differ from one another in the way they remove the unwanted sideband."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["1.  The Filter Method\n     Once the signal leaves the balanced modulator it enters a filter      or series of filters.  Early designs commonly used mechanical        filters which have slowly been replaced with LC, ceramic or            crystal filters.", "1. The Filter Method Once the signal leaves the balanced modulator it enters a filter or series of filters. Early designs commonly used mechanical filters which have slowly been replaced with LC, ceramic or crystal filters."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["These filters are, by necessity, highly sensitive, narrow bandpass filters, normally in the range of 100 to 500 kHz."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["They need to have an extremely flat passband response with steep skirts and very sharp attenuation for all frequencies outside of the passband.  The block diagram illustrates a typical SSB transmitter using the filter method.", "They need to have an extremely flat passband response with steep skirts and very sharp attenuation for all frequencies outside of the passband. The block diagram illustrates a typical SSB transmitter using the filter method."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["2.  The Phase Method\n     When first introduced, the phase cancellation method proved        a welcome alternative to the space consuming, bulky                       mechanical filter system.", "2. The Phase Method When first introduced, the phase cancellation method proved a welcome alternative to the space consuming, bulky mechanical filter system."], "jumps": ["P1370", "P1330", "Phase"]}, {"id": "P1370", "text": ["As filters became smaller, the primary advantage diminished. Still, there are two other benefits: The ability to produce single sideband transmissions at any frequency (particularly low frequencies) and the ease of selecting which sideband to eliminate."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["The heart of the phase shifting method is the two phase shifter circuits; one for the RF and the other for the AF."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["Because the RF is a constant frequency, the circuit required to maintain a constant 90 degree phase shift is simple."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["Conversely, the wide frequency range and complexity of the intelligence signal requires sophisticated circuitry with very demanding alignments in order to maintain the same constant phase shift.", "Conversely, the wide frequency range and complexity of the intelligence signal requires sophisticated circuitry with very demanding alignments in order to maintain the same constant phase shift......."], "jumps": ["P1410", "P1360"]}, {"id": "P1410", "text": ["3.  The \"Third\" Method (Weaver Method)\n     The Weaver method is the SSB generation system used by            the NIDA SSB Communication card set.", "3. The \"Third\" Method (Weaver Method) The Weaver method is the SSB generation system used by the NIDA SSB Communication card set. 1"], "jumps": ["P1420", "P1360"]}, {"id": "P1420", "text": ["It maintains the advantage of the Phase Method in that it can generate SSB at any frequency (including low frequencies) while, at the same time, eliminate the need for a complex AF phase shift network."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["Thus, the necessity for critical components and alignments is removed.  Sideband suppression selection is easily switched with the Weaver Method.", "Thus, the necessity for critical components and alignments is removed. Sideband suppression selection is easily switched with the Weaver Method."], "jumps": ["P1440", "P1410"]}, {"id": "P1440", "text": ["On the down-side, this method is far more involved than either the phase or filter methods and may require DC coupling to block the possibility of signal loss in components near the audio carrier frequency."], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["This system has been used in limited commercial applications but with filter technology continually advancing it is unlikely to ever replace the filter method.  It may be used in SSB Broadcasting, should that eventuality ever come to pass.", "This system has been used in limited commercial applications but with filter technology continually advancing it is unlikely to ever replace the filter method. It may be used in SSB Broadcasting, should that eventuality ever come to pass."], "jumps": ["P1460", "P1410"]}, {"id": "P1460", "text": ["Transmitter Power Amplifier\nOnce the process of creating an SSB signal has been accomplished, the signal must be amplified prior to transmission.", "Transmitter Power Amplifier Once the process of creating an SSB signal has been accomplished, the signal must be amplified prior to transmission."], "jumps": ["P1470", "P1410"]}, {"id": "P1470", "text": ["The linear power amplifier for mobile SSB communication systems commonly operates Class A-B push/pull or Class B."], "jumps": ["P1480", "P1410"]}, {"id": "P1480", "text": ["This is due to the signal's amplitude which is highly variable and cannot be routed into a Class C amplifier without distorting the signal.  The schematic diagram of the power amplifier used in the NIDA SSB card set is shown below.", "This is due to the signal's amplitude which is highly variable and cannot be routed into a Class C amplifier without distorting the signal. The schematic diagram of the power amplifier used in the NIDA SSB card set is shown below."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["The amplifier is contained in an IC package and operates Class A."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["What is the most significant advantage to the SSB communications system?"], "jumps": ["P1480"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["The limitation of selective fading and power saving is important, but not the most significant advantage of SSB."], "jumps": []}, {"id": "P1503", "text": ["All equipment needs maintenance.", "All equipment needs maintenance............................"], "jumps": []}, {"id": "P1510", "text": ["The balanced modulator may be thought of as a _______", "The balanced modulator may be thought of as a _______......"], "jumps": ["P1500"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["You have chosen an incorrect response.", "SSB Receivers\nMost aspects of the SSB receiver are, more-or-less, identical to conventional AM receivers.", "You have chosen an incorrect response......................", "SSB Receivers Most aspects of the SSB receiver are, more-or-less, identical to conventional AM receivers."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["However, because the transmission format of the SSB signal is substantially different from an AM Broadcast signal, these differences are reflected in the circuit design and components. The block diagram below illustrates a typical SSB receiver.", "Demodulation in SSB Receivers is normally accomplished through Product Detectors or Balanced Modulators along with IF sideband filters that maintain sharp response curves."], "jumps": ["P1540", "P1520", "P1550", "P1530"]}, {"id": "P1550", "text": ["In mobile SSB Communication units (transceivers), balanced modulators are nearly always used."], "jumps": ["P1560", "P1540"]}, {"id": "P1560", "text": ["Since the balanced modulator is needed for the transmitter's SSB generation, it's far more economical to add a switch to the circuitry; allowing the receiver to use the same circuit as the      transmitter.", "Since the balanced modulator is needed for the transmitter's SSB generation, it's far more economical to add a switch to the circuitry; allowing the receiver to use the same circuit as the transmitter."], "jumps": ["P1570", "P1540"]}, {"id": "P1570", "text": ["Product detectors are basically mixers with an audio output. While this system is designed for SSB, they will also demodulate all other forms of AM transmissions."], "jumps": ["P1580", "P1540"]}, {"id": "P1580", "text": ["It should be remembered that the carrier signal must be reinserted in order for the sideband to be demodulated.  Where the carrier is reinserted is not important, providing the insertion takes place before the demodulator.", "It should be remembered that the carrier signal must be reinserted in order for the sideband to be demodulated. Where the carrier is reinserted is not important, providing the insertion takes place before the demodulator."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["Aligning an SSB receiver is tedious because the carrier oscillator must be precisely tuned to provide the carrier at all times."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["Any drift in the oscillator will result in distortion of the received intelligence.  Due to the criticality of the oscillator's stability, either a phase lock loop or crystal oscillator is normally used.", "Any drift in the oscillator will result in distortion of the received intelligence. Due to the criticality of the oscillator's stability, either a phase lock loop or crystal oscillator is normally used."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["Selectivity in SSB receivers is a primary concern.  The need for very good adjacent channel rejection is a must, due to SSB signals being packed so closely together in the frequency spectrum.", "Selectivity in SSB receivers is a primary concern. The need for very good adjacent channel rejection is a must, due to SSB signals being packed so closely together in the frequency spectrum."], "jumps": ["P1910", "P1590", "P"]}, {"id": "P1910", "text": ["This completes the information on SINGLE SIDEBAND THEORY.", "This completes the information on SINGLE SIDEBAND THEORY..."], "jumps": ["P1610"]}, {"id": "P1920", "text": ["1.  The most significant advantage of SSB transmissions is its            efficient use of the RF spectrum.  Two SSB transmissions use       the same amount of space as one conventional AM signal.", "1. The most significant advantage of SSB transmissions is its efficient use of the RF spectrum. Two SSB transmissions use the same amount of space as one conventional AM signal."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Normal AM signals have 2/3 of the power located in the carrier       with the remainder split between the sidebands.  SSB                       transmissions put all of the power in one sideband.", "2. Normal AM signals have 2/3 of the power located in the carrier with the remainder split between the sidebands. SSB transmissions put all of the power in one sideband.", "(2/3) Carrier = 264 W (1/6) USB = 68 W (1/6) LSB = 68 WW"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  In SSB transmissions, in the absence of a modulating signal,         there is no power delivered to the transmitter, even if the                 transmitter is keyed.", "3. In SSB transmissions, in the absence of a modulating signal, there is no power delivered to the transmitter, even if the transmitter is keyed.", "Signal from above after demodulation and filtering, still at 400 WW"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  SSB transmissions limit the effects of selective fading.", "4. SSB transmissions limit the effects of selective fading."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The bandwidth of SSB is half of conventional AM signals.               This limits the range in which noise can reside within the                 signal.", "5. The bandwidth of SSB is half of conventional AM signals. This limits the range in which noise can reside within the signal."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  SSB transmissions come in a variety of formats.", "6. SSB transmissions come in a variety of formats.........", "1. Standard SSB 2. Pilot Carrier 3. Independent Sideband (ISB) 4. Vestigial Sideband 5. Lincompex (ACSSB)"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The purpose of the balanced modulator is to eliminate or                suppress the carrier.", "7. The purpose of the balanced modulator is to eliminate or suppress the carrier."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  There are three methods of SSB Generation.", "9.  Demodulation in SSB receivers is normally accomplished               through Product Detectors or Balanced Modulators.", "8. There are three methods of SSB Generation..............", "1. The Filter Method 2. The Phase Method 3. The \"Third\" Method a.k.a. The Weaver Method", "9. Demodulation in SSB receivers is normally accomplished through Product Detectors or Balanced Modulators."], "jumps": ["P1992", "P1980", "P1999", "P1990"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1992"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
