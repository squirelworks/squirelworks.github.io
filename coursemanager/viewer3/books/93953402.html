sistor amplifiers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["RC coupling is the most common method used to connect a multistage amplifier."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Both Q1 and Q2 are common emitter amplifiers.  You know how they operate individually.", "Both Q1 and Q2 are common emitter amplifiers. You know how they operate individually."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["However, cascading Q1 and Q2 changes some circuit values."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on RC COUPLED TRANSISTOR OPERATION..................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Circuit operation of RC coupled multistage amplifiers is very similar to circuit operation of individual amplifiers."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The only difference is that multistage amplifiers are connected and one stage affects the other."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["For example, verifying normal operation of an individual amplifier requires comparing measured and calculated voltage gains."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Verifying normal operation of a multistage amplifier requires comparing TOTAL measured and calculated voltage gains."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["This two stage RC coupled amplifier is operating normally.  Measured and calculated voltage gains are both approximately 100.", "This two stage RC coupled amplifier is operating normally. Measured and calculated voltage gains are both approximately 100."], "jumps": ["P1070", "P1020", "P1065"]}, {"id": "P1065", "text": ["MEASURED AND CALCULATED VOLTAGE GAINS Calculated: Av = Av1 x Av2 Measured: Av = = = 110 = 10 x 10 = 100"], "jumps": []}, {"id": "P1070", "text": ["Notice that the input and output signals are in phase.  Both Q1 and Q2 invert the input signal.  Total phase shift is 360 degrees.", "Notice that the input and output signals are in phase. Both Q1 and Q2 invert the input signal. Total phase shift is 360 degrees."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["In this circuit, it is assumed that the voltage gain of each stage is 10.  Using Av's of ten gives a quick check for normal operation.", "In this circuit, it is assumed that the voltage gain of each stage is 10. Using Av's of ten gives a quick check for normal operation."], "jumps": ["P1090", "P1060", "P1085"]}, {"id": "P1082", "text": ["In this circuit, it is assumed that the voltage gain of each stage is 10.  Using Av's of ten gives a quick check for normal operation.", "In this circuit, it is assumed that the voltage gain of each stage is 10. Using Av's of ten gives a quick check for normal operation."], "jumps": ["P1090", "P1060", "P1085"]}, {"id": "P1085", "text": ["INDIVIDUAL STAGE Av's OF 10 - Most cascade amplifiers have individual stage voltage gains of approximately 10. If the calculated voltage gain using Av's of ten is different from your measured voltage gain, you then must calculate the actual voltage gains of each stage."], "jumps": ["P1082"]}, {"id": "P1090", "text": ["If the measured and calculated voltage gains, using Av's of 10, are not the same (within \u00b120%), then you must calculate each stage's gain.", "If the measured and calculated voltage gains, using Av's of 10, are not the same (within", "20%), then you must calculate each stage's gain."], "jumps": ["P1100", "P1082"]}, {"id": "P1100", "text": ["Calculating individual voltage gains of a cascaded amplifier is slightly different.  Q1's voltage gain is affected by the input resistance of Q2's circuit.", "Calculating individual voltage gains of a cascaded amplifier is slightly different. Q1's voltage gain is affected by the input resistance of Q2's circuit."], "jumps": ["P1110", "P1082"]}, {"id": "P1110", "text": ["Recall the formula used to stance is 1.6 W......"], "jumps": ["P1280", "P1250", "P1275"]}, {"id": "P1275", "text": ["1 CALCULATING Xc - Xc = 2p", "= = = = 1.6 W = 1.6 W-3 = .00159 x 103 = 1.6 WWWWWW59 x 103 = 1.6 WWWWWWWWWW = 1.6 WWWWWW = 1.6 W = 1.6 W= .00159 x 10 = 1.6 W = 1.6 W = 1.6 W = 1.6 W = 1.6 W = 1.6 W", "1 6.28(10 kHz)(10 mF)fAAAAAAAA 680 + .025/Ie 450 + 43.1 493.1", "1 6.28(104)(10-5)))))))))))))AAAAAAAA 680 + .025/Ie 450 + 43.1 493.1", "1 6.28(10-1)))))))))))))))))))))AAAAAAAA 680 + .025/Ie 450 + 43.1 493.1"], "jumps": ["P1272"]}, {"id": "P1280", "text": ["The reactance is so small that it will not affect the circuit."], "jumps": ["P1290", "P1272"]}, {"id": "P1290", "text": ["However, at 10 Hz, C3's reactance is 1.6 kW.  The reactance is large and affects the circuit.", "However, at 10 Hz, C3's reactance is 1.6 kW. The reactance is large and affects the circuit."], "jumps": ["P1300", "P1272", "P1295"]}, {"id": "P1292", "text": ["However, at 10 Hz, C3's reactance is 1.6 k ohms.  The reactance is large and effects the circuit.", "However, at 10 Hz, C3's reactance is 1.6 k ohms. The reactance is large and effects the circuit."], "jumps": ["P1300", "P1272", "P1295"]}, {"id": "P1295", "text": ["1 CALCULATING Xc - Xc = 2p", "= = = = 1.6 kW = 1.6 W-3 = .00159 x 103 = 1.6 WWWWWW59 x 103 = 1.6 WWWWWWWWWW = 1.6 WWWWWW = 1.6 W = 1.6 W= .00159 x 10 = 1.6 W = 1.6 W = 1.6 W = 1.6 W = 1.6 W = 1.6 W", "1 6.28(10 Hz)(10 mF))fAAAAAAAA 680 + .025/Ie 450 + 43.1 493.1", "1 6.28(10)(10-5))))))))))))))AAAAAAAA 680 + .025/Ie 450 + 43.1 493.1", "1 6.28(10-4)))))))))))))))))))))AAAAAAAA 680 + .025/Ie 450 + 43.1 493.1"], "jumps": ["P1292"]}, {"id": "P1300", "text": ["The large reactance decreases the total gain of the RC coupled amplifier.  The individual stage gains are not affected; they're between the coupling capacitors.", "The large reactance decreases the total gain of the RC coupled amplifier. The individual stage gains are not affected; they're between the coupling capacitors."], "jumps": ["P1310", "P1292"]}, {"id": "P1310", "text": ["For example, assume the Av of Q1 and Q2 is 10 (100 total) and C1, C3 and C5 reactances are high due to low frequency."], "jumps": ["P1320", "P1292"]}, {"id": "P1320", "text": ["A 10 mVpp signal applied as an input produces an 8 mVpp signal on the base of Q1.  C1 drops 2 mVpp.", "A 10 mVpp signal applied as an input produces an 8 mVpp signal on the base of Q1. C1 drops 2 mVpp."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["With Q1 having a gain of 10, the output voltage is 80 mVpp on the collector.  The individual stage operates normally.", "With Q1 having a gain of 10, the output voltage is 80 mVpp on the collector. The individual stage operates normally."], "jumps": ["P1340", "P1310"]}, {"id": "P1340", "text": ["If C3 drops 10 mVpp due to its reactance, the input to Q2 is 70 mVpp."], "jumps": ["P1350", "P1310"]}, {"id": "P1350", "text": ["With Q2 having a gain of 10, the output voltage is .7 Vpp on the collector.  The individual stage operates normally.", "With Q2 having a gain of 10, the output voltage is .7 Vpp on the collector. The individual stage operates normally."], "jumps": ["P1360", "P1310"]}, {"id": "P1360", "text": ["If C5 drops .1 Vpp due to its reactance, the output of the circuit is .6 Vpp."], "jumps": ["P1370", "P1310"]}, {"id": "P1370", "text": ["Comparing the input voltage with the output voltage, the RC coupled amplifier circuit has a measured voltage gain of 60.", "Av = Eout/Ein = .6/ .01 = 6000"], "jumps": ["P1380", "P1310"]}, {"id": "P1380", "text": ["Each stage's voltage gain is good, but due to the reactances of the coupling capacitors, the total voltage gain is low and the circuit is not operating normally."], "jumps": ["P1390", "P1310"]}, {"id": "P1390", "text": ["Also, if the input signal frequency is high, the gain of the amplifier is reduced."], "jumps": ["P1400", "P1310"]}, {"id": "P1400", "text": ["The reduction in gain is caused by the transistors not being able to amplify signals above a certain frequency."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Each type of transistor has different characteristics; therefore, each type of transistor reduces the voltage gain at different high frequency points."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["The amplitude of the input signal also effects circuit operation."], "jumps": ["P1430", "P1390"]}, {"id": "P1430", "text": ["If the input signal is too large, Vpp, the output becomes distorted due to clipping."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["The input signal drives Q1 into cutoff and saturation.  Its output is clipped.", "The input signal drives Q1 into cutoff and saturation. Its output is clipped."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["The total gain of the circuit is reduced and the output is distorted."], "jumps": ["P1460", "P1420"]}, {"id": "P1460", "text": ["Or, Q1 stage may operate normally, but the Q2 stage clips the signal."], "jumps": ["P1470", "P1420"]}, {"id": "P1470", "text": ["The result is still a reduced total gain with a distorted output signal."], "jumps": ["P1480", "P1420"]}, {"id": "P1480", "text": ["In an RC coupled transistor amplifier, what is the result of a low frequency input signal?", "stage gains good, total gain low, output signal distortedd", "stage gains low, total gain low, output signal undistortedd", "stage gains good, total gain low, output signal undistortedd"], "jumps": ["P1420"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["An input signal that is low in frequency does not distort the output signal.  The coupling capacitors have high reactances that affect total gain.", "An input signal that is low in frequency does not distort the output signal. The coupling capacitors have high reactances that affect total gain."], "jumps": []}, {"id": "P1483", "text": ["An input signal that is low in frequency does not effect individual stage gains.  The coupling capacitors have high reactances that affect total gain.", "An input signal that is low in frequency does not effect individual stage gains. The coupling capacitors have high reactances that affect total gain."], "jumps": []}, {"id": "P1490", "text": ["In an RC coupled transistor amplifier, what is the result of a high Vpp input signal?", "stage gains low, total gain low, output signal undistortedd", "stage gains good, total gain low, output signal undistortedd", "stage gains low, total gain low, output signal distortedd"], "jumps": ["P1480"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["An input signal that has high Vpp causes the transistor to reach saturation and cutoff.  This will affect the shape of the output signal.", "An input signal that has high Vpp causes the transistor to reach saturation and cutoff. This will affect the shape of the output signal."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on RC COUPLED TRANSISTOR AMPS."], "jumps": ["P1001", "P1490"]}, {"id": "P1920", "text": ["1.  Multistage amplifiers operate similar to individual amplifiers.", "1. Multistage amplifiers operate similar to individual amplifiers."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Checking for normal operation requires comparing the                     measured voltage gain to the calculated voltage gain \n      (use Av's of 10).", "2. Checking for normal operation requires comparing the measured voltage gain to the calculated voltage gain (use Av's of 10)..............."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  If there is a difference between calculated and measured                 voltage gains greater than \u00b120%, calculate individual voltage         gains.", "3. If there is a difference between calculated and measured voltage gains greater than", "20%, calculate individual voltage gains."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  For RC coupled amplifiers, change the RC in the voltage gain         formula to an Rl.", "4. For RC coupled amplifiers, change the RC in the voltage gain formula to an Rl.."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  Low frequency input signals reduce RC coupled amplifier's            total gain.  Individual stage gains are not affected.", "5. Low frequency input signals reduce RC coupled amplifier's total gain. Individual stage gains are not affected."], "jumps": ["P1970", "P1930"]}, {"id": "P1970", "text": ["6.  Due to the characteristics of the transistor, a high frequency           input signal reduces the RC coupled amplifier's total gain.", "6. Due to the characteristics of the transistor, a high frequency input signal reduces the RC coupled amplifier's total gain."], "jumps": ["P1980", "P1930"]}, {"id": "P1980", "text": ["7.  Large voltage inputs reduce the AvT and stage gains.                      Transistors reach saturation and cutoff, causing distortion.", "7. Large voltage inputs reduce the AvT and stage gains. Transistors reach saturation and cutoff, causing distortion."], "jumps": ["P1999", "P1930"]}, {"id": "P1999", "text": ["You have completed the Summary.  \nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1930"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to demonstrate the normal operation of an RC coupled transistor amplifier.", "Pick up the PC130-33 card.  This card is used to demonstrate the operation of RC coupled amplifiers.", "Pick up the PC130-33 card. This card is used to demonstrate the operation of RC coupled amplifiers."], "jumps": ["P2040", "P2001", "P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Q1 and Q2 form the RC coupled transistor amplifier."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Switch S1 and S3 allow the transistors to be swamped.  When the switches are in the IN position, the switches are open as shown.", "Switch S1 and S3 allow the transistors to be swamped. When the switches are in the IN position, the switches are open as shown."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["When switches S1 and S3 are in the OUT position, the switches are closed, which shorts R6 and R11 out of the circuit."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["Switch S2 connects the output of Q1 to the input of Q2.  In the OUT position, the switch is open.", "Switch S2 connects the output of Q1 to the input of Q2. In the OUT position, the switch is open."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["S2 in the IN position, the switch is closed, cascading the amplifiers."], "jumps": ["P2110", "P2040"]}, {"id": "P2110", "text": ["Notice R13.  It drops part of Vcc before being applied to the bias circuit of Q1.", "Notice R13. It drops part of Vcc before being applied to the bias circuit of Q1."], "jumps": ["P2120", "P2040"]}, {"id": "P2120", "text": ["However, since R13 is small, only about .17 V is dropped across it.  Using +Vcc as the applied voltage to Q1 will not affect circuit calculations.", "However, since R13 is small, only about .17 V is dropped across it. Using +Vcc as the applied voltage to Q1 will not affect circuit calculations."], "jumps": ["P2130", "P2040"]}, {"id": "P2130", "text": ["R1 and R2 are used as a voltage divider to reduce the amplitude of the input signal.  Let's start the experiment.", "R1 and R2 are used as a voltage divider to reduce the amplitude of the input signal. Let's start the experiment."], "jumps": ["P2140", "P2040"]}, {"id": "P2140", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id" ormally.", "Now, let's calculate individual stage voltage gains and compare them to measured individual stage voltage gains.", "Assume that the gain of each stage is 10 and the total voltage gain is 100. Notice that your measured voltage gain, , is within", "20% of your assumed voltage gain. The RC coupled amplifier circuit is operating normally."], "jumps": ["P2250", "P2229", "P2252", "P2240"]}, {"id": "P2252", "text": ["1.  Calculate Q1's voltage gain.  Remember, it is loaded.  \n     What is the calculated voltage gain of Q1?", "1. Calculate Q1's voltage gain. Remember, it is loaded. What is the calculated voltage gain of Q1?Q1?", "RL Av = Rs + .025/Ieeeee"], "jumps": ["P2250", "P2262", "P2265"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["Your calculations are incorrect.  Return to the question and touch the HELP block.", "Your calculations are incorrect. Return to the question and touch the HELP block."], "jumps": []}, {"id": "P2263", "text": ["Your calculations are still incorrect.  You should have calculated a voltage gain between 7.5 and 8.5.", "Your calculations are still incorrect. You should have calculated a voltage gain between 7.5 and 8.5."], "jumps": ["PutVar"]}, {"id": "P2265", "text": ["CALCULATE VOLTAGE GAIN - To calculate the voltage gain of Q1 follow these steps."], "jumps": ["P2252", "P2269", "P2267", "P2266"]}, {"id": "P2266", "text": ["VOLTAGE GAIN Av1 - To calculate voltage gain, follow the calculation.", "RL 5.77 k Av = Av = Rs + .025/Ie 680 + .025/Iee"], "jumps": []}, {"id": "P2267", "text": ["SOLVE FOR Ie - Use the following formula to solve for Ie.", "Eb = It x R4 It = Ea/R3 + R4 + R13 = .2 mA x 18 k = 15 V/74.2 k = 3.6 V = .2 mA Ee = Eb - .6 V Ie = Ee/Re = 3.6 V - .6 V = 3 V/3.98 k = 3.0 V = .75 mA = .75 mA = .75 mA = .75 mA"], "jumps": []}, {"id": "P2268", "text": ["Last, place Ie in the formula and solve for Av1.", "5.77 k Av = 680 + .025/Ie = 5.77 k 680 + .025/.75 mA = 5.77 k 713 = ? ? = ? ? ? ?"], "jumps": []}, {"id": "P2269", "text": ["LOAD RESISTANCE - R5 is in parallel to R8 and R9. The equivalent resistance equals 5.77 kW.", "R5 x R8 10 k x 56 k 560 M = = = 8.48 k R5 + R8 10 k + 56 k 66 k 8.48 k x R9 8.48 k x 18 k 152.6 M = = = 5.77 kW 8.48 k + R9 8.48 k + 18 k 26.48 k 18 k 26.48.48 k 8.48 k + R7 8.48 k + 18 k 26.48"], "jumps": []}, {"id": "P2270", "text": ["2.  Measure the input (TP3) and output (TP4) signals of Q1 and            calculate the stage's voltage gain.", "2. Measure the input (TP3) and output (TP4) signals of Q1 and calculate the stage's voltage gain.. Av1 = Eout (TP4)/Ein (TP3)"], "jumps": ["P2280", "P2252", "P2275"]}, {"id": "P2275", "text": ["OSCILLOSCOPE LEAD PLACEMENT - Place probe on TP3 and TP4."], "jumps": []}, {"id": "P2280", "text": ["What is the measured voltage gain of stage Q1?", "What is the measured voltage gain of stage Q1?storing numeric answer (5) in a variable.able.le."], "jumps": ["P2270", "P2282"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["Your voltage gain measurement is incorrect.  Remember, divide the output voltage (TP4) by the input voltage (TP3).", "Your voltage gain measurement is incorrect. Remember, divide the output voltage (TP4) by the input voltage (TP3)."], "jumps": []}, {"id": "P2287", "text": ["Your voltage gain measurement is still incorrect.  You should have measured between 2.8 and 14.0 V.", "Your voltage gain measurement is still incorrect. You should have measured between 2.8 and 14.0 V."], "jumps": ["PutVar"]}, {"id": "P2290", "text": ["Compare your calculated and measured voltage gain of Q1. The values agree closely.", "3.  Place the oscilloscope on PC130-33 TP4, output of Q1.  \n4.  Place PC130-33 S2 to the OUT position.  This unloads the Q1         stage.  Notice the output signal increased.  Remember, a                 loaded amplifier has less gain than an unloaded amplifier.", "5.  Place PC130-33 S2 to the IN position.  \n     Now, let's calculate and measure the individual volt let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
</html>
