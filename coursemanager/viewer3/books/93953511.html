scussion text here."], "jumps": []}, {"id": "P1730", "text": ["Disconnect test equipment. \n     Carefully remove PC130-42.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC130-42. Return all equipment to its proper storage area.."], "jumps": []}, {"id": "P1740", "text": ["Set the Test Console Power OFF. r the discussion text here."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on BLOCKING OSCILLATOR FAULTS."], "jumps": ["P1001", "P1740"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to give you practice in troubleshooting sawtooth generators. You must determine if a sawtooth generator is faulted and if so, what the fault is. Correct operation must be verified after the computer repairs the circuit."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480 or 488 MultimeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P2040", "text": ["Pick up the PC130-43A card. This card is used to give you practice in performing troubleshooting procedures for sawtooth generators."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["Compare the card with the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The transistor functions as a switch. When OFF, Vcc charges C2 or C3  through R2. When ON, C2 or C3 is discharged through Q1 to ground.", "The transistor functions as a switch. When OFF, Vcc charges C2 or C3 through R2. When ON, C2 or C3 is discharged through Q1 to ground."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["S1 selects between capacitors C2 (.05 mF) and C3 (.1 mF)."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Changing capacitors changes the RC time constant of the circuit, effecting troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P2710", "text": ["You have completed all of the troubleshooting exercises for sawtooth generators. If you wish to repeat any of the exercises, you must first return to the Lesson Menu."], "jumps": []}, {"id": "P2720", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P2730", "text": ["Disconnect test equipment. \n     Carefully remove PC130-43A.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC130-43A. Return all equipment to its proper storage area."], "jumps": []}, {"id": "P2740", "text": ["Set the Test Console Power OFF. r the discussion text here."], "jumps": []}, {"id": "P2910", "text": ["This completes the experiment on SAWTOOTH GENERATOR FAULTS."], "jumps": ["P2001", "P2740"]}, {"id": "P13020", "text": ["The purpose of this experiment is to give you practice in troubleshooting blocking oscillators. You must determine if a blocking oscillator circuit is faulted and if so, what the fault is. Correct operation must be verified after the computer repairs the circuit."], "jumps": ["P13030", "P1001"]}, {"id": "P13030", "text": ["Pick up the PC130-42 card. This card is used to give you practice in performing troubleshooting procedures for blocking oscillators.", ". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P13050", "P13030", "P"]}, {"id": "P13050", "text": ["Compare the card with the schematic shown."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["S1 provides the option of an inductive kickback diode."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["S2 selects a NORMal or INVerted output. The inverted output is taken from the primary of a center tapped transformer.", "R1 provides frequency adjustment in the free-running mode by varying the discharge time constant of C2. Let's start the experiment."], "jumps": ["P13080", "P13040", "P13090", "P"]}, {"id": "P13090", "text": ["1.  Set the Test Console controls to the initial control settings.", "2. Carefully plug PC130-42 into the test console PC2 position.", "2. Carefully plug PC130-42 into the test console PC position.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13040"]}, {"id": "P13100", "text": ["2.  Carefully plug PC130-42 into the test console PC2 position.", "2. Carefully plug PC130-42 into the test console PC2 position."], "jumps": ["P13110"]}, {"id": "P13110", "text": ["3.  On PC130-42, set S1 to left (IN) and S2 to down (NORM).", "3. On PC130-42, set S1 to left (IN) and S2 to down (NORM)."], "jumps": ["P13100", "P13115"]}, {"id": "P13115", "text": ["MEASUREMENT SETUP - Set S1 on PC130-42 to the IN position. Set S2 on PC130-42 to the NORM position."], "jumps": []}, {"id": "P13120", "text": ["4.  Rotate R1 on PC130-42 to the mid-position.", "5. Press Enter to set: Voltage Select - 12 DC Power Switch - ON", "5. Press Enter to set: Positive Supply Voltage - 12 PC2 DC Power Switch - ON", "4. Rotate R1 on PC130-42 to the mid-position.............."], "jumps": ["P13110"]}, {"id": "P13130", "text": ["5.  Press Enter to set: Positive Supply Voltage - 12                                                                   PC2 DC Power Switch - ON", "The experiment is now setup. Let's verify normal operation before beginning the troubleshooting practice.", "5. Press Enter to set: Positive Supply Voltage - 12 PC2 DC Power Switch - ONr Switch - ON ON Switch - ON"], "jumps": ["P13120", "P13150"]}, {"id": "P1240", "text": ["4.  Make measurements across the Base-to-Collector junction       \n     of the transistor (TP3 - TP6) using an ohmmeter or diode \n     junction tester.   Reverse the leads and check it again. \n\n    Does the Base-to-Collector junction test OK?", "4. Make measurements across the Base-to-Collector junction of the transistor (TP3 - TP6) using an ohmmeter or diode junction tester. Reverse the leads and check it again. Does the Base-to-Collector junction test OK??????????????????????????????????????????????????????"], "jumps": ["P1230", "P1245"]}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["Your answer is not acceptable. Check that you are measuring TP8 on PC130-42 and that R1 is set to the MID position."], "jumps": []}, {"id": "P13157", "text": ["Your answer is still incorrect. You should have measured about  1.3 kHz with your oscilloscope. If you are unable to obtain this reading, contact your instructor.", "Your answer is still incorrect. You should have measured about 1.3 kHz with your oscilloscope. If you are unable to obtain this reading, contact your instructor.", "OSCILLOSCOPE LEAD PLACEMENT - Measure the frequency of the output pulses at TP8."], "jumps": ["P13150"]}, {"id": "P13160", "text": ["2.  Vary R1 on PC130-42. Return to MID position. \n     Did the output frequency change?", "2. Vary R1 on PC130-42. Return to MID position. Did the output frequency change?"], "jumps": ["P13150"]}, {"id": "P13161", "text": ["R1 varies the discharge time constant of C2, thus varying the output frequency."], "jumps": []}, {"id": "P13170", "text": ["Is the output of the free-running blocking oscillator sharp, narrow pulses as shown below?", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtV let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
