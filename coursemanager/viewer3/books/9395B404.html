const book = {"title": "9395B404", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FREQUENCY DIVISION MULTIPLEXINGfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["1. Frequency Division Multiplexing s", "w Describe Frequency Division Multiplexing. w Describe the characteristics of FDM signals.", "w Describe a typical FDM multiplexer circuit. w Describe the NE564 PLL circuit used as an FM modulator.", "w Describe a typical FDM demultiplexer circuit. w Describe the NE564 PLL circuit used as an FM demodulator...."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you are taught a second method of multiplexing."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["This method is called Frequency Division Multiplexing or FDM.", "This method is called Frequency Division Multiplexing or FDM.r short."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["FDM uses different frequency bands instead of different time slots to send several signals over one channel or wire.", "FDM uses different frequency bands instead of different time slots to send several signals over one channel or wire. ire."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["FDM takes advantage of the bandwidth of a transmission medium."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Even though a communication system has a limited bandwidth, its transmission medium may have a larger bandwidth.", "BW - Telephone - 4 kHz BW - Transmission Medium - 90 kHzz"], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["By assigning different frequency bands to each information source, the entire bandwidth of the transmission medium can be used.", "BW Source 1 - 20 to 25 kHz BW Source 2 - 40 to 45 kHz BW Source 3 - 60 to 65 kHz BW Source 4 - 80 to 85 kHz"], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["information sources and makes a GROUP, 5 groups and makes a SUPERGROUP, and 10 supergroups and makes a MASTER GROUP. w", "For example, a telephone system puts together 12 information sources to make a GROUP, 5 groups to make a SUPERGROUP, and 10 supergroups to make a MASTER GROUP."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["ne calls, over one channel or carrier frequency.", "600 different information sources, or telephone calls, can be sent over one channel or carrier frequency."], "jumps": ["P480", "P460"]}, {"id": "P480", "text": ["Let's begin the lesson on FREQUENCY DIVISION MULTIPLEXING (FDM)............."], "jumps": ["P460"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Frequency division multiplexing is a signal processing technique that places many information sources on one channel or wire."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["t a different frequency, and alsent and received at the same time.", "Each source is modulated at a different frequency, and all of the signals are then sent and received at the same time."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["The information sources are said to be stacked."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["How are the information sources separated in FDM?", "How are the information sources separated in FDM?.........."], "jumps": ["P1015"]}, {"id": "P1041", "text": [], "jumps": []}, {"id": "P1042", "text": ["Separating signals by time divisions is called Time Division Multiplexing.  FDM is not Time Division Multiplexing.", "Separating signals by time divisions is called Time Division Multiplexing. FDM is not Time Division Multiplexing........"], "jumps": []}, {"id": "P1043", "text": ["Separating signals by phase is done in Phase Shift Keying.  FDM is not Phase Shift Keying.", "Separating signals by phase is done in Phase Shift Keying. FDM is not Phase Shift Keying..g.ft Keying."], "jumps": []}, {"id": "P1050", "text": ["FDM uses standard AM or FM modulation techniques.", "FDM uses standard AM or FM modulation techniques..........."], "jumps": ["P1060", "P1040"]}, {"id": "P1055", "text": ["AM - The modulation technique of changing a carrier's amplitude according to the amplitude of the input signal. Amplitude Modulation. ion."], "jumps": []}, {"id": "P1056", "text": ["FM - The modulation technique of changing a carrier's frequency according to the amplitude of the input signal. equency Modulation.................ation................"], "jumps": []}, {"id": "P1060", "text": ["The input signals, normally analog in FDM, can be from any source.", "The input signals, normally analog in FDM, can be from any source.ource."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Voice, music, or any other analog signals can be used as the information sources."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Each information source is then amplified and filtered to limit bandwidth."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["Then each information source is used to AM or FM modulate separate carrier signals."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["The different modulated signals are combined and used to AM or FM modulate the MAIN carrier signal."], "jumps": ["P1110", "P1050"]}, {"id": "P1110", "text": ["The developed signal is an FDM signal that is a combination of AM or FM modulated signals."], "jumps": ["P1120", "P1050"]}, {"id": "P1120", "text": ["In the receiver, the FDM signal first has the MAIN carrier signal demodulated producing the various modulated subcarrier signals."], "jumps": ["P1130", "P1050"]}, {"id": "P1130", "text": ["The separate subcarrier signals are then demodulated and filtered.", "The separate subcarrier signals are then demodulated and filtered..........ion signals."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The separate demodulated filtered signals are the same as the original signals."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["FDM systems are simple.  They use standard AM and FM circuits.", "FDM systems are simple. They use standard AM and FM circuits."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Which circuit in the transmitter modulates each signal to a different frequency?", "Which circuit in the transmitter modulates each signal to a different frequency?????????????"], "jumps": ["P1120"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["The second modulator modulates the combined signals to produce one signal, the FDM signal."], "jumps": []}, {"id": "P1163", "text": ["The summer combines the outputs of the individually modulated signals."], "jumps": []}, {"id": "P1170", "text": ["Which circuit in the receiver changes the FDM signal into the separate modulated signals?"], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["The second demodulator recovers the individual signals.", "The second demodulator recovers the individual signals..........."], "jumps": []}, {"id": "P1173", "text": ["The filter is used to filter and amplify each signal.", "The filter is used to filter and amplify each signal............."], "jumps": []}, {"id": "P1180", "text": ["Let's talk about the characteristics of FDM signals.", "Let's talk about the characteristics of FDM signals........"], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["There is more than one carrier signal used in an FDM system.."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["ed in an FDM system depend on whethif AM or FM modulation is used.", "The carrier frequencies used in an FDM system depend on whether AM or FM modulation is used...."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["In AM, the carrier frequency must be at least 50 times greater than the highest frequency of the input signal."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["This is the same as in standard AM signal processing."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["However, each information source must have a different carrier frequency.", "fc1 M 50 (fmax) fc2 M 50 (fmax), not equal to fc1 fc3 M 50 (fmax), not equal to fc1, fc2 fc4 M 50 (fmax), not equal to fc1, fc2, fc3"], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["And of course, the main carrier frequency, f Main, can not be the same as the carrier for any of the information sources."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["cies also must be larger than the frequencies of the input signal.", "In FM, the carrier frequencies also must be larger than the frequencies of the input signals."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["The difference is that in FM, the bandwidth and sidebands are larger than in AM.", "The difference is that in FM, the bandwidth and sidebands are larger than in AM..."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["The only restriction, as in AM, is that the carrier frequencies used cannot be the same.", "The only restriction, as in AM, is that the carrier frequencies used cannot be the same.."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["However, when using groups, supergroups, and master groups,  the subcarrier frequencies can be the same.", "However, when using groups, supergroups, and master groups, the subcarrier frequencies can be the same."], "jumps": ["P1290", "P1250"]}, {"id": "P1290", "text": ["In a group, each information source has a different subcarrier frequency, but they all use the same MAIN carrier frequency."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["When different groups are used in a super group, each group can use the same subcarrier frequencies for the information sources."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["Only the MAIN carrier frequency of each group has to be different."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["Of course, the supergroup can operate the same.  Only the MAIN carrier frequency of each supergroup has to be different.", "Of course, the supergroup can operate the same. Only the MAIN carrier frequency of each supergroup has to be different."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["completed FDM systems easy, since the different stages all use the sam circuits are not needed.", "This makes construction of completed FDM systems easy, since the different stages all use the same types of circuits."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["Bandwidth is also important in FDM systems.", "Bandwidth is also important in FDM systems................."], "jumps": ["P1350", "P1280"]}, {"id": "P1350", "text": ["Each information source has a bandwidth which depends on its carrier frequency.", "Each information source has a bandwidth which depends on its carrier frequency.y.", "BWfc1 BWfc2 BWfc3 BWfc4 Equals BW or fcmain"], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Then the combined signals are used to modulate the MAIN carrier signal, which also produces a bandwidth.", "BWfc1 BWfc2 BWfc3 BWfc4 Equals BW or fcmain"], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["For example, if four input signals of 5 kHz are used to AM modulate 25 kHz, 50 kHz, 75 kHz and 100 kHz, the bandwidths are:", "25 kHz - 30 kHz (20 to 30 kHz) 50 kHz - 55 kHz (45 to 55 kHz) 75 kHz - 80 kHz (70 to 80 kHz) 100 kHz - 105 kHz (95 to 105 kHz)"], "jumps": ["P1380", "P1350", "P1375"]}, {"id": "P1375", "text": ["95 kHz 100 kHz 105 kHzz", "BANDWIDTH OF AM SIGNALS - When a carrier signal is amplitude modulated, 2 sidebands are produced: an upper sideband (USB) and a lower sideband (LSB). Each sideband contains the signal."], "jumps": ["P1376", "P1370"]}, {"id": "P1376", "text": ["The bandwidth of the signal is therefore the highest frequency, or the carrier frequency plus the modulating frequency.  As shown, the bandwidth is 105 kHz.", "The bandwidth of the signal is therefore the highest frequency, or the carrier frequency plus the modulating frequency. As shown, the bandwidth is 105 kHz."], "jumps": ["P1370", "P1375"]}, {"id": "P1380", "text": ["Now, when the four signals are used to modulate the main carrier signal, you must use the highest bandwidth of the four.", "25 kHz - 30 kHz (20 to 30 kHz) 50 kHz - 55 kHz (45 to 55 kHz) 75 kHz - 80 kHz (70 to 80 kHz) 100 kHz - 105 kHz (95 to 105 kHz)"], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["If 1 MHz is used as the MAIN carrier frequency, then the bandwidth of the FDM signal is 1.105 MHz.", "0.895 kHz 1 MHz 1.105MHz BW = 1.105 MHz", "25 kHz - 30 kHz (20 to 30 kHz) 50 kHz - 55 kHz (45 to 55 kHz) 75 kHz - 80 kHz (70 to 80 kHz) 100 kHz - 105 kHz (95 to 105 kHz)"], "jumps": ["P1400", "P1370"]}, {"id": "P1400", "text": ["As you can see, the bandwidth of an FDM system is the same as any system that uses AM or FM.", "As you can see, the bandwidth of an FDM system is the same as any system that uses AM or FM. e signals are used."], "jumps": ["P1410", "P1370"]}, {"id": "P1410", "text": ["Remember, if FM modulation is used, the bandwidth calculations are more complex due to the number of sidebands produced."], "jumps": ["P1420", "P1370"]}, {"id": "P1420", "text": ["What is the bandwidth of an FDM system that uses 10 kHz AM  signals for 100 kHz and 200 kHz carriers and uses a main carrier of 500 kHz?", "What is the bandwidth of an FDM system that uses 10 kHz AM signals for 100 kHz and 200 kHz carriers and uses a main carrier of 500 kHz?"], "jumps": ["P1370", "P1425"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["You used the bandwidth of the lower carrier signal, 110 kHz, to find the bandwidth of the MAIN carrier.  You must use the higher carrier signal of 200 kHz.", "You used the bandwidth of the lower carrier signal, 110 kHz, to find the bandwidth of the MAIN carrier. You must use the higher carrier signal of 200 kHz."], "jumps": []}, {"id": "P1423", "text": ["You added the two carrier signals to find the bandwidth of the MAIN carrier.  This is incorrect.", "You added the two carrier signals to find the bandwidth of the MAIN carrier. This is incorrect..ncorrect."], "jumps": []}, {"id": "P1425", "text": ["FDM BANDWIDTH - To find the bandwidth of an FDM system, you find the bandwidth of the individual signals and then use the highest frequency to find the bandwidth of the MAIN carrier signal............."], "jumps": []}, {"id": "P1430", "text": ["Noise is always a problem in any electronic communication system.", "Noise is always a problem in any electronic communication system..."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["d variations in the communication signal, normally in the signal's!", "Remember, noise is unwanted variations in the communication signal, normally in the signal's amplitude."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["he atmosphere, transmission medium or the communication circuits t", "Noise may be produced by the atmosphere, transmission medium or the communication circuits themselves."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["system, noise is a problem. AM uses amplitude changes to represen", "When AM is used in an FDM system, noise is a problem. AM uses amplitude changes to represent the information, so changes in amplitude caused by noise seriously affect the signal."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["system, noise is less important. FM uses frequency changes to rep", "When FM is used in an FDM system, noise is less important. FM uses frequency changes to represent the information, so changes in amplitude have little effect."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["The last characteristic is crosstalk.", "The last characteristic is crosstalk......................."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["As in any multiplexing system, crosstalk is the interference between the different information sources."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["If the carrier frequencies are too close together, or if the transmission medium causes frequency shifts, crosstalk may occur."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["In an FDM system, each information source is separated from the others by a band of frequencies called a GUARD BAND."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["The guard band is wide enough that the bandwidths of each information source will not interfere with another source."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["What is crosstalk?", "What is crosstalk?estion is typed..........................", "The choosing of a different carrier frequencies.", "Interference between signals.ion sources."], "jumps": ["P1510"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["The combining of carrier frequencies is what produces FDM. Crosstalk is a problem in multiplexing systems, not a method of operation."], "jumps": []}, {"id": "P1533", "text": ["Choosing different carrier frequencies is necessary in FDM systems.  Crosstalk is a problem in multiplexing systems, not a method of operation.", "Choosing different carrier frequencies is necessary in FDM systems. Crosstalk is a problem in multiplexing systems, not a method of operation."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on FDM SIGNALS.", "This completes the information on FDM SIGNALS.TITLE........"], "jumps": ["P1530"]}, {"id": "P1920", "text": ["1.  Frequency Division Multiplexing is a signal processing                    technique that uses analog signals.", "1. Frequency Division Multiplexing is a signal processing technique that uses analog signals.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The FDM signal is an FM modulated signal.", "2. The FDM signal is an FM modulated signal.ignal."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The transmitter uses standard modulation circuits to produce       the FDM signal.", "3. The transmitter uses standard modulation circuits to produce the FDM signal."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  The receiver uses standard demodulation circuits to recover          the signals.", "4. The receiver uses standard demodulation circuits to recover the signals............."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["ust have larger bandwidths than the i information signal and be different.", "5. The subcarriers used must have larger bandwidths than the input signals, and must use different center frequencies than any of the input signals."], "jumps": ["P1970", "P1940"]}, {"id": "P1970", "text": ["M system is the bandwidth of the MAIN carrier plus the largest modulating frequency.", "0.895 kHz 1 MHz 1.105MHz BW = 1.105 MHz", "6. The bandwidth of an FDM system is the bandwidth of the MAIN carrier plus the largest modulating frequency."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["ng AM for its input modulation, noise can be a significant proble.", "7. In an FDM system using AM for its input modulation, noise can be a significant problem.m."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Guard bands help to eliminate crosstalk.", "8. Guard bands help to eliminate crosstalk................"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Typical FDM multiplexers have three major circuits.  Note that no timing circuits are used.", "Typical FDM multiplexers have three major circuits. Note that no timing circuits are used."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["designed to accept four inputs and use sources and FM modulation.", "The example multiplexer is designed to accept four inputs and use them to apply FM modulation to a carrier.n."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["The basic idea is to generate four different FM signals that are combined by the summing network and are then used to  modulate the MAIN carrier.", "The basic idea is to generate four different FM signals that are combined by the summing network and are then used to modulate the MAIN carrier."], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": ["The operation is as follows.  The four input signals are applied to separate VCOs, generating the FM subcarrier.", "The operation is as follows. The four input signals are applied to separate VCOs, generating the FM subcarrier."], "jumps": ["P2050", "P2015"]}, {"id": "P2041", "text": ["The operation is as follows.  The four input signals are applied to separate VCOs, generating the FM subcarrier.", "The operation is as follows. The four input signals are applied to separate VCOs, generating the FM subcarrier."], "jumps": ["P2050", "P2015"]}, {"id": "P2045", "text": ["VCO -  A VCO is a Voltage Controlled Oscillator.  The oscillator produces an output frequency according to the input voltage.  If the applied voltage varies (in this case,by applying an analog input), then output frequency varies.", "VCO - A VCO is a Voltage Controlled Oscillator. The oscillator produces an output frequency according to the input voltage. If the applied voltage varies (in this case,by applying an analog input), then output frequency varies...................................................................."], "jumps": []}, {"id": "P2050", "text": ["A filter/amplifier is not used in this circuit.  If bandwidth limiting were necessary, it would have to be accomplished before applying the signals to the frequency multiplexer.", "A filter/amplifier is not used in this circuit. If bandwidth limiting were necessary, it would have to be accomplished before applying the signals to the frequency multiplexer."], "jumps": ["P2060", "P2041"]}, {"id": "P2060", "text": ["The center frequency (fis each VCO is set by a variable resistor. Each fc must be different.", "The center frequency (f ) of each VCO is set by a variable resistor. Each f must be different."], "jumps": ["P2070", "P2041"]}, {"id": "P2070", "text": ["NE567 VCOs are used in this case, the same VCO used in the FM lesson.  Remember, other VCO chips can be used.", "NE567 VCOs are used in this case, the same VCO used in the FM lesson. Remember, other VCO chips can be used."], "jumps": ["P2080", "P2041"]}, {"id": "P2080", "text": ["As a review, pin 2 is the input, pin 6 sets the center frequency, and the output is taken from pin 5.", "N INPUT N Vc utput Output ut +Vput +V", "V+ Gain Control Input to P. C. Input Input FM I/O Filter Grounddddddoundundund\\", "TTL Output Filter Analog Output Frequency Set Frequency Set VCO Output V+ VCO Output TTL"], "jumps": ["P2090", "P2041"]}, {"id": "P2090", "text": ["The outputs of the VCOs are then applied to a summing network."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The summing network, usually a capacitor/resistor network, combines the FM signals into one."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The output of the summing network is used to modulate the MAIN carrier."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The MAIN VCO also has its center frequency set by a variable  resistor.  Its f   must be different from the others.", "The MAIN VCO also has its center frequency set by a variable resistor. Its f must be different from the others."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["Finally, the combined FM signal is amplified and sent to the transmission medium."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["Which section of the multiplexer is used to produce subcarrier frequencies?"], "jumps": ["P2090"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["The NE564 VCO generates the MAIN carrier signal.  It does not generate the subcarrier signals.", "The NE564 VCO generates the MAIN carrier signal. It does not generate the subcarrier signals."], "jumps": []}, {"id": "P2143", "text": ["The summing network combines the four subcarrier signals into one.  It does not generate the four subcarriers.", "The summing network combines the four subcarrier signals into one. It does not generate the four subcarriers."], "jumps": []}, {"id": "P2150", "text": ["What is the purpose of Q1?", "What is the purpose of Q1?s typed.........................."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["Q1 does not generate the MAIN carrier signal.  The NE564 VCO generates the MAIN carrier.", "Q1 does not generate the MAIN carrier signal. The NE564 VCO generates the MAIN carrier."], "jumps": []}, {"id": "P2153", "text": ["Q1 does not sum the subcarrier signals.  The summing network combines the four subcarriers.", "Q1 does not sum the subcarrier signals. The summing network combines the four subcarriers."], "jumps": []}, {"id": "P2160", "text": ["We have not discussed the NE564 PLL circuit before. This particular chip can be used as either an FM modulator or demodulator."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["The block diagram of the chip illustrates how.  Note that this chip will be used in the multiplexer and demultiplexer.", "The block diagram of the chip illustrates how. Note that this chip will be used in the multiplexer and demultiplexer."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["In the modulator configuration, the FM input is grounded and the analog input signal is applied to pins 4 and 5."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["The analog input (pins 4 and 5) causes the phase comparator to develop a DC signal, which is applied to the VCO."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["The input voltage varies the VCO output frequency on pin 11, while f   is set by inputs on pins 12 and 13.", "The input voltage varies the VCO output frequency on pin 11, while f is set by inputs on pins 12 and 13."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["The NE564 can operate as a VCO or FM modulator, due to pin 11 not being connected to pin 3 internally."], "jumps": ["P2220", "P2170"]}, {"id": "P2220", "text": ["Other important pins for modulator operations are:", "Other important pins for modulator operations are: .......", "TTL Output Filter Analog Output Frequency Set Frequency Set VCO Output V+ VCO Output TTL", "V+ Loop Gain Control Input to Phase Comp. Input Input FM Input/Output Filter Ground", "Power - pins 1 and 10 Ground - pin 8 Loop Gain Control (DC) - pin 22"], "jumps": ["P2230", "P2170"]}, {"id": "P2230", "text": ["The operation of the PLL circuit for demodulation is covered in the demultiplexer description."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Where is the analog information applied to the NE564 chip when used as a modulator?"], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["Pins 3 and 11 are used to route the VCO output to the phase comparator input.  This connection is used to operate the chip as a demodulator.", "Pins 3 and 11 are used to route the VCO output to the phase comparator input. This connection is used to operate the chip as a demodulator."], "jumps": []}, {"id": "P2243", "text": ["Pin 6 is used as an FM input when the chip is used as a demodulator.   It is grounded when used as a modulator.", "Pin 6 is used as an FM input when the chip is used as a demodulator. It is grounded when used as a modulator."], "jumps": []}, {"id": "P2250", "text": ["ator, which pin is the FM output signal taken?", "When the NE564 PLL chip is configured as a modulator, which pin carries the FM output signal???????"], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["Pin 14 is a demodulated output used when the chip is in the demodulator configuration."], "jumps": []}, {"id": "P2253", "text": ["Pin 16 is a digital demodulated output used when the chip is in the demodulator configuration."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on FDM MULTIPLEXER CIRCUITS.", "This completes the information on FDM MULTIPLEXER CIRCUITS..."], "jumps": ["P2250"]}, {"id": "P2920", "text": ["1.  FDM multiplexers have three major circuits.", "1. FDM multiplexers have three major circuits.......re...."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2. The different input signals are applied to VCO circuits, each of which is set to a different center frequency. Each of these becomes a subcarrier..."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  All of the subcarriers are then summed in the summing                    network.", "3. All of the subcarriers are then summed in the summing network.ork."], "jumps": ["P2950", "P2920"]}, {"id": "P2950", "text": ["4.  The combined FM signal is applied to another VCO modulator       and then amplified.  The output is the FDM signal.", "4. The combined FM signal is applied to another VCO modulator and then amplified. The output is the FDM signal."], "jumps": ["P2960", "P2920"]}, {"id": "P2960", "text": ["5.  The NE564 PLL circuit can be configured to act as either a               modulator or demodulator.", "5. The NE564 PLL circuit can be configured to act as either a modulator or demodulator..............."], "jumps": ["P2970", "P2920"]}, {"id": "P2970", "text": ["6.  As a modulator, the analog input signal is applied to pins 4             and 5.  The output is taken from pin 11.  Pins 11 and 3 are not         connected.", "6. As a modulator, the analog input signal is applied to pins 4 and 5. The output is taken from pin 11. Pins 11 and 3 are not connected."], "jumps": ["P2980", "P2960"]}, {"id": "P2980", "text": ["7.  The pinouts for the NE567 and NE564 chips are as shown.", "7. The pinouts for the NE567 and NE564 chips are as shown.", "TTL Output Filter Analog Output Frequency Set Frequency Set VCO Output V+ VCO Output TTL", "V+ Gain Control Input to P. C. Input Input FM I/O Filter Grounddddddoundundund\\", "N INPUT N Vc utput Output ut +Vput +V"], "jumps": ["P2999", "P2960"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3015", "text": ["Typical FDM demultiplexers have two major circuits--the main carrier demodulator and the subcarrier demodulators.", "circuits--the main carrier demodulator and the sE"], "jumps": ["P3020", "P3001"]}, {"id": "P3020", "text": ["The example demultiplexer is designed to extract four signals from the input FDM signal."], "jumps": ["P3040", "P3015"]}, {"id": "P3040", "text": ["The operation is as follows.  The FDM signal is applied to the main demodulator, which is set for the same center frequency as the modulator was.", "The operation is as follows. The FDM signal is applied to the main demodulator, which is set for the same center frequency as the modulator was."], "jumps": ["P3015"]}, {"id": "P3050", "text": ["t to the transmitter's main carrier freque by a variable resistor.", "The center frequency is set to the transmitter's main carrier frequency by a variable resistor."], "jumps": ["P3015"]}, {"id": "P3060", "text": ["An NE564 chip is used for the main demodulator.  It is the same chip used for the main modulator in the transmitter.", "An NE564 chip is used for the main demodulator. It is the same chip used for the main modulator in the transmitter."], "jumps": ["P3015"]}, {"id": "P3070", "text": ["The demodulated signal is then amplified and applied to four subcarrier demodulator circuits."], "jumps": ["P3015"]}, {"id": "P3080", "text": ["Each subcarrier demodulator is set by means of a variable resistor, to the center frequency of one of the subcarriers used in the transmitter."], "jumps": ["P3015"]}, {"id": "P3090", "text": ["das the d in this case. They were used in the FM and FSK lessons.", "NE565 PLL circuits are used as the demodulators in this case. They were used in the FM and FSK lessons."], "jumps": ["P3015"]}, {"id": "P3100", "text": ["As a review, pins 2 and 3 are the inputs, pin 4 is connected to \npin 5 to configure the chip as a demodulator, pins 8 and 9 set the center frequency, and pin 7 is the signal output.", "As a review, pins 2 and 3 are the inputs, pin 4 is connected to pin 5 to configure the chip as a demodulator, pins 8 and 9 set the center frequency, and pin 7 is the signal output."], "jumps": ["P3015"]}, {"id": "P3110", "text": ["Finally, each recovered signal is then amplified and passed on to a user.", "Finally, each recovered signal is then amplified and passed on to a user.n to a user.n to a user."], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Which section of the demultiplexer is used to demodulate the MAIN carrier frequency?"], "jumps": ["P3100"]}, {"id": "P3121", "text": [], "jumps": []}, {"id": "P3122", "text": ["Notice that there are four NE565 circuits.  These PLL circuits are used to demodulate the subcarriers.", "Notice that there are four NE565 circuits. These PLL circuits are used to demodulate the subcarriers.rs."], "jumps": []}, {"id": "P3123", "text": ["The amplifiers are used to compensate for attenuation caused by the multiplexer/demultiplexer circuits.  They do not demodulate.", "The amplifiers are used to compensate for attenuation caused by the multiplexer/demultiplexer circuits. They do not demodulate."], "jumps": []}, {"id": "P3130", "text": ["What is the purpose of the variable resistor connected to each PLL circuit?", "What is the purpose of the variable resistor connected to each PLL circuit???"], "jumps": ["P3120"]}, {"id": "P3131", "text": [], "jumps": []}, {"id": "P3132", "text": ["The applied voltage to a chip is not variable.  A power supply normally applies the operating voltage directly.", "The applied voltage to a chip is not variable. A power supply normally applies the operating voltage directly."], "jumps": []}, {"id": "P3133", "text": ["The output gain of a PLL circuit is normally controlled by an amplifier.  The variable resistor does not control the gain.", "The output gain of a PLL circuit is normally controlled by an amplifier. The variable resistor does not control the gain."], "jumps": []}, {"id": "P3140", "text": ["The NE564 PLL circuit was used as a modulator in the multiplexer circuit.", "The NE564 PLL circuit was used as a modulator in the multiplexer circuit.ormed modulation."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["By making circuit connection changes, the same chip can be used as a demodulator."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["An FM signal, is applied to pin 6.", "An FM signal, is applied to pin 6.........................."], "jumps": ["P3170", "P3140"]}, {"id": "P3170", "text": ["It's put through a limiter to reduce amplitude variations (noise)."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["The limiter's output is applied to one input of the phase comparator."], "jumps": ["P3190", "P3160"]}, {"id": "P3190", "text": ["Pins 4 and 5 connect to capacitors which act as a filter and pin 2 has a DC voltage applied to control the loop gain (remember, PLL circuits are closed loops."], "jumps": ["P3200", "P3160"]}, {"id": "P3200", "text": ["The output, a DC error voltage that represents the difference between the VCO and phase comparator, is applied to the VCO."], "jumps": ["P3210", "P3160"]}, {"id": "P3210", "text": ["The DC error changes the frequency of the VCO.  The center frequency is set by components connected to pins 12 and 13.", "The DC error changes the frequency of the VCO. The center frequency is set by components connected to pins 12 and 13."], "jumps": ["P3220", "P3160"]}, {"id": "P3220", "text": ["The output of the VCO is fed back into the second input of the phase comparator by an external connection of pins 11 and 3."], "jumps": ["P3230", "P3160"]}, {"id": "P3230", "text": ["The circuit forms a closed loop, like all PLL circuits.  It uses the input FM signal to produce an error signal.", "The circuit forms a closed loop, like all PLL circuits. It uses the input FM signal to produce an error signal. FM demodulate signal."], "jumps": ["P3240", "P3160"]}, {"id": "P3240", "text": ["The error voltage, a demodulated FM signal, is also applied to the retriever circuit.", "The error voltage, a demodulated FM signal, is also applied to the retriever circuit.."], "jumps": ["P3250", "P3160"]}, {"id": "P3250", "text": ["The retriever circuit removes steady state DC voltages and produces a well defined analog signal."], "jumps": ["P3260", "P3240"]}, {"id": "P3260", "text": ["The analog signal is amplified and output at pin 14 as the demodulated signal.", "The analog signal is amplified and output at pin 14 as the demodulated signal.............."], "jumps": ["P3270", "P3240"]}, {"id": "P3270", "text": ["Also note that if digital signals are used, the VCO output on pin 9, instead of pin 11externally connects to the phase comparator input on pin 3.", "Also note that if digital signals are used, the VCO output on pin 9, instead of pin 11, externally connects to the phase comparator input on pin 3."], "jumps": ["P3280", "P3240"]}, {"id": "P3280", "text": ["And last, the output of the retriever circuit is applied to a schmitt trigger which produces a digital output."], "jumps": ["P3290", "P3240"]}, {"id": "P3290", "text": ["The NE564 PLL circuit operates like the NE565 PLL circuit with the addition of a limiter, retriever and schmitt trigger."], "jumps": ["P3300", "P3240"]}, {"id": "P3300", "text": ["our PLL FM demodulators, each tuned to a differe", "The FDM demultiplexer is nothing more than four PLL FM demodulators, each tuned to a different center frequency."], "jumps": ["P3310", "P3240"]}, {"id": "P3310", "text": ["Which pins in the NE564 PLL circuit are connected externally to configure the chip as an analog FM demodulator?"], "jumps": ["P3300"]}, {"id": "P3311", "text": [], "jumps": []}, {"id": "P3312", "text": ["Pins 3 and 9 are connected externally for digital FM demodulation. TTL stands for transistor-transistor logic, which is digital.", "externally for digital FM demodulation. TTL stands for transistor-transistor logic, whicdigital."], "jumps": []}, {"id": "P3313", "text": ["Pins 4 and 5 connect to capacitors which act as a filter. These pins are used in analog FM demodulators but are not used to select between analog and digital.", "a filter. These pins are used in analog FM demodulators but are not used to select between analog and digital.-"], "jumps": []}, {"id": "P3320", "text": ["Which pin in the NE564 PLL circuit is used for a demodulated analog output?"], "jumps": ["P3310"]}, {"id": "P3321", "text": [], "jumps": []}, {"id": "P3322", "text": ["Pin 9 is the VCO output to the phase comparator for digital signals.  It is not the analog output of the circuit.", "Pin 9 is the VCO output to the phase comparator for digital signals. It is not the analog output of the circuit."], "jumps": []}, {"id": "P3323", "text": ["Pin 16 is the demodulated digital output signal.", "Pin 16 is the demodulated digital output signal............"], "jumps": []}, {"id": "P3910", "text": ["This completes the information on FDM DEMULTIPLEXER CIRCUITS."], "jumps": ["P3320"]}, {"id": "P3920", "text": ["1.  FDM demultiplexer circuits have two major circuits.", "1. FDM demultiplexer circuits have two major circuits....."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  The FDM signal is applied to a PLL FM demodulator chip.", "2. The FDM signal is applied to a PLL FM demodulator chip."], "jumps": ["P3940", "P3920", "P"]}, {"id": "P3940", "text": ["3.  The PLL circuit is set to the center frequency of the                            transmitter's MAIN modulator output.", "3. The PLL circuit is set to the center frequency of the transmitter's MAIN modulator output."], "jumps": ["P3950", "P3920"]}, {"id": "P3950", "text": ["4.  The demodulated output is then applied to four subcarrier              demodulators via an amplifier.", "4. The demodulated output is then applied to four subcarrier demodulators via an amplifier.."], "jumps": ["P3960", "P3920"]}, {"id": "P3960", "text": ["5.  Each PLL demodulator is set to one of the center frequencies       used in the transmitter.  Each output is then amplified.", "5. Each PLL demodulator is set to one of the center frequencies used in the transmitter. Each output is then amplified."], "jumps": ["P3970", "P3920"]}, {"id": "P3970", "text": [", has the FM input connected to pin 6 and the output is from pin 14. )", "6. The NE564, when configured as a demodulator, has the FM input connected to pin 6 and the output is from pin 14."], "jumps": ["P3980", "P3920"]}, {"id": "P3980", "text": ["ected togetherthe analog FM   if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
