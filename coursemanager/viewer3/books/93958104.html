const book = {"title": "93958104", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: MICROWAVE RECEIVERSasdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe the trace signals through a basic microwave receiver.icrowave receiver.", "w Describe the operation of a typical microwave receiver. w Describe the operation of the receiver in the Nida Model 330 Microwave Trainer. r."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": ["PPNLYUNA"]}, {"id": "P331", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about the make up of a microwave receiver."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Recall that the purpose of a microwave communication system is to: \nProcess, Transmit, Receive and Interface information to the user.", "Recall that the purpose of a microwave communication system is to: Process, Transmit, Receive and Interface information to the user."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The receiver section contains an antenna system, waveguide system, receiver and information processor."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["The circuits used can be completely different from one receiver to the next."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on MICROWAVE RECEIVERS............................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a block diagram of a typical microwave receiver.", "This is a block diagram of a typical microwave receiver...."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["At first glance, it may appear that it does not contain all the necessary stages that a receiver must have."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["But it does!  Let's cover each stage, starting with the Antenna.\n* Antenna System\n* Waveguide System\n* Receiver \n* Information Processor", "But it does! Let's cover each stage, starting with the Antenna. * Antenna System * Waveguide System * Receiver * Information Processor"], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The antenna picks up transmitted microwave signals and funnels them to the waveguide system."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The waveguides are used as conductors.\n* Antenna System\n* Waveguide System\n* Receiver \n* Information Processor", "The waveguides are used as conductors. * Antenna System * Waveguide System * Receiver * Information Processor"], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["They direct the microwave RF energy into the receiver."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["The receiver is comprised of many components.\n* Antenna System\n* Waveguide System\n* Receiver \n* Information Processor", "The receiver is comprised of many components. * Antenna System * Waveguide System * Receiver * Information Processor"], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["The down converter changes the carrier frequency to the IF frequency."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The IF frequency is lower than the carrier frequency so waveguides are not needed beyond this point.  Coaxial cables can be used now instead.", "The IF frequency is lower than the carrier frequency so waveguides are not needed beyond this point. Coaxial cables can be used now instead."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The down converter consists of an RF amplifier, local oscillator and mixer."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["The modulated IF frequency is routed to a high gain amplifier to boost the signal to a usable level."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["After amplification, the IF signal is sent to the FM discriminator to remove the information from the carrier."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The AFT (automatic frequency tracking) circuit samples the IF signal from the high gain amplifier."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["If the IF is not the correct frequency, the AFT circuit sends a DC signal back to the down converter to change the local oscillator    frequency.", "If the IF is not the correct frequency, the AFT circuit sends a DC signal back to the down converter to change the local oscillator frequency."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["This action maintains the correct IF frequency even if the carrier frequency drifts."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["The information processor in this basic receiver is an amplifier.\n* Antenna System\n* Waveguide System\n* Receiver \n* Information Processor", "The information processor in this basic receiver is an amplifier. * Antenna System * Waveguide System * Receiver * Information Processor"], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["The 6 MHz band width allows for video and multiplex signals to be amplified."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["A multiplexed information signal requires additional information processing to separate the messages."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Where is the IF frequency generated?", "Where is the IF frequency generated?......................."], "jumps": ["P1170"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1202", "text": ["The FM discriminator removes information from the IF carrier signal."], "jumps": []}, {"id": "P1203", "text": ["AFT circuit maintains the correct IF frequency.", "AFT circuit maintains the correct IF frequency............."], "jumps": []}, {"id": "P1210", "text": ["What type of circuits are contained in the down converter?", "What type of circuits are contained in the down converter?.", "IF amplifier, local oscillator and mixer.", "RF amplifier, local oscillator and mixer."], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The down converter changes the RF frequency to an IF frequency."], "jumps": []}, {"id": "P1230", "text": ["The receiver circuit is located on PC130-308 in the Nida Model 330 Microwave Trainer."], "jumps": ["P1240", "P1210"]}, {"id": "P1240", "text": ["The power supply receives \u00b115 VDC and generates +12, +6 and\n-6 VDC outputs.", "15 VDC and generates +12, +6 and -6 VDC outputs."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["IC7 is a +12 VDC voltage regulator.  It receives +15 VDC.", "IC7 is a +12 VDC voltage regulator. It receives +15 VDC."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The +12 VDC is routed to the down converter via J2 and is also used for power to IC4 and IC5 in the amplifier and AFT circuits."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["IC6 is a +6 VDC voltage regulator.  It also receives +15 VDC.", "IC6 is a +6 VDC voltage regulator. It also receives +15 VDC."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["+6 VDC is used for IC1 and IC2 in the high gain amplifier.  It is also used by IC3 in the AFT circuit.", "+6 VDC is used for IC1 and IC2 in the high gain amplifier. It is also used by IC3 in the AFT circuit."], "jumps": ["P1290", "P1240"]}, {"id": "P1290", "text": ["IC8 is a -6 VDC voltage regulator.  It receives -15 VDC.", "IC8 is a -6 VDC voltage regulator. It receives -15 VDC."], "jumps": ["P1300", "P1240"]}, {"id": "P1300", "text": ["-6 VDC is used for IC1 and IC2 in the high gain amplifier.  It is also used by IC3 in the AFT circuit.", "-6 VDC is used for IC1 and IC2 in the high gain amplifier. It is also used by IC3 in the AFT circuit."], "jumps": ["P1310", "P1240"]}, {"id": "P1310", "text": ["The high gain amplifier is made up of IC1 and IC2.  The input is from the down converter via J1.", "Test points are provided for monitoring the three voltages.", "The high gain amplifier is made up of IC1 and IC2. The input is from the down converter via J1."], "jumps": ["P1320", "P1240", "P1330"]}, {"id": "P1330", "text": ["The IF input, (50 MHz is used in the Nida Model 330 Microwave Trainer) passes through a filter before being applied to the high     gain amplifier.", "The output of IC2 is rectified by D1 and applied to the IC3 in the FM discriminator, and to the AFT circuit, IC5.", "The IF input, (50 MHz is used in the Nida Model 330 Microwave Trainer) passes through a filter before being applied to the high gain amplifier."], "jumps": ["P1340", "P1320", "P1342", "P1330"]}, {"id": "P1342", "text": ["TP3 is provided to monitor the rectified IF signal."], "jumps": ["P1350", "P1340"]}, {"id": "P1350", "text": ["Also, R6 controls the amount of AGC, (Automatic Gain Control). TP1 is provided to monitor this DC voltage."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["IC3 is the FM discriminator that reproduces the information.  C15 is used to adjust it for proper operation.", "IC3 is the FM discriminator that reproduces the information. C15 is used to adjust it for proper operation."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["IC3 operates in a phase lock mode that produces a signal that is proportional to the variations in the IF frequency.", "IC5 and IC9 are the AFT circuit.  It's input is from the high gain amplifier.", "IC5 and IC9 are the AFT circuit. It's input is from the high gain amplifier."], "jumps": ["P1380", "P1360", "P1390"]}, {"id": "P1390", "text": ["The circuit develops a DC voltage that controls the frequency of the local oscillator in the down converter."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The AFT signal is sent to the AFT/NML switch."], "jumps": ["P1405", "P1380"]}, {"id": "P1405", "text": ["In the AFT position, the control voltage from IC5 maintains a LO frequency that produces an IF of 50 MHz."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["In the NML (normal) position, +12 VDC is divided to produce a DC voltage that keeps the LO at 10.450 GHz."], "jumps": ["P1415", "P1380"]}, {"id": "P1415", "text": ["If the IF carrier is 10.5 MHz the LO frequency will be kept at\n50 MHz.", "If the IF carrier is 10.5 MHz the LO frequency will be kept at 50 MHz."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["R22, AFT ADJ, is used to adjust the AFT circuit for proper operation.  TP5 is provided to monitor the AFT voltage.", "R22, AFT ADJ, is used to adjust the AFT circuit for proper operation. TP5 is provided to monitor the AFT voltage."], "jumps": ["P1430", "P1380"]}, {"id": "P1430", "text": ["L3 set the operation of the circuit.  This adjustment is set and need not be changed.", "L3 set the operation of the circuit. This adjustment is set and need not be changed."], "jumps": ["P1440", "P1380"]}, {"id": "P1440", "text": ["IC4 is the 6 MHz bandwidth amplifier.  R17 is the gain adjust. TP4 (input) and an Output test point are provided for monitoring these signals.", "IC4 is the 6 MHz bandwidth amplifier. R17 is the gain adjust. TP4 (input) and an Output test point are provided for monitoring these signals."], "jumps": ["P1450", "P1380"]}, {"id": "P1450", "text": ["Remember, other microwave receivers may use different circuits. The circuits shown are typical receiver circuits."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["What circuit is responsible for maintaining the IF frequency at \n50 MHz?", "What circuit is responsible for maintaining the IF frequency at 50 MHz?"], "jumps": ["P1440"]}, {"id": "P1461", "text": [], "jumps": []}, {"id": "P1462", "text": ["The high gain amplifier boosts the modulated IF to a usable level."], "jumps": []}, {"id": "P1463", "text": ["The FM discriminator removes the information from the IF carrier."], "jumps": []}, {"id": "P1470", "text": ["Where is the microwave frequency changed to the IF frequency?"], "jumps": ["P1460"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["The high gain amplifier receives the modulated signal at the IF frequency and amplifies it to a usable level."], "jumps": []}, {"id": "P1473", "text": ["The FM discriminator receives a rectified IF signal and removes the information or modulation."], "jumps": []}, {"id": "P1480", "text": ["What is the operating voltage applied to the AFT circuit, \nIC5 and IC9?", "What is the operating voltage applied to the AFT circuit, IC5 and IC9?"], "jumps": ["P1470"]}, {"id": "P1481", "text": ["Look on IC5 Pin 6 for the operating voltage supplied to the AFT circuit.", "Look on IC5 Pin 6 for the operating voltage supplied to the AFT circuit.."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on MICROWAVE RECEIVERS.", "This completes the information on MICROWAVE RECEIVERS......"], "jumps": ["P1001", "P1480"]}, {"id": "P1920", "text": ["1.  A microwave communication system's purpose is to:                       Process, Transmit, Receive and Interface Information to the            user.", "1. A microwave communication system's purpose is to: Process, Transmit, Receive and Interface Information to the user."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A basic microwave receiver: Receives information, down                converts the frequency, demodulates the signal and                         processes the information for the user.", "2. A basic microwave receiver: Receives information, down converts the frequency, demodulates the signal and processes the information for the user."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The waveguide system includes the antenna, waveguide and        down-converter.", "3. The waveguide system includes the antenna, waveguide and down-converter."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The electronic circuitry includes a power supply, amplifier,             AFT circuit and a FM discriminator.", "4. The electronic circuitry includes a power supply, amplifier, AFT circuit and a FM discriminator."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  The Nida microwave circuitry is contained on one PC card,            PC130-308.", "5. The Nida microwave circuitry is contained on one PC card, PC130-308."], "jumps": ["P1970", "P1930"]}, {"id": "P1970", "text": ["6.  The high gain amplifier boosts the IF signal to a usable level.         The 6 MHz bandwidth amplifier boosts the demodulated                  signal.", "6. The high gain amplifier boosts the IF signal to a usable level. The 6 MHz bandwidth amplifier boosts the demodulated signal."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  The FM discriminator removes the information from the IF               signal.  The AFT circuit maintains the down-converter output         at 50 MHz.", "7. The FM discriminator removes the information from the IF signal. The AFT circuit maintains the down-converter output at 50 MHz."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  The power supply applies +12, +6 and -6 VDC to the IC's.  It            also applies +12 VDC to the down-converter.", "8. The power supply applies +12, +6 and -6 VDC to the IC's. It also applies +12 VDC to the down-converter."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to observe the operation of a typical microwave receiver."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC card PC130-308.  It contains the electronic circuits for a microwave receiver.", "Pick up the PC card PC130-308. It contains the electronic circuits for a microwave receiver."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The circuit contains one switch and three trim potentiometers, one trimmmer capacitor, and one variable inductor."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["Locate the high gain amplifiers, IC1 and IC2, and the 6 MHz bandwidth amplifier, IC4."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["Locate the FM discriminator, IC3, and the AFT circuit, IC5."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["Locate the IC voltage regulators, IC6, IC7 and IC8."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["Familiarize yourself with the test points on the card.  Now let's start the experiment.", "Familiarize yourself with the test points on the card. Now let's start the experiment. ngs. Designate one console as the transmitter console and the other as the receiver console. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
