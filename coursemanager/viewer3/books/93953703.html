const book = {"title": "93953703", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SCR TRIGGER CIRCUIT OPERATIONasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of SCR trigger circuits. w Recognize SCR trigger circuits. w Describe the operation of a SCR trigger circuit.", "w Measure the gate and anode current in an operating SCR trigger circuit. w Recognize normal operation of a SCR trigger circuit........................"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["SCRs are used in DC and AC circuits.  In this lesson, you will learn about the operation of a SCR in a DC circuit.", "SCRs are used in DC and AC circuits. In this lesson, you will learn about the operation of a SCR in a DC circuit."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["DC SCR circuits are called trigger circuits.", "DC SCR circuits are called trigger circuits................"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The SCR controls the application of power to the load, it is an electronic ON/OFF switch that uses current to operate."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on SCR TRIGGER CIRCUIT OPERATION..................."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This is a typical SCR trigger circuit.", "This is a typical SCR trigger circuit......................"], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The purpose of the circuit is to apply power to the load resistor RL, using the SCR as a switch."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The SCR has an input circuit that applies gate current (Ig) which turns it ON."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The reset circuit turns OFF the SCR."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["+DC forward biases the SCR.  When the SCR is ON, anode current (Ia) flows through the load.", "+DC forward biases the SCR. When the SCR is ON, anode current (Ia) flows through the load."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["In this trigger circuit, which component/components comprise the input circuit?"], "jumps": ["P1020"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["R1 is not in the input circuit.  R1 is part of the reset circuit that turns the SCR OFF.", "R1 is not in the input circuit. R1 is part of the reset circuit that turns the SCR OFF."], "jumps": []}, {"id": "P1073", "text": ["R1, C1 and S1 make up the reset circuit.  They are not part of the input circuit.  The reset circuit turns OFF the SCR.", "R1, C1 and S1 make up the reset circuit. They are not part of the input circuit. The reset circuit turns OFF the SCR."], "jumps": []}, {"id": "P1080", "text": ["In this trigger circuit, which component/components comprise the reset circuit?"], "jumps": ["P1070"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["R1 is in the reset circuit.  However, R1 does not turn OFF the SCR by itself, there are other components.", "R1 is in the reset circuit. However, R1 does not turn OFF the SCR by itself, there are other components."], "jumps": []}, {"id": "P1083", "text": ["& B ircuit which is used to turn the SCR ON.", "R2 is not in the reset circuit. R2 is in the input circuit which is used to turn the SCR ON."], "jumps": []}, {"id": "P1090", "text": ["The operation of a trigger circuit is based on two independent currents, Ig and Ia."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Applying a positive voltage to the input circuit establishes gate current flow."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["Ig causes the gate semiconductor material (P Type) to vanish."], "jumps": ["P1120", "P1090", "P1115", "P"]}, {"id": "P1112", "text": ["Ig causes the gate semiconductor material (P Type) to vanish."], "jumps": ["P1120", "P1090", "P1115", "P"]}, {"id": "P1115", "text": ["P MATERIAL GATE - The gate is made of a thin piece of P material between two pieces of N material. Current flow from the cathode to the gate causes the two N materials to combine, this eliminates the effect of the P material.....................................................................................................................................................................", "P MATERIAL GATE - The gate is made of a thin piece of P material between two pieces of N material. Current flow from the gate to the cathode causes the two N materials to combine, this eliminates the effect of the P material......................................................................................................................................................................"], "jumps": []}, {"id": "P1120", "text": ["With +DC supplying forward bias,the SCR turns ON producing Ia."], "jumps": ["P1130", "P1112"]}, {"id": "P1130", "text": ["The SCR turned ON which supplied power to the load.  Ia flows through RL.", "The SCR turned ON which supplied power to the load. Ia flows through RL."], "jumps": ["P1140", "P1112"]}, {"id": "P1140", "text": ["When removing Ig, the SCR remains ON."], "jumps": ["P1150", "P1112"]}, {"id": "P1150", "text": ["One note, if Ia is small, the SCR will immediately turn back OFF."], "jumps": ["P1160", "P1112"]}, {"id": "P1160", "text": ["A small Ia allows the gate's P material to reform, blocking cathode to anode current flow.", "A small Ia allows the gate's P material to reform, blocking anode to cathode current flow."], "jumps": ["P1170", "P1112", "P1165"]}, {"id": "P1161", "text": ["A small Ia allows the gate's P material to reform, blocking cathode to anode current flow.", "A small Ia allows the gate's P material is reform blocking anode to cathode current flow."], "jumps": ["P1170", "P1112", "P1165"]}, {"id": "P1165", "text": ["P MATERIAL GATE - The current flowing through the SCR will keep the P material gate from reforming. However, if Ia is too small, there is not enough electrons to fill the holes and P material reappears stopping current flow.", "P MATERIAL GATE - The current flowing through the SCR will keep the P material gate from reforming. However, if Ia is too small, there is not enough negative charges to attract the positive charges and the P material reappears stopping current flow."], "jumps": []}, {"id": "P1170", "text": ["The minimum Ia required to sustain current flow is called HOLDING CURRENT(Ih) and is given in transistor reference books."], "jumps": ["P1180", "P1161"]}, {"id": "P1180", "text": ["To turn OFF the SCR, the reset circuitis used.  Reset circuits either stop Ia or reduce Ia to less than Ih.", "To turn OFF the SCR, the reset circuitis used. Reset circuits either stop Ia or reduce Ia to less than Ih."], "jumps": ["P1190", "P1161"]}, {"id": "P1190", "text": ["With S1 open, the left hand plate of C1 has +DC voltage on it. C1 prevents this steady voltage from reaching the anode of SCR 1."], "jumps": ["P1200", "P1161"]}, {"id": "P1200", "text": ["Closing S1 places a ground on the left hand plate of C1.  This drops the voltage from +DC to 0 V.", "Closing S1 places a ground on the left hand plate of C1. This drops the voltage from +DC to 0 V."], "jumps": ["P1210", "P1161"]}, {"id": "P1210", "text": ["The change in voltage is coupled across C1 momentarily placing a ground on the anode of SCR 1."], "jumps": ["P1220", "P1161"]}, {"id": "P1220", "text": ["The ground on the anode of SCR 1 reverse biases the SCR interrupting current flow.  The SCR turns OFF.", "The ground on the anode of SCR 1 reverse biases the SCR interrupting current flow. The SCR turns OFF."], "jumps": ["P1230", "P1161"]}, {"id": "P1230", "text": ["With SCR 1 OFF, power is no longer applied to the load."], "jumps": ["P1240", "P1161"]}, {"id": "P1240", "text": ["With S1 open the circuit is back to its initial state.  When an input is applied to the gate, the SCR turns ON and supplies power to the load.", "With S1 open the circuit is back to its initial state. When an input is applied to the gate, the SCR turns ON and supplies power to the load."], "jumps": ["P1250", "P1161"]}, {"id": "P1250", "text": ["Which current flow is applied to the load when the SCR turns ON?"], "jumps": ["P1161", "P1252"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Ig is the current that turns the SCR ON.  It is independent of the current that flows through the load.", "Ig is the current that turns the SCR ON. It is independent of the current that flows through the load."], "jumps": []}, {"id": "P1253", "text": ["Ih is the term used to describe the minimum Ia current required to hold the SCR ON."], "jumps": []}, {"id": "P1260", "text": ["If Ig is applied to the gate and Ia drops below Ih, what happens to the SCR?"], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["The SCR does not turn ON and stay ON.  With Ia less than the holding current, Ih, the SCR turns ON but, the current flow through the SCR can not keep the SCR ON.", "The SCR does not turn ON and stay ON. With Ia less than the holding current, Ih, the SCR turns ON but, the current flow through the SCR can not keep the SCR ON."], "jumps": []}, {"id": "P1263", "text": ["The SCR does not stay OFF.  Applying gate current to the SCR and having the SCR forward biased will turn the SCR ON. Because Ia drops below Ih, the SCR turns back OFF.", "The SCR does not stay OFF. Applying gate current to the SCR and having the SCR forward biased will turn the SCR ON. Because Ia drops below Ih, the SCR turns back OFF."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on SCR TRIGGER CIRCUIT.", "This completes the information on SCR TRIGGER CIRCUIT......"], "jumps": ["P1001", "P1260"]}, {"id": "P1920", "text": ["1.  SCR trigger circuits are used as electronic ON/OFF switches.", "1. SCR trigger circuits are used as electronic ON/OFF switches."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The input is applied to the gate.  Ig is developed which will              allow the SCR to turn ON.", "2. The input is applied to the gate. Ig is developed which will allow the SCR to turn ON..."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  With the SCR forward biased, the SCR turns ON.  If Ia is larger        than Ih, the SCR remains ON.", "3. With the SCR forward biased, the SCR turns ON. If Ia is larger than Ih, the SCR remains ON.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The reset circuit turns the SCR OFF.  S1 reverse biases SCR 1       interrupting anode current flow.", "4. The reset circuit turns the SCR OFF. S1 reverse biases SCR 1 interrupting anode current flow...."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["The purpose of this experiment is to check the normal operation of a SCR trigger circuit."], "jumps": ["P2040", "P2001"]}, {"id": "P2040", "text": ["Pick up the PC130-52A card.  The purpose of this card is to demonstrate the operation of a SCR trigger circuit.", "Pick up the PC130-52A card. The purpose of this card is to demonstrate the operation of a SCR trigger circuit."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Compare the components on PC130-52A to the schematic shown."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Notice that I1 is the load.  It is an incandescent lamp.", "Notice that I1 is the load. It is an incandescent lamp."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["R1 and R2 form the input circuit.  R2 is variable and is adjusted to change the input current, Ig.", "R1 and R2 form the input circuit. R2 is variable and is adjusted to change the input current, Ig."], "jumps": ["P2080", "P2040"]}, {"id": "P2080", "text": ["S1 selects between a DC or pulse input. The pulse input will not be used in this experiment."], "jumps": ["P2090", "P2040"]}, {"id": "P2090", "text": ["C1, R3 and S2 form the reset circuit.  Let's start the experiment.", "C1, R3 and S2 form the reset circuit. Let's start the experiment."], "jumps": ["P2100", "P2040"]}, {"id": "P2100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2040"]}, {"id": "P2110", "text": ["2.  Carefully plug PC130-52A into the Test Console PC2 position.", "2. Carefully plug PC130-52A into the Test Console PC2 position. to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2100", "P2120"]}, {"id": "P2120", "text": ["3.  Adjust R2 on PC130-52A fully CCW. \n4.  Set S1 on PC130-52A to DC. \n5.  Set S2 on PC130-52A to OPERATE.", "3. Adjust R2 on PC130-52A fully CCW. 4. Set S1 on PC130-52A to DC. 5. Set S2 on PC130-52A to OPERATE. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2110", "P2125"]}, {"id": "P2125", "text": ["MEASUREMENT SETUP - Adjust R2 fully CCW S1 - DC S2 - Operate"], "jumps": []}, {"id": "P2130", "text": ["6.  Set Voltmeter switch to Positive.\n7.  Set the Positive Supply Voltage to 12. \n     The Test Console's voltage meter should indicate 12 Volts.", "6. Set Voltmeter switch to Positive. 7. Set the Positive Supply Voltage to 12. The Test Console's voltage meter should indicate 12 Volts.."], "jumps": ["P2120"]}, {"id": "P2140", "text": ["8.  Turn PC2 DC Power switch to ON.", "8. Turn PC2 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2130"]}, {"id": "P2150", "text": ["Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)?", "Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)?..."], "jumps": ["P2140"]}, {"id": "P2151", "text": [], "jumps": []}, {"id": "P2152", "text": ["The SCR should be OFF. Check:  - S1 to DC\n                                                                - R2 rotated fully CCW \nNow, set S2 to RESET and back to OPERATE.  If the SCR is still ON, check with your instructor.", "The SCR should be OFF. Check: - S1 to DC - R2 rotated fully CCW Now, set S2 to RESET and back to OPERATE. If the SCR is still ON, check with your instructor."], "jumps": []}, {"id": "P2160", "text": ["The experiment is now set up.  Let's measure and monitor Ig to determine the current necessary to turn ON the SCR and to determine if the SCR is operating normally.", "The experiment is now set up. Let's measure and monitor Ig to determine the current necessary to turn ON the SCR and to determine if the SCR is operating normally."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["1.  Set up your multimeter to measure current.  Place alligator              connectors on the test leads. \n2.  If using a non-auto ranging multimeter, set the current range          to measure at least 20 mA.", "1. Set up your multimeter to measure current. Place alligator connectors on the test leads. 2. If using a non-auto ranging multimeter, set the current range to measure at least 20 mA. xternal program = SCAN FTR 0 F2 10"], "jumps": ["P2160"]}, {"id": "P2180", "text": ["3.  Connect the + test lead to PC130-52A pin J. \n4.  Connect the - test lead to PC130-52A pin I.", "3. Connect the + test lead to PC130-52A pin J. 4. Connect the - test lead to PC130-52A pin I. OTE The computer has opened the path of the input circuit between PINS J and I. Your multimeter is in series with R2 and R1, current can now be measured.", "The computer has opened the path of the input circuit between PINS J and I. Your multimeter is in series with R2 and R1, current can now be measured."], "jumps": ["P2190", "P2170", "P2185"]}, {"id": "P2185", "text": ["MEASUREMENT SETUP - Connect the + test lead to pin J. Connect the - test lead to pin I."], "jumps": []}, {"id": "P2190", "text": ["5.  While observing I1, slowly rotate PC130-52A R2 CW until the          SCR turns ON, I1 illuminates. \n6.  Note the current reading on the multimeter.", "5. While observing I1, slowly rotate PC130-52A R2 CW until the SCR turns ON, I1 illuminates. 6. Note the current reading on the multimeter.."], "jumps": ["P2200", "P2180", "P2195"]}, {"id": "P2195", "text": ["MEASUREMENT SETUP - Adjust R2 fully CW S1 - DC S2 - Operate"], "jumps": []}, {"id": "P2200", "text": ["The maximum rated value of Ig for the 2N1596 SCR is 10 mA. Your measured value of Ig should be between 2 mA and 5 mA.", "The maximum rated value of Ig for the 2N1596 SCR is 10 mA. Your measured value of Ig should be between 2 mA and 5 mA. TE If your reading is out of this range it may be caused by Multimeter error and how quick you stopped rotating R2 when I1 illuminated...", "If your reading is out of this range it may be caused by Multimeter error and how quick you stopped rotating R2 when I1 illuminated."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["7.  Rotate R2 on the PC130-52A fully CCW. Note that Ig drops to 0      mA.  Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)?", "7. Rotate R2 on the PC130-52A fully CCW. Note that Ig drops to 0 mA. Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)?"], "jumps": ["P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["The SCR should be ON, I1 illuminated. SCRs will not turn OFF once Ig is removed or lowered unless Ia is below Ih.  Ensure that the applied voltage is +12 V to the circuit.  Then check with your instructor.", "The SCR should be ON, I1 illuminated. SCRs will not turn OFF once Ig is removed or lowered unless Ia is below Ih. Ensure that the applied voltage is +12 V to the circuit. Then check with your instructor."], "jumps": []}, {"id": "P2220", "text": ["This verifies the operation of the SCR that once turned ON, it will remain ON even if Ig is removed or lowered below the trigger level."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["8.  Ensure that R2 on PC130-52A is fully CCW.\n9.  Place PC130-52A S2 to the reset position.", "8. Ensure that R2 on PC130-52A is fully CCW. 9. Place PC130-52A S2 to the reset position."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["MEASUREMENT SETUP - Adjust R2 fully CCW S1 - DC S2 - Reset"], "jumps": []}, {"id": "P2240", "text": ["Did the SCR turn OFF, I1 extinguished?", "Did the SCR turn OFF, I1 extinguished?....................."], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["The SCR should have turned OFF. Check: \n- R2 is fully CCW  \n- S2 in the Reset position", "The SCR should have turned OFF. Check: - R2 is fully CCW - S2 in the Reset position ......................................................................................................................................................................................................................................................................................", "If R2 supplies about 10 mA the SCR turns OFF when S2 is closed but turns back on. The action of C1 only passes a change in voltage. Once the voltage decreases to 0 V and remains steady, C1 blocks the ground to the SCR allowing the trigger current to turn the SCR back ON."], "jumps": []}, {"id": "P2250", "text": ["This verifies the operation of the SCR that once Ia is interrupted, the SCR will turn OFF."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["10.  Disconnect the multimeter from PC130-52A pins I and J.", "10. Disconnect the multimeter from PC130-52A pins I and J. External program = SCAN FTR 0 C1 00 ch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2250"]}, {"id": "P2270", "text": ["You will now reduce Ia to verify that the SCR will not turn ON if Ia is less than Ih.  Since the load resistance can not be changed, you will decrease the applied voltage to reduce Ia.", "You will now reduce Ia to verify that the SCR will not turn ON if Ia is less than Ih. Since the load resistance can not be changed, you will decrease the applied voltage to reduce Ia."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["1.  Set the PC2 DC switch to OFF.", "1. Set the PC2 DC switch to OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2270"]}, {"id": "P2290", "text": ["2.  Set Voltmeter switch to Positive. \n3.  Set the Positive Supply Voltage to 10. \n     The Test Console's voltage meter should indicate 10 Volts.", "2. Set Voltmeter switch to Positive. 3. Set the Positive Supply Voltage to 10. The Test Console's voltage meter should indicate 10 Volts.."], "jumps": ["P2280"]}, {"id": "P2300", "text": ["4.  Connect the + test lead on your multimeter to PC130-52A \n      pin M.\n5.  Connect the - test lead on your multimeter to PC130-52A pin L.", "4. Connect the + test lead on your multimeter to PC130-52A pin M. 5. Connect the - test lead on your multimeter to PC130-52A pin L. as opened the path to the anode of SCR 1 between pins M and L. Your multimeter is in series with I1 and SCR 1, current can now be measured. rogram = SCAN FTR 0 F2 0777", "The computer has opened the path to the anode of SCR 1 between pins M and L. Your multimeter is in series with I1 and SCR 1, current can now be measured..."], "jumps": ["P2290", "P2305"]}, {"id": "P2305", "text": ["MEASUREMENT SETUP - Connect the + test lead to pin M. Connect the - test lead to pin L."], "jumps": []}, {"id": "P2310", "text": ["6.  If using a non-auto ranging multimeter, set the current range          to measure at least 150 mA.", "6. If using a non-auto ranging multimeter, set the current range to measure at least 150 mA. NOTE DO NOT CHANGE RANGE SETTING. Changing the range will momentarily interrupt Ia turning the SCR OFF. External program = SCAN FTR 0 E2 10000000", "DO NOT CHANGE RANGE SETTING. Changing the range will momentarily interrupt Ia turning the SCR OFF."], "jumps": ["P2300"]}, {"id": "P2320", "text": ["7.  Turn PC2 DC Power switch to ON.", "7. Turn PC2 DC Power switch to ON.ol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2310"]}, {"id": "P2330", "text": ["8.  Rotate R2 on PC130-52A CW until SCR 1 turns ON, I1                       illuminated.  Note the current reading on the multimeter.  You         should be reading approximately 100 mA.", "8. Rotate R2 on PC130-52A CW until SCR 1 turns ON, I1 illuminated. Note the current reading on the multimeter. You should be reading approximately 100 mA..K"], "jumps": ["P2340", "P2320", "P2335"]}, {"id": "P2335", "text": ["MEASUREMENT SETUP - Adjust R2 fully CW S1 - DC S2 - Reset"], "jumps": []}, {"id": "P2340", "text": ["9.  Decrease Ig by rotating R2 on PC130-52A fully CCW.  Note              that Ia does not decrease.  Remember, Ig and Ia are                          independent of each other.", "9. Decrease Ig by rotating R2 on PC130-52A fully CCW. Note that Ia does not decrease. Remember, Ig and Ia are independent of each other."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["10.  Rotate the Positive Supply Voltage switch for a reading of 5            Volts.\n        The Test Console's voltage meter should indicate 5 Volts.", "10. Rotate the Positive Supply Voltage switch for a reading of 5 Volts. The Test Console's voltage meter should indicate 5 Volts."], "jumps": ["P2340"]}, {"id": "P2360", "text": ["Notice that Ia decreased.  However, the SCR is still ON as indicated by I1 being illuminated.  Increasing the applied voltage back to 10 V increases Ia, this verifies that the SCR is still ON.", "Notice that Ia decreased. However, the SCR is still ON as indicated by I1 being illuminated. Increasing the applied voltage back to 10 V increases Ia, this verifies that the SCR is still ON. TE I1 is not as bright as before. Lowering the current flow reduces the intensity of the lamp.", "I1 is not as bright as before. Lowering the current flow reduces the intensity of the lamp."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["11.  Continue to lower the applied voltage by rotating the Positive         Supply Voltage switch.  Notice that around 1 V, Ia drops to 0          and the lamp goes out, the SCR turned OFF.  Increasing the           applied voltage back to 10 V has no effect, the SCR remains           OFF.", "11. Continue to lower the applied voltage by rotating the Positive Supply Voltage switch. Notice that around 1 V, Ia drops to 0 and the lamp goes out, the SCR turned OFF. Increasing the applied voltage back to 10 V has no effect, the SCR remains OFF..."], "jumps" le and is adjusted to change the input current, Ig."], "jumps": ["P13080", "P13040"]}, {"id": "P13080", "text": ["S1 selects between a DC or pulse input. The pulse input will not be used in this experiment."], "jumps": ["P13090", "P13040"]}, {"id": "P13090", "text": ["C1, R3 and S2 form the reset circuit.  Let's start the experiment.", "C1, R3 and S2 form the reset circuit. Let's start the experiment."], "jumps": ["P13100", "P13040"]}, {"id": "P13100", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13040"]}, {"id": "P13110", "text": ["2.  Carefully plug PC130-52A into the Test Console PC2 position.", "2. Carefully plug PC130-52A into the Test Console PC2 position."], "jumps": ["P13120"]}, {"id": "P13120", "text": ["3.  Adjust R2 on PC130-52A fully CCW.\n4.  Set S1 on PC130-52A to DC. \n5.  Set S2 on PC130-52A to OPERATE.", "3. Adjust R2 on PC130-52A fully CCW. 4. Set S1 on PC130-52A to DC. 5. Set S2 on PC130-52A to OPERATE.."], "jumps": ["P13130", "P13110", "P13125"]}, {"id": "P13125", "text": ["MEASUREMENT SETUP - Adjust R2 fully CCW S1 - DC S2 - Operate"], "jumps": []}, {"id": "P13130", "text": ["6.  Press Enter to Set: Positive Supply Voltage - 15", "6. Press Enter to Set: Positive Supply Voltage - 15......................."], "jumps": ["P13120"]}, {"id": "P13140", "text": ["7.  Press Enter to Set: PC2 DC Power Switch - ON", "7. Press Enter to Set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13150", "text": ["Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)?"], "jumps": []}, {"id": "P13151", "text": [], "jumps": []}, {"id": "P13152", "text": ["The SCR should be OFF. Check: \n                                                - S1 to DC  \n                                                - R2 rotated fully CCW \nNow, set S2 to RESET and back to OPERATE.  If the SCR is still ON, check with your instructor. es. 6. Note the current reading on the multimeter.."], "jumps": ["P13200", "P13180", "P13195"]}, {"id": "P13195", "text": ["MEASUREMENT SETUP - Adjust R2 fully CW S1 - DC S2 - Operate"], "jumps": []}, {"id": "P13200", "text": ["The maximum rated value of Ig for the 2N1596 SCR is 10 mA. Your measured value of Ig should be between 2 mA and 5 mA.", "The maximum rated value of Ig for the 2N1596 SCR is 10 mA. Your measured value of Ig should be between 2 mA and 5 mA. NOTE If your reading is out of this range it may be caused by Multimeter error and how quick you stopped rotating R2 when I1 illuminated.", "If your reading is out of this range it may be caused by Multimeter error and how quick you stopped rotating R2 when I1 illuminated."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["7.  Rotate R2 on the PC130-52A fully CCW.  Note that Ig drops to        0 mA.  Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)?", "7. Rotate R2 on the PC130-52A fully CCW. Note that Ig drops to 0 mA. Is the SCR ON (I1 illuminated) or OFF (I1 extinguished)??????"], "jumps": ["P13200"]}, {"id": "P13211", "text": [], "jumps": []}, {"id": "P13212", "text": ["The SCR should be ON, I1 illuminated.  SCRs will not turn OFF once Ig is removed or lowered unless Ia is below Ih.  Ensure that the applied voltage is +12 V to the circuit.  Then check with your instructor.", "The SCR should be ON, I1 illuminated. SCRs will not turn OFF once Ig is removed or lowered unless Ia is below Ih. Ensure that the applied voltage is +12 V to the circuit. Then check with your instructor."], "jumps": []}, {"id": "P13220", "text": ["This verifies the operation of the SCR that once turned ON, it will remain ON even if Ig is removed or lowered below the trigger level."], "jumps": ["P13230", "P13210"]}, {"id": "P13230", "text": ["8.  Ensure that R2 on PC130-52A is fully CCW. \n9.  Place PC130-52A S2 to the reset position.", "8. Ensure that R2 on PC130-52A is fully CCW. 9. Place PC130-52A S2 to the reset let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
