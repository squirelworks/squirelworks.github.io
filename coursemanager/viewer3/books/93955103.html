<script>
const book = {"title": "93955103", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ROTATING MACHINERY TRAINER FAMILIARIZATIONf sadf"], "jumps": []}, {"id": "P10", "text": ["ROTATING MACHINERY TRAINER FAMILIARIZATION"], "jumps": []}, {"id": "P100", "text": ["1. 280 Controls, Indicators & Connectors", "w Identify and describe 280 trainer controls. w Identify and describe 280 trainer indicators. w Identify and describe 280 trainer connectors.", "w Prepare the trainer by setting it to the initial control settings. w Verify trainer performance by performing a simple experiment.................", "2. 280 Trainer Familiarization Experiment"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "3. Nida Model 280 Rotating Machinery Trainer", "6. 8 Pin Interconnect Cable eterXXXXXXXXXXnt"], "jumps": []}, {"id": "P330", "text": ["Nida Model 280 Rotating Machinery Trainer"], "jumps": []}, {"id": "P340", "text": [], "jumps": ["P"]}, {"id": "P350", "text": [], "jumps": []}, {"id": "P360", "text": [], "jumps": []}, {"id": "P361", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will be introduced to the Nida Model 280 Rotating Machinery Trainer."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Each control, indicator and connector of the trainer will be investigated."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["This lesson will enable you to set the Rotating Machinery trainer to its initial control settings."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["You will become completely familiar with the Rotating Machinery Trainer."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on ROTATING MACHINERY TRAINER FAMILIARIZATION........"], "jumps": ["P400"]}, {"id": "P900", "text": ["1. 280 Controls, Indicators & Connectorss", "2. 280 Trainer Familarization Experiment"], "jumps": []}, {"id": "P1001", "text": ["CONTROLS, INDICATORS & CONNECTORSRSSSSSSSSSS", "CONTROLS, INDICATORS & CONNECTORSSSSSSSSSSSS"], "jumps": []}, {"id": "P1020", "text": ["The Nida Model 280 Rotating Trainer is a very versatile piece of equipment."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["It can be configured as an AC motor, DC motor, Stepper motor, and a generator."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["In order to utilize the trainer, it is important to have a firm understanding of all controls, connectors and indicators."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The controls, indicators and connectors are contained on two panels of the trainer: The Motor Control Panel and the Mimic Bus Panel."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The Motor Control Panel contains the motors, shaft couplers, electric brake, magnetic pickup assembly and 130 interface connectors."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The Mimic Bus Panel contains test points to monitor motor action and switches to control circuit setup and configuration."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["Let's examine the components and connectors located on the Motor Control Panel."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["There are three motors mounted on the Motor Control Panel.."], "jumps": ["P1100", "P1050"]}, {"id": "P1100", "text": ["The Stepper Motor is a four phase, permanent magnet rotor type."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The Stepper Motor is capable of producing 40 oz-inches of torque at full phase current (1 amp max. 1 phase)."], "jumps": ["P1160", "P1090"]}, {"id": "P1120", "text": ["The AC motor is a 115 VAC, 50-60 Hz split-phase, capacitor-run motor."], "jumps": ["P1130", "P1180"]}, {"id": "P1130", "text": ["The AC motor is capable of producing approximately 1/50 HP at full line voltage."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The DC motor is a 24 VDC, compound wound motor."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The DC motor is capable of producing 20 oz-inches of usable torque at full rate voltage."], "jumps": ["P1200", "P1120"]}, {"id": "P1160", "text": ["The Stepper gear is a 24 pitch, 60 tooth gear."], "jumps": ["P1170", "P1090"]}, {"id": "P1170", "text": ["The stepper gear produces a 1 Hz frequency with a 1 RPM motor speed. This enables calculations to be performed easily."], "jumps": ["P1180", "P1090"]}, {"id": "P1180", "text": ["A magnetic pickup on the stepper gear is a standard sensor."], "jumps": ["P1190", "P1090", "P"]}, {"id": "P1190", "text": ["This sensor produces speed feedback to the 130 Test Console based interface cards."], "jumps": ["P1120", "P1180"]}, {"id": "P1200", "text": ["The dynamic brake consists of a fixed mount coil assembly aligned with a rotating magnetic pad coupled to the motor shaft."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["The dynamic brake allows loaded and unloaded motor data to be taken in various experiments."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The shaft couplers connect the motor shafts of the stepper, AC and DC motors."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["These couplers allow for slight inaccuracies in alignment without binding and loading the motors."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["The guard shield is a clear plastic protector that covers all rotating components."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["When operating the trainer, the guard shield should always be in place."], "jumps": ["P1260", "P1200"]}, {"id": "P1260", "text": ["There are five connectors on the motor control panel......."], "jumps": ["P1270", "P1200", "PLE"]}, {"id": "P1270", "text": ["The stepper motor connector is a 15 pin, D-sub connector."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The stepper connector connects the stepper motor to the PC130-286 interface connector. This is performed internally."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The AC motor connector is a 9 pin, D-sub connector."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["The AC motor connector connects the AC motor to test points and motor control switches located on the mimic bus panel."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["The DC motor connector is also a 9 pin, D-sub connector."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["The DC motor connector connects the DC motor to test points and motor control switches located on the mimic bus panel."], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["This connector also connects the DC motor to the PC130-280 connector internally."], "jumps": ["P1340", "P1260"]}, {"id": "P1340", "text": ["The PC130-286 connector connects the Stepper motor to the PC130-286 experiment card when used."], "jumps": ["P1350", "P1260"]}, {"id": "P1350", "text": ["The PC130-286 experiment card is mounted on the 130 Test Console and is used for Stepper motor control."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["The PC130-280 connector interfaces the Rotating Machinery Trainer with the 130 Test console.]"], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["This connector supplies data from the magnetic pickup and power directly to the DC motor."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["What are the two main panels of the Rotating Machinery Trainer?"], "jumps": ["P1360"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["The mimic panel is one of the main panels, but the DC motor interface is used to connect the DC motor to test points and control switches."], "jumps": []}, {"id": "P1383", "text": ["The motor control panel is one of the main panels but the test panel is part of another main panel."], "jumps": []}, {"id": "P1390", "text": ["How many motors are on the Rotating Machinery Trainer?....."], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["Remember, the motor trainer has a Stepper motor, DC motor and an AC motor."], "jumps": []}, {"id": "P1400", "text": ["Touch the Dynamic Brake. is typed.........................."], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["This is the stepper motor, remember the Dynamic Brake is used to take data from the DC motor during loaded and unloaded conditions."], "jumps": []}, {"id": "P1404", "text": ["This is the AC motor, remember the Dynamic Brake is used to take data from the DC motor during loaded and unloaded conditions."], "jumps": []}, {"id": "P1405", "text": ["This is the DC motor, remember the Dynamic Brake is used to take data from the DC motor during loaded and unloaded conditions."], "jumps": []}, {"id": "P1410", "text": ["Touch the magnetic pickup.s typed.........................."], "jumps": ["P1400"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["You selected the Dynamic Brake. Remember, this is a rear view of the trainer."], "jumps": []}, {"id": "P1414", "text": ["You selected the DC motor. Remember, the magnetic pickup is used with the Stepper motor."], "jumps": []}, {"id": "P1415", "text": ["You selected the AC motor. Remember, the magnetic pickup is used with the Stepper motor."], "jumps": []}, {"id": "P1416", "text": ["You selected the Stepper motor. The magnetic pickup is used with the Stepper motor but is not contained in the motor."], "jumps": []}, {"id": "P1420", "text": ["The next panel we will discuss is the Mimic Bus Panel......"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The Mimic Bus Panel contains all the test points, configuration switches and motor control switches."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["This bus panel consists of three primary sub-panels."], "jumps": ["P1450", "P1420"]}, {"id": "P1450", "text": ["The stepper motor sub-panel contains test points to monitor the stepper motor."], "jumps": ["P1460", "P1420"]}, {"id": "P1460", "text": ["The AC motor sub-panel contains test points and motor control switches for the AC motor."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The DC motor sub-panel contains test points and motor control switches for the DC motor."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["The Stepper motor sub-panel is used when the trainer is configured for the Stepper motor."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["The Stepper motor sub-panel contains six test points to monitor the individual stator winding voltages of the stepper motor."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["The AC motor sub-panel is used when the trainer is configured for the AC motor."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["This panel contains various test points for monitoring voltage and current in the Run and or Start windings of the AC motor."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["The AC motor RUN switch applies line voltage to the run winding of the AC motor."], "jumps": ["P1530", "P1500"]}, {"id": "P1530", "text": ["The AC motor Start switch applies line voltage to the start windings of the AC motor."], "jumps": ["P1540", "P1500"]}, {"id": "P1540", "text": ["The AC motor Run Phase switch reverses the phase of the line voltage applied to the run winding of the AC motor."], "jumps": ["P1550", "P1500"]}, {"id": "P1550", "text": ["By reversing the phase of the line voltage applied to the Run winding, the AC motor output shaft will reverse its direction of rotation."], "jumps": ["P1560", "P1500"]}, {"id": "P1560", "text": ["The AC motor Start phase switch reverses the phase of the applied line voltage to the start winding."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["By reversing the phase of the line voltage applied to the start winding, the AC motor output shaft also reverses its direction of rotation."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["If both phase switches are changed simultaneously, the direction of the output shaft rotation will not change."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["The AC motor Run meter switch breaks the current path to the run windings when placed to the IN position."], "jumps": ["P1600", "P1570"]}, {"id": "P1600", "text": ["This allows an ammeter to be connected for current measurements of the AC motor run windings."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["The AC motor START meter switch breaks the current path to the start windings when placed to the IN position."], "jumps": ["P1620", "P1590"]}, {"id": "P1620", "text": ["This allows an ammeter to be connected for current measurements of the AC motor start windings."], "jumps": ["P1630", "P1590"]}, {"id": "P1630", "text": ["The AC motor line meter switch breaks current to both the start and run windings for total current measurements."], "jumps": ["P1640", "P1590"]}, {"id": "P1640", "text": ["The DC motor sub-panel is used when the trainer is configured for the DC motor."], "jumps": ["P1650", "P1590"]}, {"id": "P1650", "text": ["This panel contains various switches, test points and potentiometers for DC motor measurements."], "jumps": ["P1660", "P1640"]}, {"id": "P1660", "text": ["The OPER/TEST switch selects between the + Power Supply voltage of the 130 or pins E and F on PC130-280 as the source."], "jumps": ["P1670", "P1640"]}, {"id": "P1670", "text": ["Pins E and F receive signal voltages from the output pins of the experiment cards on the 130 Trainer."], "jumps": ["P1680", "P1640"]}, {"id": "P1680", "text": ["The RUN/STOP switch selects between the source voltage and the brake load that is used to stop the motor."], "jumps": ["P1690", "P1640"]}, {"id": "P1690", "text": ["In the Run position, source voltage is applied to the motor."], "jumps": ["P1695", "P1640"]}, {"id": "P1695", "text": ["In the Stop position, the brake load is applied to the motor."], "jumps": ["P1700", "P1640"]}, {"id": "P1700", "text": ["When the ARM/VAR switch is in the ARM position, it selects the source voltage for the shunt field."], "jumps": ["P1705", "P1640"]}, {"id": "P1705", "text": ["Recall the OPER/TEST switch is used to select the type of voltage source."], "jumps": ["P1720", "P1640"]}, {"id": "P1720", "text": ["When placed in the Off position, the source is removed from the shunt field winding of the DC motor."], "jumps": ["P1730", "P1640"]}, {"id": "P1730", "text": ["When set in the IN position, the meter switch breaks the current path to series field winding. This allows the insertion of an ammeter.."], "jumps": ["P1740", "P1640"]}, {"id": "P1740", "text": ["The DC motor Shunt Field switch reverses the polarity of the shunt field winding."], "jumps": ["P1750", "P1640"]}, {"id": "P1750", "text": ["The Series Field switch allows the series field winding to be (IN) the current path."], "jumps": ["P1760", "P1640"]}, {"id": "P1760", "text": ["IN corresponds to the switch being open. OUT corresponds to the switch being closed."], "jumps": ["P1770", "P1740"]}, {"id": "P1770", "text": ["The Dynamic Brake switch applies the (-) Supply Voltage from the 130 trainer to the Dynamic Brake circuit."], "jumps": ["P1780", "P1640"]}, {"id": "P1780", "text": ["The DC Rotor switch changes the polarity of the DC rotor. This reverses the direction of shaft rotation."], "jumps": ["P1790", "P1640"]}, {"id": "P1790", "text": ["After power is removed from the motor, the Brake Load potentiometer varies the load resistance applied to the motor."], "jumps": ["P1800", "P1640"]}, {"id": "P1800", "text": ["The Field Current pot. varies current supplied by the (-) Supply of the 130 trainer to the shunt field winding.."], "jumps": ["P1810", "P1640"]}, {"id": "P1810", "text": ["The DC motor Dynamic Brake potentiometer varies the amount of Dynamic Brake applied to the motors."], "jumps": ["P1820", "P1640"]}, {"id": "P1820", "text": ["This allows various loads to be applied to the motors during operation."], "jumps": ["P1830", "P1640"]}, {"id": "P1830", "text": ["How many sub-panels are on the mimic bus panel?............"], "jumps": ["P1640"]}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1832", "text": ["Remember, there is one sub-panel for each motor............"], "jumps": []}, {"id": "P1840", "text": ["What are the test points on the stepper motor sub-panel used for?", "To measure the load resistance applied to the DC motor."], "jumps": ["P1830"]}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1842", "text": ["The test points on the AC sub-panel measure the Run and Start windings."], "jumps": []}, {"id": "P1843", "text": ["The load resistance is measured on the DC motor sub-panel.."], "jumps": []}, {"id": "P1850", "text": ["Touch the area which represents the AC motor sub-panel....."], "jumps": ["P1840"]}, {"id": "P1851", "text": [], "jumps": []}, {"id": "P1852", "text": ["You did not select the AC motor sub panel.................."], "jumps": []}, {"id": "P1860", "text": ["Touch the Dynamic Brake potentiometer......................"], "jumps": ["P1850"]}, {"id": "P1861", "text": [], "jumps": []}, {"id": "P1862", "text": ["You did not select the Dynamic Brake potentiometer........."], "jumps": []}, {"id": "P1870", "text": ["What are the Meter switches used for?......................"], "jumps": ["P1860"]}, {"id": "P1871", "text": [], "jumps": []}, {"id": "P1872", "text": ["The meter switches are located in series with the various circuits under test."], "jumps": []}, {"id": "P1880", "text": ["Don't worry if you do not remember everything about the 280 trainer. As you complete each lesson, the switches and controls will become more familiar to you."], "jumps": ["P1910", "P1870"]}, {"id": "P1910", "text": ["This completes the information on 280 CONTROLS, INDICATORS AND CONNECTORS."], "jumps": ["P1001", "P1880"]}, {"id": "P1920", "text": ["1. The trainer contains two main panels, the Motor Control Panel and the Mimic Bus Panel."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The motor control panel contains the Stepper, AC and DC motors."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The motor control panel contains the stepper gear, magnetic pickup and dynamic brake."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The motor control panel contains all motor connectors.."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5. The mimic bus panel contains the Stepper motor, AC motor and DC motor sub-panels."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The Stepper motor sub-panel contains the switches and test points for configuring and monitoring Stepper motor action."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. The AC motor sub-panel contains the switches and test points for configuring and monitoring AC motor action."], "jumps": ["P1990", "P1960"]}, {"id": "P1990", "text": ["8. The DC motor sub-panel contains the switches, potentiometers and test points for configuring, controlling and monitoring DC motor action."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1960"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["This experiment is designed to show the proper initial control settings for the Nida Model 280 Rotating Machinery Trainer."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The initial control settings must be performed prior to every experiment using the 280 Trainer."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["In future lessons, the first step of each experiment will be to set the 280 trainer to the initial control settings. Let's begin the experiment."], "jumps": ["P2020", "P2060"]}, {"id": "P2060", "text": ["1. Set the 280 trainer and the 130 test console side by side.t console side by side."], "jumps": ["P2040", "P2070", "P"]}, {"id": "P2070", "text": ["2. Set the AC motor RUN and START switches to OUT........."], "jumps": ["P2075", "P2060", "P"]}, {"id": "P2075", "text": ["3. Set the AC motor RUN and START PHASE switches to 1."], "jumps": ["P2080", "P2070"]}, {"id": "P2080", "text": ["4. Set all AC motor METER switches to OUT................."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["5. Set the DC motor OPER/TEST switch to the OPERATE position."], "jumps": ["P2100", "P2080", "P"]}, {"id": "P2100", "text": ["6. Set the DC motor RUN/STOP switch to STOP."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["7. Set the DC motor METER switch to OUT."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["8. Set the DC motor ARM/OFF/VAR switch to OFF."], "jumps": ["P2130", "P2090", "P", "PPORJ", "PRJJJJMSQu"]}, {"id": "P2130", "text": ["9. Set the DC motor SHUNT FIELD switch to the FWD position."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["10. Set the DC rotor switch to the FWD position."], "jumps": ["P2150", "P2090"]}, {"id": "P2150", "text": ["11. Remove the Dynamic brake by setting the Dynamic brake switch to the OUT position.", ") :;7;55(5F((5P5):(..45)555&%&&((44FF:(4(4.444..44(.45@.4444(:@4.45((: 2:@27:::: :@::22@(5:C8aZ[]][X?", "= 22::222: R; +!RR227722!7,,000==A!270727#", "-*? 0SAS###6#<-54;6A2C7+L76><<?>0A06,,,*", "+8((44F,0S=1;7===#<<2(;Q7) !)),6-M6==AR07+Q*,70=0A011LL7<"], "jumps": ["P2160", "P2090", "P", "PQAA", "P55L"]}, {"id": "P2160", "text": ["12. Set the DC motor series field switch to OUT."], "jumps": ["P2165", "P2090"]}, {"id": "P2165", "text": ["13. Set the potentiometers to fully CCW."], "jumps": ["P2170", "P2090"]}, {"id": "P2170", "text": ["At this time, the 280 trainer is set to it's initial control settings."], "jumps": ["P2180", "P2090"]}, {"id": "P2180", "text": ["This will be the starting point for all future experiments using the 280 trainer."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Which setting should the Dynamic Brake be set to for the initial control settings?"], "jumps": ["P2170"]}, {"id": "P2191", "text": [], "jumps": []}, {"id": "P2192", "text": ["The IN position allows the load resistance to be varied and measured. For the initial control settings the Dynamic Brake should be set to OUT.", "bbbi_`_ZbbbZ__heajja86iaedekjkkejmmdeaka\\\\eaa3\\\\de[WW[\\ejainjsEF x&JMBE"], "jumps": []}, {"id": "P2200", "text": ["Which position is the Series Field switch set to for the initial control settings?"], "jumps": ["P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["The series field winding should be in the current path, this means the switch must be in the OUT position."], "jumps": []}, {"id": "P2210", "text": ["Upon completion of the Initial Control Settings, each experiment will have detailed instructions on proper motor configuration."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Let's examine a few motor configurations and switch settings."], "jumps": ["P2222", " let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
