E.L (A0), D0 BNE 11012H DFB \"No Excep\" DFB \"tion Cal\" DFB \"led\",0 B \"Parallel\" DFB \"Port\",0 P # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P13151"]}, {"id": "P13151", "text": ["You probably recognize this code to be the same program used in Lesson 5.  The purpose of using a familiar program is that you have seen how it works.  You can make predictions of how the code is supposed to operate.", "You probably recognize this code to be the same program used in Lesson 5. The purpose of using a familiar program is that you have seen how it works. You can make predictions of how the code is supposed to operate."], "jumps": ["P13152", "P13150"]}, {"id": "P13152", "text": ["This will help in the understanding of each operation.  The first line of code is a trap instruction.  In Lesson 5, you learned that traps are used to call subroutines built into the system.", "This will help in the understanding of each operation. The first line of code is a trap instruction. In Lesson 5, you learned that traps are used to call subroutines built into the system.", "1. 11000 2. 11002 3. 11008 4. 1100A 5. 11010 6. 11012 7. 11018 8. 1101A 9. 1101E 10. 11026 11. 1102E", "4E 40 20 3C 00 00 01 01 4E 4C 20 7C 00 01 10 1E 4E 4A 22 7C 00 01 10 1E 20 11 60 00 FF F6 4E 6F 20 45 78 63 65 70 74 69 6F 6E 20 43 61 6C 6C 65 64 00 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 54 00C MS1: 50 4F 52 54 00 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVE.L #0101H,D0 TRAP #0CH MOVEA.L #1101EH,A0 TRAP #0AH MOVEA.L #00010000H,A0 MOVE.L (A0), D0 BNE 11012H DFB \"No Excep\" DFB \"tion Cal\" DFB \"led\",0 B \"Parallel\" DFB \"Port\",0 P # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P13160", "P13150"]}, {"id": "P13160", "text": ["The particular subroutine that we are calling clears the screen of the LCD display unit.  If you look through the previous experiments in which the #0H trap is used, you'll note its presence whenever the display module is used.", "The particular subroutine that we are calling clears the screen of the LCD display unit. If you look through the previous experiments in which the #0H trap is used, you'll note its presence whenever the display module is used."], "jumps": ["P13170", "P13150"]}, {"id": "P13170", "text": ["You would not write text to a screen that is filled with other information.  When the processor evaluates this instruction, it handles the trap instruction as an exception.", "You would not write text to a screen that is filled with other information. When the processor evaluates this instruction, it handles the trap instruction as an exception."], "jumps": ["P13180", "P13150"]}, {"id": "P13180", "text": ["It loads an address stored in a vector table and executes a program associated to that trap number.  An RTE inside the trap program will return you to the next instruction after the trap instruction of the program.", "It loads an address stored in a vector table and executes a program associated to that trap number. An RTE inside the trap program will return you to the next instruction after the trap instruction of the program."], "jumps": ["P13190", "P13150"]}, {"id": "P13190", "text": ["Remember that RTE is return from exception. It pulls the value of the status register and the value of the program counter and places them into the associated registers."], "jumps": ["P13200", "P13150"]}, {"id": "P13200", "text": ["The next instruction, line 2, is MOVE.L #0101H,D0.  In this instruction we move the immediate data of #0101H into data register D0.  The .L indicates that we want to move a longword into D0.", "The next instruction, line 2, is MOVE.L #0101H,D0. In this instruction we move the immediate data of #0101H into data register D0. The .L indicates that we want to move a longword into D0.", "1. 11000 2. 11002 3. 11008 4. 1100A 5. 11010 6. 11012 7. 11018 8. 1101A 9. 1101E 10. 11026 11. 1102E", "4E 40 20 3C 00 00 01 01 4E 4C 20 7C 00 01 10 1E 4E 4A 22 7C 00 01 10 1E 20 11 60 00 FF F6 4E 6F 20 45 78 63 65 70 74 69 6F 6E 20 43 61 6C 6C 65 64 00 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 54 00C MS1: 50 4F 52 54 00 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVE.L #0101H,D0 TRAP #0CH MOVEA.L #1101EH,A0 TRAP #0AH MOVEA.L #00010000H,A0 MOVE.L (A0), D0 BNE 11012H DFB \"No Excep\" DFB \"tion Cal\" DFB \"led\",0 B \"Parallel\" DFB \"Port\",0 P # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P13210", "P13150"]}, {"id": "P13210", "text": ["Since 0101H is word sized, the other word of the longword will be replaced with zeros.  If the .L had been a .W, the other word in the data register would have remained unchanged.", "Since 0101H is word sized, the other word of the longword will be replaced with zeros. If the .L had been a .W, the other word in the data register would have remained unchanged."], "jumps": ["P13220", "P13150"]}, {"id": "P13220", "text": ["The value 0101H is being loaded for the next instruction, which is another trap.  Trap routines may need parameters, like a size, a memory address, etc.", "The value 0101H is being loaded for the next instruction, which is another trap. Trap routines may need parameters, like a size, a memory address, etc."], "jumps": ["P13230", "P13150"]}, {"id": "P13230", "text": ["To pass these values to the trap you could put them on the stack or place them in a pre-defined register.  The traps used in this 68000 microprocessor trainer look for values placed in pre-defined registers.", "To pass these values to the trap you could put them on the stack or place them in a pre-defined register. The traps used in this 68000 microprocessor trainer look for values placed in pre-defined registers."], "jumps": ["P13240", "P13150"]}, {"id": "P13240", "text": ["The value passed is actually an X,Y position.  X is 01 and Y is 01. Instruction 3, TRAP #0CH is used to position the cursor on the screen based on the X and Y values stored in D0.", "The value passed is actually an X,Y position. X is 01 and Y is 01. Instruction 3, TRAP #0CH is used to position the cursor on the screen based on the X and Y values stored in D0.", "1. 11000 2. 11002 3. 11008 4. 1100A 5. 11010 6. 11012 7. 11018 8. 1101A 9. 1101E 10. 11026 11. 1102E", "4E 40 20 3C 00 00 01 01 4E 4C 20 7C 00 01 10 1E 4E 4A 22 7C 00 01 10 1E 20 11 60 00 FF F6 4E 6F 20 45 78 63 65 70 74 69 6F 6E 20 43 61 6C 6C 65 64 00 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 54 00C MS1: 50 4F 52 54 00 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVE.L #0101H,D0 TRAP #0CH MOVEA.L #1101EH,A0 TRAP #0AH MOVEA.L #00010000H,A0 MOVE.L (A0), D0 BNE 11012H DFB \"No Excep\" DFB \"tion Cal\" DFB \"led\",0 B \"Parallel\" DFB \"Port\",0 P # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P13250", "P13150"]}, {"id": "P13250", "text": ["The trap routine takes the values in D0 and places the cursor at that location.  The number sign in front of the value, like the two previous instructions, indicates immediate values.", "The trap routine takes the values in D0 and places the cursor at that location. The number sign in front of the value, like the two previous instructions, indicates immediate values."], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["In other terms, the value used in the operation is that of the one following the number sign.  If the number sign wasn't there, the data at the address location of that value would be used.", "In other terms, the value used in the operation is that of the one following the number sign. If the number sign wasn't there, the data at the address location of that value would be used."], "jumps": ["P13270", "P13240"]}, {"id": "P13270", "text": ["This is known as Indirect addressing.  Addressing modes will be covered in more detail in later lessons.  The 0 before the C is a restriction of the compiler.  If we just had a CH the compiler would think that this is a label.", "This is known as Indirect addressing. Addressing modes will be covered in more detail in later lessons. The 0 before the C is a restriction of the compiler. If we just had a CH the compiler would think that this is a label."], "jumps": ["P13280", "P13240"]}, {"id": "P13280", "text": ["We want it to represent a hexadecimal number.  The zero tells the compiler that this is a value not a label.  The H just after the number indicates the hexadecimal numbering system.", "We want it to represent a hexadecimal number. The zero tells the compiler that this is a value not a label. The H just after the number indicates the hexadecimal numbering system."], "jumps": ["P13290", "P13240"]}, {"id": "P13290", "text": ["The compiler assumes decimal if no letter is there.  A label is used to represent a location.  In assembly language, labels make branching much easier.", "The compiler assumes decimal if no letter is there. A label is used to represent a location. In assembly language, labels make branching much easier."], "jumps": ["P13300", "P13240"]}, {"id": "P13300", "text": ["The 4th instruction, MOVEA.L #1101EH, A0 loads the address value into A0 where text is stored to be displayed on the screen. Notice the A in the move command.", "1. 11000 2. 11002 3. 11008 4. 1100A 5. 11010 6. 11012 7. 11018 8. 1101A 9. 1101E 10. 11026 11. 1102E", "4E 40 20 3C 00 00 01 01 4E 4C 20 7C 00 01 10 1E 4E 4A 22 7C 00 01 10 1E 20 11 60 00 FF F6 4E 6F 20 45 78 63 65 70 74 69 6F 6E 20 43 61 6C 6C 65 64 00 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 54 00C MS1: 50 4F 52 54 00 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVE.L #0101H,D0 TRAP #0CH MOVEA.L #1101EH,A0 TRAP #0AH MOVEA.L #00010000H,A0 MOVE.L (A0), D0 BNE 11012H DFB \"No Excep\" DFB \"tion Cal\" DFB \"led\",0 B \"Parallel\" DFB \"Port\",0 P # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P13310", "P13240"]}, {"id": "P13310", "text": ["This is a special move command for loading address registers with information.  This value will be used by the trap command on line 5.  The text for the command on line 9 (No Exception Called, 0) has been divided and placed on lines 10 and 11, also.", "This is a special move command for loading address registers with information. This value will be used by the trap command on line 5. The text for the command on line 9 (No Exception Called, 0) has been divided and placed on lines 10 and 11, also."], "jumps": ["P13320", "P13240"]}, {"id": "P13320", "text": ["This is so that the machine code can fit on one page.  Notice that the last of the text ends with a zero.  The trap command uses this zero to indicate the end of text.", "This is so that the machine code can fit on one page. Notice that the last of the text ends with a zero. The trap command uses this zero to indicate the end of text."], "jumps": ["P13330", "P13240"]}, {"id": "P13330", "text": ["The next instruction, line 5, is the TRAP #0AH.  This trap uses the address value in A0 and displays text at that location until a byte sized value of zero is found.", "The next instruction, line 5, is the TRAP #0AH. This trap uses the address value in A0 and displays text at that location until a byte sized value of zero is found.", "1. 11000 2. 11002 3. 11008 4. 1100A 5. 11010 6. 11012 7. 11018 8. 1101A 9. 1101E 10. 11026 11. 1102E", "4E 40 20 3C 00 00 01 01 4E 4C 20 7C 00 01 10 1E 4E 4A 22 7C 00 01 10 1E 20 11 60 00 FF F6 4E 6F 20 45 78 63 65 70 74 69 6F 6E 20 43 61 6C 6C 65 64 00 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 54 00C MS1: 50 4F 52 54 00 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVE.L #0101H,D0 TRAP #0CH MOVEA.L #1101EH,A0 TRAP #0AH MOVEA.L #00010000H,A0 MOVE.L (A0), D0 BNE 11012H DFB \"No Excep\" DFB \"tion Cal\" DFB \"led\",0 B \"Parallel\" DFB \"Port\",0 P # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P13340", "P13240"]}, {"id": "P13340", "text": ["If the zero wasn't there, whatever was next in memory would fill the screen until a zero was found in memory.  Line 6 contains another move address command.  This loads the value #00010000H i let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
