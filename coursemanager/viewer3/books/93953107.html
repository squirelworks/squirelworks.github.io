const book = {"title": "93953107", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: DIODE CLAMPER OPERATION asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of diode clampers. w Identify the two different types of diode clamper circuits. w Describe diode clamper operation.......", "w Measure input and output waveforms of diode clamper circuits. w Recognize normal operation of diode clamper circuits......"], "jumps": ["P300", "P10"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "4. Nida Model 440 Function Generator quivalent", "5. Nida Model 470 Oscilloscope or Equivalent"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about diode clampers.  This is a circuit application for the diode.", "In this lesson you will learn about diode clampers. This is a circuit application for the diode."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Clampers are so named because they change the voltage level of an AC signal by adding a DC voltage."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["They are useful, simple circuits, consisting of a diode, resistor and a capacitor."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Clampers are used in televisions to add a DC voltage to the video signal for operation of the picture tube."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Clampers are used in any circuit where an AC signal must ride on a DC level."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on DIODE CLAMPER OPERATION........................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The purpose of a diode clamper is to clamp an AC input signal at a DC output level."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["The AC signal can be changed so either the positive or negative peak is at 0 V."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The peaks can also be placed above or below 0V."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["A clamper's effect on an input signal depends on how circuit components are connected."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The operation of each circuit is based on the action of a junction diode."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["A forward biased diode conducts, acting almost like a short circuit."], "jumps": ["P1080", "P1050", "P1075"]}, {"id": "P1072", "text": ["A forward biased diode conducts, acting almost like a short circuit."], "jumps": ["P1080", "P1050", "P1075"]}, {"id": "P1075", "text": ["FORWARD BIASED DIODE - Forward biased diodes have a very small voltage drop due to the barrier junction. A germanium diode drops approximately .3 V; a silicon diode drops approximately .7 V."], "jumps": []}, {"id": "P1080", "text": ["A reverse biased diode is cutoff, acting like an open circuit."], "jumps": ["P1090", "P1072"]}, {"id": "P1090", "text": ["By placing the diode in different configurations, different output signals are produced."], "jumps": ["P1100", "P1072"]}, {"id": "P1100", "text": ["The two basic configurations of diode clampers are:", "The two basic configurations of diode clampers are:........"], "jumps": ["P1110", "P1072"]}, {"id": "P1110", "text": ["Let's start with positive clampers."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["A positive clamper has the diode pointing up or towards the output signal.  Positive clampers add a positive DC voltage.", "A positive clamper has the diode pointing up or towards the output signal. Positive clampers add a positive DC voltage."], "jumps": ["P1160", "P1100"]}, {"id": "P1130", "text": ["When the diode is forward biased, the path for AC current is through the low resistance of the diode to ground."], "jumps": ["P1170", "P1120"]}, {"id": "P1140", "text": ["When the diode is reversed biased, the path for AC current is through the high resistance of the resistor."], "jumps": ["P1210", "P1120"]}, {"id": "P1155", "text": ["Foward biased diode - Low Resistence allows current flow through the diode. Result is a fast time constant. Reverse biased diode - High Resistence allows current flow through the resistor. Result is a slow time constant.", "CHARGING AND DISCHARGING OF A CAPACITOR - The charging and discharging of a capacitor depends on the RC time constant: TC = C x R."], "jumps": ["P1157"]}, {"id": "P1157", "text": ["The value of the capacitor does not change in a clamper circuit.  The diode affects circuit resistance which determines the time constant.", "The value of the capacitor does not change in a clamper circuit. The diode affects circuit resistance which determines the time constant."], "jumps": ["P1155"]}, {"id": "P1160", "text": ["An input signal's negative alternation forward biases the diode."], "jumps": ["P1130", "P1120"]}, {"id": "P1170", "text": ["The capacitor quickly charges to the peak value with the positive polarity on the output."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["Adding the +Vp on the capacitor to the -Vp of the input signal produces a half cycle output with 0 V at the negative peak."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["The positive charge on the capacitor raised the voltage level of the output signal."], "jumps": ["P1200", "P1120"]}, {"id": "P1200", "text": ["An input signal's positive alternation reverse biases the diode."], "jumps": ["P1140", "P1120"]}, {"id": "P1210", "text": ["The capacitor does not have time to discharge through the resistor.  The positive voltage on the capacitor remains.", "The capacitor does not have time to discharge through the resistor. The positive voltage on the capacitor remains."], "jumps": ["P1220", "P1120"]}, {"id": "P1220", "text": ["Adding the +Vp on the capacitor to the +Vp of the input signal produces twice the output."], "jumps": ["P1230", "P1120"]}, {"id": "P1230", "text": ["The positive charge on the capacitor raised the voltage level of the output signal."], "jumps": ["P1240", "P1120"]}, {"id": "P1240", "text": ["The peak to peak value of the output signal does not change, only the DC level."], "jumps": ["P1250", "P1120"]}, {"id": "P1250", "text": ["Remember, the diode action allows the capacitor to charge quickly through low resistance and discharge slowly through high resistance.  The capacitor charges but does not discharge.", "Remember, the diode action allows the capacitor to charge quickly through low resistance and discharge slowly through high resistance. The capacitor charges but does not discharge."], "jumps": ["P1260", "P1120", "P1155"]}, {"id": "P1252", "text": ["Remember, the diode action allows the capacitor to charge quickly through low resistance and discharge slowly through high resistance.  The capacitor charges but does not discharge.", "Remember, the diode action allows the capacitor to charge quickly through low resistance and discharge slowly through high resistance. The capacitor charges but does not discharge."], "jumps": ["P1260", "P1120", "P1155"]}, {"id": "P1260", "text": ["Remember, the positive voltage on the capacitor is added to the input signal."], "jumps": ["P1270", "P1252"]}, {"id": "P1270", "text": ["The negative clamper operates the same except a negative DC voltage is added."], "jumps": ["P1280", "P1252"]}, {"id": "P1280", "text": ["A negative clamper has the diode pointing down or towards ground.  A negative clamper adds a negative voltage to the output.", "A negative clamper has the diode pointing down or towards ground. A negative clamper adds a negative voltage to the output."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["During the positive alternation the diode is forward biased.  The capacitor quickly charges to the peak value with the negative polarity on the output.", "During the positive alternation the diode is forward biased. The capacitor quickly charges to the peak value with the negative polarity on the output."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Adding the -Vp on the capacitor to the +Vp of the input signal produces a half cycle output with 0V at the positive peak."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["During the negative alternation, the diode is reverse biased.  The capacitor does not have time to discharge through the resistor.", "During the negative alternation, the diode is reverse biased. The capacitor does not have time to discharge through the resistor."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["Adding the -Vp on the capacitor to the -Vp of the input signal produces twice the output."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["The peak to peak value of the output signal does not change, only the DC level."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["Remember, the capacitor is allowed to charge but not discharge and the negative voltage on the capacitor is added to the input signal."], "jumps": ["P1360", "P1280"]}, {"id": "P1360", "text": ["Select the output signal for this diode clamper.", "Select the output signal for this diode clamper............"], "jumps": ["P1280"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["You selected the output signal for a negative clamper.  Look at how the diode is placed in the circuit to determine the type of clamper.", "You selected the output signal for a negative clamper. Look at how the diode is placed in the circuit to determine the type of clamper."], "jumps": []}, {"id": "P1363", "text": ["Clampers do not increase the peak to peak value of the input signal."], "jumps": []}, {"id": "P1370", "text": ["Select the output signal for this diode clamper.", "Select the output signal for this diode clamper............"], "jumps": ["P1360"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["You selected the output signal for a positive clamper.  Look at how the diode is placed in the circuit to determine the type of clamper.", "You selected the output signal for a positive clamper. Look at how the diode is placed in the circuit to determine the type of clamper."], "jumps": []}, {"id": "P1373", "text": ["An unbiased clamper clamps either the negative peak at 0 volts (positive clamper) or the positive peak at 0 volts (negative clamper)."], "jumps": []}, {"id": "P1380", "text": ["By adding circuit bias, the voltage level of the peaks are changed from 0 V."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["A positive bias on a positive clamper raises the output voltage DC level."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["The peak to peak input and output voltage is still 10V, but the negative peak was raised to the level of the bias voltage."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["A negative bias on a positive clamper lowers the output voltage DC level."], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["The peak to peak input and output voltage is still 10V, but the negative peak was lowered to the level of the bias voltage."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["A negative bias on a positive clamper lowers the output voltage DC level.", "A positive bias on a negative clamper raises the output voltage DC level."], "jumps": ["P1440", "P1390"]}, {"id": "P1440", "text": ["The peak to peak input and output voltage is still 10V, but the positive peak was raised to the level of the bias voltage."], "jumps": ["P1450", "P1410"]}, {"id": "P1450", "text": ["A negative bias on a negative clamper lowers the output voltage DC level."], "jumps": ["P1460", "P1410"]}, {"id": "P1460", "text": ["The peak to peak input and output voltage is still 10V, but the positive peak was lowered to the level of the bias voltage."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["Remember, a biased clamper works just like an unbiased clamper."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["The bias either raises (positive bias) or lowers (negative bias) the DC level."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Select the output signal for this clamper.", "Select the output signal for this clamper.................."], "jumps": ["P1470"]}, {"id": "P1491", "text": [], "jumps": []}, {"id": "P1492", "text": ["You selected an output signal that is negative clamped with a\n-2 V bias.  Look at the circuit.  The diode points up meaning the circuit is clamped positive.", "You selected an output signal that is negative clamped with a -2 V bias. Look at the circuit. The diode points up meaning the circuit is clamped positive.."], "jumps": []}, {"id": "P1493", "text": ["You selected a positive clamped output signal but, notice that the negative peak is at -2 V.  The circuit uses positive bias.", "You selected a positive clamped output signal but, notice that the negative peak is at -2 V. The circuit uses positive bias."], "jumps": []}, {"id": "P1500", "text": ["Select the output signal for this clamper.", "Select the output signal for this clamper.................."], "jumps": ["P1490"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["You selected an output signal that is negative clamped with a\n-2 V bias.  Look at the circuit.  The diode points up meaning the circuit is clamped positive.", "You selected an output signal that is negative clamped with a -2 V bias. Look at the circuit. The diode points up meaning the circuit is clamped positive.."], "jumps": []}, {"id": "P1503", "text": ["You selected a positive clamped output signal, but notice that the negative peak is at +2V.  The circuit uses negative bias.", "You selected a positive clamped output signal, but notice that the negative peak is at +2V. The circuit uses negative bias."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on DIODE CLAMPERS.", "This completes the information on DIODE CLAMPERS.LE........"], "jumps": ["P1001", "P1500"]}, {"id": "P1920", "text": ["1.  Diode clampers are used to add a DC voltage level to an AC           input signal.", "1. Diode clampers are used to add a DC voltage level to an AC input signal."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The operation is based on diode action.", "2. The operation is based on diode action.................", "A Reverse biased diode acts as an open.open....", "A forward biased diode conducts with low resistance. ."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The diode allows fast charging and slow discharging of the\n     capacitor.  The capacitor maintains a constant DC level.", "3. The diode allows fast charging and slow discharging of the capacitor. The capacitor maintains a constant DC level."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.   A positive clamper adds a positive DC voltage.", "4. A positive clamper adds a positive DC voltage........."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.   A negative clamper adds a negative DC voltage.", "5. A negative clamper adds a negative DC voltage........."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.   Biased clampers change the output signal but operate the              same.", "6. Biased clampers change the output signal but operate the same."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": ["Pick up the PC130-77B card.", ". The experiment in this lesson is not setup to use the selected trainer.", "Pick up the PC130-77B card......................................"], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["This card will demonstrate the operation of diode clampers."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["Compare the components on PC130-77B to the schematic shown.", "Compare the components on PC130-77B to the schematic shown..."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Note that S1 selects between two inputs."], "jumps": ["P2045", "P2020"]}, {"id": "P2045", "text": ["Input A is from the Test Console and Input B is from a function generator."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["There are four diode clamper circuits.  Clampers A and B are unbiased.", "There are four diode clamper circuits. Clampers A and B are unbiased."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Clampers C and D are biased."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["Biasing is from R5 and R6.  Let's start the experiment.", "Biasing is from R5 and R6. Let's start the experiment."], "jumps": ["P2080", "P2020"]}, {"id": "P2080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2020"]}, {"id": "P2090", "text": ["2.  Carefully plug PC130-77B into the Test Console PC1 position.", "2. Carefully plug PC130-77B into the Test Console PC1 position."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["3.  Place S1 on PC130-77B to the B position.                 \n4.  Rotate R5 on PC130-77B fully CCW.                                        \n5.  Rotate R6 on PC130-77B fully CCW.", "3. Place S1 on PC130-77B to the B position. 4. Rotate R5 on PC130-77B fully CCW. 5. Rotate R6 on PC130-77B fully CCW."], "jumps": ["P2090", "P2105"]}, {"id": "P2105", "text": ["MEASUREMENT SETUP - S1 set at B R5 and R6 turned CCW"], "jumps": []}, {"id": "P2110", "text": ["6.  Set Voltmeter switch to Positive.  Set the Positive Supply                Voltage to 5 volts.  \n7.  Set Voltmeter switch to Negative.  Set the Negative Supply             Voltage to 5 volts.", "6. Set Voltmeter switch to Positive. Set the Positive Supply Voltage to 5 volts. 7. Set Voltmeter switch to Negative. Set the Negative Supply Voltage to 5 volts....."], "jumps": ["P2100"]}, {"id": "P2120", "text": ["8.  Connect the function generator to the Test Console Input               Signal BNC.", "8. Connect the function generator to the Test Console Input Signal BNC.."], "jumps": ["P2130", "P2110", "P2125"]}, {"id": "P2125", "text": ["BNC CONNECTION - Connect the Function Generator's Main Output BNC to the Test Console's Input BNC."], "jumps": []}, {"id": "P2130", "text": ["9.  Adjust the function generator's frequency for a 1 kHz sine               wave output.  \n10.  Adjust the function generator's amplitude for a 4 Vpp output          measured with an oscilloscope at PC130-77B TP2.", "9. Adjust the function generator's frequency for a 1 kHz sine wave output. 10. Adjust the function generator's amplitude for a 4 Vpp output measured with an oscilloscope at PC130-77B TP2.."], "   if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
</body>
