const book = {"title": "93953108", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: LIMITER AND CLAMPER TROUBLESHOOTING EXPERIMENTdf"], "jumps": []}, {"id": "P10", "text": ["LIMITER AND CLAMPER TROUBLESHOOTING EXPERIMENT"], "jumps": []}, {"id": "P100", "text": ["w Recognize that a diode clamper circuit is faulted. w Observe the effects of a defective diode in a clamper circuit......", "w Describe typical faults in diode limiter and clamper circuits. w Describe diode limiter and clamper troubleshooting procedures.", "w Recognize that a parallel diode limiter circuit is faulted. w Observe the effects of a defective diode in a parallel limiter circuit......"], "jumps": ["P10"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P301", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P302", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will learn about troubleshooting diode limiter and clamper circuits, and you will troubleshoot a faulted limiter and clamper circuit."], "jumps": ["P410"]}, {"id": "P410", "text": ["Limiters and clampers alter AC input signals."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring the input and output signal with an oscilloscope will determine if the circuit is operating normally."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["An incorrect waveform indicates that the circuit is faulted.", "An incorrect waveform indicates that the circuit is faulted.."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on LIMITER AND CLAMPER TROUBLESHOOTING EXPERIMENT...."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The most common fault in diode limiters and clampers is an open or shorted diode."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["However, the resistor in the limiter circuit and the resistor and capacitor in the clamper circuit cannot be ignored."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["For the circuit to operate, all components must be functioning correctly."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["Let's look at the faults in a diode limiter circuit first.\nLimiter Circuit\nClamper Circuit", "Let's look at the faults in a diode limiter circuit first. Limiter Circuit Clamper Circuit Limiter Circuit Clamper Circuit"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["In a series diode limiter, the diode is in series with the output signal."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["If the diode opens internally, there is no output signal."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["Current can not flow through the open series diode even if forward biased."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["If the diode shorts internally, no limiting occurs."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["Current bypasses the diode.  The diode is not effective in the circuit.", "Current bypasses the diode. The diode is not effective in the circuit."], "jumps": ["P1110", "P1060"]}, {"id": "P1110", "text": ["In a parallel diode limiter, the opposite happens.  The diode is parallel to the output signal.", "In a parallel diode limiter, the opposite happens. The diode is parallel to the output signal."], "jumps": ["P1120", "P1060"]}, {"id": "P1120", "text": ["If the diode opens, no limiting occurs."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Current cannot flow through the diode to ground even if it is forward biased."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["If the diode shorts, there is no output signal."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The entire input signal is dropped across the resistor.  The signal is grounded.", "The entire input signal is dropped across the resistor. The signal is grounded."], "jumps": ["P1160", "P1110"]}, {"id": "P1160", "text": ["Opens and shorts in the resistor also affect the outputs of series or parallel limiters."], "jumps": ["P1170", "P1110"]}, {"id": "P1170", "text": ["In a series limiter, a shorted resistor grounds the output signal."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["In a parallel limiter, an open resistor blocks current and there is no output."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Reversing the faults, that is opening the resistor in a series limiter and shorting the resistor in a parallel limiter, have little effect on the output."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["An open resistor in a series limiter still produces an output if a load is attached.  If there is no load, no signal is developed.", "An open resistor in a series limiter still produces an output if a load is attached. If there is no load, no signal is developed."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Note, placing an oscilloscope on the output supplies a load and the correct output is observed."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["A shorted resistor in a parallel limiter also produces an output."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["Note, the input signal is also limited.  The input and output are the same point in the circuit.", "Note, the input signal is also limited. The input and output are the same point in the circuit."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["Adding positive or negative bias does not change the effect of the common faults in limiter circuits."], "jumps": ["P1550", "P1190"]}, {"id": "P1250", "text": ["What type of faults produce no output (0 V) in a series limiter circuit?"], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["An open resistor still produces an output if loaded.  A shorted diode does not limit the input signal and the output will be the same as the input.", "An open resistor still produces an output if loaded. A shorted diode does not limit the input signal and the output will be the same as the input."], "jumps": []}, {"id": "P1253", "text": ["A shorted resistor grounds the output (0 V).  However, a shorted diode does not limit; the output is the same as the input.", "A shorted resistor grounds the output (0 V). However, a shorted diode does not limit; the output is the same as the input."], "jumps": []}, {"id": "P1260", "text": ["What type of faults produce no output (0 V) in a parallel limiter circuit?"], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["An open diode does not limit; the output is the same as the input.  A shorted resistor only affects the input signal; both input and output would be limited.", "An open diode does not limit; the output is the same as the input. A shorted resistor only affects the input signal; both input and output would be limited."], "jumps": []}, {"id": "P1263", "text": ["A shorted resistor only affects the input signal; both the input and output are limited.  A shorted diode would cause no output (0 V).", "A shorted resistor only affects the input signal; both the input and output are limited. A shorted diode would cause no output (0 V)."], "jumps": []}, {"id": "P1270", "text": ["Now, let's look at faults in diode clamper circuits.                               Limiter Circuit                                                                                                 Clamper Circuit", "Now, let's look at faults in diode clamper circuits. Limiter Circuit Clamper Circuit"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["In a positive or negative clamper, the diode is in parallel with the output."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["If the diode opens internally, there is no clamping."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The circuit reduces to an RC voltage divider."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["If the diode shorts internally, there is no output."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["The output signal is grounded."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["Opens and shorts in the resistor and capacitor will also affect the outputs of positive or negative clampers."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["An open capacitor causes no output signal."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["The open prevents current flow to the output."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["A shorted capacitor eliminates clamping."], "jumps": ["P1370", "P1330"]}, {"id": "P1370", "text": ["The circuit reduces to a parallel limiter.  The clamping action of the capacitor is gone and no longer provides isolation between the circuits, thus affecting the input signal as well as the ouput signal.", "The circuit reduces to a parallel limiter. The clamping action of the capacitor is gone and no longer provides isolation between the circuits, thus affecting the input signal as well as the ouput signal..."], "jumps": ["P1400", "P1330"]}, {"id": "P1400", "text": ["A shorted resistor causes no output signal."], "jumps": ["P1410", "P1330"]}, {"id": "P1410", "text": ["It's just like a shorted diode:  the output signal is shorted to ground.", "It's just like a shorted diode: the output signal is shorted to ground."], "jumps": ["P1420", "P1330"]}, {"id": "P1420", "text": ["Adding positive or negative bias does not change the effect of the common faults in clamper circuits."], "jumps": ["P1570", "P1330"]}, {"id": "P1430", "text": ["What type of faults produce no signal output in a clamper circuit?", "What type of faults produce no signal output in a clamper circuit???????"], "jumps": ["P1420"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["A shorted capacitor changes the circuit to a limiter.  An open diode changes the circuit to an RC voltage divider.", "A shorted capacitor changes the circuit to a limiter. An open diode changes the circuit to an RC voltage divider..RC voltage divider."], "jumps": []}, {"id": "P1433", "text": ["A shorted resistor or an open capacitor cause no output signal.  However, an open diode changes the circuit to an RC voltage divider.", "A shorted resistor or an open capacitor cause no output signal. However, an open diode changes the circuit to an RC voltage divider."], "jumps": []}, {"id": "P1440", "text": ["What type of faults produce a limited output signal in a clamper circuit?"], "jumps": ["P1430"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": ["An open capacitor or a shorted resistor changes the output to\n0 V.", "An open capacitor or a shorted resistor changes the output to 0 V.."], "jumps": []}, {"id": "P1443", "text": ["An open diode changes the circuit to an RC voltage divider to show input and output."], "jumps": []}, {"id": "P1450", "text": ["As you have seen, opens and shorts cause changes in the output waveform in limiters and clampers."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Therefore, waveform measurements using an oscilloscope will quickly determine if a limiter or clamper circuit is operating normally.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["If the waveform measurements are incorrect, resistance measurements are used to determine the fault."], "jumps": ["P1480", "P1450"]}, {"id": "P1480", "text": ["Any open is identified by an infinity reading on the multimeter."], "jumps": ["P1490", "P1450"]}, {"id": "P1490", "text": ["Any short is identified by a 0 W reading on the multimeter."], "jumps": ["P1500", "P1450"]}, {"id": "P1500", "text": ["Note, an open capacitor and a good capacitor will measure infinity."], "jumps": ["P1510", "P1450"]}, {"id": "P1510", "text": ["Measuring no short across the resistor or the diode proves that the capacitor is open."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Remember, waveform measurements will quickly determine if a limiter or clamper circuit is operating normally.  Resistance measurements are used to determine the fault.", "Remember, waveform measurements will quickly determine if a limiter or clamper circuit is operating normally. Resistance measurements are used to determine the fault."], "jumps": ["P1910", "P1500"]}, {"id": "P1550", "text": ["However, the DC bias level is felt on the output."], "jumps": ["P1240"]}, {"id": "P1560", "text": ["For example, the open diode in the biased limiter causes a DC level on the output."], "jumps": ["P1250", "P1240"]}, {"id": "P1570", "text": ["However, the DC bias level may be felt on the output."], "jumps": ["P1580", "P1420"]}, {"id": "P1580", "text": ["For example, the shorted diode in the biased clamper causes a DC level on the output."], "jumps": ["P1430", "P1420"]}, {"id": "P1910", "text": ["This completes the information on LIMITER AND CLAMPER FAULTS."], "jumps": ["P1001", "P1500"]}, {"id": "P1920", "text": ["1.  Faults in diode limiter and clamper circuit change the output           waveforms.", "1. Faults in diode limiter and clamper circuit change the output waveforms."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  An open diode in a series limiter causes no output.", "2. An open diode in a series limiter causes no output....."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  A shorted diode in a series limiter causes no limiting action.", "3. A shorted diode in a series limiter causes no limiting action."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  An open diode in a parallel limiter causes no limiting action.", "4. An open diode in a parallel limiter causes no limiting action."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  A shorted diode in a parallel limiter causes no output.", "5. A shorted diode in a parallel limiter causes no output."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  An open diode in a clamper circuit causes no clamping action.", "6. An open diode in a clamper circuit causes no clamping action.........."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  A shorted diode in a clamper circuit causes no output.", "7. A shorted diode in a clamper circuit causes no output.."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Waveform measurements quickly determine if the circuit is              operating normally. Resistance measurements determine the        fault.", "8. Waveform measurements quickly determine if the circuit is operating normally. Resistance measurements determine the fault.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'"], "jumps": ["P1999", "P1980"]}, {"id": let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
