const book = {"title": "93952802", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: RELAY OPERATION EXPERIMENTd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Trace signal flow through a relay circuit. w Measure voltages in a relay circuit."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "4. Nida Model 480, 488 Multimeter or Equivalent"], "jumps": []}, {"id": "P330", "text": ["In this experiment, you will trace signals through a three-relay circuit."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Relays K1 and K2 are two-pole control relays and K3 is a 4 pole control relay.", "Relays K1 and K2 are two-pole control relays and K3 is a 4 pole control relay.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["At first glance, signal tracing appears complex."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["The key is to remember that in a schematic, the relays are shown de-energized."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["You must start signal tracing at the beginning of the circuit, not the middle or end."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on RELAY OPERATION EXPERIMENT......................"], "jumps": ["P400"]}, {"id": "P900", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to operate relays. Three relays are used to control the signal flow through a circuit to illuminate different lamps."], "jumps": ["P1040"]}, {"id": "P1040", "text": ["Pick up the PC130-84B card. This card is used to demonstrate relay operation.", "Compare the card with the schematic shown."], "jumps": ["P1050", "P1020", "P1060"]}, {"id": "P1060", "text": ["K1, K2, and K3 are the relays. The dotted lines indicate a mechanical connection between the relay armatures."], "jumps": ["P1090", "P1050"]}, {"id": "P1090", "text": ["Switches S1 through S3 control the relays.  S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.", "Switches S1 through S3 control the relays.  S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.", "Switches S1 through S3 control the relays. S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.", "Switches S1 through S3 control the relays. S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.."], "jumps": ["P1097", "P1050", "P1095"]}, {"id": "P1095", "text": ["SWITCHES S1 THROUGH S3 - Your experiment card may have three push button switches. If it does, the card operates the same."], "jumps": []}, {"id": "P1097", "text": ["When a switch is ON, voltage is applied to energize the relay."], "jumps": ["P1100", "P1092"]}, {"id": "P1100", "text": ["Also notice the symbols for components D1 through D11 and L1 through L8.", "Also notice the symbols for components D1 through D11 and L1 through L8.LED 8."], "jumps": ["P1110", "P1092"]}, {"id": "P1110", "text": ["D1 through D11 are diodes."], "jumps": ["P1120", "P1092"]}, {"id": "P1120", "text": ["They basically allow current flow in one direction.", "They basically allow current to travel in one direction.", "They basically allow current flow in one direction.tion.basically allow current flow in one direction."], "jumps": ["P1130", "P1092"]}, {"id": "P1130", "text": ["Diodes D1, D2, and D3 prevent current flow through the magnetic core when the relay is de-energized. This is called inductive kick back.", "The diode must be forward biased to allow current flow. If reversed biased, no current flows.", "The diode must be forward biased to allow current . If reversed biased, there is no current........", "Diodes D1, D2, and D3 prevent current from passing through the magnetic core when the relay is de-energized. This is called inductive kick back.", "Diodes D1, D2, and D3 prevent current flow through the magnetic core when the relay is de-energized. This is called inductive kick back.ck back."], "jumps": ["P1140", "P1092", "P1150", "P1130", "P1145", "P"]}, {"id": "P1145", "text": ["DIODES D1, D2, AND D3 - The magnetic core is a coil and will act as an inductor. When the power is removed from the coil, a counter EMF is developed which causes a current flow.", "DIODES D1, D2, AND D3 - The magnetic core is a coil and will act as an inductor. When the power is removed from the coil, a counter EMF is developed which causes a current."], "jumps": ["P1146"]}, {"id": "P1146", "text": ["The reverse current flow is prevented from flowing back through the coil by the action of the diode............................"], "jumps": ["P1145", "P1147"]}, {"id": "P1147", "text": ["If current were allowed to flow, the relay would energize again, this is called chatter.f the diode............................"], "jumps": ["P1145", "P1140"]}, {"id": "P1150", "text": ["LED 1 through LED 8 are Light Emitting Diodes (LEDs).  They emit light when current flows through them.", "LED 1 through LED 8 are Light Emitting Diodes (LEDs). They emit light when current passes through them.", "LED 1 through LED 8 are Light Emitting Diodes (LEDs). They emit light when current flows through them.", "LED 1 through LED 8 are Light Emitting Diodes (LEDs). They emit light when current flows through them.."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The LED must be forward biased to emit light. If reversed biased, the LED is extinguished.", "Let's start the experiment.", "Let's start the experiment.e..............................."], "jumps": ["P1170", "P1140"]}, {"id": "P1180", "text": ["1.  Set the test console controls to their initial control settings.", "1. Set the test console controls to their initial control settings........"], "jumps": ["P1170"]}, {"id": "P1190", "text": ["2.  Carefully plug PC130-84B into the test console PC2 position. \n3.  Place PC130-84B switches S1 and S2 to OFF.", "2. Carefully plug PC130-84B into the test console PC2 position. 3. Place PC130-84B switches S1 and S2 to OFF... the PC3 Speaker switch to ON........................................."], "jumps": ["P1180", "P1195"]}, {"id": "P1195", "text": ["EXPERIMENT CARD PLACEMENT - PC130-84B shown in PC2 position."], "jumps": ["P1196"]}, {"id": "P1196", "text": ["SWITCH POSITIONS - S1 and S2 to the OFF position."], "jumps": ["P1195"]}, {"id": "P1200", "text": ["4.  Set the Voltmeter switch to Positive. \n5.  Set the Positive Supply Voltage to 12.   \n     The test console's voltage meter should indicate 12 Volts.", "4. Set the Voltmeter switch to Positive. 5. Set the Positive Supply Voltage to 12. The test console's voltage meter should indicate 12 Volts.................."], "jumps": ["P1190"]}, {"id": "P1210", "text": ["6.  Set the Voltmeter switch to Negative. \n7.  Set the Negative Supply Voltage to 12.\n     The test console's voltage meter should indicate 12 Volts.", "6. Set the Voltmeter switch to Negative. 7. Set the Negative Supply Voltage to 12. The test console's voltage meter should indicate 12 Volts......................."], "jumps": ["P1200"]}, {"id": "P1220", "text": ["8.  Turn PC2 DC Power switch to ON.", "8. Turn PC2 DC Power switch to ON........................................."], "jumps": ["P1210"]}, {"id": "P1230", "text": ["Type in the reference designator for the LED that is illuminated.", "Type in the reference designator for the LED that is illuminated.. that is illuminated.e.able.le."], "jumps": ["P1220", "P1232"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["Look at the card, one of the LEDs is ON, glowing red. Type in the component designator below the illuminated LED."], "jumps": []}, {"id": "P1234", "text": ["You still did not type in the correct LED designator.  1 should be illuminated.  If it is not, check switches S1 and S2, ensure that they are in the OFF position and that you are NOT pushing S3 in. Then check with your instructor.", "You still did not type in the correct LED designator. 1 should be illuminated. If it is not, check switches S1 and S2, ensure that they are in the OFF position and that you are NOT pushing S3 in. Then check with your instructor."], "jumps": ["P1240", "P1230"]}, {"id": "P1240", "text": ["The experiment is set up. Let's look at relay action before starting to trace signals through the circuit."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["On the experiment card, look closely at relays K1, K2, and K3. Notice that the relays are contained in a housing or cover."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Most relays are made this way. This prevents dust, dirt, or other atmospheric contaminants from getting inside the relay and disrupting relay operation.", "Most relays are made this way. This prevents dust, dirt, or other atmospheric contaminants from getting inside the relay and disrupting relay operation..."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Also notice that K2 and K3 have a clear plastic cover.  Examine the insides of K2 and K3.", "Also notice that K2 and K3 have a clear plastic cover. Examine the insides of K2 and K3."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Look closely at K3. It is a four pole relay. Notice the clapper and push rods."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Press and release switch S3 a few times. Notice the relay operation and how the push rod changes the common terminals between contacts."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Now let's start to signal trace the relay circuit.", "Now let's start to signal trace the relay circuit.........."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["1. Ensure that S1 and S2 are OFF and that you are not pushing in S3. All three relays are de-energized. 2. Connect the ground test lead of your multimeter, using an alligator clip, to the ground test point on the card. This is done so that you have a free hand when making voltage measurements."], "jumps": ["P1320", "P1300", "P1315"]}, {"id": "P1315", "text": ["Tracing through a relay circuit requires that you start at the beginning of the circuit.", "MEASUREMENT SETUP - Connect alligator clip from multimeter to ground TP."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["3.  Measure the voltage on TP2 and TP4.  Notice that there are              two input signals, +12V on TP2 and -12 V on TP4.", "3. Measure the voltage on TP2 and TP4. Notice that there are two input signals, +12V on TP2 and -12 V on TP4."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The common terminal of K1, TP3, will have either +12V or -12V on it depending if it is energized or de-energized.", "4.  Measure the voltage on TP3. \n     What voltage is on TP3 with K1 de-energized?", "4. Measure the voltage on TP3. What voltage is on TP3 with K1 de-energized????????????"], "jumps": ["P1350", "P1320"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Remember, K1 is de-energized. The relay connects TP2 to TP3. This applies the +12 V to the common terminal.", "Tracing the +12 V signal input through the circuit shows that LED 1 is illuminated."], "jumps": []}, {"id": "P1370", "text": ["With K1, K2, and K3 de-energized, the +12 V is applied to D4 and D5."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Since D4 is forward biased and D5 is reversed biased, LED 1 illuminates as seen on the card."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["5.  Measure the voltages at TP2, TP3, TP7, TP6, TP11, and TP10.         This is the signal flow for K1, K2, and K3 de-energized.", "5. Measure the voltages at TP2, TP3, TP7, TP6, TP11, and TP10. This is the signal flow for K1, K2, and K3 de-energized."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["6.  Measure the voltage on TP's 8, 12,  and 14.  Notice that you            measured 0 V.  The contacts are open.", "6. Measure the voltage on TP's 8, 12, and 14. Notice that you measured 0 V. The contacts are open."], "jumps": ["P1410", "P1360"]}, {"id": "P1410", "text": ["Also notice that the +12 V is applied to a second set of contacts in K1."], "jumps": ["P1420", "P1360"]}, {"id": "P1420", "text": ["This voltage will be used as a latching voltage later.  Right now, it is open ended.", "If K1 were energized, which input signal would be connected to the common terminal at TP3?", "This voltage will be used as a latching voltage later. Right now, it is open ended."], "jumps": ["P1430", "P1360"]}, {"id": "P1431", "text": [], "jumps": ["P1430"]}, {"id": "P1432", "text": ["With K1 energized, TP4 is connected to TP3. Visualize that the contacts in the relay have switched over.", "7.  Place S1 to ON. This energizes K1, the drawing below shows        K1 energized, K2 and K3 de-energized.", "7. Place S1 to ON. This energizes K1, the drawing below shows K1 energized, K2 and K3 de-energized."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["P7, TP6, TP11, and TP10).", "8. Trace the -12 V signal from the input to the output of K3 by measuring the voltagesat TP4, TP3, TP7, TP6, TP11, and TP10............."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["9.  Measure the voltage at TP's 8, 12, and14.  Notice that you                measured 0 V.  The contacts are open.", "9. Measure the voltage at TP's 8, 12, and14. Notice that you measured 0 V. The contacts are open."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["With -12V applied to D4 and D5, D5 is forward biased and illuminates LED 2 as indicated on the card."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["Note that +12V is applied to the second set of contacts on K2 and the third set of contacts on K3."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["This voltage will be used as a latching voltage when K2 or K3 are energized.", "10.   Place S1 to OFF and S2 to ON. The drawing below shows K2         energized, K1 and K3 de-energized.", "With K1 de-energized, which input signal is applied to the common terminal of K2?  K1 and K3 are shown de-energized and K2 is shown energized.", "10. Place S1 to OFF and S2 to ON. The drawing below shows K2 energized, K1 and K3 de-energized.", "With K1 de-energized, which input signal is applied to the common terminal of K2? K1 and K3 are shown de-energized and K2 is shown energized."], "jumps": ["P1500", "P1440", "P1510"]}, {"id": "P1511", "text": ["+12 V is applied to TP7 of K2 when K1 is de-energized, as shown below.", "With K2 energized and K3 de-energized, where is the +12 volts routed?  K1 and K3 are shown de-energized, K2 is shown energized.", "With K2 energized and K3 de-energized, where is the +12 volts routed? K1 and K3 are shown de-energized, K2 is shown energized."], "jumps": ["P1510"]}, {"id": "P1521", "text": ["With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14, TP13.", "11.  Trace the +12 volts from TP2 to TP13 with your multimeter.              You should start at TP2 then measure TP3, TP7, TP8, TP14             and TP 13 last.  K1 and K3 are shown de-energized.  K2 is               shown energized.", "With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14, TP13.P13....", "11. Trace the +12 volts from TP2 to TP13 with your multimeter. You should start at TP2 then measure TP3, TP7, TP8, TP14 and TP 13 last. K1 and K3 are shown de-energized. K2 is shown energized."], "jumps": ["P1540", "P1520", "PpP", "Px"]}, {"id": "P1540", "text": ["12.  Measure the voltage at TP's 6, 11, and 15.  Notice that you               measured 0 V.  These contacts are open when K2 is                          energized, as shown.", "12. Measure the voltage at TP's 6, 11, and 15. Notice that you measured 0 V. These contacts are open when K2 is energized, as shown.."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["With +12V applied to D6 and D7, D6 is forward biased and LED 3 illuminates as seen on the card."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["Notice that the latching voltage is open ended in K1."], "jumps": ["P1570", "P1530"]}, {"id": "P1570", "text": ["K2 receives the output from K1 (+12 V or -12 V) and routes it to K3.   If K2 is de-energized the voltage goes to K3's first set of  contacts. All these relays are shown de-energized.", "K2 receives the output from K1 (+12 V or -12 V) and routes it to K3. If K2 is de-energized the voltage goes to K3's first set of contacts. All these relays are shown de-energized.))"], "jumps": ["P1575", "P1530"]}, {"id": "P1575", "text": ["If K2 is energized, the voltage is applied to K3's second set of  contacts.  K1 and K3 shown de-energized, K2 energized.", "13.   Place S1 to ON. Keep S2 ON. This energizes both K1 and                 K2.  K1 and K2 shown energized and K3 de-energized.", "With K1 and K2 energized as shown, which input signal is applied to K2's common contacts?", "If K2 is energized, the voltage is applied to K3's second set of contacts. K1 and K3 shown de-energized, K2 energized.", "13. Place S1 to ON. Keep S2 ON. This energizes both K1 and K2. K1 and K2 shown energized and K3 de-energized.ed))"], "jumps": ["P1580", "P1530", "P1590"]}, {"id": "P1591", "text": ["With K1 energized -12 V is applied to K2 at TP7.  K1 and K2 are shown energized.  K3 is shown de-energized.", "K1 and K2 energized as shown, and K3 de-energized as shown, where is -12 V applied?", "With K1 energized -12 V is applied to K2 at TP7. K1 and K2 are shown energized. K3 is shown de-energized."], "jumps": ["P1590"]}, {"id": "P1601", "text": ["With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14, and TP13.", "14.   Trace the -12 volts from TP4 to TP13 using your multimeter.            K1 and K2 are shown energized.  K3 shown de-energized.", "With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14, and TP13....", "14. Trace the -12 volts from TP4 to TP13 using your multimeter. K1 and K2 are shown energized. K3 shown de-energized."], "jumps": []}, {"id": "P1620", "text": ["15.  Measure the voltage at TP's 6, 11, and 15.  Notice that you                measured 0 V.  The contacts at TP6 and TP15 are open, no             voltage will be present at TP11 when the contact at TP6 is               open.", "15. Measure the voltage at TP's 6, 11, and 15. Notice that you measured 0 V. The contacts at TP6 and TP15 are open, no voltage will be present at TP11 when the contact at TP6 is open."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["With -12V applied to D6 and D7, D7 is forward biased and LED 4 illuminates as seen on the card."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["Notice that the latching voltage is applied to K2 by the second set of contacts on K1 when K1 and K2 are energized as shown.", "Notice that the latching voltage is applied to K2 by the second set of contacts on K1 when K1 and K2 are energized as shown.S"], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["16.   Ensure that S1 is ON (K1 energized). \n17.   Place S2 to OFF (K2 de-energized).", "16. Ensure that S1 is ON (K1 energized). 17. Place S2 to OFF (K2 de-energized)."], "jumps": ["P1660", "P1610"]}, {"id": "P1660", "text": ["Notice that K2 does not de-energize, as shown.  It is latched by the +12 V from K1's second set of contacts.", "Notice that K2 does not de-energize, as shown. It is latched by the +12 V from K1's second set of contacts."], "jumps": ["P1670", "P1610"]}, {"id": "P1670", "text": ["18.  Place S1 to OFF.  Now K1 and K2 are de-energized.  The\n        latching voltage was removed and LED 1 illuminates. All\n        these relays are shown de-energized.", "19.  Press and hold S3 ON. Ensure S1 and S2 are OFF. This                    energizes K3 only.  K1 and  K2 are shown de-energized.  \n        K3 is shown energized.", "With K1 de-energized, +12V is applied to K1 and K2. With K2 de-energized and K3 energized, where is the +12 V applied? K1 and K2 are shown de-energized.  K3 is shown energized.", "18. Place S1 to OFF. Now K1 and K2 are de-energized. The latching voltage was removed and LED 1 illuminates. All these relays are shown de-energized.)ergized.)", "19. Press and hold S3 ON. Ensure S1 and S2 are OFF. This energizes K3 only. K1 and K2 are shown de-energized. K3 is shown energized.own energized.", "With K1 de-energized, +12V is applied to K1 and K2. With K2 de-energized and K3 energized, where is the +12 V applied? K1 and K2 are shown de-energized. K3 is shown energized."], "jumps": ["P1680", "P1610", "P1690"]}, {"id": "P1691", "text": ["With K2 de-energized and K3 energized, the flow is from TP7, TP6, TP11, and TP12.", "20.   Trace the +12 volts from TP2 to TP12 using your multimeter.           K1 and K2 are shown de-energized.  K3 is shown energized.", "With K2 de-energized and K3 energized, the flow is from TP7, TP6, TP11, and TP12....", "20. Trace the +12 volts from TP2 to TP12 using your multimeter. K1 and K2 are shown de-energized. K3 is shown energized."], "jumps": ["P1710", "P1690"]}, {"id": "P1710", "text": ["21.  Measure the voltage on TP's 8, 10, and 14. Notice that you              measured 0 V.  When K1 and K2 are de-energized the                       contacts at TP8 and TP10 are open. When there is no                       voltage present on TP8, and K3 is energized there is no                   voltage  present at TP14.", "21. Measure the voltage on TP's 8, 10, and 14. Notice that you measured 0 V. When K1 and K2 are de-energized the contacts at TP8 and TP10 are open. When there is no voltage present on TP8, and K3 is energized there is no voltage present at TP14......."], "jumps": ["P1720", "P1700"]}, {"id": "P1720", "text": ["With +12V applied to D8 and D9, D8 is forward biased and LED 5 illuminates as seen on the card."], "jumps": ["P1730", "P1700"]}, {"id": "P1730", "text": ["Notice that the latching voltage is open ended in K1.  Also note the latching voltage from TP9 through K3 to K2.", "22.  Place S1 to ON. Keep S3 depressed. This energizes K1.  K3            is still energized.  (K1 and K3 shown energized, K2 shown              de-energized)", "Notice that the latching voltage is open ended in K1. Also note the latching voltage from TP9 through K3 to K2.", "22. Place S1 to ON. Keep S3 depressed. This energizes K1. K3 is still energized. (K1 and K3 shown energized, K2 shown de-energized))))))))))))"], "jumps": ["P1740", "P1700"]}, {"id": "P1750", "text": ["Notice that the path from K1 to the LED's is the same as before. Only -12 V is applied by the action of K1."], "jumps": ["P1760", "P1740"]}, {"id": "P1760", "text": ["23.  Trace the -12 V from TP4 to TP12 using your multimeter.", "23. Trace the -12 V from TP4 to TP12 using your multimeter."], "jumps": ["P1770", "P1740"]}, {"id": "P1770", "text": ["24.  Measure the voltage at TP's 8, 10, and 14.  Notice that you               measured 0 V. The contacts are open.", "24. Measure the voltage at TP's 8, 10, and 14. Notice that you measured 0 V. The contacts are open."], "jumps": ["P1780", "P1740"]}, {"id": "P1780", "text": ["With -12 V applied to D8 and D9, D9 is forward biased and illuminates LED 6 as seen on the card."], "jumps": ["P1790", "P1740"]}, {"id": "P1790", "text": ["Also notice the latching voltage from K1 is applied to K3.", "Also notice the latching voltage from K1 is applied to K3.i"], "jumps": ["P1800", "P1740"]}, {"id": "P1800", "text": ["25.  Ensure S1 is ON. \n26.  Release S3.  Notice that K3 stayed energized as shown.", "27.   Place S1 to OFF.  Notice that K1 and K3 de-energized as                  indicated by the illumination of LED 1.  The latching voltage            was removed.  K1, K2 and K3 are shown de-energized.", "28.  Place S2 ON and press and hold S3.  Ensure S1 is OFF. This          energizes K2 and K3 as shown.  K1 is shown de-energized.", "With K1 de-energized and, K2 and K3 energized, which input signal is sent to K2?  K1 shown de-energized.  K2 and K3 shown energized.", "25. Ensure S1 is ON. 26. Release S3. Notice that K3 stayed energized as shown..ergized as shown.", "27. Place S1 to OFF. Notice that K1 and K3 de-energized as indicated by the illumination of LED 1. The latching voltage was removed. K1, K2 and K3 are shown de-energized.", "28. Place S2 ON and press and hold S3. Ensure S1 is OFF. This energizes K2 and K3 as shown. K1 is shown de-energized..", "With K1 de-energized and, K2 and K3 energized, which input signal is sent to K2? K1 shown de-energized. K2 and K3 shown energized."], "jumps": ["P1810", "P1740", "P1820", "P1830"]}, {"id": "P1831", "text": [], "jumps": []}, {"id": "P1832", "text": ["K1 controls the input signal that is routed to K2.  If K1 is energized, -12 V is applied. If K1 is de-energized +12 V is applied.", "With K2 and K3 energized as shown, where is the +12 V signal applied?", "K1 controls the input signal that is routed to K2. If K1 is energized, -12 V is applied. If K1 is de-energized +12 V is applied."], "jumps": []}, {"id": "P1841", "text": [], "jumps": []}, {"id": "P1842", "text": ["With K2 and K3 energized, the flow is from TP7, TP8, TP14, and TP15.", "29.  Trace the +12 V from TP2 to TP15 using your multimeter.", "With K2 and K3 energized, the flow is from TP7, TP8, TP14, and TP15.5.", "29. Trace the +12 V from TP2 to TP15 using your multimeter. (K1 shown de-energized, K2 and K3 shown energize)", "29. Trace the +12 V from TP2 to TP15 using your multimeter. K1 is shown de-energized. K2 and K3 are shown energized.."], "jumps": []}, {"id": "P1860", "text": ["30.  Measure the voltage at TP's 6, 11, and 13.  Notice that you                measured 0 V. With K1 de-energized (as shown) and K2, K3           energized (as shown) the contact at TP6 and TP13 are open.          When the contact at TP6 is open there is no voltage applied           to TP11.", "30. Measure the voltage at TP's 6, 11, and 13. Notice that you measured 0 V. With K1 de-energized (as shown) and K2, K3 energized (as shown) the contact at TP6 and TP13 are open. When the contact at TP6 is open there is no voltage applied to TP11."], "jumps": ["P1870", "P1850"]}, {"id": "P1870", "text": ["With +12V applied to D10 and D11, D10 is forward biased and illuminates LED 7 as seen on the card."], "jumps": ["P1880", "P1850"]}, {"id": "P1880", "text": ["Notice the latching voltage from K2 and K3."], "jumps": ["P1890", "P1850"]}, {"id": "P1890", "text": ["31.  Release S3. K3 stays energized (as shown) due to the                      latching voltage from K2.", "31. Release S3. K3 stays energized (as shown) due to the latching voltage from K2."], "jumps": ["P1900", "P1850"]}, {"id": "P1900", "text": ["32.  Depress S3 to ON.\n33.  Place S2 to OFF.  \n        K2 stays energized (as shown) due to the latching voltage              from K3.", "34.  Place S2 to ON.  Ensure S3 is depressed. \n35.  Place S1 to ON.  This energizes K1, K2, and K3 as shown.", "32. Depress S3 to ON. 33. Place S2 to OFF. K2 stays energized (as shown) due to the latching voltage from K3..................", "34. Place S2 to ON. Ensure S3 is depressed. 35. Place S1 to ON. This energizes K1, K2, and K3 as shown.............."], "jumps": ["P1910", "P1850", "P1920"]}, {"id": "P1920", "text": ["The path is the same as before, only -12 V is applied to K2."], "jumps": ["P1930", "P1910"]}, {"id": "P1930", "text": ["36.  Trace the signal from TP4 to TP15 using your multimeter.", "36. Trace the signal from TP4 to TP15 using your multimeter."], "jumps": ["P1940", "P1910"]}, {"id": "P1940", "text": ["37.  Measure the voltage at TP's 6, 11, and 13.   Notice that you              measured 0 V.  The contacts at TP6 and TP13 are open and            there is no voltage present at TP11.", "37. Measure the voltage at TP's 6, 11, and 13. Notice that you measured 0 V. The contacts at TP6 and TP13 are open and there is no voltage present at TP11.."], "jumps": ["P1950", "P1910"]}, {"id": "P1950", "text": ["With -12V applied to D10 and D11, D11 is forward biased and illuminates LED 8 as seen on the card."], "jumps": ["P1960", "P1910"]}, {"id": "P1960", "text": ["With K1 energized as shown, the latching voltage is applied to both K2 and K3."], "jumps": ["P1970", "P1910"]}, {"id": "P1970", "text": ["38   Ensure S1 is ON. \n39.  Place S2 to OFF and release S3.  Notice that K2 and K3                    stayed energized as shown.", "40.   Place S1 to OFF. You have traced the two input signals,\n         +12 V and -12 V, through the relay circuit in all conditions.", "38 Ensure S1 is ON. 39. Place S2 to OFF and release S3. Notice that K2 and K3 stayed energized as shown....", "40. Place S1 to OFF. You have traced the two input signals, +12 V and -12 V, through the relay circuit in all conditions."], "jumps": ["P1980", "P1910", "P1990"]}, {"id": "P1990", "text": ["To sum up, K1 supplies +12 V to K2  when de-energized and \n-12 V to K2 when energized.", "To sum up, K1 supplies +12 V to K2 when de-energized and -12 V to K2 when energized."], "jumps": ["P2000", "P1980"]}, {"id": "P2000", "text": ["K2 routed the output of K1 to the first set of contacts in K3 when de-energized and to the second set of contacts in K3 when energized."], "jumps": ["P2010", "P1980"]}, {"id": "P2010", "text": ["K3 routed the signal to D4 and D5 or D6 and D7 when \nde-energized depending on the condition of K2.", "K3 routed the signal to D4 and D5 or D6 and D7 when de-energized depending on the condition of K2."], "jumps": ["P2020", "P1980"]}, {"id": "P2020", "text": ["And to D8 and D9 or D10 and D11 when energized depending on the condition of K2."], "jumps": ["P2030", "P1980"]}, {"id": "P2030", "text": ["1.  Return the test console to the initial control settings.", "1. Return the test console to the initial control settings................"], "jumps": ["P1980"]}, {"id": "P2040", "text": ["2.  Turn power OFF to the test console.", "2. Turn power OFF to the test console....................."], "jumps": ["P2030"]}, {"id": "P2050", "text": ["3.  Disconnect all test equipment.\n4.  Carefully remove PC130-84B. \n5.  Return all equipment to its proper storage area.", "3. Disconnect all test equipment. 4. Carefully remove PC130-84B. 5. Return all equipment to its proper storage area..............................."], "jumps": ["P2910", "P2040"]}, {"id": "P2910", "text": ["This completes the experiment on RELAY OPERATION EXPERIMENT."], "jumps": ["P2050"]}, {"id": "P13020", "text": ["The purpose of this experiment is to operate relays. Three relays are used to control the signal flow through a circuit to illuminate different lamps."], "jumps": ["P13040"]}, {"id": "P13040", "text": ["Pick up the PC130-84B card. This card is used to demonstrate relay operation.", "Compare the card with the schematic shown."], "jumps": ["P13050", "P13020", "P13060"]}, {"id": "P13060", "text": ["K1, K2, and K3 are the relays.  The dotted lines indicate a mechanical connection between the relay armatures.", "K1, K2, and K3 are the relays. The dotted lines indicate a mechanical connection between the relay armatures."], "jumps": ["P13090", "P13050"]}, {"id": "P13090", "text": ["Switches S1 through S3 control the relays.  S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.", "Switches S1 through S3 control the relays.  S1 is a slide switch,  S2 is toggle, and S3 is a push-button switch.", "Switches S1 through S3 control the relays. S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.", "Switches S1 through S3 control the relays. S1 is a slide switch, S2 is toggle, and S3 is a push-button switch.."], "jumps": ["P13097", "P13050", "P13095", "P13040"]}, {"id": "P13095", "text": ["SWITCHES S1 THROUGH S3 - Your experiment card may have three push button switches. If it does, the card operates the same."], "jumps": []}, {"id": "P13097", "text": ["When a switch is ON, voltage is applied to energize the relay."], "jumps": ["P13100", "P13092"]}, {"id": "P13100", "text": ["Also notice the symbols for components D1 through D11 and L1 through L8.", "Also notice the symbols for components D1 through D11 and L1 through L8.8.8."], "jumps": ["P13110", "P13092"]}, {"id": "P13110", "text": ["D1 through D11 are diodes."], "jumps": ["P13120", "P13092"]}, {"id": "P13120", "text": ["They basically allow current flow in one direction.", "They basically allow current to travel in one direction.", "They basically allow current flow in one direction.tion."], "jumps": ["P13130", "P13092"]}, {"id": "P13130", "text": ["Diodes D1, D2, and D3 prevent current flow through the magnetic core when the relay is de-energized. This is called inductive kick back.", "The diode must be forward biased to allow current . If reversed biased, there is no current........", "The diode must be forward biased to allow current flow. If reversed biased, no current flows.", "Diodes D1, D2, and D3 prevent current from passing through the magnetic core when the relay is de-energized. This is called inductive kick back.", "Diodes D1, D2, and D3 prevent current flow through the magnetic core when the relay is de-energized. This is called inductive kick back.ck back."], "jumps": ["P13140", "P13092", "P13150", "P13130", "P13145"]}, {"id": "P13145", "text": ["DIODES D1, D2, AND D3 - The magnetic core is a coil and will act as an inductor. When the power is removed from the coil, a counter EMF is developed which causes a current flow.", "DIODES D1, D2, AND D3 - The magnetic core is a coil and will act as an inductor. When the power is removed from the coil, a counter EMF is developed which causes a current."], "jumps": ["P13146"]}, {"id": "P13146", "text": ["The reverse current flow is prevented from flowing back through the coil by the action of the diode............................"], "jumps": ["P13147", "P13145"]}, {"id": "P13147", "text": ["If current were allowed to flow, the relay would energize again, this is called chatter.f the diode............................"], "jumps": ["P13145", "P13140"]}, {"id": "P13150", "text": ["LED 1 through LED 8 are Light Emitting Diodes (LEDs).  They emit light when current flows through them.", "LED 1 through LED 8 are Light Emitting Diodes (LEDs). They emit light when current passes through them.", "LED 1 through LED 8 are Light Emitting Diodes (LEDs). They emit light when current flows through them.", "LED 1 through LED 8 are Light Emitting Diodes (LEDs). They emit light when current flows through them.."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["The LED must be forward biased to emit light.  If reversed biased, the LED is extinguished.", "Let's start the experiment.", "The LED must be forward biased to emit light. If reversed biased, the LED is extinguished.", "Let's start the experiment.e..............................."], "jumps": ["P13170", "P13140", "P13180"]}, {"id": "P13180", "text": ["1.  Set the test console controls to their initial control settings.", "2. Carefully plug PC130-84B into the test console PC2 position.", "2. Carefully plug PC130-84B into the test console PC position.", "1. Set the test console controls to their initial control settings........"], "jumps": ["P13170"]}, {"id": "P13190", "text": ["2.  Carefully plug PC130-84B into the test console PC position.\n3.  Place PC130-84B switches S1 and S2 to OFF.", "4. Press Enter to set: Supply Voltage - 12 PC DC Power Switch - ON", "4. Press Enter to set: Positive Supply Voltage - 12 Negative Supply Voltage - 12 PC2 DC Power Switch - ON", "2. Carefully plug PC130-84B into the test console PC position. 3. Place PC130-84B switches S1 and S2 to OFF....."], "jumps": ["P13195", "P13196"]}, {"id": "P13195", "text": ["EXPERIMENT CARD PLACEMENT - PC130-84B shown in PC2 position."], "jumps": ["P13196"]}, {"id": "P13196", "text": ["SWITCH POSITIONS - S1 and S2 to the OFF position."], "jumps": ["P13190", "P13195"]}, {"id": "P13200", "text": ["4.  Press Enter to set:  Supply Voltage - 12                                                                                       PC DC Power Switch - ON", "4. Press Enter to set: Supply Voltage - 12 PC DC Power Switch - ON PC2 DC Power Switch - ON - 12 PC2 DC Power Switch - ON"], "jumps": ["P13190"]}, {"id": "P13230", "text": ["Type in the reference designator for the LED that is illuminated.", "Type in the reference designator for the LED that is illuminated....................le.able.le."], "jumps": ["P13232"]}, {"id": "P13231", "text": [], "jumps": []}, {"id": "P13232", "text": ["Look at the card, one of the LEDs is ON, glowing red.  Type the component designator shown on the circuit card below the illuminated LED for your response.", "Look at the card, one of the LEDs is ON, glowing red. Type the component designator shown on the circuit card below the illuminated LED for your response."], "jumps": []}, {"id": "P13234", "text": ["You still did not type in the correct LED designator.  L1 should be illuminated.  If it is not, check switches S1 and S2, ensure that they are in the OFF position and that you are NOT pushing S3 down.  Then check with your instructor.", "You still did not type in the correct LED designator. L1 should be illuminated. If it is not, check switches S1 and S2, ensure that they are in the OFF position and that you are NOT pushing S3 down. Then check with your instructor. ."], "jumps": ["P13240", "P13230"]}, {"id": "P13240", "text": ["The experiment is set up.  Let's look at relay action before starting to trace signals through the circuit.", "The experiment is set up. Let's look at relay action before starting to trace signals through the circuit."], "jumps": ["P13250", "P13230"]}, {"id": "P13250", "text": ["On the experiment card, look closely at relays K1, K2, and K3. Notice that the relays are contained in a housing or cover."], "jumps": ["P13260", "P13240"]}, {"id": "P13260", "text": ["Most relays are made this way.  This prevents dust, dirt, or other atmospheric contaminants from getting inside the relay and disrupting relay operation.", "Most relays are made this way. This prevents dust, dirt, or other atmospheric contaminants from getting inside the relay and disrupting relay operation."], "jumps": ["P13270", "P13250"]}, {"id": "P13270", "text": ["Also notice that K2 and K3 have a clear plastic cover.  Examine the insides of K2 and K3.", "Also notice that K2 and K3 have a clear plastic cover. Examine the insides of K2 and K3."], "jumps": ["P13280", "P13260"]}, {"id": "P13280", "text": ["Look closely at K3. It is a four pole relay.  Notice the clapper and push rods.", "Look closely at K3. It is a four pole relay. Notice the clapper and push rods."], "jumps": ["P13290", "P13270"]}, {"id": "P13290", "text": ["Press and release switch S3 a few times.  Notice the relay operation and how the push rod changes the common terminals between contacts.", "Press and release switch S3 a few times. Notice the relay operation and how the push rod changes the common terminals between contacts."], "jumps": ["P13300", "P13280"]}, {"id": "P13300", "text": ["Now let's start to signal trace the relay circuit.", "Now let's start to signal trace the relay circuit.........."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["1. Ensure that S1 and S2 are OFF and that you are not pushing in S3. All three relays are de-energized. 2. Connect the ground test lead of your multimeter, using an alligator clip, to the ground test point on the card. This is done so that you have a free hand when making voltage measurements................"], "jumps": ["P13320", "P13300", "P13315"]}, {"id": "P13315", "text": ["Tracing through a relay circuit requires that you start at the beginning of the circuit.", "MEASUREMENT SETUP - Connect alligator clip from multimeter to ground TP."], "jumps": []}, {"id": "P13330", "text": ["3.  Measure the voltage on TP2 and TP4.  Notice that there are             two input signals, +12V on TP2 and  -12 V on TP4.", "3. Measure the voltage on TP2 and TP4. Notice that there are two input signals, +12V on TP2 and -12 V on TP4."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["The common terminal of K1, TP3, will have either +12V or -12V on it depending if it is energized or de-energized.", "4.  Measure the voltage on TP3. \n     What voltage is on TP3 with K1de-energized?", "4. Measure the voltage on TP3. What voltage is on TP3 with K1de-energized???????????-"], "jumps": ["P13350", "P13320"]}, {"id": "P13351", "text": [], "jumps": []}, {"id": "P13352", "text": ["Remember, K1 is de-energized.  The relay connects TP2 to TP3. This applies the +12 V to the common terminal.", "Tracing the +12 V signal input through the circuit shows that LED1 is illuminated.", "Remember, K1 is de-energized. The relay connects TP2 to TP3. This applies the +12 V to the common terminal."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["With K1, K2, and K3 de-energized, the +12 V is applied to D4 and D5."], "jumps": ["P13380", "P13360"]}, {"id": "P13380", "text": ["Since D4 is forward biased and D5 is reversed biased, LED1  illuminates as seen on the card.", "Since D4 is forward biased and D5 is reversed biased, LED1 illuminates as seen on the card."], "jumps": ["P13390", "P13360"]}, {"id": "P13390", "text": ["5.  Measure the voltages at TP2, TP3, TP7, TP6, TP11, and TP10.         This is the signal flow for K1, K2, and K3 de-energized.", "5. Measure the voltages at TP2, TP3, TP7, TP6, TP11, and TP10. This is the signal flow for K1, K2, and K3 de-energized."], "jumps": ["P13400", "P13360"]}, {"id": "P13400", "text": ["6.  Measure the voltage on test points 8, 12,  and 14.  Notice that\n     you measured 0 V.  The contacts are open.", "6. Measure the voltage on test points 8, 12, and 14. Notice that you measured 0 V. The contacts are open........"], "jumps": ["P13410", "P13360"]}, {"id": "P13410", "text": ["Also notice that the +12 V is applied to a second set of contacts in K1."], "jumps": ["P13420", "P13360"]}, {"id": "P13420", "text": ["This voltage will be used as a latching voltage later.  Right now, it is open ended.", "If K1 were energized, which input signal would be connected to the common terminal at TP3?", "This voltage will be used as a latching voltage later. Right now, it is open ended."], "jumps": ["P13430", "P13360"]}, {"id": "P13431", "text": [], "jumps": []}, {"id": "P13432", "text": ["With K1 energized, TP4 is connected to TP3.  When reading schematics you will have to visualize that the contacts in the relay have switched over.", "7.   Place S1 to ON.  This energizes K1.  The schematic below is\n      drawn to show that K1 is energized and K2 and K3 are \n      de-energized.", "With K1 energized, TP4 is connected to TP3. When reading schematics you will have to visualize that the contacts in the relay have switched over..", "7. Place S1 to ON. This energizes K1. The schematic below is drawn to show that K1 is energized and K2 and K3 are de-energized.."], "jumps": ["P13450", "P13430"]}, {"id": "P13450", "text": ["uring the voltages atTP4 to TP3, TP7, TP6, TP11, and TP10).", "8. Trace the -12 V signal from the input to the output of K3 by measuring the voltages at TP4,TP3, TP7, TP6, TP11, and TP10.)."], "jumps": ["P13460", "P13440"]}, {"id": "P13460", "text": ["9. Measure the voltage at test points 8, 12, and 14. Notice that you measured 0 V. The contacts are open..... are open."], "jumps": ["P13470", "P13440"]}, {"id": "P13470", "text": ["With -12V applied to D4 and D5, D5 is forward biased and illuminates LED 2 as indicated on the card."], "jumps": ["P13480", "P13440"]}, {"id": "P13480", "text": ["Note that +12V is applied to the second set of contacts on K2 and the third set of contacts on K3."], "jumps": ["P13440"]}, {"id": "P13490", "text": ["This voltage will be used as a latching voltage when K2 or K3 are energized.", "10.  Place S1 to OFF and S2 to ON.  The schematic below is\n       drawn to show that K2 is energized and K1 and K3 are\n       de-energized.", "With K1 de-energized, which input signal is applied to the common terminal of K2? Notice in the schematic K1 and K3 are shown de-energized and K2 is shown energized.", "10. Place S1 to OFF and S2 to ON. The schematic below is drawn to show that K2 is energized and K1 and K3 are de-energized.", "With K1 de-energized, which input signal is applied to the common terminal of K2? Notice in the schematic K1 and K3 are shown de-energized and K2 is shown energized.)"], "jumps": ["P13500", "P13440", "P13510"]}, {"id": "P13511", "text": ["+12 V is applied to TP7 of K2 when K1 is de-energized, as shown below.", "With K2 energized and K3 de-energized, where is the +12 volts routed?  Notice that K1 and K3 are shown de-energized, K2 is shown energized.", "With K2 energized and K3 de-energized, where is the +12 volts routed? Notice that K1 and K3 are shown de-energized, K2 is shown energized."], "jumps": ["P13510"]}, {"id": "P13521", "text": ["With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14 and TP13.", "11.  Trace the +12 volts from TP2 to TP13 with your multimeter.              You should start at TP2 then measure TP3, TP7, TP8, TP14             and TP13 last.  Note that K1 and K3 are shown de-energized,\n        K2 is shown energized.", "With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14 and TP13.....", "11. Trace the +12 volts from TP2 to TP13 with your multimeter. You should start at TP2 then measure TP3, TP7, TP8, TP14 and TP13 last. Note that K1 and K3 are shown de-energized, K2 is shown energized.))) energized)"], "jumps": ["P13540", "P13520"]}, {"id": "P13540", "text": ["12. Measure the voltage at test points 6, 11, and 15. Notice that you measured 0 V. These contacts are open when K2 is energized, as shown.energized, as shown.. as shown.."], "jumps": ["P13550", "P13530"]}, {"id": "P13550", "text": ["With +12V applied to D6 and D7, D6  is forward biased and LED 3 illuminates as seen on the card.", "With +12V applied to D6 and D7, D6 is forward biased and LED 3 illuminates as seen on the card."], "jumps": ["P13560", "P13530"]}, {"id": "P13560", "text": ["Notice that the latching voltage is open ended in K1."], "jumps": ["P13570", "P13530"]}, {"id": "P13570", "text": ["K2 receives the output from K1 (+12 V or -12 V) and routes it to K3.  If K2 is de-energized the voltage goes to K3's first set of contacts.  All these relays are shown de-energized.", "K2 receives the output from K1 (+12 V or -12 V) and routes it to K3. If K2 is de-energized the voltage goes to K3's first set of contacts. All these relays are shown de-energized.)"], "jumps": ["P13575", "P13530"]}, {"id": "P13575", "text": ["If K2 is energized, the voltage is applied to K3's second set of  contacts.  K1 and K3 shown de-energized and K2 is shown energized.", "13.  Place S1 to ON.  Keep S2 ON.  This energizes both K1 and\n        K2.  K1 and K2 are shown energized and K3 is shown \n        de-energized.", "With K1 and K2 energized as shown, which input signal is applied  to through the contactsK2?", "If K2 is energized, the voltage is applied to K3's second set of contacts. K1 and K3 shown de-energized and K2 is shown energized.nergized.", "13. Place S1 to ON. Keep S2 ON. This energizes both K1 and K2. K1 and K2 are shown energized and K3 is shown de-energized.", "With K1 and K2 energized as shown, which input signal is applied to through the contactsK2?K", "With K1 and K2 energized as shown, which input signal is applied through the contacts of K2 and K3 to the LEDs???????????????"], "jumps": ["P13580", "P13530"]}, {"id": "P13591", "text": ["With K1 energized -12 V is applied to K2 at TP7.  K1 and K2 are shown energized and K3 is shown de-energized.", "Where is -12 V applied with K1 and K2 energized as shown, and K3 de-energized as shown?", "With K1 energized -12 V is applied to K2 at TP7. K1 and K2 are shown energized and K3 is shown de-energized.", "Where is -12 V applied with K1 and K2 energized as shown, and K3 de-energized as shown???"], "jumps": ["P13590"]}, {"id": "P13601", "text": ["With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14, and TP13.", "14.  Trace the -12 volts from TP4 to TP13 using your multimeter.            K1 and K2 are shown energized.  K3 is shown de-energized.", "With K2 energized and K3 de-energized, the flow is from TP7, TP8, TP14, and TP13....", "14. Trace the -12 volts from TP4 to TP13 using your multimeter. K1 and K2 are shown energized. K3 is shown de-energized."], "jumps": ["P13620", "P13600"]}, {"id": "P13620", "text": ["15.  Measure the voltage at test points 6, 11, and 15.  Notice that\n        you measured 0 V. The contacts at TP6 and TP15 are open,\n        no voltage will be present at TP11 when the contact at TP6 is         open.", "15. Measure the voltage at test points 6, 11, and 15. Notice that you measured 0 V. The contacts at TP6 and TP15 are open, no voltage will be present at TP11 when the contact at TP6 is open. ."], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["With -12V applied to D6 and D7.  D7 is forward biased and LED 4 illuminates as seen on the card.", "With -12V applied to D6 and D7. D7 is forward biased and LED 4 illuminates as seen on the card."], "jumps": ["P13640", "P13610"]}, {"id": "P13640", "text": ["Notice that the latching voltage is applied to K2 by the second set of contacts on K1 when K1 and K2 are energized as shown.", "Notice that the latching voltage is applied to K2 by the second set of contacts on K1 when K1 and K2 are energized as shown._"], "jumps": ["P13650", "P13610"]}, {"id": "P13650", "text": ["16.  Ensure that S1 is ON (K1 energized). \n17.  Place S2 to OFF (K2 de-energized).", "16. Ensure that S1 is ON (K1 energized). 17. Place S2 to OFF (K2 de-energized)........"], "jumps": ["P13660", "P13610"]}, {"id": "P13660", "text": ["Notice that K2 does not de-energize (K2 shown energized).  It is latched by the +12 V from K1's second set of contacts.", "Notice that K2 does not de-energize (K2 shown energized). It is latched by the +12 V from K1's second set of contacts."], "jumps": ["P13670", "P13610"]}, {"id": "P13670", "text": ["18.  Place S1 to OFF.  Now K1 and K2 are de-energized.  The\n        latching voltage was removed and LED 1 illuminates.  All\n        these relays are shown de-energized.", "19.  Press and hold S3 ON.  Ensure S1 and S2 are OFF.  This                 energizes K3 only.  K1 and K2 are shown de-energized and\n       K3 is shown energized.", "With K1 de-energized, +12V is applied to K1 and K2.  With K2  de-energized and K3 energized, where is the +12 V applied?  K1 and K2 are shown de-energized and K3 is shown energized.", "18. Place S1 to OFF. Now K1 and K2 are de-energized. The latching voltage was removed and LED 1 illuminates. All these relays are shown de-energized.........", "19. Press and hold S3 ON. Ensure S1 and S2 are OFF. This energizes K3 only. K1 and K2 are shown de-energized and K3 is shown energized....)))))))))))", "With K1 de-energized, +12V is applied to K1 and K2. With K2 de-energized and K3 energized, where is the +12 V applied? K1 and K2 are shown de-energized and K3 is shown energized."], "jumps": ["P13680", "P13610", "P13690"]}, {"id": "P13691", "text": ["With K2 de-energized and K3 energized, the flow is from TP7, TP6, TP11, and TP12.", "20.  Trace the +12 volts from TP2 to TP12 using your multimeter.           K1 and K2 are shown de-energized and K3 is shown \n        energized.", "With K2 de-energized and K3 energized, the flow is from TP7, TP6, TP11, and TP12.2.", "20. Trace the +12 volts from TP2 to TP12 using your multimeter. K1 and K2 are shown de-energized and K3 is shown energized."], "jumps": ["P13710", "P13690"]}, {"id": "P13710", "text": ["21.  Measure the voltage at test points 8, 10, and 14.  Notice that\n        you measured 0 V.  When K1 and K2 are de-energized the\n        contacts at TP8 and TP10 are open.  When there is no                      voltage present on TP8, and K3 is energized there is no                   voltage present at TP14.", "21. Measure the voltage at test points 8, 10, and 14. Notice that you measured 0 V. When K1 and K2 are de-energized the contacts at TP8 and TP10 are open. When there is no voltage present on TP8, and K3 is energized there is no voltage present at TP14................nt at TP14..."], "jumps": ["P13720", "P13700"]}, {"id": "P13720", "text": ["With +12V applied to D8 and D9, D8 is forward biased and LED 5 illuminates as seen on the card."], "jumps": ["P13730", "P13700"]}, {"id": "P13730", "text": ["Notice that the latching voltage is open ended in K1.  Also note the latching voltage from TP9 through K3 to K2.", "22.  Place S1 to ON.  Keep S3 depressed.  This energizes K1.  K3\n       is still energized.  K1 and K3 are shown energized and K2\n       is  shown de- energized.", "Notice that the latching voltage is open ended in K1. Also note the latching voltage from TP9 through K3 to K2.", "22. Place S1 to ON. Keep S3 depressed. This energizes K1. K3 is still energized. K1 and K3 are shown energized and K2 is shown de- energized.- energized)"], "jumps": ["P13740", "P13700", "P13750"]}, {"id": "P13750", "text": ["Notice that the path from K1 to the LED's is the same as before. Only -12 V is applied by the action of K1."], "jumps": ["P13760", "P13740"]}, {"id": "P13760", "text": ["23.  Trace the -12 V from TP4 to TP12 using your multimeter.", "23. Trace the -12 V from TP4 to TP12 using your multimeter."], "jumps": ["P13770", "P13740"]}, {"id": "P13770", "text": ["24. Measure the voltage at test points 8, 10, and 14. Notice that you measured 0 V. The contacts are open.tacts are open."], "jumps": ["P13780", "P13740"]}, {"id": "P13780", "text": ["With -12 V applied to D8 and D9, D9 is forward biased and illuminates LED 6 as seen on the card."], "jumps": ["P13790", "P13740"]}, {"id": "P13790", "text": ["Also notice the latching voltage from K1 is applied to K3.", "Also notice the latching voltage from K1 is applied to K3.i"], "jumps": ["P13800", "P13740"]}, {"id": "P13800", "text": ["25.  Ensure S1 is ON. \n26.  Release S3.  \n        Notice that K3 stayed energized as shown.", "27.  Place S1 to OFF.  Notice that K1 and K3 de-energized as\n        indicated by the illumination of LED 1.  The latching voltage            was removed.  K1, K2 and K3 are shown de-energized.", "28.  Place S2 ON and press and hold S3.  Ensure S1 is OFF.  This         energizes K2 and K3 as shown.  K1 is shown de-energized.", "With K1 de-energized and, K2 and K3 energized, which input signal is sent to K2?  K1 is shown de-energized, K2 and K3 are shown energized.", "25. Ensure S1 is ON. 26. Release S3. Notice that K3 stayed energized as shown...................", "27. Place S1 to OFF. Notice that K1 and K3 de-energized as indicated by the illumination of LED 1. The latching voltage was removed. K1, K2 and K3 are shown de-energized.", "28. Place S2 ON and press and hold S3. Ensure S1 is OFF. This energizes K2 and K3 as shown. K1 is shown de-energized.", "With K1 de-energized and, K2 and K3 energized, which input signal is sent to K2? K1 is shown de-energized, K2 and K3 are shown energized."], "jumps": ["P13810", "P13740", "P13820", "P13830"]}, {"id": "P13831", "text": [], "jumps": []}, {"id": "P13832", "text": ["K1 controls the input signal that is routed to K2.  If K1 is energized, -12 V is applied. If K1 is de-energized +12 V is applied.", "With K2 and K3 energized as shown, where is the +12 V signal applied?", "K1 controls the input signal that is routed to K2. If K1 is energized, -12 V is applied. If K1 is de-energized +12 V is applied."], "jumps": ["P13830"]}, {"id": "P13841", "text": [], "jumps": []}, {"id": "P13842", "text": ["With K2 and K3 energized, the flow is from TP7, TP8, TP14, and TP15.", "With K2 and K3 energized, the flow is from TP7, TP8, TP14, and TP15.5.", "-energized, K2 and K3 are shown energized.", "29. Trace the +12 V from TP2 to TP15 using your multimeter. K1 is shown de-energized. K2 and K3 are shown energized."], "jumps": ["P13860", "P13840"]}, {"id": "P13860", "text": ["30.  Measure the voltage at TP's 6, 11, and 13.  Notice that you                measured 0 V. With K1 de-energized (as shown) and K2, K3           energized (as shown) the contact at TP6 and TP13 are open.          When the contact at TP6 is open there is no voltage applied           to TP11.", "30. Measure the voltage at TP's 6, 11, and 13. Notice that you measured 0 V. With K1 de-energized (as shown) and K2, K3 energized (as shown) the contact at TP6 and TP13 are open. When the contact at TP6 is open there is no voltage applied to TP11......"], "jumps": ["P13870", "P13850"]}, {"id": "P13870", "text": ["With +12V applied to D10 and D11, D10 is forward biased and illuminates LED 7 as seen on the card."], "jumps": ["P13880", "P13850"]}, {"id": "P13880", "text": ["Notice the latching voltage from K2 and K3."], "jumps": ["P13890", "P13850"]}, {"id": "P13890", "text": ["31.  Release S3. K3 stays energized (as shown) due to the                      latching voltage from K2.", "31. Release S3. K3 stays energized (as shown) due to the latching voltage from K2."], "jumps": ["P13900", "P13850"]}, {"id": "P13900", "text": ["32.  Depress S3 to ON. \n33.  Place S2 to OFF.  \n        K2 stays energized (as shown) due to the latching voltage              from K3.", "34.  Place S2 to ON.  Ensure S3 is depressed. \n35.  Place S1 to ON.  This energizes K1, K2, and K3 as shown.", "32. Depress S3 to ON. 33. Place S2 to OFF. K2 stays energized (as shown) due to the latching voltage from K3................", "34. Place S2 to ON. Ensure S3 is depressed. 35. Place S1 to ON. This energizes K1, K2, and K3 as shown..."], "jumps": ["P13910", "P13850", "P13920"]}, {"id": "P13920", "text": ["The path is the same as before, only -12 V is applied to K2."], "jumps": ["P13930", "P13910"]}, {"id": "P13930", "text": ["36.  Trace the signal from TP4 to TP15 using your multimeter.", "36. Trace the signal from TP4 to TP15 using your multimeter."], "jumps": ["P13940", "P13910"]}, {"id": "P13940", "text": ["37.  Measure the voltage at TP's 6, 11, and 13.  Notice that you                measured 0 V. The contacts at TP6 and TP13 are open and             there is no voltage present at TP11.", "37. Measure the voltage at TP's 6, 11, and 13. Notice that you measured 0 V. The contacts at TP6 and TP13 are open and there is no voltage present at TP11."], "jumps": ["P13950", "P13910"]}, {"id": "P13950", "text": ["With -12V applied to D10 and D11, D11 is forward biased and illuminates LED 8 as seen on the card."], "jumps": ["P13960", "P13910"]}, {"id": "P13960", "text": ["With K1 energized as shown, the latching voltage is applied to both K2 and K3."], "jumps": ["P13970", "P13910"]}, {"id": "P13970", "text": ["38.   Ensure S1 is ON. \n39.   Place S2 to OFF and release S3.\n         Notice that K2 and K3 stayed energized as shown.", "40.  Place S1 to OFF. You have traced the two input signals, \n       +12 V and -12 V, through the relay circuit in all conditions.", "38. Ensure let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
