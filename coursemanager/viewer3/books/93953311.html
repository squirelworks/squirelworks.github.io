s": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will determine if a zener diode voltage regulator circuit and a variable voltage regulator circuit is faulted and if so, what the fault is."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["A multimeter is used to determine if the voltage regulator circuit is operating correctly by comparing calculated and measured Eout."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The output voltage measurement will indicate several probable faults."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Measuring the circuit's voltage drops and component resistances will determine which component is faulted."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Let's begin the lesson on VOLTAGE REGULATOR TROUBLESHOOTING PRACTICE........"], "jumps": ["P430"]}, {"id": "P13080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13060"]}, {"id": "P13090", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": []}, {"id": "P13094", "text": ["3.  Carefully plug PC130-25 into the Test Console PC2 position.", "3. Carefully plug PC130-25 into the Test Console PC2 position.3. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P13100"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to give you practice in determining if a zener diode voltage regulator circuit is operating normally and if not, to determine the faulty component."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P1040", "text": ["In this experiment, you will use two PC cards. One is a rectifier and the other is the zener diode voltage regulator. Faults are inserted into the voltage regulator only."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Pick up the PC130-25 card. This card is used to practice troubleshooting a zener diode voltage regulator circuit and is placed in the PC2 position."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Let's set up the test console and cards before starting the troubleshooting practice."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P1060"]}, {"id": "P1090", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P1080"]}, {"id": "P1092", "text": ["Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, disregard graphic and caution below.", "Ensure the two jumpers are placed vertically between the top and middle jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, disregard graphic and caution below...", "Jumpers that have not been installed correctly on the PC130-23 card may cause damage to the board circuitry. Do not connect the oscilloscope ground to pins G or H......................."], "jumps": ["P1090"]}, {"id": "P1094", "text": ["3.  Carefully plug PC130-25 into the Test Console PC2 position.", "3. Carefully plug PC130-25 into the Test Console PC2 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": ["P1092"]}, {"id": "P1100", "text": ["4.  Set the PC130-23 as follows:\n     This sets up the rectifier for full wave and allows the output to       be connected to the PC130-25 card.", "4. Set the PC130-23 as follows: This sets up the rectifier for full wave and allows the output to be connected to the PC130-25 card. External program = SCAN FTR 0 C1 00 External program = SCAN FTR 0 F1 14 m = SCAN FTR 0 C1 00 External program = SCAN FTR 0 F1 14", "a. Place S1 and S2 to IN. b. Place S3 to the right. c. Place S4, S5 and S6 to OUT............"], "jumps": ["P1094", "P1105"]}, {"id": "P1105", "text": ["SWITCH POSITIONS - Carefully place S1 and S2 to IN (right). Carefully place S3 to the right. Carefully place S4, S5 and S6 to OUT (down)."], "jumps": []}, {"id": "P1110", "text": ["5.  On PC130-25 place S1, S2 and S3 to OUT.  S1 OUT                            disconnects the load from the emitter of Q1.", "5. On PC130-25 place S1, S2 and S3 to OUT. S1 OUT disconnects the load from the emitter of Q1."], "jumps": ["P1130", "P1100", "P1115"]}, {"id": "P1115", "text": ["SWITCH POSITIONS - Carefully place S1, S2 and S3 to the OUT (down) position."], "jumps": []}, {"id": "P1130", "text": ["6.  Set PC1 AC Power to ON.", "6. Set PC1 AC Power to ON................................................."], "jumps": ["P1110"]}, {"id": "P1140", "text": ["7.  Measure the output voltage of the voltage regulator at \n     PC130-25 TP7.", "7. Measure the output voltage of the voltage regulator at PC130-25 TP7."], "jumps": ["P1150", "P1130", "P1145"]}, {"id": "P1145", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP7."], "jumps": []}, {"id": "P1150", "text": ["You should have measured approximately 7.6 VDC.", "You should have measured approximately 7.6 VDC............."], "jumps": ["P1160", "P1140", "P1155"]}, {"id": "P1155", "text": ["MEASUREMENT SETUP - If your measurement is incorrect, there may be a problem with the card or your setup. Ensure your setup is correct and that you are using the multimeter correctly. Then check with your instructor."], "jumps": []}, {"id": "P1160", "text": ["The zener diode voltage regulator circuit is operating correctly.  The computer may now insert a fault. Use a multimeter to determine if the circuit is faulted and then determine the faulty component.", "The zener diode voltage regulator circuit is operating correctly. The computer may now insert a fault. Use a multimeter to determine if the circuit is faulted and then determine the faulty component..."], "jumps": ["P1150"]}, {"id": "P1210", "text": ["1.  Measure the output voltage on PC130-25 TP7. \n     Is the voltage regulator operating correctly?", "1. Measure the output voltage on PC130-25 TP7. Is the voltage regulator operating correctly?"], "jumps": ["P1215"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["The output voltage should be approximately 7.6 V. You should have measured approximately 20 V. This indicates that the circuit is not operating correctly."], "jumps": []}, {"id": "P1215", "text": ["MEASUREMENT SETUP - Place multimeter test lead on TP7."], "jumps": []}, {"id": "P1220", "text": ["2.  Measure the collector, base and emitter voltages of Q1 and the      voltage drops across R1 and D1.", "2. Measure the collector, base and emitter voltages of Q1 and the voltage drops across R1 and D1..", "R1 = TP4 to TP3 D1 = TP3 to TP1 TP4 = COLLECTOR TP5 = BASE TP7 = EMITTER"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Using the measured voltages, what are the probable faults?", "Using the measured voltages, what are the probable faults?."], "jumps": ["P1220"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["Remember, an open component measures the applied voltage and a short atulations, you have correctly determined that there are no faults."], "jumps": ["P13610"]}, {"id": "P14020", "text": ["The purpose of this experiment is to give you practice in determining if a variable voltage regulator circuit is operating normally and if not, to determine the faulty component."], "jumps": ["P14030", "P2001"]}, {"id": "P14030", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P14040", "text": ["In this experiment, you will use two PC cards. One is a rectifier and the other is the variable voltage regulator. Faults are inserted into the voltage regulator only."], "jumps": ["P14050", "P14030"]}, {"id": "P14050", "text": ["Pick up the PC130-23 card and compare it to the schematic shown. This card is used as the rectifier and is placed in the PC1 position."], "jumps": ["P14060", "P14040"]}, {"id": "P14060", "text": ["Pick up the PC130-26 card. This card is used to practice troubleshooting a variable voltage regulator circuit and is placed in the PC2 position."], "jumps": ["P14070", "P14050"]}, {"id": "P14070", "text": ["Let's set up the test console and cards before starting the troubleshooting practice."], "jumps": ["P14080", "P14060"]}, {"id": "P14080", "text": ["1.  Set the Test Console controls to their initial control settings.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P14060"]}, {"id": "P14090", "text": ["2.  Carefully plug PC130-23 into the Test Console PC1 position.", "2. Carefully plug PC130-23 into the Test Console PC1 position. Carefully plug PC130-25 into the Test Console PC2 position."], "jumps": []}, {"id": "P14092", "text": ["Ensure the two jumpers are placed vertically between the middle and bottom jumpers located in the upper left hand corner of the PC130-23 card. Jumpers on the PC130-23 card may not be available, if so, contact your instructor.", "Ensure the two jumpers are placed vertically between the middle and bottom jum let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
