const book = {"title": "9395T301", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO ROTATING MACHINERYasdf asdf sadf"], "jumps": []}, {"id": "P2510", "text": ["P = E x Ie Counter Electromotive Force Loads Power Efficiency", "In electrical circuits, power equals the voltage (force) times the current (quantity of electrons flowing) and is measured in watts......."], "jumps": ["P2520", "P2500"]}, {"id": "P100", "text": ["w Describe the various devices that are called rotating machinery.", "2. Characteristics of Rotating Machinery", "Electromotive Force (CEMF), Loads, Power, and Efficiency in rotating machinery.", "w Describe Speed, Torque, Counter Electromotive Force (CEMF), Loads, Power, and Efficiency in rotating machinery."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["You are probably asking yourself why must you study mechanical devices as an electronic technician?"], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The answer is simple; a lot of electronic equipment uses rotating machinery.", "Examples of equipment using rotating machinery are: VCR's, DVD's, tape players, electronic toys, CD's and radar systems....."], "jumps": ["P420", "P400", "P430"]}, {"id": "P430", "text": ["In today's electronic systems it is almost impossible to separate electronic circuits from mechanical devices."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Even the computer you are using has a rotating machine! Its used in the hard disk or disk drive.."], "jumps": ["P450", "P420"]}, {"id": "P450", "text": ["By understanding rotating machinery you will be a more proficient technician."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's begin the lesson on INTRODUCTION TO ROTATING MACHINERY................"], "jumps": ["P450"]}, {"id": "P900", "text": ["2. Characteristics of Rotating Machinery"], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["A rotating machine is any device that has a spinning, or rotating shaft and uses electricity as the input or output."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Generally, the word motor is used to describe rotating machinery."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["Rotating machinery is more than just motors................"], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["Rotating machinery is divided into two general categories: Motors and Generators."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["A motor is a device that uses an electrical input and converts it to a mechanical output."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["A generator is a device that uses a mechanical input and converts it to an electrical output."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["Rotating machinery consists of only motors................."], "jumps": ["P1030"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["Rotating machinery contains other devices besides motors..."], "jumps": []}, {"id": "P1080", "text": ["A generator is a rotating machine that uses _______........", "an electrical input and has a mechanical output......", "a mechanical input and has a mechanical output......", "a mechanical input and has an electrical output......"], "jumps": ["P1070"]}, {"id": "P1081", "text": [], "jumps": []}, {"id": "P1082", "text": ["A device that uses an electrical input and has a mechanical output is called a motor..."], "jumps": []}, {"id": "P1083", "text": ["A device that uses a mechanical input and has a mechanical output is not a generator or motor."], "jumps": []}, {"id": "P1090", "text": ["Motors are divided into two types, Incremental and Continuous."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": [], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["An incremental motor is one in which the electrical input causes the shaft to rotate a specific distance in degrees."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["A digital incremental motor, or stepper motor, uses digital pulses to position the shaft."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["One pulse (P1) will rotate the shaft a specific distance and then the rotation stops."], "jumps": ["P1140", "P1120", "P1"]}, {"id": "P1140", "text": ["The second pulse (P2) will again rotate the shaft a specific distance and then the rotation stops."], "jumps": ["P1150", "P1130", "P2"]}, {"id": "P1150", "text": ["The analog motor, or synchro motor, uses a specific magnitude of voltage to position the shaft."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["One level of voltage will rotate the shaft a specific distance and then the rotation stops."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Another level of voltage will rotate the shaft another specific distance and then rotation stops.", "An example of an incremental motor is a radar antenna. The motor positions the antenna vertically (elevation) and horizontally (azimuth) in increments of degrees."], "jumps": ["P1180", "P1150", "P1190"]}, {"id": "P1190", "text": ["Now, let's look at the continuous motor...................."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["The shaft of a continuous motor rotates smoothly without interruption when the input is applied."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["A DC continuous motor uses a DC voltage as the electrical input."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["An AC continuous motor uses an AC voltage as the electrical input."], "jumps": ["P1230", "P1200"]}, {"id": "P1240", "text": ["What type of incremental motor uses digital pulses as the electrical input?"], "jumps": ["P1230"]}, {"id": "P1240", "text": ["What type of incremental motor uses digital pulses as the electrical input?"], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["A Synchro uses a specified magnitude of voltage to rotate the motors shaft. A voltage magnitude is an analog signal, not digital pulses."], "jumps": []}, {"id": "P1243", "text": ["A generator converts mechanical motion to electrical signals.generator converts mechanical motion to electrical signals..."], "jumps": []}, {"id": "P1250", "text": ["Generators are also divided into two types, DC and AC......"], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": [], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["A mechanical input rotates the generator's shaft producing a DC voltage .utput."], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["An example of a DC generator is the device that generates the power for spark plugs and lights in an automobile."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The AC generator produces AC voltage......................."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["A mechanical input rotates the generator's shaft producing an AC voltage output."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["An example of an AC generator is the device that generates the power supplied to your home."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["What type of generator is used to supply alternating current?"], "jumps": ["P1300"]}, {"id": "P1321", "text": [], "jumps": []}, {"id": "P1322", "text": ["Alternating current (AC) is not produced by a DC generator."], "jumps": []}, {"id": "P1323", "text": ["A stepper is an incremental digital motor, it is not a generator."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ROTATING MACHINERY......."], "jumps": ["P1001", "P1320"]}, {"id": "P1920", "text": ["1. A rotating machine is any device that has a spinning, or rotating shaft and uses electricity as the input or output."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Rotating machinery is divided into two general categories."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Motors have an electrical input and a mechanical output."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. An incremental motor is one in which the shaft rotates a specific distance in degrees depending on the electrical input."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. There are two types of incremental motors: Digital Stepper motors and Analog Synchro motors.."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. A continuous motor is one in which the shaft rotates continuously. There are DC and AC continuous motors."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Generators have a mechanical input and an electrical output."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8. There are AC and DC generators........................."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Motors and generators are basically made the same. They both operate using magnetism and have the same characteristics.are the same.."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The characteristics to be discussed are:...................", "Speed Torque Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P2040", "P2015"]}, {"id": "P2040", "text": [], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["The speed of a motor or generator describes how fast the shaft rotates."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["The term used to describe speed is Revolutions Per Minute (RPM) or Revolutions Per Second (RPS)."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["100 complete revolutions in one minute = 100 RPM", "For example, if a motor's shaft makes 100 complete revolutions (100 full 360 degree rotations of the shaft) in one minute, the speed is 100 RPM."], "jumps": ["P2080", "P2050"]}, {"id": "P2080", "text": ["In motors, the RPM is determined by the amount of voltage applied."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["If the input voltage increases, the output RPM increases."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["If the input voltage decreases, the output RPM decreases."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["The RPM of a generator is determined by the mechanical RPM input. This mechanical input determines the generators output voltage."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["If the input RPM increases, the output voltage increases."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["If the input RPM decreases, the output voltage decreases."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["Speed Torque Counter Electromotive Force Loads Power Efficiency", "The next characteristic is Torque. raphic Text) Speed Torque Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["Torque is the twisting force that causes the shaft of the motor or generator to rotate."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Note that even if the shaft of the device is not allowed to rotate, torque is still present."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Think of torque as voltage, the force that moves electrons."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["If a complete path for electron flow is not present, the voltage, or force, is still present."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The term used to describe torque is foot pound. It is abbreviated Ft"], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["Torque in a motor is equal to the voltage and current supplied by an external source. This voltage and current produce the magnetism that supplies torque."], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["T = Torque L = Length of Shaft F = Force Applied T = F x LLLLLLL", "In a generator, torque equals the force applied to a point (F) times the distance from the center of the shaft (L)."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Torque is inversely proportional to RPM. If RPM increases, Torque decreases and if RPM decreases, Torque increases."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["You may have seen this relationship if you have ever drilled a hole in a board and the drill bit gets stuck. The drill either twists your wrist or twists out of your hand."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The RPM (rotation of the drill bit) decreases to 0 and torque increases to maximum."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["Speed Torque Counter Electromotive Force Loads Power Efficiency", "To better understand the relationship between RPM and Torque, you must learn about the characteristic called Counter Electromotive Force or CEMF."], "jumps": ["P2270", "P2230"]}, {"id": "P2270", "text": ["Counter Electromotive Force is produced by the rotation of the motor's shaft."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["When the shaft of a motor is rotating, the rotation develops a voltage, just like a generator..."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["The voltage generated opposes the voltage applied. This is why it's called Counter Electromotive Force."], "jumps": ["P2300", "P2270"]}, {"id": "P2300", "text": ["As RPM increases, CEMF increases. Just as in a generator, when RPM increases, the voltage produced increases."], "jumps": ["P2310", "P2270"]}, {"id": "P2310", "text": ["As RPM decreases, CEMF decreases. Just as in a generator, when RPM decreases, the voltage produced decreases."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Since torque in a motor depends on the applied voltage and current, and CEMF opposes the applied voltage, as RPM increases CEMF increases and torque decreases."], "jumps": ["P2340", "P2310"]}, {"id": "P2340", "text": ["If RPM decreases, CEMF decreases which increases torque...."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["If a generator's input RPM's increase what happens to the output voltage?"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["If the input RPM increases, the output voltage increases."], "jumps": []}, {"id": "P2360", "text": ["As a motor's input voltage decreases what happens to RPM's?"], "jumps": ["P2350"]}, {"id": "P2361", "text": [], "jumps": []}, {"id": "P2362", "text": ["If the input voltage increases, the output RPM increases.ses."], "jumps": []}, {"id": "P2370", "text": ["In a motor, if RPM decreases, what happens to CEMF?........"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2372", "text": ["RPM and CEMF of a motor are directly proportional. This means as one increases, the other increases."], "jumps": []}, {"id": "P2380", "text": ["In a motor, if CEMF decreases what happens to torque?......"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["CEMF and Torque of a motor are inversely proportional. This means as one increases, the other decreases."], "jumps": []}, {"id": "P2390", "text": ["The next characteristic is Loads...........................", "Speed Torque Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["Because of their frequent use a technician must understand how a load affects rotating machinery."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["In motors, the load is driven by the rotating shaft."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The load can be a record player, tape player, computer disk, radar antenna, fan blades, or any other device that requires motion."], "jumps": ["P2430", "P2400"]}, {"id": "P2430", "text": ["In generators, the loads are electrical circuits."], "jumps": ["P2440", "P2400"]}, {"id": "P2440", "text": ["Electric loads are circuits that require power. An example of an electric load is the lights in your house.r a telephone system."], "jumps": ["P2450", "P2400"]}, {"id": "P2450", "text": ["In all cases, applying a load to a motor or generator decreases RPM. Reducing a load increases RPM.", "You may have seen this effect in a battery operated toy car.", "Note, most motor and generator systems use automatic speed control to counter the effects of loads."], "jumps": ["P2460", "P2400", "P2470", "P2450", "P2490"]}, {"id": "P2490", "text": ["The next characteristic is Power...........................", "Speed Torque Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P2500", "P2460"]}, {"id": "P2500", "text": ["Power is the amount of work that is accomplished..........."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["In electrical circuits, power equals the voltage (force) times the current (speed of electrons) and is measured in watts.", "P = E x Ie Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P2520", "P2500"]}, {"id": "P2520", "text": ["In motors and generators, mechanical power equals the torque (force) times the RPM (speed of shaft) times the constant (K). K represents the construction characteristics for the motor or generator. For ease of calculations the most commonly used value for K is one..", "P = Torque x RPM x KKtromotive Force Loads Power Efficiency"], "jumps": ["P2530", "P2510"]}, {"id": "P2530", "text": ["Power in motors and generators is given in foot pounds per second, Ft"], "jumps": ["P2550", "P2520"]}, {"id": "P2550", "text": ["Electrical and mechanical power are directly proportional to load."], "jumps": ["P2560", "P2520"]}, {"id": "P2560", "text": ["If a load increases, RPM decreases, CEMF decreases, torque increases, and power increases."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["Note that mechanical power equals RPM times torque and the increase in torque overcomes the decrease in RPM."], "jumps": ["P2580", "P2550"]}, {"id": "P2580", "text": ["If a load decreases, RPM increases, CEMF increases, torque decreases, and power decreases."], "jumps": ["P2590", "P2550"]}, {"id": "P2590", "text": ["The last characteristic is Efficiency......................", "Speed Torque Counter Electromotive Force Loads Power Efficiency"], "jumps": ["P2600", "P2580"]}, {"id": "P2600", "text": ["Motor efficiency, is a rating of how well the motor is able to change electrical power into mechanical power."], "jumps": ["P2610", "P2590"]}, {"id": "P2610", "text": ["Generator efficiency, is a rating of how well the generator is able to change mechanical power into electrical power."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["Efficiency is found by dividing the output power by the input power.", "Pin x 100 .PM x Kads Power Efficiency"], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["The input power to a motor is electrical and the output power is mechanical. Th let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
