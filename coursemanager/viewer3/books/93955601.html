48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe the DC Series Field Motor. w Describe the DC Shunt Field Motor. w Describe the DC Compound Field Motor. w Describe basic DC Motor action."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about DC Motors."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["DC Motors represent a large portion of Rotating Machinery.."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["Many of today's most common devices use DC Motors.........."], "jumps": ["P410", "P430"]}, {"id": "P430", "text": ["There are three basic types of DC Motors: Shunt, Series and Compound.  Their principles of operation are quite similar.", "There are three basic types of DC Motors: Shunt, Series and Compound. Their principles of operation are quite similar."], "jumps": ["P420", "P436"]}, {"id": "P436", "text": ["You will be introduced to all three types of DC Motors."], "jumps": ["P430", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on DC MOTOR.ITLE..................................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Electric motors are devices that convert electrical energy into mechanical energy."], "jumps": ["P1001", "P1030"]}, {"id": "P1030", "text": ["One type of electric motor is called the DC Motor."], "jumps": ["P1020", "P1040"]}, {"id": "P1050", "text": ["The DC Motor uses Direct Current (DC) as its electrical power supply."], "jumps": ["P1020", "P1450"]}, {"id": "P1060", "text": ["Let's see the basic principles of DC Motor action."], "jumps": ["P1020", "P1460"]}, {"id": "P1070", "text": ["First, a magnetic field is produced using two magnets. S N S N"], "jumps": ["P1470", "P1020"]}, {"id": "P1080", "text": ["Note that the magnets are not allowed to attract each other."], "jumps": ["P1070", "P1480"]}, {"id": "P1090", "text": ["A rotating magnet is placed between the other two magnets. vot"], "jumps": ["P1490", "P1070"]}, {"id": "P1100", "text": ["Because like poles repel and unlike poles attract, the center magnet rotates."], "jumps": ["P1500", "P1070"]}, {"id": "P1110", "text": ["The attraction of unlike poles causes the center magnet to stop."], "jumps": ["P1520", "P1070"]}, {"id": "P1120", "text": ["When the poles of the center magnet change, rotation will occur."], "jumps": ["P1530", "P1070"]}, {"id": "P1130", "text": ["By continually changing the poles of the center magnet, motor action occurs."], "jumps": ["P1540", "P1070"]}, {"id": "P1140", "text": ["This is basic motor action. However, the center magnet can not be a permanent magnet..anent magnet."], "jumps": ["P1550", "P1070"]}, {"id": "P1150", "text": ["Since the poles of a permanent magnet can't be changed, an electromagnet is used."], "jumps": ["P1070", "P1570"]}, {"id": "P1160", "text": ["By reversing the DC current flow, the center magnet changes poles.", "SSSSSSSSSSSSSSSSSSSSSSSSSSSSSS SSSSSSSSSSSSSSSSSSSSSSSSSSSSSS"], "jumps": ["P1580", "P1070"]}, {"id": "P1170", "text": ["The center electromagnet is called the Armature or Rotor.", "******* 4SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS4 ******", "k******* eyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy4 ******", "ppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppppe >>>>>>", "iiiiiiiiii rKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKK", "<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<r !!!!!!", "4SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS6 ###########################", "SSSSSSSSSSSSSSSSSSSSSSSSSSSSSS SSSSSSSSSSSSSSSSSSSSSSSSSSSSSS"], "jumps": ["P1590", "P1070", "P"]}, {"id": "P1180", "text": ["The actual construction of the DC Motor shows the armature as a coil."], "jumps": ["P1070", "P1600"]}, {"id": "P1190", "text": ["The armature is connected to the voltage source, Varm, through brushes and commutator."], "jumps": ["P1170", "P1610"]}, {"id": "P1200", "text": ["The commutator rotates along with the armature. The brushes connect the commutator to Varm."], "jumps": ["P1170", "P1620"]}, {"id": "P1210", "text": ["This allows the direction of current flow to change each 180", "of rotation, reversing the poles in the armature.."], "jumps": ["P1170"]}, {"id": "P1220", "text": ["Because the poles in the armature reverse, motor action occurs."], "jumps": ["P1230"]}, {"id": "P1230", "text": ["Since DC is applied, the rotating machine is a DC Motor."], "jumps": ["P1220", "P1650"]}, {"id": "P1240", "text": ["The schematic symbol for this type of DC Motor shows the armature and brushes."], "jumps": ["P1220", "P1660"]}, {"id": "P1250", "text": ["It is called a permanent magnet DC Motor because the armature is placed between two permanent magnets."], "jumps": ["P1240", "P1670"]}, {"id": "P1260", "text": ["The permanent magnets are called the Stator."], "jumps": ["P1250", "P1680"]}, {"id": "P1270", "text": ["Stator Coil or Field Coil", "The most commonly used type of DC Motor is the electromagnetic design."], "jumps": ["P1690"]}, {"id": "P1280", "text": ["Instead of a permanent magnet stator, an electromagnet stator is used."], "jumps": []}, {"id": "P1290", "text": ["The coils around the stator are the field windings........."], "jumps": []}, {"id": "P1300", "text": ["The field windings connect to the same power source as the armature windings (or rotor windings)."], "jumps": ["P1050"]}, {"id": "P1310", "text": ["The way the field windings are connected produces the three types of Electromagnetic DC Motors."], "jumps": ["P1070"]}, {"id": "P1320", "text": ["The field coil windings of a DC Motor are represented as an inductor."], "jumps": []}, {"id": "P1330", "text": ["The schematic symbol for a basic Electromagnetic DC Motor shows the brushes, armature, and field coil."], "jumps": []}, {"id": "P1340", "text": ["The DC Shunt Field Motor shows the field coil in parallel with the armature."], "jumps": ["P1330", "P1170"]}, {"id": "P1350", "text": ["The DC Series Field Motor shows the field coil in series with the armature."], "jumps": ["P1180"]}, {"id": "P1360", "text": ["The Compound Motor contains a Shunt and Series Field Coil.", "The Compound Motor contains a Shunt and Series Field Coil.."], "jumps": []}, {"id": "P1370", "text": ["The Compound Motor has two basic configurations: Long and Short Shunt."], "jumps": []}, {"id": "P1380", "text": ["The Long Shunt Compound Motor has the Shunt Coil in parallel to the Series Field Coil and Armature."], "jumps": []}, {"id": "P1390", "text": ["The Short Shunt Compound Motor has the Shunt Coil in parallel with the armature only."], "jumps": []}, {"id": "P1400", "text": ["Which schematic illustrates a DC Shunt Field Motor:........"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["The schematic you selected represents a DC Series Motor. Notice the coil is in series with the armature."], "jumps": []}, {"id": "P1403", "text": ["The schematic you selected is configured as a Short Shunt Compound Motor. The shunt coil is in parallel with the armature and there is also a series coil shown."], "jumps": []}, {"id": "P1410", "text": ["A long shunt DC Motor has a Shunt Coil in parallel with _______"], "jumps": ["P1400"]}, {"id": "P1411", "text": [], "jumps": []}, {"id": "P1412", "text": ["A Short Shunt Compound Motor has a Shunt Field Coil in parallel with the armature only."], "jumps": []}, {"id": "P1413", "text": ["The Shunt Field Coil must be placed either in parallel or in series with the armature."], "jumps": []}, {"id": "P1420", "text": ["To vary the speed of a DC Shunt Motor, the current through the armature (IA) or the current through the Field Coil (IF) must be varied."], "jumps": ["P1250"]}, {"id": "P1430", "text": ["By varying the armature voltage (Varm), IA and IF can be varied."], "jumps": ["P1420", "P1260"]}, {"id": "P1440", "text": ["The Field Current (IF) can also be controlled by placing a variable resistor in series with the Shunt Field Coil."], "jumps": ["P1270"]}, {"id": "P1450", "text": ["The DC Series motor speed can also be varied by changing the armature voltage, (Varm or the field current (IF))."], "jumps": ["P1280"]}, {"id": "P1460", "text": ["When the armature voltage is varied, current flowing through the Series Field Coil will vary."], "jumps": []}, {"id": "P1470", "text": ["By placing a variable resistor in parallel with the Series Field Coil, the coil current (IF) can also be varied."], "jumps": []}, {"id": "P1480", "text": ["The Long Shunt Compound DC Motor incorporates both the Shunt and Series Motor speed control techniques."], "jumps": []}, {"id": "P1490", "text": ["Varm can be varied to change both Shunt IF and Series IF."], "jumps": []}, {"id": "P1500", "text": ["The most common technique for varying field currents (IF) is to place variable resistors in the circuit."], "jumps": ["P1480", "P1330"]}, {"id": "P1510", "text": ["Vary the current through either the armature or the coil.", "How is speed control performed in a DC Motor?.............."], "jumps": ["P1480"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["Varying the current through the coil controls motor speed, but there is also another way to control speed."], "jumps": []}, {"id": "P1513", "text": ["Varying the current through the armature controls motor speed, but there is also another way to control speed."], "jumps": []}, {"id": "P1520", "text": ["What is the most commonly used component to vary the current through the coil of a DC Motor?"], "jumps": ["P1510"]}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1522", "text": ["A variable current source would work but it is not the most common technique used."], "jumps": []}, {"id": "P1523", "text": ["A variable voltage source would work, but it is not the most common technique used."], "jumps": []}, {"id": "P1530", "text": ["Each of the DC Motors has a specific application.", "Each of the DC Motors has a specific application..........."], "jumps": ["P1520", "P1360"]}, {"id": "P1540", "text": ["For example, the Shunt Motor is used when high speed and constant torque are required."], "jumps": ["P1530", "P1370"]}, {"id": "P1550", "text": ["The Shunt Motor also has less torque when the Rotor is locked and no motor rotation is present."], "jumps": ["P1530", "P1380"]}, {"id": "P1560", "text": ["The Series Motor has less torque at higher speeds than the Shunt Motor."], "jumps": ["P1530", "P1390"]}, {"id": "P1570", "text": ["The Series Motor has more torque under locked Rotor conditions."], "jumps": ["P1530", "P1400"]}, {"id": "P1580", "text": ["You may have felt the pain of a twisted wrist due to high torque when a Series Motor is suddenly stopped."], "jumps": ["P1410"]}, {"id": "P1590", "text": ["Due to its high torque, a Series Motor is less likely to stall due to a heavy load."], "jumps": []}, {"id": "P1600", "text": ["A Compound Motor has the characteristics of both a Series and Shunt Motor."], "jumps": ["P1430"]}, {"id": "P1610", "text": ["The Compound Motor can be configured to exhibit good torque at high speeds and under locked rotor conditions."], "jumps": []}, {"id": "P1620", "text": ["In the next three lessons, you will study the three types of DC Motors individually."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on DC MOTORS.1 TITLE........"], "jumps": ["P1001"]}, {"id": "P1920", "text": ["1. DC Motors operate using direct current to produce mechanical energy."], "jumps": ["P1001", "P1930"]}, {"id": "P1930", "text": ["2. The electromagnet type of DC Motor incorporates a field coil to produce the field lines needed for motor action."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. A typical Electromagnet DC Motor schematic shows the brushes, armature and field coil."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. There are three types of DC Motors, Shunt, Series and Compound Motor."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. The Shunt Motor has the field coil in parallel with the armature. The Series Motor has the coil in series with the armature."], "jumps": ["P1950", "P1970"]}, {"id": "P1970", "text": ["6. The Compound Motor incorporates both the Series and Shunt Motor characteristics."], "jumps": ["P1960", "P1980"]}, {"id": "P1980", "text": ["7. Speed control can be obtained by varying either the armature voltage or the current through the field coils."], "jumps": ["P1970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1980", "P1001"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["The principal that electrical energy produces mechanical energy"], "jumps": []}, {"id": "P10211 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");

      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);

}
