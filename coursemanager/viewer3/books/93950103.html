const book = {"title": "93950103", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FRACTIONSE sdf sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe Fractions. w Describe proper and improper fractions.........", "w Change improper fractions to whole numbers or mixed numbers. w Change mixed numbers to improper fractions. w Reduce fractions to the lowest terms...."], "jumps": []}, {"id": "P400", "text": ["A fraction is a piece or part of something."], "jumps": ["P410", "P100"]}, {"id": "P410", "text": ["A whole number represents a complete or entire quantity."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Fractions are needed to measure quantities less than whole numbers."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Examples of fractions are:", "Examples of fractions are:nches in a foot Minutes in an hour Pints in a quart"], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["This lesson is about FRACTIONS.ON TITLE.NUITY AND INFINITY................"], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Fractions are numbers that represent part of a whole.", "Fractions are numbers that represent part of a whole......."], "jumps": ["P1030", "P1001"]}, {"id": "P1025", "text": ["For example, consider this cherry pie as a whole."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["If you ate half of the pie, how would you express what you ate?"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The fraction indicates the whole and how much of the whole you ate."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The number 2 indicates how many pieces into which the whole is divided. The number 1 indicates how many pieces were eaten."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The fraction states that the pie was divided into two, and you ate one of the halves."], "jumps": ["P1070", "P1020"]}, {"id": "P1070", "text": ["This fraction represents that the pie was divided into four pieces and you ate 3 of the four or three fourths."], "jumps": ["P1080", "P1020"]}, {"id": "P1080", "text": ["If you had a bag of eight oranges, and took five out, this is said to be five eighths of the bag."], "jumps": ["P1090", "P1020"]}, {"id": "P1090", "text": ["What fraction of the matches in the book are lit?", "What fraction of the matches in the book are lit?..........", "Five sevenths 5 7", "Two sevenths 2 7"], "jumps": ["P1080"]}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P1092", "text": ["Notice there are seven matches in the book and two are lit. 5/7 is the unused portion."], "jumps": []}, {"id": "P1100", "text": ["Like anything else in mathematics, there are names attached to fractions."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The 3 is called the numerator. It expresses the number of pieces you wish to indicate.  It is the top number.", "The 3 is called the numerator. It expresses the number of pieces you wish to indicate. It is the top number."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The 4 is called the denominator. It expresses the number of pieces into which the whole is divided. It is the bottom number."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["What is a number called that represents part of a whole?", "What is a number called that represents part of a whole?..."], "jumps": ["P1100"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["Remember a whole number represents an entire object or quantity."], "jumps": []}, {"id": "P1133", "text": ["Part of a whole number is not called a partial number.", "Part of a whole number is not called a partial number......"], "jumps": []}, {"id": "P1140", "text": ["Which is the denominator in this fraction?  5\n                                                                                 9", "Which is the denominator in this fraction? 5 99"], "jumps": ["P1130"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["You chose the number 5, it is the numerator. It indicates a specific number of a whole."], "jumps": []}, {"id": "P1150", "text": ["Which is the numerator in this fraction?   2\n                                                                             3", "Which is the numerator in this fraction? 2 33999"], "jumps": ["P1140"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["You chose the number 3, this is the denominator. It indicates the amount that a whole number is divided into."], "jumps": []}, {"id": "P1160", "text": ["There are two types of fractions, proper and improper.", "There are two types of fractions, proper and improper......"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Proper fractions are fractions which represent numbers LESS than one."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["In a proper fraction, the numerator is ALWAYS LESS than the denominator.  All these fractions are proper fractions.", "In a proper fraction, the numerator is ALWAYS LESS than the denominator. All these fractions are proper fractions."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Improper fractions are fractions having a numerator equal to or greater than the denominator."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Improper fractions represent numbers that are equal to or greater than one. All these fractions are improper fractions."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Which fractions are proper fractions?", "Which fractions are proper fractions?......................"], "jumps": ["P1190"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["4/3 and 8/5 are improper fractions. Notice the numerator is larger than the denominator."], "jumps": []}, {"id": "P1213", "text": ["4/3 is an improper fraction, notice the numerator is larger than the denominator."], "jumps": []}, {"id": "P1220", "text": ["Which fractions are improper fractions?", "Which fractions are improper fractions?...................."], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["6/5 is an improper fraction, but 2/3 is a proper fraction. Notice that 2 (numerator) is smaller than 3 (denominator)."], "jumps": []}, {"id": "P1223", "text": ["2/3 and 5/7 are both proper fractions, notice their numerators are smaller than their denominators."], "jumps": []}, {"id": "P1230", "text": ["Sometimes whole numbers and fractions are used together.", "Sometimes whole numbers and fractions are used together...."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["These numbers are called mixed numbers. This mixed number is one and one half."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The whole number is said first followed by AND then the fraction."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["All these fractions are mixed numbers.", "All these fractions are mixed numbers. 2/3 - Two and two thirds 9 4/5 - Nine and four fifths 1 3/4 - One and three fourths 10 2/9 - Ten and two ninths", "2 2/3 - Two and two thirds 9 4/5 - Nine and four fifths 1 3/4 - One and three fourths 10 2/9 - Ten and two ninthssssssss"], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["Which is the proper fraction?", "Which is the proper fraction?yped.........................."], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["1 1/2 is the mixed number, notice the whole number before the fraction."], "jumps": []}, {"id": "P1273", "text": ["2/1 is an improper fraction, notice the numerator is larger than the denominator."], "jumps": []}, {"id": "P1280", "text": ["Which is the improper fraction?", "Which is the improper fraction?ed.........................."], "jumps": ["P1270"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["1 1/2 is the mixed number, notice the 1 before the fraction."], "jumps": []}, {"id": "P1283", "text": ["1/2 is a proper fraction, notice the numerator and denominator."], "jumps": []}, {"id": "P1290", "text": ["Which is the mixed number?", "Which is the mixed number?s typed.........................."], "jumps": ["P1280"]}, {"id": "P1291", "text": [], "jumps": []}, {"id": "P1292", "text": ["2/1 is an improper fraction, notice the numerator and denominator."], "jumps": []}, {"id": "P1293", "text": ["1/2 is a proper fraction, notice the numerator and denominator."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on FRACTIONS.", "This completes the information on FRACTIONS.1 TITLE........"], "jumps": []}, {"id": "P1920", "text": ["1.  Fractions represent part of a whole.", "1. Fractions represent part of a whole.econd line here...."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The numerator is the top number in a fraction and is the                  number of parts you wish to indicate.", "2. The numerator is the top number in a fraction and is the number of parts you wish to indicate."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The denominator is the bottom number and is the number of          parts into which the whole is divided.", "3. The denominator is the bottom number and is the number of parts into which the whole is divided."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  In a proper fraction, the numerator is smaller than the                       denominator.", "4. In a proper fraction, the numerator is smaller than the denominator."], "jumps": ["P1960", "P1930"]}, {"id": "P1960", "text": ["5.  Improper fractions have numerators equal to or larger than            their denominators.", "5. Improper fractions have numerators equal to or larger than their denominators."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  Mixed numbers contain a whole number and a fraction.", "6. Mixed numbers contain a whole number and a fraction...."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Fractional numbers can be changed.", "Fractional numbers can be changed..........................", "Improper Fraction to Mixed Number", "Mixed Number to an Improper Fraction", "Proper Fraction Reduced nnnnnnnnn"], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["The fraction's form may need changing to add, subtract, multiply, or divide."], "jumps": ["P2030", "P2020"]}, {"id": "P2030", "text": ["There are three basic conversions you will need to know."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Let's start with changing improper fractions to mixed numbers.", "Mixed Number to an Improper Fraction", "Proper Fraction Reduced nnnnnnnnn"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Notice in this improper fraction that there are five fourths."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["You should see that four fourths makes a whole.", "1 whole nnnnnnnnn"], "jumps": ["P2065", "P2050"]}, {"id": "P2065", "text": ["If you divide 5 (numerator) by 4 (denominator), the result is more than 1 whole.", "1/4 of 2nd whole nnnnnnnnn"], "jumps": ["P2067", "P2050"]}, {"id": "P2067", "text": ["There is an extra 1/4 left over after 5 is divided by 4.", "There is an extra 1/4 left over after 5 is divided by 4...."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["This improper fraction reduces to 1 1/4."], "jumps": ["P2080", "P2067"]}, {"id": "P2080", "text": ["Dividing the numerator by the denominator is the easiest way to convert an improper fraction to a mixed number."], "jumps": ["P2090", "P2067", "P2085"]}, {"id": "P2085", "text": ["CONVERTING IMPROPER FRACTIONS TO MIXED NUMBERS Dividing the numerator by the denominator will result in a mixed number. Any remainder is put over the divisor."], "jumps": []}, {"id": "P2090", "text": ["Using division, divide the denominator into the numerator, or 3 into 5."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["The quotient becomes the whole number and the remainder becomes the proper fraction."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["In this example, the result is one and two thirds."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["Change this improper fraction to a mixed number.", "Change this improper fraction to a mixed number............"], "jumps": ["P2090"]}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2122", "text": ["The number 2 is part of the mixed number. You need to find the fraction."], "jumps": []}, {"id": "P2123", "text": ["You have not changed the fraction 11/5 to a mixed number correctly. Divide 11 by 5, the whole number is the quotient and the remainder is the fraction."], "jumps": []}, {"id": "P2130", "text": ["Change this improper fraction to a mixed number.", "Change this improper fraction to a mixed number............"], "jumps": ["P2120"]}, {"id": "P2131", "text": [], "jumps": []}, {"id": "P2132", "text": ["The whole number is correct but a mixed number should never have an improper fraction. 4/3 is an improper fraction."], "jumps": []}, {"id": "P2133", "text": ["4 2/3 is not the correct mixed number for the improper fraction 19/4. Check your subtraction."], "jumps": []}, {"id": "P2140", "text": ["Now let's change mixed numbers to improper fractions.", "Now let's change mixed numbers to improper fractions.......", "Improper Fraction to Mixed Number", "Mixed Number to an Improper Fraction", "Proper Fraction Reduced nnnnnnnnn"], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["To change a mixed number to an improper fraction requires that the whole number be changed to an improper fraction first, and then the proper fraction is added."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Since the proper fraction, 1/3, is in thirds, you must change the whole number into thirds."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Since there are 3 thirds in a whole, the number 2 has 6 thirds.", "1st whole nnnnnnnnn", "2nd whole nnnnnnnnn"], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Now, since the proper fraction is 1 third, the result is 7 thirds.", "3rd Whole nnnnnnnnn"], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["To prove the result, change 7/3 to a mixed number.", "To prove the result, change 7/3 to a mixed number.........."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["Let's look at another example.", "Let's look at another example.............................."], "jumps": ["P2210", "P2190", "P2205"]}, {"id": "P2205", "text": ["1. Change Whole Number to an Improper Fractionnnnnnnnnnnnnnnnnnnnn", "2. Add Improper & Proper Fractionsnnnnnnnnnnnnnnnnnnnnnnnnnn", "CONVERTING MIXED NUMBERS TO IMPROPER FRACTIONS Since the proper fraction is in fifths, change the whole number to fifths. Then add the proper fraction and the improper fraction, 20/5 + 3/5 = 23/5."], "jumps": []}, {"id": "P2210", "text": ["Multiplication can be used to quickly change mixed numbers to improper fractions."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["First multiply the denominator in the proper fraction by the whole number."], "jumps": ["P2210", "P2230"]}, {"id": "P2230", "text": ["Then add the result to the numerator of the proper fraction."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["The denominator of the improper fraction is the same as the mixed number fraction."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["Let's convert another mixed number to an improper fraction."], "jumps": ["P2260", "P2210"]}, {"id": "P2260", "text": ["First multiply 6 (whole number) by 5 (numerator) then add 3 (denominator).  Place 33 over the numerator 5.", "First multiply 6 (whole number) by 5 (numerator) then add 3 (denominator). Place 33 over the numerator 5."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["Change this mixed number to an improper fraction.", "Change this mixed number to an improper fraction..........."], "jumps": ["P2250"]}, {"id": "P2271", "text": [], "jumps": []}, {"id": "P2272", "text": ["4 3/4 does not equal 16/4. Remember to add the denominator with product."], "jumps": []}, {"id": "P2273", "text": ["4 3/4 does not equal 19/3. You used the wrong number for the denominator."], "jumps": []}, {"id": "P2280", "text": ["Change this mixed number to an improper fraction.", "Change this mixed number to an improper fraction..........."], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["1 7/9 does not equal 9/9. You forgot to add the numerator seven, with the product of one and nine."], "jumps": []}, {"id": "P2283", "text": ["1 7/9 does not equal 16/7. You used the wrong number for the denominator."], "jumps": []}, {"id": "P2290", "text": ["Now, let's reduce some fractions to their lowest terms.", "Now, let's reduce some fractions to their lowest terms.....", "Improper Fraction to Mixed Number", "Mixed Number to an Improper Fraction", "Proper Fraction Reduced nnnnnnnnn"], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["Study this fraction. The whole is divided into fourths and two of the fourths are indicated by the shaded area."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Notice that the shaded area is actually one half."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["This means that the fraction 2/4 is not in the lowest terms. It can be reduced to 1/2.", "This means that the fraction 2/4 is not in the lowest terms. It can be reduced to 1/2.."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["The method used is to divide the numerator and denominator by the same WHOLE number. In this case it is 2."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["In this example, the numerator and denominator are divided by 3."], "jumps": ["P2350", "P2300"]}, {"id": "P2350", "text": ["You must find a whole number that can be divided into the numerator and denominator evenly (with no remainder) to reduce a fraction to its lowest terms."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Look at this example. Notice that the whole numbers 2, 3 and 6 can be divided into the numerator and denominator.", "Common Divisors 2 x 3 = 6 2 x 9 = 18 3 x 2 = 6 3 x 6 = 18 6 x 1 = 6 6 x 3 = 18"], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["By using 2, the fraction is reduced to 3/9.", "Common Divisors 2 x 3 = 6 2 x 9 = 18 3 x 2 = 6 3 x 6 = 18 6 x 1 = 6 6 x 3 = 18"], "jumps": ["P2377", "P2360"]}, {"id": "P2377", "text": ["As you can see, 3/9 can still be reduced using 3."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["If you use the 3, the fraction reduces to 2/6.", "Common Divisors 2 x 3 = 6 2 x 9 = 18 3 x 2 = 6 3 x 6 = 18 6 x 1 = 6 6 x 3 = 18"], "jumps": ["P2390", "P2360"]}, {"id": "P2390", "text": ["However, the 2/6 is not the lowest term. 2/6 can be reduced to 1/3."], "jumps": ["P2400", "P2360"]}, {"id": "P2400", "text": ["To prevent repeat reducing you should use the largest whole number that can be divided evenly into the numerator and denominator.", "Common Divisors 2 x 3 = 6 2 x 9 = 18 3 x 2 = 6 3 x 6 = 18 6 x 1 = 6 6 x 3 = 18"], "jumps": ["P2410", "P2360"]}, {"id": "P2410", "text": ["In this example, there is no whole number that can be divided into the numerator and denominator evenly.  The fraction is in its lowest terms.", "In this example, there is no whole number that can be divided into the numerator and denominator evenly. The fraction is in its lowest terms."], "jumps": ["P2420", "P2360"]}, {"id": "P2420", "text": ["Two can be divided evenly into the numerator but can not be divided evenly into the denominator.  Three can be divided evenly into the denominator but can not be divided evenly into the numerator.", "Two can be divided evenly into the numerator but can not be divided evenly into the denominator. Three can be divided evenly into the denominator but can not be divided evenly into the numerator..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["The only whole number that can be divided evenly into both the numerator and denominator is 1. This means that the fraction is in its lowest terms."], "jumps": ["P2440", "P2410"]}, {"id": "P2440", "text": ["Reduce this fraction to its lowest terms and enter the correct choice."], "jumps": ["P2410"]}, {"id": "P2441", "text": [], "jumps": []}, {"id": "P2442", "text": ["4/16 can be reduced to 2/8 by dividing with 2.  However, 2/8 can be reduced again when dividing by 2. 2/8 is not the lowest term.", "4/16 can be reduced to 2/8 by dividing with 2. However, 2/8 can be reduced again when dividing by 2. 2/8 is not the lowest term."], "jumps": []}, {"id": "P2443", "text": ["4/16 can let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
