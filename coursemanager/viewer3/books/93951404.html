", "text": ["Let's begin the lesson on NORTON'S THEOREM. .............."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Norton's Theorem is used to reduce a circuit in terms of current."], "jumps": ["P1030"]}, {"id": "P1030", "text": ["In many cases, making current calculations may be easier than voltage calculations."], "jumps": ["P1040"]}, {"id": "P1040", "text": ["For this reason, Norton's Theorem is used to reduce a network to a simple parallel circuit with a current source. Enter the discussion text here."], "jumps": ["P1050"]}, {"id": "P1045", "text": ["CURRENT SOURCE - A current source is represented by a circle with an arrow in the center. The arrow points in the direction of current flow. Remember, current flows from the negative side of the voltage source.", "CURRENT SOURCE - A current source is represented by a circle with an arrow in the center. The arrow points in the direction of current flow. Remember, current flows from the positive side of the voltage source."], "jumps": []}, {"id": "P1050", "text": ["A current source supplies a total current to be divided among parallel branches."], "jumps": ["P1060"]}, {"id": "P1060", "text": ["Let's use this circuit to apply Norton's Theorem. ......."], "jumps": ["P1070"]}, {"id": "P1070", "text": ["This circuit is reduced to a single current source (In) in parallel with a single resistance (Rn)."], "jumps": []}, {"id": "P1080", "text": ["The value for In is the current that the network produces through terminals A and B with a short circuit across them."], "jumps": ["P1100"]}, {"id": "P1100", "text": ["RL and R2 are shorted out of the circuit because they are in parallel with the short circuit."], "jumps": []}, {"id": "P1110", "text": ["The only resistance left in the circuit is R1 which is in series with the 36 V source. The current through the short circuit is 12 A.", "V In = R 36 V = 3 W = 12 A"], "jumps": ["P1120"]}, {"id": "P1112", "text": ["The only resistance left in the circuit is R1 which is in series with the 36 V source. The current through the short circuit is 12 A.....", "V In = R 36 V = 3 W = 12 A"], "jumps": []}, {"id": "P1115", "text": ["NORTON'S CURRENT - Norton's current is found by taking the source voltage and dividing it by the series resistance. es resistance.", "V 36 V In = 12 A = R 3W"], "jumps": []}, {"id": "P1120", "text": ["Now remove the short circuit and the load resistor. ."], "jumps": ["P1112"]}, {"id": "P1130", "text": ["The next step is to find the value of Norton Resistance (Rn)."], "jumps": []}, {"id": "P1140", "text": ["Rn is the resistance of the circuit looking back from the open terminals A and B, and with the source short circuited."], "jumps": []}, {"id": "P1150", "text": ["The calculated value for Rn is the total resistance of R1 and R2 in parallel.", "R1 x R2 Rn = R1 + R2 3 x 6 = 3 + 6 = 2 W"], "jumps": []}, {"id": "P1152", "text": ["The calculated value for Rn is the total resistance of R1 and R2 in parallel.", "R1 x R2 Rn = R1 + R2 3 x 6 = 3 + 6 = 2 W"], "jumps": []}, {"id": "P1155", "text": ["SOLVING Rn - Use Ohm's Law to solve for the parallel resistance combination of R1 and R2.", "R1 x R2 Parallel Combination = R1 + R2 3 x 6 = 3 + 6 = 2 W"], "jumps": []}, {"id": "P1160", "text": ["Knowing the In and Rn values, the equivalent Norton circuit may be drawn."], "jumps": ["P1170"]}, {"id": "P1170", "text": ["Now reinstall the load resistor across terminals A and B."], "jumps": ["P1180"]}, {"id": "P1180", "text": ["IL may now be calculated. Since the source delivers 12 A and the two branches are equal, the current through the load is 6 A."], "jumps": []}, {"id": "P1182", "text": ["IL may now be calculated. Since the source delivers 12 A and the two branches are equal, the current through the load is 6 A."], "jumps": []}, {"id": "P1185", "text": ["CURRENT IN EQUAL BRANCHES - If the two parallel branches are equal then the current source is also divided equally between them... them..hem. equally between them. equally between them. equally between them...", "In 12 A = Rn or RL 2 W = 6 A = 6 A ue"], "jumps": []}, {"id": "P1190", "text": ["Finally VL can be determined by multiplying IL by RL.", "VL = IL x RL = 6A x 2 W = 12 V"], "jumps": ["P1200", "P1182"]}, {"id": "P1200", "text": ["Now RL could be replaced with any resistance and the values for it may be obtained very easily.", "In = 12 A Rn = 2 W IL = 6 A VL = 12 V"], "jumps": []}, {"id": "P1210", "text": ["When starting to apply Norton's Theorem to a circuit, what is the first thing that is done?"], "jumps": ["P1182"]}, {"id": "P1212", "text": [], "jumps": []}, {"id": "P1213", "text": ["The load resistor is removed by performing the first step of Norton's Theorem."], "jumps": []}, {"id": "P1215", "text": ["Finding the value for Rn is the second calculation to be made and not the first................"], "jumps": []}, {"id": "P1220", "text": ["By examining the circuit below, what circuit value is going to be calculated?"], "jumps": []}, {"id": "P1222", "text": [], "jumps": []}, {"id": "P1223", "text": ["If Norton current was trying to be determined the circuit would look like below.", "V In = RL 36 V = 3 W = 12 A"], "jumps": []}, {"id": "P1225", "text": ["If load current was going to be calculated the circuit would look like the following.........", "In IL = Rn or RL 12 A = 2 W = 6 A"], "jumps": []}, {"id": "P1227", "text": ["If load voltage was trying to be determined the following would be shown.", "VL = IL x RL = 6 A x 2 W = 12 V 6 A"], "jumps": []}, {"id": "P1230", "text": ["If the value of Rn was changed in this circuit, would it affect the values of IL and VL?", "In = 12 A Rn = 2 W IL = 6 A VL= 12 VV"], "jumps": []}, {"id": "P1232", "text": [], "jumps": []}, {"id": "P1233", "text": ["Changing the value of Rn will change it's voltage drop. This will also affect the voltage on the load."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on NORTON'S THEOREM. ......."], "jumps": []}, {"id": "P1920", "text": ["1. Norton's Theorem is used to reduce an entire network to a circuit with a current source and a single resistance."], "jumps": ["P1930"]}, {"id": "P1930", "text": ["2. A current source supplies a total current to be divided among parallel branches."], "jumps": ["P1940"]}, {"id": "P1940", "text": ["3. The current produced when a short is applied across A and B is In."], "jumps": ["P1950"]}, {"id": "P1950", "text": ["4. Rn is the resistance of the circuit looking back from the open terminals A and B, and with the voltage source shorted."], "jumps": ["P1960"]}, {"id": "P1960", "text": ["5. When the Norton equivalent circuit has been obtained the resistance of RL may be changed at will and the values for it will be quickly found."], "jumps": []}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": []}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["We will be applying Norton's Theorem to this circuit. ."], "jumps": []}, {"id": "P2030", "text": ["First short across terminals A and B......................................................y"], "jumps": ["P2040"]}, {"id": "P2040", "text": ["This connects R2 and R3 in parallel. Now the short circuit current is the same as the current through R3."], "jumps": []}, {"id": "P2050", "text": ["To calculate the current for R3, use the Ohm's law formula."], "jumps": []}, {"id": "P2052", "text": ["To calculate the current for R3, use the Ohm's law formula."], "jumps": []}, {"id": "P2055", "text": ["CALCULATING CURRENT FOR R3 - First solve the parallel resistance for R2 and R3, then calculate It. then calculate It. then calculate It.", "Parallel Resistance Total Resistance Total Current R2 x R3 Rt = Req + R1 V Req = It = R2 + R3 RT Voltage Drops Current, R3 Vr1 = IT x R1 Vr2, Vr3 Vr2,Vr3 = IT x Req Ir3 = R3 R3"], "jumps": []}, {"id": "P2060", "text": ["What is the parallel resistance  formula provided below."], "jumps": []}, {"id": "P2142", "text": ["First calculate the value for IL. To do this in a parallel circuit, use the formula provided below.", "In = 2 A Rn = 14.4 W IL = VL= 12 V2 V"], "jumps": []}, {"id": "P2150", "text": ["This formula will only work for a parallel circuit such as this."], "jumps": []}, {"id": "P2160", "text": ["SOLVING FOR IrL - First calculate Rt, then solve for IrL.", "Rn x RL Rt = Rn + RL 14.4 x 5 W = 14.4 + 5 W 72 = 19.4 = 3.7 W 3.7 S .7 S = 3.7 S = 3.7 S = 3.7 S = 3.7 S S 3.7 S = 3.7 S = 3.7 S = 3.7 S = 3.7 S = 3.7 S S = 3.7 S 7 = 3.7 = 3.7 3.7 .7 = 3.7 .7 7 B = 3.7 = 3.7 7 B = 3.7", "Rt IrL = x In RL 3.7 W = x 2 A 5 W = 0 .74 x 2 A = 1.48 A = 3.7 = 3.7 = 3.7 = 3.7 = 3.7 = 3.7 = 3.7 = 3.7 = 3.7 = 3.7 7 B = 3.7 = 3.7 7 B = 3.7", "Rn x RL Rt = Rn + RL 14.4 x 5 W = 14.4 + 5 W 72 = 19.4 = 3.7 W"], "jumps": []}, {"id": "P2170", "text": ["Finally the voltage dropped across the load may be determined.", "In = 2 A Rn = 14.4 W IL = 1.48 A VL = V"], "jumps": []}, {"id": "P2180", "text": ["VL = IL x RL = 1.48 x 5 = 7.4 V"], "jumps": ["P2190"]}, {"id": "P2190", "text": ["Now the resistance of the load resistor may be changed at will and the new values can be easily calculated. Touch one of the resistors for new circuit values.", "In = 2 A Rn = 14.4 W IL = VL = 12 V2 V"], "jumps": []}, {"id": "P2192", "text": ["In = 2 A Rn = 14.4 W IL = 1.87 A VL = 1.87 V"], "jumps": []}, {"id": "P2194", "text": ["In = 2 A Rn = 14.4 W IL = 1.7 A VL = 4.9 VVV"], "jumps": []}, {"id": "P2196", "text": ["In = 2 A Rn = 14.4 W IL = 1.48 A VL = 7.4 VVV"], "jumps": []}, {"id": "P2198", "text": ["In = 2 A Rn = 14.4 W IL = 1.4 A VL = 9.4 VVVV"], "jumps": []}, {"id": "P2200", "text": ["Congratulations! You have applied Norton's Theorem to this circuit and have successfully achieved a Norton equivalent.", "In = 2 A Rn = 14.4 W IL = 1.48 A VL = 7.4 V V"], "jumps": []}, {"id": "P2699", "text": ["The following ten questions require you to calculate circuit va let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
