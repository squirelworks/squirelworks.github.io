const book = {"title": "93953203", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: INTRODUCTION TO TRANSISTOR AMPLIFIERSf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the purpose of an amplifier. w Describe classes of amplifier operation.", "w Describe common emitter amplifiers. w Describe common collector amplifiers. w Describe common base amplifiers."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["There are many uses for a properly biased transistor."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The most common use is the amplifier."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Transistor amplifiers have different classes of operation and configurations.", "CLASS A CLASS B CLASS C CLASS AB COMMON BASE COMMON EMITTER COMMON COLLECTORR"], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's Begin the Lesson on INTRODUCTION TO TRANSISTOR AMPLIFIERS............."], "jumps": ["P420"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["The purpose of an amplifier is to increase signal strength."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Signal is a general term used to describe current, voltage or power in a circuit."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["A radio receiver is an excellent example of how amplifiers are used."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The signal received by the antenna is small (2 mV).  This small voltage is not enough to drive the speaker.", "The signal received by the antenna is small (2 mV). This small voltage is not enough to drive the speaker."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Amplifiers inside the radio receiver increase the voltage to about 2 V.  The received signal is increased 1,000,000 times.", "Amplifiers inside the radio receiver increase the voltage to about 2 V. The received signal is increased 1,000,000 times."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Transistor amplification of an input signal occurs because a small change in base bias causes a large change in collector current."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["Once a transistor is DC biased, an AC input signal is applied that adds to or subtracts from the bias levels."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The changing base bias changes the collector current.  A small change in base bias causes a large change in collector current, or amplification.", "The changing base bias changes the collector current. A small change in base bias causes a large change in collector current, or amplification."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["Transistor amplifiers require what type of signals to function?"], "jumps": ["P1070"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1102", "text": ["The DC bias voltage allows the transistor to operate.  Without an input signal, amplification does not occur.", "The DC bias voltage allows the transistor to operate. Without an input signal, amplification does not occur."], "jumps": []}, {"id": "P1103", "text": ["The AC input, is the signal to be amplified.  Without DC bias voltage, the transistor will not operate.", "The AC input, is the signal to be amplified. Without DC bias voltage, the transistor will not operate."], "jumps": []}, {"id": "P1110", "text": ["What changes are necessary for amplification to occur?", "What changes are necessary for amplification to occur?....."], "jumps": ["P1100"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["A large change in Base Voltage (Eb) causing a small change in Collector Current (Ic) does not produce amplification."], "jumps": []}, {"id": "P1113", "text": ["A large change in Base Voltage (Eb) causing a large change in Collector Current (Ic) does not produce amplification."], "jumps": []}, {"id": "P1120", "text": ["The point where a transistor is DC biased determines the class of operation.  Let's discuss class A operation first.", "The point where a transistor is DC biased determines the class of operation. Let's discuss class A operation first.", "Class A Class B Class AB Class C"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["Class A amplifiers are biased so the input signal occurs within the limits of cutoff and saturation."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["Collector current (Ic) flows for the complete 360\u00ba cycle of the input signal.  The bias point is normally mid-way between cutoff and saturation.", "Collector current (Ic) flows for the complete 360", "cycle of the input signal. The bias point is normally mid-way between cutoff and saturation."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["An advantage of class A operation is that the output signal is a replica of the input signal, good fidelity with low distortion."], "jumps": ["P1160", "P1130"]}, {"id": "P1152", "text": ["An advantage of class A operation is that the output signal is a replica of the input signal, good fidelity with low distortion."], "jumps": ["P1160", "P1130"]}, {"id": "P1155", "text": ["FIDELITY / DISTORTION - Fidelity is the faithful reproduction of a signal. An amplifier has a high degree of fidelity when the output signal is just like the input signal except for amplitude. Distortion is the opposite of fidelity. The output signal does not match the input signal."], "jumps": []}, {"id": "P1160", "text": ["A disadvantage of class A operation is that collector current flows even when no input signal is applied causing lower  efficiency.", "A disadvantage of class A operation is that collector current flows even when no input signal is applied causing lower efficiency."], "jumps": ["P1170", "P1152"]}, {"id": "P1162", "text": ["A disadvantage of class A operation is that collector current flows even when no input signal is applied causing lower  efficiency.", "A disadvantage of class A operation is that collector current flows even when no input signal is applied causing lower efficiency."], "jumps": ["P1170", "P1152"]}, {"id": "P1165", "text": ["EFFICIENCY - The efficiency of an amplifier refers to the ratio of signal power compared to the total input power. Since an amplifier takes power to operate, an amplifier that operates for 360", "degrees of the input is less efficient than one that operates for less than the entire input."], "jumps": []}, {"id": "P1170", "text": ["Class A amplifiers are commonly used in audio amplifiers."], "jumps": ["P1180", "P1162"]}, {"id": "P1180", "text": ["Class B amplifiers are biased so collector current is zero for half, (one alternation) of the input signal."], "jumps": ["P1190", "P1162"]}, {"id": "P1190", "text": ["The DC bias point is at cutoff.  Collector current (Ic) flows only half (180\u00ba) of the input signal.", "The DC bias point is at cutoff. Collector current (Ic) flows only half (180"], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["An advantage of class B operation is increased efficiency because it does not operate for the entire input cycle."], "jumps": ["P1210", "P1180"]}, {"id": "P1210", "text": ["A disadvantage of class B operation is that it has poor fidelity. The output is not an exact replica of the input."], "jumps": ["P1220", "P1180"]}, {"id": "P1220", "text": ["Class B amplifiers are commonly used in push-pull amplifiers.  A push-pull amplifier uses two amplifiers connected together to      overcome the poor fidelity while maintaining good efficiency.", "Class B amplifiers are commonly used in push-pull amplifiers. A push-pull amplifier uses two amplifiers connected together to overcome the poor fidelity while maintaining good efficiency."], "jumps": ["P1230", "P1180"]}, {"id": "P1222", "text": ["Class B amplifiers are commonly used in push-pull amplifiers.  A push-pull amplifier uses two amplifiers connected together to      overcome the poor fidelity while maintaining good efficiency.", "Class B amplifiers are commonly used in push-pull amplifiers. A push-pull amplifier uses two amplifiers connected together to overcome the poor fidelity while maintaining good efficiency."], "jumps": ["P1230", "P1180"]}, {"id": "P1225", "text": ["PUSH-PULL AMPLIFIERS - Push-pull amplifiers are actually two amplifiers. One amplifies the positive alternation of the input signal and the other amplifies the negative alternation of the input signal. The output is taken across both amplifiers producing a complete 360"], "jumps": []}, {"id": "P1230", "text": ["Class AB amplifiers are biased so that collector current is zero for a portion of one alternation."], "jumps": ["P1240", "P1222"]}, {"id": "P1240", "text": ["The bias point is above cutoff so collector current flows for more than 180\u00ba, but less than 360\u00ba.", "The bias point is above cutoff so collector current flows for more than 180"], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["An advantage of class AB operation is that it is more efficient than class A and has higher fidelity than class B."], "jumps": ["P1260", "P1230"]}, {"id": "P1260", "text": ["A disadvantage of class AB operation is that it has less fidelity than class A and less efficiency than class B."], "jumps": ["P1270", "P1230"]}, {"id": "P1270", "text": ["Class AB amplifiers are commonly used to overcome crossover distortion found in class B push-pull amplifiers."], "jumps": ["P1280", "P1230"]}, {"id": "P1272", "text": ["Class AB amplifiers are commonly used to overcome crossover distortion found in class B push-pull amplifiers."], "jumps": ["P1280", "P1230"]}, {"id": "P1275", "text": ["CROSSOVER DISTORTION - Crossover distortion occurs when using class B push-pull amplifiers. For a short amount of time, both amplifiers are cutoff and no collector current flows."], "jumps": []}, {"id": "P1280", "text": ["Class C amplifiers are biased so that collector current is zero for most of the input cycle."], "jumps": ["P1290", "P1272"]}, {"id": "P1290", "text": ["The bias point is below cutoff so collector current flows for less than 180\u00ba.", "The bias point is below cutoff so collector current flows for less than 180"], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["An advantage of class C operation is the high efficiency. Collector current flows for only a small portion of the input signal."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["A disadvantage of class C operation is that it has very poor fidelity."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["Class C amplifiers are normally used in RF tuned amplifier applications; where fidelity is not the primary issue."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["The transistor goes into saturation and cutoff if the amplitude of the input signal is high enough.  This is called overdriving an        amplifier.", "The transistor goes into saturation and cutoff if the amplitude of the input signal is high enough. This is called overdriving an amplifier."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["It is possible to overdrive any one of the 4 classes of amplifiers."], "jumps": ["P1345", "P1330"]}, {"id": "P1345", "text": ["Overdriving an amplifier distorts the output signal."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Touch the class B output signal.", "Touch the class B output signal.d.........................."], "jumps": ["P1330"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["You touched the class AB amplifier output.", "You touched the class AB amplifier output.................."], "jumps": []}, {"id": "P1353", "text": ["You touched the class C amplifier output.", "You touched the class C amplifier output..................."], "jumps": []}, {"id": "P1360", "text": ["Touch the class A output signal.", "Touch the class A output signal.d.........................."], "jumps": ["P1350"]}, {"id": "P1361", "text": [], "jumps": []}, {"id": "P1362", "text": ["You touched the class B amplifier output signal.", "You touched the class B amplifier output signal............"], "jumps": []}, {"id": "P1363", "text": ["You touched the class C amplifier output signal.", "You touched the class C amplifier output signal............"], "jumps": []}, {"id": "P1370", "text": ["Which amplifier has the best fidelity?", "Which amplifier has the best fidelity?....................."], "jumps": ["P1360"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Class B amplifiers conduct collector current for only 180 degrees.  Fidelity means the output is the same as the input.", "Class B amplifiers conduct collector current for only 180 degrees. Fidelity means the output is the same as the input.", "DC Bias Point Eb Class BB"], "jumps": []}, {"id": "P1373", "text": ["Class C amplifiers conduct collector current less than 180 degrees.  Fidelity means the output is the same as the input.", "Class C amplifiers conduct collector current less than 180 degrees. Fidelity means the output is the same as the input."], "jumps": []}, {"id": "P1380", "text": ["Which amplifier has the best efficiency?", "Which amplifier has the best efficiency?..................."], "jumps": ["P1370"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["Class A amplifiers conduct collector current for the entire 360 degrees of the input signal.  Efficiency is the ratio of output power to input power.", "Class A amplifiers conduct collector current for the entire 360 degrees of the input signal. Efficiency is the ratio of output power to input power..."], "jumps": []}, {"id": "P1383", "text": ["Class B amplifiers conduct collector current for 180 degrees of the input signal.  Efficiency is the ratio of output power to input power.", "Class B amplifiers conduct collector current for 180 degrees of the input signal. Efficiency is the ratio of output power to input power."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on AMPLIFIERS.", "This completes the information on AMPLIFIERS. TITLE........"], "jumps": ["P1001", "P1380"]}, {"id": "P1920", "text": ["1.  The purpose of an amplifier is to increase signal strength.", "1. The purpose of an amplifier is to increase signal strength."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Amplification of an input signal in a transistor occurs because      small changes in base bias cause large changes in collector\n     current.", "2. Amplification of an input signal in a transistor occurs because small changes in base bias cause large changes in collector current...."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Class A amplifiers are biased so that the input signal occurs          within the limits of cutoff and saturation.  Class A amplifiers            have high fidelity and low efficiency.", "3. Class A amplifiers are biased so that the input signal occurs within the limits of cutoff and saturation. Class A amplifiers have high fidelity and low efficiency.."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Class B amplifiers have the DC bias point at cutoff allowing no      collector current for half (one 180\u00ba alternation) of the input              signal.", "4. Class B amplifiers have the DC bias point at cutoff allowing no collector current for half (one 180", "alternation) of the input signal...."], "jumps": ["P1952", "P1940"]}, {"id": "P1952", "text": ["Class B amplifiers have medium fidelity and medium                         efficiency.", "Class B amplifiers have medium fidelity and medium efficiency.ncy."], "jumps": ["P1960", "P1950"]}, {"id": "P1960", "text": ["5.  Class AB amplifiers have the DC bias point above cutoff so            collector current flows for more than 180\u00ba but less than 360\u00ba.", "5. Class AB amplifiers have the DC bias point above cutoff so collector current flows for more than 180"], "jumps": ["P1962", "P1950"]}, {"id": "P1962", "text": ["Class AB amplifiers have medium fidelity and medium                      efficiency.", "Class AB amplifiers have medium fidelity and medium efficiency.ncy."], "jumps": ["P1970", "P1960"]}, {"id": "P1970", "text": ["6.  Class C amplifiers have the DC bias point below cutoff so               collector current flows for less than 180\u00ba.", "6. Class C amplifiers have the DC bias point below cutoff so collector current flows for less than 180"], "jumps": ["P1972", "P1960"]}, {"id": "P1972", "text": ["Class C amplifiers have low fidelity and high efficiency.", "Class C amplifiers have low fidelity and high efficiency.ncy."], "jumps": ["P1980", "P1970"]}, {"id": "P1980", "text": ["7.  Overdriving an amplifier distorts the output signal.", "7. Overdriving an amplifier distorts the output signal...."], "jumps": ["P1999", "P1970"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["The three basic circuit configurations for transistor amplifiers are:"], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["The term \"common\" is used to denote the element that is common to both the input and the output."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Each configuration has particular characteristics that make it suitable for specific applications."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Let's begin the discussion with the common emitter configuration.", "The DC biasing circuits will not be shown. Remember, the emitter to base PN junction is forward biased, and the collector to base PN junction is reverse biased."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["The common emitter configuration (CE) is the most frequently used amplifier.  It provides good voltage, current and power           amplification.", "The common emitter configuration (CE) is the most frequently used amplifier. It provides good voltage, current and power amplification......"], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The input signal is applied to the base, the output is taken from the collector and the emitter is common."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["Notice that the output signal is 180 degrees out of phase with the input signal."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["The common emitter is the only configuration which provides a phase reversal."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["The input resistance is medium (500 to 1500 ohms) because the input is applied to the forward biased PN junction."], "jumps": ["P2110", "P2060"]}, {"id": "P2110", "text": ["The output resistance is medium (30 k to 50 k ohms) because the output is taken from the reverse biased PN junction."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["The common emitter configuration has:\n \nInput / output phase -  180\u00ba                  Power gain              -  high\nVoltage gain               -  medium           Input resistance     -  medium\nCurrent gain               -  medium           Output resistance  -  medium", "The common emitter configuration has: Input / output phase - 180", "Power gain - high Voltage gain - medium Input resistance - medium Current gain - medium Output resistance - medium"], "jumps": ["P2130", "P2060"]}, {"id": "P2130", "text": ["Next, let's discuss the common collector.", "Next, let's discuss the common collector..................."], "jumps": ["P2140", "P2060"]}, {"id": "P2140", "text": ["The common collector configuration (CC) is primarily used for impedance matching.  High impedance inputs are matched to \nlow impedance loads.", "The common collector configuration (CC) is primarily used for impedance matching. High impedance inputs are matched to low impedance loads......"], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["CC amplifiers have a high current gain and are sometimes used as a current driver."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["The input signal is applied to the base, the output is taken from the emitter, and the collector is common."], "jumps": ["P2170", "P2140"]}, {"id": "P2170", "text": ["Notice that the output signal is in phase."], "jumps": ["P2180", "P2140"]}, {"id": "P2180", "text": ["The input resistance is high (2 k to 500 k ohms) because the input is applied to the reverse biased PN junction."], "jumps": ["P2190", "P2140"]}, {"id": "P2190", "text": ["The output resistance is low (50 to 1500 ohms) because the output is taken from the forward biased PN junction."], "jumps": ["P2200", "P2140"]}, {"id": "P2200", "text": ["The common collector configuration has:\n\n Input / output phase -  0\u00ba             Power gain             -  medium\n Voltage gain               -  low          Input resistance    -  high\n Current gain               -  high        Output resistance -  low", "The common collector configuration has: Input / output phase - 0", "Power gain - medium Voltage gain - low Input resistance - high Current gain - high Output resistance - low"], "jumps": ["P2210", "P2140"]}, {"id": "P2210", "text": ["Next, let's discuss the common base.", "Next, let's discuss the common base........................"], "jumps": ["P2220", "P2140"]}, {"id": "P2220", "text": ["The common base configuration (CB) is primarily used for impedance matching.  It matches low impedance input, to high impedance loads.", "The common base configuration (CB) is primarily used for impedance matching. It matches low impedance input, to high impedance loads."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["CB amplifiers have a large voltage gain."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["The input signal is applied to the emitter, the output is taken from the collector and the base is common."], "jumps": ["P2250", "P2220"]}, {"id": "P2250", "text": ["Notice that the output signal is in phase with the input."], "jumps": ["P2260", "P2220"]}, {"id": "P2260", "text": ["The input resistance is low (30 to 160 ohms) because the input is applied to the forward biased PN junction."], "jumps": ["P2270", "P2220"]}, {"id": "P2270", "text": ["The output resistance is high (250 k to 550 k ohms) because the output is taken from the reverse biased PN junction."], "jumps": ["P2280", "P2220"]}, {"id": "P2280", "text": ["The common base configuration has:\n\n Input / output phase -  0\u00ba              Power gain             -  low\n Voltage gain               -  high         Input resistance    -  low  \n Current gain               -  low           Output resistance -  high", "The common base configuration has: Input / output phase - 0", "Power gain - low Voltage gain - high Input resistance - low Current gain - low Output resistance - h let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
