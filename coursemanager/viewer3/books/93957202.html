const book = {"title": "93957202", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: MOTION TRANSDUCERS asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello Student, this lesson is about: about:"], "jumps": []}, {"id": "P100", "text": ["w Describe photointerrupter motion sensors. w Describe photoreflector motion sensors. w Describe magnetic pickup motion sensors.", "w Describe velocity circuits. w Describe acceleration circuits. w Describe RPM circuits."], "jumps": ["P300", "P10"]}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about motion transducers."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You use motion transducers every time you drive a car.", "You use motion transducers every time you drive a car......"], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The speedometer indicates how fast you are going in absolute terms, miles per hour or MPH."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["A tachometer is also a motion transducer.", "A tachometer is also a motion transducer..................."], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["It indicates relative motion, rotations per minute or RPM of the engine."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["These motion transducers are normally mechanical.", "These motion transducers are normally mechanical..........."], "jumps": ["P460", "P430"]}, {"id": "P460", "text": ["However, in newer cars, speedometers and tachometers are being replaced by electronic motion transducers."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["Industries are using electronic motion transducers more and more."], "jumps": ["P450"]}, {"id": "P480", "text": ["Let's begin the lesson on MOTION TRANSDUCERS.............................."], "jumps": []}, {"id": "P2080", "text": ["The LED, P1D1, is biased to remain on at all times.  It is the light emitter.", "The LED, P1D1, is biased to remain on at all times. It is the light emitter."], "jumps": ["P2090", "P2060"]}, {"id": "P2200", "text": ["If the input frequency is 4.5 kHz with a 1 V/1 kHz CF, then Eout is 4.5 volts."], "jumps": ["P2210", "P2190"]}, {"id": "P2600", "text": ["What's different about the RPM circuit is the formula used to calculate velocity or the relative measurement of RPM."], "jumps": ["P2610", "P2590"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1010", "text": ["Electronic motion sensors are devices that change velocity (ft/sec) into frequency (cycles/sec)."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Notice that in velocity and frequency, time is common."], "jumps": ["P1030", "P1010"]}, {"id": "P1030", "text": ["The motion transducers job is to change distance to cycles."], "jumps": ["P1040", "P1010"]}, {"id": "P1040", "text": ["Three of the most popular electronic motion sensors are:", "Three of the most popular electronic motion sensors are:..."], "jumps": ["P1050", "P1010"]}, {"id": "P1050", "text": ["The photointerrupter operates as its name implies."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The photointerrupter motion sensor is two photodevices, one is an emitter or transmitter, such as a lamp or LED."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["The other is a receiver.  Such as a photocell or phototransistor.", "The other is a receiver. Such as a photocell or phototransistor."], "jumps": ["P1060", "P1080"]}, {"id": "P1080", "text": ["A moving object is then allowed to pass between the emitter and receiver."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["The moving object is made with protrusions or holes that will make or break the light path from emitter to receiver."], "jumps": ["P1100", "P1060"]}, {"id": "P1100", "text": ["When there is a path for light, the light receiver senses the energy and produces an output, usually a HIGH value."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["When there is NO path for light, the light is blocked and the light receiver has a low or zero output."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["In other words, the moving object interrupts or passes the light from emitter to receiver."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The HIGH to LOW transitions produce cycles that are measurable in electronic circuits."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["In a photointerrupter motion sensor, if the speed of the moving object increases, what happens to the cycle output of the light receiver?"], "jumps": ["P1120"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["When the moving object speeds up, the making and breaking of the light path increases.  This does not decrease the HIGH and LOW transitions of the light receiver's output.", "When the moving object speeds up, the making and breaking of the light path increases. This does not decrease the HIGH and LOW transitions of the light receiver's output."], "jumps": []}, {"id": "P1143", "text": ["When the moving object speeds up, the making and breaking of the light path increases.  This does not cause the HIGH and LOW transitions of the light receiver to remain the same.", "When the moving object speeds up, the making and breaking of the light path increases. This does not cause the HIGH and LOW transitions of the light receiver to remain the same."], "jumps": []}, {"id": "P1150", "text": ["The second type of electronic motion sensor also uses light."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The photoreflector motion sensor uses two photodevices.", "The photoreflector motion sensor uses two photodevices....."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["One photodevice is the emitter and one is the receiver."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["The difference is that both photodevices are on the same side. To the left or right of the moving object."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Again, the moving object is made with protusions or holes.", "Again, the moving object is made with protusions or holes.."], "jumps": ["P1200", "P1160"]}, {"id": "P1200", "text": ["When there is a protrusion or no hole, light is reflected from the emitter to the receiver."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The light receiver senses the reflected light and produces an output, usually a HIGH value."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["When there is no protrusion or a hole, the light is not reflected."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The light receiver does not sense the light and produces a zero or LOW output."], "jumps": ["P1240", "P1200"]}, {"id": "P1240", "text": ["In other words, the moving object reflects or does not reflect the light to the photoreceiver."], "jumps": ["P1250", "P1200"]}, {"id": "P1250", "text": ["The HIGH to LOW transitions produce cycles that are measurable in electronic circuits."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["If the output of a photointerrupter sensor is HIGH, what would be the output of a photoreflector sensor for the same conditions?"], "jumps": ["P1240"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["The photointerrupter produces a HIGH output when there is a hole, light must pass through.  The photoreflector produces a HIGH output when there is no hole, light must reflect to the receiver.", "The photointerrupter produces a HIGH output when there is a hole, light must pass through. The photoreflector produces a HIGH output when there is no hole, light must reflect to the receiver.."], "jumps": []}, {"id": "P1270", "text": ["The last electronic motion sensor does not use light.", "The last electronic motion sensor does not use light......."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The magnetic pickup motion sensor uses a permanent or electromagnet."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["The magnet produces a magnetic field, recall that when a conductor passes through a magnetic field, a voltage is produced."], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["When there is a protrusion or no hole, the magnetic field is cut producing an output voltage, normally a HIGH."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["When there is no protrusion or a hole, the magnetic field is not cut producing no output voltage, normally a LOW."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["In other words, the moving object cuts or does not cut the magnetic field."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["The HIGH to LOW transitions produce cycles that are measurable in electronic circuits."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["When is a voltage produced in a magnetic pickup motion sensor?", "When the conductor does not pass through the magnetic field.", "When the applied voltage to the magnet changes.", "When a conductor passes through the magnetic field."], "jumps": ["P1330"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["Remember, it takes movement between a magnetic field and a conductor to produce voltage."], "jumps": []}, {"id": "P1353", "text": ["Electromagnetics use an applied voltage to produce the magnetic field.  Changing the voltage only changes the strength of the field and does not produce an output voltage.", "Electromagnetics use an applied voltage to produce the magnetic field. Changing the voltage only changes the strength of the field and does not produce an output voltage."], "jumps": []}, {"id": "P1360", "text": ["Finally, let's look at the correlation between motion and the frequency output of a motion sensor."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Note that any motion sensor can be used.  We will use a photointerrupter in our example.", "Note that any motion sensor can be used. We will use a photointerrupter in our example."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["As the surface moves, the interrupter alternately senses the presence and absence of light."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["This produces a square wave output of HIGHs and LOWs."], "jumps": ["P1400", "P1360"]}, {"id": "P1400", "text": ["Compare the T times indicated on the sensor to the T times indicated on the square wave."], "jumps": ["P1410", "P1360"]}, {"id": "P1410", "text": ["Look at the square wave.  The cycle time from T1 to T3 depends on the speed (velocity) at which the wheel is turning.", "Look at the square wave. The cycle time from T1 to T3 depends on the speed (velocity) at which the wheel is turning."], "jumps": ["P1420", "P1360"]}, {"id": "P1420", "text": ["Remember velocity equals the change in distance divided by the change in time."], "jumps": ["P1430", "P1360"]}, {"id": "P1430", "text": ["Frequency equals one over time, velocity therefore is equal to distance times the frequency."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["All that has to be done to find the velocity of the wheel is to measure the distance and multiply by the frequency output of the sensor."], "jumps": ["P1910", "P1430"]}, {"id": "P1910", "text": ["This completes the information on SENSORS.", "This completes the information on SENSORS.E 1 TITLE........"], "jumps": ["P1440"]}, {"id": "P1920", "text": ["1.  Electronic motion sensors are devices that change velocity           into frequency.", "1. Electronic motion sensors are devices that change velocity into frequency.."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  The photointerrupter uses light.  The moving object makes or         breaks the path of light to the light receiver.", "2. The photointerrupter uses light. The moving object makes or breaks the path of light to the light receiver.."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The photoreflector also uses light.  The moving object reflects      or does not reflect the light to the light receiver.", "3. The photoreflector also uses light. The moving object reflects or does not reflect the light to the light receiver."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  The magnetic pickup uses magnetism.  The moving object              cuts or does not cut the magnetic field.", "4. The magnetic pickup uses magnetism. The moving object cuts or does not cut the magnetic field."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  The output of any motion sensor is a square wave in which             frequency is proportional to the velocity.", "5. The output of any motion sensor is a square wave in which frequency is proportional to the velocity."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  The velocity of an object is equal to the distance between               sense points times the frequency output.", "6. The velocity of an object is equal to the distance between sense points times the frequency output.."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu..."], "jumps": ["P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["Motion circuits are used to change the output of a motion sensor to a usable form."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["By changing the frequency output of a motion sensor to voltage, a voltmeter can be scaled to indicate velocity."], "jumps": ["P2030", "P2010"]}, {"id": "P2030", "text": ["If velocity is known another circuit can be added to indicate change in velocity (acceleration, deceleration)."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Let's look at three circuits used to produce outputs representing."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The velocity circuit is used to change the frequency output of a motion sensor to an analog DC voltage."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The circuit consists of the motion sensor, amplifier/waveshaper and a frequency to voltage converter."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["The motion sensor is a photointerrupter.  Note that any motion sensor could have been used.", "The motion sensor is a photointerrupter. Note that any motion sensor could have been used."], "jumps": ["P2080", "P2060"]}, {"id": "P2090", "text": ["A slotted disk is used to interrupt the light from the LED to the phototransistor, P Q  .", "A slotted disk is used to interrupt the light from the LED to the phototransistor, P Q .."], "jumps": ["P2100", "P2060"]}, {"id": "P2180", "text": ["The output voltage of the chip, E      , depends on the frequency input and the conversion factor, CF.", "The output voltage of the chip, E , depends on the frequency input and the conversion factor, CF."], "jumps": ["P2190", "P2170"]}, {"id": "P2100", "text": ["The output of the phototransistor is then amplified and shaped in A1."], "jumps": ["P2110", "P2060"]}, {"id": "P2110", "text": ["A2 is a frequency to DC voltage converter (F/V), normally an IC chip."], "jumps": ["P2120", "P2060"]}, {"id": "P2120", "text": ["The converter produces a DC voltage output in proportion to the frequency input."], "jumps": ["P2130", "P2060"]}, {"id": "P2130", "text": ["Note the SCALER IN and ZERO IN inputs to the F/V."], "jumps": ["P2140", "P2060"]}, {"id": "P2140", "text": ["The inputs are used to scale the frequency to voltage conversion so that the chip may operate with any type of sensor."], "jumps": ["P2150", "P2060"]}, {"id": "P2150", "text": ["Finally, by connecting a scaled voltmeter on the DC\noutput, you can obtain a direct reading of velocity.", "Finally, by connecting a scaled voltmeter on the DC output, you can obtain a direct reading of velocity.ity."], "jumps": ["P2160", "P2060"]}, {"id": "P2160", "text": ["In this velocity circuit, what is the purpose of the A1 circuit?"], "jumps": ["P2060"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["The A1 circuit does not sense motion, the interrupter does."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P2170", "text": ["As stated, the frequency to voltage converter changes the input frequency to a DC output voltage that is scaled."], "jumps": ["P2180", "P2160"]}, {"id": "P2240", "text": ["Notice both equations use CF and Eout had to be calculated.", "Notice both equations use CF and Eout had to be calculated.d."], "jumps": ["P2250", "P2230"]}, {"id": "P2190", "text": ["For example, if the input frequency is 2 kHz and the chip is set up for a conversion factor of 1 V/1 kHz, E      is 2 volts.", "For example, if the input frequency is 2 kHz and the chip is set up for a conversion factor of 1 V/1 kHz, E is 2 volts.M"], "jumps": ["P2200", "P2170"]}, {"id": "P2473", "text": ["The A3 circuit differentiates the velocity input, or converts changes in velocity to acceleration, not the A2 circuit."], "jumps": []}, {"id": "P2210", "text": ["Once Eout is determined, or measured, you can calculate velocity."], "jumps": ["P2220", "P2190"]}, {"id": "P2215", "text": ["VELOCITY - Velocity is equal to the change in distance divided by the change in time: The output of a motion sensor is frequency so the formula must be rearranged."], "jumps": []}, {"id": "P2220", "text": ["Since the F/V chip changes frequency to voltage, you substitute E      /CF for \u0083.", "Since the F/V chip changes frequency to voltage, you substitute E /CF for"], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["For example, if \u0083 is 3 kHz, D is .02 inches, and CF is 1V/1kHz, the velocity is 60 inches/second.", "is 3 kHz, D is .02 inches, and CF is 1V/1kHz, the velocity is 60 inches/second."], "jumps": ["P2240", "P2220"]}, {"id": "P2990", "text": ["8.  The output of the circuit is a voltage proportional to RPM and         is equal to:", "8. The output of the circuit is a voltage proportional to RPM and is equal to:"], "jumps": ["P2999", "P2980"]}, {"id": "P2250", "text": ["Normally, the velocity equation is written as:", "Normally, the velocity equation is written as:............."], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["This is done because D and CF do not change in any one circuit, they are constants."], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["This makes D/CF a constant.  Once D/CF has been determined for a circuit, it does not have to be calculated again.", "This makes D/CF a constant. Once D/CF has been determined for a circuit, it does not have to be calculated again."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["What is the velocity if f is 1.5 kHz, D is 0.04 feet, and CF is 0.5V/1kHz?"], "jumps": ["P2250", "P2285"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["The distance given in the question is in feet.  Your answer should be in feet/sec.", "The distance given in the question is in feet. Your answer should be in feet/sec."], "jumps": []}, {"id": "P2283", "text": ["Be sure you used a CF of 0.5V/1kHz when making your calculations."], "jumps": []}, {"id": "P2285", "text": ["VELOCITY CALCULATIONS - To determine the velocity, you must first calculate E , then use the E value to calculate velocity."], "jumps": []}, {"id": "P2290", "text": ["The next circuit to study is the acceleration circuit.", "The next circuit to study is the acceleration circuit......"], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["An acceleration circuit is nothing more than a velocity circuit with the addition of a differentiator circuit."], "jumps": ["P2310", "P2290"]}, {"id": "P2305", "text": ["DIFFERENTIATOR CIRCUIT - A differentiator circuit is a RC circuit with the output taken across the capacitor."], "jumps": []}, {"id": "P2310", "text": ["The acceleration circuit uses the same components as the velocity circuit (sensor, A1, A2)."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["A3 is the additional circuit, an op-amp differentiator, that is added to produce an output for acceleration or deceleration.", "A3 is the additional circuit, an op-amp differentiator, that is added to produce an output for acceleration or deceleration.M"], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["Let's look at the A3 circuit only."], "jumps": ["P2340", "P2300"]}, {"id": "P2340", "text": ["With a constant DC voltage in (no change in velocity) the input capacitor blocks the constant DC voltage."], "jumps": ["P2350", "P2300"]}, {"id": "P2350", "text": ["If there is no change in velocity (no acceleration or deceleration) the output of the op-amp is 0 volts."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["If velocity increases, the DCV input increases."], "jumps": ["P2370", "P2340"]}, {"id": "P2370", "text": ["C    will then charge according to the RC time constant rate \n(C    times RF).", "C will then charge according to the RC time constant rate (C times RF)."], "jumps": ["P2380", "P2340"]}, {"id": "P2380", "text": ["Current will flow to the op-amp's inverting input producing a negative output since the non-inverting input is grounded."], "jumps": ["P2390", "P2340"]}, {"id": "P2390", "text": ["Eout is a negative voltage that represents an increase in velocity.", "Eout is a negative voltage that represents an increase in velocity..."], "jumps": ["P2400", "P2340"]}, {"id": "P2400", "text": ["If the velocity decreases, the DCV input decreases."], "jumps": ["P2410", "P2340"]}, {"id": "P2410", "text": ["Cin will then discharge according to the RC rate (Cin times Rf).", "Cin will then discharge according to the RC rate (Cin times Rf)..."], "jumps": ["P2420", "P2340"]}, {"id": "P2420", "text": ["Current will flow out of the op-amp's inverting input producing a positive output."], "jumps": ["P2430", "P2340"]}, {"id": "P2430", "text": ["Eout is a positive voltage that represents any decrease in velocity."], "jumps": ["P2440", "P2340"]}, {"id": "P2440", "text": ["This diagram illustrates the outputs of the complete accelerator circuit."], "jumps": ["P2450", "P2340"]}, {"id": "P2450", "text": ["Notice A3 has an output only when the velocity output of A2 changes, meaning acceleration or deceleration has taken place."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["The differentiator develops an output voltage that represents acceleration or deceleration."], "jumps": ["P2470", "P2440"]}, {"id": "P2470", "text": ["In this acceleration circuit, what is the purpose of the A2 circuits?", "In this acceleration circuit, what is the purpose of the A2 circuits?ncorrect1: Shapes pulses"], "jumps": ["P2440"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2472", "text": ["The A1 circuit shapes the frequency signal out of the sensor, not the A2 circuit."], "jumps": []}, {"id": "P2500", "text": ["The negative sign in front of E      indicates the op-amp is inverting.", "The negative sign in front of E indicates the op-amp is inverting."], "jumps": ["P2510", "P2490"]}, {"id": "P2480", "text": ["What is the output polarity if the velocity increases?", "What is the output polarity if the velocity increases?....."], "jumps": ["P2470"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["Note that the velocity input to the differentiator is on the inverting input.  If the velocity input is positive, the output is not positive.", "Note that the velocity input to the differentiator is on the inverting input. If the velocity input is positive, the output is not positive.", "Acceleration = Eout2 - Eout = Ein x R CC"], "jumps": []}, {"id": "P2483", "text": ["The only time the output of A3 is zero is when there is no change in the velocity input.  If the velocity input is changing in the positive direction, A3 will produce an output.", "The only time the output of A3 is zero is when there is no change in the velocity input. If the velocity input is changing in the positive direction, A3 will produce an output."], "jumps": []}, {"id": "P2490", "text": ["Mathematically, the output of the differentiator equals the change in input voltage per change in time, multiplied by the RC time constant.", "Voltage Output -Eout = (Ein/DT)(RF x CIN))"], "jumps": ["P2500", "P2480"]}, {"id": "P2940", "text": ["3.  The output of the circuit is a voltage proportional to velocity            and is equal to:", "3. The output of the circuit is a voltage proportional to velocity and is equal to:"], "jumps": ["P2950", "P2930"]}, {"id": "P2510", "text": ["anges 2 volts per second and the R and C values are as shown, E is -2 volts.", "-Eout = (DEin/DT)(RF x CIN) = (2V/1)(1M x 1m", ") = (2)(1) = -2V", "For example, if the velocity output of A2 changes 2 volts per second and the R and C values are as shown, E is -2 volts.."], "jumps": ["P2520", "P2490"]}, {"id": "P2520", "text": ["Note that the R and C values are chosen to scale the outpu let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
