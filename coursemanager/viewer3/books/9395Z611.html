abbreviations.."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P320", "text": [], "jumps": []}, {"id": "P1250", "text": ["Part 23 is like a test-flight checklist. It provides all of the requirements or tests that must be performed in order for an aircraft to obtain a Type Certificate."], "jumps": ["P1260", "P1240"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1940", "text": ["3. Part 35: Airworthiness Standards: Propellers Part 39: Airworthiness Directives (AD's) Part 43: Maintenance, Preventive Maintenance, Rebuilding, and Alterationnn"], "jumps": ["P1950", "P1920"]}, {"id": "PINFO", "text": ["04-24-03 Converted from sty to tbk & formatted lesson. frieda", "04-23-03 Converted from sty to tbk & formatted lesson. frieda 04-24-03 Added help pages to final quiz script. frieda 02-09-05 Quick run through for pre-release of lesson. -Penny"], "jumps": []}, {"id": "P470", "text": ["Let's begin our lesson on AERONAUTICAL REGULATORY PUBLICATIONS.............."], "jumps": ["P460"]}, {"id": "P1400", "text": ["The definition of a major repair is: listed in the aircraft, aircraft engine, or propeller specifications: ices A, B, and D. Let's take a look.", "- That might appreciably affect weight, balance, structural strength, performance, powerplant operation, flight characteristics, or other qualities affecting airworthiness; or - That is not done according to accepted practices or cannot be done by the basic operations.", "- If improperly done, might appreciably affect the weight, balance, structural strength, performance, powerplant operation, flight characteristics, or other qualities affecting airworthiness, or * Not done according to accepted practices or cannot be done by basic operations.", "- If improperly done, might appreciably affect the weight, balance, structural strength, performance, powerplant operation, flight characteristics, or other qualities affecting airworthiness, or - Not done according to accepted practices or cannot be done by basic operations.f fraudulently certifying records. - Directions on the use of certified maintenance manuals........................", "1. Federal Aviation Regulations and Rules"], "jumps": ["P1370", "P1410"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1640", "text": ["What happens if you are trying to move an aircraft and your radio is inoperable?"], "jumps": ["P1650", "P1630"]}, {"id": "P440", "text": ["The A&P Certified Technician can be held legally liable for any and all damages that occur out of their neglect."], "jumps": ["P450", "P430"]}, {"id": "P1040", "text": ["Which parts of the FAR will affect you as the AMT? The answer lies in what type of aircraft you are working on, what type of operation you are working at, and what certifications you currently hold..."], "jumps": ["P1050", "P1030"]}, {"id": "P1070", "text": ["Part 1 is the glossary of terms and abbreviations for the FAR."], "jumps": ["P1080", "P1060"]}, {"id": "P1140", "text": ["\"Shall\" is used when it is mandatory or required that something be done in a certain way. There are no alternatives when shall is used.", "Part 1 is the glossary of terms and abbreviations for the FAR."], "jumps": ["P1150", "P1130", "P1060"]}, {"id": "P1080", "text": ["Some of the words and definitions should be committed to memory. NOTE: NEED GRAPHIC THAT ROLLOVER DEFINITIONSSSSS JAA, etc.). * Airworthiness Directive (AD)-A regulatory notice sent out by the FAA to the registered owner of an aircraft informing him or her of the discovery of a condition that prevents the aircraft from continuing to meet its conditions or airworthiness. * Airworthy-A condition in which the aircraft or component meets the conditions of its type design and is a condition for safe operation. * Alterations-A change to a certificated aircraft, aircraft engine, propeller, or appliance. * Appliances-Any device used in the operation of an aircraft that is not a part of the airframe, engine, or propeller. Pumps, actuators, generators, instruments, radio receivers and transmitters are all examples of appliances. * Type Certificate Data Sheets (TCDS)-The official specifications of an aircraft, engine, or propeller issued by the FAA. TCDS list pertinent specifications for the device, and it is the responsibility of the technician and /or inspector to assure, on each inspection, that the device meets these specifications.", "* Administrator - The regulatory authority (FAA, CAA, JAA, etc.). * Airworthiness Directive (AD) - A regulatory notice sent out by the FAA to the registered owner of an aircraft informing him or her of the discovery of a condition that prevents the aircraft from continuing to meet its conditions or airworthiness. * Airworthy - A condition in which the aircraft or component meets the conditions of its type design and is a condition for safe operation. * Alterations - A change to a certificated aircraft, aircraft engine, propeller, or appliance. * Appliances - Any device used in the operation of an aircraft that is not a part of the airframe, engine, or propeller. Pumps, actuators, generators, instruments, radio receivers and transmitters are all examples of appliances. * Type Certificate Data Sheets (TCDS) - The official specifications of an aircraft, engine, or propeller issued by the FAA. TCDS list pertinent specifications for the device, and it is the responsibility of the technician and /or inspector to assure, on each inspection, that the device meets these specifications."], "jumps": ["P1090", "P1070"]}, {"id": "P1150", "text": ["Use of the word \"may\" means that something is permitted or can be done.", "1, however, these are a few of the more important ones. NOTE: ROLLOVER TH", "There are numerous abbreviations listed in Part 1, however, these are a few of the more important ones. NOTE: NEED GRAPHIC ROLLOVER FOR THE TERMS LISTED ON PAGES 1980 - 1990"], "jumps": ["P1160", "P1140", "P1110", "P1090"]}, {"id": "P1110", "text": ["Which is a set of guidelines that must be adhered to by everyone in the aviation community?"], "jumps": ["P1100"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["The FAA (Federal Aviation Association) publishes the set of guidelines."], "jumps": []}, {"id": "P1113", "text": ["AMT is the abbreviation for Air Maintenance Technician....."], "jumps": []}, {"id": "P1120", "text": ["What information can be found in FAR part 1?...............", "Instrument flight rules and AMT licensing parameters", "Aircraft performance regulations and rules", "Aeronautical word definitions and abbreviation meanings"], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["Part 1 is the glossary of terms and abbreviations for the FAR."], "jumps": []}, {"id": "P1130", "text": ["Part 1 also explains how extremely important words are used in any regulatory document."], "jumps": ["P1140", "P1120"]}, {"id": "P1192", "text": ["Since the publication used the word SHALL, it is mandatory that the calibration is completed prior to the aircraft's return to service."], "jumps": []}, {"id": "P1210", "text": ["Part 13: Investigative and Enforcement Procedures. This Part establishes the rules, fines, procedures, and punishment that the FAA can impose in order to prosecute criminal acts.", "Knowing how these key words are used will make the FAR much easier to understand."], "jumps": ["P1220", "P1200", "P1180", "P1160"]}, {"id": "P1180", "text": ["What word is used when the FAA allows the AMT to do a procedure but does not necessarily mandate the procedure?"], "jumps": ["P1170"]}, {"id": "P1181", "text": [], "jumps": []}, {"id": "P1230", "text": ["These type of certification forms are called TYPE CERTIFICATE DATA SHEETS (TCDS). We will discuss these in detail in the next section."], "jumps": ["P1240", "P1220"]}, {"id": "P1260", "text": ["In layman terms, if you request authorization for an aircraft or part (Type Certification) under Part 21; you must also comply with the testing instructions included in Part 23."], "jumps": ["P1270", "P1250"]}, {"id": "P1190", "text": ["An FAA publication states: A calibration of the system shall be performed after maintenance is completed. This means:", "The AMT should perform a calibration but does not have to if the aircraft needs to quickly be returned to service.", "The AMT is not required to perform a calibration if the completed maintenance was considered minor.", "The AMT is required to perform a calibration of the system when the maintenance is completed."], "jumps": ["P1180"]}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P2290", "text": ["General Aviation Airworthiness Alerts provide a common communication channel through which the aviation community can improve aeronautical product durability, reliability, and safety..."], "jumps": ["P2300", "P2280"]}, {"id": "P2090", "text": ["Other AC's of importance to the AMT are normally located in the back section of any commercially available AMT FAR publication."], "jumps": ["P2100", "P2080"]}, {"id": "P1240", "text": ["Part 23: Airworthiness Standards: Normal, Utility, Acrobatic, and Commuter Category Airplanes. This part prescribes airworthiness standards for the issue of type certificates, and changes to those certificates for airplanes listed in this category..."], "jumps": ["P1250", "P1230"]}, {"id": "P1360", "text": ["- Definition of the use of the terms overhaul and rebuilt. - Limitations on the level of aircraft maintenance one can perform. - Authorization of who can return an aircraft to airworthiness status after the completion of the different levels of maintenance. - The required maintenance records and their disposition. - The results of fraudulently certifying records. - Directions on the use of certified maintenance manuals........................", "Part 43 is very important to the AMT. It provides you with: finition of the use of the terms overhaul and rebuilt. * Limitations on the level of aircraft maintenance one can perform. * Authorization of who can return an aircraft to airworthiness status after the completion of the different levels of maintenance. * The required maintenance records and their disposition. * The results of fraudulently certifying records. * Directions on the use of certified maintenance manuals..."], "jumps": ["P1370", "P1350"]}, {"id": "P1182", "text": ["The word SHALL is used to mandate a procedure.............."], "jumps": []}, {"id": "P1270", "text": ["Part 27: Airworthiness Standards: Normal Category Rotorcraft. This part prescribes airworthiness standards for the issue of type certificates, and changes to those certificates, for normal category rotorcraft with a maximum weight of 7,000 pounds or less and nine passenger seats..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["In order for a manufacturer of a Normal Category Rotorcraft or its system to obtain type certification with the FAA, they must comply with both Parts 21 and 27."], "jumps": ["P1290", "P1270"]}, {"id": "P1410", "text": ["Preventive Maintenance is maintenance procedures followed to keep a piece of equipment working properly. Changing the oil, cleaning system strainers, replacing hoses and connections are examples of preventive maintenance..."], "jumps": ["P1420", "P1400"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Part 35: Airworthiness Standards: Propellers. This part prescribes airworthiness standards for the issue of type certificates and changes to those certificates, for propellers."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["In order for a manufacturer of Propellers or Propeller systems to obtain type certification with the FAA, they must comply with both Parts 21 and 35."], "jumps": ["P1330", "P1310"]}, {"id": "P1580", "text": ["Appendix E provides information on Altimeter System Test and Inspections. Appendix F provides information on ATC Transponder Tests and Inspections."], "jumps": ["P1590", "P1560"]}, {"id": "P1340", "text": ["Airworthiness Directives are important to aircraft owners and maintainers. We will discuss AD's in detail in the next section."], "jumps": ["P1350", "P1330"]}, {"id": "P1390", "text": ["- That might appreciably affect weight, balance, structural                           strength, performance, powerplant operation, flight                                   characteristics, or other qualities affecting airworthiness; or \n\n    - That is not done according to accepted practices or cannot be                  done by the basic operations.", "A major alteration is an alteration not listed in the aircraft, aircraft engine, or propeller specifications: ices A, B, and D. Let's take a look.", "- That might appreciably affect weight, balance, structural strength, performance, powerplant operation, flight characteristics, or other qualities affecting airworthiness; or - That is not done according to accepted practices or cannot be done by the basic operations."], "jumps": ["P1400", "P1370"]}, {"id": "P1420", "text": ["Appendix B - Recording of Major Repairs and Major Alterations. Appendix B revolves around the FAA required paperwork involved for Major Repairs. We will be discussing this more in depth with the lesson on Forms and Records."], "jumps": ["P1430", "P1370"]}, {"id": "P1470", "text": ["Aircraft or component cycles is another method of determining inspection intervals. The actual numbers of landings on a landing gear, or the number of times an engine is run from idle to full power and back is are examples of cycles...", "What happens if you are trying to move an aircraft and your radio is inoperable?"], "jumps": ["P1480", "P1460"]}, {"id": "P1380", "text": ["Appendix A - Major Alterations, Major Repairs, and Preventive Maintenance. Appendix A provides examples of what the FAA considers as Major Alterations, Repair, and Preventive Maintenance in order to maintain an aircraft in an airworthy condition."], "jumps": ["P1390", "P1370"]}, {"id": "P2140", "text": ["Emergency Airworthiness Directives are issued when an unsafe condition exists that requires immediate action. Emergency AD's are intended to rapidly correct an urgent safety of flight situation..."], "jumps": ["P2150", "P2130"]}, {"id": "P2920", "text": ["1. Advisory Circulars (AC's): AC information is published by the FAA explaining the FAR and describing methods of performing certain maintenance and inspection procedures. AC-65-9A General Handbook AC-65-12 Airframe Handbook AC-65-15A Powerplant Handbook AC-43-13-1A & 2B Acceptable Methods, Techniques, and Practices: Aircraft Inspections and repair; Aircraft Alterations", "- AC-65-9A General Handbook - AC-65-12 Airframe Handbook - AC-65-15A Powerplant Handbook - AC-43-13-1A & 2B Acceptable Methods, Techniques, and Practices: Aircraft Inspections and repair; Aircraft Alterations pliances, and component parts of such aircraft. NOTE: This part does not apply to experimental aircraft.............ifying records. - Directions on the use of certified maintenance manuals........................", "- Aircraft having a U.S. airworthiness certificate. - Foreign - registered civil aircraft used in common carriage or carriage of mail under the provisions of Part 121 or 135. - Airframes, aircraft engines, propellers, appliances, and component parts of such aircraft. NOTE: This part does not apply to experimental aircraft."], "jumps": ["P2930", "P2001"]}, {"id": "P1550", "text": ["The aircraft may be approved for service as airworthy by an A&P Certificated Technician, person with an Inspection Authorization (IA), Repair Station, or manufacturer, after the 100 hour inspection is completed...", "cturer, after the 100 hour inspection is completed..."], "jumps": ["P1560", "P1540"]}, {"id": "P1540", "text": ["The 100-hour inspection is required for those aircraft for hire (See Part 91)."], "jumps": ["P1550", "P1520"]}, {"id": "P1430", "text": ["Appendix B provides the rules and guidelines for Recording Major Repairs and Alterations."], "jumps": ["P1440", "P1420"]}, {"id": "P1720", "text": ["Part 145: Repair Stations. Part 145 describes how to obtain a repair station certificate."], "jumps": ["P1730", "P1710"]}, {"id": "P2160", "text": ["A Rulemaking AD usually involves a Notice of Proposed Rulemaking (NPRM) followed by a Final Rule. Rulemaking AD's are issued when a change to a rule is proposed that would provide a long term solution to an unsafe process, procedure, or product..."], "jumps": ["P2170", "P2150"]}, {"id": "P2080", "text": ["It is very important that each AMT own a set of the most popular AC's. These publications are instrumental to your passing of the A&P computer-based, oral and practical examinations."], "jumps": ["P2090", "P2050"]}, {"id": "P2230", "text": ["When an AD is issued that requires specific corrective action on aircraft or aircraft component, an aircraft log book entry must be made identifying the AD and the corrective action."], "jumps": ["P2240", "P2220"]}, {"id": "P2260", "text": ["Type Certificate Data Sheets (TCDS): Describe the type of aircraft design and limitations prescribed by the applicable FAR."], "jumps": ["P2270", "P2250"]}, {"id": "P1690", "text": ["This Part covers everything from special aircraft systems design, preventive maintenance, alterations, airworthiness and certificate requirements as they apply to aircraft for hire."], "jumps": ["P1700", "P1680"]}, {"id": "P1520", "text": ["You will need to know what type of maintenance and inspections are involved with the 100-hour and annual inspections. Appendix D provides the technician with a list of items that must be inspected..."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["The A&P Technician may develop his/her own inspection list, as long as the list encompasses all of the inspection items that the FAA (Appendix D) and manufacturer require."], "jumps": ["P1540", "P1520"]}, {"id": "P1290", "text": ["Part 33: Airworthiness Standards: Aircraft Engines. This part prescribes airworthiness standards for the issue of type certificates and changes to those certificates, for aircraft engines."], "jumps": ["P1300", "P1270"]}, {"id": "P1480", "text": ["Lubrication oils, hydraulic fluid, and fuel sampling can also drive scheduled or unscheduled inspections. These samples normally start off as hourly inspections, but can lead into calendar or cycle inspections, depending on the findings of the tests..."], "jumps": ["P1490", "P1470"]}, {"id": "P1570", "text": ["After the annual inspection is complete the aircraft may be approved for service as airworthy by a person with an Inspection Authorization (IA), Repair Station, or manufacturer."], "jumps": ["P1580", "P1560"]}, {"id": "P1600", "text": ["The important thing to remember from this lesson is that Part 65, Subpart D provides the directions and requirement in order to make application to the FAA for the A&P certification."], "jumps": ["P1610", "P1590"]}, {"id": "P1610", "text": ["Part 65, Subpart E provides the instructions for personnel making application for the Repairman Certification."], "jumps": ["P1620", "P1600"]}, {"id": "P1710", "text": ["There are exceptions, but most aircraft are required to depart and return to the same airfield."], "jumps": ["P1720", "P1700"]}, {"id": "P2270", "text": ["The Type Certificate Data Sheet is very similar to the owner's manual of your car. The information is general in nature (type of gas, model designations, gauge limits, center of gravity, names of manufacturers of aircraft and propeller, maximum weights, number of seats, placard information, etc.)..."], "jumps": ["P2280", "P2260"]}, {"id": "P2350", "text": ["The Technical Standard Order (TSO) is an approval issued by the FAA for the manufacture of a component for installation on a certificated aircraft."], "jumps": ["P2360", "P2340"]}, {"id": "P2372", "text": ["Airworthiness Directives are mandatory, not advisory.......", "What happens if you are trying to move an aircraft and your radio is inoperable?"], "jumps": ["P1650", "P1630"]}, {"id": "P1650", "text": ["The control tower has a method for contacting you via lights. Knowing these basic light symbols will assist you in an emergency should you have to cross an active airfield without a radio..."], "jumps": ["P1660", "P1640"]}, {"id": "P1060", "text": ["You will see abbreviations, aviation jargon, and statements in the FAR that appear to have been written by lawyers. Part 1 of the manual will help you decipher the language, understand how certain words are used and explain abbreviations..."], "jumps": ["P1070", "P1050"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2170", "text": ["Since Rulemaking AD's are usually not time critical, an NPRM is issued to allow technicians a period of time to comment on the rule change. If no comments are received that would change the proposal, a Final Rule AD is issued for permanent compliance..."], "jumps": ["P2180", "P2160"]}, {"id": "P2200", "text": ["There are times when manufacturers or operators of aircraft outside the U.S. may identify an unsafe condition on one of their aircraft or aircraft parts. The FAA is notified by International Civil Aviation Organization (ICAO) using the Mandatory Continued Airworthiness Information (MCAI) system...", "It is very important that each AMT own a set of the most popular AC's. These publications are instrumental to your passing of the A&P computer-based, oral and practical examinations."], "jumps": ["P2210", "P2190", "P2090", "P2050"]}, {"id": "P1560", "text": ["The annual inspection is done on an annual basis for privately owned aircraft that are used for personal use and not for hire."], "jumps": ["P1570", "P1550"]}, {"id": "P1590", "text": ["Part 65: Certification: Airmen Other Than Flight Crewmembers. Part 65 provides the guidance and requirements for anyone making application with the FAA for certification. We will be mostly concerned with Subpart D-Mechanics...", "Part 147: Aviation Maintenance Technician Schools. Part 147 provides the school with guidelines for the curriculum as well as the number of hours a student must be enrolled."], "jumps": ["P1600", "P1580"]}, {"id": "P1910", "text": ["This completes the information on FEDERAL AVIATION REGULATIONS AND RULES."], "jumps": ["P1001", "P1740"]}, {"id": "P1920", "text": ["1. Part 1: Identifies all of the definitions and abbreviations utilized throughout the FAR's. Part 1 is very similar to a dictionary. Part 13: Investigative and Enforcement Procedures. Part 21: Certification Procedures for Products and Parts."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Part 23: Airworthiness Standards: Normal, Utility, Acrobatic, and Commuter Category Airplanes Part 27: Airworthiness Standards: Normal Category Rotorcraft Part 33: Airworthiness Standards: Aircraft Engines"], "jumps": ["P1940", "P1920"]}, {"id": "P1100", "text": ["There are numerous abbreviations listed in Part 1, however, these are a few of the more important ones. NOTE: NEED GRAPHIC ROLLOVER FOR THE TERMS LISTED ON PAGES 1980 - 1990", "AGL- Above Ground Level ILS- Instrument Landing System ATC- Air Traffic Control M- Mach Number CAS- Calibrated Air Speed MSL- Mean Sea Level FAA - Federal Aviation Administration OEI - One engine inoperative IAS - Indicated airspeed IFR - Instrument Flight Rules VFR - Visual flight rules VHF- Very high frequencyyyyyyyyyyyyyyyyyyyyry high frequency"], "jumps": ["P1110", "P1090"]}, {"id": "P1950", "text": ["4. Appendix A - Major Alterations, Major Repairs, and Preventive Maintenance Appendix B - Recording of Major Repairs and Major Alterations Appendix D - Scope and Detail of Items (as applicable to the Particular Aircraft) To Be Included in Annual and 100-hour Inspectionnnnnnnnnn Inspection"], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5. Part 65: Certification: Airmen Other Than Flight Crewmembers Part 91: Air Traffic and General Operating Rules Subpart E of Part 91 prescribes rules governing the maintenance, preventive maintenance, and alterations of U.S. registered civil aircraft operating within or outside of the United States."], "jumps": ["P1970", "P1920"]}, {"id": "P1970", "text": ["6. Part 121: Air Carriers For Compensation or Hire: Certification and Operations Part 135: Operating Requirements: Commuter and On- Demand Operations and Rules Governing Persons On Board Such Aircraft Part 145: Repair Stations Part 147: Aviation Maintenance Technician Schools"], "jumps": ["P1972", "P1920"]}, {"id": "P1972", "text": ["7. Part 145: Repair Stations Part 147: Aviation Maintenance Technician Schools"], "jumps": ["P1980", "P1920"]}, {"id": "P1980", "text": ["8. AGL- Above Ground Level ILS- Instrument Landing System ATC- Air Traffic Control M- Mach Number CAS- Calibrated Air Speed MSL- Mean Sea Level OEI- One engine inoperative IAS- Indicated airspeed VFR- Visual flight rules IFR- Instrument Flight Rules VHF- Very high frequency VHF- Very high frequencyyhigh frequencyyry high frequency"], "jumps": ["P1982", "P1920"]}, {"id": "P1982", "text": ["9. FAA - Federal Aviation Adm. OEI - One engine inoperative IAS - Indicated airspeed IFR - Instrument Flight Rules VFR - Visual flight rules VHF- Very high frequency high frequencyS- Indicated airspeed VFR- Visual flight rules IFR- Instrument Flight Rules VHF- Very high frequencyyyyyyyyyyyy VHF- Very high frequencyyhigh frequencyyry high frequency"], "jumps": ["P1999", "P1920"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P1920"]}, {"id": "P2020", "text": ["The FAA, as well as most aviation regulation authorities around the world, publish regulatory publications to assist aircraft owners and aircraft maintenance technicians with keeping their aircraft in top airworthiness condition."], "jumps": ["P2030", "P2001"]}, {"id": "P2050", "text": ["The AC's are numbered by the FAR Part that is applicable to the information contained with in the AC. AC-65-12 provides advisory information on Part 65 of the FAA Regulations."], "jumps": ["P2060", "P2040"]}, {"id": "P1670", "text": ["Subpart E of Part 91 prescribes rules governing the maintenance, preventive maintenance, and alterations of U.S. registered civil aircraft operating within or outside of the United States. rt 43 and Subpart E of Part 91 go hand in hand. Remember when we discussed inspections in Part 43 and the FAA's inspection checklist? Subpart E defines the actual times and procedures that must be followed in order to successfully comply with this part....."], "jumps": ["P1672", "P1660"]}, {"id": "P2030", "text": ["Let's take a look at some of the regulatory publications that an AMT encounters."], "jumps": ["P2040", "P2020"]}, {"id": "P1730", "text": ["It also contains the rules a certified repair station must follow related to its performance of maintenance, preventive maintenance, or alterations of an aircraft, engine, propeller, appliance, or component part to which Part 43 (Maintenance, Preventive Maintenance, Rebuilding, and Alteration) applies.n) applies.....", "The AC's are numbered by the FAR Part that is applicable to the information contained with in the AC. AC-65-12 provides advisory information on Part 65 of the FAA Regulations."], "jumps": ["P1740", "P1720", "P2060", "P2040"]}, {"id": "P2060", "text": ["AC's explain the FAR's and describe methods of performing certain maintenance and inspection procedures."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Compliance with AC's is not mandatory, and the information in the AC's is not necessarily approved data."], "jumps": ["P2080", "P2050"]}, {"id": "P2100", "text": ["Airworthiness Directives (AD's) are regulations issued by the FAA to correct an unsafe condition in an aircraft or aircraft component. Before issuing an AD, the FAA must determine that an unsafe condition exists and that it is likely to exist or develop in other aircraft or aircraft components..."], "jumps": ["P2110", "P2090"]}, {"id": "P2120", "text": ["No person shall operate an aircraft or aircraft component that is identified by an AD until the requirements of the directive have been satisfied. Some AD's allow for operation of the aircraft for a prescribed time period before the AD must be satisfied...", "Airworthiness Directives (AD's) are regulations issued by the FAA to correct an unsafe condition in an aircraft or aircraft component. Before issuing an AD, the FAA must determine that an unsafe condition exists and that it is likely to exist or develop in other aircraft or aircraft components..."], "jumps": ["P2130", "P2110"]}, {"id": "P2110", "text": ["Much like Recall Notices on your car, AD's notify aircraft owners, technicians, and other interested persons of unsafe conditions, prescribe the conditions under which the product may continue to be operated, and describe the corrections that must be accomplished..."], "jumps": ["P2120", "P2100"]}, {"id": "P420", "text": ["The regulations applicable to the AMT are available free online through the FAA (www.faa.gov) or for purchase through several commercial companies. It is important for all Airframe and Powerplant (A&P) AMT's to have a copy of this publication as part of their own library..."], "jumps": ["P430", "P410"]}, {"id": "P2130", "text": ["AD's can be issued as an Emergency AD or a Rulemaking AD..."], "jumps": ["P2140", "P2120"]}, {"id": "P1150", "text": ["Use of the word may means that something is permitted or can be done."], "jumps": ["P1160", "P1140"]}, {"id": "P2150", "text": ["The Emergency AD is sent to all known owners and operators of the affected aircraft or aircraft components by telegram, email, fax or letter."], "jumps": ["P2160", "P2140"]}, {"id": "P1030", "text": ["Each chapter or section in the FAR is actually called a PART. We will be referencing the chapters or sections using the term Part in this lesson...", "Since Rulemaking AD's are usually not time critical, an NPRM is issued to allow technicians a period of time to comment on the rule change. If no comments are received that would change the proposal, a Final Rule AD is issued for permanent compliance..."], "jumps": ["P1040", "P1020", "P2180", "P2160"]}, {"id": "P2180", "text": ["In certain cases, the critical nature of an unsafe condition, although not an emergency, may warrant the immediate adoption of a rule or rule change without advanced notice or request for comments. In this case, a Final Rule with Request for Comments (FRRC) can be issued by the FAA..."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["This exception to the standard Rulemaking AD procedure is used when it is determined that the corrective action must be completed within 60 days or less. As with all AD's, the Final Rule will be published in the Federal Register with a request for comments...", "There are times when manufacturers or operators of aircraft outside the U.S. may identify an unsafe condition on one of their aircraft or aircraft parts. The FAA is notified by International Civil Aviation Organization (ICAO) using the Mandatory Continued Airworthiness Information (MCAI) system..."], "jumps": ["P2200", "P2180", "P2210", "P2190"]}, {"id": "P2210", "text": ["The FAA will then review the MCIA and issue it as an Airworthiness Directive if applicable."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["All AD's include specific information. Click to see what information is included in the selected section. NOTE: NEES GRAPHIC ROLLOVER ON THESE WORDS.afe condition Application - References the aircraft or aircraft component types that are affected by the AD Corrective Action - describes the operating limitations or corrective action that must be preformed, or both. Compliance Time - Specifically provides the time that the AD must be complied with before the aircraft is considered non-airworthy. Additional Information - This section references publications, web site, or manuals that contain additional information concerning the aircraft, aircraft part or AD Alternative Methods of Compliance - This section describes information on alternative methods, if any, on complying with the requirements of the AD", "Description - A description of the unsafe condition Application - References the aircraft or aircraft component types that are affected by the AD Corrective Action - describes the operating limitations or corrective action that must be performed, or both. Compliance Time - Specifically provides the time that the AD must be complied with before the aircraft is considered non-airworthy. Additional Information - This section references publications, web site, or manuals that contain additional information concerning the aircraft, aircraft part or AD Alternative Methods of Compliance - This section describes information on alternative methods, if any, on complying with the requirements of the AD instruments, radio receivers and transmitters are all examples of appliances. * Type Certificate Data Sheets (TCDS) - The official specifications of an aircraft, engine, or propeller issued by the FAA. TCDS list pertinent specifications for the device, and it is the responsibility of the technician and /or inspector to assure, on each inspection, that the device meets these specifications."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["When an AD is issued that requires specific corrective action on aircraft or aircraft component, an aircraft log book entry must be made identifying the AD and the corrective action."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Mandatory Continued Airworthiness Information", "What type of AD is issued by the FAA when an unsafe condition is found that requires immediate attention?"], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["Rulemaking AD's are not critical and do not require immediate attention."], "jumps": []}, {"id": "P2243", "text": ["The MCAI is issued by the International Civil Aviation Organization notifying the FAA of an unsafe condition. The FAA would then issue an AD."], "jumps": []}, {"id": "P2250", "text": ["The FAA issues an Emergency AD for a fuel pump on an aircraft you maintain. When do you have to complete the corrective action?", "Immediately! The aircraft can not fly until the unsafe condition is corrected.", "Before the Compliance Time listed on the AD expires."], "jumps": ["P2240"]}, {"id": "P2251", "text": [], "jumps": []}, {"id": "P2252", "text": ["All AD's will include a Compliance Time section. The unsafe condition must be completed before the time specified in that section."], "jumps": []}, {"id": "P1490", "text": ["Another type inspection that is commonly used by commercial operations is the Progressive Inspection. This type of inspection uses a computer generated Maintenance Due List (MDL).", "Hourly and calendar inspections are the most common........"], "jumps": ["P1500", "P1480", "P1450"]}, {"id": "P2280", "text": ["The AMT will use the information contained within the TCDS as the benchmark as to whether the aircraft is airworthy. During annual and hourly inspections, the AMT compares the aircrafts current state to the specifications of the Type Certificate Data Sheet..."], "jumps": ["P2290", "P2270"]}, {"id": "P2300", "text": ["You can relate the Alerts to an Internet chat line, except that it is published in paper. Alerts are automatically sent to aircraft inspectors, Part 147 schools, repair stations, air taxi operators, and anyone who wants to subscribe to them..."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The Alert is used by manufacturers as well as technicians to report problems that may affect other owners of the equipment. These problems are normally significant in nature, but have not been fully evaluated..."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Significant problems are usually reported directly to the FAA by using the Malfunction or Defect Report. When a problem in a specific area is reported enough times, the FAA will write it up as an Alert..."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["Compliance with a General Aircraft Airworthiness Alert is not mandatory because a GAAA is considered to be an advisory. If the Alert is serious enough, however, the FAA may issue it as an AD, which would then make its compliance mandatory..."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Service Bulletins or Alert Service Bulletins are similar to the General Aviation Airworthiness Alerts. Compliance with either is totally voluntary by the general-aviation operator.", "The Technical Standard Order (TSO) is an approval issued by the FAA for the manufacture of a component for installation on a certificated aircraft."], "jumps": ["P2350", "P2330", "P2360", "P2340"]}, {"id": "P2360", "text": ["The TSO prescribes the minimum performance standards for the component being manufactured. The component manufactured under a TSO is not necessarily approved for use in ALL certificated aircraft but are typically authorized on certain types of aircraft..."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["What type of regulatory publication is used as an advisory communications channel throughout the aviation industry?"], "jumps": ["P2360"]}, {"id": "P2371", "text": [], "jumps": []}, {"id": "P2950", "text": ["4. Service Bulletins or Alert Service Bulletins: Service Bulletins or Alert Service Bulletins are similar to the Alert previously mentioned. Compliance with either is totally voluntary by the general-aviation operator."], "jumps": ["P2960", "P2940"]}, {"id": "P2373", "text": ["Technical Standard Orders provide minimum standards for manufactured aircraft parts."], "jumps": []}, {"id": "P2380", "text": ["An aircraft is undergoing a 100 hour inspection. Which regulatory publication describes the proper aircraft specifications to the AMT?"], "jumps": ["P2370"]}, {"id": "P2381", "text": [], "jumps": []}, {"id": "P2382", "text": ["Service Bulletins and Material Safety Data Sheets do not list aircraft specifications."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on FAA REGULATORY PUBLICATIONS."], "jumps": ["P2001", "P2380"]}, {"id": "P2940", "text": ["3. Type Certificate Data Sheets (TCDS): The TCDS describe the type of aircraft design and sets forth the limitations prescribed by the applicable FAR. ral Aviation Airworthiness Alerts: Alerts provide a common communication channel through which the aviation community can improve aeronautical product durability, reliability, and safety....", "- Aircraft having a U.S. airworthiness certificate. - Foreign - registered civil aircraft used in common carriage or carriage of mail under the provisions of Part 121 or 135. - Airframes, aircraft engines, propellers, appliances, and component parts of such aircraft. NOTE: This part does not apply to experimental aircraft.", "General Aviation Airworthiness Alerts: Alerts provide a common communication channel through which the aviation community can improve aeronautical product durability, reliability, and safety. d repair; Aircraft Alterations pliances, and component parts of such aircraft. NOTE: This part does not apply to experimental aircraft.............ifying records. - Directions on the use of certified maintenance manuals........................", "to assure, on each inspection, that the device meets these specifications."], "jumps": ["P2950", "P2930"]}, {"id": "P2930", "text": ["2. Airworthiness Directives (AD's): AD's are used to notify aircraft owners and other interested persons of unsafe conditions and to prescribe the conditions under which the product may continue to be operated."], "jumps": ["P2940", "P2920"]}, {"id": "P1440", "text": ["Appendix D - Scope and Detail of Items (as applicable to the Particular Aircraft) To Be Included in Annual and 100-hour Inspections. Just like Jiffy Lube has a 30-point checklist for your car. The FAA has certain items on an airplane that have to be inspected at regular intervals."], "jumps": ["P1450", "P1420"]}, {"id": "P1020", "text": ["The Federal Aviation Administration (FAA) publishes a set of guidelines that everyone in the aviation community must adhere to. These are called Federal Aviation Rules and Regulations (FAR)..."], "jumps": ["P1030", "P1001"]}, {"id": "P1160", "text": ["\"Includes\" means that additions to the minimum requirement are OK."], "jumps": ["P1170", "P1150"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2960"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["Investigative and Enforcement Procedures", "Airworthiness Standards: Aircraft Engines", "Certification Procedures for Products and Parts"], "jumps": []}, {"id": "P10211", "text": ["Scope and Detail of Items (as applicable let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
