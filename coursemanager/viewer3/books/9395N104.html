const book = {"title": "9395N104", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Title: PLC TROUBLESHOOTINGasdf asd fasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Observe and understand the normal operation of a PLC controlled system. w Recognize a faulty PLC controlled system. w Identify the possible causes of the fault.", "w Use a four step process to develop an organized troubleshooting strategy. w Identify areas of a PLC controlled system most likely to fail. w Identify areas of a PLC controlled system least likely to fail...y to fail. w Identify areas of a PLC controlled system least likely to fail................."], "jumps": []}, {"id": "P300", "text": ["5. Nida Model 480, 488 Multimeter Equivalent"], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": ["Even the most carefully designed PLC controlled system may experience a problem at some time."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Combining an understanding of the system's operation with a well developed troubleshooting strategy is necessary for finding and correcting the problem."], "jumps": ["P400", "P420"]}, {"id": "P420", "text": ["Let's begin the lesson on PLC TROUBLESHOOTING............................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["A functioning PLC controlled system that is well designed, is efficient and cost-effective."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["1. Observe The System 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Problems may arise, however, and an organized approach to troubleshooting helps identify and correct most problems quickly."], "jumps": ["P1020", "P1040"]}, {"id": "P1040", "text": ["The first step to troubleshooting a PLC controlled system is to observe the operation of the system."], "jumps": ["P1020", "P1050"]}, {"id": "P1050", "text": ["Make notes about the problems observed and identify the areas functioning correctly. Try to logically identify possible causes."], "jumps": ["P1020", "P1060"]}, {"id": "P1060", "text": ["Using the programming device to watch the input and output information as displayed in the programming software can help locate the problem area."], "jumps": ["P1020", "P1070"]}, {"id": "P1070", "text": ["Use any built-in test features available to verify the operation of certain elements in order to eliminate them as possible causes."], "jumps": ["P1020", "P1080"]}, {"id": "P1080", "text": ["Troubleshooting flowcharts or guides are often available and are helpful for identifying the cause, or at least reducing the list of possible causes."], "jumps": ["P1020", "P1090"]}, {"id": "P1090", "text": ["PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts", "A PLC controlled system can be divided into 5 possible problem areas from the most likely to fail to least likely to fail. C System Problem Areas Elements of the System Wiring between Elements and I/O Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1020", "P1100"]}, {"id": "P1100", "text": ["The elements of the system include the mechanical switches, motors, and sensors. These are some of the most likely causes of a problem since they are subjected to wear and possible eventual failure.... Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["The wiring between the elements and the I/O terminals is also a very likely place for failure since faulty wiring or mechanical problems can interrupt or short the signals. fail. ween Elements and I/O Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1090", "P1120"]}, {"id": "P1120", "text": ["The I/O modules usually contain built-in protection factors but these may be damaged if subjected to voltages or loads which exceed specifications. subject to wear out and fail. ween Elements and I/O Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1090", "P1130"]}, {"id": "P1130", "text": ["Observing the I/O status lights may help determine if the I/O module is functioning properly.", "The PLC processor hardware is not likely to fail since modern microcomputer hardware is quite reliable when operating within manufacturer's specifications. to wear out and fail. ween Elements and I/O Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1120", "P1140", "P1150"]}, {"id": "P1150", "text": ["The system usually shuts down completely if the PLC hardware fails, but minor faults may be identified using the processor module's status lights."], "jumps": ["P1140", "P1160"]}, {"id": "P1160", "text": ["The ladder logic program is least likely to be the cause of the problem if the program was operating properly at one time. manufacturer's specifications. to wear out and fail. ween Elements and I/O Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1140", "P1170"]}, {"id": "P1170", "text": ["The leading reason a program causes problems is if an unanticipated condition arises which the program was not designed to manage.anage."], "jumps": ["P1140", "P1180"]}, {"id": "P1180", "text": ["Modifying the program to accept and handle the new condition should correct the problem."], "jumps": ["P1140", "P1190"]}, {"id": "P1190", "text": ["If all other possible causes have been eliminated, however, then reloading the ladder logic program from the master copy is advisable."], "jumps": ["P1140", "P1200"]}, {"id": "P1200", "text": ["Which section is the most likely cause of a problem in a PLC controlled system?"], "jumps": ["P1090"]}, {"id": "P1201", "text": ["PLC processor hardware is unlikely to fail. Current microcomputer hardware is very reliable when used according to manufacturer's specifications."], "jumps": []}, {"id": "P1203", "text": ["The I/O modules rarely fail unless subjected to voltages or loads which exceed specifications."], "jumps": []}, {"id": "P1204", "text": ["The ladder logic program is the least possible cause of a problem if the program was operating properly at one time."], "jumps": []}, {"id": "P1210", "text": ["A small part of a PLC controlled system contains an LED which illuminates when a push button switch is depressed. This part of the system was working for quite a while and then stopped functioning. You have determined that the push button switch and LED are functional. What is the most probable cause???"], "jumps": ["P1200"]}, {"id": "P1211", "text": [], "jumps": []}, {"id": "P1212", "text": ["An I/O module is unlikely to be damaged unless the module is subjected to voltages and loads which exceed specifications. Also, only one small part of the system is not functioning and a damaged I/O module often affects many inputs and outputs connected to that module..."], "jumps": []}, {"id": "P1213", "text": ["The ladder logic program is the least possible cause of a problem if the program was operating properly at one time."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING STRATEGY.", "1. Observe The System 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "1. An organized approach to troubleshooting helps identify and correct most problems quickly."], "jumps": ["P1210", "P1001", "P1930"]}, {"id": "P1930", "text": ["PLC System Problem Areas Test Features 2. Use The Programming Device 4. Consult Flow Charts", "2. A PLC controlled system can be divided into 5 possible problem areas from the most likely to fail to least likely to fail. PLC System Problem Areas Elements of the System Wiring between Elements and I/O Modules I/O Modules PLC Processor Hardware"], "jumps": ["P1920", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1930", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["In this experiment you will observe the normal operation of a PLC controlled process and then identify the problem when the system malfunctions."], "jumps": ["P2001", "P2030"]}, {"id": "P2030", "text": ["The PC5050-2 Heater Process experiment card simulates a PLC controlled system which automatically regulates the temperature of the liquid in a tank."], "jumps": ["PQL"]}, {"id": "P2040", "text": ["The temperature of the liquid in a tank is represented by the air temperature around a heating element."], "jumps": ["P2030", "P2050"]}, {"id": "P2050", "text": ["The liquid's level is manually controlled. The heater should not operate when the level is too low."], "jumps": ["P2030", "P2060"]}, {"id": "P2060", "text": ["The potentiometer near TP6 is the thermostat used to set the desired temperature of the tank's liquid where 1 V = 10"], "jumps": ["P2030", "P2070"]}, {"id": "P2070", "text": ["The PLC compares the thermostat's value to the liquid's actual temperature and turns the heating element on or off as needed."], "jumps": ["P2080", "P2030"]}, {"id": "P2080", "text": ["LED Temp. LED Temp. A >25", "C C >35", "C D >40", "The PLC also illuminates the LED which corresponds to the liquid's temperature."], "jumps": ["P2030", "P2090"]}, {"id": "P2090", "text": ["The over temperature sensor sets the maximum safe temperature level. The PLC illuminates a warning LED when the liquid's temperature exceeds this setting."], "jumps": ["P2030", "P2100"]}, {"id": "P2100", "text": ["An error LED illuminates and the alarm sounds if the liquid's temperature exceeds the maximum safe level for more than 15 seconds.s."], "jumps": ["P2030", "P2110"]}, {"id": "P2110", "text": ["Pressing the lamp test button sounds the alarm, turns on the heater bulb, and illuminates all the LED's except the level indicator and overtemp LED's."], "jumps": ["P2030", "P2120"]}, {"id": "P2120", "text": ["The start and stop buttons on the PC5050-1 card start and stop the entire process of the PC5050-2 card. Let's watch the normal operation of this PLC controlled process."], "jumps": ["P2030", "P2130"]}, {"id": "P2130", "text": ["1. Place the PC5050-1 card in the PC1 position and PC5050-2 card in the PC2 position."], "jumps": ["P2135", "P2030", "P2140"]}, {"id": "P2135", "text": ["PC CARD PLACEMENT - Align the connectors on the PC5050-1 card with the pins for the PC1 position and the PC5050-2 card with the pins for the PC2 position on the Nida Model 5050 PLC trainer. Gently push down on the cards.", ")/*C*E*E)*EE))EFEDC!H&CEEEIE)**)E)*))E B*EEE)*C*HEEEHFWHEY", "E)E)D))ZGDD0GDDD))* *)AEE,A)E))H)HE))HX)"], "jumps": []}, {"id": "P2140", "text": ["Main Power ON DC Power ON Monitor ON Process Selector OFF + DC Voltage Select 5V PC1 & PC2 Power OFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF", "2. Set the PLC Trainer to the initial control settings. in Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFF"], "jumps": ["P2130"]}, {"id": "P2145", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2150", "text": ["+ DC Voltage Select 24V PC1 Power ON PC2 Power ON ON Process Selector OFF + DC Voltage Select 5V PC1 & PC2 Power OFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF", "3. Set the PLC Trainer controls as follows:DC Voltage Select 24V PC1 Power ON PC2 Power ON"], "jumps": ["P2140"]}, {"id": "P2160", "text": ["PC5050-2 Level Switch Full Thermostat Full CCW Over Temperature Full CW Alarm Switch OFF OFF + DC Voltage Select 5V PC1 & PC2 Power OFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF", "PC5050-1 Power Switch OFF Analog Control Switch OFF ON Process Selector OFF + DC Voltage Select 5V PC1 & PC2 Power OFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF", "4. Set the PC5050-1 Process Control Card as follows: 5. Set the PC5050-2 Heater Process Card as follows: PC5050-1 Power Switch OFF Analog Control Switch OFF PC5050-2 Level Switch Full"], "jumps": ["P2165", "P2150", "P2170"]}, {"id": "P2165", "text": ["PC5050-1 SWITCH SETTINGS - Set the Power switch to OFF and the Analog Control switch to OFF."], "jumps": ["P2166"]}, {"id": "P2166", "text": ["PC5050-2 SWITCH SETTINGS - Set the Level switch to FULL, the Thermostat to FULLY CCW, the Over Temperature to FULLY CW and Alarm Switch to OFF."], "jumps": ["P2165", "P2160", "P", "PP"]}, {"id": "P2170", "text": ["6. Turn the Alarm Switch to ON. Watch the LED's and the heater bulb on the PC5050-2 card and listen for the alarm as you press and release the lamp test button. All of the LED's should illuminate except the overtemp and level LED's."], "jumps": ["P2175", "P2160", "P2180"]}, {"id": "P2175", "text": ["PC5050-2 CARD - Watch the LED's and the heater bulb and listen for the alarm as you press and release the lamp test button."], "jumps": ["P", "PP"]}, {"id": "P2180", "text": ["7. Connect the multimeter to measure voltage at TP6. 8. Adjust the thermostat on the PC5050-2 card to 41", "C using the conversion of 1 V = 10"], "jumps": ["P2185", "P2170", "P2190"]}, {"id": "P2185", "text": ["THERMOSTAT ADJUSTMENT - Connect the multimeter as shown. Slowly rotate the thermostat potentiometer CW to 4.1 V."], "jumps": []}, {"id": "P2190", "text": ["9. Connect the multimeter to measure voltage at TP3. 10. Adjust the over temperature sensor on the PC5050-2 card to 45"], "jumps": ["P2195", "P2180", "P2200"]}, {"id": "P2195", "text": ["OVERTEMPERATURE ADJUSTMENT - Connect the multimeter as shown. Slowly rotate the overtemp potentiometer CCW to 4.5 V."], "jumps": []}, {"id": "P2200", "text": ["11. Connect the multimeter to measure voltage at TP5. What does this voltage measurement indicate?"], "jumps": ["P2205", "P2190"]}, {"id": "P2201", "text": [], "jumps": []}, {"id": "P2202", "text": ["The thermostat setting is measured at TP6. Look at the PC5050-2 card and identify where the path through TP5 is coming from..", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["PS", "P"]}, {"id": "P2203", "text": ["The over temperature reading is taken at TP3. Look at the PC5050-2 card and identify where the path through TP5 is coming from.", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["PS", "P"]}, {"id": "P2205", "text": ["MULTIMETER SETUP - Connect the multimeter to the PC5050-2 card as shown.", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["PS", "P"]}, {"id": "P2210", "text": ["What is the current temperature of the tank's liquid? numeric answer (5) in a variable.able.le."], "jumps": ["P2215", "P2212", "P2200"]}, {"id": "P2211", "text": [], "jumps": []}, {"id": "P2212", "text": ["The current temperature of the liquid is measured at TP5, remembering that 1 V = 10", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["PS", "P"]}, {"id": "P2213", "text": ["The liquid's current temperature is found by multiplying the voltage at TP5 by 10 since 1 V = 10", "C. The voltage measurement should be between 2.0 V and 4.0 V for a temperature range of 20", "C. Please contact your instructor if your temperature measurement is above 40", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["P2210", "PutVar", "PS", "P"]}, {"id": "P2215", "text": ["TEMPERATURE MEASUREMENT - The current temperature of the liquid in the tank is found by measuring the voltage at TP5 and multiplying by 10 since 1 V = 10", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["PS", "P"]}, {"id": "P2220", "text": ["Based on the following information, what do you expect to happen when the start button on the PC5050-1 card is pressed?"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["The current temperature of the liquid is lower than the thermostat value. The purpose of the system is to maintain the liquid at a set temperature of 41", "C, so think about what must happen in order to raise the liquid's temperature to the thermostat value. .ermostat Setting 41C Overtemp Setting 45C Liquid's Current Temp @%200"], "jumps": []}, {"id": "P2223", "text": ["The overtemp alarm sounds when the liquid's current temperature rises above the over temperature setting for more than 5 seconds. .hermostat Setting 41C Overtemp Setting 45"], "jumps": []}, {"id": "P2230", "text": ["12. Watch the LED's and the heater bulb on the PC5050-2 card and watch the voltage reading at TP5 as you press and release the start button on the PC5050-1 card. Notice how the relay I/O module output status lights illuminate."], "jumps": ["P2235", "P2220", "P2240"]}, {"id": "P2235", "text": ["PC5050-2 CARD - Watch the LED's and the heater bulb and watch the multimeter's voltage reading as you press and release the start button on the PC5050-1 card.", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["P2236", "PS", "P"]}, {"id": "P2236", "text": ["NIDA MODEL 5050 PLC TRAINER - Notice how the relay I/O module status lights illuminate after you press and release the start button on the PC5050-1 card."], "jumps": ["P2235", "P2237"]}, {"id": "P2237", "text": ["PC5050-1 CARD - Watch the LED's and the heater bulb on the PC5050-2 card and watch the multimeter's voltage reading as you press and release the start button."], "jumps": ["P2236", "P2230"]}, {"id": "P2240", "text": ["13. Watch the LED's and the heater bulb on the PC5050-2 card and watch the voltage reading at TP5 as you set the level switch to low."], "jumps": ["P2245", "P2230", "P2250"]}, {"id": "P2245", "text": ["PC5050-2 CARD - Watch the LED's and the heater bulb and watch the multimeter's voltage reading as you set the level switch to low.", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["PS", "P"]}, {"id": "P2250", "text": ["You may observe the heating process again by pressing and releasing the start button on the PC5050-1 card once the liquid's current temperature has cooled. Press the stop button on the PC5050-1 card before continuing.", "14. Set the level switch on the PC5050-2 card to full. 15. Press and release the stop on the PC5050-1. You may observe the heating process again by pressing and releasing the start button on the PC5050-1 card once the liquid's current temperature has cooled. Press the stop button on the PC5050-1 card before continuing..."], "jumps": ["P2255", "P2240", "P2260"]}, {"id": "P2255", "text": ["PC5050-2 CARD - Set the level switch to full."], "jumps": ["P2256", "P", "PP"]}, {"id": "P2256", "text": ["PC5050-1 CARD - Press and release the stop button."], "jumps": ["P2255", "P2250"]}, {"id": "P2260", "text": ["16. Adjust the thermostat on the PC5050-2 card to 51", "C using the conversion of 1 V = 10", "C. This setting allows you to observe the operation of the warning LED, error LED and alarm.."], "jumps": ["P2265", "P2250", "P2270"]}, {"id": "P2265", "text": ["THERMOSTAT ADJUSTMENT - Connect the multimeter as shown. Slowly rotate the thermostat potentiometer CW to 5.1 V."], "jumps": []}, {"id": "P2270", "text": ["You may observe the heating process again by pressing and releasing the start button on the PC5050-1 card once the liquid's current temperature has cooled. Press the stop button on the PC5050-1 card before continuing.", "17. Watch the LED's and the heater bulb on the PC5050-2 card and watch the voltage reading at TP5 as you press and release the start button on the PC5050-1 card. Notice how the relay I/O module output status lights illuminate. 18. Press and release the stop button on the PC5050-1 card after the alarm sounds."], "jumps": ["P2275", "P2260", "P2280"]}, {"id": "P2275", "text": ["PC5050-2 CARD - Watch the LED's and the heater bulb and watch the multimeter's voltage reading as you press and release the start button on the PC5050-1 card.", "^^^+;[M[MM[ Mmm #m+>#m# + +++m+[+;+mm+++m++;"], "jumps": ["P2276", "PS", "P"]}, {"id": "P2276", "text": ["NIDA MODEL 5050 PLC TRAINER - Notice how the relay I/O module status lights illuminate after you press and release the start button on the PC5050-1 card."], "jumps": ["P2275", "P2277"]}, {"id": "P2277", "text": ["PC5050-1 CARD - Press and release the start button. Press and release the stop button after the alarm sounds."], "jumps": ["P2276", "P2270"]}, {"id": "P2280", "text": ["The thermostat setting is higher than the over temperature setting.", "The liquid's temperature stays below the over temperature setting.", "The over temperature setting is higher than the thermostat setting.", "Why did the alarm sound???s typed.........................."], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["The presentt over temperature setting is 41", "C and the present thermostat setting is 51", "C. Also, the alarm does not sound if the over temperature setting is higher than the thermostat setting."], "jumps": []}, {"id": "P2283", "text": ["The alarm does not sound if the liquid's temperature stays below the over temperature setting. The over temperature setting is used to determine the highest temperature that the liquid can safely reach. A warning let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
