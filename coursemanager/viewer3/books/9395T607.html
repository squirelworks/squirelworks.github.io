const book = {"title": "9395T607", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..........", "Title: SPECIAL INTEREST GROUPS asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe special interest groups in the telecommunications industry..try................................."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P300"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Before describing a specific assortment of telecom special interest groups, we need to understand some of the legal and ethical requirements of special interest groups.", "Special interest groups are usually involved for reasons that do not include immediate monetary gain. That is to say, the group is not making profits from operations or sales. These organizations are called non-profit organizations..."], "jumps": ["P1030", "P1001", "P1040", "P1020"]}, {"id": "P1040", "text": ["Non-profit organizations must not distribute income to members or attract private investors. They may act as a corporation in all other respects with few exceptions."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["In the USA, non-profit organization regulations are published in the C.F.R. (Code of Federal Regulations) and state requirements. Specifically, Title 26 of the US Code, Internal Revenue Service procedures, which defines the non-profit organization..."], "jumps": ["P1060", "P1030"]}, {"id": "P1060", "text": ["US states further define the non-profit organization and establish legal requirements such as licenses, charters, and privileges. Some states make distinctions based on chartered charitable goals. If the organization supports charities, privileges will be granted accordingly..."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["Not all telecommunications industry special interest groups are non-profit organizations. Some are actually clubs that do not receive any privileges. Others are international and follow the codes of commerce between nations. Yet others only exist in cyber space....", "Telecom special interest groups have a hierarchy. The FORUM is the highest status. Organizations that wear the title Forum are well established and influential. Committees, associations, and industry groups have valuable contributions to make, but seem to occupy lower status...", "The word forum means a meeting place where orations are delivered. A forum today is the same as the original in concept, but the actual place may be undefined or, as described in Internet terms, in cyber space. The only requirements for forums are a subject of interest and that they have more than 1 member.."], "jumps": ["P1080", "P1050", "P1070", "P1090", "P1100"]}, {"id": "P1100", "text": ["The ATM (Asynchronous Transfer Mode) FORUM is one of the most active and influential special interest groups in the telecom industry. The group is an international non-profit organization originating in Mountainview, California, USA, and is part of Silicon Valley..."], "jumps": ["P1110", "P1090"]}, {"id": "P1105", "text": ["SILICON VALLEY - a region of California south of San Francisco. Santa Clara County, and the City of Palo Alto, is the birthplace of the microchip and home to a great concentration of computer and telecom industries. Stanford University is also there. Other terms like Silly Valley (slang), Silicorn Valley (Iowa), and Sillywood (Silicon Valley and Hollywood) were grown from the original......grown from the original.rse in auto refinishing should be taken.vmachines. Accurate work requiring concentration. Mathematics, Electronics for some.aws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important.SALES Duties - Sells automobiles, automobile parts, and automobile maintenance. Draws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important.SALES Duties - Sells automobiles, automobile parts, and automobile maintenance. Draws up orders and checks automobile prior to delivery. Advertising and telephone marketing may be required at slow times. Environment - Clean well lighted showroom or outside on a lot. Evenings, days and weekends. Requirements - Must be able to maintain a pleasant attitude with people under stressful conditions. Good personal appearance and manners are important."], "jumps": []}, {"id": "P1110", "text": ["is a copyrighted name and the organization has over 300 member organizations including government agencies and end users (companies). The ATM Forum was founded in 1991. The current headquarters office is in San Francisco, with worldwide support offices in Tokyo and London.agement - ATM network issues 3. Security - technology security matters 4. Testing - performance and acceptance testing standards 5. Voice and Multimedia - communications adaptabilityyyyy"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The mission statement of the ATM Forum is twofold: on has over 300 member organizations including government agencies and end users companies. The ATM Forum was founded in 1991. The current headquarters office is in San Francisco, with worldwide support offices in Tokyo and London.n...", "1. Support the acceptance and implementation of ATM and other broadband technologies. 2. Support the interoperability, advancement and convergence of technologies that enhance ATM and other broadband markets."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["How do some US states categorize non-profit organizations?."], "jumps": ["P1120"]}, {"id": "P1131", "text": [], "jumps": []}, {"id": "P1132", "text": ["The number of members is irrelevant. Non-profit organizations are not limited to a specific numbers of numbers.."], "jumps": []}, {"id": "P1133", "text": ["The Title of the organization is not regulated at the state level."], "jumps": []}, {"id": "P1134", "text": ["Financial independence applies more to organizations operating for profit."], "jumps": []}, {"id": "P1140", "text": ["As expected, the ATM Forum has a website (http://atmforum.com/). Members use the website to meet their obligations to the organization. The public is granted access to information about the forum, the technology it represents, and the procedures for becoming a member.."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Arguably one of the best features on the ATM Forum website is the glossary of terms. There is no better source of information on the subject of ATM anywhere."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The ATM Forum creates specification standards for industry using working groups of members. The working groups vote on initiatives and/or reach a consensus on matters. Technical working groups include, but are not limited to:", "1. Control Signaling - dynamic operation and protocol 2. Network Management - ATM network issues 3. Security - technology security matters 4. Testing - performance and acceptance testing standards 5. Voice and Multimedia - communications adaptability"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["So how does a motivated professional get to be a member of the ATM Forum? What are the benefits of an ATM Forum membership to a company and/or individual?"], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["Individuals cannot join the forum, companies may. The primary benefit is access to the people that make the decisions, and eventually becoming a decision maker oneself........................."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["There are four classes of membership: Principle Membership 2. Small Business/Principle Membership 3. Auditing Membership 4. User Membership", "1. Principle Membership 2. Small Business/Principle Membership 3. Auditing Membership 4. User Membershipy - technology security matters 4. Testing - performance and acceptance testing standards 5. Voice and Multimedia - communications adaptability"], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["Principle membership is the highest rank and has the largest annual fee. A company with a principle membership may send 2 representatives to the annual meeting and 2 positions per working group. Full voting rights, access to technical data, and other benefits are included."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The small business principle membership has the same benefits as the regular principle membership, except the annual fee is less (based on company size)."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["An auditing membership is ideally intended for regulatory bodies. Only 1 representative may be sent to the annual meeting and working group participation is not permitted. However, auditing members do have access to technical data, meeting minutes, etc. An auditing member has no voting power regarding ATM Forum internal affairs or initiatives.....", "User membership is designed for companies that market and distribute ATM products. Users can send 1 representative to the annual meeting. They may only participate in user level committees and only have access to pertinent technical information. User membership is approved by a special committee. committee."], "jumps": ["P1230", "P1200", "P1240", "P1220"]}, {"id": "P1240", "text": ["If your company is a member, you may be asked, or directed, to go to ATM Forum meetings. The annual meeting is a big convention in an excellent location. mpanies need their engineers to be involved in specification working groups to increase technical knowledge.e.", "Companies need their engineers to be involved in specification working groups to increase technical knowledge. The forum is a the ultimate think tank."], "jumps": ["P1250", "P1230", "P1260", "P1240", "P"]}, {"id": "P1260", "text": ["This membership also includes access to the latest ATM information. If a member company is designing and manufacturing ATM network hardware and software, this is invaluable. Industry forums are the best source of information on a technology, but remember, the privilege costs money..."], "jumps": ["P1270", "P1250"]}, {"id": "P1260", "text": ["w Frame Relay Forum w Committee T1 w Digital Subscriber Line (DSL) Forum w South Asia Forum for Infrastructure Regulation (SAFIR) matters 4. Testing - performance and acceptance testing standards 5. Voice and Multimedia - communications adaptability", "The ATM Forum is an excellent model of a special interest group and they are very successful. Let's look at some more groups, using the ATM Forum for comparison. Frame Relay Forum * Committee T1 * Digital Subscriber Line (DSL) Forum * South Asia Forum for Infrastructure Regulation (SAFIR)"], "jumps": ["P1280", "P1250"]}, {"id": "P1280", "text": ["You and a co-worker are members of the ATM network management working group. What class of membership does your company have?"], "jumps": ["P1260"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["User companies may not attend working groups..............."], "jumps": []}, {"id": "P1283", "text": ["Auditor companies may only attend conventions..............."], "jumps": []}, {"id": "P1284", "text": ["There are no associate memberships........................."], "jumps": []}, {"id": "P1290", "text": ["The Frame Relay Forum has been in operation for more than 10 years. Forum membership programs are nearly identical to the ATM Forum. The standards working groups use teleconferencing technology."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Committee T1 is a chartered association that functions like a forum. The Alliance for Telecommunications Industry Solutions (ATIS) runs the committee in direct support of the American National Standards Institute (ANSI)..."], "jumps": ["P1310", "P1290"]}, {"id": "P1305", "text": ["CHARTERED - In the context of an organization, a charter is an authorization document that gives the organization mission and management information. In the case of a forum, the charter may include bylaws, committee assignments, and more..."], "jumps": []}, {"id": "P1310", "text": ["Committee T1 has 6 standards subcommittees under the T1 Advisory Group (T1AG). Membership categories are voting and observer under 4 groupings:s:", "1. Exchange Carriers 2. Interexchange Carriers 3. Manufacturers 4. Users/General Interest astructure Regulation (SAFIR) matters 4. Testing - performance and acceptance testing standards 5. Voice and Multimedia - communications adaptability"], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["A management group in Committee T1, called the Secretariat, maintains the membership roles and schedule. Membership fees are based on revenues and voting status."], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["The Digital Subscriber Line (DSL) Forum is another ATM Forum-like special interest group in telecom. DSL is another broadband technology competing on the world market."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Up to this point the forums have been designed to set technology standards for individual telecom venues. The South Asia Forum for Infrastructure Regulation (SAFIR) is a forum charted by the World Bank to develop regulation in telecom and other industries..."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["SAFIR provides training to members on infrastructure regulation. The primary aim is to bring stability to the marketplace in south Asia..", "Special interest groups provide information and a place to go for open discussion on a particular aspect of the technology. It is a good idea to join clubs, associations, and discussion groups in the career field of choice. Newsletters and hot air are not the only benefits a special interest group has to offer..."], "jumps": ["P1360", "P1340", "P1370"]}, {"id": "P1370", "text": ["Career networking, leadership opportunities, and technical training are also benefits of a special interest group.", "Career networking is the best way to advance in a high tech line of work. Telecom professionals may work for several companies, or become self-employed, during the span of a career. Forming a network of colleagues and business acquaintances is automatically part of the special interest group membership.....", "Another benefit is leadership and technical training. Participation in a special interest group includes political and social interaction. Members can be elected to officer positions in the group, like chairman. The technical skills are obvious, but the leadership and team skills experience may be difficult to get anywhere else in the workplace....."], "jumps": ["P1380", "P1360", "P1390", "P1400"]}, {"id": "P1400", "text": ["How does the Committee T1 differ from the traditional non-profit forum?", "It is charted and sponsored by a regulatory body.", "Membership in the committee is controlled by the government.", "It is chartered and sponsored by a standards body.", "Membership in the forum is controlled by the government."], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["This is a Try Again page...................................", "Regulators may allow individual participation in decision-making processes, but a group is not usually established. The FCC holds hearings when rule modifications are being considered. The regulator never hands off accountability to a special interest group. ----"], "jumps": []}, {"id": "P1403", "text": ["No government controls membership in the Committee T1......"], "jumps": []}, {"id": "P1404", "text": ["No government controls forum membership...................."], "jumps": []}, {"id": "P1410", "text": ["Now that existing special interest groups have been examined, let's see what it takes to start up a special interest group in the USA..........."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["First, there needs to be a purpose for the group. t's look at hypothetical scenario.t hypothetical scenario.", "1. Define its purpose. 2. Establish forum name. 3. Write a Mission Statement. 4. Profit or Non-Profit? 5. Incorporate or remain unincorporated? 6. Form a Board of Directors. 7. Form Committees. 8. Recruit Memberships. it Memberships."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["You want to form a group to promote and create standardization for the TecDec2000, an electronic training system. The business opportunities are promising and the TecDec2000 is versatile, with only one company manufacturing accessories for it..."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["You believe that the basic product can be adapted to meet the needs of telecom training companies and schools worldwide. Standardization is needed so that future developments are marketed and distributed effectively. You do not own the patent on the TecDec2000, Nida Corporation does..."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["1. Support the development of the TecDec2000 as a training platform for specialized high technology circuitry. 2. Encourage industry to use the TecDec2000 format for circuit boards and other attachments. 3. Standardize TecDec2000 accessories in support of TIMA (Telecom Instructional Media Association - a hypothetical standards body)", "The name of the group will be the TecDec Forum (a name not currently registered or copyrighted). Mission Statement: The TecDec Forum shall: 1. Support the development of the TecDec2000 as a training platform for specialized high technology circuitry. 2. Encourage industry to use the TecDec2000 format for circuit boards and other attachments. 3. Standardize TecDec2000 accessories in support of TIMA (Telecom Instructional Media Association - a hypothetical standards body)"], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["The new forum will receive start up assistance from Nida Corporation and TIMA. The forum will be a non-profit organization that supports at least one scholarship fund (charity). The FCC will be the regulatory body..."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["The next decision to be made is a big one: incorporate or not? Becoming incorporated has significant advantages, especially in non-profit organizations. The forum is a business. The product is standardization and configuration control and the monies raised from sales are applied to a scholarship fund. Operating costs are covered by membership dues and renewal fees....."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["Incorporating has many benefits. If the founder leaves, the forum stays. The organization is a registered entity. The name is copyrighted and individual ownership is not a controlling factor. Having the title Inc. added to the name lends credibility and makes it easier to find supporters and sponsors..."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["Incorporating takes extra work, but it's worth it in this case. Now that the forum will be incorporated officially, most of the organizational planning can be done by a consulting company or small business support group. The forum's sponsors will usually fund the incorporation effort..."], "jumps": ["P1500", "P1470"]}, {"id": "P1500", "text": ["The forum will have a board of directors, administrative assistant, Webmaster, and member companies. Bylaws will need to be established to govern the operating procedures of the forum. Legal assistance is required to ensure the bylaws are consistent with federal and state law...", "The board of directors will be headed by an elected chairman. The board is charged with forum strategic planning, public information releases, convention planning, and quality management. The board ensures the forum operates as an ethical non-profit business. The membership executes the mission of the forum....."], "jumps": ["P1510", "P1490", "P1520", "P1500"]}, {"id": "P1520", "text": ["Committees will be established to meet mission requirements: not include immediate monetary gain. That is to say, the group is not making profits from operations or sales. These organizations are called non-profit organizations...", "Circuit Card Configuration Committee (C ) - establishes production standards for TIMA physical cards (called T dot standards). stroying the Earths protective layer of ozone. Chemists quickly began to develop new chemicals that would serve the same purposes without damaging the ozone layer.", "Board of Directors & Assistants", "Firmware Version Control Team (FVCT) -maintains configuration control for TecDec2000 firmware (embedded software). destroying the Earths protective layer of ozone. Chemists quickly began to develop new chemicals that would serve the same purposes without damaging the ozone layer.", "Cross-functional Hardware Scenario Group CHSG - explores possibilities of using multiple TecDec2000s to engineer larger systems. ng the Earths protective layer of ozone. Chemists quickly began to develop new chemicals that would serve the same purposes without damaging the ozone layer."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["What is a benefit of incorporating a non-profit organization?", "The sponsors have to provide financial support.", "If the founder leaves, the organization still exists."], "jumps": ["P1510"]}, {"id": "P1531", "text": [], "jumps": []}, {"id": "P1532", "text": ["Sponsors are never required to provide financial support. --"], "jumps": []}, {"id": "P1533", "text": ["The application process is one of the disadvantages to incorporating."], "jumps": []}, {"id": "P1540", "text": ["The forum needs an Internet domain name and website. Many forums use the Internet to vote, collect ideas, store documents, and teleconference. The TecDec2000 forum will have a website, but all committee meetings will be actual, not virtual space. An annual convention will be held in Mexico every year.", "TT{WPxYRz>AS #5&*904C39C6<F18>8?E8>@5;=39;5;=9>C;@E9>D6;A7:F:=I<>F;=E@BGFHMILQGJO>IPEPW4EU3DT7Rj8Sk5TrJi", "!3)*;#$5!#2/1@-+4(&/&$-*(1+)2)'0)'0+)2(&/'%.($,+'/0+12-30)0.'.) 1+\"3((1((1 *.", ")4)3H!+@ %?!&@),>-0B24<24<#05+8=)3A*4B28N.4J//D44I30=2/<3/82.7.,<.,<*+B+,C)4M*5N1>W6C\\3A[;IcDTnCSm+@Y)>W'=V(>W*CZ/H_4Of9Tk7Tf9Vh9Wm9Wm6Uo7Vp7Vt9Xv;Zx:Yw=\\zBa", "*/-:?%/=#-;(.D$*@++@))>-*7-*7.*3/+4-+;20@45L9:Q1<U +D$1J7D]?MgN\\vUe", "$2+2@ (8?GWS_nAM\\1>O:GX0@P<L\\8H[4DW4FT6HV:LZASaI[iJ\\j>P^/AO-?M;M[<N\\EWeBTb7IW8JX*<J).:EJV=@L", "6+$9.'8-&7,%5*# let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
