const book = {"title": "9395T331", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Title: POSITION DETECTION OPERATIONfasfd asdf asdf sadf", "Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Compute linear and rotary position based on electrical and mechanical circuit parameters. w Analyze the position detection operation of an encoder wheel with CCW/CW sensing....", "w Describe analog angular position sensors. w Describe analog linear position sensors. w Describe digital angular position sensors. w Describe digital linear position sensors.", "w Define position. w Describe positional devices. w Describe the characteristics of prime movers. w Calculate various output quantities of prime movers.", "3. Position Detection Operation ective 1 line item 2 here. item 2 here.e.e.", "2. Position Transducers nter objective 1 line item 2 here. item 2 here.e.e.", "1. Nature of Position Enter objective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130-179erXXXXXXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. 1/8 Inch Slotted Screwdriver9erXXXXXXXXXXnt", "9. Nida Model 410 Multifunction counter r equiv.", "8. Nida Model 470 Oscilloscope or equivalentt", "7. Nida Model 488 Multimeter or equivalentt"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P350", "text": [], "jumps": ["P"]}, {"id": "P360", "text": [], "jumps": []}, {"id": "P370", "text": [], "jumps": []}, {"id": "P380", "text": [], "jumps": []}, {"id": "P400", "text": ["This lesson introduces the student to the principles and operation of position detection devices, including analog and digital position-sensing circuits.", "Within the field of industrial controls, inputs to circuits originate from various environments, such as light, heat, motion, pressure and humidity.", "Industrial controls require accurate position detection sensors to continuously detect the position of various objects."], "jumps": []}, {"id": "P430", "text": ["Let's begin the lesson on POSITION DETECTION OPERATION...................."], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P430"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Position describes the location of an object..............."], "jumps": ["P1001", "P1020"]}, {"id": "P1020", "text": ["The position of an object is defined in terms of one, two, or three dimensions in respect to a reference."], "jumps": ["P1015", "P1030"]}, {"id": "P1030", "text": ["0 1 2 3 4 5 666666666", "Here, the position of the object is defined using one dimension."], "jumps": ["P1015", "P1040"]}, {"id": "P1040", "text": ["The car's position is 3 in respect to zero."], "jumps": ["P1015", "P1050"]}, {"id": "P1050", "text": ["An assembly line is a typical example of one dimensional position."], "jumps": ["P1060", "P1015"]}, {"id": "P1060", "text": ["0 1 2 3 4 5 6 Y666666666666666666666666666666666666666666666666", "Position can be described using 2 dimensions. These dimensions are vertical and horizontal.O"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["The position is \"(3,3)'' with respect to zero."], "jumps": ["P1060", "P1080"]}, {"id": "P1080", "text": ["A typical example is an X-Y plotter which positions a stylus on a flat plane to draw various forms."], "jumps": ["P1060", "P1090"]}, {"id": "P1090", "text": ["Another form of two dimensional position is related to circular motion."], "jumps": ["P1080", "P1100"]}, {"id": "P1100", "text": ["Position is expressed in degrees or radians from a reference point."], "jumps": ["P1090", "P1110"]}, {"id": "P1110", "text": ["A typical example is a radar scope that indicates the bearing of an object."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["This object is defined using three dimensions (X,Y,Z). X is width, Y is depth, and Z is height.", "A typical example of three dimensional use is a sonar device that detects the position of submarines."], "jumps": ["P1150", "P1090"]}, {"id": "P1160", "text": ["What describes the location of an object with respect to a reference?"], "jumps": ["P1150"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1162", "text": ["Motion describes the movement of an object, position is not movement."], "jumps": []}, {"id": "P1163", "text": ["Velocity is a measure of movement, position is not movement."], "jumps": []}, {"id": "P1170", "text": ["Touch the diagram that describes the position of an object using two dimensions."], "jumps": ["P1160"]}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1172", "text": ["You touched a one dimensional position indicator. Notice that the object can only be described using one value."], "jumps": []}, {"id": "P1173", "text": ["You touched a three dimensional position indicator. Notice that the object can be described using three values.."], "jumps": []}, {"id": "P1180", "text": ["Position electronics consists of two general areas........."], "jumps": ["P1170", "P1190"]}, {"id": "P1190", "text": ["Generator devices cause a change in position. They are called position or motion generators."], "jumps": ["P1180", "P1210"]}, {"id": "P1210", "text": ["DC Servos AC Servos Synchros Transmittersrmitterrrrr", "Analog generators include DC, AC servo motors, synchros and transmitting devices."], "jumps": ["P1180", "P1220"]}, {"id": "P1220", "text": ["These devices rotate from one point to another according to an analog input signal."], "jumps": ["P1230", "P1180"]}, {"id": "P1230", "text": ["DC Servos AC Servos Synchros Transmittersrmitterrrrr", "Digital position generators are stepper motors............."], "jumps": ["P1220", "P1240"]}, {"id": "P1240", "text": ["Steppers rotate from one point to another according to a digital input signal."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["DC Servos AC Servos Synchros Transmittersrmitterrrrr", "Position generators are motors and their characteristics are similar to motion generators."], "jumps": ["P1240", "P1260"]}, {"id": "P1260", "text": ["DC Servos AC Servos Synchros Transmittersrmitterrrrr", "Sensors are devices that detect a change in position. Position sensors indicate the position of an object."], "jumps": ["P1250", "P1280"]}, {"id": "P1280", "text": ["Resolvers Synchro Receivers Variable Transducers", "Analog position sensors are resolvers, synchros, and variable transducers."], "jumps": ["P1250", "P1290"]}, {"id": "P1290", "text": ["Sensors receive a mechanical input from a position generator and produce an analog output. This output represents the position."], "jumps": ["P1300", "P1250"]}, {"id": "P1300", "text": ["Resolvers Synchro Receivers Variable Transducers", "Digital position sensors are encoders......................"], "jumps": ["P1290", "P1310"]}, {"id": "P1310", "text": ["Encoders are rotated by position generators. Their output is a digital signal that represents position."], "jumps": ["P1300", "P1320"]}, {"id": "P1320", "text": ["Position generators and position sensors are opposite......"], "jumps": ["P1310", "P1330"]}, {"id": "P1330", "text": ["Position generators use an electrical signal for the input and produce a mechanical output."], "jumps": ["P1320", "P1340"]}, {"id": "P1340", "text": ["Position sensors use a mechanical input to produce an electrical output."], "jumps": ["P1320", "P1350"]}, {"id": "P1350", "text": ["Position generators and sensors normally use feedback......"], "jumps": ["P1320", "P1360"]}, {"id": "P1355", "text": ["FEEDBACK - Feedback is the control of the system. Not all systems contain feedback. Systems containing feedback are called Closed Loop Systems."], "jumps": []}, {"id": "P1360", "text": ["Feedback ensures a specified position is maintained."], "jumps": ["P1350", "P1370"]}, {"id": "P1370", "text": ["What type of position device is an encoder?................"], "jumps": ["P1350"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Position generators are DC, AC servo motors, synchros and transmitters."], "jumps": []}, {"id": "P1380", "text": ["What type of position device uses a mechanical input and produces an electrical output?"], "jumps": ["P1370"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["Position generators use an electrical input and produce a mechanical output."], "jumps": []}, {"id": "P1390", "text": ["A prime mover is a position generator......................"], "jumps": ["P1380", "P2020"]}, {"id": "P1400", "text": ["Nearly all prime movers produce an output that has circular motion."], "jumps": ["P1390", "P2030"]}, {"id": "P1410", "text": ["The motion is changed to different velocities or to linear motion depending on the type of position change needed."], "jumps": ["P1390", "P2050"]}, {"id": "P1420", "text": ["It is important to be able to calculate the output power of a prime mover."], "jumps": ["P1410", "P2060"]}, {"id": "P1430", "text": ["Power of a prime mover (motor) is equal to the force that turns the shaft times the distance the shaft moves."], "jumps": ["P1410", "P2070"]}, {"id": "P1440", "text": ["It's like electrical power, the force that moves electrons (voltage), times the movement of electrons (current), equals the amount of power (watts)."], "jumps": ["P1410", "P2080"]}, {"id": "P1450", "text": ["In motors, the force that turns the shaft or twisting action is measured in Ft"], "jumps": ["P1440", "P2090"]}, {"id": "P1460", "text": ["Distance is the change in position per unit of time, which is calculated from RPM or revolutions per minute."], "jumps": ["P1450", "P2100"]}, {"id": "P1470", "text": ["What term describes the force to turn a prime mover?......."], "jumps": ["P1450"]}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1472", "text": ["RPM is a measure of distance per unit of time, it is not a measure of force in a prime mover."], "jumps": []}, {"id": "P1473", "text": ["Velocity is a measure of the change in distance per change in time, it is not a measure of force in a prime mover."], "jumps": []}, {"id": "P1480", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00005\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000_\u0001\u000f\u0000\u0000\u0000 \u0000\u0006\u0000TorqueChoiceett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000u\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000\u0094\u0005\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000~\u0001\u0000\u0000\u0000\u0001\u00ae\u0003\u0012\u0002\u008b\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b5\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u001c\u0000\u001d\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00cd\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00df\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f9\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u001d\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ae\u0003\u0002\u0000\u0000\u0000J\u0005\u0003\u0000\u0000\u0000h\u0006\u0004\u0000\u0000\u0000\u00b0\u00067\u0002\u0017\u0000\u0000\u0000\u0002\u0000\u0000", "What term describes the distance per unit of time in a prime mover?"], "jumps": ["P1470"]}, {"id": "P1481", "text": [], "jumps": []}, {"id": "P1482", "text": ["Torque is a measure of force that causes the shaft of a prime mover to rotate. It is not a measure of distance per unit of time."], "jumps": []}, {"id": "P1483", "text": ["Lbs is the unit of measure for torque or force........"], "jumps": []}, {"id": "P1490", "text": ["r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)", "The power of a prime mover is the force times the distance per unit time."], "jumps": ["P1480", "P2130"]}, {"id": "P1500", "text": ["Lbs at the circumference of the prime mover's shaft. This is where the force does work."], "jumps": ["P1490", "P2140"]}, {"id": "P1510", "text": ["r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)", "Force is equal to the torque of the prime mover in Ft", "Lbs divided by the radius of the shaft in inches or feet."], "jumps": ["P1490", "P2150"]}, {"id": "P1520", "text": ["r Power = (Distance", "r) nce/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)"], "jumps": ["P1490", "P2160"]}, {"id": "P1530", "text": ["r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)", "Recall that distance of a rotating shaft equals the circumference times the RPM divided by 60 (the 60 changes minutes to seconds)."], "jumps": ["P1490", "P2170"]}, {"id": "P1540", "text": ["r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) wer = (T x RPM)"], "jumps": ["P1490", "P2180"]}, {"id": "P1550", "text": ["r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)", "Combining and reducing the formula gives:"], "jumps": ["P1490", "P2190"]}, {"id": "P1560", "text": ["r Power = (Distance", "r) Distance/Time = 2 r (RPM", "60) Power = 2 r (RPM", "r) Power = (T x RPM)", "Power of a prime mover equals the torque times RPM divided by 9.55."], "jumps": ["P1490", "P2200"]}, {"id": "P1570", "text": ["Most prime movers and motors have power measured in horsepower, or HP for short."], "jumps": ["P2210", "P1490"]}, {"id": "P1580", "text": ["The term horsepower is derived from an old standard that measured the amount of weight one horse could lift one foot in one second."], "jumps": ["P1570", "P2220"]}, {"id": "P1590", "text": ["At the time the average horse was able to lift 550 Lbs one foot in one second. So HP is 550 Ft"], "jumps": ["P1570", "P2230"]}, {"id": "P1600", "text": ["This makes the prime mover power formula:.................."], "jumps": ["P1570", "P2240"]}, {"id": "P1610", "text": ["What is the horsepower of a prime mover that is rotating at 1000 RPM and has 40 Ft"], "jumps": ["P1600"]}, {"id": "P1611", "text": [], "jumps": []}, {"id": "P1612", "text": ["You did not multiply the torque and RPM before dividing by 5252.5."], "jumps": []}, {"id": "P1613", "text": ["You divided 5252.5 by RPM times torque and placed the decimal point in the wrong position."], "jumps": []}, {"id": "P1615", "text": ["HORSEPOWER - Horse power equals the RPM times the torque divided by 5252.5."], "jumps": []}, {"id": "P1620", "text": ["Horsepower is important because most prime movers do not position an object directly."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["The driven shaft is used to move the prime mover."], "jumps": ["P1620", "P1640"]}, {"id": "P1640", "text": ["This allows different applications of the prime mover using one type of driven shaft."], "jumps": ["P1620", "P2280"]}, {"id": "P1650", "text": ["The torque, speed, or direction can be changed by using a different prime mover radius."], "jumps": ["P1620", "P2290"]}, {"id": "P1660", "text": ["In all cases, the driven shafts HP (power in) must equal the prime mover HP (power out)."], "jumps": ["P1620", "P2300"]}, {"id": "P1670", "text": ["Knowing that power in equals power out, the torque and RPM of the prime mover can be calculated by only knowing the characteristics of the driven shaft."], "jumps": ["P1620", "P2310"]}, {"id": "P1680", "text": ["The formulas for the output torque and RPM are found by using the ratio of the radius times the input values."], "jumps": ["P1620", "P2320"]}, {"id": "P1690", "text": ["These formulas work because power in equals power out."], "jumps": ["P1680", "P2330"]}, {"id": "P1700", "text": ["Torque and RPM depend on the radius of the shaft."], "jumps": ["P1680", "P2340"]}, {"id": "P1710", "text": ["For example, if a driven shaft has a radius of 1 inch at 1000 RPM and 40 Ft", "Lbs of torque, a 2 inch prime mover produces 500 RPM at 80 Ft"], "jumps": ["P1680", "P2350"]}, {"id": "P1720", "text": ["Note that the power in equals power out."], "jumps": ["P1710", "P2360"]}, {"id": "P1730", "text": ["This set up is a speed reducer, RPM decreased and torque increased."], "jumps": ["P1710", "P2370"]}, {"id": "P1740", "text": ["This set up increases RPM and decreases torque............."], "jumps": ["P1710", "P2380"]}, {"id": "P1750", "text": [], "jumps": ["P1740", "P2390"]}, {"id": "P1760", "text": ["Once the RPM of the prime mover is found from the driven shaft, the runout rate and runout distance can be calculated. This tells you the position of the shaft."], "jumps": ["P1740", "P2400"]}, {"id": "P1770", "text": ["What is the RPM of the prime mover if the driven shaft has a RPM of 1500?"], "jumps": ["P1775", "P1760"]}, {"id": "P1771", "text": [], "jumps": []}, {"id": "P1772", "text": ["1500 is the RPM of the driven shaft. Since the radius of the driven shaft and prime mover is different, the RPM of the prime mover will not equal the RPM of the driven shaft."], "jumps": []}, {"id": "P1773", "text": ["3000 is double the RPM of the driven shaft. Since the driven shaft radius is half of the prime mover, the RPM of the prime mover will not be double."], "jumps": []}, {"id": "P1775", "text": [], "jumps": []}, {"id": "P1780", "text": ["With the prime mover rotating at 750 RPM, what is the position change if the driven shaft rotates for 2 seconds?"], "jumps": ["P1785", "P1770"]}, {"id": "P1781", "text": [], "jumps": []}, {"id": "P1782", "text": ["314 is the ROR or runout rate. To find ROD, the runout distance, you multiply ROR and time."], "jumps": []}, {"id": "P1783", "text": ["750 is the RPM of the prime mover. To find distance, you find the runout rate, ROR, and then multiply by time to get the runout distance, ROD. Formulasss"], "jumps": []}, {"id": "P1785", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on NATURE OF POSITION......."], "jumps": ["P1780"]}, {"id": "P1920", "text": ["1. Position describes the location of an object in respect to a reference."], "jumps": ["P1922", "P1001"]}, {"id": "P1922", "text": ["2. One, two, or three dimensions can be used.."], "jumps": ["P1920", "P1924"]}, {"id": "P1924", "text": ["3. Position electronics has two general areas, generators and sensors..."], "jumps": ["P1920", "P1926"]}, {"id": "P1926", "text": ["DC Servos AC Servos Synchros Transmittersrmitterrrrr", "4. Position generators are basically motors that cause an object to change position. They are either analog or digital......"], "jumps": ["P1930"]}, {"id": "P1930", "text": ["5. Position generators are DC, AC servo motors, synchros and transmitters.."], "jumps": ["P1932"]}, {"id": "P1932", "text": ["DC Servos AC Servos Synchros Transmittersrmitterrrrr", "Resolvers Synchro Receivers Variable Transducers", "6. Position sensors are analog or digital devices that detect position."], "jumps": ["P1934"]}, {"id": "P1934", "text": ["7. Position sensors are resolvers, synchro receivers, variable transducers, and encoders."], "jumps": ["P1936"]}, {"id": "P1936", "text": ["8. Most position systems use the output of a position sensor for an input to a position generator...."], "jumps": ["P1940"]}, {"id": "P1940", "text": ["9. Prime movers are position generators and are normally motors, circular motion.."], "jumps": ["P1942"]}, {"id": "P1942", "text": ["Lbs 60 r Power = T x RPM in Ft", "10. Power of a prime mover is equal to the force that turns the shaft, torque (T), times the distance the shaft moves (RPM)."], "jumps": ["P2920", "P1944"]}, {"id": "P1944", "text": ["11. Horsepower is a measure of power in a motor."], "jumps": ["P2930", "P1946"]}, {"id": "P1946", "text": ["12. Prime movers are normally driven by a shaft to change speed, torque, or direction......"], "jumps": ["P1950", "P2940"]}, {"id": "P1950", "text": ["13. Power in equals Power out............................."], "jumps": ["P2950", "P1952"]}, {"id": "P1952", "text": ["14. RPM out and torque out depend on the ratio or the radius of the shaft."], "jumps": ["P2960", "P1954"]}, {"id": "P1954", "text": ["15. Once the RPM of the prime mover is determined, the ROR and ROD can be calculated."], "jumps": ["P2970", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2015", "text": ["Analog position sensors are devices that change a mechanical position to an analog electrical signal."], "jumps": ["P2001", "P1020"]}, {"id": "P2020", "text": ["A popular type of analog position sensor is called a resolver."], "jumps": ["P2015", "P1030"]}, {"id": "P2030", "text": ["There are two types, let's start off with the induction type."], "jumps": ["P2015", "P1040"]}, {"id": "P2040", "text": ["An induction resolver is a transformer with a movable primary coil and a fixed secondary coil."], "jumps": ["P1050", "P2030", "Primary"]}, {"id": "P2050", "text": ["The mechanical input from an object is applied to the shaft which positions the primary coil."], "jumps": ["P2040", "P1060"]}, {"id": "P2060", "text": ["The electrical output is taken from the secondary coil."], "jumps": ["P1070", "P2040", "Primary"]}, {"id": "P2070", "text": ["As the shaft is rotated from 0 degrees to 360 degrees, the amount of flux coupling between the coils changes."], "jumps": ["P2040", "P1080"]}, {"id": "P2080", "text": ["At zero degrees, the primary and secondary are displaced 90 degrees."], "jumps": ["P2040", "P1100"]}, {"id": "P2100", "text": ["At 90 degrees, the primary and secondary coils are parallel and in phase."], "jumps": ["P2080", "P1110"]}, {"id": "P2110", "text": ["There is maximum coupling between primary and secondary. The output goes from 0 volts to maximum."], "jumps": ["P2080", "P1120"]}, {"id": "P2120", "text": ["At 180 degrees, the primary and secondary coils are again 90 degrees displaced."], "jumps": ["P2080", "P1130"]}, {"id": "P2130", "text": ["There is no coupling between primary and secondary. The output returns to 0 volts."], "jumps": ["P2080", "P1140"]}, {"id": "P2140", "text": ["At 270 degrees, the primary and secondary coils are again parallel. Only this time, they are not in phase."], "jumps": ["P2080", "P1150"]}, {"id": "P2150", "text": ["The coupling is maximum and the output is at it's maximum negative value."], "jumps": ["P2080", "P1160"]}, {"id": "P2160", "text": ["When the shaft returns to the 0 degree position, there is no coupling between primary and secondary."], "jumps": ["P2080", "P1170"]}, {"id": "P2170", "text": [], "jumps": ["P2080", "P1180"]}, {"id": "P2180", "text": ["For any shaft position the electrical output is different. This is a position sensor."], "jumps": ["P2200", "P2080"]}, {"id": "P2200", "text": ["The voltage and position outputs produce a sine function."], "jumps": ["P2180", "P1210"]}, {"id": "P2210", "text": ["However, if a linear output is required, the shaft is only allowed to rotate between 140 degrees to 220 degrees."], "jumps": ["P2180", "P1215"]}, {"id": "P2215", "text": ["The voltage output is in the linear region of the curve. Eout and position output vary from positive to negative, depending on shaft position.."], "jumps": ["P2210", "P1220"]}, {"id": "P2220", "text": ["Which device best describes an analog inductive position sensor?"], "jumps": ["P2210"]}, {"id": "P2221", "text": [], "jumps": []}, {"id": "P2222", "text": ["The analog inductive position sensor uses flux coupling between a primary coil and a secondary coil. It is not a potentiometer."], "jumps": []}, {"id": "P2223", "text": ["The analog inductive position sensor uses flux coupling between a primary coil and a secondary coil. It is not an inductor."], "jumps": []}, {"id": "P2230", "text": ["At which shaft angles is the output of an inductive position sensor 0?"], "jumps": ["P2220"]}, {"id": "P2231", "text": [], "jumps": []}, {"id": "P2232", "text": ["At 90 and 270 degrees, the primary and secondary have maximum coupling, the output is maximum not zero."], "jumps": []}, {"id": "P2233", "text": ["The output is zero when the shaft position is 180 degrees. However, at 90 degrees, the primary and secondary have maximum coupling and the output is not 0."], "jumps": []}, {"id": "P2240", "text": ["The second type of resolver is a resistive device.........."], "jumps": ["P2230", "P1250"]}, {"id": "P2250", "text": ["Resistance resolvers are specially designed potentiometers."], "jumps": ["P2240", "P1260"]}, {"id": "P2260", "text": ["The mechanical input from an object is applied to the shaft of the potentiometer which positions the wiper."], "jumps": ["P2250", "P1270"]}, {"id": "P2270", "text": ["The output is taken across the wiper and one end of the resistive material."], "jumps": ["P2250", "P1280"]}, {"id": "P2280", "text": ["As the position of the shaft changes, the position of the wiper changes, just like a potentiometer."], "jumps": ["P2250", "P1290"]}, {"id": "P2290", "text": ["For each position, there is a specific output."], "jumps": ["P2280", "P1300"]}, {"id": "P2300", "text": ["If the A and B terminals are left open, the output is resistance."], "jumps": ["P2280", "P1310"]}, {"id": "P2310", "text": ["If a voltage is applied to the A and B terminals, the output is a voltage."], "jumps": ["P2280", "P1320"]}, {"id": "P2320", "text": ["The device acts as a simple voltage divider."], "jumps": ["P2310", "P1330"]}, {"id": "P2330", "text": ["The result is that for any position of the input shaft, the resistance or voltage output is different."], "jumps": ["P2310", "P1340"]}, {"id": "P2340", "text": ["\u0000\u0000\u0000incorrect1\u0000\u00003\u0001\u000e\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000]\u0001\u000f\u0000\u0000\u0000 \u0000\u000b\u0000Transformereett\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000s\u0001\u0010\u0000\u0000\u0000\u0001\u0000\u0001\u0000\u0000\u0000\u0094\u0005\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000|\u0001\u0000\u0000\u00fe\u0000\u00ae\u0003\u0012\u0002\u0089\u0001\u0011\u0000\u0000\u0000Back\u0000\u0000\u00b3\u0001\u0012\u0000\u0000\u0000\u0004\u0000\u0001\u0000\u0000\u0000\u0014\u0000\u0013\u0000x\u001e\u0000\u0000\u001c\u0000\u001d\u0000\u00e5c\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u00cb\u0001\u0013\u0000\u0000\u0000ASYMI_UseRollover\u0000\u00dd\u0001\u0014\u0000\u0000\u0000\t\u0000\u0004\u0000\u0004\u0000true\u0000\u0000\u00f7\u0001\u0015\u0000\u0000\u0000\u0002\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u001b\u0002\f\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0012\u0002\u0001\u0000\u0000\u0000\u00ae\u0003\u0002\u0000\u0000\u0000J\u0005\u0003\u0000\u0000\u0000h\u0006\u0004\u0000\u0000\u0000\u00b0\u00065\u0002\u0017\u0000\u0000\u0000\u0002", "Which device best describes an analog resistance position sensor?"], "jumps": ["P2330"]}, {"id": "P2341", "text": [], "jumps": []}, {"id": "P2342", "text": ["The analog resistance position sensor uses a resistive material and a wiper. It is not a transformer."], "jumps": []}, {"id": "P2343", "text": ["The analog resistance position sensor uses a resistive material and a wiper. It is not an inductor."], "jumps": []}, {"id": "P2350", "text": ["At which shaft position is the output of the resistance position sensor 0?"], "jumps": ["P2340"]}, {"id": "P2351", "text": [], "jumps": []}, {"id": "P2352", "text": ["With the shaft positioning the wiper to the top of the resistance, the output is not 0. The entire resistance is felt at the output."], "jumps": []}, {"id": "P2353", "text": ["With the shaft positioning the wiper to about half way in the resistance, the output is not 0. About half the resistance is felt at the output."], "jumps": []}, {"id": "P2360", "text": ["Both position sensors use circular motion for sensing......"], "jumps": ["P1370", "P2350", "Primary"]}, {"id": "P2370", "text": ["Even though circular positioning is the most popular, there are times when linear positioning techniques are required."], "jumps": ["P2360", "P1380"]}, {"id": "P2380", "text": ["This linear position sensor operates similar to the inductive sensor. It is a linear voltage differential transformer.."], "jumps": ["P1390", "P2360"]}, {"id": "P2390", "text": ["It is constructed with a single primary and two balanced secondary windings connected series opposing."], "jumps": ["P2380", "P1400"]}, {"id": "P2400", "text": ["With the core centered, flux coupling to each secondary is equal, the induced voltages cancel and the output is 0."], "jumps": ["P2380", "P1410"]}, {"id": "P2410", "text": ["When the position of the core changes, one of the secondaries induced voltage increases and the other decreases."], "jumps": ["P2380", "P1420"]}, {"id": "P2420", "text": ["This produces a positive or negative output voltage."], "jumps": ["P2380", "P1430"]}, {"id": "P2430", "text": ["The output is designed to be a linear function of the core position for the extremes of core travel."], "jumps": ["P2380", "P1440"]}, {"id": "P2440", "text": ["This linear position sensor operates similar to the resistance sensor. It is a linear resistance sensor."], "jumps": ["P2380", "P1450"]}, {"id": "P2450", "text": ["Its operation is exactly like that of the circular resistance sensor except motion is in a straight line rather than circular."], "jumps": ["P2440", "P1460"]}, {"id": "P2460", "text": ["What type of position sensor would be best to determine the depth of an oil drilling rig?"], "jumps": ["P2440"]}, {"id": "P2461", "text": [], "jumps": []}, {"id": "P2462", "text": ["An angular position sensor could be used however, the position is linear and using a linear position sensor would be better than an angular inductive sensor."], "jumps": []}, {"id": "P2463", "text": ["An angular position sensor could be used however, the position is linear and using a linear position sensor would be better than an angular resistance sensor."], "jumps": []}, {"id": "P2470", "text": ["Digital position sensors are devices that change a mechanical position to an analog electrical signal."], "jumps": ["P2460", "P2020"]}, {"id": "P2480", "text": ["There are two basic types of digital position sensors......"], "jumps": ["P2470", "P2030"]}, {"id": "P2490", "text": ["Let's start off with the increment wheel."], "jumps": ["P2480", "P2040"]}, {"id": "P2500", "text": ["Increment Sensor (Optical or Magnetic)", "An increment wheel position sensor is nothing more than a wheel placed on a prime mover or on an object."], "jumps": ["P2480", "P2050"]}, {"id": "P2510", "text": ["Increment Sensor (Optical or Magnetic)", "The wheel is printed so a light or magnetic transducer may be used to sense the marks."], "jumps": ["P2500", "P2060"]}, {"id": "P2520", "text": ["The increment marks represent position in reference to the zero position, indicated by the reference mark."], "jumps": ["P2500", "P2070"]}, {"id": "P2530", "text": ["Increment Sensor (Optical or Magnetic)", "As the position of the wheel changes, the increment sensor produces high pulse outputs."], "jumps": ["P2500", "P2080"]}, {"id": "P2540", "text": ["By counting the number of high pulse outputs, the position of the wheel can be determined."], "jumps": ["P2500", "P2090"]}, {"id": "P2550", "text": ["To operate correctly, increment marks must be counted from the reference mark."], "jumps": ["P2500", "P2100"]}, {"id": "P2560", "text": ["Increment Sensor (Optical or Magnetic)", "This means that the shaft must return to zero prior to each move and increment count sequence."], "jumps": ["P2500", "P2110"]}, {"id": "P2570", "text": ["Each mark is a discrete point. If the position of the wheel is between marks, the position count, or the position, will not be detected."], "jumps": ["P2500", "P2120"]}, {"id": "P2580", "text": ["Recall that analog position sensors have an infinite number of positions. Digital position sensors have a discrete number of positions.."], "jumps": ["P2500", "P2130"]}, {"id": "P2590", "text": ["In other words, the number of increment marks divide the wheel. This is called the resolution."], "jumps": ["P2500", "P2140"]}, {"id": "P2592", "text": ["To determine resolution, measured in degrees per mark, you divide 360 degrees by the number of marks."], "jumps": ["P2500", "P2150"]}, {"id": "P2594", "text": ["For example, the resolution of this wheel is 36 degrees per mark because there are 10 sensor marks."], "jumps": ["P2592", "P2160"]}, {"id": "P2596", "text": ["Position = Resolution x Number of Marks Sensed", "This means if two marks were sensed or counted, that the position of the wheel is 72 degrees from the 0 reference. Position = Resolution x Number of Marks Sensed"], "jumps": ["P2150", "P2170"]}, {"id": "P2600", "text": ["What is the resolution of this increment wheel?............"], "jumps": ["P2605", "P2594"]}, {"id": "P2601", "text": [], "jumps": []}, {"id": "P2602", "text": ["18 is the number of marks. You need to know this information to calculate resolution but, the number of marks is not resolution."], "jumps": []}, {"id": "P2603", "text": ["36 is not the resolution. To find the resolution, you divide 360 by the number of marks."], "jumps": []}, {"id": "P2605", "text": ["RESOLUTION - Resolution equals the 360 degrees divided by the number of sensor marks."], "jumps": []}, {"id": "P2610", "text": ["If a increment wheel has 180 sensor marks, what is the position (in degrees, from 0 degrees) if 23 marks were sensed?"], "jumps": ["P2615", "P2600"]}, {"id": "P2611", "text": [], "jumps": []}, {"id": "P2612", "text": ["360 degrees is the zero position or reference point. Remember, 360 degrees and 0 degrees are the same point. Also, to determine position, you must determine the resolution first."], "jumps": []}, {"id": "P2613", "text": ["180 is the number of sensor marks on the increment wheel. To determine position, you must determine the resolution first."], "jumps": []}, {"id": "P2615", "text": ["POSITION - To determine position, you calculate resolution and then multiply the resolution times the number of sensed marks."], "jumps": []}, {"id": "P2620", "text": ["To overcome the disadvantage of returning the wheel to zero, an encoder wheel is used."], "jumps": ["P2610", "P2200"]}, {"id": "P2622", "text": ["An encoder wheel is also placed on a prime mover or an object."], "jumps": []}, {"id": "P2624", "text": ["The difference is that the encoder wheel is divided into tracks with one sensor for each track."], "jumps": ["P2622", "P2220"]}, {"id": "P2626", "text": ["In the plane of the sensors, a digital code is printed on the wheel for each number band."], "jumps": ["P2622", "P2230"]}, {"id": "P2628", "text": ["The sensors then detect the code and output parallel digital data that represents position."], "jumps": ["P2622", "P2240"]}, {"id": "P2630", "text": ["Normally, one of two different types of codes are printed on the wheel."], "jumps": ["P2622", "P2250"]}, {"id": "P2632", "text": ["The 8421 code represents the binary weight of each digit from the Most Significant Bit (MSB) to the Least Significant Bit (LSB).."], "jumps": []}, {"id": "P2634", "text": ["The dark areas do not reflect light and produce a 0 or low output."], "jumps": ["P2632", "P2270"]}, {"id": "P2636", "text": ["The light areas reflect light and produce a 1 or high output."], "jumps": ["P2632", "P2280"]}, {"id": "P2638", "text": ["Note that if a magnetic pick up is used, the areas would represent magnetic and non-magnetic portions."], "jumps": ["P2632", "P2290"]}, {"id": "P2640", "text": ["When the sensors are over a band, the output represents the position of the wheel by a binary number, from 0000 to 1111 in this case."], "jumps": ["P2632", "P2300"]}, {"id": "P2642", "text": ["A problem with the 8421 code is that the track for each band is not the same length."], "jumps": ["P2632", "P2310"]}, {"id": "P2644", "text": ["This means that as the wheel moves, the digital output does not change at the same time."], "jumps": ["P2642", "P2320"]}, {"id": "P2646", "text": ["Incorrect outputs can occur during the transition between one position and another."], "jumps": ["P2642", "P2330"]}, {"id": "P2648", "text": ["For example, at T1, the MSB sensor is in the band for the position 1000 but, the other sensors are in the band for 0111. The output is 1111 which is incorrect."], "jumps": ["P2642", "P2340"]}, {"id": "P2650", "text": ["At T2, the two MSB sensors are in the 1000 band but, the two LSB sensors are still in the 0111 band. The output is 1011 which is still incorrect."], "jumps": ["P2642", "P2350"]}, {"id": "P2652", "text": ["At T3, the output is 1001 and is still incorrect. Only the three MSB digits are in the correct band."], "jumps": ["P2642", "P2360"]}, {"id": "P2654", "text": ["Finally, at T4, the output is correct. All sensors are in the correct band."], "jumps": ["P2642", "P2370"]}, {"id": "P2656", "text": ["Miscount on Leading (A) & Trailing (B) Edges during Transitionn", "Strobe Band (Number Sense) Number Band", "To overcome the incorrect outputs during transition, an additional track is added. The strobe track."], "jumps": ["P2642", "P2380"]}, {"id": "P2658", "text": ["The strobe track is printed so that a high is produced in the center of the number band."], "jumps": ["P2656", "P2390"]}, {"id": "P2660", "text": ["The high output of the strobe track is then used in external circuits to enable the output of the other sensors."], "jumps": ["P2656", "P2400"]}, {"id": "P2662", "text": ["This ensures that the output of the sensors only occurs when all the sensors are in the correct number band, thus eliminating transition errors."], "jumps": ["P2656", "P2410"]}, {"id": "P2664", "text": ["Another method of eliminating transition errors is to use a different type of code on the wheel, the Grey Code."], "jumps": ["P2656", "P2420"]}, {"id": "P2666", "text": ["Look carefully at the binary numbers that represent each position."], "jumps": ["P2664", "P2430"]}, {"id": "P2668", "text": ["Notice that only one digit changes from a 1 to 0 or changes from a 0 to 1 for each change in position."], "jumps": ["P2664", "P2440"]}, {"id": "P2670", "text": ["The one digit change occurs both in the clockwise and counterclockwise direction."], "jumps": ["P2664", "P2450"]}, {"id": "P2672", "text": ["By using the Grey Code, the output errors in transition are eliminated."], "jumps": ["P2664", "P2460"]}, {"id": "P2674", "text": ["You have probably noticed that both the 8421 and Grey Code wheels used 4 bits."], "jumps": ["P2664", "P2470"]}, {"id": "P2676", "text": ["This does not have to be the case. Any number of tracks can be used."], "jumps": []}, {"id": "P2678", "text": ["However, the number tracks determine the resolution of the wheel. The more tracks, the more the wheel is divided."], "jumps": ["P2674", "P2490"]}, {"id": "P2680", "text": ["The resolution of a code wheel equals 360 degrees divided by two to the N power, N is the number of tracks."], "jumps": ["P2674", "P2500"]}, {"id": "P2682", "text": ["Recall in digital electronics that the number of digit combinations depends on the number of positions or 2 to the N power."], "jumps": ["P2680", "P2510"]}, {"id": "P2684", "text": ["For example, the resolution of a wheel with four tracks (not including the strobe track) is 22.5 degrees per number band."], "jumps": ["P2680", "P2520"]}, {"id": "P2686", "text": ["If another track is added, five tracks, the resolution is 11.25 degrees per number band."], "jumps": ["P2680", "P2530"]}, {"id": "P2690", "text": ["Which one of the code wheels below WILL NOT eliminate transition errors?"], "jumps": ["P2680"]}, {"id": "P2691", "text": [], "jumps": []}, {"id": "P2692", "text": ["The Grey Code was specifically designed to eliminate transition errors. The Grey Code only has a one digit change between positions."], "jumps": []}, {"id": "P2693", "text": ["Miscount on Leading (A) & Trailing (B) Edges during Transition", "Strobe Band (Number Sense) Number Band", "The strobe trace is added to a 8421 code wheel to eliminate transition errors. The output of the strobe track is used to enable the output of the other sensors."], "jumps": []}, {"id": "P2700", "text": ["What is the resolution of a code wheel that uses 8 tracks (not including the strobe track)?"], "jumps": ["P2705", "P2690"]}, {"id": "P2701", "text": [], "jumps": []}, {"id": "P2702", "text": ["You divided the number of bands into 360 degrees. You should have divided 360 degrees by 2 to the N power. N is the number of tracks.."], "jumps": []}, {"id": "P2703", "text": ["You divided 360 degrees by 8, the number of tracks. You should have divided 360 degrees by 2 to the N power. N is the number of tracks."], "jumps": []}, {"id": "P2705", "text": ["RESOLUTION - The resolution of a digital position sensor equals 360 degrees divided 2 to the N power. N is the number of tracks."], "jumps": []}, {"id": "P2710", "text": ["These digital position sensors use circular motion........."], "jumps": ["P2700", "P2560"]}, {"id": "P2720", "text": ["Linear position sensors can also be used."], "jumps": []}, {"id": "P2730", "text": ["The only difference is that the marks are placed in a straight line instead of on a curve wheel."], "jumps": ["P2910"]}, {"id": "P2910", "text": ["This completes the information on POSITION TRANSDUCERS.ORS."], "jumps": ["P2570", "P2001"]}, {"id": "P2920", "text": ["1. Analog position sensors change a mechanical input to an analog electrical output.."], "jumps": ["P2001", "P1930"]}, {"id": "P2922", "text": ["2. A resolver is a popular analog position sensor."], "jumps": []}, {"id": "P2924", "text": ["3. The induction resolver is a transformer with a movable primary coil and a fixed secondary coil..."], "jumps": ["Primary"]}, {"id": "P2926", "text": ["4. The shaft is rotated from 0 degrees to 360 degrees changing the flux coupling between the coils."], "jumps": ["Primary"]}, {"id": "P2928", "text": ["5. The resistance resolver is a special designed potentiometer."], "jumps": []}, {"id": "P2930", "text": ["6. The shaft is rotated from 0 degrees to 360 degrees changing the resistance or voltage output.."], "jumps": []}, {"id": "P2932", "text": ["7. The linear voltage differential transformer is a linear inductive position sensor..."], "jumps": ["P1990"]}, {"id": "P2934", "text": ["8. The linear resistance sensor operates like the circular resistance sensor only the motion of the input is different...."], "jumps": ["P2932", "P1999"]}, {"id": "P2936", "text": ["9. Digital position sensors change a mechanical input to a digital electrical output."], "jumps": ["P2930"]}, {"id": "P2938", "text": ["10. There are increment wheel and encoder wheel digital position sensors."], "jumps": ["P2936", "P2940"]}, {"id": "P2940", "text": ["11. The increment wheel sensor uses marks to represent position and a reference mark."], "jumps": ["P2938", "P2950"]}, {"id": "P2942", "text": ["12. As the wheel changes position, the marks are counted to determine position."], "jumps": ["P2940", "P2960"]}, {"id": "P2946", "text": ["13. Resolution equals 360 degrees divided by the number of marks."], "jumps": ["P2940", "P2970"]}, {"id": "P2950", "text": ["14. The encoder position sensor uses a binary code to determine position."], "jumps": ["P2946", "P2980"]}, {"id": "P2960", "text": ["15. The 8421 code represents the binary weight of each digit. A strobe track is added to eliminate transition errors."], "jumps": ["P2950", "P2990"]}, {"id": "P2970", "text": ["16. The Grey Code wheel uses only one digit change between position."], "jumps": ["P2960", "P2992"]}, {"id": "P2980", "text": ["17. Resolution equals 360 degrees divided by 2 to the N power. N is the number of tracks."], "jumps": ["P2970", "P2999"]}, {"id": "P2999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2980", "P2001"]}, {"id": "P3001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P3020", "text": ["Physical position sensing provides an electrical readout (analog or digital) or provides feedback to a controller, which automatically positions an object."], "jumps": []}, {"id": "P3030", "text": ["This basic block diagram applies to any type of position sensing circuit regardless of prime mover, analog or digital circuitry, or angular or linear motion. The operator sets position controls, and the prime mover executes the command..."], "jumps": []}, {"id": "P3040", "text": ["As the object moves, the position-sensing circuit input feedback to circuits that send signals to a summing circuit. The summing point circuit compares the input position (vi) to the actual position signal (vF)..."], "jumps": []}, {"id": "P3050", "text": ["If the comparison voltage is different, an error signal (ve) drives the amplifier, which in turn drives the prime mover. When actual position (vF) equals position desired (vi), the prime mover error driver signal (ve) equals zero and the prime mover stops..."], "jumps": []}, {"id": "P3060", "text": ["The actual circuits within the block diagram are basic analog or digital circuits applied to the mechanics of positioning. This schematic shows the basic circuitry used in the experiment to test a simple closed loop position sensing system..."], "jumps": []}, {"id": "P3070", "text": ["The circuit uses a pick-off voltage developed by a rotating potentiometer connected to the motor as the position sensor voltage (vF). This position signal is then compared to the MOTOR SPEED control (reference input) voltage (vi)..."], "jumps": []}, {"id": "P3080", "text": ["The two voltages are compared in summing point circuit. U1A and U1B sum the two inputs. Notice that inputs to U1A and U1B are configured in opposite positions. The reference input voltage (vi) to U1A is connected to the + input (Pin 3); (vi) to U1B is connected to the - input (Pin 6)..."], "jumps": ["Pin"]}, {"id": "P3090", "text": ["The position input voltage (vF) to U1A is connected to the - input (Pin 2); and (vF) to U1B is connected to the + input (Pin 5)."], "jumps": ["Pin"]}, {"id": "P3100", "text": ["Summing point circuit outputs are sent to U2C through the Proportional Section of the PID and then to the pulse width modulator (PWM). The PWM sends the pulse-modulated signal to the amplifier (U3) to drive the motor..."], "jumps": ["PWM"]}, {"id": "P3110", "text": ["The output of U1A is inverted by U2A. U2A output is sent to the amplifier (U3) and to U2B. The signal is sent to the amplifier (U3 Pin 7) as a clockwise input signal. The signal sent to U2B is inverted and sent to the amplifier as a counterclockwise input signal..."], "jumps": []}, {"id": "P3120", "text": ["Notice that the amplifier not only amplifies the motor drive signal, but it also controls the clockwise and counterclockwise rotational voltages."], "jumps": []}, {"id": "P3130", "text": ["The amplifier output signal drives the motor if there is any difference between the reference input voltage (vi) and the position sensor voltage (vF). Zero difference voltages from the PWM allow the motor to remain in a fixed position..."], "jumps": []}, {"id": "P3140", "text": ["In this experiment, you will investigate the operation of position detection circuits. Through the use of test equipment and calculations, you will analyze circuit parameters. -"], "jumps": []}, {"id": "P3150", "text": ["Closely examine the Model 170 trainer. The trainer contains a rotary potentiometer connected to a motor through two gears. The rotary potentiometer develops a voltage that is compared to the MOTOR SPEED control voltage..."], "jumps": []}, {"id": "P3160", "text": ["1. Set the Model 130 Test Console in a position above the Model 170 Trainer to facilitate the connection of J1 on the trainer and PC130-179 on the test console."], "jumps": []}, {"id": "P3170", "text": ["2. Connect the trainer's 8-pin ribbon cable between PC130-179 output (J1) on the test console and J1 on the trainer."], "jumps": []}, {"id": "P3180", "text": ["3. Set the Test Console to Initial Control Settings.ngs..................."], "jumps": []}, {"id": "P3190", "text": ["5. Press Enter to set: Positive Supply Voltage to 15.", "4. Place the PC130-177 card on the test console in PC1 position, the PC130-178 card on the PC2 position, and the PC130-179 card on the PC3 position......................"], "jumps": []}, {"id": "P3200", "text": ["5. Press Enter to set: Positive Supply Voltage to 15. Negative Supply Voltage to 15.tive Supply Voltage to 12.e Supply Voltage to 12.Voltage to 12. ly Voltage to 12."], "jumps": []}, {"id": "P3210", "text": ["On PC13 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
