ext": ["You will practice troubleshooting astable, monostable and bistable multivibrators for typical faults that commonly occur."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Measuring the input signal (when applicable) and output signal quickly determines if the circuit is operating correctly."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["If the circuit is faulted, measuring Vcc, checking the transistors, and measuring circuit resistances should isolate the fault."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["When the fault is repaired, remember, always verify the correct operation."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on MULTIVIBRATOR TROUBLESHOOTING PRACTICE............"], "jumps": ["P430"]}, {"id": "P9111", "text": [], "jumps": []}, {"id": "P9120", "text": ["2.  Connect the BNC to BNC cable from the output of the                       function generator to the PC1 OUTPUT BNC Connector. \n3.  Press Enter to Set: PC1 DC Power Switch - OFF", "2. Connect the BNC to BNC cable from the output of the function generator to the PC1 OUTPUT BNC Connector. 3. Press Enter to Set: PC1 DC Power Switch - OFFFFFFF", "This connects the function generator's output to PIN E of PC130-45."], "jumps": ["P9110"]}, {"id": "P9170", "text": ["6.  Disconnect the BNC cable from PC2. The astable, bistable              and monostable multivibrators are functioning correctly. The         computer may now insert a fault into one of the circuits. \n7.  Press Enter to Set: PC3 DC Power Switch - OFF", "6. Disconnect the BNC cable from PC2. The astable, bistable and monostable multivibrators are functioning correctly. The computer may now insert a fault into one of the circuits. 7. Press Enter to Set: PC3 DC Power Switch - OFFFFFFFFFFFFFFF"], "jumps": ["P9160"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["The purpose of this experiment is to give you practice in troubleshooting multivibrator circuits. If the circuit is faulted, you will determine the faulty component when the computer repairs the circuit."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["Pick up the PC130-44 card. This card is used to demonstrate typical faults in an astable multivibrator. Compare the card with the schematic shown."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Pick up the PC130-45 card. This card is used to demonstrate typical faults in a bistable multivibrator. Compare the card with the schematic shown."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Pick up the PC130-46 card. This card is used to demonstrate typical faults in a monostable multivibrator. Compare the card with the schematic shown."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Let's start the experiment.", "Let's start the experiment......................................"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1060"]}, {"id": "P1080", "text": ["2.  Carefully place PC130-44 into the Test Console PC1 position. 3.  Carefully place PC130-45 into the Test Console PC2 position.   4.  Carefully place PC130-46 into the Test Console PC3 position.", "2. Carefully place PC130-44 into the Test Console PC1 position. 3. Carefully place PC130-45 into the Test Console PC2 position. 4. Carefully place PC130-46 into the Test Console PC3 position. ernal program = SCAN PWR 0 12333"], "jumps": ["P1070"]}, {"id": "P1095", "text": ["MEASUREMENT SETUP - Set S1 OUT (down). Set R5 and R6 to mid position (arrows up)."], "jumps": ["P1097"]}, {"id": "P2032", "text": ["Junction tests of Q1 should indicate that the base to collector junction is open. Double-check the measurements at TP5 (base) and TP3 (collector) on PC130-44.", "Junction tests of Q1 should indicate that the base to collector junction is open. Double-check the measurements at TP5 (base) and TP3 (collector) on PC130-44................................................................", "Nida Corporation - Multivibrator Troubleshooting Practice"], "jumps": []}, {"id": "P1100", "text": ["8.  Set the Positive Supply Voltage to 12.   \n9.  Set PC1 DC Power switch to ON.  \n     Let's verify normal operation of the three circuits before we            begin troubleshooting.", "8. Set the Positive Supply Voltage to 12. 9. Set PC1 DC Power switch to ON. Let's verify normal operation of the three circuits before we begin troubleshooting."], "jumps": ["P1090"]}, {"id": "P1110", "text": ["1. Measure PC130-44 TP9 with CH1 of the oscilloscope and                measure PC130-44 TP3 with CH2 of the oscilloscope. \n    Is the astable multivibrator functioning correctly?", "1. Measure PC130-44 TP9 with CH1 of the oscilloscope and measure PC130-44 TP3 with CH2 of the oscilloscope. Is the astable multivibrator functioning correctly??"], "jumps": ["P1100", "P1115"]}, {"id": "P1111", "text": [], "jumps": []}, {"id": "P1112", "text": ["You should have measured correct outputs at TP9 and TP3 on PC130-44. The signals should be approximately 1.36 kHz, out of phase with one another."], "jumps": []}, {"id": "P1115", "text": ["ASTABLE MULTIVIBRATOR - This normally operating astable multivibrator has two out of phase outputs (TP9 and TP3), producing approximately 1.36 kHz."], "jumps": ["P"]}, {"id": "P1120", "text": ["2. Set PC1 DC Power Switch to OFF.   \n3. Connect the BNC to BNC cable from the output of the function     generator to the PC1 OUTPUT BNC Connector.", "2. Set PC1 DC Power Switch to OFF. 3. Connect the BNC to BNC cable from the output of the function generator to the PC1 OUTPUT BNC Connector..", "This connects the function generator's output to PIN E of PC130-45."], "jumps": ["P1110"]}, {"id": "P1130", "text": ["4. Set the function generator for a 5 Vpp 1 kHz square wave as           measured on TP11 of PC130-45.  \n\n5. Set PC2 DC Power Switch to ON.", "4. Set the function generator for a 5 Vpp 1 kHz square wave as measured on TP11 of PC130-45. 5. Set PC2 DC Power Switch to ON......tion generator and rotate fully CCW. 6. Set PC2 DC Power Switch to ON.."], "jumps": ["P1120"]}, {"id": "P1140", "text": ["6. Measure the input (PIN E) on PC130-45 with CH1 of your                  oscilloscope. \n7. Measure the output (TP16) on PC130-45 with CH2 of your               oscilloscope.  \n    Is the bistable multivibrator functioning correctly?", "6. Measure the input (PIN E) on PC130-45 with CH1 of your oscilloscope. 7. Measure the output (TP16) on PC130-45 with CH2 of your oscilloscope. Is the bistable multivibrator functioning correctly???"], "jumps": ["P1130", "P1145", "PIN"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["The bistable multivibrator should change states (LOW or HIGH) each time a negative-going input pulse is received.", "The bistable multivibrator should change states (LOW or HIGH) each time a negative-going input pulse is received..", "BISTABLE MULTIVIBRATOR - On PC130-45, the output (TP16) should change states (LOW or HIGH) each time a negative-going input pulse at PIN E is received..."], "jumps": []}, {"id": "P1150", "text": ["1. Set PC2 DC Power Switch to OFF.  \n2. Connect the BNC to BNC cable from the output of the function     generator to the PC2 output BNC connector. \n3. Set PC3 DC Power Switch to ON.", "1. Set PC2 DC Power Switch to OFF. 2. Connect the BNC to BNC cable from the output of the function generator to the PC2 output BNC connector. 3. Set PC3 DC Power Switch to ON..", "This connects the function generator's output to PIN E of PC130-46..."], "jumps": ["P1140"]}, {"id": "P1160", "text": ["4. Measure the input (TP20) on PC130-46 with CH1 of your                  oscilloscope.   \n5. Measure the output (TP26) on PC130-46 with CH2 of your               oscilloscope.  \n    Is the monostable multivibrator functioning correctly?", "4. Measure the input (TP20) on PC130-46 with CH1 of your oscilloscope. 5. Measure the output (TP26) on PC130-46 with CH2 of your oscilloscope. Is the monostable multivibrator functioning correctly????"], "jumps": ["P1150", "P1165"]}, {"id": "P1161", "text": [], "jumps": []}, {"id": "P1165", "text": ["MONOSTABLE MULTIVIBRATOR - On PC130-46, the output pulses (TP26) should occur at each posibe wider than the input pulses (TP20) from the function generator.", "MONOSTABLE MULTIVIBRATOR - On PC130-46, the output pulses (TP26) should occur at each positive-going input pulse (TP20) from the function generator. The width of the output pulse is controlled by R23.", "MONOSTABLE MULTIVIBRATOR - On PC130-46, the output pulses (TP26) should be wider than the input pulses (TP20) from the function generator."], "jumps": []}, {"id": "P1170", "text": ["6.  Set PC3 DC Power Switch to OFF.   \n7.  Disconnect the BNC cable from PC2. The astable, bistable              and monostable multivibrators are functioning correctly. The         computer may now insert a fault into one of the circuits.", "6. Set PC3 DC Power Switch to OFF. 7. Disconnect the BNC cable from PC2. The astable, bistable and monostable multivibrators are functioning correctly. The computer may now insert a fault into one of the circuits.............."], "jumps": ["P1160"]}, {"id": "P2000", "text": ["1.  Set the PC1 DC Switch to ON.", "1. Set the PC1 DC Switch to ON.ternal program = SCAN FTR 0 F1 07 DC Switch to ON...."], "jumps": []}, {"id": "P2005", "text": ["ASTABLE MULTIVIBRATOR - This normally operating astable multivibrator has two out of phase outputs (TP9 and TP3), producing approximately 1.36 kHz."], "jumps": []}, {"id": "P2007", "text": ["2.  Measure the outputs of the astable multivibrator (TP9 and TP3      on PC130-44) with your oscilloscope. \n     Is the astable multivibrator functioning correctly?", "2. Measure the outputs of the astable multivibrator (TP9 and TP3 on PC130-44) with your oscilloscope. Is the astable multivibrator functioning correctly??"], "jumps": ["P2000", "P2005"]}, {"id": "P2008", "text": [], "jumps": []}, {"id": "P2009", "text": ["The astable multivibrator is not functioning correctly. The computer inserted a fault into the circuit."], "jumps": []}, {"id": "P2010", "text": ["3.  Measure Vcc on PC130-44 TP8 with your oscilloscope. \n     Is it a smooth +12 VDC?", "3. Measure Vcc on PC130-44 TP8 with your oscilloscope. Is it a smooth +12 VDC?"], "jumps": ["P2007"]}, {"id": "P2011", "text": [], "jumps": []}, {"id": "P2012", "text": ["The fault inserted by the computer does not effect Vcc. Ensure that you are measuring TP8 on PC130-44 and the oscilloscope is set to measure DC."], "jumps": []}, {"id": "P2020", "text": ["4.  Set the PC1 DC Switch to OFF.", "4. Set the PC1 DC Switch to OFF.trol to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2010"]}, {"id": "P2030", "text": ["5.  Check transistor Q1 on PC130-44 with your multimeter.\n     (Base-to-Emitter - TP5 to TP1) (Base-to-Collector - TP5 to TP3). \n     Is Q1 functioning correctly?", "5. Check transistor Q1 on PC130-44 with your multimeter. (Base-to-Emitter - TP5 to TP1) (Base-to-Collector - TP5 to TP3). Is Q1 functioning correctly???????"], "jumps": ["P2020", "P2035"]}, {"id": "P2031", "text": ["JUNCTION TESTS - The Base-to-Emitter & Base-to-Collector junction of a transistor should provide a high reading for one lead polarity and low reading for the other whether measuring resis.", "JUNCTION TESTS - The Base-to-Emitter & Base-to-Collector junction of a transistor should provide a high reading for one lead polarity and low reading for the other whether measuring resistance with an analog ohmmeter or checking current flow using a diode junction tester in a digital multimeter."], "jumps": []}, {"id": "P2040", "text": ["The computer will now replace Q1. Remember, always verify          correct  operation after a fault has been Width).", "5. Set S1 on PC130-44 OUT (down). 6. Set R5 and R6 on PC130-44 to mid position (arrows up). This sets PC130-44 to produce a 1.36 kHz symmetrical square wave. 7. Rotate R23 on PC130-46 fully CW (Longest Pulse Width). SCAN FTR 0 C1 00i"], "jumps": ["P1080", "P1095"]}, {"id": "P9020", "text": ["The purpose of this experiment is to give you practice in troubleshooting multivibrator circuits. If the circuit is faulted, you will determine the faulty component when the computer repairs the circuit."], "jumps": ["P9030", "P1001"]}, {"id": "P9030", "text": ["Pick up the PC130-44 card. This card is used to demonstrate typical faults in an astable multivibrator. Compare the card with the schematic shown."], "jumps": ["P9040", "P9020"]}, {"id": "P9040", "text": ["Pick up the PC130-45 card. This card is used to demonstrate typical faults in a bistable multivibrator. Compare the card with the schematic shown."], "jumps": ["P9050", "P9030"]}, {"id": "P9050", "text": ["Pick up the PC130-46 card. This card is used to demonstrate typical faults in a monostable multivibrator. Compare the card with the schematic shown."], "jumps": ["P9060", "P9040"]}, {"id": "P9060", "text": ["Let's start the experiment.", "Let's start the experiment......................................"], "jumps": ["P9070", "P9050"]}, {"id": "P9070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P9060"]}, {"id": "P9080", "text": ["2.  Carefully place PC130-44 into the Test Console PC1 position. 3.  Carefully place PC130-45 into the Test Console PC2 position. 4.  Carefully place PC130-46 into the Test Console PC3 position.", "2. Carefully place PC130-44 into the Test Console PC1 position. 3. Carefully place PC130-45 into the Test Console PC2 position. 4. Carefully place PC130-46 into the Test Console PC3 position."], "jumps": ["P9090"]}, {"id": "P9090", "text": ["5.  Set S1 on PC130-44 OUT (down).  \n6.  Set R5 and R6 on PC130-44 to mid position (arrows up).  \n     This sets the frequency to approximately 1.1 kHz symmetrical        square wave.  \n7.  Rotate R23 on PC130-46 fully CW (max).", "5. Set S1 on PC130-44 OUT (down). 6. Set R5 and R6 on PC130-44 to mid position (arrows up). This sets the frequency to approximately 1.1 kHz symmetrical square wave. 7. Rotate R23 on PC130-46 fully CW (max)...................."], "jumps": ["P9100", "P9080", "P9095"]}, {"id": "P9095", "text": ["MEASUREMENT SETUP - Set S1 OUT (down). Set R5 and R6 to mid position (arrows up)."], "jumps": []}, {"id": "P9097", "text": ["MEASUREMENT SETUP - Rotate R23 fully CW."], "jumps": []}, {"id": "P9100", "text": ["Let's verify normal operation of the three circuits before we            begin troubleshooting. \n8.  Press Enter to Set: Positive Supply Voltage - 12   \n9.  Press Enter to Set: PC1 DC Power Switch - ON", "Let's verify normal operation of the three circuits before we begin troubleshooting. 8. Press Enter to Set: Positive Supply Voltage - 12 9. Press Enter to Set: PC1 DC Power Switch - ONNNNN"], "jumps": ["P9090"]}, {"id": "P9110", "text": ["1.  Measure PC130-44 TP9 with CH1 of the oscilloscope and                measure PC130-44 TP3 with CH2 of the oscilloscope. \n     Is the astable multivibrator functioning correctly?", "1. Measure PC130-44 TP9 with CH1 of the oscilloscope and measure PC130-44 TP3 with CH2 of the oscilloscope. Is the astable multivibrator functioning correctly??"], "jumps": ["P9115"]}, {"id": "P14030", "text": ["5.  Press Enter to Set: PC2 DC Power Switch - OFF \n                                          and disconnect function generator from                                                PC1 OUTPUT BNC.", "5. Press Enter to Set: PC2 DC Power Switch - OFF and disconnect function generator from PC1 OUTPUT BNC..."], "jumps": ["P14020"]}, {"id": "P9112", "text": ["You should have measured correct outputs at TP9 and TP3 on PC130-44. The signals should be approximately 1.36 kHz, out of phase with one another."], "jumps": []}, {"id": "P9115", "text": ["ASTABLE MULTIVIBRATOR - This normally operating astable multivibrator has two out of phase outputs (TP9 and TP3), producing approximately 1.36 kHz."], "jumps": []}, {"id": "P9130", "text": ["4.  Set the function generator for a 5 Vpp 1 kHz square wave as           measured on TP11 of PC130-45.\n\n5.  Press Enter to Set: PC2 DC Power Switch - ON", "4. Set the function generator for a 5 Vpp 1 kHz square wave as measured on TP11 of PC130-45. 5. Press Enter to Set: PC2 DC Power Switch - ON or and rotate fully CCW. 6. Press Enter to Set: PC2 DC Power Switch - ON"], "jumps": []}, {"id": "P9141", "text": [], "jumps": []}, {"id": "P9140", "text": ["6.  Measure the input (TP11) on PC130-45 with CH1 of your                  oscilloscope.   \n7.  Measure the output (TP16) on PC130-45 with CH2 of your                oscilloscope. \n     Is the bistable multivibrator functioning correctly?", "6. Measure the input (TP11) on PC130-45 with CH1 of your oscilloscope. 7. Measure the output (TP16) on PC130-45 with CH2 of your oscilloscope. Is the bistable multivibrator functioning correctly???"], "jumps": ["P9145"]}, {"id": "P13020", "text": ["4.  Press Enter to Set: Set PC1 DC Power Switch - OFF", "4. Press Enter to Set: Set PC1 DC Power Switch - OFF......................"], "jumps": ["P13010"]}, {"id": "P9142", "text": ["The bistable multivibrator should change states (LOW or HIGH) each time a negative-going input pulse is received.", "BISTABLE MULTIVIBRATOR - On PC130-45, the output (TP16) should change states (LOW or HIGH) each time a negative-going input pulse is received at TP11."], "jumps": []}, {"id": "P9161", "text": [], "jumps": []}, {"id": "P9160", "text": ["4.  Measure the input (TP20) on PC130-46 with CH1 of your                  oscilloscope.  \n5.  Measure the output (TP26) on PC130-46 with CH2 of your               oscilloscope. \n     Is the monostable multivibrator functioning correctly?", "4. Measure the input (TP20) on PC130-46 with CH1 of your oscilloscope. 5. Measure the output (TP26) on PC130-46 with CH2 of your oscilloscope. Is the monostable multivibrator functioning correctly???"], "jumps": ["P9165"]}, {"id": "P16030", "text": ["5.  Press Enter to Set: PC3 DC Power Switch - OFF and                         disconnect the function generator output to the PC2 signal            output.", "5. Press Enter to Set: PC3 DC Power Switch - OFF and disconnect the function generator output to the PC2 signal output...", "JUNCTION TESTS - The Base-to-Emitter & Base-to-Collector junction of a transistor should provide a high reading for one lead polarity and low reading for the other whether measuring resistance with an analog ohmmeter or checking current flow using a diode junction tester in a digital multimeter."], "jumps": ["P16020"]}, {"id": "P16000", "text": ["1.  Connect the function generator to the PC2 output BNC                    connector.   \n2.  Press Enter to Set: PC3 DC Power Switch - ON", "1. Connect the function generator to the PC2 output BNC connector. 2. Press Enter to Set: PC3 DC Power Switch - ONN"], "jumps": []}, {"id": "P11000", "text": ["1.  Press Enter to Set: PC1 DC Power Switch - ON", "1. Press Enter to Set: PC1 DC Power Switch - ON xternal program = 130E FLT 0 F1 07 S"], "jumps": []}, {"id": "P11005", "text": ["ASTABLE MULTIVIBRATOR - This normally operating astable multivibrator has two out of phase outputs (TP9 and TP3), producing approximately 1.36 kHz."], "jumps": []}, {"id": "P11007", "text": ["2.  Measure the outputs of the astable multivibrator (TP9 and TP3      on PC130-44) with your oscilloscope. \n     Is the astable multivibrator functioning correctly?", "2. Measure the outputs of the astable multivibrator (TP9 and TP3 on PC130-44) with your oscilloscope. Is the astable multivibrator functioning correctly??"], "jumps": ["P11005"]}, {"id": "P11008", "text": [], "jumps": []}, {"id": "P11009", "te erator to the PC1 output BNC                    connector.   \n2.  Press Enter to Set: PC2 DC Power Switch - ON", "1. Connect the function generator to the PC1 output BNC connector. 2. Press Enter to Set: PC2 DC Power Switch - ON E FLT 0 F2 13 S)"], "jumps": []}, {"id": "P14010", "text": ["3.  Measure the input (TP11) and output (TP16) of the bistable             multivibrator (PC130-45) with your oscilloscope. \n     Is the bistable multivibrator functioning correctly?", "3. Measure the input (TP11) and output (TP16) of the bistable multivibrator (PC130-45) with your oscilloscope. Is the bistable multivibrator functioning correctly??????"], "jumps": ["P14015", "PC130"]}, {"id": "P14011", "text": [], "jumps": []}, {"id": "P14012", "text": ["The bistable multivibrator is not functioning correctly. The computer inserted a fault into the circuit."], "jumps": []}, {"id": "P16015", "text": ["MONOSTABLE MULTIVIBRATOR - On PC130-46, the output pulses (TP26) should occur with each pobe wider than the input pulses (TP20) from the function generator.", "MONOSTABLE MULTIVIBRATOR - On PC130-46, the output pulses (TP26) should occur with every positive-going input pulses (TP20) from the function generator. The output pulse width is set using R23."], "jumps": []}, {"id": "P14080", "text": ["10. Measure the input (TP11) and output (TP16) of the bistable             multivibrator (PC130-45) with your oscilloscope. \n       Is the bistable multivibrator functioning correctly?", "10. Measure the input (TP11) and output (TP16) of the bistable multivibrator (PC130-45) with your oscilloscope. Is the bistable multivibrator functioning correctly??????"], "jumps": ["P14085", "PC130"]}, {"id": "P14020", "text": ["4.  Measure Vcc on PC130-45 TP15. \n     Is it a smooth +12 VDC?", "4. Measure Vcc on PC130-45 TP15. Is it a smooth +12 VDC????????????????????????"], "jumps": ["P14010"]}, {"id": "P14021", "text": [], "jumps": []}, {"id": "P14022", "text": ["The fault inserted by the computer does let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
