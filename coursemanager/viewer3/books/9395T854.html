const book = {"title": "9395T854", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: TROUBLESHOOTING THE 8051 MICROCONTROLLERsdf sadf"], "jumps": []}, {"id": "P10", "text": ["TROUBLESHOOTING THE 8051 MICROCONTROLLER", "# #\" #& \"\"# &\"###2' &2#&.22&# 25--283-.#285255232/238882-.-5:38832222882282-213:22::82-22225:8-33-22282232.22258558.5822385:235:222283538::2585582::2:", "&&#&# #/2.#.& -8 \"#.-&23..22'/.#212&-2258\"588:52", "### ## /# #/&# \" \"/##\"#/&//..#/..&/28.&...&824/&.88-8588..2222858852.28:582228588358282228258.888:825:583.8828::8228828588828583:35558.555.85::88::85588:88:5555::38::85:::5:5:52::85::88::", ":85:855::83:5:5.5:55:855:52.5:5283822242348522...252...2..82/.4..22//2./..##/.8.#&./#&/..##// ##\",##/## #. / /& # ## ## ## ## ## \" #/# ## /# ## #.\" ./ #//###,//.&/#.\"#/.##/./#&/2.&/.../&//....//&2222.2/252.&28.8522582.824828828::255:::5:", "/,,,,,,,,,,,,,/, ,, ,,,,,,6, ,,,6,,, ,,,,,//6//6,,,,/6/,,,/,4/,,/6/4494,,494/6846446/4884664;44;889448489888<8648<<8;44;88988<88948;98<44<;:<44<<8;44<48<<8;48<48<88;48<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Describe the techniques required to troubleshoot a defective microcontroller system. w Describe preventive maintenance. w Describe the basic tool used to troubleshoot a microcontroller system.", "rocontroller trainer. w Understand basic fault types in a microcontroller system.", "w Perform successful troubleshooting with the 8051 microcontroller trainer. w Understand basic fault types in a microcontroller system......"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": ["XXXX XXXX YYYK EKCK +1111111111111"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["Would you throw away your computer if it was malfunctioning? No, you would probably get it  repaired or try to repair it yourself. Most people would not throw away an expensive piece of equipment but rather give it to a technician to repair.", "Would you throw away your computer if it was malfunctioning? No, you would probably get it repaired or try to repair it yourself. Most people would not throw away an expensive piece of equipment but rather give it to a technician to repair."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The technician would take the faulty equipment and find the problem.  Once the technician finds the fault, the equipment can be fixed.  Troubleshooting is a methodical approach to finding a fault and fixing it.", "The technician would take the faulty equipment and find the problem. Once the technician finds the fault, the equipment can be fixed. Troubleshooting is a methodical approach to finding a fault and fixing it."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["The steps and approach to take while troubleshooting a microcontroller will be explained in this lesson.  Understanding troubleshooting will allow you to apply them to any troubleshooting task.", "The steps and approach to take while troubleshooting a microcontroller will be explained in this lesson. Understanding troubleshooting will allow you to apply them to any troubleshooting task."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Let's begin the lesson on TROUBLESHOOTING THE 8051 MICROCONTROLLER.........."], "jumps": ["P410"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["In order to troubleshoot, a technician must have an adequate understanding of both the equipment under test and the test equipment being used.  However, this alone does not make a good technician.", "In order to troubleshoot, a technician must have an adequate understanding of both the equipment under test and the test equipment being used. However, this alone does not make a good technician. o"], "jumps": ["P1050", "P1001", "P"]}, {"id": "P1050", "text": ["It is equally important for a technician to be methodical when troubleshooting.  The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to details.", "It is equally important for a technician to be methodical when troubleshooting. The technician must always keep sight of the overall troubleshooting task and yet, at the same time, be attentive to details."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Much time can be wasted if the technician jumps to conclusions without sufficient evidence.  In most cases, you will be given equipment to troubleshoot with little information on the history of that particular piece of equipment.", "Much time can be wasted if the technician jumps to conclusions without sufficient evidence. In most cases, you will be given equipment to troubleshoot with little information on the history of that particular piece of equipment."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Even if the user does supply a description of the fault symptoms, remember, the user is probably looking at it without the proper electronics knowledge to actually know what they are observing."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["You must verify the symptoms yourself before probing into the microcontroller for the cause of these symptoms."], "jumps": ["P1090", "P1040"]}, {"id": "P1090", "text": ["Occasionally, the fault may allow most of the microcontroller functions to work properly.  The symptoms may be specific enough to assure the experienced technician that the essential functions are working, and also allow the technician to deduce which area is causing the problem.", "Occasionally, the fault may allow most of the microcontroller functions to work properly. The symptoms may be specific enough to assure the experienced technician that the essential functions are working, and also allow the technician to deduce which area is causing the problem."], "jumps": ["P1100", "P1040"]}, {"id": "P1100", "text": ["In this case, the technician may choose to begin investigating the suspect area without going through checks of the more essential system functions.   As a novice technician, you should be as thorough as possible in your observation of the essential functions.", "In this case, the technician may choose to begin investigating the suspect area without going through checks of the more essential system functions. As a novice technician, you should be as thorough as possible in your observation of the essential functions."], "jumps": ["P1110", "P1040"]}, {"id": "P1110", "text": ["A fault in an essential function may be minor enough not to effect the basic system operations, yet be responsible for a less noticeable fault."], "jumps": ["P1120", "P1040"]}, {"id": "P1120", "text": ["Before troubleshooting, you should think about the sections of the microcontroller and what role they play in the system operation.", "1. Which components are not necessary for successful execution and interaction with the monitor program? Disconnecting all non-essential assemblies may make the machine operational again. In this case you can deduce that the fault is in one of the disconnected devices or in the interfacing signals. 2. How can you check that the system is starting correctly when the power is applied? Which components are essential in starting the system? 3. How can you test that the keyboard and the display are working correctly? 4. How can you test that the other peripheral devices are working correctly?????????????????????????????????????????????????????????????????"], "jumps": ["P1130", "P1040"]}, {"id": "P1130", "text": ["If you are sure that you are familiar with the microcontroller you are working on, then, and only then, should you begin troubleshooting."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["There are many troubleshooting techniques that you can use to locate faults in a microcontroller system.  The technique given in this lesson is a simple four step process.", "There are many troubleshooting techniques that you can use to locate faults in a microcontroller system. The technique given in this lesson is a simple four step process."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The technique presented in this lesson is simple and straight forward.  The purpose of this simple four step troubleshooting procedure is to help you be an observant, methodical technician. Let's look at the procedure.", "The technique presented in this lesson is simple and straight forward. The purpose of this simple four step troubleshooting procedure is to help you be an observant, methodical technician. Let's look at the procedure."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["Step 1. Analyze the System Compare the operation of a system to how the system should operate. In other words, verify the symptoms. Do not rely on what someone has told you is wrong. Duplicate the problem. This way you can observe what the equipment is doing or is not doing."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["An important point in this step is that you ARE NOT trying to fix the fault.  You are only determining the symptoms.  Once you have listed all the symptoms, go to Step 2.", "An important point in this step is that you ARE NOT trying to fix the fault. You are only determining the symptoms. Once you have listed all the symptoms, go to Step 2."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Step 2. Recheck the Setup\nEnsure that you have set up the system and test equipment correctly.  Also, if calculations must be performed in Step 1, double check solutions.  Look for any obvious mistakes.", "Step 2. Recheck the Setup Ensure that you have set up the system and test equipment correctly. Also, if calculations must be performed in Step 1, double check solutions. Look for any obvious mistakes.", "DID YOU PLUG THE SYSTEM INTO A POWER SOURCE??", "ARE YOU OPERATING THE SYSTEM CORRECTLY??", "ARE YOU USING THE TEST EQUIPMENT CORRECTLY??"], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["To sum up, this step is used to make sure the symptoms observed in Step 1 are a result of the fault, not one caused by incorrect system operation or misuse of test equipment.  If you are sure that there is a fault in the equipment, go to Step 3.", "To sum up, this step is used to make sure the symptoms observed in Step 1 are a result of the fault, not one caused by incorrect system operation or misuse of test equipment. If you are sure that there is a fault in the equipment, go to Step 3."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["If the setup was not correct, make corrections and return to \nStep 1.  Also, watch for software problems that might appear to be hardware faults.  There could be nothing wrong with the hardware and just the software is not instructing the hardware properly.", "If the setup was not correct, make corrections and return to Step 1. Also, watch for software problems that might appear to be hardware faults. There could be nothing wrong with the hardware and just the software is not instructing the hardware properly."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Step 3. Measure and Test the System This is the step where you actually try to find the fault. Use the symptoms found in Step 1 to guide you to the area that could be causing the problem. Then use test equipment to measure and test the circuits. Once you think you have found the fault, go to Step 4."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Step 4. Double Check your Results \nOnce you have determined the possible fault, double check your work.  Assuming you have found the correct fault, analyze the circuit with the suspected fault to determine if the fault could cause the symptoms you observed in Step 1.", "Step 4. Double Check your Results Once you have determined the possible fault, double check your work. Assuming you have found the correct fault, analyze the circuit with the suspected fault to determine if the fault could cause the symptoms you observed in Step 1."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["If the fault would definitely cause the symptoms (or part of the symptoms, you could have more than one fault), you can be reasonably assured you determined the fault.  Replace or repair the fault and repeat Step 1 to ensure the equipment is 100% operational.", "If the fault would definitely cause the symptoms (or part of the symptoms, you could have more than one fault), you can be reasonably assured you determined the fault. Replace or repair the fault and repeat Step 1 to ensure the equipment is 100% operational."], "jumps": ["P1240", "P1190"]}, {"id": "P1240", "text": ["If the fault could not cause the symptoms, go back to Step 1 to ensure that you observed the correct symptoms and then go to Step 3 for more measurements and tests."], "jumps": ["P1250", "P1190"]}, {"id": "P1250", "text": ["Now that we have discussed the four step process of troubleshooting, let's discuss the proper handling of parts in a microcontroller system.", "When troubleshooting a microcontroller system, it is important to understand the sensitivity of the devices you are handling.  Be extremely careful to avoid introducing any additional faults that would further complicate your task.", "When troubleshooting a microcontroller system, it is important to understand the sensitivity of the devices you are handling. Be extremely careful to avoid introducing any additional faults that would further complicate your task."], "jumps": ["P1260", "P1190", "P1270"]}, {"id": "P1270", "text": ["There are certain environmental limitations in which a microcontroller system can be stored and operated:", "1. The system should not be stored in a dusty environment. 2. The system should only be operated within the manufacturer's specified temperature limitations. 3. The system should always be plugged into a grounded outlet. 4. The system must not be operated near an unshielded power supply of other equipment. Strong emissions from power supplies can force crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system.........................."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Operating the system in the proper environment will help to prevent time consuming repairs in the future."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Different precautions must be taken when handling various components of microcontroller circuits."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["For instance, a resistor can be hand carried, dropped, soldered with plenty of heat, or even have coffee poured on it, yet it still operates correctly in a circuit, provided the coffee has dried."], "jumps": ["P1310", "P1270"]}, {"id": "P1310", "text": ["However, you cannot treat CMOS ICs in the same way.  Handling CMOS ICs may destroy them by static discharges from the body.", "However, you cannot treat CMOS ICs in the same way. Handling CMOS ICs may destroy them by static discharges from the body."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["There are two types of ICs used in the 8051 microcontroller system: CMOS and TTL.  CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic.", "There are two types of ICs used in the 8051 microcontroller system: CMOS and TTL. CMOS stands for Complimentary Metal Oxide Semiconductor and TTL stands for Transistor-Transistor Logic."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["These are two of the most common technologies used in the construction of ICs.  TTL chips can work at a higher speed but have high power consumption.  The CMOS is slower but uses less power than TTL.  CMOS is very susceptible to static electricity.", "These are two of the most common technologies used in the construction of ICs. TTL chips can work at a higher speed but have high power consumption. The CMOS is slower but uses less power than TTL. CMOS is very susceptible to static electricity."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and felt an electric shock?  That electric shock you got was 50,000 or more volts!", "Have you ever walked across carpet in the middle of winter while shuffling your feet, touched something metal and felt an electric shock? That electric shock you got was 50,000 or more volts!"], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["The reason that you don't get seriously injured from this shock is because there is very little current associated with it.  Current kills, not voltage.  However, static voltages as small as 250 volts can destroy or damage a CMOS chip.", "The reason that you don't get seriously injured from this shock is because there is very little current associated with it. Current kills, not voltage. However, static voltages as small as 250 volts can destroy or damage a CMOS chip."], "jumps": ["P1360", "P1320"]}, {"id": "P1360", "text": ["Some options for preventing damage to CMOS chips are listed below.", "- Raise the humidity of the room by use of humidifier, plants or an aquarium. - Use static free carpet. - Wear a ground strap on your wrist that is clipped to ground. - Don't touch more chips than you have to. - Don't touch the chip's pins when picking them up, try to only touch the body... power supply of other equipment. Strong emissions from power supplies can force crystals to vibrate at the wrong frequency. 5. The system should always be turned off before attaching or detaching hardware from the system."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["The following is a short summary of other component handling precautions:", "Capacitors: Ceramics, mica and tantalum capacitors are not polarized, but the electrolytic capacitors are. If capacitors are cracked, replace them, and if they are electrolytic be sure not to put them in backwards. Crystals: Crystal cases should be grounded. Crystals may be upset by strong emissions from the power supply of other instruments and may vibrate at a different frequency because of this. Diodes: Diodes must be put in the circuit with the correct polarity. Fuses: Don't rely on only visual check. Check fuses with an ohmmeter...........", "Headers: Check that the header pins are straight before plugging a cable into them. These are the large square connectors that are used to connect different sections of the 8051 Microcontroller system together. LEDs: LEDs are easily damaged by soldering heat and applying too much voltage or current to them. Resistors: Value and tolerance can be determined from their color bands. Replace cracked or discolored components, putting more power through them than what they were designed for can destroy them. Resistors have a power rating in watts. Typical resistors used in Nida circuits will be", "Sockets: Check that ICs are seated in their sockets properly, not tilted. When soldering sockets in place, solder diagonally opposite pins from the farthest corners first and check to see that the socket is flat against the circuit board. Now remaining pins can be easily soldered into place. Switches: Don't use solvents to clean switches and don't use a pencil to switch rocker switches. If substances get between the switch's contacts, it's operation may become impaired........they were designed for can destroy them. Resistors have a power rating in watts. Typical resistors used in Nida circuits will be"], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Microcontroller systems use many integrated circuits.  These ICs look identical except for the number of pins and the labeling on the cases.  Pin number identification and proper IC placement is extremely important.", "Microcontroller systems use many integrated circuits. These ICs look identical except for the number of pins and the labeling on the cases. Pin number identification and proper IC placement is extremely important."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["IC identification codes vary depending on the manufacturer.  Manufacturer recognition is important when replacing chips and researching the IC data.  The following list describes some       identifying marks by which you can recognize the IC manufacturer.", "IC identification codes vary depending on the manufacturer. Manufacturer recognition is important when replacing chips and researching the IC data. The following list describes some identifying marks by which you can recognize the IC manufacturer.", "Motorola: Letter M in a circle National Semiconductor: Two parallel wavy lines Texas Instruments: Outline of the state of Texas Other manufacturers may put their names on the IC's, like NEC or Toshiba......................................................................................................'"], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["Chip specifications can be looked up in the manufacturer's data books.  This information is very important when replacing an IC with one from a different manufacturer.", "Chip specifications can be looked up in the manufacturer's data books. This information is very important when replacing an IC with one from a different manufacturer."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["The only way you an be sure that the replacement IC is the same is to check the specifications for both chips, and that requires knowing the manufacturer.  Many data books provide cross-references for direct replacement of an IC built by a different manufacturer.", "The only way you an be sure that the replacement IC is the same is to check the specifications for both chips, and that requires knowing the manufacturer. Many data books provide cross-references for direct replacement of an IC built by a different manufacturer."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Identification codes usually consist of three parts: a prefix number, a device number, and a suffix.  Generally, most manufacturers use a different method which, in some way, is similar to this method.", "Identification codes usually consist of three parts: a prefix number, a device number, and a suffix. Generally, most manufacturers use a different method which, in some way, is similar to this method."], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["The only sure method to determine the type of IC is to use the manufacturer's data books.  Many manufactures include a date mark on the chip.  This date usually indicates the month and year the chip was made.  The date helps identify the chip, especially if the manufacturer changes the method used to identify the chip.", "The only sure method to determine the type of IC is to use the manufacturer's data books. Many manufactures include a date mark on the chip. This date usually indicates the month and year the chip was made. The date helps identify the chip, especially if the manufacturer changes the method used to identify the chip.", "Other types of markings may include: * Manufacturer's part number * Inspection Markings * Source of Supply * Manufacturing locationn Other manufacturers may put their names on the ICs, like NEC or Toshiba.................................................................................................;"], "jumps": ["P1440", "P1400"]}, {"id": "P1440", "text": ["Installing ICs requires special attention and sometimes special equipment.  Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are.", "Installing ICs requires special attention and sometimes special equipment. Soldering an IC, especially a CMOS chip, can destroy the device no matter how careful you are."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Because of this, most ICs are now placed in sockets with the sockets soldered to the PC board before the IC is inserted.  In this way, IC chips can avoid heat related damage.", "Because of this, most ICs are now placed in sockets with the sockets soldered to the PC board before the IC is inserted. In this way, IC chips can avoid heat related damage."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Before trying to insert an IC, check that its legs are straight and evenly spaced.  ICs have a dimple or notch used for orientation. The pins are numbered starting at 1 and go counter clockwise from the dimple.", "Before trying to insert an IC, check that its legs are straight and evenly spaced. ICs have a dimple or notch used for orientation. The pins are numbered starting at 1 and go counter clockwise from the dimple."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["Pin 1 of the IC should be inserted as shown below.  Remember that inserting a chip backwards can destroy the chip when power is applied.", "Pin 1 of the IC should be inserted as shown below. Remember that inserting a chip backwards can destroy the chip when power is applied."], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["To insert the IC, line up all its legs with the socket connectors then press it down gently.  Ensure all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of  the way.", "To insert the IC, line up all its legs with the socket connectors then press it down gently. Ensure all legs have begun to slide into their appropriate socket locations before pushing the IC in the rest of the way."], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["To remove an IC, lift up, being careful not to bend any pins, this will require a rocking motion.  Ensure that one end of the IC is not completely removed before the other end because this will bend pins.", "Most technicians, after practice, can insert and remove an IC by hand or with a screwdriver.  However, IC insertion and removal tools are manufactured and should be used whenever possible.  These tools make insertion and removal simple, and greatly reduce the risk of damaging an IC.", "To remove an IC, lift up, being careful not to bend any pins, this will require a rocking motion. Ensure that one end of the IC is not completely removed before the other end because this will bend pins.", "Most technicians, after practice, can insert and remove an IC by hand or with a screwdriver. However, IC insertion and removal tools are manufactured and should be used whenever possible. These tools make insertion and removal simple, and greatly reduce the risk of damaging an IC."], "jumps": ["P1500", "P1440", "P1510"]}, {"id": "P1510", "text": ["Integrated Circuits (ICs) should be _______", "Integrated Circuits (ICs) should be _______................", "always soldered directly to the PC board.", "have the pins bent in all different directions."], "jumps": ["P1500"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1512", "text": ["Some ICs cannot be directly soldered to a PC board.  The heat from the soldering iron may be too intense and cause damage to the internal or external structure.  Also, chip sockets are used to allow quick and easy removal of a bad IC with a good one.", "Some ICs cannot be directly soldered to a PC board. The heat from the soldering iron may be too intense and cause damage to the internal or external structure. Also, chip sockets are used to allow quick and easy removal of a bad IC with a good one."], "jumps": []}, {"id": "P1513", "text": ["The pins of an IC should be move as little as possible.  It is easy to break one of the pins off of an IC.  Once a pin is broken off, in most cases this will make the IC useless (unless that signal is not needed).", "The pins of an IC should be move as little as possible. It is easy to break one of the pins off of an IC. Once a pin is broken off, in most cases this will make the IC useless (unless that signal is not needed)."], "jumps": []}, {"id": "P1520", "text": ["As a technician, troubleshooting is unavoidable, but the frequency of equipment failure can be dramatically reduced by eliminating potential problems before they begin.  This is accomplished by a process called Preventive Maintenance.", "As a technician, troubleshooting is unavoidable, but the frequency of equipment failure can be dramatically reduced by eliminating potential problems before they begin. This is accomplished by a process called Preventive Maintenance."], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["As the name implies, this maintenance is accomplished before the system has a chance to fail.  For example, suppose that your microcontroller is operating correctly and there are no signs of system failure.", "As the name implies, this maintenance is accomplished before the system has a chance to fail. For example, suppose that your microcontroller is operating correctly and there are no signs of system failure."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["However, you decide to measure the output voltages of the power supply.  The measurements show that the +5V to each chip is measuring +8V.  Even though the system operates correctly, the output voltage may eventually damage some of the chips in the microcontroller system.", "However, you decide to measure the output voltages of the power supply. The measurements show that the +5V to each chip is measuring +8V. Even though the system operates correctly, the output voltage may eventually damage some of the chips in the microcontroller system."], "jumps": ["P1550", "P1520"]}, {"id": "P1550", "text": ["So, at a convenient time, you re-adjust the power supply.  What you did was preventive maintenance; you found a situation that may cause a failure later, and fixed it.", "So, at a convenient time, you re-adjust the power supply. What you did was preventive maintenance; you found a situation that may cause a failure later, and fixed it."], "jumps": ["P1560", "P1520"]}, {"id": "P1560", "text": ["Another preventive maintenance action is routine cleaning. When a printed circuit board becomes coated by dust, the dust becomes an insulator and holds in the heat."], "jumps": ["P1570", "P1520"]}, {"id": "P1570", "text": ["Heat buildup may cause components to fail.  Dust, dirt, and other airborne particles can also conduct electricity which can cause arcing and shorts.", "Heat buildup may cause components to fail. Dust, dirt, and other airborne particles can also conduct electricity which can cause arcing and shorts."], "jumps": ["P1580", "P1520"]}, {"id": "P1580", "text": ["Troubleshooting Tools\nA computer repair technician must select tools to use which are  appropriate to the troubleshooting task.  Often you will choose tools that you are familiar with.", "Troubleshooting Tools A computer repair technician must select tools to use which are appropriate to the troubleshooting task. Often you will choose tools that you are familiar with."], "jumps": ["P1590", "P1520"]}, {"id": "P1590", "text": ["However, it is just as important to know how to use other tools which can speed up the troubleshooting process.  This section of the lesson is not going to teach you how to use the most common troubleshooting tools, but it will introduce them to you.", "However, it is just as important to know how to use other tools which can speed up the troubleshooting process. This section of the lesson is not going to teach you how to use the most common troubleshooting tools, but it will introduce them to you."], "jumps": ["P1600", "P1580"]}, {"id": "P1600", "text": ["In the experiment you will have the opportunity to use some of the test equipment discussed."], "jumps": ["P1610", "P1580"]}, {"id": "P1610", "text": ["Test Instruments\nIn your study of electronics, you have learned that multimeters and oscilloscopes are invaluable in determining correct circuit operation and for troubleshooting faulted circuits.", "Test Instruments In your study of electronics, you have learned that multimeters and oscilloscopes are invaluable in determining correct circuit operation and for troubleshooting faulted circuits."], "jumps": ["P1620", "P1580"]}, {"id": "P1620", "text": ["In each area of electronics, different types of test equipment provide the best means for circuit measurements. Microcontrollers are digital devices and are best troubleshot with test equipment designed for digital circuits."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current, and resistance.  In AC circuits, the oscilloscope is invaluable for determining the characteristics of waveforms.", "In DC circuits, the multimeter is the best choice for measuring circuit values of voltage, current, and resistance. In AC circuits, the oscilloscope is invaluable for determining the characteristics of waveforms."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["In digital electronics, the oscilloscope and multimeter are used, along with several other types of test instruments."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["In this course you have possibly used a multimeter, oscilloscope and logic probe depending on the equipment that you used in the experiments.  However, you should know what other types of test equipment are available to you.", "In this course you have possibly used a multimeter, oscilloscope and logic probe depending on the equipment that you used in the experiments. However, you should know what other types of test equipment are available to you."], "jumps": ["P1660", "P1610"]}, {"id": "P1660", "text": ["The testing of digital circuitry is different from analog circuitry in several ways.", "* Digital Circuits use Low DC Voltages. 0, 1.3, 3, 5, and 12 VDC are the most common voltages encountered. * Digital Circuits normally do not have AC voltages present. * Digital Circuits do not normally require resistance checks due to the design of the IC's. * Digital Circuits often rely on timing. That is, synchronization between signals is vital for proper operation. * Digital Circuits use IC's. Since IC's can not be repaired, measuring input and output signals is the troubleshooting method used....d used..used.."], "jumps": ["P1670", "P1610"]}, {"id": "P1670", "text": ["Because of these differences, several special types of digital test instruments have been developed.  Let's begin the discussion on digital test equipment with the multimeter and the oscilloscope.", "Because of these differences, several special types of digital test instruments have been developed. Let's begin the discussion on digital test equipment with the multimeter and the oscilloscope."], "jumps": ["P1680", "P1660"]}, {"id": "P1680", "text": ["Multimeter \nThe multimeter is the most commonly used test instrument in DC and AC circuits.  However, it is not the most commonly used test instrument in digital circuits.", "Multimeter The multimeter is the most commonly used test instrument in DC and AC circuits. However, it is not the most commonly used test instrument in digital circuits."], "jumps": ["P1690", "P1660"]}, {"id": "P1690", "text": ["Multimeters measure DC and AC voltages, DC and AC current and resistances.  Some even test transistors, diodes and capacitors.", "Multimeters measure DC and AC voltages, DC and AC current and resistances. Some even test transistors, diodes and capacitors.."], "jumps": ["P1700", "P1680"]}, {"id": "P1700", "text": ["In digital electronics, multimeters are used primarily to measure operating voltage, that is Vcc, and check for open or shorted circuit solder runs on printed circuit cards.  Vcc is normally a DC voltage between 1 and 12 volts.", "In digital electronics, multimeters are used primarily to measure operating voltage, that is Vcc, and check for open or shorted circuit solder runs on printed circuit cards. Vcc is normally a DC voltage between 1 and 12 volts."], "jumps": ["P1710", "P1680"]}, {"id": "P1710", "text": ["The trend in digital electronics is to use the lowest Vcc values that the chips can be made to run on.  This helps reduce heat problems.  Many circuits in development today are designed to run all the way down below 1 volt representing a high condition.", "The trend in digital electronics is to use the lowest Vcc values that the chips can be made to run on. This helps reduce heat problems. Many circuits in development today are designed to run all the way down below 1 volt representing a high condition."], "jumps": ["P1720", "P1680"]}, {"id": "P1720", "text": ["PC card circuit solder runs are checked by measuring continuity between points on the card.  Continuity indicates a good connection, no continuity indicates an open.", "PC card circuit solder runs are checked by measuring continuity between points on the card. Continuity indicates a good connection, no continuity indicates an open."], "jumps": ["P1730", "P1680"]}, {"id": "P1730", "text": ["Logic highs and lows may also be measured using a multimeter. A high is normally between 2 and 12 VDC while a low is between 0 and 2 VDC.  Remember, you must have knowledge about the IC family you are using.", "Logic highs and lows may also be measured using a multimeter. A high is normally between 2 and 12 VDC while a low is between 0 and 2 VDC. Remember, you must have knowledge about the IC family you are using."], "jumps": ["P1740", "P1680"]}, {"id": "P1740", "text": ["Many have different ranges of values that represent high and low conditions.  As long as the logic levels are constant, a multimeter will give an accurate reading of HIGH or LOW.", "Many have different ranges of values that represent high and low conditions. As long as the logic levels are constant, a multimeter will give an accurate reading of HIGH or LOW."], "jumps": ["P1750", "P1680"]}, {"id": "P1750", "text": ["But, if the levels are changing, pulse inputs or outputs, the multimeter is of little use.  Since there are other means to measure operating voltages and logic levels, the multimeter is not used very often, only for continuity checks or pins that maintain static voltage levels, like Vcc or ground.", "But, if the levels are changing, pulse inputs or outputs, the multimeter is of little use. Since there are other means to measure operating voltages and logic levels, the multimeter is not used very often, only for continuity checks or pins that maintain static voltage levels, like Vcc or ground."], "jumps": ["P1760", "P1680"]}, {"id": "P1760", "text": ["Oscilloscopes\nThe oscilloscope is a lot more expensive than the multimeter, however, there are not many electronic repair shops that do not have at least one.", "Oscilloscopes The oscilloscope is a lot more expensive than the multimeter, however, there are not many electronic repair shops that do not have at least one. i"], "jumps": ["P1770", "P1680"]}, {"id": "P1770", "text": ["The oscilloscope provides a visual display of a voltage waveform and measures AC and DC voltages, periods, frequency, and phase."], "jumps": ["P1780", "P1760"]}, {"id": "P1780", "text": ["In digital circuits, the oscilloscope is one of the most versatile instruments.  The oscilloscope can detect abnormalities in waveforms that other instruments cannot.", "In digital circuits, the oscilloscope is one of the most versatile instruments. The oscilloscope can detect abnormalities in waveforms that other instruments cannot."], "jumps": ["P1790", "P1760"]}, {"id": "P1790", "text": ["Characteristics such as amplitude, rise and fall times, pulse width, period, and frequency can be quickly determined from oscilloscope measurements."], "jumps": ["P1800", "P1760"]}, {"id": "P1800", "text": ["An oscilloscope can also be used to measure logic highs and lows which are DC values.  In addition, pulse waveforms and square waveforms can be measured.", "An oscilloscope can also be used to measure logic highs and lows which are DC values. In addition, pulse waveforms and square waveforms can be measured."], "jumps": ["P1810", "P1760"]}, {"id": "P1810", "text": ["One of the big advantages of using a dual trace oscilloscope is that two waveforms can be measured at the same time.  In this way, the time relationship can be determined and analyzed.", "One of the big advantages of using a dual trace oscilloscope is that two waveforms can be measured at the same time. In this way, the time relationship can be determined and analyzed."], "jumps": ["P1820", "P1760"]}, {"id": "P1820", "text": ["However, oscilloscopes have one disadvantage when used in microcontroller systems.  Only one or two waveforms can usually be displayed at one time.  This disadvantage is overcome by using an oscilloscope multiplexer.", "Shown below is an oscilloscope which incorporates a 16 channel multiplexer.  The multiplexer allows up to 16 signals to be viewed on the oscilloscope simultaneously.  This is a great advantage when analyzing complex microprocessor functions such as the reading or writing of data.", "However, oscilloscopes have one disadvantage when used in microcontroller systems. Only one or two waveforms can usually be displayed at one time. This disadvantage is overcome by using an oscilloscope multiplexer.", "Shown below is an oscilloscope which incorporates a 16 channel multiplexer. The multiplexer allows up to 16 signals to be viewed on the oscilloscope simultaneously. This is a great advantage when analyzing complex microprocessor functions such as the reading or writing of data."], "jumps": ["P1830", "P1760", "P1840"]}, {"id": "P1840", "text": ["Also, signals viewed by the oscilloscope must be periodic.  In other words, they must repeat themselves in the same pattern over and over to be seen on the oscilloscope display properly.", "Also, signals viewed by the oscilloscope must be periodic. In other words, they must repeat themselves in the same pattern over and over to be seen on the oscilloscope display properly."], "jumps": ["P1850", "P1830"]}, {"id": "P1850", "text": ["Logic Probe\nThe logic probe is the least expensive of all digital test instruments.  It is especially designed to be used with digital circuits.  Logic probes measure logic levels.  Note, logic probes do not measure actual DC values.", "Logic Probe The logic probe is the least expensive of all digital test instruments. It is especially designed to be used with digital circuits. Logic probes measure logic levels. Note, logic probes do not measure actual DC values."], "jumps": ["P1860", "P1830"]}, {"id": "P1860", "text": ["The probe provides a simple means of measuring highs, lows, and pulses.  The probe is nothing more than one or more LEDs that illuminate for certain types of signal inputs.", "The probe provides a simple means of measuring highs, lows, and pulses. The probe is nothing more than one or more LEDs that illuminate for certain types of signal inputs."], "jumps": ["P1870", "P1850"]}, {"id": "P1870", "text": ["A logic probe can indicate a high signal, a low signal, single pulse, multiple pulses, or an open or bad level. Even though the logic probe is very useful for detecting faults quickly, it normally must be used with other types of digital test instruments to locate problems that are more than just a missing or incorrect input."], "jumps": ["P1880", "P1850"]}, {"id": "P1880", "text": ["Current Tracer/Logic Pulser The current tracer and logic pulser are very simple test instruments that detect or insert a pulsating current at a particular point in a circuit. Their appearance is very similar to the logic probe, and they are often used in conjunction with the logic probe."], "jumps": ["P1890", "P1850"]}, {"id": "P1890", "text": ["The current tracer and logic pulser are used to find points in a digital circuit that are stuck, that is, the point remains a logical 1 or 0 all the time.  It is particularly difficult to isolate a bad IC when several are connected together.  The current tracer and logic pulser make the job easier.", "The current tracer and logic pulser are used to find points in a digital circuit that are stuck, that is, the point remains a logical 1 or 0 all the time. It is particularly difficult to isolate a bad IC when several are connected together. The current tracer and logic pulser make the job easier."], "jumps": ["P3000", "P1880"]}, {"id": "P1910", "text": ["This completes the information on TROUBLESHOOTING.", "This completes the information on TROUBLESHOOTING.E........"], "jumps": ["P1001", "P3210"]}, {"id": "P1920", "text": ["1.  The four step general troubleshooting process is:", "1. The four step general troubleshooting process is::e...."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Preventive maintenance is regularly checking a                                  microcontroller system to avoid problems in the future.", "2. Preventive maintenance is regularly checking a microcontroller system to avoid problems in the future."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Troubleshooting tools fall into two categories: Test                            Instruments and Non-Test Instruments.", "3. Troubleshooting tools fall into two categories: Test Instruments and Non-Test Instruments."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Test instruments used in troubleshooting are: Multimeters,            Oscilloscopes, Logic Probes, Logic Analyzers, Signature                Analyzers, Current Tracer/Logic Pulsers, and Logic Clips.", "4. Test instruments used in troubleshooting are: Multimeters, Oscilloscopes, Logic Probes, Logic Analyzers, Signature Analyzers, Current Tracer/Logic Pulsers, and Logic Clips."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  Non-Test instruments used in troubleshooting are: Visual              Inspection and Diagnostic Routines.", "5. Non-Test instruments used in troubleshooting are: Visual Inspection and Diagnostic Routines."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1940"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2040", "text": ["In this experiment, you will get hands on experience troubleshooting a microcontroller system.  You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson.", "In this experiment, you will get hands on experience troubleshooting a microcontroller system. You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["In each case you will check the system to detect any problems.  If a fault is discovered, certain steps will be performed to isolate the fault to a particular region of the microcontroller system.", "In each case you will check the system to detect any problems. If a fault is discovered, certain steps will be performed to isolate the fault to a particular region of the microcontroller system."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["1.  Set the test console controls to their initial control setting.", "1. Set the test console controls to their initial control setting........."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["2.  Insert the following 130 experiment cards on the test console.       a.  Insert PC130-405 51 Family Microcontroller card in the PC1 position. \n     b.  Insert PC130-406 Keyboard and Display card in the PC2 position. \n     c.  Insert PC130-407 Microcontroller I/O and Interface card in the PC3                    position.", "2. Insert the following 130 experiment cards on the test console. a. Insert PC130-405 51 Family Microcontroller card in the PC1 position. b. Insert PC130-406 Keyboard and Display card in the PC2 position. c. Insert PC130-407 Microcontroller I/O and Interface card in the PC3 position."], "jumps": ["P2070"]}, {"id": "P2090", "text": ["3. Connect the three experiment cards with the ribbon cables as follows: a. Using the first 34 pin ribbon cable, connect PC130-405 J1 to PC130-406 J1. b. Using the second 34 pin ribbon cable, connect PC130-406 J2 to PC130- 407 J1..........................................................cable, connect PC130-406 J2 to PC130-407 J1.0-407 J1..."], "jumps": ["P2080"]}, {"id": "P2100", "text": ["4.  Set the Voltmeter switch to Negative 15 Volts. \n5.  Set the Voltmeter switch to Positive 15 Volts.", "4. Set the Voltmeter switch to Negative 15 Volts. 5. Set the Voltmeter switch to Positive 15 Volts."], "jumps": ["P2090"]}, {"id": "P2110", "text": ["6.  Set the PC3 DC Power switch to ON.", "6. Set the PC3 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2100"]}, {"id": "P2115", "text": ["7.  Set the PC2 DC Power switch to ON.", "7. Set the PC2 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2110"]}, {"id": "P2120", "text": ["8.  Set the PC1 DC Power switch to ON.", "8. Set the PC1 DC Power switch to ON..to 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": ["P2115"]}, {"id": "P2130", "text": ["9. The microcontroller system is now assembled and operating. You should see the message \"NIDA_51:\" in the LCD display on the PC130-406 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-406 card using a small screw driver. If you still cannot see the message, see your instructor for assistance.", "If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements. Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. n run the program before proceeding with your measurements.....nts."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["At any time during the remainder of the lesson you may press Ctrl S to view the schematic diagram of 8051 family microcontroller."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["The microcontroller setup is complete.  Now the computer will insert a fault.  Let's see if we can find where this fault is affecting the system.", "10.  On the keyboard of the 8051 microcontroller system, enter 0           and then 1.", "The microcontroller setup is complete. Now the computer will insert a fault. Let's see if we can find where this fault is affecting the system.", "10. On the keyboard of the 8051 microcontroller system, enter 0 and then 1.....", "XXXX XXXX YYYK EKCK +1111111111111"], "jumps": ["P2140", "P2180", "P2150"]}, {"id": "P2180", "text": ["Nothing is happening, not even your keystroke is being displayed on the screen of the 8051 LCD display.  The display of the LCD has characters on it, this indicates that power is being applied to the system.", "Nothing is happening, not even your keystroke is being displayed on the screen of the 8051 LCD display. The display of the LCD has characters on it, this indicates that power is being applied to the system."], "jumps": ["P2170", "P2190"]}, {"id": "P2190", "text": ["If you are uncertain if power is being applied properly, use your oscilloscope to see if the power at the appropriate test points is correct."], "jumps": ["P2170", "P2200"]}, {"id": "P2200", "text": ["The system is not operational, so we need to look at the control signals of the microcontroller and the different locations where they can be observed."], "jumps": ["P2170", "P2210"]}, {"id": "P2210", "text": ["Since we have no knowledge of what the microcontroller is doing, we really have no knowledge of what the signal should look like.  However, we can see if a signal is getting to a correct location.  Let's start with the PSEN signal.", "11.  Connect CH1 of the oscilloscope to the PSEN test point on             PC130-405.  Adjust your Time/Division setting for a square              wave.", "Since we have no knowledge of what the microcontroller is doing, we really have no knowledge of what the signal should look like. However, we can see if a signal is getting to a correct location. Let's start with the PSEN signal.", "11. Connect CH1 of the oscilloscope to the PSEN test point on PC130-405. Adjust your Time/Division setting for a square wave."], "jumps": ["P2220", "P2170", "P2230", "P2210", "P"]}, {"id": "P2230", "text": ["At this point we have a signal that we can look for at other locations.  If this signal is not seen where the PSEN signal is applied, then we know that some sort of open circuit exists.", "At this point we have a signal that we can look for at other locations. If this signal is not seen where the PSEN signal is applied, then we know that some sort of open circuit exists."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["Likewise, if we are measuring signals elsewhere and this signal is seen, this could possibly indicate some sort of shorted circuitry."], "jumps": ["P2220", "P2250"]}, {"id": "P2250", "text": ["12.  With CH2 of the oscilloscope, determine if the PSEN signal is         at these locations on the PC130-405 card:\n        * Pin 1 of U7 (Quad NAND Gate).\n        * Pin 22 of U3 (EPROM 32 k).", "12. With CH2 of the oscilloscope, determine if the PSEN signal is at these locations on the PC130-405 card: * Pin 1 of U7 (Quad NAND Gate). * Pin 22 of U3 (EPROM 32 k)."], "jumps": ["P2220", "P2260"]}, {"id": "P2260", "text": ["We can see that this signal is making it to all the locations it is routed to on the circuit card.  The next step is to check another control signal, the WR pin.", "We can see that this signal is making it to all the locations it is routed to on the circuit card. The next step is to check another control signal, the WR pin."], "jumps": ["P2220", "P2270"]}, {"id": "P2270", "text": ["13.  Connect CH1 of the oscilloscope to the WR test point on                 PC130-405.  Adjust your Time/Division setting until sharp                negative pulses are seen.", "13. Connect CH1 of the oscilloscope to the WR test point on PC130-405. Adjust your Time/Division setting until sharp negative pulses are seen."], "jumps": ["P2220", "P2280"]}, {"id": "P2280", "text": ["Again, you are fortunate that the system works in a capacity such that a signal can be observed on this pin.", "14.  With CH2 of the oscilloscope, determine if the WR signal is at         these locations:\n        * PC130-405 Pin 27 of U4 (RAM 32 k).\n        * PC130-406 Pin 5 of the LCD Module (Pin 1 is the left most                pin).", "14. With CH2 of the oscilloscope, determine if the WR signal is at these locations: * PC130-405 Pin 27 of U4 (RAM 32 k). * PC130-406 Pin 5 of the LCD Module (Pin 1 is the left most pin).", "XXXX XXXX YYYK EKCK +1111111111111"], "jumps": ["P2220", "P2290", "P2300", "P2280", "Pin"]}, {"id": "P2300", "text": ["The WR signal should NOT have been observed at pin 5 of the LCD module.  This indicates that there is an open between the signal from the microcontroller and this pin of the LCD display.", "The WR signal should NOT have been observed at pin 5 of the LCD module. This indicates that there is an open between the signal from the microcontroller and this pin of the LCD display."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["15.  Observe the LCD display while the computer clears the fault.", "15. Observe the LCD display while the computer clears the fault.to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2300"]}, {"id": "P2320", "text": ["The WR signal should now be seen at pin 5 of the LCD module. What you have seen is a simplistic example of finding an open circuit.  If a periodic signal had not been present, a logic pulser can be used to inject a signal which can be detected.", "The WR signal should now be seen at pin 5 of the LCD module. What you have seen is a simplistic example of finding an open circuit. If a periodic signal had not been present, a logic pulser can be used to inject a signal which can be detected."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["It is important to note that you may have to check many signals before you find the problem.  The problem could have been software only, meaning there is nothing wrong with the hardware.", "It is important to note that you may have to check many signals before you find the problem. The problem could have been software only, meaning there is nothing wrong with the hardware."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["Now that you have seen a fault that completely disables the system, let's see one that partially disables something in the system."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["16.  Press RESET on the 8051 Microcontroller system.", "16. Press RESET on the 8051 Microcontroller system........"], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Now the computer will insert another fault.", "Now the computer will insert another fault.. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2350"]}, {"id": "P2370", "text": ["17.  Press \"Run\" 4, 0, 0, and 0 on the 8051 keyboard.", "17. Press \"Run\" 4, 0, 0, and 0 on the 8051 keyboard......."], "jumps": ["P2380", "P2360"]}, {"id": "P2380", "text": ["You should have been able to enter \"Run\" and 4, but the zeros did not register.  Try pressing all the keys and see which ones do not work.  If at anytime you are in a subprogram and want to get out, just press the reset button on PC130-405 and continue to test keys.", "You should have been able to enter \"Run\" and 4, but the zeros did not register. Try pressing all the keys and see which ones do not work. If at anytime you are in a subprogram and want to get out, just press the reset button on PC130-405 and continue to test keys."], "jumps": ["P2390", "P2370"]}, {"id": "P2390", "text": ["You should have observe that the entire first row was not detected.  Since the problem only affects this row, the problem has something to do with the row connection or associated components.", "You should have observe that the entire first row was not detected. Since the problem only affects this row, the problem has something to do with the row connection or associated components...neeod keys are not being detected. Since nothing is being detected, only on this row, the problem is something with the row connection."], "jumps": ["P2400", "P2380"]}, {"id": "P2400", "text": ["18.  Using CH1 of the oscilloscope observe the signals at Y1                  when you press a row 1 key, Y2 when your press a row 2                key and Y3 when you press a row 3 key.", "18. Using CH1 of the oscilloscope observe the signals at Y1 when you press a row 1 key, Y2 when your press a row 2 key and Y3 when you press a row 3 key."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["You should have observed that the Y1 signal is not being generated by the switch matrix.  For proper operation of the keyboard, it is essential that these three signals be correctly applied to the OR gate circuits U3C and U3D.", "You should have observed that the Y1 signal is not being generated by the switch matrix. For proper operation of the keyboard, it is essential that these three signals be correctly applied to the OR gate circuits U3C and U3D.gs are being correctly generated by the switch matrix. These three signals are applied to an OR gate circuit and then to the keyboard decoding circuit. Let's see if the signals are making it or not."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["19.  Connect CH1 to the Y1 test point and CH2 to the KP test                  point.  Press keys form the first row and observe the display.         Also check Y2 and KP with row 2 keys and Y3 and KP with             row 3 keys.", "19. Connect CH1 to the Y1 test point and CH2 to the KP test point. Press keys form the first row and observe the display. Also check Y2 and KP with row 2 keys and Y3 and KP with row 3 keys."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["The Y and KP signals should have been generated for key presses from row 2 and 3, but not for row 1.  This indicates either a problem with an OR gate or an associated circuit.", "The Y and KP signals should have been generated for key presses from row 2 and 3, but not for row 1. This indicates either a problem with an OR gate or an associated circuit."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["In this case, the input to the OR gate from the first horizontal keyboard matrix line is shorted.  This prevents the interrupt from occurring which doesn't allow the key presses to be recognized.", "In this case, the input to the OR gate from the first horizontal keyboard matrix line is shorted. This prevents the interrupt from occurring which doesn't allow the key presses to be recognized. zed."], "jumps": ["P2450", "P2430"]}, {"id": "P2450", "text": ["20.  Verify that the keyboard is working properly.", "20. Verify that the keyboard is working properly. PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2440"]}, {"id": "P2460", "text": ["What you have seen in this experiment are examples of typical faults which may occur in a microcontroller system.  You were able to see how they can be detected and which types of indications they display.", "What you have seen in this experiment are examples of typical faults which may occur in a microcontroller system. You were able to see how they can be detected and which types of indications they display."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["As you gain experience in troubleshooting microcontroller systems, certain faults will become easier to detect."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2470"]}, {"id": "P2490", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2480"]}, {"id": "P2500", "text": ["3.  Return all test equipment to their designated storage area.", "3. Return all test equipment to their designated storage area.."], "jumps": ["P2910", "P2490"]}, {"id": "P2910", "text": ["This completes the experiment on THE 8051 MICROCONTROLLER.", "This completes the experiment on THE 8051 MICROCONTROLLER...."], "jumps": ["P2001", "P2500"]}, {"id": "P3000", "text": ["The logic pulser is used to inject a pulsating signal, a square wave, into the circuit if normal signal levels are constant.  The current tracer is used to trace the current paths through the circuit.", "The logic pulser is used to inject a pulsating signal, a square wave, into the circuit if normal signal levels are constant. The current tracer is used to trace the current paths through the circuit."], "jumps": ["P3010", "P1880"]}, {"id": "P3010", "text": ["An LED on the current tracer illuminates when the signal at a particular point is pulsating.  No illumination indicates a fault, and by signal tracing, the bad component can be located.", "Logic Analyzer  \nThe logic analyzer is basically a special type of multichannel oscilloscope that has the ability to display logic levels, pulse trains of highs and lows, in several formats.  Logic analyzers are expensive and only used in complex digital circuits.", "An LED on the current tracer illuminates when the signal at a particular point is pulsating. No illumination indicates a fault, and by signal tracing, the bad component can be located.", "Logic Analyzer The logic analyzer is basically a special type of multichannel oscilloscope that has the ability to display logic levels, pulse trains of highs and lows, in several formats. Logic analyzers are expensive and only used in complex digital circuits."], "jumps": ["P3020", "P1880", "P3030"]}, {"id": "P3030", "text": ["One type of format is the TIMING DIAGRAM.  Several pulse waveforms are displayed in the correct time relationship.  Dual channel oscilloscopes can only display two waveforms.  Logic analyzers can display many, depending on the make and model.", "One type of format is the TIMING DIAGRAM. Several pulse waveforms are displayed in the correct time relationship. Dual channel oscilloscopes can only display two waveforms. Logic analyzers can display many, depending on the make and model."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["The second type of format is the BIT or BIT PATTERN.  A sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors.  Oscilloscopes and logic probes cannot do this.", "The second type of format is the BIT or BIT PATTERN. A sequence of 1s and 0s from a functional circuit can be compared to the pattern of a faulty circuit to detect errors. Oscilloscopes and logic probes cannot do this."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["Another type of format that may be included on some logic analyzers is the CODED format.  The coded format changes ones and zeros to either octal or hexadecimal code.", "Another type of format that may be included on some logic analyzers is the CODED format. The coded format changes ones and zeros to either octal or hexadecimal code."], "jumps": ["P3020"]}, {"id": "P3060", "text": ["The code for a particular point in a circuit can then be compared to a given code in a technical manual or to code present in a functional circuit.  Any differences between the measured code and the reference code indicate a fault.", "The code for a particular point in a circuit can then be compared to a given code in a technical manual or to code present in a functional circuit. Any differences between the measured code and the reference code indicate a fault."], "jumps": ["P3020"]}, {"id": "P3070", "text": ["Signature Analyzer  \nThe signature analyzer is somewhat like the logic analyzer without the waveform display.  It uses the coded format by measuring pulse trains of highs and lows.", "Signature Analyzer The signature analyzer is somewhat like the logic analyzer without the waveform display. It uses the coded format by measuring pulse trains of highs and lows."], "jumps": ["P3020"]}, {"id": "P3080", "text": ["Signature analyzers are used to locate faults to the component level in microcontroller based systems."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["The instrument converts a series of ones and zeros at a given test point to a hexadecimal code.  The code is called the signature for that particular test point.  Then, by comparing the signature to the known signature, you can identify faults.", "The instrument converts a series of ones and zeros at a given test point to a hexadecimal code. The code is called the signature for that particular test point. Then, by comparing the signature to the known signature, you can identify faults."], "jumps": ["P3070"]}, {"id": "P3100", "text": ["Again, the signature analyzer is only used in very complex circuits where the cost of the instrument can be justified."], "jumps": ["P3070"]}, {"id": "P3110", "text": ["Logic Clip  \nThe logic clip is a simple tool used to determine logic levels on an IC.  The clip attaches to an IC where it makes contact with each pin.  On the logic clip are LED's, lamps, or just pins, each one corresponding to a pin on the IC.", "Logic Clip The logic clip is a simple tool used to determine logic levels on an IC. The clip attaches to an IC where it makes contact with each pin. On the logic clip are LED's, lamps, or just pins, each one corresponding to a pin on the IC. onnection to the IC."], "jumps": ["P3070"]}, {"id": "P3120", "text": ["The LED or lamp illuminates brightly for a high and is off for a low. A pulse signal is identified by a dimly illuminated LED or lamp. Logic clips are of limited value because many digital circuits today are changing states so rapidly the lights appear to be constantly ON even though they are actually turning ON and OFF rapidly."], "jumps": ["P3110"]}, {"id": "P3130", "text": ["Non-Test Instruments  \nWhile test instruments provide vital information on the operation of the microcontroller, there are other tools a technician can use to make their job easier.", "Non-Test Instruments While test instruments provide vital information on the operation of the microcontroller, there are other tools a technician can use to make their job easier."], "jumps": ["P3110"]}, {"id": "P3140", "text": ["Visual Inspection  \nVisual inspections must be performed carefully before, during, and after troubleshooting.  They identify mechanical damage, heat damage, damage from misuse, etc.", "Visual Inspection Visual inspections must be performed carefully before, during, and after troubleshooting. They identify mechanical damage, heat damage, damage from misuse, etc."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["Before you begin measuring circuit values with test instruments, look for damaged components.  A burned resistor is a strong indication of a power supply problem, transistor problems, or some other active component gone bad.", "Before you begin measuring circuit values with test instruments, look for damaged components. A burned resistor is a strong indication of a power supply problem, transistor problems, or some other active component gone bad."], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["After troubleshooting and repair, do another visual inspection to ensure that the repair process did not cause any damage to the system, such as lifted solder runs, ICs or transistors not seated in  their sockets properly, or drops of solder that might cause a short.", "After troubleshooting and repair, do another visual inspection to ensure that the repair process did not cause any damage to the system, such as lifted solder runs, ICs or transistors not seated in their sockets properly, or drops of solder that might cause a short."], "jumps": ["P3170", "P3130"]}, {"id": "P3170", "text": ["Diagnostic Routines \nDiagnostic routines are programs used in the microcontroller to test the system.  These programs are normally supplied by the system manufacturer.  If not, you can program your own diagnostic routines.", "Diagnostic Routines Diagnostic routines are programs used in the microcontroller to test the system. These programs are normally supplied by the system manufacturer. If not, you can program your own diagnostic routines."], "jumps": ["P3180", "P3130"]}, {"id": "P3180", "text": ["A disadvantage of diagnostic programs is that the microcontroller system must operate well enough to load and execute a program.  Further, diagnostic programs are not 100% accurate and can give false readings.  The advantage of diagnostic routines is time saving.", "A disadvantage of diagnostic programs is that the microcontroller system must operate well enough to load and execute a program. Further, diagnostic programs are not 100% accurate and can give false readings. The advantage of diagnostic routines is time saving."], "jumps": ["P3190", "P3130"]}, {"id": "P3190", "text": ["Most diagnostic programs will, at a minimum, identify what section is faulted.  Some diagnostic routines even identify which components are faulted!  No troubleshooting even required.", "Most diagnostic programs will, at a minimum, identify what section is faulted. Some diagnostic routines even identify which components are faulted! No troubleshooting even required."], "jumps": ["P3200", "P3130"]}, {"id": "P3200", "text": ["Now that you have been introduced to the concepts and tools of troubleshooting, let's begin the experiment on troubleshooting the 8051 microcontroller."], "jumps": ["P3210", "P3130", "Pr", "P7"]}, {"id": "P3210", "text": ["A program in the computer which checks to see that all the memory locations of RAM work would be known as a _______"], "jumps": ["P3200"]}, {"id": "P3211", "text": [], "jumps": []}, {"id": "P3212", "text": ["A visual inspection is where you would inspect parts for physical damage.  This program looks inside where you cannot see to determine if it is working properly.", "A visual inspection is where you would inspect parts for physical damage. This program looks inside where you cannot see to determine if it is working properly."], "jumps": []}, {"id": "P3213", "text": ["Most computer systems use a program when the computer starts to test memory.  Memory doesn't go bad that often, but when it does it can totally destroy data being accessed.  To avoid this, the computer scans the memory before you even get a chance to use it.", "Most computer systems use a program when the computer starts to test memory. Memory doesn't go bad that often, but when it does it can totally destroy data being accessed. To avoid this, the computer scans the memory before you even get a chance to use it."], "jumps": []}, {"id": "P4000", "text": ["SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": ["P4001", "P4002", "P4003", "P4004", "P4005"]}, {"id": "P4001", "text": [], "jumps": []}, {"id": "P4002", "text": [], "jumps": []}, {"id": "P4003", "text": [], "jumps": []}, {"id": "P4004", "text": [], "jumps": []}, {"id": "P4005", "text": [], "jumps": []}, {"id": "P5000", "text": ["SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": ["P5001", "P5002", "P5003", "P5004", "P5005"]}, {"id": "P5001", "text": [], "jumps": []}, {"id": "P5002", "text": [], "jumps": []}, {"id": "P5003", "text": [], "jumps": []}, {"id": "P5004", "text": [], "jumps": []}, {"id": "P5005", "text": [], "jumps": []}, {"id": "P6000", "text": ["SELECT A TOUCH AREA TO VIEW MORE DETAIL."], "jumps": ["P6001", "P6002", "P6003", "P6004", "P6005"]}, {"id": "P6001", "text": [], "jumps": []}, {"id": "P6002", "text": [], "jumps": []}, {"id": "P6003", "text": [], "jumps": []}, {"id": "P6004", "text": [], "jumps": []}, {"id": "P6005", "text": [], "jumps": []}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id":
