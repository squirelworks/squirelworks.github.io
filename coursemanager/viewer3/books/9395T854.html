is used to detect waveform abnormalties?"], "jumps": []}, {"id": "P10221", "text": ["When checking Integrated Circuits, which visual problem may be easily spotted?"], "jumps": []}, {"id": "P10222", "text": ["Which of the following devices has to be put into a circuit with the correct polarity?"], "jumps": []}, {"id": "P10223", "text": ["Which of the following techniques would NOT help to reduce damage caused by static electricity?"], "jumps": []}, {"id": "P10224", "text": ["Which of the following quantities cannot be measured on a standard multimeter?"], "jumps": []}, {"id": "P10225", "text": [], "jumps": []}, {"id": "P10226", "text": ["ICs are placed in sockets because _______", "the chip's socket can withstand more heat without being damaged by the soldering process.", "the IC can be easily replaced without desoldering."], "jumps": []}, {"id": "P10227", "text": ["A periodic signal which changes with time is best observed with a(n) _______"], "jumps": []}, {"id": "P10228", "text": ["A non-periodic signal which changes with time is best observed with a(n) _______"], "jumps": []}, {"id": "P10229", "text": ["Which piece of test equipment does not display a waveform, but a coded representation of a suspect signal, which is then compared to a known good code? used to compare to known good codes?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is 20%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13040", "text": ["In this experiment, you will get hands on experience troubleshooting a microcontroller system.  You will perform two fault scenarios where you will be required to determine the fault with the assistance of  this lesson.", "In this experiment, you will get hands on experience troubleshooting a microcontroller system. You will perform two fault scenarios where you will be required to determine the fault with the assistance of this lesson."], "jumps": ["P13050", "P2001", "Pr", "P7"]}, {"id": "P13050", "text": ["In each case you will check the system to detect any problems.  If a fault is discovered, certain steps will be performed to isolate the fault to a particular region of the microcontroller system.", "In each case you will check the system to detect any problems. If a fault is discovered, certain steps will be performed to isolate the fault to a particular region of the microcontroller system."], "jumps": ["P13060", "P13040"]}, {"id": "P13060", "text": ["Let's begin the experiment.", "Let's begin the experiment.e..............................."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13060"]}, {"id": "P13080", "text": ["2. Insert the following 130 experiment cards on the test console. a. Insert PC130-405 51 Family Microcontroller card in the PC1 position. b. Insert PC130-406 Keyboard and Display card in the PC2 position. c. Insert PC130-407 Microcontroller I/O and Interface card in the PC3 position."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["3. Connect the three experiment cards with the flat ribbon cables as follows: a. Using the first 34 pin ribbon cable, connect PC130-405 J1 to PC130-406 J1. b. Using the second 34 pin ribbon cable, connect PC130-406 J2 to PC130- 407 J1."], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["4.  Press enter to set: Positive Supply Voltage - 15\n                                         Negative Supply Voltage - 15", "4. Press enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 1555555lts. 5 Volts."], "jumps": ["P13090"]}, {"id": "P13110", "text": ["5.  Press enter to set: PC3 DC Power Switch - ON", "5. Press enter to set: PC3 DC Power Switch - ON.........................."], "jumps": []}, {"id": "P13120", "text": ["6.  Press enter to set: PC2 DC Power Switch - ON", "6. Press enter to set: PC2 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13130", "text": ["7.  Press enter to set: PC1 DC Power Switch - ON", "7. Press enter to set: PC1 DC Power Switch - ON..........................."], "jumps": []}, {"id": "P13140", "text": ["8. The microcontroller system is now assembled and operating. You should see the message \"NIDA_51:\" in the LCD display on the PC130-406 card. If the message is dim or blank, try adjusting the Display Intensity potentiometer R4 on the PC130-406 card using a small screw driver. If you still cannot see the message, see your instructor for assistance.", "If, at any time during the experiment, you short some of the IC pins together while observing the signals, press the reset button. Then verify that the program you were running is still in memory. If not, you must reenter the program and then run it again before proceeding with your measurements. Before trying to measure a signal from the actual IC pin, look at the test point banks on the PC card. n run the program before proceeding with your measurements.....nts."], "jumps": ["P13145"]}, {"id": "P13145", "text": ["At any time during the remainder of the lesson you may press Ctrl S to view the schematic diagram of 8051 family microcontroller."], "jumps": ["P13150", "P13140"]}, {"id": "P13150", "text": ["The microcontroller setup is complete.  Now the computer will insert a fault.  Let's see if we can find where this fault is affecting the system.", "9.  On the keyboard of the 8051 microcontroller system, enter 0          and then 1.", "The microcontroller setup is complete. Now the computer will insert a fault. Let's see if we can find where this fault is affecting the system.", "9. On the keyboard of the 8051 microcontroller system, enter 0 and then 1......", "XXXX XXXX YYYK EKCK +1111111111111"], "jumps": ["P13145", "P13180"]}, {"id": "P13180", "text": ["Nothing is happening, not even your keystroke is being displayed on the screen of the 8051 LCD display.  The display of the LCD has characters on it, this indicates that power is being applied to the system.", "Nothing is happening, not even your keystroke is being displayed on the screen of the 8051 LCD display. The display of the LCD has characters on it, this indicates that power is being applied to the system."], "jumps": ["P13190", "P13170"]}, {"id": "P13190", "text": ["If you are uncertain if power is being applied properly, use your oscilloscope to see if the power at the appropriate test points is correct."], "jumps": ["P13170", "P13200"]}, {"id": "P13200", "text": ["The system is not operational, so we need to look at the control signals of the microcontroller and the different locations where they can be observed."], "jumps": ["P13170", "P13210"]}, {"id": "P13210", "text": ["Since we have no knowledge of what the microcontroller is doing, we really have no knowledge of what the signal should look like.  However, we can see if a signal is getting to a correct location.  Let's start with the PSEN signal.", "10.  Connect CH1 of the oscilloscope to the PSEN test point on             PC130-405.  Adjust your Time/Division setting for a square              wave.", "Since we have no knowledge of what the microcontroller is doing, we really have no knowledge of what the signal should look like. However, we can see if a signal is getting to a correct location. Let's start with the PSEN signal.", "10. Connect CH1 of the oscilloscope to the PSEN test point on PC130-405. Adjust your Time/Division setting for a square wave."], "jumps": ["P13220", "P13170", "P13230", "P13210"]}, {"id": "P13230", "text": ["At this point we have a signal that we can look for at other locations.  If this signal is not seen where the PSEN signal is applied, then we know that some sort of open circuit exists.", "At this point we have a signal that we can look for at other locations. If this signal is not seen where the PSEN signal is applied, then we know that some sort of open circuit exists."], "jumps": ["P13240", "P13220"]}, {"id": "P13240", "text": ["Likewise, if we are measuring signals elsewhere and this signal is seen, this could possibly indicate some sort of shorted circuitry."], "jumps": ["P13220", "P13250"]}, {"id": "P13250", "text": ["11.  With CH2 of the oscilloscope, determine if the PSEN signal is         at these locations on the PC130-405 card:\n        * Pin 1 of U7 (Quad NAND Gate).\n        * Pin 22 of U3 (EPROM 32 k).", "11. With CH2 of the oscilloscope, determine if the PSEN signal is at these locations on the PC130-405 card: * Pin 1 of U7 (Quad NAND Gate). * Pin 22 of U3 (EPROM 32 k)."], "jumps": ["P13220", "P13260"]}, {"id": "P13260", "text": ["We can see that this signal is making it to all the locations it is routed to on the circuit card.  The next step is to check another control signal, the WR pin.", "We can see that this signal is making it to all the locations it is routed to on the circuit card. The next step is to check another control signal, the WR pin."], "jumps": ["P13220", "P13270"]}, {"id": "P13270", "text": ["12.  Connect CH1 of the oscilloscope to the WR test point                       on PC130-405.  Adjust your Time/Division setting until sharp          negative pulses are seen.", "12. Connect CH1 of the oscilloscope to the WR test point on PC130-405. Adjust your Time/Division setting until sharp negative pulses are seen."], "jumps": ["P13220", "P13280"]}, {"id": "P13280", "text": ["Again, you are fortunate that the system works in a capacity such that a signal can be observed on this pin.", "13.  With CH2 of the oscilloscope, determine if the WR signal is at         these locations:\n        * PC130-405 Pin 27 of U4 (RAM 32 k).\n        * PC130-406 Pin 5 of the LCD Module (Pin 1 is the left most                pin).", "13. With CH2 of the oscilloscope, determine if the WR signal is at these locations: * PC130-405 Pin 27 of U4 (RAM 32 k). * PC130-406 Pin 5 of the LCD Module (Pin 1 is the left most pin).", "XXXX XXXX YYYK EKCK +1111111111111"], "jumps": ["P13220", "P13290", "P13300", "Pin"]}, {"id": "P13300", "text": ["The WR signal should NOT have been observed at pin 5 of the LCD module.  This indicates that there is an open between the signal from the microcontroller and this pin of the LCD display.", "The WR signal should NOT have been observed at pin 5 of the LCD module. This indicates that there is an open between the signal from the microcontroller and this pin of the LCD display."], "jumps": ["P13310", "P13290"]}, {"id": "P13310", "text": ["14.  Observe the LCD display while the computer clears the fault.", "14. Observe the LCD display while the computer clears the fault."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["The WR signal should now be seen at pin 5 of the LCD module. What you have seen is a simplistic example of finding an open circuit.  If a periodic signal had not been present, a logic pulser can be used to inject a signal which can be detected.", "The WR signal should now be seen at pin 5 of the LCD module. What you have seen is a simplistic example of finding an open circuit. If a periodic signal had not been present, a logic pulser can be used to inject a signal which can be detected."], "jumps": ["P13330", "P13310"]}, {"id": "P13330", "text": ["It is important to note that you may have to check many signals before you find the problem.  The problem could have been software only, meaning there is nothing wrong with the hardware.", "It is important to note that you may have to check many signals before you find the problem. The problem could have been software only, meaning there is nothing wrong with the hardware."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["Now that you have seen a fault that completely disables the system, let's see one that partially disables something in the system."], "jumps": ["P13350", "P13330"]}, {"id": "P13350", "text": ["15.  Press RESET on the 8051 Microcontroller system.", "15. Press RESET on the 8051 Microcontroller system........"], "jumps": ["P13360", "P13340"]}, {"id": "P13360", "text": ["Now the computer will insert another fault.", "Now the computer will insert another fault................................."], "jumps": ["P13350"]}, {"id": "P13370", "text": ["16.  Press \"Run\" 4, 0, 0, and 0 on the 8051 keyboard.", "16. Press \"Run\" 4, 0, 0, and 0 on the 8051 keyboard......."], "jumps": ["P13380"]}, {"id": "P13380", "text": ["You should have been able to enter \"Run\" and 4, but the zeros did not register.  Try pressing all the keys and see which ones do not work.  If at anytime you are in a subprogram and want to get out,  just press the reset button on PC130-405 and continue to test keys.", "You should have been able to enter \"Run\" and 4, but the zeros did not register. Try pressing all the keys and see which ones do not work. If at anytime you are in a subprogram and want to get out, just press the reset button on PC130-405 and continue to test keys."], "jumps": ["P13390", "P13370"]}, {"id": "P13390", "text": ["You should have observe that the entire first row was not detected.  Since the problem only affects this row, the problem has something to do with the row connection or associated components.", "You should have observe that the entire first row was not detected. Since the problem only affects this row, the problem has something to do with the row connection or associated components...neeod keys are not being detected. Since nothing is being detected, only on this row, the problem is something with the row connection."], "jumps": ["P13400", "P13380"]}, {"id": "P13400", "text": ["17.  Using CH1 of the oscilloscope observe the signals at Y1                  when you press a row 1 key, Y2 when your press a row 2                key and Y3 when you press a row 3 key.", "17. Using CH1 of the oscilloscope observe the signals at Y1 when you press a row 1 key, Y2 when your press a row 2 key and Y3 when you press a row 3 key."], "jumps": ["P13410", "P13390"]}, {"id": "P13410", "text": ["You should have observed that the Y1 signal is not being generated by the switch matrix.  For proper operation of the keyboard, it is essential that these three signals be correctly applied to the OR gate circuits U3C and U3D.", "You should have observed that the Y1 signal is not being generated by the switch matrix. For proper operation of the keyboard, it is essential that these three signals be correctly applied to the OR gate circuits U3C and U3D.s are being correctly generated by the switch matrix. These three signals are applied to an OR gate circuit and then to the keyboard decoding circuit. Let's see if the signals are making it or not. i"], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["18.  Connect CH1 to the Y1 test point and CH2 to the KP test                  point.  Press keys form the first row and observe the display.         Also check Y2 and KP with row 2 keys and Y3 and KP with             row 3 keys.", "18. Connect CH1 to the Y1 test point and CH2 to the KP test point. Press keys form the first row and observe the display. Also check Y2 and KP with row 2 keys and Y3 and KP with row 3 keys."], "jumps": ["P13430", "P13410"]}, {"id": "P13430", "text": ["The Y and KP signals should have been generated for key presses from row 2 and 3, but not for row 1.  This indicates either a problem with an OR gate or an associated circuit.", "The Y and KP signals should have been generated for key presses from row 2 and 3, but not for row 1. This indicates either a problem with an OR gate or an associated circuit."], "jum let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
