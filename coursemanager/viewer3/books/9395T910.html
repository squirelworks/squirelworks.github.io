ly disclose a great deal of information.", "The important lesson here is to understand the total procedure and the importance of your initial assessment. Whether you are working on a transceiver or some other electronic equipment, performing a complete function check will normally disclose a great deal of information.", "1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "1. The assessment phase 2. The troubleshooting phase * Localization * Isolation 3. The repair phase 4. The re-assessment phaseother Trainer. Lock and channel detect LED's illuminated. 3. The volume control operated properly. 4. Squelch (S1-PC130-446) failed to quiet the Transceiver between transmission."], "jumps": ["P13290", "P13270"]}, {"id": "P13270", "text": ["While not all problems will be as easy to localize and isolate, many will be.", "Ensuring that S1 is in the closed (ON) position we then measure the voltage at pin 7 of U1, the audio amplifier.  The reading there is 2.5 volts.  Since the only component between those two pins is the switch (S1), we can determine that S1 is not operational.", "Incorrect levels on those pins will affect the entire IC.  Looking first at pin 7 of U2B, we measure .01 VDC.  This is the voltage that should be seen at the output when a signal is present.", "In order to analyze the circuit, we can take some DC measurements.  Because the squelch comparator is a part of the same IC as the channel detector, which is functioning, it is not necessary to check Vcc and GND.", "Ensuring that S1 is in the closed (ON) position we then measure the voltage at pin 7 of U1, the audio amplifier. The reading there is 2.5 volts. Since the only component between those two pins is the switch (S1), we can determine that S1 is not operational.", "Incorrect levels on those pins will affect the entire IC. Looking first at pin 7 of U2B, we measure .01 VDC. This is the voltage that should be seen at the output when a signal is present.", "In order to analyze the circuit, we can take some DC measurements. Because the squelch comparator is a part of the same IC as the channel detector, which is functioning, it is not necessary to check Vcc and GND."], "jumps": ["P13280", "P13240", "P13270", "P13260", "P13250", "P13230"]}, {"id": "P13230", "text": ["Having localized the problem down to five or six components, it's time to isolate the one that's bad."], "jumps": ["P13240", "P13210"]}, {"id": "P13220", "text": ["Further, if an output line is shorted to ground, odds are the IC fried in the process.  In either case, the IC will need to be replaced.  Because this is a training exercise, troubleshooting different sections of an IC is a reasonable and even desirable endeavor.", "Further, if an output line is shorted to ground, odds are the IC fried in the process. In either case, the IC will need to be replaced. Because this is a training exercise, troubleshooting different sections of an IC is a reasonable and even desirable endeavor."], "jumps": ["P13230", "P13210"]}, {"id": "P13210", "text": ["If the signal is entering an IC but there is no output, either the output line is shorted to ground or the IC is bad."], "jumps": ["P13220", "P13200"]}, {"id": "P13200", "text": ["In most instances, troubleshooting IC's requires nothing more than comparing outputs against inputs."], "jumps": ["P13210", "P13190"]}, {"id": "P13190", "text": ["In real world practical applications, troubleshooting pins associated with different sections within a single IC may or may not be time and/or money justifiable."], "jumps": ["P13200", "P13160"]}, {"id": "P13180", "text": ["At this point, we have localized the problem to a stage specific area of the PC130-446 card by doing nothing more than being observant and applying a little deductive reasoning.", "Since the channel detect light is working, U2A, R4, and R12 are operational.  That leaves U2B, R5, R6, C7 and the switch S1, suspect.  One other possibility is that pin 7 of U1 (the AF amp) is open.", "Referring to the schematic of the PC130-446 card we can see that there is very little circuitry remaining that hasn't already been ruled out.", "Since the channel detect light is working, U2A, R4, and R12 are operational. That leaves U2B, R5, R6, C7 and the switch S1, suspect. One other possibility is that pin 7 of U1 (the AF amp) is open."], "jumps": ["P13190", "P13160", "P13180", "P13170", "P13150"]}, {"id": "P13150", "text": ["On the assumption that the above determination is true, that leaves the problem located on the PC130-446 card.  During the assessment we were able to get voice from the speaker.  This tells us that the AF amplifier is working.", "On the assumption that the above determination is true, that leaves the problem located on the PC130-446 card. During the assessment we were able to get voice from the speaker. This tells us that the AF amplifier is working."], "jumps": ["P13160", "P13140"]}, {"id": "P13140", "text": ["Based upon the results, you can determine with a reasonable amount of certainty that the Transceiver is fully operational except for the Squelch."], "jumps": ["P13150", "P13130"]}, {"id": "P13130", "text": ["Using the steps described above, these are the symptoms that you have found:", "Before you actually begin troubleshooting a fault it will be advantageous to first troubleshoot the Transceiver using paper. This is the process of troubleshooting a fault without actually touching the Transceiver or any test equipment.  Let's begin.", "Using the steps described above, these are the symptoms that you have found:. Upon power up, the frequency display illuminated. Seek and scan functions operated properly. 2. Communications were established with another Trainer. Lock and channel detect LED's illuminated. 3. The volume control operated properly.", "1 broken radio 2 cups of test equipment 1 cup of recei ell done. well done.", "1. Make voice transmissions back and forth with two active NIDA CB Trainers tuned to the same channel. This will verify both the Transmitter and Receiver sections of both Transceivers. 2. STEP 4 (OPTIONAL). Enter fault F200 on one trainer. The channel display will indicate TX (transmit) and the channel number of whatever frequency you are tuned to. 3. Inject a 1 kHz unmodulated signal at TP1 Audio from the signal generator. PC130-445 on the Trainer designated for transmitting. Modulation of the tone is accomplished on the PC130-445 card. The tone should be clearly heard through the receiving antenna..nna.ng antenna.ntenna. antenna.enna.na..............."], "jumps": []}, {"id": "P13113", "text": ["1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "1. Momentarily depress the seek button. The frequency display should begin incrementing itself sequentially to some channel between 1 and 40. 2. Once an active channel is found, the seek function will halt and the lock and station detector LED's will illuminate. 3. Check the audio by adjusting the volume control on the PC130-446 card, if there is audio you should be able to regulate the sound level.evel.el.el.evel..........."], "jumps": []}, {"id": "P13112", "text": ["1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "1. Depress and hold the scan-up and scan-down buttons on the frequency display. The frequencies will go up and down accordingly..... 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done."], "jumps": []}, {"id": "P13111", "text": ["1 broken radio 2 cups of test equ nd of CB Transceivers."], "jumps": ["P13080", "P13060"]}, {"id": "P13060", "text": ["For example, if the Transceiver is tuned to 27.185 MHz, the output (U3, Pin 7) will be approximately 27.640 MHz.", "1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "27.185 MHz + 455 MHz 27.640 MHzz 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done."], "jumps": ["P13070", "P13050"]}, {"id": "P13050", "text": ["At (U3, Pin 7) on PC130-445 (the output of the oscillator) the frequency will be 455 KHz more than the actual tuned frequency.", "At (U3, Pin 7) on PC130-445 (the output of the oscillator) the frequency will be 455 KHz more than the actual tuned frequency. then divided by a factor of ten by the prescaler. prescaler."], "jumps": ["P13060", "P13040"]}, {"id": "P13040", "text": ["Some frequencies are also provided.  Bare in mind that, other than the clock frequency and the IF, the frequencies elsewhere will be based upon whatever the Receiver is tuned to.", "Some frequencies are also provided. Bare in mind that, other than the clock frequency and the IF, the frequencies elsewhere will be based upon whatever the Receiver is tuned to.", "1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "Clock - 3 MHz IF........ - 455 kHzzz 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done."], "jumps": ["P13050", "P13020"]}, {"id": "P13030", "text": ["It should be remembered that som ment checklist.", "12. Once again, run through the initial assessment checklist."], "jumps": ["P1520", "P1500"]}, {"id": "P1500", "text": ["The computer will now insert a fault into the Transceiver.", "The computer will now insert a fault into the Transceiver.switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1490"]}, {"id": "P1490", "text": ["11.  Using the initial assessment checks, verify proper                              Transceiver operation.", "11. Using the initial assessment checks, verify proper Transceiver operation."], "jumps": ["P1500", "P1480"]}, {"id": "P1480", "text": ["The computer will now remove the fault from the Transceiver.", "The computer will now remove the fault from the Transceiver.itch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1470"]}, {"id": "P1474", "text": ["D1 is a protection for the circuit.", "D1 is a protection for the circuit........................."], "jumps": []}, {"id": "P1473", "text": ["The B-E junction of Q2 would still develop approximately .7 VDC."], "jumps": []}, {"id": "P1472", "text": ["In transmit mode, Q3 is turned off.", "In transmit mode, Q3 is turned off........................."], "jumps": []}, {"id": "P1471", "text": [], "jumps": []}, {"id": "P1470", "text": ["Now that the stage has been established, isolate the problem to a component.  Which component is failing?", "Now that the stage has been established, isolate the problem to a component. Which component is failing?"], "jumps": ["P1460"]}, {"id": "P1464", "text": ["Look at the channel display.", "Look at the channel display................................"], "jumps": []}, {"id": "P1463", "text": ["Initial assessment should have verified proper channel.", "Initial assessment should have verified proper channel....."], "jumps": []}, {"id": "P1462", "text": ["Turn up the volume.", "Turn u  Console PC1, PC2, PC3 DC power and         Speaker to ON.", "7. Set the Transmitter Test Console PC1, PC2, PC3 DC power and Speaker to ON. 8. Set the Receiver Test Console PC1, PC2, PC3 DC power and Speaker to ON."], "jumps": ["P1385"]}, {"id": "P1385", "text": ["5.  Set the Positive Supply Control to 12.  The Voltmeter on the           Transmitter should indicate 12 Volts.\n6.  Set the Positive Supply Control to 12.  The Voltmeter on the           Receiver should indicate 12 Volts.", "5. Set the Positive Supply Control to 12. The Voltmeter on the Transmitter should indicate 12 Volts. 6. Set the Positive Supply Control to 12. The Voltmeter on the Receiver should indicate 12 Volts."], "jumps": ["P1380"]}, {"id": "P1380", "text": ["3.  Insert the PC cards into the following positions as shown               below.\n4.  Connect an alligator to alligator cable to TP4 of both\n     PC130-445 cards.", "3. Insert the PC cards into the following positions as shown below. 4. Connect an alligator to alligator cable to TP4 of both PC130-445 cards.", "1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "Transmitter Console Receiver Console PC130-444 PC1 position PC130-444 PC1 position PC130-445 PC2 position PC130-445 PC2 position PC130-446 PC3 position PC130-446 PC3 positionnnnnntrol operated properly. 4. Squelch (S1-PC130-446) failed to quiet the Transceiver between transmission."], "jumps": ["P1385", "P1360"]}, {"id": "P1360", "text": ["2.  Apply power to your oscilloscope and function generator.              Test equipment should be allowed to warm up prior to using it      for taking measurements.", "2. Apply power to your oscilloscope and function generator. Test equipment should be allowed to warm up prior to using it for taking measurements."], "jumps": ["P1380", "P1350"]}, {"id": "P1350", "text": ["During the experiment, the computer will insert four faults into the Transceiver.  All four faults will be sent to the trainer committed as the \"transmitter\".  These faults will affect both receiving and transmitting functions within the Transceiver.", "During the experiment, the computer will insert four faults into the Transceiver. All four faults will be sent to the trainer committed as the \"transmitter\". These faults will affect both receiving and transmitting functions within the Transceiver."], "jumps": ["P1360", "P1300"]}, {"id": "P1300", "text": ["1.  Setup the Transmitter an Receiver Test Consoles for dual               interface.", "As your familiarity with specific equipment increases, so too, will the speed with which you are able to accurately troubleshoot and repair the fault.", "1. Setup the Transmitter an Receiver Test Consoles for dual interface. uter. The other Trainer will be used as a Receiver and will be identified as Test Console 2."], "jumps": ["P1290", "P1300", "P1280"]}, {"id": "P1280", "text": ["The important lesson here is to understand the total procedure and the importance of your initial assessment.  Whether you are working on a transceiver or some other electronic equipment, performing a complete function check will normally disclose a great deal of information.", "The important lesson here is to understand the total procedure and the importance of your initial assessment. Whether you are working on a transceiver or some other electronic equipment, performing a complete function check will normally disclose a great deal of information.", "1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "1. The assessment phase 2. The troubleshooting phase * Localization * Isolation 3. The repair phase 4. The re-assessment phaseother Trainer. Lock and channel detect LED's illuminated. 3. The volume control operated properly. 4. Squelch (S1-PC130-446) failed to quiet the Transceiver between transmission."], "jumps": ["P1290", "P1270"]}, {"id": "P1270", "text": ["While not all problems will be as easy to localize and isolate, many will be.", "Ensuring that S1 is in the closed (ON) position we then measure the voltage at pin 7 of U1, the audio amplifier.  The reading there is 2.5 volts.  Since the only component between those two pins is the switch (S1), we can determine that S1 is not operational.", "Incorrect levels on those pins will affect the entire IC.  Looking first at pin 7 of U2B, we measure .01 VDC.  This is the voltage that should be seen at the output when a signal is present.", "In order to analyze the circuit, we can take some DC measurements.  Because the squelch comparator is a part of the same IC as the channel detector, which is functioning, it is not necessary to check Vcc and GND.", "Ensuring that S1 is in the closed (ON) position we then measure the voltage at pin 7 of U1, the audio amplifier. The reading there is 2.5 volts. Since the only component between those two pins is the switch (S1), we can determine that S1 is not operational.", "Incorrect levels on those pins will affect the entire IC. Looking first at pin 7 of U2B, we measure .01 VDC. This is the voltage that should be seen at the output when a signal is present.", "In order to analyze the circuit, we can take some DC measurements. Because the squelch comparator is a part of the same IC as the channel detector, which is functioning, it is not necessary to check Vcc and GND."], "jumps": ["P1280", "P1240", "P1270", "P1260", "P1250", "P1230"]}, {"id": "P1230", "text": ["Having localized the problem down to five, possibly six, components, it's time to isolate the one that's bad."], "jumps": ["P1240", "P1210"]}, {"id": "P1220", "text": ["Further, if an output line is shorted to ground, odds are the IC fried in the process.  In either case, the IC will need to be replaced.  Because this is a training exercise, troubleshooting different sections of an IC is a reasonable and even desirable endeavor.", "Further, if an output line is shorted to ground, odds are the IC fried in the process. In either case, the IC will need to be replaced. Because this is a training exercise, troubleshooting different sections of an IC is a reasonable and even desirable endeavor."], "jumps": ["P1230", "P1210"]}, {"id": "P1210", "text": ["If the signal is entering an IC but there is no output, either the output line is shorted to ground or the IC is bad."], "jumps": ["P1220", "P1200"]}, {"id": "P1200", "text": ["In most instances, troubleshooting IC's requires nothing more than comparing outputs against inputs."], "jumps": ["P1210", "P1190"]}, {"id": "P1190", "text": ["In real world practical applications, troubleshooting pins associated with different sections within a single IC may or may not be time and/or money justifiable.", "At this point, we have localized the problem to a stage specific area of the PC130-446 card by doing nothing more than being observant and applying a little deductive reasoning.", "Since the channel detect light is working, U2A, R4, and R12 are operational.  That leaves U2B, R5, R6, C7 and the switch S1, suspect.  One other possibility is that pin 7 of U1 (the AF amp) is open.", "Referring to the schematic of the PC130-446 card we can see that  there is very little circuitry remaining that hasn't already been ruled out.", "Since the channel detect light is working, U2A, R4, and R12 are operational. That leaves U2B, R5, R6, C7 and the switch S1, suspect. One other possibility is that pin 7 of U1 (the AF amp) is open.", "Referring to the schematic of the PC130-446 card we can see that there is very little circuitry remaining that hasn't already been ruled out."], "jumps": ["P1200", "P1160", "P1190", "P1170", "P1180", "P1150"]}, {"id": "P1150", "text": ["On the assumption that the above determination is true, that leaves the problem located on the PC130-446 card.  During the assessment we were able to get voice from the speaker.  This tells us that the AF amplifier is working.", "On the assumption that the above determination is true, that leaves the problem located on the PC130-446 card. During the assessment we were able to get voice from the speaker. This tells us that the AF amplifier is working."], "jumps": ["P1160", "P1140"]}, {"id": "P1140", "text": ["Based upon the results, you can determine with a reasonable amount of certainty that the Transceiver is fully operational except for the Squelch."], "jumps": ["P1150", "P1130"]}, {"id": "P1130", "text": ["Using the steps described above, these are the symptoms that you have found:", "Before you actually begin troubleshooting a fault it will be advantageous to first troubleshoot the Transceiver using paper. This is the process of troubleshooting a fault without actually touching the Transceiver or any test equipment.  Let's begin.", "Using the steps described above, these are the symptoms that you have found:::::Upon power up, the frequency display illuminated. Seek and scan functions operated properly. 2. Communications were established with another Trainer. Lock and channel detect LED's illuminated. 3. The volume control operated properly.", "1 broken radio 2 cups of test equipment 1 cup of receiver theory 3 tbsps of common sense 1/4 cup of intuition Mix ingredients together and spend a lot of time practicing. Continue practicing until well done. well done.", "1. Upon power up, the frequency display illuminated. Seek and scan functions operated properly. 2. Communications were established with another Trainer. Lock and channel detect LED's illuminated. 3. The volume control operated properly. 4. Squelch (S1-PC130-446) failed to quiet the Transceiver between transmission.", "Before you actually begin troubleshooting a fault it will be advantageous to first troubleshoot the Transceiver using paper. This is the process of troubleshooting a fa let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
