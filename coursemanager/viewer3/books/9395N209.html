const book = {"title": "9395N209", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: BIT SHIFT, FIFO AND LIFO INSTRUCTIONSf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of bit shift, FIFO, and LIFO instructions. w Describe the operation of bit shift, FIFO, and LIFO instructions.", "1. Bit Shift, FIFO and LIFO Instructions", "w Demonstrate the usage of bit shift instructions using Allen Bradely APS software........", "w Demonstrate the usage of bit shift instructions using Rockwell RSLOGIX software.........."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, we are going to look at the bit shift, FIFO, and LIFO instructions used by a PLC."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["By using these instructions, you can alter data files in different ways. You can also access the data in different ways, depending on the instructions that you use."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program that will demonstrate the operation of the bit shift instructions. The PLC Trainer you are using does not support the FIFO and LIFO instructions..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on BIT SHIFT, FIFO AND LIFO INSTRUCTIONS............."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["In this lesson, we will look at the bit shift, FIFO, and LIFO instructions. As you will see, these instructions have many operational similarities.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Bit Shift FIFO LIFO ON ONNeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["Bit shift instructions, as the name implies, are used to shift bit values in one of two directions. The FIFO and LIFO instructions are used to shift words."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The table below shows all of the instructions that we will examine in this lesson. Each of the three instruction types include two instructions, which gives us a total of six instructions...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "BSR - Bit Shift Right BSL - Bit Shift Left FFL - FIFO Load FFU - LIFO Unload LFL - LIFO Load LFU - LIFO Unload"], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Let's start by examining the bit shift instructions. Before looking at the actual instructions, it is important to understand what functionality a bit shift instruction provides.", "BSR - Bit Shift Right BSL - Bit Shift Left FFL - FIFO Load FFU - LIFO Unload LFL - LIFO Load LFU - LIFO Unload", "Bit shifting allows you to shift bits in words either left or right. This means that a new bit will be placed on one side and one bit will be effectively pushed out the other side. The sides depend on which direction bit shift you use......"], "jumps": ["P1080", "P1060", "P1090"]}, {"id": "P1090", "text": ["One application for bit shifts is to send a certain sequence of bits into a single bit that corresponds to an output. This way, you can have a pattern for that output to follow based on each bit as it's shifted into the particular bit position...", "In the example below, you can see how the output of the light corresponds to the bits that are shifted into the word containing that output. Notice the other bits are affected in the output word since their values are also being shifted......................."], "jumps": ["P1100", "P1080", "P1110"]}, {"id": "P1110", "text": ["In our example, we have shifted in zeros, but this is not always the case. You can shift other data into the data file you are modifying. This will become clear as you learn about the actual instructions used by the PLC..."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["This is the Bit Shift Left (BSL) instruction. This instruction requires four parameters: a file, control, bit address, and length. The file is the data file which contains the bits that you want to shift..."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The control is a data file used by the instruction to keep track of the current status and result of the Bit Shift Left instruction. This data element contains three words which contain various status bits...", "WORD 15 13 11 1000", "0 EN DN ER UL NOT USED", "1 SIZE OF BIT ARRAYY ER UL NOT USED", "EN - ENABLE DN - DONE ER - ERASE UL - UNLOAD"], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["The enable bit indicates that the logic preceding this function had a true path and a bit shift is going to be performed. The done bit indicates that a shift has been successfully made."], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["The error bit indicates an error has occurred because of the parameters set in the instruction. Normally, this means that a negative value was entered for the length parameter, which is not valid..."], "jumps": ["P1160", "P1120"]}, {"id": "P1160", "text": ["The unload bit contains the bit that was shifted out of the file once the instruction was evaluated. This bit can be accessed with the bit functions to determine results or conditions of the instruction. No other instruction should modify this control file..."], "jumps": ["P1170", "P1120"]}, {"id": "P1170", "text": ["The next parameter is the bit address, which points to the location of a bit in memory that will be shifted into the right side of the file data. As the parameter implies, you must specify an address..."], "jumps": ["P1180", "P1120"]}, {"id": "P1180", "text": ["The last parameter is the length. The length specifies how many bits are being used in the file data. It is important for the instruction to know what the last bit is, so it can be shifted out and into the unload bit of the control file..."], "jumps": ["P1190", "P1120"]}, {"id": "P1190", "text": ["It is important to note if the length you specify only uses part of the last word that some of the bits are in, all other unused bits will be ignored by the instruction. The importance of remembering this cannot be stressed enough..."], "jumps": ["P1200", "P1120"]}, {"id": "P1200", "text": ["The maximum allowable size is 2048 bits. Be careful, however, that you do not specify too many bits. Exceeding 2048 bits will cause an error."], "jumps": ["P1210", "P1120"]}, {"id": "P1210", "text": ["Here is an example of the instruction. Notice that following the false to true logic condition in the rung, the bit shift left occurs and the last value is placed into the control file."], "jumps": ["P1220", "P1120"]}, {"id": "P1220", "text": ["The Bit Shift Right (BSR) instruction requires the same parameters as the Bit Shift Left instruction. The difference is that all bits are shifted right instead of left.", "WORD 15 13 11 1000", "0 EN DN ER UL NOT USED", "1 SIZE OF BIT ARRAYY ER UL NOT USED", "EN - ENABLE DN - DONE ER - ERASE UL - UNLOAD"], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["For this reason, the rightmost bit is loaded into the unload bit of the control file and the new bit (pointed to by the bit address) is loaded into the left side."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["A neat little trick is wrapping around the bits so it shifts the last bit into the first bit location. To do this, you place the bit address to be unload bit. This is useful when you want to shift the same values in a continuous loop..."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["How many parameters do the BSL and BSR instructions require?"], "jumps": ["P1220"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["Remember, these instructions require four parameters: a file, control, bit address, and length."], "jumps": []}, {"id": "P1260", "text": ["The next instructions that we will examine are the FIFO (First In, First Out) instructions. These instructions involve storage of data in memory. The method of storage is comparable to a queue...", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "BSR - Bit Shift Right BSL - Bit Shift Left FFL - FIFO Load FFU - LIFO Unload LFL - LIFO Load LFU - LIFO Unload"], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["There are two instructions used for this operation. The name \"First In, First Out\" refers to how words are entered and removed from the stack. A stack, as its name implies, is a stack of data words in memory that is used to store temporary data, like a scratch pad..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["This is the FIFO Load (FFL) instruction, which is used to take a word value and place it into the stack for your later use. The five parameters required by the FIFO Load instruction are shown below..."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["The source is the word location or actual value that you want to place onto the stack. The FIFO is the stack data file in memory. You can have multiple stacks depending on their size."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The control file data tracks information regarding the results of using the FIFO Load instruction. This file contains four status bits, the length, and the current position.", "WORD 15 14 13 1200", "0 EN EU DN EM", "1 LENGTHYYYYYYYYYYYY ER UL NOT USED", "EM - EMPTY BIT EU - FFU ENABLE DN - DONE BIT EN - FFL ENABLED"], "jumps": ["P1310", "P1280"]}, {"id": "P1310", "text": ["The empty bit is high when the stack is empty. The done bit is set after either a FIFO Load or Unload has been performed. Note that the instruction pairs, FIFO Load and FIFO Unload, use the same control file, since they are accessing the same data..."], "jumps": ["P1320", "P1280"]}, {"id": "P1320", "text": ["The FFU and FFL enable bits are set high when those instructions have a false to true logic path transition before them in their respective rung."], "jumps": ["P1330", "P1280"]}, {"id": "P1330", "text": ["The length is the size of the stack. The maximum allowable value is 128. The position is the next available location where words can be entered. This value will be automatically modified by the instruction after it is evaluated..."], "jumps": ["P1340", "P1280"]}, {"id": "P1340", "text": ["When you execute this instruction, the new value is placed into the stack and the position counter is incremented so the new value is not overwritten."], "jumps": ["P1350", "P1280"]}, {"id": "P1350", "text": ["This instruction is the FIFO Unload (FFU) instruction, which requires almost all the same parameters as the FFL instruction. The difference is that a destination word location in memory must be specified to store the value being removed from the stack...", "WORD 15 14 13 122200", "0 EN EU DN EM", "1 LENGTHHHYYYYYYYYYYYY ER UL NOT USED", "EM - EMPTY BIT EU - FFU ENABLE DN - DONE BIT EN - FFL ENABLED"], "jumps": ["P1360", "P1280"]}, {"id": "P1360", "text": ["Remember, with FIFO operation, the oldest value on the stack, or first in line, is removed first. This is like having tennis balls in a pipe where you add at one end and remove from the other.", "WORD 15 14 13 122200", "0 EN EU DN EM", "1 LENGTHHHYYYYYYYYYYYY ER UL NOT USED", "EM - EMPTY BIT EU - FFU ENABLE DN - DONE BIT EN - FFL ENABLED"], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Remember, the position values of both FFU and FFL are modified by the instructions. Both instructions, if accessing the same stack, use the same control file data and length."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["The last instructions we will examine are the LIFO (Last In, First Out) instructions. The principle of operation is the same as the FIFO instruction, just reversed.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "BSR - Bit Shift Right BSL - Bit Shift Left FFL - FIFO Load FFU - LIFO Unload LFL - LIFO Load LFU - LIFO Unload"], "jumps": ["P1390", "P1350"]}, {"id": "P1390", "text": ["Imagine that the words are tennis balls entering a tennis ball can. Once you've placed the balls into the can, you have to remove the last ones you put in before you can get the first ball out.."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["This means the last ball (word) placed into the can (stack) is the first to be removed. This is how most stacks in microprocessors work. The only disadvantage of this stack is that you have to remove everything above a particular word to get to that word..."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["This is the LIFO Load (LFL) instruction. This instruction requires the same parameters as the FIFO instruction, but FIFO is replaced with LIFO. Notice the LIFO instruction also uses a control file...", "WORD 15 14 13 1200", "0 EN EU DN EM", "1 LENGTHYYYYYYYYYYYY ER UL NOT USED", "EM - EMPTY BIT EU - FFU ENABLE DN - DONE BIT EN - FFL ENABLED"], "jumps": ["P1420", "P1390"]}, {"id": "P1420", "text": ["This is the LIFO Unload (LFU) instruction. Again, this instruction requires the same type of parameters as the FIFO Unload instruction. Remember, however, that the value being removed is the last one that was placed on the stack...", "WORD 15 14 13 1200", "0 EN EU DN EM", "1 LENGTHYYYYYYYYYYYY ER UL NOT USED", "EM - EMPTY BIT EU - FFU ENABLE DN - DONE BIT EN - FFL ENABLED"], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["The FIFO Load and FIFO Unload instructions require two separate control file data elements if they are accessing the same stack."], "jumps": ["P1420"]}, {"id": "P1431", "text": [], "jumps": []}, {"id": "P1432", "text": ["Remember:::th instructions are using the same stack, they must use the same control file. This file contains the length of the stack and the current position in the stack. If you used two separate control files, neither one would see the changes made by loading or unloading, and the values from the stack would be incorrect..correct...", "If both instructions are using the same stack, they must use the same control file. This file contains the length of the stack and the current position in the stack. If you used two separate control files, neither one would see the changes made by loading or unloading, and the values from the stack would be incorrect..."], "jumps": []}, {"id": "P1440", "text": ["As you can see, these instructions provide a way for shifting data into and out of locations in memory. In the experiment, you will get to see the operation of the bit shift instruction.", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "BSR - Bit Shift Right BSL - Bit Shift Left FFL - FIFO Load FFU - LIFO Unload LFL - LIFO Load LFU - LIFO Unload"], "jumps": ["P1910", "P1430"]}, {"id": "P1910", "text": ["This completes the information on BIT SHIFT, FIFO, AND LIFO INSTRUCTIONS."], "jumps": ["P1001", "P1440"]}, {"id": "P1920", "text": ["1. The Bit Shift Left instruction is used to shift the bits in a data file in the left direction. The bit shifted out is stored in a status bit of the control file and the bit shifted in is pointed to by the bit address parameter of the instruction.", "WORD 15 13 11 1000", "0 EN DN ER UL NOT USED", "1 SIZE OF BIT ARRAYY ER UL NOT USED", "EN - ENABLE DN - DONE ER - ERASE UL - UNLOAD"], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Bit Shift Right is used to right-shift the bits in a data file. The bit shifted out is stored in a status bit of the control file and the bit shifted in is pointed to by the bit address parameter of the instruction....", "WORD 15 13 11 1000", "0 EN DN ER UL NOT USED", "1 SIZE OF BIT ARRAYY ER UL NOT USED", "EN - ENABLE DN - DONE ER - ERASE UL - UNLOAD"], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The FIFO instructions, FIFO Load and FIFO Unload, are used to load and unload words from a stack using the First In, First Out method. This method is similar to loading tennis balls into a pipe at one end and taking them out of the other end when necessary.", "WORD 15 14 13 12222200", "0 EN EU DN EM", "1 LENGTHHHHHYYYYYYYYYYYY ER UL NOT USED"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The LIFO instructions, LIFO Load and LIFO Unload, are used to load and unload words from a stack using the Last In, First Out method. This method is similar to loading tennis balls into a can and then removing them...", "WORD 15 14 13 12222200", "0 EN EU DN EM", "1 LENGTHHHHHYYYYYYYYYYYY ER UL NOT USED"], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, we will program the PLC Trainer to use the bit shift instructions that you learned earlier in this lesson."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You must create a new processor program and make the appropriate configurations as you did in the lesson on bit instructions before actually beginning the ladder logic programming...", "1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software.", "+\".S///'Q'QW(1/$R/'/,6SQQeeQaVQjRd/(QueQddQ/&R6RS/QR'QQ/&&-R/'//'/(QRQ'Sd/VRQ8aQQSQRj9QR/8SdQd8'6\"&/'\"/&''VQ'RSdaQkdeRaR/jdQ'Qa/'dmerd+R1dehjeeQdgredSdQVeedgRQhhfemjdearggdeddQ8=ldrvgjdaVemaedlebRhukgneaVagkhkefRR9l9lkljerkasrl/hjRljeQedd1dQZeVVaSaRRd6Q1Ie(RdR&,/,&.6RQ'R&\"'dd,Q.&Q/./'//Q6S.(daQ1SQRQRhd(/./a(/.RddaRVeQS1(QQ/'/Q/QQ(/djdS/IQ/QQQddQe10''Q$ddQQ',1/''QQ8/(aVQ(RQQQjg.VRd(Vd(/'(aQQd1mhrVIRldQdRraaRQeeerhaqeeaQerhRVmRefRRR8dehaYbmeerkdhehaheemQ/eredammredhheaaeefQd91RRftdbmRrrW1ReRQQR/RaYkgRddmdjRamQ(/8SdVVQeQa('/Q 'a/QRVV//#/Q"], "jumps": ["P2060", "P2040", "P2070", "PQ", "P", "P11HQeVQd1We8ddRQQRearhQRdeaVbfhhdddf", "P1"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD\\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter.........."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE ]. Enter a file name and press enter. You must use a filename that does not already exist and one ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select th I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'T_C_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ].", "1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE FILE ]. Enter a file name and press enter. You must use a filename that does not already exist and only ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select the I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'S_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To begin editing, press F10 [ EDIT ].", "Follow these steps to set up the APS software for ladder logic program entry and evaluation:"], "jumps": []}, {"id": "P2100", "text": ["The program shown below is the ladder logic program you will enter to demonstrate the bit shift instructions.", "File : #O: 0.0", "File : #O : 0.0"], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before entering the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["On the 5050-1 PC card there are three switches that we will be using for this program: two push button switches and a slide switch."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["The slide switch, which is connected to input I:0/2, is used to set only bit 0 of the output data file to high and the rest to zero. This occurs when the switch is in the right position. We do this whenever we want it initialize the output. to this value.."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["When the slide switch is in the left position, the contents of the output data file are not modified by the move instruction."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["By pressing the START button, we create a false to true logic path for the Bit Shift Right instruction. This instruction has a length of 8, corresponding to the LEDs. Notice that the bit we shift in is the bit we will shift out..."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["If the STOP button is pressed, we create a false to true logic path for the Bit Shift Left instruction. This now shifts the bits in the other direction. Also, the bit being shifted out (bit 7) is shifted back in....."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["When the slide switch is in the left position, the START and STOP buttons shift the output data left right. All values that were shifted out are returned to the other end, making a loop.", "File : #O: 0.0", "File : #O : 0.0"], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["The operation of these instructions is very straightforward. We have implemented them into our short program to observe their performance."], "jumps": ["P2200", "P2170"]}, {"id": "P2200", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P2210", "P2170"]}, {"id": "P2210", "text": ["Each rung will be presented in order for you to type into the APS software. If you have trouble, a help button will give you a list of steps for entering the instruction. Try to do as much as possible on your own..."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["4. Enter Rung 1 shown below..............................."], "jumps": ["P2230", "P2200", "P2225"]}, {"id": "P2225", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/2. 3. Select MOVE/LOGICAL, MOV and enter 1 and O:0.0. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2230", "text": ["5. Enter Rung 2 shown below...............................", "File : #O : 0.0"], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/0. 3. Select SHIFT/SEQNCER, BSR and enter #O:0.0, R6:1, O:0.0 and 8. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2240", "text": ["6. Enter Rung 3 shown below...............................", "File : #O : 0.0"], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2245", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/1. 3. Select SHIFT/SEQNCER, BSL and enter #O:0.0, R6:2, O:0/7 and 8. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2250", "text": ["Now that we have finished entering the program, we need to load it into the PLC and test it. Ensure the last rung of the program has been accepted."], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["7. Set the PLC Trainer to the initial control settings....", "OV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "Main Power DC Power Monitor Process Selector + DC Voltage Select PC1 & PC2 Power"], "jumps": ["P2250"]}, {"id": "P2265", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2270", "text": ["8. Place the PC5050-1 card in the PC1 position............"], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["9. Set the PLC Trainer controls as follows:...............", "MOV - Move MVM - Masked Move 3. Use Test Features 2. Use The Programming Device 4. Consult Flow Charts", "+DC Voltage Select 24V PC1 Power ONNeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"], "jumps": ["P2270", "P2285"]}, {"id": "P2285", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2320", "text": ["The trainer is now set up and ready for the program. Let's send our program to the trainer."], "jumps": ["P2330", "P2280"]}, {"id": "P2330", "text": ["10. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["11. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["The program you have entered is now running. Set the slide switch to the right and then back to the left. Now press the START and STOP buttons several times, observing the output of the LEDs...", "File : #O: 0.0", "File : #O : 0.0"], "jumps": []}, {"id": "P2360", "text": ["You should see the bit value shifting up, which corresponds to right shift, and down, which corresponds to left shift. Also, when a bit exits either end, it re-enters at the opposite end."], "jumps": ["P2370", "P2350"]}, {"id": "P2370", "text": ["This completes the demonstration of the bit shift instructions. Try creating your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it  section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window...the main window and should see the \"end\" ladder in the ladder window.................................................", "1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PL Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. , AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save th let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
