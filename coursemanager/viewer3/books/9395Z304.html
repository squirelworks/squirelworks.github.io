ncy of temperature needed."], "jumps": ["P13560", "P13540", "P13550", "P13530"]}, {"id": "P13530", "text": ["If the valve changed position as soon as the temperature wasn't at the desired value, it would be constantly opening and closing."], "jumps": ["P13540", "P13520"]}, {"id": "P13540", "text": ["A deadband allows for a range so an average temperature is maintained. The size of the deadband is normally determined by the consistency of temperature needed.", "2. Connect the multimeter to TP1 and GND. You should see our desired temperature voltage, approximately 3 volts. At this point, we can see that the input to our thermostat circuit is correct."], "jumps": ["P13550", "P13530"]}, {"id": "P13500", "text": ["1. Connect the multimeter set for DC to TP2 and GND on PC130-732. You may need to wait until the system has cooled from when it was in proper operation. The voltage should be correct (or within 10%)."], "jumps": ["P13510", "P13490"]}, {"id": "P13510", "text": ["2. Connect the multimeter to TP1 and GND. You should see our desired temperature voltage, approximately 3 volts. At this point, we can see that the input to our thermostat circuit is correct.", "While observing the circuit, you should notice that the heat valve never opens. If you recall from the beginning of the experiment, we set the ambient temperature voltage to 2.65 V."], "jumps": ["P13520", "P13500"]}, {"id": "P13480", "text": ["Now that we have seen proper operation of the circuit, let's insert a fault and isolate the problem.", "By observing the outputs from these test points and the current position of the heat valve, you can see that when one of the test points is .5 to 15 VAC, it indicates that this is the current position of the heat valve.."], "jumps": ["P13470"]}, {"id": "P13471", "text": [], "jumps": []}, {"id": "P13472", "text": ["By observing the outputs from these test points and the current position of the heat valve, you can see that when one of the test points is .5 to 15 VAC, it indicates that this is the current position of the heat valve.."], "jumps": []}, {"id": "P13490", "text": ["While observing the circuit, you should notice that the heat valve never opens. If you recall from the beginning of the experiment, we set the ambient temperature voltage to 2.65 V."], "jumps": ["P13500"]}, {"id": "P13440", "text": ["2. Wait for the system to change states, heat valve open, while observing the multimeter. When the room became too cold, a signal was applied to the COLD ROOM output to be sent to the heat valve control circuit.."], "jumps": ["P13450", "P13430"]}, {"id": "P13430", "text": ["1. While your heat valve is closed, set your multimeter to measure AC and connect it to the COLD ROOM test point common. In this state, you should see a low voltage on the multimeter,approximately .5 vac.", "Pin 1 on all cables starts at bottom of card.", "Note: When measuring AC voltage use the following AC common probe placement."], "jumps": ["P13440", "P13410"]}, {"id": "P13470", "text": ["Measure the voltages at TP4 and TP5, while observing the position of the heat valve. Determine the voltage which indicates the current valve condition."], "jumps": ["P13460"]}, {"id": "P13520", "text": ["In temperature circuits, there is a range around the desired temperature where the valve doesn't change position. This is known as the deadband."], "jumps": ["P13530", "P13510"]}, {"id": "P13402", "text": ["The AC and DC indicators should be on. If not, check your setup."], "jumps": []}, {"id": "P13400", "text": ["Are the AC and DC power indicators ON?....................."], "jumps": ["P13390"]}, {"id": "P13401", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to the ON (up) position."], "jumps": []}, {"id": "P13390", "text": ["1. Place S1 on PC130-731 to ON (up)......................."], "jumps": ["P13400", "P13380", "P13395"]}, {"id": "P13385", "text": ["MEASUREMENT SETUP - Reconnect the light bulb to the circuit card.", "15. Place S1 on PC130-731 to OFF (down). 16. Reconnect the light bulb to the circuit card. The circuit is now set up. Let's look at its operation."], "jumps": ["P13385"]}, {"id": "P13375", "text": ["MEASUREMENT SETUP - Connect the multimeter to TP2 and GND of PC130-732 and adjust R7 for 2.65 V. Connect the multimeter to TP1 and GND of PC130-732 and adjust R5 for 3.00 V. Set R6 fully CCW.", "12. Set the multimeter to measure DC voltage and connect it to TP2 and GND on PC130-732. Adjust R7 for 2.65 V. 13. Connect the multimeter to TP1 and GND, adjusting R5 until a 3.00 V reading is obtained. 14. Set R6 fully CCW."], "jumps": []}, {"id": "P13360", "text": ["At this point, wait for approximately 5 minutes. DO NOT touch, cover, or allow air to blow across the sensor. Doing so in any part of the experiment will cause the system to work incorrectly."], "jumps": ["P13370", "P13350"]}, {"id": "P13370", "text": ["12. Set the multimeter to measure DC voltage and connect it to TP2 and GND on PC130-732. Adjust R7 for 2.65 V. 13. Connect the multimeter to TP1 and GND, adjusting R5 until a 3.00 V reading is obtained. 14. Set R6 fully CCW.", "1 to the ON (up) position. Start second line here."], "jumps": ["P13380", "P13360", "P13375"]}, {"id": "P13350", "text": ["11. Place S1 on PC130-731 to ON (up). TE The heat valve may change position based on the current conditions of the card. The card still has to be calibrated for proper operation.", "The heat valve may change position based on the current conditions of the card. The card still has to be calibrated for proper operation.tion."], "jumps": ["P13360", "P13340", "P13355"]}, {"id": "P13460", "text": ["4. There are two test points on the 733 card used to indicate the position of the valve: valve closed TP5 and valve open TP4. Using the multimeter set to AC, observe the voltages at these test points while observing the position of the valve."], "jumps": ["P13470", "P13450"]}, {"id": "P13335", "text": ["MEASUREMENT SETUP - Remove the light bulb by carefully pushing the bulb in and twisting.", "Now let's calibrate the thermostat card. 10. Remove the light bulb from its socket and set it aside."], "jumps": ["P13335"]}, {"id": "P13320", "text": ["9. Press Enter to Set: PC1, PC2 and PC3 DC Power - ON PC1 AC Power Switches - ON ower Switches - ON C Power Switches - ON es - ON"], "jumps": []}, {"id": "P13330", "text": ["Now let's calibrate the thermostat card. 10. Remove the light bulb from its socket and set it aside.", "6. Insert PC130-733 into the PC3 position. 7. Connect the six-wire cable between PC130-732 J2 and PC130-733 J1."], "jumps": ["P13340", "P13335"]}, {"id": "P13290", "text": ["4. Insert PC130-732 into PC2 position. 5. Connect the five-wire cable between PC130-731 J1 and PC130-732 J1."], "jumps": ["P13300", "P13280"]}, {"id": "P13310", "text": ["8. Press Enter to Set: Positive Supply Voltage - 12 Negative Supply Voltage - 12", "MEASUREMENT SETUP - Place S1 on PC130-731 to OFF (down) position."], "jumps": ["P13300"]}, {"id": "P13280", "text": ["2. Insert PC130-731 into the PC1 position. 3. Set S1 to OFF (down).", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13290", "P13285", "P13190"]}, {"id": "P13260", "text": ["The switches are performing two functions: they provide feedback on the current valve position, and they protect the motor from becoming damaged once the valve reaches a maximum position..."], "jumps": ["P13270", "P13190"]}, {"id": "P13240", "text": ["When the block closes the bottom switch, it indicates to the control circuit that the heat valve is completely open and to stop the motor from turning.", "When the block closes the top switch, it indicates to the control circuit that the heat valve is completely closed and to stop the motor from turning."], "jumps": ["P13250", "P13190"]}, {"id": "P13220", "text": ["The two micro switches on the motor housing are called limit switches. A block mounted on the motor's shaft is used to close these switches.", "The direction the motor turns depends on the signal received from the thermostat circuits. Remember, these are the COLD ROOM and HOT ROOM signals."], "jumps": ["P13230", "P13190"]}, {"id": "P13200", "text": ["AC is used to power the motor that opens and closes the heat valve. The block on the motor shaft represents the heat valve position.", "The PC130-733 card is the heat valve controller circuit. Pick it up and examine it."], "jumps": ["P13210", "P13190"]}, {"id": "P13180", "text": ["R6 and R7 are used to calibrate the thermostat. It is very important for them to be set properly. Without the correct setting, the system will not work properly.", "When the room is too hot, a signal is present on the HOT ROOM test point, causing the heat valve to close. This allows the room to cool to an ambient temperature."], "jumps": ["P13190", "P13110"]}, {"id": "P13160", "text": ["When the room is too cold, a signal is present on the COLD ROOM test point, causing the heat valve to open. This allows heat to be added to the room.", "From comparing the actual and desired temperature, the thermostat circuit sends an open or closed signal to the motor circuitry which will open or close the heat valve."], "jumps": ["P13170", "P13110"]}, {"id": "P13140", "text": ["The lamp is used to heat up the air around the temperature sensor to simulate a heated and cooled room. For every degree of temperature change on the sensor, it changes its voltage by .1 volts....", "Also applied to the thermostat circuit is the temperature of the room from a temperature sensor located under the lamp. The temperature sensor adjusts voltage applied to the circuit based on its current temperature..."], "jumps": ["P13150", "P13110"]}, {"id": "P13130", "text": ["Also applied to the thermostat circuit is the temperature of the room from a temperature sensor located under the lamp. The temperature sensor adjusts voltage applied to the circuit based on its current temperature..."], "jumps": ["P13140", "P13110"]}, {"id": "P13440", "text": ["2. Wait for the system to change states, heat valve open, while observing the multimeter. When the room became too cold, a signal was applied to the COLD ROOM output to be sent to the heat valve control circuit.."], "jumps": ["P13450", "P13430"]}, {"id": "P13100", "text": ["S1 is the system power switch, and S2 is a lamp test button for the heater indicator. Again, a test button provides good feedback for troubleshooting procedures.", "The heater indicator is the green LED. This LED illuminates when the heat valve is open, allowing heat flow to warm the room."], "jumps": ["P13110", "P13040"]}, {"id": "P13080", "text": ["The yellow LED indicates whether or not power is being applied to the electronic components of the environmental system. Again this type of indication can be very important for troubleshooting purposes...", "DC power is used to operate the electronic components of the environmental system. This power is received from the DC power bus of the power distribution system."], "jumps": ["P13090", "P13040"]}, {"id": "P13060", "text": ["The red LED indicates whether or not power is being applied to the heat valve motor. This type of indication can be very important for troubleshooting purposes."], "jumps": ["P13070", "P13040"]}, {"id": "P13070", "text": ["DC power is used to operate the electronic components of the environmental system. This power is received from the DC power bus of the power distribution system.", "The PC130-731 card is the power supply to the system. Pick up the card and examine it."], "jumps": ["P13080", "P13040"]}, {"id": "P13030", "text": ["The circuits are mounted on three circuit cards. The controls and indicators on these cards represent typical control panel components that can be found on aircraft instrumentation panels..."], "jumps": ["P13040", "P13020"]}, {"id": "P13090", "text": ["The heater indicator is the green LED. This LED illuminates when the heat valve is open, allowing heat flow to warm the room."], "jumps": ["P13100", "P13040"]}, {"id": "P13110", "text": ["The PC130-732 card is the thermostat circuit. Pick up the card and examine it."], "jumps": ["P13120", "P13040"]}, {"id": "P13120", "text": ["The thermostat inputs a desired temperature as a voltage set by R5. This simulates the temperature control switch."], "jumps": ["P13130", "P13110"]}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10229", "text": ["What is the probable fault if the red LED on PC130-731 is not illuminated?"], "jumps": []}, {"id": "P10228", "text": ["What is the probable fault if the output on the HOT ROOM and VALVE CLOSED test points are correct and the trim valve will open but not close?"], "jumps": []}, {"id": "P10227", "text": ["In the experiment, what does a high on the VALVE CLOSED test point indicate?"], "jumps": []}, {"id": "P10226", "text": ["In the experiment, when does the R.ROT test point measure high?", "When the trim valve is rotating to the left", "When the trim valve is rotating to the right"], "jumps": []}, {"id": "P10225", "text": ["In the experiment, what does an illuminated heater LED indicate?", "Trim valve fully open or moving towards closed", "Trim valve fully closed or moving towards open"], "jumps": []}, {"id": "P10224", "text": ["In the experiment, what does a low on the HOT ROOM test point indicate?"], "jumps": []}, {"id": "P10223", "text": ["In the experiment, what does a 0 to 1 volt reading on a test point indicate?"], "jumps": []}, {"id": "P10222", "text": ["In the experiment, what does a 1 to 4 volt reading on a test point in P2420", "text": ["Let's observe some of the conditions of the card. It is important to know that you may need to wait sometimes to observe conditions if the heat valve is in a different state."], "jumps": ["P2430", "P2410"]}, {"id": "P2471", "text": ["Are the AC and DC power indicators ON?....................."], "jumps": []}, {"id": "P2395", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to the ON (up) position.", "1. Place S1 on PC130-731 to ON (up)......................."], "jumps": ["P2395"]}, {"id": "P2385", "text": ["MEASUREMENT SETUP - Reconnect the light bulb to the circuit card."], "jumps": []}, {"id": "P2400", "text": ["Are the AC and DC power indicators ON?....................."], "jumps": ["P2390"]}, {"id": "P2402", "text": ["The AC and DC indicators should be on. If not, check your setup."], "jumps": []}, {"id": "P2370", "text": ["14. Set the multimeter to measure DC voltage and connect it to TP2 and GND on PC130-732. Adjust R7 for 2.65 V. 15. Connect the multimeter to TP1 and GND, adjusting R5 until a 3.00 V reading is obtained. 16. Set R6 fully CCW."], "jumps": ["P2380", "P2360", "P2375"]}, {"id": "P2510", "text": ["2. Connect the multimeter to TP1 and GND. You should see our desired temperature voltage, approximately 3 volts. At this point, we can see that the input to our thermostat circuit is correct."], "jumps": ["P2520", "P2500"]}, {"id": "P2355", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to the ON (up) position."], "jumps": []}, {"id": "P2500", "text": ["1. Connect the multimeter set for DC to TP2 and GND on PC130-732. You may need to wait until the system has cooled from when it was in proper operation. The voltage should be correct (or within 10%)."], "jumps": ["P2510", "P2490"]}, {"id": "P2340", "text": ["At this point, the temperature sensor is adjusting to the ambient temperature of your environment. For proper operation, we need to set the voltage from the current sensor to 2.65 V at ambient temperature..."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["13. Place S1 on PC130-731 to ON (up). TE The heat valve may change position based on the current conditions of the card. The card still has to be calibrated for proper operation.", "The heat valve may change position based on the current conditions of the card. The card still has to be calibrated for proper operation.tion."], "jumps": ["P2360", "P2340", "P2355"]}, {"id": "P2330", "text": ["The Test Console setup is complete. Now let's calibrate the thermostat card. 12. Remove the light bulb from its socket and set it aside...."], "jumps": ["P2340", "P2320", "P2335"]}, {"id": "P2440", "text": ["2. Wait for the system to change states, heat valve open, while observing the multimeter. When the room became too cold, a signal was applied to the COLD ROOM output to be sent to the heat valve control circuit."], "jumps": ["P2450", "P2430"]}, {"id": "P2310", "text": ["8. Set the Positive Supply Control to 12. 9. Set the Negative Supply Control to 12.2 volt reading on the test console's meter. a 12 volt reading on the test console's meter..."], "jumps": ["P2300"]}, {"id": "P2480", "text": ["Now that we have seen proper operation of the circuit, let's insert a fault and isolate the problem. to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2470"]}, {"id": "P2290", "text": ["4. Insert PC130-732 into the PC2 position. 5. Connect the five-wire cable between PC130-731 J1 and PC130-732 J1."], "jumps": ["P2300", "P2280"]}, {"id": "P2320", "text": ["10. Press the FILAMENT power switch to ON. 11. Press the PC1, PC2, and PC3 DC POWER switches to ON.ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2310"]}, {"id": "P2280", "text": ["2. Insert PC130-731 into the PC1 position. 3. Set S1 to OFF (down).. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2270"]}, {"id": "P2390", "text": ["1. Place S1 on PC130-731 to ON (up)......................."], "jumps": ["P2400", "P2380", "P2395"]}, {"id": "P2260", "text": ["The switches are performing two functions: they provide feedback on the current valve position, and they protect the motor from becoming damaged once the valve reaches a maximum position..."], "jumps": ["P2270", "P2190"]}, {"id": "P2240", "text": ["When the block closes the bottom switch, it indicates to the control circuit that the heat valve is completely open and to stop the motor from turning."], "jumps": ["P2250", "P2190"]}, {"id": "P2230", "text": ["When the block closes the top switch, it indicates to the control circuit that the heat valve is completely closed and to stop the motor from turning.", "The two micro switches on the motor housing are called limit switches. A block mounted on the motor's shaft is used to close these switches."], "jumps": ["P2240", "P2190"]}, {"id": "P2210", "text": ["The direction the motor turns depends on the signal received from the thermostat circuits. Remember, these are the COLD ROOM and HOT ROOM signals.", "AC is used to power the motor that opens and closes the heat valve. The block on the motor shaft represents the heat valve position."], "jumps": ["P2220", "P2190"]}, {"id": "P2190", "text": ["The PC130-733 card is the heat valve controller circuit. Pick it up and examine it."], "jumps": ["P2200", "P2110"]}, {"id": "P2200", "text": ["AC is used to power the motor that opens and closes the heat valve. The block on the motor shaft represents the heat valve position.", "rtant for them to be set properly. Without the correct setting, the system will not work properly."], "jumps": ["P2210", "P2190"]}, {"id": "P2170", "text": ["When the room is too hot, a signal is present on the HOT ROOM test point, causing the heat valve to close. This allows the room to cool to an ambient temperature."], "jumps": ["P2180", "P2110"]}, {"id": "P2460", "text": ["4. There are two test points on the 733 card used to indicate the position of the valve: valve closed TP5 and valve open TP4. Using the multimeter set to AC, observe the voltages at these test points while observing the position of the valve."], "jumps": ["P2470", "P2450"]}, {"id": "P2140", "text": ["The lamp is used to heat up the air around the temperature sensor to simulate a heated and cooled room. For every degree of temperature change on the sensor, it changes its voltage by .1 volts..", "Also applied to the thermostat circuit is the temperature of the room from a temperature sensor located under the lamp. The temperature sensor adjusts voltage applied to the circuit based on its current temperature..."], "jumps": ["P2150", "P2110"]}, {"id": "P2120", "text": ["The thermostat inputs a desired temperature as a voltage set by R5. This simulates the temperature control switch."], "jumps": ["P2130", "P2110"]}, {"id": "P2520", "text": ["In temperature circuits, there is a range around the desired temperature where the valve doesn't change position. This is known as the deadband."], "jumps": ["P2530", "P2510"]}, {"id": "P2100", "text": ["S1 is the system power switch, and S2 is a lamp test button for the heater indicator. Again, a test button provides good feedback for troubleshooting procedures.", "The heater indicator is the green LED. This LED illuminates when the heat valve is open, allowing heat flow to warm the room."], "jumps": ["P2110", "P2040"]}, {"id": "P2080", "text": ["The yellow LED indicates whether or not power is being applied to the electronic components of the environmental system. Again this type of indication can be very important for troubleshooting purposes...", "DC power is used to operate the electronic components of the environmental system. This power is received from the DC power bus of the power distribution system."], "jumps": ["P2090", "P2040"]}, {"id": "P2060", "text": ["The red LED indicates whether or not power is being applied to the heat valve motor. This type of indication can be very important for troubleshooting purposes."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["DC power is used to operate the electronic components of the environmental system. This power is received from the DC power bus of the power distribution system."], "jumps": ["P2080", "P2040"]}, {"id": "P2090", "text": ["The heater indicator is the green LED. This LED illuminates when the heat valve is open, allowing heat flow to warm the room."], "jumps": ["P2100", "P2040"]}, {"id": "P2110", "text": ["The PC130-732 card is the thermostat circuit. Pick up the card and examine it."], "jumps": ["P2120", "P2040"]}, {"id": "P2130", "text": ["Also applied to the thermostat circuit is the temperature of the room from a temperature sensor located under the lamp. The temperature sensor adjusts voltage applied to the circuit based on its current temperature..."], "jumps": ["P2140", "P2110"]}, {"id": "P2150", "text": ["From comparing the actual and desired temperature, the thermostat circuit sends an open or closed signal to the motor circuitry which will open or close the heat valve."], "jumps": ["P2160", "P2110"]}, {"id": "P2180", "text": ["R6 and R7 are used to calibrate the thermostat. It is very important for them to be set properly. Without the correct setting, the system will not work properly."], "jumps": ["P2190", "P2110"]}, {"id": "P2220", "text": ["The two micro switches on the motor housing are called limit switches. A block mounted on the motor's shaft is used to close these switches."], "jumps": ["P2230", "P2190"]}, {"id": "P2240", "text": ["When the block closes the bottom switch, it indicates to the control circuit that the heat valve is completely open and to stop the motor from turning."], "jumps": ["P2250", "P2190"]}, {"id": "P2250", "text": ["The switches are performing two functions: they provide feedback on the current valve position, and they protect the motor from becoming damaged once the valve reaches a maximum position..."], "jumps": ["P2260", "P2190"]}, {"id": "P2270", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2190"]}, {"id": "P2285", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to OFF (down) position."], "jumps": []}, {"id": "P2300", "text": ["6. Insert PC130-733 into the PC3 position. 7. Connect the six-wire cable between PC130-732 J2 and PC130-733 J1."], "jumps": ["P2310", "P2290"]}, {"id": "P2335", "text": ["MEASUREMENT SETUP - Remove the light bulb by carefully pushing the bulb in and twisting."], "jumps": []}, {"id": "P2360", "text": ["At this point, wait for approximately 5 minutes. DO NOT touch, cover, or allow air to blow across the sensor. Doing so in any part of the experiment will cause the system to work incorrectly."], "jumps": ["P2370", "P2350"]}, {"id": "P2375", "text": ["MEASUREMENT SETUP - Connect the multimeter to TP2 and GND of PC130-732 and adjust R7 for 2.65 V. Connect the multimeter to TP1 and GND of PC130-732 and adjust R5 for 3.00 V. Set R6 fully CCW."], "jumps": []}, {"id": "P2380", "text": ["17. Place S1 on PC130-731 to OFF (down). 18. Reconnect the light bulb to the circuit card. The circuit is now set up. Let's look at its operation."], "jumps": ["P2390", "P2370", "P2385"]}, {"id": "P2401", "text": [], "jumps": []}, {"id": "P1960", "text": ["5. The air conditioning system cools the air and removes water in the heat exchangers."], "jumps": ["P1970", "P1950"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "ENVIRONMENTAL CONTROL & WARNING SYSTEMMMMMM"], "jumps": []}, {"id": "P2040", "text": ["The PC130-731 card is the power supply to the system. Pick up the card and examine it."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["AC power is used to operate the heat valve, located on the PC130-733 card. This power is received from the AC power bus of the power distribution system."], "jumps": ["P2060", "P2040"]}, {"id": "P1940", "text": ["3. The pneumatic system supplies hot, filtered, and pressurized air.", "2. Aircraft environmental systems consists of three independent systems.", "Pneumatic Air Conditioning Air Pressurizationnn"], "jumps": ["P1950", "P1930", "P1940", "P1920"]}, {"id": "P1990", "text": ["8. A control panel controls the system and gives an indication of system operation.", "ration - Environmental Control and Warning System", "tion - Environmental Control and Warning System", "Nida Corporation - Environmental Control and Warning System", "A three engine aircraft has three air packs, and a four engine aircraft has 4 air packs. There is one air pack per engine plus the necessary ductwork and components."], "jumps": ["P1999", "P1980", "P1910", "P1690"]}, {"id": "P1920", "text": ["1. Aircraft environmental systems supply conditioned and pressurized air."], "jumps": ["P1930", "P1001"]}, {"id": "P1980", "text": ["7. The pressurization system releases pressurized air to maintain a set cabin pressure."], "jumps": ["P1990", "P1970"]}, {"id": "P2160", "text": ["When the room is too cold, a signal is present on the COLD ROOM test point, causing the heat valve to open. This allows heat to be added to the room."], "jumps": ["P2170", "P2110"]}, {"id": "P1683", "text": ["You selected the manual control for the outflow valve of the pressurization system."], "jumps": []}, {"id": "P1684", "text": ["You selected the ditching button, which turns off the system and closes the outflow valve if the aircraft must ditch."], "jumps": []}, {"id": "P1685", "text": ["You did not select a controller, button, or switch........."], "jumps": []}, {"id": "P2450", "text": ["3. This voltage is between 1 VAC and 4 VAC. Remember, it is AC voltage that is used to drive the motor. You can also place the multimeter on the HOT ROOM test point TP7 and GND to observe the same readings for the opposite state."], "jumps": ["P2460", "P2440"]}, {"id": "P1673", "text": ["The pressurization system actually releases air or depressurizes air."], "jumps": []}, {"id": "P1682", "text": ["You selected the mode switch, which controls automatic or manual operation of the pressurization system."], "jumps": []}, {"id": "P1681", "text": [], "jumps": []}, {"id": "P1700", "text": ["If more than two engines are used, the environmental systems would use more components."], "jumps": ["P1710", "P1690"]}, {"id": "P1671", "text": [], "jumps": []}, {"id": "P1640", "text": ["The ditching button, when pressed, automatically turns the system off and closes the outflow valve."], "jumps": ["P1650", "P1600"]}, {"id": "P1620", "text": ["In the manual mode, the pilot controls the position of the outflow valve."], "jumps": ["P1630", "P1600"]}, {"id": "P1630", "text": ["In the automatic mode, the desired pressure is dialed in and the system will maintain the correct pressure."], "jumps": ["P1640", "P1600"]}, {"id": "P1650", "text": [], "jumps": ["P1660", "P1600"]}, {"id": "P1670", "text": ["The interior of the aircraft is directly pressurized by which system?"], "jumps": ["P1600"]}, {"id": "P1660", "text": ["The two fault indicators display the status of the outflow valve and the systems electronic controller."], "jumps": ["P1670", "P1600"]}, {"id": "P1560", "text": ["This is a typical air pressurization system................"], "jumps": ["P1570", "P1540"]}, {"id": "P1540", "text": ["The air pressurization system regulates the air pressure in the interior of the aircraft."], "jumps": ["P1550", "P1530"]}, {"id": "P1524", "text": ["You did not select a trim valve indicator.................."], "jumps": []}, {"id": "P1672", "text": ["The pneumatic system supplies pressurized air to the air conditioning system but does not directly pressurize the aircraft."], "jumps": []}, {"id": "P1690", "text": ["As a final note about aircraft environmental systems, the systems you studied were designed around a two engine aircraft."], "jumps": ["P1700", "P1680"]}, {"id": "P1710", "text": ["A three engine aircraft has three air packs, and a four engine aircraft has 4 air packs. There is one air pack per engine plus the necessary ductwork and components."], "jumps": ["P1910", "P1690"]}, {"id": "P1522", "text": ["You selected the trim valve indicator for the cockpit......"], "jumps": []}, {"id": "P1523", "text": ["You selected the trim valve indicator for the equipment spaces."], "jumps": []}, {"id": "P1120", "text": ["This allows hot compressed air from a ground pneumatic cart to support the environmental systems."], "jumps": ["P1130", "P1092"]}, {"id": "P1513", "text": ["Pack valves supply air to the air conditioning units and are valves 2 L and 2 R."], "jumps": []}, {"id": "P1580", "text": ["An outflow valve is controlled to release the pressurized air into the atmosphere."], "jumps": ["P1590", "P1560"]}, {"id": "P1590", "text": ["By varying the amount of air that is released, the pressure inside the cabin is maintained at a set level."], "jumps": ["P1600", "P1560"]}, {"id": "P1610", "text": ["The mode push button allows automatic or manual control over the system."], "jumps": ["P1620", "P1600"]}, {"id": "P1511", "text": [], "jumps": []}, {"id": "P1521", "text": [], "jumps": []}, {"id": "P1570", "text": ["Slightly pressurized air from the air conditioning system is supplied throughout the interior of the aircraft."], "jumps": ["P1580", "P1560"]}, {"id": "P1685", "text": ["You did not select a controller, button, or switch.........", "In this way, cabin pressure is kept at a constant comfortable level."], "jumps": ["P1540"]}, {"id": "P1930", "text": ["2. Aircraft environmental systems consists of three independent systems.", "Pneumatic Air Conditioning Air Pressurizationnn"], "jumps": ["P1940", "P1920"]}, {"id": "P1502", "text": ["The air conditioning units, PACKS, in aircraft do not use refrigerants."], "jumps": []}, {"id": "P1500", "text": ["What do the PACKS use to lower the air temperature from the pneumatic system?"], "jumps": ["P1430"]}, {"id": "P1480", "text": ["FAULT/OK indicates the status of the packs, supply air to the packs, and air from the APU."], "jumps": ["P1490", "P1430"]}, {"id": "P1460", "text": ["Three temperature controllers allow individual temperature to be set in the cockpit, passengers cabin, and electronic equipment spaces.", "The pack air flow controls regulate the entire air conditioning system."], "jumps": ["P1470", "P1430"]}, {"id": "P1430", "text": ["The control panel for the air conditioning system consists of switches, controllers, and indicators."], "jumps": ["P1440", "P1410"]}, {"id": "P1684", "text": ["You selected the ditching button, which turns off the system and closes the outflow valve if the aircraft must ditch.", "Finally, the temperature and humidity controlled air is directed throughout the interior of the aircraft."], "jumps": []}, {"id": "P1390", "text": ["Electronic equipment may require colder air for cooling."], "jumps": ["P1400", "P1350"]}, {"id": "P1400", "text": ["Finally, the temperature and humidity controlled air is directed throughout the interior of the aircraft."], "jumps": ["P1410", "P1350"]}, {"id": "P1420", "text": ["This is accomplished by different ducting and a separate trim valve."], "jumps": ["P1430", "P1410"]}, {"id": "P1440", "text": ["The layout is similar to the overall air conditioning system."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The pack air flow controls regulate the entire air conditioning system."], "jumps": ["P1460", "P1430"]}, {"id": "P1470", "text": ["They operate like any thermostat, comparing actual temperature to desired temperature and controlling the trim valves as needed."], "jumps": ["P1480", "P1430"]}, {"id": "P2430", "text": ["1. While your heat valve is closed, set your multimeter to measure AC and connect it to the COLD ROOM test point TP6 and GND. In this state, you should see a low voltage on the multimeter, between .5 and 1.25 VAC."], "jumps": ["P2440", "P2410"]}, {"id": "P1370", "text": ["Valve 5 is a Pressure Reducer. It reduces the pressure of the hot air to the pressure of the air coming out of the PACKS."], "jumps": ["P1380", "P1350"]}, {"id": "P1320", "text": ["The pressure is dropped after the heat exchanger further reduces the air temperature."], "jumps": ["P1330", "P1300"]}, {"id": "P1300", "text": ["Basically, the hot compressed air from the pneumatic system is routed through a main heat exchanger.", "PACKS operate using heat exchangers; they do not use refrigerants. Let's see."], "jumps": ["P1310", "P1260"]}, {"id": "P1512", "text": ["The pressure reducer valve reduces the pneumatic air pressure to match the output of the air packs and is valve number 5."], "jumps": []}, {"id": "P1510", "text": ["What name is used to describe valve 6?....................."], "jumps": ["P1500"]}, {"id": "P1550", "text": ["In this way, cabin pressure is kept at a constant comfortable level.", "Once you have pressurized conditioned air, the air pressurization system takes over.", "Pneumatic Air Conditioning Air Pressurizationnn"], "jumps": ["P1560", "P1540"]}, {"id": "P1215", "text": ["You selected a gauge or indicator. These give the status of the bleed valves and the bleed air from engines 1 and 2."], "jumps": []}, {"id": "P1520", "text": ["Select the trim valve position indicator for the cabin.lve."], "jumps": ["P1510"]}, {"id": "P1600", "text": ["The control panel consists of switches, controllers, and indicators."], "jumps": ["P1610", "P1560"]}, {"id": "P1212", "text": ["You selected the engine #1 bleed valve switch.............."], "jumps": []}, {"id": "P1210", "text": ["Select the switch that opens or closes the APU Bleed valve."], "jumps": ["P1200"]}, {"id": "P1340", "text": ["The air output is cold and free from water. The air pressure has also been reduced but is still higher than normal cabin pressure."], "jumps": ["P1350", "P1300"]}, {"id": "P1360", "text": ["The cold air then has hot air added from valves 5 and 6 to bring the air temperature up to the desired level."], "jumps": ["P1370", "P1350"]}, {"id": "P1470", "text": ["They operate like any thermostat, comparing actual temperature to desired temperature and controlling the trim valves as needed."], "jumps": ["P1480", "P1430"]}, {"id": "P1490", "text": ["Finally, OPEN/CLOSED indicators show the status of the trim valves."], "jumps": ["P1500", "P1430"]}, {"id": "P1503", "text": ["The air conditioning units, PACKS, in aircraft do not use water."], "jumps": []}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1220", "text": ["The hot, compressed filtered air is sent to the air conditioning system for cooling. The air conditioning system provides the conditioned air to the interior of the airplane.", "Pneumatic Air Conditioning Air Pressurizationnn"], "jumps": ["P1230", "P1210"]}, {"id": "P1193", "text": ["The pneumatic systems source of air is from the compression section of engines. It is not low pressure."], "jumps": []}, {"id": "P1230", "text": ["The air conditioning system (AC System) controls the air temperature and humidity of the aircraft's interior."], "jumps": ["P1240", "P1220"]}, {"id": "P1201", "text": [], "jumps": []}, {"id": "P1200", "text": ["What name is used to describe valves 1 L and 1 R?.........."], "jumps": ["P1190"]}, {"id": "P1180", "text": ["Finally, a complete system indicator, resembling the layout of the system, is used to show air flow and valve positions."], "jumps": ["P1190", "P1130"]}, {"id": "P440", "text": ["Let's begin the lesson on ENVIRONMENTAL CONTROL & WARNING SYSTEM............"], "jumps": ["P400"]}, {"id": "P1160", "text": ["The isolation switch allows manual control of the isolation valve."], "jumps": ["P1170", "P1130"]}, {"id": "P1130", "text": ["The control panel for the pneumatic system consists of switches and indicators."], "jumps": ["P1140", "P1092"]}, {"id": "P1140", "text": ["The three bleed valve switches allow opening and closing of the valves."], "jumps": ["P1150", "P1130"]}, {"id": "P1240", "text": ["The temperature control maintains a comfortable temperature for people and equipment."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The humidity control removes water from the air to prevent moisture, fogging, and icing inside the aircraft."], "jumps": ["P1260", "P1230"]}, {"id": "P1190", "text": ["The pneumatic system supplies air in what condition?......."], "jumps": ["P1130"]}, {"id": "P1090", "text": ["A third source of air is from the Auxiliary Power Unit (APU) and is used when the main engines are not running or if there is a pneumatic system failure."], "jumps": ["P1100", "P1052"]}, {"id": "P1095", "text": ["AUXILIARY POWER UNIT - The auxiliary power unit (APU) is a self contained gas turbine engine used to supply electrical power, air to the air conditioning system, and supplying compressed air for engine starting when the main engines are not running."], "jumps": []}, {"id": "P1150", "text": ["Each bleed valve switch has an indicator that tells which parts of the pneumatic system are supplying air."], "jumps": ["P1160", "P1130"]}, {"id": "P1170", "text": ["The two pressure gauges allow monitoring of the hot compressed bleed air from engines 1 and 2."], "jumps": ["P1180", "P1130"]}, {"id": "P1052", "text": ["Hot compressed (pressurized) air from the engine bleed system is directed to ducting through individually controlled engine bleed valves."], "jumps": ["P1060", "P1040"]}, {"id": "P1350", "text": ["Now, returning to the overall system, the output air from the packs is routed to a duct where it is mixed with cabin return air."], "jumps": ["P1360", "P1300"]}, {"id": "P1390", "text": ["Electronic equipment may require colder air for cooling."], "jumps": ["P1400", "P1350"]}, {"id": "P1092", "text": ["A third source of air is from the Auxiliary Power Unit (APU) and is used when the main engines are not running or if there is a pneumatic system failure."], "jumps": ["P1100", "P1052"]}, {"id": "P330", "text": [], "jumps": []}, {"id": "P1055", "text": ["ENGINE BLEED SYSTEM - The engine bleed system maintains certain pressures within the engine during the compression phase, before fuel mixing and combustion, regardless of altitude."], "jumps": []}, {"id": "P430", "text": ["Without this system, airplane transportation would be very uncomfortable and impractical.", "The air quality is maintained at the correct temperature, humidity, and pressure by the environmental system."], "jumps": ["P440", "P400"]}, {"id": "P1030", "text": ["The air that is supplied to the interior of the aircraft comes from the pneumatic, or air, system."], "jumps": ["P1040", "P1020"]}, {"id": "P10", "text": ["ENVIRONMENTAL CONTROL AND WARNING SYSTEM"], "jumps": []}, {"id": "P1110", "text": ["Finally, a GROUND SERVICE CONNECTION is provided for supplying air when the aircraft is on the ground and the APU or engines are not running."], "jumps": ["P1120", "P1092"]}, {"id": "P1050", "text": ["Hot compressed (pressurized) air from the engine bleed system is directed to ducting through individually controlled engine bleed valves."], "jumps": ["P1060", "P1040"]}, {"id": "P1070", "text": ["From the filters, the hot compressed air is directed through PACK valves to individual air conditioning units."], "jumps": ["P1080", "P1052"]}, {"id": "P1270", "text": ["The compressed filtered hot air from the pneumatic system is routed through PACK valves to individual air PACKS (A/C units)."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The PACKS lower the temperature and remove any water from the air, providing temperature and humidity control."], "jumps": ["P1290", "P1260"]}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Nida Corporation - Environmental Control and Warning System"], "jumps": []}, {"id": "P410", "text": ["Environmental systems also ensure that there is air for the crew and passengers to breathe."], "jumps": ["P420", "P400"]}, {"id": "P1025", "text": ["Let's look at each major system separately starting with the pneumatic system.", "Pneumatic Air Conditioning Air Pressurizationnn"], "jumps": ["P1030", "P1020"]}, {"id": "P1100", "text": ["From the APU, hot compressed air is routed through the APU BLEED valve, through a check valve, to the system."], "jumps": ["P1110", "P1092"]}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: ENVIRONMENTAL CONTROL AND WARNING SYSTEMsdf sadf", "\"You have successfully passed the assessment", "ration - Environmental Control and Warning System", "tion - Environmental Control and Warning System", "Nida Corporation - Environmental Control and Warning System"], "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P1080", "text": ["The ISOLATION valve is used to separate the two sources of air or cross-connect them as needed."], "jumps": ["P1090", "P1052"]}, {"id": "P100", "text": ["w Describe a typical pneumatic system. w Describe a typical air conditioning system. w Describe a typical pressure control system.", "w Observe the operation of a typical thermostat and trim valve in an air conditioning system. w Isolate a fault in a typical thermostat and trim valve of an air conditioning system."], "jumps": []}, {"id": "P900", "text": [], "jumps": ["P440"]}, {"id": "P1410", "text": ["Some electronic equipment requires colder air for cooling.."], "jumps": ["P1420", "P1350"]}, {"id": "P1440", "text": ["The layout is similar to the overall air conditioning system."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["The pack air flow controls regulate the entire air conditioning system."], "jumps": ["P1460", "P1430"]}, {"id": "P1530", "text": ["Once you have pressurized conditioned air, the air pressurization system takes over.", "Pneumatic Air Conditioning Air Pressurizationnn", ";! :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::", ";!! :"], "jumps": ["P1540", "P1520"]}, {"id": "P1202", "text": ["The isolation valve is labeled 3, not 1 L and 1 R.........."], "jumps": []}, {"id": "P1211", "text": [], "jumps": ["P", "PQQ"]}, {"id": "P1192", "text": ["The pneumatic system source of air is from the compression section of engines. It is not cold."], "jumps": []}, {"id": "P1191", "text": [], "jumps": []}, {"id": "P1260", "text": ["This is a typical air conditioning system.................."], "jumps": ["P1270", "P1230"]}, {"id": "P1040", "text": ["This is a typical pneumatic system........................."], "jumps": ["P1050", "P1030"]}, {"id": "P1683", "text": ["You selected the manual control for the outflow valve of the pressurization system."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on ENVIRONMENTAL SYSTEMS...."], "jumps": []}, {"id": "P420", "text": ["The air quality is maintained at the correct temperature, humidity, and pressure by the environmental system."], "jumps": ["P430", "P400", "P", "PQQ"]}, {"id": "P1060", "text": ["From the engine bleed valves, the hot compresse re was created with Asymetrix ToolBook I I .", "Title: ENVIRONMENTAL CONTROL AND WARNING SYSTEMsdf sadf"], "jumps": []}, {"id": "PINFO", "text": ["09-14-00 Text and Branching. frieda 09-22-00 graphics john Ayala 10-03-00 reviewed lesson. frieda 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-12-02 review - rs", "Are you sure you want to Bookmark the Lesson?", "Are you sure you want to Exit the Lesson?", "You skipped X question(s). Do you want to _________", "The test is complete and your score is XX%. Do you want to _________", "You have successfully passed the assessment test!"], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P400", "text": ["Environmental systems are used in large commercial aircraft to provide comfortable transportation for passengers and crew."], "jumps": ["P410", "P300"]}, {"id": "P13020", "text": ["In this experiment, you will look at the operation of a heat valve associated with a thermostat in an aircraft air conditioning system."], "jumps": ["P13030", "P2001"]}, {"id": "P13150", "text": ["From comparing the actual and desired temperature, the thermostat circuit sends an open or closed signal to the motor circuitry which will open or close the heat valve."], "jumps": ["P13160", "P13110"]}, {"id": "P13170", "text": ["When the room is too hot, a signal is present on the HOT ROOM test point, causing the heat valve to close. This allows the room to cool to an ambient temperature."], "jumps": ["P13180", "P13110"]}, {"id": "P13190", "text": ["The PC130-733 card is the heat valve controller circuit. Pick it up and examine it."], "jumps": ["P13200", "P13110"]}, {"id": "P13210", "text": ["The direction the motor turns depends on the signal received from the thermostat circuits. Remember, these are the COLD ROOM and HOT ROOM signals."], "jumps": ["P13220", "P13190"]}, {"id": "P13230", "text": ["When the block closes the top switch, it indicates to the control circuit that the heat valve is completely closed and to stop the motor from turning."], "jumps": ["P13240", "P13190"]}, {"id": "P13250", "text": ["The switches are performing two functions: they provide feedback on the current valve position, and they protect the motor from becoming damaged once the valve reaches a maximum position..."], "jumps": ["P13260", "P13190"]}, {"id": "P13270", "text": ["1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13190"]}, {"id": "P13285", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to OFF (down) position."], "jumps": []}, {"id": "P13300", "text": ["6. Insert PC130-733 into the PC3 position. 7. Connect the six-wire cable between PC130-732 J2 and PC130-733 J1."], "jumps": ["P13310", "P13290"]}, {"id": "P13340", "text": ["At this point, the temperature sensor is adjusting to the ambient temperature of your environment. For proper operation, we need to set the voltage from the current sensor to 2.65 V at ambient temperature..."], "jumps": ["P13350", "P13330"]}, {"id": "P13355", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to the ON (up) position."], "jumps": []}, {"id": "P13380", "text": ["15. Place S1 on PC130-731 to OFF (down). 16. Reconnect the light bulb to the circuit card. The circuit is now set up. Let's look at its operation."], "jumps": ["P13390", "P13370", "P13385"]}, {"id": "P13390", "text": ["1. Place S1 on PC130-731 to ON (up)......................."], "jumps": ["P13400", "P13380", "P13395"]}, {"id": "P13395", "text": ["MEASUREMENT SETUP - Place S1 on PC130-731 to the ON (up) position."], "jumps": []}, {"id": "P13410", "text": ["At this point, observe the operation of your cards. Every two to three minutes, the valve should open or shut. This is the normal operation of a conditioning system."], "jumps": ["P13420", "P13400"]}, {"id": "P13420", "text": ["Let's observe some of the conditions of the card. It is important to know that you may need to wait sometimes to observe conditions if the heat valve is in a different state."], "jumps": ["P13430", "P13410"]}, {"id": "P13450", "text": ["3. This voltage is approximately 15 VAC. Remember, it is AC voltage that is used to drive the motor. You can also place the multimeter on the HOT ROOM test point TP7 and common to observe the same readings for the opposite state.."], "jumps": ["P13460", "P13440"]}, {"id": "P1290", "text": ["PACKS operate using heat exchangers; they do not use refrigerants. Let's see."], "jumps": ["P1300", "P1260"]}, {"id": "P1310", "text": ["Outside air is forced through the heat exchanger, removing the heat from the supplied air."], "jumps": ["P1320", "P1300"]}, {"id": "P1380", "text": ["Valve 6 is used to turn the hot air supply ON and OFF. It is called a TRIM valve.", "Valve 5 is a Pressure Reducer. It reduces the pressure of the hot air to the pressure of the air coming out of the PACKS."], "jumps": ["P1390", "P1350"]}, {"id": "P2610", "text": ["1. Return the Test Console to the initial control settings................"], "jumps": ["P2600"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P420", "text": ["The air quality is maintained at the correct temperature, humidity, and pressure by the environmental system.", "%%S&%Z%%Z&%Z%%Z%%[&%[&%['&[&&['&]'']((]((^))_*)^)(]((]((_**^))]((])(])(\\''\\' let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
