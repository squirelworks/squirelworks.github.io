<script>
const book = {"title": "9395T315", "pages": [{"id": "P10", "text": ["PULSE WIDTH MODULATION AND AMPLIFICATION"], "jumps": []}, {"id": "P100", "text": ["w Measure signals at various points throughout a PWM circuit. w Measure and compare pulse width vs. current output of a PWM amplifier. w Recognize normal operation of a PWM Motor Driver..", "w Identify the principles of pulse width modulation. w Describe the operation of PWM motor control. w Describe the operation of a PWM Amplifier/Driver.", "2. Experiment.o Title Enter objective 1 line item 2 here. item 2 here.e.e.", "1. Pulse Width Modulationter objective 1 line item 2 here. item 2 here.e.e."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P301", "text": ["6. Nida Model 480 MultimetertimeterXXXXXXXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about Pulse Width Modulation and Amplification."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Pulse Width Modulators are used to control the speed of DC motors."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Signal amplification (motor driver) is required to provide sufficient current to drive a motor."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["A Pulse Width Modulator (or PWM) controls the speed of a motor by turning the motor ON and OFF very quickly."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Amplitude of the pulses is fixed; only the width changes..."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["The output of the PWM does not have sufficient current carrying capabilities to drive a motor. A PWM amplifier (driver) is added to increase and stabilize the output current."], "jumps": ["P440", "P460"]}, {"id": "P460", "text": ["Let's begin the lesson on Pulse Width Modulation.........................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": ["P460"]}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Pulse Width Modulators are a type of Variable Frequency Drive (VFD)."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["VFDs are motor controllers that vary the speed of the motors by adjusting the frequency of the input signal to a motor or control actuator."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The Variable Voltage Inverter (VVI), Current Source Inverter (CSI), Pulse Width Modulator (PWM), and the flux vector PWM drives are the common VFD designs."], "jumps": ["P1050", "P1020", "PWM"]}, {"id": "P1050", "text": ["The VVI receives an AC input and outputs a variable-voltage DC to the power amplifier. The power amplifier outputs a variable frequency, variable voltage AC.", "Variable Frequency Variable Voltage AC"], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["The CSI is similar to the VVI except the CSI output uses current rather than voltage for the establishment of the output signal.", "Variable Frequency Variable Voltage AC"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["VVI and CSI designs have major disadvantages that limit their ability to control devices. These disadvantages include the reflection of harmonics back to the power source, cogging (jerking motor operation) at low speeds, and poor power factors....."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["PWM is the leading VFD design because of its dependability, cost, availability, and ability to offer operation to zero speed."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["Pulse width modulation (PWM) is the method by which a fixed frequency and fixed amplitude pulse train is varied in duty cycle by an analog signal. This method is sometimes called pulse duration modulation (PDM)..."], "jumps": ["P1100", "P1080", "PWM", "PDM"]}, {"id": "P1100", "text": ["The inputs to a PWM include a clock pulse and a DC level which are used to generate the varying width pulsed output."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The input clock pulses (triggers) determine the period (or time) between the output pulses."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The DC level determines the width of the pulses............"], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["The positive pulse width (PW) affects the duty cycle. The PW is the on-time (T ) of the signal."], "jumps": ["P1140", "P1120", "PW"]}, {"id": "P1140", "text": ["The time between two clock pulses is the pulse repetition time (PRT)..."], "jumps": ["P1150", "P1130", "PRT"]}, {"id": "P1150", "text": ["A duty cycle is the amount of time the circuit is operational during each cycle of the signal. In other words, it is the ratio between T and the PRT."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["To find the duty cycle, first measure the PRT. Second, measure the pulse width. Then divide the pulse width by the PRT and multiply by 100. The result is given as a percentage of PW to PRT."], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["When there is no on-time, the PW is 0 and therefore a duty cycle of 0%..."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["During a 0% duty cycle, there is no input to the motor and the motor will not rotate..."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["A point can be reached where the positive pulse width has increased in time and the circuit is on continuously. When the circuit is ON continuously it has a duty cycle of 100% and is known as circuit saturation..."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["During saturation, the output will not change with an increase in input voltage and nor will the motor speed increase."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Using a 100 mS PRT and a PW of 25 mS, the duty cycle is 25%."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["What is the duty cycle of a 160 mS signal with a pulse width of 104 mS???"], "jumps": ["P1210"]}, {"id": "P1221", "text": [], "jumps": []}, {"id": "P1222", "text": ["You did not multiply by 100 to provide the result as a percentage."], "jumps": []}, {"id": "P1223", "text": ["Remember, duty cycle is the ration of PW to PRT given as a percentage. The result will not be over 100%."], "jumps": []}, {"id": "P1230", "text": ["Any PWM circuit will alter the duty cycle of a repetitive waveform in proportion to an analog signal. IC circuits are generally used to perform this function."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["The PWM uses two timing circuits. The first is an Astable multivibrator. It is a free-running oscillator and generates the clock (trigger) signal."], "jumps": ["P1230", "P1250"]}, {"id": "P1250", "text": ["The second timing circuit is a monostable (one-shot) multivibrator and generates the PWM signal.", "To show the basic operation of a PWM circuit, IC1 is an astable multivibrator and IC2 is a monostable multivibrator.", "The internal equivalents of the 555 are shown to help visualize circuit action.", "The IC1 astable multivibrator is modified with D1 to generate a short duration negative pulse at the CLOCK output by reducing T time to the R x C values of the circuit.", "This short duration T pulse for IC1 is sent to the TRIG input of IC2 to force the PWM output HIGH on each (-) edge of the clock (trigger).", "At the instant IC2 output (pin 3) goes HIGH, the Q1 DISCHG transistor removes the short on C , allowing it to charge at the R x C rate.", "In the absence of a modulation input, C charges to 2/3 V and triggers the upper comparator."], "jumps": ["P1240", "P1260", "P1270", "P1250", "P1280", "P1290", "P1300", "P1310", "P1320"]}, {"id": "P1320", "text": ["The upper comparator causes the PWM output to go low and await another trigger pulse at pin 2 from the IC1 astable multivibrator.", "The values of R , R , C , R , and C must be selected such that duty cycle is approximately 50% for the condition of no modulation input.", "With a modulation input to IC2, the C capacitor must now charge to a voltage equal to ANALOG INPUT at the initiation of a monostable multivibrator action (time T )..."], "jumps": ["P1330", "P1300", "P1340", "P1350"]}, {"id": "P1350", "text": ["As the analog input increases or decreases, the time required to charge C increases or decreases, effectively altering the transition time of the IC2 monostable multivibrator."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["For proper pulse width modulation of IC2, the ANALOG INPUT should range from about 1/3 Vcc to 2/3 Vcc and may be scaled using proper voltage division, bias, and/or amplification prior to input at IC2 pin 5...", "The timing of the circuits is where the PWM output goes high on the (-) edge of the CLOCK signal and returns LOW at the instant CT2 charges to ANALOG INPUT (or 2/3 Vcc without an analog input)..."], "jumps": ["P1370", "P1340", "P1380", "Pv", "P"]}, {"id": "P1380", "text": ["Remember: The pulse width is determined by the amplitude of the DC input. The higher the DC level, the wider the pulses."], "jumps": ["P1370", "P1390"]}, {"id": "P1390", "text": ["The pulses generated by the pulse width modulator controls the speed of a motor by turning the motor on and off very quickly."], "jumps": ["P1380", "P1400"]}, {"id": "P1400", "text": ["Which multivibrator is free-running oscillator and generates the clock (or trigger) signal for a PWM?"], "jumps": ["P1390"]}, {"id": "P1401", "text": [], "jumps": []}, {"id": "P1402", "text": ["The monostable or one-shot multivibrator requires an input signal and is not a free-running oscillator."], "jumps": []}, {"id": "P1403", "text": ["The bistable multivibrator has two stable states and is not a free-running multivibrator."], "jumps": []}, {"id": "P1410", "text": ["Now let's look at the PWM amplifier (driver)..............."], "jumps": ["P1400", "P1420"]}, {"id": "P1420", "text": ["The output of a pulse width modulator does not meet the current carrying needs of motors."], "jumps": ["P1430", "P1410"]}, {"id": "P1430", "text": ["An amplifier/driver circuit is added to the output of the motor control PWM to increase the available current to drive a motor."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["When a motor needs to rotate in both directions, forward and reverse, a full-H (or bridge) driver is required."], "jumps": ["P1420", "P1450"]}, {"id": "P1450", "text": ["One type of PWM amplifier is an IC driver such as a dual or quadruple high-current half-H driver."], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Inputs into a pair of internal (half-H) drivers form a full-H reversible drive sufficient for motor applications."], "jumps": ["P1470", "P1450"]}, {"id": "P1470", "text": ["IC drivers often use two separate supply voltages to deliver more current to the output. V 1 is used to power the internal logic circuits.."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["V 2 is used for the output circuits to the motor.."], "jumps": ["P1490", "P1470"]}, {"id": "P1490", "text": ["The direction of rotation is set by a high input to one of the control inputs (1A or 2A)."], "jumps": ["P1470", "P1500"]}, {"id": "P1500", "text": ["Driver 1 (control input 1) is the counter-clockwise control input."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["Driver 2 (control input 2) is the clockwise control input."], "jumps": ["P1520", "P1490"]}, {"id": "P1520", "text": ["The driver pair (driver 1 and driver 2) is enabled with a high input to the (1,2 EN) input."], "jumps": ["P1530", "P1490"]}, {"id": "P1530", "text": ["The power to the motor is found on the driver pair output pins."], "jumps": ["P1490", "P1540"]}, {"id": "P1540", "text": ["The driver is energized when the PWM signal goes high, which enables V+ power to the output pins. This allows the motor to revolve in the direction established by the control inputs."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["What is needed between the PWM and a motor to increase the current to drive the motor?"], "jumps": ["P1540"]}, {"id": "P1551", "text": [], "jumps": []}, {"id": "P1552", "text": ["An astable multivibrator is a free-running oscillator that generates the clock (or trigger) signal."], "jumps": []}, {"id": "P1553", "text": ["A monostable (one-shot) multivibrator generates the PWM signal."], "jumps": []}, {"id": "P1554", "text": ["The output of the PWM does not have sufficient current carrying capabilities to drive a motor."], "jumps": []}, {"id": "P1560", "text": ["A low level positive DC signal produces short pulses, which rotates the motor slowly."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["A high level positive DC signal produces wide pulses, which rotates the motor very quickly."], "jumps": ["P1580", "P1560"]}, {"id": "P1580", "text": ["If the DC signal is sufficiently large, the end of one pulse combines with the next pulse and produces a constant DC signal output (100% duty cycle). When this occurs, motor rotates at maximum speed..."], "jumps": ["P1910", "P1560"]}, {"id": "P1910", "text": ["This completes the information on PULSE WIDTH MODULATION..."], "jumps": ["P1470", "P1001"]}, {"id": "P1920", "text": ["1. A trigger and a DC input are the two inputs to a pulse width modulator."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. A PWM generates a pulsed output according to the inputs."], "jumps": ["P1920", "P1940"]}, {"id": "P1940", "text": ["3. The PWM output varies in width, while amplitude remains fixed..."], "jumps": ["P1930", "P1950"]}, {"id": "P1950", "text": ["4. PWM amplification is used to increase the current capability to drive motors."], "jumps": ["P1940", "P1960"]}, {"id": "P1960", "text": ["5. The amplification circuit controls the rotational direction of the motor."], "jumps": ["P1950", "P1999"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1960", "P1001"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Your answers in this experiment may not match the anticipated answers exactly. This is due to inherent variations between motors and their associated circuitry...answers not match the anticipated answers exactly.ences. these differences along with test equipment differences. and trends during data analysis instead of trying to match the Answer Guide of another student's results.r student's results.student's results.Guide of another student's results... the Answer Guide of another student's results. results.", "The purpose of this experiment is to demonstrate the operation of a pulse width modulator and the amplifier/driver."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["Pick up PC130-178. This is a pulse width modulator motor controller.r."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["U3 is the Astable Multivibrator. It is a free-running oscillator that generates the clock (or trigger) signal."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["The output of the Astable Multivibrator (trigger input to the PWM) is found at TP4.4."], "jumps": ["P2060", "P2030"]}, {"id": "P2060", "text": ["U2 is the Monostable (one-shot) Multivibrator that generates the pulse width modulated (PWM) signal."], "jumps": ["P2070", "P2030", "PWM"]}, {"id": "P2070", "text": ["The DC level input is found at TP2 and the trigger input is found at TP4..."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The pulse width modulated signal (PWM output) is found at TP3."], "jumps": ["P2090", "P2060", "PWM"]}, {"id": "P2090", "text": ["Pick up PC130-179. This contains the DC motor amplifier/driver."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["U3 is the amplifier/driver found at the output of the motor control PWM to increase the available current to drive the motor. It also controls the motor's direction of rotation."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["The first input is the direction control input and is controlled by S2.2."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The second input is the PWM signal and can be found on the PC130-178 card at the PWM motor controller output."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["The output from the amplifier/driver to the motor is found at TP2 and TP3..."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["You will use the 130 test console as a DC power supply....."], "jumps": ["P2090", "P2150"]}, {"id": "P2150", "text": ["Set the test console controls to their initial control settings............"], "jumps": ["P2140"]}, {"id": "P2160", "text": ["Carefully insert PC130-178 into the PC2 position on the test console. Set S1 to ON and S2 to MOTOR. to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2150", "P2170", "P", "PP"]}, {"id": "P2170", "text": ["Carefully insert PC130-179 into the PC3 position on the test console. Set S1 to MOTOR and S2 to CCW.to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2160", "P2180"]}, {"id": "P2180", "text": ["Position the Model 170 Trainer in front of the Model 130 test console to facilitate the connection between the trainer and PC130-179."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["Connect the trainer's 8-pin ribbon cable accessory between the PC130-179 output (J1) on the test console and J1 on the trainer."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Set the Model 170 DC Motor Trainer controls to their initial control settings..."], "jumps": ["P2210", "P2190", "P"]}, {"id": "P2210", "text": ["Press enter to set: Positive Supply Voltage - 15 Negative Supply Voltage - 15 volts.."], "jumps": ["P2200", "P2220"]}, {"id": "P2220", "text": ["Press enter to set: PC2 DC Power - ON PC3 DC Power - ONNNswitch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2210", "P2230", "P"]}, {"id": "P2230", "text": ["1. CH1 and CH2 - Volt/Div - 2 - AC/DC/GND - DC 2. Display Mode - Dual (both) 3. Time/Div - 2 mSec 4. Triggering - Slope (-) - Coupling (AC) - Source (CH1) - Experiment Cards switch positions....", "Set the oscilloscope controls to the following settings:..."], "jumps": ["P2240", "P2220"]}, {"id": "P2240", "text": ["On PC130-178 connect CH1 X1 probe to view the negative triggers from the astable multivibrator."], "jumps": ["P2245", "P2230", "P2250"]}, {"id": "P2245", "text": ["Connect the CH1 probe to TP4 and the ground lead to TP8.4 and the ground lead to TP8."], "jumps": []}, {"id": "P2250", "text": ["Adjust the CH1 trace to the top of the screen and observe the negative trigger. These are the negative trigger inputs to the PWM generated by the clock IC (U3)."], "jumps": ["P2240", "P2252"]}, {"id": "P2252", "text": ["On PC130-178, connect the oscilloscope's CH2 probe to the PWM DC input at TP2. Ground the oscilloscope's CH2 lead at TP8. 8."], "jumps": ["P2260", "P2250"]}, {"id": "P2260", "text": ["Adjust the CH2 trace to the bottom of the screen..........."], "jumps": ["P2270", "P2250", "P"]}, {"id": "P2270", "text": ["Adjust the MOTOR SPEED control on the model 170 trainer between 0 and 100. Observe the DC level of the CH2 oscilloscope input. This display is the voltage from the MOTOR SPEED potentiometer and is amplified by U1 on PC130-178..."], "jumps": ["P2260", "P2280", "P", "PPVXJ", "PA"]}, {"id": "P2280", "text": ["On PC130-178, connect the oscilloscope's CH2 probe to the PWM signal from the output of U2 at TP3. Ground the oscilloscope's CH2 lead at TP8. ect the CH2 probe to TP3 and the ground lead to TP8...from the output of U2. Connect the CH2 probe to TP3 and the ground lead to TP8........"], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["On the Model 170 trainer, adjust MOTOR SPEED let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
