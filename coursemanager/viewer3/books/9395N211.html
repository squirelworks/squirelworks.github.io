const book = {"title": "9395N211", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: CONTROL INSTRUCTIONSsdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Understand the concepts of the control instructions. w Describe the operation of the control instructions.", "w Demonstrate the usage of control instructions using Allen Bradely APS software........", "w Demonstrate the usage of control instructions using Rockwell RSLOGIX software.........."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P310", "text": [], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": ["P", "P61"]}, {"id": "P400", "text": ["In this lesson, we will examine the control instructions that are a part of the PLC instruction set. Control instructions are very useful in big programs to reduce the number of redundant instructions in the code."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Control instructions allow code execution to go from ladder to ladder in different types of configurations. We will look at these different configurations and how they affect the ladder cycle."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["In the experiment, you will enter a ladder logic program that demonstrates the operation of the control instructions."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Let's begin the lesson on CONTROL INSTRUCTIONS............................"], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1040", "text": ["Control instructions are used in PLCs to change the location where instructions are being evaluated. This can be within the same ladder, or in a different ladder, depending on the instruction you use...."], "jumps": ["P1050", "P1001"]}, {"id": "P1050", "text": ["Before we look at the different control instructions available, let's discuss the pros and cons of using these types of instructions."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Often, you may want to repeat a small section of ladder logic in sections of your program. For example, after every step in a process, you might want a light to flash and an output to be sent to a terminal attached to the PLC..."], "jumps": ["P1070", "P1040"]}, {"id": "P1070", "text": ["Let's say there are 14 steps to your process, with 10 rungs of ladder logic required to turn on the light and send information to the terminal attached to the PLC."], "jumps": ["P1080", "P1040"]}, {"id": "P1080", "text": ["If you entered all of these rungs, over and over again, at the points they were needed, you would have 140 rungs in your code. Instead of typing these repeatedly, we add another ladder to our program..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["This new ladder requires a special control instruction at the beginning and end which makes our 10 lines now 12. Also, at each point where the code is needed, one rung is added to the main ladder logic code. This results in an additional 14 rungs....."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["The final total is only 26 rungs instead of 140. You can see that using this type of feature, normally referred to as a subroutine, is very beneficial in large programs, particularly in systems with memory constraints..."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["There are two important problem situations to avoid when using subroutines. The first is calling too many subroutines within subroutines; the second is not returning to the main ladder logic for output and input refreshing...reshing."], "jumps": ["P1120", "P1090"]}, {"id": "P1120", "text": ["Most PLCs allow subroutines within subroutines. However, there is normally a limit to the number of levels. For the PLC you are using, you can go 4 levels deep. In other words, the main ladder can call a subroutine that calls a subroutine that calls a subroutine that calls a subroutine..."], "jumps": ["P1130", "P1090"]}, {"id": "P1130", "text": ["To avoid the second problem situation, make sure the program eventually returns to the main ladder in order to update inputs and outputs on time. This problem occurs more with jumping than subroutines........"], "jumps": ["P1140", "P1090"]}, {"id": "P1140", "text": ["Jumping is the control ability to move to a different part of any ladder including the ladder that contains the instruction. Jumping requires a label at the location that you want to jump to."], "jumps": ["P1150", "P1090"]}, {"id": "P1150", "text": ["Now that you have a basic understanding of the important concepts of control instructions, let's examine the control instructions of the PLC in detail."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["The six instructions we will examine are listed in the table below. The instructions have been grouped into the sets that are used together to provide a control function."], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["This is the Jump to Label (JMP) instruction. It is used to change the current rung execution to a label numbered the same as the number you specify."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["For this instruction to work, the label must exist and have the same number you entered in the instruction. The range of number values is 0 to 999. Remember, when jumping, don't get stuck in an endless loop..."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["If you are stuck in an endless loop that doesn't allow the ladder logic program to cycle, the inputs and outputs will not be updated. This will cause your program to run incorrectly."], "jumps": ["P1200", "P1170"]}, {"id": "P1200", "text": ["This instruction is the Label (LBL) instruction. It is used with the Jump to Label instruction to allow a change in the point where instruction evaluation is taking place."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["This instruction requires a label number between 0 and 999 that corresponds to the same label number specified by the Jump to Label instruction. Again, be careful for infinite or endless loops."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["This instruction is the Jump to Subroutine (JSR) instruction. It is used to move code evaluation to another file in memory known as a subroutine. This is another file that contains a different ladder logic program with subroutine instructions.s."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The only parameter this instruction needs is the number of the file that you want to jump to. This value is between 3 and 255 and represents a ladder logic program you have entered."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["This instruction is the Subroutine (SBR) instruction. It requires no parameters and should be in the first rung of all subroutines."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["No information is needed because the Jump to Subroutine instruction knows from the file number where the subroutine resides."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["This instruction is the Return from Subroutine (RET) instruction. It is contained within a subroutine at the point where the subroutine has finished and evaluation should return to the main ladder logic program or another subroutine..."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["When this instruction is evaluated, the PLC begins evaluating code immediately following the Jump to Subroutine instruction that called this subroutine. The RET instruction has no required parameters..."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["Which instruction is used to jump to a subroutine?........."], "jumps": ["P1260"]}, {"id": "P1281", "text": [], "jumps": []}, {"id": "P1282", "text": ["Remember, the (J)ump to (S)ub(R)outine instruction is used to leave the main program and run a separate routine before returning to the main program."], "jumps": []}, {"id": "P1285", "text": ["The last instruction that we will look at is conceptually different than the other control instructions."], "jumps": ["P1290", "P1280"]}, {"id": "P1290", "text": ["This is the Master Control Reset (MCR) instruction. It requires no parameters and is used to enable or disable a section of rungs."], "jumps": ["P1300", "P1285"]}, {"id": "P1300", "text": ["If there are rungs in your ladder that should only be evaluated at specific times, this is the instruction you would use."], "jumps": ["P1310", "P1285"]}, {"id": "P1310", "text": ["Prior to the code you wish to control, the MCR instruction is inserted. The logic path before the instruction controls whether the ladder logic is evaluated after this point."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["At the end of the ladder logic code you want disabled, you add another MCR instruction by itself on a rung. You cannot put anything before the second MCR instruction."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["If you had an XIC instruction before the first MCR instruction, and that XIC instruction was looking at a push button switch attached to the inputs, the code after this point would only be evaluated if the button were pushed in..."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["The only thing you cannot do is assign a Jump to Label instruction to an MCR section. You wouldn't know if this section were enabled or disabled, and errors could result."], "jumps": ["P1350", "P1300"]}, {"id": "P1350", "text": ["How many MCR instructions are used together to provide a control operation?"], "jumps": ["P1300"]}, {"id": "P1351", "text": [], "jumps": []}, {"id": "P1352", "text": ["The Master Control Reset operation requires the use of two MCR instructions to enable and disable a section of code."], "jumps": []}, {"id": "P1370", "text": ["As you can see, the control instructions provide a method for optimizing ladder logic programs for speed and performance."], "jumps": ["P1380", "P1350"]}, {"id": "P1380", "text": ["As your familiarization with these instructions grows, you will tend use to them more and more to make your code smaller and modular. Modular means in smaller manageable pieces."], "jumps": ["P1910", "P1370"]}, {"id": "P1910", "text": ["This completes the information on CONTROL INSTRUCTIONS....."], "jumps": []}, {"id": "P1920", "text": ["1. The Jump to Label (JMP) instruction is used to move code evaluation from the current point to a point in the ladder logic where there is a corresponding label."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. The Label (LBL) instruction gives the location to which the Jump to Label instruction should move the code evaluation.LBL) instruction gives the location to which the Jump to Label instruction should move the code evaluation....................."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. The Jump to Subroutine (JSR) instruction is used to change the location of code evaluation to another ladder logic file."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. The Subroutine (SBR) instruction is used at the beginning of a file to indicate that the file is a subroutine."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. The Return from Subroutine (RET) instruction is used in a subroutine to indicate that you want to return to the location where the subroutine evaluation was started. Code evaluation begins after the JSR instruction that called the subroutine."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The Master Control Reset (MCR) instruction is used in pairs to enable or disable sections of code based on the logic path preceding the first MCR instruction."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2040", "text": ["In this experiment, we are going to program the PLC Trainer to use the control instructions you have learned."], "jumps": ["P2050", "P2001"]}, {"id": "P2050", "text": ["You must create a new processor program and make the appropriate configurations.", "1. Connect the 5050 interface cable between the Nida Model 5050 PLC Trainer and the computer which has the APS software.", "+\".S///'Q'QW(1/$R/'/,6SQQeeQaVQjRd/(QueQddQ/&R6RS/QR'QQ/&&-R/'//'/(QRQ'Sd/VRQ8aQQSQRj9QR/8SdQd8'6\"&/'\"/&''VQ'RSdaQkdeRaR/jdQ'Qa/'dmerd+R1dehjeeQdgredSdQVeedgRQhhfemjdearggdeddQ8=ldrvgjdaVemaedlebRhukgneaVagkhkefRR9l9lkljerkasrl/hjRljeQedd1dQZeVVaSaRRd6Q1Ie(RdR&,/,&.6RQ'R&\"'dd,Q.&Q/./'//Q6S.(daQ1SQRQRhd(/./a(/.RddaRVeQS1(QQ/'/Q/QQ(/djdS/IQ/QQQddQe10''Q$ddQQ',1/''QQ8/(aVQ(RQQQjg.VRd(Vd(/'(aQQd1mhrVIRldQdRraaRQeeerhaqeeaQerhRVmRefRRR8dehaYbmeerkdhehaheemQ/eredammredhheaaeefQd91RRftdbmRrrW1ReRQQR/RaYkgRddmdjRamQ(/8SdVVQeQa('/Q 'a/QRVV//#/Q"], "jumps": ["P2060", "P2040", "P2070", "PQ", "P", "P11HQeVQd1We8ddRQQRearhQRdeaVbfhhdddf", "P1"]}, {"id": "P2070", "text": ["2. Start the APS software by performing the following commands at the DOS prompt of the computer which has the APS software and is attached to the PLC Trainer. a. Type 'CD \\IPDS\\ATTACH\\SLC500' and press enter. b. Type 'APS' and press enter."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["If the software did not start, see your instructor for assistance. These instructions are for default installation of the APS software and may differ from your installation."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["3. Set up a new processor file and begin editing the ladder logic program. If you need help on configuring and setting up the PLC APS software, select the help button below."], "jumps": ["P2100", "P2080", "P2095"]}, {"id": "P2095", "text": ["1. From the main menu, select F4 [ OFFLINE CONFIG ] and then F6 [ CREATE FILE ]. Enter a file name and press enter. You must use a filename that does not already exist and only ten characters or less. Do not forget your file name. 2. Using the up and down arrow keys, adjust the PROCESSOR box until '1747-L20C/F 12-DC SNK 8-RLY' is highlighted by the cursor bar. Press F2 [ SELECT PROC ] to select this processor. 3. Now we will select the I/O modules attached to the PLC. Press F5 [ CONFIGR I/O ]. 4. Press F4 [ MODIFY RACKS ] and then F1 [ RACK 1 ]. Rack 1 is the backplane that the other two modules will attach to. Use the cursor bar and select '1746-A2 2-slot Backplane' and press enter. 5. Use the arrow keys to highlight '*1' (Slot 1) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-IG16 16-Input [ TTL ] (Sink) 5 VDC' and press F2 [ SELECT MODULE ]. 6. Use the arrow keys to highlight '*2' (Slot 2) with the cursor bar and press F5 [ MODIFY SLOT ]. Using the arrow keys again, highlight '1746-NI04V Analog Comb. 2 In & 2 Voltage Out' and press F2 [ SELECT MODULE ]. 7. Select F8 [ EXIT ] and F8 [ SAVE & EXIT ] and then F8 [ ACCEPT ]. 8. Press F3 [ OFFLINE PRG/DOC ] and then F1 [ PROCSSR FUNCTNS ]. We are going to change the name of our ladder logic file to be more descriptive of what it does. 9. Using the cursor bar, select File 2 and press F4 [ CHANGE FL. NAME] Enter 'S_TEST' and press return. The name should appear in the Name column for file 2. 10. We are now ready to edit the ladder program file. Using the arrow keys, highlight File 2 and press F8 [ MONITOR FILE ]. 11. To began editing, press F10 [ EDIT ].", "Follow these steps to set up the APS software for ladder logic program entry and evaluation:"], "jumps": []}, {"id": "P2100", "text": ["The programs shown below are the ladder logic programs you will enter to demonstrate the control instructions you learned in the first part of this lesson."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Before entering the program into the PLC APS software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it."], "jumps": ["P2120", "P2100"]}, {"id": "P2120", "text": ["The first program is the main ladder logic program. The first rung enables output LED 0 every time this rung is evaluated. The second rung contains an instruction to examine the slide switch input and the Master Control Reset instruction..."], "jumps": ["P2130", "P2100"]}, {"id": "P2130", "text": ["N) position, the logic path to the MCR instruction is false. This causes all codes between this MCR instruction and the nextMCR inst to be ignored. If the switch is in the left (OFF) position, the code will be evaluated.", "If the switch is in the right (ON) position, the logic path to the MCR instruction is false. This causes all codes between this MCR instruction and the next MCR instruction to be ignored. If the switch is in the left (OFF) position, the code will be evaluated."], "jumps": ["P2140", "P2100"]}, {"id": "P2140", "text": ["The next rung sets the LED 1 output to true when this rung is evaluated. This rung is only evaluated when the MCR instruction in the preceding logic path is true. This allows us to know if we are evaluating code inside the MCR block..."], "jumps": ["P2150", "P2100"]}, {"id": "P2150", "text": ["The next instruction is the closing MCR instruction. Remember, MCR instructions are used in pairs, and the second MCR instruction has no instructions preceding it in the rung."], "jumps": ["P2160", "P2100"]}, {"id": "P2160", "text": ["The last instruction of the main ladder jumps to the subroutine stored in file 4. When that subroutine finishes, it returns to the point just after the Jump to Subroutine instruction. This will be the point where the main cycle ends in this program..."], "jumps": ["P2170", "P2100"]}, {"id": "P2170", "text": ["The subroutine contains two rungs. The first rung contains the SBR subroutine instruction which just indicates that this is a subroutine. The second instruction in the first rung sets output LED 2 true. This allows us to know when the subroutine is being used..."], "jumps": ["P2180", "P2100"]}, {"id": "P2180", "text": ["The last instruction of the subroutine contains the Return from Subroutine (RET) instruction. As mentioned earlier, the RET instruction brings evaluation back to the ladder program that called the subroutine. Code evaluation resumes just after the instruction that called the subroutine..."], "jumps": ["P2190", "P2100"]}, {"id": "P2190", "text": ["As you can see, the LEDs will indicate which rungs of the ladder logic are being executed. Look at the code and try to predict what the output of this program will be."], "jumps": ["P2200", "P2100"]}, {"id": "P2200", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P2210", "P2100"]}, {"id": "P2210", "text": ["Each rung is presented in order for you to type it into the APS software. If you are having trouble, a help button will give you a list of steps for entering the instruction. Try to do as much as possible on your own..."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["4. Enter Rung 1 shown below..............................."], "jumps": ["P2230", "P2200", "P2225"]}, {"id": "P2225", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, OTE and then enter I:0/0. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2230", "text": ["5. Enter Rung 2 shown below..............................."], "jumps": ["P2240", "P2220", "P2235"]}, {"id": "P2235", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, XIC and then enter I:0/2. 3. Select CONTROL, MCR and enter. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2240", "text": ["6. Enter Rung 3 shown below..............................."], "jumps": ["P2250", "P2230", "P2245"]}, {"id": "P2245", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, BIT, OTE and then enter O:0/1. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2250", "text": ["7. Enter Rung 4 shown below..............................."], "jumps": ["P2260", "P2240", "P2255"]}, {"id": "P2255", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, CONTROL, and then MCR. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2260", "text": ["8. Enter Rung 5 shown below..............................."], "jumps": ["P2270", "P2250", "P2265"]}, {"id": "P2265", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, CONTROL, JSR and then enter 4. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2270", "text": ["The first ladder logic program is entered. Now, we need to create and edit the subroutine ladder logic program file."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["9. Press ESC, F3 [EXIT] and F1 [PROCSSR FUNCTNS]. 10. Press F6 [CREATE FILE], 4 and ENTER. 11. Press ESC, use the arrows keys to highlight file 4, and press F8 [MONITOR FILE]. 12. Press F10."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["You are now in the subroutine ladder logic program file. Enter the instructions for the subroutine file in the same manner as you entered instructions in the main ladder program."], "jumps": ["P2300", "P2280"]}, {"id": "P2300", "text": ["13. Enter Rung 1 shown below.............................."], "jumps": ["P2310", "P2290", "P2305"]}, {"id": "P2305", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, CONTROL, SBR. 3. Select BIT, OTE and enter O:0/2. 4. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2310", "text": ["14. Enter Rung 2 shown below.............................."], "jumps": ["P2320", "P2300", "P2315"]}, {"id": "P2315", "text": ["1. Highlight END rung and select INSERT RUNG. 2. Select INSERT INSTR, CONTROL and RET. 3. Press ESC and ACCEPT RUNG."], "jumps": []}, {"id": "P2320", "text": ["Now that we have finished entering the programs, we need to load them into the PLC to test the program and subroutine. Make sure the last rung has been accepted.."], "jumps": ["P2330", "P2310"]}, {"id": "P2330", "text": ["15. Set the PLC Trainer to the initial control settings...", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2320"]}, {"id": "P2335", "text": ["INITIAL CONTROL SETTING - Main Power ON, DC Power ON, Monitor ON, Process Selector OFF, +DC Voltage Select 5V, PC1 & PC2 Power OFF."], "jumps": []}, {"id": "P2340", "text": ["16. Place the PC5050-1 card in the PC1 position. 17. Set the power slide switch to the OFF (left) position."], "jumps": ["P2350", "P2330"]}, {"id": "P2350", "text": ["18. Set the PLC Trainer controls as follows:..............", "+DC Voltage Select 24V PC1 Power ON ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2340", "P2355"]}, {"id": "P2355", "text": ["PLC TRAINER CONTROLS - Turn the +DC Voltage Select dial fully CW to the 24V position. Push the PC1 Power switch up to the ON position."], "jumps": []}, {"id": "P2390", "text": ["The trainer is now set and ready to receive the program...."], "jumps": ["P2400", "P2350"]}, {"id": "P2400", "text": ["19. Press F1 [SAVE/GO ONLINE]. If the file exists, you will be asked if you would like to overwrite it. Press F8 [YES]. If the processor is not in program mode, the APS software will ask you if it can switch to that mode. Press F8 [YES]."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["20. Once the program has been sent, the APS software will ask you if you would like to switch to run mode. Again, press F8 [YES]."], "jumps": ["P2420", "P2400"]}, {"id": "P2420", "text": ["The program you have entered is now running. The slide switch should be in the left position, disabling the code between the MCR instructions. Only LED 0 and 2 should be on, indicating the main code and subroutine are being evaluated..."], "jumps": ["P2430", "P2410"]}, {"id": "P2430", "text": ["Now switch the slide switch to the ON position (right). LED 1 should now be illuminated. By creating a true logic path to the first MCR instruction, we cause the rungs between the MCR instruction pair to be evaluated........................."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["This completes the demonstration of the control instructions. Feel free to create your own ladder logic and enter it into the APS software. It is easier to write your logic on paper first and then enter it into the software..."], "jumps": ["P2450", "P2420"]}, {"id": "P2450", "text": ["If you want to edit your program, select EDIT and edit DISK PROGRAM. Then follow the same steps to send the program to the PLC Trainer. The inputs and outputs are listed below.", "I :0/0 Start Switch O :0/0 Led 0 O :0/4 Led 4 I :0/1 Stop Switch O :0/1 Led 1 O :0/5 Led 5 I :0/2 Power Switch O :0/2 Led 2 O :0/6 Led 6 O :0/3 Led 3 O :0/7 Led 74"], "jumps": ["P2460", "P2420"]}, {"id": "P2460", "text": ["21. Press F3 [EXIT] or ESC and then F3 depending on where you left off in the APS software. Now select F3 [RETURN TO MENU] and then F10 [EXIT SYSTEM]."], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["22. Return the PLC Trainer to the initial control settings.", "Main Power ON DC Power ON Monitor ON Process Selector OFF +DC Voltage Select 5V PC1 & PC2 Power OFFF"], "jumps": ["P2460"]}, {"id": "P2480", "text": ["23. Turn OFF the PLC Trainer's main power switch.........."], "jumps": ["P2470"]}, {"id": "P2490", "text": ["24. Return all PC cards and test equipment to their proper storage location."], "jumps": ["P2910", "P2480"]}, {"id": "P2910", "text": ["This completes the experiment on CONTROL INSTRUCTIONS......"], "jumps": ["P2001", "P2490"]}, {"id": "P3001", "text": [], "jumps": []}, {"id": "P3020", "text": ["In this experiment, you will program the PLC Trainer to use the control instructions that you have learned."], "jumps": ["P3030", "P3001"]}, {"id": "P3030", "text": ["You must create a new processor program and make the appropriate configurations."], "jumps": ["P3020"]}, {"id": "P3040", "text": ["1. Ensure the 5050 interface cable is connected between the Nida Model 5050 PLC Trainer and the computer which has the RSLinx and RSLogix software..."], "jumps": ["P3020"]}, {"id": "P3050", "text": ["2. Turn on the 5050 PLC Trainer..........................."], "jumps": ["P3040"]}, {"id": "P3060", "text": ["3. Start and set up the RSLinx communication software. If you need help on configuring and setting up the RSLinx software, select the help button below.."], "jumps": ["P3050", "P3065"]}, {"id": "P3065", "text": ["Follow these steps to set up the RSLogix software for ladder logic program entry and evaluation: as the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon. 3. Make sure that the PLC icon does not have a red X over it. If a red X is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button.................................................assistance. 4. Click on the minimize button.", "1. Start the RSLinx communication software by double-clicking the RSLinx icon on the computer that has the RSLinx software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Now we need to know if the computer and PLC Trainer are communicating. In the right window, double-click on the AB_PIC-1 DH-485 icon. 3. Make sure that the PLC icon does not have a red X over it. If a red X is present, make sure the PLC Trainer is turned on and connected. If the PLC is still not active, see your instructor for assistance. 4. Click on the minimize button..."], "jumps": []}, {"id": "P3070", "text": ["4. Start the RSLogix software and set up a new processor file. If you have trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own."], "jumps": ["P3060", "P3075"]}, {"id": "P3075", "text": ["Follow these steps to start RSLogix and set up a new processor file: the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select proce t-hand corner of the I/O configuration window. 16. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3076", "text": ["Follow these steps to start RSLogix and set up a new processor file: 1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" modu r section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3077", "text": ["Follow these steps to start RSLogix and set up a new processor file: 1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "11. Double-click on the 1746-IG16 16-Input (TTL-SOURCE) 5VDC module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the 1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window.the #2 slot of the PLC. 15. Save the configuration settings by clicking on the I/O configuration lose button. This button is the X in top right-hand corner of the I/O configuration window. 16. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3078", "text": ["Follow these steps to start RSLogix and set up a new processor file: 1. Start the RSLogix software by double-clicking on the RSLogix icon on the computer, which has the RSLogix software and is attached to the PLC Trainer. If the software did not start, see your instructor for assistance. 2. Click on the maximize button. 3. From the standard toolbar, click on the NEW icon. 4. Enter a file name in the processor name text box. You must choose a name that does not already exist and is less than ten characters in length. Do not forget this file name. 5. Select the PLC type and the different I/O modules that we have attached to the system. In the case of the Nida PLC Trainer, there are two extra modules: a TTL module and an analog module. 6. At the bottom of the select processor type window, AB_PIC-1 should be displayed in the driver text box. If not displayed, click on the down-arrow and select AB_PIC-1. 7. Using the listbox scroll bar arrows, scroll until \"1747-L20C/F 12-DC SNK In, 8-RLY Out\" is displayed. Click on this PLC processor and then click on OK. 8. The project window (left) and the ladder window (right) will appear. LAD2 should be displayed in the ladder window title bar. 9. Select the I/O modules attached to the PLC. In the project window, double-click on I/O configuration (in the controller folder). 10. The I/O configuration window appears and contains two windows. In the left window, slot zero should contain 1747-20C/F 12-DC SNK In, 8-RLY Out, and slot #1 is highlighted. Make sure slot #1 is highlighted. 11. Double-click on the \"1746-IG16 16-Input (TTL-SOURCE) 5VDC\" module name to transfer the module information to the left window for the #1 slot of the PLC. 12. Double click on the \"1746-NIO4V Analog 2 Ch In/2 Ch Voltage Out\" module name to transfer the module information to the left window for the #2 slot of the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the \"X\" in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the \"end\" ladder in the ladder window.", "15. Save the configuration settings by clicking on the I/O configuration lose button. This button is the X in top right-hand corner of the I/O configuration window. 16. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window..f the PLC. 13. Save the configuration settings by clicking on the I/O configuration close button. This button is the X in top right-hand corner of the I/O configuration window. 14. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window.the #2 slot of the PLC. 15. Save the configuration settings by clicking on the I/O configuration lose button. This button is the X in top right-hand corner of the I/O configuration window. 16. The processor section of your file is complete. You are now at the main window and should see the end ladder in the ladder window."], "jumps": []}, {"id": "P3080", "text": ["The programs shown below are the ladder logic programs you will enter to demonstrate the control instructions you learned in the first part of this lesson.."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["Before entering the program into the PLC RSLogix software, let's look at what the program should do. This will help us understand if the program is operating properly when we test it."], "jumps": ["P3080"]}, {"id": "P3100", "text": ["The first program is the main ladder logic program. The first rung enables output LED 0 every time this rung is evaluated. The second rung contains an instruction to examine the slide switch input and the Master Control Reset instruction..."], "jumps": ["P3080"]}, {"id": "P3110", "text": ["If the switch is in the right (ON) position, the logic path to the MCR instruction is false. This causes all codes between this MCR instruction and the next MCR instruction to be ignored. If the switch is in the left (OFF) position, the code will be evaluated..."], "jumps": ["P3080"]}, {"id": "P3120", "text": ["The next rung sets the LED 1 output to true when this rung is evaluated. This rung is only evaluated when the MCR instruction in the preceding logic path is true. This allows us to know if we are evaluating code inside the MCR block..."], "jumps": ["P3080"]}, {"id": "P3130", "text": ["The next instruction is the closing MCR instruction. Remember, MCR instructions are used in pairs, and the second MCR instruction has no instructions preceding it in the rung."], "jumps": ["P3080"]}, {"id": "P3140", "text": ["The last instruction of the main ladder jumps to the subroutine stored in file 4. When that subroutine finishes, it returns to the point just after the Jump to Subroutine instruction. This will be the point where the main cycle ends in this program..."], "jumps": ["P3150", "P3080"]}, {"id": "P3150", "text": ["The subroutine contains two rungs. The first rung contains the SBR subroutine instruction, which indicates that this is a subroutine. The second instruction in the first rung sets output LED 2 true. This allows us to know when the subroutine is being used..."], "jumps": ["P3160", "P3080"]}, {"id": "P3160", "text": ["The last instruction of the subroutine contains the Return from Subroutine (RET) instruction. As mentioned earlier, the RET instruction brings evaluation back to the ladder program that called the subroutine. Code evaluation resumes just after the instruction that called the subroutine.e"], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["As you can see, the LEDs will indicate which rungs of the ladder logic are being executed. Look at the code and try to predict what the output of this program will be."], "jumps": ["P3180", "P3150"]}, {"id": "P3180", "text": ["Let's enter the ladder logic program......................."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["Each rung is presented in order for you to type it into the RSLogix software. If you have trouble, a help button will give you a list of steps for entering the instructions. Try to do as much as possible on your own..."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["5. Enter rung 1 shown below..............................."], "jumps": ["P3210", "P3180", "P3205"]}, {"id": "P3205", "text": ["RUNG 1rung. Highlight the number to the left of the end rung to select the end rung. Click on the user tab. Click on the new rung icon. 2. Add an OTE instruction. Click on the bit tab and then click on the OTE icon. Type O:0/0 and press < let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
