const book = {"title": "9395B101", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: COMMUNICATION AND SIGNAL PROCESSINGdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: COMMUNICATION AND SIGNAL PROCESSINGdf asdf sadf"], "jumps": []}, {"id": "P100", "text": ["w Describe the basic elements that compose a communications system. w State the two fundamental limiting factors in a communication system.", "w Describe the basic differences between analog and digital signals. w Describe signal processing. w Identify various signal processing techniques."], "jumps": []}, {"id": "P300", "text": ["In this lesson, you are introduced to the concept of communication systems and signal processing."], "jumps": ["P300", "P410"]}, {"id": "P410", "text": ["Communication systems convey information (voice, music, video, code) from one point to another."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Every time you turn on a radio or television set, you are using a communication system."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Signal processing is how the information is changed from one form to another in communication systems."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Even a small hand held radio uses signal processing. The signals in the air must be changed to audio signals."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["However, before you perform your first laboratory experiment in signal processing, you need to know some safety rules."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's begin the lesson on COMMUNICATION AND SIGNAL PROCESSING."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["This course teaches signal processing.  Since all communication systems use signal processing, let's discuss a basic communication system.", "This course teaches signal processing. Since all communication systems use signal processing, let's discuss a basic communication system."], "jumps": ["P1025", "P1001"]}, {"id": "P1025", "text": ["A communication system conveys information, or intelligence, from a source to a destination."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["All communication systems consist of a transmitter, transmission medium and a receiver."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Let's discuss the transmitter first."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["The purpose of the transmitter is to convert Input Information to an electrical signal or an electromagnetic wave - signal processing.", "For example, a telephone changes your voice to voltage levels that are suitable for sending over wires."], "jumps": ["P1060", "P1020", "P1070", "P1050"]}, {"id": "P1070", "text": ["A radio station changes music from tapes or records to electromagnetic waves that are suitable for sending over the air    ways.", "A radio station changes music from tapes or records to electromagnetic waves that are suitable for sending over the air ways."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The operation of the transmitter depends on what type of information is going to be sent."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["How information is sent also effects transmitter operation."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Remember, the transmitter in a communication system processes the input information to a form that can be sent or transmitted."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["The output of the transmitter is fed to the Transmission Medium."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["The Transmission Medium is how the distance between the transmitter and receiver is bridged. There is no signal processing."], "jumps": ["P1130", "P1100"]}, {"id": "P1130", "text": ["There are several different types of transmission medium, for example:", "The atmosphere is also a medium.", "The atmosphere is also a medium............................"], "jumps": ["P1140", "P1100", "P1150", "P1130"]}, {"id": "P1150", "text": ["Fiber optics is a type of medium that allows light waves to be transmitted and received.", "Fiber optics is a type of medium that allows light waves to be transmitted and received...e transmitted and received."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Remember, the Transmission Medium allows the information to flow from the transmitter to the receiver."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["The receiver intercepts electrical signals or electromagnetic waves and changes them to Output Information - signal processing."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["An important characteristic of a receiver is that the received signals are converted back to the original transmitter input signals.", "For example, a telephone changes the voltage levels from the wires to voice or audio."], "jumps": ["P1190", "P1160", "P1200"]}, {"id": "P1200", "text": ["A radio in your home changes received electromagnetic waves into music."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["The operation of the receiver depends on how information is sent."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["The type of information also effects receiver operation.", "The type of information also effects receiver operation...."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Remember, the receiver in a communication system changes received electrical signals or electromagnetic waves to a form that is identical to the information transmitted."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["What part of a communication system connects the transmitter to the receiver?"], "jumps": ["P1230"]}, {"id": "P1241", "text": [], "jumps": []}, {"id": "P1242", "text": ["The transmitter in a communication system changes input information to signals that are suitable for transmission."], "jumps": []}, {"id": "P1244", "text": ["The receiver in a communication system changes the received signals to signals that can be used, output information."], "jumps": []}, {"id": "P1250", "text": ["What part of a communication system changes input information to electrical signals or electromagnetic waves?"], "jumps": ["P1240"]}, {"id": "P1251", "text": [], "jumps": []}, {"id": "P1252", "text": ["The Transmission Medium in a communication system connects the transmitter to the receiver by using wires, air or fiber optics."], "jumps": []}, {"id": "P1253", "text": ["The receiver in a communication system changes the received signals to signals that can be used, output information."], "jumps": []}, {"id": "P1260", "text": ["Which part of a communication system requires no signal processing?"], "jumps": ["P1250"]}, {"id": "P1261", "text": [], "jumps": []}, {"id": "P1262", "text": ["The transmitter in a communication system changes input information to signals that are suitable for transmission - signal processing."], "jumps": []}, {"id": "P1263", "text": ["The receiver in a communication system changes the received signals to signals that can be used, output information - signal processing."], "jumps": []}, {"id": "P1270", "text": ["Now that you are familiar with a basic communication system, let's look at two limitations.", "BANDWIDTH NOISE"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The first limitation is bandwidth, which is the information carrying capacity of the system."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["All communication circuits contain components that are frequency sensitive."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["The reactance or frequency cut off points of these components limit the range of frequencies that pass through communication circuits."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["In other words, communication circuits can only operate in a certain range of frequencies.  The range is the bandwidth of the circuit or system.", "In other words, communication circuits can only operate in a certain range of frequencies. The range is the bandwidth of the circuit or system."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["The information, or intelligence, which is processed by a communication system must be in the bandwidth of the communication circuits."], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["This limits the amount or type of information that a communication system can process."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["For example, the range of frequencies that your voice produces is between approximately 40 and 4,000 Hz - a bandwidth of \n4 kHz.", "For example, the range of frequencies that your voice produces is between approximately 40 and 4,000 Hz - a bandwidth of 4 kHz."], "jumps": ["P1350", "P1320"]}, {"id": "P1350", "text": ["Consequently, early telephone communication systems were designed to operate in a bandwidth of 4 kHz.", "However, when computer systems started to use telephone systems to communicate, problems arose because of limited bandwidth."], "jumps": ["P1360", "P1340", "P1370", "P1350"]}, {"id": "P1370", "text": ["The information being sent from one computer to another used higher frequencies, so a bigger bandwidth was needed."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Communication system bandwidths can also distort some information signals."], "jumps": ["P1390", "P1360"]}, {"id": "P1390", "text": ["For example, the bandwidth of a communication system that processes square waves must be large enough to include the odd harmonics of the fundamental frequency."], "jumps": ["P1400", "P1380"]}, {"id": "P1400", "text": ["If not, then distortion of the information signal, square wave, occurs."], "jumps": ["P1410", "P1380"]}, {"id": "P1410", "text": ["Take a look at this complex analog signal.", "Take a look at this complex analog signal.................."], "jumps": ["P1420", "P1380"]}, {"id": "P1420", "text": ["If analyzed with a spectrum analyzer into individual components, the signal may contain many different frequencies and amplitudes."], "jumps": ["P1430", "P1410"]}, {"id": "P1422", "text": ["If analyzed with a spectrum analyzer into individual components, the signal may contain many different frequencies and amplitudes."], "jumps": ["P1430", "P1410"]}, {"id": "P1425", "text": ["SPECTRUM ANALYZER - A spectrum analyzer is a piece of test equipment that breaks down a complex waveform into individual components of frequency and amplitude."], "jumps": ["P1426", "P1422"]}, {"id": "P1426", "text": ["It is used to determine the signal bandwidth. This check will ensure that a particular system can handle the signal."], "jumps": ["P1422", "P1425"]}, {"id": "P1430", "text": ["To process this signal correctly, the communication system must have a bandwidth of around 30 kHz so all the component frequencies will pass."], "jumps": ["P1440", "P1422"]}, {"id": "P1440", "text": ["What must the bandwidth be if the information signals contain frequencies of .4, 5, 12, 14, and 15 kHz?"], "jumps": ["P1422"]}, {"id": "P1441", "text": [], "jumps": []}, {"id": "P1442", "text": [".4 kHz is the lowest frequency, a bandwidth of .4 kHz would eliminate the higher frequencies and the information would not pass."], "jumps": []}, {"id": "P1443", "text": ["13 kHz may work since the information's highest frequency is\n15 kHz. However there may be distortion or information loss.  A 13 kHz bandwidth is not quite enough.", "13 kHz may work since the information's highest frequency is 15 kHz. However there may be distortion or information loss. A 13 kHz bandwidth is not quite enough."], "jumps": []}, {"id": "P1450", "text": ["What term best describes the information capacity of a communication system?"], "jumps": ["P1440"]}, {"id": "P1451", "text": [], "jumps": []}, {"id": "P1452", "text": ["Spectrum is the composition of a signal. The spectrum of a signal is the sum of all individual frequencies and amplitudes."], "jumps": []}, {"id": "P1453", "text": ["A medium may limit the capacity of a communication system, but it is not the term used to describe the capacity.", "Fiber Optic Cable (Transmission Medium)"], "jumps": []}, {"id": "P1460", "text": ["The second limiting factor of a communication system is noise.", "Try communicating to a friend at a rock concert!", "Seriously though, there are many types of noise that effect a communications system such as:", "Try communicating to a friend at a rock concert!..........."], "jumps": ["P1470", "P1450", "P1480", "P1460", "P1490"]}, {"id": "P1490", "text": ["If the noise signals in a communication system are larger than the information signals, the information is lost."], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["The quality of a communication system is measured by its signal to noise ratio or S/N ratio."], "jumps": ["P1510", "P1490"]}, {"id": "P1510", "text": ["The S/N ratio value is normally expressed in decibels (dB)."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Noise can be reduced or eliminated in communications systems by:", "Noise can be reduced or eliminated in communications systems by: Graphic: Increasing Power Out Electronic Filters Shielding of Equipment", "Increasing Power Out Electronic Filters Shielding of Equipment"], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["However, one type of noise is always present, thermal noise."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Thermal noise is caused by temperature variations in electronic components."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["At any temperature above absolute zero, electrons exhibit random motion."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["The random motion results in the generation of voltages or currents which cause noise."], "jumps": ["P1570", "P1530"]}, {"id": "P1570", "text": ["No matter how carefully designed, all communication systems exhibit noise."], "jumps": ["P1580", "P1530"]}, {"id": "P1580", "text": ["When the signal power is less than the noise power, the information is lost.   Noise is a limitation in a communication system.", "When the signal power is less than the noise power, the information is lost. Noise is a limitation in a communication system."], "jumps": ["P1590", "P1570"]}, {"id": "P1590", "text": ["Communication circuits can eliminate all noise in a system."], "jumps": ["P1570"]}, {"id": "P1591", "text": [], "jumps": []}, {"id": "P1592", "text": ["Communication circuits can be designed to reduce or eliminate some types of noise but not all. Thermal noise can not be eliminated, it is due to the communication circuits themselves."], "jumps": []}, {"id": "P1600", "text": ["What is S/N ratio and what is it equal to?", "What is S/N ratio and what is it equal to?.................", "Noise to Signal ratio, noise power divided by signal power", "Signal to Noise ratio, signal power divided by noise power"], "jumps": ["P1590"]}, {"id": "P1601", "text": [], "jumps": []}, {"id": "P1602", "text": ["S/N is the Signal to Noise ratio and is equal to the signal power divided by the noise power."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on COMMUNICATION SYSTEMS.", "This completes the information on COMMUNICATION SYSTEMS...."], "jumps": ["P1001", "P1600"]}, {"id": "P1920", "text": ["1.  Communication systems convey information, or intelligence,          from a source to a destination.", "1. Communication systems convey information, or intelligence, from a source to a destination."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A communication system consists of a transmitter,                            transmission medium and a receiver.", "2. A communication system consists of a transmitter, transmission medium and a receiver."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  The transmitter converts Input Information into an electrical            signal or an electromagnetic wave - signal processing.", "3. The transmitter converts Input Information into an electrical signal or an electromagnetic wave - signal processing."], "jumps": ["P1950", "P1920"]}, {"id": "P1950", "text": ["4.  The transmission medium is how the distance between                    transmitter and receiver is bridged.  There is no signal                      processing.", "4. The transmission medium is how the distance between transmitter and receiver is bridged. There is no signal processing."], "jumps": ["P1960", "P1920"]}, {"id": "P1960", "text": ["5.  The receiver intercepts electrical signals or electromagnetic            waves and changes them to Output Information - signal                   processing.", "5. The receiver intercepts electrical signals or electromagnetic waves and changes them to Output Information - signal processing."], "jumps": ["P1970", "P1920"]}, {"id": "P1970", "text": ["6.  There are two limiting factors in communication systems.", "6. There are two limiting factors in communication systems."], "jumps": ["P1980", "P1920"]}, {"id": "P1980", "text": ["7.  The quality of a system is measured using the Signal to Noise        ratio.", "7. The quality of a system is measured using the Signal to Noise ratio."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Thermal Noise is caused by the random motion of electrons           due to temperature variations in electronic circuits.", "8. Thermal Noise is caused by the random motion of electrons due to temperature variations in electronic circuits."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1990"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["Signal processing is accomplished on two general types of signals in communication systems."], "jumps": ["P2025", "P2001"]}, {"id": "P2025", "text": ["The analog signal varies continuously with time.", "Examples of analog devices are:", "Examples of analog devices are:............................"], "jumps": ["P2030", "P2020", "P2040"]}, {"id": "P2040", "text": ["In communication systems, the quality of an analog signal is measured by its signal to noise ratio, S/N ratio."], "jumps": ["P2050", "P2030"]}, {"id": "P2050", "text": ["A digital signal is a set of discrete elements.", "A digital signal is a set of discrete elements............."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["A series of highs and lows represent information.", "Examples of equipment that use digital signals are:", "A series of highs and lows represent information...........", "Examples of equipment that use digital signals are:........"], "jumps": ["P2070", "P2050", "P2080", "P2060"]}, {"id": "P2080", "text": ["In communication systems, the quality of a digital signal is measured by its bit error rate (BER).", "In communication systems, the quality of a digital signal is measured by its bit error rate (BER). s the inverse of the error probability."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["BER is the average number of bits transmitted in error.", "BER is the average number of bits transmitted in error.....l be received....."], "jumps": ["P2100", "P2080"]}, {"id": "P2100", "text": ["A BER of 10-6 in digital voice communications and 10-9 in computer data are acceptable.", "A BER of 10-6 in digital voice communications and 10-9 in computer data are acceptable.."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["Touch the digital signal.", "Touch the digital signal.is typed.........................."], "jumps": ["P2080"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["You touched an analog signal that continuously varies with time."], "jumps": []}, {"id": "P2113", "text": ["You touched an analog signal.  It may appear as digital however, looking closely you will see that the signal is not two discrete levels.", "You touched an analog signal. It may appear as digital however, looking closely you will see that the signal is not two discrete levels."], "jumps": []}, {"id": "P2120", "text": ["The quality of digital signals is measured in _______", "The quality of digital signals is measured in _______......"], "jumps": ["P2110"]}, {"id": "P2121", "text": [], "jumps": []}, {"id": "P2122", "text": ["The signal to noise ratio measures the quality of an analog signal."], "jumps": []}, {"id": "P2123", "text": ["The bandwidth is a measure of the information handling capacity."], "jumps": []}, {"id": "P2130", "text": ["You have heard the word \"Signal Processing\" and probably have a general idea of what it is by now."], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Technically, signal processing is the alteration of a signal in order to accomplish effective, efficient and reliable transmission   and reception.", "Technically, signal processing is the alteration of a signal in order to accomplish effective, efficient and reliable transmission and reception."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Signal processing includes:", "Signal processing includes:raphic:Amplification Filtering Reshaping Modulation & demodulation Multiplexing & demultiplexing", "Amplification Filtering Reshaping Modulation & demodulation Multiplexing & demultiplexing"], "jumps": ["P2160", "P2130"]}, {"id": "P2160", "text": ["Amplification increases signals to a usable level for other signal processing and compensates for attenuation through the transmission medium."], "jumps": ["P2190", "P2150"]}, {"id": "P2190", "text": ["Filtering of signals is used to reduce noise and to separate various signals from one another."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["Reshaping of signals correct any pulse spreading or distortion of the information.", "Modulation, demodulation and multiplexing, demultiplexing are different ways to combine and separate transmitted signals."], "jumps": ["P2230", "P2190", "P2240", "P2210"]}, {"id": "P2240", "text": ["What is the operation of changing signals to accomplish effective, efficient and reliable transmission and reception?"], "jumps": ["P2230"]}, {"id": "P2241", "text": [], "jumps": []}, {"id": "P2242", "text": ["Amplification is only part of the process for accomplishing effective, efficient and reliable transmission and reception."], "jumps": []}, {"id": "P2243", "text": ["Modulation is only part of the process for accomplishing effective, efficient and reliable transmission and reception."], "jumps": []}, {"id": "P2250", "text": ["Let's briefly discuss Modulation and Demodulation.", "Let's briefly discuss Modulation and Demodulation.........."], "jumps": ["P2270", "P2240"]}, {"id": "P2270", "text": ["Modulation is a method of combining two different signals and is used in the transmitter section of a communication system."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["Demodulation is the separating of the two signals and is used in the receiver section of a communication system."], "jumps": ["P2290", "P2250"]}, {"id": "P2290", "text": ["One of the two signals is the modulation or intelligence signal.  It is called the modulating signal.", "One of the two signals is the modulation or intelligence signal. It is called the modulating signal."], "jumps": ["P2300", "P2250"]}, {"id": "P2300", "text": ["The other signal is called a Carrier signal.  It is used to carry the modulating signal through the transmission medium to the receiver.", "The other signal is called a Carrier signal. It is used to carry the modulating signal through the transmission medium to the receiver."], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["The modulator circuit combines the two signals in the transmitter section of a communication system.   A demodulator separates the signals in the receiver.", "The modulator circuit combines the two signals in the transmitter section of a communication system. A demodulator separates the signals in the receiver."], "jumps": ["P2320", "P2290"]}, {"id": "P2320", "text": ["Modulator and demodulator circuits combine and separate signals in four basic ways.", "Modulator and demodulator circuits combine and separate signals in four basic ways. Graphic:Amplitude Frequency Phase Pulse", "Amplitude Frequency Phase Pulse dulation & demodulation Multiplexing & demultiplexing"], "jumps": ["P2330", "P2290"]}, {"id": "P2330", "text": ["Sometimes Frequency and Phase Modulation are grouped together and are called Angle modulation."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["When the modulation signal is used to change the carrier signal's amplitude it is called amplitude modulation, AM for short. This is where AM radio got its name."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["When the modulation signal is used to change the frequency of the carrier signal according to the information signal amplitude it is called frequency modulation, FM for short.  This is where FM radio got its name.", "When the modulation signal is used to change the frequency of the carrier signal according to the information signal amplitude it is called frequency modulation, FM for short. This is where FM radio got its name."], "jumps": ["P2360", "P2340"]}, {"id": "P2360", "text": ["Phase modulation, called PM for short, changes the phase angle of the carrier signal as a function of the modulation signal.   It is hard to show a signal that has phase modulation without showing frequency modulation.  The phase changes in relation to the intelligence.", "Phase modulation, called PM for short, changes the phase angle of the carrier signal as a function of the modulation signal. It is hard to show a signal that has phase modulation without showing frequency modulation. The phase changes in relation to the intelligence."], "jumps": ["P2370", "P2340"]}, {"id": "P2390", "text": ["Notice the FM signal has the greatest frequency change at T1 and T3.  This is when the modulating signal is peaked positive and negative.", "Notice the FM signal has the greatest frequency change at T1 and T3. This is when the modulating signal is peaked positive and negative."], "jumps": ["P2400", "P2370"]}, {"id": "PINFO", "text": ["The difference between FM and PM is slight.", "07-29-99 Converted to new question format. ja 4-02 Converted to Phase II format. jay 02-06-02 Checked for convertion errors John Ayala 03-25-02 P10001, 10002, 10003, 10004 changed script so that test questions for experiments can be disregarded. -Penny 04-30-02 Review - lisa 08-06-03 P2370, changed FM and PM waveforms to depict correct frequency changes at appropriate time intervals. Waveforms did not match text on P2390 and P2400. -Penny................................", "The difference between FM and PM is slight................."], "jumps": ["P"]}, {"id": "P2380", "text": ["Note that frequency cannot change without a phase change and phase cannot change without changing frequency."], "jumps": ["P2390", "P2370"]}, {"id": "P2400", "text": ["The PM signal has the greatest frequency change at T0, T2 and T4 when the modulating signal phase is at the zero crossing point.", "The PM signal has the greatest frequency change at T0, T2 and T4 when the modulating signal phase is at the zero crossing point."], "jumps": ["P2410", "P2370"]}, {"id": "P2410", "text": ["The only difference between FM and PM is that the modulated signal phase is shifted an entire 90 degrees."], "jumps": ["P2420", "P2370"]}, {"id": "P2420", "text": ["Pulse modulation is a little different, the modulation signal is sampled.  Pulse modulation is not continuous like AM, FM and PM.", "Pulse modulation is a little different, the modulation signal is sampled. Pulse modulation is not continuous like AM, FM and PM."], "jumps": ["P2430", "P2370"]}, {"id": "P2430", "text": ["Pulse modulation is used primarily in digital systems.  There are various modulating methods.", "Pulse modulation is used primarily in digital systems. There are various modulating methods."], "jumps": ["P2440", "P2420"]}, {"id": "P2440", "text": ["Modulation has several advantages.", "Modulation has several advantages. aphic:* Efficient Transmission * Overcomes hardware assignment * Allows frequency assignment", "* Efficient transmission * Overcomes hardware assignment * Allows frequency assignment lexing"], "jumps": ["P2445", "P2420"]}, {"id": "P2445", "text": ["Efficient transmissions are produced because a carrier frequency that best suits the circumstance can be chosen."], "jumps": ["P2450", "P2440"]}, {"id": "P2450", "text": ["Hardware limitations can be overcome by choosing a carrier frequency that reduces the size of frequency sensitive components.  For example: An antenna for audio frequencies would have to be 300 kM long.  An antenna for the frequencies used in AM and FM radio is only about 1 meter.", "Hardware limitations can be overcome by choosing a carrier frequency that reduces the size of frequency sensitive components. For example: An antenna for audio frequencies would have to be 300 kM long. An antenna for the frequencies used in AM and FM radio is only about 1 meter."], "jumps": ["P2460", "P2445"]}, {"id": "P2460", "text": ["Assigning different carrier frequencies allows more than one AM or FM radio station to be selected.", "89.5 MHz FM 101.9 MHz FM 106.5 MHz FM", "530 KHz AM 890 KHz AM 1200 KHz AMM"], "jumps": ["P2470", "P2450"]}, {"id": "P2470", "text": ["What type of modulation changes the amplitude of a carrier signal?"], "jumps": ["P2450"]}, {"id": "P2471", "text": [], "jumps": []}, {"id": "P2472", "text": ["FM is frequency modulation.", "FM is frequency modulation................................."], "jumps": []}, {"id": "P2473", "text": ["PM is phase angle modulation.", "PM is phase angle modulation..............................."], "jumps": []}, {"id": "P2480", "text": ["What type of modulation changes the phase of a carrier signal?"], "jumps": ["P2470"]}, {"id": "P2481", "text": [], "jumps": []}, {"id": "P2482", "text": ["AM is amplitude modulation.", "AM is amplitude modulation................................."], "jumps": []}, {"id": "P2483", "text": ["FM is frequency modulation.", "Multiplexing and demultiplexing are two other methods of signal processing.", "FM is frequency modulation................................."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["Multiplexing is a method of combining several information signals into one signal in the transmitter section."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["Demultiplexing is the separating of the one signal into the many signals in the receiver section."], "jumps": ["P2530", "P2490"]}, {"id": "P2530", "text": ["Multiplexed signals can be used as a modulating signal for AM, FM or PM communication systems."], "jumps": ["P2540", "P2490"]}, {"id": "P2540", "text": ["Multiplexer and demultiplexer circuits combine and separate signals in two basic ways."], "jumps": ["P2550", "P2490"]}, {"id": "P2550", "text": ["Time division multiplexing samples each information input signal for a certain amount of time."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Between T0 and T1, information signal A is placed on the output line."], "jumps": ["P2570", "P2550"]}, {"id": "P2570", "text": ["Between T1 and T2, information signal B is placed on the output line."], "jumps": ["P2580", "P2550"]}, {"id": "P2580", "text": ["Between T2 and T3, signal A is again placed on the output line. Between T3 and T4, signal B is again used."], "jumps": ["P2590", "P2550"]}, {"id": "P2590", "text": ["On the receiving end, the opposite happens.  The received signal is divided into two signals.", "On the receiving end, the opposite happens. The received signal is divided into two signals."], "jumps": ["P2600", "P2550"]}, {"id": "P2600", "text": ["Frequency Division Multiplexing uses modulators and a summation circuit."], "jumps": ["P2610", "P2550"]}, {"id": "P2610", "text": ["Each information source is modulated with a different frequency."], "jumps": ["P2620", "P2600"]}, {"id": "P2620", "text": ["Then the outputs of the modulators are summed."], "jumps": ["P2630", "P2600"]}, {"id": "P2630", "text": ["The multiplexed signal sources are separated by filters and then the information signals are demodulated."], "jumps": ["P2640", "P2600"]}, {"id": "P2640", "text": ["The advantage of multiplexing and demultiplexing is that many information sources can be transmitted on one channel or wire."], "jumps": ["P2650", "P2630"]}, {"id": "P2650", "text": ["In fact, todays' telephone system allows 672 voice signals over a single telephone line."], "jumps": ["P2660", "P2640"]}, {"id": "P2660", "text": ["Which multiplexing method samples each information input?", "Which multiplexing method samples each information input?.."], "jumps": ["P2640"]}, {"id": "P2661", "text": [], "jumps": []}, {"id": "P2662", "text": ["Frequency Division multiplexing sends the entire information signal. The multiplexing occurs due to each information signal being modulated with a different frequency."], "jumps": []}, {"id": "P2910", "text": ["This completes the information on SIGNAL PROCESSING.", "This completes the information on SIGNAL PROCESSING........"], "jumps": ["P2001", "P2660"]}, {"id": "P2920", "text": ["1.  Signal processing is accomplished on two general types of           signals in communication systems.", "1. Signal processing is accomplished on two general types of signals in communication systems."], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  Signal processing is the alteration of a signal in order to                  accomplish efficient, reliable transmission and reception.", "2. Signal processing is the alteration of a signal in order to accomplish efficient, reliable transmission and reception."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Signal processing includes Amplification, Filtering,                           Reshaping, Modulation and Demodulation, Multiplexing and          Demultiplexing.", "3. Signal processing includes Amplification, Filtering, Reshaping, Modulation and Demodulation, Multiplexing and Demultiplexing."], "jumps": ["P2950", "P2930"]}, {"id": "P2950", "text": ["4.  Modulation combines an information signal with a carrier                signal.", "4. Modulation combines an information signal with a carrier signal."], "jumps": ["P2960", "P2930"]}, {"id": "P2960", "text": ["5.  There are four basic ways to demodulate and modulate                    signals.", "6.  Multiplexing combines more than one information source into       one signal.", "5. There are four basic ways to demodulate and modulate signals. raphic:Amplitude (AM) Frequency (FM) Phase (PM) Pulse", "Amplitude (AM) Frequency (FM) Phase (PM) Pulse & demodulation Multiplexing & demultiplexing", "6. Multiplexing combines more than one information source into one signal."], "jumps": ["P2970", "P2950", "P2980", "P2960"]}, {"id": "P2980", "text": ["7.  There are two basic types of demultiplexing and multiplexing.", "7. There are two basic types of demultiplexing and multiplexing."], "jumps": ["P2999", "P2970"]}, {"id": "P2999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P2001", "P2980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["A communication system conveys information from its source to a destination.ence? X XXXX", "truece A choice is d, and it is 10 point arial. This let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
