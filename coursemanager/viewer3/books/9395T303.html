<script>
const book = {"title": "9395T303", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: STEPPER MOTORS sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe the operation of Stepper Motors. w Describe the characteristics of Stepper Motors.", "w Observe the normal operation of Stepper Motors. w Measure signals in the control circuits for Stepper Motors. w Troubleshoot Stepper Motors........."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 480, 488 or Equivalent XXXXXnt"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson, you will learn about stepper motors and stepper motor circuits."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Recall, stepper motors are incremental digital motors."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Stepper motors exhibit frequency vs. speed characteristics, instead of voltage vs. speed, as in DC motors."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Stepper motors are basically a motor that positions a load to a desired location."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Read/write heads in computer disks, print wheels in printers, plotters and assembly line conveyers all use stepper motors."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Due to the many applications of stepper motors, you must be able to understand their operation and be able to recognize faulty operation."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["In this lesson you will learn about STEPPER MOTOR ACTION.................."], "jumps": ["P400"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["The stepper motor is a true digital motor.................."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Each digital pulse causes the shaft to rotate a fixed number of circular degrees."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["This motion, called a \"Step'' is a fixed value dependent upon manufacturing."], "jumps": ["P1040", "P1015"]}, {"id": "P1040", "text": ["Common steps are 0.45, 0.9, 1.8, 3.6, 7.5, 15 and 18 degrees rotation per step (DRS)."], "jumps": ["P1050", "P1015"]}, {"id": "P1050", "text": ["If a continuous pulse train is applied, the shaft will rotate continuously at a rate determined by the input pulse frequency."], "jumps": ["P1060", "P1015"]}, {"id": "P1060", "text": ["This is a frequency, or pulses per second (PPS), vs. speed characteristic. However, stepper motors are seldom used for continuous motion."], "jumps": ["P1070", "P1015", "PPS"]}, {"id": "P1070", "text": ["What type of rotating machine is a stepper motor?.........."], "jumps": ["P1015"]}, {"id": "P1071", "text": [], "jumps": []}, {"id": "P1072", "text": ["An AC rotating machine can be either an AC motor or an AC generator. A stepper motor is neither."], "jumps": []}, {"id": "P1073", "text": ["A continuous rotating machine can be either a DC or AC motor. A stepper motor is neither."], "jumps": []}, {"id": "P1080", "text": ["A basic stepper motor consists of four electromagnetic stators and a permanent magnet rotor.c"], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The stators are labeled A, B, A, and B. Where A and B may be referred to as C and D in some texts."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["The rotor, which does not use brushes or a commutator, has raised nodes that are alternately magnetized North and South."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["The number of nodes on the rotor determine the degrees rotation per step or DRS."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["Four nodes are illustrated for clarity purposes which produce 90 degree steps."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["However, actual stepper motors have from 20 to 800 nodes to produce steps that range from 18 degrees to 0.45 degrees."], "jumps": ["P1140", "P1080"]}, {"id": "P1140", "text": ["What type of rotor is used in a stepper motor?.............", "Permanent magnet with brushes and commutator.", "Electromagnet without brushes or commutator.", "Permanent magnet without brushes or commutator."], "jumps": ["P1080"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P1142", "text": ["Brushes and a commutator are not used in the rotor for a stepper motor."], "jumps": []}, {"id": "P1143", "text": ["Stepper motors do not use an electromagnet rotor..........."], "jumps": []}, {"id": "P1150", "text": ["The operation of a stepper motor is based on the attraction/repulsion principle of magnetism, just like DC motors."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Only four nodes are shown for clarity. No matter the number of nodes, the operation is the same, only the degrees per step are different."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Assume the rotor is positioned as shown. By applying a pulse to the A stator, (magnetizing it as a North pole) no rotation takes place."], "jumps": ["P1180", "P1150"]}, {"id": "P1180", "text": ["The unlike poles of the A stator and \"a'' rotor node attract."], "jumps": ["P1190", "P1150"]}, {"id": "P1190", "text": ["By de-energizing the A stator and energizing the B stator, the rotor will move clockwise."], "jumps": ["P1200", "P1150"]}, {"id": "P1200", "text": ["The rotation continues until the \"a'' node is fully attracted to the B stator."], "jumps": ["P1210", "P1150"]}, {"id": "P1210", "text": ["Next, the B stator is de-energized and the A stator is energized. The rotor rotates another step."], "jumps": ["P1220", "P1150"]}, {"id": "P1220", "text": ["Next, the A stator is de-energized and the B stator is energized. The rotor rotates another step."], "jumps": ["P1230", "P1210"]}, {"id": "P1230", "text": ["Finally, the B stator is de-energized and the A stator is energized. The rotor rotates to the original position.", "Note that the four node stepper motor takes one complete cycle of energizing the stator coils to produce one full revolution of the rotor (A, B, A, B). Press the \"Activate\" button to view cycles."], "jumps": ["P1240", "P1210", "P1250"]}, {"id": "P1250", "text": ["This is not normally the case, Stepper motors use more than four nodes and it takes more than one stator cycle to complete one revolution."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["For example, a stepper motor that has 1.8 degrees per step would require 50 complete stator cycles (A, B, A, B).", "1.8 degrees per step requires 200 pulses for a complete revolution (360 degrees divided by 1.8 degrees).", "200 pulses per revolution requires 50 complete stator cycles (200 divided by 4 pulses per cycle)."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["How many complete stator cycles does it take to produce one complete revolution of a stepper rotor that has a step of 18 degrees?"], "jumps": ["P1260"]}, {"id": "P1271", "text": [], "jumps": []}, {"id": "P1272", "text": ["You did not calculate the number of complete stator cycles for one revolution of the stepper rotor correctly. mber of Complete Stator Cycles To find the number of complete stator cycles for one complete revolution of the stepper rotor you:", "1.8 degrees per step requires 200 pulses for a complete revolution (360 degrees divided by 1.8 degrees).", "200 pulses per revolution requires 50 complete stator cycles (200 divided by 4 pulses per cycle)."], "jumps": []}, {"id": "P1275", "text": ["Divide 360 degrees by the degrees per step to determine the total number of pulses for one complete revolution. Then, divide the number of total pulses by 4 to determine the number of stator cycles...", "Number of Complete Stator Cycles - To find the number of complete stator cycles for one complete revolution of the stepper rotor you:"], "jumps": ["P1270"]}, {"id": "P1280", "text": ["You have seen that the sequence of energizing the stator coils was A, B, A and B and produced clockwise rotation."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Any other combination of energizing the stator coils causes skipped steps and may cause the rotor to lock up. Press the \"Activate\" button to view steps."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["The sequence must be followed to produce clockwise rotation."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["To produce counterclockwise rotation, the sequence is reversed."], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["This sequence is called \"one phase energized''. Only one stator is energized at a time.."], "jumps": ["P1330", "P1300"]}, {"id": "P1330", "text": ["The one phase energized sequence exhibits torque up - torque down action. The rotor jerks or jogs as one stator is de-energized and the next energized."], "jumps": ["P1340", "P1300"]}, {"id": "P1340", "text": ["To smooth out the jerks and jogs, a \" two phase energized '' pattern is used."], "jumps": ["P1350", "P1300"]}, {"id": "P1350", "text": ["The disadvantage is that with two stator coils energized at once, twice the current is drawn from the power supply."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Note, the schematic symbol of a stepper motor does not indicate the number of rotor nodes."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["The degrees per step are normally found in the technical book on the stepper or is stamped on the motor's case."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["What is the proper stepper sequence for clockwise rotation using the one phase energized pattern?"], "jumps": ["P1360"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["You chose the one phase energized counterclockwise pattern."], "jumps": []}, {"id": "P1383", "text": ["You chose the two phase energized clockwise pattern........"], "jumps": []}, {"id": "P1385", "text": [], "jumps": []}, {"id": "P1390", "text": ["What is the proper stepper sequence for counterclockwise rotation using the two phase energized pattern?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["You chose the one phase energized counterclockwise pattern."], "jumps": []}, {"id": "P1393", "text": ["You chose the two phase energized clockwise pattern........"], "jumps": []}, {"id": "P1400", "text": ["The characteristics of stepper motors are basically the same as DC motors."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["However, in stepper motors, the characteristic of RPM needs to be explained further along with two new characteristics:", "SR - Slew Rate EFSS - Error Free Start-Stop Ratee"], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["Let's start off with RPM.ere...............................", "RPM Slew Rate (SR) Error Free Start-Stop Rate (EFSS)"], "jumps": ["P1430", "P1400"]}, {"id": "P1430", "text": ["In stepper motors, the RPM is based on the frequency of the applied pulses even if only one pulse is applied."], "jumps": ["P1440", "P1420"]}, {"id": "P1440", "text": ["RPM PPM(min) = PPS x 60 DPM(min) = DRS", "To calculate RPM, you first multiply the frequency of the pulses (pulse per second or PPS) by 60 to determine pulses per minute (PPM) since RPM is in minutes."], "jumps": ["P1450", "P1430", "PPM"]}, {"id": "P1450", "text": ["You can skip this step if you are calculating RPS (revolutions per second) since RPS is in seconds.", "RPS PPS(sec) = PPS DPS(sec) = PPS x DRS"], "jumps": ["P1460", "P1440"]}, {"id": "P1460", "text": ["Second, you multiply PPM by the degrees of rotation per step (DRS) to determine the degrees of rotation per minute (DPM). Multiply PPS by DRS to determine degrees of rotation per second (DPS)...", "RPM PPM(min) = PPS x 60 DPM(min) = DRS RPM(min) = DPM/360", "RPS PPS(sec) = PPS DPS(sec) = PPS x DRS RPS(sec) = DPS/360"], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["RPM PPM(min) = PPS x 60 DPM(min) = DRS RPM(min) = DPM/360", "Last, you divide DPM (or DPS) by 360 degrees to find RPM (or RPS).", "RPS PPS(sec) = PPS DPS(sec) = PPS x DRS RPS(sec) = DPS/360"], "jumps": ["P1480", "P1440"]}, {"id": "P1480", "text": ["For example, a stepper motor that is pulsed at 1000 PPS and has a 1.8 degree rotation step, produces a RPM of 300 if pulsed continuously.", "RPM PPM(min) = PPS x 60 = 1000 x 60 = 60000 PPM DPM(min) = PPM x DRS = 60000 x 1.8 = 108000 DPM RPM(min) = DPM/360 = 108000/360 = 300 RPMM"], "jumps": ["P1490", "P1440"]}, {"id": "P1490", "text": ["If the same stepper motor is used, 1000 PPS/1.8 degrees per step, the RPS is 5.", "RPS DPS(sec) = PPS x DRS = 1000 x 1.8 = 1800 DPS RPS(sec) = DPS/360 = 1800/360 = 5 RPS"], "jumps": ["P1500", "P1480"]}, {"id": "P1500", "text": ["What is the RPM of a stepper motor that has a PPS of 1.5 k and has a step of 15 degrees?"], "jumps": ["P1480"]}, {"id": "P1501", "text": [], "jumps": []}, {"id": "P1502", "text": ["You calculated the RPS of the stepper motor. Remember you must multiply pulses per second (PPS) by 60 to find PPM since RPM is in minutes.", "PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM"], "jumps": ["PPS"]}, {"id": "P1503", "text": ["You forgot to divide degrees per minute (DPM) by 360 to find revolution per minute (RPM). To calculate the RPM of a stepper motor you:epper motor you:", "PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM"], "jumps": []}, {"id": "P1505", "text": ["PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM", "PPS - pulses per second PPM - pulses per minute DRS - degrees rotation per step DPM - degrees per minute RPM - revolution per minute", "To calculate the RPM of a stepper motor:"], "jumps": []}, {"id": "P1510", "text": ["RPM is critical because stepper motors have limits due to slew rates (SR) and error free start-stop (EFSS) rates."], "jumps": ["P1520", "P1500"]}, {"id": "P1520", "text": ["Next, let's talk about the Slew Rate.......................", "RPM Slew Rate (SR) Error Free Start-Stop Rate (EFSS)"], "jumps": ["P1530", "P1510"]}, {"id": "P1530", "text": ["The Slew Rate (SR) is the maximum number of steps per second that a stepper motor can use and operate correctly."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Recall that the number of steps per second depends on the RPS applied to the stators (in which RPM can be found).nd)."], "jumps": ["P1550", "P1530"]}, {"id": "P1550", "text": ["If the pulses are applied too fast, the rotor of the stepper motor will not have time to fully rotate before the next pulse is applied."], "jumps": ["P1560", "P1530"]}, {"id": "P1560", "text": ["By exceeding the slew rate, the motor will either skip steps or it will stall."], "jumps": ["P1570", "P1550"]}, {"id": "P1570", "text": ["Typical values of SR range from 1 k to 15 k PPS and are given with the motor's specifications."], "jumps": ["P1580", "P1550"]}, {"id": "P1580", "text": ["This means most 1.8 degree per step motors have a RPM range from 300 to 4500."], "jumps": ["P1590", "P1550", "P1585"]}, {"id": "P1582", "text": ["This means most 1.8 degree per step motors have a RPM range from 300 to 4500."], "jumps": ["P1590", "P1550", "P1585"]}, {"id": "P1585", "text": ["Determine PPM Determine DPM Determine RPMM RPM RPMRPM", "PPM = PPS x 60 60000 900000 DPM = PPM x DRS 108000 1620000 RPM = DPM/360 300 450045004500000000"], "jumps": []}, {"id": "P1590", "text": ["If a different degree per step motor is used, the RPM range changes."], "jumps": ["P1600", "P1550"]}, {"id": "P1600", "text": ["Last, let's talk about Error Free Start-Stop rates. ......", "RPM Slew Rate (SR) Error Free Start-Stop Rate (EFSS)"], "jumps": ["P1610", "P1550"]}, {"id": "P1610", "text": ["Error Free Start-Stop rate (EFSS) is the maximum PPS that is applied when the motor is first started or when turned off.", "Starting Running Stopping"], "jumps": ["P1620", "P1600"]}, {"id": "P1620", "text": ["The EFSS rate is normally between 100 and 1000 PPS and is always less than the Slew Rate."], "jumps": ["P1630", "P1610"]}, {"id": "P1630", "text": ["For the Error Free Start rate, time is required for the rotor to begin rotation due to its inertia."], "jumps": ["P1640", "P1610"]}, {"id": "P1640", "text": ["This means that the PPS applied must increase slowly toward the slew rate."], "jumps": ["P1650", "P1610"]}, {"id": "P1650", "text": ["If the PPS rate is too high when starting, steps will be lost."], "jumps": ["P1660", "P1610"]}, {"id": "P1660", "text": ["For the Error Free Stop Rate, time is required for the rotor to stop rotating after the pulses have been removed due to its inertia."], "jumps": ["P1670", "P1610"]}, {"id": "P1670", "text": ["This means that the PPS rate applied must decrease slowly towards zero when stopping."], "jumps": ["P1680", "P1610"]}, {"id": "P1680", "text": ["If the motor is running at SR and you cut the PPS to 0 immediately, the rotor will overshoot the intended stop position."], "jumps": ["P1690", "P1610"]}, {"id": "P1690", "text": ["What term is used to describe the maximum PPS rate that can be applied to a stepper motor?"], "jumps": ["P1610"]}, {"id": "P1691", "text": [], "jumps": []}, {"id": "P1692", "text": ["RPM is revolution per minute and is determined by the PPS rate applied to the stepper motor. It does not describe the maximum pulse rate."], "jumps": []}, {"id": "P1693", "text": ["EFSS rate is the Error Free Start-Stop Rate. EFSS is always lower than the maximum PPS rate applied to a stepper motor.", "Starting Running Stopping"], "jumps": []}, {"id": "P1700", "text": ["Why must the EFSS rate be used?ed.........................."], "jumps": ["P1690"]}, {"id": "P1701", "text": [], "jumps": []}, {"id": "P1702", "text": ["The stators of a stepper motor do not rotate and is not the reason why the EFSS rate must be used.."], "jumps": []}, {"id": "P1703", "text": ["The rotor's RPM is determined by the PPS rate, but is not the reason why the EFSS rate must be used."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on Stepper Motor Action....."], "jumps": ["P1700"]}, {"id": "P1920", "text": ["1. A stepper motor is a true digital incremental motor manufactured for specific \"steps'' for each input pulse."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Stepper motors are constructed using four electromagnet stators and a rotor that has alternating magnetic nodes.", "3. By energizing the stators in sequence, the magnetic fields of the stator and rotor cause CW & CCW rotation for a predetermined number of degrees."], "jumps": ["P1940", "P1920", "P1950", "P1930"]}, {"id": "P1950", "text": ["4. One phase energized patterns apply pulses to one stator coil at a time and use less current but exhibit jerks or jogs.."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Two phase energized patterns energize two stator coils at a time and use more current but have less jerks or jogs."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. The schematic symbol of the stepper motor illustrates the four stator windings."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. RPM of stepper motors equals the PPS times 60 times DRS divided by 360."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8. The Slew Rate (SR) is the maximum PPS rate that can be applied to a stepper motor. 9. The Error Free Start-Stop Rate (EFSS) is less than SR due to the inertia of the stepper motor's rotor when starting and stopping..", "Starting Running Stopping"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2015", "text": ["In this experiment you will:ere............................", "* Observe the operation of stepper motors in CW and CCW rotation. * Observe the operation of stepper motors in a RUN and STEP mode. * Observe the effects of SR and EFSS. * Measure signals in the stepper motor circuits. * Troubleshoot stepper motor circuits."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["The stepper motor and circuitry used in this experiment is contained on PC130-181."], "jumps": ["P2030", "P2015"]}, {"id": "P2030", "text": ["Look at the card and locate the stepper motor. It is below the black wheel. The wheel is divided into 18 degree marks (degrees per step) with a pointer."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["The six color coded wires, from the stepper to J1, connect to the four stator windings."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The rest of the components on the card make up the stepper motor circuit."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["Let's look at the circuit. e full schematic of the card can be viewed by pressing Ctrl S when indicated."], "jumps": ["P2070", "P2020"]}, {"id": "P2070", "text": ["The stepper motor is labeled M1 and the stator windings connect to J1."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The circuits required to operate the stepper motor consist of a driver and a controller."], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["The driver circuit has four switches that supply the energizing power to the individual stators (only one switch is shown)."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["A low power input signal from the controller circuit (not enough power to magnetize the stator) is applied to the base of Q1. R1 limits Q1 conduction."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["When the input is positive, Q1 begins to conduct, providing a path from +V through the stator winding to ground."], "jumps": ["P2120", "P2090"]}, {"id": "P2120", "text": ["The higher power current through the stator winding causes the stator to magnetize."], "jumps": ["P2130", "P2090"]}, {"id": "P2130", "text": ["When the input voltage is removed, Q1 cuts off breaking the path through the stator winding. The stator de-energizes."], "jumps": ["P2140", "P2090"]}, {"id": "P2140", "text": ["D1 is an LED and illuminates when the stator is magnetized. R2 limits current through D1 (D1 is not normally part of driver circuits, it's used for visual checks in this experiment)."], "jumps": ["P2150", "P2090"]}, {"id": "P2150", "text": ["D2 is used to eliminate inductive kick back and prevents excessive reverse current flow from damaging Q1."], "jumps": ["P2160", "P2090", "P2155"]}, {"id": "P2152", "text": ["D2 is used to eliminate inductive kick back and prevents excessive reverse current flow from damaging Q1. Inductive Kick Back Inductive kick back is the voltage and current generated in a coil when the energizing voltage is removed. When the voltage is removed, the magnetic field collapses cutting the wires that make up the coil. Since there is motion between the magnetic field and a conductor, a voltage/current is produced that opposes the energizing applied voltage."], "jumps": ["P2155", "P2160", "P2090"]}, {"id": "P2155", "text": ["Inductive Kick Back - Inductive kick back is the voltage and current generated in a coil when the energizing voltage is removed. When the voltage is removed, the magnetic field collapses cutting the wires that make up the coil. Since there is motion between the magnetic field and a conductor, a voltage/current is produced that opposes the energizing applied voltage.", "The controller is the circuit that applies the input to the drivers in the correct sequence for CW and CCW rotation.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2170", "P2152"]}, {"id": "P2170", "text": ["This circuit uses the two phase energized pattern."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["U1 is a counter IC chip that counts on each clock input to Pin 15. The clock input is the PPS rate."], "jumps": ["P2190", "P2160"]}, {"id": "P2190", "text": ["The counter counts up (00, 01, 10, 11) and down (00, 11, 10, 01) depending on the input level to Pin 10 to produce CW and CCW rotation of the motor."], "jumps": ["P2200", "P2160"]}, {"id": "P2200", "text": ["The Q0 and Q1 outputs of U1 are applied to U3, a decoder IC chip."], "jumps": ["P2210", "P2160"]}, {"id": "P2210", "text": ["The decoder chip produces one high output on the Q lines depending on the count contained in U1."], "jumps": ["P2220", "P2160"]}, {"id": "P2220", "text": ["An input count of 00 causes Q0 to be high.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P2230", "P2160"]}, {"id": "P2230", "text": ["The high Q0 output of U3 causes a high output on OR gates U4A and U4D, the inputs to the A and B drivers.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P2240", "P2160"]}, {"id": "P2240", "text": ["An input count of 01 causes Q1 to be high.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "An input count of 01 causes Q1 to be high..................", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2250", "P2160"]}, {"id": "P2250", "text": ["The high Q1 output of U3 causes a high output on OR gates U4C and U4D, the inputs to the A and B drivers."], "jumps": ["P2260", "P2241"]}, {"id": "P2260", "text": ["An input count of 10 causes Q2 to be high.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P2270", "P2241"]}, {"id": "P2270", "text": ["The high Q2 output of U3 causes a high output on OR gates U4B and U4C, the inputs to the B and A drivers."], "jumps": ["P2280", "P2241"]}, {"id": "P2280", "text": ["A Q0 B U3 Q1 C Q2 D Q3 40288", "An input count of 11 causes Q3 to be high."], "jumps": ["P2290", "P2241"]}, {"id": "P2290", "text": ["The high Q3 output of U3 causes a high output on OR gates U4A and U4B, the inputs to the A and B drivers."], "jumps": ["P2300", "P2241"]}, {"id": "P2300", "text": ["This table sums up controller circuit operation for counting up. This pattern produces CW rotation.."], "jumps": ["P2310", "P2241"]}, {"id": "P2310", "text": ["This table sums up controller circuit operation for counting down. This pattern produces CCW rotation."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["Finally, the inputs to U3 for clock and U/D consists of three switches and three inverters."], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["S3 controls CW or CCW rotation by applying +5 volts or a ground to U3 Pin 10. When 5 V is applied, the rotation is CW. When GND is applied, the rotation is CCW."], "jumps": ["P2340", "P2320"]}, {"id": "P2340", "text": ["S2 controls the mode. RUN is continuous pulses and STEP applies a pulse each time S1 is depressed."], "jumps": ["P2350", "P2320"]}, {"id": "P2350", "text": ["Inverter U2A drives an LED that illuminates for all applied pulses."], "jumps": ["P2360", "P2320"]}, {"id": "P2360", "text": ["Inverter U2B, R2, R3, and C2 are configured as an oscillator. This oscillator supplies continuous pulses... oscillator that supplies continuous pulses."], "jumps": ["P2370", "P2320"]}, {"id": "P2370", "text": ["The PPS of the oscillator is controlled by R3. Remember, PPS can not exceed SR and EFSS rates."], "jumps": ["P2380", "P2320"]}, {"id": "P2380", "text": ["Let's start the experiment! nt! ew the schematic during the experiment press Ctrl S."], "jumps": ["P2390", "P2320"]}, {"id": "P2390", "text": ["1. Set the Test Console controls to their initial control settings........"], "jumps": ["P2380"]}, {"id": "P2400", "text": ["2. Insert the PC130-181 into the PC1 position on the Test Console."], "jumps": ["P2410", "P2390"]}, {"id": "P2410", "text": ["A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr", "3. On PC130-181, set the controls as follows: C switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2400", "P2420", "P2415"]}, {"id": "P2415", "text": [], "jumps": []}, {"id": "P2420", "text": ["4. Set the Voltmeter Switch to Positive. 5. Set the Positive Supply Voltage to 5. The Test Console's Voltage Meter should indicate 5 volts."], "jumps": ["P2410"]}, {"id": "P2430", "text": ["6. While observing the wheel, place the PC1 POWER to ON..................."], "jumps": ["P2420"]}, {"id": "P2440", "text": ["Is the stepper motor continually rotating CW (you may see skipped steps or rotate CCW until the position of the rotor matches the energizing of the stators)?"], "jumps": ["P2430"]}, {"id": "P2441", "text": [], "jumps": []}, {"id": "P2442", "text": ["The stepper motor should be rotating CW. Check your setup.our setup.", "A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr"], "jumps": []}, {"id": "P2450", "text": ["You have set up the experiment card correctly. Let's first observe CW and CCW rotation in the Run and Step modes."], "jumps": ["P2460", "P2440"]}, {"id": "P2460", "text": ["1. Ensure S2 is set to RUN and S3 set to CW. Rotate R3 fully CCW. The stepper is rotating CW. Observe the LED's.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2470", "P2450", "P2465"]}, {"id": "P2470", "text": ["The Clock LED is flashing. The LED illuminates on each positive pulse from the oscillator. The stator LEDs are indicating the CW energizing sequence of the stators. Check the sequence for two phase energized pattern, AB, AB, BA, and AB."], "jumps": ["P2480", "P2460"]}, {"id": "P2480", "text": ["2. Place S3 to CCW. The stepper motor is rotating CCW.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2490", "P2460", "P2485"]}, {"id": "P2490", "text": ["The Clock LED is flashing. The LED illuminates on each positive pulse from the oscillator. The stator LEDs are indicating the CCW energizing sequence of the stators. Check the sequence for two phase energized pattern, AB, AB, BA, and AB."], "jumps": ["P2500", "P2480"]}, {"id": "P2500", "text": ["You have seen the operation of the stepper motor rotating CW and CCW in the Run mode. Now, let's check the Step mode."], "jumps": ["P2510", "P2490"]}, {"id": "P2510", "text": ["3. Place S2 to STEP. The stepper motor should not be rotating.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2520", "P2500", "P2515"]}, {"id": "P2520", "text": ["4. Press and release S1 once. What happened to the rotation of the stepper motor????????"], "jumps": ["P2510"]}, {"id": "P2521", "text": [], "jumps": []}, {"id": "P2522", "text": ["The stepper should have rotated CCW. Check that S3 is still set to CCW."], "jumps": []}, {"id": "P2523", "text": ["The stepper motor will not rotate continuously when S2 is set to Step.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": []}, {"id": "P2530", "text": ["5. Press and release S1 at least four more times. The stepper motor should rotate 18 degrees and stop on each depression of S1. Check the stator LEDs and verify the sequence is correct for CCW rotation, AB, AB, BA and AB................."], "jumps": ["P2540", "P2520", "P2525"]}, {"id": "P2540", "text": ["6. Place S3 to CW. 7. Press and release S1 several times....", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2550", "P2530", "P2545"]}, {"id": "P2550", "text": ["Verify the stepper motor is rotating 18 degrees each time S1 is depressed and the rotation is CW: AB, AB, BA and AB."], "jumps": ["P2560", "P2540"]}, {"id": "P2560", "text": ["Calculate the number of steps that it will take to rotate the stepper one complete revolution considering that each step is 18 degrees."], "jumps": ["P2550", "P2565"]}, {"id": "P2561", "text": [], "jumps": []}, {"id": "P2562", "text": ["You calculated the number of complete stator cycles that it would take for one complete revolution.", "1.8 degrees per step requires 200 pulses for a complete revolution (360 degrees divided by 1.8 degrees).", "200 pulses per revolution requires 50 complete stator cycles (200 divided by 4 pulses per cycle)."], "jumps": []}, {"id": "P2563", "text": ["PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM", "You have calculated DPM, degrees per minute.steps.........."], "jumps": []}, {"id": "P2565", "text": ["To find the number of steps required to complete one revolution you divide 360 degrees by the degrees per step, 18 in this case."], "jumps": []}, {"id": "P2570", "text": ["8. Press and release S1 until the pointer on the wheel indicates 0 degrees. 9. While counting the number of S1 depressions, depress S1 until the stepper has made one complete revolution."], "jumps": ["P2580", "P2560"]}, {"id": "P2580", "text": ["Your count should agree with the number of times you pressed S1. Since it takes 20 steps to complete one revolution, and recalling that each stator cycle is four steps, there are 5 complete stator cycles per revolution.revolution.."], "jumps": ["P2590", "P2570"]}, {"id": "P2590", "text": ["PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM", "You have seen the operation of the stepper motor in CW and CCW rotation and in the RUN and STEP modes. Now, let's see the effects of SR and EFSS, and calculate RPM for a given input PPS...", "Starting Running Stopping"], "jumps": ["P2600", "P2580"]}, {"id": "P2600", "text": ["1. Place S2 to RUN. Verify that the stepper motor is rotating CW continuously.......", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2610", "P2590", "P2605"]}, {"id": "P2610", "text": ["2. Using a small screw driver, slowly rotate R3 fully clockwise and observe the rotation of the stepper motor.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2620", "P2600", "P2615"]}, {"id": "P2620", "text": ["You should have seen the stepper motor increase the step rate or RPM, while you increased the PPS. Notice that the stepper motor stopped when R3 is fully clockwise."], "jumps": ["P2630", "P2610"]}, {"id": "P2630", "text": ["The stepper motor ceased to operate when the PPS rate exceeded the SLEW RATE."], "jumps": ["P2640", "P2620"]}, {"id": "P2640", "text": ["3. Slowly rotate R3 fully counterclockwise. The stepper motor begins to rotate since you lowered the PPS rate below the slew rate...................."], "jumps": ["P2650", "P2630", "P2615"]}, {"id": "P2650", "text": ["4. Very rapidly rotate R3 fully clockwise. Notice that the stepper motor did not operate correctly. Steps were skipped and the stepper stopped. By rapidly rotating R3 you exceeded the EFSS rate, or Error Free Start-Stop Rate................"], "jumps": ["P2660", "P2640", "P2615"]}, {"id": "P2660", "text": ["5. Rotate R3 to mid position and ensure that S2 is set to RUN and S3 to CW. The stepper motor should be continuously rotating CW.............."], "jumps": ["P2670", "P2650", "P2615"]}, {"id": "P2670", "text": ["6. Using a frequency counter with 1/10 attenuation and a 10 second gate, measure the signal on TP7 and adjust R3 for a measurement of 4 Hz.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2680", "P2660", "P2675"]}, {"id": "P2676", "text": ["Using the Function Generator with 1/10 attenuation and a 10 second gate, measure the signal at TP7 and adjust R3 for a 4 Hz measurement."], "jumps": []}, {"id": "P2680", "text": ["7. Calculate the RPM of the stepper motor with a PPS of 4. Type in the RPM rounded to tenths......."], "jumps": ["P2682"]}, {"id": "P2681", "text": [], "jumps": []}, {"id": "P2682", "text": ["You did not calculate the correct RPM. Remember, you must change PPS to PPM because RPM is in minutes. Then you find the number of degrees per minute and divide by 360.", "PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM"], "jumps": []}, {"id": "P2685", "text": ["To calculate RPM, use the following formula:", "PPM(min) = PPS x 60 DPM(min) = PPM x DRS RPM(min) = DPM/360", "PPS - pulses per second PPM - pulses per minute DRS - degrees rotation per step DPM - degrees per minute RPM - revolution per minutee"], "jumps": []}, {"id": "P2687", "text": ["You still have not calculated the correct RPM value. You should have calculated approximately 12 RPM."], "jumps": ["P2680"]}, {"id": "P2690", "text": ["8. Count the number of 360 degree rotations of the stepper motor in one minute. Your count should match the RPM calculated. You verified the method used to find RPM..............."], "jumps": ["P2700", "P2680"]}, {"id": "P2700", "text": ["You have seen the characteristics of stepper motors. * SR and EFSS rates effect * RPM calculations Now, let's measure signals in the stepper motor circuit."], "jumps": ["P2710", "P2690"]}, {"id": "P2710", "text": ["1. Using an oscilloscope, measure the signal on TP7, CLOCK. You should observe a square signal with a frequency of 4 Hz. This is the signal that is applied to the counter IC, U1, when S2 is in Run..", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2720", "P2700", "P2715"]}, {"id": "P2716", "text": ["OSCILLOSCOPE SETUP Sweep Mode - Auto Time Division - .1 msec Time/Div VAR - CAL CH1 Volts/Div - .2 Display Mode - CH1 Trigger - CH1, AC, +++, +"], "jumps": []}, {"id": "P2720", "text": ["2. Place S2 to Step. 3. Press and release S1 several times. With S2 to Step you should have observed that a clock pulse is not generated until S1 is depressed, the Step mode of operation.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2730", "P2710", "P2725"]}, {"id": "P2730", "text": ["Also notice that S1 provides a ground, or 0 volt signal, when pressed. U2C inverts the signal before being applied to U1."], "jumps": ["P2740", "P2720"]}, {"id": "P2740", "text": ["4. Press and release S1 until the LEDs over TP1 and TP4 are illuminated. 5. Ensure that S2 is set to Step and that S3 is set to CW. You will measure signals in the stepper motor circuit for CW rotation first...........", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2750", "P2730", "P2745"]}, {"id": "P2750", "text": ["6. Using a multimeter to measure HIGH or LOW signals, measure the signals on TP5/TP6 for U1, TP9 through TP12 for U3, TP1 through TP4 for the stators, and TP8 for the direction. ress Ctrl S and follow the schematic to measure the signals on TP1 through TP12................", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2760", "P2740", "P2755"]}, {"id": "P2760", "text": ["You should have measured the following levels where 0 is LOW and 1 is HIGH.", "When the stator is energized, there is a low on the corresponding test point and LED.....y on the schematic that the signals on TP1 through TP4 indicate a LOW when the stator is energized, which turns on the LED...", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2762", "P2750", "P2770", "P2760"]}, {"id": "P2770", "text": ["The circuit correctly produced the first sequence for two phase energized pattern in the CW rotation."], "jumps": ["P2780", "P2762"]}, {"id": "P2780", "text": ["7. Press S1 once for the next step. Measure the signals at the test points and compare to the table below.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2790", "P2760", "P2785"]}, {"id": "P2790", "text": ["You should have seen that the output of the counter count UP: 00, 01, 10, 11 (TP6 and TP5 respectively). The output of the decoder only set one line HIGH at a time: Q0, Q1, Q2, Q3 (TP12 to TP9 respectively). The stator TPs indicate CW rotation: AB, AB, BA, AB.."], "jumps": ["P2800", "P2780", "P2755"]}, {"id": "P2800", "text": ["8. Place S3 to CCW. 9. Press and release S1 until the LEDs over TP1 and TP4 are illuminated.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2810", "P2790", "P2805"]}, {"id": "P2810", "text": ["10. Using the multimeter, measure TPs 1 through 12. 11. For each step, compare the values to the table below. Press Ctrl S to compare the table with the schematic.........", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2820", "P2800", "P2815"]}, {"id": "P2820", "text": ["You should have seen that the output of the counter count DOWN: 00, 11, 10, 01 (TP6 and TP5 respectively). The output of the decoder set only one line HIGH at a time: Q0, Q3, Q2, Q1 (TP12 , TP9, TP10, and TP11). The stator TPs indicate CCW rotation: AB, AB, BA, AB.."], "jumps": ["P2830", "P2810"]}, {"id": "P2830", "text": ["You have now traced the signals through the stepper circuit. It's time to locate some faults."], "jumps": ["P2840", "P2820"]}, {"id": "P2840", "text": ["1. Set up the PC130-181 card as follows:..................", "A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2850", "P2830", "P2845"]}, {"id": "P2850", "text": ["Troubleshooting stepper motors is easy. First determine if the motor operates in the STEP mode. This reduces the circuit eliminating the CLOCK and stops the rotation for checking the signal levels..."], "jumps": ["P2860", "P2840"]}, {"id": "P2860", "text": ["Checking CW and CCW rotation in the STEP mode will determine if the stepper motor, and it's circuitry, are operating correctly. If not, the fault is in the motor itself or in the circuit..t...."], "jumps": ["P2870", "P2850"]}, {"id": "P2870", "text": ["If the stepper motor operates in the STEP mode, you then switch to the RUN mode to ensure that the oscillator circuit is operating."], "jumps": ["P2880", "P2860"]}, {"id": "P2880", "text": ["The computer will now enter a fault.a fault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2870"]}, {"id": "P2890", "text": ["1. With S2 set to STEP and S3 set to CW, press and release S1 and determine if the stepper motor rotates CW."], "jumps": ["P2900", "P2880", "P2745"]}, {"id": "P2900", "text": ["Does the stepper motor operate in the CW direction?........"], "jumps": ["P2890"]}, {"id": "P2901", "text": [], "jumps": []}, {"id": "P2902", "text": ["The fault inserted does not effect the CW rotation of the stepper motor in the STEP mode."], "jumps": []}, {"id": "P2910", "text": ["2. Place S3 to CCW. 3. Press and release S1 to determine if the step motor rotates in the CCW direction."], "jumps": ["P2920", "P2900", "P2805"]}, {"id": "P2920", "text": ["Does the stepper motor operate in the CCW direction?......."], "jumps": ["P2910"]}, {"id": "P2921", "text": [], "jumps": []}, {"id": "P2922", "text": ["The fault inserted does not effect the stepper motor in the CCW direction when in the STEP mode."], "jumps": []}, {"id": "P2930", "text": ["You have determined that the stepper motor rotates CW and CCW in the STEP mode. Most of the stepper motor circuit has been verified operating correctly. Now let's check out the oscillator that produces the PPS rate.PS rate..."], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["4. Place S2 to RUN and verify operation of the stepper motor in the CW and CCW direction (S3 set to CCW and CW).", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2950", "P2930", "P2945"]}, {"id": "P2950", "text": ["Does the stepper motor operate in the RUN mode?............"], "jumps": ["P2940"]}, {"id": "P2951", "text": [], "jumps": []}, {"id": "P2952", "text": ["The fault entered effects the RUN mode, check that S2 is in RUN."], "jumps": []}, {"id": "P2960", "text": ["5. Using the oscilloscope, measure the signal on TP7. You should have measured a continuously High signal. This verifies the oscillator is not operating correctly.........................", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P2970", "P2950", "P2965"]}, {"id": "P2966", "text": ["OSCILLOSCOPE SETUP Sweep Mode - Auto Time Division - .1 msec Time/Div VAR - CAL CH1 Volts/Div - .2 Display Mode - CH1 Trigger - CH1, AC, ++++++"], "jumps": []}, {"id": "P2970", "text": ["6. Using the oscilloscope, carefully measure the signal on U2, Pin 4. Notice that the clock signal is not present. You found the problem, U2B is not producing the signal required for the Run mode operation of the stepper motor."], "jumps": ["P2980", "P2960", "P2975"]}, {"id": "P2975", "text": ["Carefully measure the signal on U2, Pin 4."], "jumps": []}, {"id": "P2976", "text": ["OSCILLOSCOPE SETUP Sweep Mode - Auto Time Division - .1 msec Time/Div VAR - CAL CH1 Volts/Div - .2 Display Mode - CH1 Trigger - CH1, AC, ++++++"], "jumps": []}, {"id": "P2980", "text": ["The computer has removde the fault. Verify that the stepper motor operates in the Run mode. switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P2970"]}, {"id": "P2990", "text": ["Let's troubleshoot another fault..........................."], "jumps": ["P2980"]}, {"id": "P3000", "text": ["A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr", "1. Step up the circuit as follows:........................"], "jumps": ["P3010", "P2990", "P3005"]}, {"id": "P3005", "text": [], "jumps": []}, {"id": "P3010", "text": ["The computer will now insert the fault..ow................................."], "jumps": ["P3000"]}, {"id": "P3020", "text": ["1. Press and release S1 with S3 set to CW and CCW to check operation in the STEP mode.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P3030", "P3010", "P3025"]}, {"id": "P3030", "text": ["Is the stepper motor operating correctly in the STEP mode?."], "jumps": ["P3020"]}, {"id": "P3031", "text": [], "jumps": []}, {"id": "P3032", "text": ["The inserted fault effects the stepper motor in the STEP mode."], "jumps": []}, {"id": "P3040", "text": ["The fault is either in the stepper motor itself or in the controller/driver circuit. Let's check."], "jumps": ["P3030"]}, {"id": "P3050", "text": ["2. Press and release S1 at least four times with S3 set to CW and CCW while observing the stator LEDs."], "jumps": ["P3040", "P3025"]}, {"id": "P3060", "text": ["If the LEDs indicate the correct CW and CCW sequence, the fault is in the stepper motor. If the LEDs do not indicate the correct CW and CCW sequence, the fault is in the controller/driver circuit."], "jumps": ["P3050"]}, {"id": "P3070", "text": ["Where is the probable fault?typed.........................."], "jumps": ["P3060"]}, {"id": "P3071", "text": [], "jumps": []}, {"id": "P3072", "text": ["The stator LEDs did not indicate the correct two phase energized sequence. Note that the B LED never illuminated."], "jumps": []}, {"id": "P3080", "text": ["The fault is in the controller/driver circuit since the B stator never energized as indicated by the B LED never illuminating. Let's measure the output signals of U1 and U3."], "jumps": ["P3070"]}, {"id": "P3090", "text": ["3. Using the multimeter, measure TP5 and TP6 while pressing and releasing S1 several times with S3 set to CW and CCW.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P3100", "P3080", "P3095"]}, {"id": "P3100", "text": ["Does the counter, U1, count UP (00, 01, 10, 11) with S3 set to CW and count DOWN (00, 11, 10, 01) with S3 set to CCW?"], "jumps": ["P3090"]}, {"id": "P3101", "text": [], "jumps": []}, {"id": "P3102", "text": ["The counter should have counted correctly. Check the way in which you measured the levels."], "jumps": []}, {"id": "P3110", "text": ["You now know that U1 is operating correctly. Next, check out U3."], "jumps": ["P3120", "P3100"]}, {"id": "P3120", "text": ["4. Using the multimeter, measure TP9 through TP12 while pressing and releasing S1 several times with S3 set to CW and CCW.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P3130", "P3110", "P3125"]}, {"id": "P3130", "text": ["Does the decoder, U3, produce one HIGH output for each count of U1 in the correct sequence (Q0, Q1, Q2, Q3 for CW and Q0, Q3, Q1 for CCW)?"], "jumps": ["P3120"]}, {"id": "P3131", "text": [], "jumps": []}, {"id": "P3132", "text": ["The decoder is operating correctly, only one HIGH output at a time and in the correct sequence for CW and CCW."], "jumps": []}, {"id": "P3140", "text": ["The counter and encoder chips are operating correctly. The fault must be in the driver circuit, the controller circuit is good."], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["You should have observed that the B stator is not being energized. Therefore, the fault must be in the U4C/Q3 driver circuit."], "jumps": ["P3160", "P3140"]}, {"id": "P3160", "text": ["5. Using a multimeter, measure the signal on TP3 when the B stator should be energized. Press and release S1 until the LEDs over TP1 and TP4 are illuminated. This begins at step 1..."], "jumps": ["P3170", "P3150"]}, {"id": "P3170", "text": ["The measurement on TP3 should be LOW, 0 volts, when the stator energizes on steps 2 and 3. You should have measured around +5 volts for any step, stator B never receives energizing voltage (a LOW since Q3 turns ON applying a ground to TP3 allowing the +5 volts on the other side of the stator to energize the stator's coil). Q3 never turns ON..."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["6. Using a multimeter, carefully measure the voltage on Pin 8 of U4C when the stator should be energized. This is the output of the OR gate and is HIGH anytime the B stator should be energized, Q0 or Q1 output of U3 HIGH."], "jumps": ["P3190", "P3170", "P3185"]}, {"id": "P3185", "text": ["Carefully measure the voltage on Pin 8 of U4C."], "jumps": []}, {"id": "P3190", "text": ["If the output of U4C is LOW when stator B should be de-energized and HIGH when stator B should be energized, U4C is operating correctly and the fault is in R7 or Q3. If the output of U4C is always LOW, not turning on Q3, the fault is in U4."], "jumps": ["P3200", "P3180"]}, {"id": "P3200", "text": ["Where is the fault?stion is typed.........................."], "jumps": ["P3190"]}, {"id": "P3201", "text": [], "jumps": []}, {"id": "P3202", "text": ["You should have measured HIGH and LOW outputs of U4C as S1 is depressed and released at least four times. U4 is not the fault."], "jumps": []}, {"id": "P3210", "text": ["You have located the fault to R7 or Q3. In this case, there is an open between R7 and the base of Q3."], "jumps": ["P3220", "P3200"]}, {"id": "P3220", "text": ["The computer will now remove the fault.ault. the PC1 DC switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P3210"]}, {"id": "P3230", "text": ["7. Verify that the stepper motor rotates in the CW and CCW direction in the STEP and RUN modes."], "jumps": ["P3240", "P3220", "P3235"]}, {"id": "P3235", "text": ["OPERATION VERIFICATION 1. S2 to STEP and S3 to CW and CCW while pressing and releasing S1. 2. S2 to RUN and S3 to CW and CCW........."], "jumps": []}, {"id": "P3240", "text": ["1. Disconnect test equipment from the circuit. 2. Return the test console controls to their Initial Control Settings."], "jumps": ["P3230"]}, {"id": "P3250", "text": ["3. Set the Test Console Power OFF. OFF...................."], "jumps": ["P3240"]}, {"id": "P3260", "text": ["4. Remove PC130-181. 5. Return all equipment to their designated storage areas..."], "jumps": ["P3910", "P3250"]}, {"id": "P3910", "text": ["This completes the experiment on STEPPER MOTORS.TLE........"], "jumps": ["P3260"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 2, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P10004", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor."], "jumps": []}, {"id": "P10210", "text": ["What type of rotating machine is a stepper motor?"], "jumps": []}, {"id": "P10211", "text": ["How many stators does a stepper motor use?"], "jumps": []}, {"id": "P10212", "text": ["What type of rotor does a stepper motor use?"], "jumps": []}, {"id": "P10213", "text": ["What is the sequence of energizing the stators for a one phase energized CW pattern?"], "jumps": []}, {"id": "P10214", "text": ["What is the sequence of energizing the stators for a two phase energized CCW pattern?"], "jumps": []}, {"id": "P10215", "text": ["What is the advantage and disadvantage of the two phase energized sequence?"], "jumps": []}, {"id": "P10216", "text": ["Which formula calculates RPM of a stepper motor?"], "jumps": []}, {"id": "P10217", "text": ["What term is used to describe the highest PPS that a stepper motor can use?"], "jumps": []}, {"id": "P10218", "text": ["What is the term used to describe the action of starting and stopping stepper motors slower than the running speed?"], "jumps": []}, {"id": "P10219", "text": ["What is the term used to describe the number of degrees that a stepper motor rotates for each input pulse?"], "jumps": []}, {"id": "P10220", "text": ["Which circuit in a stepper motor system develops the proper sequence of energizing the stator coils?"], "jumps": []}, {"id": "P10221", "text": ["Which circuit in a stepper motor system develops the power necessary to energize the stators?"], "jumps": []}, {"id": "P10222", "text": ["Which circuit in a stepper motor system develops the PPS?"], "jumps": []}, {"id": "P10223", "text": ["What is the purpose of D2 in the driver circuit?", "Prevents D1 from receiving reverse current", "Prevents stator coil from magnetizing South"], "jumps": []}, {"id": "P10224", "text": ["Low e C choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "High D choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P10225", "text": ["Low e C choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "Positive choice is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "What level is on top of D2 when Q1 is ON?"], "jumps": []}, {"id": "P10226", "text": ["What is the counters purpose in a stepper motor's circuitry?", "Produces 1 HIGH output for the Q lines. nt arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "None of the above. d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P10227", "text": ["What is the decoders purpose in a stepper motor's circuitry? him over the fence? X XXXX", "Counts clock pulses. , and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "Produces 1 HIGH output for the Q lines. nt arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X", "None of above ce is d, and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor."], "jumps": []}, {"id": "P10228", "text": ["Which two rates must the PPS not exceed?"], "jumps": []}, {"id": "P10229", "text": ["If a stepper motor operates in the STEP mode but does not operate in the RUN mode, what is the probable faulted area?"], "jumps": []}, {"id": "P10301", "text": ["You skipped X question(s). Do you want to _________"], "jumps": []}, {"id": "P10302", "text": ["You skipped X question(s). Do you want to _________", "end the test? t is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor. X"], "jumps": []}, {"id": "P10303", "text": ["The test is complete and your score is XX%. Do you want to __________"], "jumps": []}, {"id": "P10410", "text": [], "jumps": []}, {"id": "P13015", "text": ["In this experiment you will:ere............................", "* Observe the operation of stepper motors in CW and CCW rotation. * Observe the operation of stepper motors in a RUN and STEP mode. * Observe the effects of SR and EFSS. * Measure signals in the stepper motor circuits. * Troubleshoot stepper motor circuits."], "jumps": ["P13020", "P2001"]}, {"id": "P13020", "text": ["The stepper motor and circuitry used in this experiment is contained on PC130-181."], "jumps": ["P13030", "P13015"]}, {"id": "P13030", "text": ["Look at the card and locate the stepper motor. It is below the black wheel. The wheel is divided into 18 degree marks (degrees per step) with a pointer."], "jumps": ["P13040", "P13020"]}, {"id": "P13040", "text": ["The six color coded wires, from the stepper to J1, connect to the four stator windings."], "jumps": ["P13050", "P13020"]}, {"id": "P13050", "text": ["The rest of the components on the card make up the stepper motor circuit."], "jumps": ["P13060", "P13020"]}, {"id": "P13060", "text": ["Let's look at the circuit. ll schematic of the card can be viewed by pressing Ctrl S when indicated."], "jumps": ["P13070", "P13020"]}, {"id": "P13070", "text": ["The stepper motor is labeled M1 and the stator windings connect to J1.", "Yellow Black Red Orange Black Brownn"], "jumps": ["P13080", "P13060"]}, {"id": "P13080", "text": ["The circuits required to operate the stepper motor consist of a driver and a controller."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["The driver circuit has four switches that supply the energizing power to the individual stators (only one switch is shown)."], "jumps": ["P13100", "P13070"]}, {"id": "P13100", "text": ["A low power input signal from the controller circuit (not enough power to magnetize the stator) is applied to the base of Q1. R1 limits Q1 conduction."], "jumps": ["P13110", "P13090"]}, {"id": "P13110", "text": ["When the input is positive, Q1 begins to conduct, providing a path from +V through the stator winding to ground."], "jumps": ["P13120", "P13090"]}, {"id": "P13120", "text": ["The higher power current through the stator winding causes the stator to magnetize."], "jumps": ["P13130", "P13090"]}, {"id": "P13130", "text": ["When the input voltage is removed, Q1 cuts off breaking the path through the stator winding. The stator de-energizes."], "jumps": ["P13140", "P13090"]}, {"id": "P13140", "text": ["D1 is an LED and illuminates when the stator is magnetized. R2 limits current through D1 (D1 is not normally part of driver circuits, it's used for visual checks in this experiment)."], "jumps": ["P13150", "P13090"]}, {"id": "P13150", "text": ["D2 is used to eliminate inductive kick back and prevents excessive reverse current flow from damaging Q1."], "jumps": ["P13160", "P13090", "P13155"]}, {"id": "P13152", "text": ["D2 is used to eliminate inductive kick back and prevents excessive reverse current flow from damaging Q1."], "jumps": ["P13155", "P13160", "P13090"]}, {"id": "P13155", "text": ["Inductive Kick Back - Inductive kick back is the voltage and current generated in a coil when the energizing voltage is removed. When the voltage is removed, the magnetic field collapses cutting the wires that make up the coil. Since there is motion between the magnetic field and a conductor, a voltage/current is produced that opposes the energizing applied voltage.", "The controller is the circuit that applies the input to the drivers in the correct sequence for CW and CCW rotation.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13170", "P13152"]}, {"id": "P13170", "text": ["This circuit uses the two phase energized pattern."], "jumps": ["P13180", "P13160"]}, {"id": "P13180", "text": ["U1 is a counter IC chip that counts on each clock input to Pin 15. The clock input is the PPS rate."], "jumps": ["P13190", "P13160"]}, {"id": "P13190", "text": ["The counter counts up (00, 01, 10, 11) and down (00, 11, 10, 01) depending on the input level to Pin 10 to produce CW and CCW rotation of the motor."], "jumps": ["P13200", "P13160"]}, {"id": "P13200", "text": ["The Q0 and Q1 outputs of U1 are applied to U3, a decoder IC chip."], "jumps": ["P13210", "P13160"]}, {"id": "P13210", "text": ["The decoder chip produces one high output on the Q lines depending on the count contained in U1."], "jumps": ["P13220", "P13160"]}, {"id": "P13220", "text": ["An input count of 00 causes Q0 to be high.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P13230", "P13160"]}, {"id": "P13230", "text": ["The high Q0 output of U3 causes a high output on OR gates U4A and U4D, the inputs to the A and B drivers.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P13240", "P13160"]}, {"id": "P13240", "text": ["An input count of 01 causes Q1 to be high.", "An input count of 01 causes Q1 to be high..................", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13250", "P13160"]}, {"id": "P13250", "text": ["The high Q1 output of U3 causes a high output on OR gates U4C and U4D, the inputs to the A and B drivers."], "jumps": ["P13260", "P13241"]}, {"id": "P13260", "text": ["An input count of 10 causes Q2 to be high.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P13270", "P13241"]}, {"id": "P13270", "text": ["The high Q2 output of U3 causes a high output on OR gates U4B and U4C, the inputs to the B and A drivers."], "jumps": ["P13280", "P13241"]}, {"id": "P13280", "text": ["An input count of 11 causes Q3 to be high.", "A Q0 B U3 Q1 C Q2 D Q3 40288"], "jumps": ["P13290", "P13241"]}, {"id": "P13290", "text": ["The high Q3 output of U3 causes a high output on OR gates U4A and U4B, the inputs to the A and B drivers."], "jumps": ["P13300", "P13241"]}, {"id": "P13300", "text": ["This table sums up controller circuit operation for counting up. This pattern produces CW rotation."], "jumps": ["P13310", "P13241"]}, {"id": "P13310", "text": ["This table sums up controller circuit operation for counting down. This pattern produces CCW rotation."], "jumps": ["P13320", "P13300"]}, {"id": "P13320", "text": ["Finally, the inputs to U3 for clock and U/D consists of three switches and three inverters."], "jumps": ["P13330", "P13300"]}, {"id": "P13330", "text": ["S3 controls CW or CCW rotation by applying +5 volts or a ground to U3 Pin 10. When 5 V is applied, the rotation is CW. When GND is applied, the rotation is CCW."], "jumps": ["P13340", "P13320"]}, {"id": "P13340", "text": ["S2 controls the mode. RUN is continuous pulses and STEP applies a pulse each time S1 is depressed."], "jumps": ["P13350", "P13320"]}, {"id": "P13350", "text": ["Inverter U2A drives an LED that illuminates for all applied pulses."], "jumps": ["P13360", "P13320"]}, {"id": "P13360", "text": ["Inverter U2B, R2, R3, and C2 are configured as an oscillator. This oscillator supplies continuous pulses... oscillator that supplies continuous pulses."], "jumps": ["P13370", "P13320"]}, {"id": "P13370", "text": ["The PPS of the oscillator is controlled by R3. Remember, PPS can not exceed SR and EFSS rates."], "jumps": ["P13380", "P13320"]}, {"id": "P13380", "text": ["Let's start the experiment! ew the schematic during the experiment press Ctrl S.."], "jumps": ["P13390", "P13320"]}, {"id": "P13390", "text": ["2. Insert the PC130-181 into the PC position on the Test Console.", "2. Insert the PC130-181 into the PC1 position on the Test Console.", "1. Set the Test Console controls to their initial control settings........"], "jumps": ["P13380"]}, {"id": "P13400", "text": ["2. Insert the PC130-181 into the PC1 position on the Test Console. sole. into the PC1 position on the Test Console. Test Console."], "jumps": ["P13410"]}, {"id": "P13410", "text": ["4. Check to see that your voltage select is set to 5.", "4. Press Enter to Set - Positive Supply Voltage - 5", "A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr", "3. On PC130-181, set the controls as follows:............."], "jumps": ["P13400", "P13415"]}, {"id": "P13415", "text": [], "jumps": []}, {"id": "P13420", "text": ["5. Press Enter to Set: PC1 DC Power Switch - ON", "5. Press Enter to Set: PC DC Power Switch - ON", "4. Press Enter to Set - Positive Supply Voltage - 55......................"], "jumps": ["P13410"]}, {"id": "P13430", "text": ["5. Press Enter to Set: PC1 DC Power Switch - ON Observe the wheel."], "jumps": []}, {"id": "P13440", "text": ["Is the stepper motor continually rotating CW (you may see skipped steps or rotate CCW until the position of the rotor matches the energizing of the stators)?"], "jumps": []}, {"id": "P13441", "text": [], "jumps": []}, {"id": "P13442", "text": ["A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr", "The stepper motor should be rotating CW. Check your setup.our setup."], "jumps": []}, {"id": "P13450", "text": ["You have set up the experiment card correctly. Let's first observe CW and CCW rotation in the Run and Step modes."], "jumps": ["P13460", "P13440"]}, {"id": "P13460", "text": ["1. Ensure S2 is set to RUN and S3 set to CW. Rotate R3 fully CCW. The stepper is rotating CW. Observe the LED's.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13470", "P13450", "P13465"]}, {"id": "P13470", "text": ["The Clock LED is flashing. The LED illuminates on each positive pulse from the oscillator. The stator LEDs are indicating the CW energizing sequence of the stators. Check the sequence for two phase energized pattern, AB, AB, BA, and AB."], "jumps": ["P13480", "P13460"]}, {"id": "P13480", "text": ["2. Place S3 to CCW. The stepper motor is rotating CCW.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13490", "P13460", "P13485"]}, {"id": "P13490", "text": ["The Clock LED is flashing. The LED illuminates on each positive pulse from the oscillator. The stator LEDs are indicating the CCW energizing sequence of the stators. Check the sequence for two phase energized pattern, AB, AB, BA, and AB."], "jumps": ["P13500", "P13480"]}, {"id": "P13500", "text": ["You have seen the operation of the stepper motor rotating CW and CCW in the Run mode. Now, let's check the Step mode."], "jumps": ["P13510", "P13490"]}, {"id": "P13510", "text": ["3. Place S2 to STEP. The stepper motor should not be rotating.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13520", "P13500", "P13515"]}, {"id": "P13520", "text": ["4. Press and release S1 once. What happened to the rotation of the stepper motor????????"], "jumps": ["P13510"]}, {"id": "P13521", "text": [], "jumps": []}, {"id": "P13522", "text": ["The stepper should have rotated CCW. Check that S3 is still set to CCW."], "jumps": []}, {"id": "P13523", "text": ["The stepper motor will not rotate continuously when S2 is set to Step.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": []}, {"id": "P13530", "text": ["5. Press and release S1 at least four more times. The stepper motor should rotate 18 degrees and stop on each depression of S1. Check the stator LEDs and verify the sequence is correct for CCW rotation, AB, AB, BA and AB................."], "jumps": ["P13540", "P13520", "P13525"]}, {"id": "P13540", "text": ["6. Place S3 to CW. 7. Press and release S1 several times....", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13550", "P13530", "P13545"]}, {"id": "P13550", "text": ["Verify the stepper motor is rotating 18 degrees each time S1 is depressed and the rotation is CW: AB, AB, BA and AB....."], "jumps": ["P13560", "P13540"]}, {"id": "P13560", "text": ["Calculate the number of steps that it will take to rotate the stepper one complete revolution considering that each step is 18 degrees."], "jumps": ["P13550", "P13565"]}, {"id": "P13561", "text": [], "jumps": []}, {"id": "P13562", "text": ["You calculated the number of complete stator cycles that it would take for one complete revolution.", "1.8 degrees per step requires 200 pulses for a complete revolution (360 degrees divided by 1.8 degrees).", "200 pulses per revolution requires 50 complete stator cycles (200 divided by 4 pulses per cycle)."], "jumps": ["P13560"]}, {"id": "P13563", "text": ["You have calculated DPM, degrees per minute.steps..........", "PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM"], "jumps": []}, {"id": "P13565", "text": ["To find the number of steps required to complete one revolution you divide 360 degrees by the degrees per step, 18 in this case."], "jumps": []}, {"id": "P13570", "text": ["8. Press and release S1 until the pointer on the wheel indicates 0 degrees. 9. While counting the number of S1 depressions, depress S1 until the stepper has made one complete revolution."], "jumps": ["P13580", "P13560"]}, {"id": "P13580", "text": ["Your count should agree with the number of times you pressed S1. Since it takes 20 steps to complete one revolution, and recalling that each stator cycle is four steps, there are 5 complete stator cycles per revolution.revolution.."], "jumps": ["P13590", "P13570"]}, {"id": "P13590", "text": ["You have seen the operation of the stepper motor in CW and CCW rotation and in the RUN and STEP modes. Now, let's see the effects of SR and EFSS, and calculate RPM for a given input PPS...", "PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM", "Starting Running Stopping"], "jumps": ["P13600", "P13580"]}, {"id": "P13600", "text": ["1. Place S2 to RUN. Verify that the stepper motor is rotating CW continuously.......", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13610", "P13590", "P13605"]}, {"id": "P13610", "text": ["2. Using a small screw driver, slowly rotate R3 fully clockwise and observe the rotation of the stepper motor.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13620", "P13600", "P13615"]}, {"id": "P13620", "text": ["You should have seen the stepper motor increase the step rate or RPM, while you increased the PPS. Notice that the stepper motor stopped when R3 is fully clockwise."], "jumps": ["P13630", "P13610"]}, {"id": "P13630", "text": ["The stepper motor ceased to operate when the PPS rate exceeded the SLEW RATE."], "jumps": ["P13640", "P13620"]}, {"id": "P13640", "text": ["3. Slowly rotate R3 fully counterclockwise. The stepper motor begins to rotate since you lowered the PPS rate below the slew rate.................."], "jumps": ["P13650", "P13630", "P13615"]}, {"id": "P13650", "text": ["4. Very rapidly rotate R3 fully clockwise. Notice that the stepper motor did not operate correctly. Steps were skipped and the stepper stopped. By rapidly rotating R3 you exceeded the EFSS rate, or Error Free Start-Stop Rate................."], "jumps": ["P13660", "P13640", "P13615"]}, {"id": "P13660", "text": ["5. Rotate R3 to mid position and ensure that S2 is set to RUN and S3 to CW. The stepper motor should be continuously rotating CW.............."], "jumps": ["P13670", "P13650", "P13415"]}, {"id": "P13670", "text": ["6. Using a frequency counter with 1/10 attenuation and a 10 second gate, measure the signal on TP7 and adjust R3 for a measurement of 4 Hz.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13680", "P13660", "P13675"]}, {"id": "P13676", "text": ["Using the Function Generator with 1/10 attenuation and a 10 second gate, measure the signal at TP7 and adjust R3 for a 4 Hz measurement."], "jumps": []}, {"id": "P13680", "text": ["7. Calculate the RPM of the stepper motor with a PPS of 4. Type in the RPM rounded to tenths."], "jumps": ["P13682"]}, {"id": "P13681", "text": [], "jumps": []}, {"id": "P13682", "text": ["You did not calculate the correct RPM. Remember, you must change PPS to PPM because RPM is in minutes. Then you find the number of degrees per minute and divide by 360.", "PPS x 60 = PPM PPM x DRS = DPM DPM/360 =RPMM"], "jumps": []}, {"id": "P13685", "text": ["To calculate RPM use the following formula:", "PPM(min) = PPS x 60 DPM(min) = PPM x DRS RPM(min) = DPM/360", "PPS - pulses per second PPM - pulses per minute DRS - degrees rotation per step DPM - degrees per minute RPM - revolution per minutee"], "jumps": []}, {"id": "P13687", "text": ["You still have not calculated the correct RPM value. You should have calculated approximately 12 RPM."], "jumps": ["P13680"]}, {"id": "P13690", "text": ["8. Count the number of 360 degree rotations of the stepper motor in one minute. Your count should match the RPM calculated. You verified the method used to find RPM..............."], "jumps": ["P13700", "P13680"]}, {"id": "P13700", "text": ["You have seen the characteristics of stepper motors. * SR and EFSS rates effect * RPM calculations Now, let's measure signals in the stepper motor circuit..."], "jumps": ["P13710", "P13690"]}, {"id": "P13710", "text": ["1. Using an oscilloscope, measure the signal on TP7, CLOCK. You should observe a square signal with a frequency of 4 Hz. This is the signal that is applied to the counter IC, U1, when S2 is in Run..", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13720", "P13700", "P13715"]}, {"id": "P13716", "text": ["OSCILLOSCOPE SETUP Sweep Mode - Auto Time Division - .1 msec Time/Div VAR - CAL CH1 Volts/Div - .2 Display Mode - CH1 Trigger - CH1, AC, +"], "jumps": []}, {"id": "P13720", "text": ["2. Place S2 to Step. 3. Press and release S1 several times. With S2 to Step you should have observed that a clock pulse is not generated until S1 is depressed, the Step mode of operation.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13730", "P13710", "P13725"]}, {"id": "P13730", "text": ["Also notice that S1 provides a ground, or 0 volt signal, when pressed. U2C inverts the signal before being applied to U1."], "jumps": ["P13740", "P13720"]}, {"id": "P13740", "text": ["4. Press and release S1 until the LEDs over TP1 and TP4 are illuminated. 5. Ensure that S2 is set to Step and that S3 is set to CW. You will measure signals in the stepper motor circuit for CW rotation first............", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13750", "P13730", "P13745"]}, {"id": "P13750", "text": ["6. Using a multimeter to measure HIGH or LOW signals, measure the signals on TP5/TP6 for U1, TP9 through TP12 for U3, TP1 through TP4 for the stators, and TP8 for the direction. ress Ctrl S and follow the schematic to measure the signals on TP1 through TP12.......", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13760", "P13740", "P13755"]}, {"id": "P13760", "text": ["You should have measured the following levels where 0 is LOW and 1 is HIGH.Note and verify on the schematic that the signals on TP1 through TP4 indicate a LOW when the stator is energized, which turns on the LED...", "When the stator is energized, there is a low on the corresponding test point and LED.....y on the schematic that the signals on TP1 through TP4 indicate a LOW when the stator is energized, which turns on the LED...", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13762", "P13750", "P13770", "P13760"]}, {"id": "P13
