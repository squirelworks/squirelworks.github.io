770", "text": ["The circuit correctly produced the first sequence for two phase energized pattern in the CW rotation."], "jumps": ["P13780", "P13762"]}, {"id": "P13780", "text": ["7. Press S1 once for the next step. Measure the signals at the test points and compare to the table below.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13790", "P13760", "P13785"]}, {"id": "P13790", "text": ["You should have seen that the output of the counter count UP: 00, 01, 10, 11 (TP6 and TP5 respectively). The output of the decoder only set one line HIGH at a time: Q0, Q1, Q2, Q3 (TP12 to TP9 respectively). The stator TPs indicate CW rotation: AB, AB, BA, AB.."], "jumps": ["P13800", "P13780", "P13755"]}, {"id": "P13800", "text": ["8. Place S3 to CCW. 9. Press and release S1 until the LEDs over TP1 and TP4 are illuminated.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13810", "P13790", "P13805"]}, {"id": "P13810", "text": ["10. Using the multimeter, measure TPs 1 through 12. 11. For each step, compare the values to the table below. Press Ctrl S to compare the table with the schematic.........", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13820", "P13800", "P13815"]}, {"id": "P13820", "text": ["You should have seen that the output of the counter count DOWN: 00, 11, 10, 01 (TP6 and TP5 respectively). The output of the decoder set only one line HIGH at a time: Q0, Q3, Q2, Q1 (TP12 , TP9, TP10, and TP11). The stator TPs indicate CCW rotation: AB, AB, BA, AB.."], "jumps": ["P13830", "P13810"]}, {"id": "P13830", "text": ["You have now traced the signals through the stepper circuit. It's time to locate some faults."], "jumps": ["P13840", "P13820"]}, {"id": "P13840", "text": ["1. Set up the PC130-181 card as follows: ................", "A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13850", "P13830", "P13845"]}, {"id": "P13850", "text": ["Troubleshooting stepper motors is easy. First determine if the motor operates in the STEP mode. This reduces the circuit eliminating the CLOCK and stops the rotation for checking the signal levels..."], "jumps": ["P13860", "P13840"]}, {"id": "P13860", "text": ["Checking CW and CCW rotation in the STEP mode will determine if the stepper motor, and it's circuitry, are operating correctly. If not, the fault is in the motor itself or in the circuit..t...."], "jumps": ["P13870", "P13850"]}, {"id": "P13870", "text": ["If the stepper motor operates in the STEP mode, you then switch to the RUN mode to ensure that the oscillator circuit is operating."], "jumps": ["P13880", "P13860"]}, {"id": "P13880", "text": ["The computer will now enter a fault........................................"], "jumps": ["P13870"]}, {"id": "P13890", "text": ["1. With S2 set to STEP and S3 set to CW, press and release S1 and determine if the stepper motor rotates CW."], "jumps": ["P13900", "P13845"]}, {"id": "P13900", "text": ["Does the stepper motor operate in the CW direction?........"], "jumps": ["P13890"]}, {"id": "P13901", "text": [], "jumps": []}, {"id": "P13902", "text": ["The fault inserted does not effect the CW rotation of the stepper motor in the STEP mode."], "jumps": []}, {"id": "P13910", "text": ["2. Place S3 to CCW. 3. Press and release S1 to determine if the step motor rotates in the CCW direction."], "jumps": ["P13920", "P13900", "P13805"]}, {"id": "P13920", "text": ["Does the stepper motor operate in the CCW direction?......."], "jumps": ["P13910"]}, {"id": "P13921", "text": [], "jumps": []}, {"id": "P13922", "text": ["The fault inserted does not effect the stepper motor in the CCW direction when in the STEP mode."], "jumps": []}, {"id": "P13930", "text": ["You have determined that the stepper motor rotates CW and CCW in the STEP mode. Most of the stepper motor circuit has been verified operating correctly. Now let's check out the oscillator that produces the PPS rate.PS rate..."], "jumps": ["P13940", "P13920"]}, {"id": "P13940", "text": ["4. Place S2 to RUN and verify operation of the stepper motor in the CW and CCW direction (S3 set to CCW and CW).", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13950", "P13930", "P13945"]}, {"id": "P13950", "text": ["Does the stepper motor operate in the RUN mode?............"], "jumps": ["P13940"]}, {"id": "P13951", "text": [], "jumps": []}, {"id": "P13952", "text": ["The fault entered effects the RUN mode, check that S2 is in RUN."], "jumps": []}, {"id": "P13960", "text": ["5. Using the oscilloscope, measure the signal on TP7. You should have measured a continuously High signal. This verifies the oscillator is not operating correctly.........................", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P13970", "P13950", "P13965"]}, {"id": "P13966", "text": ["OSCLLOSCOPE SETUP Sweep Mode - Auto Time Division - .1 msec Time/Div VAR - CAL CH1 Volts/Div - .2 Display Mode - CH1 Trigger - CH1, AC, ++++++++"], "jumps": []}, {"id": "P13970", "text": ["6. Using the oscilloscope, carefully measure the signal on U2, Pin 4. Notice that the clock signal is not present. You found the problem, U2B is not producing the signal required for the Run mode operation of the stepper motor."], "jumps": ["P13960", "P13975"]}, {"id": "P13975", "text": ["Carefully measure the signal on U2, Pin 4."], "jumps": []}, {"id": "P13976", "text": ["OSCILLOSCOPE SETUP Sweep Mode - Auto Time Division - .1 msec Time/Div VAR - CAL CH1 Volts/Div - .2 Display Mode - CH1 Trigger - CH1, AC, +++++++++"], "jumps": []}, {"id": "P13980", "text": ["The computer has removed the fault. Verify that the stepper motor operates in the Run mode.s in the Run mode."], "jumps": []}, {"id": "P13990", "text": ["Let's troubleshoot another fault..........................."], "jumps": []}, {"id": "P14000", "text": ["1. Step up the circuit as follows:........................", "A. S2 to RUN B. S3 to CW C. R3 to mid-position D. Wheel to the 0 degree mark as indicated by the pointerrrrrr"], "jumps": ["P14010", "P14005"]}, {"id": "P14005", "text": [], "jumps": []}, {"id": "P14010", "text": ["The computer will now insert the fault..ow................................."], "jumps": ["P14000"]}, {"id": "P14020", "text": ["1. Press and release S1 with S3 set to CW and CCW to check operation in the STEP mode.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P14030", "P14025"]}, {"id": "P14030", "text": ["Is the stepper motor operating correctly in the STEP mode?."], "jumps": ["P14020"]}, {"id": "P14031", "text": [], "jumps": []}, {"id": "P14032", "text": ["The inserted fault effects the stepper motor in the STEP mode."], "jumps": []}, {"id": "P14040", "text": ["The fault is either in the stepper motor itself or in the controller/driver circuit. Let's check."], "jumps": ["P14050", "P14030"]}, {"id": "P14050", "text": ["2. Press and release S1 at least four times with S3 set to CW and CCW while observing the stator LEDs."], "jumps": ["P14060", "P14040", "P14025"]}, {"id": "P14060", "text": ["If the LEDs indicate the correct CW and CCW sequence, the fault is in the stepper motor. If the LEDs do not indicate the correct CW and CCW sequence, the fault is in the controller/driver circuit."], "jumps": ["P14070", "P14050"]}, {"id": "P14070", "text": ["Where is the probable fault?typed.........................."], "jumps": ["P14060"]}, {"id": "P14071", "text": [], "jumps": []}, {"id": "P14072", "text": ["The stator LEDs did not indicate the correct two phase energized sequence. Note that the B LED never illuminated."], "jumps": []}, {"id": "P14080", "text": ["The fault is in the controller/driver circuit since the B stator never energized as indicated by the B LED never illuminating. Let's measure the output signals of U1 and U3."], "jumps": ["P14090", "P14070"]}, {"id": "P14090", "text": ["3. Using the multimeter, measure TP5 and TP6 while pressing and releasing S1 several times with S3 set to CW and CCW.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P14100", "P14080", "P14095"]}, {"id": "P14100", "text": ["Does the counter, U1, count UP (00, 01, 10, 11) with S3 set to CW and count DOWN (00, 11, 10, 01) with S3 set to CCW?"], "jumps": ["P14090"]}, {"id": "P14101", "text": [], "jumps": []}, {"id": "P14102", "text": ["The counter should have counted correctly. Check the way in which you measured the levels."], "jumps": []}, {"id": "P14110", "text": ["You now know that U1 is operating correctly. Next, check out U3."], "jumps": ["P14120", "P14100"]}, {"id": "P14120", "text": ["4. Using the multimeter, measure TP9 through TP12 while pressing and releasing S1 several times with S3 set to CW and CCW.", "A Q0 B U3 Q1 C Q2 D Q3 40288", "P0 Q0 P1 Q1 P2 P3 U1 4516 PE CIN U/D CLK RSTDD"], "jumps": ["P14130", "P14110", "P14125"]}, {"id": "P14130", "text": ["Does the decoder, U3, produce one HIGH output for each count of U1 in the correct sequence (Q0, Q1, Q2, Q3 for CW and Q0, Q3, Q1 for CCW)?"], "jumps": ["P14120"]}, {"id": "P14131", "text": [], "jumps": []}, {"id": "P14132", "text": ["The decoder is operating correctly, only one HIGH output at a time and in the correct sequence for CW and CCW."], "jumps": []}, {"id": "P14140", "text": ["The counter and encoder chips are operating correctly. The fault must be in the driver circuit, the controller circuit is good."], "jumps": ["P14150", "P14130"]}, {"id": "P14150", "text": ["You should have observed that the B stator is not being energized. Therefore, the fault must be in the U4C/Q3 driver circuit."], "jumps": ["P14160", "P14140"]}, {"id": "P14160", "text": ["5. Using a multimeter, measure the signal on TP3 when the B stator should be energized. Press and release S1 until the LEDs over TP1 and TP4 are illuminated. This begins at step 1....."], "jumps": ["P14170", "P14150"]}, {"id": "P14170", "text": ["The measurement on TP3 should be LOW, 0 volts, when the stator energizes on steps 2 and 3. You should have measured around +5 volts for any step, stator B never receives energizing voltage (a LOW since Q3 turns ON applying a ground to TP3 allowing the +5 volts on the other side of the stator to energize the stator's coil). Q3 never turns ON..."], "jumps": ["P14180", "P14160"]}, {"id": "P14180", "text": ["6. Using a multimeter, carefully measure the voltage on Pin 8 of U4C when the stator should be energized. This is the output of the OR gate and is HIGH anytime the B stator should be energized, Q0 or Q1 output of U3 HIGH.............."], "jumps": ["P14190", "P14170", "P14185"]}, {"id": "P14185", "text": ["Carefully measure the voltage on Pin 8 of U4C."], "jumps": []}, {"id": "P14190", "text": ["If the output of U4C is LOW when stator B should be de-energized and HIGH when stator B should be energized, U4C is operating correctly and the fault is in R7 or Q3. If the output of U4C is always LOW, not turning on Q3, the fault is in U4..."], "jumps": ["P14200", "P14180"]}, {"id": "P14200", "text": ["Where is the fault?stion is typed.........................."], "jumps": ["P14190"]}, {"id": "P14201", "text": [], "jumps": []}, {"id": "P14202", "text": ["You should have measured HIGH and LOW outputs of U4C as S1 is depressed and released at least four times. U4 is not the fault."], "jumps": []}, {"id": "P14210", "text": ["You have located the fault to R7 or Q3. In this case, there is an open between R7 and the base of Q3."], "jumps": ["P14220", "P14200"]}, {"id": "P14220", "text": ["The computer will now remove the fault....................................."], "jumps": ["P14210"]}, {"id": "P14230", "text": ["7. Verify that the stepper motor rotates in the CW and CCW direction in the STEP and RUN modes."], "jumps": ["P14240", "P14235"]}, {"id": "P14235", "text": ["OPERATION VERIFICATION 1. S2 to STEP and S3 to CW and CCW while pressing and releasing S1. 2. S2 to RUN and S3 to CW and CCW........"], "jumps": []}, {"id": "P14240", "text": ["1. Disconnect test equipment from the circuit.settings...................."], "jumps": ["P14230"]}, {"id": "P14250", "text": ["2. Set the Test Console Power OFF. OFF.FF................................."], "jumps": []}, {"id": "P14260", "text": ["3. Remove PC130-181. 4. Return all equipment to their designated storage areas...."], "jumps": ["P14910", "P14250"]}, {"id": "P14910", "text": ["This completes the experiment on STEPPER MOTORS.TLE........"], "jumps": ["P14260"]}, {"id": "PINFO", "text": ["07-28-00 Conversion, Text & Branching - lisa 08-10-00 Graphics. doan 08-18-00 Corrections. doan 08-18-00 Ran 1st objective. frieda 08-18-00 Ran experiments A & E. frieda 03-21-01 Ran experiments A & E to check faults. frieda 04-11-01 P13750, removed the sentence that instructs student press ctrl and S to see schematic for signal tracing. Schematic is on Help page. P13980, 2980 moved fault removal to next button of P13970, 2970. P13990, moved fault setting command to the back button of page P13980. Shulz & Penny 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Review of Conversion. Alexis 01-07-03 added bar over A and B on page P1210 - not A, P1220 not A not B, P1230 not B, 1240 not A not B. Lydia 06-12-03 Added Tec Dec 2000 interface to 130E section. mary 06-12-03 Reviewed lesson with trainers TD2000 and 130E. frieda 06-12-03 Added accent lines in text boxes - patty 01-20-04 P1090 changed the not symbol from first B to second A in first sentence. frieda 03-03-04 P2070,13070 changed the wire color code to match what is shown on p2020,13020. -Phil 07-12-04 P3910, P13910 Added end of experiment script per jay. frieda"], "jumps": []}]};
let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
