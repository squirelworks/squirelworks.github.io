<script>
const book = {"title": "9395T617", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .........."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SATELLITE SYSTEMSf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Describe satellite telecommunications systems including satellite types and capabilities. w Understand the advantages and disadvantages of satellite radio. w List multiple access techniques and common satellite electronic circuits.."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: SATELLITE SYSTEMSf asdf asd fasfd asdf asdf sadf", "In this lesson, you will receive an overall technical view of satellite communications systems."], "jumps": []}, {"id": "P410", "text": ["The origins of the modern telecommunications satellite date to Sputnik, the first orbital man-made satellite, launched by the former Soviet Union in 1957. The first fully functional telecommunications satellite was Earlybird I launched by the United States in 1965..."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Satellites have provided the ability to communicate with voice, video, and data around the globe. Advanced technology applications such as DBS (Direct Broadcast Satellite) TV and GPS (Global Positioning System) would have been impossible without the development of satellite radio technology..."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["Telecommunications satellites are microwave relay devices located far above the earth, and therefore, far above the horizon. The satellite's \"view\" of the earth is a direct line-of-sight path and may be expanded or collapsed depending on altitude. Theoretically, three satellites could cover the entire earth, with the exception of the Polar Regions....."], "jumps": ["P440", "P420"]}, {"id": "P440", "text": ["Satellite communications systems compete, and cooperate, with earth based (terrestrial) technologies such as microwave, fiber optics, cable, and ground based radio."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["Let's begin the lesson on SATELLITE SYSTEMS..............................."], "jumps": ["P440"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Traditional satellite telecommunications systems use Geosynchronous Earth Orbiting (GEO) space vehicles. Geosynchronous means the satellite is stationary if viewed from the earth's surface, or completes an orbit every 24 hours."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["GEOs orbit at an altitude of 22,237 miles (36,0000 km) and support Fixed Satellite System (FSS) requirements. The Space Shuttle orbits much lower and is in an asynchronous orbit (completing a complete orbit every 90 minutes)...", "Space Shuttle: 1 rotation every 90 minutes......"], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["GEOs have a large \"Footprint\" (area of coverage on the earth). Frequencies range from 130 MHz to 30 GHz and each of the satellites is positioned approximately 2 degrees apart to prevent interference. Currently, there are at least 192 GEOs in service..."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["Satellite communications links consist of an uplink (RF transmitted from an earth terminal) and downlink (RF transmitted by a space vehicle). The links spend most of their airtime in the vacuum of space, where attenuation is not an issue. This advantage is lost when the links propagate through the earth's atmosphere. See the satellite communications frequency plan.:::::::", "136 - 137 & 148 MHz 136 - 137 & 148 MHz", "400 MHz37 & 148 MHz 136 - 137 & 148 MHz", "Adv. Communication Satellite (ACTS))))))) (ACTS)zzzzzzzzzzzzeeeeeeeeeeee"], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["The links utilize a frequency separation scheme to prevent interference and help defeat the bending effects that the atmosphere has on high frequency RF. The downlink is always a lower frequency than the uplink...", "6 GHz/4 GHZzzzz MHz 136 - 137 & 148 MHz"], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["In order to maximize the strength of the uplink, the transmitted beam is highly focused. The transmit element is centered in a concave, reflective dish antenna."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["The downlink is focused on a particular footprint. When regional concerns require higher resolution, a spot beam antenna may be used to focus the beam into a small area of coverage within the footprint..."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The satellite broadcast can support a huge number of ground stations within the footprint. This makes an FSS ideal for point-to-multipoint communications networks-one uplink and multiple downlinks..."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["All satellite radio systems are divided into 2 parts - Earth Segment and Space Segment. Both segments have the same basic components; antennae, reflective dishes, and supporting electronics. e size of the dish relates directly to the frequency range of the system. As an example, Intelsat I (launched in 1968) had dishes measuring 90 feet in diameter. Direct Broadcast Satellite (DBS) antennas are 12 inches in diameter....."], "jumps": ["P1102", "P1090"]}, {"id": "P1102", "text": ["The size of the dish relates directly to the frequency range of the system. As an example, Intelsat I (launched in 1968) had dishes measuring 90 feet in diameter. Direct Broadcast Satellite (DBS) antennas are 12 inches in diameter.he frequency range of the system. As an example, Intelsat I (launched in 1968) had dishes measuring 90 feet in diameter. Direct Broadcast Satellite (DBS) antennas are 12 inches in diameter....."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["GEO signals are very weak, considering the extreme range and low power output. Transponders may be employed to boost and retransmit the downlink throughout the earth- based network. A currently deployed Intelsat VI satellite supports as many as 46 transponders..."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["How long does it take a GEO satellite to orbit the Earth?.."], "jumps": ["P1110"]}, {"id": "P1121", "text": [], "jumps": []}, {"id": "P1122", "text": ["The Space Shuttle completes an orbit every 90 minutes......", "Space Shuttle: 1 rotation every 90 minutes......"], "jumps": []}, {"id": "P1123", "text": ["If a satellite orbited the earth slower than earth rate (1 rev/24 hours), the satellite could not be geosychronous."], "jumps": []}, {"id": "P1130", "text": ["Very Small Aperture Terminals (VSATs) are the latest type of earth segment systems operating in C and Ka-bands. VSAT is deployed to support private point-to-multipoint networks. Applications include banking, credit verification, and inventory management..."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["VSAT bandwidth is in the 2.4 Kbps - 20 Mbps range. Generally, 64 Kbps data rate service is provided with an aggregate of 512 Kbps for the entire network. Nearly 1,000,000 VSAT terminals are installed worldwide. A large VSAT network could have up to 5,000 terminals."], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Satellite systems can support a number of transponders and therefore have a substantial amount of aggregate bandwidth. A single transponder may provide up to 36 MHz of bandwidth. As a point of reference, Intelsat I could support 240 voice channels. Intelsat VI can support 120,000 voice and 3 TV channels..."], "jumps": ["P1160", "P1130"]}, {"id": "P1160", "text": ["Satellite links are susceptible to environmental interference, particularly in frequencies above 20 GHz (Ka-band). Lower frequencies may compete directly with terrestrial microwave (C band). Satellite systems require extensive error detection, self-test, and automatic correction capabilities.", "Orbit And Attitude Control Propulsion System"], "jumps": ["P1170", "P1130"]}, {"id": "P1170", "text": ["GEOs were designed to operate at extremely long range (over 22,000 miles). Although area of coverage and number of terminals makes a satellite system look like the best radio solution, propagation delay and response time are certainly major detractors..."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["It takes at least 250 milliseconds for RF energy to make the round trip between the earth and space segments. Considering on board processing time, the delay can easily be extended to more than 600 milliseconds (over 1/2 second). Interactive voice, video, and data are not delay tolerant..."], "jumps": ["P1190", "P1160"]}, {"id": "P1190", "text": ["Satellites are commonly used for video teleconferencing. How can this be done if there are delays in the transmission? The satellite broadcast is in lecture mode only. brid mode of operation may be used too, such as watching the lecturer on a TV screen, but responding via a landline voice circuit. Internet access is also being offered, on a limited basis, using a similar hybrid approach....."], "jumps": ["P1192", "P1160"]}, {"id": "P1192", "text": ["A hybrid mode of operation may be used too, such as watching the lecturer on a TV screen, but responding via a landline voice circuit. Internet access is also being offered, on a limited basis, using a similar hybrid approach..."], "jumps": []}, {"id": "P1200", "text": ["National, regional and local regulatory bodies control satellite system segments. Health and safety regulations may impact the placement of terrestrial segment equipment. Frequency allocation is necessary to prevent interference and organize telecommunications assets..."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Low-Earth Orbiting (LEO) and Middle-Earth Orbiting (MEO) satellites operate at much lower altitudes than the GEOs and support Mobile Satellite System (MSS) technologies. LEOs operate from 644 to 2,415 miles and MEOs from 10,062 to 20,940 miles...", "Unlike FSS space vehicles, which are placed in equatorial orbit slots, MSS space vehicles are positioned in groups called \"Constellations\". For example, the Iridium Constellation designed by Motorola has 66 space vehicles. 11 satellites, plus 1 spare, are placed in 6 orbital planes at an altitude of 421.5 miles."], "jumps": ["P1220", "P1200", "P1230", "P1210"]}, {"id": "P1230", "text": ["What is the average round-trip time for RF between the Earth and a GEO?"], "jumps": ["P1210"]}, {"id": "P1231", "text": [], "jumps": []}, {"id": "P1232", "text": ["GEOs don't orbit at less than 2000 miles...................", "Orbit And Attitude Control Propulsion System"], "jumps": []}, {"id": "P1233", "text": ["RF can travel over 46 million miles in 250 sec.............", "Orbit And Attitude Control Propulsion System", "Iridium represents the premier deployment of MSS, but not without problems. The owners defaulted on their loans and the creditors took over in 1999. Regardless of its shortfalls, Iridium will be used as an example of a high-technology satellite communications system."], "jumps": ["P1250", "P1230"]}, {"id": "P1250", "text": ["The Iridium concept involved end users subscribing to a network with fantastic capabilities. All hardware and software were unique to Iridium. An Iridium phone could communicate with another Iridium phone, anywhere on the globe. The phone link was L-Band (1.616-1.626 GHz) and inter-satellite links were Ka-Band (23.18023.38 GHz)....."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["Propagation delays with LEOs are minimal due to the relatively short range between segments. Additionally, the inter-satellite links are operating in the vacuum of space and do not suffer from attenuation. A LEO network is like a cellular phone network in reverse. The phones are fixed (relatively) and the cells are mobile....."], "jumps": ["P1270", "P1240"]}, {"id": "P1270", "text": ["The cellular hand-off process is also performed in reverse; the space segment has to hand-off the user as the cells move overhead. If a call were placed to a non-subscriber, up to 12 regional gateways would be utilized to switch the call to a conventional telephone network."], "jumps": ["P1280", "P1240"]}, {"id": "P1280", "text": ["Iridium was an incredible concept, both technologically and financially. The total capital investment was close to $5 billion and a Iridium phone would cost around $4000. idering the possibilities, the cost may have been worth it. Imagine a climber on the summit of Mount Everest talking to miner in Death Valley; both people are communicating simultaneously on portable hand-held telephones....."], "jumps": ["P1282", "P1240"]}, {"id": "P1282", "text": ["Considering the possibilities, the cost may have been worth it. Imagine a climber on the summit of Mount Everest talking to miner in Death Valley; both people are communicating simultaneously on portable hand-held telephones..."], "jumps": []}, {"id": "P1290", "text": ["Another form of LEO MSS network is the Teledesic network. The word is a combination of Tele, meaning distance, and geodesic, meaning the shortest distance between two points on a given surface. The concept involves the deployment of up to 288 LEOs..."], "jumps": ["P1300", "P1280"]}, {"id": "P1300", "text": ["Teledesic satellites would operate as low as 400 miles and therefore counteract many of the effects of atmospheric attenuation. The intent of the system is to provide Internet access via a satellite gateway. A relatively inexpensive two-way dish connected to the computer would afford the user World Wide Web connectivity....."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Asymmetric access speeds could be up to 2 Mbps on the uplink and 64 Mbps on the downlink were achievable, with symmetric speeds of 64 Mbps becoming available as the technology evolved. The table below summarizes current and future LEO/MEO MSS network deployments...", "136 - 137 & 148 MHz 136 - 137 & 148 MHz", "400 MHz37 & 148 MHz 136 - 137 & 148 MHz", "Adv. Communication Satellite (ACTS))))))) (ACTS)zzzzzzzzzzzzeeeeeeeeeeee"], "jumps": ["P1320", "P1300"]}, {"id": "P1320", "text": ["Satellite communications systems are usually deployed to support point-to-multipoint network topologies. The satellite is a single asset that must be shared by multiple users. User data must not be lost or traded, although delays are tolerable. Sharing the satellite in a cooperative manner is called multiple access.....", "6 GHz/4 GHZzzzz MHz 136 - 137 & 148 MHz"], "jumps": ["P1330", "P1310"]}, {"id": "P1330", "text": ["What is the maximum LEO propagation delay?................."], "jumps": ["P1310"]}, {"id": "P1331", "text": ["Low Earth Orbiting satellites have very little if any propagation delay.", "This is the GEO propagation delay.........................."], "jumps": []}, {"id": "P1340", "text": ["Technology provides several multiple access methods, each having strengths and weaknesses. Hybrid methods may be developed by combining circuitry and/or software. The following multiple access methods will be addressed: ...", "Multiple Access (MA) System Variables Space Division (SDMA) Space or Location Frequency Division (FDMA) Frequency Time Division (TDMA) TimeCode Division (CDMA) Coding Random (RMA) Time and Frequency Demand Assignment (DAMA) Bandwith"], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Space Division Multiple Access (SDMA) takes advantage of the space between the stations on the earth to achieve multiple access. Separate messages are directed to different earth stations on the same frequency. SDMA is made possible with multi-beam antennas or high-speed switches...."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["Frequency Division Multiple Access (FDMA) uses a frequency allocation plan to ensure each earth station has a unique RF frequency assigned. Essentially, FDMA is accomplished by dividing the satellites bandwidth. Intelsat satellites have been using FDMA for years with great success...."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["Time Division Multiple Access (TDMA) is similar in concept to FDMA, except time slots are allocated instead of bandwidth. Each earth station accesses the satellite at the same frequency but must conform to a time sequence. TDMA transmissions are \"bursty\" because data is sent in time segments..."], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Code Division Multiple Access (CDMA), a Spread Spectrum technique, uses a code sequence to identify the message. The code must be synchronized between the satellite and the earth station. CDMA has excellent interference reduction capabilities and can accommodate a large number of users...", "Random Multiple Access (RMA) has the ability to accommodate a very large number of users with private hot lines. Individual calls are connected simultaneously without retransmission delays or network synchronization. RMA uses Spread Spectrum technology and requires a baseband receiver circuit for each user station.....", "Demand Assignment Multiple Access (DAMA) uses the transponder like a telephone network switch to assign channel bandwidth to users on demand. If ground stations don't need much, the DAMA controlled transponder won't use much bandwidth. Coordination must be handled by extensive computer controls and dedicated software....."], "jumps": ["P1390", "P1360", "P1410", "P1420"]}, {"id": "P1420", "text": ["Which multiple access method(s) use frequency as a variable?"], "jumps": ["P1410"]}, {"id": "P1421", "text": [], "jumps": []}, {"id": "P1422", "text": ["SDMA uses space and TDMA uses time........................."], "jumps": []}, {"id": "P1423", "text": ["CDMA uses variable coding.................................."], "jumps": []}, {"id": "P1430", "text": ["The next element of the satellite system to be presented is electronic circuits. Space segment circuits must conform to stringent controls for weight, space available, and shielding. h station circuits tend to be higher performance than space segment equivalents. For example, a satellite power amplifier may generate up to 20 watts, while an earth station power amplifier may generate greater than 2 kilowatts....."], "jumps": []}, {"id": "P1432", "text": ["Earth station circuits tend to be higher performance than space segment equivalents. For example, a satellite power amplifier may generate up to 20 watts, while an earth station power amplifier may generate greater than 2 kilowatts. rmance than space segment equivalents. For example, a satellite power amplifier may generate up to 20 watts, while an earth station power amplifier may generate greater than 2 kilowatts."], "jumps": ["P1440", "P1430"]}, {"id": "P1440", "text": ["Uplink transmission is accomplished at the earth station with Traveling Wave Tube (TWT) or Klystron amplifiers. Both types can generate kilowatt power levels. The output is then sent to the antenna..."], "jumps": ["P1450", "P1430"]}, {"id": "P1450", "text": ["Traveling Wave Tube (TWT) amplifiers are high gain, low noise, and wide bandwidth microwave electron tubes. Operating frequencies are from 300 MHz to 50 GHz. The TWT is primarily a voltage amplifier that can boost RF signals 40 dB..."], "jumps": ["P1460", "P1440"]}, {"id": "P1452", "text": ["Traveling Wave Tube (TWT) amplifiers are high gain, low noise, and wide bandwidth microwave electron tubes. Operating frequencies are from 300 MHz to 50 GHz. The TWT is primarily a voltage amplifier that can boost RF signals 40 dB."], "jumps": ["P1460", "P1440"]}, {"id": "P1455", "text": ["dB - The decibel (dB), one tenth of a bel, is the logarithmic ratio between input and output. An increase of 3 dB indicates a doubling of the power; conversely, -3 dB is a halving of the power. The TWT output of 20 dB is 100 times the input. Some TWTs are capable of 40 dB or 10,000 times the input.", "Source level (dB)Power Ratio 32641010201003010004010000"], "jumps": []}, {"id": "P1460", "text": ["Klystron tubes also serve as amplifiers for the uplink. Klystrons are tunable and operate in the same general range as TWTs but have less gain. Klystrons may also be used as oscillators in other electronics applications..."], "jumps": ["P1470", "P1440"]}, {"id": "P1470", "text": ["Since the antenna is used for both transmitting and receiving, something has to prevent the transmitter from blowing out the rather sensitive receiver. This is accomplished with a diplexer."], "jumps": ["P1480", "P1460"]}, {"id": "P1480", "text": ["The diplexer isolates the transmitter from the receiver by using bandpass filters on the receiver input. Similar filters are used in the transmit path to ensure that received frequencies are directed to the receivers only.."], "jumps": ["P1490", "P1460"]}, {"id": "P1490", "text": ["Earth segment receivers need to be very sensitive and have special amplifiers to capture the weak satellite downlink from space. Low Noise Block Converters (LNBs) or Low Noise Amplifiers (LNAs) circuits are used. The LNB is physically located at the focal point of the parabolic satellite dish..."], "jumps": ["P1510", "P1480"]}, {"id": "P1510", "text": ["The LNA is typically supported by a Field-Effect Transistor (FET)."], "jumps": ["P1520", "P1490"]}, {"id": "P1515", "text": ["Field-Effect Transistor (FET)- a voltage controlled semi-conductor device constructed from a single piece of silicon with additional pieces added to the sides. FETs respond rapidly to input (source) changes without demanding much current and are considered ideal for high frequency applications like satellite communications."], "jumps": []}, {"id": "P1520", "text": ["The down-converter changes the extremely high frequency satellite downlink into an intermediate frequency, usually in the C-Band, permitting the RF to be processed via coaxial cable."], "jumps": ["P1510"]}, {"id": "P1530", "text": ["Earth segment antennas are relatively large to compensate for the weak satellite signal. Antenna diameters range form 12 inches to 100 feet."], "jumps": ["P1540", "P1520"]}, {"id": "P1540", "text": ["Typical satellite on board electronics package consists of a power generation subsystem, antennas, and satellite radio electronics subsystem."], "jumps": ["P1910", "P1530"]}, {"id": "P1910", "text": ["This completes the information on SATELLITE SYSTEMS........"], "jumps": ["P1001", "P1540"]}, {"id": "P1920", "text": ["1. Geosynchronous Earth Orbiting (GEO) satellites are in equatorial orbits at an average altitude of 22,267 miles."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2. Satellite RF signals consist of an uplink (earth to space) and a downlink (space to earth).."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3. Fixed Satellite System (FSS) satellites are ideal for point-to- multipoint applications.", "Space Shuttle: 1 rotation every 90 minutes......"], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4. Transponders are earth-based or space-based stations that boost a weak signal and retransmit to a network."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5. Very Small Aperture Terminals (VSATs) are popular for many applications, such as banking and inventory control."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6. Satellite RF travels mostly in the vacuum of space, but earth's atmosphere causes attenuation effects that must be reduced or eliminated. .", "136 - 137 & 148 MHz 136 - 137 & 148 MHz", "400 MHz37 & 148 MHz 136 - 137 & 148 MHz", "Adv. Communication Satellite (ACTS))))))) (ACTS)zzzzzzzzzzzzeeeeeeeeeeee"], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7. Low Earth Orbiting (LEO) and Middle Earth Orbiting (MEO) satellites support Mobile Satellite System (MSS) networks."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8. Low Noise Block Converters (LNBs) are used to amplify the downlink received by a parabolic dish antenna."], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1990"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 1, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 1, \"P10301\", \"P10302\", \"P103 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
