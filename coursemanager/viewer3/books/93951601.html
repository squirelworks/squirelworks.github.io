const book = {"title": "93951601", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: PCB COMPONENT INSERTION / EXTRACTION TECHNIQUESf"], "jumps": []}, {"id": "P10", "text": ["PCB COMPONENT INSERTION / EXTRACTION TECHNIQUES"], "jumps": []}, {"id": "P100", "text": ["w Identify the general characteristics of PC Boards. w Identify several connection methods used on PC Boards.", "w Identify the general techniques for inserting components into PC Boards. w Identify common faults which may occur when installing components on PC Boards.", "w Identify the general techniques for extracting components from PC Boards. w Identify general techniques for repairing PC Boards traces and pads..n PC Boards..."], "jumps": []}, {"id": "P300", "text": [], "jumps": []}, {"id": "P400", "text": ["Almost every electronic piece of equipment, both commercial and military, contains at least one printed circuit board or PCB. Most electronic equipment contains several PCB's."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Every technician should be familiar with the basic characteristics of printed circuit boards (PCB's).  This familiarity will enable the technician to assess how components should be installed or reworked on the printed circuit board.", "Every technician should be familiar with the basic characteristics of printed circuit boards (PCB's). This familiarity will enable the technician to assess how components should be installed or reworked on the printed circuit board. ard. ."], "jumps": ["P430", "P400", "PCB"]}, {"id": "P430", "text": ["Any repair work involving circuit boards requires that a certain amount of care be taken.  Circuit boards can be easily damaged by technicians who do not know what they are doing.", "Any repair work involving circuit boards requires that a certain amount of care be taken. Circuit boards can be easily damaged by technicians who do not know what they are doing.", "- Ensure proper ground - Use the correct tools - Use the proper test equipment - Work in a clean work environment"], "jumps": ["P440", "P410"]}, {"id": "P440", "text": ["Let's begin the lesson on PCB COMPONENT INSERTION / EXTRACTION TECHNIQUES."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1020", "text": ["Almost all electronic devices contain printed circuit boards or PCB's.  These boards serve as the connection point for the circuit components.  Printed circuit boards provide a much easier and reliable method of circuit connection than using individual wires from component to component.", "Almost all electronic devices contain printed circuit boards or PCB's. These boards serve as the connection point for the circuit components. Printed circuit boards provide a much easier and reliable method of circuit connection than using individual wires from component to component."], "jumps": ["P1030", "P1001"]}, {"id": "P1030", "text": ["A printed circuit board is basically a sheet of insulating material, also known as a baseboard, with copper foil bonded to one or both sides.  The copper is used as the conducting path between components which are mounted on the board.", "A printed circuit board is basically a sheet of insulating material, also known as a baseboard, with copper foil bonded to one or both sides. The copper is used as the conducting path between components which are mounted on the board."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["The baseboard is usually made of layered paper or glass laminates covered with epoxy or resin.  These construction materials give the board high insulation resistance, good temperature stability, shock resistance and can also make them flame proof.  These are all desirable characteristics for a PCB.", "The baseboard is usually made of layered paper or glass laminates covered with epoxy or resin. These construction materials give the board high insulation resistance, good temperature stability, shock resistance and can also make them flame proof. These are all desirable characteristics for a PCB."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["The copper foil which is bonded to a PCB is made of very pure copper, typically 98.5%.  The purity of the copper ensures low       resistance between connections and allows for good quality solder joints.", "The copper foil which is bonded to a PCB is made of very pure copper, typically 98.5%. The purity of the copper ensures low resistance between connections and allows for good quality solder joints."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["Most PCB's start with an entire layer of copper foil on one or both sides.  These boards are typically called blanks.  Once the circuit to be placed on the board has been designed, a template for the circuit paths is developed.", "Most PCB's start with an entire layer of copper foil on one or both sides. These boards are typically called blanks. Once the circuit to be placed on the board has been designed, a template for the circuit paths is developed."], "jumps": ["P1070", "P1030"]}, {"id": "P1070", "text": ["The template of the conductor paths is used in the manufacturing process to remove the extra copper from the board, leaving only the required conductor paths. These pathways, traces, act as connecting wires. This process is known as etching."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["To make the most economical use of a circuit board, both sides of the board are typically etched with appropriate circuit paths. This is called a double-sided circuit board.", "To make the most economical use of a circuit board, both sides of the board are typically etched with appropriate circuit paths. This is called a double-sided circuit board. re only mounted on one side, but can be connected to traces on both sides of the board."], "jumps": ["P1082", "P1070"]}, {"id": "P1082", "text": ["In most instances the components are only mounted on one side, but can be connected to the copper pathways (traces) on both sides of the board. h layer. These are known as multilayer boards and require specialized tools and experience to be repaired."], "jumps": ["P1090", "P1080"]}, {"id": "P1090", "text": ["Once a board has been etched, holes must be drilled in it so that the components can be mounted securely.  With high volume PCB manufacturing, the etching and drilling processes are usually automated and computer controlled.", "Once a board has been etched, holes must be drilled in it so that the components can be mounted securely. With high volume PCB manufacturing, the etching and drilling processes are usually automated and computer controlled.ntrolled...."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["Older style boards often have copper paths or traces on one side only.  These are known as single-sided boards.  However, most boards today are double-sided.", "Older style boards often have copper paths or traces on one side only. These are known as single-sided boards. However, most boards today are double-sided."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["In many newer electronic devices where space is at a premium and circuits are complex, the boards are layered together, with traces and sometimes components on each layer.  These are known as multilayer boards and require specialized tools and experience to be repaired.", "In many newer electronic devices where space is at a premium and circuits are complex, the boards are layered together, with traces and sometimes components on each layer. These are known as multilayer boards and require specialized tools and experience to be repaired. '"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["Once the holes have been drilled in a PCB, it is ready to have components mounted on it.  The copper foil is left in pads around the drill holes so there is enough surface area to securely solder the component to the copper trace.", "Once the holes have been drilled in a PCB, it is ready to have components mounted on it. The copper foil is left in pads around the drill holes so there is enough surface area to securely solder the component to the copper trace.", "Cutaway View of Pad and Drill Hole (Unsupported Hole))", "Drilled Hole ll Hole (Unsupported Hole))", "Pad ll Hole (Unsupported Hole))", "Trace ll Hole (Unsupported Hole))"], "jumps": ["P1122", "P1100"]}, {"id": "P1122", "text": ["When dealing with components that are mounted on single-sided boards, the pad is only bonded to the board on one side and the hole is drilled through the board.  This is called an unsupported hole.", "When dealing with components that are mounted on single-sided boards, the pad is only bonded to the board on one side and the hole is drilled through the board. This is called an unsupported hole.nd must be treated carefully when being soldered, or the pad may come loose from the board due to excess heat."], "jumps": ["P1130", "P1120"]}, {"id": "P1130", "text": ["Unsupported holes must be treated carefully when being soldered.   If excess heat  is applied the pad may come loose from the board.", "Unsupported holes must be treated carefully when being soldered. If excess heat is applied the pad may come loose from the board. rted hole and must be treated carefully when being soldered, or the pad may come loose from the board due to excess heat.", "Unsupported Hole With Lifted Pad (Unsupported Hole))"], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["In situations where a component lead, or a jumper is passed through the board to connect on both sides, there are a number of possible connection methods.  The simplest of these involves passing the lead through the board and soldering it to pads on both sides of the board.", "In situations where a component lead, or a jumper is passed through the board to connect on both sides, there are a number of possible connection methods. The simplest of these involves passing the lead through the board and soldering it to pads on both sides of the board. (GRAPHICS TEXT) A JUMPER SOLDERED TO PADS ON BOTH SIDES OF A BOARDDDDDDDDD"], "jumps": ["P1150", "P1120"]}, {"id": "P1150", "text": ["A more reliable method of through-the-board connection is a plated- through hole.  In this situation, the pads on either side of the board are connected by continuous copper plating or some type of  eyelet that goes through the board.  This is known as a supported hole.", "A more reliable method of through-the-board connection is a plated- through hole. In this situation, the pads on either side of the board are connected by continuous copper plating or some type of eyelet that goes through the board. This is known as a supported hole. SUPPORTED HOLEEEEEEEEEEEEEEEEEEEE"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Other printed circuit board connectors include cup terminals, , turret terminals, and bifurcated terminals.  These connectors serve as anchor points for external wires which are fed to the board.", "Other printed circuit board connectors include cup terminals, , turret terminals, and bifurcated terminals. These connectors serve as anchor points for external wires which are fed to the board. ous lesson."], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["Although  supported hole connectors and terminals are strong and sturdy they can break.  Bad connectors and terminals are often detected by a visual inspection.", "Although supported hole connectors and terminals are strong and sturdy they can break. Bad connectors and terminals are often detected by a visual inspection. s good or better than the original work."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Remember that when doing any work to a printed circuit board, it is wise to first inspect the board closely.", "Remember that when doing any work to a printed circuit board, it is wise to first inspect the board closely. A repair job should always be as good or better than the original work. good or better than the original work."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["A  good technician always ensures that the repair job is as good or better than the original work.", "A good technician always ensures that the repair job is as good or better than the original work. original work. good or better than the original work."], "jumps": ["P1910", "P1170"]}, {"id": "P1699", "text": ["The following ten (10) questions provide you with a review of the material covered on Printed Circuit Boards."], "jumps": ["P1700", "P1001"]}, {"id": "P1700", "text": ["1.  What is the most common method used to connect many\n     components together in a circuit?", "1. What is the most common method used to connect many components together in a circuit? These boards serve as the connection point for the circuit components."], "jumps": []}, {"id": "P1710", "text": ["2.  How does a PCB route the applied circuit power to its                      components?", "2. How does a PCB route the applied circuit power to its components?", "Through copper paths on the board surface.", "The glass/resin material conducts the current.", "Through jumper wires from component to component."], "jumps": []}, {"id": "P1720", "text": ["3.  Select the figure which shows a double sided PCB.", "3. Select the figure which shows a double sided PCB......."], "jumps": []}, {"id": "P1730", "text": ["4.  Why must the copper foil used on printed circuit boards be             very pure?", "4. Why must the copper foil used on printed circuit boards be very pure?", "Because it has a low resistance.eeeeeeee", "So that the copper can be easily removed from the board.", "ugh jumper wires from component to component."], "jumps": []}, {"id": "P1740", "text": ["5. Which of the following is not a desirable characteristic of PCB        material?", "5. Which of the following is not a desirable characteristic of PCB material??"], "jumps": []}, {"id": "P1750", "text": ["6.  What is the typical purity of the copper foil which is bonded to        printed circuit boards?", "6. What is the typical purity of the copper foil which is bonded to printed circuit boards?"], "jumps": []}, {"id": "P1760", "text": ["7.  Why are holes necessary in printed circuit boards?", "7. Why are holes necessary in printed circuit boards?.....", "To improve airflow around the components."], "jumps": []}, {"id": "P1770", "text": ["8.  Why are copper foil pads left around drill holes in a PCB?", "8. Why are copper foil pads left around drill holes in a PCB?", "To give enough area for the solder connection.", "To increase the mechanical strength of the circuit board.", "To increase the electrical resistance of the connection."], "jumps": []}, {"id": "P1780", "text": ["9.  What can happen to a copper circuit pad if too much heat is            applied to it?", "9. What can happen to a copper circuit pad if too much heat is applied to it?", "The bond between the pad and the board may loosen.", "Its resistance will increase drastically.", "The copper will increase the surface area that it covers."], "jumps": []}, {"id": "P1790", "text": ["10.  Which of the following diagrams is a plated-through\n        hole?", "10. Which of the following diagrams is a plated-through hole????????le?"], "jumps": []}, {"id": "P1799", "text": ["You have completed the Exercise.\nYou are about to return to the Objective Menu.", "You have completed the Exercise. You are about to return to the Objective Menu......."], "jumps": ["P1001", "P1790"]}, {"id": "P1800", "text": [], "jumps": []}, {"id": "P1801", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on PRINTED CIRCUIT BOARDS.", "This completes the information on PRINTED CIRCUIT BOARDS..."], "jumps": ["P1001", "P1190"]}, {"id": "P1920", "text": ["1.  The use of printed circuit boards or PCB's is a convenient and       common method of connecting components in an electrical           circuit.", "1. The use of printed circuit boards or PCB's is a convenient and common method of connecting components in an electrical circuit."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Most PCB's are made of glass/epoxy laminates and covered          with a thin layer of copper which is etched to form conducting       paths.", "2. Most PCB's are made of glass/epoxy laminates and covered with a thin layer of copper which is etched to form conducting paths."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  PCB's can be single-sided, double-sided, or multilayer.", "3. PCB's can be single-sided, double-sided, or multilayer."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Holes are drilled into the circuit board to mount components         on the board.  Care must be taken when soldering                             components into, or removing components from the board,           so excess heat does not damage the copper connection                 traces.", "4. Holes are drilled into the circuit board to mount components on the board. Care must be taken when soldering components into, or removing components from the board, so excess heat does not damage the copper connection traces."], "jumps": ["P1960", "P1940"]}, {"id": "P1960", "text": ["5.  In double-sided boards, the components must sometimes be        passed through the board and connected on both sides. This       may be done using an unsupported hole or a plated- through        hole. The plated- through hole is more reliable.", "5. In double-sided boards, the components must sometimes be passed through the board and connected on both sides. This may be done using an unsupported hole or a plated- through hole. The plated- through hole is more reliable."], "jumps": ["P1970", "P1950"]}, {"id": "P1970", "text": ["6.  When attempting repair or modification of any printed circuit           board, it is wise to try and make the work as good, or better in       quality than the original board.", "6. When attempting repair or modification of any printed circuit board, it is wise to try and make the work as good, or better in quality than the original board."], "jumps": ["P1999", "P1960"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1001", "P1970"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2020", "text": ["When building a project or repairing a piece of electrical equipment, we are often required to mount components on a printed circuit board.  This is sometimes referred to as loading or stuffing the board.", "When building a project or repairing a piece of electrical equipment, we are often required to mount components on a printed circuit board. This is sometimes referred to as loading or stuffing the board."], "jumps": ["P2030", "P2001", "P"]}, {"id": "P2030", "text": ["However, component insertion into PCB's requires more than simply soldering the components to the board.  There are several important steps which must be taken before any soldering is done.", "However, component insertion into PCB's requires more than simply soldering the components to the board. There are several important steps which must be taken before any soldering is done."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["It is convenient to illustrate the procedure for installing components by using an example.  In this instance, we will use a  resistor as the component that we wish to install on the printed     circuit board.", "It is convenient to illustrate the procedure for installing components by using an example. In this instance, we will use a resistor as the component that we wish to install on the printed circuit board."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["We will assume that the circuit board on which the resistor is to be mounted has already been etched and drilled to accept components."], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["The first step in the installation process is to bend the leads of the resistor to fit into the drill holes of the board.  There is a     specific method for doing this, using either a lead former tool or    rounded needlenose pliers.", "The first step in the installation process is to bend the leads of the resistor to fit into the drill holes of the board. There is a specific method for doing this, using either a lead former tool or rounded needlenose pliers."], "jumps": ["P2070", "P2050"]}, {"id": "P2070", "text": ["Ordinary pliers should not be used to bend the resistor leads because we do not want to nick the wire, as a nick will reduce the mechanical strength of the lead.", "Ordinary pliers should not be used to bend the resistor leads because we do not want to nick the wire, as a nick will reduce the mechanical strength of the lead...."], "jumps": ["P2080", "P2060"]}, {"id": "P2080", "text": ["The bends in the leads should be kept at least 1/8\" away from the body of the component.  This prevents mechanical stress from damaging the component body or the body/lead junction.", "The bends in the leads should be kept at least 1/8\" away from the body of the component. This prevents mechanical stress from damaging the component body or the body/lead junction.", "1/8\"mmmMinimum 1.5 mm Minimummmmmmmmmmmmm"], "jumps": ["P2090", "P2070"]}, {"id": "P2090", "text": ["There are several possible types of mounting techniques used to install components on printed circuit boards.", "There are several possible types of mounting techniques used to install components on printed circuit boards. e most common of these are shown below."], "jumps": ["P2100", "P2080"]}, {"id": "P2091", "text": ["STRAIGHT-THROUGH MOUNT - One of the most commonly used types of termination. Because it does not have any bends in the lead after it passes through the board it is the easiest type of termination to remove and replace."], "jumps": []}, {"id": "P2092", "text": ["FULL CLINCH MOUNT - This termination is mostly used when components are mounted in unsupported holes however, it can be used in supported holes. The bend in the lead helps to stabilize the component so it does not move during soldering."], "jumps": []}, {"id": "P2093", "text": ["OFFSET PAD MOUNT - A variation of the surface mount. It is not uncommon to find that the pad where the lead is to be joined is some distance away from the hole."], "jumps": []}, {"id": "P2094", "text": ["SEMI-CLINCHED MOUNT - A variation of the full clinched lead where the lead is bent at a 45", "angle. The smaller bend makes it easier to remove and replace the component."], "jumps": []}, {"id": "P2095", "text": ["SPADE MOUNT - After the lead is passed through the hole it is flattened. This keeps the component in place during soldering. Removal of a spade mounted component requires special procedures."], "jumps": []}, {"id": "P2096", "text": ["SURFACE MOUNT - Holes are not drilled in the boards for surface mounting. Components leads are soldered directly to flat pads on the surface of the board."], "jumps": []}, {"id": "P2100", "text": ["While any of these methods may be used on mass-produced PCB's, the straight-through mount is most often used in repair or project work."], "jumps": ["P2110", "P2090"]}, {"id": "P2110", "text": ["Which of the following diagrams shows a full-clinch mount?", "Which of the following diagrams shows a full-clinch mount?."], "jumps": ["P2100"]}, {"id": "P2111", "text": [], "jumps": []}, {"id": "P2112", "text": ["This is a straight -through mount.  A full clinch mount has bent leads.", "This is a straight -through mount. A full clinch mount has bent leads... mechanically clinched to the printed circuit board as well as being soldered.ed.."], "jumps": []}, {"id": "P2113", "text": ["This is a semi-clinched mount.  A full clinch mount does have bent leads but they are at a 90\u00ba angle,  the leads of a semi-clinched mount are bent at 45\u00ba.", "This is a semi-clinched mount. A full clinch mount does have bent leads but they are at a 90", "angle, the leads of a semi-clinched mount are bent at 45"], "jumps": []}, {"id": "P2114", "text": ["This is a spade mount. The leads of a  full clinch mount are not flattened, they are bent.", "This is a spade mount. The leads of a full clinch mount are not flattened, they are bent...............................board as well as being soldered."], "jumps": []}, {"id": "P2120", "text": ["Before the component is installed on the circuit board, both the component leads and the solder pads should be cleaned.  In most cases, an eraser does a good job of removing dirt and oxides from the metal surfaces.", "Before the component is installed on the circuit board, both the component leads and the solder pads should be cleaned. In most cases, an eraser does a good job of removing dirt and oxides from the metal surfaces."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["Try not to touch the component leads or solder pads with your fingers, as oils from your skin can reduce the bonding strength  of  the solder joint.  A good general rule is to keep all areas that     solder will contact as clean as possible.", "Try not to touch the component leads or solder pads with your fingers, as oils from your skin can reduce the bonding strength of the solder joint. A good general rule is to keep all areas that solder will contact as clean as possible.", "&& & ?!?!!!!!!!!!?!!?!!!!!!!!!!!!!?!!!!!!!!!!!!!!!!!!!!!!!!!!!!"], "jumps": ["P2140", "P2120"]}, {"id": "P2140", "text": ["Once the component leads have been fed through the board, and it is seated in the right position, the leads should be clipped to the correct length.  For a straight-through connection, the lead length that protrudes through the board should be no greater than the pad radius.", "Once the component leads have been fed through the board, and it is seated in the right position, the leads should be clipped to the correct length. For a straight-through connection, the lead length that protrudes through the board should be no greater than the pad radius."], "jumps": ["P2150", "P2130"]}, {"id": "P2150", "text": ["Once the leads have been cut to the correct length, solder can be applied to complete the connection.  The soldering tip is touched to the lead and pad to heat the connection first, then solder is fed in from the other side.", "Once the leads have been cut to the correct length, solder can be applied to complete the connection. The soldering tip is touched to the lead and pad to heat the connection first, then solder is fed in from the other side. er is fed in from the other side."], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": [], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Using the correct amount of solder on a joint requires practice.  A connection may hold a range of solder amounts and still be acceptable.  However, it is also possible to use too much or too little solder.", "Using the correct amount of solder on a joint requires practice. A connection may hold a range of solder amounts and still be acceptable. However, it is also possible to use too much or too little solder."], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["Which of the choices below is the most commonly used mounting technique for components in repair work?"], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["The  full clinched mount is not the most commonly used mounting technique.  The bent leads make it easier to solder a component in place but, it makes component removal and replacement more difficult.", "The full clinched mount is not the most commonly used mounting technique. The bent leads make it easier to solder a component in place but, it makes component removal and replacement more difficult..."], "jumps": []}, {"id": "P2184", "text": ["The spade mount is not the most commonly used mounting technique.  Removal of a spade mounted component is more difficult than any other mount and requires special procedures.", "The spade mount is not the most commonly used mounting technique. Removal of a spade mounted component is more difficult than any other mount and requires special procedures."], "jumps": []}, {"id": "P2190", "text": ["In all cases, a good solder connection should have the following characteristics:", "In all cases, a good solder connection should have the following characteristics: (GRAPHICS TEXT) SOLDER CONNECTION CHARACTERISTICS - smooth solder surface - well feathered towards edges - no pits or holes - no evidence of flux", "- smooth solder surface - well feathered towards edges - no pits or holes - no evidence of flux - bright and shiny appearance - concave characteristic"], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["Once the connection has been completed and has sufficiently cooled, (the ideal maximum time to form a solder joint is approximately 2 seconds) it should be inspected for quality.  If there is a problem with the connection, it is probably one of the four types of unacceptable joints.", "Once the connection has been completed and has sufficiently cooled, (the ideal maximum time to form a solder joint is approximately 2 seconds) it should be inspected for quality. If there is a problem with the connection, it is probably one of the four types of unacceptable joints. - Rosin joints - cold joint", "TYPES OF UNACCEPTABLE CONNECTIONS - rosin joints - cold joint - disturbed joint - overheated joint"], "jumps": ["P2210", "P2190"]}, {"id": "P2210", "text": ["A rosin joint occurs if too little heat is applied.  In this case there is still some solidified solder between the lead and the pad.    There may also be traces of flux on the solder surfaces.", "A rosin joint occurs if too little heat is applied. In this case there is still some solidified solder between the lead and the pad. There may also be traces of flux on the solder surfaces."], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["A cold joint occurs when the heat is removed from the connection too quickly.  In this instance the solder does not properly bond to the surfaces and may look like a water drop.  It is also dull grey in appearance.", "A cold joint occurs when the heat is removed from the connection too quickly. In this instance the solder does not properly bond to the surfaces and may look like a water drop. It is also dull grey in appearance."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["A disturbed joint may happen if the lead which is being soldered is moved while the solder is hardening.  This joint looks frosty and may show cracks in the solder.", "A disturbed joint may happen if the lead which is being soldered is moved while the solder is hardening. This joint looks frosty and may show cracks in the solder."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["The last type of general solder fault is an overheated joint.  This connection results from repeated attempts to solder the connection,  and looks dull and pitted.  Too much heat at the connection point may also cause the solder pad to lift from the board or damage the component.", "The last type of general solder fault is an overheated joint. This connection results from repeated attempts to solder the connection, and looks dull and pitted. Too much heat at the connection point may also cause the solder pad to lift from the board or damage the component."], "jumps": ["P2250", "P2210"]}, {"id": "P2250", "text": ["If inspection of a finished solder connection reveals any of these problems, the connection should be redone.  This means that the old solder must be completely removed, the parts cleaned thoroughly, and the process started again.", "If inspection of a finished solder connection reveals any of these problems, the connection should be redone. This means that the old solder must be completely removed, the parts cleaned thoroughly, and the process started again."], "jumps": ["P2260", "P2210", "P0"]}, {"id": "P2260", "text": ["However, any technician who takes care making a connection the first time, will rarely have to correct mistakes.", "However, any technician who takes care making a connection the first time, will rarely have to correct mistakes. will rarely have to correct mistakes."], "jumps": ["P2910", "P2250"]}, {"id": "P2699", "text": ["The following ten (10) questions will help you review the material covered in the objective on PC Board Component Insertion."], "jumps": ["P2700", "P2001"]}, {"id": "P2700", "text": ["1.  What is the process of installing components on a printed              circuit board called?", "1. What is the process of installing components on a printed circuit board called?"], "jumps": []}, {"id": "P2710", "text": ["2.  Why should component leads not be formed into position               using ordinary pliers?", "2. Why should component leads not be formed into position using ordinary pliers?", "Because the leads a tempting to remove the component. This may require a special heat / vacuum tool.", "Solder Vacuum Tippm a plated-through hole"], "jumps": ["P3050"]}, {"id": "P3062", "text": ["If it is plated-through and the hole is filled with solder, you must    ensure that all solder has been removed before attempting to remove the component.  This may require a special heat / vacuum tool.", "If it is plated-through and the hole is filled with solder, you must ensure that all solder has been removed before attempting to remove the component. This may require a special heat / vacuum tool. t all solder has been removed before attempting to remove the component. This may require a special heat / vacuum tool.", "Heat/Vacuum Tippppm a plated-through hole", "Heat is applied to solder joint which melts solder. As the solder melts it is vacuumed up."], "jumps": ["P3060"]}, {"id": "P3070", "text": ["Once the solder from the old connection has been removed, the component should be lifted using pliers.  If it still seems to be       connected, there may be a residual solder connection, or the         component may be sweated to the trace.  In either case, additional heat may be needed to finally remove the component.", "Once the solder from the old connection has been removed, the component should be lifted using pliers. If it still seems to be connected, there may be a residual solder connection, or the component may be sweated to the trace. In either case, additional heat may be needed to finally remove the component."], "jumps": ["P3062"]}, {"id": "P3075", "text": ["SWEATED - When two pieces of metal are soldered together, flux and heat cause the solder to melt and thin. The solder seeps into small cracks and spaces in and between the two metals. When the solder cools the two metal pieces are adhered to each other."], "jumps": []}, {"id": "P3080", "text": ["When removing components from PCB's, you must monitor the amount of heat that is applied to the joint. Too much heat can easily damage the thin copper traces on the circuit board as well as the board material itself. A common rule of thumb is to apply heat to a desoldered connection for a maximum of three seconds only."], "jumps": ["P3090", "P3070"]}, {"id": "P3090", "text": ["When doing any repair to a printed circuit board, you should be aware that manufactured boards are often covered with a protective coating.", "When doing any repair to a printed circuit board, you should be aware that manufactured boards are often covered with a protective coating. e coating may provide electrical insulation, protection against mechanical vibrations, or protect against humidity. There are many types of coatings and they can be difficult to remove for board repair."], "jumps": ["P3070"]}, {"id": "P3092", "text": ["The coating may provide electrical insulation, protection against mechanical vibrations, or protect against humidity.  There are many types of coatings and they can be difficult to remove for board repair.", "The coating may provide electrical insulation, protection against mechanical vibrations, or protect against humidity. There are many types of coatings and they can be difficult to remove for board repair. e are many types of coatings and they can be difficult to remove for board repair."], "jumps": ["P3090"]}, {"id": "P3100", "text": ["If you do encounter a coated board that requires repair, check the technical manuals to see how the coating can be removed, or consult with someone who is familiar with the equipment.  The method used to remove the coating usually depends upon the coating type and extent of the repair work to be performed.", "If you do encounter a coated board that requires repair, check the technical manuals to see how the coating can be removed, or consult with someone who is familiar with the equipment. The method used to remove the coating usually depends upon the coating type and extent of the repair work to be performed."], "jumps": ["P3090"]}, {"id": "P3110", "text": ["Once a component has been removed from a PCB, we must use the same steps that were covered in PC BOARD COMPONENT INSERTION to install the replacement component.  It is especially important to ensure the connection areas are clean of flux, dirt, and oils when replacing components.", "Once a component has been removed from a PCB, we must use the same steps that were covered in PC BOARD COMPONENT INSERTION to install the replacement component. It is especially important to ensure the connection areas are clean of flux, dirt, and oils when replacing components. (GRAPHICS TEXT) Clean components make a good connection!"], "jumps": ["P3100"]}, {"id": "P3120", "text": ["Which of the following factors is important when attempting component replacement on a PC board?", "To carefully remove the original component.", "To ensure all connections are clean.ponent"], "jumps": ["P3110"]}, {"id": "P3121", "text": [], "jumps": []}, {"id": "P3122", "text": ["To repair a circuit board it is important to inspect the board \nthoroughly but this is not the only important factor.", "To repair a circuit board it is important to inspect the board thoroughly but this is not the only important factor."], "jumps": []}, {"id": "P3123", "text": ["To repair a circuit board it is important to carefully remove the original component but this is not the only important factor.", "To repair a circuit board it is important to carefully remove the original component but this is not the only important factor.."], "jumps": []}, {"id": "P3124", "text": ["To repair a circuit board it is important to ensure that all connections are clean but this is not the only important factor.", "To repair a circuit board it is important to ensure that all connections are clean but this is not the only important factor.r."], "jumps": []}, {"id": "P3130", "text": ["We have briefly covered how to replace damaged components on printed circuit boards, but another common problem is how to replace damaged copper traces on the board."], "jumps": ["P3120"]}, {"id": "P3140", "text": ["If a component or part of a circuit is shorted on a PCB, the current flowing through the traces can pulse to a very high level. In this case, the current level often exceeds what the circuit traces can handle.", "If a component or part of a circuit is shorted on a PCB, the current flowing through the traces can pulse to a very high level. In this case, the current level often exceeds what the circuit traces can handle............"], "jumps": ["P3150", "P3130"]}, {"id": "P3150", "text": ["High current through the thin circuit traces may cause them to heat to a very high temperature.  This heat can either melt the trace, or loosen the trace from the board.  Either of these conditions must be repaired for the board to work properly.", "High current through the thin circuit traces may cause them to heat to a very high temperature. This heat can either melt the trace, or loosen the trace from the board. Either of these conditions must be repaired for the board to work properly."], "jumps": ["P3160", "P3130"]}, {"id": "P3160", "text": ["In addition, a circuit trace that has been nicked and has a reduced cross-sectional area, or is damaged in any other way, must also be replaced."], "jumps": ["P3170", "P3130"]}, {"id": "P3170", "text": ["The first step in repair of a damaged trace is to asses the damage and determine which method of repair to use.", "The first step in repair of a damaged trace is to asses the damage and determine which method of repair to use. Depending upon the amount of damage, the old trace or parts of it, may have to be cut off and discarded."], "jumps": ["P3180", "P3160"]}, {"id": "P3180", "text": ["There are several methods used to repair a damaged trace.  Common methods are: underbonding, overbonding and wire jumps.", "There are several methods used to repair a damaged trace. Common methods are: underbonding, overbonding and wire jumps.......esraces. s, solder, and any other foreign materials."], "jumps": ["P3182", "P3170"]}, {"id": "P3182", "text": ["The second step in all repair cases, is to ensure the damaged area is thoroughly cleaned of all coatings, solder, and any other foreign materials. When a trace has been severed all unbonded trace material should be cut away and the remaining traces should be cleaned.", "The second step in all repair cases, is to ensure the damaged area is thoroughly cleaned of all coatings, solder, and any other foreign materials. When a trace has been severed all unbonded trace material should be cut away and the remaining traces should be cleaned. using an eraser or other light abrasive cleaner."], "jumps": ["P3183", "P3170"]}, {"id": "P3183", "text": ["Let's look at the procedures for repairing a trace using each of the three methods, starting with the two bonding methods.", "Let's look at the procedures for repairing a trace using each of the three methods, starting with the two bonding methods. oreign materials."], "jumps": ["P3190", "P3170"]}, {"id": "P3190", "text": ["When a conductor has been lifted from the board, but has no other damage, it can be rebonded to the PCB.", "When a conductor has been lifted from the board, but has no other damage, it can be rebonded to the PCB. derbonding is a procedure where adhesive material is placed under the conductor to reattach it to the surface. e surface."], "jumps": ["P3192", "P3170"]}, {"id": "P3192", "text": ["Underbonding is a procedure where adhesive material is placed under the conductor to reattach it to the surface.", "Underbonding is a procedure where adhesive material is placed under the conductor to reattach it to the surface. where adhesive material is placed under the conductor to reattach it to the surface. e surface."], "jumps": ["P3200", "P3190"]}, {"id": "P3200", "text": ["The  preferred method of repairing a lifted trace is overbonding, this procedure places the adhesive material over the conductor to reattach it to the board.", "The preferred method of repairing a lifted trace is overbonding, this procedure places the adhesive material over the conductor to reattach it to the board. his method is more reliable than underbonding and is easier to identify by a technician who subsequently works on the same board."], "jumps": ["P3202", "P3190"]}, {"id": "P3202", "text": ["Overbonding is more reliable than underbonding and is easier to identify by a technician who subsequently works on the same board.", "Overbonding is more reliable than underbonding and is easier to identify by a technician who subsequently works on the same board. than underbonding and is easier to identify by a technician who subsequently works on the same board."], "jumps": ["P3210", "P3190"]}, {"id": "P3210", "text": ["Now that we have seen the underbonding and overbonding methods let's see how the wire jumper methods are used.", "Now that we have seen the underbonding and overbonding methods let's see how the wire jumper methods are used. oreign materials."], "jumps": ["P3220", "P3190"]}, {"id": "P3220", "text": ["When a trace has been severed or damaged, a new conductor must be installed.", "When a trace has been severed or damaged, a new conductor must be installed. ere are two common wire jumper methods for doing this. In both cases, it is important to ensure the damaged area has been thoroughly cleaned."], "jumps": ["P3240", "P3210"]}, {"id": "P3240", "text": ["There are two types of wire jumper methods used. These are called the surface wire jumper and the through-board wire jumper.", "There are two types of wire jumper methods used. These are called the surface wire jumper and the through-board wire jumper. rough-board wire jumper."], "jumps": ["P3250", "P3220"]}, {"id": "P3250", "text": ["A surface wire jumper is simply a piece of solid conducting wire that is flattened and soldered between the two open leads.", "A surface wire jumper is simply a piece of solid conducting wire that is flattened and soldered between the two open leads.It is important to use wire of a large enough gauge that will match or exceed the current-handling capacity of the original trace."], "jumps": ["P3252", "P3240"]}, {"id": "P3252", "text": ["To install a surface wire jumper, first the area is prepped by trimming away any loose trace material and cleaning the surface.\nThe ends of the open traces are tinned after they are cleaned.", "To install a surface wire jumper, first the area is prepped by trimming away any loose trace material and cleaning the surface. The ends of the open traces are tinned after they are cleaned.re ends should then be tinned using solder and flux."], "jumps": ["P3253", "P3250"]}, {"id": "P3253", "text": ["Next the wire jumper is prepped.  It is important to use wire of a large enough gauge that will match or exceed the current handling capacity of the original trace.", "Next the wire jumper is prepped. It is important to use wire of a large enough gauge that will match or exceed the current handling capacity of the original trace. original trace. he wire ends should then be tinned using solder and flux."], "jumps": ["P3260", "P3250"]}, {"id": "P3260", "text": ["Once the correct wire gauge has been selected, the wire should be cut to a length at least 1/4\" longer than the connection.  This allows for a 1/8\" overlap on either side of the repair.", "Once the correct wire gauge has been selected, the wire should be cut to a length at least 1/4\" longer than the connection. This allows for a 1/8\" overlap on either side of the repair. s should then be tinned using solder and flux. \" overlap on either side of the repair. The wire ends should then be tinned using solder and flux."], "jumps": ["P3270", "P3250"]}, {"id": "P3270", "text": ["The wire ends should be tinned using solder and flux.      \nThen flatten the wire using pliers so that it will not roll when being soldered.", "The wire ends should be tinned using solder and flux. Then flatten the wire using pliers so that it will not roll when being soldered. ed. on each end and soldered in place. The completed repair should then be cleaned."], "jumps": ["P3272", "P3250"]}, {"id": "P3272", "text": ["The flattened wire is then placed across the open section with approximately 1/8\" overlap on each end and soldered in place.  The completed repair should then be cleaned.", "The flattened wire is then placed across the open section with approximately 1/8\" overlap on each end and soldered in place. The completed repair should then be cleaned. erlap on each end and soldered in place. The completed repair should then be cleaned."], "jumps": ["P3280", "P3250"]}, {"id": "P3280", "text": ["The second method of wire jumper repair is the through-board wire jumper. This method is more time consuming and less common than the surface wire jumper."], "jumps": ["P3290", "P3272"]}, {"id": "P3290", "text": ["As with the surface wire jumper the board is cleaned and the ends of the open trace are tinned.", "As with the surface wire jumper the board is cleaned and the ends of the open trace are tinned. a. Remove all coatings, solder and other foriegn materials. Cut away all unbonded trace materials. 2) Tin the ends of the open traces."], "jumps": ["P3295", "P3280"]}, {"id": "P3295", "text": ["A hole is drilled through each end of the broken traces.  The holes should be just large enough to allow the jumper wire to pass through, but not wider than the trace itself.", "A hole is drilled through each end of the broken traces. The holes should be just large enough to allow the jumper wire to pass through, but not wider than the trace itself."], "jumps": ["P3300", "P3290"]}, {"id": "P3300", "text": ["The jumper wire is then cut to a length so that it can go through the board and up onto the trace ends.  The wire ends should extend a minimum of 1/16\" over the tinned trace ends when fully clinched.  The wire ends are tinned and formed so that the wire bends are sharp but there are no wire nicks.", "The jumper wire is then cut to a length so that it can go through the board and up onto the trace ends. The wire ends should extend a minimum of 1/16\" over the tinned trace ends when fully clinched. The wire ends are tinned and formed so that the wire bends are sharp but there are no wire nicks."], "jumps": ["P3320", "P3295"]}, {"id": "P3320", "text": ["Once the wire is installed properly, it should be soldered in place. The solder connections should then be cleaned and the repair is  complete.", "Once the wire is installed properly, it should be soldered in place. The solder connections should then be cleaned and the repair is complete."], "jumps": ["P3330", "P3280"]}, {"id": "P3330", "text": ["The last type of circuit board repair that we will examine is the replacement of pads or terminals that have been lifted from the     board.", "The last type of circuit board repair that we will examine is the replacement of pads or terminals that have been lifted from the board."], "jumps": ["P3340", "P3320"]}, {"id": "P3340", "text": ["This type of repair is straightforward if you have the correct repair materials.  These repairs require both replacement pads and through-board eyelets.  Most well equipped repair stations have a selection of these.", "This type of repair is straightforward if you have the correct repair materials. These repairs require both replacement pads and through-board eyelets. Most well equipped repair stations have a selection of these."], "jumps": ["P3350", "P3330"]}, {"id": "P3350", "text": ["If a pad or eyelet has been damaged or is missing, the area must first be cleaned.  The hole should then be redrilled to a slightly     larger diameter.", "If a pad or eyelet has been damaged or is missing, the area must first be cleaned. The hole should then be redrilled to a slightly larger diameter."], "jumps": ["P3360", "P3340"]}, {"id": "P3360", "text": ["The proper pad is then selected to fit the new hole diameter. Installation of the pad is best done by someone who is familiar with the repair. It involves bonding the pad to the board and soldering the trace end to the existing trace material. Consult the repair manual or with an experienced technician before attempting this repair."], "jumps": ["P3370", "P3350"]}, {"id": "P3370", "text": ["In some cases, an eyelet is used to keep the new pad in place. Special tools are needed for setting an eyelet in place. This process is referred to as swaging and simply causes the eyelet to stay in place by expanding it to a pressure fit. You should talk to someone who has done this type of repair before if you are not familiar with the process."], "jumps": ["P3380", "P3350"]}, {"id": "P3380", "text": ["It is important to do any PCB repair work to a level which meets or exceeds the original workmanship.  These types of repairs require skill that comes with practice.  The help of experienced technicians can be valuable when you first start to do PCB repairs.  Do not be afraid to ask for assistance or advice.", "It is important to do any PCB repair work to a level which meets or exceeds the original workmanship. These types of repairs require skill that comes with practice. The help of experienced technicians can be valuable when you first start to do PCB repairs. Do not be afraid to ask for assistance or advice."], "jumps": ["P3910", "P3350"]}, {"id": "P3699", "text": ["The following ten (10) questions will help you review the material covered in the objective on PC Board Component Extraction."], "jumps": ["P3700", "P3001"]}, {"id": "P3700", "text": ["1.  Why should a PCB be thoroughly examined before any repair        is attempted?", "1. Why should a PCB be thoroughly examined before any repair is attempted?"], "jumps": []}, {"id": "P3710", "text": ["2.  What is the maximum heating time for removing a component        from a PCB?", "2. What is the maximum heating time for removing a component from a PCB?"], "jumps": []}, {"id": "P3720", "text": ["3.  Select the diagram that shows a plated-through solder hole.", "3. Select the diagram that shows a plated-through solder hole."], "jumps": []}, {"id": "P3730", "text": ["4.  How should the protective coating be removed from a PCB             which is to be repaired?", "4. How should the protective coating be removed from a PCB which is to be repaired?", "The removal method depends upon the type of coating and type of repair.", "The coating should be scraped off using a sharp knife.", "The coating should be melted off using a heat source."], "jumps": []}, {"id": "P3740", "text": ["5.  Which of the following is NOT a reason for coating a PCB?", "5. Which of the following is NOT a reason for coating a PCB?"], "jumps": []}, {"id": "P3750", "text": ["6.  Why is short circuit current damaging to circuit traces on a              PCB?", "6. Why is short circuit current damaging to circuit traces on a PCB?", "Because high current causes the traces to heat up.", "Because high current reduces the resistance of the traces.", "Because low current reduces the bonding effect between the trace and the PCB.B"], "jumps": []}, {"id": "P3760", "text": ["7.  What does the term overbonding refer to?", "7. What does the term overbonding refer to?...............", "Reattaching a circuit trace with adhesive above the trace.", "Reattaching a circuit trace with adhesive below the trace.", "Reattaching a circuit trace with too much adhesive."], "jumps": []}, {"id": "P3770", "text": ["8.  Which of the following figures illustrates a surface wire jumper      repair?", "8. Which of the following figures illustrates a surface wire jumper repair?"], "jumps": []}, {"id": "P3780", "text": ["9.  What material(s) is/are required for repairing a missing circuit         board pad?", "9. What material(s) is/are required for repairing a missing circuit board pad?"], "jumps": []}, {"id": "P3790", "text": ["10.  Why is it important to keep repair surfaces as clean as                      possible?", "10. Why is it important to keep repair surfaces as clean as possible?", "So the repair bonds can be redone easily."], "jumps": []}, {"id": "P3799", "text": ["You have completed the Exercise.\nYou are about to return to the Objective Menu.", "You have completed the Exercise. You are about to return to the Objective Menu......."], "jumps": ["P3001", "P3790"]}, {"id": "P3910", "text": ["This completes the information on PC BOARD COMPONENT EXTRACTION."], "jumps": ["P3001", "P3380"]}, {"id": "P3920", "text": ["1.  Component replacement and circuit board repair skills are              required of any technician.  Before attempting any repair                 work, a technician should examine the board closely and                note its characteristics.", "1. Component replacement and circuit board repair skills are required of any technician. Before attempting any repair work, a technician should examine the board closely and note its characteristics."], "jumps": ["P3930", "P3001"]}, {"id": "P3930", "text": ["2.  Repair work should always be done to the standard set by the      work or to an even higher standard, if possible.", "2. Repair work should always be done to the standard set by the work or to an even higher standard, if possible."], "jumps": ["P3940", "P3920"]}, {"id": "P3940", "text": ["3.  To remove a component, we must first note how it is mounted.       The solder should be removed using the wick or vacuum                method.  Then heat and pliers can be used to lift the                          component off the board.  The maximum heating time should        be no greater than three seconds.", "3. To remove a component, we must first note how it is mounted. The solder should be removed using the wick or vacuum method. Then heat and pliers can be used to lift the component off the board. The maximum heating time should be no greater than three seconds."], "jumps": ["P3950", "P3920"]}, {"id": "P3950", "text": ["4.  Components should be replaced using standard component          installation procedures.  The board, traces, pads, etc. should         be thoroughly cleaned before reinstallation is attempted.", "4. Components should be replaced using standard component installation procedures. The board, traces, pads, etc. should be thoroughly cleaned before reinstallation is attempted."], "jumps": ["P3960", "P3940"]}, {"id": "P3960", "text": ["5.  Other common PCB repairs include resetting lifted traces                using adhesives, or jumpering open traces using either the            surface wire jumper method or the through-board jumper                method.", "5. Other common PCB repairs include resetting lifted traces using adhesives, or jumpering open traces using either the surface wire jumper method or the through-board jumper method."], "jumps": ["P3970", "P3950"]}, {"id": "P3970", "text": ["6.  The repair of lifted, damaged, or missing solder pads is                     common.  To perform these repairs adequately, a technician          must have access to a drill, pads and eyelets, and swaging             tools.", "6. The repair of lifted, damaged, or missing solder pads is common. To perform these repairs adequately, a technician must have access to a drill, pads and eyelets, and swaging tools."], "jumps": ["P3980", "P3960"]}, {"id": "P3980", "text": ["7.  Printed circuit board repair is a skill that can be developed              with practice and assistance from experienced technicians.", "7. Printed circuit board repair is a skill that can be developed with practice and assistance from experienced technicians."], "jumps": ["P3999", "P3970"]}, {"id": "P3999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P3001", "P3980"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": []}, {"id": "P10002", "t let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
