const book = {"title": "9395B406", "pages": [{"id": "P900", "text": [], "jumps": []}, {"id": "PINFO", "text": ["Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 12-15-99 Converted from storyboard to toolbook and completed text and branching. frieda 02-29-00 Graphics. damian 03-20-00 CAI Lesson Checklist by Chris 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Checked for convertion errors. John Ayala 05-03-02 Review - lisa 12-06-02 Added graphics and question pages for PC130-324 Rev A to 130A and 130E experiments. -Penny 01-17-03 Reviewed and ran lesson with 130E trainer. frieda 02-18-03 Made text correction per bill. P301,P341,P9282,P9302,P9350.-patty 10-26-04 changed three inst", "07-29-99 Converted to new question format. jay 08-17-99 Fixed book & quiz page script. Fixed correct question outline. jay 09-01-99 Fixed the 130A interface pages by adding nextpage to the script of the next button - lisa, penny 12-15-99 Converted from storyboard to toolbook and completed text and branching. frieda 02-29-00 Graphics. damian 03-20-00 CAI Lesson Checklist by Chris 07-14-00 Converted to ToolBook 7.1 format. jay 07-19-01 Converted to ToolBook 8.1 format. jay 01-14-02 Converted to Phase II format. jay 02-08-02 Checked for convertion errors. John Ayala 05-03-02 Review - lisa 12-06-02 Added graphics and question pages for PC130-324 Rev A to 130A and 130E experiments. -Penny 01-17-03 Reviewed and ran lesson with 130E trainer. frieda 02-18-03 Made text correction per bill. P301,P341,P9282,P9302,P9350.-patty 10-26-04 P1250,next button, changed three instances of incorrect scripting from: when circuit card is \"0\" to: when circuit_card is \"0\" Deannnn", "Nida Corporation - FDM Circuit Troubleshooting"], "jumps": []}, {"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: FDM CIRCUIT TROUBLESHOOTING fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": [], "jumps": []}, {"id": "P100", "text": ["w Determine if a FDM transmitter and receiver system is operating correctly. w Identify the faulted component in a malfunctioning FDM transmitter and receiver system.................................."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Model 440 Function Generator XXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. Nida Model 410 Frequency Counter t) t"], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson you will be troubleshooting various faults in a FDM transmitter and receiver system."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["Troubleshooting an FDM system is no different than troubleshooting the other signal processing systems.  You have learned, only the signals and components are different.", "Troubleshooting an FDM system is no different than troubleshooting the other signal processing systems. You have learned, only the signals and components are different."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["If you recall, FDM systems are comprised of FM modulators and demodulators.  This makes troubleshooting an FDM system easy since you have previously worked with FM circuits.", "If you recall, FDM systems are comprised of FM modulators and demodulators. This makes troubleshooting an FDM system easy since you have previously worked with FM circuits."], "jumps": ["P450", "P400"]}, {"id": "P450", "text": ["Let's begin the lesson on FDM CIRCUIT TROUBLESHOOTING....................."], "jumps": ["P400"]}, {"id": "P1330", "text": ["1.  Place PC1 and PC2 DC Power switches to OFF. \n2.  Place PC3 DC Power switch to ON.", "1. Place PC1 and PC2 DC Power switches to OFF. 2. Place PC3 DC Power switch to ON."], "jumps": ["P1322"]}, {"id": "P3060", "text": ["The computer will now remove the fault.  Check the output of the receiver on the PC130-325 channel TPs and verify the FDM system is operating correctly.  Note, slight adjustments to \nPC130-325 R4, R18, R23, R26 and R31 may be necessary.", "The computer will now remove the fault. Check the output of the receiver on the PC130-325 channel TPs and verify the FDM system is operating correctly. Note, slight adjustments to PC130-325 R4, R18, R23, R26 and R31 may be necessary."], "jumps": ["P3047", "P3046"]}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In this experiment, you will locate the failed chip or component in a FDM transmitter and receiver system.", "Select the circuit card that you will be using for this experiment. r and an op amp filter."], "jumps": ["P1030", "P1001", "P1020", "P1042", "P1040"]}, {"id": "P4042", "text": ["The input to IC7 on pin 9 is incorrect. The op-amp can not operate correctly if the input is bad."], "jumps": []}, {"id": "P1450", "text": ["The transmitter is located on the PC130-324 card.", "1. Return the Test Console to the initial control settings. nter the discussion text here.", "The transmitter is located on the PC130-324 card..........."], "jumps": []}, {"id": "P1042", "text": ["The transmitter is located on the PC130-324 card..........."], "jumps": ["P1050", "P1030", "P1046"]}, {"id": "P1050", "text": ["The transmitter consists of the components necessary to frequency multiplex information signals."], "jumps": ["P1060", "P1042"]}, {"id": "P1060", "text": ["The receiver is located on the PC130-325 card.", "The receiver is located on the PC130-325 card.............."], "jumps": ["P1070", "P1042", "P1065"]}, {"id": "P1070", "text": ["The receiver consists of the components necessary to demultiplex FDM signals."], "jumps": ["P1080", "P1060"]}, {"id": "P1080", "text": ["To locate a faulted chip or support component, you must first determine if the FDM system is operating correctly."], "jumps": ["P1090", "P1060"]}, {"id": "P1090", "text": ["To do this, you check each input signal to the transmitter against each output signal of the receiver."], "jumps": ["P1100", "P1080"]}, {"id": "P1100", "text": ["If one or more of the output signals are incorrect, then the system is faulted."], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["If the system is faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P1120", "P1080"]}, {"id": "P1120", "text": ["If the output of the transmitter is bad, the multiplexer circuits are faulted."], "jumps": ["P1130", "P1080"]}, {"id": "P1130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P1140", "P1080"]}, {"id": "P1140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P1150", "P1080"]}, {"id": "P1150", "text": ["If the input to the receiver is good, the demultiplexer circuits are faulted."], "jumps": ["P1160", "P1080"]}, {"id": "P1170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P1160"]}, {"id": "P1180", "text": ["2.  Insert PC130-322 into the PC1 connectors on the test console. 3.  Insert PC130-324 into the PC2 connectors on the test console. 4.  Insert PC130-325 into the PC3 connectors on the test console.", "2. Insert PC130-322 into the PC1 connectors on the test console. 3. Insert PC130-324 into the PC2 connectors on the test console. 4. Insert PC130-325 into the PC3 connectors on the test console."], "jumps": ["P1170"]}, {"id": "P1190", "text": ["5.  On PC130-322, set the controls to mid position. \n6.  On PC130-324, set all variable resistors to mid position. \n7.  On PC130-325, set all variable resistors to mid position.", "5. On PC130-322, set the controls to mid position. 6. On PC130-324, set all variable resistors to mid position. 7. On PC130-325, set all variable resistors to mid position."], "jumps": ["P1180"]}, {"id": "P1200", "text": ["8.  Set the Positive Supply Control to 15.  The Voltmeter on the           130A should indicate 15 Volts.", "8. Set the Positive Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P1190"]}, {"id": "P1210", "text": ["9.  Set the Negative Supply Control to 15.  The Voltmeter on the          130A should indicate 15 Volts.", "9. Set the Negative Supply Control to 15. The Voltmeter on the 130A should indicate 15 Volts."], "jumps": ["P1200"]}, {"id": "P1220", "text": ["10.  Set the PC1 DC Switch to ON.", "10.  Set the PC1 DC Switch to ON.", "11.  Using the oscilloscope, measure the 500, 1000, 1500, and               2000 Hz TPs on PC130-322 and adjust each channel controls        as follows:     \n       a.  Adjust DIST for a sine wave output at 2 Vpp.\n       b.  Adjust GAIN for a 0.5 Vpp signal.", "10. Set the PC1 DC Switch to ON.trol to 12. 130A - Set the PC1 DC Switch to ON....", "11. Using the oscilloscope, measure the 500, 1000, 1500, and 2000 Hz TPs on PC130-322 and adjust each channel controls as follows: a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal."], "jumps": ["P1210", "P1240", "P1220"]}, {"id": "P1240", "text": ["12.  Using an alligator to alligator jumper, connect the 2000 Hz TP         on PC130-322 to CH4 TP on PC130-324.", "12. Using an alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to CH4 TP on PC130-324.", "ALLIGATOR CONNECTION - Connect the 2000 Hz TP on PC130-322 to the CH4 TP on PC130-324."], "jumps": ["P1250", "P1230", "P1245", "P1246"]}, {"id": "P1250", "text": ["13.  Place the PC2 DC Power switch to ON. \n14.  Place PC130-324 S1 to TEST.", "15.   Rotate PC130-324 R31 and R38 fully counter clockwise. \n16.  Connect the oscilloscope using a X10 probe to PC130-324              TP15.", "13. Place the PC2 DC Power switch to ON. 14. Place PC130-324 S1 to TEST.", "15. Rotate PC130-324 R31 and R38 fully counter clockwise. 16. Connect the oscilloscope using a X10 probe to PC130-324 TP15.", "15. Rotate PC130-324 R12 and R13 fully counter clockwise. 16. Connect the oscilloscope using a X10 probe to PC130-324 TP11."], "jumps": ["P1240", "P1250"]}, {"id": "P1270", "text": ["17.  Adjust PC130-324 R34 for a maximum undistorted waveform. 18.  Adjust PC130-324 R38 for a 3 Vpp output signal.  Remember,          you should be using a X10 probe.", "17. Adjust PC130-324 R34 for a maximum undistorted waveform. 18. Adjust PC130-324 R38 for a 3 Vpp output signal. Remember, you should be using a X10 probe.", "17. Adjust PC130-324 R11 for a maximum undistorted waveform. 18. Adjust PC130-324 R13 for a 3 Vpp output signal. Remember, you should be using a X10 probe."], "jumps": ["P1280", "P1260", "P1262"]}, {"id": "P1280", "text": ["19.  While observing the signal on PC130-324 TP15, connect a               frequency counter to TP15.  If the signal seen on the                        oscilloscope decreases to lower than 2 Vpp, connect the                counter's probe through a 4.7 kohm resistor.", "19. While observing the signal on PC130-324 TP15, connect a frequency counter to TP15. If the signal seen on the oscilloscope decreases to lower than 2 Vpp, connect the counter's probe through a 4.7 kohm resistor.", "The Nida Model 440 function generator has a built in frequency counter. The next step has you adjust the frequency and only use an oscilloscope if a frequency counter is not available."], "jumps": ["P1290", "P1260"]}, {"id": "P1282", "text": ["20.  While observing the frequency on PC130-324 TP15, adjust             C21 for a 3 MHz  \u00b120 kHz signal.  Use a plastic screwdriver if          available.  If not, touch tool.", "19. While observing the signal on PC130-324 TP11, connect a frequency counter to TP11. If the signal seen on the oscilloscope decreases to lower than 2 Vpp, connect the counter's probe through a 4.7 kohm resistor.", "The Nida Model 440 function generator has a built in frequency counter. The next step has you adjust the frequency and only use an oscilloscope if a frequency counter is not available.", "20. While observing the frequency on PC130-324 TP15, adjust C21 for a 3 MHz", "20 kHz signal. Use a plastic screwdriver if available. If not, touch tool.", "20. While observing the frequency on PC130-324 TP11, adjust C20 for a 3 MHz"], "jumps": ["P1292", "P1300", "P1280", "P1282"]}, {"id": "P1295", "text": ["PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C21. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C21. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz."], "jumps": []}, {"id": "P1296", "text": ["21.  Adjust PC130-324 R33 for a 3 MHz +5 kHz signal if          \n        necessary.", "PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C20. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C20. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz.", "21. Adjust PC130-324 R33 for a 3 MHz +5 kHz signal if necessary............", "21. Adjust PC130-324 R17 for a 3 MHz +5 kHz signal if necessary. MHz", "20 kHz signal. Use a plastic screwdriver if available. If not, touch tool.", "22. Using a frequency counter (an oscilloscope can be used), measure and adjust on PC130-324 the following: a. TP5, adjust f1adj for a 250 kHz", "5 kHz signal. b. TP6, adjust f2adj for a 300 kHz", "5 kHz signal. c. TP7, adjust f3adj for a 350 kHz", "5 kHz signal. d. TP8, adjut f4adj for a 400 kHz"], "jumps": ["P1310", "P1290", "P1292", "P1320", "P1300", "P1302"]}, {"id": "P1320", "text": ["23.  Set S1 on PC130-324 to NORM. \n24.  Using the oscilloscope, observe the signal on PC130-324                TP15.  Verify that the FDM multiplexer is operating correctly,           producing a FM signal.  If not touch HELP.", "23. Set S1 on PC130-324 to NORM. 24. Using the oscilloscope, observe the signal on PC130-324 TP15. Verify that the FDM multiplexer is operating correctly, producing a FM signal. If not touch HELP."], "jumps": ["P1330", "P1310", "P1325"]}, {"id": "P1322", "text": ["23. Set S1 on PC130-324 to NORM. 24. Using the oscilloscope, observe the signal on PC130-324 TP11. Verify that the FDM multiplexer is operating correctly, producing a FM signal. If not touch HELP."], "jumps": ["P1312", "P1325"]}, {"id": "P1325", "text": ["MULTIPLEXER ALIGNMENT - If the multiplexer circuit on PC130-324 is not set up correctly, DO NOT go on until the transmitter is aligned.", "Touch if you made adjustments and now have the FDM multiplexer circuit operating correctly. Touch to return to the multiplexer alignment procedures..................."], "jumps": ["P1330", "P1326"]}, {"id": "P1326", "text": ["A.  Set the PC1 and PC2 DC Switch to OFF.", "A. Set the PC1 and PC2 DC Switch to OFF. 12. 130A - Set the PC1 DC Switch to ON...."], "jumps": []}, {"id": "P1370", "text": ["6.  Place PC1 and PC2 DC Power switches to ON. \n7.  Ensure that  PC130-324 S1 is set to NORM.", "6. Place PC1 and PC2 DC Power switches to ON. 7. Ensure that PC130-324 S1 is set to NORM."], "jumps": ["P1360"]}, {"id": "P1340", "text": ["3. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used), adjust C3 on PC130-325 for a 3 MHz", "20 kHz signal on IC1 pin 3. Use a 4.7 kohm resistor on the counter's probe to prevent loading and use a plastic screwdriver if available. If not, touch tool."], "jumps": ["P1350", "P1330"]}, {"id": "P1345", "text": ["PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C3. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C3. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz.."], "jumps": []}, {"id": "P1350", "text": ["4.  Adjust PC130-325 R4, if necessary, for a 3 MHz \u00b15 kHz                     measurement on IC1 pin 3.", "4. Adjust PC130-325 R4, if necessary, for a 3 MHz", "5 kHz measurement on IC1 pin 3...."], "jumps": ["P1360", "P1340", "P1065"]}, {"id": "P1360", "text": ["5. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used) measure and adjust the following on PC130-325: in 5, R18 for a 250 kHz", "5 kHz signal. b. IC4 pin 5, R23 for a 300 kHz", "5 kHz signal. c. IC5 pin 5, R26 for a 350 kHz", "5 kHz signal. d. IC6 pin 5, R31 for a 400 kHz"], "jumps": ["P1370", "P1350", "P1065"]}, {"id": "P3012", "text": ["The output signal of the receiver is zero for all channels, it does not match the input signal to the transmitter. The FDM system is not operating correctly."], "jumps": []}, {"id": "P1380", "text": ["8.  Using the dual display mode on the oscilloscope, measure,            compare, and adjust (if needed) the following on PC130-324           and PC130-325.", "PC130-324 SCHEMATIC - Transmitter", "8. Using the dual display mode on the oscilloscope, measure, compare, and adjust (if needed) the following on PC130-324 and PC130-325.55", "a. CH1 probe to PC130-324 CH1 TP and CH2 probe to PC130-325 CH1 TP. Adjust PC130-325 R18 to match input to output. b. CH1 probe to PC130-324 CH2 TP and CH2 probe to PC130-325 CH2 TP. Adjust PC130-325 R23 to match input to output. c. CH1 probe to PC130-324 CH3 TP and CH2 probe to PC130-325 CH3 TP. Adjust PC130-325 R26 to match input to output. d. CH1 probe to PC130-324 CH4 TP and CH2 probe to PC130-325 CH4 TP. Adjust PC130-325 R31 to match input to output."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["Do the analog information signals out of the demultiplexer, PC130-325, match the signals applied to the multiplexer,\nPC130-324?", "Do the analog information signals out of the demultiplexer, PC130-325, match the signals applied to the multiplexer, PC130-324?"], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["The system is not set up correctly.  You need to check the alignment of the receiver.", "The system is not set up correctly. You need to check the alignment of the receiver.", "Touch to return to the receiver alignment. Touching takes you back to the question but, if the receiver is not aligned correctly, you will not get satisfactory results in the troubleshooting problems."], "jumps": ["P1390", "P1330"]}, {"id": "P1400", "text": ["The FDM system is operating correctly, the four analog inputs are multiplexed and sent to the receiver.  Then the one FDM signal is demultiplexed and four outputs are available.", "The FDM system is operating correctly, the four analog inputs are multiplexed and sent to the receiver. Then the one FDM signal is demultiplexed and four outputs are available."], "jumps": ["P1410", "P1390"]}, {"id": "P1410", "text": ["Notes for troubleshooting:\n1.  When checking the inputs to the transmitter and outputs of             the receiver, check all four signals.   \n2.  When checking the output of the transmitter and input to the          receiver, check for a FM signal.", "Notes for troubleshooting: 1. When checking the inputs to the transmitter and outputs of the receiver, check all four signals. 2. When checking the output of the transmitter and input to the receiver, check for a FM signal."], "jumps": ["P1420", "P1400"]}, {"id": "P1420", "text": ["The computer will now insert a fault, or insert no fault, into the FDM system. You are to determine if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component."], "jumps": ["P1410"]}, {"id": "P1430", "text": ["Would you like to try another troubleshooting experiment?", "Would you like to try another troubleshooting experiment? No"], "jumps": []}, {"id": "P1440", "text": ["You have completed all the troubleshooting experiments for this lesson.  If you would like to try the troubleshooting experiments again, select FDM CIRCUIT TROUBLESHOOTING from the Lesson Menu.", "You have completed all the troubleshooting experiments for this lesson. If you would like to try the troubleshooting experiments again, select FDM CIRCUIT TROUBLESHOOTING from the Lesson Menu."], "jumps": []}, {"id": "P1450", "text": ["1. Return the Test Console to the initial control settings. nter the discussion text here."], "jumps": []}, {"id": "P1460", "text": ["Disconnect test equipment. \n     Carefully remove PC cards.                                \n     Return all equipment to its proper storage area.", "Disconnect test equipment. Carefully remove PC cards. Return all equipment to its proper storage area.."], "jumps": []}, {"id": "P1470", "text": ["Set the Test Console Power OFF. Carefully remove the PC cards from the test console. Return all equipment to its proper storage area. .."], "jumps": []}, {"id": "P1910", "text": ["This completes the experiment on FDM CIRCUIT TROUBLESHOOTING."], "jumps": ["P1001", "P1470"]}, {"id": "P2000", "text": ["The FDM system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P2010"]}, {"id": "P2010", "text": ["1.  Measure the input signals to the transmitter on PC130-324              channel TPs and the output signals of the receiver on\n     PC130-325 channel TPs to determine if the FDM system is               operating correctly.  Is the FDM system operating correctly?", "1. Measure the input signals to the transmitter on PC130-324 channel TPs and the output signals of the receiver on PC130-325 channel TPs to determine if the FDM system is operating correctly. Is the FDM system operating correctly?"], "jumps": ["P2000"]}, {"id": "P2011", "text": [], "jumps": []}, {"id": "P2012", "text": ["The output signal of the receiver for CH1 is incorrect, zero volts, it does not match the input signal to the transmitter. The FDM system is not operating correctly."], "jumps": []}, {"id": "P2020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-324 TP15 on             PC130-325 TP1.  Note that if only one channel is bad, other             measurements need to be made.  Is the transmitter,                           transmission medium or receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-324 TP15 on PC130-325 TP1. Note that if only one channel is bad, other measurements need to be made. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P2010", "P2025"]}, {"id": "P2022", "text": ["2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-324 TP11 on PC130-325 TP1. Note that if only one channel is bad, other measurements need to be made. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P2010", "P2025"]}, {"id": "P2021", "text": [], "jumps": []}, {"id": "P2023", "text": ["The FDM appears correct. However, you know the CH1 output of the receiver is bad. To isolate the problem, check the CH1 circuits in the receiver and transmitter to isolate the fault."], "jumps": []}, {"id": "P2025", "text": ["FM OUTPUT - If only one channel is missing from the output of the receiver, the transmitted and received FM signal probably will not indicate such when viewed. You will still see a FM signal. In this case, you must make other measurements in the suspected channel circuits to determine if the transmitter, transmission medium or receiver is faulted."], "jumps": []}, {"id": "P2030", "text": ["3.  Determine the faulted circuit in the transmitter by measuring          the signals on the IC pins and TPs of PC130-324.  Which                  circuit in the transmitter is faulted?", "3. Determine the faulted circuit in the transmitter by measuring the signals on the IC pins and TPs of PC130-324. Which circuit in the transmitter is faulted?"], "jumps": ["P2022", "P2020"]}, {"id": "P2031", "text": ["The input to the main carrier modulator, TP13, and the output of the main carrier modulator, TP14 and TP15, are FM signals. The main carrier modulator is not faulted.", "The output of the circui mps": ["P9090", "P9062", "P9060"]}, {"id": "P9090", "text": ["To do this, you check each input signal to the transmitter against each output signal of the receiver."], "jumps": ["P9100", "P9080"]}, {"id": "P9100", "text": ["If one or more of the output signals are incorrect, then the system is faulted."], "jumps": ["P9110", "P9080"]}, {"id": "P9110", "text": ["If the system is faulted, you determine if the transmitter or receiver is causing the problem."], "jumps": ["P9120", "P9080"]}, {"id": "P9120", "text": ["If the output of the transmitter is bad, the multiplexer circuits are faulted."], "jumps": ["P9130", "P9080"]}, {"id": "P9130", "text": ["If the output of the transmitter is good, the fault is in the transmission medium or receiver."], "jumps": ["P9140", "P9080"]}, {"id": "P9140", "text": ["If the input to the receiver is bad, the fault is in the transmission medium."], "jumps": ["P9150", "P9080"]}, {"id": "P9150", "text": ["If the input to the receiver is good, the demultiplexer circuits are faulted."], "jumps": ["P9160", "P9080"]}, {"id": "P9160", "text": ["Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Remember, use an analog multimeter to check out a transistor.  Let's start the experiment.", "Once the fault has been located, further oscilloscope or multimeter measurements will locate the fault to a particular chip or component. Remember, use an analog multimeter to check out a transistor. Let's start the experiment."], "jumps": ["P9170", "P9080"]}, {"id": "P9170", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P9160"]}, {"id": "P9180", "text": ["2.  Insert PC130-322 into the PC1 connectors on the test console. 3.  Insert PC130-324 into the PC2 connectors on the test console. 4.  Insert PC130-325 into the PC3 connectors on the test console.", "2. Insert PC130-322 into the PC1 connectors on the test console. 3. Insert PC130-324 into the PC2 connectors on the test console. 4. Insert PC130-325 into the PC3 connectors on the test console."], "jumps": ["P9190"]}, {"id": "P9190", "text": ["5.  On PC130-322, set the controls to mid position. \n6.  On PC130-324, set all variable resistors to mid position. \n7.  On PC130-325, set all variable resistors to mid position.", "5. On PC130-322, set the controls to mid position. 6. On PC130-324, set all variable resistors to mid position. 7. On PC130-325, set all variable resistors to mid position."], "jumps": ["P9200", "P9180"]}, {"id": "P9200", "text": ["8.  Press Enter to Set: Positive Supply Control - 15", "8. Press Enter to Set: Positive Supply Control - 15......................."], "jumps": []}, {"id": "P9210", "text": ["9.  Press Enter to Set: Negative Supply Control - 15", "9. Press Enter to Set: Negative Supply Control - 15......................."], "jumps": []}, {"id": "P9220", "text": ["10.  Press Enter to Set: PC1 DC Power Switch - ON", "11.  Using the oscilloscope, measure the 500, 1000, 1500, and               2000 Hz TPs on PC130-322 and adjust each channel controls        as follows:\n       a.  Adjust DIST for a sine wave output at 2 Vpp.\n       b.  Adjust GAIN for a 0.5 Vpp signal.", "10. Press Enter to Set: PC1 DC Power Switch - ON..........................", "11. Using the oscilloscope, measure the 500, 1000, 1500, and 2000 Hz TPs on PC130-322 and adjust each channel controls as follows: a. Adjust DIST for a sine wave output at 2 Vpp. b. Adjust GAIN for a 0.5 Vpp signal."], "jumps": ["P9240"]}, {"id": "P9240", "text": ["12.  Using an alligator to alligator jumper, connect the 2000 Hz TP         on PC130-322 to CH4 TP on PC130-324.", "12. Using an alligator to alligator jumper, connect the 2000 Hz TP on PC130-322 to CH4 TP on PC130-324.", "ALLIGATOR CONNECTION - Connect the 2000 Hz TP on PC130-322 to the CH4 TP on PC130-324."], "jumps": ["P9250", "P9230", "P9247", "P9246"]}, {"id": "P9250", "text": ["13.  Press Enter to Set: PC2 DC Power Switch - ON \n14.  Place PC130-324 S1 to TEST.", "15.  Rotate PC130-324 R31 and R38 fully counterclockwise. \n16.  Connect the oscilloscope using a X10 probe to PC130-324              TP15.", "13. Press Enter to Set: PC2 DC Power Switch - ON 14. Place PC130-324 S1 to TEST.", "15. Rotate PC130-324 R31 and R38 fully counterclockwise. 16. Connect the oscilloscope using a X10 probe to PC130-324 TP15.", "15. Rotate PC130-324 R12 and R13 fully counterclockwise. 16. Connect the oscilloscope using a X10 probe to PC130-324 TP11."], "jumps": ["P9240", "P9270", "P9250"]}, {"id": "P9270", "text": ["17.  Adjust PC130-324 R34 for a maximum undistorted waveform. 18.  Adjust PC130-324 R38 for a 3 Vpp output signal.  Remember,          you should be using a X10 probe.", "17. Adjust PC130-324 R34 for a maximum undistorted waveform. 18. Adjust PC130-324 R38 for a 3 Vpp output signal. Remember, you should be using a X10 probe.", "17. Adjust PC130-324 R11 for a maximum undistorted waveform. 18. Adjust PC130-324 R13 for a 3 Vpp output signal. Remember, you should be using a X10 probe."], "jumps": ["P9280", "P9260", "P9262"]}, {"id": "P9280", "text": ["19.  While observing the signal on PC130-324 TP15, connect a               frequency counter to TP15.  If the signal seen on the                        oscilloscope decreases to lower than 2 Vpp, connect the                counter's probe through a 4.7 kohm resistor.", "19. While observing the signal on PC130-324 TP15, connect a frequency counter to TP15. If the signal seen on the oscilloscope decreases to lower than 2 Vpp, connect the counter's probe through a 4.7 kohm resistor.", "The Nida Model 440 function generator has a built in frequency counter. The next step has you adjust the frequency and only use an oscilloscope if a frequency counter is not available.}"], "jumps": ["P9290", "P9260"]}, {"id": "P9282", "text": ["20.  While observing the frequency on PC130-324 TP15, adjust              C21 for a 3 MHz \u00b120 kHz signal.  Use a plastic screwdriver if           available.  If not, touch tool.", "19. While observing the signal on PC130-324 TP11, connect a frequency counter to TP11. If the signal seen on the oscilloscope decreases to lower than 2 Vpp, connect the counter's probe using a 1 kohm resistor.", "The Nida Model 440 function generator has a built in frequency counter. The next step has you adjust the frequency and only use an oscilloscope if a frequency counter is not available.", "20. While observing the frequency on PC130-324 TP15, adjust C21 for a 3 MHz", "20 kHz signal. Use a plastic screwdriver if available. If not, touch tool.", "20. While observing the frequency on PC130-324 TP11, adjust C20 for a 3 MHz"], "jumps": ["P9292", "P9300", "P9280", "P9282"]}, {"id": "P9295", "text": ["PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C21. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C21. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz."], "jumps": []}, {"id": "P9296", "text": ["21.  Adjust PC130-324 R33 for a 3 MHz \u00b15 kHz signal if       \n        necessary.", "PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C20. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C20. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz.", "5 kHz signal if necessary........", "5 kHz signal if necessary. MHz", "20 kHz signal. Use a plastic screwdriver if available. If not, touch tool.", "22. Using a frequency counter (an oscilloscope can be used), measure and adjust on PC130-324 the following: a. TP5, adjust f1adj for a 250 kHz", "5 kHz signal. b. TP6, adjust f2adj for a 300 kHz", "5 kHz signal. c. TP7, adjust f3adj for a 350 kHz", "5 kHz signal. d. TP8, adjut f4adj for a 400 kHz"], "jumps": ["P9310", "P9290", "P9292", "P9320", "P9302"]}, {"id": "P9320", "text": ["23.  Set S1 on PC130-324 to NORM. \n24.  Using the oscilloscope, observe the signal on PC130-324                TP15.  Verify that the FDM multiplexer is operating correctly,           producing a FM signal.  If not touch HELP.", "23. Set S1 on PC130-324 to NORM. 24. Using the oscilloscope, observe the signal on PC130-324 TP15. Verify that the FDM multiplexer is operating correctly, producing a FM signal. If not touch HELP."], "jumps": ["P9330", "P9310", "P9325"]}, {"id": "P9322", "text": ["23. Set S1 on PC130-324 to NORM. 24. Using the oscilloscope, observe the signal on PC130-324 TP11. Verify that the FDM multiplexer is operating correctly, producing a FM signal. If not touch HELP."], "jumps": ["P9312", "P9325"]}, {"id": "P9325", "text": ["MULTIPLEXER ALIGNMENT - If the multiplexer circuit on PC130-324 is not set up correctly, DO NOT go on until the transmitter is aligned.", "Touch if you made adjustments and now have the FDM multiplexer circuit operating correctly. Touch to return to the multiplexer alignment procedures..................."], "jumps": ["P9330", "P9326"]}, {"id": "P9326", "text": ["A.  Press Enter to Set: PC1 and PC2 DC Power Switch - OFF", "A. Press Enter to Set: PC1 and PC2 DC Power Switch - OFF.................."], "jumps": []}, {"id": "P9330", "text": ["1.  Press Enter to Set: PC1 and PC2 DC Power Switches - OFF \n2.  Press Enter to Set: PC3 DC Power Switch - ON", "1. Press Enter to Set: PC1 and PC2 DC Power Switches - OFF 2. Press Enter to Set: PC3 DC Power Switch - ON"], "jumps": ["P9322"]}, {"id": "P9340", "text": ["3. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used), adjust C3 on PC130-325 for a 3 MHz", "20 kHz signal on IC1 pin 3. Use a 4.7 kohm resistor on the counter's probe to prevent loading and use a plastic screwdriver if available. If not, touch tool."], "jumps": ["P9350"]}, {"id": "P9345", "text": ["PLASTIC SCREWDRIVER - If available, use a plastic screwdriver to adjust C3. A metal screw-driver, when inserted in the slot of the capacitor, will change the capacitance of the circuit. This will give you inaccurate readings. If a plastic screwdriver is not available, follow these steps:", "a. Measure the frequency. b. Use a metal screwdriver to adjust C3. c. Remove the screwdriver. d. Check frequency. e. Repeat steps until frequency is set to 3 MHz.."], "jumps": []}, {"id": "P9350", "text": ["4.  Adjust PC130-325 R1and R4 fully counterclockwise.", "4. Adjust PC130-325 R1and R4 fully counterclockwise. necessary, for a 3 MHz", "5 kHz measurement on IC1 pin 3.rement on IC1 pin 3."], "jumps": ["P9360", "P9340", "P9065"]}, {"id": "P9360", "text": ["5. Using the internal frequency counter in the function generator or a separate frequency counter (an oscilloscope can be used) measure and adjust the following on PC130-325: C3 pin 5, R18 for a 250 kHz", "5 kHz signal. b. IC4 pin 5, R23 for a 300 kHz", "5 kHz signal. c. IC5 pin 5, R26 for a 350 kHz", "5 kHz signal. d. IC6 pin 5, R31 for a 400 kHz"], "jumps": ["P9370", "P9350", "P9065"]}, {"id": "P9370", "text": ["6.  Press Enter to Set: PC1 and PC2 DC Power Switches - ON \n7.  Ensure that PC130-324 S1 is set to NORM.", "6. Press Enter to Set: PC1 and PC2 DC Power Switches - ON 7. Ensure that PC130-324 S1 is set to NORM."], "jumps": ["P9360"]}, {"id": "P9380", "text": ["8.  Using the dual display mode on the oscilloscope, measure,            compare, and adjust (if needed) the following on PC130-324           and PC130-325.", "8. Using the dual display mode on the oscilloscope, measure, compare, and adjust (if needed) the following on PC130-324 and PC130-325.", "a. CH1 probe to PC130-324 CH1 TP and CH2 probe to PC130-325 CH1 TP. Adjust PC130-325 R18 to match input to output. b. CH1 probe to PC130-324 CH2 TP and CH2 probe to PC130-325 CH2 TP. Adjust PC130-325 R23 to match input to output. c. CH1 probe to PC130-324 CH3 TP and CH2 probe to PC130-325 CH3 TP. Adjust PC130-325 R26 to match input to output. d. CH1 probe to PC130-324 CH4 TP and CH2 probe to PC130-325 CH4 TP. Adjust PC130-325 R31 to match input to output."], "jumps": ["P9390", "P9386", "P9385", "P9387"]}, {"id": "P9390", "text": ["Do the analog information signals out of the demultiplexer, PC130-325, match the signals applied to the multiplexer, \nPC130-324?", "Do the analog information signals out of the demultiplexer, PC130-325, match the signals applied to the multiplexer, PC130-324?"], "jumps": ["P9380"]}, {"id": "P9391", "text": [], "jumps": []}, {"id": "P9392", "text": ["The system is not set up correctly. You need to check the alignment of the receiver.", "Touch to return to the receiver alignment. Touching takes you back to the question but, if the receiver is not aligned correctly, you will not get satisfactory results in the troubleshooting problems."], "jumps": []}, {"id": "P9400", "text": ["The FDM system is operating correctly, the four analog inputs are multiplexed and sent to the receiver. Then the one FDM signal is demultiplexed and four outputs are available."], "jumps": ["P9410", "P9390"]}, {"id": "P9410", "text": ["Notes for troubleshooting: \n1.  When checking the inputs to the transmitter and outputs of             the  receiver, check all four signals. \n2.  When checking the output of the transmitter and input to the          receiver, check for a FM signal.", "Notes for troubleshooting: 1. When checking the inputs to the transmitter and outputs of the receiver, check all four signals. 2. When checking the output of the transmitter and input to the receiver, check for a FM signal."], "jumps": ["P9420", "P9400"]}, {"id": "P9420", "text": ["The computer will now insert a fault, or insert no fault, into the FDM system.  You are to determine if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component.", "The computer will now insert a fault, or insert no fault, into the FDM system. You are to determine if the system is operating correctly, and if not, you are to locate the fault to the transmitter or receiver, to the circuit, and then to the most probable chip or component."], "jumps": ["P9410"]}, {"id": "P11000", "text": ["The FDM system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P11010"]}, {"id": "P11010", "text": ["1.  Measure the input signals to the transmitter on PC130-324              channel TPs and the output signals of the receiver on\n     PC130-325 channel TPs to determine if the FDM system is               operating correctly.  Is the FDM system operating correctly?", "1. Measure the input signals to the transmitter on PC130-324 channel TPs and the output signals of the receiver on PC130-325 channel TPs to determine if the FDM system is operating correctly. Is the FDM system operating correctly?"], "jumps": ["P11000"]}, {"id": "P11011", "text": [], "jumps": []}, {"id": "P11012", "text": ["The output signal of the receiver for CH1 is incorrect, zero volts, it does not match the input signal to the transmitter. The FDM system is not operating correctly."], "jumps": []}, {"id": "P11020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-324 TP15 on             PC130-325 TP1.  Note that if only one channel is bad, other             measurements need to be made.  Is the transmitter,                           transmission medium or receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-324 TP15 on PC130-325 TP1. Note that if only one channel is bad, other measurements need to be made. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P11010", "P11025"]}, {"id": "P11023", "text": ["2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-324 TP11 on PC130-325 TP1. Note that if only one channel is bad, other measurements need to be made. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P11010", "P11025"]}, {"id": "P11021", "text": [], "jumps": []}, {"id": "P11022", "text": ["The FDM appears correct.  However, you know the CH1 output of the receiver is bad.  To isolate the problem, check the CH1 circuits in the receiver and transmitter to isolate the fault.", "The FDM appears correct. However, you know the CH1 output of the receiver is bad. To isolate the problem, check the CH1 circuits in the receiver and transmitter to isolate the fault."], "jumps": []}, {"id": "P11025", "text": ["FM OUTPUT - If only one channel is missing from the output of the receiver, the transmitted and received FM signal probably will not indicate such when viewed. You will still see a FM signal. In this case, you must make other measurements in the suspected channel circuits to determine if the transmitter, transmission medium or receiver is faulted."], "jumps": []}, {"id": "P11030", "text": ["3.  Determine the faulted circuit in the transmitter by measuring          the signals on the IC pins and TPs of PC130-324.  Which                  circuit in the transmitter is faulted?", "3. Determine the faulted circuit in the transmitter by measuring the signals on the IC pins and TPs of PC130-324. Which circuit in the transmitter is faulted?"], "jumps": ["P11020"]}, {"id": "P11031", "text": ["The input to the main carrier modulator, TP13, and the output of the main carrier modulator, TP14 and TP15, are FM signals. The main carrier modulator is not faulted.", "The output of the circuit is a FM signal.  The output amplifier is not faulted.", "The output of the circuit is a FM signal. The output amplifier is not faulted.", "The input to the main carrier modulator, TP9, and the output of the main carrier modulator, TP10 and TP11, are FM signals. The main carrier modulator is not faulted..", "The output of the circuit is a FM signal. The output amplifier is not faulted.er modulator, TP10 and TP11, are FM signals. The main carrier modulator is not faulted.."], "jumps": []}, {"id": "P11040", "text": ["Which IC or component is most likely to cause the fault?", "Which IC or component is most likely to cause the fault?..."], "jumps": ["P11030"]}, {"id": "P11041", "text": ["The output of IC2, the CH2 subcarrier modulator is correct.  IC2 is not faulted.", "The output of IC3, the CH3 subcarrier modulator is correct.  IC3 is not faulted.", "Congratulations, you determined that the fault is IC1, the channel 1 subcarrier modulator, no output.", "The output of IC2, the CH2 subcarrier modulator is correct. IC2 is not faulted.", "The output of IC3, the CH3 subcarrier modulator is correct. IC3 is not faulted.", "Congratulations, you determined that the fault is IC1, the channel 1 subcarrier modulator, no output. modulator is not faulted..", "The output of IC2, the CH2 subcarrier modulator is correct. IC2 is not faulted. modulator, TP10 and TP11, are FM signals. The main carrier modulator is not faulted..", "The output of IC3, the CH3 subcarrier modulator is correct. IC3 is not faulted. modulator, TP10 and TP11, are FM signals. The main carrier modulator is not faulted.."], "jumps": ["P11050", "P11040"]}, {"id": "P11050", "text": ["In this case, center frequency input to IC1 on pin 6 is open."], "jumps": ["P11060", "P11045", "P11044"]}, {"id": "P11060", "text": ["The computer will remove the fault after pressing Enter. Then check the output of the receiver on the PC130-325 channel TPs and verify the FDM system is operating correctly.  Note, slight adjustments to PC130-325 R4, R18, R23, R26 and R31 may be necessary.", "The computer will remove the fault after pressing Enter. Then check the output of the receiver on the PC130-325 channel TPs and verify the FDM system is operating correctly. Note, slight adjustments to PC130-325 R4, R18, R23, R26 and R31 may be necessary."], "jumps": ["P11045", "P11044"]}, {"id": "P13000", "text": ["The FDM system may or may not be faulted, you must check using the oscilloscope."], "jumps": ["P13010"]}, {"id": "P13010", "text": ["1.  Measure the input signals to the transmitter on PC130-324              channel TPs and the output signals of the receiver on\n     PC130-325 channel TPs to determine if the FDM system is               operating correctly.  Is the FDM system operating correctly?", "1. Measure the input signals to the transmitter on PC130-324 channel TPs and the output signals of the receiver on PC130-325 channel TPs to determine if the FDM system is operating correctly. Is the FDM system operating correctly?"], "jumps": ["P13000"]}, {"id": "P13011", "text": [], "jumps": []}, {"id": "P13012", "text": ["The output signal of the receiver is zero for all channels, it does not match the input signal to the transmitter.  The FDM system is not operating correctly.", "The output signal of the receiver is zero for all channels, it does not match the input signal to the transmitter. The FDM system is not operating correctly."], "jumps": []}, {"id": "P13020", "text": ["2.  Determine if the transmitter, transmission medium or receiver        is faulted by measuring the signals on PC130-324 TP15 on             PC130-325 TP1.  Note that if only one channel is bad, other             measurements need to be made.  Is the transmitter,                           transmission medium or receiver faulted?", "2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-324 TP15 on PC130-325 TP1. Note that if only one channel is bad, other measurements need to be made. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P13010", "P13025"]}, {"id": "P13024", "text": ["2. Determine if the transmitter, transmission medium or receiver is faulted by measuring the signals on PC130-324 TP11 on PC130-325 TP1. Note that if only one channel is bad, other measurements need to be made. Is the transmitter, transmission medium or receiver faulted?"], "jumps": ["P13010", "P13025"]}, {"id": "P13021", "text": [], "jumps": []}, {"id": "P13022", "text": ["There is no FDM signal on the output of the transmitter.  The transmission medium will not operate correctly even if not faulted.", "There is no FDM signal on the output of the transmitter. The transmission medium will not operate correctly even if not faulted."], "jumps": []}, {"id": "P13023", "text": ["There is no FDM signal on the output of the transmitter. The receiver will not operate correctly even if not faulted."], "jumps": []}, {"id": "P13025", "text": ["FM OUTPUT - If only one channel is missing from the output of the receiver, the transmitted and received FM signal probably will not indicate such when viewed. You will still see a FM signal. In this case, you must make other measurements in the suspected channel circuits to determine if the transmitter, transmission medium or receiver is faulted."], "jumps": []}, {"id": "P13030", "text": ["3.  Determine the faulted circuit in the transmitter by measuring          the signals on the IC pins and TPs of PC130-324.  Which                  circuit in the transmitter is faulted?", "3. Determine the faulted circuit in the transmitter by measuring the signals on the IC pins and TPs of PC130-324. Which circuit in the transmitter is faulted?"], "jumps": ["P13020"]}, {"id": "P13031", "text": ["The outputs on TP9, 10, 11 and 12 are correct.  A subcarrier modulator is not faulted.", "There is a FM signal in let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
