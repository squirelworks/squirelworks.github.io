const book = {"title": "93957104", "pages": [{"id": "P0", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 1997 - 2002 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I .", "Title: NATURE OF HEAT sdf asdf asd fasfd asdf asdf sadf"], "jumps": []}, {"id": "P10", "text": ["Hello , this lesson is about:sson is about:"], "jumps": []}, {"id": "P100", "text": ["w Describe thermo-electronics. w Describe the classification of thermo-electronic devices.", "w Describe heat. w Describe heat measuring systems. w Describe heat units."], "jumps": []}, {"id": "P300", "text": ["Heat has many useful functions, one being to warm you."], "jumps": ["P420", "P300"]}, {"id": "P420", "text": ["Heat is also used to warm the house, iron clothes and toast bread.", "Heat is also used to warm the house, iron clothes and toast bread..."], "jumps": ["P430", "P400"]}, {"id": "P430", "text": ["Electricity can generate heat.", "Electricity can generate heat.heat........................."], "jumps": ["P440", "P400"]}, {"id": "P440", "text": ["Heat can be changed to electrical signals and monitored by sensors."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["For example, a thermostat measures the amount of heat in a room."], "jumps": ["P460", "P430"]}, {"id": "P460", "text": ["If the room temperature does not agree with the setting of the thermostat, either a heater or air conditioner is turned on to raise or lower the temperature."], "jumps": ["P470", "P450"]}, {"id": "P470", "text": ["The thermostat is a heat transducer, changing one form of energy (heat) into another form (electrical)."], "jumps": ["P480", "P450"]}, {"id": "P480", "text": ["Let's begin the lesson on NATURE OF HEAT.................................."], "jumps": ["P450"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [], "jumps": []}, {"id": "P1015", "text": ["Thermo-electronics is the study of mechanical and electrical components associated with heat."], "jumps": ["P1020", "P1001"]}, {"id": "P1020", "text": ["Thermo-electronics combines standard electronic circuits with special heat components to form heat circuits."], "jumps": ["P1030", "P1015"]}, {"id": "P1030", "text": ["Until recently, heat and electronics were only used to measure temperatures for controlling heating and air conditioning systems."], "jumps": ["P1040", "P1020"]}, {"id": "P1040", "text": ["Today, heat and electronics do a lot more."], "jumps": ["P1050", "P1020"]}, {"id": "P1050", "text": ["For example, heat transducers can detect the presence of a person in a room."], "jumps": ["P1060", "P1020"]}, {"id": "P1060", "text": ["Your body gives off heat and can be detected.", "Heat transducers are also used in heat seeking missiles.", "Heat transducers are also used in heat seeking missiles...."], "jumps": ["P1070", "P1050", "P1080"]}, {"id": "P1080", "text": ["The missile uses the transducers to track targets."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["The circuits are normal electronic circuits with the addition of components that react to heat."], "jumps": ["P1100", "P1070"]}, {"id": "P1100", "text": ["What is the name of the field that combines electronics with heat?"], "jumps": ["P1070"]}, {"id": "P1101", "text": [], "jumps": []}, {"id": "P1102", "text": ["Opto-electronics is the field that combines electronics with light, not heat."], "jumps": []}, {"id": "P1103", "text": ["Transducers are devices that change one form of energy to another.  There are several types of transducers light, heat, position and motion are just a few.", "Transducers are devices that change one form of energy to another. There are several types of transducers light, heat, position and motion are just a few."], "jumps": []}, {"id": "P1110", "text": ["All thermo-electronic devices are divided into two categories, generators and sensors."], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["A heat generator is a device that creates heat."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["For example, a furnace generates heat to warm your house."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["Heat generators are classified into three categories.", "Heat generators are classified into three categories......."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["I2R is heat created by electronic circuits.", "I2R is heat created by electronic circuits.."], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["Heat is generated by current flowing through a resistance.", "Heat is generated by current flowing through a resistance.m"], "jumps": ["P1170", "P1140"]}, {"id": "P1170", "text": ["In a standard electronic circuit, this is unwanted heat because energy is lost."], "jumps": ["P1180", "P1140"]}, {"id": "P1180", "text": ["A heating device purposely creates this heat.  A thermo transducer (heating device) changes electrical energy to heat.", "A heating device purposely creates this heat. A thermo transducer (heating device) changes electrical energy to heat."], "jumps": ["P1190", "P1140"]}, {"id": "P1190", "text": ["The second category of heat generators is friction.", "The second category of heat generators is friction........."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Friction generates heat by the rubbing action of two materials."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["Rub your hands together quickly and you will sense the heat generated."], "jumps": ["P1220", "P1190"]}, {"id": "P1220", "text": ["Heat generated by friction is normally unwanted.  The friction used to create heat causes power loss and degrades mechanical parts.", "Heat generated by friction is normally unwanted. The friction used to create heat causes power loss and degrades mechanical parts."], "jumps": ["P1230", "P1190"]}, {"id": "P1230", "text": ["The last category of generating heat is by chemical action."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["Heat generated by chemical action occurs when different substances are combined, as in chemistry."], "jumps": ["P1250", "P1230"]}, {"id": "P1260", "text": ["For example, fire produces chemical heat and there are packages that, when smashed, combine two substances that give off heat."], "jumps": ["P1270", "P1240"]}, {"id": "P10216", "text": ["What type of heat sensor is a thermo-couple?"], "jumps": []}, {"id": "P1270", "text": ["A heat sensor is a device that detects heat.", "A heat sensor is a device that detects heat................"], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["For example, thermostats sense room temperature and send signals to turn the furnace on and off."], "jumps": ["P1290", "P1270"]}, {"id": "P1290", "text": ["Heat sensors are also classified into three categories.", "Heat sensors are also classified into three categories....."], "jumps": ["P1300", "P1270"]}, {"id": "P1300", "text": ["Heat sensors change heat energy into an electrical quantity."], "jumps": ["P1310", "P1290"]}, {"id": "P1310", "text": ["Resistive sensors change their resistance according to the amount of heat sensed."], "jumps": ["P1320", "P1290"]}, {"id": "P1320", "text": ["Examples of resistive heat sensors are thermistors and mechanical potentiometers."], "jumps": ["P1330", "P1290"]}, {"id": "P1330", "text": ["Voltage sensors change their voltage output according to the amount of heat sensed."], "jumps": ["P1340", "P1320"]}, {"id": "P1340", "text": ["An example is a thermo-couple."], "jumps": ["P1350", "P1330"]}, {"id": "P1350", "text": ["Current sensors change their current flow according to the amount of heat sensed."], "jumps": ["P1360", "P1330"]}, {"id": "P1360", "text": ["Semi-conductors devices (diodes) are current sensors."], "jumps": ["P1370", "P1350"]}, {"id": "P1370", "text": ["What are the two classifications of thermo-electronic devices?"], "jumps": ["P1350"]}, {"id": "P1371", "text": [], "jumps": []}, {"id": "P1372", "text": ["Transmitters and receivers are classifications of photoelectronic devices."], "jumps": []}, {"id": "P1373", "text": ["Voltage and current are categories of heat sensors.", "Voltage and current are categories of heat sensors........."], "jumps": []}, {"id": "P1380", "text": ["What type of heat generator produces heat by the combining of two different substances."], "jumps": ["P1370"]}, {"id": "P1381", "text": [], "jumps": []}, {"id": "P1382", "text": ["I2R heat generators operate using the current flow through a resistance.", "I2R heat generators operate using the current flow through a resistance.."], "jumps": []}, {"id": "P1383", "text": ["Friction heat generators operate using the rubbing action between two substances."], "jumps": []}, {"id": "P1390", "text": ["What type of heat sensor is a thermo-couple?", "What type of heat sensor is a thermo-couple?..............."], "jumps": ["P1380"]}, {"id": "P1391", "text": [], "jumps": []}, {"id": "P1392", "text": ["A thermistor or mechanical potentiometer is a type of resistive heat sensor.   A thermo-couple is not a resistive type of sensor.", "A thermistor or mechanical potentiometer is a type of resistive heat sensor. A thermo-couple is not a resistive type of sensor."], "jumps": []}, {"id": "P1393", "text": ["A semi-conductor is a type of current heat sensor.   A thermo-couple is not a current device.", "A semi-conductor is a type of current heat sensor. A thermo-couple is not a current device."], "jumps": []}, {"id": "P1910", "text": ["This completes the information on THERMO-ELECTRONICS.", "1.  Thermo-electronics is the study of electrical components                associated with heat.", "This completes the information on THERMO-ELECTRONICS.......", "1. Thermo-electronics is the study of electrical components associated with heat."], "jumps": ["P1390", "P1930", "P1001"]}, {"id": "P1930", "text": ["2.  Thermo-electronic devices are divided into generators and             sensors.", "2. Thermo-electronic devices are divided into generators and sensors."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Heat generators are either I2R, friction, or chemical.", "3. Heat generators are either I2R, friction, or chemical...."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Heat sensors are either resistance, current, or voltage                      sensitive.", "4. Heat sensors are either resistance, current, or voltage sensitive."], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1950"]}, {"id": "P2001", "text": [], "jumps": []}, {"id": "P2010", "text": ["Heat is a human term for a relative environmental condition which affects the sense of touch."], "jumps": ["P2020", "P2001"]}, {"id": "P2020", "text": ["Your skin, epidermis, has heat sensors that give you the sensation of hot or cold."], "jumps": ["P2030", "P2010"]}, {"id": "P2030", "text": ["In electronics, the term temperature is used rather than hot or cold, as these terms are relative to human sensation."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["Temperature is a radiant wave, just like light and radio waves.", "10 10 10 10 10 10 10 10 1000", "0 1 5 9 12 14 17 20 222222222"], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["The frequency range of temperature waves is from 1013 to\n1014 Hz, near the infrared region of the electromagnetic spectrum.", "The frequency range of temperature waves is from 1013 to 1014 Hz, near the infrared region of the electromagnetic spectrum...", "10 10 10 10 10 10 10 10 1000", "0 1 5 9 12 14 17 20 222222222"], "jumps": ["P2060", "P2040"]}, {"id": "P2060", "text": ["This is the reason why certain materials give off heat before they give off light, such as tungsten lamps."], "jumps": ["P2070", "P2040"]}, {"id": "P2070", "text": ["What is heat?", "What is heat?he question is typed.........................."], "jumps": ["P2040"]}, {"id": "P2071", "text": [], "jumps": []}, {"id": "P2072", "text": ["Hot and cold are relative quantities of heat.", "Hot and cold are relative quantities of heat..............."], "jumps": []}, {"id": "P2073", "text": ["Temperature is a measure of heat.", "Temperature is a measure of heat..........................."], "jumps": []}, {"id": "P2080", "text": ["As all environmental phenomena, temperature has reference values measured in degrees."], "jumps": ["P2100", "P2070"]}, {"id": "P2100", "text": ["These measures of temperature can be generated and sensed by various heat transducers."], "jumps": ["P2110", "P2080"]}, {"id": "P2110", "text": ["The illustrated graph indicates the range of these systems in normal applications and key phenomena which occur within them."], "jumps": ["P2120", "P2080"]}, {"id": "P2120", "text": ["Note that water freezes at 32 degrees Fahrenheit."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["This equates to 0 degrees Celsius and 273 degrees Kelvin."], "jumps": ["P2140", "P2110"]}, {"id": "P2140", "text": ["These three equations illustrate how to change between the measuring systems.", "Celsius to Fahrenheit F = (C x 9/5) + 32", "Fahrenheit to Celsius C = (F - 32) x 5/9 2", "Celsius to Kelvin K = C + 273x 9/5) + 32"], "jumps": ["P2150", "P2110"]}, {"id": "P2150", "text": ["For example, water boils around 212 degrees Fahrenheit.  This is 100 degrees Celsius and 373 degrees Kelvin.", "For example, water boils around 212 degrees Fahrenheit. This is 100 degrees Celsius and 373 degrees Kelvin.", "= (212 - 32) x 5/9 = 180 x 5/9 = 20 x 5 = 100", "Celsius to Kelvin = 100 + 273 = 373"], "jumps": ["P2160", "P2140"]}, {"id": "P2160", "text": ["Convert 80 degrees Fahrenheit to Celsius.", "Convert 80 degrees Fahrenheit to Celsius..................."], "jumps": ["P2150"]}, {"id": "P2161", "text": [], "jumps": []}, {"id": "P2162", "text": ["To arrive at 44.4 degrees C, you did not subtract 32 from the Fahrenheit temperature."], "jumps": []}, {"id": "P2163", "text": ["To arrive at 299.7 degrees, you converted F to C and then converted C to K."], "jumps": []}, {"id": "P2165", "text": ["CONVERTING F TO C - To convert Fahrenheit to Celsius, you subtract 32 from F and multiply by 5/9."], "jumps": []}, {"id": "P2170", "text": ["Convert 95 degrees Fahrenheit to Kelvin.", "Convert 95 degrees Fahrenheit to Kelvin...................."], "jumps": ["P2160"]}, {"id": "P2171", "text": [], "jumps": []}, {"id": "P2172", "text": ["To arrive at 35 degrees, you converted Fahrenheit to Celsius. Now you must convert Celsius to Kelvin."], "jumps": []}, {"id": "P2173", "text": ["To arrive at 325.8 degrees, you converted Fahrenheit to Celsius incorrectly, you did not subtract 32 from the Fahrenheit value."], "jumps": []}, {"id": "P2175", "text": ["CONVERTING FAHRENHEIT TO KELVIN - To convert Fahrenheit to Kelvin, you must first convert Fahrenheit to Celsius."], "jumps": []}, {"id": "P2180", "text": ["During the discovery of basic electrical phenomena in the 18th and 19th centuries, the heating properties of current flow were quickly noted."], "jumps": ["P2190", "P2170"]}, {"id": "P2190", "text": ["This led to equating heat to electrical values.  But, before this can be done, you must know the heating ability of a heat source.", "This led to equating heat to electrical values. But, before this can be done, you must know the heating ability of a heat source."], "jumps": ["P2200", "P2180"]}, {"id": "P2200", "text": ["The basic units of heating ability are the calorie (cal) and the British Thermal Unit, BTU.", "The basic units of heating ability are the calorie (cal) and the British Thermal Unit, BTU.."], "jumps": ["P2210", "P2180"]}, {"id": "P2210", "text": ["One calorie is defined as the heat necessary to raise 1 gram of water 1 degree Celsius above the ambient temperature."], "jumps": ["P2220", "P2180"]}, {"id": "P2215", "text": ["AMBIENT - Ambient temperature is the temperature of a substance without adding or subtracting heat, the normal temperature of a substance. For example, the room that you are in may have an ambient temperature of 25 degrees Celsius."], "jumps": []}, {"id": "P2220", "text": ["The Calorie is a metric heat unit.  Calories use grams and Celsius.", "The Calorie is a metric heat unit. Calories use grams and Celsius."], "jumps": ["P2230", "P2210"]}, {"id": "P2230", "text": ["The Imperial unit of heat is the British Thermal Unit or BTU."], "jumps": ["P2240", "P2210"]}, {"id": "P2240", "text": ["One BTU is defined as the heat necessary to raise 1 Lb of water, 1 degree Fahrenheit above the ambient temperature."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["For example, 10 BTU's will:", "For example, 10 BTU's will:e...............................", "F or Raise 10 lb of water 1", "F or Raise 5 lb of water 2"], "jumps": ["P2260", "P2230"]}, {"id": "P2260", "text": ["10 Calories will raise:"], "jumps": ["P2270", "P2250"]}, {"id": "P2270", "text": ["1 BTU is equal to 252 calories.  To convert calories to BTU's multiply 252 and the calories.  To convert BTU's to calories divide BTU's by calories.", "1 BTU is equal to 252 calories. To convert calories to BTU's multiply 252 and the calories. To convert BTU's to calories divide BTU's by calories."], "jumps": ["P2280", "P2250"]}, {"id": "P2280", "text": ["How many BTU's are needed to raise 5 pounds of water 5 degrees F?"], "jumps": ["P2270"]}, {"id": "P2281", "text": [], "jumps": []}, {"id": "P2282", "text": ["5 BTU's will raise one pound of water five degrees F or will raise five pounds of water one degree F.  The combination of pounds and temperature do not equal 5 pounds raised 5 degrees.", "5 BTU's will raise one pound of water five degrees F or will raise five pounds of water one degree F. The combination of pounds and temperature do not equal 5 pounds raised 5 degrees."], "jumps": []}, {"id": "P2283", "text": ["10 BTU's will raise one pound of water ten degrees F or will raise ten pounds of water one degree F.  The combination of pounds and temperature do not equal 5 pounds raised 5 degrees.", "10 BTU's will raise one pound of water ten degrees F or will raise ten pounds of water one degree F. The combination of pounds and temperature do not equal 5 pounds raised 5 degrees."], "jumps": []}, {"id": "P2285", "text": ["BTU - One BTU will raise one pound of water to one degree F. Since there are five pounds and you are to raise the temperature five degrees, you must multiply the lb's to be raised by the amount of degrees."], "jumps": []}, {"id": "P2290", "text": ["If it takes 25 BTU's to raise 5 pounds of water 5 degrees F, how many calories are needed?"], "jumps": ["P2280"]}, {"id": "P2291", "text": [], "jumps": []}, {"id": "P2292", "text": ["You did not perform the conversion correctly.", "You did not perform the conversion correctly..............."], "jumps": []}, {"id": "P2293", "text": ["You multiplied 252 by 25 BTU's.  You should have divided 25 BTU's by 252.", "You multiplied 252 by 25 BTU's. You should have divided 25 BTU's by 252."], "jumps": []}, {"id": "P2295", "text": ["BTU/CALORIE CONVERSION - To convert between BTU's and Calories, you multiply or divide by 252:"], "jumps": []}, {"id": "P2300", "text": ["To equate electrical units to heating ability, one watt of electrical power equals 0.239 calories/sec or:"], "jumps": ["P2310", "P2290"]}, {"id": "P2310", "text": ["Remember, a watt is voltage times current. Current is the amount of electrons that pass a given point per second.  Time must be used when comparing heat to electrical power.", "Remember, a watt is voltage times current. Current is the amount of electrons that pass a given point per second. Time must be used when comparing heat to electrical power."], "jumps": ["P2320", "P2300"]}, {"id": "P2320", "text": ["What this means is that if an electronic component gives off 1 Watt of heat, the heat would raise 1 gram of water 0.239\u00ba C per second.", "What this means is that if an electronic component gives off 1 Watt of heat, the heat would raise 1 gram of water 0.239"], "jumps": ["P2330", "P2300"]}, {"id": "P2330", "text": ["Resistors normally are not used to heat water they simply radiate heat into the air or to a heat sink."], "jumps": ["P2910", "P2300"]}, {"id": "P2910", "text": ["This completes the information on HEAT.", "This completes the information on HEAT.TIVE 2 TITLE........"], "jumps": ["P2330"]}, {"id": "P2920", "text": ["1.  Heat is a human term for electromagnetic waves within a                 narrow frequency band.", "1. Heat is a human term for electromagnetic waves within a narrow frequency band.", "10 10 10 10 10 10 10 10 1000", "0 1 5 9 12 14 17 20 222222222"], "jumps": ["P2930", "P2001"]}, {"id": "P2930", "text": ["2.  Heat is in the 10    to 10    Hz range of the electromagnetic                spectrum.", "2. Heat is in the 10 to 10 Hz range of the electromagnetic spectrum...", "10 10 10 10 10 10 10 10 1000", "0 1 5 9 12 14 17 20 222222222"], "jumps": ["P2940", "P2920"]}, {"id": "P2940", "text": ["3.  Temperature is measured using three systems.", "3. Temperature is measured using three system let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
