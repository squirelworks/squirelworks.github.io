<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Understand the particulars of troubleshooting SSB equipment. w Identify faults in a typical SSB system.oting SSB equipment."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 453 XXXXXXnt"], "jumps": []}, {"id": "P301", "text": ["12. X10 Oscilloscope Probes (2) XXXXXXXXXXnt"], "jumps": []}, {"id": "P302", "text": ["14. Alligator to Alligator 18\" Cable (2)"], "jumps": []}, {"id": "P330", "text": [], "jumps": []}, {"id": "P331", "text": [], "jumps": []}, {"id": "P332", "text": [], "jumps": []}, {"id": "P333", "text": [], "jumps": []}, {"id": "P334", "text": [], "jumps": []}, {"id": "P335", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P400", "text": ["The tools used to troubleshoot single-sideband systems are the same as used for any other radio format."], "jumps": ["P410", "P300", "PP", "P"]}, {"id": "P410", "text": ["Spectrum Analyzers are highly useful; but the cost is significant, making their availability out of reach for many maintenance operations."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Still, efficient use of the oscilloscope and function generator provides adequate measurements to conduct identification of faulted components.  RF Voltmeters are handy when testing filters, but they are not always available.  Oscilloscopes can be used as a viable option.", "Still, efficient use of the oscilloscope and function generator provides adequate measurements to conduct identification of faulted components. RF Voltmeters are handy when testing filters, but they are not always available. Oscilloscopes can be used as a viable option."], "jumps": ["P430", "P410", "PP", "P"]}, {"id": "P430", "text": ["An RF generator with a sweep function is also desirable, although a generator without the sweep function is acceptable."], "jumps": ["P440", "P420", "P", "PP", "P2uu"]}, {"id": "P440", "text": ["For the most part, the technician will be verifying the existance and value of different oscillations within the system.  Since the majority of SSB generated signals are of the balanced modulator type, most SSB systems are closely identical.", "For the most part, the technician will be verifying the existance and value of different oscillations within the system. Since the majority of SSB generated signals are of the balanced modulator type, most SSB systems are closely identical."], "jumps": ["P450", "P430"]}, {"id": "P450", "text": ["This knowledge does not preclude the necessity to identify the generation method used from one system to the next.  In the absence of a technical manual for a given piece of equipment, a schematic analysis of the system must be performed.", "This knowledge does not preclude the necessity to identify the generation method used from one system to the next. In the absence of a technical manual for a given piece of equipment, a schematic analysis of the system must be performed."], "jumps": ["P460", "P440"]}, {"id": "P460", "text": ["Let's begin the lesson on SSB TROUBLESHOOTING............................."], "jumps": []}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P1020", "text": ["In the following experiment, you will troubleshoot faults in the SSB system.  The schematic diagrams of the NIDA SSB Transmitter/Receiver Trainer are provided.", "In the following experiment, you will troubleshoot faults in the SSB system. The schematic diagrams of the NIDA SSB Transmitter/Receiver Trainer are provided."], "jumps": ["P1029", "P1001"]}, {"id": "P1029", "text": ["It should be remembered that the DC levels will vary from card set to card set, based upon the settings of variable components in the receiver's circuits.  Some frequencies are also provided.", "It should be remembered that the DC levels will vary from card set to card set, based upon the settings of variable components in the receiver's circuits. Some frequencies are also provided.", "Due to the High Frequencies associated with SSB Systems, and the numerous unshielded components and terminals, RF Radiation may cause some faulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms."], "jumps": ["P1030", "P1020"]}, {"id": "P1030", "text": ["Preparation:\n1.  Apply power to the oscilloscope, function generator and                 multimeter.  Test equipment should be allowed to warm up             prior to use.  This ensures accurate measurements.", "Preparation: 1. Apply power to the oscilloscope, function generator and multimeter. Test equipment should be allowed to warm up prior to use. This ensures accurate measurements."], "jumps": ["P1040", "P1029"]}, {"id": "P1040", "text": ["Oscilloscope settings provided are a starting point, adjustments will need to be made while moving from one test point to another."], "jumps": ["P1050", "P1030"]}, {"id": "P1050", "text": ["2.  Adjust the oscilloscope as follows:", "2. Adjust the oscilloscope as follows:....................", "Due to the High Frequencies associated with SSB Systems, and the numerous unshielded components and terminals, RF Radiation may cause some faulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms.", "CH1.............................. - 50 mV per division, AC Time/Division............ - 1 mS Oscilloscope Probe - X10000000000000000000000ulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms."], "jumps": ["P1060", "P1040"]}, {"id": "P1060", "text": ["1.  Setup the Transmitter an Receiver Test Consoles for dual               interface.", "1. Setup the Transmitter an Receiver Test Consoles for dual interface. sed as a Receiver and will be identified as Test Console 2. Not closer than two feet apart. Three to four is preferable."], "jumps": ["P1050"]}, {"id": "P1070", "text": ["2.  Separate the PC130-450, 451 and 452 cards from the rest of             the SSB card set.  These cards make up the transmitter.", "2. Separate the PC130-450, 451 and 452 cards from the rest of the SSB card set. These cards make up the transmitter."], "jumps": ["P1080", "P1068"]}, {"id": "P1080", "text": ["3.  The remaining cards, PC130-453, 454 and 455 cards form the          rest of the SSB card set.  These cards make up the receiver.", "3. The remaining cards, PC130-453, 454 and 455 cards form the rest of the SSB card set. These cards make up the receiver."], "jumps": ["P1090", "P1070"]}, {"id": "P1090", "text": ["4.  Insert the PC cards into the following positions: \n     Transmitter Console             Receiver Console\n     PC130-450 PC1 position      PC130-453 PC1 position                          PC130-451 PC2 position      PC130-454 PC2 position                          PC130-452 PC3 position      PC130-455 PC3 position", "4. Insert the PC cards into the following positions: Transmitter Console Receiver Console PC130-450 PC1 position PC130-453 PC1 position PC130-451 PC2 position PC130-454 PC2 position PC130-452 PC3 position PC130-455 PC3 position"], "jumps": ["P1110", "P1080"]}, {"id": "P1110", "text": ["5.  Set the Positive and Negative Supply Control to 12.  \n      The Voltmeter on the Transmitter should indicate 12 Volts.      6.  Set the Positive and Negative Supply Control to 12. \n      The Voltmeter on the Receiver should indicate 12 Volts.", "5. Set the Positive and Negative Supply Control to 12. The Voltmeter on the Transmitter should indicate 12 Volts. 6. Set the Positive and Negative Supply Control to 12. The Voltmeter on the Receiver should indicate 12 Volts."], "jumps": ["P1090"]}, {"id": "P1120", "text": he Transmitter Test Console PC1, PC2 and PC3 DC                   power to ON. \n13.  Set the Receiver Test Console PC1, PC2 and PC3 DC power           to ON.", "12. Set the Transmitter Test Console PC1, PC2 and PC3 DC power to ON. 13. Set the Receiver Test Console PC1, PC2 and PC3 DC power to ON."], "jumps": ["P1150"]}, {"id": "P1180", "text": ["14.  Set the Receiver Test Console Speaker power to ON. \n        Either a 400 Hz or a 1 kHz tone (whichever position you                   selected) should be heard coming form the speaker.", "14. Set the Receiver Test Console Speaker power to ON. Either a 400 Hz or a 1 kHz tone (whichever position you selected) should be heard coming form the speaker."], "jumps": ["P1170"]}, {"id": "P1190", "text": ["15.  Adjust the volume control knob on PC130-455 for a                           comfortable listening level.  The Nida SSB transmitter and               receiver should now be ready for operation.", "15. Adjust the volume control knob on PC130-455 for a comfortable listening level. The Nida SSB transmitter and receiver should now be ready for operation..."], "jumps": ["P1200", "P1180"]}, {"id": "P1200", "text": ["Procedure:\nPrior to troubleshooting, an assessment of the equipment's operational status should be made.  The checklist below is a guideline to assist you to that end.", "Procedure: Prior to troubleshooting, an assessment of the equipment's operational status should be made. The checklist below is a guideline to assist you to that end. O", "1. The SSB Card set has no visual indicators. However, if audio can be heard coming from the speaker, then the system's power supply is functioning correctly. In fact, if there is an audible tone from either the on-board signal generator or from an external unit, then 90% of the system may be ruled functional. 2. On the PC130-450 Card; with input selector, S2, in the function generator position, exercise S3 while listening for a change in tone. There should be two distinct tones, one at 400 Hz and one at 1 kHz. 3. Switch S2 to the microphone position. Now exercise the microphone with either voice or a whistle. The sound should be reproduced on the 130 Test Console. 4. Return switch S2 to the function generator position. On PC130-452 card, place S1 to the opposite sideband from its present setting. Do the same to S1 on PC130-453. An undistorted tone should still be heard. 5. Because you were able to adjust the volume, the audio section of the system is functioning. 6. On PC130-450, place switch S3 to the EXT (External) position. The tone should not be heard unless TP1, the External Input, is connected to a signal generator."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["This checklist has allowed you to verify the serviceability of the SSB system's functions.  In a commercial receiver or transceiver, a much more involved checklist would have to be developed.", "This checklist has allowed you to verify the serviceability of the SSB system's functions. In a commercial receiver or transceiver, a much more involved checklist would have to be developed."], "jumps": ["P1220", "P1200"]}, {"id": "P1220", "text": ["Using the initial assessment checklist, verify the receiver is operating properly.", "1. The SSB Card set has no visual indicators. However, if audio can be heard coming from the speaker, then the system's power supply is functioning correctly. In fact, if there is an audible tone from either the on-board signal generator or from an external unit, then 90% of the system may be ruled functional. 2. On the PC130-450 Card; with input selector, S2, in the function generator position, exercise S3 while listening for a change in tone. There should be two distinct tones, one at 400 Hz and one at 1 kHz. 3. Switch S2 to the microphone position. Now exercise the microphone with either voice or a whistle. The sound should be reproduced on the 130 Test Console. 4. Return switch S2 to the function generator position. On PC130-452 card, place S1 to the opposite sideband from its present setting. Do the same to S1 on PC130-453. An undistorted tone should still be heard. 5. Because you were able to adjust the volume, the audio section of the system is functioning. 6. On PC130-450, place switch S3 to the EXT (External) position. The tone should not be heard unless TP1, the External Input, is connected to a signal generator."], "jumps": ["P1230", "P1200"]}, {"id": "P1230", "text": ["The computer will now insert a fault into the Transmitter.", "The computer will now insert a fault into the Transmitter.switch to ON. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON........................................."], "jumps": ["P1220"]}, {"id": "P1240", "text": ["Once again, run through the initial assessment checklist.", "1. The SSB Card set has no visual indicators. However, if audio can be heard coming from the speaker, then the system's power supply is functioning correctly. In fact, if there is an audible tone from either the on-board signal generator or from an external unit, then 90% of the system may be ruled functional. 2. On the PC130-450 Card; with input selector, S2, in the function generator position, exercise S3 while listening for a change in tone. There should be two distinct tones, one at 400 Hz and one at 1 kHz. 3. Switch S2 to the microphone position. Now exercise the microphone with either voice or a whistle. The sound should be reproduced on the 130 Test Console. 4. Return switch S2 to the function generator position. On PC130-452 card, place S1 to the opposite sideband from its present setting. Do the same to S1 on PC130-453. An undistorted tone should still be heard. 5. Because you were able to adjust the volume, the audio section of the system is functioning. 6. On PC130-450, place switch S3 to the EXT (External) position. The tone should not be heard unless TP1, the External Input, is connected to a signal generator.", "Once again, run through the initial assessment checkli ": "P13030", "text": ["Preparation: \n1.  Apply power to the oscilloscope, function generator and                 multimeter.  Test equipment should be allowed to warm up             prior to use.  This ensures accurate measurements.", "Preparation: 1. Apply power to the oscilloscope, function generator and multimeter. Test equipment should be allowed to warm up prior to use. This ensures accurate measurements."], "jumps": ["P13040", "P13029"]}, {"id": "P13040", "text": ["Oscilloscope settings provided are a starting point, adjustments will need to be made while moving from one test point to another."], "jumps": ["P13050", "P13030"]}, {"id": "P13050", "text": ["2.  Adjust the oscilloscope as follows:", "2. Adjust the oscilloscope as follows:....................", "Due to the High Frequencies associated with SSB Systems, and the numerous unshielded components and terminals, RF Radiation may cause some faulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms.", "CH1.............................. - 50 mV per division, AC Time/Division............ - 1 mS Oscilloscope Probe - X10000000000000000000000ulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms."], "jumps": ["P13058", "P13040"]}, {"id": "P13058", "text": ["1.  Setup the Transmitter an Receiver Test Consoles for dual               interface.", "1. Setup the Transmitter an Receiver Test Consoles for dual interface. Trainer will be used as a Receiver and will be identified as Test Console 2."], "jumps": ["P13050"]}, {"id": "P13070", "text": ["2.  Separate the PC130-450, 451 and 452 cards from the rest of             the SSB card set.  These cards make up the transmitter.", "2. Separate the PC130-450, 451 and 452 cards from the rest of the SSB card set. These cards make up the transmitter."], "jumps": ["P13080"]}, {"id": "P13080", "text": ["3.  The remaining cards, PC130-453, 454 and 455 cards form the          rest of the SSB card set.  These cards make up the receiver.", "3. The remaining cards, PC130-453, 454 and 455 cards form the rest of the SSB card set. These cards make up the receiver."], "jumps": ["P13090", "P13070"]}, {"id": "P13090", "text": ["4.  Insert the PC cards into the following positions: \n     Transmitter Console               Receiver Console  \n     PC130-450 PC1 position        PC130-453 PC1 position                        PC130-451 PC2 position        PC130-454 PC2 position                        PC130-452 PC3 position        PC130-455 PC3 position", "4. Insert the PC cards into the following positions: Transmitter Console Receiver Console PC130-450 PC1 position PC130-453 PC1 position PC130-451 PC2 position PC130-454 PC2 position PC130-452 PC3 position PC130-455 PC3 position"], "jumps": ["P13100", "P13080"]}, {"id": "P13100", "text": ["5.  Press enter to set:  Transmitter Positive Supply Voltage  - 12                                               Transmitter Negative Supply Voltage - 12 6.  Press enter to set:  Receiver Positive Supply Voltage       - 12                                               Receiver Negative Supply Voltage      - 12", "5. Press enter to set: Transmitter Positive Supply Voltage - 12 Transmitter Negative Supply Voltage - 12 6. Press enter to set: Receiver Positive Supply Voltage - 12 Receiver Negative Supply Voltage - 12"], "jumps": ["P13090"]}, {"id": "P13110", "text": ["7.  Attach one alligator-to-alligator cable to TP8 (RF out) on the            PC130-452 card. This cable will act as the transmitter's                     antenna.", "7. Attach one alligator-to-alligator cable to TP8 (RF out) on the PC130-452 card. This cable will act as the transmitter's antenna."], "jumps": ["P13120"]}, {"id": "P13120", "text": ["8.  On the PC130-450 card, set the switches as follows:", "8. On the PC130-450 card, set the switches as follows::::.", "Due to the High Frequencies associated with SSB Systems, and the numerous unshielded components and terminals, RF Radiation may cause some faulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms.", "S1 - either 400 or 1 kHz S2 - Sine S3 - Int.ision, AC Time/Division............ - 1 mS Oscilloscope Probe - X10000000000000000000000ulted signals to appear as if they are working. Consequently, faults have been selected that reflect obvious symptoms."], "jumps": ["P13130", "P13110"]}, {"id": "P13130", "text": ["9.  On the PC130-452 card, set switch S1 to either USB or LSB.", "9. On the PC130-452 card, set switch S1 to either USB or LSB..."], "jumps": ["P13140", "P13120"]}, {"id": "P13140", "text": ["10.  Attach one alligator-to-alligator cable to TP1 (RF input) on the         PC130-453 card.  This cable will act as the receivers's                       antenna.", "10. Attach one alligator-to-alligator cable to TP1 (RF input) on the PC130-453 card. This cable will act as the receivers's antenna.", "{iRI, -5NXmllhuodhh^Zbbbbb^Z^hcZ^ZhbhbcaZaZZbhb", "ie|etiL -<Oe{zh{h{{z^ciWR-:%:;NZmhhhuybbh^^ZZZZbbbbZ^ZbhbhbbbbbbbcbbZ"], "jumps": ["P13150", "P13130"]}, {"id": "P13150", "text": ["11.  On the PC130-453 card, set switch S1 to the same sideband            that was selected on PC130-452.", "11. On the PC130-453 card, set switch S1 to the same sideband that was selected on PC130-452."], "jumps": ["P13160", "P13140"]}, {"id": "P13160", "text": ["12.  Press enter to set:\n       Transmitter Console                    Receiver Console\n       PC1 DC Power Switch - ON       PC1 DC Power Switch - ON\n       PC2 DC Power Switch - ON       PC2 DC Power Switch - ON\n       PC3 DC Power Switch - ON       PC3 DC Power Switch - ON", "12. Press enter to set: Transmitter Console Receiver Console PC1 DC Power Switch - ON PC1 DC Power Switch - ON PC2 DC Power Switch - ON PC2 DC Power Switch - ON PC3 DC Power Switch - ON PC3 DC Power Switch - ON"], "jumps": ["P13140"]}, {"id": "P13180", "text": ["13.  Press enter to set: Receiver Speaker Power Switch - ON", "13. Press enter to set: Receiver Speaker Power Switch - ONN..............."], "jumps": []}, {"id": "P13190", "text": ["14.  Adjust the volume control knob on PC130-455 for a                            comfortable listening level. The Nida SSB transmitter and                receiver should now be ready for operation.", "14. Adjust the volume control knob on PC130-455 for a comfortable listening level. The Nida SSB transmitter and receiver should now be ready for operation."], "jumps": ["P13200"]}, {"id": "P13200", "text": ["Procedure:\nPrior to troubleshooting, an assessment of the equipment's operational status should be made.  The checklist below a guideline to assist you to that end.", "Procedure: Prior to troubleshooting, an assessment of the equipment's operational status should be made. The checklist below a guideline to assist you to that end.", "1. The SSB Card set has no visual indicators. However, if audio can be heard coming from the speaker, then the system's power supply is functioning correctly. In fact, if there is an audible tone from either the on-board signal generator or from an external unit, then 90% of the system may be ruled functional. 2. On the PC130-450 Card; with input selector, S2, in the function generator position, exercise S3 while listening for a change in tone. There should be two distinct tones, one at 400 Hz and one at 1 kHz. 3. Switch S2 to the microphone position. Now exercise the microphone with either voice or a whistle. The sound should be reproduced on the 130 Test Console. 4. Return switch S2 to the function generator position. On PC130-452 card, place S1 to the opposite sideband from its present setting. Do the same to S1 on PC130-453. An undistorted tone should still be heard. 5. Because you were able to adjust the volume, the audio section of the system is functioning. 6. On PC130-450, place switch S3 to the EXT (External) position. The tone should not be heard unless TP1, the External Input, is connected to a signal generator."], "jumps": ["P13210", "P13190"]}, {"id": "P13210", "text": ["This checklist has allowed you to verify the serviceability of the SSB system's functions.  In a commercial receiver or transceiver, a much more involved checklist would have to be developed.", "This checklist has allowed you to verify the serviceability of the SSB system's functions. In a commercial receiver or transceiver, a much more involved checklist would have to be developed."], "jumps": ["P13220", "P13200"]}, {"id": "P13220", "text": ["Using the initial assessment checklist, verify the receiver is operating properly.", "1. The SSB Card set has no visual indicators. However, if audio can be heard coming from the speaker, then the system's power supply is functioning correctly. In fact, if there is an audible tone from either the on-board signal generator or from an external unit, then 90% of the system may be ruled functional. 2. On the PC130-450 Card; with input selector, S2, in the function generator position, exercise S3 while listening for a change in tone. There should be two distinct tones, one at 400 Hz and one at 1 kHz. 3. Switch S2 to the microphone position. Now exercise the microphone with either voice or a whistle. The sound should be reproduced on the 130 Test Console. 4. Return switch S2 to the function generator position. On PC130-452 card, place S1 to the opposite sideband from its present setting. Do the same to S1 on PC130-453. An undistorted tone should still be heard. 5. Because you were able to adjust the volume, the audio section of the system is functioning. 6. On PC130-450, place switch S3 to the EXT (External) position. The tone should not be heard unless TP1, the External Input, is connected to a signal generator."], "jumps": ["P13230", "P13200"]}, {"id": "P13230", "text": ["The computer will now insert a fault into the Transmitter.", "The computer will now insert a fault into the Transmitter................. let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
