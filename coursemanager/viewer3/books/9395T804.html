<88<<8;<898<<84;<<<88<;8<88<8<<<<<8<<;8<:<;:<<<<<<<88"], "jumps": []}, {"id": "P100", "text": ["w Observe data communications through the parallel port.................", "w Understand the purpose and usage of I/O circuits. w Understand the operation of the 68000 keyboard. w Understand the operation of the 68000 LCD. w Understand the operation of the serial and parallel ports."], "jumps": []}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer.", "6. Nida Experiment Card PC130 - 468 XXXXXXnt"], "jumps": []}, {"id": "P301", "text": [], "jumps": []}, {"id": "P340", "text": [], "jumps": []}, {"id": "P341", "text": [], "jumps": []}, {"id": "P342", "text": [], "jumps": []}, {"id": "P343", "text": [], "jumps": []}, {"id": "P400", "text": ["Try to imagine using a home computer without a keyboard or even a monitor.  In nearly every case, the computer would be useless.  For this example alone, you can see the need for input/output (I/O) devices.", "Try to imagine using a home computer without a keyboard or even a monitor. In nearly every case, the computer would be useless. For this example alone, you can see the need for input/output (I/O) devices."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["The diagram below illustrates some of the many types of I/O devices that may be connected to a computer.", "Some devices are strictly input devices, while others are only for output.  There are even devices that are used for both input and output.", "I/O devices give us the ability to communicate with the computer and for the computer to communicate with us.", "Some devices are strictly input devices, while others are only for output. There are even devices that are used for both input and output."], "jumps": ["P420", "P400", "P430", "P410", "P440"]}, {"id": "P440", "text": ["Let's begin the lesson on I/O CIRCUITS...................................."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P1001", "text": ["For a microprocessor to be useful it needs some link to the world around it.  Input and output devices provide this link.  As with any computer, the I/O devices you need with the 68000 depends on the applications you are using.", "In this lesson, input, output and input/output devices will be examined.  I/O devices normally connect to the microprocessor in one of two ways, fixed or removable.  The display and keyboard of the 68000 are fixed input and output devices.", "Removable devices connect to a microprocessor through a standardized communications port.  The ports are either serial or parallel in format.  These ports allow many types of devices to interface with the system.", "Input devices allow information to be sent to the microprocessor or, to control it in some fashion.  A keyboard, for example, can be used to select options, program new instructions or make modifications to old programs.", "For a microprocessor to be useful it needs some link to the world around it. Input and output devices provide this link. As with any computer, the I/O devices you need with the 68000 depends on the applications you are using.", "In this lesson, input, output and input/output devices will be examined. I/O devices normally connect to the microprocessor in one of two ways, fixed or removable. The display and keyboard of the 68000 are fixed input and output devices.", "Removable devices connect to a microprocessor through a standardized communications port. The ports are either serial or parallel in format. These ports allow many types of devices to interface with the system.", "Input devices allow information to be sent to the microprocessor or, to control it in some fashion. A keyboard, for example, can be used to select options, program new instructions or make modifications to old programs."], "jumps": ["P1030", "P1001", "P1040", "P1020", "P1050", "P1060"]}, {"id": "P1060", "text": ["Input devices are those that do not perform any output functions to the user or other devices.  On the 68000, the single\"input only\" device is the keyboard.", "Input devices are those that do not perform any output functions to the user or other devices. On the 68000, the single\"input only\" device is the keyboard."], "jumps": ["P1070", "P1050"]}, {"id": "P1070", "text": ["To better understand the operation of an input device, you will look at the actual circuitry used by the 68000 keyboard.  The block diagram below shows the 68000 keyboard and associated circuitry.", "To better understand the operation of an input device, you will look at the actual circuitry used by the 68000 keyboard. The block diagram below shows the 68000 keyboard and associated circuitry."], "jumps": ["P1080", "P1050"]}, {"id": "P1080", "text": ["The keyboard circuitry is grouped into five major sections: control, latch, keyboard matrix, buffer and key decoding circuit. We will first examine the keyboard matrix.", "The keyboard matrix is an arrangement of horizontal and vertical wires with switches connected across them.  The diagram below illustrates the layout of the matrix.", "The keyboard matrix is an arrangement of horizontal and vertical wires with switches connected across them. The diagram below illustrates the layout of the matrix."], "jumps": ["P1090", "P1070", "P1100"]}, {"id": "P1100", "text": ["Pressing any one of the keys connects two wires, one horizontal and one vertical.  Each key has its own unique connection isolating it from the others.  By sending a signal through a horizontal wire, the vertical wires may be looked at to see which key was pressed, if any.", "The horizontal wires connect to an 8 bit latch as shown below. The output of the latch is the last input present when the clock pulse was sensed.", "Pressing any one of the keys connects two wires, one horizontal and one vertical. Each key has its own unique connection isolating it from the others. By sending a signal through a horizontal wire, the vertical wires may be looked at to see which key was pressed, if any.", "2 3 4 5 6 7 8 9 11 1 23 2 26 1 20 22 27"], "jumps": ["P1110", "P1090", "P1120"]}, {"id": "P1120", "text": ["The data bus of the 68000 is used to send and receive signals from the keyboard circuitry.  Since we cannot send and receive at the same time, a latch provides a way of holding a previous set of signals  from the data bus and allow the results of these signals to be processed in turn.", "The data bus of the 68000 is used to send and receive signals from the keyboard circuitry. Since we cannot send and receive at the same time, a latch provides a way of holding a previous set of signals from the data bus and allow the results of these signals to be processed in turn."], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["A program in the microprocessor sets the latch to output all highs to the horizontal lines, except one, which it sets to low. The program then checks to see if that low is present on any of the vertical lines.  If none are found, the horizontal line is then set to high and the next one is set to low.", "A program in the microprocessor sets the latch to output all highs to the horizontal lines, except one, which it sets to low. The program then checks to see if that low is present on any of the vertical lines. If none are found, the horizontal line is then set to high and the next one is set to low."], "jumps": ["P1140", "P1110"]}, {"id": "P1140", "text": ["The process in which each line is set and tested over and over is called polling.  It is important to note that a program in the microprocessor performs many of the steps used in controlling the keyboard, not just the associated circuitry.", "The process in which each line is set and tested over and over is called polling. It is important to note that a program in the microprocessor performs many of the steps used in controlling the keyboard, not just the associated circuitry."], "jumps": ["P1150", "P1110"]}, {"id": "P1150", "text": ["The keyboard of the 68000 microprocessor trainer is made up of what 5 major sections?", "control, latch, buffer, encoder and matrix", "matrix, control, counter, latch and decoder", "control, latch, buffer, decoder and matrix", "decoder, matrix, counter, latch and sensorrr"], "jumps": ["P1110"]}, {"id": "P1151", "text": [], "jumps": []}, {"id": "P1152", "text": ["Signals from the keyboard are coded.", "Signals from the keyboard are coded........................"], "jumps": []}, {"id": "P1153", "text": ["Counters are not used in this circuitry.", "Counters are not used in this circuitry...................."], "jumps": []}, {"id": "P1154", "text": ["Sensors are not used in this circuitry.", "Sensors are not used in this circuitry....................."], "jumps": []}, {"id": "P1160", "text": ["The five vertical lines from the keyboard matrix are connected to the buffer.  These lines are also connected to Vcc through a bank of  resistors as illustrated below.  When none of the keys are pressed, a high is present on each vertical line as a result of their connection to Vcc.", "The five vertical lines from the keyboard matrix are connected to the buffer. These lines are also connected to Vcc through a bank of resistors as illustrated below. When none of the keys are pressed, a high is present on each vertical line as a result of their connection to Vcc.", "18 17 16 15 14 13 12 11 1 23 2 26 1 20 22 27"], "jumps": ["P1170", "P1150"]}, {"id": "P1170", "text": ["If a key is pressed on a row where the horizontal line is high, then a high will be connected to the associated vertical line and to the buffer.  This condition would cause the microprocessor not to be able to recognize the keystroke.", "If a key is pressed on a row where the horizontal line is high, then a high will be connected to the associated vertical line and to the buffer. This condition would cause the microprocessor not to be able to recognize the keystroke."], "jumps": ["P1180", "P1160"]}, {"id": "P1180", "text": ["Pressing a key on a row where the horizontal line is low, will connect the low to the bottom of the resistor and to the buffer. The resistor must to be large enough to allow all of Vcc to be dropped without causing damage.  If too small a resistor is used, Vcc is tied to ground which will damage the power supply.", "The low condition indicates to the processor that a key is pressed.  The polling process described earlier occurs roughly 40 times per second.  When you press a key, the microprocessor will be notified many times.  To keep the processor from thinking that the key has been pressed many times, the decoder is used.", "Pressing a key on a row where the horizontal line is low, will connect the low to the bottom of the resistor and to the buffer. The resistor must to be large enough to allow all of Vcc to be dropped without causing damage. If too small a resistor is used, Vcc is tied to ground which will damage the power supply.", "The low condition indicates to the processor that a key is pressed. The polling process described earlier occurs roughly 40 times per second. When you press a key, the microprocessor will be notified many times. To keep the processor from thinking that the key has been pressed many times, the decoder is used."], "jumps": ["P1190", "P1160", "P1200"]}, {"id": "P1200", "text": ["The key decoding circuit shown below, allows the microprocessor to register the key you've pressed, once. While the key is being held down, it doesn't allow the associated circuits to reset. All of the components of the decoding circuit are contained within an IC called a PAL (programmable array logic)."], "jumps": ["P1210", "P1190"]}, {"id": "P1210", "text": ["This IC may be programmed to represent many different logic circuits in a multitude of ways.  The benefit of using this IC is the size advantage.  If individual ICs were used for the logic components in the PAL, it would take up a circuit card by itself.", "The last component of the keyboard circuitry is the control section.  This circuit is regulated by the microprocessor and controls all sections of the keyboard circuit.  There are four inputs to the control circuit as shown below.", "This IC may be programmed to represent many different logic circuits in a multitude of ways. The benefit of using this IC is the size advantage. If individual ICs were used for the logic components in the PAL, it would take up a circuit card by itself.", "The last component of the keyboard circuitry is the control section. This circuit is regulated by the microprocessor and controls all sections of the keyboard circuit. There are four inputs to the control circuit as shown below."], "jumps": ["P1220", "P1190", "P1230"]}, {"id": "P1230", "text": ["These four inputs provide all the information needed for the circuit to be active, inactive, reading, writing, etc.  The output from the chip select circuitry is connected to the keyboard control circuit.  This way, only the keyboard will be active when the processor is reading or writing data to it.", "These four inputs provide all the information needed for the circuit to be active, inactive, reading, writing, etc. The output from the chip select circuitry is connected to the keyboard control circuit. This way, only the keyboard will be active when the processor is reading or writing data to it."], "jumps": ["P1240", "P1220"]}, {"id": "P1240", "text": ["As you can see, even one simple input device requires a lot of associated circuitry.  If the keyboard consisted of only one key, it would probably be connected directly to the microprocessor, and that would be the entire circuit.  Now let's look at an output device.", "As you can see, even one simple input device requires a lot of associated circuitry. If the keyboard consisted of only one key, it would probably be connected directly to the microprocessor, and that would be the entire circuit. Now let's look at an output device."], "jumps": ["P1250", "P1220"]}, {"id": "P1250", "text": ["While input devices allow us to put information into a microprocessor system, output devices enable us to see or receive some sort of feedback from the processor about operation, data or performance.  Monitors and printers are examples of output devices.", "While input devices allow us to put information into a microprocessor system, output devices enable us to see or receive some sort of feedback from the processor about operation, data or performance. Monitors and printers are examples of output devices."], "jumps": ["P1260", "P1240"]}, {"id": "P1260", "text": ["The NIDA 68000 system uses an LCD in place of a monitor.  LCD is an acronym for Liquid Crystal Display.  LCDs have an actual liquid crystal in between two pieces of glass or plastic.", "The NIDA 68000 system uses an LCD in place of a monitor. LCD is an acronym for Liquid Crystal Display. LCDs have an actual liquid crystal in between two pieces of glass or plastic."], "jumps": ["P1270", "P1250"]}, {"id": "P1270", "text": ["Transparent conductive materials are used to apply voltage to the liquid crystal.  With voltage applied, the crystals scatter and do not allow light to pass through the glass.  The back plate of glass or plastic has a reflective surface which directs light backwards through the glass illuminating the characters.", "Transparent conductive materials are used to apply voltage to the liquid crystal. With voltage applied, the crystals scatter and do not allow light to pass through the glass. The back plate of glass or plastic has a reflective surface which directs light backwards through the glass illuminating the characters."], "jumps": ["P1280", "P1260"]}, {"id": "P1280", "text": ["The LCD unit, like the one used on the PC130-404 card, has fourteen pins interfacing the LCD with the 68000 processor system.  The illustration below shows the inputs of the LCD.", "The LCD unit, like the one used on the PC130-404 card, has fourteen pins interfacing the LCD with the 68000 processor system. The illustration below shows the inputs of the LCD."], "jumps": ["P1290", "P1260"]}, {"id": "P1290", "text": ["Vss and Vdd are used as power to the module.  The capacitor between them protects the circuit from voltage spikes.  Vcc is used for the intensity of the display.  One side is connected to a potentiometer and 5 volts while the other side is connected to ground.  Adjusting the pot, varies the intensity of the display.", "Vss and Vdd are used as power to the module. The capacitor between them protects the circuit from voltage spikes. Vcc is used for the intensity of the display. One side is connected to a potentiometer and 5 volts while the other side is connected to ground. Adjusting the pot, varies the intensity of the display."], "jumps": ["P1300", "P1260"]}, {"id": "P1300", "text": ["The next three connections are control lines.  The control lines are the RS (Register Select), R/W (Read/Write NOT) and the E (Enable) pins.", "The next three connections are control lines. The control lines are the RS (Register Select), R/W (Read/Write NOT) and the E (Enable) pins."], "jumps": ["P1310", "P1260"]}, {"id": "P1310", "text": ["The R/S line is actually address line A1, as indicated on the PC130-404 schematic.  When this line is high, the display unit is writing to the memory in the unit.  When it's low, it is writing to the control section.", "The R/S line is actually address line A1, as indicated on the PC130-404 schematic. When this line is high, the display unit is writing to the memory in the unit. When it's low, it is writing to the control section."], "jumps": ["P1320", "P1260"]}, {"id": "P1320", "text": ["The R/W and Enable lines both work exactly the same way as other R/W and Enable lines that you've been introduced to in your study of the 68000."], "jumps": ["P1330", "P1260"]}, {"id": "P1330", "text": ["The last seven lines of the display module are data lines and are used to input information to the display.", "Some I/O devices are not limited to either input or output operations, but instead, perform both functions.  A modem can either transmit or receive information.  Modems and any other external I/O devices must have some way to interface with the CPU.  This is accomplished through the serial and parallel ports.", "Some I/O devices are not limited to either input or output operations, but instead, perform both functions. A modem can either transmit or receive information. Modems and any other external I/O devices must have some way to interface with the CPU. This is accomplished through the serial and parallel ports."], "jumps": ["P1340", "P1260", "P1350"]}, {"id": "P1350", "text": ["Ports are nothing more than connectors for the external devices. An I/O port allows you to connect a printer, scanner, modem, etc. to the microprocessor system and, through some form of standardized protocol, communicate either serially or in parallel."], "jumps": ["P1360", "P1340"]}, {"id": "P1360", "text": ["\"Serial\" and \"parallel\" describe the type of communication that is occurring.  Serial requires, at a minimum, 3 communication lines: Send, Receive and Ground.  Serial indicates that, at any given moment, only one data bit can be sent or received.  With so few lines, serial is well adapted for telephone communications.", "\"Serial\" and \"parallel\" describe the type of communication that is occurring. Serial requires, at a minimum, 3 communication lines: Send, Receive and Ground. Serial indicates that, at any given moment, only one data bit can be sent or received. With so few lines, serial is well adapted for telephone communications."], "jumps": ["P1370", "P1340"]}, {"id": "P1370", "text": ["Parallel communications (used mostly with printers) is the sending or receiving of many bits at one time.  Normally, 8 bits are sent, each bit on its own line.  The parallel port is much faster than the serial port, but cable lengths are far more restricted in parallel.", "Parallel communications (used mostly with printers) is the sending or receiving of many bits at one time. Normally, 8 bits are sent, each bit on its own line. The parallel port is much faster than the serial port, but cable lengths are far more restricted in parallel.", "D0 D1 D2 D3 D4 D5 D6 D7 Ground"], "jumps": ["P1380", "P1360"]}, {"id": "P1380", "text": ["Since printers are normally close to the computer, the parallel port is normally used.  There is no need for a long cable.  Most computer systems refer to the parallel port as the printer port or LPT.", "Since printers are normally close to the computer, the parallel port is normally used. There is no need for a long cable. Most computer systems refer to the parallel port as the printer port or LPT."], "jumps": ["P1390", "P1370"]}, {"id": "P1390", "text": ["In some situations, certain devices need the speed of a parallel port but the distance of a serial port.  Special devices called repeaters are used to amplify the signal of the parallel port that allow it to be transmitted further.", "The serial and parallel port diagrams shown earlier are \"bare minimum\" communication ports.  Advanced ports are more complex, but are also far more versatile and dependable.  A pin-out for an advanced serial and parallel port is shown below.", "In some situations, certain devices need the speed of a parallel port but the distance of a serial port. Special devices called repeaters are used to amplify the signal of the parallel port that allow it to be transmitted further.", "The serial and parallel port diagrams shown earlier are \"bare minimum\" communication ports. Advanced ports are more complex, but are also far more versatile and dependable. A pin-out for an advanced serial and parallel port is shown below."], "jumps": ["P1400", "P1370", "P1410", "P1390"]}, {"id": "P1410", "text": ["In this lesson's experiment, we will look at the operation of the parallel port.  It will enable you to observe some of the characteristics that are important regarding I/O operations.", "In this lesson's experiment, we will look at the operation of the parallel port. It will enable you to observe some of the characteristics that are important regarding I/O operations."], "jumps": ["P1910", "P1400"]}, {"id": "P1910", "text": ["This completes the information on I/O CIRCUITS.", "1.  I/O devices give us the ability to communicate with the                     computer and for the computer to communicate with us.", "2.  I/O devices may be: input only, output only or both input and         output.", "This completes the information on I/O CIRCUITS.ITLE........", "1. I/O devices give us the ability to communicate with the computer and for the computer to communicate with us. -", "2. I/O devices may be: input only, output only or both input and output."], "jumps": ["P1410", "P1930", "P1001", "P1940", "P1920", "P"]}, {"id": "P1940", "text": ["3.  The NIDA 68000 keyboard has five major sections: matrix,              decoder, control, buffer and latch.", "4.  Polling is a process whereby the CPU is constantly                           interrogating all the keys of the keyboard to determine if any          have been pressed.", "5.  The purpose of the PAL chip in the 68000 is to decode the               signals from the keyboard.", "3. The NIDA 68000 keyboard has five major sections: matrix, decoder, control, buffer and latch.", "4. Polling is a process whereby the CPU is constantly interrogating all the keys of the keyboard to determine if any have been pressed.", "5. The purpose of the PAL chip in the 68000 is to decode the signals from the keyboard."], "jumps": ["P1950", "P1930", "P1960", "P1940", "P1970"]}, {"id": "P1970", "text": ["6.  Output devices allow us to see or receive feedback from the           microprocessor about operations, data or performance.", "6. Output devices allow us to see or receive feedback from the microprocessor about operations, data or performance."], "jumps": ["P1980", "P1960"]}, {"id": "P1980", "text": ["7.  Serial ports communicate by sending or receiving one bit of           information at a time.", "7. Serial ports communicate by sending or receiving one bit of information at a time."], "jumps": ["P1990", "P1970"]}, {"id": "P1990", "text": ["8.  Parallel ports communicate by sending or receiving many              (normally 8) bits of information at the same time.", "8. Parallel ports communicate by sending or receiving many (normally 8) bits of information at the same time.", "D0 D1 D2 D3 D4 D5 D6 D7 Ground"], "jumps": ["P1999", "P1980"]}, {"id": "P1999", "text": ["You have completed the Summary.\nYou are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu."], "jumps": ["P1990"]}, {"id": "P2001", "text": ["In this experiment you will get a hands-on look at one of the most common I/O ports used, the parallel port.  While parallel ports may differ from machine to machine, their basic operation is the same.", ". The experiment in this lesson is not setup to use the selected trainer.", "In this experiment you will get a hands-on look at one of the most common I/O ports used, the parallel port. While parallel ports may differ from machine to machine, their basic operation is the same."], "jumps": ["P2030", "P2001"]}, {"id": "P2030", "text": ["This experiment has two sections.  The first is writing data to the parallel port and the second is reading the data from the parallel port.", "This experiment has two sections. The first is writing data to the parallel port and the second is reading the data from the parallel port."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2020"]}, {"id": "P2050", "text": ["2.  Set the Positive Supply Control to 5.  The Voltmeter on the               130A should indicate 5 Volts.", "3.  Place the PC130-468 card into the PC1 position, PC130-403             into the PC2 position, PC130-401 into the PC3 position and            the PC130-404 unit in front of the test console.", "2. Set the Positive Supply Control to 5. The Voltmeter on the 130A should indicate 5 Volts.", "3. Place the PC130-468 card into the PC1 position, PC130-403 into the PC2 position, PC130-401 into the PC3 position and the PC130-404 unit in front of the test console."], "jumps": ["P2040", "P2050"]}, {"id": "P2070", "text": ["4.  Using the 50-pin cable, connect PC1 J1 and PC2 J2 together.        Be sure to connect pin 1 of the cable with pin 1 of the circuit           cards by aligning them with the red wire on the cable.", "4. Using the 50-pin cable, connect PC1 J1 and PC2 J2 together. Be sure to connect pin 1 of the cable with pin 1 of the circuit cards by aligning them with the red wire on the cable."], "jumps": ["P2060"]}, {"id": "P2080", "text": ["5.  Using the 20-pin short cable, connect PC2 J2 and PC3 J1                together.  Be sure to connect pin 1 of the cable with pin 1 of           the circuit cards by aligning them with the red wire on the               cable.", "5. Using the 20-pin short cable, connect PC2 J2 and PC3 J1 together. Be sure to connect pin 1 of the cable with pin 1 of the circuit cards by aligning them with the red wire on the cable."], "jumps": ["P2090", "P2060"]}, {"id": "P2090", "text": ["6.  Using the 20-pin long cable, connect PC3 J2 and PC130-404          J1 together.  Be sure to connect pin 1 of the cable with pin 1           of the circuit cards by aligning them with the red wire on the           cable.", "6. Using the 20-pin long cable, connect PC3 J2 and PC130-404 J1 together. Be sure to connect pin 1 of the cable with pin 1 of the circuit cards by aligning them with the red wire on the cable."], "jumps": ["P2100", "P2060"]}, {"id": "P2100", "text": ["7.  Turn PC3 DC Power switch to ON.", "7. Turn PC3 DC Power switch to ON........................................."], "jumps": ["P2060"]}, {"id": "P2102", "text": ["8.  Turn PC2 DC Power switch to ON.", "8. Turn PC2 DC Power switch to ON........................................."], "jumps": ["P2100"]}, {"id": "P2104", "text": ["9.  Turn PC1 DC Power switch to ON.", "The first program that you will enter will demonstrate continuous writing to the parallel port.  It is important to realize that a pause has been added in the program so that the human eye can observe the change in the data.  Without the pause all that could be seen are the LEDs illuminated.", "9. Turn PC1 DC Power switch to ON.........................................", "The first program that you will enter will demonstrate continuous writing to the parallel port. It is important to realize that a pause has been added in the program so that the human eye can observe the change in the data. Without the pause all that could be seen are the LEDs illuminated."], "jumps": ["P2102", "P2120", "P2104"]}, {"id": "P2120", "text": ["The 68000 trainer has a parallel port with three ports: A, B and C.  In this experiment, you will be writing to port A and reading from port B.", "The 68000 trainer has a parallel port with three ports: A, B and C. In this experiment, you will be writing to port A and reading from port B."], "jumps": ["P2130", "P2110"]}, {"id": "P2130", "text": ["10.  Enter the program below as you did in the previous lesson.            If you need assistance in entering the program, call your                 instructor for more details.", "11.  Once you have finished entering the program, press the                   STOP key,  press the RUN key on the 68000 keyboard, enter          the address value \"11000\" and press enter.", "Observe the display of the 68000.  The screen should say \"parallel port\" and the LEDs of the A port should be illuminating in a binary sequence.  If your screen does not indicate this, press reset and check your program.  If the problem still exists, call your instructor.", "10. Enter the program below as you did in the previous lesson. If you need assistance in entering the program, call your instructor for more details. ails.", "4E 40 20 7C 00 01 10 30 4E 4A 22 7C 00 04 00 00 22 3C 00 00 FF FF 12 80 MLOOP: 04 81 00 00 00 01 SLOOP: 66 00 FF F8 22 3C 00 00 FF FF 06 00 00 01 60 00 FF E8 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVEA.L #MS1,A0 TRAP #0AH MOVEA.L #0040000H,A1 MOVE.L #0FFFFH,D1 MOVE.B D0,(A1) SUBI.L #1,D1 BNE SLOOP MOVE.L #0FFFFH,D1 ADDI.B #1,D0 BRA MLOOP DFB \"Parallel\" DFB \"Port\",0 TRAP # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS", "11. Once you have finished entering the program, press the STOP key, press the RUN key on the 68000 keyboard, enter the address value \"11000\" and press enter.", "Observe the display of the 68000. The screen should say \"parallel port\" and the LEDs of the A port should be illuminating in a binary sequence. If your screen does not indicate this, press reset and check your program. If the problem still exists, call your instructor."], "jumps": ["P2140", "P2110", "P2150", "P2130", "P2160"]}, {"id": "P2160", "text": ["The program set the display to the words \"Parallel Port\".  After this was done, one of the address registers is set to the value 40000H.  This value activates port A for writing.  This register is then used to send data to the port.", "The program set the display to the words \"Parallel Port\". After this was done, one of the address registers is set to the value 40000H. This value activates port A for writing. This register is then used to send data to the port.", "4E 40 20 7C 00 00 10 30 4E 4A 22 7C 00 04 00 00 22 3C 00 00 FF FF 12 80 MLOOP: 04 81 00 00 00 01 SLOOP: 66 00 FF F8 22 3C 00 00 FF FF 06 00 00 01 60 00 FF E8 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00000000000000555555555555555555555555", "TRAP #0H MOVEA.L #MS1,A0 TRAP #0AH MOVEA.L #0040000H,A1 MOVE.L #0FFFFH,D1 MOVE.B D0,(A1) SUBI.L #1,D1 BNE SLOOP MOVE.L #0FFFFH,D1 ADDI.B #1,D0 BRA MLOOP DFB \"Parallel\" DFB \"Port\",0 TRAP # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["Every time data is sent to the port, the processor must countdown to 0000H from FFFFH.  Then the value we are sending to the port is incremented to a maximum level of FF.  It then resets back to zero.", "Every time data is sent to the port, the processor must countdown to 0000H from FFFFH. Then the value we are sending to the port is incremented to a maximum level of FF. It then resets back to zero."], "jumps": ["P2180", "P2160"]}, {"id": "P2180", "text": ["The NIDA 68000 trainer has _______ parallel ports?", "The NIDA 68000 trainer has _______ parallel ports?........."], "jumps": ["P2160"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2182", "text": ["We write to parallel port A, read from parallel port B and do not use parallel port C in this experiment.", "The program was a basic example of sending data to a parallel port.  To be more useful, let's send a byte of data to the parallel port and then read it from one of the data registers.  First you will need to wire two of the ports together.", "12.  Using the 8-Pin ribbon cable, connect each line of port A, J3           to port B, J4 as shown below.  Be sure the colors of the                   wires on the ribbon cable match from top to bottom when               connected to the ports.", "The program was a basic example of sending data to a parallel port. To be more useful, let's send a byte of data to the parallel port and then read it from one of the data registers. First you will need to wire two of the ports together.", "12. Using the 8-Pin ribbon cable, connect each line of port A, J3 to port B, J4 as shown below. Be sure the colors of the wires on the ribbon cable match from top to bottom when connected to the ports."], "jumps": ["P2200", "P2180", "P2210", "P2190"]}, {"id": "P2210", "text": ["13.  Enter the programs listed below as you did before.  If you                need assistance in entering the programs, call your                        instructor.", "13. Enter the programs listed below as you did before. If you need assistance in entering the programs, call your instructor.", "22 7C 00 04 00 00 10 3C 00 4E 12 80 4E 75 22 3C 00 00 FF FF 12 80 MLOOP: 04 81 00 00 00 01 SLOOP: 66 00 FF F8 22 3C 00 00 FF FF 06 00 00 01 60 00 FF E8 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 4F 52 54 00 54 0055555555555555555555", "MOVEA.L #40000H,A1 MOVE.B #4EH,D0 MOVE.B D0,(A1) RTS VE.B D0,(A1) SUBI.L #1,D1 BNE SLOOP MOVE.L #0FFFFH,D1 ADDI.B #1,D0 BRA MLOOP DFB \"Parallel\" DFB \"Port\",0 DFB \"Port\",0 t\",0 TRAP # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS", "22 7C 00 04 00 00 42 87 1E 11 4E 75 4E 75 22 3C 00 00 FF FF 12 80 MLOOP: 04 81 00 00 00 01 SLOOP: 66 00 FF F8 22 3C 00 00 FF FF 06 00 00 01 60 00 FF E8 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 4F 52 54 00 54 0055555555555555555555", "MOVEA.L #40000H,A1 CLR.L D7 MOVE.B (A1),D7 RTS TS VE.B D0,(A1) SUBI.L #1,D1 BNE SLOOP MOVE.L #0FFFFH,D1 ADDI.B #1,D0 BRA MLOOP DFB \"Parallel\" DFB \"Port\",0 DFB \"Port\",0 t\",0 TRAP # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS"], "jumps": ["P2220", "P2200"]}, {"id": "P2220", "text": ["Notice the output of Parallel Port A.  If you treat pin 1 as the least significant bit, it is the same as program 2 was sending, 04EH. The same output is present on Parallel Port B.  This is due to the ribbon cable you placed between the two ports.", "14. Now that you have finished entering the programs, press the stop key, press the RUN key on the 68000 keyboard, enter the address value \"11000\" and press ENTER. Observe the display. It should say that the program terminated normally. If there is an error, go back and verify the code that you entered.", "Notice the output of Parallel Port A. If you treat pin 1 as the least significant bit, it is the same as program 2 was sending, 04EH. The same output is present on Parallel Port B. This is due to the ribbon cable you placed between the two ports."], "jumps": ["P2230", "P2210", "P2240"]}, {"id": "P2240", "text": ["15.  Press the STOP key, press the RUN key on the 68000                       keyboard, enter the address value \"11050\" and press                       ENTER.  The display should indicate that the program                      terminated normally.  If it did not, verify the code that you                 entered. If the code is correct, call your instructor.", "15. Press the STOP key, press the RUN key on the 68000 keyboard, enter the address value \"11050\" and press ENTER. The display should indicate that the program terminated normally. If it did not, verify the code that you entered. If the code is correct, call your instructor."], "jumps": ["P2250", "P2230"]}, {"id": "P2250", "text": ["The program you just ran set an address register to the value \"40002H\".  This address value caused the parallel port to read the information on port B.  The program, using this address, sent the data on port B to data register D7.", "16.  Press the DISPLAY R.M. key and select \"1\".  Now press the            down arrow until D7 is visible.  The contents of D7 should be         0000004E.  If it is not, verify the code that you entered.  If the           code is correct, call your instructor.", "Working with I/O ports of a microprocessor is very simple if the system is set up properly.  As you saw, it took only a few lines of code to communicate with the port.", "The program you just ran set an address register to the value \"40002H\". This address value caused the parallel port to read the information on port B. The program, using this address, sent the data on port B to data register D7.", "22 7C 00 04 00 00 42 87 1E 11 4E 75 4E 75 22 3C 00 00 FF FF 12 80 MLOOP: 04 81 00 00 00 01 SLOOP: 66 00 FF F8 22 3C 00 00 FF FF 06 00 00 01 60 00 FF E8 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 4F 52 54 00 54 0055555555555555555555", "MOVEA.L #40000H,A1 CLR.L D7 MOVE.B (A1),D7 RTS TS VE.B D0,(A1) SUBI.L #1,D1 BNE SLOOP MOVE.L #0FFFFH,D1 ADDI.B #1,D0 BRA MLOOP DFB \"Parallel\" DFB \"Port\",0 DFB \"Port\",0 t\",0 TRAP # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS", "22 7C 00 04 00 00 10 3C 00 4E 12 80 4E 75 22 3C 00 00 FF FF 12 80 MLOOP: 04 81 00 00 00 01 SLOOP: 66 00 FF F8 22 3C 00 00 FF FF 06 00 00 01 60 00 FF E8 50 61 72 61 6C 6C 65 6C MS1: 50 4F 52 54 00 4F 52 54 00 54 0055555555555555555555", "MOVEA.L #40000H,A1 MOVE.B #4EH,D0 MOVE.B D0,(A1) RTS VE.B D0,(A1) SUBI.L #1,D1 BNE SLOOP MOVE.L #0FFFFH,D1 ADDI.B #1,D0 BRA MLOOP DFB \"Parallel\" DFB \"Port\",0 DFB \"Port\",0 t\",0 TRAP # DSPLYLONG TRAP # READKEYW TRAP RTSP RTSRTSTS", "16. Press the DISPLAY R.M. key and select \"1\". Now press the down arrow until D7 is visible. The contents of D7 should be 0000004E. If it is not, verify the code that you entered. If the code is correct, call your instructor.", "Working with I/O ports of a microprocessor is very simple if the system is set up properly. As you saw, it took only a few lines of code to communicate with the port."], "jumps": ["P2260", "P2240", "P2270", "P2250", "P2280"]}, {"id": "P2280", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P2270"]}, {"id": "P2290", "text": ["2.  Set the Console Power Switch to OFF.", "2. Set the Console Power Switch to OFF...................."], "jumps": ["P2280"]}, {"id": "P2300", "text": ["3.  Remove all cards and return all equipment to its appropriate          storage location.", "3. Remove all cards and return all equipment to its appropriate storage location."], "jumps": ["P2910", "P2290"]}, {"id": "P2910", "text": ["This completes the experiment on I/O CIRCUITS.", "This completes the experiment on I/O CIRCUITS.TITLE........"], "jumps": ["P2300"]}, {"id": "P10001", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Assessment\", 2, \"P10301\", \"P10302\", \"P1030 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
