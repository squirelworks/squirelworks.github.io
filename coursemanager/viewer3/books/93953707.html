const book = {"title": "93953707", "pages": [{"id": "P0", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ."], "jumps": []}, {"id": "P1", "text": ["Nida Corporation 2003 - 2004 This software and its supporting programs are protected by federal copyright law and all rights are reserved by Nida Corporation. No part or section of this software or its supporting programs may be copied, distributed, transmitted in any form or medium electronic or otherwise, disclosed to third parties, or used in any manner not specified in the License Agreement furnished by Nida Corporation. This courseware was created with Asymetrix ToolBook I I ..", "Title: TRIACS, DIACS AND FOUR-LAYER DIODESsdf asdf sadf"], "jumps": []}, {"id": "P1060", "text": ["In this example 3/4ths of the current has been removed.  This shows that power has been reduced to 25%.  This removing of more than 50% is performed with diodes and an RC circuit.", "In this example 3/4ths of the current has been removed. This shows that power has been reduced to 25%. This removing of more than 50% is performed with diodes and an RC circuit."], "jumps": ["P1070", "P1050"]}, {"id": "P1040", "text": ["The SCR does not allow current to flow from anode to cathode no matter what voltage is applied to the trigger.  SCR's used to deliver power do not use the negative portion of the AC signal.", "The SCR does not allow current to flow from anode to cathode no matter what voltage is applied to the trigger. SCR's used to deliver power do not use the negative portion of the AC signal.", "w Describe the relationship between Triacs and SCRs. w Recognize Triac circuit operation based on input conditions. w Describe the relationship between Diacs and Four- Layer Diodes. w Explain the beneficial use of a Diac with a Triac."], "jumps": ["P1050", "P1030"]}, {"id": "P300", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": ["P330"]}, {"id": "P330", "text": [], "jumps": []}, {"id": "P400", "text": ["In this lesson we are going to discuss Triacs, Diacs, and Four-Layer Diodes.  These components may seem complex, but you will see they are simple combinations of different circuit components.", "In this lesson we are going to discuss Triacs, Diacs, and Four-Layer Diodes. These components may seem complex, but you will see they are simple combinations of different circuit components."], "jumps": ["P410", "P300"]}, {"id": "P410", "text": ["You may be asking yourself, where are these components used and what do they do?  Triacs, like SCRs, are mainly used for power control in circuits instead of simple resistance devices. Triacs and SCRs produce much less heat than simple resistive devices.", "You may be asking yourself, where are these components used and what do they do? Triacs, like SCRs, are mainly used for power control in circuits instead of simple resistance devices. Triacs and SCRs produce much less heat than simple resistive devices.."], "jumps": ["P420", "P400"]}, {"id": "P420", "text": ["Diacs and Four-Layer Diodes are used as trigger devices to SCRs and Triacs.  Not only do they provide better trigger control, they also provide protection for the trigger circuit.  In the first section of  this lesson we will explore the use of these components and their use in circuits.", "Diacs and Four-Layer Diodes are used as trigger devices to SCRs and Triacs. Not only do they provide better trigger control, they also provide protection for the trigger circuit. In the first section of this lesson we will explore the use of these components and their use in circuits."], "jumps": ["P430", "P410"]}, {"id": "P430", "text": ["In the second section of this lesson we will experimentally observe a basic Triac circuit while varying different circuit conditions.  By observing the Triac operation you will be able to understand the operation of all three devices.", "In the second section of this lesson we will experimentally observe a basic Triac circuit while varying different circuit conditions. By observing the Triac operation you will be able to understand the operation of all three devices.."], "jumps": ["P420"]}, {"id": "P440", "text": ["Let's begin the lesson on TRIACS, DIACS AND FOUR-LAYER DIODES..............."], "jumps": ["P430"]}, {"id": "P900", "text": [], "jumps": []}, {"id": "P13030", "text": ["S1 selects whether or not we will be using AC or DC voltage. When set to the AC position, C1 becomes part of the circuit.  The capacitor is used when creating the trigger signal using AC voltage.", "S1 selects whether or not we will be using AC or DC voltage. When set to the AC position, C1 becomes part of the circuit. The capacitor is used when creating the trigger signal using AC voltage.."], "jumps": ["P13040", "P13020"]}, {"id": "P13060", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P13020"]}, {"id": "P1030", "text": ["Let's see what we know about the SCR. It doesn't let current flow from cathode to anode unless the gate has been triggered.  Once the gate has been triggered, the SCR will continue to allow current flow from cathode to anode until the voltage across the cathode and anode drops below a certain value.", "Let's see what we know about the SCR. It doesn't let current flow from cathode to anode unless the gate has been triggered. Once the gate has been triggered, the SCR will continue to allow current flow from cathode to anode until the voltage across the cathode and anode drops below a certain value.."], "jumps": ["P1020", "P1040"]}, {"id": "P1050", "text": ["These circuits are called Half-Wave SCR Phase Shifters.  In the example below, half of the input current has been removed.  This shows that power has been reduced to 50%.", "These circuits are called Half-Wave SCR Phase Shifters. In the example below, half of the input current has been removed. This shows that power has been reduced to 50%."], "jumps": ["P1060", "P1030"]}, {"id": "P1080", "text": ["Triac's can be used to reduce a larger power range.  Since the Triac is made of two SCRs with anodes connected to cathodes, it operates during both alternations of the sine wave.  This allows power to be from 100% to 0% of the input power.", "Triac's can be used to reduce a larger power range. Since the Triac is made of two SCRs with anodes connected to cathodes, it operates during both alternations of the sine wave. This allows power to be from 100% to 0% of the input power."], "jumps": ["P1090", "P1070"]}, {"id": "P1070", "text": ["You can see from these two examples how power can be reduced through a Half-Wave SCR Phase Shifter.  The important factor to realize is the limitation of the power reduction.  A single SCR can reduce the input power to 50%.  The input power can be adjusted from half of the input power to 0.", "You can see from these two examples how power can be reduced through a Half-Wave SCR Phase Shifter. The important factor to realize is the limitation of the power reduction. A single SCR can reduce the input power to 50%. The input power can be adjusted from half of the input power to 0."], "jumps": ["P1080", "P1050"]}, {"id": "P1092", "text": ["Remember, one of the limiting characteristics of the Half-Wave SCR Phase Shifter is it's range of power reduction.  It can reduce input power from 50% to 0% of the input power.", "Remember, one of the limiting characteristics of the Half-Wave SCR Phase Shifter is it's range of power reduction. It can reduce input power from 50% to 0% of the input power."], "jumps": []}, {"id": "P1091", "text": [], "jumps": []}, {"id": "P13170", "text": ["10.  Slowly adjust R2 CW while observing both the oscilloscope          and the multimeter.  Stop adjusting R2 when the voltage on            CH2 drops to near 1 V.", "10. Slowly adjust R2 CW while observing both the oscilloscope and the multimeter. Stop adjusting R2 when the voltage on CH2 drops to near 1 V.."], "jumps": ["P13180", "P13150"]}, {"id": "P1090", "text": ["Which type of Phase Shifter can reduce the supplied AC voltage to 85% of the initial power level?"], "jumps": ["P1070"]}, {"id": "P1100", "text": ["Triacs are also used in other circuit configurations.  Triacs are used as switches, especially as high current ON-OFF switches.", "Triacs are also used in other circuit configurations. Triacs are used as switches, especially as high current ON-OFF switches."], "jumps": ["P1110", "P1090"]}, {"id": "P1110", "text": ["If a standard mechanical switch was used high current would jump between the contacts of the switch damaging them.  By using a Triac, a small reasonable voltage level can be applied with a mechanical switch to the gate to open the high level current path.", "If a standard mechanical switch was used high current would jump between the contacts of the switch damaging them. By using a Triac, a small reasonable voltage level can be applied with a mechanical switch to the gate to open the high level current path........"], "jumps": ["P1120", "P1100"]}, {"id": "P1120", "text": ["As you can see, there are many beneficial uses for the Triac. Now let's look at the use of a Diac and Four-Layer Diode.  A Four-Layer Diode is an SCR with the gate attached internally.  When the input voltage has reached a certain level, the Four-Layer Diode will begin to conduct.", "As you can see, there are many beneficial uses for the Triac. Now let's look at the use of a Diac and Four-Layer Diode. A Four-Layer Diode is an SCR with the gate attached internally. When the input voltage has reached a certain level, the Four-Layer Diode will begin to conduct.", "Input Voltagettttttttttttttttttttttttttttttttttt", "4 - Layer Diodettttttttttttttttttttttttttttttttttt", "Output Currenttttttttttttttttttttttttttttttttt"], "jumps": ["P1130", "P1110"]}, {"id": "P1130", "text": ["The Four-layer diode will then continue to conduct until the input voltage falls below a certain level.  Just like the similarity between the SCR and the Triac, the Diac is two Four-layer diodes connected in reverse.", "The Four-layer diode will then continue to conduct until the input voltage falls below a certain level. Just like the similarity between the SCR and the Triac, the Diac is two Four-layer diodes connected in reverse.."], "jumps": ["P1140", "P1120"]}, {"id": "P1140", "text": ["A Four-Layer Diode is normally used with SCRs since conduction is only required during one alternation, the Diac is used with Triacs.  The main purpose of these devices is to limit the input current to the gate until a certain level has been reached.", "A Four-Layer Diode is normally used with SCRs since conduction is only required during one alternation, the Diac is used with Triacs. The main purpose of these devices is to limit the input current to the gate until a certain level has been reached..", "4 - Layer Diode & SCRtttttttttttttttttttttt", "Diac & TriacRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRtttttttttt"], "jumps": ["P1150", "P1130"]}, {"id": "P1150", "text": ["Since power reducing circuits are normally connected directly to a power source, Diacs and Four-Layer Diodes provide protection to the circuit.  As you can see, Triacs, Diacs and Four-Layer Diodes are made of SCRs.", "Since power reducing circuits are normally connected directly to a power source, Diacs and Four-Layer Diodes provide protection to the circuit. As you can see, Triacs, Diacs and Four-Layer Diodes are made of SCRs..", "4 - Layer DiodecccccRRRRRRRRRRRRRRRRRRRRRRRRRtttttttttt"], "jumps": ["P1160", "P1140"]}, {"id": "P1160", "text": ["SCRs are built from transistors, Diacs and Triacs are built from SCRs.  By looking at the operation of the basic devices, complex devices are easier to understand.", "SCRs are built from transistors, Diacs and Triacs are built from SCRs. By looking at the operation of the basic devices, complex devices are easier to understand."], "jumps": ["P1170", "P1150"]}, {"id": "P1172", "text": ["Two SCRs connected in reverse with their gates connected would be a Triac, not a Four-Layer Diode.", "4 - Layer DiodecccccRRRRRRRRRRRRRRRRRRRRRRRRRtttttttttt"], "jumps": []}, {"id": "P1170", "text": ["A Four-Layer Diode is _______", "A Four-Layer Diode is _______yped..........................", "two SCRs connected in reverse with their gates connected.", "one SCR with its gate connected internally."], "jumps": ["P1160"]}, {"id": "P13050", "text": ["Now that you know the basic components of our Triac circuit, let's begin the experiment."], "jumps": ["P13060", "P13020"]}, {"id": "P1173", "text": ["Two Diacs connected in the same way would not give you a four-layer diode.  A Diac is two Four-layer diodes connected in reverse.", "Two Diacs connected in the same way would not give you a four-layer diode. A Diac is two Four-layer diodes connected in reverse.", "4 - Layer DiodecccccRRRRRRRRRRRRRRRRRRRRRRRRRtttttttttt"], "jumps": []}, {"id": "P1171", "text": [], "jumps": []}, {"id": "P1910", "text": ["This completes the information on TRIACS, DIACS & FOUR-LAYER DIODES."], "jumps": ["P1001", "P1170"]}, {"id": "P1920", "text": ["1.  A Triac is two SCRs connected together in reverse with their         gates connected together.", "1. A Triac is two SCRs connected together in reverse with their gates connected together."], "jumps": ["P1930", "P1001"]}, {"id": "P1930", "text": ["2.  A basic Full-Wave Triac Phase Shifter circuit can be used to           reduce power from 100% to 0% of the input power.", "2. A basic Full-Wave Triac Phase Shifter circuit can be used to reduce power from 100% to 0% of the input power."], "jumps": ["P1940", "P1920"]}, {"id": "P1940", "text": ["3.  Triacs are also used in different switch applications. The                 example circuit below is for high current switching.", "3. Triacs are also used in different switch applications. The example circuit below is for high current switching."], "jumps": ["P1950", "P1930"]}, {"id": "P1950", "text": ["4.  Diacs and Four-Layer Diodes are used as triggering devices,         and act as protection devices.  The Diac is used with the Triac       and the Four-Layer Diode is used with an SCR.", "4. Diacs and Four-Layer Diodes are used as triggering devices, and act as protection devices. The Diac is used with the Triac and the Four-Layer Diode is used with an SCR..", "4 - Layer Diode & SCRtttttttttttttttttttttt", "Diac & TriacRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRtttttttttt"], "jumps": ["P1999", "P1940"]}, {"id": "P1999", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": ["P1001", "P1950"]}, {"id": "P1001", "text": ["You have completed the Summary.  You are about to return to the Objective Menu.", "You have completed the Summary. You are about to return to the Objective Menu.u."], "jumps": []}, {"id": "P2001", "text": [". The experiment in this lesson is not setup to use the selected trainer."], "jumps": []}, {"id": "P2020", "text": ["In this experiment, we are going to observe the effects of both AC and DC voltages applied to a Triac.  Look at the PC130-88 card. Locate both LEDs on the circuit card.  These LEDs will indicate the direction of current flow through the Triac.", "In this experiment, we are going to observe the effects of both AC and DC voltages applied to a Triac. Look at the PC130-88 card. Locate both LEDs on the circuit card. These LEDs will indicate the direction of current flow through the Triac."], "jumps": []}, {"id": "P2030", "text": ["S1 selects whether or not we will be using AC or DC voltage. When set to the AC position, C1 becomes part of the circuit.  The capacitor is used when creating the trigger signal using AC voltage.", "S1 selects whether or not we will be using AC or DC voltage. When set to the AC position, C1 becomes part of the circuit. The capacitor is used when creating the trigger signal using AC voltage.."], "jumps": ["P2040", "P2020"]}, {"id": "P2040", "text": ["When in the DC mode of operation, S2 will select between positive or negative DC voltage.  For both AC and DC, R1 adjusts the total current through the circuit, R2 adjusts the trigger input, S4 is used to disconnect the gate trigger signal, and S3 allows you to insert an ammeter into the circuit.", "When in the DC mode of operation, S2 will select between positive or negative DC voltage. For both AC and DC, R1 adjusts the total current through the circuit, R2 adjusts the trigger input, S4 is used to disconnect the gate trigger signal, and S3 allows you to insert an ammeter into the circuit.."], "jumps": ["P2050", "P2020"]}, {"id": "P2050", "text": ["Now that you know the basic components of our Triac circuit, let's begin the experiment."], "jumps": ["P2060", "P2020"]}, {"id": "P2060", "text": ["1.  Set the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings.........."], "jumps": ["P2020"]}, {"id": "P2070", "text": ["2.  Insert PC130-88 into the PC2 position.  Set the card as follows.", "2. Insert PC130-88 into the PC2 position. Set the card as follows..N. 8. Set the PC2 AC switch to ON. 9. Set the PC3 Speaker switch to ON.........................................", "S1 - DC S2 - +DC S3 - OUT S4 - Right R1 - Fully CW R2 - Fully CCW"], "jumps": ["P2060", "P2075"]}, {"id": "P2075", "text": ["MEASUREMENT SETUP - S1 - DC S4 - Right S2 - +DC R1 - Fully CW S3 - OUT R2 - Fully CCW"], "jumps": []}, {"id": "P2080", "text": ["3.  S e between TP2 and TP3.."], "jumps": ["P2140", "P2130", "P2136"]}, {"id": "P2136", "text": [], "jumps": []}, {"id": "P2140", "text": ["Observe the Multimeter.\nWhat is the voltage measured across the Triac between TP2 and TP3?", "Observe the Multimeter. What is the voltage measured across the Triac between TP2 and TP3?????????"], "jumps": ["P2135"]}, {"id": "P2141", "text": [], "jumps": []}, {"id": "P2142", "text": ["You should have measured the same voltage level we obtained using the oscilloscope."], "jumps": []}, {"id": "P2150", "text": ["The next step in our circuit analysis is to increase the voltage applied to the gate (trigger) while observing certain circuit conditions.", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17;UT9;EK;,=17=9EK;AaTs a7(aEAEas5:9<5", "mzF(tt-FsFF-cmzssttst|t--yTmVstys|tytts sm t syst", ";EaTTy55F }Aaas= yjm;AEEAA T_}zc(GGFGVVVccVcVVlllGLVs-FFccclFm--jz5(-VFzmmm(ctmmlmzzzFFFFFzmmmctmFmsmmtcVmt5mzzl-zFmmFmtz", "KT[Qa9mFKKaa 5TL:EAa95 |9/:}EAEAALA_l>lz(lllFmV-V/czzFzFz/cVmcc--F(GlzFVllWmzzm(mzm(FzmpcF(zmFlzFmmlz-llplcmV-z-mcjsFV`zltmlzFVz-tVczFFtcmVmzlFz(mmzFmzFzmFl/VtmtVFmzmVcmmsVccFtsmmmmFFysGsV", "}9}AAK,,KKK/>V;U9a;EE;KTfV=:lFE;AaTTssc AA :: :9W5EAEEA-Es.>i?fodfi..r.l`(zlVclmlFzljlm", "K,EKK71CA;TU9;EKK:/H:ajlEaaaTa :G Eaa9sya9W", "iid>?>>viijVjcFGfmsG5ssTy|ymssmV5|Hsy5ysTTVsytmmV|t=sm55ms5VLmsH5sGc5m5m=VmmVmmmGmtymmls5j5mmmFV5spcmmmmV5mtt5Gmmmltsmmlmsmy5T5mssQtysFssmmmsmmtsmtsymmtss myy|s5|T5|ystsHa|s|", ",K,KK,,E,,E',EK'5@P=;''aaaT55 5GT;aA9AAOA;AA;AA:;Aa'", "aA 999a9=9}A:aa9=9aA 59O9a::A T:T:a: a=: } - aaaT :AA55:9:aa=Ta A::a aaa=:}AA } A"], "jumps": []}, {"id": "P2160", "text": ["9.  Set S3 to IN.  Notice on the oscilloscope that the voltage on            CH2 decreased to 0 volts.  By opening S3 we have opened the      circuit.", "9. Set S3 to IN. Notice on the oscilloscope that the voltage on CH2 decreased to 0 volts. By opening S3 we have opened the circuit..."], "jumps": ["P2162", "P2150"]}, {"id": "P2190", "text": ["Set both channeYou should have also noticed that when the DC level on CH1 TP4 reached 0.7V the voltage on CH2 TP2 dropped below 1V. This is the trigger level for the Triac.  When 0.7V was applied to the input the Triac allowed current to flow through it.", "Set both channeYou should have also noticed that when the DC level on CH1 TP4 reached 0.7V the voltage on CH2 TP2 dropped below 1V. This is the trigger level for the Triac. When 0.7V was applied to the input the Triac allowed current to flow through it.", "Set the oscilloscope CH1 and CH2 Volt/Div controls to .5 Volt. You'll see the DC level on CH1 / TP4 is 0.7V, the trigger level for the Triac. Also note the voltage on CH2 TP2 dropped below 1V as the triggered Triac is operating as a closed switch allowing current to flow through it..................................................................................."], "jumps": ["P2200", "P2180"]}, {"id": "P2163", "text": ["Notice that the voltage at TP2 as displayed by CH2 is now 10V. By connecting the multimeter to TP1 and TP2 you have removed the open created when S3 was switched to IN."], "jumps": ["P2164", "P2150"]}, {"id": "P2164", "text": ["We now have a current meter in our circuit and can observe the amount of current flowing through the Triac.  Notice the current value is zero mA.  DON'T disconnect the meter until instructed.", "We now have a current meter in our circuit and can observe the amount of current flowing through the Triac. Notice the current value is zero mA. DON'T disconnect the meter until instructed........."], "jumps": ["P2170", "P2150"]}, {"id": "P2170", "text": ["11.  Slowly adjust R2 CW while observing both the oscilloscope          and the multimeter.  Stop adjusting R2 when the voltage on            CH2 drops to near 1 V.", "11. Slowly adjust R2 CW while observing both the oscilloscope and the multimeter. Stop adjusting R2 when the voltage on CH2 drops to near 1 V......"], "jumps": ["P2180", "P2150"]}, {"id": "P2180", "text": ["When the voltage on CH2 dropped, did the current on the multimeter increase and the green diode illuminate?"], "jumps": ["P2170"]}, {"id": "P2181", "text": [], "jumps": []}, {"id": "P2200", "text": ["CH2 is at 0.7V.  This is the bias voltage necessary to keep the Triac conducting.  Since the Triac is now acting like a closed switch, all of the voltage is flowing through it, minus a small voltage drop across the Triac of 0.4 V.", "CH2 is at 0.7V. This is the bias voltage necessary to keep the Triac conducting. Since the Triac is now acting like a closed switch, all of the voltage is flowing through it, minus a small voltage drop across the Triac of 0.4 V."], "jumps": ["P2210", "P2190"]}, {"id": "P13212", "text": ["Remember, a Triac is two SCRs configured in opposing directions with a common gate.  Once an SCR has been triggered it will continue to allow current flow until the current  flow on the forward biased SCR falls below the bias level even if the trigger voltage at the gate is removed.", "You should have also noticed that when the DC level on CH1 TP4 reached 0.7V the voltage on CH2 TP2 dropped below 1V. This is the trigger level for the Triac.  When 0.7V was applied to the input the Triac allowed current to flow through it.", "Remember, a Triac is two SCRs configured in opposing directions with a common gate. Once an SCR has been triggered it will continue to allow current flow until the current flow on the forward biased SCR falls below the bias level even if the trigger voltage at the gate is removed.", "You should have also noticed that when the DC level on CH1 TP4 reached 0.7V the voltage on CH2 TP2 dropped below 1V. This is the trigger level for the Triac. When 0.7V was applied to the input the Triac allowed current to flow through it..", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", " e is flowing through it, minus a small voltage drop across the Triac of 0.4 V."], "jumps": ["P13210", "P13190"]}, {"id": "P14280", "text": ["14.  Set S2 to -DC and reverse the multimeter leads at TP1 and \n       TP2.  You'll next view negative DC voltages with the\n       oscilloscope.", "14. Set S2 to -DC and reverse the multimeter leads at TP1 and TP2. You'll next view negative DC voltages with the oscilloscope."], "jumps": ["P14290", "P14270"]}, {"id": "P2230", "text": ["13.  Slowly rotate R1 until the green LED becomes extinguished          and the voltage on CH2 increases to approximately 7V, then          stop.", "13. Slowly rotate R1 until the green LED becomes extinguished and the voltage on CH2 increases to approximately 7V, then stop."], "jumps": ["P2240", "P2220"]}, {"id": "P2262", "text": ["The green LED will not illuminate because the trigger voltage is too low to forward bias the Triac.  The trigger voltage must be increased to approximately 0.7V before the Triac will conduct.", "The green LED will not illuminate because the trigger voltage is too low to forward bias the Triac. The trigger voltage must be increased to approximately 0.7V before the Triac will conduct.................."], "jumps": []}, {"id": "P14262", "text": ["The green LED will not illuminate because the trigger voltage is too low to forward bias the Triac.  The trigger voltage must be increased to approximately 0.7V before the Triac will conduct.", "The green LED will not illuminate because the trigger voltage is too low to forward bias the Triac. The trigger voltage must be increased to approximately 0.7V before the Triac will conduct."], "jumps": []}, {"id": "P2250", "text": ["The Triac doesn't have the correct bias to operate, so it shuts off. Now the Triac has a very high resistance and there is not enough current flow to illuminate the LED.", "The Triac doesn't have the correct bias to operate, so it shuts off. Now the Triac has a very high resistance and there is not enough current flow to illuminate the LED................"], "jumps": ["P2260", "P2240"]}, {"id": "P2260", "text": ["14.  Adjust R1 fully CW, does the green LED illuminate?", "14. Adjust R1 fully CW, does the green LED illuminate?...."], "jumps": ["P2240"]}, {"id": "P2261", "text": [], "jumps": []}, {"id": "P2262", "text": ["The green LED will not illuminate because we removed the trigger input.  The trigger voltage must be increased to approximately 0.7V before the Triac will conduct from T1 to T2.", "The green LED will not illuminate because we removed the trigger input. The trigger voltage must be increased to approximately 0.7V before the Triac will conduct from T1 to T2."], "jumps": []}, {"id": "P2270", "text": ["As you can see, since our trigger level is below the trigger voltage needed to latch the Triac, the green LED remains off.  Let's now apply negative DC voltage to the Triac and observe the effects.", "As you can see, since our trigger level is below the trigger voltage needed to latch the Triac, the green LED remains off. Let's now apply negative DC voltage to the Triac and observe the effects..."], "jumps": ["P2280", "P2260"]}, {"id": "P2280", "text": ["15.  Set S2 to -DC and adjust your oscilloscope signal positions            so the negative DC voltage can be viewed.", "15. Set S2 to -DC and adjust your oscilloscope signal positions so the negative DC voltage can be viewed."], "jumps": ["P2290", "P2270"]}, {"id": "P2290", "text": ["16. Turn R2 CW until the red LED illuminates, then stop. Set the CH1 and CH2 Volt/Div controls to .5 V. A Triac is two SCRs connected in reverse with the gates connected. When the gate voltage reached a -0.7V the second SCR latched allowing current to flow in the opposite direction, illuminating the red LED. .............s", "'}:5 t0H( 9E}A9As5/GA}A;aEAA}EAKE;AAaAE;A}AEAU;aA};aEAEA;EAAAEA;E;AaA", "EUaa 555G7EEEa::Ts1TA;;AA;EEA;AAa9:AAE;E;;;UaAA;AEEA;aA};AA9aAA}}};E;AA9E}9AA;}AAEaaA;AEAEaAAEEaAAA9EEAAA}EAE;aEEEAU;EE;Ea;}", "EK,,L17 let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
