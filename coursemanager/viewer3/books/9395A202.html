gs of a tree. These layers cause the light path to bend in a sinusoidal pattern instead of being sharply reflected."], "jumps": ["P1230", "P1170"]}, {"id": "P1230", "text": ["Multimode graded index optical fibers are easy to work with and have good information carrying capacity.  They have approximately the same diameter as step index optical fibers, but their bandwidth varies with distance along the fiber.", "Multimode graded index optical fibers are easy to work with and have good information carrying capacity. They have approximately the same diameter as step index optical fibers, but their bandwidth varies with distance along the fiber."], "jumps": ["P1240", "P1170"]}, {"id": "P2137", "text": ["The primary difference between LEDs and other diodes is that other diodes are made using substrates of either pure silicon or pure germanium, while LEDs are made from compounds.", "The primary difference between LEDs and other diodes is that other diodes are made using substrates of either pure silicon or pure germanium, while LEDs are made from compounds.e of the diode and is focused through the lens."], "jumps": ["P2138", "P2135"]}, {"id": "P3400", "text": ["The last type of optical detector that we are going to test is the phototransistor.  Remember, a phototransistor changes its collector current according to the intensity of the light applied.", "The last type of optical detector that we are going to test is the phototransistor. Remember, a phototransistor changes its collector current according to the intensity of the light applied."], "jumps": ["P3410", "P3370"]}, {"id": "P3440", "text": ["5.  Set S1 to the IN (right) position. \n6.  Using the multimeter to measure voltage, connect the positive      probe to TP11 and the negative probe to Ground TP.", "5. Set S1 to the IN (right) position. 6. Using the multimeter to measure voltage, connect the positive probe to TP11 and the negative probe to Ground TP."], "jumps": ["P3450", "P3430", "P3445"]}, {"id": "P3450", "tex xt for the distractor.", "erial for the PN junction in order to help confine and direct light better?", "Which of the following uses a different type of material on at least one side of the pn junction in order to help confine and direct light better?", "uce the additional amplification circuits required?", "Photoconductive Cell , and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "Which component should you choose in order to reduce the additional amplification circuits required?"], "jumps": []}, {"id": "P10223", "text": ["Photoconductive Cell and it is 10 point arial. This is the second line of text for the distractor. This is the third line of text for the distractor. This is the fourth line of text for the distractor.", "Which component should you choose for the fastest response time and narrowest bandwidth at 300 nm? 300 nm?"], "jumps": []}, {"id": "P10225", "text": ["Which of the following statements is false?", "Dark current is a term used for the current produced by a photodiode when it is in the dark.", "The responsivity and efficiency of a PIN photodiode is not as high as an APD.", "LEDs are usually more reliable than lasers.", "A homojunction LED can provide a very confined and directed light beam."], "jumps": []}, {"id": "P10230", "text": ["Which of the following components is least likely to be used in fiber optics?"], "jumps": []}, {"id": "P10220", "text": ["Your data book says that a certain LED's peak is 650 nm. What characteristic is this?", "Numerical aperture for the optical source. rce.", "Wavelength for the optical source. rce. E", "Responsivity for the optical detector. k"], "jumps": []}, {"id": "P10219", "text": ["n optical source capable of projecting a controlled narrow beam of light?", "Which numerical aperture rating requires an optical source capable of projecting a controlled, narrow beam of light?"], "jumps ext": ["What is the characteristic of an optical fiber that determines how well the integrity the transmitted signal is maintained?"], "jumps": []}, {"id": "P1100", "text": ["Scattering is caused by fluctuations in the optical fiber composition.  The ideal optical fiber would have a uniform density throughout its length, but this is not possible.  Pockets of material with density variations exist in any optical fiber as a result.", "Scattering is caused by fluctuations in the optical fiber composition. The ideal optical fiber would have a uniform density throughout its length, but this is not possible. Pockets of material with density variations exist in any optical fiber as a result.", "Density or compositional variation in the fiber"], "jumps": ["P1110", "P1070"]}, {"id": "P440", "text": ["A more detailed understanding of optical fibers, optical sources, and optical detectors is required in order to properly design, construct, and maintain fiber optic systems."], "jumps": ["P450", "P400"]}, {"id": "P13070", "text": ["Lamps are not normally used in fiber optic applications due to their limited life spans and slow operating speeds. However, lamps do possess some interesting characteristics that LEDs lack, and that could be useful in some applications."], "jumps": ["P13080", "P13040"]}, {"id": "P13050", "text": ["We will be using five different types of optical sources for this experiment. Four of the five optical sources are Light Emitting Diodes (LEDs) and the other one is a tungsten lamp. In the first half of the experiment, we will be concerned with the wavelengths of these optical sources.rces.urces.. experiment."], "jumps": ["P13060", "P13040"]}, {"id": "P10004", "text": ["As you can see, there are many important characteristics to examine in the different components of a fiber optic system. Without understanding their importance and effect on a system, system design would be time consuming and difficult.", "You have already attempted the quiz the maximum number of times! Contact your instructor.", "Violet 400 nm Green 550 nm Red 700 nm Infrared 850 nmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm"], "jumps": ["P3750", "P3710"]}, {"id": "P3720", "text": ["As we decreased the amplitude of the input signal, the intensity of the light decreased.  This caused the photodiode to produce less current, reducing the voltage output of the detector.", "As we decreased the amplitude of the input signal, the intensity of the light decreased. This caused the photodiode to produce less current, reducing the voltage output of the detector."], "jumps": ["P3730", "P3710"]}, {"id": "P13280", "text": ["The next optical detector that we are going to examine is the photodiode.  Remember, a photodiode's current flow changes with the intensity of the light applied.", "The next optical detector that we are going to examine is the photodiode. Remember, a photodiode's current flow changes with the intensity of the light applied."], "jumps": ["P13290", "P13260"]}, {"id": "P13625", "text": ["DIODE LIMITATIONS - Because an LED clips the signal when reverse biased, the input signal must be offset so that the diode always sees a positive voltage. This ensures that the entire signal is \"sent\" by the diode. To do this, our circuit applies a forward bias of +15 VDC to the diode.", "Since the input signal opposes the bias voltage, the output signal is inverted."], "jumps": []}, {"id": "P101", "text": ["w Compare the operation of different optical sources to different optical detectors. w Experimentally demonstrate certain limiting characteristics of some fiber optic components."], "jumps": []}, {"id": "P10002", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Pre-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Pre"]}, {"id": "P10003", "text": ["You have already attempted the quiz the maximum number of times! Contact your instructor.", "T = setupQuizEx(\"Post-Test\", 3, \"P10301\", \"P10302\", \"P10303\")"], "jumps": ["Post"]}, {"id": "P13190", "text": ["1.  Ensure that S7 is set to TEST and set S8 to the P.Volt position. 2.  With the multimeter set to measure high resistance, connect          the probes to TP8 and the Ground TP.  This connection will            be used during the testing of the photocell.", "1. Ensure that S7 is set to TEST and set S8 to the P.Volt position. 2. With the multimeter set to measure high resistance, connect the probes to TP8 and the Ground TP. This connection will be used during the testing of the photocell."], "jumps": ["P13200", "P13170", "P13195"]}, {"id": "P13150", "text": ["5.  Set PC130-251 as follows: \n     S1 to S5  - OUT (left) \n     S6  - FIXED \n     S7 and S8 - LEFT  \n     S9  - OPERATE", "5. Set PC130-251 as follows: S1 to S5 - OUT (left) S6 - FIXED S7 and S8 - LEFT S9 - OPERATE"], "jumps": ["P13160", "P13155"]}, {"id": "P13200", "text": ["With S7 in the TEST position, we have isolated the photocell from the circuit.  The multimeter connected to TP8 and Ground TP will measure the resistance across the photocell.", "With S7 in the TEST position, we have isolated the photocell from the circuit. The multimeter connected to TP8 and Ground TP will measure the resistance across the photocell."], "jumps": ["P13210", "P13190"]}, {"id": "P3690", "text": ["1.  Set the function generator to a 100 Hz sine wave at 18 Vpp              (max). \n2.  Adjust the oscilloscope until two identical waves are\n     obtained as shown.", "1. Set the function generator to a 100 Hz sine wave at 18 Vpp (max). 2. Adjust the oscilloscope until two identical waves are obtained as shown."], "jumps": ["P3700", "P3680", "P3695"]}, {"id": "P3750", "text": ["1.  Return the Test Console to the initial control settings.", "1. Return the Test Console to the initial control settings................"], "jumps": ["P3740"]}, {"id": "P13080", "text": ["We will be using three different types of fiber optic detectors in this experiment. They are the photocell, photodiode, and phototransistor. In the second half of the experiment we will be concerned with the bandwidth and responsivity of these detectors."], "jumps": ["P13090", "P13040"]}, {"id": "P13110", "text": ["1.  Set  the Test Console controls to the initial control settings.", "1. Set the Test Console controls to the initial control settings........."], "jumps": ["P13040"]}, {"id": "P3695", "text": ["FUNCTION GENERATOR SETUP \nFunction - SINE Wave\nRange - 100 Hz", "FUNCTION GENERATOR SETUP Function - SINE Wave Range - 100 Hz"], "jumps": []}, {"id": "P13090", "text": ["ruction. We will isolate and test just one of the photodiodes.", "The photovoltaic cell is not relevant to a study of fiber optics, so it isn't necessary to test it in this experiment. Instead, we'll concentrate on the other components.heir associated circuit construction. We will isolate and test just one of the photodiodes."], "jumps": ["P13062"]}, {"id": "P3680", "text": ["Finally, let's take a look at responsivity.  Recall that responsivity compares the change in the detector's current to the change in     incident light power.", "Finally, let's take a look at responsivity. Recall that responsivity compares the change in the detector's current to the change in incident light power."], "jumps": ["P3690", "P3670"]}, {"id": "P3730", "text": ["Responsivity is actually the ratio of the change in the detector's current to the change in light intensity.  While a change in current is measured easily, measuring a change in light intensity requires specialized equipment.  Responsivity values are normally provided by the manufacturer.", "Responsivity is actually the ratio of the change in the detector's current to the change in light intensity. While a change in current is measured easily, measuring a change in light intensity requires specialized equipment. Responsivity values are normally provided by the manufacturer."], "jumps": ["P3740", "P3710"]}, {"id": "P13060", "text": ["We will be co nal's integrity."], "jumps": ["P1080", "P1040"]}, {"id": "P1132", "text": ["Recall that one of the factors for total internal reflection is the angle of incidence.  The angle of incidence may change when light strikes one of these imperfections, resulting in signal loss.", "Recall that one of the factors for total internal reflection is the angle of incidence. The angle of incidence may change when light strikes one of these imperfections, resulting in signal loss.", "Light can be absorbed in jacket if angle of incidence is too small."], "jumps": ["P1140", "P1070"]}, {"id": "P1170", "text": ["Fiber optic cables may be classified according to the path that light takes in moving through the optical fiber. This light path is commonly called a mode. The two types of optical fibers are single mode and multimode."], "jumps": ["P1180", "P1150"]}, {"id": "P1200", "text": ["Multimode step index optical fibers allow several different paths for light to travel through them simultaneously.  They have core    diameters of about 50 - 100 mm, accept light very well, are          inexpensive, and are easy to use.", "Multimode step index optical fibers allow several different paths for light to travel through them simultaneously. They have core diameters of about 50 - 100 mm, accept light very well, are inexpensive, and are easy to use."], "jumps": ["P1210", "P1170"]}, {"id": "P1210", "text": ["Multimode step index optical fibers do have limitations.  They have limited bandwidth and are not desirable for high speed, long distance communications.", "Multimode step index optical fibers do have limitations. They have limited bandwidth and are not desirable for high speed, long distance communications."], "jumps": ["P1220", "P1170"]}, {"id": "P1143", "text": ["Impurities in the fiber optic material cause signal loss by absorption.   This process is not called Rayleigh Scattering.", "Impurities in the fiber optic material cause signal loss by absorption. This process is not called Rayleigh Scattering.."], "jumps": []}, {"id": "P1180", "text": ["A single mode optical fiber allows only one mode of light.  Single mode optical fibers have excellent bandwidth, incur very low losses, and are relatively inexpensive.", "A single mode optical fiber allows only one mode of light. Single mode optical fibers have excellent bandwidth, incur very low losses, and are relatively inexpensive."], "jumps": ["P1190", "P1170"]}, {"id": "P1190", "text": ["However, the size of a single mode optical fiber is only about one tenth the diameter of a human hair.  The thin size makes them difficult to handle and they have limited applications.", "However, the size of a single mode optical fiber is only about one tenth the diameter of a human hair. The thin size makes them difficult to handle and they have limited applications."], "jumps": ["P1200", "P1170"]}, {"id": "P2050", "text": ["Different types of optical sources and detectors are available. Let's take a closer look at optical sources."], "jumps": ["P2060", "P2040"]}, {"id": "P1130", "text": ["Recall that one of the factors for total internal reflection is the angle of incidence.  The angle of incidence may change when light strikes one of these imperfections, resulting in signal loss.", "Recall that one of the factors for total internal reflection is the angle of incidence. The angle of incidence may change when light strikes one of these imperfections, resulting in signal loss.", "Light is absorbed in the jacket if the angle of incidence is too small."], "jumps": ["P1140", "P1120"]}, {"id": "P1141", "text": [], "jumps": []}, {"id": "P2110", "text": ["The strength of the light beam is identified by the source's output power.  Output power measurements range from milliwatts to kilowatts, depending on the source.  Most sources operate at a single power rating, but some can be adjusted over a small range of values.", "The strength of the light beam is identified by the source's output power. Output power measurements range let i = 0;
const stage = document.getElementById("stage");
document.getElementById("title").textContent = book.title;
function show(n) {
  i = Math.max(0, Math.min(book.pages.length - 1, n));
  const page = book.pages[i];
  document.getElementById("count").textContent = (i + 1) + " / " + book.pages.length;
  document.getElementById("pid").textContent = page.id;
  stage.replaceChildren();
  if (!page.text.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "This page has no lesson text in the book.";
    stage.appendChild(p);
  }
  for (const line of page.text) {
    const p = document.createElement("p");
    p.textContent = line;
    stage.appendChild(p);
  }
  if (page.jumps.length) {
    const box = document.createElement("div");
    box.className = "jumps";
    for (const id of page.jumps) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => go(id));
      box.appendChild(b);
    }
    stage.appendChild(box);
  }
}
function go(id) {
  const n = book.pages.findIndex(p => p.id === id);
  if (n >= 0) show(n);
}
document.getElementById("next").addEventListener("click", () => show(i + 1));
document.getElementById("back").addEventListener("click", () => show(i - 1));
show(0);
</script>
