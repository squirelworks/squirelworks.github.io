<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ToolBook reader</title>
<style>
  :root { --ink:#1c1a17; --bar:#1e3a5f; --paper:#f7f4ee; --stage:#fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 Georgia, serif; color: var(--ink); background: var(--paper); }
  header { background: var(--bar); color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; font-family: sans-serif; }
  header strong { letter-spacing: .06em; font-size: 13px; }
  header input, header select, header button { font: 13px sans-serif; }
  header select { max-width: 280px; }
  #bar { margin-left: auto; font-size: 13px; }
  #layout { display: flex; min-height: calc(100vh - 46px); }
  aside { width: 220px; background: #efeae2; border-right: 1px solid #ddd; overflow: auto; font-family: sans-serif; font-size: 12px; }
  aside button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 12px; cursor: pointer; }
  aside button.on { background: #1e3a5f; color: #fff; }
  main { flex: 1; display: flex; flex-direction: column; }
  #stage { flex: 1; max-width: 820px; margin: 20px auto; background: var(--stage); padding: 28px 36px 48px; box-shadow: 0 1px 4px #0002; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .meta { font-family: sans-serif; font-size: 12px; color: #777; margin-bottom: 16px; }
  p { margin: 12px 0; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .nav button { font: 14px sans-serif; padding: 8px 14px; background: var(--bar); color: #fff; border: 0; cursor: pointer; }
  .nav button.ghost { background: #ece7df; color: var(--ink); }
  .warn { font-family: sans-serif; font-size: 13px; color: #666; }
</style>
</head>
<body>
<header>
  <strong>TOOLBOOK</strong>
  <input id="file" type="file" accept=".tbk,.TBK">
  <select id="jump"></select>
  <span id="bar">no book</span>
</header>
<div id="layout">
  <aside id="list"></aside>
  <main>
    <div id="stage">
      <h1>Load a .tbk</h1>
      <p class="warn">Reads page objects, field text, and buttonClick targets. Widget rectangles and pictures are not placed yet.</p>
    </div>
  </main>
</div>
<script>
const MARK = [0x80, 0x65, 0x00, 0x05, 0x00, 0x02, 0x02];
let pages = [];
let byId = new Map();
let cur = 0;
let stack = [];

document.getElementById('file').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const buf = new Uint8Array(await file.arrayBuffer());
  pages = parseBook(buf);
  byId = new Map(pages.map((p, i) => [p.id, i]));
  stack = [];
  const start = byId.has('P0') ? byId.get('P0') : 0;
  fillList();
  show(start);
});

document.getElementById('jump').addEventListener('change', (ev) => {
  const i = byId.get(ev.target.value);
  if (i != null) show(i);
});

function parseBook(data) {
  const hits = [];
  for (let i = 0; i + MARK.length <= data.length; i++) {
    let ok = true;
    for (let k = 0; k < MARK.length; k++) if (data[i + k] !== MARK[k]) { ok = false; break; }
    if (ok) hits.push(i);
  }
  return hits.map((off, n) => {
    const next = n + 1 < hits.length ? hits[n + 1] : data.length;
    const id = cstr(data, off + 11, 32) || ('obj' + n);
    const prop = data.subarray(off + 43, next);
    return { id, off, text: fieldText(prop), targets: clickTargets(prop), next: hasWord(prop, 'Next'), back: hasWord(prop, 'Back') };
  }).filter(p => p.id.startsWith('P'));
}

function cstr(data, off, n) {
  let s = '';
  for (let i = 0; i < n && off + i < data.length; i++) {
    const c = data[off + i];
    if (c === 0) break;
    if (c < 32 || c > 126) break;
    s += String.fromCharCode(c);
  }
  return s;
}

function fieldText(prop) {
  const out = [];
  const seen = new Set();
  for (let i = 0; i + 18 < prop.length; i++) {
    if (prop[i] !== 0x54 || prop[i+1] !== 0x65 || prop[i+2] !== 0x78 || prop[i+3] !== 0x74) continue;
    if (prop[i+4] !== 0 || prop[i+5] !== 0) continue;
    const len = prop[i+14] | (prop[i+15] << 8);
    if (len < 8 || i + 16 + len > prop.length) continue;
    const raw = prop.subarray(i + 16, i + 16 + len);
    if (raw[0] !== 0x0d && raw[0] !== 0x0a && raw[0] < 32) continue;
    let s = '';
    for (const c of raw) {
      if (c === 0x0d) continue;
      if (c === 0x0a) { s += '\n'; continue; }
      if (c >= 32 && c < 127) s += String.fromCharCode(c);
    }
    s = s.replace(/\n{3,}/g, '\n\n').trim();
    if (s.length < 8 || seen.has(s)) continue;
    if (/^(ASYM|true|false|Next|Back)$/.test(s)) continue;
    seen.add(s);
    out.push(s);
  }
  return out;
}

function clickTargets(prop) {
  const out = [];
  const seen = new Set();
  const s = Array.from(prop, c => (c >= 32 && c < 127) ? String.fromCharCode(c) : ' ').join('');
  const re = /\("?(P[A-Z0-9]+)"?\)/gi;
  let m;
  while ((m = re.exec(s))) {
    const id = m[1].toUpperCase();
    if (!seen.has(id)) { seen.add(id); out.push(id); }
  }
  return out;
}

function hasWord(prop, word) {
  const bytes = Array.from(word).map(c => c.charCodeAt(0));
  for (let i = 0; i + bytes.length < prop.length; i++) {
    let ok = true;
    for (let k = 0; k < bytes.length; k++) if (prop[i+k] !== bytes[k]) { ok = false; break; }
    if (!ok) continue;
    const before = i === 0 ? 0 : prop[i-1];
    const after = prop[i + bytes.length];
    if ((before < 65 || before > 90) && (after === 0 || after < 65)) return true;
  }
  return false;
}

function fillList() {
  const list = document.getElementById('list');
  const jump = document.getElementById('jump');
  list.innerHTML = '';
  jump.innerHTML = '';
  pages.forEach((p, i) => {
    const b = document.createElement('button');
    b.textContent = p.id + (p.text.length ? '' : ' ·');
    b.dataset.i = i;
    b.onclick = () => show(i);
    list.appendChild(b);
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.id;
    jump.appendChild(o);
  });
}

function show(i) {
  if (i < 0 || i >= pages.length) return;
  if (cur !== i) stack.push(cur);
  cur = i;
  const page = pages[i];
  document.getElementById('bar').textContent = (i + 1) + ' / ' + pages.length + '  ·  ' + page.id;
  document.getElementById('jump').value = page.id;
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  const stage = document.getElementById('stage');
  const paras = page.text.length
    ? page.text.map(t => '<p>' + escape(t).replace(/\n/g, '<br>') + '</p>').join('')
    : '<p class="warn">No field text on this page.</p>';
  const buttons = navButtons(page);
  stage.innerHTML = '<h1>' + escape(page.id) + '</h1><p class="meta">file ' + page.off +
    ' · ' + page.text.length + ' fields · ' + page.targets.length + ' jumps</p>' + paras +
    '<div class="nav">' + buttons + '</div>';
  stage.querySelectorAll('button[data-to]').forEach(b => b.onclick = () => go(b.dataset.to));
  const back = stage.querySelector('button[data-back]');
  if (back) back.onclick = () => { if (stack.length) show(stack.pop()); };
}

function navButtons(page) {
  const parts = [];
  const targets = page.targets.filter(id => byId.has(id));
  if (page.next && page.back && targets.length >= 2) {
    parts.push('<button data-to="' + targets[0] + '">Next</button>');
    parts.push('<button class="ghost" data-to="' + targets[1] + '">Back</button>');
    targets.slice(2).forEach(id => parts.push('<button class="ghost" data-to="' + id + '">' + id + '</button>'));
  } else {
    targets.forEach(id => parts.push('<button data-to="' + id + '">' + id + '</button>'));
  }
  parts.push('<button class="ghost" data-back="1">Last</button>');
  return parts.join('');
}

function go(id) {
  const i = byId.get(id);
  if (i == null) return;
  show(i);
}

function escape(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c]));
}
</script>
</body>
</html>
