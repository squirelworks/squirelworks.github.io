<!doctype html>
<html lang="en">

<title>ATT Master</title>
<style>
  html, body { margin: 0; height: 100%; background: #d4d0c8; color: #000;
    font: 16px/1.4 Tahoma, "MS Sans Serif", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .window { width: 960px; background: #d4d0c8; border: 2px solid;
    border-color: #fff #404040 #404040 #fff; box-shadow: 1px 1px 0 #000; }
  .title { background: #000080; color: #fff; padding: 3px 6px; font-weight: bold;
    display: flex; justify-content: space-between; align-items: center; }
  #booktitle { flex: 1; color: #fff; }
  .title button, button { font: 14px Tahoma, sans-serif; background: #d4d0c8;
    border: 2px solid; border-color: #fff #404040 #404040 #fff; padding: 2px 10px; }
  button:active { border-color: #404040 #fff #fff #404040; }
  .modules { display: flex; gap: 8px; padding: 8px; }
  .mod { flex: 1; min-width: 0; }
  .mod h2 { margin: 0 0 4px; font: bold 14px Tahoma, sans-serif; }
  .list { height: 280px; overflow-y: scroll; background: #fff;
    border: 2px solid; border-color: #808080 #fff #fff #808080; }
  .list button { display: block; width: 100%; text-align: left; border: 0;
    background: #fff; padding: 3px 6px; font: 14px Tahoma, sans-serif; }
  .list button.on { background: #000080; color: #fff; }
  .bar { display: flex; gap: 8px; padding: 0 8px 8px; }
  .stage { position: relative; height: 420px; margin: 4px; background: #fff;
    border: 2px solid; border-color: #808080 #fff #fff #808080; overflow: hidden; }
  .stage p { margin: 12px 16px; }
  .finish-title { margin: 8px 16px 16px; font-size: 22px; font-weight: bold; }
  .stage img { position: absolute; image-rendering: pixelated; }
  .choices, .jumps, form.answer { position: absolute; left: 16px; bottom: 12px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  form.answer input { font: 14px Tahoma, sans-serif; border: 2px solid;
    border-color: #808080 #fff #fff #808080; padding: 2px 4px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-top: 2px solid; border-color: #fff #808080 #808080 #fff; }
  .status .caption { flex: 1; padding: 1px 6px; border: 1px solid;
    border-color: #808080 #fff #fff #808080; }
  .status .count { min-width: 72px; text-align: center; border: 1px solid;
    border-color: #808080 #fff #fff #808080; }
  dialog { border: 2px solid; border-color: #fff #404040 #404040 #fff; background: #d4d0c8;
    font: 14px Tahoma, sans-serif; }
  dialog menu { display: flex; gap: 8px; justify-content: flex-end; padding: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="window">
  <div class="title"><span id="booktitle">ATT Master</span><button id="exit" type="button">Exit</button></div>
  <div id="catalog">
    <div class="modules">
      <section class="mod">
        <h2>Main Course List</h2>
        <div class="list" id="mains"></div>
      </section>
      <section class="mod">
        <h2>Modules</h2>
        <div class="list" id="subs"></div>
      </section>
      <section class="mod">
        <h2>Course List</h2>
        <div class="list" id="courses"></div>
      </section>
    </div>
    <div class="bar"><button id="open" type="button" disabled>Open</button></div>
  </div>
  <div id="lesson" class="hidden">
    <div class="stage" id="stage"></div>
    <div class="status">
      <span class="caption" id="caption">Ready</span>
      <button id="back" type="button">Back</button>
      <span class="count" id="count">0 / 0</span>
      <button id="next" type="button">Next</button>
      <button id="coursesbtn" type="button">Courses</button>
    </div>
  </div>
</div>
<dialog id="ask">
  <p id="asktext"></p>
  <menu>
    <button value="yes" type="button">Yes</button>
    <button value="no" type="button">No</button>
  </menu>
</dialog>

ge id=\"Q1bad\" n=\"4\">\n    <p>Not that one.</p>\n    <go id=\"back\" to=\"Q1\" label=\"Return\"/>\n  </page>\n  <page id=\"PDONE\" n=\"5\" kind=\"finish\">\n    <p>Congratulations on finishing:</p>\n    <booktitle/>\n    <go id=\"menu\" to=\"PINFO\" label=\"Lesson menu\"/>\n  </page>\n</book>\n", "9E954D03.xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<book id=\"9E954D03\" title=\"Troubleshooting Digital Systems\">\n  <page id=\"PINFO\" n=\"1\" kind=\"menu\">\n    <p>Troubleshooting Digital Systems. Begin opens the lesson. The blue bar is this book title.</p>\n    <go id=\"start\" to=\"P400\" label=\"Begin\"/>\n  </page>\n  <page id=\"P400\" n=\"2\">\n    <p>Lesson page for Troubleshooting Digital Systems. Next enters the question.</p>\n    <go id=\"next\" to=\"Q1\"/>\n    <go id=\"back\" to=\"PINFO\"/>\n  </page>\n  <page id=\"Q1\" n=\"3\" kind=\"quiz\">\n    <p>Sample check for Troubleshooting Digital Systems. Choose the matching answer.</p>\n    <quiz type=\"choice\">\n      <choice to=\"PDONE\" correct=\"yes\">Troubleshooting Digital Systems</choice>\n      <choice to=\"Q1bad\">A different lesson</choice>\n    </quiz>\n    <go id=\"back\" to=\"P400\"/>\n  </page>\n  <page id=\"Q1bad\" n=\"4\">\n    <p>Not that one.</p>\n    <go id=\"back\" to=\"Q1\" label=\"Return\"/>\n  </page>\n  <page id=\"PDONE\" n=\"5\" kind=\"finish\">\n    <p>Congratulations on finishing:</p>\n    <booktitle/>\n    <go id=\"menu\" to=\"PINFO\" label=\"Lesson menu\"/>\n  </page>\n</book>\n", "9e954d01.xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<book id=\"9e954d01\" title=\"Logic Families\">\n  <page id=\"PINFO\" n=\"1\" kind=\"menu\">\n    <p>Logic Families. Begin opens the lesson. The blue bar is this book title.</p>\n    <go id=\"start\" to=\"P400\" label=\"Begin\"/>\n  </page>\n  <page id=\"P400\" n=\"2\">\n    <p>Lesson page for Logic Families. Next enters the question.</p>\n    <go id=\"next\" to=\"Q1\"/>\n    <go id=\"back\" to=\"PINFO\"/>\n  </page>\n  <page id=\"Q1\" n=\"3\" kind=\"quiz\">\n    <p>Sample check for Logic Families. Choose the matching answer.</p>\n    <quiz type=\"choice\">\n      <choice to=\"PDONE\" correct=\"yes\">Logic Families</choice>\n      <choice to=\"Q1bad\">A different lesson</choice>\n    </quiz>\n    <go id=\"back\" to=\"P400\"/>\n  </page>\n  <page id=\"Q1bad\" n=\"4\">\n    <p>Not that one.</p>\n    <go id=\"back\" to=\"Q1\" label=\"Return\"/>\n  </page>\n  <page id=\"PDONE\" n=\"5\" kind=\"finish\">\n    <p>Congratulations on finishing:</p>\n    <booktitle/>\n    <go id=\"menu\" to=\"PINFO\" label=\"Lesson menu\"/>\n  </page>\n</book>\n", "sample01.xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<book id=\"sample01\" title=\"Sample Lesson\">\n  <page id=\"PINFO\" n=\"1\" kind=\"menu\">\n    <p>Sample Lesson. Begin opens the lesson. The blue bar is this book title.</p>\n    <go id=\"start\" to=\"P400\" label=\"Begin\"/>\n  </page>\n  <page id=\"P400\" n=\"2\">\n    <p>Lesson page for Sample Lesson. Next enters the question.</p>\n    <go id=\"next\" to=\"Q1\"/>\n    <go id=\"back\" to=\"PINFO\"/>\n  </page>\n  <page id=\"Q1\" n=\"3\" kind=\"quiz\">\n    <p>Sample check for Sample Lesson. Choose the matching answer.</p>\n    <quiz type=\"choice\">\n      <choice to=\"PDONE\" correct=\"yes\">Sample Lesson</choice>\n      <choice to=\"Q1bad\">A different lesson</choice>\n    </quiz>\n    <go id=\"back\" to=\"P400\"/>\n  </page>\n  <page id=\"Q1bad\" n=\"4\">\n    <p>Not that one.</p>\n    <go id=\"back\" to=\"Q1\" label=\"Return\"/>\n  </page>\n  <page id=\"PDONE\" n=\"5\" kind=\"finish\">\n    <p>Congratulations on finishing:</p>\n    <booktitle/>\n    <go id=\"menu\" to=\"PINFO\" label=\"Lesson menu\"/>\n  </page>\n</book>\n"}</script>
<script>
const stage = document.getElementById("stage");
const ask = document.getElementById("ask");
let catalogUrl = new URL("course.xml", location.href);
let bookUrl = catalogUrl;
let pages = new Map();
let order = [];
let current = null;
let history = [];
let skipped = 0;
let answered = new Set();
let mains = [];
let mainId = null;
let subId = null;
let courseId = null;

function goEl(page, id) {
  return [...page.querySelectorAll("go")].find(g => g.getAttribute("id") === id);
}
function setTitle(text) {
  document.getElementById("booktitle").textContent = text || "";
  document.title = text || "";
}
function show(id, remember) {
  const page = pages.get(id);
  if (!page) return;
  if (remember && current) history.push(current);
  current = id;
  stage.replaceChildren();
  for (const p of page.querySelectorAll(":scope > p")) {
    const el = document.createElement("p");
    el.textContent = p.textContent;
    stage.append(el);
  }
  if (page.querySelector(":scope > booktitle")) {
    const el = document.createElement("p");
    el.className = "finish-title";
    el.textContent = document.getElementById("booktitle").textContent;
    stage.append(el);
  }
  for (const im of page.querySelectorAll(":scope > image")) {
    if (im.getAttribute("role") === "chrome") continue;
    const el = document.createElement("img");
    el.src = new URL(im.getAttribute("src"), bookUrl).href;
    el.alt = im.getAttribute("src").split("/").pop();
    const x = im.getAttribute("x"), y = im.getAttribute("y");
    if (x == null || y == null) el.style.position = "static";
    else { el.style.left = x + "px"; el.style.top = y + "px"; }
    if (im.getAttribute("w")) el.width = +im.getAttribute("w");
    if (im.getAttribute("h")) el.height = +im.getAttribute("h");
    stage.append(el);
  }
  const jumps = document.createElement("div");
  jumps.className = "jumps";
  for (const g of page.querySelectorAll(":scope > go")) {
    if (g.getAttribute("id") === "next" || g.getAttribute("id") === "back") continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = g.getAttribute("label") || g.getAttribute("id");
    b.addEventListener("click", () => follow(g));
    jumps.append(b);
  }
  if (jumps.childElementCount) stage.append(jumps);
  const quiz = page.querySelector(":scope > quiz");
  if (quiz) renderQuiz(page, quiz);
  else {
    const choices = document.createElement("div");
    choices.className = "choices";
    for (const c of page.querySelectorAll(":scope > choice")) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.textContent;
      b.addEventListener("click", () => show(c.getAttribute("to"), true));
      choices.append(b);
    }
    if (choices.childElementCount) stage.append(choices);
  }
  document.getElementById("count").textContent = (page.getAttribute("n") || "?") + " / " + order.length;
  document.getElementById("caption").textContent = page.getAttribute("id");
  document.getElementById("next").disabled = !goEl(page, "next");
  document.getElementById("back").disabled = !goEl(page, "back") && history.length === 0;
}
function grade(quiz, raw) {
  const type = quiz.getAttribute("type") || "text";
  const match = quiz.getAttribute("match") || "";
  if (type === "number") {
    const got = Number(raw), want = Number(match), tol = Number(quiz.getAttribute("tolerance") || "0");
    return raw.trim() !== "" && Number.isFinite(got) && Math.abs(got - want) <= tol;
  }
  const a = raw.trim().replace(/\s+/g, " "), b = match.trim().replace(/\s+/g, " ");
  return quiz.getAttribute("case") === "no" ? a.toLowerCase() === b.toLowerCase() : a === b;
}
function renderQuiz(page, quiz) {
  const type = quiz.getAttribute("type") || "choice";
  if (type === "choice") {
    const box = document.createElement("div");
    box.className = "choices";
    for (const c of quiz.querySelectorAll(":scope > choice")) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.textContent;
      b.addEventListener("click", () => { answered.add(page.getAttribute("id")); show(c.getAttribute("to"), true); });
      box.append(b);
    }
    stage.append(box);
    return;
  }
  const form = document.createElement("form");
  form.className = "answer";
  const input = document.createElement("input");
  input.type = type === "number" ? "number" : "text";
  input.step = "any";
  const check = document.createElement("button");
  check.type = "submit";
  check.textContent = "Check";
  form.append(input, check);
  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    answered.add(page.getAttribute("id"));
    show(quiz.getAttribute(grade(quiz, input.value) ? "ok" : "bad"), true);
  });
  stage.append(form);
  input.focus();
}
function follow(g) {
  if (!g) return;
  const to = g.getAttribute("to");
  if (to === "last") { const prev = history.pop(); if (prev) show(prev, false); return; }
  show(to, true);
}
function loadBook(xmlText, url) {
  bookUrl = url;
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) { stage.textContent = "Course XML did not parse."; return; }
  const book = doc.querySelector("book");
  setTitle(book.getAttribute("title") || "");
  pages = new Map();
  order = [];
  for (const page of book.querySelectorAll(":scope > page")) {
    pages.set(page.getAttribute("id"), page);
    order.push(page.getAttribute("id"));
  }
  history = []; skipped = 0; answered = new Set();
  document.getElementById("catalog").classList.add("hidden");
  document.getElementById("lesson").classList.remove("hidden");
  show(order[0], false);
}
function fill(list, items, selected, onpick) {
  list.replaceChildren();
  for (const item of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = item.title;
    if (item.id === selected) b.className = "on";
    b.addEventListener("click", () => onpick(item));
    b.addEventListener("dblclick", () => { onpick(item); if (list.id === "courses") document.getElementById("open").click(); });
    list.append(b);
  }
}
function showSubs() {
  const main = mains.find(m => m.id === mainId);
  subId = main && main.subs[0] ? main.subs[0].id : null;
  fill(document.getElementById("subs"), main ? main.subs : [], subId, pickSub);
  showCourses();
}
function showCourses() {
  const main = mains.find(m => m.id === mainId);
  const sub = main && main.subs.find(s => s.id === subId);
  courseId = null;
  document.getElementById("open").disabled = true;
  fill(document.getElementById("courses"), sub ? sub.courses : [], null, (course) => {
    courseId = course.id;
    document.getElementById("open").disabled = false;
    document.querySelectorAll("#courses button").forEach(b => b.classList.toggle("on", b.textContent === course.title));
  });
}
function pickSub(sub) {
  subId = sub.id;
  fill(document.getElementById("subs"), mains.find(m => m.id === mainId).subs, subId, pickSub);
  showCourses();
}
function pickMain(main) {
  mainId = main.id;
  fill(document.getElementById("mains"), mains, mainId, pickMain);
  showSubs();
}
function loadCatalog(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const catalog = doc.querySelector("catalog");
  setTitle(catalog.getAttribute("title") || "");
  mains = [...catalog.querySelectorAll(":scope > main")].map(main => ({
    id: main.getAttribute("id"),
    title: main.getAttribute("title"),
    subs: [...main.querySelectorAll(":scope > sub")].map(sub => ({
      id: sub.getAttribute("id"),
      title: sub.getAttribute("title"),
      courses: [...sub.querySelectorAll(":scope > course")].map(course => ({
        id: course.getAttribute("id"),
        title: course.getAttribute("title"),
        file: course.getAttribute("file")
      }))
    }))
  }));
  mainId = mains[0] && mains[0].id;
  fill(document.getElementById("mains"), mains, mainId, pickMain);
  showSubs();
}
document.getElementById("open").addEventListener("click", () => {
  const main = mains.find(m => m.id === mainId);
  const sub = main && main.subs.find(s => s.id === subId);
  const course = sub && sub.courses.find(c => c.id === courseId);
  if (!course) return;
  const url = new URL(course.file, catalogUrl);
  const embeddedBook = courseFiles[course.file.split("/").pop()];
  const finish = (t) => loadBook(t, url);
  fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(finish)
    .catch(() => {
      if (embeddedBook) finish(embeddedBook);
      else { stage.textContent = "Could not read " + course.file; document.getElementById("catalog").classList.add("hidden"); document.getElementById("lesson").classList.remove("hidden"); }
    });
});
document.getElementById("coursesbtn").addEventListener("click", () => {
  document.getElementById("lesson").classList.add("hidden");
  document.getElementById("catalog").classList.remove("hidden");
  setTitle(document.querySelector("catalog") ? "" : "ATT Master");
  const embedded = document.getElementById("course-xml");
  if (embedded) setTitle(new DOMParser().parseFromString(embedded.textContent, "application/xml").querySelector("catalog").getAttribute("title"));
});
document.getElementById("next").addEventListener("click", () => follow(goEl(pages.get(current), "next")));
document.getElementById("back").addEventListener("click", () => {
  const g = goEl(pages.get(current), "back");
  if (g) follow(g); else if (history.length) show(history.pop(), false);
});
document.getElementById("exit").addEventListener("click", () => {
  document.getElementById("asktext").textContent = "Are you sure you want to Exit the Lesson?";
  ask.showModal();
});
ask.addEventListener("click", (ev) => { if (ev.target.value) ask.close(); });

const courseFiles = JSON.parse(document.getElementById("course-files").textContent);
const embedded = document.getElementById("course-xml").textContent;
loadCatalog(embedded);
fetch(catalogUrl).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(loadCatalog).catch(() => {});
</script>
</body>
